  .btn.sel{ background:linear-gradient(180deg,#eaffd6,#a8ef6a 50%,#6fd230); color:#183c06; }
  .btn small{ display:block; font:500 11px inherit; opacity:.75; }
  .row{ display:flex; gap:9px; width:100%; }
  .row .btn{ margin-top:10px; }

  #tTag{ font:600 13px inherit; color:#e6faff; text-shadow:0 2px 12px rgba(0,120,180,.9); margin-bottom:6px; }

  #mBar i{ display:block; height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#8fe64a,#38d9f5); transition:width .3s; }

    background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1)); border:1.5px solid rgba(255,255,255,.55); backdrop-filter:blur(9px); }

    background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1)); border:1.5px solid rgba(255,255,255,.55); backdrop-filter:blur(9px); }

    box-shadow:0 8px 28px rgba(0,90,140,.45); }

      <div class="row">

        <button class="btn ghost" id="bSet"></button>
      </div>

  </div>

  <div id="hud" class="hide">
    <div class="pill" id="pCry">💎 <span>0</span></div>
    <div class="pill" id="pBub">🫧 <span>0</span></div>

    <div class="pill" id="pSk" style="display:none"></div>

    <div id="mini"><canvas width="208" height="208"></canvas></div>
    <div id="btnPause">❚❚</div><div id="btnLog">📋</div>
    <div id="toast"></div><div id="hint"></div><div id="prompt"></div>
    <div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <div class="tb" id="bJump">▲</div><div class="tb" id="bRun">》</div>
    </div>
  </div>
  <!-- MISIONES -->
  <div class="screen hide" id="sLog"><div class="glass card">
    <h1 class="big" style="font-size:clamp(20px,5vw,28px)" id="lgTitle"></h1>
    <div id="lgList"></div>
    <button class="btn" id="lgClose"></button>
  </div></div>
  <!-- PAUSA -->
  <div class="screen hide" id="sPause"><div class="glass card" style="max-width:min(88vw,360px)">
    <h1 class="big" style="font-size:clamp(20px,5vw,30px)" id="pTitle"></h1>
    <button class="btn" id="pResume"></button>
    <button class="btn ghost" id="pQual"></button>
    <button class="btn ghost" id="pMus"></button>
    <button class="btn ghost" id="pMenu"></button>
  </div></div>
  <!-- FINAL -->
  <div class="screen hide" id="sEnd"><div class="glass card">
    <h1 class="big" id="eTitle"></h1>
    <div class="sub" id="eBody" style="line-height:2"></div>
    <button class="btn" id="eCont"></button>
  </div></div>
  <div id="fade"></div>
</div>
</div>

function fit(obj,h){ const bb=new THREE.Box3().setFromObject(obj), sz=bb.getSize(new THREE.Vector3());
  const k=h/Math.max(sz.y,.001); obj.scale.setScalar(k);
  const bb2=new THREE.Box3().setFromObject(obj); obj.position.y-=bb2.min.y; return obj; }
// escala por ANCHO: el edificio generado es más ancho que alto, así que se ajusta por su huella
function fitW(obj,w){ const bb=new THREE.Box3().setFromObject(obj), sz=bb.getSize(new THREE.Vector3());
  const k=w/Math.max(sz.x,sz.z,.001); obj.scale.setScalar(k);
  const bb2=new THREE.Box3().setFromObject(obj); obj.position.y-=bb2.min.y;
  const s2=bb2.getSize(new THREE.Vector3()); return {hw:s2.x*.42,hd:s2.z*.42,h:s2.y}; }
function procTree(){ const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.26,.4,3,7),new THREE.MeshLambertMaterial({color:0x9a7b52}));
  tr.position.y=1.5; g.add(tr);
  const cm=new THREE.MeshLambertMaterial({color:0x5fc23a});
  for(const[y,r]of[[3.5,2.1],[4.7,1.6],[5.6,1.05]]){ const s=new THREE.Mesh(new THREE.SphereGeometry(r,9,7),cm);
    s.position.y=y; s.scale.y=.82; g.add(s); }
  return g; }

(function placeTrees(){ let n=0, i=0;

    const x=Math.cos(a)*r, z=Math.sin(a)*r; const y=terrainH(x,z);
    if(y<WATER_Y+.7)continue; if(Math.hypot(x-CITY.x,z-CITY.z)<CITY.r*.85)continue;

    TREE_SPOTS.push({x,y,z,s:.8+hash2(i,23)*.8}); n++; } })();

/* ---- GLOSSY: le sube el brillo y el reflejo a cualquier modelo generado ---- */
function glossify(root,amount){
  const k=(amount==null?1:amount);
  if(Q.phong){ // en ULD/BAJA el brillo va por Phong (mucho más barato que PBR)
    root.traverse(o=>{ if(o.isMesh&&o.material){
      const ms=Array.isArray(o.material)?o.material:[o.material];
      for(const m of ms){ if('roughness' in m)m.roughness=Math.max(.05,(m.roughness==null?1:m.roughness)*(1-.62*k)); } } });
    return cheapMats(root); }
  root.traverse(o=>{ if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    o.material=Array.isArray(o.material)?mats.map(m=>gloss1(m,k)):gloss1(mats[0],k); }); }
function gloss1(m,k){ if(!m||m.__glossed)return m;
  const c=m.clone(); c.__glossed=true;
  if('roughness' in c)c.roughness=Math.max(.05,Math.min(1,(c.roughness==null?1:c.roughness)*(1-.62*k)));
  if('metalness' in c)c.metalness=Math.max(c.metalness||0,.34*k);
  if('envMapIntensity' in c)c.envMapIntensity=1.25*k;
  c.needsUpdate=true; return c; }

const BT={ tower1:null,tower2:null,tower3:null,dome:null,mall:null,eco:null,

const GROUND_Y=0.30;   // el piso de la ciudad va POR ENCIMA del terreno
// coloca un modelo 3D de edificio: ANCHO y ALTO por separado, así un rascacielos
// puede ser ENORME de alto sin desbordar la manzana
function putBldg(tpl,x,z,h,rotY,wantW){
  const m=tpl.clone(true);
  const bb=new THREE.Box3().setFromObject(m), sz=bb.getSize(new THREE.Vector3());
  const foot=Math.max(sz.x,sz.z,.001);
  const sxz=(wantW||h*0.28)/foot, sy=h/Math.max(sz.y,.001);
  m.scale.set(sxz,sy,sxz);
  m.rotation.y=rotY||0;
  const bb2=new THREE.Box3().setFromObject(m), s2=bb2.getSize(new THREE.Vector3());
  m.position.set(x,GROUND_Y-bb2.min.y,z);
  if(Q.shadow>0)m.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  cityGroup.add(m);
  BOXES.push({x,z,hw:Math.max(s2.x*.42,1.5),hd:Math.max(s2.z*.42,1.5)});
  return {m,w:s2.x,d:s2.z,h:s2.y}; }
/* ---- props urbanos: TODOS son modelos 3D generados (con clon liviano) ---- */
function putProp(tpl,x,z,h,rotY,collide){
  if(!tpl)return null;
  const m=tpl.clone(true);
  const bb=new THREE.Box3().setFromObject(m), sz=bb.getSize(new THREE.Vector3());
  m.scale.setScalar(h/Math.max(sz.y,.001));
  m.rotation.y=rotY||0;
  const bb2=new THREE.Box3().setFromObject(m), s2=bb2.getSize(new THREE.Vector3());
  m.position.set(x,GROUND_Y-bb2.min.y,z);
  if(Q.shadow>0)m.traverse(o=>{ if(o.isMesh)o.castShadow=true; });
  cityGroup.add(m);
  if(collide)BOXES.push({x,z,hw:Math.max(s2.x*.45,.8),hd:Math.max(s2.z*.45,.8)});
  return m; }
function buildCity(){
  cityGroup.clear(); BOXES.length=0;
  const BLOCK=46, ROAD=12, NB=(Q.qual==='low'?2:3);    // manzana, avenida y radio de la grilla (7x7 manzanas)
  const L=BLOCK*(NB*2+1);
  // ---- suelo: PLAZA con textura generada ----
  const plaza=new THREE.Mesh(new THREE.PlaneGeometry(L,L),plazaMat);
  plaza.rotation.x=-Math.PI/2; plaza.position.set(CITY.x,GROUND_Y,CITY.z);
  plaza.receiveShadow=Q.shadow>0; cityGroup.add(plaza);
  // ---- avenidas con textura de asfalto generada, ENTRE las manzanas ----
  const dashes=[];
  for(let i=-NB-1;i<=NB;i++){ const c=(i+.5)*BLOCK;
    for(const horiz of [true,false]){
      const st=new THREE.Mesh(horiz?new THREE.PlaneGeometry(L,ROAD):new THREE.PlaneGeometry(ROAD,L),horiz?roadMat:roadMatV);
      st.rotation.x=-Math.PI/2;
      st.position.set(CITY.x+(horiz?0:c),GROUND_Y+.02,CITY.z+(horiz?c:0)); cityGroup.add(st);
      for(let k=-11;k<=11;k++)dashes.push([CITY.x+(horiz?k*10:c),CITY.z+(horiz?c:k*10),horiz]); } }
  // todas las líneas discontinuas en UN solo draw call
  { const dg=new THREE.PlaneGeometry(5,.4); dg.rotateX(-Math.PI/2);
    const dm=new THREE.MeshBasicMaterial({color:0xffffff});
    const inst=new THREE.InstancedMesh(dg,dm,dashes.length); inst.frustumCulled=false;
    const mm=new THREE.Matrix4(), qq=new THREE.Quaternion(), vv=new THREE.Vector3(), ss=new THREE.Vector3(1,1,1);
    const up=new THREE.Vector3(0,1,0);
    dashes.forEach(([x,z,horiz],i)=>{ qq.setFromAxisAngle(up,horiz?0:Math.PI/2);
      vv.set(x,GROUND_Y+.045,z); mm.compose(vv,qq,ss); inst.setMatrixAt(i,mm); });
    cityGroup.add(inst); }
  // ---- manzanas ----
  const towers=[BT.tower1,BT.tower2,BT.tower3,BT.spire].filter(Boolean);
  const lows=[BT.mall,BT.office,BT.apt,BT.dome].filter(Boolean);
  const cells=[];
  for(let gx=-NB;gx<=NB;gx++)for(let gz=-NB;gz<=NB;gz++){
    if(gx===0&&gz===0)continue;                       // el centro es la plaza de la fuente
    const x=CITY.x+gx*BLOCK, z=CITY.z+gz*BLOCK;
    cells.push({gx,gz,x,z,d:Math.hypot(gx,gz)}); }
  const IN=BLOCK-ROAD-2;
  cells.forEach((c,i)=>{
    const rot=Math.round(hash2(i,47)*4)*Math.PI/2, r=hash2(i,71);
    // vereda de la manzana (textura generada) + césped interior (textura de pasto)
    const walk=new THREE.Mesh(new THREE.PlaneGeometry(IN+3,IN+3),walkMat);
    walk.rotation.x=-Math.PI/2; walk.position.set(c.x,GROUND_Y+.012,c.z); cityGroup.add(walk);
    const lawn=new THREE.Mesh(new THREE.PlaneGeometry(IN-2.5,IN-2.5),lawnMat);
    lawn.rotation.x=-Math.PI/2; lawn.position.set(c.x,GROUND_Y+.03,c.z); cityGroup.add(lawn);
    // el skyline: RASCACIELOS enormes al centro, bajando hacia las orillas
    const central=c.d<1.7, mid=c.d<2.7;
    if(towers.length&&(central||(mid&&r<.7))){
      const tpl=towers[(hash2(i,73)*towers.length)|0];
      // alturas de rascacielos de verdad: 95-160 m en el centro, 55-95 m en el anillo medio
      const h=(central?95:55)+hash2(i,79)*(central?65:40);
      const w=(central?20:17)+hash2(i,81)*7;
      const b=putBldg(tpl,c.x,c.z,h,rot,w);
      if(lows.length&&Q.qual!=='low'&&hash2(i,83)<.4)
        putBldg(lows[(hash2(i,91)*lows.length)|0],c.x+(b.w*.5+11)*(hash2(i,89)<.5?1:-1),c.z+6,20,rot,24);
    } else if(lows.length){
      const tpl=lows[(hash2(i,97)*lows.length)|0];
      const h=(tpl===BT.apt?34:(tpl===BT.office?30:(tpl===BT.dome?18:22)))+hash2(i,101)*8;
      putBldg(tpl,c.x,c.z,h,rot,tpl===BT.dome?34:30); }
    // arbolado y arbustos de la manzana (modelos generados)
    for(let k=0;k<2;k++){ const ox=(hash2(i*7+k,103)-.5)*IN*.8, oz=(hash2(i*7+k,107)-.5)*IN*.8;
      const px=c.x+ox, pz=c.z+oz;
      let blocked=false; for(const b of BOXES)if(Math.abs(px-b.x)<b.hw+2&&Math.abs(pz-b.z)<b.hd+2)blocked=true;
      if(blocked)continue;
      if(hash2(i*7+k,109)<.5)putProp(treeTpl,px,pz,5+hash2(i+k,113)*1.8,hash2(i+k,127)*6.28,false);
      else putProp(BT.eco,px,pz,1.7+hash2(i+k,131)*.7,hash2(i+k,137)*6.28,false); } });
  // ---- mobiliario urbano en las esquinas (farolas, bancos, kioscos: modelos generados) ----
  let corner=0;
  for(let gx=-NB;gx<=NB;gx++)for(let gz=-NB;gz<=NB;gz++){
    const x=CITY.x+(gx+.5)*BLOCK-ROAD*.82, z=CITY.z+(gz+.5)*BLOCK-ROAD*.82;
    let blocked=false; for(const b of BOXES)if(Math.abs(x-b.x)<b.hw+2.4&&Math.abs(z-b.z)<b.hd+2.4)blocked=true;
    if(blocked)continue;

    putProp(BT.lamp,x,z,5.6,hash2(gx,gz)*6.28,false);
    if(corner%3===0)putProp(BT.bench,x+4.5,z,1.15,(hash2(gx,gz)<.5?0:Math.PI/2),false);
    else if(corner%5===0)putProp(BT.kiosk,x+5,z+2,3.2,hash2(gz,gx)*6.28,true); }
  // ---- autos estacionados sobre las avenidas (modelo generado) ----

    const c=(i2+.5)*BLOCK, t=(hash2(k,151)-.5)*L*.85;
    const x=CITY.x+(horiz?t:c+ROAD*.28), z=CITY.z+(horiz?c+ROAD*.28:t);
    putProp(BT.car,x,z,1.55,horiz?Math.PI/2:0,true); }
  // ---- fuente central: modelo generado ----
  if(BT.fountain){ putBldg(BT.fountain,CITY.x,CITY.z,5.2,0,14); } }

    // La cámara está en hero-(sin y,cos y)*d, así que ADELANTE = (sin y, cos y)

  else if(K.jump&&!HERO.onGround&&SK.dbl&&!HERO.dbl){     // DOBLE SALTO (misión 4)

  if(!heroReady&&procH){ const t=TT*(HERO.sp>1?9:2.2), L=procH.userData.limbs;
    L[0].rotation.x=Math.sin(t)*(HERO.sp>1?1:.18); L[2].rotation.x=-L[0].rotation.x;
    L[1].rotation.x=-Math.sin(t)*(HERO.sp>1?1.1:.12); L[3].rotation.x=-L[1].rotation.x; }
  // polvo al correr (cada pocos pasos, sólo si vas rápido y en el piso)
  if(HERO.onGround&&HERO.sp>6.5){ HERO.stepT=(HERO.stepT||0)+dt;
    if(HERO.stepT>.22){ HERO.stepT=0; burst(HERO.x,HERO.y+.12,HERO.z,2); } }
  blob.position.set(HERO.x,(HERO.onPlat?HERO.onPlat.y:terrainH(HERO.x,HERO.z))+.03,HERO.z);
  blob.material.opacity=clamp(.32-(HERO.y-(HERO.onPlat?HERO.onPlat.y:terrainH(HERO.x,HERO.z)))*.05,.05,.32);
  // cámara tercera persona
  const hx=HERO.x, hy=HERO.y+1.55, hz=HERO.z;
  const cd=CAM.dist, cp=CAM.pitch;
  let cx=hx-Math.sin(CAM.yaw)*Math.cos(cp)*cd;
  let cz=hz-Math.cos(CAM.yaw)*Math.cos(cp)*cd;
  const cy=hy+Math.sin(cp)*cd+1.1;
  // la cámara no se mete dentro de los edificios
  for(const b of BOXES){ const dx=cx-b.x, dz=cz-b.z;
    const ox=b.hw+1.2-Math.abs(dx), oz=b.hd+1.2-Math.abs(dz);
    if(ox>0&&oz>0){ if(ox<oz)cx=b.x+Math.sign(dx||1)*(b.hw+1.2); else cz=b.z+Math.sign(dz||1)*(b.hd+1.2); } }
  camera.position.lerp(V0.set(cx,Math.max(cy,terrainH(cx,cz)+1.4),cz),1-Math.exp(-9*dt));
  if(CAM.shake>0.01){ CAM.shake=Math.max(0,CAM.shake-dt*3.2);
    camera.position.x+=(Math.random()-.5)*CAM.shake*.35;
    camera.position.y+=(Math.random()-.5)*CAM.shake*.28; }
  camera.lookAt(hx,hy,hz);
  // el campo de visión se abre al correr (sensación de velocidad)
  const fovT=62+(HERO.sp>6.5?7:0)+(HERO.glide?4:0);
  if(Math.abs(camera.fov-fovT)>.05){ camera.fov+=(fovT-camera.fov)*Math.min(1,dt*4); camera.updateProjectionMatrix(); }
}
function worldStep(dt){
  TT+=dt;
  if(grassMat.userData.sh)grassMat.userData.sh.uniforms.uT.value=TT;
  // césped sigue al jugador
  if(Math.abs(HERO.x-lastGX)>3.5||Math.abs(HERO.z-lastGZ)>3.5){
    lastGX=HERO.x; lastGZ=HERO.z; regrass(HERO.x,HERO.z); }
  // sol/sombra siguen al jugador (shadow map chico y efectivo)
  if(Q.shadow>0){ sun.position.set(HERO.x+70,120,HERO.z+50); sun.target.position.set(HERO.x,0,HERO.z); }
  // agua (la textura se desliza: oleaje sin geometría extra) + nubes
  water.position.set(HERO.x,WATER_Y+Math.sin(TT*.6)*.05,HERO.z);
  if(watMat.map){ watMat.map.offset.x=TT*.012; watMat.map.offset.y=Math.sin(TT*.09)*.02; }
  cloudStep(dt);
  if(ENVMAP&&!watMat.envMap){ watMat.envMap=ENVMAP; watMat.needsUpdate=true; }
  // burbujas
  for(let i=0;i<BN;i++){ const b=BUB[i];
    if(b.pop>0){ b.pop-=dt*3; if(b.pop<=0){ spawnBub(i,true); } }
    else { b.y+=b.vy*dt; b.x+=Math.sin(TT*.7+b.ph)*dt*.55; b.z+=Math.cos(TT*.55+b.ph)*dt*.55;
      if(b.y>terrainH(b.x,b.z)+22)spawnBub(i,true);
      // ¿la tocás?
      if(APP==='play'){ const dx=b.x-HERO.x, dy=b.y-(HERO.y+1.1), dz=b.z-HERO.z;
        if(dx*dx+dy*dy+dz*dz<(b.r+.85)*(b.r+.85)){
          b.pop=1; burst(b.x,b.y,b.z,7); S.pop(); RUN.bub++; SV.bub++;
          $('pBub').querySelector('span').textContent=RUN.bub; misSync(); misCheck(); } } }
    const sc=b.pop>0?b.r*b.pop*1.5:b.r;
    _m.compose(_v.set(b.x,b.y,b.z),_q.identity(),_s.set(sc,sc,sc)); bubbles.setMatrixAt(i,_m); }
  bubbles.instanceMatrix.needsUpdate=true;
  // partículas
  for(let i=0;i<PARTS.length;i++){ const p=PARTS[i];
    if(p.t>0){ p.t-=dt; p.vy-=9*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      const s=Math.max(0,p.t)*1.5; _m.compose(_v.set(p.x,p.y,p.z),_q.identity(),_s.set(s,s,s)); }
    else _m.compose(_v.set(0,-999,0),_q.identity(),_s.set(0,0,0));
    parts.setMatrixAt(i,_m); }
  parts.instanceMatrix.needsUpdate=true;
  // peces
  for(const f of FISH){ f.ph+=dt*f.sp;
    const x=f.cx+Math.cos(f.ph)*f.r, z=f.cz+Math.sin(f.ph)*f.r;
    const y=f.y+Math.sin(f.ph*2.3)*1.5;
    f.o.position.set(x,y,z); f.o.rotation.y=-f.ph;
    f.o.rotation.z=Math.sin(f.ph*3)*.14;
    // misión 7: nadar cerca de 3 peces distintos
    if(APP==='play'&&!f.met&&Math.hypot(x-HERO.x,z-HERO.z)<4.5&&Math.abs(y-(HERO.y+1.1))<3.5){
      f.met=true; RUN.fish++; S.gem(); burst(x,y,z,8);
      toast('🐟 '+RUN.fish+'/3'); misSync(); misCheck(); } }
  // cristales
  for(const c of CRY){ if(!c.on)continue;
    c.m.rotation.y+=dt*1.5; c.m.position.y=c.y+Math.sin(TT*2+c.ph)*.22;
    if(APP!=='play')continue;
    const d=Math.hypot(c.x-HERO.x,c.z-HERO.z);
    if(d<1.5&&Math.abs(c.m.position.y-(HERO.y+1))<2.2){
      c.on=false; c.m.visible=false; RUN.cry++; SV.cry++; save(); S.gem();
      burst(c.x,c.m.position.y,c.z,6);
      $('pCry').querySelector('span').textContent=RUN.cry; misSync(); misCheck(); } }
  // orbes de música
  for(const o of ORBS){ if(!o.on)continue;
    o.g.rotation.y+=dt*.8;
    o.g.position.y=o.y+Math.sin(TT*1.4+o.i)*.3;
    if(APP!=='play')continue;
    if(Math.hypot(o.x-HERO.x,o.z-HERO.z)<2.4&&Math.abs(o.g.position.y-(HERO.y+1))<3){
      o.on=false; o.g.visible=false; RUN.orbs++; S.gem(); S.win();
      burst(o.x,o.g.position.y,o.z,14); toast('🎵 '+RUN.orbs+'/4'); misSync(); misCheck(); } }
  // plataformas flotan
  for(const p of PLATS){ const y=p.base+Math.sin(TT*.9+p.ph)*.35; p.g.position.y=y; p.y=y; }
  // marcadores
  let near=false;
  for(const m of MARK){ if(!m.g.visible)continue; m.ring.rotation.z+=dt*1.1;
    m.g.scale.setScalar(1+Math.sin(TT*2.4)*.05);
    if(APP!=='play')continue;
    if(Math.hypot(m.x-HERO.x,m.z-HERO.z)<3.4){ m.on=false; m.g.visible=false; RUN.marks++;
      S.gem(); burst(m.x,1.5,m.z,12); toast('📦 '+RUN.marks+'/3'); misSync(); misCheck(); }
    else if(Math.hypot(m.x-HERO.x,m.z-HERO.z)<9)near=true; }
  if(TOPMARK.on){ TOPMARK.g.visible=true; TOPMARK.ring.rotation.z+=dt*1.1;
    TOPMARK.g.position.y=PLAT_TOP.y+.5;
    if(APP==='play'&&Math.hypot(TOPMARK.x-HERO.x,TOPMARK.z-HERO.z)<3.6&&Math.abs(HERO.y-PLAT_TOP.y)<2.5){
      RUN.top=true; TOPMARK.on=false; TOPMARK.g.visible=false; S.win(); burst(TOPMARK.x,PLAT_TOP.y+1.5,TOPMARK.z,16);
      misSync(); misCheck(); } }
  $('prompt').style.display=near?'block':'none';
  // ===== OPTIMIZACIÓN: culling por distancia (además del frustum culling de three) =====
  cullAcc+=dt; if(cullAcc>.25){ cullAcc=0; cullByDistance(); }
  // minimapa (no cada frame)
  miniAcc+=dt; if(miniAcc>.1){ miniAcc=0; drawMini(); }
  compAcc+=dt; if(compAcc>.12){ compAcc=0; updCompass(); updSkills(); ambStep(); }
}
let cullAcc=0;
const FAR=Q.fog*0.92, FAR2=FAR*FAR;
function cullByDistance(){
  for(const o of treeGroup.children){ const dx=o.position.x-HERO.x, dz=o.position.z-HERO.z;
    o.visible=(dx*dx+dz*dz)<FAR2; }
  for(const o of cityGroup.children){ const dx=o.position.x-HERO.x, dz=o.position.z-HERO.z;
    o.visible=(dx*dx+dz*dz)<(FAR2*1.6); }
  for(const f of FISH)f.o.visible=(f.o.position.distanceToSquared(camera.position)<FAR2);
  for(const p of PLATS){ p.g.visible=(p.g.position.distanceToSquared(camera.position)<FAR2); }
  for(const c of CRY){ if(!c.on)continue; const dx=c.x-HERO.x, dz=c.z-HERO.z;
    c.m.visible=(dx*dx+dz*dz)<FAR2; } }

  amb:()=>{ ambStep(); return{on:AMB.on,wind:AMB.windG?AMB.windG.gain.value:0,wat:AMB.watG?AMB.watG.gain.value:0}; },
  bldgH:()=>cityGroup.children.map(o=>{ const bb=new THREE.Box3().setFromObject(o); return +(bb.max.y-bb.min.y).toFixed(0); }).sort((a,b)=>b-a).slice(0,8),
  giveCry:n=>{ RUN.cry+=n; misSync(); misCheck(); }, giveBub:n=>{ RUN.bub+=n; misSync(); misCheck(); } };
</script>
