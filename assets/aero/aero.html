  // orbes
  mCtx.fillStyle='#ffc94a';
  for(const o of ORBS){ if(!o.on)continue; const dx=(o.x-HERO.x)*SCALE, dz=(o.z-HERO.z)*SCALE;
    const d=Math.hypot(dx,dz); const k=d>R-6?(R-6)/d:1;
    mCtx.beginPath(); mCtx.arc(dx*k,dz*k,3,0,6.3); mCtx.fill(); }
  // marcadores
  mCtx.fillStyle='#c6ff8a';
  for(const m of MARK){ if(!m.on||!m.g.visible)continue; const dx=(m.x-HERO.x)*SCALE, dz=(m.z-HERO.z)*SCALE;
    const d=Math.hypot(dx,dz); const k=d>R-6?(R-6)/d:1;
    mCtx.beginPath(); mCtx.arc(dx*k,dz*k,3.4,0,6.3); mCtx.fill(); }
  if(TOPMARK.on){ mCtx.fillStyle='#c6ff8a'; const dx=(TOPMARK.x-HERO.x)*SCALE, dz=(TOPMARK.z-HERO.z)*SCALE;
    const d=Math.hypot(dx,dz); const k=d>R-6?(R-6)/d:1;
    mCtx.beginPath(); mCtx.arc(dx*k,dz*k,3.4,0,6.3); mCtx.fill(); }
  mCtx.restore();
  // jugador
  mCtx.fillStyle='#fff'; mCtx.beginPath();
  mCtx.moveTo(R,R-6); mCtx.lineTo(R-4.5,R+5); mCtx.lineTo(R+4.5,R+5); mCtx.closePath(); mCtx.fill(); }

/* ================= bucle ================= */
let APP='load', last=performance.now(), TT=0, hintT=0;
function heroStep(dt){
  const gp=pads();
  let ix=0, iz=0;
  if(K.lf)ix-=1; if(K.rt)ix+=1; if(K.up)iz-=1; if(K.dn)iz+=1;
  ix+=joy.dx+gp.ax; iz+=joy.dy+gp.ay;
  const mag=Math.hypot(ix,iz);
  if(mag>1){ ix/=mag; iz/=mag; }
  const moving=Math.hypot(ix,iz)>.12;
  const running=(K.run||gp.r);
  const target=moving?(running?9.4:5.2):0;
  HERO.sp=lerp(HERO.sp,target,Math.min(1,dt*7));
  if(moving){
    // dirección relativa a la cámara.
    // La cámara está en hero-(sin y,cos y)*d, así que ADELANTE = (sin y, cos y)
    // y DERECHA = (cos y, -sin y). Empujar el joystick arriba da iz<0 => adelante.
    const cs=Math.cos(CAM.yaw), sn=Math.sin(CAM.yaw);
    const wx=ix*cs - iz*sn, wz=-ix*sn - iz*cs;
    const want=Math.atan2(wx,wz);   // el modelo mira a su +Z local
    let d=want-HERO.h; while(d>Math.PI)d-=6.28318; while(d<-Math.PI)d+=6.28318;
    HERO.h+=d*Math.min(1,dt*10);
    HERO.x+=wx*HERO.sp*dt; HERO.z+=wz*HERO.sp*dt; }
  // límites del mundo
  const lim=WORLD*.47; HERO.x=clamp(HERO.x,-lim,lim); HERO.z=clamp(HERO.z,-lim,lim);
  // colisión con edificios
  for(const b of BOXES){ const dx=HERO.x-b.x, dz=HERO.z-b.z;
    const ox=b.hw+.6-Math.abs(dx), oz=b.hd+.6-Math.abs(dz);
    if(ox>0&&oz>0){ if(ox<oz)HERO.x=b.x+Math.sign(dx||1)*(b.hw+.6);
      else HERO.z=b.z+Math.sign(dz||1)*(b.hd+.6); } }
  // suelo: terreno o plataforma
  let ground=terrainH(HERO.x,HERO.z);
  if(ground<WATER_Y-.1)ground=WATER_Y-.1;   // no te hundís: caminás por el agua bajita
  let plat=null;
  for(const p of PLATS){ if(Math.hypot(HERO.x-p.x,HERO.z-p.z)>p.r)continue;
    if(HERO.y+.35>=p.y&&p.y>ground){ ground=p.y; plat=p; } }
  HERO.onPlat=plat;
  // salto / gravedad
  if((K.jump||gp.j)&&HERO.onGround){ HERO.vy=8.6; HERO.onGround=false; S.jump(); K.jump=false; }
  HERO.vy-=22*dt; HERO.y+=HERO.vy*dt;
  if(HERO.y<=ground){ HERO.y=ground; HERO.vy=0; HERO.onGround=true; }
  else HERO.onGround=false;
  // animación
  if(!HERO.onGround)setAnim('jump'); else if(HERO.sp>1.1)setAnim('run'); else setAnim('idle');
  heroRoot.position.set(HERO.x,HERO.y,HERO.z); heroRoot.rotation.y=HERO.h;
  for(const k in HMX){ if(HM[k]&&HM[k].visible)HMX[k].update(dt*(k==='run'?clamp(HERO.sp/5.2,.7,1.7):1)); }
  if(!heroReady&&procH){ const t=TT*(HERO.sp>1?9:2.2), L=procH.userData.limbs;
    L[0].rotation.x=Math.sin(t)*(HERO.sp>1?1:.18); L[2].rotation.x=-L[0].rotation.x;
    L[1].rotation.x=-Math.sin(t)*(HERO.sp>1?1.1:.12); L[3].rotation.x=-L[1].rotation.x; }
  blob.position.set(HERO.x,(HERO.onPlat?HERO.onPlat.y:terrainH(HERO.x,HERO.z))+.03,HERO.z);
  blob.material.opacity=clamp(.32-(HERO.y-(HERO.onPlat?HERO.onPlat.y:terrainH(HERO.x,HERO.z)))*.05,.05,.32);
  // cámara tercera persona
  const hx=HERO.x, hy=HERO.y+1.55, hz=HERO.z;
  const cd=CAM.dist, cp=CAM.pitch;
  let cx=hx-Math.sin(CAM.yaw)*Math.cos(cp)*cd;
  let cz=hz-Math.cos(CAM.yaw)*Math.cos(cp)*cd;
  const cy=hy+Math.sin(cp)*cd+1.1;
  // la cámara no se mete dentro de los edificios
  for(const b of BOXES){ const dx=cx-b.x, dz=cz-b.z;
    const ox=b.hw+1.2-Math.abs(dx), oz=b.hd+1.2-Math.abs(dz);
    if(ox>0&&oz>0){ if(ox<oz)cx=b.x+Math.sign(dx||1)*(b.hw+1.2); else cz=b.z+Math.sign(dz||1)*(b.hd+1.2); } }
  camera.position.lerp(V0.set(cx,Math.max(cy,terrainH(cx,cz)+1.4),cz),1-Math.exp(-9*dt));
  camera.lookAt(hx,hy,hz);
}
function worldStep(dt){
  TT+=dt;
  if(grassMat.userData.sh)grassMat.userData.sh.uniforms.uT.value=TT;
  // césped sigue al jugador
  if(Math.abs(HERO.x-lastGX)>3.5||Math.abs(HERO.z-lastGZ)>3.5){
    lastGX=HERO.x; lastGZ=HERO.z; regrass(HERO.x,HERO.z); }
  // sol/sombra siguen al jugador (shadow map chico y efectivo)
  if(Q.shadow>0){ sun.position.set(HERO.x+70,120,HERO.z+50); sun.target.position.set(HERO.x,0,HERO.z); }
  // agua
  water.position.set(HERO.x,WATER_Y+Math.sin(TT*.6)*.05,HERO.z);
  if(ENVMAP&&!watMat.envMap){ watMat.envMap=ENVMAP; watMat.needsUpdate=true; }
  // burbujas
  for(let i=0;i<BN;i++){ const b=BUB[i];
    if(b.pop>0){ b.pop-=dt*3; if(b.pop<=0){ spawnBub(i,true); } }
    else { b.y+=b.vy*dt; b.x+=Math.sin(TT*.7+b.ph)*dt*.55; b.z+=Math.cos(TT*.55+b.ph)*dt*.55;
      if(b.y>terrainH(b.x,b.z)+22)spawnBub(i,true);
      // ¿la tocás?
      if(APP==='play'){ const dx=b.x-HERO.x, dy=b.y-(HERO.y+1.1), dz=b.z-HERO.z;
        if(dx*dx+dy*dy+dz*dz<(b.r+.85)*(b.r+.85)){
          b.pop=1; burst(b.x,b.y,b.z,7); S.pop(); RUN.bub++; SV.bub++;
          $('pBub').querySelector('span').textContent=RUN.bub; misSync(); misCheck(); } } }
    const sc=b.pop>0?b.r*b.pop*1.5:b.r;
    _m.compose(_v.set(b.x,b.y,b.z),_q.identity(),_s.set(sc,sc,sc)); bubbles.setMatrixAt(i,_m); }
  bubbles.instanceMatrix.needsUpdate=true;
  // partículas
  for(let i=0;i<PARTS.length;i++){ const p=PARTS[i];
    if(p.t>0){ p.t-=dt; p.vy-=9*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      const s=Math.max(0,p.t)*1.5; _m.compose(_v.set(p.x,p.y,p.z),_q.identity(),_s.set(s,s,s)); }
    else _m.compose(_v.set(0,-999,0),_q.identity(),_s.set(0,0,0));
    parts.setMatrixAt(i,_m); }
  parts.instanceMatrix.needsUpdate=true;
  // peces
  for(const f of FISH){ f.ph+=dt*f.sp;
    const x=f.cx+Math.cos(f.ph)*f.r, z=f.cz+Math.sin(f.ph)*f.r;
    const y=f.y+Math.sin(f.ph*2.3)*1.5;
    f.o.position.set(x,y,z); f.o.rotation.y=-f.ph;
    f.o.rotation.z=Math.sin(f.ph*3)*.14; }
  // cristales
  for(const c of CRY){ if(!c.on)continue;
    c.m.rotation.y+=dt*1.5; c.m.position.y=c.y+Math.sin(TT*2+c.ph)*.22;
    if(APP!=='play')continue;
    const d=Math.hypot(c.x-HERO.x,c.z-HERO.z);
    if(d<1.5&&Math.abs(c.m.position.y-(HERO.y+1))<2.2){
      c.on=false; c.m.visible=false; RUN.cry++; SV.cry++; save(); S.gem();
      burst(c.x,c.m.position.y,c.z,6);
      $('pCry').querySelector('span').textContent=RUN.cry; misSync(); misCheck(); } }
  // orbes de música
  for(const o of ORBS){ if(!o.on)continue;
    o.g.rotation.y+=dt*.8;
    o.g.position.y=o.y+Math.sin(TT*1.4+o.i)*.3;
    if(APP!=='play')continue;
    if(Math.hypot(o.x-HERO.x,o.z-HERO.z)<2.4&&Math.abs(o.g.position.y-(HERO.y+1))<3){
      o.on=false; o.g.visible=false; RUN.orbs++; S.gem(); S.win();
      burst(o.x,o.g.position.y,o.z,14); toast('🎵 '+RUN.orbs+'/4'); misSync(); misCheck(); } }
  // plataformas flotan
  for(const p of PLATS){ const y=p.base+Math.sin(TT*.9+p.ph)*.35; p.g.position.y=y; p.y=y; }
  // marcadores
  let near=false;
  for(const m of MARK){ if(!m.g.visible)continue; m.ring.rotation.z+=dt*1.1;
    m.g.scale.setScalar(1+Math.sin(TT*2.4)*.05);
    if(APP!=='play')continue;
    if(Math.hypot(m.x-HERO.x,m.z-HERO.z)<3.4){ m.on=false; m.g.visible=false; RUN.marks++;
      S.gem(); burst(m.x,1.5,m.z,12); toast('📦 '+RUN.marks+'/3'); misSync(); misCheck(); }
    else if(Math.hypot(m.x-HERO.x,m.z-HERO.z)<9)near=true; }
  if(TOPMARK.on){ TOPMARK.g.visible=true; TOPMARK.ring.rotation.z+=dt*1.1;
    TOPMARK.g.position.y=PLAT_TOP.y+.5;
    if(APP==='play'&&Math.hypot(TOPMARK.x-HERO.x,TOPMARK.z-HERO.z)<3.6&&Math.abs(HERO.y-PLAT_TOP.y)<2.5){
      RUN.top=true; TOPMARK.on=false; TOPMARK.g.visible=false; S.win(); burst(TOPMARK.x,PLAT_TOP.y+1.5,TOPMARK.z,16);
      misSync(); misCheck(); } }
  $('prompt').style.display=near?'block':'none';
  // ===== OPTIMIZACIÓN: culling por distancia (además del frustum culling de three) =====
  cullAcc+=dt; if(cullAcc>.25){ cullAcc=0; cullByDistance(); }
  // minimapa (no cada frame)
  miniAcc+=dt; if(miniAcc>.1){ miniAcc=0; drawMini(); }
}
let cullAcc=0;
const FAR=Q.fog*0.92, FAR2=FAR*FAR;
function cullByDistance(){
  for(const o of treeGroup.children){ const dx=o.position.x-HERO.x, dz=o.position.z-HERO.z;
    o.visible=(dx*dx+dz*dz)<FAR2; }
  for(const o of cityGroup.children){ const dx=o.position.x-HERO.x, dz=o.position.z-HERO.z;
    o.visible=(dx*dx+dz*dz)<(FAR2*1.6); }
  for(const f of FISH)f.o.visible=(f.o.position.distanceToSquared(camera.position)<FAR2);
  for(const p of PLATS){ p.g.visible=(p.g.position.distanceToSquared(camera.position)<FAR2); }
  for(const c of CRY){ if(!c.on)continue; const dx=c.x-HERO.x, dz=c.z-HERO.z;
    c.m.visible=(dx*dx+dz*dz)<FAR2; } }
function frame(){ requestAnimationFrame(frame);
  const now=performance.now(); const dt=Math.min(.05,(now-last)/1000); last=now;
  if(APP==='play'){ heroStep(dt); worldStep(dt); }
  else if(APP==='title'){ TT+=dt;
    const r=26, a=TT*.06;
    camera.position.set(Math.cos(a)*r,11+Math.sin(TT*.2)*1.4,Math.sin(a)*r);
    camera.lookAt(0,3,0);
    if(grassMat.userData.sh)grassMat.userData.sh.uniforms.uT.value=TT;
    for(const f of FISH){ f.ph+=dt*f.sp; f.o.position.set(f.cx+Math.cos(f.ph)*f.r,f.y+Math.sin(f.ph*2.3)*1.5,f.cz+Math.sin(f.ph)*f.r);
      f.o.rotation.y=-f.ph; }
    for(let i=0;i<BN;i++){ const b=BUB[i]; b.y+=b.vy*dt*.6;
      if(b.y>terrainH(b.x,b.z)+22)spawnBub(i,false);
      _m.compose(_v.set(b.x,b.y,b.z),_q.identity(),_s.set(b.r,b.r,b.r)); bubbles.setMatrixAt(i,_m); }
    bubbles.instanceMatrix.needsUpdate=true;
    for(const k in HMX){ if(HM[k]&&HM[k].visible)HMX[k].update(dt); } }
  else if(APP==='pause'){ /* congelado */ }
  renderer.render(scene,camera); }

/* ================= UI ================= */
function applyLang(){ document.documentElement.lang=LANG;
  $('tTag').textContent=T('tag'); $('bPlay').textContent=T('play');
  $('bLogT').textContent=T('log'); $('bSet').textContent=T('set');
  $('qTitle').textContent=T('qual'); $('qSub').textContent=T('qsub'); $('qNote').textContent=T('qnote');
  $('qLow').innerHTML=T('qlow')+'<small>'+T('qlowD')+'</small>';
  $('qMed').innerHTML=T('qmed')+'<small>'+T('qmedD')+'</small>';
  $('qHigh').innerHTML=T('qhigh')+'<small>'+T('qhighD')+'</small>';
  $('pCry').querySelector('span').textContent=RUN.cry; $('pBub').querySelector('span').textContent=RUN.bub;
  $('lgTitle').textContent=T('missions'); $('lgClose').textContent=T('close');
  $('pTitle').textContent=T('pause'); $('pResume').textContent=T('resume'); $('pMenu').textContent=T('menu');
  $('pQual').textContent=T('qual')+': '+T('q'+SV.qual);
  $('pMus').textContent=SV.mus?T('musOn'):T('musOff');
  $('eCont').textContent=T('cont'); $('eTitle').textContent=T('allDone'); $('eBody').innerHTML=T('allDoneB');
  $('prompt').textContent=T('prompt'); $('tHint').textContent=touchDev?T('hintT'):T('hintK');
  $('hint').innerHTML=touchDev?T('hintT'):T('hintK');
  $('loadTx').textContent=T('loading'); misSync(); }
function showScreen(n){ ['sLoad','sLang','sQual','sTitle','sLog','sPause','sEnd'].forEach(i=>$(i).classList.add('hide'));
  if(n)$(n).classList.remove('hide'); }
function toTitle(){ APP='title'; showScreen('sTitle'); $('hud').classList.add('hide');
  camera.position.set(24,12,24); music('mMenu'); }
function startPlay(){ APP='play'; showScreen(null); $('hud').classList.remove('hide');
  $('touch').style.display=touchDev?'block':'none';
  RUN.cry=0; RUN.bub=0;
  $('pCry').querySelector('span').textContent=0; $('pBub').querySelector('span').textContent=0;
  HERO.x=0; HERO.z=10; HERO.y=terrainH(0,10)+.2; HERO.vy=0; HERO.h=Math.PI;
  CAM.yaw=Math.PI; CAM.pitch=.28; CAM.dist=9.5;
  regrass(HERO.x,HERO.z); misSync(); music('mPlay');
  $('hint').style.opacity=1; setTimeout(()=>{ $('hint').style.opacity=0; },6000); }
function togglePause(){ if(APP==='play'){ APP='pause'; showScreen('sPause'); applyLang(); }
  else if(APP==='pause'){ APP='play'; showScreen(null); } }
function showLog(){ let h='';
  MIS.forEach((M,i)=>{ const done=i<misIdx, cur=i===misIdx;
    h+='<div class="mrow'+(done?' done':'')+(cur?' cur':'')+'"><div class="ic">'+(done?'✅':cur?'▶️':'🔒')+'</div>'+
       '<div><b>'+T(M.id)+'</b><small>'+T(M.id+'d')+(cur?' &nbsp;('+M.get()+'/'+M.goal+')':'')+'</small></div></div>'; });
  $('lgList').innerHTML=h; showScreen('sLog'); }
function showEnd(){ showScreen('sEnd'); applyLang(); }
document.querySelectorAll('#sLang [data-lang]').forEach(b=>b.addEventListener('click',()=>{ audioUnlock(); S.ui();
  LANG=b.dataset.lang; SV.lang=LANG; save(); applyLang();
  document.querySelectorAll('#sQual [data-q]').forEach(q=>q.classList.toggle('sel',q.dataset.q===SV.qual));
  showScreen('sQual'); }));
document.querySelectorAll('#sQual [data-q]').forEach(b=>b.addEventListener('click',()=>{ audioUnlock(); S.ui();
  const q=b.dataset.q; SV.qual=q; save();
  document.querySelectorAll('#sQual [data-q]').forEach(x=>x.classList.toggle('sel',x===b));
  if(q!==QKEY){ setTimeout(()=>location.reload(),260); return; }
  toTitle(); }));
$('bPlay').addEventListener('click',()=>{ S.ui(); startPlay(); });
$('bLogT').addEventListener('click',()=>{ S.ui(); showLog(); });
$('bSet').addEventListener('click',()=>{ S.ui(); showScreen('sQual'); });
$('lgClose').addEventListener('click',()=>{ S.ui(); if(APP==='play')showScreen(null); else toTitle(); });
$('btnLog').addEventListener('click',e=>{ e.stopPropagation(); S.ui(); showLog(); });
$('btnPause').addEventListener('click',e=>{ e.stopPropagation(); S.ui(); togglePause(); });
$('pResume').addEventListener('click',()=>{ S.ui(); togglePause(); });
$('pMenu').addEventListener('click',()=>{ S.ui(); toTitle(); });
$('pMus').addEventListener('click',()=>{ SV.mus=!SV.mus; save(); applyLang();
  if(!SV.mus)stopMusic(); else music(APP==='play'?'mPlay':'mMenu'); });
$('pQual').addEventListener('click',()=>{ S.ui(); showScreen('sQual'); });

const QKEY=SV.qual;

/* ================= carga ================= */
const PRE=[A.sky,A.grass,A.logo,A.keyart,A.heroIdle,A.heroRun,A.heroJump,A.tree,
  A.tower1,A.tower2,A.tower3,A.dome,A.mall,A.bush,A.tGrass,A.tRoad,A.tPlaza,A.tWalk,
  A.office,A.spire,A.apt,A.kiosk,A.fountain,A.lamp,A.bench,A.car,A.plat,A.gem,A.fish,
  A.musMenu,A.musPlay,A.sfxPop,A.sfxGem,A.sfxJump,A.sfxUi,A.sfxWin].filter(ok);
let pDone=0; const pTot=Math.max(1,PRE.length);
function preload(){ if(!PRE.length){ setTimeout(finishLoad,500); return; }
  PRE.forEach(u=>fetch(u,{cache:'force-cache'}).then(()=>{}).catch(()=>{}).then(()=>{
    pDone++; $('barIn').style.width=(100*pDone/pTot)+'%';
    $('loadTx').textContent=T('loading')+' '+Math.round(100*pDone/pTot)+'%';
    if(pDone>=pTot)finishLoad(); })); }
let loadDone=false;
function finishLoad(){ if(loadDone)return; loadDone=true;
  $('barIn').style.width='100%'; $('loadTx').textContent=T('ready');
  setTimeout(()=>{ if(!SV.lang){ showScreen('sLang'); }
    else { document.querySelectorAll('#sQual [data-q]').forEach(q=>q.classList.toggle('sel',q.dataset.q===SV.qual));

// imágenes de UI + cielo
if(ok(A.logo))$('tLogo').src=A.logo; else $('tLogo').outerHTML='<h1 class="big" style="font-size:clamp(40px,13vw,90px);letter-spacing:2px">AERO</h1>';
if(ok(A.keyart)){ const im=new Image(); im.onload=()=>{ ['sLang','sQual','sTitle','sEnd'].forEach(i=>$(i).style.backgroundImage='url('+A.keyart+')'); };

if(ok(A.sky)){ const im=new Image(); im.crossOrigin='anonymous';
  im.onload=()=>applySky(skyFromImage(im)); im.onerror=()=>applySky(skyFromImage(null)); im.src=A.sky; }
else applySky(skyFromImage(null));
applyLang(); regrass(0,10); preload(); frame();
/* hook de pruebas */
window.__A={ app:()=>APP, hero:()=>({x:HERO.x,y:HERO.y,z:HERO.z,h:HERO.h,sp:HERO.sp,anim:animK}),
  cry:()=>RUN.cry, bub:()=>RUN.bub, mis:()=>misIdx, lang:()=>LANG, qual:()=>SV.qual,
  grassN:()=>GN, bubN:()=>BN, trees:()=>treeGroup.children.length, boxes:()=>BOXES.length,
  setLang:l=>{ LANG=l; SV.lang=l; applyLang(); }, screen:n=>showScreen(n),
  play:()=>startPlay(), title:()=>toTitle(), log:()=>showLog(), pause:()=>togglePause(),
  press:(k,v)=>{ K[k]=v; }, move:(x,z)=>{ joy.dx=x; joy.dy=z; },
  tp:(x,z)=>{ HERO.x=x; HERO.z=z; HERO.y=terrainH(x,z)+.2; regrass(x,z); },
  terrainH, calls:()=>renderer.info.render.calls, tris:()=>renderer.info.render.triangles,
  misIdx:()=>misIdx, orbs:()=>RUN.orbs, marks:()=>RUN.marks, top:()=>RUN.top,
  cityInfo:()=>({ kids:cityGroup.children.length, vis:cityGroup.children.filter(o=>o.visible).length,
    glb:!!BT.tower1, samples:cityGroup.children.slice(0,26).map(o=>{ const bb=new THREE.Box3().setFromObject(o);
      return {x:+o.position.x.toFixed(0),z:+o.position.z.toFixed(0),h:+(bb.max.y-bb.min.y).toFixed(1),
        w:+(bb.max.x-bb.min.x).toFixed(1),v:o.visible}; }) }),
  camPos:()=>({x:+camera.position.x.toFixed(1),y:+camera.position.y.toFixed(1),z:+camera.position.z.toFixed(1),yaw:+CAM.yaw.toFixed(2)}),
  setYaw:y=>{ CAM.yaw=y; },
  giveCry:n=>{ RUN.cry+=n; misSync(); misCheck(); }, giveBub:n=>{ RUN.bub+=n; misSync(); misCheck(); } };
