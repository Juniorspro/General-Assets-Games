<style>
:root{--ink:#eef2f6;--dim:#9fb0bf;--acc:#5ad0ff;--acc2:#ffb03a;--panel:rgba(16,20,26,.82)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0e12;color:var(--ink);
  font-family:"Segoe UI",Roboto,system-ui,sans-serif;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
/* ---------- paneles ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(20,30,44,.72),rgba(6,8,11,.92));padding:16px}
.screen.hide{display:none}
.card{width:min(94vw,460px);max-height:92vh;overflow-y:auto;background:var(--panel);
  border:1px solid rgba(238,242,246,.16);border-radius:18px;padding:20px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
h1{font:900 clamp(22px,7vw,34px)/1.1 inherit;letter-spacing:.02em;margin-bottom:4px}
h1 b{color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.5}
.btn{display:block;width:100%;margin-top:9px;padding:13px 14px;font:800 15px inherit;letter-spacing:.04em;
  color:var(--ink);background:#232a34;border:1px solid rgba(238,242,246,.18);border-bottom-width:3px;
  border-radius:12px;text-align:left}
.btn small{display:block;font:400 11.5px inherit;color:var(--dim);margin-top:3px;letter-spacing:0}
.btn.sel{background:linear-gradient(180deg,#d9f4ff,#7fd8ff 55%,#35b7ee);color:#06202c;border-color:#35b7ee}
.btn.sel small{color:#0a3a4d}
.btn.go{background:linear-gradient(180deg,#ffd39a,#ffa62a 60%,#e2820a);color:#241300;border-color:#e2820a;
  text-align:center;font-size:17px;letter-spacing:.1em}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row .btn{margin-top:0;text-align:center}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.on{display:block}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.9}
#cross:before,#cross:after{content:"";position:absolute;background:#eef2f6;box-shadow:0 0 3px #000}
#cross:before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#cross:after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#cross.grab:before,#cross.grab:after{background:var(--acc2)}
.pill{position:absolute;background:var(--panel);border:1px solid rgba(238,242,246,.2);border-radius:12px;
  padding:7px 11px;font:800 12.5px inherit;letter-spacing:.03em;white-space:nowrap;
  display:flex;align-items:center;gap:7px}
#pTool{left:12px;bottom:12px}
#pTool i{font-style:normal;color:var(--acc)}
#pInfo{right:12px;top:12px;color:var(--dim);font-weight:600}
#pHint{left:50%;bottom:12px;transform:translateX(-50%);color:var(--dim);font-weight:600;max-width:90vw;
  transition:opacity .5s}
#hud.tch #pHint{bottom:25vmin}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(10,14,20,.86);
  border:1px solid rgba(90,208,255,.4);border-radius:12px;padding:9px 15px;font:800 14px inherit;
  opacity:0;transition:opacity .18s}
/* ---------- controles táctiles ---------- */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#stick{position:absolute;left:3.5vmin;bottom:4vmin;width:34vmin;height:34vmin;min-width:126px;min-height:126px;
  border-radius:50%;background:rgba(20,26,34,.4);border:2px solid rgba(238,242,246,.22);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;
  background:rgba(238,242,246,.85);border:2px solid var(--acc);transform:translate(-50%,-50%)}
.tb{position:absolute;pointer-events:auto;border-radius:22%;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1;
  background:linear-gradient(180deg,rgba(64,74,88,.9),rgba(22,27,34,.92));
  border:2px solid rgba(238,242,246,.24);border-bottom:5px solid rgba(0,0,0,.5);
  box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.13);
  width:17vmin;height:17vmin;min-width:64px;min-height:64px;font:900 5.2vmin inherit}
.tb .lb{font:800 1.9vmin inherit;letter-spacing:.06em;opacity:.7;min-font-size:8px}
.tb.act{filter:brightness(1.5) saturate(1.2);border-bottom-width:2px}
#bFire{right:3.5vmin;bottom:4vmin;width:22vmin;height:22vmin;min-width:82px;min-height:82px;
  border-color:rgba(90,208,255,.5)}
#bJump{right:27vmin;bottom:4vmin}
#bFrz{right:3.5vmin;bottom:28vmin}
#bTool{right:27vmin;bottom:28vmin}
#bRot{right:50vmin;bottom:4vmin;width:15vmin;height:15vmin;min-width:56px;min-height:56px}
#bMenu{left:3.5vmin;top:3.5vmin;width:14vmin;height:14vmin;min-width:52px;min-height:52px;font-size:4.4vmin}
#bNo{left:20vmin;top:3.5vmin;width:14vmin;height:14vmin;min-width:52px;min-height:52px;font-size:4.4vmin}
/* ---------- iconos generados (se activan cuando las 8 imágenes ya están) ---------- */
.gl,.gx{font-style:normal}
.tb>.gx{display:block}
body.gi .gl{background-repeat:no-repeat;background-position:center;background-size:contain;
  color:transparent!important;text-shadow:none}
body.gi .tb>.gl{display:block;width:46%;height:46%}
body.gi #bFire>.gl{width:50%;height:50%}
body.gi #bMenu>.gl,body.gi #bNo>.gl{width:56%;height:56%}
body.gi #pTool i.gl{display:inline-block;width:15px;height:15px;vertical-align:-3px}
body.gi .pitem .ic.gl{height:26px}
/* ---------- menú de spawn ---------- */
#spawn{position:fixed;inset:0;z-index:16;display:none;align-items:flex-end;justify-content:center;
  background:rgba(6,8,11,.55);padding:0;pointer-events:auto}
#spawn.on{display:flex}
#spawncard{width:100%;max-height:76vh;overflow-y:auto;background:var(--panel);
  border-top:1px solid rgba(238,242,246,.18);border-radius:18px 18px 0 0;padding:14px 12px 18px;
  backdrop-filter:blur(8px)}
#spawncard h2{font:900 15px inherit;letter-spacing:.08em;color:var(--acc);margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.pitem{background:#1d2430;border:1px solid rgba(238,242,246,.16);border-bottom-width:3px;border-radius:12px;
  padding:9px 6px;text-align:center;font:800 11.5px inherit;color:var(--ink)}
.pitem .ic{display:block;font-size:26px;margin-bottom:4px;line-height:1}
.pitem:active{background:#2b3646;border-color:var(--acc)}
#tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-top:14px}
#spawnclose{margin-top:14px}
#load{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:#0b0e12}
#load .bar{width:min(70vw,300px);height:6px;background:#1b222c;border-radius:4px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ad0ff,#ffb03a);transition:width .2s}
#load .msg{color:var(--dim);font:700 13px inherit}
</style>

let LANG=SV.lang||'es';
const T=k=>(I18N[LANG]&&I18N[LANG][k])||I18N.es[k]||k;

/* ================= calidad ================= */
const QP={
  uld :{key:'uld', dpr:.62, shadow:0,    maxProps:36,  iters:6,  texMax:256, far:220, aa:false, phong:true,  floor:.72},
  low :{key:'low', dpr:.85, shadow:0,    maxProps:60,  iters:8,  texMax:512, far:300, aa:false, phong:true,  floor:.66},
  high:{key:'high',dpr:1.7, shadow:2048, maxProps:120, iters:12, texMax:2048,far:600, aa:true,  phong:false, floor:1}};
let Q=QP[SV.qual]||QP.uld;

/* ================= render ================= */
const renderer=new THREE.WebGLRenderer({antialias:Q.aa,powerPreference:'high-performance',
  precision:'highp',stencil:false,alpha:false});   // highp SIEMPRE (mediump hace temblar el piso en Mali)
let resScale=1;
const applyDpr=()=>renderer.setPixelRatio(Math.min(devicePixelRatio||1,Q.dpr)*resScale);
applyDpr();
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NeutralToneMapping||THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.98;
renderer.shadowMap.enabled=Q.shadow>0;
renderer.shadowMap.type=THREE.PCFShadowMap;
$('wrap').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fc4e8);
scene.fog=new THREE.Fog(0xb9d6ea,Q.far*.45,Q.far*.98);
const camera=new THREE.PerspectiveCamera(74,1,.12,Q.far);
function resize(){renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight(0xcfe2f5,0x3d4348,.58);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d8,1.3);sun.position.set(40,70,26);scene.add(sun);
const fill=new THREE.DirectionalLight(0xbdd6ee,.34);fill.position.set(-34,26,-30);scene.add(fill);
if(Q.shadow>0){sun.castShadow=true;sun.shadow.mapSize.set(Q.shadow,Q.shadow);
  const d=44,c=sun.shadow.camera;c.left=-d;c.right=d;c.top=d;c.bottom=-d;c.near=1;c.far=200;
  sun.shadow.bias=-0.0012;sun.shadow.normalBias=.03;scene.add(sun.target);}

/* ---- materiales baratos en ULD/BAJA (PBR por píxel es lo caro en gama baja) ---- */
const _cheap=new Map();
function cheapMats(root){ if(!root||!Q.phong)return root;
  root.traverse(o=>{ if(!(o.isMesh||o.isInstancedMesh))return;
    const arr=Array.isArray(o.material)?o.material:[o.material];
    const out=arr.map(m=>{ if(!m||!(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial))return m;
      let n=_cheap.get(m); if(n)return n;
      n=new THREE.MeshPhongMaterial({color:m.color,map:m.map,emissive:m.emissive,
        transparent:m.transparent,opacity:m.opacity,side:m.side,fog:m.fog,
        shininess:Math.max(5,(1-(m.roughness==null?.6:m.roughness))*70),

const TOOLS=['physgun','weld','remove','dup','balloon'];
let toolIdx=0;
const tool=()=>TOOLS[toolIdx];
let grab=null, grabDist=6, weldA=null, fireLatch=false;
const _v=new THREE.Vector3(), _v2=new THREE.Vector3();
function camDir(out){ out.set(0,0,-1).applyQuaternion(camera.quaternion);return out; }
function aimProp(){
  const from=new CANNON.Vec3(camera.position.x,camera.position.y,camera.position.z);
  camDir(_v);
  const to=new CANNON.Vec3(from.x+_v.x*20,from.y+_v.y*20,from.z+_v.z*20);
  const res=new CANNON.RaycastResult();
  world.raycastClosest(from,to,{skipBackfaces:true},res);
  if(res.hasHit&&res.body&&res.body.userData&&res.body.userData.prop)
    return{p:res.body.userData.prop,dist:res.distance||from.distanceTo(res.hitPointWorld)};
  return null;}
function doGrabStart(){
  const a=aimProp();if(!a)return;
  if(tool()==='physgun'){ grab=a.p; grabDist=clamp(a.dist,1.8,16);
    if(grab.frozen)freezeProp(grab,false);
    grab.body.wakeUp(); grab.body.angularDamping=.85; }
  else if(tool()==='remove'){ removeProp(a.p); toast(T('tRemoved')); }
  else if(tool()==='weld'){
    if(!weldA){ weldA=a.p; toast(T('tWeldPick')); }
    else{ if(weld(weldA,a.p))toast(T('tWeld')); weldA=null; } }
  else if(tool()==='dup'){
    const q=a.p.body.quaternion;
    camDir(_v);
    const np=spawnProp(a.p.kind,{x:a.p.body.position.x+_v.x*1.6,y:a.p.body.position.y+1.4,z:a.p.body.position.z+_v.z*1.6},q);
    if(np)toast(T('tDup')); }
  else if(tool()==='balloon'){ tieBalloon(a.p); } }
function doGrabEnd(){ if(grab){ grab.body.angularDamping=.06; grab=null; } }
function grabStep(dt){
  if(!grab)return;
  camDir(_v);
  const tx=camera.position.x+_v.x*grabDist, ty=camera.position.y+_v.y*grabDist, tz=camera.position.z+_v.z*grabDist;
  const b=grab.body;
  // resorte por velocidad: mueve el prop y EMPUJA a lo que se le cruce (como la physgun)
  const k=13;
  b.velocity.x=(tx-b.position.x)*k; b.velocity.y=(ty-b.position.y)*k; b.velocity.z=(tz-b.position.z)*k;
  const vm=Math.hypot(b.velocity.x,b.velocity.y,b.velocity.z);
  if(vm>34){const s=34/vm;b.velocity.x*=s;b.velocity.y*=s;b.velocity.z*=s;}
  b.wakeUp();
  if(K.rot||HOLD.rot){ // GIRAR: mirar rota el prop en vez de la cámara
    b.angularVelocity.set(rotV.y,rotV.x,0);
  } else b.angularVelocity.scale(.55,b.angularVelocity);
}
const rotV={x:0,y:0};

function tieBalloon(p){
  const bp=p.body.position;
  const r=.55;
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),
    new THREE.MeshStandardMaterial({color:0xff4f7b,roughness:.25,metalness:.05}));
  mesh.castShadow=Q.shadow>0;cheapMats(mesh);scene.add(mesh);
  const body=new CANNON.Body({mass:.7,material:MAT.prop,shape:new CANNON.Sphere(r),
    linearDamping:.55,angularDamping:.7});
  body.position.set(bp.x,bp.y+3.2,bp.z);
  world.addBody(body);
  const bp2={mesh,body,kind:'balloon',frozen:false,mass:.7,lift:true};
  body.userData={prop:bp2};
  PROPS.push(bp2);
  const c=new CANNON.DistanceConstraint(p.body,body,3.2);
  world.addConstraint(c);CONSTR.push({c,a:p,b:bp2});
  p.body.wakeUp();toast(T('tBalloon'));syncInfo();}

function syncInfo(){ const e=$('pInfo');if(e)e.textContent='props '+PROPS.length+'/'+Q.maxProps; }
/* glifo + icono generado por herramienta */
const TICO={physgun:['✥','phys'],weld:['🔗','weld'],remove:['🗑','trash'],
  dup:['✚','spawn'],balloon:['🎈',''],freeze:['❄','freeze'],unfreeze:['🔥','']};
function icoHTML(k,cls){ const[g,n]=TICO[k]||['🔧','tool'];
  return '<span class="'+cls+(n?' gl gi-'+n:'')+'">'+g+'</span>'; }
function syncTool(){ const e=$('pTool');if(!e)return;
  const t=tool(),[g,n]=TICO[t]||['🔧','tool'],i=e.querySelector('i');
  i.textContent=g; i.className=n?'gl gi-'+n:'gx';
  e.querySelector('span').textContent=T(t==='dup'?'dup':t);}
function showScreen(n){ ['sLang','sQual','sTitle','sHelp','sPause'].forEach(i=>$(i).classList.add('hide'));
  if(n)$(n).classList.remove('hide');
  const play=(n===null);
  $('hud').classList.toggle('on',play);
  $('hud').classList.toggle('tch',play&&touchDev);
  $('touch').classList.toggle('on',play&&touchDev);}
function applyLang(){
  LANG=SV.lang||'es';
  $('tTag').textContent=T('tag');$('bPlay').textContent=T('play');
  $('bHelp').textContent=T('help');$('bQual').textContent=T('qual');
  $('qTitle').textContent=T('qTitle');$('qSub').textContent=T('qSub');
  $('qUld').innerHTML=T('quld')+'<small>'+T('quldD')+'</small>';
  $('qLow').innerHTML=T('qlow')+'<small>'+T('qlowD')+'</small>';
  $('qHigh').innerHTML=T('qhigh')+'<small>'+T('qhighD')+'</small>';
  $('hTitle').textContent=T('hTitle');$('hBody').innerHTML=T('hBody');
  $('hClose').textContent=T('close');
  $('pTitle2').textContent=T('pause');$('pResume').textContent=T('resume');
  $('pClear').textContent=T('clear');$('pHelp').textContent=T('help');$('pMenu').textContent=T('menu');
  $('spTitle').textContent=T('spawn');$('tlTitle').textContent=T('tools');
  $('spawnclose').textContent=T('close');
  $('pHint').textContent=T('tHint');
  buildSpawnUI();syncTool();syncInfo();}
function buildSpawnUI(){
  const g=$('grid');g.innerHTML='';
  for(const k of KIND_ORDER){ const b=document.createElement('button');b.className='pitem';b.dataset.kind=k;
    b.innerHTML='<span class="ic'+(k==='crate'?' gl gi-crate':'')+'">'+KINDS[k].ico+'</span>'+T(k);
    b.addEventListener('click',()=>{spawnAhead(k);});
    g.appendChild(b); }
  const t=$('tools');t.innerHTML='';
  for(const k of TOOLS){ const b=document.createElement('button');b.className='pitem';b.dataset.tool=k;
    b.innerHTML=icoHTML(k,'ic')+T(k==='dup'?'dup':k);
    b.addEventListener('click',()=>{toolIdx=TOOLS.indexOf(k);weldA=null;syncTool();closeSpawn();});
    t.appendChild(b); }
  const extra=[['freeze',()=>{const a=aimProp();if(a){freezeProp(a.p,!a.p.frozen);toast(T('tFroze'));}}],
    ['unfreeze',()=>{const n=unfreezeAll();toast(T('tUnfroze')+n);}]];
  for(const[k,fn]of extra){ const b=document.createElement('button');b.className='pitem';b.dataset.tool=k;
    b.innerHTML=icoHTML(k,'ic')+T(k);
    b.addEventListener('click',()=>{fn();closeSpawn();});t.appendChild(b); }}
function spawnAhead(kind){
  camDir(_v);
  const p=spawnProp(kind,{x:camera.position.x+_v.x*4.2,y:camera.position.y+_v.y*4.2+.4,z:camera.position.z+_v.z*4.2});
  if(p){p.body.velocity.set(_v.x*2,.5,_v.z*2);closeSpawn();}}
function openSpawn(){ if(APP!=='play')return; $('spawn').classList.add('on'); }
function closeSpawn(){ $('spawn').classList.remove('on'); }
$('spawnclose').addEventListener('click',closeSpawn);
$('spawn').addEventListener('click',e=>{if(e.target===$('spawn'))closeSpawn();});

document.querySelectorAll('#sLang [data-lang]').forEach(b=>b.addEventListener('click',()=>{
  SV.lang=b.dataset.lang;save();applyLang();
  document.querySelectorAll('#sQual [data-q]').forEach(x=>x.classList.toggle('sel',x.dataset.q===SV.qual));
  showScreen('sQual');}));
let qPick=SV.qual||'uld';
document.querySelectorAll('#sQual [data-q]').forEach(b=>b.addEventListener('click',()=>{
  qPick=b.dataset.q;
  document.querySelectorAll('#sQual [data-q]').forEach(x=>x.classList.toggle('sel',x===b));}));
$('qOk').addEventListener('click',()=>{
  const q=qPick;const was=SV.qual;SV.qual=q;SV.seen=true;save();
  if(q!==Q.key){setTimeout(()=>location.reload(),200);return;}
  toTitle();});
$('bPlay').addEventListener('click',()=>startPlay());
$('bHelp').addEventListener('click',()=>showScreen('sHelp'));
$('bQual').addEventListener('click',()=>{qPick=SV.qual;
  document.querySelectorAll('#sQual [data-q]').forEach(x=>x.classList.toggle('sel',x.dataset.q===SV.qual));
  showScreen('sQual');});
$('hClose').addEventListener('click',()=>{ if(APP==='play')showScreen(null); else toTitle(); });
$('pResume').addEventListener('click',()=>togglePause());
$('pClear').addEventListener('click',()=>{clearAll();toast(T('tClear'));});
$('pHelp').addEventListener('click',()=>showScreen('sHelp'));
$('pMenu').addEventListener('click',()=>{APP='title';clearAll();toTitle();});
function toTitle(){ APP='title';showScreen('sTitle'); }
function startPlay(){ APP='play';showScreen(null);closeSpawn();
  // arranque: unas cajas y barriles para que haya con qué jugar ya
  if(!PROPS.length){
    for(let i=0;i<5;i++)spawnProp('crate',{x:-3+i*1.6,y:1+((i%2)?2:0),z:6});
    for(let i=0;i<3;i++)spawnProp('barrel',{x:5+i*1.5,y:1.1,z:4});
    spawnProp('ball',{x:0,y:1,z:2}); }
  syncInfo();syncTool();
  const hint=$('pHint');hint.style.opacity=1;                 // la ayuda se desvanece sola
  clearTimeout(startPlay._h);startPlay._h=setTimeout(()=>{hint.style.opacity=0;},11000);}
function togglePause(){ if(APP==='play'){APP='pause';showScreen('sPause');}
  else if(APP==='pause'){APP='play';showScreen(null);} }

/* ================= bucle ================= */
let last=performance.now(),acc=0,TT=0;
let _fA=0,_fN=0,_fCd=0,_warm=0,_bad=0;
function adaptRes(dtMs){
  if(Q.key==='high')return;
  if(APP!=='play'){_warm=0;_fA=0;_fN=0;return;}
  if(_warm<4000){_warm+=dtMs;_fA=0;_fN=0;return;}   // arranque en caliente
  _fA+=dtMs;_fN++;if(_fCd>0)_fCd-=dtMs;
  if(_fA<1500)return;
  const fps=1000/(_fA/_fN);_fA=0;_fN=0;
  if(_fCd>0)return;
  const flr=Q.floor;let ns=resScale;
  if(fps<30){_bad++;}else{_bad=0;}
  if(_bad>=2&&resScale>flr){ns=Math.max(flr,resScale-.12);_bad=0;}
  else if(fps>50&&resScale<1)ns=Math.min(1,resScale+.06);
  if(ns!==resScale){resScale=ns;_fCd=2500;applyDpr();}}

function playerStep(dt){
  // cámara
  camera.quaternion.setFromEuler(new THREE.Euler(PL.pitch,PL.yaw,0,'YXZ'));
  // ejes de movimiento relativos a la cámara (sin inclinación)
  const cy=Math.cos(PL.yaw),sy=Math.sin(PL.yaw);
  let ix=0,iz=0;
  if(K.lf||HOLD.lf)ix-=1; if(K.rt||HOLD.rt)ix+=1;
  if(K.up||HOLD.up)iz-=1; if(K.dn||HOLD.dn)iz+=1;
  ix+=joy.dx;iz+=joy.dy;
  const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m;}
  const running=HOLD.run;
  const sp=(PL.noclip?18:(running?PL.run:PL.spd));
  // adelante = hacia donde mira: (-sin yaw, -cos yaw)
  const fx=-sy,fz=-cy, rx=cy, rz=-sy;
  const wx=fx*(-iz)+rx*ix, wz=fz*(-iz)+rz*ix;
  if(PL.noclip){
    const cd=camDir(_v);
    const vy=(-iz)*cd.y*sp;
    plBody.velocity.set(wx*sp,vy+((HOLD.jump?1:0)-(HOLD.frzHold?1:0))*sp*.7,wz*sp);
    plBody.position.y=clamp(plBody.position.y,-8,YARD*1.4);
  }else{
    PL.grounded=groundCheck();
    plBody.velocity.x=wx*sp;plBody.velocity.z=wz*sp;
    if((K.jump)&&PL.grounded){plBody.velocity.y=PL.jump;K.jump=false;}
  }
  // límites del patio (por si algo se escapa)
  plBody.position.x=clamp(plBody.position.x,-YARD+1,YARD-1);
  plBody.position.z=clamp(plBody.position.z,-YARD+1,YARD-1);
  if(plBody.position.y<-6){plBody.position.set(0,PL.h+2,26);plBody.velocity.set(0,0,0);}
  camera.position.set(plBody.position.x,plBody.position.y+PL.h-PL.r,plBody.position.z);
}
function toolsStep(){
  if(K.tool){K.tool=false;toolIdx=(toolIdx+1)%TOOLS.length;weldA=null;syncTool();}
  if(K.t1){K.t1=false;toolIdx=0;syncTool();}
  if(K.t2){K.t2=false;toolIdx=1;syncTool();}
  if(K.t3){K.t3=false;toolIdx=2;syncTool();}
  if(K.menu){K.menu=false;$('spawn').classList.contains('on')?closeSpawn():openSpawn();}
  if(K.noclip){K.noclip=false;PL.noclip=!PL.noclip;
    plBody.type=PL.noclip?CANNON.Body.KINEMATIC:CANNON.Body.DYNAMIC;
    plBody.updateMassProperties();plBody.velocity.set(0,0,0);
    toast(T('tNoclip')+(PL.noclip?T('on'):T('off')));}
  if(K.frz){K.frz=false;
    if(grab){ const p=grab; doGrabEnd(); freezeProp(p,true); toast(T('tFroze')); }
    else{ const a=aimProp(); if(a){ freezeProp(a.p,!a.p.frozen); toast(T('tFroze')); } } }
  // agarrar / soltar: la acción se ejecuta UNA vez por pulsación (flanco)
  const want=!!HOLD.fire;
  if(want&&!fireLatch){ fireLatch=true; doGrabStart(); }
  if(!want){ fireLatch=false; if(grab)doGrabEnd(); }
  const cr=$('cross');if(cr)cr.classList.toggle('grab',!!grab);
}
function physStep(dt){
  // globos: empuje hacia arriba
  for(const p of PROPS)if(p.lift&&p.body.type===CANNON.Body.DYNAMIC){
    // 420 N: levanta una caja o un barril; los props pesados necesitan dos globos.
    // El empuje se apaga suave cerca del techo del patio y la subida va limitada,
    // así el globo flota arriba en vez de irse al espacio.
    const y=p.body.position.y, f=420*(1-Math.min(1,Math.max(0,(y-(BCEIL-7))/7)));
    if(f>1){p.body.applyForce(new CANNON.Vec3(0,f,0),p.body.position);p.body.wakeUp();}
    if(p.body.velocity.y>BVMAX)p.body.velocity.y=BVMAX;
    else if(y>BCEIL&&p.body.velocity.y>0)p.body.velocity.y*=.9;}
  world.step(1/60,dt,3);
  for(const p of PROPS){
    p.mesh.position.set(p.body.position.x,p.body.position.y,p.body.position.z);
    p.mesh.quaternion.set(p.body.quaternion.x,p.body.quaternion.y,p.body.quaternion.z,p.body.quaternion.w);}
}
let prevYaw=0,prevPitch=0;
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;
  adaptRes(Math.min(120,now-(frame._a||now)));frame._a=now;
  TT+=dt;
  rotV.x=(PL.yaw-prevYaw)*40; rotV.y=(PL.pitch-prevPitch)*40;
  if(HOLD.rot&&grab){ PL.yaw=prevYaw; PL.pitch=prevPitch; }   // mirar rota el prop, no la cámara
  prevYaw=PL.yaw; prevPitch=PL.pitch;
  if(APP==='play'){ playerStep(dt); toolsStep(); grabStep(dt); physStep(dt); }
  else if(APP==='title'){ // órbita del patio de fondo
    const a=TT*.08;camera.position.set(Math.cos(a)*34,14,Math.sin(a)*34);camera.lookAt(0,3,0); }
  const sky=scene.userData.sky;
  if(sky){sky.position.copy(camera.position);}
  renderer.render(scene,camera);
}

/* ================= hooks de prueba ================= */
const DEV=new URLSearchParams(location.search).has('dev');
if(DEV)window.__S={
  app:()=>APP, qual:()=>Q.key, dpr:()=>+renderer.getPixelRatio().toFixed(3),
  props:()=>PROPS.length, kinds:()=>PROPS.map(p=>p.kind),
  spawn:(k,n)=>{for(let i=0;i<(n||1);i++)spawnProp(k,{x:(i%4)*1.8-3,y:3+i*1.7,z:6});return PROPS.length;},
  spawnAt:(k,x,y,z)=>{const p=spawnProp(k,{x,y,z});return !!p;},
  play:()=>startPlay(), title:()=>toTitle(), pause:()=>togglePause(),
  setLang:l=>{SV.lang=l;applyLang();},
  clear:()=>{clearAll();return PROPS.length;},
  step:(n)=>{for(let i=0;i<(n||60);i++){
    playerStep(1/60);toolsStep();grabStep(1/60);physStep(1/60);}},
  physOnly:(n)=>{for(let i=0;i<(n||60);i++)physStep(1/60);},
  restY:()=>{ // altura de reposo del último prop (para verificar que apila)
    const p=PROPS[PROPS.length-1];return p?+p.body.position.y.toFixed(3):null;},
  bodyOf:i=>{const p=PROPS[i];return p?{y:+p.body.position.y.toFixed(3),x:+p.body.position.x.toFixed(3),
    z:+p.body.position.z.toFixed(3),frozen:p.frozen,type:p.body.type,mass:p.body.mass,
    vy:+p.body.velocity.y.toFixed(3),kind:p.kind}:null;},
  look:(y,p)=>{PL.yaw=y;PL.pitch=(p==null?0:p);
    camera.quaternion.setFromEuler(new THREE.Euler(PL.pitch,PL.yaw,0,'YXZ'));},
  tp:(x,y,z)=>{plBody.position.set(x,y,z);plBody.velocity.set(0,0,0);
    camera.position.set(x,y+PL.h-PL.r,z);},
  yaw:()=>PL.yaw,
  aimAt:i=>{const p=PROPS[i];if(!p)return false;
    const dx=p.body.position.x-camera.position.x,dy=p.body.position.y-camera.position.y,
          dz=p.body.position.z-camera.position.z, d=Math.hypot(dx,dz);
    PL.yaw=Math.atan2(-dx,-dz); PL.pitch=Math.atan2(dy,d);
    camera.quaternion.setFromEuler(new THREE.Euler(PL.pitch,PL.yaw,0,'YXZ'));return true;},
  aim:()=>{const a=aimProp();return a?{kind:a.p.kind,dist:+a.dist.toFixed(2),i:PROPS.indexOf(a.p)}:null;},
  press:(k,v)=>{K[k]=v;HOLD[k]=v;},
  tool:()=>tool(), setTool:t=>{toolIdx=Math.max(0,TOOLS.indexOf(t));weldA=null;syncTool();},
  grabbed:()=>grab?PROPS.indexOf(grab):-1, grabDist:()=>+grabDist.toFixed(2),
  setGrabDist:d=>{grabDist=d;},
  welds:()=>CONSTR.length, unfreezeAll:()=>unfreezeAll(),
  noclip:()=>PL.noclip, plY:()=>+plBody.position.y.toFixed(3),
  plType:()=>plBody.type,
  mats:()=>{let phong=0,pbr=0;scene.traverse(o=>{if(!o.material)return;
    const ms=Array.isArray(o.material)?o.material:[o.material];
    for(const m of ms){if(!m)continue;if(m.isMeshPhongMaterial)phong++;
      else if(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial)pbr++;}});
    return{phong,pbr};},
  info:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,
    bodies:world.bodies.length,maxProps:Q.maxProps,iters:world.solver.iterations,far:camera.far}),
  gi:()=>document.body.classList.contains('gi'),
  giBtns:()=>[...document.querySelectorAll('.gl[class*="gi-"]')].map(e=>
    (e.className.match(/gi-([a-z]+)/)||[])[1]),
  texed:()=>({/* en ULD lo que se dibuja es el clon Phong: mira los dos */
    floor:!!(matFloor.map||(_cheap.get(matFloor)||{}).map),
    wall:!!(matWall.map||(_cheap.get(matWall)||{}).map),
    crate:!!(matCrate.map||(_cheap.get(matCrate)||{}).map),
    barrel:!!(matBarrel.map||(_cheap.get(matBarrel)||{}).map),
    sky:!!(scene.userData.sky&&scene.userData.sky.material.map),
    px:(()=>{const t=TEX.floor;return t&&t.image?Math.max(t.image.width||0,t.image.height||0):0;})()}),
  spawnMenuOpen:()=>$('spawn').classList.contains('on'),
  openSpawn:()=>openSpawn(), closeSpawn:()=>closeSpawn(),
  gridKinds:()=>[...document.querySelectorAll('#grid .pitem')].map(b=>b.dataset.kind),
  toolBtns:()=>[...document.querySelectorAll('#tools .pitem')].map(b=>b.dataset.tool),
  touch:v=>{touchDev=!!v;showScreen(APP==='play'?null:'sTitle');},
  touchVisible:()=>$('touch').classList.contains('on'),
  hud:()=>({tool:$('pTool').querySelector('span').textContent,info:$('pInfo').textContent}),
  qBtns:()=>[...document.querySelectorAll('#sQual [data-q]')].map(b=>b.dataset.q),
  qSel:()=>[...document.querySelectorAll('#sQual [data-q].sel')].map(b=>b.dataset.q),
  qOkText:()=>$('qOk').textContent};

/* ================= arranque ================= */
(function boot(){
  applyLang();
  requestAnimationFrame(frame);
  const done=()=>{ $('load').style.display='none';
    if(!SV.lang){showScreen('sLang');}
    else if(!SV.seen){document.querySelectorAll('#sQual [data-q]').forEach(x=>x.classList.toggle('sel',x.dataset.q===SV.qual));
      showScreen('sQual');}
    else toTitle(); };
  // esperar las texturas (con techo: si el CDN no responde, se juega igual)
  let waited=0;
  const tick=()=>{ waited+=120;
    if(!texPend||texDone>=texPend||waited>9000){done();return;}
    $('loadMsg').textContent='Cargando… '+texDone+'/'+(texPend||1);
    setTimeout(tick,120); };
  setTimeout(tick,150);
})();
</script>
