/* ================= physics v2 ================= */
function update(dt){
  if((mode==="title"||mode==="maps"||mode==="time"||mode==="results")&&world){menuOrbit(dt);return;}
  if(mode==="garage"&&garageCar){garageCar.rotation.y+=dt*.5;if(garagePed)garagePed.mixer.update(dt);return;}
  if(mode!=="race"||!sess)return;
  if(typeof chatOpen!=="undefined"&&chatOpen)return; // con el chat abierto el auto queda quieto
  const s=sess,cmd=commands(),st=s.stats,M=MAPS[save.map];
  if(s.gridHold){cmd.up=false;cmd.down=false;cmd.hand=false;cmd.steer=0;s.vx*=.4;s.vz*=.4;} // congelado en la grilla
  // modo a pie: toma el control completo
  if(s.onFoot&&s.onFoot.active){
    if(consumePress("jump"))doJump(s);
    if(consumePress("punch"))doPunch(s);
    footUpdate(s,dt);return;}
  if(!s.dead&&consumePress("door")){enterFoot(s);return;}
  if(s.go>0){s.go-=dt;if(s.go<=0)document.getElementById("toast").style.opacity=0;}
  if(!s.over&&s.armed){if(s.mapMode==="drift"){s.t-=dt;if(s.t<=0){s.t=0;endSession();}}
    else s.t+=dt;}
  s.shake=Math.max(0,s.shake-dt*3*s.shake);
  for(const c of world.chimneys||[])if((s.chimT-=dt)<=0){s.chimT=.5;
    spawnPuffAt(c.x+(Math.random()-.5),c.y,c.z+(Math.random()-.5),2.2);break;}
  // muerte: el auto se rompe en pedazos con física real (tumbling) -> menú
  if(s.dead){
    s.fade+=dt;updateDebris(s,dt);
    if(Math.random()<dt*6)spawnPuffAt(s.x+(Math.random()-.5)*2.5,.5,s.z+(Math.random()-.5)*2.5,1.4);
    if(s.fade>3.4){loopsStop();sess=null;music("music_menu");buildTitle();}
    return;}

  // smoothed steering feeds the physics (heavier, less twitchy)
  s.physSteer+=(cmd.steer-s.physSteer)*Math.min(1,dt*5.2);
  s.steerVis=s.physSteer;
  const steer=s.physSteer;
  const sinH=Math.sin(s.h),cosH=Math.cos(s.h);
  let vF=s.vx*sinH+s.vz*cosH;
  let vL=s.vx*cosH-s.vz*sinH;
  const speed=Math.hypot(s.vx,s.vz);

  // surface effects
  let surfGrip=1,surfAccel=1,offroad=false;
  if(world.ice)for(const z of world.ice){const dx=s.x-z.x,dz=s.z-z.z;
    if(dx*dx+dz*dz<z.r*z.r){surfGrip=.25;surfAccel=.55;break;}}
  if(world.road){ // forest race: off the asphalt = heavy drag
    const R=world.road;let best=1e9,bi=s.roadIdx;
    for(let k=-40;k<=40;k++){const j=((s.roadIdx+k)%R.n+R.n)%R.n;
      const dx=R.P[j].x-s.x,dz=R.P[j].z-s.z;const d2=dx*dx+dz*dz;
      if(d2<best){best=d2;bi=j;}}
    s.roadIdx=bi;
    offroad=Math.sqrt(best)>R.halfW+ .6;}

  // progressive acceleration toward each car's own top speed (con turbo del power-up)
  const boost=s.boostT>0?1.38:1, topB=st.top*boost;
  if(s.over)vF-=vF*1.2*dt;
  else if(cmd.up){const launch=.32+.68*Math.min(1,Math.max(vF,0)/9); // salida lenta realista
    vF+=st.accel*boost*Math.max(0,1-Math.max(vF,0)/topB)*1.5*launch*surfAccel*dt;}
  else if(cmd.down)vF-=(vF>1?42:12)*dt;
  else vF-=vF*.4*dt;
  if(offroad&&!s.gridHold){vF-=vF*1.5*dt;s.shake=Math.min(.4,s.shake+dt);}
  vF=Math.max(-8,Math.min(vF,topB));

  let grip=st.grip*surfGrip;
  const hand=cmd.hand&&!s.over;
  if(hand&&s.speed>6)s.hbDrift=true; // el derrape puntúa solo si nació del freno de mano
  /* tap corto a la mano con gas = modo derrape sostenido (estilo Asphalt 9) */
  if(hand&&!s.handPrev)s.handT=0;
  if(hand)s.handT+=dt;
  if(!hand&&s.handPrev&&s.handT<.28&&cmd.up&&s.speed>8){
    s.autoDrift=true;s.hbDrift=true;
    if(Math.abs(steer)>.05)vL-=steer*st.kick*Math.max(vF,0)*.2; // patada inicial suave
  }
  s.handPrev=hand;
  if(s.autoDrift){s.nsT=Math.abs(steer)<.15?(s.nsT||0)+dt:0;
    if(cmd.down||s.speed<4.5||s.nsT>.6)s.autoDrift=false;} // soltás la dirección = lo controlaste
  if(hand)grip*=.18;
  else if(s.autoDrift)grip*=(Math.abs(s.beta)>.6?.8:.28); // sostenido pero estable: si pasa de ~35° recupera agarre
  else if(cmd.up&&Math.abs(steer)>.5&&vF>12)grip*=.72;
  vL-=vL*Math.min(1,grip*dt);
  if(hand&&Math.abs(steer)>.05)vL-=steer*st.kick*Math.max(vF,0)*.7*dt;
  if(s.autoDrift&&Math.abs(steer)>.1)vL-=steer*st.kick*Math.max(vF,0)*.3*dt;
  // slide scrubs a little forward speed — manage the angle to keep momentum
  vF-=Math.abs(vL)*.2*dt*Math.sign(Math.max(vF,0));

  const beta=Math.atan2(vL,Math.max(Math.abs(vF),.6));
  const driftFactor=Math.min(Math.abs(beta)*1.4,1);
  s.h+=steer*st.turn*dt*Math.max(-1,Math.min(vF/8,1))*(1+driftFactor*.65)*(s.airborne?.18:1);
  s.h-=beta*.55*dt;
  s.vx=sinH*vF+cosH*vL;s.vz=cosH*vF-sinH*vL;
  s.x+=s.vx*dt;s.z+=s.vz*dt;
  s.beta=beta;s.speed=Math.hypot(s.vx,s.vz);

  /* collisions */
  let hit=false;const pvx=s.vx,pvz=s.vz;
  const B=world.bounds;
  if(B){if(s.x<-B.W){s.x=-B.W;s.vx=Math.abs(s.vx)*.35;hit=speed>7;}
    if(s.x>B.W){s.x=B.W;s.vx=-Math.abs(s.vx)*.35;hit=hit||speed>7;}
    if(s.z<-B.D){s.z=-B.D;s.vz=Math.abs(s.vz)*.35;hit=hit||speed>7;}
    if(s.z>B.D){s.z=B.D;s.vz=-Math.abs(s.vz)*.35;hit=hit||speed>7;}}
  const _cand=(s.y>1.1?[]:queryColliders(s.x,s.z,CFG.carR+2))||world.colliders.map((_,i)=>i);
  for(const _ci of _cand){const c=world.colliders[_ci];
    if(c.type==="circle"){const dx=s.x-c.x,dz=s.z-c.z,d=Math.hypot(dx,dz),m=c.r+CFG.carR;
      if(d<m&&d>1e-4){s.x=c.x+dx/d*m;s.z=c.z+dz/d*m;
        const dot=(s.vx*dx+s.vz*dz)/d;
        if(dot<0){s.vx-=1.5*dot*dx/d;s.vz-=1.5*dot*dz/d;s.vx*=.88;s.vz*=.88;hit=hit||speed>7;}}}
    else if(c.type==="capsule"){
      const abx=c.bx-c.ax,abz=c.bz-c.az;
      const tt=Math.max(0,Math.min(1,((s.x-c.ax)*abx+(s.z-c.az)*abz)/(abx*abx+abz*abz)));
      const qx=c.ax+abx*tt,qz=c.az+abz*tt;
      const dx=s.x-qx,dz=s.z-qz,d=Math.hypot(dx,dz),m=c.r+CFG.carR;
      if(d<m&&d>1e-4){s.x=qx+dx/d*m;s.z=qz+dz/d*m;
        const dot=(s.vx*dx+s.vz*dz)/d;
        if(dot<0){s.vx-=1.5*dot*dx/d;s.vz-=1.5*dot*dz/d;s.vx*=.88;s.vz*=.88;hit=hit||speed>7;}}}
    else{const dx=s.x-c.x,dz=s.z-c.z;
      const lx=dx*c.cos-dz*c.sin,lz=dx*c.sin+dz*c.cos;
      const px2=Math.max(-c.hw,Math.min(lx,c.hw)),pz2=Math.max(-c.hd,Math.min(lz,c.hd));
      const ddx=lx-px2,ddz=lz-pz2,d=Math.hypot(ddx,ddz);
      if(d<CFG.carR){
        const push=(CFG.carR-d)||CFG.carR;
        let nx,nz;
        if(d>1e-4){nx=ddx/d;nz=ddz/d;}
        else{const ex=c.hw-Math.abs(lx),ez=c.hd-Math.abs(lz);
          if(ex<ez){nx=Math.sign(lx)||1;nz=0;}else{nx=0;nz=Math.sign(lz)||1;}}
        const wx=nx*c.cos+nz*c.sin,wz=-nx*c.sin+nz*c.cos;
        s.x+=wx*push;s.z+=wz*push;
        const dot=s.vx*wx+s.vz*wz;
        if(dot<0){s.vx-=1.6*dot*wx;s.vz-=1.6*dot*wz;s.vx*=.85;s.vz*=.85;hit=hit||speed>7;}}}}
  if(hit){
    // fuerza del impacto = cuánta velocidad se perdió de golpe
    const dvx=s.vx-pvx,dvz=s.vz-pvz,dv=Math.hypot(dvx,dvz);
    const imp=Math.min(1,(speed-6)/26);
    dryHit(Math.max(.2,imp*1.1),.85+Math.random()*.2);
    s.shake=Math.min(1,.3+imp);
    if(s.mapMode==="drift"&&s.cur>0){s.cur=0;s.combo=1;s.driftT=0;toast(L.comboLost,"var(--red)");}
    if(dv>3&&!s.dead&&s.shieldT<=0){ // daño acumulativo: el auto aguanta ~15 golpes (escudo lo anula)
      const dmg=Math.min(13,Math.max(4,dv*1.0)); // golpe fuerte ~13 (mín 8 golpes), normal ~6-7 (~15 golpes)
      s.hp=Math.max(0,s.hp-dmg);
      const dir=dv>1e-3?{x:dvx/dv,z:dvz/dv}:{x:0,z:1};
      deformCar(s,dir,Math.min(.6,dv/34)); // abolladura más chica y localizada (no se destruye tanto)
      if(dmg>8)for(let k=0;k<3;k++)spawnPuffAt(s.x,.6,s.z,1.4);
      if(s.hp<=0)killPlayer(s);}}
  /* choque contra los autos/peatones de los otros jugadores (mutuo, con abolladura) */
  if(typeof ghostCollide==="function")ghostCollide(s,dt);
  if(world.hazards&&world.hazards.length)updateHazards(s,dt);
  updatePowerups(s,dt);tickEffects(s,dt);

  /* trampa: engranajes giran, palanca activa la compuerta de cristal */
  if(dyPit){updateGearPit(dt,s.x,s.z);
    if(dyPit.near&&consumePress("activate")){dyPit.open=!dyPit.open;sfx("sfx_pop",.55,.65);
      toast(dyPit.open?"⚙ TRITURADORA ON":"⚙ CERRADO",dyPit.open?"var(--red)":"var(--yel)");}}

  /* circuito aéreo: pista elevada con cercas (piso a distinta altura) */
  const sf=dySky?skyFloor(s.x,s.z,s.y):null;
  if(sf){
    // cercas laterales SOLO en el tramo elevado (a nivel del piso queda ABIERTO para entrar/salir)
    if(!sf.ground){const lim=dySky.hw-1.1;
      if(sf.across>lim){const d=sf.across-lim;s.x-=sf.lf.x*d;s.z-=sf.lf.z*d;const dot=s.vx*sf.lf.x+s.vz*sf.lf.z;if(dot>0){s.vx-=dot*sf.lf.x*1.4;s.vz-=dot*sf.lf.z*1.4;}}
      else if(sf.across<-lim){const d=-lim-sf.across;s.x+=sf.lf.x*d;s.z+=sf.lf.z*d;const dot=s.vx*sf.lf.x+s.vz*sf.lf.z;if(dot<0){s.vx-=dot*sf.lf.x*1.4;s.vz-=dot*sf.lf.z*1.4;}}}
    // soporte vertical PEGADO a la rampa (banda amplia -> no rebota ni se siente como escalera)
    if(s.y<=sf.y+0.6&&s.vy<=0.5){s.y=sf.y;s.vy=0;s.airborne=false;}
    else{s.airborne=true;s.vy-=GRAV*dt;s.y+=s.vy*dt;
      if(s.y<=sf.y){const land=-s.vy;s.y=sf.y;s.vy=0;s.airborne=false;
        if(land>6){s.shake=Math.min(1,.3+land/22);}}}
    s.obj.position.set(s.x,s.y,s.z);
    const pitchT2=s.airborne?Math.max(-.5,Math.min(.5,-s.vy*.03)):0;
    s.airPitch+=(pitchT2-s.airPitch)*.14;
  } else {
  /* rampas + física vertical (saltos con aterrizaje) + caída al pozo */
  {const rmps=world.ramps;let onR=false,surf=0,slope=0;
   const inPit=overOpenPit(s.x,s.z);
   if(rmps&&!inPit)for(const r of rmps){
     const dx=s.x-r.x,dz=s.z-r.z;
     const along=dx*r.sin+dz*r.cos, across=dx*r.cos-dz*r.sin;
     if(across>-r.hw&&across<r.hw&&along>-1.2&&along<r.len){
       const h=Math.max(0,Math.min(1,along/r.len))*r.rise;
       if(h>surf){surf=h;slope=r.rise/r.len;onR=true;}}}
   if(onR){s.y=Math.max(s.y,surf);
     // lanzamiento por FÍSICA real: vy = velocidad × pendiente (tan del ángulo) → altura ∝ velocidad²
     if(vF>3)s.vy=Math.max(s.vy,vF*slope);
     s.airborne=s.y>.15;}
   else if(inPit){s.airborne=true;s.vy-=GRAV*dt;s.y+=s.vy*dt; // caés a la trituradora
     if(s.y<-(world.pit.DEPTH-3.5)&&!s.dead){s.y=-(world.pit.DEPTH-3.5);
       dryHit(1,.55);s.hp=0;deformCar(s,{x:0,z:1},1);killPlayer(s);}}
   else if(s.y>0||s.vy>0){s.airborne=true;s.vy-=GRAV*dt;s.y+=s.vy*dt;
     if(s.y<=0){const land=-s.vy;s.y=0;s.vy=0;s.airborne=false;
       if(land>4){s.shake=Math.min(1,.3+land/22);for(let k=0;k<2;k++)spawnPuffAt(s.x+(Math.random()-.5)*1.5,.4,s.z+(Math.random()-.5)*1.5,1.2);
         sfx(land>9?"sfx_crash":"sfx_crash_soft",Math.min(1,land/16),.85+Math.random()*.2);}}}
   else{s.airborne=false;s.y=0;s.vy=0;}
   const pitchT=s.airborne?Math.max(-.5,Math.min(.5,-s.vy*.03)):0;
   s.airPitch+=(pitchT-s.airPitch)*Math.min(1,dt*7);}
  } // fin del piso normal (else de la pista aérea)

  /* scoring */
  const betaDeg=Math.abs(beta)*57.29578;
  if(betaDeg<CFG.driftMinDeg){s.hbGap=(s.hbGap||0)+dt;
    if(s.hbGap>.5)s.hbDrift=false;
    if(s.hbGap>.45)s.autoDrift=false;}
  else s.hbGap=0;
  const drifting=!s.over&&s.hbDrift&&betaDeg>CFG.driftMinDeg&&s.speed>CFG.driftMinV;
  if(s.mapMode==="drift"){
    if(drifting){s.driftT+=dt;s.gapT=0;
      s.combo=Math.min(5,s.combo+dt*.22);
      s.cur+=s.speed*betaDeg*.10*dt*s.combo;}
    else if(s.cur>0){s.gapT+=dt;
      if(s.gapT>CFG.bankGap){const pts=Math.round(s.cur);
        s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);
        s.cur=0;s.combo=1;s.driftT=0;
        sfx("sfx_chime",.7,1.2);toast("+"+fmtN(pts),"var(--yel)");}}}
  else if(s.armed){ // race checkpoints (solo cuando la carrera está largada)
    const cps=world.checkpoints;
    const c=cps[s.cp];
    const dx=s.x-c.x,dz=s.z-c.z;
    if(dx*dx+dz*dz<c.r*c.r){
      s.cp++;sfx("sfx_chime",.5,1.4);
      if(s.cp>=cps.length){s.cp=0;s.lap++;
        const lt=s.t-s.lapStart;s.lapStart=s.t;
        if(s.lap>0){s.lapTimes.push(lt);
          if(s.bestLapT===null||lt<s.bestLapT)s.bestLapT=lt;}
        if(s.lap>=s.laps)endSession();
        else toast(s.lap===s.laps-1?L.finalLap:`${L.lap} ${s.lap+1}/${s.laps}`,"var(--yel)");}}}

  engineSet(Math.min(1,Math.abs(vF)/st.top));
  skidSet(drifting?Math.min(1,betaDeg/40)*(s.speed/st.top+.4):0);
  if(drifting&&s.speed>7){spawnSmoke(s);writeMark(s);}

  /* car placement + chase camera */
  s.obj.position.set(s.x,s.y||0,s.z);
  s.obj.rotation.set(0,s.h,0);
  if(s.airPitch)s.obj.rotateX(s.airPitch); // morro arriba/abajo en el aire
  s.obj.rotateZ(-s.steerVis*.04*Math.min(1,s.speed/22));
  /* ruedas: giro por velocidad + dirección en las delanteras (ms corrige el lado espejado) */
  s.wheelSpin-=vF/s.wheelR*dt;
  for(const w of s.wheels){
    const ms=w.userData.ms||1;
    if(w.name==="dyw_f")w.rotation.y=s.steerVis*.42*ms;
    w.children[0].rotation.x=s.wheelSpin*ms;}
  /* la sombra sigue al coche (mapas grandes > frustum fijo) */
  if(world.sunOff){sun.position.set(s.x+world.sunOff.x,world.sunOff.y,s.z+world.sunOff.z);
    sun.target.position.set(s.x,0,s.z);sun.target.updateMatrixWorld();}
  let dyaw=s.h-s.camYaw;while(dyaw>Math.PI)dyaw-=2*Math.PI;while(dyaw<-Math.PI)dyaw+=2*Math.PI;
  s.camYaw+=dyaw*Math.min(1,dt*4.4);
  if(save.cam){ // ---- PRIMERA PERSONA (capó) ----
    const sh=Math.sin(s.h),ch=Math.cos(s.h);
    camera.position.set(s.x+sh*.25,1.02+(s.y||0),s.z+ch*.25);
    if(s.shake>.02){camera.position.x+=(Math.random()-.5)*.28*s.shake;camera.position.y+=(Math.random()-.5)*.2*s.shake;}
    if(world.sky){world.sky.position.x=camera.position.x;world.sky.position.z=camera.position.z;}
    camera.lookAt(s.x+sh*14,1.0+(s.y||0),s.z+ch*14);
    const fovT=CFG.fovBase+9+(CFG.fovMax-CFG.fovBase)*Math.min(1,s.speed/st.top);
    camera.fov+=(fovT-camera.fov)*.06;camera.updateProjectionMatrix();
  }else{ // ---- TERCERA PERSONA (chase) ----
  const cx=s.x-Math.sin(s.camYaw)*7.8*camZoom,cz=s.z-Math.cos(s.camYaw)*7.8*camZoom;
  // la cámara sigue la altura del auto por completo (para pistas elevadas / circuito aéreo)
  camera.position.lerp(V.set(cx,(s.y||0)+3.1*camZoom,cz),1-Math.pow(.0001,dt));
  {const ddx=camera.position.x-s.x,ddz=camera.position.z-s.z;
   const d=Math.hypot(ddx,ddz);
   if(d<5.5*camZoom){const k=5.5*camZoom/Math.max(d,.001);
     camera.position.x=s.x+ddx*k;camera.position.z=s.z+ddz*k;}
   camera.position.y=Math.max(camera.position.y,(s.y||0)+2.4);}
  if(world.sky){world.sky.position.x=camera.position.x;world.sky.position.z=camera.position.z;}
  if(s.shake>.02){camera.position.x+=(Math.random()-.5)*.4*s.shake;
    camera.position.y+=(Math.random()-.5)*.25*s.shake;}
  camera.lookAt(s.x+Math.sin(s.h)*3,(s.y||0)+1.1,s.z+Math.cos(s.h)*3);
  const fovT=CFG.fovBase+(CFG.fovMax-CFG.fovBase)*Math.min(1,s.speed/st.top);
  camera.fov+=(fovT-camera.fov)*.06;camera.updateProjectionMatrix();}
}
let orbitA=0,shotT=0,shotIx=0;
// varias tomas de cámara para el fondo de los menús (aérea, barrido bajo, grúa, ángulo cerrado)
const SHOTS=[
  {r0:105,y:42,ly:0,fov:52,spin:.05,dur:8},
  {r0:56,y:7,ly:4,fov:61,spin:.11,dur:7},
  {r0:38,r1:96,y:22,ly:2,fov:55,spin:.06,dur:9},
  {r0:46,y:12,ly:3,fov:63,spin:-.09,dur:7}];
function menuOrbit(dt){
  shotT+=dt;let i=SHOTS[shotIx%SHOTS.length];
  if(shotT>i.dur){shotT=0;shotIx=(shotIx+1)%SHOTS.length;i=SHOTS[shotIx%SHOTS.length];}
  orbitA+=dt*(i.spin||.055);
  const r=i.r1!=null?i.r0+(i.r1-i.r0)*(0.5-0.5*Math.cos(shotT/i.dur*Math.PI)):i.r0;
  const cut=shotT<0.5?Math.min(1,dt*3.2):Math.min(1,dt*1.3); // corte más rápido al empezar cada toma
  camera.position.lerp(V.set(Math.cos(orbitA)*r,i.y,Math.sin(orbitA)*r),cut);
  camera.lookAt(0,i.ly||0,0);
  if(world&&world.sky){world.sky.position.x=camera.position.x;world.sky.position.z=camera.position.z;}
  camera.fov+=(i.fov-camera.fov)*.05;camera.updateProjectionMatrix();
  if(world&&world.chimneys)for(const c of world.chimneys){
    if(Math.random()<dt*2)spawnPuffAt(c.x,c.y,c.z,2.2);}}

/* ================= skid marks ================= */
let MARKN=2200;   // se recorta al presupuesto del preset en initMarks()
let markGeo=null,markHead=0;
function initMarks(){
  MARKN=Math.max(120,Math.min(2200,QP.marks|0));   // ULD: 420 quads en vez de 2200
  markGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(MARKN*4*3);
  const idx=new Uint32Array(MARKN*6);
  for(let i=0;i<MARKN;i++){const a=i*4;idx.set([a,a+2,a+1,a+1,a+2,a+3],i*6);}
  markGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  markGeo.setIndex(new THREE.BufferAttribute(idx,1));
  const m=new THREE.Mesh(markGeo,new THREE.MeshBasicMaterial({color:0x131215,
    transparent:true,opacity:.5,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2}));
  m.frustumCulled=false;scene.add(m);}
let lastMark={x:0,z:0,h:0,has:false};
// lm = "último punto" de ESTA fuente: vos usás el global, cada jugador remoto trae el suyo
function writeMark(s,lm){
  const M=lm||lastMark;
  if(M.has&&Math.hypot(s.x-M.x,s.z-M.z)<.6)return;
  const pos=markGeo.attributes.position.array;
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1]){
    const w=.78*side;
    const rx=s.x-sh*1.4+ch*w,rz=s.z-ch*1.4-sh*w;
    const lx=M.has?M.x-Math.sin(M.h)*1.4+Math.cos(M.h)*w:rx-sh*.6,
          lz=M.has?M.z-Math.cos(M.h)*1.4-Math.sin(M.h)*w:rz-ch*.6;
    const j=markHead=(markHead+1)%MARKN,o=j*12;
    const px=ch*.14,pz=-sh*.14;
    pos[o]=lx-px;pos[o+1]=.04;pos[o+2]=lz-pz;
    pos[o+3]=lx+px;pos[o+4]=.04;pos[o+5]=lz+pz;
    pos[o+6]=rx-px;pos[o+7]=.04;pos[o+8]=rz-pz;
    pos[o+9]=rx+px;pos[o+10]=.04;pos[o+11]=rz+pz;}
  markGeo.attributes.position.needsUpdate=true;
  M.x=s.x;M.z=s.z;M.h=s.h;M.has=true;}
function clearMarks(){if(!markGeo)return;
  markGeo.attributes.position.array.fill(0);
  markGeo.attributes.position.needsUpdate=true;lastMark.has=false;}

/* ================= smoke ================= */
const SMOKEN=320;   // el preset limita cuántas se usan (SMOKE_USE)
let smokeGeo=null,smokeHead=0,smokeMat=null;
const smokeLife=new Float32Array(SMOKEN),smokeVel=new Float32Array(SMOKEN*3);
function initSmoke(){
  smokeGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(SMOKEN*3);pos.fill(-9999);
  smokeGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  smokeMat=new THREE.PointsMaterial({map:smokeTex,size:QP.smokeSize||3.6,
    transparent:true,opacity:.3,depthWrite:false,color:0xd8d5d0});
  const p=new THREE.Points(smokeGeo,smokeMat);
  p.frustumCulled=false;scene.add(p);}
function spawnPuffAt(x,y,z,vy=1.6){
  // el anillo se acota al presupuesto del preset: BAJA recicla antes y usa menos partículas
  const j=smokeHead=(smokeHead+1)%Math.max(24,Math.min(SMOKEN,QP.smoke)),o=j*3;
  const pos=smokeGeo.attributes.position.array;
  pos[o]=x;pos[o+1]=y;pos[o+2]=z;
  smokeVel[o]=(Math.random()-.5)*.8;smokeVel[o+1]=vy+Math.random();smokeVel[o+2]=(Math.random()-.5)*.8;
  smokeLife[j]=2.2;}
function spawnSmoke(s){
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1])
    spawnPuffAt(s.x-sh*1.4+ch*.8*side,.3,s.z-ch*1.4-sh*.8*side,1.1+Math.random());}
function updateSmoke(dt){let any=false;
  const pos=smokeGeo.attributes.position.array;
  for(let j=0;j<SMOKEN;j++){if(smokeLife[j]<=0)continue;any=true;
    smokeLife[j]-=dt;const o=j*3;
    pos[o]+=smokeVel[o]*dt;pos[o+1]+=smokeVel[o+1]*dt;pos[o+2]+=smokeVel[o+2]*dt;
    if(smokeLife[j]<=0)pos[o+1]=-9999;}
  if(any)smokeGeo.attributes.position.needsUpdate=true;}
function clearSmoke(){if(!smokeGeo)return;
  smokeGeo.attributes.position.array.fill(-9999);smokeLife.fill(0);
  smokeGeo.attributes.position.needsUpdate=true;}

function toast(t,color){elToast.textContent=t;elToast.style.color=color||"var(--yel)";
  elToast.style.opacity=1;toastT=1.3;}
function fmtN(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function fmtT(s){if(s==null)return"--:--";const m=Math.floor(s/60);
  return`${m}:${(s-m*60).toFixed(1).padStart(4,"0")}`;}
function drawHud(dt){if(!sess)return;
  {const fr=sess.freeroam&&!sess.armed&&(!RACE||RACE.phase!=="lobby"&&RACE.phase!=="grid");
   const rb=document.getElementById("racebtn");if(rb)rb.style.display=fr?"block":"none";}

    elArrow.style.display="block";
    elArrow.style.transform=`translateX(-50%) rotate(${(-ang*57.3).toFixed(0)}deg)`;}
  elKmh.textContent=Math.round(sess.speed*3.6);

function menuNav(){

  if(mode==="race"){const keep=[];
    while(pressed.length){const c=pressed.shift();
      if(c==="pause")togglePause();
      else if(c==="door"||c==="jump"||c==="punch"||c==="activate")keep.push(c);}

  while(pressed.length){const c=pressed.shift();

    if(c==="right"){cycleCar(1);continue;}

    if(c==="back"||c==="pause"){buildMaps();continue;}}

  if(c==="up"||c==="left"){focusIdx=(focusIdx-1+focusList.length)%focusList.length;refreshFocus();}
  if(c==="down"||c==="right"){focusIdx=(focusIdx+1)%focusList.length;refreshFocus();}
  if(c==="ok"){const b=focusList[focusIdx];if(b)b.click();}

/* ===== CULLING por distancia + LOD =====
   El frustum culling de three ya descarta lo que no entra en cámara; esto además
   descarta lo que está DEMASIADO LEJOS y baja el detalle a media distancia. */
let cullAcc=0;
function cullWorld(dt){
  if(!world||!world.group)return;
  cullAcc+=dt; if(cullAcc<.22)return; cullAcc=0;
  const cx=camera.position.x, cz=camera.position.z;
  const far=QP.cullDist, far2=far*far, mid2=(far*.55)*(far*.55);
  const _bb=new THREE.Box3(), _sz=new THREE.Vector3();
  for(const o of world.group.children){
    if(o.userData.noCull){o.visible=!o.userData.forceHide;continue;}
    if(o.isInstancedMesh){
      if(o.userData.chunk){   // chunk de props: se descarta por distancia como cualquier objeto
        const dx=o.userData.cx-cx, dz=o.userData.cz-cz, d2=dx*dx+dz*dz;
        o.visible=d2<far2; }
      else o.visible=true;    // instancia global (pista, muros): siempre
      continue;}
    // el radio se mide UNA vez: los objetos grandes (piso, muros, cielo) nunca se cullean por
    // distancia, porque su origen está lejos aunque la malla te rodee
    if(o.userData._big===undefined){
      try{ _bb.setFromObject(o); _bb.getSize(_sz);
        o.userData._big=Math.max(_sz.x,_sz.z)>36; }catch(e){ o.userData._big=true; } }
    if(o.userData._big){o.visible=true;continue;}
    if(o.matrixAutoUpdate){o.updateMatrix();o.matrixAutoUpdate=false;}   // estático: no recalcular cada frame
    const dx=o.position.x-cx, dz=o.position.z-cz, d2=dx*dx+dz*dz;
    o.visible=d2<far2;
    if(o.visible&&o.userData.detail)o.userData.detail.visible=d2<mid2;   // LOD: detalle sólo de cerca
  }
}
/* ===== resolución ADAPTATIVA: si el equipo no llega a 30 fps, baja píxeles;
       si le sobra, los devuelve. Es lo que más se nota en gama baja. ===== */
let _fpsAcc=0,_fpsN=0,_scaleCd=0;
function adaptRes(dtMs){
  if(save.quality==="high")return;
  _fpsAcc+=dtMs;_fpsN++; if(_scaleCd>0)_scaleCd-=dtMs;
  if(_fpsAcc<1500)return;
  const fpsNow=1000/(_fpsAcc/_fpsN); _fpsAcc=0;_fpsN=0;
  if(_scaleCd>0)return;
  let ns=resScale;
  const flr=QP.fpsFloor||.6;
  // objetivo: no bajar de 30 fps. Antes de sacar geometría, se recorta resolución.
  if(fpsNow<30&&resScale>flr)ns=Math.max(flr,resScale-.12);
  else if(fpsNow>50&&resScale<1)ns=Math.min(1,resScale+.06);
  if(ns!==resScale){ resScale=ns; _scaleCd=2500;
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,QP.dpr)*resScale); }}
function frame(now){requestAnimationFrame(frame);
  acc+=now-last;last=now;if(acc>250)acc=250;
  pollPads();menuNav();
  {const _n=performance.now();if(!frame._t)frame._t=_n;const _d=Math.min(0.1,(_n-frame._t)/1000);frame._t=_n;
   if(typeof NET!=="undefined"){NET.tick(_d);updateGhosts(_d);tickBubbles();updateAudioListener();
     if(typeof VOICE!=="undefined"&&VOICE.enabled&&sess){
       const foot=sess.onFoot&&sess.onFoot.active;VOICE.proximity(foot?sess.onFoot.x:sess.x,foot?sess.onFoot.z:sess.z);}
     if(mode==="maps")refreshMapCounts();refreshRoomBadge();}}
  fc++;if(QP.shadow>0&&fc%QP.shadowEvery===0)renderer.shadowMap.needsUpdate=true;
  adaptRes(Math.min(120,now-(frame._a||now)));frame._a=now;
  const stepMs=CFG.step*1000;
  while(acc>=stepMs){update(CFG.step);updateSmoke(CFG.step);acc-=stepMs;}
  cullWorld(Math.min(.1,(now-(frame._c||now))/1000));frame._c=now;
  if(mode==="race"||mode==="pause"||((mode==="title"||mode==="maps"||mode==="time"||mode==="results")&&world)){
    if(mode==="race"||mode==="pause")drawHud(CFG.step);
    renderer.render(scene,camera);}
  else if(mode==="garage")renderer.render(garageScene,camera);
  if(DEV){frames++;if(now-fpsAt>=500){fps=Math.round(frames*1000/(now-fpsAt));frames=0;fpsAt=now;}
    devEl.textContent=`${fps} fps calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles/1000|0)}k`
      +(sess?`\nv ${sess.speed.toFixed(1)} beta ${(sess.beta*57.3).toFixed(0)} combo ${sess.combo.toFixed(1)} cp ${sess.cp}`:"");}
}

function roundRectPath(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function textSprite(text,{bg="rgba(20,20,26,.86)",fg="#fff",size=52}={}){
  const pad=18,c=document.createElement("canvas"),g=c.getContext("2d");
  g.font=`800 ${size}px Arial`;const tw=Math.min(720,g.measureText(text).width);
  c.width=tw+pad*2;c.height=size+pad*1.4;g.font=`800 ${size}px Arial`;g.textBaseline="middle";
  g.fillStyle=bg;roundRectPath(g,0,0,c.width,c.height,c.height*.32);g.fill();
  g.fillStyle=fg;g.fillText(text,pad,c.height/2);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(c.width/c.height*1.55,1.55,1);sp.renderOrder=999;return sp;}
// nombre flotante: solo letras blancas con contorno negro (sin fondo)
function nameSprite(text){text=String(text||"").slice(0,16);
  const size=52,pad=Math.round(size*0.5),c=document.createElement("canvas"),g=c.getContext("2d");
  g.font=`900 ${size}px Arial`;const tw=Math.min(560,g.measureText(text).width);
  c.width=Math.ceil(tw+pad*2);c.height=Math.ceil(size+pad*1.2);
  g.font=`900 ${size}px Arial`;g.textBaseline="middle";g.textAlign="center";
  g.lineJoin="round";g.miterLimit=2;g.strokeStyle="rgba(0,0,0,.9)";g.lineWidth=size*0.16; // borde negrito sin exagerar
  g.strokeText(text,c.width/2,c.height/2);g.fillStyle="#fff";g.fillText(text,c.width/2,c.height/2);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(c.width/c.height*1.3,1.3,1);sp.renderOrder=999;return sp;}
const bubbles=[];
// globo de texto estilo Roblox: burbuja blanca redondeada con colita, sobre la cabeza
function bubbleSprite(msg){msg=String(msg||"").slice(0,60);
  const size=40,padX=26,padY=18,tail=18,c=document.createElement("canvas"),g=c.getContext("2d");
  g.font=`700 ${size}px Arial`;const tw=Math.min(600,g.measureText(msg).width);
  c.width=Math.ceil(tw+padX*2);c.height=Math.ceil(size+padY*2+tail);
  const bh=c.height-tail;
  g.fillStyle="rgba(255,255,255,.97)";roundRectPath(g,0,0,c.width,bh,bh*0.42);g.fill();
  g.beginPath();g.moveTo(c.width/2-13,bh-1);g.lineTo(c.width/2+13,bh-1);g.lineTo(c.width/2,c.height);g.closePath();g.fill();
  g.fillStyle="#161616";g.font=`700 ${size}px Arial`;g.textBaseline="middle";g.textAlign="center";
  g.fillText(msg,c.width/2,bh/2);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(c.width/c.height*1.7,1.7,1);sp.renderOrder=1000;return sp;}
function showBubble(obj,msg){if(!obj)return;
  if(obj.userData._bub){obj.remove(obj.userData._bub);}
  const sp=bubbleSprite(msg);
  sp.position.y=3.4;obj.add(sp);obj.userData._bub=sp;
  bubbles.push({obj,sp,until:performance.now()+4800});}
function tickBubbles(){const now=performance.now();
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];
    if(now>b.until){if(b.obj.userData._bub===b.sp){b.obj.remove(b.sp);b.obj.userData._bub=null;}bubbles.splice(i,1);}}}

/* ---- red MQTT: presencia global + sala (topic) por mapa ---- */
const NET=(function(){
  const PRE="driftyard/v2/presence",roomTopic=r=>"driftyard/v2/room/"+r,RACE="driftyard/v2/race";
  const ID="d"+((Math.random()*1e9)|0).toString(36)+((Math.random()*1e4)|0).toString(36);
  let cli=null,on=false,curRoom=-1,subRoom=-1,accP=0,accS=0,accPing=0;
  const peers={};let onChat=null,onSignal=null,onRace=null,onHit=null;
  const nm=()=>(save.name||"Driver").slice(0,14);
  const pres=()=>({k:"p",id:ID,n:nm(),room:curRoom});
  let pingMs=0,nSeq=0,lastPub=0,lastSent=null;
  /* código de animación a pie: 0 idle · 1 walk · 2 run · 3 jump · 4 punch */
  function footAnim(of){if(of.punchT>0)return 4;if(!of.grounded)return 3;
    if(of.speed>5)return 2;if(of.speed>0)return 1;return 0;}
  /* paquete de estado COMPACTO (claves de 1-2 letras, decimales recortados): menos bytes por
     mensaje => el broker lo entrega antes, así podemos publicar a 20 Hz sin subir el ancho de banda */
  function state(){if(!sess)return null;
    const of=(sess.onFoot&&sess.onFoot.active)?sess.onFoot:null;
    const px=of?of.x:sess.x, pz=of?of.z:sess.z, ph=of?of.h:sess.h;
    const py=of?((of.ped&&of.ped.holder)?of.ped.holder.position.y:0):(sess.y||0);
    // velocidad: la usa el otro cliente para EXTRAPOLAR (dead reckoning) y borrar el lag visible
    const vx=of?Math.sin(of.h)*(of.speed||0):(sess.vx||0);
    const vz=of?Math.cos(of.h)*(of.speed||0):(sess.vz||0);
    const o={k:"s",id:ID,x:+px.toFixed(2),z:+pz.toFixed(2),h:+ph.toFixed(2),y:+py.toFixed(2),
      vx:+vx.toFixed(1),vz:+vz.toFixed(1),c:save.car|0,ch:save.char|0,
      f:of?1:0,a:of?footAnim(of):0,d:sess.hbDrift?1:0,
      hp:Math.round(Math.max(0,of?of.hp:sess.hp)),dd:sess.dead?1:0,
      t:Math.round(performance.now())};
    if((nSeq++%12)===0)o.n=nm();   // el nombre viaja 1 de cada 12 paquetes (la presencia ya lo trae)
    return o;}
  /* ¿vale la pena mandar este paquete? si estás quieto, baja a ~2 Hz de keepalive */
  function changed(s){const L=lastSent;
    if(!L){lastSent=s;return true;}
    const still=Math.abs(s.x-L.x)<.04&&Math.abs(s.z-L.z)<.04&&Math.abs(s.h-L.h)<.012&&Math.abs(s.y-L.y)<.08
      &&s.f===L.f&&s.a===L.a&&s.d===L.d&&s.hp===L.hp&&s.dd===L.dd&&s.c===L.c&&s.ch===L.ch;
    if(still&&(s.t-L.t)<450)return false;
    lastSent=s;return true;}
  function pub(topic,o){if(!on||!cli)return;
    try{cli.publish(topic,JSON.stringify(o),{qos:0,retain:false});}catch(e){}}
  function recalcPing(){let sum=0,n=0;const now=performance.now();
    for(const k in peers){const p=peers[k];
      if(p.rtt&&now-Math.max(p.lastP||0,p.last||0)<8000){sum+=p.rtt;n++;}}
    pingMs=n?sum/n:0;}
  function onMsg(_t,raw){let d;try{d=JSON.parse(raw);}catch(e){return;}if(!d||d.id===ID)return;
    const now=performance.now();
    if(d.k==="v"||d.k==="rtc"){if(onSignal)onSignal(d);return;} // señalización de voz WebRTC
    if(d.k&&d.k[0]==="R"){if(onRace)onRace(d);return;}          // mensajes de carrera (Rinvite/Rjoin/Rroster/Rgo/Rfin/Rres)
    if(d.k==="P"){pub(roomTopic(subRoom),{k:"Q",id:ID,to:d.id,t:d.t});return;}  // eco de ping
    if(d.k==="Q"){if(d.to===ID){const r=performance.now()-d.t;
        const p=peers[d.id]||(peers[d.id]={});p.rtt=p.rtt?p.rtt*.6+r*.4:r;recalcPing();}return;}
    if(d.bye){delete peers[d.id];return;}
    let p=peers[d.id]; if(!p)p=peers[d.id]={};
    if(d.k==="h"){if(d.to===ID&&onHit)onHit(d);return;}          // "te choqué" (respaldo del choque local)
    if(d.k==="p"){p.n=d.n;p.room=d.room;p.lastP=now;}
    else if(d.k==="s"){if(d.n)p.n=d.n;
      p.car=(d.c!=null?d.c:(d.car|0));p.ch=d.ch|0;
      p.x=d.x;p.z=d.z;p.h=d.h;p.y=d.y||0;p.vx=d.vx||0;p.vz=d.vz||0;
      p.foot=!!d.f;p.anim=d.a|0;p.drift=d.d|0;
      p.hp=(d.hp==null?100:d.hp);p.ddead=!!d.dd;
      p.room=subRoom;p.last=now;if(p.lastP==null)p.lastP=now;}
    else if(d.k==="c"){p.n=d.n;p.lastP=now;if(onChat)onChat({id:d.id,n:d.n,m:d.m});}}
  function connect(){if(on||window.__noMqtt||typeof mqtt==="undefined")return;
    try{cli=mqtt.connect("wss://broker.emqx.io:8084/mqtt",{connectTimeout:7000,reconnectPeriod:5000,keepalive:25,clientId:ID});
      cli.on("connect",()=>{on=true;cli.subscribe(PRE);cli.subscribe(RACE);if(subRoom>=0)cli.subscribe(roomTopic(subRoom));pub(PRE,pres());});
      cli.on("message",(t,m)=>onMsg(t,m.toString()));
      cli.on("error",()=>{});cli.on("close",()=>{on=false;});
    }catch(e){}}
  function setRoom(r){
    if(r!==subRoom){if(on&&cli){if(subRoom>=0)try{cli.unsubscribe(roomTopic(subRoom));}catch(e){}
      if(r>=0)try{cli.subscribe(roomTopic(r));}catch(e){}}
      // al cambiar de sala, olvidá el estado (posiciones) de la anterior
      for(const k in peers)peers[k].x=null;
      subRoom=r;}
    curRoom=r;pub(PRE,pres());}
  function leaveRoom(){if(curRoom!==-1)setRoom(-1);}
  function sendChat(m){m=(m||"").slice(0,120);if(!m)return;const o={k:"c",id:ID,n:nm(),m};
    if(subRoom>=0)pub(roomTopic(subRoom),o);}
  function tick(dt){if(!on)return;accP+=dt;if(accP>=1.8){accP=0;pub(PRE,pres());}
    if(sess&&mode==="race"&&subRoom>=0){
      // 20 Hz cuando la conexión está sana; si el ping se dispara, aflojamos para no encolar mensajes
      const iv=pingMs>420?.10:(pingMs>240?.075:.05);
      accS+=dt;if(accS>=iv){accS=0;const s=state();if(s&&changed(s)){lastPub=performance.now();pub(roomTopic(subRoom),s);}}
      accPing+=dt;if(accPing>=2.5){accPing=0;pub(roomTopic(subRoom),{k:"P",id:ID,t:Math.round(performance.now())});}}
    const now=performance.now();for(const k in peers){const p=peers[k];
      if(now-(p.lastP||0)>6000&&now-(p.last||0)>6000)delete peers[k];}}
  /* publicá YA (choque, salto, subir/bajar del auto): el evento no espera al próximo tick */
  function flush(){if(!sess||mode!=="race"||subRoom<0)return;
    const now=performance.now();if(now-lastPub<33)return;lastPub=now;
    const s=state();if(s){lastSent=s;pub(roomTopic(subRoom),s);}}
  function roomCounts(){const now=performance.now(),c={};
    for(const k in peers){const p=peers[k];if(now-(p.lastP||0)>6000)continue;if(p.room>=0)c[p.room]=(c[p.room]||0)+1;}
    if(curRoom>=0)c[curRoom]=(c[curRoom]||0)+1;return c;}
  function roomPlayers(){const now=performance.now(),out=[];
    for(const k in peers){const p=peers[k];if(p.x==null)continue;if(now-(p.last||0)>4000)continue;out.push({id:k,...p});}return out;}
  function count(r){return roomCounts()[r]||0;}
  function pubRoom(o){if(subRoom>=0)pub(roomTopic(subRoom),o);}
  function pubRace(o){o.id=ID;pub(RACE,o);}
  return{get on(){return on;},connect,setRoom,leaveRoom,sendChat,tick,flush,roomCounts,roomPlayers,count,peers,ID,pubRoom,pubRace,
    get onChat(){return onChat;},set onChat(f){onChat=f;},
    get onSignal(){return onSignal;},set onSignal(f){onSignal=f;},get room(){return subRoom;},
    get onRace(){return onRace;},set onRace(f){onRace=f;},nm:nm,
    get onHit(){return onHit;},set onHit(f){onHit=f;},
    get ping(){return Math.round(pingMs);},                    // ms medidos de ida y vuelta
    _inject(p){p.last=p.lastP=performance.now();peers[p.id]=p;},
    _feed(o){onMsg("t",JSON.stringify(o));},                   // simular un mensaje entrante
    _pkt(){return state();},                                   // ver el paquete que se publica
    _sent(){return lastSent;}};
})();
addEventListener("beforeunload",()=>{if(NET.on)try{NET.leaveRoom();}catch(e){}});
NET.connect();

/* ================= CHAT DE VOZ (WebRTC malla sobre la señalización MQTT) ================= */
const VOICE=(function(){
  let stream=null,enabled=false;const pcs={};                 // peerId -> RTCPeerConnection
  const RTC={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}]};
  const me=()=>NET.ID;
  function mkPeer(pid){if(pcs[pid])return pcs[pid];
    const pc=new RTCPeerConnection(RTC);pcs[pid]=pc;
    if(stream)for(const t of stream.getTracks())pc.addTrack(t,stream);
    pc.onicecandidate=e=>{if(e.candidate)NET.pubRoom({k:"rtc",id:me(),to:pid,ice:e.candidate});};
    pc.ontrack=e=>{let a=document.getElementById("va_"+pid);
      if(!a){a=document.createElement("audio");a.id="va_"+pid;a.autoplay=true;a.playsInline=true;
        a.style.display="none";document.body.appendChild(a);}
      a.srcObject=e.streams[0];a.play&&a.play().catch(()=>{});};
    pc.onconnectionstatechange=()=>{const st=pc.connectionState;
      if(st==="failed"||st==="closed"||st==="disconnected")killPeer(pid);};
    return pc;}
  async function callPeer(pid){const pc=mkPeer(pid);
    if(me()<pid){try{const off=await pc.createOffer();await pc.setLocalDescription(off);
      NET.pubRoom({k:"rtc",id:me(),to:pid,sdp:pc.localDescription});}catch(e){}}}   // el ID menor ofrece (evita glare)
  function killPeer(pid){const pc=pcs[pid];if(pc){try{pc.close();}catch(e){}delete pcs[pid];}
    const a=document.getElementById("va_"+pid);if(a)a.remove();}
  async function onSignal(d){if(!enabled)return;                 // solo participan los que activaron el mic
    if(d.k==="v"){callPeer(d.id);if(!d.to)NET.pubRoom({k:"v",id:me(),to:d.id});return;}
    if(d.k!=="rtc"||d.to!==me())return;
    const pc=mkPeer(d.id);
    try{if(d.sdp){await pc.setRemoteDescription(d.sdp);
        if(d.sdp.type==="offer"){const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
          NET.pubRoom({k:"rtc",id:me(),to:d.id,sdp:pc.localDescription});}}
      else if(d.ice){await pc.addIceCandidate(d.ice);}}catch(e){}}
  async function enable(){if(enabled)return true;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof RTCPeerConnection==="undefined"){
      toast(T2("Voz no soportada acá","Voice not supported"),"var(--red)");return false;}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
    catch(e){toast(T2("Micrófono denegado","Mic denied"),"var(--red)");return false;}
    enabled=true;NET.pubRoom({k:"v",id:me()});return true;}       // anunciar mic -> los demás con mic conectan
  function disable(){enabled=false;for(const pid in pcs)killPeer(pid);
    if(stream){for(const t of stream.getTracks())t.stop();stream=null;}}
  // voz por proximidad: baja el volumen de cada peer según su distancia al jugador
  function proximity(px,pz){for(const pid in pcs){const a=document.getElementById("va_"+pid);if(!a)continue;
    const pr=NET.peers[pid];let v=1;
    if(pr&&pr.x!=null){const d=Math.hypot(pr.x-px,pr.z-pz);v=Math.max(0,Math.min(1,1-(d-6)/49));} // audible ~6m, se apaga ~55m
    if(Math.abs(a.volume-v)>0.02)a.volume=v;}}
  return{enable,disable,proximity,get enabled(){return enabled;},get peers(){return Object.keys(pcs).length;},
    _sig:d=>onSignal(d)};
})();
NET.onSignal=d=>VOICE._sig(d);

/* ================= CARRERA GP: free-roam + sala de 6 + grilla + premios ================= */
const RACE=(function(){
  const GP=MAPS.findIndex(m=>m.id==="gp");
  let host=null,iAmHost=false,roster=[],phase="off"; // off|lobby|grid|racing|results
  let finishOrder=[],finTimer=null,pendingHost=null;
  const me=()=>NET.ID, myName=()=>(save.name||"Driver").slice(0,14);
  const inList=id=>roster.some(r=>r.id===id);
  // sala de carrera aislada: número derivado del host (no choca con los índices de mapa 0-8)
  function raceRoomId(h){let x=0;const s=""+(h||me());for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return 600+(x%300);}
  let inviteTimer=null;
  function reset(){host=null;iAmHost=false;roster=[];phase="off";finishOrder=[];pendingHost=null;
    if(finTimer){clearTimeout(finTimer);finTimer=null;}
    if(inviteTimer){clearInterval(inviteTimer);inviteTimer=null;}
    $("racelobby").classList.remove("on");$("raceinvite").classList.remove("on");}
  // salir de la sala volviendo al modo libre del GP (misma instancia que los que pasean)
  function leaveRace(){reset();if(typeof NET!=="undefined"&&sess)NET.setRoom(save.map);}
  // ---- tocar CARRERA: manda la invitación YA y espera pilotos (sin menú de server) ----
  function open(){
    if(!sess||!sess.freeroam)return;
    iAmHost=true;host=me();roster=[{id:me(),n:myName()}];phase="lobby";
    NET.pubRace({k:"Rinvite",hn:myName()});
    NET.pubRace({k:"Rroster",host:host,hn:myName(),slots:roster});
    // reenviar la invitación cada 3s mientras se llena la sala (para que la vean los que entren)
    if(inviteTimer)clearInterval(inviteTimer);
    inviteTimer=setInterval(()=>{if(phase!=="lobby"){clearInterval(inviteTimer);inviteTimer=null;return;}
      NET.pubRace({k:"Rinvite",hn:myName()});bcRoster();},3000);
    toast(T2("Invitación enviada 🏁 — largan al llegar 6","Invite sent 🏁 — starts at 6"),"var(--org)");
    showLobby();}
  function bcRoster(){if(iAmHost)NET.pubRace({k:"Rroster",host:host,hn:myName(),slots:roster});}
  function join(h){
    host=h;phase="lobby";pendingHost=null;
    NET.pubRace({k:"Rjoin",host:h,n:myName()});
    $("raceinvite").classList.remove("on");
    if(save.map!==GP){save.map=GP;persist();startSession();} // ir al GP en modo libre
    showLobby();}
  function start(){ // host larga (al llegar 6 o con "LARGAR YA")
    if(!iAmHost||phase!=="lobby")return;
    if(inviteTimer){clearInterval(inviteTimer);inviteTimer=null;}
    const slots=roster.slice(0,6);
    NET.pubRace({k:"Rgo",host:host,slots:slots,wait:5});
    beginGrid(slots);}
  function beginGrid(slots){
    phase="grid";$("racelobby").classList.remove("on");
    const mySlot=Math.max(0,slots.findIndex(r=>r.id===me()));
    if(save.map!==GP){save.map=GP;persist();startSession();}
    if(!sess)startSession();
    placeOnGrid(mySlot,slots.length);
    $("exitbtn").style.display="none";$("racebtn").style.display="none";
    countdown(5);}
  function placeOnGrid(slot,total){
    const R=world.road;if(!R)return;
    const row=Math.floor(slot/2),col=(slot%2)?1:-1;
    const back=12+row*7, lat=col*3.0;
    // seguir la línea de la pista hacia atrás (nunca en el pasto -> no tiembla la cámara)
    const bi=((0-Math.round(back/R.ds))%R.n+R.n)%R.n;
    const P0=R.P[bi],T0=R.TN[bi],L0=R.LF[bi];
    const bx=P0.x+L0.x*lat, bz=P0.z+L0.z*lat;
    sess.x=bx;sess.z=bz;sess.h=Math.atan2(T0.x,T0.z);sess.vx=0;sess.vz=0;sess.speed=0;sess.shake=0;sess.roadIdx=bi;
    sess.armed=false;sess.freeroam=false;sess.gridHold=true;sess.over=false;
    sess.lap=0;sess.cp=0;sess.t=0;
    camera.position.set(bx-Math.sin(sess.h)*8,3.4,bz-Math.cos(sess.h)*8);camera.lookAt(bx,1,bz);
    // instancia SEPARADA de carrera: los que corren no se cruzan con los que pasean el mapa
    if(typeof NET!=="undefined")NET.setRoom(raceRoomId(host));}
  function countdown(sec){
    const el=$("racecount"),b=el.querySelector("b");el.style.display="flex";
    let k=sec;const tick=()=>{
      if(k>0){b.textContent=k;sfx("sfx_count",.8,1);send_later_ok(tick);k--;}
      else{b.textContent="¡GO!";sfx("sfx_ok",1,1.2);
        sess.gridHold=false;sess.armed=true;sess.go=1.2;sess.lapStart=0;sess.shake=0;phase="racing";
        loopsStart();setTimeout(()=>{el.style.display="none";},700);}};
    tick();}
  function send_later_ok(fn){setTimeout(fn,1000);}
  // ---- llegada ----
  function onFinish(t){
    phase="results";
    NET.pubRace({k:"Rfin",host:host||me(),n:myName(),t:+t.toFixed(2)});
    if(!finishOrder.some(f=>f.id===me()))finishOrder.push({id:me(),n:myName(),t:+t.toFixed(2)});
    if(iAmHost){ // el host arma el resultado cuando llegan todos o a los 25s
      if(!finTimer)finTimer=setTimeout(()=>publishResults(),25000);
      maybePublish();
    }else{showWaiting();}
  }
  function maybePublish(){if(iAmHost&&finishOrder.length>=roster.length)publishResults();}
  function publishResults(){
    if(finTimer){clearTimeout(finTimer);finTimer=null;}
    const order=finishOrder.slice().sort((a,b)=>a.t-b.t);
    NET.pubRace({k:"Rres",host:host,order:order});
    showResultsScreen(order);}
  function showWaiting(){toast(T2("Esperando a los demás…","Waiting for others…"),"var(--yel)");
    // por si el host se cae, mostramos algo a los 27s
    setTimeout(()=>{if(phase==="results")showResultsScreen(finishOrder.slice().sort((a,b)=>a.t-b.t));},27000);}
  function showResultsScreen(order){
    if(phase==="done")return;phase="done";
    const prize=[500,300,150];let mine=order.findIndex(o=>o.id===me());
    if(mine>=0&&mine<3){save.coins+=prize[mine];persist();}
    const s=S.results;s.innerHTML="";const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
    music("music_menu");
    const t=document.createElement("div");t.className="title-xl";t.textContent=T2("RESULTADOS","RESULTS");s.appendChild(t);
    const g=document.createElement("div");g.className="results-grid";
    g.innerHTML=order.map((o,i)=>{const med=["🥇","🥈","🥉"][i]||`${i+1}.`;
      const pz=prize[i]?` <span class="yel">+🪙${prize[i]}</span>`:"";
      const meTag=o.id===me()?' <span class="org">(vos)</span>':"";
      return `${med} ${esc(o.n)} — ${fmtT(o.t)}${pz}${meTag}`;}).join("<br>")||T2("Sin llegadas","No finishers");
    s.appendChild(g);
    s.appendChild(btn(L.retry||"REINTENTAR",()=>{reset();save.map=GP;persist();startSession();}));
    s.appendChild(btn(L.menu||"MENU",()=>{reset();sess=null;buildTitle();}));
    show("results");}
  // ---- recepción de mensajes ----
  function onMsg(d){
    if(d.k==="Rinvite"){ // alguien abrió una sala
      if(iAmHost||phase==="racing"||phase==="grid")return;
      if(sess&&sess.onFoot&&sess.onFoot.active)return;
      pendingHost=d.id;$("raceit").textContent=T2(`${d.hn||"Alguien"} te invita a una carrera 🏁`,`${d.hn||"Someone"} invites you to race 🏁`);
      $("raceinvite").classList.add("on");
      setTimeout(()=>{if(pendingHost===d.id)$("raceinvite").classList.remove("on");},15000);
      return;}
    if(d.k==="Rjoin"&&iAmHost&&d.host===host){
      if(!inList(d.id)&&roster.length<6)roster.push({id:d.id,n:d.n||"Driver"});
      bcRoster();if(phase==="lobby")showLobby();
      if(roster.length>=6)start();   // sala llena -> larga sola
      return;}
    if(d.k==="Rroster"&&(d.host===host||d.host===pendingHost)){
      host=d.host;roster=d.slots||[];if(phase==="lobby")showLobby();return;}
    if(d.k==="Rgo"&&d.host===host){if((d.slots||[]).some(r=>r.id===me()))beginGrid(d.slots);return;}
    if(d.k==="Rfin"&&(d.host===host||iAmHost)){
      if(!finishOrder.some(f=>f.id===d.id))finishOrder.push({id:d.id,n:d.n,t:d.t});
      if(iAmHost)maybePublish();return;}
    if(d.k==="Rres"&&d.host===host){showResultsScreen(d.order||[]);return;}}
  // ---- UI de la sala ----
  function showLobby(){ // chip compacto (NO menú de server): sólo estado + LARGAR YA / SALIR
    const box=$("lobslots");
    $("lobh").textContent="🏁 "+T2("CARRERA","RACE")+"  "+roster.length+"/6";
    box.innerHTML='<div class="lobslot" style="justify-content:center">'+
      (iAmHost?T2("Invitación enviada · esperando pilotos…","Invite sent · waiting for drivers…")
              :T2("Esperando al anfitrión…","Waiting for host…"))+'</div>';
    const bar=$("lobbtns");bar.innerHTML="";
    if(iAmHost)bar.appendChild(btn(T2("LARGAR YA ▸","START NOW ▸"),()=>start()));
    bar.appendChild(btn(L.exit||"SALIR",()=>leaveRace()));
    $("racelobby").classList.add("on");}
  return{open,join,onFinish,onMsg,reset,leaveRace,
    joinPending:()=>{if(pendingHost)join(pendingHost);},
    dismiss:()=>{pendingHost=null;$("raceinvite").classList.remove("on");},
    get phase(){return phase;},get active(){return phase!=="off";}};
})();
NET.onRace=d=>RACE.onMsg(d);
$("rijoin").onclick=()=>RACE.joinPending();
$("rino").onclick=()=>RACE.dismiss();
$("racebtn").onclick=()=>{try{interact();}catch(e){}RACE.open();};
$("exitbtn").onclick=()=>{RACE.leaveRace();};

/* ================= JUGADORES REMOTOS (auto + a pie, con animaciones, humo y choques) =================
   Cada peer tiene DOS cuerpos cacheados: el auto y el personaje a pie. Se muestra el que
   corresponda a su estado (p.foot) sin reconstruir nada, así bajarse/subirse es instantáneo. */
const ghosts={};
const GA=["idle","walk","run","jump","punch"];   // p.anim (0..4) -> nombre de clip
function ghostCarObj(carIdx){
  const obj=carTemplates[(carIdx||0)%carTemplates.length].clone(true);
  const body=[];
  obj.traverse(o=>{if(!o.isMesh)return;
    let w=o;let isWheel=false;while(w){if(w.name==="dyw_f"||w.name==="dyw_r"){isWheel=true;break;}w=w.parent;}
    o.material=o.material.clone();
    if(isWheel)return;
    o.geometry=o.geometry.clone();          // geometría propia: se puede abollar sin tocar el template
    o.geometry.userData={};
    if(o.geometry.attributes.position)body.push(o);});
  const wheels=[];obj.traverse(o=>{if(o.name==="dyw_f"||o.name==="dyw_r")wheels.push(o);});
  const wR=carTemplates[(carIdx||0)%carTemplates.length].userData.wheelR||.3;
  cheapMats(obj);
  return{obj,body,wheels,wR:Math.max(wR,.12)};}
/* abolla el auto del otro jugador igual que el tuyo (misma función de deformación) */
function deformGhost(g,dir,strength){
  if(!g.car||!g.car.body.length)return;
  try{deformCar({h:g.h,body:g.car.body,hp:g.hp==null?100:g.hp},dir,strength);}catch(e){}}
function ghostSetTag(g,name){
  const host=g.mode==="foot"?(g.foot&&g.foot.holder):(g.car&&g.car.obj);
  if(!host)return;
  if(g.tag&&g.tag.parent)g.tag.parent.remove(g.tag);
  g.tag=nameSprite(name||"?");g.tag.scale.multiplyScalar(g.mode==="foot"?.5:.62);
  g.tag.position.y=g.mode==="foot"?2.15:2.55;host.add(g.tag);}
function updateGhosts(dt){
  const active=(mode==="race"||mode==="pause")&&world&&carTemplates.length;
  if(!active){for(const id in ghosts)ghostDrop(id);return;}
  const players=NET.roomPlayers(),seen={};
  const myNm=(save.name||"Driver").slice(0,14);
  let needPeds=false;
  for(const p of players){
    // nunca dibujar un "fantasma" con TU propio nombre (eco de una recarga tuya en el broker público)
    if(p.n===myNm)continue;
    if(p.x==null)continue;
    seen[p.id]=1;let g=ghosts[p.id];
    if(!g)g=ghosts[p.id]={id:p.id,x:p.x,z:p.z,y:p.y||0,h:p.h,vx:0,vz:0,speed:0,name:p.n,
      car:null,foot:null,mode:null,carIdx:-1,charIdx:-1,spin:0,hp:p.hp==null?100:p.hp,
      mk:{x:0,z:0,h:0,has:false},hitCd:0,lastLocalHit:-1e9,tag:null};
    g.hp0=g.hp;

    /* ---- dead reckoning: adelanto la posición recibida por la mitad del ping ----
       sin esto el otro se ve "atrasado" y chocarlo sería imposible de calcular */
    const rtt=(NET.peers[p.id]&&NET.peers[p.id].rtt)||NET.ping||110;
    const lead=Math.min(.24,Math.max(0,rtt/2000)+.03);
    const age=Math.min(.2,Math.max(0,(performance.now()-(p.last||0))/1000));
    // tope de 3 m de adelanto: si frena de golpe, el fantasma no se va de largo (y los choques no fallan)
    let ex=Math.min(.2,lead+age);const psp=Math.hypot(p.vx||0,p.vz||0);
    if(psp*ex>3)ex=3/psp;
    const tx=p.x+p.vx*ex, tz=p.z+p.vz*ex;
    const far=Math.hypot(tx-g.x,tz-g.z);
    if(far>16){g.x=tx;g.z=tz;g.h=p.h;}   // teleport / respawn: no deslizar medio mapa
    else{const k=1-Math.pow(1e-6,dt);    // seguimiento firme (converge ~95% en 230 ms)
      g.x+=(tx-g.x)*k;g.z+=(tz-g.z)*k;
      let dh=p.h-g.h;while(dh>Math.PI)dh-=2*Math.PI;while(dh<-Math.PI)dh+=2*Math.PI;g.h+=dh*Math.min(1,dt*14);}
    g.vx=p.vx||0;g.vz=p.vz||0;g.speed=Math.hypot(g.vx,g.vz);
    g.y+=((p.y||0)-g.y)*Math.min(1,dt*16);
    g.name=p.n||g.name;

    /* ---- ¿auto o a pie? ---- */
    const wantFoot=!!p.foot;
    if(wantFoot&&!g.foot){
      if(pedsReady){const P=makePed(p.ch|0);if(P){g.foot=P;g.charIdx=p.ch|0;P.holder.userData.noCull=true;world.group.add(P.holder);}}
      else needPeds=true;}
    if(wantFoot&&g.foot&&g.charIdx!==(p.ch|0)){          // cambió de piloto en vivo
      world.group.remove(g.foot.holder);const P=makePed(p.ch|0);
      if(P){g.foot=P;g.charIdx=p.ch|0;P.holder.userData.noCull=true;world.group.add(P.holder);g.mode=null;}}
    if(!wantFoot&&(!g.car||g.carIdx!==(p.car|0))){       // cambió de auto en vivo
      if(g.car)world.group.remove(g.car.obj);
      g.car=ghostCarObj(p.car|0);g.carIdx=p.car|0;g.car.obj.userData.noCull=true;world.group.add(g.car.obj);g.mode=null;}
    const nm2=wantFoot&&g.foot?"foot":(g.car?"car":null);
    if(nm2&&nm2!==g.mode){g.mode=nm2;ghostSetTag(g,g.name);}
    // forceHide: sin esto el culleo (que respeta noCull) volvía a mostrar el cuerpo inactivo
    if(g.car){g.car.obj.visible=(g.mode==="car");g.car.obj.userData.forceHide=(g.mode!=="car");}
    if(g.foot){g.foot.holder.visible=(g.mode==="foot");g.foot.holder.userData.forceHide=(g.mode!=="foot");}
    if(g.tag&&g.name!==g.tagName){g.tagName=g.name;ghostSetTag(g,g.name);}

    if(g.mode==="foot"){
      const P=g.foot;
      P.mixer.update(dt);
      P.holder.position.set(g.x,g.y,g.z);P.holder.rotation.y=g.h;
      pedPlay(P,GA[Math.max(0,Math.min(4,p.anim|0))]||"idle",.12);
      if(g.eng)ghostEngine(g,0);          // el auto vacío no ruge
    }else if(g.mode==="car"){
      const C=g.car;
      C.obj.position.set(g.x,g.y,g.z);C.obj.rotation.set(0,g.h,0);
      // ruedas girando según su velocidad real (llega en el paquete)
      g.spin-=g.speed/C.wR*dt;
      for(const w of C.wheels){const ms=w.userData.ms||1;
        if(w.children[0])w.children[0].rotation.x=g.spin*ms;}
      // DERRAPE del otro: humo y marcas de goma reales en TU mundo
      if(p.drift&&g.speed>7&&!p.ddead){
        spawnSmoke({x:g.x,z:g.z,h:g.h});
        writeMark({x:g.x,z:g.z,h:g.h},g.mk);}
      else g.mk.has=false;
      ghostEngine(g,Math.min(1,g.speed/34));
    }
    /* ---- daño recibido en su cliente (choques con el escenario): se ve la abolladura acá ---- */
    if(p.ddead&&!g.wasDead){        // lo destruyeron: humo y chatarra visible
      g.wasDead=true;deformGhost(g,{x:0,z:1},.75);
      for(let k2=0;k2<12;k2++)spawnPuffAt(g.x+(Math.random()-.5)*2,.5+Math.random(),g.z+(Math.random()-.5)*2,1.6);}
    if(!p.ddead&&g.wasDead){        // reapareció: su auto vuelve sano (antes quedaba hecho bollo para siempre)
      g.wasDead=false;
      if(g.car){world.group.remove(g.car.obj);g.car=ghostCarObj(g.carIdx<0?0:g.carIdx);
        g.car.obj.userData.noCull=true;world.group.add(g.car.obj);g.mode=null;g.hp=100;}}
    if(p.hp!=null){
      if(p.hp<g.hp-3){const a=Math.random()*6.283;
        deformGhost(g,{x:Math.sin(a),z:Math.cos(a)},Math.min(.55,(g.hp-p.hp)/28));
        if(g.mode==="car")for(let k2=0;k2<2;k2++)spawnPuffAt(g.x,.55,g.z,1.2);}
      g.hp=p.hp;}
  }
  if(needPeds&&!pedsReady)loadPeds();
  for(const id in ghosts)if(!seen[id])ghostDrop(id);}
function ghostDrop(id){const g=ghosts[id];if(!g)return;
  if(g.eng){try{g.eng.o.stop();g.eng.o2.stop();}catch(e){}g.eng=null;}
  if(g.car&&world)world.group.remove(g.car.obj);
  if(g.foot&&world)world.group.remove(g.foot.holder);
  delete ghosts[id];}
/* motor por PROXIMIDAD (panner 3D): oís al otro auto según distancia/revoluciones */
function ghostEngine(g,rev){
  if(!actx||!save.sound){if(g.eng&&g.eng.gg)g.eng.gg.gain.value=0;return;}
  if(!g.eng){const o=actx.createOscillator();o.type="sawtooth";
    const o2=actx.createOscillator();o2.type="square";
    const lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;
    const gg=actx.createGain();gg.gain.value=0;
    const pan=actx.createPanner();pan.panningModel="HRTF";pan.distanceModel="inverse";
    pan.refDistance=7;pan.maxDistance=120;pan.rolloffFactor=1.6;
    o.connect(gg);o2.connect(gg);gg.connect(lp);lp.connect(pan);pan.connect(master);
    try{o.start();o2.start();}catch(e){}g.eng={o,o2,lp,gg,pan};}
  const e=g.eng,t=actx.currentTime;
  if(e.pan.positionX){e.pan.positionX.value=g.x;e.pan.positionY.value=.5;e.pan.positionZ.value=g.z;}
  else try{e.pan.setPosition(g.x,.5,g.z);}catch(err){}
  e.o.frequency.setTargetAtTime(56+rev*150,t,.12);
  e.o2.frequency.setTargetAtTime((56+rev*150)*.5,t,.12);
  e.lp.frequency.setTargetAtTime(450+rev*2200,t,.12);
  e.gg.gain.setTargetAtTime(MIX.engine*.6*(.3+rev*.9),t,.12);}

/* ================= CHOQUES CONTRA JUGADORES REMOTOS =================
   Los dos clientes ven las MISMAS dos posiciones, así que los dos resuelven el mismo
   choque en el mismo instante: yo salgo despedido acá y él sale despedido allá => mutuo.
   El mensaje {k:"h"} es sólo respaldo por si a uno se le escapó por lag. */
const GHIT_R=CFG.carR;                        // radio del auto (el mismo de los colliders)
function ghostCollide(s,dt){
  if(!s||s.dead||s.debris)return;
  const onFoot=!!(s.onFoot&&s.onFoot.active);
  const of=onFoot?s.onFoot:null;
  for(const id in ghosts){
    const g=ghosts[id];if(!g.mode)continue;
    if(g.hitCd>0)g.hitCd-=dt;
    const gCar=(g.mode==="car");

    if(onFoot){
      /* --- vos a pie contra el otro --- */
      const px=of.x,pz=of.z;
      const rad=gCar?(GHIT_R+.55):1.05;
      let dx=px-g.x,dz=pz-g.z;let d=Math.hypot(dx,dz);
      if(d>=rad||d<=1e-4)continue;
      const nx=dx/d,nz=dz/d;
      of.x=g.x+nx*rad;of.z=g.z+nz*rad;          // nunca te atraviesa
      if(gCar&&g.speed>6&&g.hitCd<=0){          // ¡te atropelló!
        g.hitCd=.7;g.lastLocalHit=performance.now();
        of.hp-=Math.min(45,14+g.speed*.9);of.vy=Math.max(of.vy,7.5);of.grounded=false;
        of.x+=nx*3.2;of.z+=nz*3.2;
        dryHit(1,1.05);sfx("sfx_punch",.9,.8);
        for(let k=0;k<4;k++)spawnPuffAt(of.x,.6,of.z,1.4);
        try{NET.flush();}catch(e){}}
      continue;}

    /* --- tu auto contra el otro (auto o peatón) --- */
    const rad=gCar?(GHIT_R*2*.92):(GHIT_R+.6);
    let dx=s.x-g.x,dz=s.z-g.z;let d=Math.hypot(dx,dz);
    if(d>=rad)continue;
    if(d<=1e-4){dx=Math.sin(s.h)*.01;dz=Math.cos(s.h)*.01;d=.01;}
    const nx=dx/d,nz=dz/d,pen=rad-d;
    // me corro yo (él se corre en su cliente => el choque se reparte solo)
    s.x+=nx*pen*(gCar?.9:.35);s.z+=nz*pen*(gCar?.9:.35);
    // velocidad RELATIVA: chocar de frente pega el doble que alcanzar por atrás
    const rvx=s.vx-(gCar?g.vx:0),rvz=s.vz-(gCar?g.vz:0);
    const dot=rvx*nx+rvz*nz;
    if(dot>=0)continue;                          // ya se están separando
    const rest=gCar?1.55:.35;
    s.vx-=rest*dot*nx;s.vz-=rest*dot*nz;
    if(gCar){s.vx*=.9;s.vz*=.9;}
    const dv=Math.abs(dot);
    if(dv<2.2||g.hitCd>0)continue;
    g.hitCd=.3;g.lastLocalHit=performance.now();
    const imp=Math.min(1,dv/26);
    s.shake=Math.min(1,.35+imp);
    dryHit(Math.max(.3,imp*1.15),.85+Math.random()*.2);
    for(let k=0;k<(dv>9?4:2);k++)spawnPuffAt((s.x+g.x)/2,.6,(s.z+g.z)/2,1.5);
    if(s.mapMode==="drift"&&s.cur>0){s.cur=0;s.combo=1;s.driftT=0;toast(L.comboLost,"var(--red)");}
    // los DOS autos se abollan (el suyo también, acá y allá)
    if(s.shieldT<=0){
      s.hp=Math.max(0,s.hp-Math.min(14,Math.max(4,dv*(gCar?1:.35))));
      deformCar(s,{x:-nx,z:-nz},Math.min(.6,dv/32));
      if(s.hp<=0)killPlayer(s);}
    if(gCar)deformGhost(g,{x:nx,z:nz},Math.min(.6,dv/32));
    // aviso al otro (respaldo: si él no lo detectó por lag, igual se abolla)
    try{NET.pubRoom({k:"h",id:NET.ID,to:g.id,f:+dv.toFixed(1),nx:+(-nx).toFixed(3),nz:+(-nz).toFixed(3)});
      NET.flush();}catch(e){}}}
/* respaldo: el otro dice que me chocó y yo no lo vi (lag). Si ya lo resolví local, lo ignoro. */
NET.onHit=d=>{
  const s=sess;if(!s||s.dead||s.debris)return;
  const g=ghosts[d.id];
  if(g&&performance.now()-g.lastLocalHit<1200)return;      // ya contado localmente
  if(g)g.lastLocalHit=performance.now();
  const dv=Math.max(0,Math.min(40,+d.f||0));if(dv<2.2)return;
  const nx=+d.nx||0,nz=+d.nz||1;
  if(s.onFoot&&s.onFoot.active){const of=s.onFoot;
    of.hp-=Math.min(45,14+dv);of.vy=Math.max(of.vy,7);of.grounded=false;
    of.x+=nx*2.6;of.z+=nz*2.6;dryHit(1,1.05);sfx("sfx_punch",.85,.8);return;}
  s.vx+=nx*dv*.55;s.vz+=nz*dv*.55;s.shake=Math.min(1,.35+dv/26);
  dryHit(Math.max(.3,Math.min(1,dv/22)),.9);
  for(let k=0;k<2;k++)spawnPuffAt(s.x,.6,s.z,1.4);
  if(s.shieldT<=0){s.hp=Math.max(0,s.hp-Math.min(14,Math.max(4,dv)));
    deformCar(s,{x:nx,z:nz},Math.min(.6,dv/32));
    if(s.hp<=0)killPlayer(s);}};

/* ---- chat ---- */
let chatOpen=false,unread=0;
NET.onChat=(d)=>{pushChatMsg(d.n,d.m,false);const g=ghosts[d.id];
  if(g){const host=g.mode==="foot"?(g.foot&&g.foot.holder):(g.car&&g.car.obj);
    if(host)showBubble(host,d.m);}   // el globo sale sobre su auto o sobre él a pie
  sfx&&sfx("sfx_ui",.5,1.4);};
function updateUnread(){const u=$("chatun");if(!u)return;u.textContent=unread>9?"9+":unread;
  u.style.display=unread>0?"block":"none";}
function pushChatMsg(name,msg,mine){const log=$("chatlog");if(!log)return;
  const d=document.createElement("div");d.className="cmsg"+(mine?" me":"");
  d.innerHTML="<b>"+esc(mine?save.name+" ("+T2("vos","you")+")":name)+"</b>"+esc(msg);
  log.appendChild(d);while(log.children.length>50)log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;if(!chatOpen){unread++;updateUnread();}}
function openChat(){if(chatOpen)return;chatOpen=true;unread=0;updateUnread();
  $("chat").classList.add("open");kbTarget="chat";kbBuf="";kbShift=true;kbNum=false;renderKbd();paintField();
  const c=$("chatname");c.innerHTML=T2("Vos","You")+": <b>"+esc(save.name)+"</b> ✎";
  const rb=NET.count(save.map);$("chatroom").textContent="👥 "+rb+" · "+(L["map_"+MAPS[save.map].id]||"");}
function closeChat(){chatOpen=false;$("chat").classList.remove("open");}
function submitKb(){const v=kbBuf.trim();
  if(kbTarget==="name"){if(v){save.name=v.slice(0,14);persist();}kbTarget="chat";kbBuf="";
    $("chatname").innerHTML=T2("Vos","You")+": <b>"+esc(save.name)+"</b> ✎";renderKbd();paintField();return;}
  if(v){NET.sendChat(v);pushChatMsg(save.name,v,true);
    if(sess){const tgt=(sess.onFoot&&sess.onFoot.active&&sess.onFoot.ped)?sess.onFoot.ped.holder:sess.obj;if(tgt)showBubble(tgt,v);}}
  kbBuf="";paintField();}

/* ---- teclado QWERTY propio (estilo Gboard) hecho a mano ---- */
let kbBuf="",kbShift=true,kbNum=false,kbTarget="chat";
const KB_LETTERS=[["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["⇧","z","x","c","v","b","n","m","⌫"],
  ["?123",",","␣",".","↵"]];
const KB_NUMS=[["1","2","3","4","5","6","7","8","9","0"],
  ["@","#","$","&","-","_","+","(",")","/"],
  ["*","\"","'",":",";","!","?","⌫"],
  ["ABC",",","␣",".","↵"]];
function paintField(){const t=$("chattext");if(!t)return;
  t.textContent=kbBuf;if(!kbBuf)t.innerHTML='<span class="ph">'+esc(kbTarget==="name"?T2("Escribí tu nombre…","Type your name…"):T2("Escribí un mensaje…","Type a message…"))+'</span>';}
function keyEl(label){const b=document.createElement("div");b.className="key";
  if(label==="␣"){b.className="key xwide";b.textContent="";}
  else if(label==="⇧"){b.className="key wide fn"+(kbShift?" on":"");b.textContent="⇧";}
  else if(label==="⌫"){b.className="key wide fn";b.textContent="⌫";}
  else if(label==="↵"){b.className="key wide act";b.textContent="↵";}
  else if(label==="?123"||label==="ABC"){b.className="key wide fn";b.textContent=label;}
  else b.textContent=(!kbNum&&kbShift&&/[a-z]/.test(label))?label.toUpperCase():label;
  const press=()=>kbPress(label);
  b.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();press();});
  return b;}
function renderKbd(){const kb=$("kbd");if(!kb)return;kb.innerHTML="";
  const rows=kbNum?KB_NUMS:KB_LETTERS;
  for(const row of rows){const r=document.createElement("div");r.className="krow";
    for(const k of row)r.appendChild(keyEl(k));kb.appendChild(r);}}
function kbPress(k){
  if(k==="⌫"){kbBuf=kbBuf.slice(0,-1);}
  else if(k==="⇧"){kbShift=!kbShift;renderKbd();return;}
  else if(k==="?123"){kbNum=true;renderKbd();return;}
  else if(k==="ABC"){kbNum=false;renderKbd();return;}
  else if(k==="␣"){kbBuf+=" ";}
  else if(k==="↵"){submitKb();return;}
  else{let ch=k;if(!kbNum&&kbShift&&/[a-z]/.test(k)){ch=k.toUpperCase();kbShift=false;renderKbd();}kbBuf+=ch;}
  if(kbBuf.length>120)kbBuf=kbBuf.slice(0,120);
  paintField();}
$("chatbtn").addEventListener("click",e=>{e.stopPropagation();openChat();});
$("micbtn").addEventListener("click",async e=>{e.stopPropagation();try{interact();}catch(_){}
  if(VOICE.enabled){VOICE.disable();$("micbtn").classList.remove("live");toast(L.micOff||"MIC: NO","var(--yel)");}
  else{const ok=await VOICE.enable();if(ok){$("micbtn").classList.add("live");toast(L.micOn||"MIC: SÍ","var(--org)");}}});
$("chatclose").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();closeChat();});
$("chatname").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();
  kbTarget="name";kbBuf=save.name||"";kbShift=false;kbNum=false;renderKbd();paintField();});
// tecla física Enter en desktop abre/cierra el envío
addEventListener("keydown",e=>{if(!chatOpen)return;
  if(e.key==="Enter"){submitKb();e.preventDefault();}
  else if(e.key==="Backspace"){kbBuf=kbBuf.slice(0,-1);paintField();e.preventDefault();}
  else if(e.key===" "){kbBuf+=" ";paintField();e.preventDefault();}
  else if(e.key.length===1&&kbBuf.length<120){kbBuf+=e.key;paintField();}
  else if(e.key==="Escape"){closeChat();}},true);
renderKbd();

/* ---- contador de usuarios por sala en la pantalla de mapas ---- */
function refreshMapCounts(){const c=NET.roomCounts();
  document.querySelectorAll("[data-mapc]").forEach(el=>{
    const n=c[+el.getAttribute("data-mapc")]||0;
    el.textContent="👥 "+n;el.style.opacity=n>0?"1":".5";});}
function refreshRoomBadge(){const b=$("roombadge");if(!b)return;
  if(mode==="race"&&(NET.on||NET.ping>0)){const n=NET.count(save.map),ms=NET.ping;
    b.style.display="block";
    // ping medido de verdad (ida y vuelta por el broker): verde <120 · amarillo <260 · rojo
    const col=ms?(ms<120?"#7fe08a":(ms<260?"#ffd23c":"#ff7a6a")):"#8fd0ff";
    b.innerHTML="👥 "+n+" "+T2("en la sala","in room")+
      (ms?' <span style="color:'+col+'">· '+ms+" ms</span>":"");}
  else b.style.display="none";}

/* ================= onboarding (idioma -> gráficos -> nombre, ANTES de cargar) ================= */
const esc2=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function obBtn(label,cb){const b=document.createElement("button");b.className="obbtn";b.textContent=label;
  b.addEventListener("click",()=>{try{sfx&&sfx("sfx_ui",.6,1);}catch(e){}cb();});return b;}
function runOnboarding(){return new Promise(res=>{
  const ov=document.createElement("div");ov.id="onboard";document.body.appendChild(ov);
  const card=document.createElement("div");card.className="obcard";ov.appendChild(card);
  const step=n=>{card.innerHTML="";
    if(n===0){const h=document.createElement("div");h.className="obh";h.textContent="🌐 Idioma · Language";card.appendChild(h);
      for(const[code,label]of[["es","ESPAÑOL"],["en","ENGLISH"],["pt","PORTUGUÊS"]])
        card.appendChild(obBtn(label,()=>{save.lang=code;L=STR[code];persist();step(1);}));
    }else if(n===1){const h=document.createElement("div");h.className="obh";h.textContent="🎮 "+L.g_title;card.appendChild(h);
      const sub=document.createElement("div");sub.className="obsub";sub.textContent=L.g_sub;card.appendChild(sub);
      /* Tres escalones seleccionables (ULD viene marcado) y un OK abajo para confirmar. */
      let pick=(save.quality==="high"||save.quality==="low")?save.quality:"uld";
      const opts=[["uld",L.g_uld,L.g_uldd,"🐢"],["low",L.g_low,L.g_lowd,"⚡"],["high",L.g_high,L.g_highd,"💎"]];
      const btns={};
      const paint=()=>{for(const k in btns)btns[k].classList.toggle("sel",k===pick);};
      for(const[key,name,desc,ico]of opts){
        const b=document.createElement("button");b.className="qopt";b.dataset.q=key;
        b.innerHTML='<span class="qtick">✓</span><span>'+ico+" "+esc2(name)+
          '<span class="qd">'+esc2(desc)+"</span></span>";
        b.addEventListener("click",()=>{pick=key;paint();try{sfx&&sfx("sfx_ui",.6,1);}catch(e){}});
        btns[key]=b;card.appendChild(b);}
      paint();
      const ok=document.createElement("button");ok.id="obok";ok.textContent=L.g_ok;
      ok.addEventListener("click",()=>{try{sfx&&sfx("sfx_ok",.7,1);}catch(e){}
        save.quality=pick;persist();applyQuality();step(2);});
      card.appendChild(ok);
    }else if(n===2){const h=document.createElement("div");h.className="obh";h.textContent="🕹 "+L.c_title;card.appendChild(h);
      const sub=document.createElement("div");sub.className="obsub";sub.textContent=L.c_sub;card.appendChild(sub);
      let pick=(save.scheme==="joy")?"joy":"carx";
      const opts=[["joy",L.c_joy,L.c_joyd,"🕹"],["carx",L.c_carx,L.c_carxd,"🎮"]];
      const btns={};
      const paint=()=>{for(const k in btns)btns[k].classList.toggle("sel",k===pick);};
      for(const[key,name,desc,ico]of opts){
        const b=document.createElement("button");b.className="qopt";b.dataset.c=key;
        b.innerHTML='<span class="qtick">✓</span><span>'+ico+" "+esc2(name)+
          '<span class="qd">'+esc2(desc)+"</span></span>";
        b.addEventListener("click",()=>{pick=key;paint();try{sfx&&sfx("sfx_ui",.6,1);}catch(e){}});
        btns[key]=b;card.appendChild(b);}
      paint();
      const ok2=document.createElement("button");ok2.id="obok";ok2.textContent=L.g_ok;
      ok2.addEventListener("click",()=>{try{sfx&&sfx("sfx_ok",.7,1);}catch(e){}
        save.scheme=pick;persist();applyScheme();step(3);});
      card.appendChild(ok2);
    }else{const h=document.createElement("div");h.className="obh";h.textContent="🏷️ "+L3("Tu nombre","Your name","Seu nome");card.appendChild(h);
      const sub=document.createElement("div");sub.className="obsub";sub.textContent=L3("Aparece sobre tu auto y sobre vos","Shows above your car and you","Aparece sobre seu carro e você");card.appendChild(sub);
      const inp=document.createElement("input");inp.id="obname";inp.maxLength=14;inp.autocomplete="off";
      inp.value=(save.name&&!/^Driver-/.test(save.name))?save.name:"";
      inp.placeholder=L3("Escribí tu nombre…","Type your name…","Escreva seu nome…");card.appendChild(inp);
      card.appendChild(obBtn(L.play,()=>{const v=(inp.value||"").trim();
        save.name=v?v.slice(0,14):("Driver-"+(Math.random()*9000+1000|0));
        save.onboarded=true;persist();ov.remove();res();}));
      setTimeout(()=>{try{inp.focus();}catch(e){}},120);}};
  step(0);});}

/* ================= boot ================= */
(async()=>{
  window.__dyBooted=true;
  L=STR[save.lang];
  document.getElementById("logo").src=url("images/logo.webp");
  S.loading.style.backgroundImage=`url('${url("images/loading.jpg")}')`;
  loadMsg.textContent=L.loading;
  resize();
  await loadAll();
  applyQuality();resize();
  prepareCars();initMarks();initSmoke();applyCtrlPos();applyScheme(); // posiciones y esquema de control
  loadPeds(); // precargar pilotos/animaciones en segundo plano: bajarse del auto es instantáneo
  requestAnimationFrame(frame);
  // mapa vivo de fondo mientras se elige idioma / gráficos / nombre
  buildWorld(save.map,save.time);clearMarks();clearSmoke();
  mode="title";for(const k in S)S[k].classList.add("hidden");
  hud.style.display="none";garageUI.style.display="none";
  if(!save.onboarded)await runOnboarding(); // idioma -> gráficos -> controles -> nombre (sobre el mapa)
  applyScheme();
  L=STR[save.lang];applyQuality();
  loadMsg.textContent=L.tip;
  buildTitle(false); // ya con idioma elegido; no reconstruye el mundo (mantiene el orbit)
})();
</script>
