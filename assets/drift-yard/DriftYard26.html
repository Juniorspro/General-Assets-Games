<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drift Yard</title>
<style>
:root{--aw:100vw;--ah:100vh;--vm:100vmin;--ink:#f2efe8;--dim:#9a958c;--bg:#191a1e;--panel:rgba(24,25,30,.82);
  --org:#ff7a1a;--yel:#ffd23c;--red:#e84040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden}
body.rot #app{inset:auto;top:0;left:0;width:100vh;height:100vw; /* unidades de viewport REALES: el propio #app define --aw/--ah */
  transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background-size:cover;background-position:center;text-align:center}
.screen.hidden{display:none}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,15,.55),rgba(12,12,15,.15) 40%,rgba(12,12,15,.65))}
.screen>*{position:relative}
#logo{width:min(calc(var(--ah)*0.4),calc(var(--aw)*0.64));filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tagline{font-style:italic;font-weight:400;opacity:.9;font-size:clamp(13px,calc(var(--ah)*0.022),18px)}
.btn{min-width:min(calc(var(--aw)*0.72),380px);padding:.7em 1.3em;font:900 clamp(14px,calc(var(--ah)*0.025),21px) inherit;letter-spacing:.07em;
  color:var(--ink);background:var(--panel);border:2px solid rgba(242,239,232,.35);border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.focus,.btn:hover:not(:disabled){border-color:var(--org);background:rgba(255,122,26,.18);
  box-shadow:0 0 16px rgba(255,122,26,.35)}
.btn small{display:block;font-weight:400;font-size:.6em;color:var(--dim);margin-top:.22em}
.title-xl{font-size:clamp(22px,calc(var(--ah)*0.052),44px);font-style:italic;letter-spacing:.05em;
  text-shadow:0 3px 0 rgba(0,0,0,.7)}
.org{color:var(--org)}.yel{color:var(--yel)}
.hint{color:var(--dim);font-weight:400;font-size:clamp(11px,calc(var(--ah)*0.018),14px);line-height:1.5}
#loadbar{width:min(calc(var(--aw)*0.7),420px);height:12px;background:var(--panel);border-radius:4px;overflow:hidden;
  border:1px solid rgba(242,239,232,.3)}
#loadbar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--yel),var(--org))}
#loadmsg{font-weight:400;color:var(--dim);font-size:13px}
#buildtag{position:absolute;bottom:8px;right:12px;font-weight:400;color:var(--dim);font-size:11px;opacity:.8}
#garage_ui{position:absolute;inset:0;z-index:10;display:none;pointer-events:none}
#garage_ui .top{position:absolute;top:calc(var(--ah)*0.03);left:0;right:0;text-align:center;padding:0 15%}
#carname{font-size:clamp(20px,calc(var(--vm)*0.072),46px);font-style:italic;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.7);line-height:1.02}
#stats,#gbest{display:none} /* el contenido ahora vive dentro de la barra #gbottom */
.stat{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:clamp(9px,calc(var(--vm)*0.02),12px);letter-spacing:.1em;color:var(--dim)}
.stat>span{flex:0 0 auto;min-width:calc(var(--vm)*0.11);white-space:nowrap}
.stat .bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.stat .bar>div{height:100%;background:var(--org)}
.garrow{position:absolute;top:46%;transform:translateY(-50%);pointer-events:auto;width:calc(var(--vm)*0.12);height:calc(var(--vm)*0.12);
  min-width:48px;min-height:48px;font:900 calc(var(--vm)*0.055) inherit;color:var(--ink);background:var(--panel);
  border:2px solid rgba(242,239,232,.35);border-radius:12px}
#gprev{left:calc(var(--vm)*0.02)}#gnext{right:calc(var(--vm)*0.02)}
.cyc{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1.5px solid rgba(242,239,232,.22);border-radius:8px;padding:3px 5px}
.cyclab{font-size:clamp(9px,calc(var(--vm)*0.018),11px);letter-spacing:.1em;color:var(--dim);flex:1;text-align:center;min-width:0}
.cyclab b{display:block;color:var(--ink);font-size:clamp(12px,calc(var(--vm)*0.026),15px)}
.coinbal{font:900 clamp(13px,calc(var(--vm)*0.03),20px) inherit;letter-spacing:.05em;color:var(--yel)}
.coinbal b{color:var(--ink)}
.btn.locked{opacity:.5}
.btn.mini{min-width:0!important;flex:0 0 auto;width:clamp(30px,calc(var(--vm)*0.07),40px);padding:.3em .2em;font-size:clamp(13px,calc(var(--vm)*0.03),17px)}
/* barra inferior del garaje: [stats+monedas] [opciones] [acción] — pensada para horizontal */
#gbottom{position:absolute;left:calc(var(--vm)*0.10);right:calc(var(--vm)*0.10);bottom:calc(var(--ah)*0.035);
  display:flex;align-items:stretch;justify-content:center;gap:calc(var(--vm)*0.018);pointer-events:auto}
.gsec{background:rgba(14,14,18,.6);border:1.5px solid rgba(242,239,232,.16);border-radius:12px;
  padding:7px 11px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.gsec.stats{flex:1.5}
.gsec.opts{flex:1;gap:6px;justify-content:center}
.gsec.act{flex:0 0 auto;gap:7px;min-width:calc(var(--vm)*0.20)}
.gsec.act .btn{min-width:0;width:100%;padding:.55em .6em;font-size:clamp(12px,calc(var(--vm)*0.026),18px)}
.gsmall{font-size:clamp(9px,calc(var(--vm)*0.018),12px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{position:absolute;inset:0;pointer-events:none;z-index:8;display:none}
#score{position:absolute;top:calc(var(--ah)*0.016);left:0;right:0;text-align:center;font-style:italic}
#score .total{font-size:clamp(24px,calc(var(--ah)*0.05),44px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#score .cur{font-size:clamp(15px,calc(var(--ah)*0.03),24px);color:var(--org);min-height:1.3em}
#score .cur .combo{color:var(--yel)}
#timer{position:absolute;top:calc(var(--ah)*0.02);right:calc(var(--aw)*0.024);font-size:clamp(17px,calc(var(--ah)*0.034),28px);font-style:italic;text-align:right}
#timer small{display:block;font-size:.55em;color:var(--dim);font-weight:400}
#hpbar{position:absolute;top:calc(var(--ah)*0.075);left:50%;transform:translateX(-50%);width:min(46vw,300px);height:9px;background:rgba(0,0,0,.5);border:1.5px solid rgba(242,239,232,.4);border-radius:5px;overflow:hidden}
#hpbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fd463,#ffd23c 60%,#e84040);transition:width .15s}
#speedo{position:absolute;right:calc(var(--aw)*0.024);bottom:calc(var(--ah)*0.02);text-align:right;font-style:italic}
#speedo .kmh{font-size:clamp(28px,calc(var(--ah)*0.056),48px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#speedo .unit{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.2em}
#speedo .ang{color:var(--org);font-size:clamp(12px,calc(var(--ah)*0.023),17px)}
#cparrow{position:absolute;left:50%;top:calc(var(--ah)*0.11);transform:translateX(-50%);font-size:clamp(22px,calc(var(--ah)*0.046),38px);
  color:var(--org);text-shadow:0 2px 0 rgba(0,0,0,.8);display:none}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:clamp(19px,calc(var(--ah)*0.04),34px);
  font-style:italic;color:var(--yel);text-shadow:0 3px 0 rgba(0,0,0,.8);opacity:0;transition:opacity .15s;white-space:nowrap}
#doorbtn{position:absolute;right:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.40);
  width:calc(var(--vm)*0.15);height:calc(var(--vm)*0.15);min-width:58px;min-height:58px;pointer-events:auto;
  font:900 calc(var(--vm)*0.05) inherit;color:var(--ink);z-index:7;border-radius:22%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;
  background:linear-gradient(180deg,rgba(66,68,80,.90),rgba(24,25,32,.93));
  border:2px solid rgba(242,239,232,.30);border-bottom:5px solid rgba(0,0,0,.55);
  box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
  text-shadow:0 2px 0 rgba(0,0,0,.55);-webkit-tap-highlight-color:transparent}
#doorbtn .ic{font-size:1.3em;line-height:.9}
#doorbtn .lb{font-size:.40em;letter-spacing:.10em;opacity:.72;font-weight:800}
#actbtn{position:absolute;top:calc(var(--ah)*0.14);left:50%;transform:translateX(-50%);pointer-events:auto;display:none;
  font:900 15px inherit;letter-spacing:.06em;color:var(--ink);background:rgba(190,32,32,.85);border:2px solid #ff5544;
  border-radius:10px;padding:.6em 1.1em;box-shadow:0 0 16px rgba(255,60,40,.5);z-index:7}
#foottouch{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
#foottouch .tbtn{position:absolute}
#camlook{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:calc(var(--vm)*.04);bottom:calc(var(--vm)*.05);width:calc(var(--vm)*.32);height:calc(var(--vm)*.32);
  min-width:128px;min-height:128px;border-radius:50%;background:rgba(20,22,28,.4);border:2px solid rgba(242,239,232,.25);
  pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
#joy.active{border-color:rgba(255,122,26,.6)}
#joyk{width:44%;height:44%;border-radius:50%;background:rgba(242,239,232,.85);border:2px solid rgba(255,122,26,.8);
  box-shadow:0 3px 14px rgba(0,0,0,.5);transform:translate(0,0);transition:transform .05s linear;will-change:transform}
#ftjump{right:calc(var(--vm)*.03);bottom:calc(var(--vm)*.06)}#ftpunch{right:calc(var(--vm)*.2);bottom:calc(var(--vm)*.06)}
/* a pie: salto abajo a la derecha, golpe al lado, y bajar/subir arriba de los dos */
body.onfoot #ftjump,body.onfoot #ftpunch{width:calc(var(--vm)*0.19);height:calc(var(--vm)*0.19);
  min-width:72px;min-height:72px}
body.onfoot #ftjump {right:calc(var(--vm)*0.035);bottom:calc(var(--vm)*0.05)}
body.onfoot #ftpunch{right:calc(var(--vm)*0.245);bottom:calc(var(--vm)*0.05)}
body.onfoot #doorbtn{right:calc(var(--vm)*0.035);bottom:calc(var(--vm)*0.27);
  width:calc(var(--vm)*0.19);height:calc(var(--vm)*0.19);min-width:72px;min-height:72px}
#pausebtn{position:absolute;top:calc(var(--ah)*0.02);left:calc(var(--aw)*0.024);width:40px;height:40px;pointer-events:auto;
  font:900 16px inherit;color:var(--ink);background:var(--panel);border:1.5px solid rgba(242,239,232,.35);border-radius:8px}
#cambtn{position:absolute;top:calc(var(--ah)*0.02);left:calc(var(--aw)*0.024 + 47px);width:40px;height:40px;pointer-events:auto;
  font:18px inherit;background:var(--panel);border:1.5px solid rgba(242,239,232,.35);border-radius:8px;z-index:9}
#touch{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
#joywrap{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
/* ===== botones táctiles: vidrio oscuro, borde inferior grueso (se sienten físicos) ===== */
.tbtn{position:absolute;pointer-events:auto;width:calc(var(--vm)*0.15);height:calc(var(--vm)*0.15);min-width:58px;min-height:58px;
  border-radius:22%;color:var(--ink);font:900 calc(var(--vm)*0.052) inherit;line-height:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;text-align:center;
  background:linear-gradient(180deg,rgba(66,68,80,.90),rgba(24,25,32,.93));
  border:2px solid rgba(242,239,232,.26);border-bottom:5px solid rgba(0,0,0,.55);
  box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
  text-shadow:0 2px 0 rgba(0,0,0,.55);-webkit-tap-highlight-color:transparent;user-select:none}
.tbtn .ic{font-size:1.35em;line-height:.9}
.tbtn .lb{font-size:.40em;letter-spacing:.10em;opacity:.72;font-weight:800}
.tbtn.small{font-size:calc(var(--vm)*0.030)}
.tbtn.active{filter:brightness(1.55) saturate(1.15);border-bottom-width:2px}
#tgas{border-color:rgba(140,225,90,.55)}#tgas.active{box-shadow:0 0 22px rgba(120,220,70,.55)}
#tbrake{border-color:rgba(110,175,255,.5)}#tbrake.active{box-shadow:0 0 22px rgba(90,169,255,.5)}
#thand{background:linear-gradient(180deg,rgba(196,58,44,.95),rgba(120,24,18,.95));border-color:#ff6a55}
#thand.active{box-shadow:0 0 22px rgba(255,85,68,.6)}
/* --- esquema CARX STREET: crucetas grandes a la izquierda + racimo 2x2 a la derecha --- */
body.sch-carx #tleft,body.sch-carx #tright{width:calc(var(--vm)*0.205);height:calc(var(--vm)*0.205);
  min-width:78px;min-height:78px;font-size:calc(var(--vm)*0.078)}
body.sch-carx #tleft{left:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.045)}
body.sch-carx #tright{left:calc(var(--vm)*0.255);bottom:calc(var(--vm)*0.045)}
body.sch-carx #tgas{right:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.045);
  width:calc(var(--vm)*0.205);height:calc(var(--vm)*0.205);min-width:78px;min-height:78px}
body.sch-carx #tbrake{right:calc(var(--vm)*0.255);bottom:calc(var(--vm)*0.045);
  width:calc(var(--vm)*0.185);height:calc(var(--vm)*0.185);min-width:70px;min-height:70px}
body.sch-carx #thand{right:calc(var(--vm)*0.255);bottom:calc(var(--vm)*0.255);
  width:calc(var(--vm)*0.185);height:calc(var(--vm)*0.185);min-width:70px;min-height:70px}
body.sch-carx #doorbtn{right:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.265);
  width:calc(var(--vm)*0.185);height:calc(var(--vm)*0.185);min-width:70px;min-height:70px}
/* --- esquema JOYSTICK: joystick a la izquierda, freno y puerta al costado --- */
body.sch-joy #tleft,body.sch-joy #tright,body.sch-joy #tgas{display:none!important}
body.drv-joy #joy{width:calc(var(--vm)*.36);height:calc(var(--vm)*.36);min-width:142px;min-height:142px}
body.sch-joy #tbrake{right:calc(var(--vm)*0.04);bottom:calc(var(--vm)*0.055);border-radius:50%;
  width:calc(var(--vm)*0.215);height:calc(var(--vm)*0.215);min-width:84px;min-height:84px}
body.sch-joy #thand{right:calc(var(--vm)*0.045);bottom:calc(var(--vm)*0.30);border-radius:50%;
  width:calc(var(--vm)*0.175);height:calc(var(--vm)*0.175);min-width:68px;min-height:68px}
body.sch-joy #doorbtn{right:calc(var(--vm)*0.29);bottom:calc(var(--vm)*0.075);
  width:calc(var(--vm)*0.175);height:calc(var(--vm)*0.175);min-width:68px;min-height:68px}

/* ===== iconos de control generados (vidrio translúcido, estilo CarX Street) =====
   Se activan cuando las 8 imágenes cargaron (body.uipng). Si el CDN no responde,
   quedan los botones dibujados por CSS y el juego sigue jugable igual. */
body.uipng .tbtn,body.uipng #doorbtn{background:rgba(255,255,255,.045);border:none;box-shadow:none;
  background-repeat:no-repeat;background-position:center;background-size:100% 100%;border-radius:22%}
body.uipng .tbtn .ic,body.uipng .tbtn .lb,body.uipng #doorbtn .ic,body.uipng #doorbtn .lb{display:none}
body.uipng #tgas  {background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/gas.webp")}
body.uipng #tbrake{background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/brake.webp")}
body.uipng #thand {background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/hand.webp")}
body.uipng #doorbtn{background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/door.webp")}
body.uipng #tleft {background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/left.webp")}
body.uipng #tright{background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/right.webp")}
body.uipng #ftjump{background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/jump.webp")}
body.uipng #ftpunch{background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/punch.webp")}
body.uipng .tbtn.active,body.uipng #doorbtn:active{
  filter:brightness(1.5) drop-shadow(0 0 12px rgba(255,255,255,.55))}
body.uipng #joy{background:none;border:none;box-shadow:none;border-radius:50%;
  background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/joybase.webp");background-size:100% 100%;background-repeat:no-repeat}
body.uipng #joy.active{filter:brightness(1.25) drop-shadow(0 0 14px rgba(255,255,255,.4))}
body.uipng #joyk{background:none;border:none;box-shadow:none;
  background-image:url("https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@fb896e3b2a144b1e9617f3557a0c3952d0de949a/assets/drift-yard/ui/joyknob.webp");background-size:100% 100%;background-repeat:no-repeat}
/* el freno de mano ya no se pinta de rojo: en CarX todos son del mismo vidrio */
/* #thand tenía un background SHORTHAND con selector de ID: reseteaba el background-size
   a auto y el icono salía sin escalar. Hay que reponerlo con igual especificidad. */
body.uipng #thand{background-color:rgba(255,255,255,.045);background-size:100% 100%;
  background-repeat:no-repeat;background-position:center;border-color:transparent}
/* con los PNG no se recorta a círculo (la imagen ya trae su forma redondeada) */
body.uipng.sch-joy #tbrake,body.uipng.sch-joy #thand{border-radius:22%}
#reloc{position:absolute;inset:0;z-index:12;display:none;pointer-events:none}
#reloc.on{display:block}
#reloctip{position:absolute;top:7%;left:50%;transform:translateX(-50%);pointer-events:none;
  background:rgba(20,20,24,.88);color:#f2efe8;padding:.5em 1em;border-radius:10px;
  font:800 clamp(12px,2.4vh,17px) inherit;text-align:center;max-width:82%}
#relocbar{position:absolute;top:calc(7% + 3.6em);left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
#relocbar .btn{min-width:0;padding:.55em 1.1em;font-size:clamp(12px,2.2vh,16px)}
body.relocating .tbtn,body.relocating #joy,body.relocating #doorbtn,body.relocating #pausebtn,
body.relocating #cambtn,body.relocating #chatbtn,body.relocating #micbtn{
  outline:2px dashed var(--org);outline-offset:2px;touch-action:none;opacity:.95}
body.relocating #camlook{display:none!important}
#dev{position:absolute;top:4px;left:52px;color:#0f0;font:12px monospace;display:none;z-index:99;
  background:rgba(0,0,0,.55);padding:2px 6px;pointer-events:none;white-space:pre}
.rowlist{display:flex;flex-direction:column;gap:10px;max-height:calc(var(--ah)*0.64);overflow-y:auto;padding:4px}
.results-grid{font-size:clamp(14px,calc(var(--ah)*0.027),21px);line-height:1.85;font-style:italic}
.medal{font-size:clamp(28px,calc(var(--ah)*0.056),50px)}

/* landscape compacto (celu rotado) */
.btnrow{display:flex;gap:8px;width:min(calc(var(--aw)*.72),380px)}
.btnrow .btn{min-width:0;flex:1;font-size:.72em;padding:.7em .4em}
body.compact .screen{gap:7px}
body.compact #logo{width:min(calc(var(--ah)*.3),240px)}
body.compact .btn{padding:.5em 1em}
body.compact .hint{font-size:10px;line-height:1.35}

/* ===== caché de assets en IndexedDB: recargas rapidísimas y offline =====
   clave = COMMIT|ruta, así al publicar una versión nueva se invalida sola. */
const CACHE_VER=(window.__COMMIT||"dev");
let _idbReady=null;
function idbOpen(){if(_idbReady)return _idbReady;
  _idbReady=new Promise(res=>{
    try{if(!self.indexedDB)return res(null);
      const rq=indexedDB.open("driftyard-assets",1);
      rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains("a"))db.createObjectStore("a");};
      rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null);
    }catch{res(null);}});
  return _idbReady;}
async function idbGet(key){const db=await idbOpen();if(!db)return null;
  return new Promise(res=>{try{const t=db.transaction("a","readonly").objectStore("a").get(key);
    t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);}catch{res(null);}});}
async function idbSet(key,val){const db=await idbOpen();if(!db)return;
  return new Promise(res=>{try{const t=db.transaction("a","readwrite").objectStore("a").put(val,key);
    t.oncomplete=()=>res();t.onerror=()=>res();t.onabort=()=>res();}catch{res();}});}
// limpia entradas de commits viejos para no acumular disco
async function idbPrune(){const db=await idbOpen();if(!db)return;
  try{const st=db.transaction("a","readwrite").objectStore("a"),rq=st.getAllKeys();
    rq.onsuccess=()=>{for(const k of rq.result)if(typeof k==="string"&&k.indexOf(CACHE_VER+"|")!==0)st.delete(k);};}catch{}}
async function fetchBuf(p){
  const key=CACHE_VER+"|"+p;
  const hit=await idbGet(key);
  if(hit&&hit.byteLength)return hit;                    // servido desde caché local (instantáneo)
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),35000); // sin timeout un fetch colgado frena la carga entera
  try{const r=await fetch(url(p),{signal:ctl.signal});
    if(!r.ok)throw new Error("HTTP "+r.status+" "+p);
    const buf=await r.arrayBuffer();
    idbSet(key,buf.slice(0));                           // guardar copia para próximas recargas (sin frenar)
    return buf;}
  finally{clearTimeout(to);}}
const MIME={png:"image/png",webp:"image/webp",jpg:"image/jpeg",jpeg:"image/jpeg"};
/* baja la resolución de una textura al máximo del preset (ahorra VRAM y ancho de banda) */
function downscaleTex(img,max){
  const w=img.width||img.naturalWidth,h=img.height||img.naturalHeight;
  if(!w||!h||Math.max(w,h)<=max)return null;
  const k=max/Math.max(w,h),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
  const c=document.createElement("canvas");c.width=cw;c.height=ch;
  c.getContext("2d").drawImage(img,0,0,cw,ch);return c;}
function texFromBuf(buf,p,srgb){return new Promise((res,rej)=>{
  const bu=URL.createObjectURL(new Blob([buf],{type:MIME[p.split(".").pop()]||"image/jpeg"}));
  texLoader.load(bu,t=>{URL.revokeObjectURL(bu);
    if(srgb)t.colorSpace=THREE.SRGBColorSpace;
      t.anisotropy=(typeof QP!=="undefined"?QP.aniso:4);
      try{const small=downscaleTex(t.image,(typeof QP!=="undefined"?QP.texMax:2048));
        if(small){t.image=small;t.needsUpdate=true;}}catch(e){}
      res(t);},
    undefined,e=>{URL.revokeObjectURL(bu);rej(e);});});}
function glbFromBuf(buf){return new Promise((res,rej)=>gltfLoader.parse(buf,"",res,rej));}
async function runTasks(tasks){
  loadTotal=tasks.length;loadDone=0;
  const paint=()=>{loadBar.style.width=(100*loadDone/Math.max(loadTotal,1))+"%";
    loadMsg.textContent=`${L.loading} ${loadDone}/${loadTotal}`;};
  paint();
  let pend=tasks.slice();
  for(let round=0;round<8&&pend.length;round++){
    if(round){loadMsg.textContent=`REINTENTANDO ${pend.length}…`;
      await new Promise(r=>setTimeout(r,900*round));}
    const failed=[];let idx=0;
    const PAR=(typeof QP!=="undefined"&&QP.par)||8;   // 8 decodificaciones a la vez reventaban la RAM
    await Promise.all(Array.from({length:PAR},async()=>{
      while(idx<pend.length){const t=pend[idx++];
        try{const buf=await fetchBuf(t.p);
          if(t.kind==="tex")t.assign(await texFromBuf(buf,t.p,t.srgb));
          else if(t.kind==="glb")t.assign(await glbFromBuf(buf));
          else t.assign(buf);
          loadDone++;paint();
        }catch(e){failed.push(t);}}}));
    pend=failed;}
  loadFailed=pend.map(t=>t.p);
  return pend;}

function sfx(n,vol=1,rate=1){const s=SND[n];if(!save.sound||!actx||!s||!s.buf)return;
  const src=actx.createBufferSource();src.buffer=s.buf;src.playbackRate.value=rate;

// choque SECO y corto (~0.3s): thump grave + click de impacto. Reemplaza el crash largo/ruidoso.
let _dryNoise=null;
function dryHit(vol=1,rate=1){if(!save.sound||!actx)return;
  const t=actx.currentTime,out=actx.createGain();out.gain.value=Math.min(1,vol)*MIX.sfx*1.4;out.connect(master);
  const o=actx.createOscillator();o.type="sine";o.frequency.setValueAtTime(150*rate,t);o.frequency.exponentialRampToValueAtTime(46,t+.16);
  const og=actx.createGain();og.gain.setValueAtTime(.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.26);
  o.connect(og);og.connect(out);o.start(t);o.stop(t+.28);
  if(!_dryNoise){const len=(actx.sampleRate*0.1)|0;_dryNoise=actx.createBuffer(1,len,actx.sampleRate);
    const d=_dryNoise.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);}
  const n=actx.createBufferSource();n.buffer=_dryNoise;
  const bp=actx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1600*rate;bp.Q.value=.6;
  const ng=actx.createGain();ng.gain.setValueAtTime(.7,t);ng.gain.exponentialRampToValueAtTime(.001,t+.12);
  n.connect(bp);bp.connect(ng);ng.connect(out);n.start(t);n.stop(t+.12);}
/* En ULD/BAJA la música se REPRODUCE EN STREAMING con un <audio>: no se decodifica a
   PCM, así que ocupa ~0 de RAM (decodificar los dos temas eran ~120 MB y en un celu de
   3 GB eso mataba la pestaña justo al terminar de cargar). En ALTA sigue por WebAudio. */
let musicEl=null,musicElName="";
function musicStream(n){
  const src=url("audio/"+n+".m4a");
  if(!musicEl){musicEl=document.createElement("audio");musicEl.loop=true;musicEl.preload="none";
    musicEl.crossOrigin="anonymous";musicEl.style.display="none";document.body.appendChild(musicEl);}
  musicEl.volume=Math.min(1,MIX.music*2.2);            // sin el master de WebAudio: subo un poco
  if(musicElName!==n){musicElName=n;musicEl.src=src;}
  const pr=musicEl.play();if(pr&&pr.catch)pr.catch(()=>{});}
function music(n){stopMusic();if(!save.sound)return;
  if(typeof QP!=="undefined"&&QP.streamMusic){musicStream(n);return;}
  const s=SND[n];if(!actx||!s||!s.buf)return;
  musicSrc=actx.createBufferSource();musicSrc.buffer=s.buf;musicSrc.loop=true;
  const g=actx.createGain();g.gain.value=MIX.music;musicSrc.connect(g);g.connect(master);musicSrc.start();}
function stopMusic(){if(musicSrc){try{musicSrc.stop();}catch{}musicSrc=null;}
  if(musicEl){try{musicEl.pause();}catch{}}}
const skidRef={src:null,gain:null};
/* ===== motor PROCEDURAL (Web Audio, sin samples): dos sawtooth detunados + sub
   cuadrado + ruido de admisión, todo a través de un lowpass; la frecuencia base
   la maneja el RPM. Suena a motor de verdad y pesa 0 KB. ===== */
const eng={on:false,nodes:null,gear:0};
function engineStart(){if(!actx||eng.on)return;
  const pr=carSnd(save.car|0);eng.prof=pr;               // timbre propio del auto elegido
  const g=actx.createGain();g.gain.value=0;g.connect(master);
  // cadena: osciladores -> "growl" resonante -> lowpass que abre con RPM -> g
  const lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=800;lp.Q.value=8;lp.connect(g);
  const growl=actx.createBiquadFilter();growl.type="peaking";growl.frequency.value=pr.growl;growl.Q.value=3.2;growl.gain.value=10;growl.connect(lp);

/* ===== PRESETS de calidad: BAJA recorta densidad, sombras, texturas y filtros ===== */
/* Tres escalones. ULD ("ultra low device") apunta a celulares de gama baja tipo J8
   (Mali-G71 MP2, 3 GB): lo que los mata es el RELLENO de píxeles y la RAM, no los
   triángulos. Por eso ULD baja resolución, recorta el alcance, apaga los sprites
   aditivos (puro overdraw), achica las texturas y hace streaming de la música en
   vez de decodificarla a PCM (que era lo que reventaba la memoria). */
const QPRESET={
  uld :{dpr:.58, shadow:0,    shadowType:THREE.BasicShadowMap, shadowEvery:8, dens:.22, aniso:1,
        texMax:256,  cullDist:110, smoke:36,  treeShadow:false, fogMul:2.4, far:560, marks:420,
        marksTex:512, par:3, streamMusic:true,  glow:false, smokeSize:2.6, segMul:.45, fpsFloor:.8,
        mats:"phong", texSlots:1},
  low :{dpr:.72, shadow:0,    shadowType:THREE.BasicShadowMap, shadowEvery:4, dens:.34, aniso:1,
        texMax:384,  cullDist:132, smoke:70,  treeShadow:false, fogMul:2.1, far:760, marks:900,
        marksTex:1024, par:4, streamMusic:true,  glow:true,  smokeSize:3.2, segMul:.62, fpsFloor:.65,
        mats:"phong", texSlots:3},
  high:{dpr:1.75,shadow:2048, shadowType:THREE.PCFSoftShadowMap,shadowEvery:2, dens:1,   aniso:8,
        texMax:2048, cullDist:420, smoke:320, treeShadow:true,  fogMul:1, far:2000, marks:2200,

let QP=QPRESET[save.quality]||QPRESET.uld;
let resScale=1;   // escala de resolución adaptativa (la ajusta el medidor de FPS)
function applyQuality(){QP=QPRESET[save.quality]||QPRESET.uld;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,QP.dpr)*resScale);
  // BAJA: el mapa de sombras es lo más caro en móviles => se apaga del todo
  if(QP.shadow===0){ renderer.shadowMap.enabled=false; sun.castShadow=false;
    if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;} }
  else { renderer.shadowMap.enabled=true; sun.castShadow=true; renderer.shadowMap.type=QP.shadowType;
    if(sun.shadow.mapSize.x!==QP.shadow){sun.shadow.mapSize.set(QP.shadow,QP.shadow);
      if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
    const ext=190;
    sun.shadow.camera.left=-ext;sun.shadow.camera.right=ext;
    sun.shadow.camera.top=ext;sun.shadow.camera.bottom=-ext;sun.shadow.camera.updateProjectionMatrix(); }
  // plano lejano más corto = menos geometría y mejor precisión de profundidad
  if(camera.far!==QP.far){ camera.far=QP.far; camera.updateProjectionMatrix(); }
  if(scene.fog&&scene.fog.density&&QP.fogMul!==1&&!scene.fog.__mul){
    scene.fog.density*=QP.fogMul;scene.fog.__mul=1;}
  if(smokeMat)smokeMat.size=QP.smokeSize||3.6;}

function canvasTex(w,h,draw,{srgb=true}={}){const c=document.createElement("canvas");c.width=w;c.height=h;
  draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;
  t.userData.own=true;   // procedural: al reconstruir el mundo se puede liberar (las de A.tex NO)
  return t;}
// asfalto de pista: usa la textura real generada (gp_asphalt); fallback procedural si no cargó
function gpAsphaltTex(){
  if(A.tex&&A.tex.gp_asphalt){A.tex.gp_asphalt.wrapS=A.tex.gp_asphalt.wrapT=THREE.RepeatWrapping;return A.tex.gp_asphalt;}
  return canvasTex(512,512,(g,w,h)=>{
    g.fillStyle="#70747b";g.fillRect(0,0,w,h);
    for(let i=0;i<30000;i++){const x=(i*97)%w,y=(i*57)%h,d=((i*2654435761)>>>0)%40,base=d<20?96:56;
      g.fillStyle="rgba("+base+","+(base+4)+","+(base+9)+",.3)";g.fillRect(x,y,1,1);}});}
function gpCheckerTex(){return canvasTex(256,64,(g,w,h)=>{for(let y=0;y<2;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?"#111":"#f4f0e6";g.fillRect(x*32,y*32,32,32);}});}
function gpCheckFlagTex(){return canvasTex(128,64,(g,w,h)=>{g.fillStyle="#ff7a1a";g.fillRect(0,0,w,h);g.fillStyle="#f4f0e6";
  for(let x=-h;x<w;x+=32){g.beginPath();g.moveTo(x,h);g.lineTo(x+h,0);g.lineTo(x+h+14,0);g.lineTo(x+14,h);g.fill();}});}

function checkGate(group,px,pz,ry,span,start){
  const gate=new THREE.Group();gate.position.set(px,0,pz);gate.rotation.y=ry;
  const H=6.4,postMat=new THREE.MeshStandardMaterial({color:0xeef0f2,roughness:.5,metalness:.2});
  for(const s of[-1,1]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.3,.34,H,12),postMat);
    post.position.set(s*span,H/2,0);post.castShadow=true;gate.add(post);}
  // barra superior que une los dos postes
  const topBar=new THREE.Mesh(new THREE.BoxGeometry(span*2+.7,.5,.5),new THREE.MeshStandardMaterial({color:0x24272d,metalness:.5,roughness:.5}));
  topBar.position.set(0,H-.25,0);gate.add(topBar);
  // BANDERA que cuelga de la barra, del ancho EXACTO entre los dos postes
  const tex=start?gpCheckerTex():gpCheckFlagTex();
  tex.wrapS=THREE.RepeatWrapping;tex.repeat.set(Math.max(4,Math.round(span*2/2.4)),1);
  const ban=new THREE.Mesh(new THREE.BoxGeometry(span*2,1.6,.14),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
  ban.position.set(0,H-1.15,0);gate.add(ban);

const A={tex:{},glb:{},img:{}};
/* OJO: Texture.clone() en three crea una textura NUEVA con su propia subida a la GPU
   (mismo bitmap, otro uuid). Cada stdMat() clonaba hasta 4 y no se liberaban nunca: eran
   decenas de MB de VRAM duplicada por mapa, y se acumulaban al reconstruir. Ahora los
   clones se cachean por (textura + repetición), así se comparten entre materiales. */
const _texClones=new Map();
function repTex(name,rx,ry){
  const key=name+"|"+rx+"x"+ry;let c=_texClones.get(key);
  if(c)return c;
  const t=A.tex[name];if(!t)return null;
  c=t.clone();c.needsUpdate=true;c.wrapS=c.wrapT=THREE.RepeatWrapping;c.repeat.set(rx,ry);
  c.userData.own=true;c.userData.shared=true;_texClones.set(key,c);return c;}
function stdMat(id,{repeat=[1,1],color=0xffffff,rough=1}={}){
  /* ULD: sólo color (1 textura por material). BAJA: color + normal + ao, sin el mapa de
     rugosidad (Phong no lo usa). ALTA: los cuatro. */
  const ALL=[["map","color"],["normalMap","normal"],["aoMap","ao"],["roughnessMap","rough"]];
  const slots=ALL.slice(0,QP.texSlots||4);
  const maps={};for(const[k,suf]of slots){
    const c=repTex(`${id}_${suf}`,repeat[0],repeat[1]);if(c)maps[k]=c;}
  const m=new THREE.MeshStandardMaterial({color,roughness:rough,...maps});
  // en ULD no va el aoMap: compenso el oscurecido que aportaba, así el terreno no queda lavado
  if((QP.texSlots||4)<2)m.color.multiplyScalar(.92);   // sin aoMap: compenso el oscurecido
  m.userData.own=true;return m;}

function normalizeModel(glb,{length=null,height=null,rotY=0}={}){
  if(!glb)return null;
  const root=glb.scene.clone(true);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;
    if(o.material&&o.material.transparent){o.material=o.material.clone();
      o.material.transparent=false;o.material.alphaTest=.5;o.material.depthWrite=true;}}});
  const g=new THREE.Group();g.add(root);
  root.rotation.y=rotY;
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3());
  let s=1;
  if(length)s=length/Math.max(size.z,1e-4);
  else if(height)s=height/Math.max(size.y,1e-4);
  root.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(root);
  const c=b2.getCenter(new THREE.Vector3());
  root.position.x-=c.x;root.position.z-=c.z;root.position.y-=b2.min.y;
  return g;}
function autoCar(glb,len){if(!glb)return null;
  const probe=new THREE.Box3().setFromObject(glb.scene);
  const sz=probe.getSize(new THREE.Vector3());
  return normalizeModel(glb,{length:len,rotY:sz.x>sz.z?Math.PI/2:0});}
function mergedForInstancing(glb,opts){
  const g=normalizeModel(glb,opts);if(!g)return null;
  g.updateMatrixWorld(true);
  let geo=null,mat=null;
  g.traverse(o=>{if(o.isMesh&&!geo){geo=o.geometry.clone();geo.applyMatrix4(o.matrixWorld);
    for(const n of Object.keys(geo.attributes))if(!["position","normal","uv"].includes(n))geo.deleteAttribute(n);
    mat=o.material;}});
  return geo?{geo,mat}:null;}

/* recorta un agujero rectangular en el piso (para ver el pozo de la trituradora) */
function _uvFit(g,w,d){const pa=g.attributes.position,uv=[];
  for(let i=0;i<pa.count;i++)uv.push(pa.getX(i)/w+.5,pa.getY(i)/d+.5);
  g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));}
function _holePath(h){const p=new THREE.Path(),hx=h.x,hz=-h.z; // shape.y -> -world.z tras rotateX
  p.moveTo(hx-h.hw,hz-h.hd);p.lineTo(hx+h.hw,hz-h.hd);p.lineTo(hx+h.hw,hz+h.hd);p.lineTo(hx-h.hw,hz+h.hd);p.closePath();return p;}
function rectHoleGeo(w,d,hole){const s=new THREE.Shape();
  s.moveTo(-w/2,-d/2);s.lineTo(w/2,-d/2);s.lineTo(w/2,d/2);s.lineTo(-w/2,d/2);s.closePath();
  s.holes.push(_holePath(hole));const g=new THREE.ShapeGeometry(s);_uvFit(g,w,d);g.rotateX(-Math.PI/2);return g;}
function circleHoleGeo(r,hole){const s=new THREE.Shape();s.absarc(0,0,r,0,Math.PI*2,false);
  s.holes.push(_holePath(hole));const g=new THREE.ShapeGeometry(s,52);_uvFit(g,r*2,r*2);g.rotateX(-Math.PI/2);return g;}

/* ================= world helpers ================= */
let world=null;
const M4=new THREE.Matrix4(),QT=new THREE.Quaternion(),EU=new THREE.Euler(),V=new THREE.Vector3();
function obb(x,z,hw,hd,rot){return{type:"obb",x,z,hw,hd,cos:Math.cos(-rot),sin:Math.sin(-rot),rot};}
/* recorta una lista de props según la densidad de calidad (BAJA = menos modelos) */
function thin(items,keep){ if(!items||!items.length)return items;
  const k=(keep==null?QP.dens:keep); if(k>=1)return items;
  const out=[];for(let i=0;i<items.length;i++)if(((i*0.6180339887)%1)<k)out.push(items[i]);
  return out.length?out:items.slice(0,1); }
/* Reparte los props en CHUNKS espaciales de CHUNK m: cada chunk es su propia InstancedMesh
   (sigue siendo 1 draw call) pero así el frustum culling de three y el culling por distancia
   pueden descartar CHUNKS ENTEROS. Con una sola instancia gigante que cubre todo el mapa,
   three nunca podía descartar nada y se dibujaba todo siempre. */
const CHUNK=115;   // grande a propósito: pocos draw calls y aun así se descarta lo lejano
function instChunks(group,geo,mat,items,{shadow=true,tag="prop"}={}){
  if(!geo||!mat||!items||!items.length)return null;
  const buckets=new Map();
  if(items.length<40){   // pocos props: una sola instancia sale más barato que varios chunks
    const inst=new THREE.InstancedMesh(geo,mat,items.length);
    inst.castShadow=shadow; let sx=0,sz=0;
    items.forEach((it,i)=>{EU.set(0,it[2]||0,0);QT.setFromEuler(EU);
      const sc=it[4]||1; M4.compose(V.set(it[0],it[3]||0,it[1]),QT,new THREE.Vector3(sc,sc,sc));
      inst.setMatrixAt(i,M4); sx+=it[0]; sz+=it[1];});
    inst.instanceMatrix.needsUpdate=true;
    inst.userData.cx=sx/items.length; inst.userData.cz=sz/items.length; inst.userData.chunk=tag;
    try{ inst.computeBoundingSphere(); }catch(e){}
    group.add(inst); return [inst];}
  for(const it of items){
    const k=Math.floor(it[0]/CHUNK)+"|"+Math.floor(it[1]/CHUNK);
    let arr=buckets.get(k); if(!arr)buckets.set(k,arr=[]);
    arr.push(it);}
  const out=[];
  for(const arr of buckets.values()){
    const inst=new THREE.InstancedMesh(geo,mat,arr.length);
    inst.castShadow=shadow;
    let sx=0,sz=0;
    arr.forEach((it,i)=>{EU.set(0,it[2]||0,0);QT.setFromEuler(EU);
      const sc=it[4]||1;

function buildBosque(group,timeKey){
  const rng=mulberry32(4242);
  const{colliders,T}=baseEnv(group,timeKey,{fenceOn:false,apron:false,noGround:true,w:1,d:1,marks:null,skyBiome:"bosque"});
  // grass world
  const gm=stdMat("ground",{repeat:[200,200]});gm.color.set(0x6f8a55);
  const terr=new THREE.Mesh(new THREE.CircleGeometry(1600,48),gm);
  terr.rotation.x=-Math.PI/2;terr.position.y=-.02;terr.receiveShadow=true;group.add(terr);
  // road loop
  const pts=[[0,-260],[170,-240],[290,-140],[310,20],[220,120],[250,240],[80,300],
    [-120,260],[-90,120],[-230,80],[-320,-60],[-230,-220]].map(p=>new THREE.Vector3(p[0],0,p[1]));
  const curve=new THREE.CatmullRomCurve3(pts,true,"centripetal",.5);
  curve.arcLengthDivisions=2000;
  const len=curve.getLength(),ds=4,n=Math.ceil(len/ds);
  const P=[],TN=[],LF=[];
  for(let i=0;i<n;i++){P.push(curve.getPointAt(i/n));TN.push(curve.getTangentAt(i/n).normalize());}
  for(let i=0;i<n;i++)LF.push(new THREE.Vector3(TN[i].z,0,-TN[i].x).normalize());
  const halfW=5.5;
  function ribbon(l1,l2,y,mat,uAcross){
    const pos=[],uv=[],idx=[];
    for(let i=0;i<=n;i++){const ii=i%n;
      const p1=P[ii].clone().addScaledVector(LF[ii],l1);
      const p2=P[ii].clone().addScaledVector(LF[ii],l2);
      pos.push(p1.x,y,p1.z,p2.x,y,p2.z);
      const v=(i*ds)/7;uv.push(0,v,uAcross,v);}
    for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat);m.receiveShadow=true;group.add(m);}
  const roadMat=new THREE.MeshStandardMaterial({map:gpAsphaltTex(),roughness:.93});
  roadMat.map.wrapS=roadMat.map.wrapT=THREE.RepeatWrapping;roadMat.map.anisotropy=(typeof QP!=="undefined"?QP.aniso:8);
  ribbon(-halfW,halfW,.01,roadMat,2.2);
  const lineMat=new THREE.MeshBasicMaterial({color:0xe8e4da,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-6});
  ribbon(-halfW+.1,-halfW+.4,.06,lineMat,1);
  ribbon(halfW-.4,halfW-.1,.06,lineMat,1);
  // trees (X billboards) — oaks & pines mixed, denser near road but never on it
  const oaks=[],pines2=[];
  let treeCols=0;
  for(let i=0;i<1700;i++){
    const a=rng()*6.28,r=55+rng()*560;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    // distancia a la ruta muestreada FINA (cada 2 puntos = 8 m: antes se colaban árboles en curvas)
    let dmin=1e9;for(let j=0;j<n;j+=2){const dx=P[j].x-x,dz=P[j].z-z;
      const d2=dx*dx+dz*dz;if(d2<dmin)dmin=d2;}
    dmin=Math.sqrt(dmin);
    if(dmin<halfW+5.5)continue;
    const s=9+rng()*8;
    (rng()<.55?oaks:pines2).push([x,z,rng()*6.28,s]);
    // TODOS los árboles chocan (la grilla espacial lo hace barato) — troncos sólidos
    treeCols++;colliders.push({type:"circle",x,z,r:.7});}
  billboardTrees(group,"tree_oak",oaks);
  billboardTrees(group,"tree_pine",pines2);
  // abedules y arbustos densifican cerca de la ruta, árboles secos a lo lejos
  {const birch=[],bush=[],dead=[];
   for(let i=0;i<520;i++){const a=rng()*6.28,r2=50+rng()*480;
     const x=Math.cos(a)*r2,z=Math.sin(a)*r2;
     let dmin=1e9;for(let j=0;j<n;j+=3){const dx=P[j].x-x,dz=P[j].z-z;
       const d2=dx*dx+dz*dz;if(d2<dmin)dmin=d2;}
     if(Math.sqrt(dmin)<halfW+3.5)continue;
     const pick=rng();
     if(pick<.4)birch.push([x,z,rng()*6.28,8+rng()*6]);
     else if(pick<.85)bush.push([x,z,rng()*6.28,1.6+rng()*1.8]);
     else dead.push([x,z,rng()*6.28,6+rng()*4]);}
   billboardTrees(group,"tree_birch",birch);
   billboardTrees(group,"bush",bush);
   billboardTrees(group,"tree_dead",dead);}
  // lago con pueblito en la orilla (key art v2)
  {const lake=new THREE.Mesh(new THREE.CircleGeometry(52,36),
     new THREE.MeshStandardMaterial({color:0x2e5a72,roughness:.15,metalness:.1}));
   lake.rotation.x=-Math.PI/2;lake.position.set(-20,.05,30);group.add(lake);
   colliders.push({type:"circle",x:-20,z:30,r:52});
   const houseT2=normalizeModel(A.glb.house,{height:7});
   if(houseT2)for(const[x,z,ry]of[[-86,42,1.2],[-78,72,2],[-52,88,2.6],[-90,10,.6]]){
     const h=houseT2.clone(true);h.position.set(x,0,z);h.rotation.y=ry;group.add(h);
     colliders.push(obb(x,z,4.5,3.5,ry));}
   const barnT=normalizeModel(A.glb.barn,{height:9});
   if(barnT){const b2=barnT.clone(true);b2.position.set(-108,0,60);b2.rotation.y=1.1;group.add(b2);
     colliders.push(obb(-108,60,5,6,1.1));}}
  // autos estacionados en el pueblo + decoración
  {const vanT2=autoCar(A.glb.parked_b,5.2),hatchT2=autoCar(A.glb.parked_a,4.1);
   for(const[x,z,ry,t]of[[-70,60,1.9,hatchT2],[-60,84,2.4,vanT2],[-95,28,.7,hatchT2]]){
     if(!t)continue;const c=t.clone(true);c.position.set(x,0,z);c.rotation.y=ry;group.add(c);
     colliders.push(obb(x,z,1.1,2.4,ry));}}
  // gasolinera junto a la ruta
  {const gasT=normalizeModel(A.glb.gas,{height:6.5});
   if(gasT){const i=Math.floor(.22*n),side=-1;
     const p=P[i].clone().addScaledVector(LF[i],side*(halfW+14));
     const g2=gasT.clone(true);g2.position.copy(p);
     g2.rotation.y=Math.atan2(TN[i].x,TN[i].z)+Math.PI/2;group.add(g2);
     colliders.push(obb(p.x,p.z,7,5,g2.rotation.y));}}
  // houses near the road
  const houseT=normalizeModel(A.glb.house,{height:7});
  if(houseT)for(const t of[.12,.34,.55,.72,.9]){
    const i=Math.floor(t*n);const side=t<.5?1:-1;
    const p=P[i].clone().addScaledVector(LF[i],side*(halfW+12));
    const h=houseT.clone(true);h.position.copy(p);
    h.rotation.y=Math.atan2(TN[i].x,TN[i].z)+ (side>0?-Math.PI/2:Math.PI/2);
    group.add(h);colliders.push(obb(p.x,p.z,4.5,3.5,h.rotation.y));}
  // checkpoints (arcos limpios)
  const cps=[];const NCP=10;
  for(let k=0;k<NCP;k++){const i=Math.floor(k/NCP*n),p=P[i];cps.push({x:p.x,z:p.z,r:11});
    checkGate(group,p.x,p.z,Math.atan2(TN[i].x,TN[i].z),halfW+.8,k===0);}
  return{colliders,spawn:{x:P[4].x,z:P[4].z,h:Math.atan2(TN[4].x,TN[4].z)},
    bounds:{W:1500,D:1500},road:{P,TN,LF,n,ds,halfW},checkpoints:cps};}

/* ===== GRAN PREMIO: circuito estilo Fórmula 1, ancho y enorme, con drift rápido ===== */
function buildGP(group,timeKey){
  const rng=mulberry32(9091);
  // el GP es siempre de día soleado (look verde tipo Suzuka), sin importar el horario elegido
  const{colliders}=baseEnv(group,"dia",{fenceOn:false,apron:false,noGround:true,w:1,d:1,marks:null,skyBiome:"bosque"});
  // luz extra para el look soleado y verde
  group.add(new THREE.HemisphereLight(0xdff0ff,0x557f38,0.7));
  // ---- materiales propios del GP (texturas generadas; con fallback de color) ----
  const grassTex=A.tex&&A.tex.gp_grass;
  const gMat=grassTex?new THREE.MeshStandardMaterial({map:grassTex,roughness:1}):new THREE.MeshStandardMaterial({color:0x4f8236,roughness:1});
  if(grassTex)grassTex.repeat.set(240,240);
  // asfalto de pista procedural: gris medio + agregado + gomas (tileable, se ve como pista real)
  const asphTex=gpAsphaltTex();
  asphTex.wrapS=asphTex.wrapT=THREE.RepeatWrapping;asphTex.anisotropy=(typeof QP!=="undefined"?QP.aniso:8);
  const roadMat=new THREE.MeshStandardMaterial({map:asphTex,roughness:.94,metalness:.02});
  const crowdImg=A.img&&A.img.gp_crowd;
  const crowdMat=new THREE.MeshBasicMaterial({map:crowdImg||null,color:crowdImg?0xffffff:0x6a5f7a,side:THREE.DoubleSide});
  const hoardImg=A.img&&A.img.gp_hoarding;if(hoardImg)hoardImg.wrapS=THREE.RepeatWrapping;
  const hoardMat=new THREE.MeshBasicMaterial({map:hoardImg||null,color:hoardImg?0xffffff:0xff7a1a,side:THREE.DoubleSide});
  // PASTO verde por todo el terreno
  const terr=new THREE.Mesh(new THREE.CircleGeometry(1400,60),gMat);
  terr.rotation.x=-Math.PI/2;terr.position.y=-.05;terr.receiveShadow=true;group.add(terr);
  // colinas verdes suaves en el horizonte (profundidad)
  {const hillMat=new THREE.MeshStandardMaterial({color:0x3f6f2c,roughness:1});
   for(let i=0;i<26;i++){const a=i/26*6.2832+rng()*.2,r=760+rng()*260;
     const rad=90+rng()*130,hh=26+rng()*40;
     const hill=new THREE.Mesh(new THREE.SphereGeometry(rad,10,7),hillMat);
     hill.scale.y=hh/rad;hill.position.set(Math.cos(a)*r,-rad*(1-hh/rad)-2,Math.sin(a)*r);group.add(hill);}}
  // ---- trazado GP amplio ----
  const pts=[[-360,-360],[-360,240],[-300,360],[-140,384],[-20,300],[60,362],[210,384],
    [352,300],[388,110],[300,18],[366,-170],[262,-306],[60,-372],[-170,-346],[-306,-320]]
    .map(p=>new THREE.Vector3(p[0],0,p[1]));
  const curve=new THREE.CatmullRomCurve3(pts,true,"centripetal",.5);curve.arcLengthDivisions=2600;
  const len=curve.getLength(),ds=4,n=Math.ceil(len/ds);
  const P=[],TN=[],LF=[];
  for(let i=0;i<n;i++){P.push(curve.getPointAt(i/n));TN.push(curve.getTangentAt(i/n).normalize());}
  for(let i=0;i<n;i++)LF.push(new THREE.Vector3(TN[i].z,0,-TN[i].x).normalize());
  const halfW=9.5;
  function ribbon(l1,l2,y,mat,uAcross,uScale){const pos=[],uv=[],idx=[];
    for(let i=0;i<=n;i++){const ii=i%n;
      const p1=P[ii].clone().addScaledVector(LF[ii],l1),p2=P[ii].clone().addScaledVector(LF[ii],l2);
      pos.push(p1.x,y,p1.z,p2.x,y,p2.z);const v=(i*ds)/(uScale||7);uv.push(0,v,uAcross,v);}
    for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
    const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat);m.receiveShadow=true;group.add(m);return m;}
  // muro/pared vertical siguiendo la pista (para vallas y hoardings)
  function wallRibbon(lat,y0,y1,mat,uScale){const pos=[],uv=[],idx=[];
    for(let i=0;i<=n;i++){const ii=i%n;const p=P[ii].clone().addScaledVector(LF[ii],lat);
      pos.push(p.x,y0,p.z,p.x,y1,p.z);const u=(i*ds)/(uScale||8);uv.push(u,0,u,1);}
    for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+1,a+2,a+2,a+1,a+3);}
    const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat);group.add(m);return m;}
  ribbon(-halfW,halfW,.02,roadMat,3.2,9);
  // línea central discontinua + bordes blancos
  const lineMat=new THREE.MeshBasicMaterial({color:0xf2efe6,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-6});
  ribbon(-halfW+.2,-halfW+.55,.06,lineMat,1);ribbon(halfW-.55,halfW-.2,.06,lineMat,1);
  // pianos rojo/blanco
  const kerbTex=canvasTex(64,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?"#f0ece2":"#d22a2a";g.fillRect(0,i*32,w,32);}});
  const kerbMat=new THREE.MeshStandardMaterial({map:kerbTex,roughness:.6});kerbMat.map.wrapT=THREE.RepeatWrapping;
  ribbon(-halfW-1.2,-halfW,.05,kerbMat,1,3);ribbon(halfW,halfW+1.2,.05,kerbMat,1,3);
  // hoardings coloridos pegados al borde interior (pared baja)
  wallRibbon(halfW+1.3,.1,1.5,hoardMat,10);
  // franja de ripio/gravel (color) entre pista y pasto en el exterior
  const gravelMat=new THREE.MeshStandardMaterial({color:0x9c8a63,roughness:1});
  ribbon(halfW+1.2,halfW+6,.0,gravelMat,4,10);
  ribbon(-halfW-6,-halfW-1.2,.0,gravelMat,4,10);
  // ---- cerca de contención (postes + malla) exterior ----
  {const fpMat=stdMat("metal");fpMat.color.set(0x8f9aa2);fpMat.metalness=.5;
   const meshMat=new THREE.MeshBasicMaterial({color:0xdfe6ee,transparent:true,opacity:.14,side:THREE.DoubleSide});
   const pos=[],idx=[];
   for(let i=0;i<=n;i+=2){const ii=i%n,p=P[ii].clone().addScaledVector(LF[ii],halfW+6.5);pos.push(p.x,.2,p.z,p.x,4.2,p.z);}
   for(let i=0;i<pos.length/6-1;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
   const fg=new THREE.BufferGeometry();fg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));fg.setIndex(idx);fg.computeVertexNormals();
   group.add(new THREE.Mesh(fg,meshMat));
   for(let i=0;i<n;i+=16){const p=P[i].clone().addScaledVector(LF[i],halfW+6.5);
     const post=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,4.3,6),fpMat);post.position.set(p.x,2.1,p.z);group.add(post);}}
  // muros de gomas en el exterior de las curvas (colisión)
  const tireMi=A.glb.tirewall?mergedForInstancing(A.glb.tirewall,{height:1.1}):null;
  if(tireMi){const tires=[];for(let i=0;i<n;i+=8){const p=P[i].clone().addScaledVector(LF[i],halfW+7.6);
    tires.push([p.x,p.z,Math.atan2(TN[i].x,TN[i].z),1]);colliders.push({type:"circle",x:p.x,z:p.z,r:1.3});}
    instPlace(group,tireMi,tires,{shadow:false});}
  // ---- PARED DE COLISIÓN CONTINUA JUSTO DETRÁS del muro de gomas visible (rellena los huecos; no te caés) ----
  // va por fuera de las gomas (halfW+7.6) para que choques contra las gomas VISIBLES, no contra una pared invisible
  {const STEP=5,lat=halfW+8.2;
   for(let i=0;i<n;i+=STEP){const p=P[i],t=TN[i];const rot=Math.atan2(t.z,t.x); // hw a lo largo de la tangente
     const hlen=(STEP*ds)*0.6; // se solapan para no dejar huecos
     for(const sd of[-1,1]){const o=p.clone().addScaledVector(LF[i],sd*lat);
       // en curvas cerradas el offset interior se "pasa" y cae sobre la pista -> descartá ese segmento
       let dmin=1e9;for(let j=0;j<n;j+=2){const dx=P[j].x-o.x,dz=P[j].z-o.z;const d2=dx*dx+dz*dz;if(d2<dmin)dmin=d2;}
       if(Math.sqrt(dmin)<halfW+4)continue; // quedaría sobre/junto al asfalto: no lo pongas (era el "estorbo")
       colliders.push(obb(o.x,o.z,hlen,1.6,rot));}}}
  // ---- TRIBUNAS repletas de público (planos con textura de multitud) ----
  if(crowdImg)crowdImg.wrapS=THREE.RepeatWrapping;
  function crowdStand(i,side,w){const p=P[i],lf=LF[i];
    const dir=lf.clone().multiplyScalar(side);           // hacia afuera de la pista
    const o=p.clone().addScaledVector(dir,halfW+10);
    const yaw=Math.atan2(-dir.x,-dir.z);                 // el frente mira a la pista
    const g=new THREE.Group();g.position.set(o.x,0,o.z);g.rotation.y=yaw;
    // grada inclinada con público (textura repetida horizontalmente -> se ve lleno, no estirado)
    const face=new THREE.Mesh(new THREE.PlaneGeometry(w,12),crowdMat);
    const rep=Math.max(3,Math.round(w/9)),uv=face.geometry.attributes.uv;
    uv.setXY(0,0,1);uv.setXY(1,rep,1);uv.setXY(2,0,0);uv.setXY(3,rep,0);uv.needsUpdate=true;
    face.position.set(0,6.2,0);face.rotation.x=-0.32;g.add(face);
    const roofMat=stdMat("metal");roofMat.color.set(0xeceae2);roofMat.metalness=.2;roofMat.roughness=.6;
    const roof=new THREE.Mesh(new THREE.BoxGeometry(w+3,.7,8),roofMat);roof.position.set(0,12.6,-2.2);roof.rotation.x=-0.18;g.add(roof);
    // muro de contención de hormigón al frente
    const wallMat=stdMat("concrete");wallMat.color.set(0xcfcbc0);
    const wall=new THREE.Mesh(new THREE.BoxGeometry(w+3,1.4,1),wallMat);wall.position.set(0,.7,3.2);g.add(wall);
    group.add(g);colliders.push(obb(o.x,o.z,w*.5,5,yaw));}
  for(const[t,side,w] of [[.0,-1,58],[.032,-1,58],[.064,-1,58],[.22,-1,44],[.30,1,40],[.42,-1,42],
      [.55,1,44],[.68,-1,40],[.80,-1,44],[.90,1,40]]){
    crowdStand(Math.floor(t*n)%n,side,w);}
  // pantallas gigantes
  const scrT=A.glb.bigscreen?normalizeModel(A.glb.bigscreen,{height:10}):null;
  if(scrT)for(const t of[.18,.62]){const i=Math.floor(t*n)%n,p=P[i],lf=LF[i];
    const o=p.clone().addScaledVector(lf,-(halfW+22));const s2=scrT.clone(true);s2.position.set(o.x,0,o.z);
    s2.rotation.y=Math.atan2(TN[i].x,TN[i].z)+Math.PI/2;group.add(s2);}
  // ---- árboles verdes alrededor (naturaleza tipo Suzuka) ----
  {const oaks=[],pines=[];
   for(let k=0;k<900;k++){const a=rng()*6.28,r=Math.sqrt(rng())*640+120;
     const x=Math.cos(a)*r,z=Math.sin(a)*r;
     let dmin=1e9;for(let j=0;j<n;j+=3){const dx=P[j].x-x,dz=P[j].z-z;const d2=dx*dx+dz*dz;if(d2<dmin)dmin=d2;}
     if(Math.sqrt(dmin)<halfW+14)continue;
     (rng()<.5?oaks:pines).push([x,z,rng()*6.28,8+rng()*7]);}
   billboardTrees(group,"tree_oak",oaks);billboardTrees(group,"tree_pine",pines);}
  // ---- START/FINISH: pórtico a cuadros + grilla pintada ----

/* ===== grilla espacial de colisiones: miles de colliders sin costo O(n) por frame ===== */
const GRID_CELL=9;
function colAABB(c){
  if(c.type==="circle")return[c.x-c.r,c.z-c.r,c.x+c.r,c.z+c.r];
  if(c.type==="capsule")return[Math.min(c.ax,c.bx)-c.r,Math.min(c.az,c.bz)-c.r,Math.max(c.ax,c.bx)+c.r,Math.max(c.az,c.bz)+c.r];
  const r=Math.hypot(c.hw,c.hd)+.4;return[c.x-r,c.z-r,c.x+r,c.z+r];}
function buildColliderGrid(cols){
  const grid=new Map();
  for(let i=0;i<cols.length;i++){const[x0,z0,x1,z1]=colAABB(cols[i]);
    for(let cx=Math.floor(x0/GRID_CELL);cx<=Math.floor(x1/GRID_CELL);cx++)
      for(let cz=Math.floor(z0/GRID_CELL);cz<=Math.floor(z1/GRID_CELL);cz++){
        const k=cx*73856+cz;let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(i);}}
  return grid;}
const _qseen=new Set(),_qout=[];
function queryColliders(x,z,rad){
  const grid=world&&world.grid;if(!grid)return null;
  _qseen.clear();_qout.length=0;
  for(let cx=Math.floor((x-rad)/GRID_CELL);cx<=Math.floor((x+rad)/GRID_CELL);cx++)
    for(let cz=Math.floor((z-rad)/GRID_CELL);cz<=Math.floor((z+rad)/GRID_CELL);cz++){
      const a=grid.get(cx*73856+cz);if(a)for(const i of a)if(!_qseen.has(i)){_qseen.add(i);_qout.push(i);}}
  return _qout;}
function buildWorld(mapIdx,timeKey){
  disposeWorld();
  dyHazards=[];dyRamps=[];dyPit=null;dySky=null;
  const group=new THREE.Group();scene.add(group);
  const data=MAPS[mapIdx].build(group,timeKey);
  cheapMats(group);          // ULD: PBR -> Phong en todo el escenario
  sun.castShadow=true;
  world={group,timeKey,mapIdx,chimneys:[],sunOff:lastSunOff,sky:lastSky,skyY:lastSkyY,hazards:dyHazards,ramps:dyRamps,...data};
  world.pit=dyPit;world.powerups=[];

  world.skytrack=dySky; // se arma dentro de injectArenaFeatures
  world.grid=buildColliderGrid(world.colliders||[]);

  return world;}
// power-ups en todos los mapas de drift + gauntlet de martillos en los grandes
function injectArenaFeatures(mapIdx,group,colliders){

/* marca las geometrías que pertenecen a un asset compartido (GLB/plantilla): los clones
   las comparten, así que liberarlas al reconstruir el mapa castiga al modelo original */
function markSharedGeo(root){if(!root)return;
  try{root.traverse(o=>{if(o.geometry&&o.geometry.userData)o.geometry.userData.shared=true;});}catch(e){}}
function disposeWorld(){if(world){scene.remove(world.group);
  /* Antes sólo liberaba geometrías: los canvas procedurales (las marcas de pista eran
     2048x2048 = ~21 MB en GPU) quedaban colgados en cada reconstrucción de mapa. */
  const seen=new Set();
  world.group.traverse(o=>{
    if(o.geometry&&!(o.geometry.userData&&o.geometry.userData.shared))o.geometry.dispose?.();
    const mats=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];
    for(const m of mats){
      if(!m||seen.has(m))continue;seen.add(m);
      for(const k of["map","normalMap","roughnessMap","alphaMap","emissiveMap","aoMap","metalnessMap"]){
        const t=m[k];
        // canvas procedurales de ESTE mapa (las marcas de pista eran 2048² por reconstrucción);
        // los clones cacheados de stdMat y las texturas de los GLB quedan intactos
        if(t&&t.userData&&t.userData.own&&!t.userData.shared&&!seen.has(t)){seen.add(t);t.dispose?.();}}
      if(m.userData&&m.userData.own)m.dispose?.();}});
  for(const f of floods)scene.remove(f);
  floods.length=0;world=null;}}

/* ULD y BAJA cambian PBR (MeshStandard) por Phong: el sombreado por píxel de Standard es
   lo más caro que hay en un Mali de 2 núcleos. Phong mantiene brillo y textura, así que no
   queda plano ni feo. En BAJA se conserva el relieve (normalMap) para no bajar tanto; en
   ULD va sólo el color. ALTA queda intacta con PBR. */
const _cheapCache=new Map();
function cheapMats(root){
  if(!root||QP.mats!=="phong")return root;
  root.traverse(o=>{
    if(!(o.isMesh||o.isSkinnedMesh||o.isInstancedMesh))return;
    const arr=Array.isArray(o.material)?o.material:[o.material];
    const out=arr.map(m=>{
      if(!m||!m.isMeshStandardMaterial)return m;
      let n=_cheapCache.get(m);if(n)return n;
      const keepBump=(QP.texSlots||4)>=3;   // BAJA conserva relieve; ULD no
      n=new THREE.MeshPhongMaterial({
        color:m.color,map:m.map,emissive:m.emissive,emissiveMap:m.emissiveMap,
        normalMap:keepBump?m.normalMap:null,aoMap:keepBump?m.aoMap:null,
        emissiveIntensity:m.emissiveIntensity==null?1:m.emissiveIntensity,
        transparent:m.transparent,opacity:m.opacity,alphaTest:m.alphaTest,alphaMap:m.alphaMap,
        side:m.side,depthWrite:m.depthWrite,fog:m.fog,vertexColors:m.vertexColors,
        flatShading:m.flatShading,
        shininess:Math.max(3,(1-(m.roughness==null?.6:m.roughness))*55),
        specular:new THREE.Color().setScalar(.05+.22*(m.metalness||0))});
      n.name=m.name;n.userData.own=true;_cheapCache.set(m,n);return n;});
    o.material=Array.isArray(o.material)?out:out[0];});
  return root;}

let carTemplates=[],builtWheel=-1;
function prepareCars(force){

  carTemplates=[];builtWheel=save.wheel;

/* Las carrocerías vienen SIN ruedas: se montan 4 ruedas generadas (la elegida)
   en posiciones configuradas por coche (CARS[i].wheels), giran sobre su eje exacto
   y las delanteras doblan. Espejo por lado con corrección de signos. */
function mountWheels(tpl,c,rimKey){
  const proto=buildWheelProto(rimKey);
  const cfg=c.wheels||{f:.55,r:-.55,rad:.31,zf:.78,flip:false};
  if(cfg.flip){ // nariz al revés en el GLB: girar 180° y re-centrar
    const root=tpl.children[0];root.rotation.y+=Math.PI;
    tpl.updateMatrixWorld(true);
    const b=new THREE.Box3().setFromObject(root);
    const ctr=b.getCenter(V);
    root.position.x-=ctr.x;root.position.z-=ctr.z;root.position.y-=b.min.y;}
  tpl.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(tpl);
  const halfW=(box.max.x-box.min.x)/2,halfL=(box.max.z-box.min.z)/2;
  for(const[zf,name]of[[cfg.f,"dyw_f"],[cfg.r,"dyw_r"]])
    for(const side of[1,-1]){
      const grp=new THREE.Group();
      grp.position.set(side*halfW*cfg.zf,cfg.rad,zf*halfL);
      grp.name=name;grp.userData.ms=side; // lado espejado: invierte giro y dirección
      let m2;
      if(proto){m2=new THREE.Mesh(proto.geo,proto.mat);
        m2.scale.setScalar(2*cfg.rad/proto.diam);}
      else{const cg=new THREE.CylinderGeometry(1,1,.42,18);cg.rotateZ(Math.PI/2);
        m2=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:0x17181c,roughness:.85}));
        m2.scale.setScalar(cfg.rad);}
      if(side<0)grp.scale.x=-1;
      m2.castShadow=true;m2.name="dyw_spin";
      grp.add(m2);tpl.add(grp);}
  tpl.userData.wheelR=cfg.rad;}
const wheelProtos={};
function buildWheelProto(rimKey){
  rimKey=rimKey||"wheel";
  if(wheelProtos[rimKey])return wheelProtos[rimKey];
  const glb=A.glb[rimKey]||A.glb.wheel;if(!glb)return null;
  const root=glb.scene;root.updateMatrixWorld(true);
  let src=null;root.traverse(o=>{if(o.isMesh&&!src)src=o;});
  if(!src)return null;
  const g=src.geometry.clone();g.applyMatrix4(src.matrixWorld);
  g.computeBoundingBox();
  const bb=g.boundingBox,size=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3());
  g.translate(-c.x,-c.y,-c.z);
  const dims=[size.x,size.y,size.z],axMin=dims.indexOf(Math.min(...dims));
  if(axMin===2)g.rotateY(Math.PI/2);else if(axMin===1)g.rotateZ(Math.PI/2); // eje del cilindro -> X (lateral)
  g.computeBoundingBox();
  const b2=g.boundingBox;
  g.userData.own=true;
  return(wheelProtos[rimKey]={geo:g,mat:src.material,
    diam:Math.max(b2.max.y-b2.min.y,b2.max.z-b2.min.z)});}
function fallbackCar(){const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.9,.85,4.4),
    new THREE.MeshStandardMaterial({color:0xcc4422,roughness:.5}));
  m.position.y=.55;m.castShadow=true;g.add(m);return g;}

}

/* hazards: brazos giratorios + martillos gigantes que destrozan autos */
function updateHazards(s,dt){
  if(!world.hazards)return;
  for(const hz of world.hazards){
    if(hz.type==="hammer"){
      hz.phase+=hz.spd*dt;
      const a=Math.sin(hz.phase);hz.piv.rotation.x=-0.72+0.72*a; // baja (a≈1) y sube (a≈-1)
      const striking=a>0.68;                                     // martillo abajo = peligroso
      const px=s.onFoot.active?s.onFoot.x:s.x, pz=s.onFoot.active?s.onFoot.z:s.z;
      const d=Math.hypot(px-hz.x,pz-hz.z);
      if(striking&&d<2.3){
        if(s.onFoot.active&&!s.dead){const of=s.onFoot;of.hp-=30;of.vy=9;
          of.x+=(of.x-hz.x)/(d||1)*3;of.z+=(of.z-hz.z)/(d||1)*3;dryHit(.9,1.1);}
        else if(!s.dead&&!hz._hitCd){
          const nx=(s.x-hz.x)/(d||1),nz=(s.z-hz.z)/(d||1);
          s.vx+=nx*10;s.vz+=nz*10;s.vy=13;s.airborne=true;s.shake=1; // ¡te hace volar con físicas!
          if(s.shieldT<=0){s.hp=Math.max(0,s.hp-16);deformCar(s,{x:0,z:1},.5);}
          dryHit(1,.8);sfx("sfx_pop",.6,.7);hz._hitCd=.6;
          if(s.hp<=0)killPlayer(s);}}
      if(hz._hitCd>0)hz._hitCd-=dt;
      continue;}
    // brazo giratorio
    hz.ang+=hz.spd*dt;hz.arm.rotation.y=hz.ang;
    const tx=hz.x+Math.sin(hz.ang)*hz.len, tz=hz.z+Math.cos(hz.ang)*hz.len;
    if(!s.onFoot.active&&!s.dead){
      const d=Math.hypot(s.x-tx,s.z-tz);
      if(d<2.4){const nx=(s.x-tx)/(d||1),nz=(s.z-tz)/(d||1);
        s.vx+=nx*20;s.vz+=nz*20;s.shake=1;
        if(s.shieldT<=0){s.hp=Math.max(0,s.hp-12);deformCar(s,{x:-nx,z:-nz},.5);}
        dryHit(.9,.9);if(s.hp<=0)killPlayer(s);}}
    if(s.onFoot.active){const of=s.onFoot;const d=Math.hypot(of.x-tx,of.z-tz);
      if(d<2){of.hp-=25;of.vy=6;of.x+=(of.x-tx)/(d||1)*4;of.z+=(of.z-tz)/(d||1)*4;sfx("sfx_punch",1,.8);}}
  }
}

function buildHammerGauntlet(group,colliders,cx,cz,ang){
  const s=Math.sin(ang),c=Math.cos(ang);
  const PW=9,PL=28; // corredor a nivel del piso (el auto lo cruza)
  const padMat=stdMat("metal");padMat.color.set(0x2b2f37);padMat.metalness=.5;padMat.roughness=.6;
  const pad=new THREE.Mesh(new THREE.BoxGeometry(PW,.12,PL),padMat);
  pad.position.set(cx,.06,cz);pad.rotation.y=ang;pad.receiveShadow=true;group.add(pad);
  // arco/pórtico de entrada rayado
  const railMat=stdMat("metal");railMat.color.set(0xff7a1a);railMat.metalness=.4;railMat.roughness=.5;railMat.emissive.set(0x351400);railMat.emissiveIntensity=.4;
  // vigas superiores de donde cuelgan los martillos + parantes laterales (colisión)
  const postMat=stdMat("metal");postMat.color.set(0x3a3d45);postMat.metalness=.6;postMat.roughness=.5;
  for(const side of[-1,1]){
    const post=new THREE.Mesh(new THREE.BoxGeometry(.5,8.2,PL),postMat);
    post.position.set(cx+(PW/2+.3)*c*side, 4.1, cz-(PW/2+.3)*s*side);post.rotation.y=ang;post.castShadow=true;group.add(post);
    colliders.push(obb(cx+(PW/2+.3)*c*side,cz-(PW/2+.3)*s*side,.5,PL/2,ang));}
  const beam=new THREE.Mesh(new THREE.BoxGeometry(PW+1.4,.6,PL),postMat);beam.position.set(cx,8.1,cz);beam.rotation.y=ang;group.add(beam);
  // 6 martillos gigantes desparejos a lo largo del corredor (golpean el piso)
  for(let i=0;i<6;i++){const t=(i+.5)/6-.5;const hx=cx+s*t*PL,hz=cz+c*t*PL;
    makeHammer(group,hx,0,hz,ang+Math.PI/2,i*1.05,1.25+((i*37)%9)/10);}
  return{cx,cz};}
