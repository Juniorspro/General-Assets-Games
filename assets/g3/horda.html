<script>const SLUG="horda";const TRE="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";const GLTFURL="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";const R=p=>(location.search.indexOf('local')>=0?'/':'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@e7c7df0/')+p;const MDL=(m=>{const o={};for(const k in m)o[k]=R(m[k]);return o})({"hands":"assets/hyper/vm-hands.glb","gun":"assets/hyper/w-smg.glb","enemy":"assets/arcade/m-arena-run.glb"});const TEX=(m=>{const o={};for(const k in m)o[k]=R(m[k]);return o})({"stucco":"assets/fp/tex/stucco.webp","brick":"assets/fp/tex/brick.webp","facade":"assets/fp/tex/facade.webp","roof":"assets/fp/tex/roof.webp"});const SFX={shoot:R('assets/vert/sfx-shoot.mp3'),boom:R('assets/vert/sfx-boom.mp3'),coin:R('assets/vert/sfx-coin.mp3'),win:R('assets/vert/sfx-win.mp3'),lose:R('assets/vert/sfx-lose.mp3'),power:R('assets/vert/sfx-power.mp3'),swipe:R('assets/vert/sfx-swipe.mp3')};</script><script>/* ===== HORDA — shooter de oleadas en primera persona ====================== */
window.GAME = (function () {
const EYE = 1.7, ARENA = 42;
let T, scene, cam, ren;
let yaw = 0, pitch = 0, vm, muzzle, muzT = 0, recoil = 0, bobT = 0;
let enemies, tmplEnemy, hp, ammo, mag, reloadT, score, kills, wave, spawnLeft, spawnT, dead, tPlay, fireCD, autoFire;

/* ---- construir mundo ---- */
async function init3d(THREE) {
  T = THREE; scene = ARC.scene; cam = ARC.cam; ren = ARC.renderer;
  cam.rotation.order = 'YXZ'; cam.position.set(0, EYE, 0);
  scene.background = new T.Color(0x2b3a52);
  scene.fog = new T.Fog(0x2b3a52, 34, 95);
  scene.add(new T.HemisphereLight(0xdfeaff, 0x39322a, 1.9));
  scene.add(new T.AmbientLight(0xffffff, .45));
  const sun = new T.DirectionalLight(0xfff2d8, 2.4); sun.position.set(-14, 26, 10); scene.add(sun);
  ren.toneMappingExposure = 1.25;
  // suelo PBR
  const tl = new T.TextureLoader();
  const load = (u, rep) => { const t = tl.load(u); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep, rep); t.colorSpace = T.SRGBColorSpace; return t; };
  const ground = new T.Mesh(new T.CircleGeometry(ARENA + 4, 48), new T.MeshStandardMaterial({ map: load(TEX.stucco, 16), roughness: .95 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  // muro perimetral + edificios de fondo con textura de fachada
  const facade = load(TEX.facade, 3), roof = load(TEX.brick, 3);
  const matF = new T.MeshStandardMaterial({ map: facade, roughness: .9 });
  const matR = new T.MeshStandardMaterial({ map: roof, roughness: .95 });
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * 6.28, r = ARENA + ARC.rnd(3, 9), h = ARC.rnd(8, 20), w = ARC.rnd(5, 9);
    const b = new T.Mesh(new T.BoxGeometry(w, h, w), i % 3 ? matF : matR);
    b.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r); b.rotation.y = ARC.rnd(0, 6.28); scene.add(b);
  }
  // cajas de cobertura
  const matC = new T.MeshStandardMaterial({ map: load(TEX.brick, 1), roughness: .9 });
  for (let i = 0; i < 8; i++) { const a = ARC.rnd(0, 6.28), r = ARC.rnd(8, ARENA - 6);
    const s = ARC.rnd(1.4, 2.6); const c = new T.Mesh(new T.BoxGeometry(s, s, s), matC);
    c.position.set(Math.cos(a) * r, s / 2, Math.sin(a) * r); c.rotation.y = ARC.rnd(0, 6.28); scene.add(c); }
  // viewmodel: sólo el arma, escalada y ubicada abajo a la derecha
  try {
    const wg = await ARC.loadGLB(MDL.gun); const gun = wg.scene;
    const gb = new T.Box3().setFromObject(gun); const gs = gb.getSize(new T.Vector3());
    const gk = 0.62 / (Math.max(gs.x, gs.y, gs.z) || 1); gun.scale.setScalar(gk);
    gun.traverse(o => { if (o.isMesh) { o.frustumCulled = false; o.renderOrder = 20; if (o.material) { o.material.depthTest = false; o.material.fog = false; } } });
    gun.position.set(.2, -.26, -.5); gun.rotation.set(.05, Math.PI + .1, 0); cam.add(gun); vm = gun;
  } catch (e) { console.warn('vm', e); }
  scene.add(cam);
  // fogonazo
  muzzle = new T.Mesh(new T.SphereGeometry(.12, 6, 6), new T.MeshBasicMaterial({ color: 0xffd070 })); muzzle.position.set(.18, -.16, -.9); muzzle.visible = false; cam.add(muzzle);
  const ml = new T.PointLight(0xffb040, 0, 8); ml.position.copy(muzzle.position); cam.add(ml); muzzle.light = ml;
  // enemigo plantilla
  try { const eg = await ARC.loadGLB(MDL.enemy); tmplEnemy = eg.scene;
    const box = new T.Box3().setFromObject(tmplEnemy); const sz = box.getSize(new T.Vector3());
    const k = 2.2 / (sz.y || 1); tmplEnemy.scale.setScalar(k);
    tmplEnemy.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
  } catch (e) { console.warn('enemy', e); tmplEnemy = new T.Mesh(new T.CapsuleGeometry(.5, 1.2, 4, 8), new T.MeshStandardMaterial({ color: 0xff5470 })); }
  enemies = [];
}

function spawnEnemy() {
  const e = tmplEnemy.clone(true);
  const a = ARC.rnd(0, 6.28), r = ARENA - ARC.rnd(1, 5);
  e.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  e.userData = { hp: 3 + (wave / 3 | 0), spd: 1.6 + wave * .12, hitT: 0, atk: 0 };
  scene.add(e); enemies.push(e);
}

function startWave() { wave++; spawnLeft = 4 + wave * 2; spawnT = 0; ARC.toast('OLEADA ' + wave); ARC.sfx('power', { vol: .5 }); }

function start() {
  yaw = 0; pitch = 0; hp = 100; ammo = 20; mag = 20; reloadT = 0; score = 0; kills = 0; wave = 0;
  dead = false; tPlay = 0; fireCD = 0; recoil = 0; autoFire = false;
  for (const e of (enemies || [])) scene.remove(e); enemies = [];
  startWave();
}

function shoot() {
  if (dead || reloadT > 0) return;
  if (ammo <= 0) { reload(); return; }
  ammo--; fireCD = .09; recoil = 1; muzT = .05;
  ARC.sfx('shoot', { vol: .5, rate: ARC.rnd(.95, 1.08) }); ARC.shake(2); ARC.vib(12);
  muzzle.visible = true; muzzle.light.intensity = 3;
  // impacto por ángulo al enemigo más centrado
  const fwd = new T.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
  let best = null, bestDot = 0.988;
  for (const e of enemies) { const to = new T.Vector3(e.position.x - cam.position.x, e.position.y + 1 - cam.position.y, e.position.z - cam.position.z).normalize();
    const d = to.dot(fwd); if (d > bestDot) { bestDot = d; best = e; } }
  if (best) { best.userData.hp -= 1; best.userData.hitT = .12;
    const sp = worldToScreen(best.position.x, best.position.y + 1.4, best.position.z);
    if (sp) ARC.fx.burst(sp.x, sp.y, '#ffd23f', 6, 4);
    if (best.userData.hp <= 0) { killEnemy(best); }
    else ARC.sfx('hit', { vol: .4 });
  }
  if (ammo <= 0) reload();
}
function reload() { if (reloadT > 0) return; reloadT = 1.1; ARC.sfx('reload', { vol: .5 }); }
function killEnemy(e) { const sp = worldToScreen(e.position.x, e.position.y + 1.2, e.position.z);
  if (sp) { ARC.fx.burst(sp.x, sp.y, '#ff5470', 14, 6); ARC.fx.ring(sp.x, sp.y, '#fff', 8); }
  scene.remove(e); enemies.splice(enemies.indexOf(e), 1); score += 25; kills++; ARC.sfx('boom', { vol: .4 }); ARC.shake(3); }

function worldToScreen(x, y, z) { const v = new T.Vector3(x, y, z).project(cam);
  if (v.z > 1) return null; return { x: (v.x * .5 + .5) * ARC.W, y: (-v.y * .5 + .5) * ARC.H }; }

function hurt(d) { hp -= d; ARC.shake(6); ARC.vib(30); ARC.sfx('hurt', { vol: .5 });
  if (hp <= 0) { hp = 0; dead = true; ARC.over({ win: false, score, title: 'CAÍSTE', sub: 'oleada ' + wave, coins: (score / 20 | 0) }); } }

function step(dt) {
  if (dead) return; tPlay += dt; bobT += dt;
  // cámara
  cam.rotation.y = yaw; cam.rotation.x = pitch;
  // viewmodel bob + recoil
  if (vm) { vm.position.y = -.26 + Math.sin(bobT * 8) * .006; }
  if (recoil > 0) recoil = Math.max(0, recoil - dt * 8);
  cam.rotation.x = pitch + recoil * .04;
  if (muzT > 0) { muzT -= dt; if (muzT <= 0) { muzzle.visible = false; muzzle.light.intensity = 0; } }
  if (autoFire) { fireCD -= dt; if (fireCD <= 0) shoot(); }
  else if (fireCD > 0) fireCD -= dt;
  if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) ammo = mag; }
  // enemigos
  for (const e of enemies) { const u = e.userData; if (u.hitT > 0) u.hitT -= dt;
    const dx = -e.position.x, dz = -e.position.z; const d = Math.hypot(dx, dz);
    e.rotation.y = Math.atan2(dx, dz);
    if (d > 2.2) { e.position.x += dx / d * u.spd * dt; e.position.z += dz / d * u.spd * dt;
      e.position.y = Math.abs(Math.sin(tPlay * 6 + e.position.x)) * .12; }
    else { u.atk -= dt; if (u.atk <= 0) { u.atk = 1; hurt(6 + wave); } }
    e.scale.setScalar(e.scale.x); // no-op keep
    if (u.hitT > 0) e.rotation.z = Math.sin(tPlay * 40) * .1; else e.rotation.z = 0;
  }
  // director
  if (spawnLeft > 0) { spawnT -= dt; if (spawnT <= 0 && enemies.length < 12) { spawnEnemy(); spawnLeft--; spawnT = Math.max(.4, 1.4 - wave * .06); } }
  else if (enemies.length === 0) { if (tPlay > 1) startWave(); }
  ARC.hud();
}

/* ---- HUD 2D ---- */
function draw2d(g) {
  const W = ARC.W, H = ARC.H;
  // mira
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(W / 2 - 12, H / 2); g.lineTo(W / 2 - 4, H / 2); g.moveTo(W / 2 + 4, H / 2); g.lineTo(W / 2 + 12, H / 2);
  g.moveTo(W / 2, H / 2 - 12); g.lineTo(W / 2, H / 2 - 4); g.moveTo(W / 2, H / 2 + 4); g.lineTo(W / 2, H / 2 + 12); g.stroke();
  g.fillStyle = 'rgba(255,80,80,.9)'; g.beginPath(); g.arc(W / 2, H / 2, 1.6, 0, 6.28); g.fill();
  // salud
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(24, H - 46, 260, 20);
  g.fillStyle = hp > 30 ? '#8cff66' : '#ff5470'; g.fillRect(24, H - 46, 260 * hp / 100, 20);
  g.fillStyle = '#fff'; g.font = '900 16px system-ui'; g.textAlign = 'left'; g.fillText('❤ ' + (hp | 0), 30, H - 31);
  // munición
  g.textAlign = 'right'; g.font = '900 30px system-ui'; g.fillStyle = ammo > 0 ? '#fff' : '#ff5470';
  g.fillText(reloadT > 0 ? 'RECARGA…' : (ammo + ' / ' + mag), W - 24, H - 28);
  // oleada + puntaje
  g.textAlign = 'center'; g.font = '900 22px system-ui'; g.fillStyle = '#ffd23f'; g.fillText('OLEADA ' + wave, W / 2, 34);
  g.textAlign = 'left'; g.font = '900 24px system-ui'; g.fillStyle = '#fff'; g.fillText(score + '', 24, 40);
  g.font = '700 13px system-ui'; g.fillStyle = '#9fb0d8'; g.fillText('enemigos: ' + enemies.length, 24, 60);
  // botón pausa (táctil): esquina sup der
  g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(W - 52, 16, 36, 36); g.fillStyle = '#fff'; g.font = '900 18px system-ui'; g.textAlign = 'center'; g.fillText('❚❚', W - 34, 40);
}

/* ---- menú vivo: la cámara gira sola sobre la arena ---- */
let menuA = 0;
function attract3d(dt) { menuA += dt * .15; if (cam) { cam.position.set(Math.cos(menuA) * 6, 4, Math.sin(menuA) * 6); cam.lookAt(0, 1, 0); } }

/* ---- input ---- */
function look(dx, dy) { yaw -= dx * .0032; pitch = ARC.clamp(pitch - dy * .0032, -1.2, 1.2); }
function down(p) {
  // toque en la esquina de pausa
  if (p.x > ARC.W - 60 && p.y < 56) { window.ARC_pause(); return; }
  if (ARC.renderer && !document.pointerLockElement && ARC.renderer.domElement.requestPointerLock) { /* PC: pedir lock */ }
  shoot();
}
function key(code, dn) { if (code === 'KeyR' && dn) reload(); if (code === 'Space' && dn) shoot(); if (code === 'Escape' && dn) window.ARC_pause(); }

return {
  slug: 'horda', name: 'HORDA', sub: 'sobreviví las oleadas', acc: '#ff5470', three: true, sky: '#121a2a',
  music: null, art: null, sfx: {}, best: 'PUNTOS',
  init3d, start, step, draw2d, attract3d, resize() {}, look, down, up() {}, move() {}, key,
  aimMove() {},
  dbg: {
    state: () => ({ score, kills, hp: hp | 0, wave, enemies: enemies ? enemies.length : 0, dead }),
    autoPlay() {
      if (dead) return;
      if (enemies && enemies.length) {
        let n = enemies[0], bd = 1e9;
        for (const e of enemies) { const d = e.position.length(); if (d < bd) { bd = d; n = e; } }
        const dx = n.position.x - cam.position.x, dy = (n.position.y + 1) - cam.position.y, dz = n.position.z - cam.position.z;
        const L = Math.hypot(dx, dy, dz) || 1;
        yaw = Math.atan2(-dx / L, -dz / L);
        pitch = ARC.clamp(Math.asin(dy / L), -1.2, 1.2);
        shoot();
      }
    }
  }
};
})();

let THREE = null, GLTF = null, renderer = null, scene = null, cam = null;

/* -------- ajuste + rotación -------- */
let rot = 0, S = 1, dpr = 1;
function fit() {

  S = rot ? Math.min(vh / LW, vw / LH) : Math.min(vw / LW, vh / LH);
  const st = $('stage');
  st.style.width = (LW * S) + 'px'; st.style.height = (LH * S) + 'px';
  st.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';

  if (GAME.resize) try { GAME.resize(LW, LH); } catch (e) {}
}
addEventListener('resize', fit);

/* -------- puntero en espacio lógico (con rotación) -------- */
function pt(e) {

  const px = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
  const py = (e.touches ? e.touches[0].clientY : e.clientY) - cy;

}
/* delta de arrastre en ejes lógicos (para mirar) */
function delt(dx, dy) { return rot ? { x: dy, y: -dx } : { x: dx, y: dy }; }

/* -------- audio -------- */
const AU = { ctx: null, master: null, musGain: null, sfxGain: null, buf: {}, musSrc: null, on: true, vib: true };
try { AU.on = localStorage.getItem(SLUG + '_son') !== '0'; AU.vib = localStorage.getItem(SLUG + '_vib') !== '0'; } catch (e) {}
function audioInit() {

  try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  AU.master = AU.ctx.createGain(); AU.master.gain.value = AU.on ? 1 : 0; AU.master.connect(AU.ctx.destination);
  AU.musGain = AU.ctx.createGain(); AU.musGain.gain.value = .32; AU.musGain.connect(AU.master);
  AU.sfxGain = AU.ctx.createGain(); AU.sfxGain.gain.value = .85; AU.sfxGain.connect(AU.master);
  for (const k in (GAME.sfx || {})) fetch(GAME.sfx[k]).then(r => r.arrayBuffer()).then(a => AU.ctx.decodeAudioData(a)).then(b => AU.buf[k] = b).catch(() => {});
}
const BEEP = { shoot: [520, .08, 'square'], boom: [90, .3, 'sawtooth'], hit: [200, .12, 'square'],
  coin: [1180, .12, 'square'], win: [740, .3, 'triangle'], lose: [170, .4, 'sawtooth'],
  power: [520, .22, 'triangle'], tap: [500, .05, 'sine'], swipe: [420, .1, 'sawtooth'],
  reload: [300, .14, 'square'], hurt: [150, .2, 'sawtooth'], step: [120, .05, 'sine'] };
function synth(name, vol, rate) { const c = AU.ctx; if (!c) return; const d = BEEP[name] || BEEP.tap;
  const o = c.createOscillator(), g = c.createGain(); o.type = d[2]; o.frequency.value = d[0] * (rate || 1);
  if (name === 'lose' || name === 'boom') o.frequency.exponentialRampToValueAtTime(60, c.currentTime + d[1]);
  g.gain.value = 0; g.gain.linearRampToValueAtTime((vol || 1) * .5, c.currentTime + .008);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + d[1]);
  o.connect(g); g.connect(AU.sfxGain); o.start(); o.stop(c.currentTime + d[1] + .02); }

  if (b) { const s = AU.ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = opt.rate || 1;
    const g = AU.ctx.createGain(); g.gain.value = opt.vol == null ? 1 : opt.vol; s.connect(g); g.connect(AU.sfxGain); s.start(); }
  else synth(name, opt.vol, opt.rate); }
function music(url) { if (!AU.ctx || !url) return; fetch(url).then(r => r.arrayBuffer()).then(a => AU.ctx.decodeAudioData(a)).then(b => {
  if (AU.musSrc) try { AU.musSrc.stop(); } catch (e) {} const s = AU.ctx.createBufferSource(); s.buffer = b; s.loop = true; s.connect(AU.musGain); s.start(); AU.musSrc = s; }).catch(() => {}); }

/* -------- guardado -------- */
const SAVE = { best: 0, coins: 0 };
try { Object.assign(SAVE, JSON.parse(localStorage.getItem(SLUG + '_save') || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SLUG + '_save', JSON.stringify(SAVE)); } catch (e) {} }

/* -------- fx 2D -------- */
const PS = [];
function fxBurst(x, y, col, n, spd) { n = n || 12; spd = spd || 5; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = rnd(.3, 1) * spd;
  PS.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(2, 5), life: 1, col }); } }
function fxText(x, y, txt, col) { PS.push({ text: txt, x, y, vy: -1.2, life: 1, col: col || '#fff' }); }
function fxRing(x, y, col, r0) { PS.push({ ring: 1, x, y, r: r0 || 6, vr: 4, life: 1, col }); }
function fxStep() { for (let i = PS.length - 1; i >= 0; i--) { const p = PS[i]; p.life -= p.text ? .016 : .03;
  if (p.ring) { p.r += p.vr; p.vr *= .92; } else { p.x += p.vx || 0; p.y += p.vy || 0; if (p.text) p.y += p.vy; } if (p.life <= 0) PS.splice(i, 1); } }
function fxDraw(g) { for (const p of PS) { g.globalAlpha = Math.max(0, p.life);
  if (p.ring) { g.strokeStyle = p.col; g.lineWidth = 3; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.28); g.stroke(); }
  else if (p.text) { g.fillStyle = p.col; g.font = '900 28px system-ui'; g.textAlign = 'center'; g.fillText(p.text, p.x, p.y); }
  else { g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.28); g.fill(); } } g.globalAlpha = 1; }
let shakeM = 0; function shake(m) { shakeM = Math.max(shakeM, m); }
let toastT = 0; function toast(t) { $('toast').textContent = t; $('toast').classList.add('on'); toastT = 1.6; }

/* -------- pantallas -------- */
let state = 'load';
function show(s) { state = s;
  $('load').classList.toggle('on', s === 'load'); $('menu').classList.toggle('on', s === 'menu');
  $('hud').classList.toggle('on', s === 'game' || s === 'pause');
  $('pause').classList.toggle('on', s === 'pause'); $('over').classList.toggle('on', s === 'over');
  if (s === 'menu') { $('bgBest').textContent = '★ ' + (SAVE.best || 0); $('bgCoin').textContent = '◆ ' + (SAVE.coins || 0); } }

/* -------- API -------- */
const ARC = window.ARC = {
  W: LW, H: LH, rnd, clamp, get THREE() { return THREE; }, get scene() { return scene; }, get cam() { return cam; },
  get renderer() { return renderer; }, q: 1,
  sfx, music, vib(ms) { if (AU.vib && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} },
  fx: { burst: fxBurst, text: fxText, ring: fxRing }, shake, toast,
  S: SAVE, save: persist, addCoins(n) { SAVE.coins = (SAVE.coins || 0) + n; persist(); },
  loadGLB(url) { return new Promise((res, rej) => { if (!GLTF) return rej('no gltf'); new GLTF().load(url, g => res(g), undefined, e => rej(e)); }); },
  over(o) { endGame(o); },
  hud() {}, over2: null
};

function endGame(o) { o = o || {}; if (o.coins) ARC.addCoins(o.coins);
  const sc = o.score || 0; let rec = false; if (sc > (SAVE.best || 0)) { SAVE.best = sc; rec = true; persist(); }
  $('ovTitle').textContent = o.title || (o.win ? '¡GANASTE!' : 'FIN'); $('ovSub').textContent = o.sub || (rec ? '¡NUEVO RÉCORD!' : '');
  $('ovScore').textContent = sc; $('ovBest').textContent = (GAME.best || 'RÉCORD') + ': ' + (SAVE.best || 0);
  sfx(o.win ? 'win' : 'lose'); if (document.exitPointerLock) try { document.exitPointerLock(); } catch (e) {} show('over'); }

/* -------- bucle -------- */
let last = 0, acc = 0; const STEP = 1 / 60;
function frame(t) { requestAnimationFrame(frame);
  const now = t / 1000; let dt = now - last; last = now; if (dt > .25) dt = .25; if (!last) dt = 0;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (state === 'game') { acc += dt; let n = 0; while (acc >= STEP && n < 5) { try { GAME.step(STEP); } catch (e) { console.error(e); } acc -= STEP; n++; } fxStep(); }
  else if (state === 'menu') { try { if (GAME.attract3d) GAME.attract3d(dt); } catch (e) {} fxStep(); }
  const alpha = state === 'game' ? acc / STEP : 0;
  // render 3D
  if (renderer && scene && cam && (state === 'game' || state === 'pause' || state === 'over' || state === 'menu')) { try { renderer.render(scene, cam); } catch (e) {} }
  // overlay 2D
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, LW, LH);
  let sx = 0, sy = 0; if (shakeM > 0) { sx = rnd(-shakeM, shakeM); sy = rnd(-shakeM, shakeM); shakeM *= .85; if (shakeM < .3) shakeM = 0; }
  ctx.save(); ctx.translate(sx, sy);
  if ((state === 'game' || state === 'pause' || state === 'over') && GAME.draw2d) { try { GAME.draw2d(ctx, alpha); } catch (e) {} }
  if (state === 'menu' && GAME.menu2d) { try { GAME.menu2d(ctx); } catch (e) {} }
  fxDraw(ctx); ctx.restore();
}

/* -------- entrada -------- */
let dragging = false, lastX = 0, lastY = 0;
function onDown(e) { audioInit(); if (state !== 'game') return; e.preventDefault(); dragging = true;
  const c = e.touches ? e.touches[0] : e; lastX = c.clientX; lastY = c.clientY; if (GAME.down) GAME.down(pt(e), e); }
function onMove(e) { if (state !== 'game') return; const c = e.touches ? e.touches[0] : e;
  if (dragging) { e.preventDefault(); let dx = c.clientX - lastX, dy = c.clientY - lastY; lastX = c.clientX; lastY = c.clientY;
    const d = delt(dx, dy); if (GAME.look) GAME.look(d.x, d.y); }
  if (GAME.move) GAME.move(pt(e), e); }
function onUp(e) { if (state !== 'game') return; dragging = false; if (GAME.up) GAME.up(pt(e), e); }
cv.parentElement.addEventListener('touchstart', onDown, { passive: false });
cv.parentElement.addEventListener('touchmove', onMove, { passive: false });
addEventListener('touchend', onUp);
gl.addEventListener('mousedown', onDown); addEventListener('mousemove', e => {
  if (state === 'game' && document.pointerLockElement) { const d = delt(e.movementX, e.movementY); if (GAME.look) GAME.look(d.x, d.y); if (GAME.aimMove) GAME.aimMove(); }
  onMove(e); });
addEventListener('mouseup', onUp);
addEventListener('keydown', e => { if (GAME.key) GAME.key(e.code, true); });
addEventListener('keyup', e => { if (GAME.key) GAME.key(e.code, false); });

/* -------- pantalla completa + orientación -------- */
function goFull() { const el = document.documentElement; const r = el.requestFullscreen || el.webkitRequestFullscreen;
  if (r) { try { const p = r.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  if (screen.orientation && screen.orientation.lock) { try { const p = screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) {} } }

/* -------- arranque de partida -------- */
function begin() { audioInit(); acc = 0; PS.length = 0; shakeM = 0; try { GAME.start(); } catch (e) { console.error(e); }
  if (GAME.music) music(GAME.music); show('game'); }

/* -------- botones -------- */
function bind() {
  const go = () => { audioInit(); goFull(); $('load').classList.remove('on'); show('menu'); };
  $('ldGo').addEventListener('click', go); $('ldGo').addEventListener('touchstart', e => { e.preventDefault(); go(); }, { passive: false });
  document.querySelectorAll('#ldLang .chip').forEach(ch => ch.addEventListener('click', () => {
    document.querySelectorAll('#ldLang .chip').forEach(c => c.classList.remove('on')); ch.classList.add('on');
    LANG = ch.dataset.l; try { localStorage.setItem(SLUG + '_lang', LANG); } catch (e) {} window.LANG = LANG; if (GAME.lang) try { GAME.lang(LANG); } catch (e) {} }));
  const play = e => { if (e) e.preventDefault(); goFull(); begin(); };
  $('bPlay').addEventListener('click', play); $('bPlay').addEventListener('touchstart', play, { passive: false });
  $('pReanudar').addEventListener('click', () => { if (state === 'pause') { last = 0; show('game'); } });
  $('pMenu').addEventListener('click', () => show('menu'));
  $('oOtra').addEventListener('click', () => begin()); $('oMenu').addEventListener('click', () => show('menu'));
  $('miSon').addEventListener('click', () => { AU.on = !AU.on; if (AU.master) AU.master.gain.value = AU.on ? 1 : 0;
    try { localStorage.setItem(SLUG + '_son', AU.on ? '1' : '0'); } catch (e) {} $('miSon').textContent = AU.on ? '🔊' : '🔇'; });
  $('miVib').addEventListener('click', () => { AU.vib = !AU.vib; try { localStorage.setItem(SLUG + '_vib', AU.vib ? '1' : '0'); } catch (e) {} $('miVib').style.opacity = AU.vib ? 1 : .4; });
  $('miSon').textContent = AU.on ? '🔊' : '🔇'; $('miVib').style.opacity = AU.vib ? 1 : .4;
}
window.ARC_pause = () => { if (state === 'game') show('pause'); };

/* -------- idioma -------- */
let LANG = 'es'; try { LANG = localStorage.getItem(SLUG + '_lang') || 'es'; } catch (e) {}
window.LANG = LANG;

/* -------- init 3D + boot -------- */
async function boot() {
  document.querySelectorAll('#ldLang .chip').forEach(c => c.classList.toggle('on', c.dataset.l === LANG));
  bind();
  try {
    THREE = await import(TRE);
    const gm = await import(GLTFURL); GLTF = gm.GLTFLoader;
    renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
    scene = new THREE.Scene();

    if (GAME.init3d) await GAME.init3d(THREE);

}

/* -------- ganchos de prueba -------- */
const snapCv = document.createElement('canvas'); snapCv.width = 240; snapCv.height = 135; const sctx = snapCv.getContext('2d');
window.__ARC = {
  state: () => state, W: LW, H: LH,
  goMenu: () => { $('load').classList.remove('on'); show('menu'); },
  play: () => begin(), pause: () => { if (state === 'game') show('pause'); },
  snap: () => { try { sctx.drawImage(gl, 0, 0, 240, 135); } catch (e) { return { luz: 0, colores: 0 }; }
    const d = sctx.getImageData(0, 0, 240, 135).data; let lum = 0; const cols = {};
    for (let i = 0; i < d.length; i += 4 * 13) { lum += d[i] + d[i + 1] + d[i + 2]; cols[(d[i] >> 5) + ',' + (d[i + 1] >> 5) + ',' + (d[i + 2] >> 5)] = 1; }
    return { luz: +(lum / (d.length / (4 * 13) * 3) / 255).toFixed(3), colores: Object.keys(cols).length }; },
  dbg: () => GAME.dbg || {}

})();
</script><script>__BOOT();</script></body></html>
