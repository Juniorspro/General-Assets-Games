<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ARCADE · 5 juegos</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0710;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{overflow-x:hidden}
  .wrap{max-width:1100px;margin:0 auto;padding:26px 16px 60px}
  header{text-align:center;padding:18px 0 22px}
  header h1{font-size:clamp(30px,7vw,58px);font-weight:900;letter-spacing:-1px;
    background:linear-gradient(90deg,#ff5470,#ffd23f,#35e0c0);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{opacity:.72;margin-top:8px;font-size:clamp(13px,3.4vw,17px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:8px}
  a.card{position:relative;display:block;border-radius:18px;overflow:hidden;text-decoration:none;color:#fff;
    aspect-ratio:16/9;background:#16101e;box-shadow:0 8px 26px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.07);
    transition:transform .16s ease,box-shadow .16s ease}
  a.card:active{transform:scale(.97)}
  @media(hover:hover){a.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.6)}}
  a.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  a.card .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82));display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px}
  a.card .nm{font-weight:900;font-size:22px;letter-spacing:.5px}
  a.card .sb{opacity:.85;font-size:13px;margin-top:2px}
  a.card .play{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
    border-radius:999px;padding:6px 13px;font-weight:800;font-size:12px;border:1px solid rgba(255,255,255,.22)}
  footer{text-align:center;opacity:.5;margin-top:34px;font-size:12px;line-height:1.6}
  .tip{margin:20px auto 4px;max-width:640px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:12px 16px;font-size:13px;opacity:.85}
</style></head><body>
<div class="wrap">
  <header>
    <h1>ARCADE</h1>
    <p>5 juegos 3D · apaisados · móvil y PC · tocá una portada para jugar</p>
  </header>
  <div class="grid" id="grid"></div>
  <div class="tip">📱 En el celular se giran a horizontal y entran en pantalla completa al tocar JUGAR. 🖱️ En PC se detectan mouse/teclado.</div>
  <footer>Motor propio + three.js · assets reutilizados del repositorio<br>General Assets · Games</footer>
</div>
<script>
  var G=[
    {f:'horda.html',   n:'HORDA',   s:'Campaña de acción · 5 misiones, NPCs y jefe', img:'art-horda.jpg'},
    {f:'nudillos.html',n:'NUDILLOS',s:'Brawler a puños y bate · combos y oleadas',    img:'art-nudillos.jpg'},
    {f:'furia.html',   n:'FURIA',   s:'Derby de destrucción · el más rápido gana',    img:'art-furia.jpg'},
    {f:'vertigo.html', n:'VÉRTIGO', s:'Contrarreloj urbano · cruzá las puertas',       img:'art-vertigo.jpg'},
    {f:'alas.html',    n:'ALAS',    s:'Vuelo entre anillos sobre las nubes',           img:'art-alas.jpg'}
  ];
  var h='';
  for(var i=0;i<G.length;i++){var g=G[i];
    h+='<a class="card" href="'+g.f+'"><img loading="lazy" src="'+g.img+'" alt="'+g.n+'">'+
       '<div class="play">▶ JUGAR</div><div class="ov"><div class="nm">'+g.n+'</div><div class="sb">'+g.s+'</div></div></a>';
  }
  document.getElementById('grid').innerHTML=h;
</script>
</body></html>
