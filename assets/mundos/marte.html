<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>

<title>MARTE</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#180b06;color:#f5efe9;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(26,11,6,.62);border:1px solid rgba(255,195,150,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#ffe9d6}
  #objD{font-size:11.5px;color:#d8a887;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#f2c9a4;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  #btns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;
    gap:9px;align-items:flex-end;pointer-events:auto}
  .b{min-width:86px;text-align:center;padding:12px 15px;border-radius:14px;font-weight:800;
    font-size:13px;background:rgba(32,13,8,.62);border:1.5px solid rgba(255,195,150,.4);
    color:#ffe9d6;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  .b.usar{background:rgba(160,72,30,.78);border-color:#ffd2a0;font-size:15px;display:none}
  .b.usar.on{display:block}
  .b.corre.on{background:rgba(160,72,30,.78)}
  #dlg{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(560px,92vw);
    background:rgba(24,10,6,.88);border:1px solid rgba(255,195,150,.35);border-radius:16px;
    padding:16px 18px 13px;display:none;pointer-events:auto;backdrop-filter:blur(6px)}
  #dlg.on{display:block}
  #dlgT{font-weight:900;letter-spacing:.05em;color:#f2c9a4;font-size:13px;margin-bottom:6px}
  #dlgB{font-size:14.5px;line-height:1.5;color:#f5efe9;white-space:pre-wrap}
  #dlgGo{margin-top:12px;text-align:center;padding:11px;border-radius:11px;font-weight:800;
    background:linear-gradient(180deg,#c26327,#7c3a14);border:1px solid #ffd2a0;cursor:pointer}
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#e8b48c;
    background:rgba(24,10,6,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(255,195,150,.4);background:#0006}
  #dlgCara.on{display:block}

  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(18,8,5,.16) 0%,rgba(18,8,5,.34) 55%,rgba(15,7,4,.72) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#fff3e6,#e0854a);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#c69a7c;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#ffe9d6;
    background:rgba(52,22,12,.8);border:1.5px solid rgba(255,195,150,.4)}
  .mbtn.go{background:linear-gradient(180deg,#c26327,#7c3a14);border-color:#ffd2a0}
  #mCap{color:#e0854a;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#c69a7c;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(30,13,8,.72);border:1.5px solid rgba(255,195,150,.35);color:#e8c8ae}
  .chip.on{background:linear-gradient(180deg,#c26327,#7c3a14);border-color:#ffd2a0;color:#fff3e6}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#180b06;color:#c69a7c;font-size:13px;letter-spacing:.2em}
</style>

<script>
/* ============================================================================
   MARTE — modo historia en primera persona sobre el motor de SENDA, con la
   diferencia clave: acá NO hay ni un asset descargado. Cada textura se PINTA
   en un canvas (ruido FBM azulejable, el mismo del terreno), el cielo es un
   degradado equirectangular pintado, y todos los modelos son geometría
   procedural: el domo del hábitat, el rover Vagabundo con sus seis ruedas,
   la torre reticulada de la antena con su plato torneado, el campo de
   paneles solares, las tolvaneras que vagan por la llanura.

   HISTORIA (6 capítulos, ES/EN/PT): sos ROBERT-9, un robot de mantenimiento.
   La tormenta de polvo cortó el enlace con la Tierra. hábitat → rover
   Vagabundo → cráter Halcón (el plato perdido) → torre de la antena →
   interruptor maestro → volver a casa con la señal viva.

   GOTY: sombras PCF que viajan con el jugador, ACES con exposición por
   capítulo, ATARDECER AZUL marciano (el halo del sol se enfría al caer),
   Fobos, Deimos y la Tierra como chispa celeste en la noche, baliza roja
   pulsando en la torre, y un ambiente sonoro sintetizado: viento grave con
   ráfagas, el hum del hábitat que crece al acercarse, blips de telemetría
   y estática de radio nocturna.
   ========================================================================== */
(async () => {
'use strict';
const Q = new URLSearchParams(location.search);
const LOC = Q.has('local');
/* CERO descargas de assets: todas las texturas se pintan al vuelo.
   Lo único que llega de la red es three.js. */
const TRE = LOC ? '/_vthree/build/three.module.js'
  : 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* importmap ANTES de cargar GLTFLoader (que importa 'three' por specifier).
   Se inyecta al vuelo: el import de three es por URL absoluta, así que no lo
   afecta, y el mapa resuelve el 'three' de GLTFLoader al MISMO módulo. */
{
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: TRE } });
  document.head.appendChild(im);
}
const T = await import(TRE);
/* GLTFLoader para los personajes 3D generados (riggeados + animados). Si por
   lo que sea no carga, GLTF queda null y todo cae al personaje procedural. */
let GLTF = null;
try {
  const GLU = LOC ? '/_vthree/examples/jsm/loaders/GLTFLoader.js'
    : 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
  GLTF = (await import(GLU)).GLTFLoader;
} catch (e) {}
const $ = i => document.getElementById(i);

/* ---------------- azar reproducible: el valle es SIEMPRE el mismo ---------- */
let _s = 20270215;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- terreno: ruido de valor FBM, determinista ---------------- */
const MAPA = 900, MITAD = MAPA / 2;
function hash2(i, j){
  /* Math.imul, no `*`: en JS el producto de enteros grandes se hace float y
     PIERDE los bits bajos (>2^53) — el hash quedaba sesgado hacia abajo y el
     ruido casi nunca pasaba de 0,36. Medido: la compuerta de densidad rechazaba
     3.356 de 3.481 celdas y el "bosque" tenía 83 árboles. */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260801;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* PUNTOS DE LA HISTORIA (fijos, el terreno se allana alrededor) */
const POI = {
  inicio:    { x: 0,    z: 380 },
  habitat:   { x: -40,  z: 190 },
  vagabundo: { x: 150,  z: -40 },
  mirador:   { x: -120, z: -215 },
  antena:    { x: 210,  z: -330 },
  crater:    { x: -190, z: -280 }
};
function alturaBase(x, z){
  let h = fbm(x * .006 + 7, z * .006 + 3) * 30 - 10;      /* lomas suaves */
  h += fbm(x * .02 + 40, z * .02 + 9) * 4;                /* detalle */
  /* EL CRÁTER HALCÓN: cuenca honda con BORDE levantado (eyecta), como los
     cráteres reales — el mirador de la historia vive sobre ese borde */
  const dl = Math.hypot(x - POI.crater.x, z - POI.crater.z);
  h -= 24 * Math.exp(-(dl * dl) / (135 * 135));
  h += 7 * Math.exp(-((dl - 175) * (dl - 175)) / (48 * 48));
  /* la loma del Vagabundo */
  const dr = Math.hypot(x - POI.vagabundo.x, z - POI.vagabundo.z);
  h += 12 * Math.exp(-(dr * dr) / (170 * 170));
  return h;
}
function H(x, z){
  let h = alturaBase(x, z);
  /* allanar alrededor de cada punto de la historia (mezcla suave) */
  for (const k in POI){
    if (k === 'crater') continue;
    const p = POI[k];
    const d = Math.hypot(x - p.x, z - p.z);
    const w = Math.exp(-(d * d) / (26 * 26));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* la SENDA: huellas viejas de rover en el regolito, curvas como en SENDA */
const SENDA = [POI.inicio, POI.habitat, POI.vagabundo, POI.mirador, POI.antena];
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 9.7, i * 3.1) - .5) * 90;
  const mz = (a.z + b.z) / 2 + (fbm(i * 4.3, i * 8.9) - .5) * 90;
  const seg = [];
  for (let k = 0; k <= 24; k++){
    const t = k / 24, u = 1 - t;
    const P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
for (const k in POI) POI[k].h = alturaBase(POI[k].x, POI[k].z);


/* ==================== TEXTURAS PROCEDURALES (canvas) ========================
   No hay créditos de generación: acá TODO se PINTA. Cada textura es un canvas
   con ruido FBM azulejable (retícula en módulo, del mismo motor del terreno),
   así que empalman sin costura y no pesan un byte de descarga. */
const lienzo = (n, fn) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const valT = (x, y, per) => {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
  const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
  return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
};
const fbmT = (x, y, per, oct) => {
  let v = 0, amp = .55, p = per;
  for (let o = 0; o < oct; o++){ v += amp * valT(x * p, y * p, p); amp *= .5; p *= 2; }
  return cl(v, 0, 1);
};
const mezC = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
/* suelo genérico: dos colores por FBM + pecas (piedritas y chispas de polvo)
   + rayas de duna opcionales (ondas de arena talladas por el viento) */
function texSuelo(n, colA, colB, pecas, rayas){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      let t = fbmT(x / n, y / n, 6, 4);
      if (rayas){
        const w = Math.sin((y / n * 18 + fbmT(x / n, y / n, 5, 3) * 2.6) * 6.283);
        t = cl(t * .55 + .45 * (.5 + .5 * w), 0, 1);
      }
      let c = mezC(colA, colB, t);
      const r = hash2(x + 7, y + 13);
      if (pecas && r > .965) c = mezC(c, [30, 20, 16], .55);
      else if (pecas && r < .018) c = mezC(c, [255, 232, 205], .3);
      const gr = .92 + .16 * hash2(x + 91, y + 57);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* chapa de nave: paneles con junta, remaches y mugre de polvo en las costuras */
function texMetal(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const px2 = x % 64, py = y % 48;
      let c = mezC([196, 202, 206], [166, 174, 181], fbmT(x / n, y / n, 5, 3));
      if (px2 < 2 || py < 2) c = [118, 126, 133];
      if ((px2 - 7) * (px2 - 7) + (py - 7) * (py - 7) < 4) c = [108, 116, 123];
      c = mezC(c, [152, 96, 58], .4 * fbmT(x / n + .3, y / n + .7, 7, 3) *
        fbmT(x / n, y / n, 3, 2));
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* celda fotovoltaica: azul profundo con retícula clara y reflejos */
function texPanel(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const cx = x % 42, cy2 = y % 42;
      let c = mezC([15, 27, 56], [34, 58, 104], fbmT(x / n, y / n, 6, 3));
      if (cx < 3 || cy2 < 3) c = [186, 194, 202];
      if (hash2(x + 3, y + 9) > .994) c = [130, 170, 230];
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* el CIELO marciano: degradado caramelo con bandas de polvo en suspensión */
const cieloM = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const d = g.createLinearGradient(0, 0, 0, 512);
  d.addColorStop(0, '#241318');
  d.addColorStop(.32, '#7a4630');
  d.addColorStop(.47, '#c98a58');
  d.addColorStop(.5, '#d09763');
  d.addColorStop(.56, '#8a4f30');
  d.addColorStop(1, '#3a2014');
  g.fillStyle = d; g.fillRect(0, 0, 1024, 512);
  /* velos de polvo SOLO pegados al horizonte: más arriba, en la proyección
     equirectangular, cualquier banda se vuelve un anillo alrededor del cénit */
  for (let i = 0; i < 26; i++){
    const y = 195 + rnd() * 52, w2 = 200 + rnd() * 500;
    g.fillStyle = 'rgba(' + (200 + rnd() * 40 | 0) + ',' + (140 + rnd() * 40 | 0) +
      ',90,' + (.02 + rnd() * .03).toFixed(3) + ')';
    g.beginPath(); g.ellipse(rnd() * 1024, y, w2, 4 + rnd() * 9, 0, 0, 6.284); g.fill();
  }
  const t = new T.CanvasTexture(c);
  t.mapping = T.EquirectangularReflectionMapping;
  t.colorSpace = T.SRGBColorSpace;
  return t;
})();
/* mismas CLAVES que el motor: pasto=regolito, tierra=arena de la senda,
   hojarasca=grava oscura, roca=basalto (por pendiente) */
const TX = {
  pasto:     texSuelo(256, [150, 66, 36], [186, 104, 58], true, false),
  tierra:    texSuelo(256, [196, 138, 88], [214, 160, 108], false, true),
  hojarasca: texSuelo(256, [96, 50, 30], [140, 78, 44], true, false),
  roca:      texSuelo(256, [58, 40, 34], [96, 70, 56], true, false),
  metal:     texMetal(256),
  panel:     texPanel(256),
  oscuro:    texSuelo(128, [38, 34, 32], [66, 58, 52], true, false),
  cielo:     cieloM
};

/* ================================ ESCENA =================================== */
const ren = new T.WebGLRenderer({ canvas: $('gl'), antialias: false,
  powerPreference: 'high-performance' });
ren.outputColorSpace = T.SRGBColorSpace;
/* GOTY: tone mapping FÍLMICO (ACES) — los blancos ruedan suave en vez de
   recortarse, los atardeceres saturan como en cine — y SOMBRAS suaves (PCF).
   La exposición la maneja el ciclo del día, capítulo a capítulo. */
ren.toneMapping = T.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.12;
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = TX.cielo;
scene.backgroundIntensity = 1;
/* el canvas del cielo ya trae un "suelo" pintado bajo el horizonte: el PMREM
   sale directo, sin el parche que necesitaba la foto de SENDA */
const pm = new T.PMREMGenerator(ren);
scene.environment = pm.fromEquirectangular(TX.cielo).texture;
scene.fog = new T.Fog(new T.Color('#bd7448'), 60, 430);
const cam = new T.PerspectiveCamera(72, 1, .1, 1200);
cam.rotation.order = 'YXZ';

/* luz: UNA direccional (el sol) + hemisferio. Lambert por fragmento.
   El sol PROYECTA SOMBRA: su caja de sombra (±78 m) viaja pegada al jugador —
   con un mapa de 900 m una sola caja fija daría texels de medio metro; así el
   texel queda en ~15 cm y las copas dibujan sombra de verdad sobre el sendero. */
const SOLD = new T.Vector3(.5, .7, .3).normalize();   /* dirección actual del sol */
const sol = new T.DirectionalLight(0xffd9b4, 2.3);
sol.position.copy(SOLD).multiplyScalar(420);
{
  const sc = sol.shadow.camera;
  sc.left = sc.bottom = -78; sc.right = sc.top = 78;
  sc.near = 40; sc.far = 760;
  sol.shadow.mapSize.set(1024, 1024);
  sol.shadow.bias = -0.0006;
  sol.shadow.normalBias = 1.6;      /* sin esto el terreno de quads de 5 m se acnea */
}
scene.add(sol); scene.add(sol.target);
const hemi = new T.HemisphereLight(0xd8a988, 0x6e3d26, .8);
scene.add(hemi);
/* el DESTELLO del sol: un sprite aditivo donde apunta SOLD. Con niebla y ACES
   es lo que hace que mirar contra el sol "queme" como en un juego grande. */
const glare = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const d = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  d.addColorStop(0, 'rgba(255,248,225,1)');
  d.addColorStop(.12, 'rgba(255,238,190,.85)');
  d.addColorStop(.4, 'rgba(255,214,140,.22)');
  d.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = d; g.fillRect(0, 0, 128, 128);
  const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c),
    transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
  s.scale.set(300, 300, 1);
  scene.add(s);
  return s;
})();
/* la ventana de la cabaña, de noche, VUELCA luz cálida al porche */
const focoCasa = new T.PointLight(0xffb46a, 0, 26, 1.7);
scene.add(focoCasa);
/* al caer el sol su halo se ENFRÍA: en Marte el atardecer es azul (el polvo
   fino dispersa el rojo y deja pasar el azul alrededor del disco) */
const AZUL_OCASO = new T.Color(0x9fb8ff);
/* FOBOS, DEIMOS y LA TIERRA: tres discos suaves que solo viven de noche */
const LUNAS = [];
{
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const d = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  d.addColorStop(0, 'rgba(255,255,255,1)');
  d.addColorStop(.55, 'rgba(255,255,255,.7)');
  d.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = d; g.fillRect(0, 0, 64, 64);
  const disco = new T.CanvasTexture(c);
  const mk = (dir, sc, col) => {
    const sp = new T.Sprite(new T.SpriteMaterial({ map: disco, color: col,
      transparent: true, opacity: 0, depthWrite: false, fog: false }));
    sp.scale.set(sc, sc, 1);
    sp.userData.dir = new T.Vector3(dir[0], dir[1], dir[2]).normalize();
    scene.add(sp); LUNAS.push(sp);
  };
  mk([-.3, .5, -.6], 34, 0xd8ccc0);    /* Fobos, la grande y apurada */
  mk([.55, .62, -.2], 15, 0xbfb4a8);   /* Deimos, chiquita */
  mk([.8, .14, -.45], 7, 0x9fc4ff);    /* la Tierra: una chispa celeste */
}

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = tierra del sendero · G = hojarasca bajo el bosque. Se pinta UNA vez en un
   canvas de 512: el sendero como trazo gordo entre los puntos de la historia,
   la hojarasca como manchas de ruido donde después van los árboles. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* grava oscura: manchas */
  g.fillStyle = '#003800';
  for (let i = 0; i < 900; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 6 + rnd() * 22;
    if (vnoise(x * .02, y * .02) < .52) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.284); g.fill();
  }
  g.filter = 'blur(6px)';
  g.drawImage(SPL, 0, 0);
  g.filter = 'none';
  /* el sendero: R fuerte, con borde difuso */
  for (const [w, c] of [[16, 'rgba(140,0,0,.55)'], [8, 'rgba(255,0,0,.85)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* claros: cabaña y santuario sin hojarasca, con algo de tierra */
  for (const k of ['habitat', 'antena']){
    g.fillStyle = 'rgba(160,0,0,.5)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 12, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4
   texturas, pero con TODO el pipeline de three gratis — RECIBE las sombras del
   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo
   (antes el terreno y los árboles se iluminaban por recetas distintas y había
   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 7 }
};
const matTerr = new T.MeshLambertMaterial({ map: TX.pasto });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = texture2D(map, uvT).rgb;
      c = mix(c, texture2D(tHoja, uvT*1.3).rgb, clamp(spl.g*1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT*1.6).rgb, clamp(spl.r*1.35, 0., 1.));
      c = mix(c, texture2D(tRoca, uvT*.9).rgb, vRocoso);
      diffuseColor.rgb *= c;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    scene.add(m);
    terrChunks.push(m);
  }
}

/* falda del horizonte: tapa la parte BAJA de la foto del cielo (que es oscura)
   con suelo que a esa distancia ya es color de niebla puro */
{
  const f = new T.Mesh(new T.CircleGeometry(1150, 24),
    new T.MeshLambertMaterial({ color: 0x8a4a2c }));
  f.rotation.x = -Math.PI / 2;
  f.position.y = -10;
  f.frustumCulled = false;
  scene.add(f);
  /* PARED DE LOMAS LEJANAS: una falda plana converge exactamente a la altura del
     ojo, así que desde cualquier punto alto (la colina del roble, la cámara del
     menú) se veía la franja oscura de la foto del cielo entre la falda y el
     horizonte. Este anillo sube hasta +70 a 1.100 m: a esa distancia la niebla lo
     pinta liso y se lee como una serranía en la bruma que CIERRA el horizonte. */
  const pared = new T.Mesh(new T.CylinderGeometry(1100, 660, 78, 24, 1, true),
    new T.MeshLambertMaterial({ color: 0x6e3f26, side: T.BackSide }));
  pared.position.y = 31;         /* base -8, borde +70 */
  pared.frustumCulled = false;
  scene.add(pared);
}
/* --------------------------- TOLVANERAS (dust devils) ----------------------
   Tres remolinos de polvo que vagan por la llanura en círculos lentos: conos
   translúcidos con vetas verticales pintadas, girando rápido sobre sí mismos.
   Marte sin tolvaneras no es Marte. */
const dustTex = lienzo(128, (g, n) => {
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 90; i++){
    g.strokeStyle = 'rgba(214,150,100,' + (.05 + rnd() * .12).toFixed(3) + ')';
    g.lineWidth = 1 + rnd() * 3;
    const x = rnd() * n;
    g.beginPath(); g.moveTo(x, 0);
    g.bezierCurveTo(x + 8, n * .3, x - 8, n * .6, x + rnd() * 10 - 5, n);
    g.stroke();
  }
});
const TOLVAS = [];
{
  const geoT = new T.CylinderGeometry(3.2, .6, 30, 10, 1, true);
  geoT.translate(0, 15, 0);
  for (let i = 0; i < 3; i++){
    const m = new T.Mesh(geoT, new T.MeshLambertMaterial({ map: dustTex,
      transparent: true, opacity: .16, side: T.DoubleSide, depthWrite: false }));
    m.userData = { cx: [230, -300, 40][i], cz: [120, 100, -60][i],
      R: 60 + i * 25, w: .05 + i * .013, f: i * 2.1 };
    scene.add(m);
    TOLVAS.push(m);
  }
}
function pasoTolvas(t){
  for (const m of TOLVAS){
    const u = m.userData;
    const x = u.cx + Math.cos(t * u.w + u.f) * u.R;
    const z = u.cz + Math.sin(t * u.w + u.f) * u.R;
    m.position.set(x, H(x, z) - .5, z);
    m.rotation.y = t * 5 + u.f;
    m.material.opacity = .1 + .07 * Math.abs(Math.sin(t * .3 + u.f));
  }
}

/* --------------------- EL CAMPO DE ROCAS + PIEDRITAS -----------------------
   Nada crece acá. El "bosque" marciano son rocas: cuatro siluetas de basalto
   deformadas con ruido, instanciadas por todo el mapa con la grilla temblada
   de SENDA, MÁS densas alrededor del cráter (la eyecta del impacto). */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
const ARB = [];                                /* [x,z,r] choque */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (k !== 'crater' && Math.hypot(x - p.x, z - p.z) < 16) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function geoRoca(sem, punta){
  const g = new T.SphereGeometry(1, 7, 5);
  const P = g.attributes.position, UV = g.attributes.uv;
  for (let i = 0; i < P.count; i++){
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const k = .6 + .62 * vnoise(x * 2.1 + sem, z * 2.1 + y * 1.3 + sem * 2);
    P.setXYZ(i, x * k, y * k * punta, z * k);
    UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
  }
  g.computeVertexNormals();
  return g;
}
function plantar(){
  const variantes = [geoRoca(3, .55), geoRoca(17, .72), geoRoca(41, .62), geoRoca(77, .9)];
  const posV = [[], [], [], []];
  const PASO_A = 18;
  const CTA = { tot: 0, dens: 0, camino: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-5, 5), z = gz + rr(-5, 5);
    let dens = vnoise(x * .011 + 60, z * .011 + 22);
    const dl = Math.hypot(x - POI.crater.x, z - POI.crater.z);
    dens += .22 * Math.exp(-((dl - 185) * (dl - 185)) / (70 * 70));
    if (dens < .46){ CTA.dens++; continue; }
    if (dens < .58 && rnd() > (dens - .46) * 6){ CTA.dens++; continue; }
    if (molesta(x, z, 13)){ CTA.camino++; continue; }
    const y = H(x, z);
    const pend = Math.max(Math.abs(H(x + 2, z) - y), Math.abs(H(x, z + 2) - y));
    if (pend > 1.6){ CTA.dens++; continue; }
    CTA.ok++;
    const sc = rr(.5, 2.7);
    posV[(rnd() * 4) | 0].push([x, y - sc * .18, z, sc]);
    if (sc > 1.4) ARB.push([x, z, sc * .8]);
  }
  const matRoca = new T.MeshLambertMaterial({ map: TX.roca });
  for (let v = 0; v < 4; v++){
    const arr = posV[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(variantes[v], matRoca, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(0, rr(0, 6.28), rr(-.08, .08)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.85, 1.1), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;
    scene.add(im);
  }
  /* PIEDRITAS: sin colisión ni sombra, puro detalle del regolito */
  const chico = new T.InstancedMesh(geoRoca(5, .5), matRoca, 400);
  for (let i = 0; i < 400; i++){
    const x = rr(-MITAD + 8, MITAD - 8), z = rr(-MITAD + 8, MITAD - 8);
    const sc = rr(.08, .3);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, H(x, z) - sc * .2, z), Q4, new T.Vector3(sc, sc, sc));
    chico.setMatrixAt(i, M4);
  }
  chico.frustumCulled = false;
  scene.add(chico);
  /* RESTOS de la tormenta: chapas arrancadas, medio enterradas cerca de la
     senda entre el hábitat y el rover — cuentan la historia sin hablar */
  const matMet = new T.MeshLambertMaterial({ map: TX.metal });
  for (let i = 0; i < 6; i++){
    const t = .15 + i * .13;
    const a = POI.habitat, b = POI.vagabundo;
    const x = a.x + (b.x - a.x) * t + rr(8, 16) * (i % 2 ? 1 : -1);
    const z = a.z + (b.z - a.z) * t + rr(8, 16) * (i % 2 ? -1 : 1);
    const m = new T.Mesh(new T.BoxGeometry(rr(1.2, 2.4), .08, rr(.8, 1.6)), matMet);
    m.position.set(x, H(x, z) + .05, z);
    m.rotation.set(rr(-.3, .3), rr(0, 6.28), rr(-.25, .25));
    m.castShadow = true;
    scene.add(m);
  }
}
plantar();

/* ---------------- EL VAGABUNDO: el rover perdido ---------------------------
   Cuerpo con panza, mástil con cabeza de cámaras, RTG a la espalda, seis
   ruedas medio enterradas y el panel del techo torcido por la tormenta.
   Escorado en la arena, como quedó el día que murió su transmisión. */
{
  const p = POI.vagabundo, y = H(p.x, p.z);
  const matMet = new T.MeshLambertMaterial({ map: TX.metal });
  const matOsc = new T.MeshLambertMaterial({ map: TX.oscuro });
  const met = [], osc = [];
  const cuerpo = new T.BoxGeometry(3.4, 1.2, 2.3); cuerpo.translate(0, 1.5, 0); met.push(cuerpo);
  const panza = new T.BoxGeometry(2.6, .5, 1.7); panza.translate(0, .85, 0); met.push(panza);
  const mast = new T.CylinderGeometry(.07, .09, 1.9, 6); mast.translate(1.2, 3, .6); met.push(mast);
  const cab = new T.BoxGeometry(.7, .3, .28); cab.translate(1.2, 4, .6); met.push(cab);
  const rtg = new T.CylinderGeometry(.3, .3, 1.1, 8); rtg.rotateZ(Math.PI / 2);
  rtg.translate(-1.9, 1.7, 0); osc.push(rtg);
  for (const sx of [-1.3, 0, 1.3]) for (const sz of [-1, 1]){
    const r = new T.CylinderGeometry(.55, .55, .42, 12);
    r.rotateX(Math.PI / 2);
    r.translate(sx, .55, sz * 1.35);
    osc.push(r);
  }
  const rover = new T.Group();
  rover.add(new T.Mesh(fusiona(met), matMet));
  rover.add(new T.Mesh(fusiona(osc), matOsc));
  const mPan = new T.Mesh(new T.BoxGeometry(2.8, .06, 1.9),
    new T.MeshLambertMaterial({ map: TX.panel }));

/* ---------------- EL MIRADOR DEL CRÁTER + EL PLATO CAÍDO -------------------
   El plato del repetidor (parábola torneada) clavado de canto en la ladera
   del cráter, un puntal roto y el mojón de piedras de la tripulación. */
{
  const p = POI.mirador, y = H(p.x, p.z);
  const matMet = new T.MeshLambertMaterial({ map: TX.metal, side: T.DoubleSide });
  const perfil = [];
  for (let i = 0; i <= 10; i++){ const r = i / 10 * 2.4; perfil.push(new T.Vector2(r, r * r * .22)); }
  const plato = new T.Mesh(new T.LatheGeometry(perfil, 18), matMet);
  const dirC = Math.atan2(POI.crater.x - p.x, POI.crater.z - p.z);
  const px2 = p.x + Math.sin(dirC) * 14, pz2 = p.z + Math.cos(dirC) * 14;
  plato.position.set(px2, H(px2, pz2) + .9, pz2);
  plato.rotation.set(1.9, .5, .3);
  plato.castShadow = true;
  scene.add(plato);
  ARB.push([px2, pz2, 2.2]);
  const punt = new T.Mesh(new T.CylinderGeometry(.06, .08, 2.6, 6), matMet);
  punt.position.set(p.x + 3, y + .6, p.z - 2);
  punt.rotation.z = 1.2;
  scene.add(punt);
  const matRoca2 = new T.MeshLambertMaterial({ map: TX.roca });
  for (let i = 0; i < 5; i++){
    const sc = .5 - i * .07;
    const m = new T.Mesh(new T.SphereGeometry(sc, 7, 5), matRoca2);
    m.position.set(p.x - 2, y + .25 + i * .5, p.z + 1.5);

/* ---------------- LA TORRE DE LA ANTENA + EL CAMPO DE PANELES --------------
   Torre reticulada (4 patas inclinadas, travesaños en 3 niveles, plataforma),
   el gran plato torneado mirando al cielo, la BALIZA roja que pulsa, el
   tablero del interruptor maestro (el USAR del cap 5) y 18 paneles solares
   en formación con sus postes. */
let beaconMat = null;
{
  const p = POI.antena, y = H(p.x, p.z);
  const matMet = new T.MeshLambertMaterial({ map: TX.metal });
  const piezas = [];
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]){
    const g = new T.CylinderGeometry(.09, .13, 13, 5);
    g.translate(0, 6.5, 0);
    g.rotateZ(-sx * .085); g.rotateX(sz * .085);
    g.translate(sx * 1.7, 0, sz * 1.7);
    piezas.push(g);
  }
  for (let nv = 1; nv <= 3; nv++){
    const w = 3.4 - nv * .75, yy = nv * 3.6;
    for (const rot of [0, Math.PI / 2]){
      for (const lado of [-1, 1]){
        const g = new T.BoxGeometry(w * 2, .1, .1);
        g.rotateY(rot);
        g.translate(rot ? lado * w : 0, yy, rot ? 0 : lado * w);
        piezas.push(g);
      }
    }
  }
  const plataforma = new T.BoxGeometry(3.2, .18, 3.2);
  plataforma.translate(0, 13.1, 0);
  piezas.push(plataforma);
  const torre = new T.Mesh(fusiona(piezas), matMet);
  torre.position.set(p.x, y, p.z);
  torre.castShadow = true;
  scene.add(torre);
  const perf2 = [];
  for (let i = 0; i <= 12; i++){ const r = i / 12 * 3.0; perf2.push(new T.Vector2(r, r * r * .16)); }
  const plato2 = new T.Mesh(new T.LatheGeometry(perf2, 20),
    new T.MeshLambertMaterial({ map: TX.metal, side: T.DoubleSide }));
  plato2.position.set(p.x, y + 13.6, p.z);
  plato2.rotation.x = -.9;
  plato2.castShadow = true;
  scene.add(plato2);
  beaconMat = new T.MeshBasicMaterial({ color: 0xff3822, transparent: true });
  const bea = new T.Mesh(new T.SphereGeometry(.22, 8, 6), beaconMat);
  bea.position.set(p.x, y + 15.3, p.z);
  scene.add(bea);
  const tab = new T.Mesh(new T.BoxGeometry(.9, 1.3, .35), matMet);
  tab.position.set(p.x + 2.6, y + .65, p.z + 2.2);
  tab.castShadow = true;
  scene.add(tab);
  ARB.push([p.x, p.z, 2.4]);
  /* el campo de paneles, del lado CONTRARIO a la senda */
  const matPan = new T.MeshLambertMaterial({ map: TX.panel, side: T.DoubleSide });
  const gTabl = new T.BoxGeometry(2.6, .07, 1.7);
  gTabl.rotateX(-.42);
  gTabl.translate(0, 1.35, 0);
  const gPoste = new T.CylinderGeometry(.09, .11, 1.1, 6);
  gPoste.translate(0, .55, 0);
  const iTab = new T.InstancedMesh(gTabl, matPan, 18);
  const iPos = new T.InstancedMesh(gPoste, matMet, 18);
  let np = 0;
  for (let fila = 0; fila < 3; fila++) for (let col = 0; col < 6; col++){
    const x = p.x + 22 + col * 4.6, z = p.z + 24 + fila * 5.6;
    if (molesta(x, z, 10)) continue;
    Q4.setFromEuler(E3.set(0, rr(-.06, .06), 0));
    M4.compose(V3.set(x, H(x, z), z), Q4, new T.Vector3(1, 1, 1));
    iTab.setMatrixAt(np, M4); iPos.setMatrixAt(np, M4);
    ARB.push([x, z, 1.4]);
    np++;
  }
  iTab.count = iPos.count = np;
  iTab.castShadow = iPos.castShadow = true;
  iTab.frustumCulled = iPos.frustumCulled = false;
  scene.add(iTab); scene.add(iPos);
  window.__PANELES = np;
}
/* -------- BALIZAS de emergencia flotantes (capítulos 4-5) + marcador ------- */
let luci = null, luci0 = null;
{
  const NL = 90, P = new Float32Array(NL * 3), C = new Float32Array(NL * 3);
  const c = new T.Color();
  const a = POI.mirador, b = POI.antena;
  for (let i = 0; i < NL; i++){
    const t = i / NL;
    const x = a.x + (b.x - a.x) * t + rr(-14, 14);
    const z = a.z + (b.z - a.z) * t + rr(-14, 14);
    P[i*3] = x; P[i*3+1] = H(x, z) + rr(1, 4); P[i*3+2] = z;
    c.setHSL(.07 + rnd() * .03, .95, .6);
    C[i*3] = c.r; C[i*3+1] = c.g; C[i*3+2] = c.b;
  }
  luci0 = Float32Array.from(P);
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('color', new T.BufferAttribute(C, 3));
  const cn = document.createElement('canvas'); cn.width = cn.height = 32;
  const g2 = cn.getContext('2d');
  const d = g2.createRadialGradient(16,16,0,16,16,16);
  d.addColorStop(0,'rgba(255,255,255,1)'); d.addColorStop(1,'rgba(255,255,255,0)');
  g2.fillStyle = d; g2.fillRect(0,0,32,32);
  luci = new T.Points(g, new T.PointsMaterial({ size: .8, map: new T.CanvasTexture(cn),
    vertexColors: true, transparent: true, blending: T.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true }));
  luci.visible = false;
  scene.add(luci);
}

function cargar(){ try { return JSON.parse(localStorage.getItem('marte1') || 'null'); } catch(e){ return null; } }
function ponCap(n, silencio){
  cap = cl(n, 0, CAPS.length - 1);
  const C = CAPS[cap];
  $('objT').textContent = C.objT;
  luzDe = mezclaLuz(); luzA = LUZCAP[cap]; luzK = 0;
  luci.visible = cap === 3 || cap === 4;
  MISION.alCap(cap);
  if (!silencio){
    $('capN').textContent = C.n;
    $('capT').textContent = C.t;
    $('capCard').classList.add('on');
    clearTimeout(ponCap._t);
    ponCap._t = setTimeout(() => $('capCard').classList.remove('on'), 3400);
    /* la CINEMÁTICA del capítulo: la cámara te muestra adónde vas */
    cineObjetivo(C);
  }
  guardar();
}
function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* el ATARDECER AZUL: el halo del sol vira del caramelo al azul al caer */
  glare.material.color.set(0xfff0dc).lerp(AZUL_OCASO, cl(1 - SOLD.y * 2.4, 0, 1));
  /* la ventana de la cabaña se enciende sola cuando oscurece, y VUELCA luz */
  if (ventanaMat){
    const osc = cl(1 - (SOLD.y * 420) / 160, 0, 1);
    ventanaMat.color.setRGB(.35 + .65 * osc, .29 + .55 * osc, .2 + .28 * osc);
    focoCasa.intensity = osc * osc * 60;
  }
}
function dialogo(titulo, cuerpo, alCerrar, cara){
  enDlg = true;
  $('dlgT').textContent = titulo;
  $('dlgB').textContent = cuerpo;
  /* si habla un PERSONAJE, su retrato se pinta al vuelo (canvas) */
  const cv = $('dlgCara');
  if (cara){
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 96, 96);
    cara(g, 96);
    cv.classList.add('on');
  } else cv.classList.remove('on');
  $('dlg').classList.add('on');
  $('dlgGo').onclick = () => {
    $('dlg').classList.remove('on');
    enDlg = false;
    if (alCerrar) alCerrar();
  };
}
function llegaObjetivo(){
  const C = CAPS[cap];
  dialogo(C.dT, C.d, () => {
    if (cap >= CAPS.length - 1){ finDeHistoria(); return; }
    ponCap(cap + 1);
  });
}

/* ================= AUDIO GENERADO (Higgsfield) ============================
   Ambiente + música + pasos por mundo, cargados SOBRE el sintetizado: cuando
   decodifican lo apagan; si una URL falla (offline o el navegador no decodifica
   AAC) el sintetizado sigue solo. Vive acá (motor compartido) y no en la
   sección AMB, que cada mundo reescribe. Los mk_*.py pisan MUNDO_AUDIO. */
const HASHAX = '67a12b9';
const AX = f => (LOC ? '/assets/mundos/'
  : 'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@' + HASHAX + '/assets/mundos/') + f;
const MUNDO_AUDIO = { amb: 'amb-marte.mp3', mus: 'mus-marte.m4a', paso: 'pasos-arena.mp3', pasoRate: 1.4 };
function cargarAudioReal(){
  const A2 = AMB.ctx; if (!A2 || AMB._cargado) return;
  AMB._cargado = true;
  const carga = async url => A2.decodeAudioData(await (await fetch(url)).arrayBuffer());
  /* los tres en PARALELO e independientes: si el m4a no decodifica (AAC), ni
     el ambiente ni los pasos lo esperan */
  carga(AX(MUNDO_AUDIO.amb)).then(ba => {
    const na = A2.createBufferSource(); na.buffer = ba; na.loop = true;
    AMB.ambReal = A2.createGain(); AMB.ambReal.gain.value = .55;
    na.connect(AMB.ambReal); AMB.ambReal.connect(AMB.master); na.start();
    if (AMB.viento) AMB.viento.gain.value *= .35;   /* duck del sintetizado */
  }).catch(() => {});
  carga(AX(MUNDO_AUDIO.mus)).then(bm => {
    const nm = A2.createBufferSource(); nm.buffer = bm; nm.loop = true;
    AMB.musGain = A2.createGain(); AMB.musGain.gain.value = .3;
    nm.connect(AMB.musGain); AMB.musGain.connect(AMB.master); nm.start();
  }).catch(() => {});
  carga(AX(MUNDO_AUDIO.paso)).then(bp => {
    AMB.pasoSrc = A2.createBufferSource(); AMB.pasoSrc.buffer = bp; AMB.pasoSrc.loop = true;
    AMB.pasoSrc.playbackRate.value = MUNDO_AUDIO.pasoRate || 1.4;
    AMB.pasoGain = A2.createGain(); AMB.pasoGain.gain.value = 0;
    AMB.pasoSrc.connect(AMB.pasoGain); AMB.pasoGain.connect(AMB.master); AMB.pasoSrc.start();
  }).catch(() => {});
}

/* ========================= CINEMÁTICAS =====================================
   Cámara sobre rieles: cada paso vuela de `de` a `a` mirando a `mira`, con
   subtítulo y letterbox. Se saltea con un toque. El sol (y su caja de sombra)
   siguen a la cámara mientras dura. */
const CINE = { on: false, i: 0, t: 0, pasos: null, fin: null };
const _cv1 = new T.Vector3(), _cv2 = new T.Vector3(), _cv3 = new T.Vector3();
function cinematica(pasos, fin){
  CINE.on = true; CINE.pasos = pasos; CINE.i = 0; CINE.t = 0; CINE.fin = fin || null;
  fase = 'cine';
  $('hud').classList.remove('on');
  document.body.classList.add('cine');
}
function terminaCine(){
  if (!CINE.on) return;
  CINE.on = false;
  document.body.classList.remove('cine');
  $('cineTxt').textContent = '';
  fase = 'juego';
  $('hud').classList.add('on');
  cam.fov = 72; cam.updateProjectionMatrix();
  if (CINE.fin){ const f = CINE.fin; CINE.fin = null; f(); }
}
function pasoCine(dt){
  const p = CINE.pasos[CINE.i];
  if (!p){ terminaCine(); return; }
  CINE.t = Math.min(1, CINE.t + dt / (p.dur || 3));
  const k = CINE.t * CINE.t * (3 - 2 * CINE.t);
  _cv1.set(p.de[0], p.de[1], p.de[2]);
  _cv2.set(p.a[0], p.a[1], p.a[2]);
  cam.position.lerpVectors(_cv1, _cv2, k);
  _cv3.set(p.mira[0], p.mira[1], p.mira[2]);
  cam.lookAt(_cv3);
  cam.fov = p.fov || 58; cam.updateProjectionMatrix();
  $('cineTxt').textContent = p.txt || '';
  if (CINE.t >= 1){ CINE.i++; CINE.t = 0;
    if (CINE.i >= CINE.pasos.length) terminaCine(); }
}
$('cineSkip').addEventListener('pointerdown', e => { e.preventDefault(); terminaCine(); });
/* la cine de CAPÍTULO: dos tomas que muestran adónde hay que ir */
function cineObjetivo(C){
  const o = POI[C.obj], oy = H(o.x, o.z), py = H(px, pz);
  const dx2 = o.x - px, dz2 = o.z - pz, dd = Math.hypot(dx2, dz2) || 1;
  const ux = dx2 / dd, uz = dz2 / dd;
  cinematica([
    { de: [px - ux * 7, py + 3.5, pz - uz * 7], a: [px + ux * 8, py + 15, pz + uz * 8],
      mira: [o.x, oy + 6, o.z], dur: 2.7, txt: C.n + ' · ' + C.t },
    { de: [o.x - ux * 44 + uz * 12, oy + 19, o.z - uz * 44 - ux * 12],
      a: [o.x - ux * 15, oy + 6, o.z - uz * 15],
      mira: [o.x, oy + 3.5, o.z], dur: 2.7, txt: C.objT }
  ]);
}

/* ========================= PERSONAJES Y CRIATURAS ==========================
   Figuras 100% procedurales con partes animables (userData.lim): humanos con
   brazos y piernas en péndulo, perro con cola, dron con rotores, criatura
   que late. npcTick las hace CAMINAR detrás del jugador si `sigue`. */
const NPCS = [];
function figHumano(colTraje, colCasco){
  const g = new T.Group();
  const mT = new T.MeshLambertMaterial({ color: colTraje });
  const mC = new T.MeshLambertMaterial({ color: colCasco || 0xd8dde2 });
  const torso = new T.Mesh(new T.CapsuleGeometry(.32, .55, 4, 8), mT);
  torso.position.y = 1.08; g.add(torso);
  const cabeza = new T.Mesh(new T.SphereGeometry(.25, 10, 8), mC);
  cabeza.position.y = 1.78; g.add(cabeza);
  const visor = new T.Mesh(new T.SphereGeometry(.19, 8, 6),
    new T.MeshLambertMaterial({ color: 0x18242f }));
  visor.position.set(0, 1.79, .13); visor.scale.set(.92, .68, .6); g.add(visor);
  const lim = {};
  for (const [k, sx] of [['bI', -.44], ['bD', .44]]){
    const b = new T.Mesh(new T.CapsuleGeometry(.085, .5, 3, 6), mT);
    b.geometry.translate(0, -.3, 0);
    b.position.set(sx, 1.46, 0); g.add(b); lim[k] = b;
  }
  for (const [k, sx] of [['pI', -.16], ['pD', .16]]){
    const p2 = new T.Mesh(new T.CapsuleGeometry(.105, .5, 3, 6), mT);
    p2.geometry.translate(0, -.32, 0);
    p2.position.set(sx, .74, 0); g.add(p2); lim[k] = p2;
  }
  const mochi = new T.Mesh(new T.BoxGeometry(.4, .5, .2), mC);
  mochi.position.set(0, 1.22, -.3); g.add(mochi);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figPerro(col){
  const g = new T.Group();
  const m = new T.MeshLambertMaterial({ color: col });
  const mOsc = new T.MeshLambertMaterial({ color: 0x2a1e14 });
  const cuerpo = new T.Mesh(new T.BoxGeometry(.62, .3, .27), m);
  cuerpo.position.y = .46; g.add(cuerpo);
  const cabeza = new T.Mesh(new T.BoxGeometry(.24, .22, .2), m);
  cabeza.position.set(.4, .6, 0); g.add(cabeza);
  const hocico = new T.Mesh(new T.BoxGeometry(.12, .1, .12), mOsc);
  hocico.position.set(.54, .55, 0); g.add(hocico);
  for (const sz of [-1, 1]){
    const oreja = new T.Mesh(new T.BoxGeometry(.05, .12, .06), mOsc);
    oreja.position.set(.36, .76, sz * .07); g.add(oreja);
  }
  const lim = {};
  let pi = 0;
  for (const sx of [-.22, .22]) for (const sz of [-.09, .09]){
    const pata = new T.Mesh(new T.CylinderGeometry(.045, .04, .34, 5), m);
    pata.geometry.translate(0, -.17, 0);
    pata.position.set(sx, .34, sz); g.add(pata);
    lim['p' + (++pi)] = pata;
  }
  const cola = new T.Mesh(new T.CylinderGeometry(.03, .015, .3, 5), m);
  cola.geometry.translate(0, .15, 0);
  cola.position.set(-.32, .52, 0);
  cola.rotation.x = .0; cola.rotation.z = .8;
  g.add(cola); lim.cola = cola;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figDron(col){
  const g = new T.Group();
  const m = new T.MeshLambertMaterial({ color: col });
  const cuerpo = new T.Mesh(new T.SphereGeometry(.3, 10, 8), m);
  cuerpo.scale.y = .6; g.add(cuerpo);
  const ojo = new T.Mesh(new T.SphereGeometry(.08, 8, 6),
    new T.MeshBasicMaterial({ color: 0x7fe8ff }));
  ojo.position.set(0, 0, .27); g.add(ojo);
  const lim = { rot: [] };
  for (const [sx, sz] of [[-.34, -.34], [.34, -.34], [-.34, .34], [.34, .34]]){
    const brazo = new T.Mesh(new T.BoxGeometry(.2, .03, .05), m);
    brazo.position.set(sx * .7, .12, sz * .7);
    brazo.rotation.y = Math.atan2(sz, sx);
    g.add(brazo);
    const rotor = new T.Mesh(new T.CylinderGeometry(.16, .16, .02, 8),
      new T.MeshLambertMaterial({ color: 0x333a40, transparent: true, opacity: .6 }));
    rotor.position.set(sx, .18, sz);
    g.add(rotor); lim.rot.push(rotor);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figCriatura(col){
  const g = new T.Group();
  const domo = new T.Mesh(new T.SphereGeometry(.3, 10, 8),
    new T.MeshLambertMaterial({ color: 0x10201c, emissive: col,
      emissiveIntensity: .8, transparent: true, opacity: .92 }));
  domo.position.y = .42; domo.scale.y = 1.15; g.add(domo);
  const lim = {};
  let pi = 0;
  for (const a of [.6, 2.2, 4.0, 5.6]){
    const pata = new T.Mesh(new T.CylinderGeometry(.02, .015, .3, 4),
      new T.MeshLambertMaterial({ color: 0x1a2a26 }));
    pata.geometry.translate(0, -.15, 0);
    pata.position.set(Math.cos(a) * .18, .3, Math.sin(a) * .18);
    pata.rotation.z = Math.cos(a) * .4; pata.rotation.x = -Math.sin(a) * .4;
    g.add(pata); lim['p' + (++pi)] = pata;
  }
  for (const sz of [-1, 1]){
    const ojo = new T.Mesh(new T.SphereGeometry(.045, 6, 5),
      new T.MeshBasicMaterial({ color: 0xffffff }));
    ojo.position.set(sz * .1, .48, .26); g.add(ojo);
  }
  g.userData.lim = lim;
  g.userData.late = domo.material;
  return g;
}
const MIXERS = [];
/* carga un personaje 3D generado y lo cuelga del Group del NPC, apagando la
   figura procedural; si falla, la procedural se queda. Reproduce su clip. */
function ponerModelo(npc){
  if (!GLTF || !npc.glb) return;
  new GLTF().load(AX(npc.glb), g => {
    const m = g.scene;
    m.scale.setScalar(npc.glbEsc || 1);
    m.position.y = npc.glbY || 0;
    m.rotation.y = npc.glbGiro || 0;
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material){ o.material.metalness = 0; } } });
    /* apagar la figura procedural (queda de respaldo si el modelo no llegó) */
    npc.fig.traverse(o => { if (o.isMesh) o.visible = false; });
    npc.fig.add(m);
    npc.modelo = m;
    if (g.animations && g.animations.length){
      const mix = new T.AnimationMixer(m);
      mix.clipAction(g.animations[0]).play();
      npc.mixer = mix; MIXERS.push(mix);
    }
    npc.cargado = true;
  }, undefined, () => {});
}
function nuevoNPC(o){
  o.fig.position.set(o.x, H(o.x, o.z) + (o.vuela ? (o.alto || 2.2) : 0), o.z);
  o.fig.rotation.y = o.giro || 0;
  scene.add(o.fig);
  o.fase = rr(0, 6.28); o.li = 0;
  NPCS.push(o);
  ponerModelo(o);
  return o;
}
function npcTick(dt){
  for (const mix of MIXERS) mix.update(dt);
  for (const npc of NPCS){
    /* el modelo 3D generado ya trae su propia orientación: si el clip es de
       caminar, no le sumamos el balanceo procedural de las extremidades */
    const f = npc.fig;
    const d = Math.hypot(px - f.position.x, pz - f.position.z);
    let anda = 0;
    if (npc.sigue){
      if (d > 40){                       /* nunca se queda atrás de verdad */
        f.position.x = px - Math.sin(yaw) * -3 + 1.5;
        f.position.z = pz - Math.cos(yaw) * -3 + 1.5;
      } else if (d > 3.4){
        const vel2 = (corre ? 10.8 : 5.8) * dt;
        f.rotation.y = Math.atan2(px - f.position.x, pz - f.position.z);
        f.position.x += (px - f.position.x) / d * Math.min(vel2, d - 3.2);
        f.position.z += (pz - f.position.z) / d * Math.min(vel2, d - 3.2);
        anda = 1;
      }
    } else if (d < 11){
      const objY = Math.atan2(px - f.position.x, pz - f.position.z);
      let dy = objY - f.rotation.y;
      while (dy > Math.PI) dy -= 6.283;
      while (dy < -Math.PI) dy += 6.283;
      f.rotation.y += dy * Math.min(1, dt * 3);
    }
    const suelo = H(f.position.x, f.position.z);
    f.position.y = npc.vuela
      ? suelo + (npc.alto || 2.2) + Math.sin(t0 * 1.7 + npc.fase) * .25
      : suelo;
    const L2 = f.userData.lim || {};
    const sw = anda ? Math.sin(t0 * 9) * .55 : Math.sin(t0 * 1.4 + npc.fase) * .06;
    if (L2.bI){ L2.bI.rotation.x = sw; L2.bD.rotation.x = -sw;
      /* hay figuras con brazos pero sin piernas (el pingüino aletea) */
      if (L2.pI){ L2.pI.rotation.x = -sw; L2.pD.rotation.x = sw; } }
    if (L2.p1 && !L2.bI){ const s2 = anda ? Math.sin(t0 * 11) * .6 : 0;
      L2.p1.rotation.x = s2; L2.p4.rotation.x = s2;
      L2.p2.rotation.x = -s2; L2.p3.rotation.x = -s2; }
    if (L2.cola) L2.cola.rotation.x = Math.sin(t0 * (anda ? 13 : 6) + npc.fase) * .4;
    if (L2.rot) for (const r of L2.rot) r.rotation.y += dt * 28;
    if (f.userData.late)
      f.userData.late.emissiveIntensity = .6 + .35 * Math.sin(t0 * 2.2 + npc.fase);
  }
}
function npcCerca(){
  let mejor = null, md = 4.4;
  for (const npc of NPCS){
    if (!npc.clave) continue;
    const d = Math.hypot(px - npc.fig.position.x, pz - npc.fig.position.z);
    if (d < md){ md = d; mejor = npc; }
  }
  return mejor;
}
function hablaNPC(npc){
  const lineas = (L[LANG].npc && L[LANG].npc[npc.clave]) || [];
  if (!lineas.length) return;
  const txt = lineas[npc.li % lineas.length];
  npc.li++;
  dialogo(npc.nombre, txt, npc.alHablar || null, npc.cara);
}

/* ========================= ITEMS USABLES ================================== */
const ITEMS = [];
function nuevoItem(o){ o.activo = true; ITEMS.push(o); return o; }
function itemCerca(){
  for (const it of ITEMS){
    if (!it.activo) continue;
    if (Math.hypot(px - it.x, pz - it.z) < (it.r || 3.5)) return it;
  }
  return null;
}
/* ¿qué haría el botón USAR ahora mismo? El capítulo manda, después los
   items, después charlar con quien esté cerca. */
function accionUsable(){
  const C = CAPS[cap];
  const p = POI[C.obj];
  if (C.usar && Math.hypot(px - p.x, pz - p.z) < 7 && MISION.lista(cap))
    return { tipo: 'cap' };
  const it = itemCerca();
  if (it) return { tipo: 'item', it };
  const npc = npcCerca();
  if (npc) return { tipo: 'npc', npc };
  return null;
}
function usarAccion(){
  if (enDlg) return;
  const acc = accionUsable();
  if (!acc) return;
  if (acc.tipo === 'cap') llegaObjetivo();
  else if (acc.tipo === 'item'){ acc.it.activo = false; acc.it.fn(acc.it); }
  else hablaNPC(acc.npc);
}

/* ===================== EL CUERPO EN PRIMERA PERSONA ========================
   Como en los juegos de parkour: MANOS y antebrazos siempre a la vista
   (viewmodel colgado de la cámara) que bombean al caminar y se aprietan al
   correr; PIERNAS de verdad con rodilla al mirar hacia abajo; y un torso y
   cabeza que NO se dibujan (colorWrite=false) pero SÍ proyectan: tu propia
   sombra camina entera por el suelo. Colores por mundo en MUNDO_CUERPO. */
const MUNDO_CUERPO = { mangas: 0xc8ccd2, guantes: 0xd97a2a, pantalon: 0x9aa2ac, botas: 0x3a4048 };  /* ROBERT-9: chapa y naranja */
const CUERPO = {};
{
  const mM = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.mangas });
  const mG = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.guantes });
  const mPa = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.pantalon });
  const mB = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.botas });
  /* material FANTASMA: invisible a la cámara, visible para el sol */
  const mF = new T.MeshLambertMaterial({ color: 0x000000 });
  mF.colorWrite = false; mF.depthWrite = false;

  /* --- viewmodel: dos antebrazos con puño, hijos de la CÁMARA --- */
  scene.add(cam);                 /* la cámara entra a la escena para tener hijos */
  const vm = new T.Group();
  const brazoVM = s2 => {
    const g = new T.Group();
    const puno = new T.Mesh(new T.BoxGeometry(.09, .08, .11), mG);
    puno.rotation.z = s2 * .18;
    g.add(puno);
    const pulgar = new T.Mesh(new T.BoxGeometry(.028, .03, .05), mG);
    pulgar.position.set(-s2 * .052, .012, .012);
    g.add(pulgar);
    const ante = new T.Mesh(new T.CapsuleGeometry(.05, .3, 3, 8), mM);
    ante.position.set(s2 * .07, -.16, .15);
    ante.rotation.x = .95;
    ante.rotation.z = -s2 * .3;
    g.add(ante);
    g.position.set(s2 * .23, -.26, -.46);
    vm.add(g);
    return g;
  };
  CUERPO.bI = brazoVM(-1);
  CUERPO.bD = brazoVM(1);
  cam.add(vm);
  CUERPO.vm = vm;

  /* --- el cuerpo en el mundo: piernas visibles + resto sólo-sombra --- */
  const root = new T.Group();
  const pierna = s2 => {
    const cad = new T.Group();
    cad.position.set(s2 * .115, .98, .03);
    const muslo = new T.Mesh(new T.CapsuleGeometry(.075, .3, 3, 8), mPa);
    muslo.geometry.translate(0, -.21, 0);
    muslo.castShadow = true;
    cad.add(muslo);
    const rodilla = new T.Group();
    rodilla.position.set(0, -.46, 0);
    const canilla = new T.Mesh(new T.CapsuleGeometry(.06, .28, 3, 8), mPa);
    canilla.geometry.translate(0, -.19, 0);
    canilla.castShadow = true;
    rodilla.add(canilla);
    const bota = new T.Mesh(new T.BoxGeometry(.11, .09, .24), mB);
    bota.position.set(0, -.42, .05);
    bota.castShadow = true;
    rodilla.add(bota);
    cad.add(rodilla);
    root.add(cad);
    return { cad, rodilla };
  };
  const pI = pierna(-1), pD = pierna(1);
  CUERPO.pI = pI.cad; CUERPO.rI = pI.rodilla;
  CUERPO.pD = pD.cad; CUERPO.rD = pD.rodilla;
  /* torso, cabeza y brazos FANTASMA: sólo existen en la sombra */
  const torso = new T.Mesh(new T.CapsuleGeometry(.17, .5, 4, 8), mF);
  torso.position.y = 1.28; torso.castShadow = true; root.add(torso);
  const cabeza = new T.Mesh(new T.SphereGeometry(.12, 8, 6), mF);
  cabeza.position.y = 1.72; cabeza.castShadow = true; root.add(cabeza);
  CUERPO.bsI = new T.Mesh(new T.CapsuleGeometry(.05, .55, 3, 6), mF);
  CUERPO.bsI.geometry.translate(0, -.3, 0);
  CUERPO.bsI.position.set(-.28, 1.5, 0); CUERPO.bsI.castShadow = true;
  root.add(CUERPO.bsI);
  CUERPO.bsD = CUERPO.bsI.clone();
  CUERPO.bsD.position.x = .28;
  root.add(CUERPO.bsD);
  root.visible = false;
  vm.visible = false;
  scene.add(root);
  CUERPO.root = root;
}
function cuerpoTick(dt){
  const enJuego = fase === 'juego';
  CUERPO.root.visible = enJuego;
  CUERPO.vm.visible = enJuego && !enDlg;
  if (!enJuego) return;
  CUERPO.root.position.set(px, H(px, pz), pz);
  CUERPO.root.rotation.y = yaw;
  const v = Math.min(1, Math.hypot(pvx, pvz) / VEL);
  const sw = Math.sin(bobF) * (corre ? .95 : .62) * v;
  /* piernas: péndulo desde la cadera, rodilla que se dobla al recoger */
  CUERPO.pI.rotation.x = sw;
  CUERPO.pD.rotation.x = -sw;
  CUERPO.rI.rotation.x = Math.max(0, -sw) * 1.25;
  CUERPO.rD.rotation.x = Math.max(0, sw) * 1.25;
  /* brazos de la sombra, en contrafase con las piernas */
  CUERPO.bsI.rotation.x = -sw * .8;
  CUERPO.bsD.rotation.x = sw * .8;
  /* el viewmodel BOMBEA: quieto respira, caminando alterna, corriendo los
     puños se juntan y suben (parkour) */
  const pump = Math.sin(bobF) * v;
  const amp = corre ? .10 : .06;
  const baseX = corre ? .17 : .23;
  const baseY = -.26 + (corre ? .035 : 0);   /* corriendo los puños SUBEN */
  const resp = Math.sin(t0 * 1.3) * .006;
  CUERPO.bD.position.set(baseX, baseY + pump * amp + resp, -.46 + Math.cos(bobF) * .05 * v);
  CUERPO.bI.position.set(-baseX, baseY - pump * amp + resp, -.46 - Math.cos(bobF) * .05 * v);
  CUERPO.bD.rotation.z = -.06 + pump * .16;
  CUERPO.bI.rotation.z = .06 + pump * .16;
  CUERPO.bD.rotation.x = -.12 + pump * .14;
  CUERPO.bI.rotation.x = -.12 - pump * .14;
}

/* ========================= AMBIENTE SONORO ================================
   SINTETIZADO con WebAudio (cero descarga). Cuatro voces marcianas:
     · VIENTO grave con ráfagas (Marte suena sordo: atmósfera fina)
     · el HUM del hábitat: dos senos graves batiendo, sube al ACERCARSE
     · BLIPS de telemetría: la voz de ROBERT-9, cada 6-16 s
     · ESTÁTICA de radio nocturna, atada a la altura del sol
   ========================================================================== */
const AMB = { ctx: null, master: null, on: true, viento: null, pos: null,
  noche: null, tBlip: 5 };
try { AMB.on = localStorage.getItem('marte_son') !== '0'; } catch(e){}
function ambienteOn(){
  if (AMB.ctx){ if (AMB.ctx.state === 'suspended') AMB.ctx.resume(); return; }
  try { AMB.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const A2 = AMB.ctx;
  AMB.master = A2.createGain();
  AMB.master.gain.value = AMB.on ? 1 : 0;
  AMB.master.connect(A2.destination);
  const buf = A2.createBuffer(1, A2.sampleRate * 3, A2.sampleRate);
  const d = buf.getChannelData(0); let l = 0;
  for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1;
    l = l * .975 + w * .025; d[i] = l * 3.2; }
  const nv = A2.createBufferSource(); nv.buffer = buf; nv.loop = true;
  const fv = A2.createBiquadFilter(); fv.type = 'lowpass'; fv.frequency.value = 260;
  AMB.viento = A2.createGain(); AMB.viento.gain.value = .08;
  nv.connect(fv); fv.connect(AMB.viento); AMB.viento.connect(AMB.master); nv.start();
  const o1 = A2.createOscillator(); o1.frequency.value = 82;
  const o2 = A2.createOscillator(); o2.frequency.value = 165.5;
  const g2 = A2.createGain(); g2.gain.value = .35;
  AMB.pos = A2.createGain(); AMB.pos.gain.value = 0;
  o1.connect(AMB.pos); o2.connect(g2); g2.connect(AMB.pos);
  AMB.pos.connect(AMB.master); o1.start(); o2.start();
  const ne = A2.createBufferSource(); ne.buffer = buf; ne.loop = true;
  ne.playbackRate.value = 1.7;
  const fe = A2.createBiquadFilter(); fe.type = 'bandpass';
  fe.frequency.value = 2400; fe.Q.value = 2.2;
  AMB.noche = A2.createGain(); AMB.noche.gain.value = 0;
  ne.connect(fe); fe.connect(AMB.noche); AMB.noche.connect(AMB.master); ne.start();
}
/* blip de telemetría: dos a cuatro notas cuadradas cortas */
function blip(){
  const A2 = AMB.ctx; if (!A2) return;
  const nb = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < nb; i++){
    const o = A2.createOscillator(), g = A2.createGain();
    const t = A2.currentTime + i * .13;
    o.type = 'square';
    o.frequency.value = [880, 1175, 1320, 990][Math.floor(Math.random() * 4)];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.018, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .09);
    o.connect(g); g.connect(AMB.master); o.start(t); o.stop(t + .1);
  }
}
function ambTick(dt){
  if (!AMB.ctx || fase !== 'juego') return;
  AMB.viento.gain.value = .06 + .07 * Math.abs(Math.sin(t0 * .06)) +
    .04 * Math.max(0, Math.sin(t0 * .21));
  /* el hum vive alrededor del hábitat */
  const dh = Math.hypot(px - POI.habitat.x, pz - POI.habitat.z);
  AMB.pos.gain.value = cl(1 - dh / 42, 0, 1) * .28;
  const osc = cl(1 - (SOLD.y * 420) / 160, 0, 1);
  AMB.noche.gain.value = osc > .5 ? (osc - .5) * .16 : 0;
  AMB.tBlip -= dt;
  if (AMB.tBlip <= 0){ AMB.tBlip = 6 + Math.random() * 10; blip(); }
}
$('bSon').addEventListener('pointerdown', e => {
  e.preventDefault();
  AMB.on = !AMB.on;
  try { localStorage.setItem('marte_son', AMB.on ? '1' : '0'); } catch(e2){}
  if (AMB.master) AMB.master.gain.value = AMB.on ? 1 : 0;
  $('bSon').textContent = AMB.on ? '🔊' : '🔇';
});

/* ================================ JUGADOR ================================== */
const stats = { t: 0, dist: 0 };
let px = POI.inicio.x, pz = POI.inicio.z, yaw = 0, pitch = -.03;
let pvx = 0, pvz = 0, bobF = 0, corre = false;
const OJO = 1.7, VEL = 6.2, VEL_CORRE = 11.5;
const DED = { mov: null, mira: null };
let movV = { x: 0, y: 0 }, keyV = { x: 0, y: 0 }, keyL = { x: 0, y: 0 };
function fisica(dt){
  yaw -= keyL.x * 2.2 * dt;
  pitch = cl(pitch - keyL.y * 1.7 * dt, -1.2, 1.2);
  let mx = movV.x + keyV.x, my = movV.y + keyV.y;
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  const sp = corre ? VEL_CORRE : VEL;
  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  pvx = (-sy * -my + cy * mx) * sp;
  pvz = (-cy * -my - sy * mx) * sp;
  let nx = cl(px + pvx * dt, -MITAD + 6, MITAD - 6);
  let nz = cl(pz + pvz * dt, -MITAD + 6, MITAD - 6);
  /* a través de las rocas y las máquinas, no */
  for (const a of ARB){
    const dx = nx - a[0], dz = nz - a[1], d = Math.hypot(dx, dz), rq = a[2] + .5;
    if (d < rq && d > 1e-4){ nx = a[0] + dx / d * rq; nz = a[1] + dz / d * rq; }
  }
  stats.dist += Math.hypot(nx - px, nz - pz);
  px = nx; pz = nz;
  bobF += dt * (2 + 8 * Math.min(1, Math.hypot(pvx, pvz) / VEL));
  stats.t += dt;
}
function ponCam(){
  const v = Math.min(1, Math.hypot(pvx, pvz) / VEL);
  cam.position.set(px, H(px, pz) + OJO + Math.abs(Math.sin(bobF)) * .06 * v, pz);
  cam.rotation.y = yaw;
  cam.rotation.x = pitch + Math.sin(bobF * 2) * .004 * v;
  cam.fov = 72 + (corre ? 5 : 0);
  cam.updateProjectionMatrix();
}

const cv = $('gl');
cv.addEventListener('pointerdown', e => {
  if (fase !== 'juego' || enDlg) return;
  const x = e.clientX, y = e.clientY;
  if (x < innerWidth * .5 && !DED.mov) DED.mov = { id: e.pointerId, x0: x, y0: y };
  else if (!DED.mira) DED.mira = { id: e.pointerId, x, y };
});
cv.addEventListener('pointermove', e => {
  if (DED.mov && DED.mov.id === e.pointerId){
    const R = Math.max(34, innerHeight * .12);
    const dx = e.clientX - DED.mov.x0, dy = e.clientY - DED.mov.y0;
    const d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
    movV.x = dx * k / R; movV.y = dy * k / R;
  } else if (DED.mira && DED.mira.id === e.pointerId){
    yaw -= (e.clientX - DED.mira.x) * .005;
    pitch = cl(pitch - (e.clientY - DED.mira.y) * .005, -1.2, 1.2);

/* ------------------------ resolución adaptativa ---------------------------- */
/* som = lado del mapa de sombra (0 = sin sombras, para la gama baja) */
const GFXQ = { b: { dpr: .7, fogK: .78, som: 0 },
               m: { dpr: 1.15, fogK: 1, som: 1024 },
               a: { dpr: 2, fogK: 1.25, som: 2048 } };
let SOMBRAS = true;
const FOCO = { x: 0, z: 0 };
let GFX = 'm';
try { GFX = localStorage.getItem('marte_gfx') || 'm'; } catch(e){}
if (!GFXQ[GFX]) GFX = 'm';
let rs = 1, rsVotos = 0, tRS = 0, fps = 60;
function aplicaRS(){
  const dpr = Math.min(window.devicePixelRatio || 1, GFXQ[GFX].dpr);
  ren.setPixelRatio(dpr * rs);
  ren.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize', aplicaRS);
aplicaRS();
function rsTick(dt){
  tRS += dt;
  if (tRS < .8) return;
  tRS = 0;
  const quiere = fps < 34 ? -1 : (fps > 55 ? 1 : 0);
  if (quiere === 0 || (rsVotos !== 0 && Math.sign(rsVotos) !== quiere)){ rsVotos = 0; return; }
  rsVotos += quiere;
  if (Math.abs(rsVotos) < 2) return;
  rsVotos = 0;
  if (quiere < 0 && rs > .5){ rs = Math.max(.5, rs - .1); aplicaRS(); }
  else if (quiere > 0 && rs < 1){ rs = Math.min(1, rs + .08); aplicaRS(); }
}

/* ================================ BUCLE ==================================== */
let t0 = 0, tPrev = performance.now(), msAcum = 0, nCuadros = 0;
function bucle(t){
  requestAnimationFrame(bucle);
  const dt = Math.min(.05, (t - tPrev) / 1000) || .016;
  tPrev = t; t0 += dt;
  msAcum += dt; nCuadros++;
  if (msAcum > .5){ fps = fps * .3 + (nCuadros / msAcum) * .7; msAcum = 0; nCuadros = 0;
    $('fps').textContent = fps.toFixed(0) + ' fps · ' + (rs * 100 | 0) + '% · ' +
      ren.info.render.calls + ' dib · ' + (ren.info.render.triangles / 1000).toFixed(0) + 'k tri'; }
  if (fase === 'cine'){
    pasoCine(dt);
    pasoLuz(dt);
    npcTick(dt);
    MISION.tick(dt);
    FOCO.x = cam.position.x; FOCO.z = cam.position.z;
  } else if (fase !== 'juego'){
    /* MENÚ: el valle se ve DETRÁS, con una cámara que orbita despacio entre la
       cabaña y el lago (el pedido: que el fondo del menú sea el mapa) */
    const cx2 = (POI.habitat.x + POI.crater.x) / 2, cz2 = (POI.habitat.z + POI.crater.z) / 2;
    const a = t0 * .045;
    cam.position.set(cx2 + Math.cos(a) * 240, 64 + Math.sin(t0 * .1) * 10,
                     cz2 + Math.sin(a) * 240);
    cam.lookAt(cx2, 0, cz2);
    cam.fov = 62; cam.updateProjectionMatrix();
    pasoLuz(dt);
    FOCO.x = cx2; FOCO.z = cz2;
  } else if (fase === 'juego'){ FOCO.x = px; FOCO.z = pz; }
  /* el sol (y su caja de sombra) viajan con el foco de la cámara; con el sol
     casi acostado la sombra direccional se apaga (rayos horizontales barren
     el mapa entero y el resultado es puro artefacto, no una sombra) */
  sol.target.position.set(FOCO.x, 0, FOCO.z);
  sol.position.set(FOCO.x + SOLD.x * 420, SOLD.y * 420, FOCO.z + SOLD.z * 420);
  sol.castShadow = SOMBRAS && SOLD.y > .12;
  glare.position.set(cam.position.x + SOLD.x * 950, cam.position.y + SOLD.y * 950,
                     cam.position.z + SOLD.z * 950);
  glare.material.opacity = cl((sol.intensity - .6) / 1.6, 0, 1);
  if (fase === 'juego'){
    if (!enDlg) fisica(dt);
    pasoLuz(dt);
    pasoObjetivo();
    rsTick(dt);
    ambTick(dt);
    npcTick(dt);
    MISION.tick(dt);
    /* luciérnagas ondulando */
    if (luci.visible){
      const P = luci.geometry.attributes.position;
      for (let i = 0; i < P.count; i++){
        P.array[i*3+1] = luci0[i*3+1] + Math.sin(t0 * .9 + i * 1.7) * .5;
      }
      P.needsUpdate = true;
    }
  }
  cuerpoTick(dt);
  /* los PASOS suenan mientras caminás, más rápido al correr */
  if (AMB.pasoGain){
    const cam2 = fase === 'juego' ? Math.min(1, Math.hypot(pvx, pvz) / VEL) : 0;
    AMB.pasoGain.gain.value = cam2 * (corre ? .5 : .34);
    if (AMB.pasoSrc) AMB.pasoSrc.playbackRate.value = (MUNDO_AUDIO.pasoRate || 1.4) * (corre ? 1.5 : 1);
  }
  pasoTolvas(t0);
  if (beaconMat) beaconMat.opacity = .35 + .65 * (.5 + .5 * Math.sin(t0 * 3.6));
  /* las lunas y la Tierra solo viven de noche, pegadas al cielo de la cámara */
  const nocheK = cl(1 - (SOLD.y * 420) / 160, 0, 1);
  for (const lu of LUNAS){
    lu.position.set(cam.position.x + lu.userData.dir.x * 900,
      cam.position.y + lu.userData.dir.y * 900,
      cam.position.z + lu.userData.dir.z * 900);
    lu.material.opacity = nocheK * .9;
  }
  if (fase === 'juego') ponCam();
  ren.render(scene, cam);
}
requestAnimationFrame(bucle);

/* ================================ MENÚ ===================================== */
function entrar(desde){
  fase = 'juego';
  ambienteOn();
  cargarAudioReal();
  $('menu').style.display = 'none';
  $('hud').classList.add('on');
  try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (e) {}
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  if (desde === 0){
    px = POI.inicio.x; pz = POI.inicio.z; yaw = 0; pitch = -.03;   /* mirando al valle, no al borde */
    stats.t = 0; stats.dist = 0;
    ponCap(0, true);
    /* la CINE DE APERTURA: el mundo primero, el destino después, y la cámara
       baja hasta tus ojos. Al final, la primera página de la historia. */
    const o = POI[CAPS[0].obj], oy = H(o.x, o.z), py = H(px, pz);
    cinematica([
      { de: [o.x + 70, oy + 60, o.z + 90], a: [o.x - 34, oy + 22, o.z + 38],
        mira: [o.x, oy + 4, o.z], dur: 3.6, txt: Tx('sub') },
      { de: [px + 34, py + 34, pz + 64], a: [px, py + 2.4, pz + 7],
        mira: [px, py + 1.6, pz], dur: 3.4, txt: CAPS[0].objT }
    ], () => dialogo(Tx('introT'), Tx('intro'), null));
  } else {
    const sv = cargar();
    const c2 = sv ? sv.cap : 0;
    if (sv){ stats.t = sv.t || 0; stats.dist = sv.dist || 0; }
    const p = POI[CAPS[c2].obj === 'habitat' && c2 === 0 ? 'inicio' : CAPS[Math.max(0, c2 - 1)].obj];
    px = p.x + 8; pz = p.z + 8;
    ponCap(c2, true);
  }
}

document.querySelectorAll('#fLang .chip').forEach(ch =>

/* ---------- calidad gráfica: tope de resolución y alcance de la niebla ------ */
function setGfx(g){
  if (!GFXQ[g]) return;
  GFX = g;
  try { localStorage.setItem('marte_gfx', g); } catch(e){}
  document.querySelectorAll('#fGfx .chip').forEach(ch =>
    ch.classList.toggle('on', ch.dataset.g === GFX));
  rs = 1; aplicaRS();
  /* sombras por calidad: apagadas en BAJOS, 1k en MEDIOS, 2k en ALTOS.
     Cambiar el tamaño exige tirar el mapa viejo para que three lo recree. */
  const s = GFXQ[g].som;
  SOMBRAS = s > 0;
  if (s > 0 && sol.shadow.mapSize.x !== s){
    sol.shadow.mapSize.set(s, s);
    if (sol.shadow.map){ sol.shadow.map.dispose(); sol.shadow.map = null; }
  }
  luzDe = mezclaLuz(); luzA = LUZCAP[cap]; luzK = 0;   /* re-apunta la niebla */
}
document.querySelectorAll('#fGfx .chip').forEach(ch =>
  ch.addEventListener('pointerdown', e => { e.preventDefault(); setGfx(ch.dataset.g); }));

{
  const sv = cargar();

    $('mSeguir').style.display = 'block';

}

/* =========================== GANCHOS DE PRUEBA ============================= */
window.__S = {
  T, scene, ren, cam, POI, CAPS, H,
  get(){ return { fase, cap, enDlg, px: +px.toFixed(1), pz: +pz.toFixed(1),
    yaw: +yaw.toFixed(2), fps: +fps.toFixed(1), rs,
    dib: ren.info.render.calls, tri: ren.info.render.triangles,
    dist: Math.round(stats.dist), obj: CAPS[cap].obj,
    dObj: Math.round(Math.hypot(px - POI[CAPS[cap].obj].x, pz - POI[CAPS[cap].obj].z)),
    solY: +sol.position.y.toFixed(0), bg: +scene.backgroundIntensity.toFixed(2),
    luci: luci.visible, usar: $('bUsar').classList.contains('on'),
    save: (() => { try { return JSON.parse(localStorage.getItem('marte1') || 'null'); } catch(e){ return null; } })() };
  },
  entrar, tp(x, z){ px = x; pz = z; },
  lang(){ return LANG; }, setLang, gfx(){ return GFX; }, setGfx,
  amb(){ return AMB.ctx ? { estado: AMB.ctx.state, master: AMB.master.gain.value,
    viento: +AMB.viento.gain.value.toFixed(3), pos: +AMB.pos.gain.value.toFixed(3),
    noche: +AMB.noche.gain.value.toFixed(3) } : null; },
  pr(){ return ren.getPixelRatio(); },
  sombras(){ return { on: SOMBRAS, sol: sol.castShadow, mapa: sol.shadow.mapSize.x,
    tipo: ren.shadowMap.type, tone: ren.toneMapping, exp: +ren.toneMappingExposure.toFixed(2),
    terr: terrChunks[0].receiveShadow, solY: +SOLD.y.toFixed(2),
    foco: +focoCasa.intensity.toFixed(1) }; },
  sendaPts(){ return SENDA_PTS; }, arboles(){ return ARB; },
  partes(){ return window.__PARTES || 0; },
  paneles(){ return window.__PANELES || 0; },
  rover(){ return window.__ROVER || 0; },
  mira(y, p){ yaw = y; if (p != null) pitch = p; },
  dlgOk(){ if (enDlg) $('dlgGo').onclick(); },
  usar(){ usarAccion(); },
  cap(n){ ponCap(n, true); },
  corre(v){ corre = !!v; },
  cine(){ return { on: CINE.on, paso: CINE.i }; },
  cineSkip(){ terminaCine(); },
  npcs(){ return NPCS.map(x => ({ nombre: x.nombre, clave: x.clave || null,
    sigue: !!x.sigue, x: +x.fig.position.x.toFixed(1), z: +x.fig.position.z.toFixed(1) })); },
  items(){ return ITEMS.filter(i => i.activo).map(i => ({ x: +i.x.toFixed(1), z: +i.z.toFixed(1) })); },
  mision(){ return MISION.estado(); },
  med(){ return { on: MED.on, v: +MED.v.toFixed(3) }; },
  medSet(v){ medPon(v); },
  accion(){ const a = accionUsable(); return a ? a.tipo : null; },
  cuerpo(){ return { visible: CUERPO.root.visible, vm: CUERPO.vm.visible,
    pierna: +CUERPO.pD.rotation.x.toFixed(3), brazoY: +CUERPO.bD.position.y.toFixed(3) }; },
  audio(){ return { amb: !!AMB.ambReal, mus: !!AMB.musGain, paso: !!AMB.pasoGain,
    pasoVol: AMB.pasoGain ? +AMB.pasoGain.gain.value.toFixed(2) : null }; },
  modelos(){ let sk = 0, mx = MIXERS.length;
    scene.traverse(o => { if (o.isSkinnedMesh) sk++; });
    return { skinned: sk, mixers: mx, glb: !!GLTF,
      cargados: NPCS.filter(n => n.cargado).map(n => n.clave || n.nombre) }; },
  luzYa(){ luzK = .999; pasoLuz(1); },
  pix(){
    ren.render(scene, cam);
    const gl = ren.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const b = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b);
    const at = (fx, fy) => { const x = Math.floor(fx*(w-1)), y = Math.floor((1-fy)*(h-1));
      const i = (y*w + x)*4; return [b[i], b[i+1], b[i+2]]; };
    const set = new Set(); let neg = 0, n = 0;
    for (let i = 0; i < b.length; i += 4*41){
      set.add((b[i]>>4)+','+(b[i+1]>>4)+','+(b[i+2]>>4));
      if (b[i]+b[i+1]+b[i+2] < 14) neg++;
      n++;
    }
    return { w, h, colores: set.size, negro: +(neg/n).toFixed(3),
      arriba: at(.5,.08), centro: at(.5,.5), abajo: at(.5,.92) };
  }
};
