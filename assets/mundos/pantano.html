  $('objD').textContent = Math.round(d) + ' m';
  marca3d.position.set(p.x, H(p.x, p.z) + 6.5 + Math.sin(t0 * 2) * .5, p.z);
  marca3d.rotation.y = t0 * 1.4;
  marca3d.visible = !enDlg;
  const cerca = d < (C.usar ? 7 : 10);
  /* los capítulos automáticos también esperan a que la MISIÓN esté lista */
  /* el capitulo automatico NO se dispara dentro del traslado: el dialogo congela
     la fisica y te dejaria clavado a media mecanica, en el aire. Se dispara al
     salirte y llegar caminando, que es medio segundo despues. */
  if (!C.usar && cerca && !enDlg && !CANOA.modo && MISION.lista(cap)){
    llegaObjetivo();
    return;
  }
  const acc = accionUsable();
  $('bUsar').classList.toggle('on', !!acc && !enDlg);
  const av = CANOA.aviso(acc);
  $('aviso').textContent = av;
  $('aviso').classList.toggle('on', !!av && !enDlg);
  if (window.__autoUsar && acc && acc.tipo === 'cap' && !enDlg) llegaObjetivo();

/* ========================= JOYSTICK DIBUJADO =============================
   Se dibuja en un canvas propio (no en el del juego) para no tocar el render:
   solo se repinta cuando la palanca se mueve. El estilo lo pone cada mundo. */
const JOY = { el: $('joy'), cv: null, g: null, x: 0, y: 0, act: false, id: -1,
  aro: '#7fd6c8', pal: '#d6f5ee', glifo: '≋', trama: 'junco' };
JOY.cv = JOY.el.querySelector('canvas'); JOY.g = JOY.cv.getContext('2d');
function joyDibuja(){
  const g = JOY.g, N = 300, c = N / 2, R = N * .42;
  g.clearRect(0, 0, N, N);
  /* el aro: doble trazo con la trama del mundo por dentro */
  g.save();
  g.beginPath(); g.arc(c, c, R, 0, 6.2832);
  g.fillStyle = 'rgba(0,0,0,.34)'; g.fill();
  g.clip();
  joyTrama(g, N, c, R);
  g.restore();
  g.lineWidth = 6; g.strokeStyle = JOY.aro; g.globalAlpha = .78;
  g.beginPath(); g.arc(c, c, R, 0, 6.2832); g.stroke();
  g.lineWidth = 1.5; g.globalAlpha = .34;
  g.beginPath(); g.arc(c, c, R - 12, 0, 6.2832); g.stroke();
  g.globalAlpha = 1;
  /* la marca de AUTO-CORRER arriba: se prende cuando la palanca llega */
  const autoOn = JOY.act && -JOY.y > .80;
  g.save();
  g.globalAlpha = autoOn ? 1 : .3;
  g.strokeStyle = autoOn ? JOY.pal : JOY.aro; g.lineWidth = autoOn ? 7 : 4;
  g.beginPath(); g.arc(c, c, R - 3, -2.36, -0.78); g.stroke();
  g.restore();
  /* la palanca */
  const kx = c + JOY.x * (R - 34), ky = c + JOY.y * (R - 34), r = N * .155;
  g.beginPath(); g.arc(kx, ky + 4, r, 0, 6.2832);
  g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
  const grd = g.createRadialGradient(kx - r * .3, ky - r * .4, r * .1, kx, ky, r);
  grd.addColorStop(0, JOY.pal); grd.addColorStop(1, JOY.aro);
  g.beginPath(); g.arc(kx, ky, r, 0, 6.2832); g.fillStyle = grd; g.fill();
  g.lineWidth = 2.5; g.strokeStyle = 'rgba(0,0,0,.45)'; g.stroke();
  /* el glifo del mundo en la palanca */
  g.fillStyle = 'rgba(0,0,0,.55)'; g.font = '900 ' + Math.round(r * 1.05) + 'px system-ui';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(JOY.glifo, kx, ky + 1);
}
/* la TRAMA del fondo del aro: cada mundo tiene la suya */
function joyTrama(g, N, c, R){
  g.globalAlpha = .26; g.strokeStyle = JOY.aro; g.fillStyle = JOY.aro;
  const T = JOY.trama;
  if (T === 'arena' || T === 'viento'){                 /* rayas / rafagas */
    g.lineWidth = T === 'viento' ? 2 : 3.5;
    for (let i = -6; i <= 6; i++){
      g.beginPath();
      for (let k = 0; k <= 20; k++){
        const x = c - R + (k / 20) * R * 2;
        const y = c + i * 22 + Math.sin(k * .6 + i) * (T === 'viento' ? 9 : 4);
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  } else if (T === 'hoja'){                             /* nervaduras */
    g.lineWidth = 2.5;
    for (let i = 0; i < 9; i++){
      const a = i / 9 * 6.2832;
      g.beginPath(); g.moveTo(c, c);
      g.quadraticCurveTo(c + Math.cos(a) * R * .5 - Math.sin(a) * 26,
                         c + Math.sin(a) * R * .5 + Math.cos(a) * 26,
                         c + Math.cos(a) * R, c + Math.sin(a) * R);
      g.stroke();
    }
  } else if (T === 'lava'){                             /* grietas */
    g.lineWidth = 3;
    for (let i = 0; i < 7; i++){
      const a = i / 7 * 6.2832;
      g.beginPath(); g.moveTo(c, c);
      let x = c, y = c;
      for (let k = 0; k < 5; k++){
        x += Math.cos(a + Math.sin(k * 2.3 + i) * .7) * R / 5;
        y += Math.sin(a + Math.sin(k * 2.3 + i) * .7) * R / 5;
        g.lineTo(x, y);
      }
      g.stroke();
    }
  } else if (T === 'junco'){                            /* burbujas */
    for (let i = 0; i < 26; i++){
      const a = i * 2.399, rr = R * Math.sqrt(i / 26) * .93;
      g.beginPath(); g.arc(c + Math.cos(a) * rr, c + Math.sin(a) * rr,
        3 + (i % 4) * 2.2, 0, 6.2832); g.fill();
    }
  } else if (T === 'roca' || T === 'marmol'){           /* estratos / venas */
    g.lineWidth = T === 'marmol' ? 1.8 : 5;
    for (let i = -5; i <= 5; i++){
      g.beginPath();
      for (let k = 0; k <= 24; k++){
        const x = c - R + (k / 24) * R * 2;
        const y = c + i * 25 + (T === 'marmol'
          ? Math.sin(k * 1.1 + i * 2) * 14 : Math.sin(k * .35 + i) * 3);
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  } else {                                              /* anillos de tronco */
    g.lineWidth = 2.4;
    for (let i = 1; i <= 8; i++){
      g.beginPath();
      for (let k = 0; k <= 40; k++){
        const a = k / 40 * 6.2832, rr = R * i / 8.6 * (1 + Math.sin(a * 3 + i) * .06);
        const x = c + Math.cos(a) * rr, y = c + Math.sin(a) * rr;
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  }
  g.globalAlpha = 1;
}

{

const cv = $('gl');
cv.addEventListener('pointerdown', e => {

const GFXQ = { b: { dpr: .7, fogK: .78, som: 0 },
               m: { dpr: 1.15, fogK: 1, som: 1024 },

let rs = 1, rsVotos = 0, tRS = 0, fps = 60;
function aplicaRS(){
  const dpr = Math.min(window.devicePixelRatio || 1, GFXQ[GFX].dpr);
  ren.setPixelRatio(dpr * rs);
  ren.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;

function rsTick(dt){
  tRS += dt;
  if (tRS < .8) return;
  tRS = 0;
  const quiere = fps < 34 ? -1 : (fps > 55 ? 1 : 0);
  if (quiere === 0 || (rsVotos !== 0 && Math.sign(rsVotos) !== quiere)){ rsVotos = 0; return; }
  rsVotos += quiere;
  if (Math.abs(rsVotos) < 2) return;
  rsVotos = 0;
  if (quiere < 0 && rs > .5){ rs = Math.max(.5, rs - .1); aplicaRS(); }
  else if (quiere > 0 && rs < 1){ rs = Math.min(1, rs + .08); aplicaRS(); }
}

/* ================================ BUCLE ==================================== */
let t0 = 0, tPrev = performance.now(), msAcum = 0, nCuadros = 0;
function bucle(t){
  requestAnimationFrame(bucle);
  const dt = Math.min(.05, (t - tPrev) / 1000) || .016;
  tPrev = t; t0 += dt;
  msAcum += dt; nCuadros++;
  if (msAcum > .5){ fps = fps * .3 + (nCuadros / msAcum) * .7; msAcum = 0; nCuadros = 0;
    $('fps').textContent = fps.toFixed(0) + ' fps · ' + (rs * 100 | 0) + '% · ' +
      ren.info.render.calls + ' dib · ' + (ren.info.render.triangles / 1000).toFixed(0) + 'k tri' + ' · b' + BUILD; }
  if (fase === 'cine'){
    pasoCine(dt);
    pasoLuz(dt);
    npcTick(dt);
    MISION.tick(dt);
    RECOL.tick(dt);
    FOCO.x = cam.position.x; FOCO.z = cam.position.z;
  } else if (fase !== 'juego'){
    /* MENÚ: el valle se ve DETRÁS, con una cámara que orbita despacio entre la
       cabaña y el lago (el pedido: que el fondo del menú sea el mapa) */
    const cx2 = (POI.cruce.x + POI.altar.x) / 2, cz2 = (POI.cruce.z + POI.altar.z) / 2;
    const a = t0 * .038;
    cam.position.set(cx2 + Math.cos(a) * 132, 15 + Math.sin(t0 * .09) * 3.5,
                     cz2 + Math.sin(a) * 132);
    cam.lookAt(cx2, 54, cz2);            /* mirando arriba: entra la luna */
    cam.fov = 76; cam.updateProjectionMatrix();
    pasoLuz(dt);
    FOCO.x = cx2; FOCO.z = cz2;
  } else if (fase === 'juego'){ FOCO.x = px; FOCO.z = pz; }
  /* el sol (y su caja de sombra) viajan con el foco de la cámara; con el sol
     casi acostado la sombra direccional se apaga (rayos horizontales barren
     el mapa entero y el resultado es puro artefacto, no una sombra) */
  sol.target.position.set(FOCO.x, 0, FOCO.z);
  sol.position.set(FOCO.x + SOLD.x * 420, SOLD.y * 420, FOCO.z + SOLD.z * 420);
  sol.castShadow = SOMBRAS && SOLD.y > .12;
  glare.position.set(cam.position.x + SOLD.x * 950, cam.position.y + SOLD.y * 950,
                     cam.position.z + SOLD.z * 950);
  glare.material.opacity = cl((sol.intensity - .6) / 1.6, 0, 1);
  if (fase === 'juego'){
    dt0 = dt;
    if (!enDlg) fisica(dt);
    /* el espejo del agua: sigue al plano y se apaga de lejos o si no se ve */
    if (window.__ESPEJO) window.__ESPEJO.tick();
    pasoLuz(dt);
    pasoObjetivo();
    rsTick(dt);
    ambTick(dt);
    npcTick(dt);
    MISION.tick(dt);
    /* luciérnagas ondulando */
    if (luci.visible){
      const P = luci.geometry.attributes.position;
      for (let i = 0; i < P.count; i++){
        P.array[i*3+1] = luci0[i*3+1] + Math.sin(t0 * .9 + i * 1.7) * .5;
      }
      P.needsUpdate = true;
    }
  }
  cuerpoTick(dt);
  /* los PASOS suenan mientras caminás, más rápido al correr */
  if (AMB.pasoGain){
    const cam2 = fase === 'juego' ? Math.min(1, Math.hypot(pvx, pvz) / VEL) : 0;
    AMB.pasoGain.gain.value = cam2 * (corre ? .5 : .34);
    if (AMB.pasoSrc) AMB.pasoSrc.playbackRate.value = (MUNDO_AUDIO.pasoRate || 1.4) * (corre ? 1.5 : 1);
  }
  VIENTO.value = t0;
  AGUAU.value = t0;
  if (fase === 'juego') ponCam();
  ren.render(scene, cam);
}

    correr: CLIPS.correr && CLIPS.correr.name }; },
  /* pesos de las acciones de cada personaje, para ver si de verdad animan */
  npcAnim(){ return NPCS.filter(n => n.acc).map(n => ({ nombre: n.nombre,
    vel: +(n.vel || 0).toFixed(2),
    w: Object.keys(n.acc).map(k => k[0] + ':' + n.acc[k].getEffectiveWeight().toFixed(2)).join(' ') })); },
  npcs(){ return NPCS.map(x => ({ nombre: x.nombre, clave: x.clave || null,
    sigue: !!x.sigue, x: +x.fig.position.x.toFixed(1), z: +x.fig.position.z.toFixed(1) })); },
  items(){ return ITEMS.filter(i => i.activo).map(i => ({ x: +i.x.toFixed(1), z: +i.z.toFixed(1) })); },
  mision(){ return MISION.estado(); },
  faroles(){ return FAROLES.map(f => ({ x: +f.x.toFixed(1), z: +f.z.toFixed(1),
    on: f.prendido })); },
  luces(){ return LUCES.map(l => ({ i: +l.intensity.toFixed(1), d: l.distance,
    x: +l.position.x.toFixed(1), z: +l.position.z.toFixed(1) })); },
  prendeTodo(){ MISION.prendeTodo(); }, prendeN(n){ MISION.prendeN(n); },
  pasarela(){ return { tablones: window.__TABLONES || 0, largo: Math.round(SENDA_TOT),
    juncos: window.__JUNCOS || 0, nenufares: window.__NENUFARES || 0 }; },
  enPasarela(s){ return enPasarela(s); },
  niebla(){ return NIEBLA.length; },
  med(){ return { on: MED.on, v: +MED.v.toFixed(3) }; },
  /* qué está leyendo la física: sirve para saber por qué NO caminás */
  entrada(){ return { movV: { x: +movV.x.toFixed(3), y: +movV.y.toFixed(3) },
    keyV: { x: keyV.x, y: keyV.y }, corre, vel: corre ? VEL_CORRE : VEL,
    v: +Math.hypot(pvx, pvz).toFixed(2), dedo: !!DED.mov,
    dbg: { n: DBG.n, dt: +DBG.dt.toFixed(2), agua: DBG.agua, arb: DBG.arb } }; },
  medSet(v){ medPon(v); },
  accion(){ const a = accionUsable(); return a ? a.tipo : null; },
  cuerpo(){ return { visible: CUERPO.root.visible, vm: CUERPO.vm.visible,
    pierna: +CUERPO.pD.rotation.x.toFixed(3), brazoY: +CUERPO.bD.position.y.toFixed(3) }; },
  audio(){ return { amb: !!AMB.ambReal, mus: !!AMB.musGain, paso: !!AMB.pasoGain,
    pasoVol: AMB.pasoGain ? +AMB.pasoGain.gain.value.toFixed(2) : null }; },
  modelos(){ let sk = 0, mx = MIXERS.length;
    scene.traverse(o => { if (o.isSkinnedMesh) sk++; });
    return { skinned: sk, mixers: mx, glb: !!GLTF,
      cargados: NPCS.filter(n => n.cargado).map(n => n.clave || n.nombre) }; },
  cuerpoGLB(){ return CUERPO.glb ? { cargado: true, mixer: !!CUERPO.mixer,
    cabeza: !!CUERPO.headBone } : null; },
  luzYa(){ luzK = .999; pasoLuz(1); },
  pix(){
    ren.render(scene, cam);
    const gl = ren.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const b = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b);
    const at = (fx, fy) => { const x = Math.floor(fx*(w-1)), y = Math.floor((1-fy)*(h-1));
      const i = (y*w + x)*4; return [b[i], b[i+1], b[i+2]]; };
    const set = new Set(); let neg = 0, n = 0;
    for (let i = 0; i < b.length; i += 4*41){
      set.add((b[i]>>4)+','+(b[i+1]>>4)+','+(b[i+2]>>4));
      if (b[i]+b[i+1]+b[i+2] < 14) neg++;
      n++;
    }
    return { w, h, colores: set.size, negro: +(neg/n).toFixed(3),
      arriba: at(.5,.08), centro: at(.5,.5), abajo: at(.5,.92) };
  }
};
})().catch(e => {
  document.body.insertAdjacentHTML('beforeend',
    '<pre style="position:fixed;left:8px;top:8px;z-index:99;color:#f88;background:#000c;' +
    'padding:10px;max-width:92vw;white-space:pre-wrap">SE ROMPIÓ:\n' +
    ((e && (e.stack || e.message)) || e) + '</pre>');
  window.__SERR = '' + (e && (e.stack || e.message) || e);
});
</script>
