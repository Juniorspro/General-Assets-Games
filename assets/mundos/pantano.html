<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#060f13"/>
<title>PANTANO</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#060f13;color:#eaf4f4;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(6,16,20,.62);border:1px solid rgba(150,214,206,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#dff2ee}
  #objD{font-size:11.5px;color:#93bdb6;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#b8e6da;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  /* la columna de botones se corre para dejarle el rincon del pulgar derecho
     al SALTO, que antes la tapaba entera */
  /* ---------------------------- HUD DE ARRIBA -----------------------------
     MENU y SONIDO se tocan una vez cada tanto, no en medio de la accion: van
     ARRIBA a la derecha y CUADRADOS. Antes estaban abajo, alargados y apretados
     contra el boton de salto, o sea justo donde apoya el pulgar con el que se
     juega. */
  #btns{position:absolute;right:max(10px,2.5vw);top:max(10px,2.5vh);display:flex;
    flex-direction:row;gap:8px;align-items:flex-start;pointer-events:auto}
  .b{width:46px;height:46px;min-width:0;padding:0;display:grid;place-items:center;
    text-align:center;border-radius:12px;font-weight:800;font-size:16px;
    background:rgba(10,26,32,.62);border:1.5px solid rgba(150,214,206,.4);
    color:#dff2ee;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  /* USAR: REDONDO, abajo, al lado del salto. Dos motivos.
     Sitio: position FIXED y no absolute. #btns se subio arriba a la derecha y es
     absolute, asi que un hijo absolute dejaba de colgar de la pantalla y colgaba de
     EL: su "bottom" se medía desde la caja de arriba y el boton aparecia arriba.
     Forma: es el unico boton de accion que se toca en medio del juego, con el pulgar
     y sin mirar; una pastilla alargada al lado de un salto redondo se toca peor y se
     ve peor. Mismo diametro que el salto, a su izquierda. */
  .b.usar{position:fixed;right:calc(max(14px,3.5vw) + min(84px,19vw) + 12px);
    bottom:max(16px,5vh);width:min(72px,16vw);height:min(72px,16vw);
    aspect-ratio:1;border-radius:50%;padding:0;display:none;place-items:center;
    font-size:clamp(10px,2.6vw,13px);line-height:1.05;text-align:center;
    letter-spacing:.04em}
  .b.usar.on{display:grid}
  /* CORRER ya no es un boton: es un indicador chiquito al lado del contador */
  .b.corre{display:none}
  #corriendo{position:absolute;left:12px;top:calc(10px + 2.3em);pointer-events:none;
    display:none;font:800 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.14em;padding:5px 8px;border-radius:7px;
    background:rgba(10,26,32,.62);border:1px solid rgba(150,214,206,.4);color:#dff2ee}
  #corriendo.on{display:block}
  /* ------------------------ JOYSTICK Y SALTO (TACTIL) ---------------------
     Antes el medio izquierdo de la pantalla era una zona invisible de arrastre:
     nadie sabia donde tocar. Ahora hay una PALANCA dibujada, con el estilo del
     mundo, y un boton de SALTO. La palanca del todo hacia ARRIBA = correr. */
  #joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(150px,32vw);aspect-ratio:1;pointer-events:auto;touch-action:none;
    opacity:.9;transition:opacity .25s}
  /* La palanca y el salto se esconden SOLO si el aparato no tiene tactil.
     Antes se escondian al detectar mouse/teclado (body.pc), y en un portatil
     tactil o en un celular que se declara «pointer:fine» el jugador se quedaba
     sin ningun control: el joystick recien aparecia DESPUES del primer toque,
     y ese primer toque no hacia nada. La ayuda de teclado sigue saliendo
     igual: tener las dos cosas a la vez no molesta. */
  body.sinTactil #joy,body.sinTactil #bSalta{display:none}
  /* con dialogo abierto no se camina: la palanca y el salto estorban */
  /* con dialogo abierto los controles SE VAN de la pantalla, no solo se
     transparentan: quedaban encima del globo y tapaban el texto. */
  body.hablando #joy,body.hablando #bSalta{opacity:0;pointer-events:none;
    transform:translateY(140%);transition:opacity .18s,transform .22s}
  /* y el globo se apoya abajo, que es el lugar que quedo libre */
  body.hablando #dlg{bottom:max(10px,2vh)}
  /* el boton USAR tambien se aparta: pegado abajo a la derecha, se le ponia
     encima del globo y tapaba el final de cada linea */
  body.hablando .b.usar{opacity:0;pointer-events:none}
  #joy canvas{width:100%;height:100%;display:block}
  #bSalta{position:absolute;right:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(84px,19vw);aspect-ratio:1;border-radius:50%;pointer-events:auto;
    touch-action:none;display:grid;place-items:center;font-weight:900;
    font-size:11px;letter-spacing:.1em;cursor:pointer;
    background:rgba(0,0,0,.42);border:2px solid #7fd6c8;color:#d6f5ee;
    box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
  #bSalta:active{transform:translateY(2px) scale(.96);filter:brightness(1.35)}
  #bSalta span{display:block;font-size:24px;line-height:1}

  /* ---------------------- BARRA DE ARRIBA: PAUSA Y SONIDO -------------------
     Estaban abajo a la derecha, alargados y peleando lugar con el salto. Van
     ARRIBA y CUADRADOS, que es donde no molestan al pulgar ni al dialogo. */
  #hudTop{position:absolute;right:max(10px,2.5vw);top:max(10px,2vh);display:flex;
    gap:8px;pointer-events:auto;z-index:6}
  #hudTop .bt{width:44px;height:44px;border-radius:12px;display:grid;
    place-items:center;font-size:19px;line-height:1;cursor:pointer;
    background:rgba(0,0,0,.46);border:1.5px solid rgba(150,214,206,.35);color:#b8e6da;
    backdrop-filter:blur(4px)}
  #hudTop .bt:active{transform:translateY(1px);filter:brightness(1.35)}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  /* AVISO DEL TRASLADO: una linea corta, centrada, por encima del boton USAR y
     de la palanca para no tapar ni una cosa ni la otra. Es todo el tutorial que
     tiene el traslado: aparece cuando estas donde se usa y se va cuando no. */
  #aviso{position:fixed;left:50%;bottom:max(96px,20vh);transform:translateX(-50%);
    display:none;pointer-events:none;text-align:center;max-width:80vw;z-index:4;
    font:800 11.5px/1.35 ui-sans-serif,system-ui,sans-serif;letter-spacing:.07em;
    padding:7px 13px;border-radius:10px;background:rgba(12,22,18,.68);
    border:1px solid rgba(150,200,180,.34);color:#dcf2ea;backdrop-filter:blur(4px);
    text-shadow:0 1px 6px rgba(0,0,0,.7)}
  #aviso.on{display:block}
  body.hablando #aviso{display:none}
  @media (max-height:430px){ #aviso{bottom:max(84px,26vh);font-size:10.5px} }
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#cfe8e2;
    background:rgba(6,14,18,.5);border:1px solid rgba(150,214,206,.26);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  /* con la ayuda de PC en la esquina, el contador baja */
  body.pc #recol{top:calc(10px + 13em)}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(150,214,206,.16);border:1px solid rgba(150,214,206,.3);color:#dff2ee}
  /* ---------------------- DIALOGO: CHICO Y ABAJO -------------------------
     Antes el globo crecia con el texto y un capitulo de cinco parrafos ocupaba
     media pantalla en medio de la cara. Ahora el texto va PARTIDO EN PAGINAS y
     la caja tiene alto FIJO y chico, pegada abajo: no salta entre paginas y
     deja ver el paisaje, que es de lo que se trata. */
  #dlg{position:absolute;left:50%;bottom:max(12px,3vh);transform:translateX(-50%);
    width:min(720px,94vw);display:none;pointer-events:auto;align-items:flex-end;gap:0;z-index:5}
  #dlg.on{display:flex}
  #dlgFoto,#dlgCara{width:min(104px,17vw);aspect-ratio:3/4;flex:0 0 auto;
    border-radius:10px 10px 4px 4px;border:1.5px solid rgba(150,214,206,.35);background:rgba(6,14,18,.88);
    display:none;object-fit:cover;object-position:50% 10%;
    box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #dlgFoto.on,#dlgCara.on{display:block}
  #dlgGlobo{position:relative;flex:1 1 auto;min-width:0;margin-left:11px;
    background:rgba(6,14,18,.88);border:1.5px solid rgba(150,214,206,.35);border-radius:4px;
    padding:9px 13px 8px;backdrop-filter:blur(7px);
    box-shadow:0 8px 26px rgba(0,0,0,.5);display:flex;flex-direction:column}
  #dlgGlobo::before,#dlgGlobo::after{content:'';position:absolute;left:-10px;top:16px;
    width:0;height:0;border:10px solid transparent}
  #dlgGlobo::before{border-right-color:rgba(150,214,206,.35)}
  #dlgGlobo::after{left:-8px;border-right-color:rgba(6,14,18,.88)}
  #dlgT{font-weight:900;letter-spacing:.06em;color:#b8e6da;font-size:11.5px;margin-bottom:4px}
  /* ALTO FIJO: cuatro renglones. Lo que sobre queda en blanco, que es mejor que
     una caja que cambia de tamano en cada SIGUIENTE. */
  #dlgB{font-size:13.5px;line-height:1.42;color:#eaf4f4;white-space:pre-wrap;
    height:5.7em;overflow:hidden;flex:0 0 auto}
  #dlgPie{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  #dlgPag{font:800 10.5px ui-monospace,monospace;letter-spacing:.1em;color:#b8e6da;opacity:.65}
  #dlgGo{padding:7px 16px;border-radius:7px;font-weight:800;font-size:11.5px;
    letter-spacing:.08em;background:linear-gradient(180deg,#2b7f86,#134650);border:1px solid #a8e6dd;cursor:pointer;
    white-space:nowrap}
  @media (max-height:430px){
    #dlgB{height:4.3em;font-size:12.5px}
    #dlgFoto,#dlgCara{width:min(86px,15vw)}
  }
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#8fc3c7;
    background:rgba(6,14,18,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(150,214,206,.4);background:#0006}
  #dlgCara.on{display:block}

  /* contador de RECOLECCION: va debajo del objetivo, con su propio icono */
  #recol{position:absolute;left:12px;top:calc(10px + 4.6em);pointer-events:none;
    display:none;font:800 12.5px/1 ui-sans-serif,system-ui,sans-serif;
    padding:6px 9px;border-radius:9px;letter-spacing:.05em;
    background:rgba(0,0,0,.42);border:1px solid rgba(150,214,206,.35);color:#b8e6da;
    backdrop-filter:blur(4px)}
  #recol.on{display:block}
  #recol.lleno{border-color:#b8e6da;box-shadow:0 0 14px -2px #b8e6da}
  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#ffb35a,#ffe6bc)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(5,12,16,.16) 0%,rgba(5,12,16,.34) 55%,rgba(4,10,13,.72) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#eafcff,#5aa7a6);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#8fb0ad;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#dff2ee;
    background:rgba(16,36,44,.8);border:1.5px solid rgba(150,214,206,.4)}
  .mbtn.go{background:linear-gradient(180deg,#2b7f86,#134650);border-color:#a8e6dd}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#7fc4bd;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#8fb0ad;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(12,28,34,.72);border:1.5px solid rgba(150,214,206,.35);color:#bfdcd8}
  .chip.on{background:linear-gradient(180deg,#2b7f86,#134650);border-color:#a8e6dd;color:#f2ffe8}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#060f13;color:#8fb0ad;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="hudTop"><div class="bt" id="bSon">🔊</div><div class="bt" id="bMenu">☰</div></div>
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
    <div class="b" id="bMenu" aria-label="menu">II</div>
  </div>
  <div id="dlg"><img id="dlgFoto" alt=""><canvas id="dlgCara" width="192" height="256"></canvas><div id="dlgGlobo"><div id="dlgT"></div><div id="dlgB"></div><div id="dlgPie"><div id="dlgPag"></div><div id="dlgGo">SIGUIENTE &#9656;</div></div></div></div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
  <div id="bSalta"><span>⤒</span><b id="bSaltaT">SALTO</b></div>
  <div id="recol"></div>
  <div id="corriendo"></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="aviso"></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <h1>PANTANO</h1>
  <div class="sub">la ciénaga de vela · siete faroles antes del alba</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>
  <div class="fila" id="fLang">
    <div class="chip" data-l="es">ESPAÑOL</div>
    <div class="chip" data-l="en">ENGLISH</div>
    <div class="chip" data-l="pt">PORTUGUÊS</div>
  </div>
  <div class="filaT" id="tGfx">GRÁFICOS</div>
  <div class="fila" id="fGfx">
    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">ENCENDIENDO LA CIÉNAGA…</div>

<script>
/* ============================================================================
   PANTANO — modo historia en primera persona en una CIÉNAGA de noche
   (900×900 m), con gráficos de textura fotográfica: NADA lowpoly.

   EL MUNDO, y de dónde sale cada cosa (todo del repo o generado):
     · TERRENO CHATO Y ANEGADO: el ruido FBM apenas ondula (±4 m) y encima se
       cavan OCHO LAGUNAS de agua negra. El único camino de punta a punta es
       una franja de tierra angosta —la PASARELA— que se levanta a lo largo de
       la curva que une los puntos de la historia y que lleva los TABLONES
       encima. Fuera de la pasarela y de los islotes, es agua: no se cruza.
     · AGUA NEGRA CASI QUIETA que cubre el mapa entero (940×940): el oleaje de
       vértices baja a un tercio, metalness .96 y roughness .07 — así el
       REFLEJO DE LA LUNA (PMREM del cielo generado) se lee entero sobre el
       agua, con lenteja de agua verde lamiendo las orillas.
     · CIPRESES MUERTOS: tronco acampanado con corteza fotográfica y 5-7 ramas
       peladas, con MUSGO COLGANTE (tarjetas con alfa dibujadas al vuelo) en la
       punta de cada rama. Mecidos por el viento en el vertex shader, todo
       instanciado. Más juncos en la orilla, nenúfares en el agua, troncos
       hundidos, rocas y GLB del repo (troncos, tótems, cajones, árboles).
     · LUCIÉRNAGAS por todo el mapa y NIEBLA BAJA: sábanas suaves a un metro
       del agua que se re-acomodan alrededor de la cámara.
     · SIETE FAROLES sobre la pasarela: postes de madera con jaula, llama y
       PointLight. Se prenden de a uno (es la misión) y son lo único cálido.
     · CIELO equirectangular de luna llena generado, tone mapping ACES con la
       exposición abierta (1.55: de noche, si no, no se ve nada), niebla espesa
       y corta, sombras PCF de la LUNA (caja de ±70 m pegada al jugador).

   HISTORIA (6 capítulos, ES/EN/PT, guardada en localStorage):
     sos el farolero de la ciénaga. SIRA, una viajera, quedó varada en las
     pasarelas y el pantano apaga los faroles: hay que llevarla desde la

   MISIÓN PROPIA: los SIETE FAROLES de la pasarela (contador 🔥 x/7) más la

(async () => {

const LOC = Q.has('local');

const BUILD = 'PENDIENTE';
/* ASSETS: los de los mundos (cielo/audio/npc/prop de este juego), los del

const HASHR = '13923ee';
const RAIZ = LOC ? '/assets/'

const AR = f => RAIZ + f;                  /* raíz: cualquier GLB del repo     */
const TRE = LOC ? '/_vthree/build/three.module.js'
  : 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* importmap ANTES de cargar GLTFLoader (que importa 'three' por specifier).

{

const T = await import(TRE);

let GLTF = null;
try {

} catch (e) {}
/* Reflector para el REFLEJO REAL del agua: es una segunda pasada de render de la
   escena desde la camara espejada, o sea que devuelve TODO lo que hay y no solo
   la luz del cielo. Se resuelve igual que GLTFLoader (disco con ?local, CDN si
   no) y por el MISMO importmap, asi que su `import from "three"` cae en el modulo
   ya cargado y no baja three dos veces. Si no llega, el espejo queda en null y el
   agua se queda con el reflejo de cielo por PMREM que tenia: se degrada. */
let Reflector = null;
try {

    : 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/objects/Reflector.js';

} catch (e) {}
const ESPEJO_BAJOS = false;

const $ = i => document.getElementById(i);

/* ---------------- azar reproducible: la ciénaga es SIEMPRE la misma -------- */
let _s = 20260810;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- terreno: ruido de valor FBM, determinista ----------------
   El carácter de PANTANO es lo CHATO: el ruido grande da apenas ±4 m (contra
   los ±34 de senda) y todo el relieve que importa se talla a mano encima:
     · OCHO LAGUNAS de agua negra (cuencas anchas y hondas)
     · un ISLOTE de musgo en cada punto de la historia
     · la PASARELA: una franja de tierra de 7 m de sigma a lo largo de la curva
       que une los puntos, levantada a AGUA_Y+.95. Es lo ÚNICO caminable de
       punta a punta; el resto es agua y la física no la deja cruzar.
   ------------------------------------------------------------------------- */
const MAPA = 900, MITAD = MAPA / 2;
const AGUA_Y = -2.6;
function hash2(i, j){
  /* Math.imul, no `*`: en JS el producto de enteros grandes se hace float y
     PIERDE los bits bajos (>2^53) — el hash queda sesgado hacia abajo y el
     ruido casi nunca pasa de 0,36 (medido: el bosque quedaba en 83 árboles). */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260810;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* PUNTOS DE LA HISTORIA: la pasarela los une de sur a norte */
const POI = {
  inicio:  { x:  34, z: 392 },
  casilla: { x: -46, z: 244 },
  cruce:   { x: 128, z:  74 },
  cipres:  { x:-124, z: -54 },
  altar:   { x:  60, z:-214 },
  torre:   { x: -70, z:-358 }
};
/* LAGUNAS de agua negra: x, z, radio, hondura */
const LAG = [
  { x:-212, z: 156, r: 132, d: 5.6 }, { x: 214, z: 252, r: 122, d: 5.0 },
  { x: -34, z:  96, r: 148, d: 5.2 }, { x: 252, z: -86, r: 140, d: 6.0 },
  { x:-252, z:-186, r: 152, d: 5.8 }, { x:  46, z:-330, r: 128, d: 5.0 },
  { x:-158, z: 344, r: 112, d: 4.6 }, { x: 306, z:  24, r: 120, d: 5.2 },
  { x:-330, z:  20, r: 110, d: 4.8 }, { x: 180, z:-330, r: 118, d: 5.4 }
];
function alturaBase(x, z){
  let h = fbm(x * .0085 + 13, z * .0085 + 7) * 8 - 4.6;      /* ciénaga chata */
  h += fbm(x * .028 + 61, z * .028 + 29) * 2.4 - 1.1;        /* montículos     */
  for (const L of LAG){                                      /* las lagunas    */
    const dx = x - L.x, dz = z - L.z;
    h -= L.d * Math.exp(-(dx * dx + dz * dz) / (L.r * L.r));
  }
  for (const k in POI){                                      /* los islotes    */
    const p = POI[k], dx = x - p.x, dz = z - p.z;
    h += 3.8 * Math.exp(-(dx * dx + dz * dz) / (36 * 36));
  }
  /* LA PASARELA. Igual que el corredor seco de senda pero es la ESPINA del
     mundo: sin esto no hay juego, porque todo lo demás está bajo el agua. Se
     levanta a lo largo de la POLILÍNEA REAL (la curva que se dibuja), no de
     las rectas entre puntos, así los tablones caen justo encima. */
  for (const [a, b] of SECO){
    /* descarte barato por caja: la pasarela tiene 130 tramos y alturaBase se
       llama ~150.000 veces al armar el mundo (terreno + mapa de profundidad).
       Sin este if, el mundo tardaba segundos en aparecer. */
    if ((x < a.x - 26 && x < b.x - 26) || (x > a.x + 26 && x > b.x + 26) ||
        (z < a.z - 26 && z < b.z - 26) || (z > a.z + 26 && z > b.z + 26)) continue;
    const abx = b.x - a.x, abz = b.z - a.z;
    const t = Math.max(0, Math.min(1,
      ((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz || 1)));
    const ds = Math.hypot(x - (a.x + abx * t), z - (a.z + abz * t));
    const w = Math.exp(-(ds * ds) / (7.5 * 7.5));
    h = h * (1 - w) + Math.max(h, AGUA_Y + .95) * w;
  }
  return h;
}
function H(x, z){
  let h = alturaBase(x, z);
  /* allanar alrededor de cada punto de la historia (mezcla suave) */
  for (const k in POI){
    const p = POI[k];
    const d = Math.hypot(x - p.x, z - p.z);
    const w = Math.exp(-(d * d) / (24 * 24));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* EL AGUA CUBRE EL MAPA ENTERO: acá no hay "zona de lago" como en senda —
   todo lo que esté bajo la cota es ciénaga. El margen es chico (.22) a
   propósito: la pasarela queda 1,15 m sobre el agua y tiene que ser
   caminable de punta a punta. */
function enAgua(x, z, margenY){
  return H(x, z) < AGUA_Y + (margenY == null ? -.55 : margenY);
}
/* el margen por omisión es NEGATIVO a propósito: la física llama enAgua(nx,nz)
   sin margen y con .22 el jugador quedaba clavado en cuanto se salía un pelo de
   los tablones (medido: 0,9 m caminados en 4 s). Con -.55 podés VADEAR el bajío
   —te mojás las botas al costado de la pasarela— pero las lagunas siguen
   siendo infranqueables, que es de lo que vive el mundo. */
/* la PASARELA que une los puntos (el splat la pinta y la física la usa) */
const SENDA = [POI.inicio, POI.casilla, POI.cruce, POI.cipres, POI.altar, POI.torre];
/* EL CAMINO REAL ES CURVO: se muestrea UNA vez y esa polilínea manda en todo
   (splat, tierra seca, tablones, faroles y dónde no plantar). */
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 9.7, i * 3.1) - .5) * 78;
  const mz = (a.z + b.z) / 2 + (fbm(i * 4.3, i * 8.9) - .5) * 78;
  const seg = [];
  for (let k = 0; k <= 26; k++){
    const t = k / 26, u = 1 - t;
    const P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
/* TODOS los tramos van sobre el agua: todos se mantienen secos */
const SECO = [];
for (let si = 1; si < PTS_SEG.length; si++)
  for (let k = 1; k < PTS_SEG[si].length; k++)
    SECO.push([{ x: PTS_SEG[si][k-1][0], z: PTS_SEG[si][k-1][1] },
               { x: PTS_SEG[si][k][0],   z: PTS_SEG[si][k][1] }]);
for (const k in POI) POI[k].h = Math.max(alturaBase(POI[k].x, POI[k].z), AGUA_Y + 1.15);
/* largo acumulado de la pasarela, para repartir tablones y faroles por metro */
const SENDA_L = [0];
for (let i = 1; i < SENDA_PTS.length; i++)
  SENDA_L.push(SENDA_L[i-1] + Math.hypot(SENDA_PTS[i][0] - SENDA_PTS[i-1][0],
                                         SENDA_PTS[i][1] - SENDA_PTS[i-1][1]));
const SENDA_TOT = SENDA_L[SENDA_L.length - 1];
/* el punto de la pasarela más cercano a (x,z). Lo usan los NPC que te siguen:
   sin esto, la viajera cortaba las curvas por el agua y caminaba hundida. */
function cercaPasarela(x, z, radio){
  let bx = x, bz = z, bd = 1e9;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1], d = dx * dx + dz * dz;
    if (d < bd){ bd = d; bx = P[0]; bz = P[1]; }
  }
  bd = Math.sqrt(bd);
  const r = radio == null ? 2.6 : radio;
  if (bd <= r) return { x, z };
  const k = (bd - r) / bd;
  return { x: x + (bx - x) * k, z: z + (bz - z) * k };
}
/* punto (y dirección) de la pasarela a `s` metros del arranque */
function enPasarela(s){
  s = cl(s, 0, SENDA_TOT);
  let i = 1;
  while (i < SENDA_L.length - 1 && SENDA_L[i] < s) i++;
  const a = SENDA_PTS[i-1], b = SENDA_PTS[i];
  const l0 = SENDA_L[i-1], l1 = SENDA_L[i];
  const t = (s - l0) / Math.max(1e-4, l1 - l0);
  return { x: a[0] + (b[0] - a[0]) * t, z: a[1] + (b[1] - a[1]) * t,
           ang: Math.atan2(b[0] - a[0], b[1] - a[1]) };
}

/* ============================ CARGA DE TEXTURAS ============================
   Fotográficas: el barro de la ciénaga y el musgo son generados para este
   mundo (tex-pantano-1/2), la madera, la corteza y la roca son las del bosque
   de senda. Las de ALFA (musgo colgante, juncos, llama, bruma) se dibujan al
   vuelo en un canvas: son gratis y quedan mejor que recortar una foto. */
const cargaTex = (url, rep) => new Promise((res, rej) => {
  new T.TextureLoader().load(url, t => {
    t.colorSpace = T.SRGBColorSpace;
    if (rep){ t.wrapS = t.wrapT = T.RepeatWrapping; }
    t.anisotropy = 4;
    res(t);
  }, undefined, rej);
});
let TX = {};
try {
  const [barro, musgo, madera, corteza, roca, hojas, cielo] = await Promise.all([
    cargaTex(AX('tex-pantano-1.jpg'), 1), cargaTex(AX('tex-pantano-2.jpg'), 1),
    cargaTex(AS('madera.jpg'), 1), cargaTex(AS('corteza.jpg'), 1),
    cargaTex(AS('roca.jpg'), 1), cargaTex(AS('hojas2.png')),
    cargaTex(AX('cielo-pantano.jpg'))
  ]);
  TX = { barro, musgo, madera, corteza, roca, hojas, cielo };
  /* los cielos equirectangulares NECESITAN repetir en S o se ve la costura */
  TX.cielo.wrapS = T.RepeatWrapping;
} catch (e) {
  document.body.insertAdjacentHTML('beforeend',
    '<pre style="position:fixed;inset:8px;z-index:99;color:#f88;background:#000d;padding:10px">' +
    'NO CARGARON LAS TEXTURAS:\n' + e + '</pre>');
  return;
}
/* --- texturas dibujadas al vuelo (alfa): gratis y sin descarga ------------- */
const lienzo = (n, fn, rep) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  if (rep) t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
/* MUSGO COLGANTE (barbas de viejo): hilos verticales que cuelgan del borde de
   arriba, cada vez más ralos hacia abajo. Con alphaTest da el calado que hace
   que los cipreses se lean como cipreses de pantano y no como palos. */
TX.barbas = lienzo(256, (g, n) => {
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 150; i++){
    const x0 = rnd() * n, L = n * (.28 + rnd() * .68);
    const w = 1 + rnd() * 2.6;
    const v = 96 + rnd() * 58;
    g.strokeStyle = 'rgba(' + (v * .78 | 0) + ',' + (v * .95 | 0) + ',' + (v * .70 | 0) + ',.92)';
    g.lineWidth = w;
    g.beginPath(); g.moveTo(x0, 0);
    let x = x0;
    for (let y = 0; y < L; y += 9){ x += (rnd() - .5) * 5.5; g.lineTo(x, y); }
    g.stroke();
    if (rnd() < .35){                        /* alguna mata más tupida */
      g.beginPath(); g.moveTo(x0 + 3, 0);
      let x2 = x0 + 3;
      for (let y = 0; y < L * .7; y += 11){ x2 += (rnd() - .5) * 7; g.lineTo(x2, y); }
      g.stroke();
    }
  }
});
/* JUNCOS: matas de hojas finas que salen de abajo y se abren en abanico */
TX.juncos = lienzo(256, (g, n) => {
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 46; i++){
    const x0 = n * (.06 + rnd() * .88), L = n * (.52 + rnd() * .46);
    const incl = (rnd() - .5) * .8;
    const v = 60 + rnd() * 70;
    g.fillStyle = 'rgb(' + (v * .62 | 0) + ',' + (v * 1.02 | 0) + ',' + (v * .66 | 0) + ')';
    g.beginPath();
    g.moveTo(x0 - 2.4, n);
    g.quadraticCurveTo(x0 + incl * L * .5, n - L * .6, x0 + incl * L, n - L);
    g.quadraticCurveTo(x0 + incl * L * .5 + 3, n - L * .6, x0 + 2.4, n);
    g.fill();
    if (rnd() < .3){                          /* espiga marrón */
      g.fillStyle = '#5c4326';
      g.beginPath();
      g.ellipse(x0 + incl * L, n - L + 6, 3.4, 11, incl, 0, 6.29); g.fill();
    }
  }
});
/* LLAMA del farol: pincel radial cálido para el sprite aditivo */
TX.llama = lienzo(64, (g, n) => {
  const d = g.createRadialGradient(n/2, n/2, 0, n/2, n/2, n/2);
  d.addColorStop(0, 'rgba(255,246,214,1)');
  d.addColorStop(.18, 'rgba(255,206,124,.9)');
  d.addColorStop(.48, 'rgba(238,142,52,.32)');
  d.addColorStop(1, 'rgba(200,100,30,0)');
  g.fillStyle = d; g.fillRect(0, 0, n, n);
});
/* BRUMA: manchón suave y desparejo para las sábanas de niebla baja */
TX.bruma = lienzo(256, (g, n) => {
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 26; i++){
    const x = n * (.16 + rnd() * .68), y = n * (.16 + rnd() * .68);
    const r = n * (.12 + rnd() * .26);
    const d = g.createRadialGradient(x, y, 0, x, y, r);
    d.addColorStop(0, 'rgba(226,240,242,.30)');
    d.addColorStop(.55, 'rgba(206,226,230,.13)');
    d.addColorStop(1, 'rgba(200,220,226,0)');
    g.fillStyle = d;
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
});

/* ================================ ESCENA ===================================
   ES DE NOCHE: la exposición del tone mapping se abre a 1,55 (a 1,12 la
   ciénaga se veía negra), la luz direccional es la LUNA —fría, tenue, pero
   proyectando sombra de verdad— y el hemisferio aporta el azul del cielo. Lo
   único cálido del mundo son los faroles. */
const ren = new T.WebGLRenderer({ canvas: $('gl'), antialias: false,
  powerPreference: 'high-performance' });
ren.outputColorSpace = T.SRGBColorSpace;
ren.toneMapping = T.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.55;
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
TX.cielo.mapping = T.EquirectangularReflectionMapping;
scene.background = TX.cielo;
scene.backgroundIntensity = 1;
/* PMREM para el reflejo del agua. La mitad de ABAJO de la foto es casi negra
   (es el suelo desde donde se sacó) y cualquier onda con pendiente manda el
   reflejo ahí: franjas muertas. Se fabrica un entorno con la mitad de ARRIBA
   de la foto y un degradado de agua negra abajo — así la luna se refleja
   entera y el resto queda oscuro pero plausible. */
const pm = new T.PMREMGenerator(ren);
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.drawImage(TX.cielo.image, 0, 0, 1024, 512);
  const d = g.createLinearGradient(0, 256, 0, 512);
  d.addColorStop(0, 'rgba(54,72,78,1)');
  d.addColorStop(.18, 'rgba(20,32,36,1)');
  d.addColorStop(1, 'rgba(3,7,8,1)');
  g.fillStyle = d; g.fillRect(0, 256, 1024, 256);
  const envTex = new T.CanvasTexture(c);
  envTex.mapping = T.EquirectangularReflectionMapping;
  envTex.colorSpace = T.SRGBColorSpace;
  scene.environment = pm.fromEquirectangular(envTex).texture;
}
/* NIEBLA espesa y corta: en el pantano no se ve el otro lado de la laguna */
scene.fog = new T.Fog(new T.Color('#101f26'), 14, 300);
const cam = new T.PerspectiveCamera(72, 1, .1, 1200);
cam.rotation.order = 'YXZ';

/* LA LUNA: la dirección está calculada para caer EXACTAMENTE donde está la
   luna en la foto del cielo (u≈.67, v≈.72 → dir (.38,.63,.68)), así la luz,
   la sombra, el destello y el reflejo del agua coinciden con lo que se ve.
   Su caja de sombra (±70 m) viaja pegada al jugador: texel ~14 cm. */
const SOLD = new T.Vector3(.38, .63, .68).normalize();
const sol = new T.DirectionalLight(0xa9c6e6, 1.35);
sol.position.copy(SOLD).multiplyScalar(420);
{
  const sc = sol.shadow.camera;
  sc.left = sc.bottom = -70; sc.right = sc.top = 70;
  sc.near = 40; sc.far = 760;
  sol.shadow.mapSize.set(1024, 1024);

}

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = la franja de la pasarela (barro pisado y mojado bajo los tablones) ·
   G = manchas de musgo de los islotes. Se pinta UNA vez en un canvas de 512.
   Lo demás lo decide la ALTURA en el shader: cuanto más cerca del agua, más
   barro negro y más película de alga; arriba, musgo seco. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* musgo: manchas donde el ruido dice montículo */
  g.fillStyle = '#004200';
  for (let i = 0; i < 1100; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 5 + rnd() * 20;
    if (vnoise(x * .022 + 3, y * .022 + 9) < .5) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.284); g.fill();
  }
  g.filter = 'blur(6px)';
  g.drawImage(SPL, 0, 0);
  g.filter = 'none';
  /* la pasarela: R fuerte con borde difuso */
  for (const [w, c] of [[13, 'rgba(150,0,0,.55)'], [6, 'rgba(255,0,0,.9)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* los islotes de la historia: musgo pisado alrededor */
  for (const k in POI){
    g.fillStyle = 'rgba(0,90,0,.55)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 16, 0, 6.284); g.fill();
    g.fillStyle = 'rgba(150,0,0,.35)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 8, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Lambert con el SPLAT inyectado en map_fragment: mezcla barro / musgo / roca
   con TODO el pipeline de three gratis (recibe la sombra de la luna, pasa por
   ACES, comparte niebla y colorspace). Dos varyings: la PENDIENTE (roca) y la
   ALTURA sobre el agua (barro negro abajo, musgo arriba) — la malla no rota,
   así que la normal y la posición del objeto son las del mundo. */
const uniTerr = {
  tMusgo: { value: TX.musgo }, tRoca: { value: TX.roca },
  tSplat: { value: splTex }, repite: { value: MAPA / 5 }   /* parche de 5 m, no de 7 */
};
/* MeshSTANDARD, no Lambert: Lambert no tiene normalMap ni roughnessMap, y por
   eso los suelos se veian planos —peor que las texturas procedurales— aunque la
   foto de base fuera buena. Con Standard el relieve del normal agarra la luz del
   sol y el roughness decide donde brilla. El splat de cuatro capas no cambia: se
   inyecta en el mismo `map_fragment`, que existe igual en Standard. */
const matTerr = new T.MeshStandardMaterial({ map: TX.barro,
  roughness: .92, metalness: 0 });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  /* en BAJOS el suelo va a un solo tap: cuatro muestras a pantalla llena es
     relleno de pixeles, que es justo lo que mata a un telefono de gama baja. */
  if (GFX === 'b') sh.defines = Object.assign({}, sh.defines, { SUELO_BARATO: '' });
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;varying float vSeco;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vRocoso = smoothstep(.86, .62, normal.y);
      vSeco = smoothstep(${(AGUA_Y + .1).toFixed(2)}, ${(AGUA_Y + 3.4).toFixed(2)}, position.y);`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tMusgo, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;varying float vSeco;
      /* ------------------- SUELO SIN CUADRICULA -------------------------
         Con una sola muestra a escala fija el mismo parche se repite 128 veces
         ALINEADO y a media distancia se ven las bandas. Se mezclan DOS muestras
         a escalas que no son multiplos, una girada 90 grados, con una mascara
         de ruido suave: los dos patrones no coinciden en ningun punto. */
      float h21_(vec2 p){ return fract(sin(dot(p, vec2(41.31, 289.07))) * 43758.5453); }
      vec2 h22_(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)),
                                               dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
      float ruido_(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h21_(i), h21_(i + vec2(1.0, 0.0)), f.x),
                   mix(h21_(i + vec2(0.0, 1.0)), h21_(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      /* ---- teselado ESTOCASTICO: cada celda con su origen y su angulo ----
         Antes se cruzaban dos muestras alineadas a los ejes con una mascara de
         frecuencia 3 sobre 900 m: constante en pantalla, o sea una sola muestra
         alineada, o sea la rejilla. Aqui cada celda del parche se lee con un
         desplazamiento y un giro sacados de su propia posicion, y las cuatro
         vecinas se cruzan con pesos bilineales al cubo. Sin periodo no hay
         rejilla que encontrar. */
      vec3 sinGrilla_(sampler2D t, vec2 uv, vec2 uvw){
        vec2 cel = floor(uv), f = fract(uv);
        #if defined(SUELO_BARATO)
          /* un solo tap: la celda le da el giro y el origen. No borra el patron
             tan bien como cuatro, pero lo desalinea, que es lo que se ve. */
          vec2 h = h22_(cel);
          float a = h.x * 6.2831853;
          mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
          return texture2D(t, R * (uv - cel - 0.5) + h).rgb;
        #else
          vec3 acc = vec3(0.0);
          float ws = 0.0;
          for (int j = 0; j < 2; j++){
            for (int i = 0; i < 2; i++){
              vec2 c = cel + vec2(float(i), float(j));
              vec2 h = h22_(c);
              float a = h.x * 6.2831853;
              mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
              float w = (1.0 - abs(f.x - float(i))) * (1.0 - abs(f.y - float(j)));
              w = w * w * w;
              acc += texture2D(t, R * (uv - c) + h).rgb * w;
              ws += w;
            }
          }
          return acc / max(ws, 1e-4);
        #endif
      }`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = sinGrilla_(map, uvT, vMapUv);                  /* barro de ciénaga */
      float musgo = clamp(vSeco * .85 + spl.g * 1.4, 0., 1.);
      c = mix(c, sinGrilla_(tMusgo, uvT * 1.25, vMapUv + 0.41), musgo);
      c = mix(c, sinGrilla_(tRoca, uvT * .85, vMapUv + 0.77), vRocoso * .8);
      /* la luz del suelo varia de a manchones grandes: sin esto, incluso sin
         cuadricula, todo el terreno se lee con el mismo brillo */
      /* dos frecuencias: manchones grandes de luz Y variacion cercana. A 5,7 sobre
         el mapa entero era UN solo manchon y no rompia nada de lo que se ve. */
      c *= 0.86 + 0.20 * ruido_(vMapUv * 6.3) + 0.14 * ruido_(vMapUv * 71.0);
      /* película de alga y barro NEGRO en la lámina de agua */
      c *= mix(vec3(.46, .60, .50), vec3(1.), vSeco);
      /* la franja de la pasarela: barro pisado, más oscuro y mojado */
      c *= mix(1., .68, clamp(spl.r * 1.2, 0., 1.));
      diffuseColor.rgb *= c;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 32;                    /* 6x6 trozos de 32x32 celdas */
const terrChunks = [];
{
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL de la ciénaga, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;
    scene.add(m);
    terrChunks.push(m);
  }
}
/* CIERRE DEL HORIZONTE: la ciénaga no se termina, se pierde en la bruma. Una
   falda de agua negra hasta 1.150 m y un anillo bajo de cañaveral que tapa la
   franja oscura de la foto del cielo desde cualquier punto de vista. */
/* EL SUELO MAS BAJO DEL MUNDO. Se mide una vez, barriendo el mapa cada 12 m: unas
   5.000 llamadas a H, imperceptible al lado de las que cuesta el terreno. Hace
   falta porque la falda del horizonte estaba clavada en -10 y en varios mundos el
   suelo baja mas: los metros de abajo quedaban tapados por una chapa lisa. */
const SUELO_MIN = (() => {
  let m = 1e9;
  for (let x = -MITAD; x <= MITAD; x += 12)
    for (let z = -MITAD; z <= MITAD; z += 12){
      const h = H(x, z);
      if (h < m) m = h;
    }
  return m;
})();
{
  const f = new T.Mesh(new T.CircleGeometry(1150, 24),
    new T.MeshLambertMaterial({ color: 0x1e2c33 }));   /* color de NIEBLA, no de arena */
  f.rotation.x = -Math.PI / 2;
  /* DEBAJO DEL BARRO, no debajo del agua: estaba en AGUA_Y-0,35 = -2,95 y el suelo
     baja a -9,8, asi que a traves del agua translucida se veia la chapa de la falda
     en vez del fondo, y la hondura de la cienaga se leia plana. */
  f.position.y = Math.min(AGUA_Y - .35, SUELO_MIN - 8);
  f.frustumCulled = false;
  scene.add(f);
  const pared = new T.Mesh(new T.CylinderGeometry(1100, 700, 26, 24, 1, true),
    new T.MeshLambertMaterial({ color: 0x101f26, side: T.BackSide }));
  pared.position.y = 7 + Math.min(0, SUELO_MIN - 8 + 6);     /* base -6, borde +20 */
  pared.frustumCulled = false;
  scene.add(pared);
}
/* ------------------------------- EL AGUA NEGRA ------------------------------
   Acá el agua no es un lago: es EL MUNDO. Un plano de 940×940 a la cota AGUA_Y
   cubre el mapa entero y donde el terreno sube lo tapa la prueba de
   profundidad, así que las orillas las dibuja el propio agua.
   Es agua QUIETA de ciénaga: el oleaje de vértices baja a un tercio del de
   senda, metalness .96 y roughness .13 — lo justo para que el reflejo de la
   LUNA se estire en un camino de luz sobre el negro en vez de ser un punto.
   Encima, dos señales de pantano: barro verdoso en el bajío y LENTEJA DE AGUA
   (film de alga) lamiendo la orilla en vez de espuma blanca. */
const AGUA_TAM = 940;
const AGUAU = { value: 0 };
/* RUIDO AZULEJABLE: 3 octavas de ruido de valor con la retícula en módulo (los
   bordes empalman). Es lo que mata el "se ve programado": los senos puros hacen
   crestas RECTAS que se repiten. */
const RUIDO = (() => {
  const N2 = 256, c = document.createElement('canvas');
  c.width = c.height = N2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2);
  const val = (x, y, per) => {
    const i = Math.floor(x), j = Math.floor(y);
    const fx = x - i, fy = y - j;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
    const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
    return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
  };
  for (let y = 0; y < N2; y++) for (let x = 0; x < N2; x++){
    let v = 0, amp = .55, per = 8;
    for (let o = 0; o < 3; o++){ v += amp * val(x / N2 * per, y / N2 * per, per); amp *= .5; per *= 2; }
    const k = Math.round(cl(v, 0, 1) * 255), i4 = (y * N2 + x) * 4;
    img.data[i4] = img.data[i4+1] = img.data[i4+2] = k; img.data[i4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
})();
/* TEXTURA DE PROFUNDIDAD: cuánto terreno hay DEBAJO de cada punto del agua
   (256×256 sobre los 940×940). Con eso el shader hace lo que hace el agua real:
   clara y sucia en el bajío, negra en el hondo, alga lamiendo la orilla, y las
   olitas se aplanan al llegar a la costa. */
const PROF = (() => {
  const N2 = 256, c = document.createElement('canvas');
  c.width = c.height = N2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2);
  for (let j = 0; j < N2; j++) for (let i = 0; i < N2; i++){
    const x = (i / (N2 - 1) - .5) * AGUA_TAM;
    const z = (j / (N2 - 1) - .5) * AGUA_TAM;
    const d = cl((AGUA_Y - H(x, z)) / 6, 0, 1);        /* 0 = orilla, 1 = hondo */
    const k = Math.round(d * 255), i4 = (j * N2 + i) * 4;
    img.data[i4] = img.data[i4+1] = img.data[i4+2] = k; img.data[i4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
  return t;
})();
const aguaMat = new T.MeshStandardMaterial({ color: 0x0a1a1c, metalness: .96,
  roughness: .13, transparent: true, opacity: .975 });
aguaMat.envMapIntensity = .8;
aguaMat.onBeforeCompile = sh => {
  sh.uniforms.uT = AGUAU;
  sh.uniforms.tRuido = { value: RUIDO };
  sh.uniforms.tProf = { value: PROF };
  aguaMat.userData.sh = sh;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tProf;varying vec2 vWp;varying float vD;varying float vAlt;varying float vProf;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vWp = position.xy;
      vProf = texture2D(tProf, position.xy / ${AGUA_TAM.toFixed(1)} + 0.5).r;
      /* DOMINIO DEFORMADO: la posición se tuerce con dos senos lentos antes de
         calcular la ola, así las crestas serpentean en vez de ser rectas */
      vec2 pw = position.xy + vec2(sin(position.y*.019 + uT*.21),
                                   cos(position.x*.015 - uT*.17)) * 14.0;
      float hh = sin(pw.x*.048 + uT*.42)*.075
               + cos(pw.y*.041 - uT*.35)*.062
               + sin((pw.x + pw.y)*.086 + uT*.61)*.038
               + cos(pw.x*.017 - pw.y*.026 + uT*.19)*.055;
      hh *= smoothstep(0.0, 0.20, vProf);   /* la ola se aplana en el bajío */
      transformed.z += hh;
      vAlt = hh;
      vD = -(modelViewMatrix * vec4(transformed, 1.0)).z;`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tRuido;varying vec2 vWp;varying float vD;varying float vAlt;varying float vProf;')
    /* OJO CON EL ORDEN: color_fragment y roughnessmap corren ANTES que
       normal_fragment_begin. Todo el cálculo se hace acá y la normal sólo
       CONSUME el gradiente después. */
    .replace('#include <color_fragment>', `#include <color_fragment>
      float alga; vec2 aguaG; float n3;
      {
        float lejos = clamp(1.0 - vD / 320.0, .3, 1.0);
        vec2 uvA = vWp*.040 + vec2(uT*.009,  uT*.006);
        vec2 uvB = vWp*.17  + vec2(-uT*.015, uT*.012);
        vec2 uvC = vWp*.52  + vec2(uT*.022, -uT*.018);
        float e2 = .02;
        float n1  = texture2D(tRuido, uvA).r;
        float n2  = texture2D(tRuido, uvB).r;
        n3  = texture2D(tRuido, uvC).r;
        float gxA = texture2D(tRuido, uvA + vec2(e2, 0.)).r - n1;
        float gyA = texture2D(tRuido, uvA + vec2(0., e2)).r - n1;
        float gxB = texture2D(tRuido, uvB + vec2(e2, 0.)).r - n2;
        float gyB = texture2D(tRuido, uvB + vec2(0., e2)).r - n2;
        float gxC = texture2D(tRuido, uvC + vec2(e2, 0.)).r - n3;
        float gyC = texture2D(tRuido, uvC + vec2(0., e2)).r - n3;
        /* gradiente FLOJO: agua quieta. Con el gradiente de senda el reflejo
           de la luna se rompía en confeti y perdía el camino de luz. */
        aguaG = vec2(gxA*1.5 + gxB*1.9 + gxC*1.1,
                     gyA*1.5 + gyB*1.9 + gyC*1.1) * lejos;
        /* LENTEJA DE AGUA: motas de alga donde coinciden las dos capas chicas */
        alga = smoothstep(1.34, 1.66, n2*.95 + n3*.8) * smoothstep(.32, .62, n3) * lejos;
      }
      /* MASA: bajío de barro verdoso -> hondo negro */
      diffuseColor.rgb = mix(vec3(.085, .125, .095), diffuseColor.rgb,
                             smoothstep(0.0, 0.5, vProf));
      /* el film de alga LAME la orilla, ondulando con el ruido fino */
      float lame = smoothstep(.19, .04, vProf + sin(uT*.7 + vWp.x*.26 + vWp.y*.2)*.02);
      alga = max(alga, lame * (.5 + .5 * n3));
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.15, .26, .13), alga * .8);
      /* y el borde mismo se DESVANECE: nada de corte poligonal seco */
      diffuseColor.a *= smoothstep(0.0, 0.05, vProf);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, .92, alga);`)
    .replace('#include <normal_fragment_begin>', `#include <normal_fragment_begin>
      normal = normalize(normal + vec3(aguaG.x, aguaG.y, 0.0));`);
};
const agua = new T.Mesh(new T.PlaneGeometry(AGUA_TAM, AGUA_TAM, 132, 132), aguaMat);
agua.rotation.x = -Math.PI / 2;
agua.position.set(0, AGUA_Y, 0);
scene.add(agua);

/* ===================== EL ESPEJO DEL AGUA (tiempo real) =====================
   El plano tintado devuelve la luz del cielo (PMREM) pero no devuelve los
   arboles, ni lo construido, ni vos: se ve como una chapa de color. Este
   Reflector es una SEGUNDA PASADA DE RENDER de la escena desde la camara
   espejada, y por eso devuelve todo lo que hay, en tiempo real.

   Se paga con cinco reglas, porque esto corre en un telefono: resolucion topada
   (512/384/256 segun calidad y nunca mas), multisample 0 (el MSAA del reflejo se
   paga cuatro veces y debajo de los rizos no se nota), apagado si el agua no esta
   a la vista, apagado de lejos, y el plano del agua ENCIMA con menos opacidad —al
   0,93 que tenia, tapaba el espejo entero—.

   El plano del agua no se toca: el espejo va cuatro centimetros por debajo, asi
   que las olas, las causticas y el sombreador siguen igual que estaban. */
/* `lejos` no se usa aca: el agua es el mapa entero. Ver el tick. */
const ESPEJO = { m: null, lejos: 1e9, res: 384, on: false, opac: 0.58, sigue: true };
if (Reflector){
  /* 220 m y no el mapa entero: el espejo VIAJA con el jugador (ver el tick), y un
     plano de 940 m obliga al recorte del reflejo a trabajar sobre todo el mapa. */
  ESPEJO.m = new Reflector(new T.PlaneGeometry(220, 220), {
    textureWidth: 384, textureHeight: 384, multisample: 0,
    color: 0x9fb0ae, clipBias: .0035 });
  ESPEJO.m.rotation.x = -Math.PI / 2;
  ESPEJO.m.position.set(agua.position.x, agua.position.y - .04, agua.position.z);
  scene.add(ESPEJO.m);
  aguaMat.transparent = true;
  aguaMat.opacity = ESPEJO.opac;
  ESPEJO.on = true;
}
ESPEJO.calidad = g => {
  if (!ESPEJO.m) return;
  ESPEJO.res = g === 'b' ? 256 : (g === 'a' ? 512 : 384);
  ESPEJO.on = ESPEJO_BAJOS || g !== 'b';
  const rt = ESPEJO.m.getRenderTarget();
  if (rt.width !== ESPEJO.res) rt.setSize(ESPEJO.res, ESPEJO.res);
  aguaMat.opacity = ESPEJO.on ? ESPEJO.opac : .93;
};
ESPEJO.tick = () => {
  if (!ESPEJO.m) return;
  /* EL PARCHE SIGUE AL JUGADOR. En los otros mundos el agua es una laguna y
     apagar el espejo por distancia a su centro es lo correcto; aca el agua ES el
     mapa, y medido desde el cruce —a 148 m del centro— el espejo se apagaba con la
     cienaga a los pies. Se lo mueve debajo de vos y listo. */
  ESPEJO.m.position.set(px, agua.position.y - .04, pz);
  ESPEJO.m.visible = ESPEJO.on && agua.visible;
};
window.__ESPEJO = ESPEJO;

/* --------------------------- LOS CIPRESES MUERTOS ---------------------------
   El árbol del pantano no tiene copa: tiene TRONCO ACAMPANADO (la base de los
   cipreses que crecen en el agua), 5-7 ramas peladas y retorcidas, y MUSGO
   COLGANTE en la punta de cada rama. Todo instanciado: mil doscientos árboles
   en seis llamadas de dibujo. Se plantan también DENTRO del agua —así se lee
   el bosque ahogado— salvo en lo más hondo, donde no asomarían. */
/* fusión a mano de varias geometrías indexadas (sin dependencias) */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
/* ÁRBOL AHOGADO. Devuelve {lena, barbas}: dos geometrías fusionadas por
   silueta, que después van instanciadas (mil árboles = 2 llamadas por silueta). */
function geoArbolSeco(altura, nRamas, rBarba){
  const lena = [], barbas = [];
  const tr = new T.CylinderGeometry(.13, .46, altura, 6, 1, true);
  tr.translate(0, altura / 2, 0);
  lena.push(tr);
  const pie = new T.CylinderGeometry(.46, 1.05, 1.9, 6, 1, true);   /* campana */
  pie.translate(0, .95, 0);
  lena.push(pie);
  const puntas = [];
  for (let i = 0; i < nRamas; i++){
    const hFrac = .46 + .48 * (i / Math.max(1, nRamas - 1)) + rr(-.05, .05);
    const largo = altura * rr(.24, .40) * (1.2 - hFrac * .55);
    const inclina = rr(.85, 1.35);                /* casi horizontal: retorcido */
    const giro = i * 2.399 + rr(-.35, .35);       /* ángulo áureo: no se apilan */
    const g = new T.CylinderGeometry(.045, .12, largo, 4, 1, true);
    g.translate(0, largo / 2, 0);
    g.rotateZ(inclina); g.rotateY(giro);
    const y0 = altura * hFrac;
    g.translate(0, y0, 0);
    lena.push(g);
    const px2 = Math.cos(giro) * Math.sin(inclina) * largo;
    const pz2 = -Math.sin(giro) * Math.sin(inclina) * largo;
    const py2 = y0 + Math.cos(inclina) * largo;
    puntas.push([px2, py2, pz2]);
    /* una ramita que sigue subiendo desde la punta */
    if (rnd() < .7){
      const g2 = new T.CylinderGeometry(.03, .055, largo * .55, 4, 1, true);
      g2.translate(0, largo * .275, 0);
      g2.rotateZ(rr(-.5, .5)); g2.rotateY(giro + rr(-.6, .6));
      g2.translate(px2, py2, pz2);
      lena.push(g2);
    }
  }
  /* MUSGO: cortinas que cuelgan de la punta de cada rama (el borde de ARRIBA
     de la tarjeta es de donde nacen los hilos en la textura) */
  for (const [qx, qy, qz] of puntas){
    const n = 1 + (rnd() < .6 ? 1 : 0);
    for (let k = 0; k < n; k++){
      const w = rBarba * rr(.8, 1.5), h = rBarba * rr(1.5, 3.0);
      const g = new T.PlaneGeometry(w, h);
      g.translate(0, -h / 2, 0);
      g.rotateY(rr(0, 6.28));
      g.translate(qx + rr(-.5, .5), qy - .15, qz + rr(-.5, .5));
      barbas.push(g);
    }
  }
  return { lena: fusiona(lena), barbas: fusiona(barbas) };
}
/* VIENTO: las ramas, el musgo y los juncos se mecen en el vertex shader. La
   fase sale de la posición EN EL MUNDO (instanceMatrix), así cada mata va a su
   ritmo, y la amplitud crece con la altura. */
const VIENTO = { value: 0 };
function conViento(mat, fuerza){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uViento = {};
    Object.defineProperty(sh.uniforms.uViento, 'value',
      { get: () => VIENTO.value, set: () => {} });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uViento;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          #ifdef USE_INSTANCING
            vec4 wq = instanceMatrix * vec4(transformed, 1.0);
          #else
            vec4 wq = vec4(transformed, 1.0);
          #endif
          float sw = sin(uViento*1.3 + wq.x*.19 + wq.z*.15)
                   + .5*sin(uViento*2.2 + wq.z*.31 + wq.x*.06)
                   + .22*sin(uViento*4.7 + wq.x*1.1 + wq.y*.8);
          float amp = ${fuerza.toFixed(2)} * max(abs(transformed.y) - .5, 0.0) * .055;
          transformed.x += sw * amp;
          transformed.z += .6 * sw * amp;
        }`);
  };
  return mat;
}
const ARB = [];                                /* [x,z,r] choque */
/* ¿está el punto sobre la pasarela o encima de un punto de la historia? Lo usan
   los árboles, las rocas y los juncos: un tronco con colisión en el medio de la
   pasarela es una trampa invisible (y acá no hay por dónde rodearla). */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (Math.hypot(x - p.x, z - p.z) < 15) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function plantar(){
  /* GRILLA TEMBLADA en vez de tiros al azar: celda de 16 m con jitter de ±5
     garantiza separación mínima —nada de árboles amontonados— y el ruido decide
     la DENSIDAD por zona, así hay cañaverales cerrados y lagunas abiertas. */
  const pos1 = [], pos2 = [];
  const PASO_A = 16;
  const CTA = { tot: 0, dens: 0, hondo: 0, camino: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-5, 5), z = gz + rr(-5, 5);
    const dens = vnoise(x * .010 + 44, z * .010 + 18);
    if (dens < .30){ CTA.dens++; continue; }              /* laguna abierta */
    if (dens < .48 && rnd() > (dens - .30) * 5.5){ CTA.dens++; continue; }
    const y = H(x, z);
    if (y < AGUA_Y - 3.4){ CTA.hondo++; continue; }       /* muy hondo: no asoma */
    if (molesta(x, z, 8.5)){ CTA.camino++; continue; }
    CTA.ok++;
    (rnd() < .55 ? pos1 : pos2).push([x, y, z, rr(.7, 1.55)]);
    ARB.push([x, z, .75]);
  }
  const matTr = conViento(new T.MeshLambertMaterial({ map: TX.corteza, color: 0x8e8f80 }), .8);
  TX.corteza.repeat.set(1.5, 2.6);
  /* SEIS SILUETAS (3 por especie): si no, el pantano se ve estampado */
  const esp1v = [geoArbolSeco(13.5, 6, 1.7), geoArbolSeco(16.5, 7, 2.0), geoArbolSeco(10.5, 5, 1.5)];
  const esp2v = [geoArbolSeco(8.5, 5, 1.3), geoArbolSeco(11.5, 6, 1.6), geoArbolSeco(7.0, 4, 1.2)];
  const matB = conViento(new T.MeshLambertMaterial({ map: TX.barbas, alphaTest: .22,
    side: T.DoubleSide, color: 0xa8b49a, transparent: false }), 1.5);
  /* SOMBRA DEL MUSGO: el material de profundidad por defecto ignora el alfa y
     cada cortina sombrearía como un cartel SÓLIDO. */
  const dB = new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking,
    map: TX.barbas, alphaTest: .4, side: T.DoubleSide });
  const arma = (posiciones, esp) => {
    if (!posiciones.length) return;
    const iT = new T.InstancedMesh(esp.lena, matTr, posiciones.length);
    const iB = new T.InstancedMesh(esp.barbas, matB, posiciones.length);
    for (let i = 0; i < posiciones.length; i++){
      const [x, y, z, s] = posiciones[i];
      Q4.setFromEuler(E3.set(rr(-.05, .05), rr(0, 6.28), rr(-.05, .05)));
      M4.compose(V3.set(x, y - .35, z), Q4, new T.Vector3(s, s * rr(.85, 1.3), s));
      iT.setMatrixAt(i, M4); iB.setMatrixAt(i, M4);
    }
    iT.frustumCulled = iB.frustumCulled = false;
    iT.castShadow = iT.receiveShadow = true;
    iB.castShadow = true;
    iB.customDepthMaterial = dB;
    scene.add(iT); scene.add(iB);
  };
  for (let v = 0; v < 3; v++){
    arma(pos1.filter((_, i) => i % 3 === v), esp1v[v]);
    arma(pos2.filter((_, i) => i % 3 === v), esp2v[v]);
  }
  /* ------------------------------- JUNCOS -----------------------------------
     La franja de orilla (donde el terreno cruza la cota del agua) se llena de
     matas de juncos: es lo que hace que la ciénaga no tenga "bordes de plano"
     sino cañaveral. Cinco tarjetas cruzadas por mata, ancladas al piso. */
  const mata = (() => {
    const gs = [];
    for (let k = 0; k < 5; k++){
      const h = rr(1.5, 2.5), w = rr(1.1, 1.7);
      const g = new T.PlaneGeometry(w, h);
      g.translate(0, h / 2, 0);
      g.rotateY(k / 5 * 3.14 + rr(-.3, .3));
      g.translate(rr(-.35, .35), 0, rr(-.35, .35));
      gs.push(g);
    }
    return fusiona(gs);
  })();
  const matJ = conViento(new T.MeshLambertMaterial({ map: TX.juncos, alphaTest: .3,
    side: T.DoubleSide, color: 0x9aa87e }), 1.8);
  const jun = new T.InstancedMesh(mata, matJ, 2100);
  let pj = 0, itj = 0;
  while (pj < 2100 && itj < 90000){
    itj++;
    const x = rr(-MITAD + 8, MITAD - 8), z = rr(-MITAD + 8, MITAD - 8);
    const y = H(x, z);
    if (y > AGUA_Y + 1.5 || y < AGUA_Y - 1.2) continue;   /* sólo la orilla */
    if (molesta(x, z, 4.6)) continue;
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, y - .1, z), Q4,
      new T.Vector3(1, 1, 1).multiplyScalar(rr(.75, 1.6)));
    jun.setMatrixAt(pj, M4);
    pj++;
  }
  jun.count = pj;
  jun.frustumCulled = false;
  window.__JUNCOS = pj;
  scene.add(jun);
  /* ----------------------------- NENÚFARES ---------------------------------
     Discos verdes flotando en el agua, en corrillos: rompen el espejo negro y
     dan escala. Van 6 cm sobre la lámina para que no z-peleen. */
  const gN = new T.CircleGeometry(.62, 8);
  gN.rotateX(-Math.PI / 2);
  const nen = new T.InstancedMesh(gN, new T.MeshLambertMaterial({ color: 0x2b4a26,
    side: T.DoubleSide }), 900);
  let pn = 0, itn = 0;
  while (pn < 900 && itn < 40000){
    itn++;
    const cx = rr(-MITAD + 20, MITAD - 20), cz = rr(-MITAD + 20, MITAD - 20);
    if (H(cx, cz) > AGUA_Y - .6) continue;
    const n2 = 4 + Math.floor(rnd() * 9);                 /* corrillo */
    for (let k = 0; k < n2 && pn < 900; k++){
      const x = cx + rr(-7, 7), z = cz + rr(-7, 7);
      if (H(x, z) > AGUA_Y - .35) continue;
      Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
      M4.compose(V3.set(x, AGUA_Y + .06, z), Q4,
        new T.Vector3(1, 1, 1).multiplyScalar(rr(.55, 1.3)));
      nen.setMatrixAt(pn, M4);
      pn++;
    }
  }
  nen.count = pn;
  nen.frustumCulled = false;
  window.__NENUFARES = pn;
  scene.add(nen);
  /* --------------------------- TRONCOS HUNDIDOS ----------------------------
     Cilindros acostados que asoman a medias del agua: la silueta clásica del
     pantano (y de lejos parecen bichos, que es justo lo que se busca). */
  const gL = new T.CylinderGeometry(.32, .44, 7, 6, 1, true);
  gL.rotateZ(Math.PI / 2);
  const tro = new T.InstancedMesh(gL, new T.MeshLambertMaterial({ map: TX.corteza,
    color: 0x6f6f62 }), 130);
  let pl = 0, itl = 0;
  while (pl < 130 && itl < 20000){
    itl++;
    const x = rr(-MITAD + 12, MITAD - 12), z = rr(-MITAD + 12, MITAD - 12);
    const y = H(x, z);
    if (y > AGUA_Y - .2 || y < AGUA_Y - 2.6) continue;
    if (molesta(x, z, 5)) continue;
    Q4.setFromEuler(E3.set(rr(-.12, .12), rr(0, 6.28), rr(-.08, .08)));
    M4.compose(V3.set(x, AGUA_Y - rr(.05, .3), z), Q4,
      new T.Vector3(rr(.7, 1.4), rr(.7, 1.2), rr(.7, 1.2)));
    tro.setMatrixAt(pl, M4);
    pl++;
  }
  tro.count = pl;
  tro.frustumCulled = false;
  tro.castShadow = true;
  scene.add(tro);
  /* ------------------------------- ROCAS ------------------------------------
     Esfera deformada con ruido, ACHATADA y ENTERRADA un cuarto, sólo en suelo
     llano: si no, una punta queda en el aire. */
  const gr = new T.SphereGeometry(1, 9, 7);
  { const P = gr.attributes.position, UV = gr.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
      const k = .74 + .42 * vnoise(x * 1.9 + 9 + y * 1.1, z * 1.9 + 4);
      P.setXYZ(i, x * k, y * k * .55, z * k);
      UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
    }
    gr.computeVertexNormals(); }
  window.__ROCAS = [];
  const roq = new T.InstancedMesh(gr, new T.MeshLambertMaterial({ map: TX.roca,
    color: 0x7e8a86 }), 60);
  let nr = 0;
  for (let i = 0; i < 300 && nr < 60; i++){
    const x = rr(-MITAD + 10, MITAD - 10), z = rr(-MITAD + 10, MITAD - 10);
    if (molesta(x, z, 11)) continue;
    const y = H(x, z);
    if (y < AGUA_Y - 1.4) continue;
    const pend = Math.max(Math.abs(H(x + 2, z) - y), Math.abs(H(x, z + 2) - y));
    if (pend > 1.1) continue;
    const s = rr(.8, 2.6);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, y - s * .17, z), Q4, new T.Vector3(s, s, s));
    roq.setMatrixAt(nr, M4);
    if (s > 1.5) ARB.push([x, z, s * .7]);
    window.__ROCAS.push([x, z, +s.toFixed(2)]);
    nr++;
  }
  roq.count = nr;
  roq.frustumCulled = false;
  roq.castShadow = roq.receiveShadow = true;
  scene.add(roq);
}
plantar();

/* ============================ CARGA DE GLB DEL REPO ========================
   Los props se REUSAN del repo (troncos, tótems, cajones, árboles, carpa) y
   ninguno viene con la escala de este mundo. Así que no se confía en `esc`: se
   mide la caja del modelo y se lo lleva al ALTO pedido en metros. Además se le
   apaga el emissive y el specular del glTF (si no, salen BLANCOS) y se lo apoya
   en el terreno. Si un GLB no llega, no pasa nada: el mundo ya está lleno. */
function limpiaMat(m, tinte){
  m.traverse(n => {
    if (!n.isMesh) return;
    n.castShadow = true; n.receiveShadow = true; n.frustumCulled = false;
    const mm = n.material;
    if (!mm) return;
    /* algunos GLB salen BLANCOS: traen emissive y specular del glTF */
    if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
    if (mm.specularIntensity != null) mm.specularIntensity = 0;
    mm.metalness = 0;
    mm.envMapIntensity = .3;
    /* TINTE: estos modelos vienen de mundos con sol. Un arbolito verde manzana
       en una ciénaga de noche se ve como un error, así que se los apaga al
       tono del pantano (el material es compartido por todos los clones: se
       tiñe una sola vez). */
    if (mm.color && tinte) mm.color.multiply(new T.Color(tinte));
    else if (mm.color) mm.color.multiplyScalar(.55);
  });
}
function normaliza(m, alto){
  m.updateWorldMatrix(true, true);
  const c = new T.Box3().setFromObject(m);
  const h = Math.max(.001, c.max.y - c.min.y);
  const k = alto / h;
  m.scale.multiplyScalar(k);
  m.updateWorldMatrix(true, true);
  const c2 = new T.Box3().setFromObject(m);
  return c2.min.y;                         /* cuánto hay que subirlo para apoyarlo */
}
/* siembra n copias de un GLB donde `donde(i)` diga (o al azar por la ciénaga) */
function sembrarGLB(url, n, alto, donde, raiz, tinte){
  if (!GLTF) return;
  new GLTF().load(raiz ? AR(url) : AX(url), g => {
    const base = g.scene;
    limpiaMat(base, tinte);
    for (let i = 0; i < n; i++){
      const p = donde(i);
      if (!p) continue;
      const m = base.clone(true);
      m.scale.setScalar(1);
      const minY = normaliza(m, alto * (p.k || 1));
      m.rotation.y = p.giro != null ? p.giro : rr(0, 6.28);
      m.position.set(p.x, H(p.x, p.z) + (p.y || 0) - minY, p.z);
      scene.add(m);
      window.__PROPS = (window.__PROPS || 0) + 1;
    }
  }, undefined, () => {});
}
/* un punto al azar de la ciénaga que cumpla las condiciones pedidas */
function puntoLibre(minY, maxY, margen, intentos){
  for (let i = 0; i < (intentos || 300); i++){
    const x = rr(-MITAD + 14, MITAD - 14), z = rr(-MITAD + 14, MITAD - 14);
    const y = H(x, z);
    if (y < minY || y > maxY) continue;
    if (molesta(x, z, margen)) continue;
    return { x, z };
  }
  return null;
}

/* ============================== LA PASARELA ================================
   Los TABLONES: una caja instanciada cada 1,4 m a lo largo de la polilínea, con
   pilotes que bajan al agua y una baranda baja de un lado. El terreno debajo ya
   viene levantado por alturaBase, así que caminás sobre la tierra y los
   tablones son la piel: no hay física nueva y nunca te caés al agua. */
{
  const mM = new T.MeshLambertMaterial({ map: TX.madera, color: 0x9a9384 });
  const PASO = 1.4, N = Math.floor(SENDA_TOT / PASO);
  const gTab = new T.BoxGeometry(3.3, .22, 1.5);
  const gPil = new T.BoxGeometry(.26, 4.2, .26);
  const gBar = new T.BoxGeometry(.14, 1.0, .14);
  const gVig = new T.BoxGeometry(.12, .12, 4.4);
  const tab = new T.InstancedMesh(gTab, mM, N + 2);
  const pil = new T.InstancedMesh(gPil, mM, Math.ceil(N / 3) * 2 + 4);
  const bar = new T.InstancedMesh(gBar, mM, Math.ceil(N / 3) * 2 + 4);
  const vig = new T.InstancedMesh(gVig, mM, Math.ceil(N / 3) * 2 + 4);
  /* OJO: compose(pos, quat, esc) recibe REFERENCIAS. Si se le pasa el mismo
     Vector3 para la posición y para la escala (V3.set(...) dos veces en la
     misma llamada) la posición queda pisada por la escala y los mil tablones
     se apilan en (1,1,1). Por eso la escala es un vector aparte. */
  const UNO = new T.Vector3(1, 1, 1);
  let nt = 0, np = 0, nb = 0, nv = 0;
  for (let i = 0; i <= N; i++){
    const P = enPasarela(i * PASO);
    const y = H(P.x, P.z);
    Q4.setFromEuler(E3.set(0, P.ang, 0));
    M4.compose(V3.set(P.x, y + .13, P.z), Q4, UNO);
    tab.setMatrixAt(nt++, M4);
    if (i % 3 === 0){
      /* pilotes y baranda a los dos lados, sobre la perpendicular */
      const cx = Math.cos(P.ang), cz = -Math.sin(P.ang);
      for (const lado of [-1, 1]){
        const bx = P.x + cx * lado * 1.62, bz = P.z + cz * lado * 1.62;
        M4.compose(V3.set(bx, y - 1.5, bz), Q4, UNO);
        pil.setMatrixAt(np++, M4);
        M4.compose(V3.set(bx, y + .74, bz), Q4, UNO);
        bar.setMatrixAt(nb++, M4);
        M4.compose(V3.set(bx, y + 1.12, bz), Q4, UNO);
        vig.setMatrixAt(nv++, M4);
      }
    }
  }
  tab.count = nt; pil.count = np; bar.count = nb; vig.count = nv;

{

  ARB.push([p.x, p.z, 5.4]);

  sembrarGLB('hyper/p-crate.glb', 7, .95, i => {

   Apagados son una silueta más; encendidos vuelcan luz cálida sobre los

const FAROLES = [];
{

    const z = P.z - Math.sin(P.ang) * lado * 1.95;

    g.position.set(x, y, z);
    g.rotation.y = P.ang;
    const poste = new T.Mesh(new T.CylinderGeometry(.13, .17, 3.9, 7), mM);
    poste.position.y = 1.95; poste.castShadow = true; g.add(poste);

    brazo.position.set(0, 3.8, -lado * .5); brazo.castShadow = true; g.add(brazo);
    const jaula = new T.Mesh(new T.BoxGeometry(.44, .62, .44), mFe);
    jaula.position.set(0, 3.36, -lado * .95); g.add(jaula);
    const techo = new T.Mesh(new T.ConeGeometry(.36, .26, 4), mFe);

    sprite.position.copy(llama.position);
    sprite.visible = false;
    g.add(sprite);
    scene.add(g);
    ARB.push([x, z, .5]);
    FAROLES.push({ i, x, z, y, ly: y + 3.34, llama, sprite, prendido: false });
  }
}
/* ------------------------------- POZO DE LUCES ------------------------------
   Siete faroles + brasero + fanal + la ventana de la casilla son DIEZ luces
   puntuales, y three compila TODOS los materiales del mundo con ese número:
   cada fragmento del pantano paga las diez, encendidas o no. Así que los fuegos
   comparten CUATRO PointLight: cada cuadro se las lleva a los cuatro fuegos
   encendidos más "importantes" (distancia dividida por alcance, para que el
   fanal de la torre gane aunque esté lejos). Se ve igual y el shader baja de
   diez luces a cinco. */
const LUCES = [];
for (let i = 0; i < 4; i++){
  const l = new T.PointLight(0xffa348, 0, 34, 1.8);
  scene.add(l);
  LUCES.push(l);
}
const _cand = [];
function lucesTick(p1){
  _cand.length = 0;
  for (const F of FAROLES) if (F.prendido)
    _cand.push({ x: F.x, y: F.ly, z: F.z, c: 0xffa348, i: 36 * p1, d: 34 });
  if (BRASERO.on) _cand.push({ x: BRASERO.luz.position.x, y: BRASERO.luz.position.y,
    z: BRASERO.luz.position.z, c: 0xffa348, i: 52 * p1, d: 46 });
  if (FANAL.on) _cand.push({ x: FANAL.luz.position.x, y: FANAL.luz.position.y,
    z: FANAL.luz.position.z, c: 0xffb460, i: 190 * (.94 + .07 * p1), d: 120 });
  for (const c of _cand)
    c.peso = Math.hypot(cam.position.x - c.x, cam.position.z - c.z) / c.d;
  _cand.sort((a, b) => a.peso - b.peso);
  for (let k = 0; k < LUCES.length; k++){
    const l = LUCES[k], c = _cand[k];
    if (!c){ l.intensity = 0; continue; }
    l.position.set(c.x, c.y, c.z);
    l.color.setHex(c.c);
    l.distance = c.d;
    l.intensity = c.peso > 1.8 ? 0 : c.i;   /* fuera de alcance no aporta nada */
  }
}
