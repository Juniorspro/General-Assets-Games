/* ------------- LUCIÉRNAGAS: por toda la ciénaga, toda la noche ------------- */
let luci = null, luci0 = null;
{
  const NL = 760, P = new Float32Array(NL * 3), C = new Float32Array(NL * 3);
  const c = new T.Color();
  let n = 0;
  /* en enjambres: una nube de 20-30 bichos cada tanto, y una hilera fija a lo
     largo de la pasarela (es la que te guía cuando los faroles están apagados) */
  while (n < NL){
    const enPas = rnd() < .42;
    let cx, cz;
    if (enPas){ const P2 = enPasarela(rr(0, SENDA_TOT)); cx = P2.x; cz = P2.z; }
    else { cx = rr(-MITAD + 20, MITAD - 20); cz = rr(-MITAD + 20, MITAD - 20); }
    const k = 14 + Math.floor(rnd() * 16);
    for (let i = 0; i < k && n < NL; i++){
      const x = cx + rr(-13, 13), z = cz + rr(-13, 13);
      P[n*3] = x; P[n*3+1] = Math.max(H(x, z), AGUA_Y) + rr(.5, 4.2); P[n*3+2] = z;
      c.setHSL(.13 + rnd() * .08, .95, .62);
      C[n*3] = c.r; C[n*3+1] = c.g; C[n*3+2] = c.b;
      n++;
    }
  }
  luci0 = Float32Array.from(P);
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('color', new T.BufferAttribute(C, 3));
  const cn = document.createElement('canvas'); cn.width = cn.height = 32;
  const g2 = cn.getContext('2d');
  const d = g2.createRadialGradient(16,16,0,16,16,16);
  d.addColorStop(0,'rgba(255,255,255,1)'); d.addColorStop(1,'rgba(255,255,255,0)');
  g2.fillStyle = d; g2.fillRect(0,0,32,32);
  luci = new T.Points(g, new T.PointsMaterial({ size: .95, map: new T.CanvasTexture(cn),
    vertexColors: true, transparent: true, blending: T.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true }));
  luci.frustumCulled = false;
  luci.visible = true;
  scene.add(luci);
}

/* ---------------- NIEBLA BAJA: sábanas a un metro del agua -----------------
   Planos grandes con un manchón suave, sin escribir profundidad. No siguen a la
   cámara (se vería): están CLAVADOS a una grilla del mundo y cada cuadro se
   re-acomodan a la celda más cercana al jugador, así siempre hay bruma alrededor
   y nunca se la ve nacer. Se actualizan en pasoLuz(), que corre en las tres
   fases (menú, cinemática y juego). */
const NIEBLA = [];
{
  /* MeshBASIC (no Lambert: con Lambert la luna pegaba de lleno sobre un plano
     horizontal y las sábanas salían casi blancas) y NORMAL, no aditiva.
     OJO, ESTO YA SE ROMPIÓ UNA VEZ: son 22 sábanas HORIZONTALES de 130-210 m
     con DoubleSide, y desde la pasarela —a un metro del agua— se las ve casi
     DE CANTO, así que se pisan entre ellas por decenas. Sumando luz, esos
     solapamientos se acumulaban hasta saturar y la ciénaga entera quedaba de
     un turquesa fosforescente (medido: el píxel del centro en 97,208,243).
     Con blending NORMAL el resultado nunca pasa del color de la bruma, así que
     el agua sigue NEGRA y la niebla se lee como niebla. Bonus: 22 planos
     grandes traslúcidos sin acumular costaban caro (28 fps -> 47 fps). */
  const mat = new T.MeshBasicMaterial({ map: TX.bruma, color: 0x27373e,
    transparent: true, opacity: .32, depthWrite: false, side: T.DoubleSide,
    blending: T.NormalBlending });
  for (let i = 0; i < 22; i++){
    const m = new T.Mesh(new T.PlaneGeometry(rr(130, 210), rr(130, 210)), mat);
    m.rotation.order = 'YXZ';
    m.rotation.y = rr(0, 6.28);
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = 3;
    m.frustumCulled = false;
    m.userData = { ox: rr(-100, 100), oz: rr(-100, 100), y: AGUA_Y + rr(.5, 3.2),
                   f: rr(0, 6.28) };
    scene.add(m);
    NIEBLA.push(m);
  }
}
function nieblaTick(){
  const G = 200;
  for (const m of NIEBLA){
    const u = m.userData;
    m.position.x = Math.round((cam.position.x - u.ox) / G) * G + u.ox
                 + Math.sin(t0 * .04 + u.f) * 16;
    m.position.z = Math.round((cam.position.z - u.oz) / G) * G + u.oz
                 + Math.cos(t0 * .035 + u.f) * 16;
    m.position.y = u.y + Math.sin(t0 * .1 + u.f) * .25;
  }
}

if (!L[LANG]) LANG = 'en';
let CAPS = L[LANG].caps;
const Tx = k => L[LANG].ui[k];
/* LUZ POR CAPÍTULO. Acá NUNCA sale el sol: lo que se mueve es la LUNA (y con
   ella la sombra), el espesor de la niebla y la EXPOSICIÓN del tone mapping.
   Va de la luna baja del este, a la luna alta, a la niebla cerrada del medio
   de la noche, y termina en el gris del alba. Cada dirección mantiene la
   altura por encima de .12 para que la sombra direccional siga viva. */
const LUZCAP = [
  { sol: [.38, .63, .68],  solI: 1.35, bg: 1.0,  fog: '#101f26', fogFar: 300, hemiI: .62, exp: 1.55 },
  { sol: [.30, .72, .58],  solI: 1.50, bg: 1.05, fog: '#122430', fogFar: 320, hemiI: .66, exp: 1.50 },
  { sol: [.16, .80, .44],  solI: 1.10, bg: .88,  fog: '#17252c', fogFar: 215, hemiI: .58, exp: 1.62 },
  { sol: [-.14, .72, .28], solI: 1.00, bg: .72,  fog: '#0e1b21', fogFar: 250, hemiI: .50, exp: 1.68 },
  { sol: [-.42, .54, -.18],solI: 1.20, bg: .82,  fog: '#15202b', fogFar: 195, hemiI: .56, exp: 1.60 },
  { sol: [-.56, .36, -.42],solI: 1.70, bg: 1.15, fog: '#2c4048', fogFar: 340, hemiI: .95, exp: 1.34 }
];
let cap = 0, enDlg = false, fase = 'menu';
let luzDe = LUZCAP[0], luzA = LUZCAP[0], luzK = 1;
function guardar(){ try { localStorage.setItem('pantano1', JSON.stringify({ cap, t: stats.t, dist: stats.dist })); } catch(e){} }
function cargar(){ try { return JSON.parse(localStorage.getItem('pantano1') || 'null'); } catch(e){ return null; } }
function ponCap(n, silencio){
  cap = cl(n, 0, CAPS.length - 1);
  const C = CAPS[cap];
  $('objT').textContent = C.objT;
  luzDe = mezclaLuz(); luzA = LUZCAP[cap]; luzK = 0;
  luci.visible = true;                    /* en el pantano SIEMPRE hay bichos */
  MISION.alCap(cap);
  if (!silencio){
    $('capN').textContent = C.n;
    $('capT').textContent = C.t;
    $('capCard').classList.add('on');
    clearTimeout(ponCap._t);
    ponCap._t = setTimeout(() => $('capCard').classList.remove('on'), 3400);
    /* la CINEMÁTICA del capítulo: la cámara te muestra adónde vas */
    cineObjetivo(C);
  }
  guardar();
}
function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  /* la niebla baja se re-acomoda SIEMPRE (menú, cinemática y juego) */
  nieblaTick();
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN de la luna se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.55, eB = B2.exp != null ? B2.exp : 1.55;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* la ventana de la casilla arde toda la noche; en el alba baja un poco */
  if (ventanaMat){
    const noche = cl(1 - (cap >= 5 ? k : 0) * .45, 0, 1);
    ventanaMat.color.setRGB(noche, .75 * noche, .45 * noche);
    focoCasa.intensity = 58 * noche;
  }
}
/* el texto se PARTE EN PAGINAS por parrafo: antes entraba entero en un solo
   cuadro que ocupaba media pantalla en medio de la cara. Cada pagina se escribe
   letra por letra; SIGUIENTE completa si esta escribiendo, pasa de pagina si
   quedan, y recien cierra en la ultima. */
let _dlgTim = null, _dlgFull = '', _dlgPags = [], _dlgP = 0, _dlgCerrar = null;
function _dlgPinta(){
  const txt = _dlgPags[_dlgP] || '';
  if (_dlgTim) clearInterval(_dlgTim);
  _dlgFull = txt;
  let i = 0;
  $('dlgB').textContent = '';
  _dlgTim = setInterval(() => {
    i += 2;
    $('dlgB').textContent = _dlgFull.slice(0, i);
    if (i >= _dlgFull.length){ clearInterval(_dlgTim); _dlgTim = null; }
  }, 16);
  const hay = _dlgPags.length > 1;
  $('dlgPag').textContent = hay ? (_dlgP + 1) + '/' + _dlgPags.length : '';
  $('dlgGo').textContent = (_dlgP < _dlgPags.length - 1) ? Tx('dlgMas') : Tx('dlgGo');
}
function dialogo(titulo, cuerpo, alCerrar, cara, retrato){
  enDlg = true;
  $('dlgT').textContent = titulo;
  const img = $('dlgFoto'), cv = $('dlgCara');
  if (retrato){
    img.src = retrato; img.classList.add('on'); cv.classList.remove('on');
  } else if (cara){
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 192, 256);
    g.save(); g.translate(0, 24); cara(g, 192); g.restore();
    cv.classList.add('on'); img.classList.remove('on');
  } else { cv.classList.remove('on'); img.classList.remove('on'); }
  /* partir por parrafo; si un parrafo es larguisimo se corta por oracion */
  _dlgPags = [];
  for (const par of String(cuerpo).split(/\n\s*\n/)){
    const p = par.trim();
    if (!p) continue;
    if (p.length <= 185){ _dlgPags.push(p); continue; }
    let acc = '';
    for (const or of p.split(/(?<=[.!?»])\s+/)){
      if ((acc + ' ' + or).trim().length > 185 && acc){ _dlgPags.push(acc.trim()); acc = or; }
      else acc = (acc + ' ' + or).trim();
    }
    if (acc) _dlgPags.push(acc);
  }
  if (!_dlgPags.length) _dlgPags = [''];
  _dlgP = 0; _dlgCerrar = alCerrar || null;
  _dlgPinta();
  $('dlg').classList.add('on');
  document.body.classList.add('hablando');
  $('dlgGo').onclick = () => {
    if (_dlgTim){                                  /* escribiendo: completar */
      clearInterval(_dlgTim); _dlgTim = null;
      $('dlgB').textContent = _dlgFull;
      return;
    }
    if (_dlgP < _dlgPags.length - 1){ _dlgP++; _dlgPinta(); return; }
    $('dlg').classList.remove('on');
    document.body.classList.remove('hablando');
    enDlg = false;
    const f = _dlgCerrar; _dlgCerrar = null;
    if (f) f();
  };
}
function llegaObjetivo(){
  const C = CAPS[cap];
  dialogo(C.dT, C.d, () => {
    if (cap >= CAPS.length - 1){ finDeHistoria(); return; }
    ponCap(cap + 1);
  });
}
function finDeHistoria(){
  fase = 'fin';
  guardarFin();
  $('menu').style.display = 'flex';
  $('hud').classList.remove('on');
  $('mCap').textContent = Tx('completa')(Math.round(stats.dist), Math.round(stats.t / 60));
  $('mJugar').textContent = Tx('otra');
  $('mSeguir').style.display = 'none';
}
function guardarFin(){ try { localStorage.removeItem('pantano1'); } catch(e){} }

/* ================= AUDIO GENERADO (Higgsfield) ============================
   Ambiente + música + pasos, cargados SOBRE el sintetizado: cuando decodifican
   lo apagan; si una URL falla (offline o el navegador no decodifica AAC) el
   sintetizado sigue solo. En PANTANO el AMBIENTE generado SÍ se usa (es un
   coro de ranas y grillos, justo lo que hace falta) y se mezcla con las voces
   sintetizadas, que responden a dónde estás. */
const MUNDO_AUDIO = { amb: 'amb-pantano.m4a', mus: 'mus-pantano.m4a',
  paso: 'pasos-musgo.mp3', pasoRate: 1.15 };
/* CIELO fotográfico generado (equirectangular) */
const MUNDO_CIELO = 'cielo-pantano.jpg';
/* disposición del MENÚ: el título va a la izquierda, como en la portada */
const MUNDO_MENU = 'm-izq';
/* PROPS 3D del repo colocados en un POI: se apoyan en el terreno y pueden
   OCULTAR la estructura procedural (que pasa como grupo en `ocultar`). Si el
   GLB no llega, queda la procedural. */
/* ---------------------- propMuchos: un GLB, muchas copias ------------------
   Clona el modelo tantas veces como pida la lista, lo escala al ALTO que pide
   el mundo (los GLB del repo vienen cada uno con su tamaño) y lo apoya en el
   suelo. Un solo `load` para todas las copias: se paga la descarga una vez. */
function propMuchos(url, lista, o){
  if (!GLTF || !lista || !lista.length) return;
  o = o || {};
  new GLTF().load(AR(url), g => {
    const base = g.scene;
    base.traverse(n => { if (n.isMesh && n.material){
      const mm = n.material;
      /* varios GLB del repo salen BLANCOS: traen emissive del glTF y
         KHR_materials_specular. Se apagan los dos. */
      if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
      if ('specularIntensity' in mm) mm.specularIntensity = 0;
      if ('metalness' in mm) mm.metalness = 0;
      if ('envMapIntensity' in mm) mm.envMapIntensity = .4;
      if (o.tinte && mm.color) mm.color.multiplyScalar(o.tinte);
    } });
    base.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(base);
    const abajo = caja.min.y, alto = caja.max.y - caja.min.y || 1;
    for (const p of lista){
      const m = base.clone(true);
      const esc = (o.esc || 1) * (p[2] || 1) / alto * (o.altoObjetivo || alto);
      m.scale.setScalar(esc);
      m.rotation.set(o.rx || 0, p[3] != null ? p[3] : rr(0, 6.283), o.rz || 0);
      m.position.set(p[0], H(p[0], p[1]) - abajo * esc + (o.y || 0), p[1]);

      m.traverse(n => { if (n.isMesh){ n.castShadow = !!o.sombra; n.receiveShadow = true; } });
      scene.add(m);
      if (o.choque) ARB.push([p[0], p[1], o.choque]);
      window.__PROPS = (window.__PROPS || 0) + 1;
    }
  }, undefined, () => {});
}

/* ========================= CINEMÁTICAS =====================================
   Cámara sobre rieles: cada paso vuela de `de` a `a` mirando a `mira`, con
   subtítulo y letterbox. Se saltea con un toque. El sol (y su caja de sombra)
   siguen a la cámara mientras dura. */
const CINE = { on: false, i: 0, t: 0, pasos: null, fin: null };
const _cv1 = new T.Vector3(), _cv2 = new T.Vector3(), _cv3 = new T.Vector3();
function cinematica(pasos, fin){
  CINE.on = true; CINE.pasos = pasos; CINE.i = 0; CINE.t = 0; CINE.fin = fin || null;
  fase = 'cine';
  $('hud').classList.remove('on');
  document.body.classList.add('cine');
}
function terminaCine(){
  if (!CINE.on) return;
  CINE.on = false;
  document.body.classList.remove('cine');
  $('cineTxt').textContent = '';
  fase = 'juego';
  $('hud').classList.add('on');
  $('recol').classList.add('on'); RECOL.pinta();
  cam.fov = 72; cam.updateProjectionMatrix();
  if (CINE.fin){ const f = CINE.fin; CINE.fin = null; f(); }
}
function pasoCine(dt){
  const p = CINE.pasos[CINE.i];
  if (!p){ terminaCine(); return; }
  CINE.t = Math.min(1, CINE.t + dt / (p.dur || 3));
  const k = CINE.t * CINE.t * (3 - 2 * CINE.t);
  _cv1.set(p.de[0], p.de[1], p.de[2]);
  _cv2.set(p.a[0], p.a[1], p.a[2]);
  cam.position.lerpVectors(_cv1, _cv2, k);
  _cv3.set(p.mira[0], p.mira[1], p.mira[2]);
  cam.lookAt(_cv3);
  cam.fov = p.fov || 58; cam.updateProjectionMatrix();
  $('cineTxt').textContent = p.txt || '';
  if (CINE.t >= 1){ CINE.i++; CINE.t = 0;
    if (CINE.i >= CINE.pasos.length) terminaCine(); }
}
$('cineSkip').addEventListener('pointerdown', e => { e.preventDefault(); terminaCine(); });
/* la cine de CAPÍTULO: dos tomas que muestran adónde hay que ir */
function cineObjetivo(C){
  const o = POI[C.obj], oy = H(o.x, o.z), py = H(px, pz);
  const dx2 = o.x - px, dz2 = o.z - pz, dd = Math.hypot(dx2, dz2) || 1;
  const ux = dx2 / dd, uz = dz2 / dd;
  cinematica([
    { de: [px - ux * 7, py + 3.5, pz - uz * 7], a: [px + ux * 8, py + 15, pz + uz * 8],
      mira: [o.x, oy + 6, o.z], dur: 2.7, txt: C.n + ' · ' + C.t },
    { de: [o.x - ux * 44 + uz * 12, oy + 19, o.z - uz * 44 - ux * 12],
      a: [o.x - ux * 15, oy + 6, o.z - uz * 15],
      mira: [o.x, oy + 3.5, o.z], dur: 2.7, txt: C.objT }
  ]);
}

const MIXERS = [];
/* carga un personaje 3D generado y lo cuelga del Group del NPC, apagando la
   figura procedural; si falla, la procedural se queda. Reproduce su clip. */
/* ====================== BIBLIOTECA DE CLIPS PRESTADOS =====================
   Los personajes del repo salieron todos del mismo tipo de rig: comparten los
   NUEVE huesos estandar (Hips, Spine, LeftArm, RightArm, LeftForeArm,
   RightForeArm, LeftUpLeg, RightUpLeg, Head). El AnimationMixer de three ata
   las pistas de un clip POR NOMBRE DE NODO, asi que un clip de un modelo anda
   igual en otro. Por eso no hace falta generar animacion para cada personaje:
   se PRESTA la que ya existe en el repo.
     viajera.glb / dante.glb  ->  solo traen Idle (patinaban sin mover la pierna)
     hyper/char.glb           ->  Casual_Walk
     reliquia/hero.glb        ->  RunFast
     aero/hero-idle.glb       ->  Idle
   Se cargan los tres donantes UNA sola vez y se reparten a todos. */
const CLIPS = { quieto: null, andar: null, correr: null, listos: 0, cola: [] };
{
  /* reliquia/hero.glb y aero/hero-idle.glb piden KHR_draco_mesh_compression
     como extension REQUERIDA, asi que el GLTFLoader los rechaza enteros y no
     cargaban. DRACO comprime solo la GEOMETRIA: las pistas de animacion son
     accesores normales. Asi que se extrajeron a GLB de SOLO ANIMACION (sin
     mallas, sin skins, sin texturas): 39 y 85 KB, sin ninguna extension.
     Ver scratchpad/mundos/extrae_clip.py. */
  const DON = [['andar', AX('anim/andar.glb')], ['correr', AX('anim/correr.glb')],
               ['quieto', AX('anim/quieto2.glb')]   /* Idle, no Idle_02: el 02 es el de
                 MIRAR A LOS COSTADOS, que molesta y encima pelea con el de
                 caminar cada vez que se cambia de clip */];
  const fin = () => {
    CLIPS.listos++;
    if (CLIPS.listos < DON.length) return;
    /* los personajes que cargaron antes que la biblioteca esperan en la cola */
    for (const npc of CLIPS.cola.splice(0)) armarAcciones(npc);
  };
  for (const [k, u] of DON){
    if (!GLTF){ fin(); continue; }
    new GLTF().load(u, g => {
      if (g.animations && g.animations.length){
        CLIPS[k] = g.animations[0];
        /* la POSE DE REPOSO del donante: sin esto no se puede retargetear */
        CLIPS[k + 'Rest'] = reposoDe(g.scene);
      }
      fin();
    }, undefined, fin);
  }
}
/* ======================== RETARGET DE LOS CLIPS ===========================
   Los 11 personajes de per/*.glb no traen animacion y se les presta uno de los
   tres clips de anim/*.glb. Comparten los MISMOS 26 nombres de hueso, pero NO la
   pose de reposo: el rig sale ajustado a cada malla y los marcos de cada
   articulacion quedan girados de cualquier manera. Medido sobre los GLB, la
   rotacion local de reposo de Hips va de 2,4 grados en canon-cuerdas a 133,5 en
   volcan-obrero, y la de Spine02 de 6,0 a 133,5.

   POR QUE NO ALCANZA UNA CORRECCION FIJA POR HUESO (lo que habia antes)
   Se hacia  q_donante * inv(reposoDonante) * reposoDestino , o sea una constante
   por hueso. Eso puede acertar UN fotograma pero no todos: la rotacion local se
   compone en el marco del PADRE, y ese marco cambia en cada fotograma cuando el
   padre se mueve. Con las caderas a cien grados de diferencia una constante no
   puede ser correcta a la vez para el reposo y para el movimiento, y por eso el
   personaje quedaba derecho quieto pero encorvado al caminar.

   LO QUE SE HACE AHORA: espacio de MUNDO, que es donde "girar el brazo treinta
   grados hacia adelante" significa lo mismo en los dos rigs. Por hueso b y
   fotograma f:
       delta   = mundoAnimadoDonante(b) * inv(mundoReposoDonante(b))
       mundoDestino(b) = delta * mundoReposoDestino(b)
       localDestino(b) = inv(mundoDestino(padre)) * mundoDestino(b)
   El pase va de padre a hijo porque mundoDestino(padre) es el resultado YA
   corregido: ahi esta justamente la parte que una constante no puede reproducir.

   El cero del donante viaja dentro del propio GLB: mk_anim.py le dejo como pose
   de reposo de los nodos la POSE NEUTRA del clip (el promedio de sus fotogramas),
   asi que aca no hay que promediar nada. Eso importa porque los clips de la
   libreria vienen con un sesgo constante grande (Idle tiene la cadera 40 grados
   fuera de su bind, Run_02 la columna 27) y si se tomara ese sesgo como cero se
   le sumaria al personaje, que es la joroba que se veia.

   Costo: 26 huesos x ~70-127 fotogramas x 3 clips por personaje, una sola vez al
   cargarlo. Son unos pocos milisegundos y no toca el bucle de dibujado, asi que
   no depende de GFX. */
const _rtQ = new T.Quaternion(), _rtI = new T.Quaternion(),
      _rtD = new T.Quaternion(), _rtL = new T.Quaternion();
/* El rig de un GLB por NOMBRE de hueso: rotacion y posicion locales de reposo
   mas el nombre del PADRE. El padre hace falta porque el retarget pasa por
   mundo; la version anterior solo guardaba q y p y por eso no podia hacerlo. */
function reposoDe(raiz){
  const R = {};
  raiz.traverse(o => {
    if (!o.name || R[o.name] !== undefined) return;
    const pa = o.parent;
    R[o.name] = { q: o.quaternion.clone(), p: o.position.clone(),
                  padre: (pa && pa.name && R[pa.name]) ? pa.name : null };
  });
  return R;
}
/* rotaciones de mundo de la pose de reposo, mas el orden padre-antes-que-hijo */
function mundoDe(rig){
  const W = {}, orden = [];
  const sube = nom => {
    if (W[nom]) return W[nom];
    const h = rig[nom];
    W[nom] = (h.padre && rig[h.padre]) ? sube(h.padre).clone().multiply(h.q)
                                       : h.q.clone();
    orden.push(nom);
    return W[nom];
  };
  for (const nom in rig) sube(nom);
  return { W, orden };
}
function retargetClip(clip, rigDon, modelo){
  if (!clip || !rigDon) return clip;
  /* el reposo se lee UNA vez y se guarda: si un personaje ya tiene acciones
     sonando, sus huesos no estan en reposo y leerlos daria un cero falso */
  const rigDst = modelo.userData._rig || (modelo.userData._rig = reposoDe(modelo));
  const A = mundoDe(rigDon), B = mundoDe(rigDst);
  const c2 = clip.clone();
  const rot = {}, pos = [];
  for (const tr of c2.tracks){
    const i = tr.name.lastIndexOf('.');
    if (i < 0) continue;
    const nom = tr.name.slice(0, i), prop = tr.name.slice(i + 1);
    if (prop === 'quaternion' && rigDon[nom] && rigDst[nom]) rot[nom] = tr;
    else if (prop === 'position') pos.push([nom, tr]);
  }
  /* mk_anim.py deja todas las pistas con el MISMO reloj, asi que se recorre por
     indice de fotograma. Si alguna vez no fuera asi, mejor devolver el clip sin
     tocar que escribir cualquier cosa. */
  let nf = -1, mezcla = false;
  for (const n in rot){
    const c = rot[n].values.length / 4;
    if (nf < 0) nf = c; else if (c !== nf) mezcla = true;
  }
  if (nf <= 0 || mezcla) return c2;

  const orden = A.orden.filter(n => rigDst[n]);
  const Wd = {}, Wt = {}, prev = {};
  for (const n of orden){ Wd[n] = new T.Quaternion(); Wt[n] = new T.Quaternion(); }
  for (let f = 0; f < nf; f++){
    // 1) pose del donante, de local a mundo
    for (const n of orden){
      const tr = rot[n];
      if (tr){ const k = f * 4;
        _rtQ.set(tr.values[k], tr.values[k+1], tr.values[k+2], tr.values[k+3]); }
      else _rtQ.copy(rigDon[n].q);
      const pa = rigDon[n].padre;
      if (pa && Wd[pa]) Wd[n].copy(Wd[pa]).multiply(_rtQ); else Wd[n].copy(_rtQ);
    }
    // 2) el giro de mundo del donante, aplicado al reposo del destino
    for (const n of orden){
      if (rot[n]){
        _rtD.copy(Wd[n]).multiply(_rtI.copy(A.W[n]).invert());
        Wt[n].copy(_rtD).multiply(B.W[n]);
      } else {
        const pa = rigDst[n].padre;
        if (pa && Wt[pa]) Wt[n].copy(Wt[pa]).multiply(rigDst[n].q);
        else Wt[n].copy(B.W[n]);
      }
    }
    // 3) de vuelta a local, que es lo que consume el AnimationMixer
    for (const n of orden){
      const tr = rot[n]; if (!tr) continue;
      const pa = rigDst[n].padre;
      if (pa && Wt[pa]) _rtL.copy(_rtI.copy(Wt[pa]).invert()).multiply(Wt[n]);
      else _rtL.copy(Wt[n]);
      /* continuidad de signo: dos cuaterniones opuestos son la misma rotacion
         pero interpolados dan la vuelta larga, y se ve un tironeo */
      const p = prev[n];
      if (p && (p[0]*_rtL.x + p[1]*_rtL.y + p[2]*_rtL.z + p[3]*_rtL.w) < 0){
        _rtL.set(-_rtL.x, -_rtL.y, -_rtL.z, -_rtL.w);
      }
      const k = f * 4;
      tr.values[k] = _rtL.x; tr.values[k+1] = _rtL.y;
      tr.values[k+2] = _rtL.z; tr.values[k+3] = _rtL.w;
      prev[n] = [_rtL.x, _rtL.y, _rtL.z, _rtL.w];
    }
  }
  /* Solo la cadera trae traslacion: mk_anim.py tiro las otras 23, que eran
     constantes y llevaban los LARGOS DE HUESO del donante (aplicadas al
     personaje le pisaban sus proporciones y le estiraban la malla). Va en delta
     y escalada por la relacion de alturas de cadera, si no un personaje bajo
     flota y uno alto se hunde. */
  for (const par of pos){
    const h = rigDon[par[0]], hd = rigDst[par[0]];
    if (!h || !hd) continue;
    const tr = par[1], k = h.p.y ? (hd.p.y / h.p.y) : 1;
    for (let i = 0; i < tr.values.length; i += 3){
      tr.values[i]     = hd.p.x + (tr.values[i]     - h.p.x) * k;
      tr.values[i + 1] = hd.p.y + (tr.values[i + 1] - h.p.y) * k;
      tr.values[i + 2] = hd.p.z + (tr.values[i + 2] - h.p.z) * k;
    }
  }
  return c2;
}
/* le arma a un personaje las tres acciones, con lo propio primero y lo prestado
   despues: si el GLB ya trae un clip de caminar, ese gana. */function armarAcciones(npc){
  const m = npc.modelo;
  if (!m) return;
  if (CLIPS.listos < 3){ if (CLIPS.cola.indexOf(npc) < 0) CLIPS.cola.push(npc); return; }
  const propios = npc.clipsPropios || [];
  const buscar = rx => propios.find(c => rx.test(c.name || '')) || null;
  /* lo PROPIO ya viene en su propio reposo: no se toca. Lo PRESTADO se
     retargetea al reposo de este modelo. */
  const pQuieto = buscar(/idle|quiet/i), pAndar = buscar(/walk|camin/i),
        pCorrer = buscar(/run|corr/i);
  const cQuieto = pQuieto || retargetClip(CLIPS.quieto, CLIPS.quietoRest, m);
  const cAndar  = pAndar  || retargetClip(CLIPS.andar,  CLIPS.andarRest,  m);
  const cCorrer = pCorrer || retargetClip(CLIPS.correr, CLIPS.correrRest, m) || cAndar;
  if (!cQuieto && !cAndar) return;
  /* Sin HUESOS no se ata nada. El perro es una sola pieza: se le ataban las tres
     acciones igual, npc.acc quedaba definido, y el balanceo a mano —lo unico que
     puede moverlo— no corria nunca porque su condicion es justamente !npc.acc.
     Estaba congelado desde el primer dia. */
  let _hue = false;
  m.traverse(o => { if (o.isBone) _hue = true; });
  if (!_hue) return;
  const mix = npc.mixer || new T.AnimationMixer(m);
  if (!npc.mixer){ npc.mixer = mix; MIXERS.push(mix); }
  const A = npc.acc = {};
  for (const par of [['quieto', cQuieto], ['andar', cAndar], ['correr', cCorrer]]){
    if (!par[1]) continue;
    let a;
    try { a = mix.clipAction(par[1]); } catch(e){ continue; }
    a.enabled = true;
    a.setEffectiveWeight(par[0] === 'quieto' ? 1 : 0);
    a.play();
    /* desfase propio: sin esto los seis personajes de un mundo respiran y giran
       la cabeza en el mismo fotograma, y se ve a un coro, no a gente */
    a.time = Math.random() * (a.getClip().duration || 1);
    A[par[0]] = a;
  }
  npc.estAnim = 'quieto';
}
/* la MEZCLA: los pesos siguen a la velocidad de verdad del personaje, asi que
   nadie patina ni corre en el lugar. */
function mezclaAcciones(npc, vel, dt){
  const A = npc.acc;
  if (!A) return;
  /* UN SOLO CLIP A LA VEZ. Mezclar por peso parece lo elegante y es lo que
     rompia todo: el mixer acumula los cuaterniones de cada pista y los normaliza,
     y con el Idle mirando a un costado y el Casual_Walk al frente, el hueso Hips
     interpolaba por el camino largo y ACOSTABA al personaje en el aire. Los
     torsos retorcidos con la cabeza en el pecho eran lo mismo, mas suave.
     Con histeresis: elegir por un umbral seco hace que a velocidad de frontera
     el personaje parpadee entre quieto y caminando cada cuadro. */
  const est = npc.estAnim || 'quieto';
  let q = est;
  if (est === 'quieto')      q = vel > 0.55 ? (vel > 4.2 ? 'correr' : 'andar') : 'quieto';
  else if (est === 'andar')  q = vel < 0.30 ? 'quieto' : (vel > 4.2 ? 'correr' : 'andar');
  else                       q = vel < 3.4 ? (vel < 0.30 ? 'quieto' : 'andar') : 'correr';
  if (!A[q]) q = A.andar ? 'andar' : 'quieto';
  if (q !== est){
    npc.estAnim = q;
    for (const k in A){
      const a = A[k];
      a.setEffectiveWeight(k === q ? 1 : 0);
      if (k === q){ a.paused = false; a.enabled = true; }
    }
  }
  /* el clip avanza al ritmo del paso: si no, se arrastra o patina */
  if (A.andar) A.andar.timeScale = cl(vel / 1.9, .55, 2.1);
  if (A.correr) A.correr.timeScale = cl(vel / 5.4, .6, 1.9);
  /* el Idle de Meshy mira a los costados. La queja no era que mire: era que lo
     hace rapido, sin parar y todos a la vez. A 0,42 el MISMO clip se lee como
     respirar, y el desfase por personaje rompe el coro. */
  if (A.quieto) A.quieto.timeScale = 0.42;
}
function ponerModelo(npc){
  if (!GLTF || !npc.glb) return;
  /* FUERA_DE_MUNDOS: los modelos que NO viven en assets/mundos (hyper/char.glb,
     arcade/m-arena-heroe.glb...) no se resuelven con AX(), que prefija
     `mundos/`: quedaban en 404 y el personaje se quedaba con la figura
     procedural. Se elige el resolvedor por el prefijo de la ruta. */
  const _url = /^(hyper|arcade|aero|reliquia|g3|frutiger|rl|sandbox|blox|vr|ngp|fp|senda|drift-yard)\//.test(npc.glb) ? AR(npc.glb) : AX(npc.glb);
  new GLTF().load(_url, g => {
    const m = g.scene;
    m.scale.setScalar(npc.glbEsc || 1);
    m.position.y = npc.glbY || 0;
    m.rotation.y = npc.glbGiro || 0;
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material){ o.material.metalness = 0; } } });
    /* apagar la figura procedural (queda de respaldo si el modelo no llegó) */
    npc.fig.traverse(o => { if (o.isMesh) o.visible = false; });
    npc.fig.add(m);
    npc.modelo = m;
    /* los clips PROPIOS se guardan y se mezclan con los prestados: antes se
       reproducia animations[0] a ciegas, y para viajera.glb y dante.glb eso es
       `Idle`, asi que patinaban por el suelo sin mover una pierna. */
    npc.clipsPropios = g.animations || [];
    armarAcciones(npc);
    if (g.animations && g.animations.length){
      const mix = npc.mixer || new T.AnimationMixer(m);
      if (!npc.mixer){ npc.mixer = mix; MIXERS.push(mix); }
      /* si el clip es de CAMINAR (Meshy sube las dos manos a la vez), le
         manejamos los brazos a mano igual que al cuerpo en 1ª persona */
      if (/walk|camin/i.test(g.animations[0].name || '')){
        const arm = {};
        m.traverse(o => { if (o.isBone){
          if (o.name === 'LeftArm') arm.la = o; else if (o.name === 'RightArm') arm.ra = o;
          else if (o.name === 'LeftForeArm') arm.lf = o;
          else if (o.name === 'RightForeArm') arm.rf = o;
          else if (o.name === 'LeftHand') arm.lh = o;
          else if (o.name === 'RightHand') arm.rh = o; } });
        for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
        npc.arms = arm; npc.armPh = 0;
      }
    }
    npc.cargado = true;
  }, undefined, () => {});
}
function nuevoNPC(o){
  o.fig.position.set(o.x, H(o.x, o.z) + (o.vuela ? (o.alto || 2.2) : 0), o.z);
  o.fig.rotation.y = o.giro || 0;
  scene.add(o.fig);
  o.fase = rr(0, 6.28); o.li = 0;
  NPCS.push(o);
  ponerModelo(o);
  return o;
}
function npcTick(dt){
  for (const mix of MIXERS) mix.update(dt);
  for (const npc of NPCS){
    /* el modelo 3D generado ya trae su propia orientación: si el clip es de
       caminar, no le sumamos el balanceo procedural de las extremidades */
    const f = npc.fig;
    const d = Math.hypot(px - f.position.x, pz - f.position.z);
    let anda = 0;
    /* de donde salio este cuadro: sirve para saber a que velocidad va de verdad
       y para saber hacia donde esta caminando */
    const _x0 = f.position.x, _z0 = f.position.z;
    if (npc.sigue){
      if (d > 40){                       /* nunca se queda atrás de verdad */
        f.position.x = px - Math.sin(yaw) * -3 + 1.5;
        f.position.z = pz - Math.cos(yaw) * -3 + 1.5;
      } else if (d > 3.4){
        const vel2 = (corre ? 10.8 : 5.8) * dt;
        f.position.x += (px - f.position.x) / d * Math.min(vel2, d - 3.2);
        f.position.z += (pz - f.position.z) / d * Math.min(vel2, d - 3.2);
        /* PANTANO: fuera de la pasarela hay agua negra. Quien te sigue se pega
           a los tablones en vez de cortar la curva caminando hundido. */
        if (npc.enPasarela){
          const q = cercaPasarela(f.position.x, f.position.z, 2.4);
          f.position.x = q.x; f.position.z = q.z;
        }
        anda = 1;
      }
      /* MIRA A DONDE CAMINA. Antes, con el jugador a menos de 3,4 m no se le
         tocaba ni la rotacion ni la animacion: quedaba clavado en el angulo del
         spawn —casi siempre de espaldas— y quieto. Parado, encara al jugador. */
      {
        const mvx = f.position.x - _x0, mvz = f.position.z - _z0;
        const objY = (mvx * mvx + mvz * mvz > 1e-6)
          ? Math.atan2(mvx, mvz)
          : Math.atan2(px - f.position.x, pz - f.position.z);
        let dy = objY - f.rotation.y;
        while (dy > Math.PI) dy -= 6.283;
        while (dy < -Math.PI) dy += 6.283;
        f.rotation.y += dy * Math.min(1, dt * 8);
      }
    } else if (d < 26){
      /* 26 m, no 11: a 12 m ya te daban la espalda sin girar nunca. Y mas
         rapido: con dt*3 tardaban casi un segundo en encararte. */
      const objY = Math.atan2(px - f.position.x, pz - f.position.z);
      let dy = objY - f.rotation.y;
      while (dy > Math.PI) dy -= 6.283;
      while (dy < -Math.PI) dy += 6.283;
      f.rotation.y += dy * Math.min(1, dt * 6);
    }
    const suelo = H(f.position.x, f.position.z);
    f.position.y = npc.vuela
      ? suelo + (npc.alto || 2.2) + Math.sin(t0 * 1.7 + npc.fase) * .25
      : suelo;
    /* la velocidad DE VERDAD del personaje (metros por segundo): con esto la
       mezcla de clips no depende de banderas sino de cuanto se movio */
    /* ---------------------- LA RONDA ------------------------------------
       Los personajes se plantaban en su sitio para siempre: la animacion que
       corria era la de estar quieto (bien) y el mundo quedaba lleno de estatuas.
       El que no te acompaña hace una ronda corta alrededor de su puesto —tres
       paradas a menos de nueve metros— y se queda un rato en cada una. Asi el
       clip de caminar corre de verdad.
       Si te acercas a menos de siete metros se DETIENE y te encara: hablar con
       alguien no puede ser perseguirlo. */
    if (!npc.sigue && !npc.vuela && !npc.quieto){
      if (!npc.ronda){
        const bx = f.position.x, bz = f.position.z;
        npc.ronda = [];
        for (let k = 0; k < 3; k++){
          const a = npc.fase + k * 2.094;
          const r = 4.5 + (k % 2) * 4.0;
          npc.ronda.push([bx + Math.cos(a) * r, bz + Math.sin(a) * r]);
        }
        npc.ri = 0; npc.espera = rr(1.5, 5.0);
      }
      if (d < 7){
        /* cerca del jugador: quieto y encarandolo */
        npc.espera = Math.max(npc.espera, .6);
      } else if (npc.espera > 0){
        npc.espera -= dt;
      } else {
        const P = npc.ronda[npc.ri];
        const dx = P[0] - f.position.x, dz = P[1] - f.position.z;
        const dd = Math.hypot(dx, dz);
        if (dd < .8){
          npc.ri = (npc.ri + 1) % npc.ronda.length;
          npc.espera = rr(2.0, 6.5);
        } else {
          const paso = 1.35 * dt;                 /* paso de paseo, no de marcha */
          f.position.x += dx / dd * Math.min(paso, dd);
          f.position.z += dz / dd * Math.min(paso, dd);
          const objY = Math.atan2(dx, dz);
          let dy2 = objY - f.rotation.y;
          while (dy2 > Math.PI) dy2 -= 6.283;
          while (dy2 < -Math.PI) dy2 += 6.283;
          f.rotation.y += dy2 * Math.min(1, dt * 4);
          anda = 1;
        }
      }
    }
    /* SUAVIZADA: el que te sigue entra y sale del radio de 3,4 m, asi que su
       velocidad instantanea salta entre 6 y 0 de un cuadro al otro y la mezcla
       parpadeaba entre caminar y quieto. Con un seguimiento exponencial la
       animacion no tiembla. */
    const vIns = dt > 0 ? Math.hypot(f.position.x - _x0, f.position.z - _z0) / dt : 0;
    /* PARADO DE VERDAD: si el personaje no se movio nada en el cuadro, su
       velocidad es CERO y no «casi cero». Sin esto el suavizado exponencial
       deja una cola de 0,2 m/s para siempre, el estado se queda en `andar` y el
       robot de ACROPOLIS caminaba eternamente parado en el mismo lugar. */
    npc.vel = npc.vel == null ? vIns : npc.vel + (vIns - npc.vel) * Math.min(1, dt * 4.5);
    if (vIns < 0.02 && npc.vel < 0.30) npc.vel = 0;
    mezclaAcciones(npc, npc.vel, dt);
    /* el PERRO no tiene huesos: su GLB es una sola pieza, asi que ningun clip lo
       puede mover. Se lo balancea a mano mientras trota, que a esa escala se lee
       como paso, y se le da un cabeceo al estar quieto para que respire. */
    if (npc.modelo && !npc.acc){
      const v2 = npc.vel || 0;
      npc.balPh = (npc.balPh || 0) + dt * (2.2 + v2 * 2.6);
      npc.modelo.rotation.z = Math.sin(npc.balPh) * (v2 > .3 ? .09 : .012);
      npc.modelo.position.y = (npc.glbY || 0) + Math.abs(Math.sin(npc.balPh)) * (v2 > .3 ? .07 : .012);
    }
    const L2 = f.userData.lim || {};
    const sw = anda ? Math.sin(t0 * 9) * .55 : Math.sin(t0 * 1.4 + npc.fase) * .06;
    if (L2.bI){ L2.bI.rotation.x = sw; L2.bD.rotation.x = -sw;
      /* hay figuras con brazos pero sin piernas (el pingüino aletea) */
      if (L2.pI){ L2.pI.rotation.x = -sw; L2.pD.rotation.x = sw; } }
    if (L2.p1 && !L2.bI){ const s2 = anda ? Math.sin(t0 * 11) * .6 : 0;
      L2.p1.rotation.x = s2; L2.p4.rotation.x = s2;
      L2.p2.rotation.x = -s2; L2.p3.rotation.x = -s2; }
    if (L2.cola) L2.cola.rotation.x = Math.sin(t0 * (anda ? 13 : 6) + npc.fase) * .4;
    if (L2.rot) for (const r of L2.rot) r.rotation.y += dt * 28;
    if (f.userData.late)
      f.userData.late.emissiveIntensity = .6 + .35 * Math.sin(t0 * 2.2 + npc.fase);
    /* brazos del modelo 3D con clip de caminar: colgando + vaivén al andar
       (pisa lo que dejó el mixer, que subía las dos manos a la vez) */
    /* los brazos los maneja el CLIP cuando hay uno de verdad: apuntarBrazos
       los forzaba colgando todos los cuadros, y con el clip de caminar prestado
       las piernas se movian y los brazos quedaban clavados. El apano solo hace
       falta cuando el unico clip que hay sube las dos manos a la vez. */
    if (npc.arms && !npc.acc){
      npc.armPh += dt * (anda ? (corre ? 9 : 6.2) : 0);
      const swA = Math.sin(npc.armPh) * (anda ? 0.42 : 0)
        + Math.sin(t0 * 1.3 + npc.fase) * 0.03 * (anda ? 0 : 1);
      apuntarBrazos(npc.arms, swA);
    }
  }
}
function npcCerca(){
  let mejor = null, md = 4.4;
  for (const npc of NPCS){
    if (!npc.clave) continue;
    const d = Math.hypot(px - npc.fig.position.x, pz - npc.fig.position.z);
    if (d < md){ md = d; mejor = npc; }
  }
  return mejor;
}
function hablaNPC(npc){
  /* ENCARA DE UNA al jugador. Con el giro suave de 3 rad/s el personaje se
     pasaba la conversacion entera de perfil, porque el dialogo pausa el mundo y
     el giro nunca llegaba a terminar. */
  if (npc.fig) npc.fig.rotation.y =
    Math.atan2(px - npc.fig.position.x, pz - npc.fig.position.z);
  const lineas = (L[LANG].npc && L[LANG].npc[npc.clave]) || [];
  if (!lineas.length) return;
  const txt = lineas[npc.li % lineas.length];
  npc.li++;
  dialogo(npc.nombre, txt, npc.alHablar || null, npc.cara, npc.retrato);
}

const ITEMS = [];
function nuevoItem(o){ o.activo = true; ITEMS.push(o); return o; }
function itemCerca(){
  for (const it of ITEMS){
    if (!it.activo) continue;
    if (Math.hypot(px - it.x, pz - it.z) < (it.r || 3.5)) return it;
  }

}
/* ¿qué haría el botón USAR ahora mismo? El capítulo manda, después los
   items, después charlar con quien esté cerca. */
function accionUsable(){
  const C = CAPS[cap];
  const p = POI[C.obj];
  /* DENTRO DEL TRASLADO manda el traslado y nada mas: si no, llegar al objetivo
     encima de la mecanica dispararia el capitulo a toda velocidad —y el dialogo
     congela la fisica— y ademas no habria como salirse, porque salirse es el
     mismo boton. */
  if (CANOA.modo){
    const t2 = CANOA.accion();
    return t2 ? { tipo: 'canoa', tr: t2 } : null;
  }
  if (C.usar && Math.hypot(px - p.x, pz - p.z) < 7 && MISION.lista(cap))
    return { tipo: 'cap' };
  const tr = CANOA.accion();
  if (tr) return { tipo: 'canoa', tr };
  const it = itemCerca();
  if (it) return { tipo: 'item', it };
  const npc = npcCerca();
  if (npc) return { tipo: 'npc', npc };
  return null;
}
function usarAccion(){
  if (enDlg) return;
  const acc = accionUsable();
  if (!acc) return;
  if (acc.tipo === 'canoa') CANOA.usar(acc.tr);
  else if (acc.tipo === 'cap') llegaObjetivo();
  else if (acc.tipo === 'item'){ acc.it.activo = false; acc.it.fn(acc.it); }
  else hablaNPC(acc.npc);
}

   (viewmodel colgado de la cámara) que bombean al caminar y se aprietan al
   correr; PIERNAS de verdad con rodilla al mirar hacia abajo; y un torso y
   cabeza que NO se dibujan (colorWrite=false) pero SÍ proyectan: tu propia
   sombra camina entera por el suelo. Colores por mundo en MUNDO_CUERPO. */
const MUNDO_CUERPO = { mangas: 0x3f4a44, guantes: 0xc0906a, pantalon: 0x3b3a32,
  botas: 0x241c14, glb: 'per/pantano-guia.glb' };
const CUERPO = {};
{

  const mB = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.botas });

  const mF = new T.MeshLambertMaterial({ color: 0x000000 });

    pulgar.position.set(-s2 * .052, .012, .012);

    ante.position.set(s2 * .07, -.16, .15);

    ante.rotation.z = -s2 * .3;
    g.add(ante);
    g.position.set(s2 * .23, -.26, -.46);

/* CUERPO 3D generado (riggeado + caminar) en PRIMERA PERSONA: se cuelga del
   mismo Group que sigue al jugador; se apaga el cuerpo procedural; se ENCOGE
   el hueso de la cabeza para no tapar la cámara; el clip de caminar avanza a
   la velocidad del paso. Si el GLB no llega, queda el procedural. */
function cargarCuerpoGLB(){
  if (!GLTF || !MUNDO_CUERPO.glb) return;
  new GLTF().load(AX(MUNDO_CUERPO.glb), g => {
    const m = g.scene;
    m.rotation.y = Math.PI;                 /* de frente a la marcha */
    const arm = {};
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material) o.material.metalness = 0; }
      if (o.isBone && /head|cabeza|neck/i.test(o.name) && !CUERPO.headBone)
        CUERPO.headBone = o;
      /* brazos: los manejamos a mano porque el clip de Meshy sube las dos manos
         a la vez (quedaban "arriba" al estar quieto). Los dejamos colgando. */
      if (o.isBone){
        if (o.name === 'LeftArm') arm.la = o;
        else if (o.name === 'RightArm') arm.ra = o;
        else if (o.name === 'LeftForeArm') arm.lf = o;
        else if (o.name === 'RightForeArm') arm.rf = o;
        else if (o.name === 'LeftHand') arm.lh = o;
        else if (o.name === 'RightHand') arm.rh = o;
      } });
    for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
    CUERPO.arms = arm;
    CUERPO.root.add(m);
    CUERPO.glb = m;
    /* apagar el cuerpo procedural (piernas + fantasma + viewmodel) */
    CUERPO.root.traverse(o => { if (o.isMesh && o !== m && !m.getObjectById(o.id)) o.visible = false; });
    CUERPO.pI.visible = CUERPO.pD.visible = false;
    CUERPO.bsI.visible = CUERPO.bsD.visible = false;
    if (g.animations && g.animations.length){
      CUERPO.mixer = new T.AnimationMixer(m);
      CUERPO.accion = CUERPO.mixer.clipAction(g.animations[0]);
      CUERPO.accion.play();
    }
  }, undefined, () => {});
}

/* apunta los brazos de un modelo Meshy SIN depender de su pose de bind (que
   varía por modelo): orienta cada hombro para que el brazo señale HACIA ABAJO
   en el mundo (algo adelante y afuera), con `sw` de vaivén. Así quedan colgando
   normales en los 5 cuerpos y en los NPC, sin importar cómo vino riggeado. */
const ROLL_PALMA = 1.35;   /* ~77 grados: palma de adelante a adentro */
const _brAim = new T.Vector3(), _brTgt = new T.Vector3(), _brPw = new T.Quaternion();
function apuntarBrazos(A, sw, outX, fwdZ, forebend){
  outX = outX == null ? 0.26 : outX;
  fwdZ = fwdZ == null ? 0.16 : fwdZ;
  forebend = forebend == null ? 0.28 : forebend;
  const aim = (up, fore, side, s) => {
    if (!up || !fore) return;
    _brAim.copy(fore.position).normalize();
    _brTgt.set(side * outX, -1, fwdZ + s).normalize();
    up.parent.getWorldQuaternion(_brPw);
    _brTgt.applyQuaternion(_brPw.invert());
    up.quaternion.setFromUnitVectors(_brAim, _brTgt);
  };
  aim(A.la, A.lf, 1, sw);
  aim(A.ra, A.rf, -1, -sw);
  /* ROLL_PALMA: el rig viene en A-pose con la PALMA HACIA ADELANTE y los dedos
     abiertos; con el brazo colgando eso se ve como una mano de zombi. Rolamos el
     antebrazo sobre su propio eje (Y del hueso apunta a la mano en estos rigs)
     para que la palma quede mirando al cuerpo, que es como cuelga una mano. */
  if (A.lf && A.lf.userData.bindQ){ A.lf.quaternion.copy(A.lf.userData.bindQ);
    A.lf.rotateX(forebend); A.lf.rotateY(-ROLL_PALMA); }
  if (A.rf && A.rf.userData.bindQ){ A.rf.quaternion.copy(A.rf.userData.bindQ);
    A.rf.rotateX(forebend); A.rf.rotateY(ROLL_PALMA); }
  /* la muneca: se relaja el gesto abierto del bind y se cierra un poco */
  if (A.lh && A.lh.userData.bindQ){ A.lh.quaternion.copy(A.lh.userData.bindQ);
    A.lh.rotateZ(-0.22); A.lh.rotateY(-0.30); }
  if (A.rh && A.rh.userData.bindQ){ A.rh.quaternion.copy(A.rh.userData.bindQ);
    A.rh.rotateZ(0.22); A.rh.rotateY(0.30); }
}
function cuerpoTick(dt){
  const enJuego = fase === 'juego';
  CUERPO.root.visible = enJuego;
  CUERPO.vm.visible = enJuego && !enDlg && !CUERPO.glb;   /* con GLB no hay viewmodel */
  if (!enJuego) return;
  CUERPO.root.position.set(px, (ojoY != null ? ojoY : H(px, pz)) + aireY, pz);
  CUERPO.root.rotation.y = yaw;
  const v = Math.min(1, Math.hypot(pvx, pvz) / VEL);
  /* --- rama del CUERPO 3D generado --- */
  if (CUERPO.glb){
    if (CUERPO.mixer){
      /* el clip avanza con la velocidad: parado se congela, corriendo vuela.
         Las PIERNAS y el torso los mueve el clip; los brazos los pisamos abajo. */
      CUERPO.mixer.timeScale = v * (corre ? 2.4 : 1.4);
      CUERPO.mixer.update(dt);
    }
    /* brazos apuntados HACIA ABAJO (independiente del bind de cada modelo),
       con vaivén al caminar y respiración mínima al estar quieto */
    if (CUERPO.arms){
      const sw = Math.sin(bobF) * v * (corre ? 0.5 : 0.34) + Math.sin(t0 * 1.4) * 0.03 * (1 - v);
      apuntarBrazos(CUERPO.arms, sw);
    }
    /* achicar la cabeza CADA cuadro (el mixer la reescribe) para no taparte */
    if (CUERPO.headBone) CUERPO.headBone.scale.setScalar(0.02);
    return;
  }
  const sw = Math.sin(bobF) * (corre ? .95 : .62) * v;
  /* piernas: péndulo desde la cadera, rodilla que se dobla al recoger */
  CUERPO.pI.rotation.x = sw;
  CUERPO.pD.rotation.x = -sw;
  CUERPO.rI.rotation.x = Math.max(0, -sw) * 1.25;
  CUERPO.rD.rotation.x = Math.max(0, sw) * 1.25;
  /* brazos de la sombra, en contrafase con las piernas */
  CUERPO.bsI.rotation.x = -sw * .8;
  CUERPO.bsD.rotation.x = sw * .8;
  /* el viewmodel BOMBEA: quieto respira, caminando alterna, corriendo los
     puños se juntan y suben (parkour) */
  const pump = Math.sin(bobF) * v;
  const amp = corre ? .10 : .06;
  const baseX = corre ? .17 : .23;
  const baseY = -.26 + (corre ? .035 : 0);   /* corriendo los puños SUBEN */
  const resp = Math.sin(t0 * 1.3) * .006;
  CUERPO.bD.position.set(baseX, baseY + pump * amp + resp, -.46 + Math.cos(bobF) * .05 * v);
  CUERPO.bI.position.set(-baseX, baseY - pump * amp + resp, -.46 - Math.cos(bobF) * .05 * v);
  CUERPO.bD.rotation.z = -.06 + pump * .16;
  CUERPO.bI.rotation.z = .06 + pump * .16;
  CUERPO.bD.rotation.x = -.12 + pump * .14;
  CUERPO.bI.rotation.x = -.12 - pump * .14;
}

/* ========================= AMBIENTE SONORO ================================
   Dos capas. La GENERADA (amb-pantano.m4a: coro de ranas, grillos, agua) entra
   en cargarAudioReal. La SINTETIZADA con WebAudio vive acá, no cuesta un byte y
   —a diferencia de una pista— REACCIONA a dónde estás:
     · VIENTO entre los juncos: ruido rosa por un pasabajos, con vaivén lento
     · AGUA: el mismo ruido por un pasabanda grave con marejada; sube cuando
       tenés laguna abierta alrededor y baja sobre el islote
     · RANAS: dos osciladores graves con un vibrato rápido (croac), cada 2-6 s
     · GRILLOS: ráfagas de pulsos de 4,3 kHz, constantes (acá es siempre noche)
   ========================================================================== */
const AMB = { ctx: null, master: null, on: true, viento: null, lago: null,
  grillos: null, grillosMax: .34, tRana: 3, tCri: 2 };
try { AMB.on = localStorage.getItem('pantano_son') !== '0'; } catch(e){}
function ambienteOn(){
  if (AMB.ctx){ if (AMB.ctx.state === 'suspended') AMB.ctx.resume(); return; }
  try { AMB.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const A2 = AMB.ctx;
  AMB.master = A2.createGain();
  AMB.master.gain.value = AMB.on ? 1 : 0;
  AMB.master.connect(A2.destination);
  const buf = A2.createBuffer(1, A2.sampleRate * 3, A2.sampleRate);
  const d = buf.getChannelData(0); let l = 0;
  for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1;
    l = l * .97 + w * .03; d[i] = l * 3.0; }
  const nv = A2.createBufferSource(); nv.buffer = buf; nv.loop = true;
  const fv = A2.createBiquadFilter(); fv.type = 'lowpass'; fv.frequency.value = 320;
  AMB.viento = A2.createGain(); AMB.viento.gain.value = .05;
  nv.connect(fv); fv.connect(AMB.viento); AMB.viento.connect(AMB.master); nv.start();
  const nl = A2.createBufferSource(); nl.buffer = buf; nl.loop = true;
  nl.playbackRate.value = .55;
  const fl = A2.createBiquadFilter(); fl.type = 'bandpass';
  fl.frequency.value = 220; fl.Q.value = .9;
  const oleo = A2.createGain(); oleo.gain.value = .7;
  const lfo = A2.createOscillator(); lfo.frequency.value = .23;
  const lg = A2.createGain(); lg.gain.value = .45;
  lfo.connect(lg); lg.connect(oleo.gain); lfo.start();
  AMB.lago = A2.createGain(); AMB.lago.gain.value = 0;
  nl.connect(fl); fl.connect(oleo); oleo.connect(AMB.lago);
  AMB.lago.connect(AMB.master); nl.start();
  AMB.grillos = A2.createGain(); AMB.grillos.gain.value = 0;
  AMB.grillos.connect(AMB.master);
}
/* CROAC: dos ondas cuadradas graves con el tono cayendo y un vibrato de 28 Hz.
   Es sorprendentemente rana para lo poco que es. */
function rana(){
  const A2 = AMB.ctx; if (!A2) return;
  const n = 1 + Math.floor(Math.random() * 3);
  const f0 = 120 + Math.random() * 150;
  for (let i = 0; i < n; i++){
    const o = A2.createOscillator(), g = A2.createGain();
    const vib = A2.createOscillator(), vg = A2.createGain();
    const t = A2.currentTime + i * (.15 + Math.random() * .1);
    o.type = 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * .78, t + .17);
    vib.frequency.value = 24 + Math.random() * 12;
    vg.gain.value = f0 * .22;
    vib.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.055, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + .2);
    o.connect(g); g.connect(AMB.master);
    o.start(t); o.stop(t + .24); vib.start(t); vib.stop(t + .24);
  }
}
function cri(){
  const A2 = AMB.ctx; if (!A2) return;
  const t0b = A2.currentTime;
  for (let i = 0; i < 5; i++){
    const o = A2.createOscillator(), g = A2.createGain();
    const t = t0b + i * .055;
    o.frequency.value = 4300 + Math.random() * 300;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.85, t + .008);
    g.gain.exponentialRampToValueAtTime(.001, t + .045);
    o.connect(g); g.connect(AMB.grillos); o.start(t); o.stop(t + .06);
  }
}

/* =================== EL MUNDO PROPIO: misión, personajes ===================
   PANTANO es el mundo de la LUZ: la misión son los SIETE FAROLES de la
   pasarela. Cada uno se prende con USAR y queda encendido para siempre; el
   capítulo 2 pide tres y el 4 los siete, así que la línea de luz se completa
   junto con la historia. Encima va LA MECHA (el medidor de supervivencia): la
   llama que llevás se consume sola y sólo se recarga al lado de un farol
   prendido, del brasero, del fanal o en la casilla. Si se apaga, la ciénaga te
   devuelve al último farol que encendiste — no hay muerte, hay vuelta atrás.
   Y no caminás solo: BRUMA, la perra de Dante, te adopta al salir; SIRA, la
   viajera, camina donde pisás desde el cruce. */
const MISION = (() => {
  let prendidos = 0, mecha = 1, mechaOn = false, tRet = 0;
  let ultimo = { x: POI.casilla.x, z: POI.casilla.z };

      (prendidos >= FAROLES.length ? ' ✓' : '');
  }

    if (F.prendido) return;
    F.prendido = true; prendidos++;
    F.llama.visible = true; F.sprite.visible = true;
    /* la LUZ no vive en el farol: la reparte el POZO DE LUCES (lucesTick) entre
       los cuatro fuegos encendidos más cercanos, mirando F.prendido. Tocar un
       F.luz acá tiraba TypeError y rompía la misión al primer farol. */
    ultimo = { x: F.x, z: F.z };
    mecha = 1; medPon(1);
    pinta();
  }
  /* cada farol es un ITEM usable: alcanza con acercarse y tocar USAR. Al
     prenderse el item se DESACTIVA (usarAccion ya lo hace): si quedara activo,
     tener un farol al lado taparía para siempre el diálogo de los personajes,
     porque accionUsable mira los items antes que los NPC. */
  for (const F of FAROLES)
    nuevoItem({ x: F.x, z: F.z, r: 4.4, F, fn: it => prender(it.F) });
  function prendeBrasero(){
    if (BRASERO.on) return;
    BRASERO.on = true;
    BRASERO.llama.visible = true; BRASERO.sprite.visible = true;
  }
  function prendeFanal(){
    if (FANAL.on) return;
    FANAL.on = true;
    FANAL.llama.visible = true; FANAL.sprite.visible = true;
  }
  return {
    lista(c){
      if (c === 1) return prendidos >= 3;
      if (c === 3) return prendidos >= FAROLES.length;
      return true;
    },
    alCap(c){
      $('tarea').classList.toggle('on', c >= 1 && c <= 3);
      pinta();
      /* Bruma te adopta al salir de la casilla; Sira camina desde el cruce */
      if (c >= 1 && window.__BRUMA) window.__BRUMA.sigue = true;
      if (c >= 3 && window.__SIRA){ window.__SIRA.sigue = true; window.__SIRA.nombre = 'SIRA'; }
      mechaOn = c >= 1;
      medidor(mechaOn, '🔥');
      if (mechaOn){ mecha = 1; medPon(1); }
      if (c >= 5) prendeBrasero();
    },
    tick(dt){
      /* las llamas TIEMBLAN: sin esto la luz cálida se ve de plástico */
      const p1 = .82 + .18 * Math.sin(t0 * 7.3) + .1 * Math.sin(t0 * 17.1);
      lucesTick(p1);
      for (const F of FAROLES)
        if (F.prendido) F.sprite.scale.setScalar(5.5 * (.92 + .12 * p1));
      if (BRASERO.on) BRASERO.sprite.scale.setScalar(9 * (.9 + .16 * p1));
      if (FANAL.on) FANAL.sprite.scale.setScalar(30 * (.95 + .08 * p1));
      if (fase !== 'juego') return;
      /* el brasero del altar y el fanal de la torre se prenden al llegar: el
         diálogo del capítulo cuenta justo eso, así que la luz tiene que estar
         puesta ANTES de que se abra */
      if (cap === 4 && Math.hypot(px - POI.altar.x, pz - POI.altar.z) < 9) prendeBrasero();
      if (cap === 5 && Math.hypot(px - POI.torre.x, pz - POI.torre.z) < 11) prendeFanal();

      if (!cerca && BRASERO.on && Math.hypot(px - POI.altar.x, pz - POI.altar.z) < 20) cerca = true;

    /* ganchos de prueba: prender todo sin caminar 1.500 m */
    prendeTodo(){ for (const F of FAROLES) prender(F); },

/* =========================== RECOLECCION ==================================

const RECOL = (() => {

    if (F === 'flor')   return new T.TorusGeometry(.26 * s, .13 * s, 5, 9);
    if (F === 'gota')   return new T.OctahedronGeometry(.32 * s, 0);

    if (F === 'campana')return new T.CylinderGeometry(.09 * s, .27 * s, .42 * s, 8, 1, true);
    return new T.IcosahedronGeometry(.28 * s, 0);          /* pina */
  })();
  /* el halo: un plano que siempre mira a la camara. Sin esto una pieza chica en
     un paisaje grande es invisible, y buscar a ciegas no es divertido. */
  const halo = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(32, 32, 2, 32, 32, 32);
    rg.addColorStop(0, 'rgba(255,255,255,.95)');
    rg.addColorStop(.35, 'rgba(255,255,255,.35)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
    return new T.SpriteMaterial({ map: new T.CanvasTexture(c), color: 0xbdf0d8,
      transparent: true, depthWrite: false, opacity: .55 });
  })();
  /* azar determinista: mismo mundo, mismas piezas, siempre */
  let sem = 7540;
  const az = () => { sem = (sem * 1103515245 + 12345) & 0x7fffffff; return sem / 0x7fffffff; };
  const LUG = Object.keys(POI);
  for (let i = 0; i < TOT; i++){
    const L = POI[LUG[i % LUG.length]];
    const a = az() * 6.2832, d = (L.pr || 24) * (.55 + az() * 1.5);
    const x = cl(L.x + Math.cos(a) * d, -MITAD + 14, MITAD - 14);
    const z = cl(L.z + Math.sin(a) * d, -MITAD + 14, MITAD - 14);
    const y = H(x, z);
    const fig = new T.Group();
    const m = new T.Mesh(geo, mat);
    m.position.y = .55; m.castShadow = true;
    fig.add(m);
    const sp = new T.Sprite(halo);
    sp.scale.setScalar(1.7); sp.position.y = .58;
    fig.add(sp);
    fig.position.set(x, y, z);
    scene.add(fig);
    piezas.push({ fig, m, x, z, tomada: false, fase: az() * 6.2832 });
  }
  function pinta(){
    const el = $('recol');
    el.textContent = ICO + ' ' + (NOM[LANG] || NOM.es) + '  ' + junt + '/' + TOT
      + (junt >= TOT ? '  ✓' : '');
    el.classList.toggle('lleno', junt >= TOT);
  }
  return {
    total: TOT, get juntadas(){ return junt; },
    pinta,
    tick(dt){
      for (const p of piezas){
        if (p.tomada) continue;
        p.fig.rotation.y += dt * 1.5;
        p.fig.children[0].position.y = .55 + Math.sin(t0 * 2 + p.fase) * .11;
        if (Math.hypot(px - p.x, pz - p.z) < 3.2){
          p.tomada = true;
          scene.remove(p.fig);
          junt++; pinta();
          blipRecol(junt >= TOT);
          if (junt >= TOT) setTimeout(() => { if (!enDlg)
            dialogo((NOM[LANG] || NOM.es) + '  ' + ICO,
              Tx('recolFin'), null, null, null); }, 700);
        }
      }
    }
  };
})();
/* el tilin de juntar: una nota corta, mas alta al completar */
function blipRecol(fin){
  if (!AMB.ctx || !AMB.on) return;
  try {
    const o = AMB.ctx.createOscillator(), g = AMB.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(fin ? 880 : 1320, AMB.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(fin ? 1760 : 1980, AMB.ctx.currentTime + .12);
    g.gain.setValueAtTime(.0001, AMB.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.09, AMB.ctx.currentTime + .015);
    g.gain.exponentialRampToValueAtTime(.0001, AMB.ctx.currentTime + (fin ? .5 : .22));
    o.connect(g); g.connect(AMB.master);
    o.start(); o.stop(AMB.ctx.currentTime + (fin ? .55 : .26));
  } catch(e){}
}

/* ========================= ARBOLES GLB DE VERDAD ==========================
   Antes esto eran CARTULINAS: tres cuadros cruzados con una foto recortada. De
   lejos pasaban, de cerca eran papel pintado. Ahora se plantan los GLB del
   repo, que son mallas con tronco, ramas y raices.
   Se reparten alrededor de los lugares del mundo (nunca ENCIMA, que ahi va lo
   construido) con un azar determinista: el mismo mundo tiene siempre el mismo
   bosque, asi el mapa se puede aprender. */
{
  let semA = 187061;
  const azA = () => { semA = (semA * 1103515245 + 12345) & 0x7fffffff; return semA / 0x7fffffff; };
  const LUGA = Object.values(POI);
  /* un sitio libre: cerca de algun lugar pero fuera de su explanada, dentro del
     mapa y sin pisar lo que ya se planto */
  const puestos = [];
  function sitioA(margen){
    for (let intento = 0; intento < 30; intento++){
      const L = LUGA[(azA() * LUGA.length) | 0];
      const a = azA() * 6.2832, d = (L.pr || 24) * (1.2 + azA() * 3.6);
      const x = L.x + Math.cos(a) * d, z = L.z + Math.sin(a) * d;
      if (Math.abs(x) > MITAD - 22 || Math.abs(z) > MITAD - 22) continue;
      let mal = false;
      for (const P of LUGA) if (Math.hypot(x - P.x, z - P.z) < (P.pr || 24) * .92){ mal = true; break; }
      if (!mal && margen > 0)
        for (const q of puestos) if (Math.hypot(x - q[0], z - q[1]) < margen){ mal = true; break; }
      if (!mal){ puestos.push([x, z]); return [x, z, 1, azA() * 6.283]; }
    }
    return null;
  }
  /* triangulos por modelo, medidos del propio GLB: sin esto es facil clonar
     cuarenta veces una malla de treinta mil y fundir el telefono */
  const TRIM = { "g3/mdl-palm.glb": 28763, "reliquia/tree1.glb": 30498, "reliquia/tree2.glb": 29945, "reliquia/tree3.glb": 29657, "hyper/p-tree.glb": 5020, "arcade/m-agujero-arbol.glb": 1306, "aero/tree.glb": 26288, "aero/bush.glb": 30867, "reliquia/bush.glb": 30648, "reliquia/obs-log.glb": 30824, "reliquia/obs-totem.glb": 30373 };
  const bosque = (url, n, alto, sombra, choque, margen) => {
    const l = [];
    for (let i = 0; i < n; i++){ const p = sitioA(margen); if (p) l.push(p); }
    propMuchos(url, l, { altoObjetivo: alto, sombra,
      choque: choque > 0 ? choque : 0 });
    window.__ARBOLES = (window.__ARBOLES || 0) + l.length;
    window.__TRI_ARB = (window.__TRI_ARB || 0) + l.length * (TRIM[url] || 0);
  };
  bosque('hyper/p-tree.glb', 44, 15.0, true, 1.3, 6.75);   /* selva */
  bosque('reliquia/tree3.glb', 3, 14.0, true, 1.1, 6.3);   /* arbol3 */
  bosque('reliquia/bush.glb', 8, 2.4, false, 0.0, 3.0);   /* matorral */
}

/* ================================ JUGADOR ================================== */
const stats = { t: 0, dist: 0 };
let px = POI.inicio.x, pz = POI.inicio.z, yaw = 0, pitch = -.03;
let pvx = 0, pvz = 0, bobF = 0, corre = false;
const OJO = 1.7, VEL = 6.2, VEL_CORRE = 11.5;
const DED = { mov: null, mira: null };
let movV = { x: 0, y: 0 }, keyV = { x: 0, y: 0 }, keyL = { x: 0, y: 0 };
const DBG = { n:0, dt:0, agua:0, arb:0 };
const PEND_MAX = 0.80;   /* ~39 grados: mas empinado que esto no se sube */
/* ...SALVO EN EL CORREDOR DE LA SENDA. La senda une los puntos de la historia,
   y si un tramo es mas empinado que el tope general el mundo queda sin terminar
   (en CAÑON no se llegaba arriba por esto). Dentro de 15 m de la huella el tope
   sube a 1,9 (~62 grados), que es lo que hace falta para una escalera tallada o
   una cuesta de acantilado; fuera de ella sigue en 0,80, porque poder trepar
   cualquier pared le saca sentido a buscar el paso. */
const SENDA_R2 = 15 * 15;
function pendMax(x, z){
  const P = (typeof SENDA_PTS !== 'undefined') && SENDA_PTS;
  if (!P || !P.length) return PEND_MAX;
  for (let i = 0; i < P.length; i++){
    const dx = x - P[i][0], dz = z - P[i][1];
    if (dx * dx + dz * dz < SENDA_R2) return 1.9;
  }
  return PEND_MAX;
}
let ojoY = null;         /* altura del ojo interpolada (sin saltos) */
/* SALTO: altura fija (los saltos de altura variable dejaban repisas
   inalcanzables), gravedad fuerte para que no se sienta lunar. */
const GRAV = 22, SALTO_V = 8.2;
let aireY = 0, aireV = 0, enAire = false;
function saltar(){
  if (CANOA.modo){ CANOA.salta(); return; }   /* dentro del traslado, SALTO es lo suyo */
  if (enAire) return; enAire = true; aireV = SALTO_V;
}
function fisica(dt){
  /* dentro del traslado no se camina: tiene su propio paso, y usa los MISMOS
     aireY/aireV/ojoY, asi que al salirse el estado sigue valiendo tal cual */
  if (CANOA.modo){ CANOA.paso(dt); return; }
  yaw -= keyL.x * 2.2 * dt;
  pitch = cl(pitch - keyL.y * 1.7 * dt, -1.2, 1.2);
  let mx = movV.x + keyV.x, my = movV.y + keyV.y;
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  const sp = corre ? VEL_CORRE : VEL;
  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  pvx = (-sy * -my + cy * mx) * sp;
  pvz = (-cy * -my - sy * mx) * sp;
  let nx = cl(px + pvx * dt, -MITAD + 6, MITAD - 6);
  let nz = cl(pz + pvz * dt, -MITAD + 6, MITAD - 6);
  /* TOPE DE PENDIENTE: antes la altura se fijaba directo al terreno, asi que
     caminar contra una ladera te SUBIA de golpe (parecia teletransporte). Si el
     escalon es mas empinado que PEND_MAX no se sube: se DESLIZA por la ladera
     (se proyecta el movimiento sobre la curva de nivel), que es lo que hace un
     personaje de verdad. */
  {
    const h0 = H(px, pz), h1 = H(nx, nz);
    const dl = Math.hypot(nx - px, nz - pz);
    if (dl > 1e-5 && (h1 - h0) / dl > pendMax(px, pz)){
      /* gradiente del terreno por diferencias finitas */
      const e = 1.2;
      const gx = H(px + e, pz) - H(px - e, pz), gz = H(px, pz + e) - H(px, pz - e);
      const gl = Math.hypot(gx, gz) || 1;
      const ux = gx / gl, uz = gz / gl;              /* cuesta arriba */
      const dvx = nx - px, dvz = nz - pz;
      const proy = dvx * ux + dvz * uz;              /* cuanto va cuesta arriba */
      nx = px + (dvx - ux * proy) * .92;             /* se lo saca: queda el roce */
      nz = pz + (dvz - uz * proy) * .92;
      const h2 = H(nx, nz);
      if ((h2 - h0) / (Math.hypot(nx - px, nz - pz) || 1) > pendMax(px, pz)){ nx = px; nz = pz; }
    }
  }
  /* ni por el agua ni a través de los troncos */
  DBG.n++; DBG.dt += dt;
  if (enAgua(nx, nz)){ nx = px; nz = pz; DBG.agua++; }
  for (const a of ARB){
    const dx = nx - a[0], dz = nz - a[1], d = Math.hypot(dx, dz), rq = a[2] + .5;
    if (d < rq && d > 1e-4){ nx = a[0] + dx / d * rq; nz = a[1] + dz / d * rq; DBG.arb++; }
  }
  stats.dist += Math.hypot(nx - px, nz - pz);
  px = nx; pz = nz;
  /* la altura del ojo PERSIGUE al suelo en vez de pegarse a el: sin esto, cada
     bache era un tironcito vertical, y una ladera un teletransporte. */
  {
    const hs = H(px, pz);
    ojoY = ojoY == null ? hs : ojoY + (hs - ojoY) * Math.min(1, dt * 9);
    if (Math.abs(hs - ojoY) > 3) ojoY = hs;   /* teleport de guion: sin arrastre */
  }
  /* el SALTO vive sobre la altura del suelo: se integra aparte y se suma, asi
     el tope de pendiente y el suavizado del ojo siguen valiendo. */
  if (enAire){
    aireV -= GRAV * dt; aireY += aireV * dt;
    if (aireY <= 0){ aireY = 0; aireV = 0; enAire = false; }
  }
  bobF += dt * (2 + 8 * Math.min(1, Math.hypot(pvx, pvz) / VEL));
  stats.t += dt;
}
let fovSuave = 72, dt0 = .016;   /* el dt del cuadro, que ponCam no recibe */
function ponCam(){
  const v = Math.min(1, Math.hypot(pvx, pvz) / VEL);
  let ex = px, ez = pz;
  /* con CUERPO 3D: el ojo va a la altura de la frente y un pelo ADELANTE del
     cuello, así al mirar abajo ves el pecho y las piernas sin el agujero del
     cuello, y la cabeza colapsada queda detrás del lente */
  if (CUERPO.glb){ ex = px + Math.sin(yaw) * -.16; ez = pz + Math.cos(yaw) * -.16; }
  cam.position.set(ex, (ojoY != null ? ojoY : H(px, pz)) + aireY + OJO + Math.abs(Math.sin(bobF)) * .06 * v, ez);
  cam.rotation.y = yaw;
  cam.rotation.x = pitch + Math.sin(bobF * 2) * .004 * v;
  /* EL CAMPO SE ABRE DE A POCO. Antes saltaba de 72 a 77 en el cuadro en que
     empezabas a correr, y volvia de golpe al soltar: se veia como un tiron de
     la imagen. Ahora persigue a la velocidad REAL, asi que se abre y se cierra
     solo, y de paso vale igual para el auto-correr de la palanca. */
  const fovObj = 72 + 6 * cl((Math.hypot(pvx, pvz) - VEL * .96) / (VEL_CORRE - VEL), 0, 1);
  /* dt0*2.1 = constante de tiempo de medio segundo, que es lo que se pidio:
     antes con 3.2 se abria en tres decimas y se notaba el tiron. */
  fovSuave += (fovObj - fovSuave) * Math.min(1, dt0 * 2.1);
  cam.fov = fovSuave;
  cam.updateProjectionMatrix();
}

/* ================= LA CANOA: EL TRASLADO PROPIO DEL PANTANO =================
   LA CANOA DEL PANTANO. De los quince mundos, este es el que MAS pedia un
   traslado propio, y por una razon que ya estaba escrita en su terreno: la
   pasarela es lo unico caminable de punta a punta y las ocho lagunas de agua
   negra son infranqueables a pie (la fisica llama `enAgua` y no te deja). O sea
   que el ochenta por ciento del mapa existia, se veia, y no se podia tocar.

   LA CANOA ES LA LLAVE DE ESE OCHENTA POR CIENTO. No es un atajo ni un boton de
   correr: va a 7,6 m/s, MENOS que correr, y encima no puede pisar tierra. Lo
   que hace es cambiar QUE ES SUELO: en la canoa la laguna es camino y la
   pasarela es pared, exactamente al reves que a pie. Con eso el mismo mapa se
   lee dado vuelta.

   HAY TRES, AMARRADAS a la pasarela y mirando a la laguna. No se ponen a mano:
   para cada laguna se busca el punto de la pasarela mas cercano y se sale de ahi
   hacia el centro hasta encontrar agua honda, asi que caen donde el jugador ya
   pasa caminando y siguen cayendo bien si mañana se mueve una laguna.

   TRES COSAS QUE TIENEN QUE SER ASI. La canoa QUEDA donde la dejaste, no vuelve
   a su sitio: si volviera, el mundo te estaria devolviendo a la pasarela. Solo
   se baja EN LA ORILLA y despacio, porque bajarse en el medio de la laguna seria
   ahogarse y ahogarse no es una mecanica. Y el ojo va clavado un metro sobre el
   AGUA y no sobre `H`, que aca es el barro del fondo: siguiendo `H` la camara se
   hundia seis metros. SALTO tampoco es saltar —de una canoa no se salta— es la
   palada fuerte que saca la proa del juncal.
   ========================================================================== */
const CANOA = (() => {
  const A = { modo: null, vel: 0, hd: 0, act: null, PUE: [],
    nPaso: 0, tSim: 0, nVuelo: 0, altMax: 0, absY: 0, absV: 0, tSol: 0, sac: 0 };
  const TT = {
    es: { toma: 'CANOA · ◉ USAR para subir',
          va:   'PALANCA rema y timonea · SALTO da una palada fuerte',
          baja: '◉ USAR para bajar en la orilla',
          lejos:'no hay orilla al lado' },
    en: { toma: 'CANOE · ◉ USE to board',
          va:   'STICK to paddle and steer · JUMP for a hard stroke',
          baja: '◉ USE to step ashore',
          lejos:'no shore alongside' },
    pt: { toma: 'CANOA · ◉ USAR para subir',
          va:   'ALAVANCA rema e guia · SALTO da uma remada forte',
          baja: '◉ USAR para descer na margem',
          lejos:'sem margem ao lado' }
  };
  const tx = k => ((TT[LANG] || TT.en)[k] || '');

  const RTOMA = 7.5;
  const V_MAX = 7.6;        /* una canoa no corre: cruza lo que no se cruza */
  const ACEL = 3.4, FREN = 4.2, ROCE = 1.1;
  const GIRO = 1.5;         /* una canoa pivota: gira mucho mejor que camina */
  const OJO_C = AGUA_Y + 1.15;   /* el ojo sentado, un metro sobre el agua negra */
  const HONDO = -.75;       /* hace falta esto de agua bajo la quilla */

  const hayAgua = (x, z) => H(x, z) < AGUA_Y + HONDO;

  /* -------------------- donde estan amarradas las canoas ------------------- */
  /* PEGADAS A LA PASARELA Y MIRANDO A LA LAGUNA. La pasarela es lo unico
     caminable de punta a punta y las lagunas son infranqueables a pie: la canoa
     no es un atajo, es la unica llave del 80% del mapa. Para cada laguna se
     busca el punto de la pasarela mas cercano y se sale de ahi hacia el centro
     de la laguna hasta encontrar agua honda. */
  {
    const cand = [];
    for (const L of LAG){
      let mej = 1e9, mi = 0;
      for (let i = 0; i < SENDA_PTS.length; i++){
        const d = Math.hypot(SENDA_PTS[i][0] - L.x, SENDA_PTS[i][1] - L.z);
        if (d < mej){ mej = d; mi = i; }
      }
      cand.push({ L, d: mej, p: SENDA_PTS[mi] });
    }
    cand.sort((a, b) => a.d - b.d);
    for (const c of cand){
      if (A.PUE.length >= 3) break;
      const ux = (c.L.x - c.p[0]) / (c.d || 1), uz = (c.L.z - c.p[1]) / (c.d || 1);
      let x = 0, z = 0, ok = false;
      for (let r = 6; r <= 26; r += 2){
        x = c.p[0] + ux * r; z = c.p[1] + uz * r;
        if (hayAgua(x, z)){ ok = true; break; }
      }
      if (!ok) continue;
      /* ni dos canoas en el mismo sitio */
      let junta = false;
      for (const P of A.PUE) if (Math.hypot(P.x - x, P.z - z) < 90) junta = true;
      if (junta) continue;
      A.PUE.push({ x, z, hd: Math.atan2(-ux, -uz), lib: true });
    }
  }

  /* ------------------------------- la canoa -------------------------------- */
  const mCas = new T.MeshLambertMaterial({ map: TX.oscuro, color: 0x6a5236 });
  const mBor = new T.MeshLambertMaterial({ map: TX.oscuro, color: 0x8a6f45 });
  const mRem = new T.MeshLambertMaterial({ color: 0x9a7c4e });
  /* Se arma por piezas porque el REMO se mueve, y el remo es lo que convierte
     "la camara se desliza" en "estas remando". */
  function armaCanoa(){
    const g = new T.Group();
    /* el casco: una caja larga afinada a proa y a popa con dos cunas */
    const cas = new T.Mesh(new T.BoxGeometry(.92, .46, 3.9), mCas);
    cas.position.y = .23;
    g.add(cas);
    for (const s of [-1, 1]){
      const pu = new T.Mesh(new T.ConeGeometry(.46, 1.15, 4), mCas);
      pu.rotation.x = s * Math.PI / 2;
      pu.rotation.z = Math.PI / 4;
      pu.position.set(0, .23, s * -2.5);
      g.add(pu);
    }
    /* las bordas y dos bancos: es lo que se ve desde dentro */
    for (const s of [-1, 1]){
      const bo = new T.Mesh(new T.BoxGeometry(.09, .17, 3.8), mBor);
      bo.position.set(s * .46, .5, 0);
      g.add(bo);
    }
    for (const z2 of [-.9, .9]){
      const ba = new T.Mesh(new T.BoxGeometry(.9, .07, .26), mBor);
      ba.position.set(0, .48, z2);
      g.add(ba);
    }
    /* EL REMO, con su pivote en la mano derecha */
    const piv = new T.Group();
    piv.position.set(.5, .72, -.15);
    const pal = new T.Mesh(new T.CylinderGeometry(.035, .035, 1.9, 5), mRem);
    pal.position.y = -.7; piv.add(pal);
    const hoj = new T.Mesh(new T.BoxGeometry(.2, .5, .03), mRem);
    hoj.position.y = -1.62; piv.add(hoj);
    g.add(piv);
    g.remo = piv;
    g.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    return g;
  }
  for (const P of A.PUE){
    P.g = armaCanoa();
    P.g.position.set(P.x, AGUA_Y - .12, P.z);
    P.g.rotation.y = P.hd;
    P.g.remo.rotation.set(-1.15, 0, .3);     /* amarrada: el remo apoyado */
    scene.add(P.g);
  }

  /* ----------------------------- lo que se hace ---------------------------- */
  let mia = null, brazada = 0;
  /* ¿hay orilla al lado para bajarse? Es la unica condicion de salida: bajarse
     en el medio de la laguna seria ahogarse, y ahogarse no es una mecanica. */
  function orillaCerca(){
    for (let a = 0; a < 6.2832; a += .5){
      const x = px + Math.sin(a) * 3.4, z = pz + Math.cos(a) * 3.4;
      if (H(x, z) > AGUA_Y + .25) return { x, z };
    }
    return null;
  }
  A.accion = () => {
    if (A.modo){
      if (A.vel > 2.6) return null;
      const o = orillaCerca();
      return o ? { baja: o } : { lejos: true };
    }
    for (const P of A.PUE)
      if (P.lib && Math.hypot(px - P.x, pz - P.z) < RTOMA) return { P };
    return null;
  };
  A.usar = c => {
    if (c.lejos) return;                       /* el aviso ya lo dice */
    if (c.baja){ A.suelta(c.baja); return; }
    const P = c.P;
    P.lib = false; A.act = P; mia = P.g;
    A.modo = 'canoa'; A.vel = 0; A.hd = P.hd; brazada = 0;
    yaw = P.hd;
    px = P.x; pz = P.z;
    ojoY = OJO_C - OJO;
    enAire = false; aireY = 0; aireV = 0;
  };
  A.suelta = orilla => {
    if (!A.modo) return;
    const P = A.act;
    A.modo = null; A.vel = 0;
    if (P){
      /* la canoa QUEDA amarrada donde la dejaste: es lo que hace que el mapa se
         abra de verdad y no que el mundo te devuelva a la pasarela */
      P.x = px; P.z = pz; P.hd = A.hd; P.lib = true;
      P.g.position.set(px, AGUA_Y - .12, pz);
      P.g.rotation.set(0, A.hd, 0);
      P.g.remo.rotation.set(-1.15, 0, .3);
    }
    mia = null;
    if (orilla && orilla.x != null){ px = orilla.x; pz = orilla.z; }
    ojoY = H(px, pz);
    pvx = 0; pvz = 0; aireY = 0; aireV = 0; enAire = false;
  };
  /* SALTO en la canoa no es saltar —de una canoa no se salta— es la PALADA
     FUERTE: el envion que saca la proa del juncal cuando te quedaste clavado. */
  A.salta = () => { A.vel = Math.min(V_MAX * 1.35, A.vel + 3.4); brazada = 0; };

  A.paso = dt => {
    A.nPaso++; A.tSim += dt;
    pitch = cl(pitch - keyL.y * 1.7 * dt, -1.2, 1.2);
    const mx = cl(movV.x + keyV.x, -1, 1), my = cl(movV.y + keyV.y, -1, 1);
    A.hd -= mx * GIRO * dt;
    yaw = A.hd;
    const obj = my < -.15 ? V_MAX * (-my) : 0;
    A.vel += (obj > A.vel ? ACEL : -FREN) * dt;
    A.vel -= ROCE * (A.vel / V_MAX) * dt;
    A.vel = cl(A.vel, 0, V_MAX * 1.35);
    const ux = -Math.sin(A.hd), uz = -Math.cos(A.hd);
    let nx = cl(px + ux * A.vel * dt, -MITAD + 8, MITAD - 8);
    let nz = cl(pz + uz * A.vel * dt, -MITAD + 8, MITAD - 8);
    /* LA QUILLA TOCA FONDO. La canoa no sube a la tierra: si adelante no hay
       agua honda, no se avanza y se pierde el envion. Es el limite del mundo de
       la canoa, y es el mismo limite —al revés— que tiene caminar acá. */
    if (!hayAgua(nx, nz)){
      /* se prueba deslizar por la orilla antes de clavarla: raspar un juncal y
         quedar quieto en seco son dos cosas distintas */
      if (hayAgua(nx, pz)) nz = pz;
      else if (hayAgua(px, nz)) nx = px;
      else { nx = px; nz = pz; }
      A.vel *= .55;
    }
    stats.dist += Math.hypot(nx - px, nz - pz);
    px = nx; pz = nz;
    /* el ojo va CLAVADO al agua, no al fondo de la laguna: acá `H` es el barro
       de abajo y seguirlo te hundía la cámara seis metros. */
    ojoY = OJO_C - OJO;
    aireY = 0; aireV = 0; enAire = false;
    pvx = ux * A.vel; pvz = uz * A.vel;
    /* LA BRAZADA. Una palada por segundo y medio a media velocidad; el casco
       cabecea con ella y se escora al girar, que es lo que hace que 7 m/s en una
       canoa se sientan mas que 11 corriendo. */
    brazada += dt * (.9 + A.vel * .34);
    bobF = brazada * 2;
    if (mia){
      const bal = Math.sin(brazada * 6.2832) ;
      mia.position.set(px, AGUA_Y - .12 + bal * .045, pz);
      mia.rotation.set(bal * .035 + A.vel * .006, A.hd, -mx * .09 + bal * .02);
      /* el remo entra, empuja y sale: media vuelta trabajando y media al aire */
      const f = brazada - Math.floor(brazada);
      const trab = f < .55;
      mia.remo.rotation.set(trab ? -.5 + f / .55 * 1.5 : .9 - (f - .55) / .45 * 1.4,
        trab ? .1 : -.5, .3 + (trab ? 0 : .25));
    }
    stats.t += dt;
  };
  A.aviso = acc => {
    if (A.modo){
      if (A.vel > 2.6) return tx('va');
      return (acc && acc.tr && acc.tr.lejos) ? tx('va') + ' · ' + tx('lejos') : tx('baja');
    }
    if (acc && acc.tipo === 'canoa') return tx('toma');
    return '';
  };

  /* DESPEGAR. `aireY` es "cuanto estas por encima del suelo", y el suelo se va
     para abajo mientras volas: integrado asi, el primer cuadro en el aire ya
     daba aireY negativo —el suelo bajaba mas rapido que la gravedad— y
     aterrizabas al instante, o sea que volar por encima de un borde era
     imposible por definicion. Volando se lleva la altura ABSOLUTA y `aireY` sale
     de restarle el terreno. */
  A.despega = vy => {
    if (enAire) return;
    enAire = true;
    A.absY = H(px, pz) + aireY;
    A.absV = vy; aireV = vy;
    A.nVuelo++;
  };
  /* la caida, con la altura absoluta. Devuelve true si acaba de aterrizar. */
  A.caida = (dt, hs) => {
    if (!enAire) return false;
    A.absV -= GRAV * dt;
    A.absY += A.absV * dt;
    aireV = A.absV;
    aireY = A.absY - hs;
    if (aireY > A.altMax) A.altMax = aireY;
    if (aireY <= 0){ aireY = 0; aireV = 0; enAire = false; return true; }
    return false;
  };
  A.est = () => ({ modo: A.modo, vel: +A.vel.toFixed(2), aire: enAire,
    nPaso: A.nPaso, tSim: +A.tSim.toFixed(2),
    nVuelo: A.nVuelo, altMax: +A.altMax.toFixed(2),
    hd: +A.hd.toFixed(2), y: +(H(px, pz) + aireY).toFixed(2),
    pue: A.PUE.map(P => ({ x: Math.round(P.x), z: Math.round(P.z), lib: P.lib })) });
  return A;
})();

function pasoObjetivo(){
