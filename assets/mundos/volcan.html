<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#150a08"/>
<title>VOLCAN</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#150a08;color:#f7e9df;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(30,15,11,.66);border:1px solid rgba(255,168,104,.28);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#ffe4c8}
  #objD{font-size:11.5px;color:#d9a888;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#ffc98f;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  /* la columna de botones se corre para dejarle el rincon del pulgar derecho
     al SALTO, que antes la tapaba entera */
  /* ---------------------------- HUD DE ARRIBA -----------------------------
     MENU y SONIDO se tocan una vez cada tanto, no en medio de la accion: van
     ARRIBA a la derecha y CUADRADOS. Antes estaban abajo, alargados y apretados
     contra el boton de salto, o sea justo donde apoya el pulgar con el que se
     juega. */
  #btns{position:absolute;right:max(10px,2.5vw);top:max(10px,2.5vh);display:flex;
    flex-direction:row;gap:8px;align-items:flex-start;pointer-events:auto}
  .b{width:46px;height:46px;min-width:0;padding:0;display:grid;place-items:center;
    text-align:center;border-radius:12px;font-weight:800;font-size:16px;
    background:rgba(34,17,12,.66);border:1.5px solid rgba(255,168,104,.44);
    color:#ffe4c8;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  /* USAR: REDONDO, abajo, al lado del salto. Dos motivos.
     Sitio: position FIXED y no absolute. #btns se subio arriba a la derecha y es
     absolute, asi que un hijo absolute dejaba de colgar de la pantalla y colgaba de
     EL: su "bottom" se medía desde la caja de arriba y el boton aparecia arriba.
     Forma: es el unico boton de accion que se toca en medio del juego, con el pulgar
     y sin mirar; una pastilla alargada al lado de un salto redondo se toca peor y se
     ve peor. Mismo diametro que el salto, a su izquierda. */
  .b.usar{position:fixed;right:calc(max(14px,3.5vw) + min(84px,19vw) + 12px);
    bottom:max(16px,5vh);width:min(72px,16vw);height:min(72px,16vw);
    aspect-ratio:1;border-radius:50%;padding:0;display:none;place-items:center;
    font-size:clamp(10px,2.6vw,13px);line-height:1.05;text-align:center;
    letter-spacing:.04em}
  .b.usar.on{display:grid}
  /* CORRER ya no es un boton: es un indicador chiquito al lado del contador */
  .b.corre{display:none}
  #corriendo{position:absolute;left:12px;top:calc(10px + 2.3em);pointer-events:none;
    display:none;font:800 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.14em;padding:5px 8px;border-radius:7px;
    background:rgba(34,17,12,.66);border:1px solid rgba(255,168,104,.44);color:#ffe4c8}
  #corriendo.on{display:block}
  /* ------------------------ JOYSTICK Y SALTO (TACTIL) ---------------------
     Antes el medio izquierdo de la pantalla era una zona invisible de arrastre:
     nadie sabia donde tocar. Ahora hay una PALANCA dibujada, con el estilo del
     mundo, y un boton de SALTO. La palanca del todo hacia ARRIBA = correr. */
  #joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(150px,32vw);aspect-ratio:1;pointer-events:auto;touch-action:none;
    opacity:.9;transition:opacity .25s}
  /* La palanca y el salto se esconden SOLO si el aparato no tiene tactil.
     Antes se escondian al detectar mouse/teclado (body.pc), y en un portatil
     tactil o en un celular que se declara «pointer:fine» el jugador se quedaba
     sin ningun control: el joystick recien aparecia DESPUES del primer toque,
     y ese primer toque no hacia nada. La ayuda de teclado sigue saliendo
     igual: tener las dos cosas a la vez no molesta. */
  body.sinTactil #joy,body.sinTactil #bSalta{display:none}
  /* con dialogo abierto no se camina: la palanca y el salto estorban */
  /* con dialogo abierto los controles SE VAN de la pantalla, no solo se
     transparentan: quedaban encima del globo y tapaban el texto. */
  body.hablando #joy,body.hablando #bSalta{opacity:0;pointer-events:none;
    transform:translateY(140%);transition:opacity .18s,transform .22s}
  /* y el globo se apoya abajo, que es el lugar que quedo libre */
  body.hablando #dlg{bottom:max(10px,2vh)}
  /* el boton USAR tambien se aparta: pegado abajo a la derecha, se le ponia
     encima del globo y tapaba el final de cada linea */
  body.hablando .b.usar{opacity:0;pointer-events:none}
  #joy canvas{width:100%;height:100%;display:block}
  #bSalta{position:absolute;right:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(84px,19vw);aspect-ratio:1;border-radius:50%;pointer-events:auto;
    touch-action:none;display:grid;place-items:center;font-weight:900;
    font-size:11px;letter-spacing:.1em;cursor:pointer;
    background:rgba(0,0,0,.42);border:2px solid #ff9a52;color:#ffd9b0;
    box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
  #bSalta:active{transform:translateY(2px) scale(.96);filter:brightness(1.35)}
  #bSalta span{display:block;font-size:24px;line-height:1}

  /* ---------------------- BARRA DE ARRIBA: PAUSA Y SONIDO -------------------
     Estaban abajo a la derecha, alargados y peleando lugar con el salto. Van
     ARRIBA y CUADRADOS, que es donde no molestan al pulgar ni al dialogo. */
  #hudTop{position:absolute;right:max(10px,2.5vw);top:max(10px,2vh);display:flex;
    gap:8px;pointer-events:auto;z-index:6}
  #hudTop .bt{width:44px;height:44px;border-radius:12px;display:grid;
    place-items:center;font-size:19px;line-height:1;cursor:pointer;
    background:rgba(0,0,0,.46);border:1.5px solid rgba(255,168,104,.36);color:#ffc98f;
    backdrop-filter:blur(4px)}
  #hudTop .bt:active{transform:translateY(1px);filter:brightness(1.35)}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#f4ddc4;
    background:rgba(26,12,9,.55);border:1px solid rgba(255,178,116,.28);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  /* con la ayuda de PC en la esquina, el contador baja */
  body.pc #recol{top:calc(10px + 13em)}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(255,178,116,.18);border:1px solid rgba(255,178,116,.32);color:#ffe4c8}
  /* ---------------------- DIALOGO: CHICO Y ABAJO -------------------------
     Antes el globo crecia con el texto y un capitulo de cinco parrafos ocupaba
     media pantalla en medio de la cara. Ahora el texto va PARTIDO EN PAGINAS y
     la caja tiene alto FIJO y chico, pegada abajo: no salta entre paginas y
     deja ver el paisaje, que es de lo que se trata. */
  #dlg{position:absolute;left:50%;bottom:max(12px,3vh);transform:translateX(-50%);
    width:min(720px,94vw);display:none;pointer-events:auto;align-items:flex-end;gap:0;z-index:5}
  #dlg.on{display:flex}
  #dlgFoto,#dlgCara{width:min(104px,17vw);aspect-ratio:3/4;flex:0 0 auto;
    border-radius:10px 10px 4px 4px;border:1.5px solid rgba(255,168,104,.36);background:rgba(24,11,8,.9);
    display:none;object-fit:cover;object-position:50% 10%;
    box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #dlgFoto.on,#dlgCara.on{display:block}
  #dlgGlobo{position:relative;flex:1 1 auto;min-width:0;margin-left:11px;
    background:rgba(24,11,8,.9);border:1.5px solid rgba(255,168,104,.36);border-radius:4px;
    padding:9px 13px 8px;backdrop-filter:blur(7px);
    box-shadow:0 8px 26px rgba(0,0,0,.5);display:flex;flex-direction:column}
  #dlgGlobo::before,#dlgGlobo::after{content:'';position:absolute;left:-10px;top:16px;
    width:0;height:0;border:10px solid transparent}
  #dlgGlobo::before{border-right-color:rgba(255,168,104,.36)}
  #dlgGlobo::after{left:-8px;border-right-color:rgba(24,11,8,.9)}
  #dlgT{font-weight:900;letter-spacing:.06em;color:#ffc98f;font-size:11.5px;margin-bottom:4px}
  /* ALTO FIJO: cuatro renglones. Lo que sobre queda en blanco, que es mejor que
     una caja que cambia de tamano en cada SIGUIENTE. */
  #dlgB{font-size:13.5px;line-height:1.42;color:#f7e9df;white-space:pre-wrap;
    height:5.7em;overflow:hidden;flex:0 0 auto}
  #dlgPie{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  #dlgPag{font:800 10.5px ui-monospace,monospace;letter-spacing:.1em;color:#ffc98f;opacity:.65}
  #dlgGo{padding:7px 16px;border-radius:7px;font-weight:800;font-size:11.5px;
    letter-spacing:.08em;background:linear-gradient(180deg,#d4571c,#7a2810);border:1px solid #ffcf9a;cursor:pointer;
    white-space:nowrap}
  @media (max-height:430px){
    #dlgB{height:4.3em;font-size:12.5px}
    #dlgFoto,#dlgCara{width:min(86px,15vw)}
  }
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#e8b48a;
    background:rgba(26,12,9,.55);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(22,4,0,.42) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(255,168,104,.44);background:#0006}
  #dlgCara.on{display:block}

  /* contador de RECOLECCION: va debajo del objetivo, con su propio icono */
  #recol{position:absolute;left:12px;top:calc(10px + 4.6em);pointer-events:none;
    display:none;font:800 12.5px/1 ui-sans-serif,system-ui,sans-serif;
    padding:6px 9px;border-radius:9px;letter-spacing:.05em;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,168,104,.36);color:#ffc98f;
    backdrop-filter:blur(4px)}
  #recol.on{display:block}
  #recol.lleno{border-color:#ffc98f;box-shadow:0 0 14px -2px #ffc98f}
  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(20,8,5,.18) 0%,rgba(20,8,5,.4) 55%,rgba(13,5,3,.78) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#ffeacb,#d4571c);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#c99a7e;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#ffe4c8;
    background:rgba(36,18,13,.84);border:1.5px solid rgba(255,168,104,.44)}
  .mbtn.go{background:linear-gradient(180deg,#d4571c,#7a2810);border-color:#ffcf9a}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#e8823a;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#c99a7e;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(30,15,11,.76);border:1.5px solid rgba(255,168,104,.36);color:#f0cdae}
  .chip.on{background:linear-gradient(180deg,#d4571c,#7a2810);border-color:#ffcf9a;color:#fff2e2}
  #cargando{position:fixed;inset:0;z-index:8;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
    background:#150a08;color:#c99a7e;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="hudTop"><div class="bt" id="bSon">🔊</div><div class="bt" id="bMenu">☰</div></div>
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
    <div class="b" id="bMenu" aria-label="menu">II</div>
  </div>
  <div id="dlg"><img id="dlgFoto" alt=""><canvas id="dlgCara" width="192" height="256"></canvas><div id="dlgGlobo"><div id="dlgT"></div><div id="dlgB"></div><div id="dlgPie"><div id="dlgPag"></div><div id="dlgGo">SIGUIENTE &#9656;</div></div></div></div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
  <div id="bSalta"><span>⤒</span><b id="bSaltaT">SALTO</b></div>
  <div id="recol"></div>
  <div id="corriendo"></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <h1>VOLCAN</h1>
  <div class="sub">la isla de ígnea · una montaña que se abrió por dentro</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>
  <div class="fila" id="fLang">
    <div class="chip" data-l="es">ESPAÑOL</div>
    <div class="chip" data-l="en">ENGLISH</div>
    <div class="chip" data-l="pt">PORTUGUÊS</div>
  </div>
  <div class="filaT" id="tGfx">GRÁFICOS</div>
  <div class="fila" id="fGfx">
    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">CARGANDO EL VOLCÁN…</div>

<script>
/* ============================================================================
   VOLCAN — la isla de Ígnea: un cono de ceniza negra de 150 m con TRES RÍOS DE
   LAVA bajando por sus flancos, campo de fumarolas, y un cráter con una FISURA
   abierta que hay que sellar.
     · el terreno es un CONO (perfil convexo) con borde y cuenco de cráter
       tallados, la llanura de ceniza al sur y la loma de toba de las fumarolas;
       encima, tres CAUCES excavados por donde corre la lava
     · LA LAVA: cintas de geometría propia (con UV que corre cuesta abajo) de
       corteza negra y grietas incandescentes — material Lambert con emissiveMap,
       así que pasa por ACES y por la niebla como todo lo demás; el mapa se
       desplaza cada cuadro y la colada FLUYE. No se puede pisar (colisiona).
     · CENIZA que cae y BRASAS que suben, remolinos de ceniza errantes, la
       columna de humo del cráter y su resplandor naranja de noche
     · el refugio de la Estación Brasa, el campo de geiseres con sus columnas de
       vapor, las tres CISTERNAS de agua de la ruta, y en la cumbre la FISURA
       que se sella con agua (la lava se vuelve obsidiana: se apaga de verdad)
     · ambiente sintetizado: viento caliente, el siseo del vapor (posicional),
       el RUGIDO del volcán que crece al subir y retumbos graves al azar
   HISTORIA (6 caps, ES/EN/PT): NURA, geóloga de la Estación Brasa, sube al
   cráter a sellar la fisura antes de que el calor la deshidrate.
   ========================================================================== */
(async () => {
'use strict';
const Q = new URLSearchParams(location.search);
const LOC = Q.has('local');
/* SELLO DE VERSION: sale en la linea de fps. Sirve para saber si el
   telefono esta sirviendo el HTML de ahora o uno cacheado. */
const BUILD = '64b61b4';
/* CERO descargas de assets: todas las texturas se pintan al vuelo.
   Lo único que llega de la red es three.js. */
/* assets compartidos de los mundos hermanos (cielos, modelos 3D, audio). Se
   define acá arriba —antes del armado del mundo— porque los mk_*.py insertan
   propGLB()/AX() en el cuerpo del build, que corre mucho antes. */
const HASHAX = '13923ee';       /* assets COMPARTIDOS, ya publicados */
/* los assets NUEVOS de VOLCAN (cielo, portada, música, ambiente y las dos
   texturas del suelo) se commitean junto con este HTML, así que todavía no
   existen en el hash de arriba: se sirven por rama. Al publicar, cambiá esto
   por el hash corto del commit y quedan clavados como el resto. */

/* ---------------- azar reproducible: el valle es SIEMPRE el mismo ---------- */
let _s = 20260804;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- terreno: ruido de valor FBM, determinista ---------------- */
const MAPA = 900, MITAD = MAPA / 2;
function hash2(i, j){
  /* Math.imul, no `*`: en JS el producto de enteros grandes se hace float y
     PIERDE los bits bajos (>2^53) — el hash quedaba sesgado hacia abajo y el
     ruido casi nunca pasaba de 0,36. Medido: la compuerta de densidad rechazaba
     3.356 de 3.481 celdas y el "bosque" tenía 83 árboles. */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260801;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* EL CONO: la isla ES un volcán. Todo el carácter del mundo sale de acá. */
const CONO = { x: 30, z: -290, R: 340, ALTO: 152 };
/* PUNTOS DE LA HISTORIA (fijos, el terreno se allana alrededor) */
const POI = {
  inicio:   { x: 60,   z: 400 },    /* la playa de ceniza negra */
  refugio:  { x: -80,  z: 250 },    /* la Estación Brasa */
  geiseres: { x: 185,  z: 95 },     /* el campo de fumarolas */
  vado:     { x: -20,  z: -60 },    /* el morro frío de la colada */
  mirador:  { x: 150,  z: -180 },   /* el balcón sobre los tres ríos */
  crater:   { x: 30,   z: -290 }    /* la fisura */
};
/* el cono SIN CAUCES: llanura de ceniza + volcán (perfil convexo) + borde y
   cuenco del cráter + la loma de toba de las fumarolas. Es la base sobre la
   que se tallan las coladas — y de donde sale la cota de fondo de cada una,
   así que NO puede depender de ellas (si no, recursión infinita). */
function conoAltura(x, z){
  let h = fbm(x * .0052 + 31, z * .0052 + 207) * 19 - 7;   /* llanura de ceniza */
  h += fbm(x * .014 + 88, z * .014 + 140) * 5.2;           /* lomas de escoria */
  h += fbm(x * .052 + 12, z * .052 + 61) * 1.3;            /* rugosidad de lapilli */
  const d = Math.hypot(x - CONO.x, z - CONO.z);
  if (d < CONO.R){
    const t = 1 - d / CONO.R;
    h += CONO.ALTO * Math.pow(t, 1.75);                    /* el cono */
    h += 15 * Math.exp(-((d - 62) * (d - 62)) / (24 * 24)); /* el borde del cráter */
    h -= 54 * Math.exp(-(d * d) / (44 * 44));              /* el cuenco */
  }
  const dg = Math.hypot(x - 185, z - 95);
  h += 13 * Math.exp(-(dg * dg) / (150 * 150));            /* la loma de toba */
  /* EL BALCÓN: un espolón de basalto que sale del flanco. Sin él, el mirador
     caía a media ladera y el capítulo 4 —"desde el balcón, la isla entera"—
     daba de frente contra la cuesta: la pantalla entera era ceniza. Subido 34 m
     sobre su entorno, el suelo se abre solo y los tres ríos entran en cuadro. */
  const db = Math.hypot(x - 150, z + 180);
  h += 34 * Math.exp(-(db * db) / (38 * 38));
  return h;
}
/* LAS COLADAS: tres ríos que bajan del cráter. Cada punto guarda el ancho del
   cauce y su cota de FONDO. FLUJOS los agrupa por río (para armar las cintas
   de lava); COLADAS es la lista plana (para tallar el terreno y colisionar). */
const FLUJOS = [], COLADAS = [];
{
  /* [ángulo de salida, curvatura, semilla] — el ángulo 1.95 baja justo por
     delante del vado, el 0.55 se ve entero desde el mirador */
  for (const [a0, curv, sem] of [[1.95, .085, 3.1], [.55, -.07, 7.7], [2.92, .06, 11.3]]){
    const rio = [];
    for (let d = 50; d <= 306; d += 12){
      const a = a0 + curv * Math.sin(d * .016 + sem) + (d - 50) * curv * .0016;
      const x = CONO.x + Math.cos(a) * d, z = CONO.z + Math.sin(a) * d;
      const p = { x, z, w: 8 + (d - 50) / 256 * 10, y: conoAltura(x, z) - 3.6 };
      rio.push(p); COLADAS.push(p);
    }
    FLUJOS.push(rio);
  }
}
function alturaBase(x, z){
  let h = conoAltura(x, z);
  /* los CAUCES: dentro del río el suelo baja hasta la cota de fondo */
  for (const c of COLADAS){
    const dx = x - c.x, dz = z - c.z, d2 = dx * dx + dz * dz;
    const r = c.w * 1.55, r2 = r * r;
    if (d2 > r2 * 4.5) continue;
    const k = Math.exp(-d2 / r2) * .95;
    h = h * (1 - k) + c.y * k;
  }
  return h;
}
function H(x, z){
  let h = alturaBase(x, z);
  for (const k in POI){
    const p = POI[k];
    const d = Math.hypot(x - p.x, z - p.z);
    const w = Math.exp(-(d * d) / (26 * 26));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* la HUELLA de ceniza pisada entre los puntos. Un punto que caiga en un cauce
   se empuja al borde: la senda NUNCA pasa por la lava. */
function fueraDeLava(P){
  for (let it = 0; it < 5; it++){
    let movio = false;
    for (const c of COLADAS){
      const dx = P[0] - c.x, dz = P[1] - c.z;
      const d = Math.hypot(dx, dz), rq = c.w * 1.9 + 7;
      if (d < rq && d > 1e-3){
        P[0] = c.x + dx / d * rq; P[1] = c.z + dz / d * rq; movio = true;
      }
    }
    if (!movio) break;
  }
  return P;
}
const SENDA = [POI.inicio, POI.refugio, POI.geiseres, POI.vado, POI.mirador, POI.crater];
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 5.3, i * 7.7) - .5) * 90;
  const mz = (a.z + b.z) / 2 + (fbm(i * 8.1, i * 3.7) - .5) * 90;
  const seg = [];
  for (let k = 0; k <= 24; k++){
    const t = k / 24, u = 1 - t;
    let P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    if (k > 0 && k < 24) P = fueraDeLava(P);
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
for (const k in POI) POI[k].h = alturaBase(POI[k].x, POI[k].z);


/* ==================== TEXTURAS PROCEDURALES (canvas) ========================
   No hay créditos de generación: acá TODO se PINTA. Cada textura es un canvas
   con ruido FBM azulejable (retícula en módulo, del mismo motor del terreno),
   así que empalman sin costura y no pesan un byte de descarga. */
const lienzo = (n, fn) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const valT = (x, y, per) => {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
  const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
  return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
};
const fbmT = (x, y, per, oct) => {
  let v = 0, amp = .55, p = per;
  for (let o = 0; o < oct; o++){ v += amp * valT(x * p, y * p, p); amp *= .5; p *= 2; }
  return cl(v, 0, 1);
};
const mezC = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
/* suelo genérico: dos colores por FBM + pecas (piedritas y chispas de polvo)
   + rayas de duna opcionales (ondas de arena talladas por el viento) */
function texSuelo(n, colA, colB, pecas, rayas){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      let t = fbmT(x / n, y / n, 6, 4);
      if (rayas){
        const w = Math.sin((y / n * 18 + fbmT(x / n, y / n, 5, 3) * 2.6) * 6.283);
        t = cl(t * .55 + .45 * (.5 + .5 * w), 0, 1);
      }
      let c = mezC(colA, colB, t);
      const r = hash2(x + 7, y + 13);
      if (pecas && r > .965) c = mezC(c, [16, 18, 24], .55);
      else if (r < .006) c = [214, 122, 52];   /* una brasa apagándose */
      const gr = .92 + .16 * hash2(x + 91, y + 57);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* chapa de nave: paneles con junta, remaches y mugre de polvo en las costuras */
function texMetal(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const px2 = x % 64, py = y % 48;
      /* CHAPA SUCIA, no aluminio pulido: con el gris claro original el cano y
         los tanques salian blancos como tubo de neon contra la ceniza negra. */
      let c = mezC([104, 104, 102], [82, 82, 82], fbmT(x / n, y / n, 5, 3));
      if (px2 < 2 || py < 2) c = [62, 63, 64];
      if ((px2 - 7) * (px2 - 7) + (py - 7) * (py - 7) < 4) c = [55, 56, 57];
      c = mezC(c, [104, 62, 34], .55 * fbmT(x / n + .3, y / n + .7, 7, 3) *
        fbmT(x / n, y / n, 3, 2));                 /* oxido y ceniza pegada */
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* celda fotovoltaica: azul profundo con retícula clara y reflejos */
function texPanel(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const cx = x % 42, cy2 = y % 42;
      let c = mezC([15, 27, 56], [34, 58, 104], fbmT(x / n, y / n, 6, 3));
      if (cx < 3 || cy2 < 3) c = [186, 194, 202];
      if (hash2(x + 3, y + 9) > .994) c = [130, 170, 230];
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* LAVA: corteza negra con una RED DE GRIETAS incandescentes. La misma imagen
   hace de map y de emissiveMap, así que la corteza queda apagada y sólo las
   vetas encienden (y encienden de verdad: pasan por ACES). */
function texLava(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const t = fbmT(x / n, y / n, 6, 4);
      const v = fbmT(x / n + .37, y / n + .81, 3, 4);
      let c = mezC([14, 9, 8], [52, 30, 24], t);            /* la corteza */
      const gr = Math.abs(v - .5);                          /* la red de grietas */
      if (gr < .108){                    /* ancha: a 200 m una grieta fina se
                                            comia el mip y el rio quedaba una raya */
        const k = 1 - gr / .108;
        /* el corazón de la grieta llega a AMARILLO, no a blanco: multiplicado
           por el emisivo naranja da roca fundida y no un tubo de neón */
        c = mezC(c, mezC([206, 58, 8], [255, 226, 146], k * k * k), Math.pow(k, .55));
      }
      if (hash2(x + 31, y + 17) > .996) c = [255, 196, 104];  /* chispas */
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* el CIELO cargado de ceniza (respaldo pintado: encima va cielo-volcan.jpg) */

/* ---------------- LA COLUMNA DEL CRÁTER -------------------------------------

const humoTex = (() => {

function pasoPluma(t, nocheK){
  const cy = POI.crater.h != null ? POI.crater.h : 96;
  for (let i = 0; i < PLUMA.length; i++){
    const sp = PLUMA[i];
    const u = (sp.userData.f + t * .0125) % 1;
    const desv = u * u * 90;                       /* el viento la tuerce */
    sp.position.set(CONO.x + desv + Math.sin(t * .21 + i) * 8 * u,
      cy + 18 + u * 240,
      CONO.z + Math.cos(t * .17 + i) * 26 * u - desv * .35);
    const sc = 54 + u * 210;
    sp.scale.set(sc, sc, 1);
    sp.material.opacity = Math.min(1, u / .09) * (1 - u) * (1 - u) * .85;
    /* abajo la ilumina la lava; arriba es ceniza gris */
    _colH.setRGB(.42, .17, .09).lerp(new T.Color(0x6b625d), Math.min(1, u * 1.9));
    sp.material.color.copy(_colH);
  }
  RESPLANDOR.position.set(CONO.x, cy + 44, CONO.z);
  RESPLANDOR.material.opacity = .16 + nocheK * .5;

/* LA CENIZA que cae y LAS BRASAS que suben: dos nubes de partículas que viajan
   con la cámara. La ceniza es gris y baja despacio meciéndose; las brasas son
   aditivas, suben y se apagan (y de noche son lo más lindo del mundo). */
function nubePuntos(N, alto, radio, col, tam, aditiva, op){
  const P = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    P[i*3] = rr(-radio, radio); P[i*3+1] = rr(0, alto); P[i*3+2] = rr(-radio, radio);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  const cv = document.createElement('canvas'); cv.width = cv.height = 16;
  const gc = cv.getContext('2d');
  const dd = gc.createRadialGradient(8, 8, 0, 8, 8, 8);
  dd.addColorStop(0, 'rgba(255,255,255,1)'); dd.addColorStop(1, 'rgba(255,255,255,0)');
  gc.fillStyle = dd; gc.fillRect(0, 0, 16, 16);
  const pts = new T.Points(g, new T.PointsMaterial({ size: tam, color: col,
    map: new T.CanvasTexture(cv), transparent: true, depthWrite: false,
    opacity: op, sizeAttenuation: true,
    blending: aditiva ? T.AdditiveBlending : T.NormalBlending }));
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
}
const CENIZA = nubePuntos(560, 34, 40, 0x8e837c, .26, false, .55);
const BRASAS = nubePuntos(200, 22, 30, 0xff8a34, .34, true, .9);
function pasoCeniza(dt){
  const Pa = CENIZA.geometry.attributes.position;
  for (let i = 0; i < Pa.count; i++){
    let y = Pa.array[i*3+1] - dt * (1.1 + (i % 5) * .22);
    if (y < 0) y += 34;
    Pa.array[i*3+1] = y;
    Pa.array[i*3] += Math.sin(t0 * .7 + i) * dt * .8;
    if (Pa.array[i*3] > 40) Pa.array[i*3] = -40;
    if (Pa.array[i*3] < -40) Pa.array[i*3] = 40;
  }
  Pa.needsUpdate = true;
  CENIZA.position.set(cam.position.x, cam.position.y - 16, cam.position.z);
  const Pb = BRASAS.geometry.attributes.position;
  for (let i = 0; i < Pb.count; i++){
    let y = Pb.array[i*3+1] + dt * (1.6 + (i % 4) * .5);
    if (y > 22){ y -= 22; Pb.array[i*3] = rr(-30, 30); Pb.array[i*3+2] = rr(-30, 30); }
    Pb.array[i*3+1] = y;
    Pb.array[i*3] += Math.sin(t0 * 1.7 + i * .7) * dt * 1.1;
  }
  Pb.needsUpdate = true;
  BRASAS.position.set(cam.position.x, cam.position.y - 3.4, cam.position.z);
  /* las brasas sólo tienen sentido donde hay lava: se apagan lejos del cono */
  const dc = Math.hypot(cam.position.x - CONO.x, cam.position.z - CONO.z);
  BRASAS.material.opacity = cl(1 - (dc - 120) / 260, 0, 1) * .95;
}

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = tierra del sendero · G = hojarasca bajo el bosque. Se pinta UNA vez en un
   canvas de 512: el sendero como trazo gordo entre los puntos de la historia,

const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{

  for (let i = 0; i < 900; i++){

  }

  for (const [w, c] of [[22, 'rgba(150,0,0,.6)'], [11, 'rgba(255,0,0,.9)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* claros pisados: el refugio, las fumarolas y el suelo del cráter */
  for (const k of ['refugio', 'geiseres', 'crater']){
    g.fillStyle = 'rgba(160,0,0,.5)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 12, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4
   texturas, pero con TODO el pipeline de three gratis — RECIBE las sombras del
   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo
   (antes el terreno y los árboles se iluminaban por recetas distintas y había
   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 5 }   /* parche de 5 m, no de 7 */,
  /* la ceniza volcánica REAL es casi negra (la foto del suelo mide ~40,36,32):
     tal cual, la mitad de abajo de la pantalla quedaba una mancha negra sin
     lectura y la bruma del horizonte se leía como una franja clara pegada.
     Este realce la sube a un gris basalto donde el grano SE VE, sin tocar el
     cielo (que va por backgroundIntensity) ni la lava (que es emisiva). */
  brillo: { value: 1.34 }
};
/* MeshSTANDARD, no Lambert: Lambert no tiene normalMap ni roughnessMap, y por
   eso los suelos se veian planos —peor que las texturas procedurales— aunque la
   foto de base fuera buena. Con Standard el relieve del normal agarra la luz del
   sol y el roughness decide donde brilla. El splat de cuatro capas no cambia: se
   inyecta en el mismo `map_fragment`, que existe igual en Standard. */
const matTerr = new T.MeshStandardMaterial({ map: TX.pasto,
  roughness: .92, metalness: 0 });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  /* en BAJOS el suelo va a un solo tap: cuatro muestras a pantalla llena es
     relleno de pixeles, que es justo lo que mata a un telefono de gama baja. */
  if (GFX === 'b') sh.defines = Object.assign({}, sh.defines, { SUELO_BARATO: '' });
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;
      /* ------------------- SUELO SIN CUADRICULA -------------------------
         Con una sola muestra a escala fija el mismo parche de 7 m se repite
         128 veces ALINEADO, y a media distancia se ven las bandas. Se mezclan
         DOS muestras a escalas que no son multiplos (1 y 0,37), una girada 90
         grados, con una mascara de ruido suave: el patron de una no coincide
         con el de la otra en ningun punto y la cuadricula deja de existir.
         Es la misma idea del «stochastic tiling», sin texturas de mas. */
      float h21_(vec2 p){ return fract(sin(dot(p, vec2(41.31, 289.07))) * 43758.5453); }
      vec2 h22_(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)),
                                               dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
      float ruido_(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h21_(i), h21_(i + vec2(1.0, 0.0)), f.x),
                   mix(h21_(i + vec2(0.0, 1.0)), h21_(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      /* ---- teselado ESTOCASTICO: cada celda con su origen y su angulo ----
         Antes se cruzaban dos muestras alineadas a los ejes con una mascara de
         frecuencia 3 sobre 900 m: constante en pantalla, o sea una sola muestra
         alineada, o sea la rejilla. Aqui cada celda del parche se lee con un
         desplazamiento y un giro sacados de su propia posicion, y las cuatro
         vecinas se cruzan con pesos bilineales al cubo. Sin periodo no hay
         rejilla que encontrar. */
      vec3 sinGrilla_(sampler2D t, vec2 uv, vec2 uvw){
        vec2 cel = floor(uv), f = fract(uv);
        #if defined(SUELO_BARATO)
          /* un solo tap: la celda le da el giro y el origen. No borra el patron
             tan bien como cuatro, pero lo desalinea, que es lo que se ve. */
          vec2 h = h22_(cel);
          float a = h.x * 6.2831853;
          mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
          return texture2D(t, R * (uv - cel - 0.5) + h).rgb;
        #else
          vec3 acc = vec3(0.0);
          float ws = 0.0;
          for (int j = 0; j < 2; j++){
            for (int i = 0; i < 2; i++){
              vec2 c = cel + vec2(float(i), float(j));
              vec2 h = h22_(c);
              float a = h.x * 6.2831853;
              mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
              float w = (1.0 - abs(f.x - float(i))) * (1.0 - abs(f.y - float(j)));
              w = w * w * w;
              acc += texture2D(t, R * (uv - c) + h).rgb * w;
              ws += w;
            }
          }
          return acc / max(ws, 1e-4);
        #endif
      }`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = sinGrilla_(map, uvT, vMapUv);
      c = mix(c, sinGrilla_(tHoja, uvT * 1.3, vMapUv + 0.41), clamp(spl.g * 1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT * 1.6).rgb, clamp(spl.r * 1.35, 0., 1.));
      c = mix(c, sinGrilla_(tRoca, uvT * .9, vMapUv + 0.77), vRocoso);
      /* la luz del suelo varia de a manchones grandes: sin esto, incluso sin
         cuadricula, todo el terreno se lee con el mismo brillo y parece mosaico */
      /* dos frecuencias: manchones grandes de luz Y variacion cercana. A 5,7 sobre
         el mapa entero era UN solo manchon y no rompia nada de lo que se ve. */
      c *= 0.86 + 0.20 * ruido_(vMapUv * 6.3) + 0.14 * ruido_(vMapUv * 71.0);
      diffuseColor.rgb *= c * brillo;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    scene.add(m);
    terrChunks.push(m);
  }
}

/* falda del horizonte: tapa la parte BAJA de la foto del cielo (que es oscura)
   con suelo que a esa distancia ya es color de niebla puro */
{
  /* EL MAR DE ÍGNEA. Con 1.150 m de radio, desde el balcón (ojo a 80 m) el borde
     de la falda caía 4,5° por debajo del horizonte y la pared que lo tapaba se
     leía como una LOSA gris plana comiéndose un cuarto de la pantalla. A 5.000 m
     el borde queda a 1°: la niebla lo aplasta contra el horizonte y lo que se ve
     es una línea de bruma sobre el mar, que es lo que corresponde a una isla. */
  const f = new T.Mesh(new T.CircleGeometry(5000, 48),
    new T.MeshLambertMaterial({ color: 0x564034 }));   /* color de NIEBLA, no de arena */
  f.rotation.x = -Math.PI / 2;
  f.position.y = -6;
  f.frustumCulled = false;
  scene.add(f);
  /* ISLOTES EN LA BRUMA: un anillo BAJO justo detrás de la costa. Cierra el
     último grado de cielo que le queda al mar y, sobre todo, le da al horizonte
     un perfil que no es una regla: se lee como los roques de la isla vecina.
     Bajo (+22, no +70) a propósito: alto era la losa que tapaba el mar. */
  const pared = new T.Mesh(new T.CylinderGeometry(1050, 700, 34, 26, 1, true),
    new T.MeshLambertMaterial({ color: 0x4c3428, side: T.BackSide }));
  pared.position.y = 5;          /* base -12, borde +22 */
  /* el borde de arriba ondula: sin esto el horizonte era un filo recto */
  {
    const P = pared.geometry.attributes.position;
    for (let i = 0; i < P.count; i++){
      if (P.getY(i) > 0) P.setY(i, P.getY(i) + (fbm(P.getX(i) * .004, P.getZ(i) * .004) - .5) * 26);
    }
    pared.geometry.computeVertexNormals();
  }
  pared.frustumCulled = false;
  scene.add(pared);
}
/* --------------------------- REMOLINOS DE CENIZA ---------------------------
   Tres tolvaneras de ceniza negra que vagan por la llanura: conos translúcidos
   con vetas grises, girando sobre sí mismos. En un mundo quieto, algo que se
   mueve en el horizonte cambia todo. */
const dustTex = lienzo(128, (g, n) => {
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 90; i++){
    g.strokeStyle = 'rgba(168,150,138,' + (.06 + rnd() * .12).toFixed(3) + ')';
    g.lineWidth = 1 + rnd() * 3;
    const x = rnd() * n;
    g.beginPath(); g.moveTo(x, 0);
    g.bezierCurveTo(x + 8, n * .3, x - 8, n * .6, x + rnd() * 10 - 5, n);
    g.stroke();
  }
});
const TOLVAS = [];
{
  const geoT = new T.CylinderGeometry(3.4, .6, 24, 10, 1, true);
  geoT.translate(0, 12, 0);
  for (let i = 0; i < 3; i++){
    const m = new T.Mesh(geoT, new T.MeshLambertMaterial({ map: dustTex,
      transparent: true, opacity: .13, side: T.DoubleSide, depthWrite: false }));
    m.userData = { cx: [250, -280, 60][i], cz: [230, 180, 320][i],
      R: 70 + i * 30, w: .05 + i * .013, f: i * 2.1 };
    scene.add(m);
    TOLVAS.push(m);
  }
}
function pasoTolvas(t){
  for (const m of TOLVAS){
    const u = m.userData;
    const x = u.cx + Math.cos(t * u.w + u.f) * u.R;
    const z = u.cz + Math.sin(t * u.w + u.f) * u.R;
    m.position.set(x, H(x, z) - .5, z);
    m.rotation.y = t * 5 + u.f;
    m.material.opacity = .08 + .06 * Math.abs(Math.sin(t * .3 + u.f));
  }
}

/* ------------- BASALTO + LAPILLI + OBSIDIANA -------------------------------
   Bloques de basalto asomando de la ceniza (con un talud más denso en los
   flancos del cono), piedritas de lapilli sin colisión, y racimos de agujas
   de OBSIDIANA pegados a las coladas, que devuelven el rojo de la lava. */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
const ARB = [];                                /* [x,z,r] choque */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (Math.hypot(x - p.x, z - p.z) < 16) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function geoRoca(sem, punta){
  const g = new T.SphereGeometry(1, 7, 5);
  const P = g.attributes.position, UV = g.attributes.uv;
  for (let i = 0; i < P.count; i++){
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const k = .6 + .62 * vnoise(x * 2.1 + sem, z * 2.1 + y * 1.3 + sem * 2);
    P.setXYZ(i, x * k, y * k * punta, z * k);
    UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
  }
  g.computeVertexNormals();
  return g;
}
/* ¿este punto cae en un cauce de lava? (con margen) */
function enLava(x, z, margen){
  for (const c of COLADAS){
    const dx = x - c.x, dz = z - c.z;
    const r = c.w * 1.8 + (margen || 0);
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}
/* ------------- MODELOS DEL REPO, CLONADOS EN MASA ---------------------------
   Nada de esto se genera: son GLB que ya viven en el repo (árboles, cajones,
   púas). Se carga UNO y se CLONA en cada punto; el clon se apoya solo en la
   ceniza. Ojo con los materiales del glTF: si traen emissive o specular el
   modelo sale BLANCO plano, hay que apagarlos a mano. (Y ojo con reliquia/obs-*:
   vienen comprimidos con DRACO y NO cargan con el GLTFLoader pelado.) */
function sembrarGLB(url, puntos, o){
  if (!GLTF || !puntos || !puntos.length) return;
  o = o || {};
  new GLTF().load(url, g => {
    const base = g.scene;
    base.traverse(n => { if (n.isMesh && n.material){
      const mm = n.material;
      if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
      mm.specularIntensity = 0;
      mm.metalness = 0;
      mm.envMapIntensity = .4;
      if (o.tinte && mm.color) mm.color.multiplyScalar(o.tinte);
      /* CENIZA: oscurecer con `tinte` no alcanza para el follaje de p-tree —
         un verde oscuro sigue siendo verde y en una isla de ceniza negra
         cantaba. Esto lo LLEVA hacia el color del polvo volcánico, así que
         las plantas quedan como matas grises tapadas de ceniza. */
      if (o.ceniza && mm.color) mm.color.lerp(new T.Color(o.ceniza[1]), o.ceniza[0]);
      /* SIN MAPA: el follaje de p-tree trae su verde en la TEXTURA, así que
         teñir `color` (que three multiplica por el mapa) lo oscurecía pero lo
         dejaba verde igual, y en una isla de ceniza cantaba a un kilómetro.
         Soltando el mapa quedan siluetas de mata gris tapada de ceniza. */
      if (o.sinMapa){ mm.map = null; mm.needsUpdate = true; }
      n.castShadow = !!o.sombra;
      n.receiveShadow = false;
      n.frustumCulled = false;
    } });
    base.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(base);
    for (const p of puntos){
      const m = base.clone(true);
      const e = (p[2] || 1) * (o.esc || 1);
      m.scale.setScalar(e);
      m.rotation.set(o.rx || 0, p[3] != null ? p[3] : rr(0, 6.28), o.rz || 0);
      m.position.set(p[0], H(p[0], p[1]) + (o.y || 0) - caja.min.y * e, p[1]);
      scene.add(m);
      window.__SEMBRADOS = (window.__SEMBRADOS || 0) + 1;
    }
  }, undefined, () => {});
}
function plantar(){
  const variantes = [geoRoca(3, .55), geoRoca(17, .72), geoRoca(41, .62), geoRoca(77, .9)];
  const posV = [[], [], [], []];
  const PASO_A = 15;
  const CTA = { tot: 0, dens: 0, camino: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-4, 4), z = gz + rr(-4, 4);
    let dens = vnoise(x * .011 + 60, z * .011 + 22);
    const dc = Math.hypot(x - CONO.x, z - CONO.z);
    /* el TALUD: la piedra se acumula en los flancos del cono */
    dens += .3 * Math.exp(-((dc - 200) * (dc - 200)) / (150 * 150));
    dens += .12 * cl((CONO.R - dc) / CONO.R, 0, 1);
    if (dens < .44){ CTA.dens++; continue; }
    if (dens < .56 && rnd() > (dens - .44) * 6){ CTA.dens++; continue; }
    if (molesta(x, z, 12)){ CTA.camino++; continue; }
    if (enLava(x, z, 6)){ CTA.camino++; continue; }
    const y = H(x, z);
    const pend = Math.max(Math.abs(H(x + 2, z) - y), Math.abs(H(x, z + 2) - y));
    if (pend > 2.3){ CTA.dens++; continue; }
    CTA.ok++;
    const sc = rr(.5, 3.1);
    posV[(rnd() * 4) | 0].push([x, y - sc * .18, z, sc]);
    if (sc > 1.4) ARB.push([x, z, sc * .8]);
  }
  const matRoca = new T.MeshLambertMaterial({ map: TX.roca });
  for (let v = 0; v < 4; v++){
    const arr = posV[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(variantes[v], matRoca, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(0, rr(0, 6.28), rr(-.1, .1)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.8, 1.15), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;
    scene.add(im);
  }
  /* LAPILLI: piedritas sin colisión ni sombra, puro detalle de la ceniza */
  const chico = new T.InstancedMesh(geoRoca(5, .5), matRoca, 620);
  for (let i = 0; i < 620; i++){
    const x = rr(-MITAD + 8, MITAD - 8), z = rr(-MITAD + 8, MITAD - 8);
    const sc = rr(.1, .38);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, H(x, z) - sc * .2, z), Q4, new T.Vector3(sc, sc, sc));
    chico.setMatrixAt(i, M4);
  }
  chico.frustumCulled = false;
  scene.add(chico);
  /* OBSIDIANA: racimos de agujas negras que devuelven el rojo de la lava.
     Van pegadas a las coladas (es donde el vidrio volcánico se forma). */
  const gObs = (() => {
    const conos = [];
    for (let k = 0; k < 3; k++){
      const g = new T.ConeGeometry(.2 + k * .06, 1.3 + k * .5, 4);
      g.rotateX(rr(-.28, .28)); g.rotateZ(rr(-.28, .28));
      g.translate(rr(-.3, .3), (1.3 + k * .5) / 2, rr(-.3, .3));
      conos.push(g);
    }
    return fusiona(conos);
  })();
  window.__CRISTAL_MAT = new T.MeshLambertMaterial({ color: 0x0f0c0e,
    emissive: 0x3c0a03, emissiveIntensity: .35 });
  const iObs = new T.InstancedMesh(gObs, window.__CRISTAL_MAT, 220);
  let nc = 0, itc = 0;
  while (nc < 220 && itc < 60000){
    itc++;
    const c = COLADAS[(rnd() * COLADAS.length) | 0];
    const a = rr(0, 6.283), R = c.w * 2.1 + rr(1, 26);
    const x = c.x + Math.cos(a) * R, z = c.z + Math.sin(a) * R;
    if (Math.abs(x) > MITAD - 10 || Math.abs(z) > MITAD - 10) continue;
    if (enLava(x, z, 1)) continue;
    if (molesta(x, z, 8)) continue;
    const sc = rr(.55, 2.2);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, H(x, z) - .12, z), Q4, new T.Vector3(sc, sc, sc));
    iObs.setMatrixAt(nc, M4);
    if (sc > 1.3) ARB.push([x, z, .95]);
    nc++;
  }
  iObs.count = nc;
  iObs.frustumCulled = false;
  iObs.castShadow = true;
  scene.add(iObs);
  window.__CRISTALES = nc;
  /* LO QUE DEJÓ LA ERUPCIÓN (GLB del repo, clonados):
       · púas de basalto clavadas en los bordes de las coladas
       · troncos calcinados en la llanura de ceniza
       · y al sur, donde la ceniza no llegó, EL VERDE que quedó vivo:
         cuatro docenas de árboles que hacen doler el contraste */
  const puas = [], quemados = [], vivos = [], cajones = [];
  for (let i = 0; i < 34; i++){
    const c = COLADAS[(rnd() * COLADAS.length) | 0];
    const a = rr(0, 6.283), R = c.w * 2.0 + rr(.5, 12);
    const x = c.x + Math.cos(a) * R, z = c.z + Math.sin(a) * R;
    if (enLava(x, z, 0) || molesta(x, z, 9)) continue;
    if (Math.abs(x) > MITAD - 14 || Math.abs(z) > MITAD - 14) continue;
    puas.push([x, z, rr(.8, 1.9)]);
    ARB.push([x, z, .8]);
  }
  for (let i = 0; i < 34; i++){
    const x = rr(-MITAD + 30, MITAD - 30), z = rr(-60, MITAD - 30);
    if (molesta(x, z, 11) || enLava(x, z, 12)) continue;
    quemados.push([x, z, rr(1.6, 3.2)]);
    ARB.push([x, z, .9]);
  }
  for (let i = 0; i < 26; i++){
    const x = rr(-MITAD + 20, MITAD - 20), z = rr(285, MITAD - 16);
    if (molesta(x, z, 10)) continue;
    vivos.push([x, z, rr(1.1, 2.1)]);
    ARB.push([x, z, .8]);
  }
  const cp = POI.refugio;
  for (const c of [[cp.x - 5, cp.z + 9, .95], [cp.x - 7, cp.z + 11, .8],
      [cp.x + 6, cp.z + 12, .9], [cp.x + 13, cp.z - 3, .85],
      [POI.geiseres.x - 9, POI.geiseres.z + 16, .9],
      [POI.vado.x + 6, POI.vado.z + 7, .8],
      [POI.mirador.x - 7, POI.mirador.z + 6, .95],
      [POI.crater.x - 11, POI.crater.z + 9, .85]]) cajones.push(c);
  /* los tres van SIN MAPA: los tres glTF traen verde de follaje en la textura y
     en la isla de ceniza saltaban a la vista incluso oscurecidos */
  sembrarGLB(AG('arcade/m-arena-pua.glb'), puas, { sombra: true, sinMapa: true,
    ceniza: [1, 0x322a26] });                         /* púas de escoria */
  /* era el low poly. Va el arbol seco del repo, que para quemados encaja. */
  sembrarGLB(AG('aero/tree.glb'), quemados, { sombra: true, sinMapa: true,
    ceniza: [1, 0x241d1a] });                         /* troncos carbonizados */
  sembrarGLB(AG('hyper/p-tree.glb'), vivos, { sombra: true, sinMapa: true,
    ceniza: [1, 0x4a4136] });                         /* matas grises de ceniza */
  sembrarGLB(AG('hyper/p-crate.glb'), cajones, { sombra: true, tinte: .62,
    ceniza: [.3, 0x2e2622] });
}
plantar();

/* ---------------- EL CAMPO DE FUMAROLAS ------------------------------------
   Nueve bocas de azufre en la loma de toba: conos bajos con la boca negra y una
   COLUMNA DE VAPOR que respira (borlas que suben y se abren). Al costado, el
   rover de la primera expedición, que no volvió a arrancar. Acá empieza la
   ruta del agua: el vapor de estas bocas es lo que llenan las cisternas. */
const GEISERES = [];
{
  const p = POI.geiseres;
  const matAz = new T.MeshLambertMaterial({ map: TX.azufre });
  const matOs = new T.MeshLambertMaterial({ map: TX.oscuro });
  for (let i = 0; i < 9; i++){
    const a = i / 9 * 6.283 + .4, R = 9 + (i % 3) * 9 + rr(-3, 3);
    const x = p.x + Math.cos(a) * R, z = p.z + Math.sin(a) * R;
    const y = H(x, z);
    const r0 = rr(1.2, 2.6);
    const cono = new T.Mesh(new T.ConeGeometry(r0, r0 * rr(.7, 1.2), 9, 1, true), matAz);
    cono.position.set(x, y + r0 * .35, z);
    cono.castShadow = cono.receiveShadow = true;
    scene.add(cono);
    const boca = new T.Mesh(new T.CircleGeometry(r0 * .45, 9), matOs);
    boca.rotation.x = -Math.PI / 2;
    boca.position.set(x, y + r0 * .78, z);
    scene.add(boca);
    ARB.push([x, z, r0 * .85]);
    const col = [];
    for (let k = 0; k < 3; k++){
      const sp = new T.Sprite(new T.SpriteMaterial({ map: humoTex, transparent: true,
        depthWrite: false, opacity: 0, color: 0xd6ccc4 }));
      sp.frustumCulled = false;
      scene.add(sp); col.push(sp);
    }
    GEISERES.push({ x, z, y: y + r0 * .8, col, f: rr(0, 6.28), alto: rr(10, 22) });
  }
  propGLB({ url: 'prop/rover-marte.glb', x: p.x - 13, z: p.z + 12, esc: 3.2, giro: .9,
    tinte: .74, ceniza: [.34, 0x342a25] });   /* el todoterreno de ASHA, cubierto de ceniza */
  ARB.push([p.x - 13, p.z + 12, 2.6]);
  ARB.push([p.x, p.z, 1.2]);
  window.__ROVER = GEISERES.length;
}
function pasoGeiseres(t){
  for (const G of GEISERES){
    for (let k = 0; k < 3; k++){
      const sp = G.col[k];
      const u = (t * .2 + G.f + k / 3) % 1;
      sp.position.set(G.x + Math.sin(t * .45 + G.f) * u * 2.6,
        G.y + u * G.alto, G.z + Math.cos(t * .38 + G.f) * u * 2.2);
      const sc = 3 + u * 12;
      sp.scale.set(sc, sc, 1);
      sp.material.opacity = Math.min(1, u / .1) * (1 - u) * (1 - u) * .85;
    }
  }
}
/* ---------------- EL REFUGIO: la Estación Brasa -----------------------------
   El módulo de la estación sobre su plataforma de basalto, el DEPÓSITO DE AGUA
   vacío (la razón de todo), la antena y la luz de la puerta, que se enciende

let ventanaMat = null;
{

/* ---------------- LOS TRES RÍOS DE LAVA -------------------------------------
   Una CINTA de geometría propia por río: el eje sigue los puntos de la colada y
   los bordes se abren con el ancho del cauce. La V de las UV crece cuesta
   abajo, así que al correr el mapa cada cuadro la lava BAJA de verdad.
   El material es un Lambert con emissiveMap (la MISMA imagen que el map): la
   corteza queda apagada y sólo las grietas encienden — y como es un material
   del pipeline de three, la lava lejana se va en la niebla como todo lo demás.
   Por la lava NO se camina: cada punto del cauce empuja al jugador (ARB). */
/* el color del EMISIVO es naranja, no blanco: con ACES un emisivo blanco por
   encima de 1 se va derecho al blanco de papel y los ríos se leían como cintas
   de tubo fluorescente. Tiñéndolo, el mismo brillo satura hacia el naranja de
   la roca fundida y sólo el corazón de la grieta llega a amarillo. */
const matLava = new T.MeshLambertMaterial({ map: TX.lava, emissiveMap: TX.lava,
  emissive: 0xff6a1c, emissiveIntensity: 2.15, color: 0x22140f,
  side: T.DoubleSide });
TX.lava.repeat.set(1, 1);
/* todas las texturas de lava del mundo: el bucle les corre el offset */
const LAVAS_TEX = [TX.lava];
const LUCES_LAVA = [];
{
  for (const rio of FLUJOS){
    const N = rio.length;
    const pos = [], uv = [], idx = [];
    let largo = 0;
    for (let i = 0; i < N; i++){
      const a = rio[Math.max(0, i - 1)], b = rio[Math.min(N - 1, i + 1)];
      let tx = b.x - a.x, tz = b.z - a.z;
      const dd = Math.hypot(tx, tz) || 1; tx /= dd; tz /= dd;
      const nx = -tz, nz = tx, w = rio[i].w * .8;
      if (i > 0) largo += Math.hypot(rio[i].x - rio[i-1].x, rio[i].z - rio[i-1].z);
      const yy = rio[i].y + 1.2;
      pos.push(rio[i].x + nx * w, yy, rio[i].z + nz * w);
      pos.push(rio[i].x - nx * w, yy, rio[i].z - nz * w);
      const v = largo / 13;
      uv.push(0, v, 1, v);
      if (i < N - 1){ const o = i * 2; idx.push(o, o + 2, o + 1, o + 1, o + 2, o + 3); }
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute('uv', new T.BufferAttribute(new Float32Array(uv), 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    const m = new T.Mesh(g, matLava);
    m.frustumCulled = false;
    scene.add(m);
    /* UNA luz por río, en el tramo bajo: es por donde pasa la senda y es lo
       que hace que la ceniza de alrededor se tiña de naranja */
    const c = rio[Math.floor(N * .72)];
    const luz = new T.PointLight(0xff5a1c, 34, 120, 1.7);
    luz.position.set(c.x, c.y + 6, c.z);
    scene.add(luz);
    LUCES_LAVA.push(luz);
  }
  /* por la lava no se pasa */
  for (const c of COLADAS) ARB.push([c.x, c.z, c.w * .78]);
}
/* ---------------- EL CRÁTER Y LA FISURA -------------------------------------
   El suelo del cráter (ya allanado), el LAGO de lava a un costado (no se pisa),
   y LA FISURA: una grieta de 44 m que late. Al lado, el SELLADOR (el módulo que
   inyecta el agua de las cisternas) y su tablero, que es lo que se USA.
   Sellarla apaga la grieta de verdad: la lava se vuelve obsidiana, la luz se

let beaconMat = null, fisuraMat = null, luzFisura = null;
const VAPOR_SELLO = [];
{
  const p = POI.crater, y = H(p.x, p.z);

  const texLago = TX.lava.clone();

  const matLago = new T.MeshLambertMaterial({ map: texLago, emissiveMap: texLago,
    emissive: 0xff7326, emissiveIntensity: 1.95, color: 0x22140f });
  const lx = p.x + 27, lz = p.z - 9;

  lago.rotation.x = -Math.PI / 2;
  lago.position.set(lx, H(lx, lz) + .55, lz);
  scene.add(lago);
  for (let i = 0; i < 12; i++){
    const a = i / 12 * 6.283;
    ARB.push([lx + Math.cos(a) * 18.5, lz + Math.sin(a) * 18.5, 5.4]);
  }
  const luzLago = new T.PointLight(0xff6a20, 34, 120, 1.7);
  luzLago.position.set(lx, H(lx, lz) + 7, lz);
  scene.add(luzLago);
  LUCES_LAVA.push(luzLago);
  /* LA FISURA: una cinta angosta que sigue el suelo del cráter */
  /* la fisura es lo MÁS caliente del mundo: su naranja tira a amarillo */
  fisuraMat = new T.MeshLambertMaterial({ map: TX.lava, emissiveMap: TX.lava,
    emissive: 0xffa440, emissiveIntensity: 2.7, color: 0x1a0f0c,
    side: T.DoubleSide });
  {
    const pos = [], uv = [], idx = [];
    const NF = 14;
    for (let i = 0; i <= NF; i++){
      const t = i / NF;
      const fx = p.x - 21 + t * 42, fz = p.z + 15 - t * 25;
      const w = 1.5 + Math.sin(t * 3.14) * 1.5;
      pos.push(fx, H(fx, fz + w) + .22, fz + w);
      pos.push(fx, H(fx, fz - w) + .22, fz - w);
      uv.push(0, t * 3.4, 1, t * 3.4);
      if (i < NF){ const o = i * 2; idx.push(o, o + 2, o + 1, o + 1, o + 2, o + 3); }
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute('uv', new T.BufferAttribute(new Float32Array(uv), 2));

    const m = new T.Mesh(g, fisuraMat);
    m.frustumCulled = false;
    scene.add(m);
  }
  luzFisura = new T.PointLight(0xff7a2a, 46, 110, 1.6);

  /* EL SELLADOR: el módulo que inyecta el agua, y su tablero (el USAR) */
  const cuerpoSel = new T.Mesh(new T.BoxGeometry(3.2, 2.2, 2.6), matMet);
  cuerpoSel.position.set(p.x - 9, y + 1.2, p.z - 8);

  /* el caño que baja a la grieta */
  const cano = new T.Mesh(new T.CylinderGeometry(.22, .22, 11, 7), matMet);
  cano.rotation.z = 1.1;
  cano.position.set(p.x - 4.4, y + 1.4, p.z - 5.4);
  cano.castShadow = true;
  scene.add(cano);
  propGLB({ url: 'prop/modulo-luna.glb', x: p.x - 9, z: p.z - 8, esc: 3.4,
    giro: 2.2, ocultar: [cuerpoSel], tinte: .58, ceniza: [.46, 0x2c2521] });
  const tab = new T.Mesh(new T.BoxGeometry(.9, 1.2, .4), matMet);
  tab.position.set(p.x - 5.4, y + .6, p.z - 9.4);
  tab.rotation.y = .5;
  tab.castShadow = true;
  scene.add(tab);
  const panel = new T.Mesh(new T.PlaneGeometry(.7, .5),
    new T.MeshBasicMaterial({ map: TX.panel }));
  panel.position.set(p.x - 5.4 + Math.sin(.5) * .22, y + .95, p.z - 9.4 + Math.cos(.5) * .22);
  panel.rotation.set(-.5, .5, 0);
  scene.add(panel);
  ARB.push([p.x - 9, p.z - 8, 2.4]);
  ARB.push([p.x - 5.4, p.z - 9.4, .8]);
  /* el vapor del sellado: seis borlas guardadas, apagadas hasta que se sella */
  for (let i = 0; i < 6; i++){
    const sp = new T.Sprite(new T.SpriteMaterial({ map: humoTex, transparent: true,
      depthWrite: false, opacity: 0, color: 0xe8e2dc }));
    sp.frustumCulled = false;
    scene.add(sp);
    VAPOR_SELLO.push(sp);
  }
  window.__PANELES = 4;
}
let tSello = -1;                    /* >=0 mientras sube el vapor del sellado */
function sellarFisura(){
  if (tSello >= 0) return;
  tSello = 0;
  fisuraMat.emissiveIntensity = 0;
  fisuraMat.color.setHex(0x100c0d);      /* obsidiana */
  fisuraMat.needsUpdate = true;
  luzFisura.intensity = 0;
  if (typeof siseo === 'function') siseo();
}
function pasoSello(dt){
  if (tSello < 0) return;
  tSello += dt;
  const p = POI.crater, y = H(p.x, p.z);
  for (let i = 0; i < VAPOR_SELLO.length; i++){
    const sp = VAPOR_SELLO[i];
    const u = cl((tSello - i * .45) / 7, 0, 1);
    const t2 = i / VAPOR_SELLO.length;
    sp.position.set(p.x - 21 + t2 * 42, y + 2 + u * 90, p.z + 15 - t2 * 25);
    const sc = 8 + u * 60;
    sp.scale.set(sc, sc, 1);
    sp.material.opacity = u <= 0 ? 0 : Math.min(1, u / .12) * (1 - u) * (1 - u) * 1.5;
  }
}

let luci = null, luci0 = null;
{
  const NL = 90, P = new Float32Array(NL * 3), C = new Float32Array(NL * 3);
  const c = new T.Color();
  const a = POI.mirador, b = POI.crater;
  for (let i = 0; i < NL; i++){
    const t = i / NL;
    const x = a.x + (b.x - a.x) * t + rr(-14, 14);
    const z = a.z + (b.z - a.z) * t + rr(-14, 14);
    P[i*3] = x; P[i*3+1] = H(x, z) + rr(1, 4); P[i*3+2] = z;
    c.setHSL(.035 + rnd() * .05, .95, .62);
    C[i*3] = c.r; C[i*3+1] = c.g; C[i*3+2] = c.b;
  }
  luci0 = Float32Array.from(P);
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('color', new T.BufferAttribute(C, 3));
  const cn = document.createElement('canvas'); cn.width = cn.height = 32;
  const g2 = cn.getContext('2d');
  const d = g2.createRadialGradient(16,16,0,16,16,16);
  d.addColorStop(0,'rgba(255,255,255,1)'); d.addColorStop(1,'rgba(255,255,255,0)');
  g2.fillStyle = d; g2.fillRect(0,0,32,32);
  luci = new T.Points(g, new T.PointsMaterial({ size: .8, map: new T.CanvasTexture(cn),
    vertexColors: true, transparent: true, blending: T.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true }));
  luci.visible = false;
  scene.add(luci);
}

const LUZCAP = [

function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* el ATARDECER AZUL: el halo del sol vira del caramelo al azul al caer */
  glare.material.color.set(0xfff0dc).lerp(AZUL_OCASO, cl(1 - SOLD.y * 2.4, 0, 1));
  /* la ventana de la cabaña se enciende sola cuando oscurece, y VUELCA luz */
  if (ventanaMat){
    const osc = cl(1 - (SOLD.y * 420) / 160, 0, 1);
    ventanaMat.color.setRGB(.35 + .65 * osc, .29 + .55 * osc, .2 + .28 * osc);
    focoCasa.intensity = osc * osc * 60;
  }
}
/* el texto se PARTE EN PAGINAS por parrafo: antes entraba entero en un solo
   cuadro que ocupaba media pantalla en medio de la cara. Cada pagina se escribe
   letra por letra; SIGUIENTE completa si esta escribiendo, pasa de pagina si
   quedan, y recien cierra en la ultima. */
let _dlgTim = null, _dlgFull = '', _dlgPags = [], _dlgP = 0, _dlgCerrar = null;
function _dlgPinta(){
  const txt = _dlgPags[_dlgP] || '';
  if (_dlgTim) clearInterval(_dlgTim);
  _dlgFull = txt;
  let i = 0;
  $('dlgB').textContent = '';
  _dlgTim = setInterval(() => {
    i += 2;
    $('dlgB').textContent = _dlgFull.slice(0, i);
    if (i >= _dlgFull.length){ clearInterval(_dlgTim); _dlgTim = null; }
  }, 16);
  const hay = _dlgPags.length > 1;
  $('dlgPag').textContent = hay ? (_dlgP + 1) + '/' + _dlgPags.length : '';
  $('dlgGo').textContent = (_dlgP < _dlgPags.length - 1) ? Tx('dlgMas') : Tx('dlgGo');
}
function dialogo(titulo, cuerpo, alCerrar, cara, retrato){
  enDlg = true;
  $('dlgT').textContent = titulo;
  const img = $('dlgFoto'), cv = $('dlgCara');
  if (retrato){
    img.src = retrato; img.classList.add('on'); cv.classList.remove('on');
  } else if (cara){
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 192, 256);
    g.save(); g.translate(0, 24); cara(g, 192); g.restore();
    cv.classList.add('on'); img.classList.remove('on');
  } else { cv.classList.remove('on'); img.classList.remove('on'); }
  /* partir por parrafo; si un parrafo es larguisimo se corta por oracion */
  _dlgPags = [];
  for (const par of String(cuerpo).split(/\n\s*\n/)){
    const p = par.trim();
    if (!p) continue;
    if (p.length <= 185){ _dlgPags.push(p); continue; }
    let acc = '';
    for (const or of p.split(/(?<=[.!?»])\s+/)){
      if ((acc + ' ' + or).trim().length > 185 && acc){ _dlgPags.push(acc.trim()); acc = or; }
      else acc = (acc + ' ' + or).trim();
    }
    if (acc) _dlgPags.push(acc);
  }
  if (!_dlgPags.length) _dlgPags = [''];
  _dlgP = 0; _dlgCerrar = alCerrar || null;
  _dlgPinta();
  $('dlg').classList.add('on');
  document.body.classList.add('hablando');
  $('dlgGo').onclick = () => {
    if (_dlgTim){                                  /* escribiendo: completar */
      clearInterval(_dlgTim); _dlgTim = null;
      $('dlgB').textContent = _dlgFull;
      return;
    }
    if (_dlgP < _dlgPags.length - 1){ _dlgP++; _dlgPinta(); return; }
    $('dlg').classList.remove('on');
    document.body.classList.remove('hablando');
    enDlg = false;
    const f = _dlgCerrar; _dlgCerrar = null;
    if (f) f();
  };
}
