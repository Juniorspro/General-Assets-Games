<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1c1006"/>
<title>CAÑÓN</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#180b06;color:#f5efe9;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(26,11,6,.62);border:1px solid rgba(255,195,150,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#ffe9d6}
  #objD{font-size:11.5px;color:#d8a887;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#f2c9a4;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  #btns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;
    gap:9px;align-items:flex-end;pointer-events:auto}
  .b{min-width:86px;text-align:center;padding:12px 15px;border-radius:14px;font-weight:800;
    font-size:13px;background:rgba(32,13,8,.62);border:1.5px solid rgba(255,195,150,.4);
    color:#ffe9d6;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  .b.usar{background:rgba(160,72,30,.78);border-color:#ffd2a0;font-size:15px;display:none}
  .b.usar.on{display:block}
  .b.corre.on{background:rgba(160,72,30,.78)}
  /* ------------------------ JOYSTICK Y SALTO (TACTIL) ---------------------
     Antes el medio izquierdo de la pantalla era una zona invisible de arrastre:
     nadie sabia donde tocar. Ahora hay una PALANCA dibujada, con el estilo del
     mundo, y un boton de SALTO. La palanca del todo hacia ARRIBA = correr. */
  #joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(150px,32vw);aspect-ratio:1;pointer-events:auto;touch-action:none;
    opacity:.9;transition:opacity .25s}
  /* La palanca y el salto se esconden SOLO si el aparato no tiene tactil.
     Antes se escondian al detectar mouse/teclado (body.pc), y en un portatil
     tactil o en un celular que se declara «pointer:fine» el jugador se quedaba
     sin ningun control: el joystick recien aparecia DESPUES del primer toque,
     y ese primer toque no hacia nada. La ayuda de teclado sigue saliendo
     igual: tener las dos cosas a la vez no molesta. */
  body.sinTactil #joy,body.sinTactil #bSalta{display:none}
  #joy canvas{width:100%;height:100%;display:block}
  #bSalta{position:absolute;right:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(84px,19vw);aspect-ratio:1;border-radius:50%;pointer-events:auto;
    touch-action:none;display:grid;place-items:center;font-weight:900;
    font-size:11px;letter-spacing:.1em;cursor:pointer;
    background:rgba(0,0,0,.42);border:2px solid #e8a068;color:#ffdcb8;
    box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
  #bSalta:active{transform:translateY(2px) scale(.96);filter:brightness(1.35)}
  #bSalta span{display:block;font-size:24px;line-height:1}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#dfeecd;
    background:rgba(24,10,6,.5);border:1px solid rgba(190,230,180,.26);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(190,230,180,.16);border:1px solid rgba(190,230,180,.3);color:#ffe9d6}
  /* ------------------------- DIALOGO CON RETRATO --------------------------
     El RETRATO GENERADO va a la IZQUIERDA, pegado al piso de la pantalla, y de
     el sale un GLOBO CUADRADO con lo que dice el personaje. En apaisado van
     lado a lado; en pantallas angostas el globo se mete abajo del retrato pero
     el pico sigue apuntando a la cara. */
  #dlg{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);
    width:min(700px,95vw);display:none;pointer-events:auto;
    align-items:flex-end;gap:0}
  #dlg.on{display:flex}
  /* el retrato: imagen generada, recortada de abajo con un degrade para que
     no quede el corte duro del PNG contra el paisaje */
  #dlgFoto{width:min(150px,26vw);aspect-ratio:3/4;flex:0 0 auto;object-fit:cover;
    object-position:50% 12%;border-radius:14px 14px 6px 6px;
    border:1.5px solid rgba(255,195,150,.35);
    box-shadow:0 10px 28px rgba(0,0,0,.6);background:rgba(24,10,6,.88);display:none}
  #dlgFoto.on{display:block}
  #dlgCara{width:min(150px,26vw);aspect-ratio:3/4;flex:0 0 auto;border-radius:14px 14px 6px 6px;
    border:1.5px solid rgba(255,195,150,.35);background:rgba(24,10,6,.88);display:none;
    box-shadow:0 10px 28px rgba(0,0,0,.6);object-fit:cover}
  #dlgCara.on{display:block}
  /* EL GLOBO: cuadrado, con el pico apuntando al retrato */
  #dlgGlobo{position:relative;flex:1 1 auto;min-width:0;margin-left:14px;
    background:rgba(24,10,6,.88);border:1.6px solid rgba(255,195,150,.35);
    border-radius:4px;padding:13px 15px 11px;backdrop-filter:blur(7px);
    box-shadow:0 10px 30px rgba(0,0,0,.55)}
  /* el pico: dos triangulos superpuestos (borde + relleno) */
  #dlgGlobo::before,#dlgGlobo::after{content:'';position:absolute;left:-11px;top:22px;
    width:0;height:0;border:11px solid transparent}
  #dlgGlobo::before{border-right-color:rgba(255,195,150,.35)}
  #dlgGlobo::after{left:-9px;border-right-color:rgba(24,10,6,.88)}
  #dlgT{font-weight:900;letter-spacing:.06em;color:#f2c9a4;font-size:12.5px;margin-bottom:6px}
  #dlgB{font-size:14.5px;line-height:1.5;color:#f5efe9;white-space:pre-wrap;min-height:3.6em}
  #dlgGo{margin-top:10px;margin-left:auto;width:fit-content;padding:9px 20px;border-radius:8px;
    font-weight:800;font-size:12.5px;letter-spacing:.08em;
    background:linear-gradient(180deg,#c26327,#7c3a14);border:1px solid #ffd2a0;cursor:pointer}
  @media (max-aspect-ratio:1/1){
    #dlg{flex-wrap:wrap;width:min(560px,96vw)}
    #dlgGlobo{flex-basis:100%;margin:-6px 0 0 22px}
    #dlgGlobo::before,#dlgGlobo::after{left:26px;top:-11px;border-right-color:transparent}
    #dlgGlobo::before{border-bottom-color:rgba(255,195,150,.35)}
    #dlgGlobo::after{left:28px;top:-9px;border-bottom-color:rgba(24,10,6,.88)}
  }
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#e8b48c;
    background:rgba(24,10,6,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(255,195,150,.4);background:#0006}
  #dlgCara.on{display:block}

  /* contador de RECOLECCION: va debajo del objetivo, con su propio icono */
  #recol{position:absolute;left:12px;top:calc(10px + 4.6em);pointer-events:none;
    display:none;font:800 12.5px/1 ui-sans-serif,system-ui,sans-serif;
    padding:6px 9px;border-radius:9px;letter-spacing:.05em;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,195,150,.35);color:#f2c9a4;
    backdrop-filter:blur(4px)}
  #recol.on{display:block}
  #recol.lleno{border-color:#f2c9a4;box-shadow:0 0 14px -2px #f2c9a4}
  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(18,8,5,.16) 0%,rgba(18,8,5,.34) 55%,rgba(15,7,4,.72) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#fff7e2,#d8963c);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#c69a7c;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#ffe9d6;
    background:rgba(52,22,12,.8);border:1.5px solid rgba(255,195,150,.4)}
  .mbtn.go{background:linear-gradient(180deg,#c26327,#7c3a14);border-color:#ffd2a0}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#e8a24e;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#c69a7c;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(30,13,8,.72);border:1.5px solid rgba(255,195,150,.35);color:#e8c8ae}
  .chip.on{background:linear-gradient(180deg,#c26327,#7c3a14);border-color:#ffd2a0;color:#fff3e6}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#180b06;color:#c69a7c;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
    <div class="b" id="bSon">🔊</div>
    <div class="b corre" id="bCorre">CORRER</div>
    <div class="b" id="bMenu">MENÚ</div>
  </div>
  <div id="dlg"><img id="dlgFoto" alt=""><canvas id="dlgCara" width="192" height="256"></canvas><div id="dlgGlobo"><div id="dlgT"></div><div id="dlgB"></div><div id="dlgGo">SIGUIENTE ▸</div></div></div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
  <div id="bSalta"><span>⤒</span>SALTO</div>
  <div id="recol"></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <h1>CAÑÓN</h1>
  <div class="sub">el cañón rojo · bajar al río y encontrar el paso</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>
  <div class="fila" id="fLang">
    <div class="chip" data-l="es">ESPAÑOL</div>
    <div class="chip" data-l="en">ENGLISH</div>
    <div class="chip" data-l="pt">PORTUGUÊS</div>
  </div>
  <div class="filaT" id="tGfx">GRÁFICOS</div>
  <div class="fila" id="fGfx">
    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">CARGANDO CAÑÓN…</div>

<script>
/* ============================================================================
   DUNAS — modo historia en primera persona sobre el motor de SENDA. Un mar de
   dunas al atardecer dorado: 900 x 900 m de arena esculpida por CRESTAS
   TRANSVERSALES asimétricas (barlovento largo y manso, sotavento corto y
   filoso, como las dunas de verdad) que meandrean con un FBM lento, más las
   grandes olas de fondo, la HOYA del oasis y la DUNA MADRE de la cresta final.

   HISTORIA (6 capítulos, ES/EN/PT): sos SIRA, la zahorí de la caravana de
   Ammar — la que escucha el agua debajo de la arena. Te quedaste atrás y la
   caravana se fue. Quedan las SEÑALES: mojón → campamento vacío → ruinas
   enterradas → el oasis seco → destapar el pozo → la hoguera de la cresta.
   MISIÓN PROPIA: seguir las señales de la caravana y destapar el pozo del
   oasis (tres montones de arena con el botón USAR, después la manivela).

   GOTY: sombras PCF que viajan con el jugador, ACES con exposición por
   capítulo, el sol que rueda del oro al crepúsculo violeta capítulo a capítulo,
   la luna y las estrellas al caer la noche, agua que SUBE del pozo reflejando
   el cielo por PMREM, banderas de lona que ondean por vértice, remolinos de
   arena vagando por la llanura, la hoguera final con los faroles de la
   caravana apareciendo en la arena, y un ambiente sonoro sintetizado (viento
   con ráfagas, siseo de arena bajo las botas, el agua del pozo posicional y la
   campanilla de bronce de las mulas) por debajo de la música generada.
   ========================================================================== */
(async () => {
'use strict';
const Q = new URLSearchParams(location.search);
const LOC = Q.has('local');
/* CERO descargas de assets: todas las texturas se pintan al vuelo.
   Lo único que llega de la red es three.js. */
/* assets compartidos de los mundos hermanos (cielos, modelos 3D, audio). Se
   define acá arriba —antes del armado del mundo— porque los mk_*.py insertan
   propGLB()/AX() en el cuerpo del build, que corre mucho antes. */
const HASHAX = 'fb644fc';       /* assets COMPARTIDOS, ya publicados */
/* los assets NUEVOS de DUNAS (cielo, musica, ambiente, texturas del suelo) se
   commitean junto con este HTML, asi que todavia no existen en el hash de
   arriba: se sirven por rama. Al publicar, cambia esto por el hash corto del
   commit y quedan clavados como el resto. */
const HASHMIO = 'main';
const MIOS = /^(cielo|mus|amb|tex)-canon|^retrato\/|^img\/canon|^prop\/canon|^veg\//;
const AX = f => (LOC ? '/assets/mundos/'
  : 'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@'
    + (MIOS.test(f) ? HASHMIO : HASHAX) + '/assets/mundos/') + f;
/* los modelos compartidos que NO viven en assets/mundos (g3, hyper, reliquia)
   se resuelven con el MISMO hash, un nivel más arriba */
const AG = f => (LOC ? '/assets/'
  : 'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@' + HASHAX + '/assets/') + f;
const TRE = LOC ? '/_vthree/build/three.module.js'
  : 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* importmap ANTES de cargar GLTFLoader (que importa 'three' por specifier).
   Se inyecta al vuelo: el import de three es por URL absoluta, así que no lo
   afecta, y el mapa resuelve el 'three' de GLTFLoader al MISMO módulo. */
{
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: TRE } });
  document.head.appendChild(im);
}
const T = await import(TRE);
/* GLTFLoader para los personajes 3D generados (riggeados + animados). Si por
   lo que sea no carga, GLTF queda null y todo cae al personaje procedural. */
let GLTF = null;
try {
  const GLU = LOC ? '/_vthree/examples/jsm/loaders/GLTFLoader.js'
    : 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
  GLTF = (await import(GLU)).GLTFLoader;
} catch (e) {}
const $ = i => document.getElementById(i);

/* ---------------- azar reproducible: el mar de dunas es SIEMPRE el mismo --- */
let _s = 20281107;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- terreno: ruido de valor FBM, determinista ---------------- */
const MAPA = 900, MITAD = MAPA / 2;
function hash2(i, j){
  /* Math.imul, no `*`: en JS el producto de enteros grandes se hace float y
     PIERDE los bits bajos (>2^53) — el hash quedaba sesgado hacia abajo y el
     ruido casi nunca pasaba de 0,36. */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260801;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* PUNTOS DE LA HISTORIA (fijos, la arena se allana alrededor).
   `pr` = radio de la explanada que el terreno abre en ese punto. */
const POI = {
  /* LUGARES PROPIOS de este mundo: el recorrido no se parece al de
     los hermanos. Las seis primeras claves son las del guion; las de abajo
     son lugares de mas, para que haya adonde desviarse. */
  inicio:     { x:  -330, z:   366, pr: 20 },
  mojon:      { x:  -208, z:   250, pr: 18 },
  campamento: { x:   -64, z:   176, pr: 26 },
  ruinas:     { x:    36, z:    44, pr: 30 },
  oasis:      { x:   -58, z:  -104, pr: 34 },
  cresta:     { x:   206, z:  -300, pr: 26 },
  mirador:    { x:   262, z:   120, pr: 20 },   /* el balcón de piedra */
  cueva:      { x:  -170, z:     8, pr: 16 },   /* la cueva de las manos */
  vado:       { x:    -6, z:  -224, pr: 22 },   /* el vado del río */
  agujas:     { x:   300, z:    30, pr: 18 }   /* las agujas rojas */
};
/* EL VIENTO manda en este mundo: fija el rumbo de las crestas (perpendicular),
   la dirección de los velos de arena y hacia dónde miran las caras de sotavento. */
const VIENTO = -0.62;
const _cw = Math.cos(VIENTO), _sw = Math.sin(VIENTO);
/* DUNAS TRANSVERSALES: el perfil de una duna real es ASIMÉTRICO — barlovento
   largo y manso (la arena sube rodando), sotavento corto y filoso (la arena cae
   por avalancha). Se calcula con una fase `u` que además MEANDREA con un FBM
   lento, así las crestas se sueldan y se rompen en vez de ser un serrucho. */
function crestaDuna(x, z){
  const u = (x * _cw - z * _sw) / 132 + fbm(x * .0042 + 7, z * .0042 + 29) * 1.9;
  const s = u - Math.floor(u);
  return s < .72 ? Math.pow(s / .72, 1.75) : 1 - (s - .72) / .28;
}
function alturaBaseRef(x, z){ return fbm(x * .003 + 11, z * .003 + 23) * 26; }
function alturaBase(x, z){
  let h = 26 + fbm(x * .0026 + 13, z * .0026 + 51) * 16;        /* la meseta alta */
  /* EL CAÑÓN: una garganta que cruza el mapa; el fondo es casi plano (el río) */
  const eje = (x * .78 + z * .62) / 1.0;                        /* rumbo del cañón */
  const g = Math.abs(eje) / 96;                                 /* 0 en el eje */
  const corte = Math.exp(-g * g * 2.4);
  h -= 52 * corte;
  h += fbm(x * .011 + 71, z * .011 + 5) * 5.5 * (1 - corte * .7); /* escalones */
  /* terrazas: la roca sedimentaria sube en peldaños */
  h = Math.floor(h / 6.5) * 6.5 + (h % 6.5) * .35;
  /* arcos y agujas cerca de las ruinas */
  const dR = Math.hypot(x - POI.ruinas.x, z - POI.ruinas.z);
  h += 16 * Math.exp(-(dR * dR) / (70 * 70));
  const dC = Math.hypot(x - POI.cresta.x, z - POI.cresta.z);
  h += 22 * Math.exp(-(dC * dC) / (130 * 130));                 /* el mirador */
  return h;
}
/* Solo los lugares del GUION allanan el terreno: ahi se apoya lo construido.
   Los lugares extra son referencias del paisaje y no necesitan explanada, y
   meterlos aca encarecia H() —que corre por vertice del terreno y varias veces
   por frame— sin que se notara la diferencia. */
const POI_LLANO = ['inicio', 'mojon', 'campamento', 'ruinas', 'oasis', 'cresta']
  .filter(k => POI[k]);
function H(x, z){
  let h = alturaBase(x, z);
  /* allanar alrededor de cada punto de la historia (mezcla suave): en la arena
     nada se apoya derecho si el suelo ondula bajo los cimientos */
  for (const k of POI_LLANO){
    const p = POI[k], R = p.pr || 26;
    const d = Math.hypot(x - p.x, z - p.z);
    const w = Math.exp(-(d * d) / (R * R));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* la SENDA: la huella de la caravana, apenas marcada, que el viento se está
   comiendo. Curva como en SENDA (bezier con el punto medio corrido). */
const SENDA = [POI.inicio, POI.mojon, POI.campamento, POI.ruinas, POI.oasis, POI.cresta];
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 9.7, i * 3.1) - .5) * 90;
  const mz = (a.z + b.z) / 2 + (fbm(i * 4.3, i * 8.9) - .5) * 90;
  const seg = [];
  for (let k = 0; k <= 24; k++){
    const t = k / 24, u = 1 - t;
    const P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
for (const k in POI) POI[k].h = alturaBase(POI[k].x, POI[k].z);


/* ==================== TEXTURAS PROCEDURALES (canvas) ========================
   No hay créditos de generación: acá TODO se PINTA. Cada textura es un canvas
   con ruido FBM azulejable (retícula en módulo, del mismo motor del terreno),
   así que empalman sin costura y no pesan un byte de descarga. */
const lienzo = (n, fn) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const valT = (x, y, per) => {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
  const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
  return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
};
const fbmT = (x, y, per, oct) => {
  let v = 0, amp = .55, p = per;
  for (let o = 0; o < oct; o++){ v += amp * valT(x * p, y * p, p); amp *= .5; p *= 2; }
  return cl(v, 0, 1);
};
const mezC = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
/* suelo genérico: dos colores por FBM + pecas (piedritas y chispas de polvo)
   + rayas de duna opcionales (ondas de arena talladas por el viento) */
function texSuelo(n, colA, colB, pecas, rayas){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      let t = fbmT(x / n, y / n, 6, 4);
      if (rayas){
        const w = Math.sin((y / n * 18 + fbmT(x / n, y / n, 5, 3) * 2.6) * 6.283);
        t = cl(t * .55 + .45 * (.5 + .5 * w), 0, 1);
      }
      let c = mezC(colA, colB, t);
      const r = hash2(x + 7, y + 13);
      if (pecas && r > .965) c = mezC(c, [30, 20, 16], .55);
      else if (pecas && r < .018) c = mezC(c, [255, 232, 205], .3);
      const gr = .92 + .16 * hash2(x + 91, y + 57);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* chapa de nave: paneles con junta, remaches y mugre de polvo en las costuras */
function texMetal(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const px2 = x % 64, py = y % 48;
      let c = mezC([196, 202, 206], [166, 174, 181], fbmT(x / n, y / n, 5, 3));
      if (px2 < 2 || py < 2) c = [118, 126, 133];
      if ((px2 - 7) * (px2 - 7) + (py - 7) * (py - 7) < 4) c = [108, 116, 123];
      c = mezC(c, [152, 96, 58], .4 * fbmT(x / n + .3, y / n + .7, 7, 3) *
        fbmT(x / n, y / n, 3, 2));
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* LONA de la caravana: tejido crudo con franjas teñidas de rojo tierra */
function texTela(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    const banda = n / 8;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      let c = mezC([216, 178, 126], [188, 144, 96], fbmT(x / n, y / n, 7, 3));
      if (Math.floor(y / banda) % 2) c = mezC(c, [152, 76, 50], .5);
      if ((y % banda) < 2) c = mezC(c, [110, 64, 42], .55);
      /* la trama: hilos cruzados apenas más claros */
      if ((x + y) % 6 === 0) c = mezC(c, [245, 226, 196], .18);
      const gr = .93 + .14 * hash2(x + 5, y + 11);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* EL AGUA del pozo: rizos concéntricos rotos por el ruido (se desliza sola) */
function texAgua(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const w = fbmT(x / n, y / n, 5, 4);
      const r = .5 + .5 * Math.sin((x / n * 6 + y / n * 2.4 + w * 2.4) * 6.283);
      const c = mezC([24, 70, 80], [96, 162, 158], cl(r * .7 + w * .34, 0, 1));
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* el CIELO del atardecer dorado (respaldo pintado: encima va la foto generada).
   Horizonte al medio, cénit turquesa polvoriento, la banda del sol al ras. */
const cieloD = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');

  d.addColorStop(.46, '#f0b276');

  d.addColorStop(1,   '#6d4826');

  /* velos de polvo SOLO pegados al horizonte: más arriba, en la proyección
     equirectangular, cualquier banda se vuelve un anillo alrededor del cénit */
  for (let i = 0; i < 30; i++){

      ',' + (120 + rnd() * 50 | 0) + ',' + (.025 + rnd() * .04).toFixed(3) + ')';

const TX = {

{

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = tierra del sendero · G = hojarasca bajo el bosque. Se pinta UNA vez en un
   canvas de 512: el sendero como trazo gordo entre los puntos de la historia,
   la hojarasca como manchas de ruido donde después van los árboles. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* grava oscura: manchas */
  g.fillStyle = '#003800';
  for (let i = 0; i < 900; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 6 + rnd() * 22;
    if (vnoise(x * .02, y * .02) < .52) continue;

}
const splTex = new T.CanvasTexture(SPL);

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4

   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo

   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 7 }

const matTerr = new T.MeshLambertMaterial({ map: TX.pasto });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = texture2D(map, uvT).rgb;
      c = mix(c, texture2D(tHoja, uvT*1.3).rgb, clamp(spl.g*1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT*1.6).rgb, clamp(spl.r*1.35, 0., 1.));
      c = mix(c, texture2D(tRoca, uvT*.9).rgb, vRocoso);
      diffuseColor.rgb *= c;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    scene.add(m);
    terrChunks.push(m);
  }
}

/* --------------------- LA SIEMBRA DEL MAR DE DUNAS -------------------------
   Acá no hay bosque: hay MATAS secas en las hondonadas (al pie de la duna la
   arena todavía guarda algo de humedad), PIEDRAS de arenisca comidas por el
   viento, y los BLOQUES de una ciudad enterrada que asoman en vetas por todo
   el mapa — la arena no tapó nada, solo lo escondió. La densidad es alta a
   propósito: la arena pelada no da escala, las matas sí. */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
const ARB = [];                                /* [x,z,r] choque */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (Math.hypot(x - p.x, z - p.z) < (p.pr || 26) * .72) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function geoRoca(sem, punta){
  const g = new T.SphereGeometry(1, 7, 5);
  const P = g.attributes.position, UV = g.attributes.uv;
  for (let i = 0; i < P.count; i++){
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const k = .6 + .62 * vnoise(x * 2.1 + sem, z * 2.1 + y * 1.3 + sem * 2);
    P.setXYZ(i, x * k, y * k * punta, z * k);
    UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
  }
  g.computeVertexNormals();
  return g;
}
/* MATA de esparto: ocho briznas tiesas abiertas en abanico, fundidas en una
   sola geometría para poder instanciarla mil veces sin pagar mil dibujados */
function geoMata(sem, alto){
  const gs = [];
  for (let i = 0; i < 8; i++){
    const a = i / 8 * 6.283 + sem;
    const h = alto * (.6 + .7 * vnoise(i * 3.1 + sem, sem * 2.3));
    /* sin tapas (openEnded): son 48 triángulos por mata en vez de 120, y hay
       mil seiscientas matas — es la diferencia entre 200k y 80k triángulos */
    const g = new T.CylinderGeometry(.02, .085, h, 3, 1, true);
    g.translate(0, h / 2, 0);
    g.rotateZ(Math.cos(a) * .55); g.rotateX(Math.sin(a) * .55);
    g.translate(Math.cos(a) * .09, 0, Math.sin(a) * .09);
    gs.push(g);
  }
  return fusiona(gs);
}
function plantar(){
  const vMata = [geoMata(3, 1.15), geoMata(19, 1.7)];
  const vRoca = [geoRoca(3, .55), geoRoca(17, .72), geoRoca(41, .62)];
  const posM = [[], []], posR = [[], [], []], posB = [];
  const PASO_A = 14;
  const CTA = { tot: 0, dens: 0, camino: 0, mata: 0, roca: 0, bloque: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-5, 5), z = gz + rr(-5, 5);
    if (molesta(x, z, 9)){ CTA.camino++; continue; }
    const y = H(x, z);
    const cr = crestaDuna(x, z);
    const dr = Math.hypot(x - POI.ruinas.x, z - POI.ruinas.z);
    const dOa = Math.hypot(x - POI.oasis.x, z - POI.oasis.z);
    /* MATAS: en las hondonadas y cerca del oasis, nunca en la cresta pelada */
    const dM = vnoise(x * .014 + 60, z * .014 + 22) * .78 + (1 - cr) * .5 +
      .5 * Math.exp(-(dOa * dOa) / (90 * 90));
    if (dM > .74){
      CTA.ok++; CTA.mata++;
      posM[(rnd() * 2) | 0].push([x, y - .06, z, rr(.7, 2.1)]);
      continue;
    }
    /* PIEDRAS de arenisca: donde la duna se pela y alrededor de las ruinas */
    let dR = vnoise(x * .0075 + 11, z * .0075 + 91);
    dR += .2 * Math.exp(-((dr - 110) * (dr - 110)) / (95 * 95));
    if (dR > .60){
      CTA.ok++; CTA.roca++;
      const sc = rr(.5, 2.5);
      posR[(rnd() * 3) | 0].push([x, y - sc * .3, z, sc]);
      if (sc > 1.3) ARB.push([x, z, sc * .75]);
      continue;
    }
    /* BLOQUES labrados de la ciudad enterrada: en vetas, más cerca de las ruinas */
    let dB = vnoise(x * .021 + 5, z * .021 + 7);
    dB += .32 * Math.exp(-(dr * dr) / (160 * 160));
    if (dB > .755){
      CTA.ok++; CTA.bloque++;
      posB.push([x, y, z, rr(1.1, 3.6)]);
      continue;
    }
    CTA.dens++;
  }
  const matMata = new T.MeshLambertMaterial({ color: 0xc4a869 });
  for (let v = 0; v < 2; v++){
    const arr = posM[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(vMata[v], matMata, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(rr(-.1, .1), rr(0, 6.28), rr(-.1, .1)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.8, 1.3), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    scene.add(im);                 /* sin sombra: son mil y no se notaría */
  }
  const matRoca = new T.MeshLambertMaterial({ map: TX.roca });
  for (let v = 0; v < 3; v++){
    const arr = posR[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(vRoca[v], matRoca, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(rr(-.1, .1), rr(0, 6.28), rr(-.1, .1)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.7, 1.05), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;
    scene.add(im);
  }
  /* los bloques: dados de arenisca hundidos 40% en la arena y girados a mano
     (la arena los tumbó hace mil años; ninguno quedó a plomo) */
  if (posB.length){
    const im = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), matRoca, posB.length);
    for (let i = 0; i < posB.length; i++){
      const [x, y, z, sc] = posB[i];
      const alt = sc * rr(.4, .8);
      Q4.setFromEuler(E3.set(rr(-.22, .22), rr(0, 6.28), rr(-.22, .22)));
      M4.compose(V3.set(x, y + alt * .12, z), Q4, new T.Vector3(sc, alt, sc * rr(.7, 1.2)));
      im.setMatrixAt(i, M4);
      if (sc > 2) ARB.push([x, z, sc * .5]);
    }
    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;
    scene.add(im);
  }
  /* GUIJARROS: sin colisión ni sombra, puro detalle de la arena */
  const chico = new T.InstancedMesh(geoRoca(5, .5), matRoca, 420);
  for (let i = 0; i < 420; i++){
    const x = rr(-MITAD + 8, MITAD - 8), z = rr(-MITAD + 8, MITAD - 8);
    const sc = rr(.08, .32);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, H(x, z) - sc * .2, z), Q4, new T.Vector3(sc, sc, sc));
    chico.setMatrixAt(i, M4);
  }
  chico.frustumCulled = false;
  scene.add(chico);
  /* LO QUE SE FUE CAYENDO del carro: cántaros rotos y tablas medio enterradas
     a los costados de la huella. Cuentan la historia sin hablar. */
  const matMad = new T.MeshLambertMaterial({ map: TX.oscuro });
  const matAre2 = new T.MeshLambertMaterial({ map: TX.roca });
  for (let i = 0; i < 22; i++){
    const P = SENDA_PTS[(3 + i * 5) % SENDA_PTS.length];
    const x = P[0] + rr(5, 13) * (i % 2 ? 1 : -1);
    const z = P[1] + rr(5, 13) * (i % 3 ? -1 : 1);
    const y = H(x, z);
    if (i % 3 === 0){
      const j = new T.Mesh(new T.CylinderGeometry(.34, .22, .62, 9, 1, true), matAre2);
      j.position.set(x, y + .2, z);
      j.rotation.set(1.3 + rr(-.3, .3), rr(0, 6.28), rr(-.3, .3));
      j.castShadow = true; scene.add(j);
    } else {
      const m = new T.Mesh(new T.BoxGeometry(rr(1.1, 2.3), .1, rr(.2, .34)), matMad);
      m.position.set(x, y + .06, z);
      m.rotation.set(rr(-.2, .2), rr(0, 6.28), rr(-.2, .2));
      m.castShadow = true; scene.add(m);
    }
  }
}
plantar();

/* ------------- MODELOS DEL REPO, CLONADOS EN MASA ---------------------------
   Nada de esto se genera: son GLB que ya viven en el repo (palmeras, tótems,
   cajones, vigas). Se carga UNO y se CLONA en cada punto; el clon se apoya solo
   en la arena. Ojo con los materiales del glTF: si traen emissive o specular
   el modelo sale BLANCO plano, hay que apagarlos a mano. */
function sembrarGLB(url, puntos, o){
  if (!GLTF || !puntos || !puntos.length) return;
  o = o || {};
  new GLTF().load(url, g => {
    const base = g.scene;
    base.traverse(n => { if (n.isMesh && n.material){
      const mm = n.material;
      if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
      mm.specularIntensity = 0;
      mm.metalness = 0;
      mm.envMapIntensity = .45;
      n.castShadow = !!o.sombra;
      n.receiveShadow = false;
      n.frustumCulled = false;
    } });
    base.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(base);
    const alto = caja.max.y - caja.min.y;
    window.__CAJAS = window.__CAJAS || {};
    window.__CAJAS[url.split('/').pop()] = +alto.toFixed(2);
    for (const p of puntos){
      const m = base.clone(true);
      const e = (p[2] || 1) * (o.esc || 1);
      m.scale.setScalar(e);
      m.rotation.y = p[3] != null ? p[3] : rr(0, 6.28);
      m.position.set(p[0], H(p[0], p[1]) + (o.y || 0) - caja.min.y * e, p[1]);
      scene.add(m);
      window.__SEMBRADOS = (window.__SEMBRADOS || 0) + 1;
    }
  }, undefined, () => {});
}
/* BANDERAS de tela: planos colgados de un mástil que ONDEAN de verdad (los
   vértices se mueven por seno, más cuanto más lejos del mástil). En un mundo
   donde no se mueve nada más que la arena, una tela viva cambia todo. */
const BANDERAS = [];
function bandera(x, y, z, w, h, giro){
  const g = new T.PlaneGeometry(w, h, 8, 3);
  g.translate(w / 2, 0, 0);
  const m = new T.Mesh(g, new T.MeshLambertMaterial({ map: TX.tela,
    side: T.DoubleSide }));
  m.position.set(x, y, z);
  m.rotation.y = giro || 0;
  m.castShadow = true;
  scene.add(m);
  m.userData.p0 = Float32Array.from(g.attributes.position.array);
  m.userData.f = rr(0, 6.28);
  m.userData.w = w;
  BANDERAS.push(m);
  return m;
}
function pasoBanderas(t){
  for (const m of BANDERAS){
    const P = m.geometry.attributes.position, p0 = m.userData.p0, f = m.userData.f;
    for (let i = 0; i < P.count; i++){
      const x = p0[i*3], y = p0[i*3+1];
      P.array[i*3+2] = Math.sin(t * 3.1 + x * 2.2 + f) * .2 * x;
      P.array[i*3+1] = y + Math.sin(t * 2.4 + x * 1.6 + f) * .06 * x;
    }
    P.needsUpdate = true;
  }
}
/* ---------------- EL MOJÓN: la primera señal de la caravana ------------------
   Piedras apiladas, un mástil torcido con un jirón de lona que todavía ondea,
   un odre vacío y media rueda comida por la arena. Quien pasó por acá dejó
   dicho «seguimos» — y nada más. */
{

    m.scale.y = .64; m.rotation.y = rr(0, 6.28);

/* ---------------- EL CAMPAMENTO: la caravana que ya no está ------------------
   Tres tiendas de lona a medio enterrar, el carro con el eje partido, cajones
   abiertos, una cuerda con trapos y el fogón que alguien dejó encendido hace
   demasiado tiempo. El fogón VUELCA luz cálida cuando cae la noche. */
let fuegoMat = null;
{
  const p = POI.campamento, y = H(p.x, p.z);
  const matTela = new T.MeshLambertMaterial({ map: TX.tela, side: T.DoubleSide });
  const matMad = new T.MeshLambertMaterial({ map: TX.oscuro });
  const matPie = new T.MeshLambertMaterial({ map: TX.roca });
  /* las tiendas: cono de lona abierto por abajo, con su poste central */
  for (const [dx, dz, sc, gi] of [[-8, 3, 1.0, .4], [7, -5, 1.15, 2.1], [2, 10, .85, 4.2]]){
    const x = p.x + dx, z = p.z + dz, yy = H(x, z);
    const t = new T.Mesh(new T.ConeGeometry(3.2 * sc, 3.8 * sc, 9, 1, true), matTela);
    t.position.set(x, yy + 1.9 * sc, z);
    t.rotation.y = gi;
    t.castShadow = t.receiveShadow = true;
    scene.add(t);
    const po = new T.Mesh(new T.CylinderGeometry(.05, .07, 4.3 * sc, 5), matMad);
    po.position.set(x, yy + 2.1 * sc, z);
    po.castShadow = true;
    scene.add(po);
    ARB.push([x, z, 2.7 * sc]);
  }
  /* EL CARRO con el eje partido: caja ladeada, dos ruedas y la lanza en la arena */
  {
    const x = p.x + 11, z = p.z + 6, yy = H(x, z);
    const carro = new T.Group();
    const caja = new T.Mesh(new T.BoxGeometry(4.2, 1.1, 2.2), matMad);
    caja.position.y = 1.5;
    carro.add(caja);
    for (const sx of [-1.3, 1.3]){
      const r = new T.Mesh(new T.TorusGeometry(.95, .11, 6, 16), matMad);
      r.position.set(sx, .95, 1.25);
      carro.add(r);
      const ra = new T.Mesh(new T.CylinderGeometry(.06, .06, 1.7, 5), matMad);
      ra.rotation.x = Math.PI / 2;
      ra.position.set(sx, .95, .45);
      carro.add(ra);
    }
    const lanza = new T.Mesh(new T.CylinderGeometry(.08, .1, 3.4, 5), matMad);

{

  bro.position.set(p.x, yb + .92, p.z);

  for (const sx of [-1, 1]){

    po.position.set(p.x + sx * 2.4, yb + 2.1, p.z);

  cue.position.set(p.x, yb + 3.3, p.z);
  scene.add(cue);
  ARB.push([p.x, p.z, 5.2]);
  /* EL AGUA. OJO: con roughness bajo y envMapIntensity alto sale BLANCA (refleja
     el cielo dorado entero); el brillo del reflejo lo maneja el bucle según la
     luz del capítulo. */
  aguaMat = new T.MeshStandardMaterial({ color: 0x1d5f66, roughness: .26,
    metalness: .06, map: TX.agua, transparent: true, opacity: .93,
    envMapIntensity: .55 });
  aguaMat.map.repeat.set(9, 9);
  aguaMesh = new T.Mesh(new T.CircleGeometry(22, 44), aguaMat);

    if (POZO.abierto) return;

    if (aguaMat.map){ aguaMat.map.offset.x += dt * .013; aguaMat.map.offset.y += dt * .009; }
    if (!POZO.abierto) return;
    POZO.k = Math.min(1, POZO.k + dt / 6);
    const k = POZO.k * POZO.k * (3 - 2 * POZO.k);
    aguaMesh.position.y = NIVEL - 4 + k * 4;
  };

/* --------- EL PALMAR: seis palmeras GLB y veinte instanciadas --------------

{

function ponCap(n, silencio){
  cap = cl(n, 0, CAPS.length - 1);
  const C = CAPS[cap];
  $('objT').textContent = C.objT;
  luzDe = mezclaLuz(); luzA = LUZCAP[cap]; luzK = 0;
  luci.visible = cap >= 2 && cap <= 4;
  MISION.alCap(cap);
  if (!silencio){
    $('capN').textContent = C.n;

    ponCap._t = setTimeout(() => $('capCard').classList.remove('on'), 3400);
    /* la CINEMÁTICA del capítulo: la cámara te muestra adónde vas */

function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* el ATARDECER AZUL: el halo del sol vira del caramelo al azul al caer */
  glare.material.color.set(0xfff0dc).lerp(AZUL_OCASO, cl(1 - SOLD.y * 2.4, 0, 1));
  /* el fogón del campamento: brasa siempre, hoguera cuando cae el sol */
  if (fuegoMat){
    const osc = cl(1 - (SOLD.y * 420) / 170, 0, 1);
    focoCasa.intensity = 8 + osc * osc * 52;
  }
}
/* el texto se escribe LETRA POR LETRA; el boton, si todavia esta escribiendo,
   lo completa de golpe en vez de cerrar (asi nadie se pierde una linea). */
let _dlgTim = null, _dlgFull = '';
function dialogo(titulo, cuerpo, alCerrar, cara, retrato){
  enDlg = true;
  $('dlgT').textContent = titulo;
  /* RETRATO: si el personaje tiene imagen generada va esa; si no, la carita
     pintada a mano en canvas (los bichos y los perros no tienen retrato) */
  const img = $('dlgFoto'), cv = $('dlgCara');
  if (retrato){
    img.src = retrato; img.classList.add('on'); cv.classList.remove('on');
  } else if (cara){
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 192, 256);
    /* la carita se pinto para un cuadrado: se centra arriba en el retrato 3:4 */
    g.save(); g.translate(0, 24); cara(g, 192); g.restore();
    cv.classList.add('on'); img.classList.remove('on');
  } else { cv.classList.remove('on'); img.classList.remove('on'); }
  /* maquina de escribir */
  if (_dlgTim) clearInterval(_dlgTim);
  _dlgFull = cuerpo; let i = 0;
  $('dlgB').textContent = '';
  _dlgTim = setInterval(() => {
    i += 2;
    $('dlgB').textContent = _dlgFull.slice(0, i);
    if (i >= _dlgFull.length){ clearInterval(_dlgTim); _dlgTim = null; }
  }, 18);
  $('dlg').classList.add('on');
  $('dlgGo').onclick = () => {
    if (_dlgTim){                                  /* todavia escribiendo: completar */
      clearInterval(_dlgTim); _dlgTim = null;
      $('dlgB').textContent = _dlgFull;
      return;
    }
    $('dlg').classList.remove('on');
    enDlg = false;
    if (alCerrar) alCerrar();
  };
}
function llegaObjetivo(){
  const C = CAPS[cap];

    if (cap >= CAPS.length - 1){ finDeHistoria(); return; }
    ponCap(cap + 1);
  });
}

}

   Ambiente + música + pasos por mundo, cargados SOBRE el sintetizado: cuando
   decodifican lo apagan; si una URL falla (offline o el navegador no decodifica
   AAC) el sintetizado sigue solo. Vive acá (motor compartido) y no en la
   sección AMB, que cada mundo reescribe. Los mk_*.py pisan MUNDO_AUDIO. */
const MUNDO_AUDIO = { amb: 'amb-canon.mp3', mus: 'mus-canon.m4a', paso: 'pasos-arena.mp3', pasoRate: 1.25 };
/* CIELO fotográfico generado (equirectangular). Vacío = deja el cielo pintado.
   Se carga y reemplaza el fondo; si falla, queda el pintado. */
const MUNDO_CIELO = 'cielo-canon.jpg';
/* TEXTURAS fotográficas generadas del suelo: la arena fina (map del terreno) y
   la arena parda de sotavento (el canal G del splat). Pasan por el MISMO AX()
   que todo lo demás y caen de pie si no llegan: abajo queda lo pintado. */
const MUNDO_TEX = { arena: 'tex-canon-1.jpg', sotavento: 'tex-canon-2.jpg' };
/* disposición del MENÚ por mundo (clases en #menu) */
const MUNDO_MENU = 'm-izq m-abajo';
/* PROPS 3D generados (Tripo, estáticos): edificios/vehículos de cada mundo.
   Se colocan en su POI, se apoyan en el terreno y OCULTAN la estructura
   procedural (que pasa como grupo en `ocultar`). Si el GLB no llega, queda la
   procedural. Los mk_*.py llaman propGLB en su bloque de estructura. */
function propGLB(o){
  if (!GLTF){ return; }
  new GLTF().load(AX(o.url), g => {
    const m = g.scene;
    m.scale.setScalar(o.esc || 1);
    m.rotation.set(o.rx || 0, o.giro || 0, o.rz || 0);
    m.position.set(o.x, 0, o.z);
    m.traverse(n => { if (n.isMesh){ n.castShadow = true; n.receiveShadow = true;
      n.frustumCulled = false;
      if (n.material){ const mm = n.material;
        if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
        mm.specularIntensity = 0; mm.metalness = 0; mm.envMapIntensity = .45; } } });
    /* AUTO-APOYO: el punto más bajo del modelo se posa en el suelo + o.y */
    m.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(m);
    m.position.y = H(o.x, o.z) + (o.y || 0) - caja.min.y;
    scene.add(m);
    if (o.ocultar){ const a = Array.isArray(o.ocultar) ? o.ocultar : [o.ocultar];
      for (const x of a) x.visible = false; }         /* apagar la procedural */
    window.__PROPS = (window.__PROPS || 0) + 1;
  }, undefined, () => {});
}
function cargarTexFoto(){
  if (!MUNDO_TEX) return;
  const car = (f, fn) => new T.TextureLoader().load(AX(f), t => {
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.colorSpace = T.SRGBColorSpace;
    t.anisotropy = 4;
    fn(t);
  }, undefined, () => {});
  if (MUNDO_TEX.arena) car(MUNDO_TEX.arena, t => {
    matTerr.map = t; matTerr.needsUpdate = true; });
  if (MUNDO_TEX.sotavento) car(MUNDO_TEX.sotavento, t => {
    uniTerr.tHoja.value = t; });
}
function cargarCieloFoto(){
  if (!MUNDO_CIELO) return;
  new T.TextureLoader().load(AX(MUNDO_CIELO), tex => {
    tex.mapping = T.EquirectangularReflectionMapping;
    tex.colorSpace = T.SRGBColorSpace;
    tex.wrapS = T.RepeatWrapping;
    tex.wrapT = T.ClampToEdgeWrapping;
    scene.background = tex;
    /* HIELO dibuja el cielo en un DOMO; los demás usan scene.background */
    if (typeof DOMO !== 'undefined' && DOMO){ DOMO.material.map = tex; DOMO.material.needsUpdate = true; }
  }, undefined, () => {});
}
function cargarAudioReal(){
  const A2 = AMB.ctx; if (!A2 || AMB._cargado) return;
  AMB._cargado = true;
  const carga = async url => A2.decodeAudioData(await (await fetch(url)).arrayBuffer());
  /* música y pasos en PARALELO e independientes: si el m4a no decodifica (AAC),
     los pasos no lo esperan. El AMBIENTE viene del sintetizado del motor (viento
     limpio + voces de cada mundo): la pista de ambiente generada traía golpes y
     jadeos que sonaban raro al estar quieto, así que no se usa. */
  /* el AMBIENTE generado de este mundo es viento limpio de duna: se suma por
     debajo del sintetizado (en otros mundos la pista traía golpes y no se usa) */
  if (MUNDO_AUDIO.amb) carga(AX(MUNDO_AUDIO.amb)).then(ba => {
    const na = A2.createBufferSource(); na.buffer = ba; na.loop = true;
    AMB.ambReal = A2.createGain(); AMB.ambReal.gain.value = .26;
    na.connect(AMB.ambReal); AMB.ambReal.connect(AMB.master); na.start();
  }).catch(() => {});
  carga(AX(MUNDO_AUDIO.mus)).then(bm => {
    const nm = A2.createBufferSource(); nm.buffer = bm; nm.loop = true;
    AMB.musGain = A2.createGain(); AMB.musGain.gain.value = .3;
    nm.connect(AMB.musGain); AMB.musGain.connect(AMB.master); nm.start();
  }).catch(() => {});
  carga(AX(MUNDO_AUDIO.paso)).then(bp => {
    AMB.pasoSrc = A2.createBufferSource(); AMB.pasoSrc.buffer = bp; AMB.pasoSrc.loop = true;
    AMB.pasoSrc.playbackRate.value = MUNDO_AUDIO.pasoRate || 1.4;
    AMB.pasoGain = A2.createGain(); AMB.pasoGain.gain.value = 0;
    AMB.pasoSrc.connect(AMB.pasoGain); AMB.pasoGain.connect(AMB.master); AMB.pasoSrc.start();
  }).catch(() => {});
}

/* ========================= CINEMÁTICAS =====================================
   Cámara sobre rieles: cada paso vuela de `de` a `a` mirando a `mira`, con
   subtítulo y letterbox. Se saltea con un toque. El sol (y su caja de sombra)
   siguen a la cámara mientras dura. */
const CINE = { on: false, i: 0, t: 0, pasos: null, fin: null };
const _cv1 = new T.Vector3(), _cv2 = new T.Vector3(), _cv3 = new T.Vector3();
function cinematica(pasos, fin){
  CINE.on = true; CINE.pasos = pasos; CINE.i = 0; CINE.t = 0; CINE.fin = fin || null;
  fase = 'cine';
  $('hud').classList.remove('on');
  document.body.classList.add('cine');
}
function terminaCine(){
  if (!CINE.on) return;
  CINE.on = false;
  document.body.classList.remove('cine');
  $('cineTxt').textContent = '';
  fase = 'juego';
  $('hud').classList.add('on');
  $('recol').classList.add('on'); RECOL.pinta();
  cam.fov = 72; cam.updateProjectionMatrix();
  if (CINE.fin){ const f = CINE.fin; CINE.fin = null; f(); }
}
function pasoCine(dt){
  const p = CINE.pasos[CINE.i];
  if (!p){ terminaCine(); return; }
  CINE.t = Math.min(1, CINE.t + dt / (p.dur || 3));
  const k = CINE.t * CINE.t * (3 - 2 * CINE.t);
  _cv1.set(p.de[0], p.de[1], p.de[2]);
  _cv2.set(p.a[0], p.a[1], p.a[2]);
  cam.position.lerpVectors(_cv1, _cv2, k);
  _cv3.set(p.mira[0], p.mira[1], p.mira[2]);
  cam.lookAt(_cv3);
  cam.fov = p.fov || 58; cam.updateProjectionMatrix();
  $('cineTxt').textContent = p.txt || '';
  if (CINE.t >= 1){ CINE.i++; CINE.t = 0;
    if (CINE.i >= CINE.pasos.length) terminaCine(); }
}
$('cineSkip').addEventListener('pointerdown', e => { e.preventDefault(); terminaCine(); });
/* la cine de CAPÍTULO: dos tomas que muestran adónde hay que ir */
function cineObjetivo(C){
  const o = POI[C.obj], oy = H(o.x, o.z), py = H(px, pz);
  const dx2 = o.x - px, dz2 = o.z - pz, dd = Math.hypot(dx2, dz2) || 1;
  const ux = dx2 / dd, uz = dz2 / dd;
  cinematica([
    { de: [px - ux * 7, py + 3.5, pz - uz * 7], a: [px + ux * 8, py + 15, pz + uz * 8],
      mira: [o.x, oy + 6, o.z], dur: 2.7, txt: C.n + ' · ' + C.t },
    { de: [o.x - ux * 44 + uz * 12, oy + 19, o.z - uz * 44 - ux * 12],
      a: [o.x - ux * 15, oy + 6, o.z - uz * 15],
      mira: [o.x, oy + 3.5, o.z], dur: 2.7, txt: C.objT }
  ]);
}

/* ========================= PERSONAJES Y CRIATURAS ==========================
   Figuras 100% procedurales con partes animables (userData.lim): humanos con
   brazos y piernas en péndulo, perro con cola, dron con rotores, criatura
   que late. npcTick las hace CAMINAR detrás del jugador si `sigue`. */
const NPCS = [];
function figHumano(colTraje, colCasco){
  const g = new T.Group();
  const mT = new T.MeshLambertMaterial({ color: colTraje });
  const mC = new T.MeshLambertMaterial({ color: colCasco || 0xd8dde2 });
  const torso = new T.Mesh(new T.CapsuleGeometry(.32, .55, 4, 8), mT);
  torso.position.y = 1.08; g.add(torso);
  const cabeza = new T.Mesh(new T.SphereGeometry(.25, 10, 8), mC);
  cabeza.position.y = 1.78; g.add(cabeza);
  const visor = new T.Mesh(new T.SphereGeometry(.19, 8, 6),
    new T.MeshLambertMaterial({ color: 0x18242f }));
  visor.position.set(0, 1.79, .13); visor.scale.set(.92, .68, .6); g.add(visor);
  const lim = {};
  for (const [k, sx] of [['bI', -.44], ['bD', .44]]){
    const b = new T.Mesh(new T.CapsuleGeometry(.085, .5, 3, 6), mT);
    b.geometry.translate(0, -.3, 0);
    b.position.set(sx, 1.46, 0); g.add(b); lim[k] = b;
  }
  for (const [k, sx] of [['pI', -.16], ['pD', .16]]){
    const p2 = new T.Mesh(new T.CapsuleGeometry(.105, .5, 3, 6), mT);
    p2.geometry.translate(0, -.32, 0);
    p2.position.set(sx, .74, 0); g.add(p2); lim[k] = p2;
  }
  const mochi = new T.Mesh(new T.BoxGeometry(.4, .5, .2), mC);
  mochi.position.set(0, 1.22, -.3); g.add(mochi);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figPerro(col){
  const g = new T.Group();
  const m = new T.MeshLambertMaterial({ color: col });
  const mOsc = new T.MeshLambertMaterial({ color: 0x2a1e14 });
  const cuerpo = new T.Mesh(new T.BoxGeometry(.62, .3, .27), m);
  cuerpo.position.y = .46; g.add(cuerpo);
  const cabeza = new T.Mesh(new T.BoxGeometry(.24, .22, .2), m);
  cabeza.position.set(.4, .6, 0); g.add(cabeza);
  const hocico = new T.Mesh(new T.BoxGeometry(.12, .1, .12), mOsc);
  hocico.position.set(.54, .55, 0); g.add(hocico);
  for (const sz of [-1, 1]){
    const oreja = new T.Mesh(new T.BoxGeometry(.05, .12, .06), mOsc);
    oreja.position.set(.36, .76, sz * .07); g.add(oreja);
  }
  const lim = {};
  let pi = 0;
  for (const sx of [-.22, .22]) for (const sz of [-.09, .09]){
    const pata = new T.Mesh(new T.CylinderGeometry(.045, .04, .34, 5), m);
    pata.geometry.translate(0, -.17, 0);
    pata.position.set(sx, .34, sz); g.add(pata);
    lim['p' + (++pi)] = pata;
  }
  const cola = new T.Mesh(new T.CylinderGeometry(.03, .015, .3, 5), m);
  cola.geometry.translate(0, .15, 0);
  cola.position.set(-.32, .52, 0);
  cola.rotation.x = .0; cola.rotation.z = .8;
  g.add(cola); lim.cola = cola;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figDron(col){
  const g = new T.Group();
  const m = new T.MeshLambertMaterial({ color: col });
  const cuerpo = new T.Mesh(new T.SphereGeometry(.3, 10, 8), m);
  cuerpo.scale.y = .6; g.add(cuerpo);
  const ojo = new T.Mesh(new T.SphereGeometry(.08, 8, 6),
    new T.MeshBasicMaterial({ color: 0x7fe8ff }));
  ojo.position.set(0, 0, .27); g.add(ojo);
  const lim = { rot: [] };
  for (const [sx, sz] of [[-.34, -.34], [.34, -.34], [-.34, .34], [.34, .34]]){
    const brazo = new T.Mesh(new T.BoxGeometry(.2, .03, .05), m);
    brazo.position.set(sx * .7, .12, sz * .7);
    brazo.rotation.y = Math.atan2(sz, sx);
    g.add(brazo);
    const rotor = new T.Mesh(new T.CylinderGeometry(.16, .16, .02, 8),
      new T.MeshLambertMaterial({ color: 0x333a40, transparent: true, opacity: .6 }));
    rotor.position.set(sx, .18, sz);
    g.add(rotor); lim.rot.push(rotor);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });

function figCriatura(col){
  const g = new T.Group();
  const domo = new T.Mesh(new T.SphereGeometry(.3, 10, 8),
    new T.MeshLambertMaterial({ color: 0x10201c, emissive: col,
      emissiveIntensity: .8, transparent: true, opacity: .92 }));
  domo.position.y = .42; domo.scale.y = 1.15; g.add(domo);
  const lim = {};
  let pi = 0;
  for (const a of [.6, 2.2, 4.0, 5.6]){
    const pata = new T.Mesh(new T.CylinderGeometry(.02, .015, .3, 4),
      new T.MeshLambertMaterial({ color: 0x1a2a26 }));
    pata.geometry.translate(0, -.15, 0);
    pata.position.set(Math.cos(a) * .18, .3, Math.sin(a) * .18);
    pata.rotation.z = Math.cos(a) * .4; pata.rotation.x = -Math.sin(a) * .4;
    g.add(pata); lim['p' + (++pi)] = pata;
  }
  for (const sz of [-1, 1]){
    const ojo = new T.Mesh(new T.SphereGeometry(.045, 6, 5),
      new T.MeshBasicMaterial({ color: 0xffffff }));
    ojo.position.set(sz * .1, .48, .26); g.add(ojo);
  }
  g.userData.lim = lim;
  g.userData.late = domo.material;
  return g;
}
const MIXERS = [];
/* carga un personaje 3D generado y lo cuelga del Group del NPC, apagando la
   figura procedural; si falla, la procedural se queda. Reproduce su clip. */
function ponerModelo(npc){
  if (!GLTF || !npc.glb) return;
  new GLTF().load(AX(npc.glb), g => {
    const m = g.scene;
    m.scale.setScalar(npc.glbEsc || 1);
    m.position.y = npc.glbY || 0;
    m.rotation.y = npc.glbGiro || 0;
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material){ const mm = o.material;
        if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
        mm.specularIntensity = 0; mm.metalness = 0; mm.envMapIntensity = .45; } } });
    /* apagar la figura procedural (queda de respaldo si el modelo no llegó) */
    npc.fig.traverse(o => { if (o.isMesh) o.visible = false; });
    npc.fig.add(m);
    npc.modelo = m;
    if (g.animations && g.animations.length){
      const mix = new T.AnimationMixer(m);
      mix.clipAction(g.animations[0]).play();
      npc.mixer = mix; MIXERS.push(mix);
      /* si el clip es de CAMINAR (Meshy sube las dos manos a la vez), le
         manejamos los brazos a mano igual que al cuerpo en 1ª persona */
      if (/walk|camin/i.test(g.animations[0].name || '')){
        const arm = {};
        m.traverse(o => { if (o.isBone){
          if (o.name === 'LeftArm') arm.la = o; else if (o.name === 'RightArm') arm.ra = o;
          else if (o.name === 'LeftForeArm') arm.lf = o;
          else if (o.name === 'RightForeArm') arm.rf = o;
          else if (o.name === 'LeftHand') arm.lh = o;
          else if (o.name === 'RightHand') arm.rh = o; } });
        for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
        npc.arms = arm; npc.armPh = 0;
      }
    }
    npc.cargado = true;
  }, undefined, () => {});
}
function nuevoNPC(o){
  o.fig.position.set(o.x, H(o.x, o.z) + (o.vuela ? (o.alto || 2.2) : 0), o.z);
  o.fig.rotation.y = o.giro || 0;
  scene.add(o.fig);
  o.fase = rr(0, 6.28); o.li = 0;
  NPCS.push(o);
  ponerModelo(o);
  return o;
}
function npcTick(dt){
  for (const mix of MIXERS) mix.update(dt);
  for (const npc of NPCS){
    /* el modelo 3D generado ya trae su propia orientación: si el clip es de
       caminar, no le sumamos el balanceo procedural de las extremidades */
    const f = npc.fig;
    const d = Math.hypot(px - f.position.x, pz - f.position.z);
    let anda = 0;
    if (npc.sigue){
      if (d > 40){                       /* nunca se queda atrás de verdad */
        /* reaparece DETRAS del jugador: puesta adelante se le veia la
           capucha pegada al lente al saltar de capitulo */
        f.position.x = px + Math.sin(yaw) * 3.4 + 1.2;
        f.position.z = pz + Math.cos(yaw) * 3.4 + 1.2;
      } else if (d > 3.4){
        const vel2 = (corre ? 10.8 : 5.8) * dt;
        f.rotation.y = Math.atan2(px - f.position.x, pz - f.position.z);
        f.position.x += (px - f.position.x) / d * Math.min(vel2, d - 3.2);
        f.position.z += (pz - f.position.z) / d * Math.min(vel2, d - 3.2);
        anda = 1;
      }
    } else if (d < 11){
      const objY = Math.atan2(px - f.position.x, pz - f.position.z);
      let dy = objY - f.rotation.y;
      while (dy > Math.PI) dy -= 6.283;
      while (dy < -Math.PI) dy += 6.283;
      f.rotation.y += dy * Math.min(1, dt * 3);
    }
    const suelo = H(f.position.x, f.position.z);
    f.position.y = npc.vuela
      ? suelo + (npc.alto || 2.2) + Math.sin(t0 * 1.7 + npc.fase) * .25
      : suelo;
    const L2 = f.userData.lim || {};
    const sw = anda ? Math.sin(t0 * 9) * .55 : Math.sin(t0 * 1.4 + npc.fase) * .06;
    if (L2.bI){ L2.bI.rotation.x = sw; L2.bD.rotation.x = -sw;
      /* hay figuras con brazos pero sin piernas (el pingüino aletea) */
      if (L2.pI){ L2.pI.rotation.x = -sw; L2.pD.rotation.x = sw; } }
    if (L2.p1 && !L2.bI){ const s2 = anda ? Math.sin(t0 * 11) * .6 : 0;
      L2.p1.rotation.x = s2; L2.p4.rotation.x = s2;
      L2.p2.rotation.x = -s2; L2.p3.rotation.x = -s2; }
    if (L2.cola) L2.cola.rotation.x = Math.sin(t0 * (anda ? 13 : 6) + npc.fase) * .4;
    if (L2.rot) for (const r of L2.rot) r.rotation.y += dt * 28;
    if (f.userData.late)
      f.userData.late.emissiveIntensity = .6 + .35 * Math.sin(t0 * 2.2 + npc.fase);
    /* brazos del modelo 3D con clip de caminar: colgando + vaivén al andar
       (pisa lo que dejó el mixer, que subía las dos manos a la vez) */
    if (npc.arms){
      npc.armPh += dt * (anda ? (corre ? 9 : 6.2) : 0);
      const swA = Math.sin(npc.armPh) * (anda ? 0.42 : 0)
        + Math.sin(t0 * 1.3 + npc.fase) * 0.03 * (anda ? 0 : 1);
      apuntarBrazos(npc.arms, swA);
    }
  }
}
function npcCerca(){
  let mejor = null, md = 4.4;
  for (const npc of NPCS){
    if (!npc.clave) continue;
    const d = Math.hypot(px - npc.fig.position.x, pz - npc.fig.position.z);
    if (d < md){ md = d; mejor = npc; }
  }
  return mejor;
}
function hablaNPC(npc){
  const lineas = (L[LANG].npc && L[LANG].npc[npc.clave]) || [];
  if (!lineas.length) return;
  const txt = lineas[npc.li % lineas.length];
  npc.li++;
  dialogo(npc.nombre, txt, npc.alHablar || null, npc.cara, npc.retrato);
}

/* ========================= ITEMS USABLES ================================== */
const ITEMS = [];
function nuevoItem(o){ o.activo = true; ITEMS.push(o); return o; }
function itemCerca(){
  for (const it of ITEMS){
    if (!it.activo) continue;
    if (Math.hypot(px - it.x, pz - it.z) < (it.r || 3.5)) return it;
  }
  return null;
}
/* ¿qué haría el botón USAR ahora mismo? El capítulo manda, después los
   items, después charlar con quien esté cerca. */
function accionUsable(){
  const C = CAPS[cap];
  const p = POI[C.obj];
  if (C.usar && Math.hypot(px - p.x, pz - p.z) < 7 && MISION.lista(cap))
    return { tipo: 'cap' };
  const it = itemCerca();
  if (it) return { tipo: 'item', it };
  const npc = npcCerca();
  if (npc) return { tipo: 'npc', npc };
  return null;
}
function usarAccion(){
  if (enDlg) return;
  const acc = accionUsable();
  if (!acc) return;
  if (acc.tipo === 'cap') llegaObjetivo();
  else if (acc.tipo === 'item'){ acc.it.activo = false; acc.it.fn(acc.it); }
  else hablaNPC(acc.npc);
}

/* ===================== EL CUERPO EN PRIMERA PERSONA ========================
   Como en los juegos de parkour: MANOS y antebrazos siempre a la vista
   (viewmodel colgado de la cámara) que bombean al caminar y se aprietan al
   correr; PIERNAS de verdad con rodilla al mirar hacia abajo; y un torso y
   cabeza que NO se dibujan (colorWrite=false) pero SÍ proyectan: tu propia
   sombra camina entera por el suelo. Colores por mundo en MUNDO_CUERPO. */
const MUNDO_CUERPO = { mangas: 0xd9c3a0, guantes: 0xa86b3c, pantalon: 0x8f7350, botas: 0x4a3a24, glb: 'npc/cuerpo-senda.glb' };
const CUERPO = {};
{
  const mM = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.mangas });

  const mPa = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.pantalon });
  const mB = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.botas });
  /* material FANTASMA: invisible a la cámara, visible para el sol */
  const mF = new T.MeshLambertMaterial({ color: 0x000000 });
  mF.colorWrite = false; mF.depthWrite = false;

  /* --- viewmodel: dos antebrazos con puño, hijos de la CÁMARA --- */
  scene.add(cam);                 /* la cámara entra a la escena para tener hijos */
  const vm = new T.Group();
  const brazoVM = s2 => {
    const g = new T.Group();
    const puno = new T.Mesh(new T.BoxGeometry(.09, .08, .11), mG);
    puno.rotation.z = s2 * .18;
    g.add(puno);
    const pulgar = new T.Mesh(new T.BoxGeometry(.028, .03, .05), mG);
    pulgar.position.set(-s2 * .052, .012, .012);
    g.add(pulgar);
    const ante = new T.Mesh(new T.CapsuleGeometry(.05, .3, 3, 8), mM);
    ante.position.set(s2 * .07, -.16, .15);
    ante.rotation.x = .95;
    ante.rotation.z = -s2 * .3;
    g.add(ante);
    g.position.set(s2 * .23, -.26, -.46);
    vm.add(g);
    return g;
  };
  CUERPO.bI = brazoVM(-1);
  CUERPO.bD = brazoVM(1);
  cam.add(vm);
  CUERPO.vm = vm;

  /* --- el cuerpo en el mundo: piernas visibles + resto sólo-sombra --- */
  const root = new T.Group();
  const pierna = s2 => {
    const cad = new T.Group();
    cad.position.set(s2 * .115, .98, .03);

    bota.position.set(0, -.42, .05);
    bota.castShadow = true;

    root.add(cad);

  const pI = pierna(-1), pD = pierna(1);
  CUERPO.pI = pI.cad; CUERPO.rI = pI.rodilla;
  CUERPO.pD = pD.cad; CUERPO.rD = pD.rodilla;
  /* torso, cabeza y brazos FANTASMA: sólo existen en la sombra */
  const torso = new T.Mesh(new T.CapsuleGeometry(.17, .5, 4, 8), mF);
  torso.position.y = 1.28; torso.castShadow = true; root.add(torso);
  const cabeza = new T.Mesh(new T.SphereGeometry(.12, 8, 6), mF);

  CUERPO.bsI.geometry.translate(0, -.3, 0);

/* CUERPO 3D generado (riggeado + caminar) en PRIMERA PERSONA: se cuelga del
   mismo Group que sigue al jugador; se apaga el cuerpo procedural; se ENCOGE
   el hueso de la cabeza para no tapar la cámara; el clip de caminar avanza a
   la velocidad del paso. Si el GLB no llega, queda el procedural. */
function cargarCuerpoGLB(){
  if (!GLTF || !MUNDO_CUERPO.glb) return;
  new GLTF().load(AX(MUNDO_CUERPO.glb), g => {
    const m = g.scene;
    m.rotation.y = Math.PI;                 /* de frente a la marcha */
    const arm = {};
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material) o.material.metalness = 0; }
      if (o.isBone && /head|cabeza|neck/i.test(o.name) && !CUERPO.headBone)
        CUERPO.headBone = o;
      /* brazos: los manejamos a mano porque el clip de Meshy sube las dos manos
         a la vez (quedaban "arriba" al estar quieto). Los dejamos colgando. */
      if (o.isBone){
        if (o.name === 'LeftArm') arm.la = o;
        else if (o.name === 'RightArm') arm.ra = o;
        else if (o.name === 'LeftForeArm') arm.lf = o;
        else if (o.name === 'RightForeArm') arm.rf = o;
        else if (o.name === 'LeftHand') arm.lh = o;
        else if (o.name === 'RightHand') arm.rh = o;
      } });
    for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
    CUERPO.arms = arm;
    CUERPO.root.add(m);
    CUERPO.glb = m;
    /* apagar el cuerpo procedural (piernas + fantasma + viewmodel) */
    CUERPO.root.traverse(o => { if (o.isMesh && o !== m && !m.getObjectById(o.id)) o.visible = false; });
    CUERPO.pI.visible = CUERPO.pD.visible = false;
    CUERPO.bsI.visible = CUERPO.bsD.visible = false;
    if (g.animations && g.animations.length){
      CUERPO.mixer = new T.AnimationMixer(m);
      CUERPO.accion = CUERPO.mixer.clipAction(g.animations[0]);
      CUERPO.accion.play();
    }
  }, undefined, () => {});
}
