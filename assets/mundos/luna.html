<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#050608"/>
<title>LUNA</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#050608;color:#eef1f5;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(10,12,16,.62);border:1px solid rgba(200,215,235,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#e8eef6}
  #objD{font-size:11.5px;color:#9fb0c4;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#c3d2e4;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  /* MENU, SONIDO y CORRER ARRIBA a la derecha y cuadrados. Abajo quedaban alargados
     y apretados contra el pulgar con el que se juega, que es justo donde estorban. */
  #btns{position:absolute;right:max(10px,2.5vw);top:max(10px,2.5vh);display:flex;
    flex-direction:row;gap:8px;align-items:flex-start;pointer-events:auto}
  #btns .b{width:46px;height:46px;min-width:0;padding:0;display:grid;place-items:center;
    text-align:center;border-radius:12px;font-size:15px}
  /* USAR: REDONDO, abajo, al lado del salto. Dos motivos.
     Sitio: position FIXED y no absolute. #btns se subio arriba a la derecha y es
     absolute, asi que un hijo absolute dejaba de colgar de la pantalla y colgaba de
     EL: su "bottom" se medía desde la caja de arriba y el boton aparecia arriba.
     Forma: es el unico boton de accion que se toca en medio del juego, con el pulgar
     y sin mirar; una pastilla alargada al lado de un salto redondo se toca peor y se
     ve peor. Mismo diametro que el salto, a su izquierda. */
  #btns .b.usar{position:fixed;right:calc(max(14px,3.5vw) + min(84px,19vw) + 12px);
    bottom:max(16px,5vh);width:min(72px,16vw);height:min(72px,16vw);
    aspect-ratio:1;border-radius:50%;padding:0;display:none;place-items:center;
    font-size:clamp(10px,2.6vw,13px);line-height:1.05;text-align:center;
    letter-spacing:.04em}
  #btns .b.usar.on{display:grid}
  .b{min-width:86px;text-align:center;padding:12px 15px;border-radius:14px;font-weight:800;
    font-size:13px;background:rgba(14,17,22,.62);border:1.5px solid rgba(200,215,235,.4);
    color:#e8eef6;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  .b.usar{background:rgba(70,95,130,.78);border-color:#cfe0f4;font-size:15px;display:none}
  .b.usar.on{display:block}
  .b.corre.on{background:rgba(70,95,130,.78)}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  /* en un aparato sin tactil no se dibujan los controles de dedo */
  body.sinTactil #joy,body.sinTactil #bSalta{display:none}
  /* AVISO DEL TRASLADO: una linea corta, centrada, por encima del boton USAR y
     de la palanca para no tapar ni una cosa ni la otra. Es todo el tutorial que
     tiene el traslado: aparece cuando estas donde se usa y se va cuando no. */
  #aviso{position:fixed;left:50%;bottom:max(96px,20vh);transform:translateX(-50%);
    display:none;pointer-events:none;text-align:center;max-width:80vw;z-index:4;
    font:800 11.5px/1.35 ui-sans-serif,system-ui,sans-serif;letter-spacing:.07em;
    padding:7px 13px;border-radius:10px;background:rgba(14,16,26,.68);
    border:1px solid rgba(190,200,230,.34);color:#e6ecff;backdrop-filter:blur(4px);
    text-shadow:0 1px 6px rgba(0,0,0,.7)}
  #aviso.on{display:block}
  body.hablando #aviso{display:none}
  @media (max-height:430px){ #aviso{bottom:max(84px,26vh);font-size:10.5px} }
  /* ---- PALANCA DIBUJADA, igual que en los ocho mundos nuevos. Antes este mundo
       se movia arrastrando el dedo por la mitad izquierda de la pantalla, sin
       nada que lo dijera. ---- */
  #joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(150px,32vw);aspect-ratio:1;pointer-events:auto;touch-action:none;
    opacity:.9;transition:opacity .25s}
  #joy canvas{width:100%;height:100%;display:block}
  /* se esconde SOLO si el aparato no tiene tactil: escondiendola al detectar
     raton, un portatil tactil se quedaba sin ningun control a la vista. */
  body.sinTactil #joy{display:none}
  body.hablando #joy{opacity:0;pointer-events:none}
  /* ---- LA BARRA DE ARRIBA: sonido, correr y pausa. Estaban apilados en la
       columna de la derecha; arriba es donde se pidieron y donde no estorban al
       pulgar que juega. Abajo queda solo el boton de accion. ---- */
  #hudTop{position:absolute;right:max(10px,2.5vw);top:max(10px,2vh);display:flex;
    gap:8px;pointer-events:auto;z-index:6}
  #hudTop .bt{min-width:44px;height:44px;padding:0 10px;border-radius:12px;display:grid;
    place-items:center;font:900 15px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.04em;cursor:pointer;background:rgba(0,0,0,.46);
    border:1.5px solid rgba(255,255,255,.28);color:#eaf2ff;backdrop-filter:blur(4px)}
  #hudTop .bt.ico{font-size:19px;padding:0}
  #hudTop .bt:active{transform:translateY(1px);filter:brightness(1.35)}
  #hudTop .bt.on{background:rgba(120,190,255,.32);border-color:rgba(255,255,255,.6);color:#fff}
  /* EL SELLO EN LA PORTADA: dos veces la duda fue «esto esta actualizado o el
     navegador me dio una copia vieja», y la respuesta solo estaba en la linea de
     fps —chiquita, tapada por la barra de estado del telefono y visible unicamente
     DENTRO del juego—. Aca se ve antes de tocar nada. */
  #mSello{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font:800 10.5px/1 ui-monospace,monospace;letter-spacing:.12em;
    color:rgba(255,255,255,.42);pointer-events:none;z-index:3}
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#dfeecd;
    background:rgba(8,10,14,.5);border:1px solid rgba(190,230,180,.26);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(190,230,180,.16);border:1px solid rgba(190,230,180,.3);color:#e8eef6}
  #dlg{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(560px,92vw);
    background:rgba(8,10,14,.88);border:1px solid rgba(200,215,235,.35);border-radius:16px;
    padding:16px 18px 13px;display:none;pointer-events:auto;backdrop-filter:blur(6px);z-index:5}
  #dlg.on{display:block}
  #dlgT{font-weight:900;letter-spacing:.05em;color:#c3d2e4;font-size:13px;margin-bottom:6px}
  #dlgB{font-size:14.5px;line-height:1.5;color:#eef1f5;white-space:pre-wrap}
  #dlgGo{margin-top:12px;text-align:center;padding:11px;border-radius:11px;font-weight:800;
    background:linear-gradient(180deg,#4a6c9c,#2a405e);border:1px solid #cfe0f4;cursor:pointer}
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#a8bcd4;
    background:rgba(8,10,14,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(200,215,235,.4);background:#0006}
  #dlgCara.on{display:block}

  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}
  /* PISTA: que hace el boton USAR ahora mismo. Sin esto el boton se prendia y
     listo, y en PC ni siquiera hay boton a la vista: estabas encima de la cosa
     sin una sola pista de que se podia levantar ni con que tecla. */
  #pistaUso{font-size:12px;font-weight:900;letter-spacing:.08em;margin-top:3px;
    display:none;color:#ffe9a8;text-shadow:0 1px 3px rgba(0,0,0,.75)}
  #pistaUso.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(4,6,9,.16) 0%,rgba(4,6,9,.34) 55%,rgba(3,5,8,.72) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#f4f8ff,#8fa9cc);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#93a5bc;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#e8eef6;
    background:rgba(18,24,34,.8);border:1.5px solid rgba(200,215,235,.4)}
  .mbtn.go{background:linear-gradient(180deg,#4a6c9c,#2a405e);border-color:#cfe0f4}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#8fa9cc;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#93a5bc;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(12,16,22,.72);border:1.5px solid rgba(200,215,235,.35);color:#c6d4e6}
  .chip.on{background:linear-gradient(180deg,#4a6c9c,#2a405e);border-color:#cfe0f4;color:#f4f8ff}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#050608;color:#93a5bc;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div><div id="pistaUso"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="hudTop">
    <div class="bt ico" id="bSon">🔊</div>
    <div class="bt" id="bCorre">RUN</div>
    <div class="bt ico" id="bMenu">☰</div>
  </div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
  </div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
  <div id="dlg"><div id="dlgFila"><canvas id="dlgCara" width="96" height="96"></canvas><div style="flex:1;min-width:0"><div id="dlgT"></div><div id="dlgB"></div></div></div><div id="dlgGo">SEGUIR ▸</div></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="aviso"></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <div id="mSello"></div>
  <h1>LUNA</h1>
  <div class="sub">mar de la serenidad · la Tierra entera sobre tu cabeza</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>
  <div class="fila" id="fLang">
    <div class="chip" data-l="es">ESPAÑOL</div>
    <div class="chip" data-l="en">ENGLISH</div>
    <div class="chip" data-l="pt">PORTUGUÊS</div>
  </div>
  <div class="filaT" id="tGfx">GRÁFICOS</div>
  <div class="fila" id="fGfx">
    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">CARGANDO LA LUNA…</div>

<script>
/* ============================================================================
   LUNA — el segundo mundo hermano: el mar de la Serenidad, 100% procedural.
   Cielo NEGRO con novecientas estrellas pintadas y la vía láctea en diagonal;
   la TIERRA entera colgada del cielo (canvas: océanos, continentes, nubes y
   terminador), visible de día y de noche porque acá no hay atmósfera que la
   tape. Por lo mismo: sombras DURÍSIMAS, sin niebla de verdad (la "niebla"
   es negra y lejana: el vacío), y NO se oye el viento — se oye TU PROPIA
   RESPIRACIÓN dentro del casco, el enlace de radio del módulo cuando estás
   cerca, y estática del espacio profundo en la cara nocturna.

   Terreno: mare llano con CRÁTERES de verdad (cuenca + borde levantado),
   una GRIETA sísmica fresca que corta el mapa (el terreno se hunde a lo
   largo de un segmento) y colinas suaves. Caminar es FLOTADO: un sexto de
   gravedad en el ritmo del paso.

   HISTORIA (6 caps, ES/EN/PT): sos SELENE, ingeniera de la base. El sismo
   lunar cortó el cable entre el campo solar y la planta de oxígeno: módulo →
   grieta (el cable cortado) → colina del depósito (el repuesto, y la Tierra
   en tu pulgar) → seguir las balizas → radiotelescopio (el empalme, USAR) →
   volver a casa respirando.
   ========================================================================== */
(async () => {
'use strict';
const Q = new URLSearchParams(location.search);
const LOC = Q.has('local');
/* CERO descargas de assets: todas las texturas se pintan al vuelo.
   Lo único que llega de la red es three.js. */
/* assets compartidos de los mundos hermanos (cielos, modelos 3D, audio). Se
   define acá arriba —antes del armado del mundo— porque los mk_*.py insertan
   propGLB()/AX() en el cuerpo del build, que corre mucho antes. */
const HASHAX = 'fb644fc';
const AX = f => (LOC ? '/assets/mundos/'
  : 'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@' + HASHAX + '/assets/mundos/') + f;
const TRE = LOC ? '/_vthree/build/three.module.js'
  : 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* importmap ANTES de cargar GLTFLoader (que importa 'three' por specifier).
   Se inyecta al vuelo: el import de three es por URL absoluta, así que no lo
   afecta, y el mapa resuelve el 'three' de GLTFLoader al MISMO módulo. */
{
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: TRE } });
  document.head.appendChild(im);
}
const T = await import(TRE);
/* GLTFLoader para los personajes 3D generados (riggeados + animados). Si por
   lo que sea no carga, GLTF queda null y todo cae al personaje procedural. */
let GLTF = null;
try {
  const GLU = LOC ? '/_vthree/examples/jsm/loaders/GLTFLoader.js'
    : 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
  GLTF = (await import(GLU)).GLTFLoader;
} catch (e) {}
const $ = i => document.getElementById(i);

/* ---------------- azar reproducible: el valle es SIEMPRE el mismo ---------- */
let _s = 20270420;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- terreno: ruido de valor FBM, determinista ---------------- */
const MAPA = 900, MITAD = MAPA / 2;
function hash2(i, j){
  /* Math.imul, no `*`: en JS el producto de enteros grandes se hace float y
     PIERDE los bits bajos (>2^53) — el hash quedaba sesgado hacia abajo y el
     ruido casi nunca pasaba de 0,36. Medido: la compuerta de densidad rechazaba
     3.356 de 3.481 celdas y el "bosque" tenía 83 árboles. */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260801;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* PUNTOS DE LA HISTORIA (fijos, el terreno se allana alrededor) */
const POI = {
  inicio:         { x: 0,    z: 390 },
  modulo:         { x: 130,  z: 240 },
  grieta:         { x: -70,  z: 70 },
  colina:         { x: -215, z: -110 },
  radiotelescopio:{ x: 90,   z: -300 },
  crater:         { x: 210,  z: -120 }
};
/* CRÁTERES chicos regados por el mare: cuenca + borde, deterministas */
const CRATERES = [];
for (let i = 0; i < 9; i++){
  const cx = rr(-MITAD + 80, MITAD - 80), cz = rr(-MITAD + 80, MITAD - 80);
  if (Math.hypot(cx - POI.modulo.x, cz - POI.modulo.z) < 70) continue;
  CRATERES.push([cx, cz, rr(14, 38), rr(2.2, 5.5)]);
}
/* la GRIETA sísmica: el terreno se HUNDE a lo largo de un segmento; el
   allanado del punto de historia deja un puente de tierra justo donde la
   historia te hace cruzar */
const GA = { x: POI.grieta.x - 90, z: POI.grieta.z - 55 };
const GB = { x: POI.grieta.x + 90, z: POI.grieta.z + 55 };
function alturaBase(x, z){
  let h = fbm(x * .006 + 140, z * .006 + 88) * 20 - 7;    /* mare llano */
  h += fbm(x * .02 + 71, z * .02 + 26) * 3;
  /* el cráter grande */
  const dl = Math.hypot(x - POI.crater.x, z - POI.crater.z);
  h -= 22 * Math.exp(-(dl * dl) / (130 * 130));
  h += 6.5 * Math.exp(-((dl - 165) * (dl - 165)) / (44 * 44));
  /* los cráteres chicos */
  for (const [cx, cz, r, prof] of CRATERES){
    const d = Math.hypot(x - cx, z - cz);
    h -= prof * Math.exp(-(d * d) / (r * r * .32));
    h += prof * .38 * Math.exp(-((d - r) * (d - r)) / (r * r * .06));
  }
  /* la colina del depósito */
  const dr = Math.hypot(x - POI.colina.x, z - POI.colina.z);
  h += 13 * Math.exp(-(dr * dr) / (160 * 160));
  /* la grieta: distancia perpendicular al segmento GA-GB */
  {
    const abx = GB.x - GA.x, abz = GB.z - GA.z;
    const t = Math.max(0, Math.min(1,
      ((x - GA.x) * abx + (z - GA.z) * abz) / (abx * abx + abz * abz)));
    const ds = Math.hypot(x - (GA.x + abx * t), z - (GA.z + abz * t));
    const borde = Math.min(t, 1 - t) * 8;                /* se cierra en las puntas */
    h -= 9 * Math.exp(-(ds * ds) / (6.5 * 6.5)) * Math.min(1, borde);
  }
  return h;
}
function H(x, z){
  let h = alturaBase(x, z);
  for (const k in POI){
    if (k === 'crater') continue;
    const p = POI[k];
    const d = Math.hypot(x - p.x, z - p.z);
    const w = Math.exp(-(d * d) / (26 * 26));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* la SENDA: huellas de botas y de rover entre los puntos */
const SENDA = [POI.inicio, POI.modulo, POI.grieta, POI.colina, POI.radiotelescopio];
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 7.3, i * 5.9) - .5) * 110;
  const mz = (a.z + b.z) / 2 + (fbm(i * 6.7, i * 2.3) - .5) * 110;
  const seg = [];
  for (let k = 0; k <= 24; k++){
    const t = k / 24, u = 1 - t;
    const P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
for (const k in POI) POI[k].h = alturaBase(POI[k].x, POI[k].z);


/* ==================== TEXTURAS PROCEDURALES (canvas) ========================
   No hay créditos de generación: acá TODO se PINTA. Cada textura es un canvas
   con ruido FBM azulejable (retícula en módulo, del mismo motor del terreno),
   así que empalman sin costura y no pesan un byte de descarga. */
const lienzo = (n, fn) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const valT = (x, y, per) => {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
  const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
  return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
};
const fbmT = (x, y, per, oct) => {
  let v = 0, amp = .55, p = per;
  for (let o = 0; o < oct; o++){ v += amp * valT(x * p, y * p, p); amp *= .5; p *= 2; }
  return cl(v, 0, 1);
};
const mezC = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
/* suelo genérico: dos colores por FBM + pecas (piedritas y chispas de polvo)
   + rayas de duna opcionales (ondas de arena talladas por el viento) */
function texSuelo(n, colA, colB, pecas, rayas){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      let t = fbmT(x / n, y / n, 6, 4);
      if (rayas){
        const w = Math.sin((y / n * 18 + fbmT(x / n, y / n, 5, 3) * 2.6) * 6.283);
        t = cl(t * .55 + .45 * (.5 + .5 * w), 0, 1);
      }
      let c = mezC(colA, colB, t);
      const r = hash2(x + 7, y + 13);
      if (pecas && r > .965) c = mezC(c, [30, 20, 16], .55);
      else if (pecas && r < .018) c = mezC(c, [255, 232, 205], .3);
      const gr = .92 + .16 * hash2(x + 91, y + 57);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* chapa de nave: paneles con junta, remaches y mugre de polvo en las costuras */
function texMetal(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const px2 = x % 64, py = y % 48;
      let c = mezC([196, 202, 206], [166, 174, 181], fbmT(x / n, y / n, 5, 3));
      if (px2 < 2 || py < 2) c = [118, 126, 133];
      if ((px2 - 7) * (px2 - 7) + (py - 7) * (py - 7) < 4) c = [108, 116, 123];
      c = mezC(c, [152, 96, 58], .4 * fbmT(x / n + .3, y / n + .7, 7, 3) *
        fbmT(x / n, y / n, 3, 2));
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* celda fotovoltaica: azul profundo con retícula clara y reflejos */
function texPanel(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const cx = x % 42, cy2 = y % 42;
      let c = mezC([15, 27, 56], [34, 58, 104], fbmT(x / n, y / n, 6, 3));
      if (cx < 3 || cy2 < 3) c = [186, 194, 202];
      if (hash2(x + 3, y + 9) > .994) c = [130, 170, 230];
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* el CIELO lunar: NEGRO, novecientas estrellas y la vía láctea en diagonal.
   Bajo el horizonte, un gris de regolito para que el PMREM refleje algo. */
const cieloM = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#020204'; g.fillRect(0, 0, 1024, 512);
  /* vía láctea: banda diagonal de nebulosidad tenue */
  for (let i = 0; i < 60; i++){
    const t = i / 60;
    const x = t * 1024, y = 120 + Math.sin(t * 3.1) * 40 + t * 60;
    g.fillStyle = 'rgba(180,190,220,' + (.015 + rnd() * .02).toFixed(3) + ')';
    g.beginPath(); g.ellipse(x, y, 30 + rnd() * 60, 8 + rnd() * 18, .4, 0, 6.284); g.fill();
  }
  /* estrellas: más densas cerca de la banda */
  for (let i = 0; i < 900; i++){
    const x = rnd() * 1024, y = rnd() * 250;
    const enBanda = Math.abs(y - (120 + Math.sin(x / 1024 * 3.1) * 40 + x / 1024 * 60)) < 46;
    if (!enBanda && rnd() < .45) continue;
    const b = .35 + rnd() * .65;
    g.fillStyle = 'rgba(' + (220 + rnd() * 35 | 0) + ',' + (220 + rnd() * 35 | 0) +
      ',255,' + b.toFixed(2) + ')';
    const r = rnd() < .06 ? 1.6 : .8;
    g.fillRect(x, y, r, r);
  }
  /* bajo el horizonte: el resplandor muerto del regolito */
  const d = g.createLinearGradient(0, 256, 0, 512);
  d.addColorStop(0, '#17171a');
  d.addColorStop(.2, '#101012');
  d.addColorStop(1, '#050506');
  g.fillStyle = d; g.fillRect(0, 256, 1024, 256);
  const t = new T.CanvasTexture(c);
  t.mapping = T.EquirectangularReflectionMapping;
  t.colorSpace = T.SRGBColorSpace;
  return t;
})();
/* mismas CLAVES que el motor: pasto=regolito, tierra=arena de la senda,
   hojarasca=grava oscura, roca=basalto (por pendiente) */
const TX = {
  pasto:     texSuelo(256, [97, 95, 92], [130, 127, 122], true, false),
  tierra:    texSuelo(256, [146, 143, 138], [168, 164, 158], false, false),
  hojarasca: texSuelo(256, [70, 69, 68], [102, 100, 96], true, false),
  roca:      texSuelo(256, [82, 80, 77], [118, 114, 109], true, false),
  metal:     texMetal(256),
  panel:     texPanel(256),
  oscuro:    texSuelo(128, [34, 33, 32], [58, 56, 53], true, false),
  cielo:     cieloM
};

/* ================================ ESCENA =================================== */
const ren = new T.WebGLRenderer({ canvas: $('gl'), antialias: false,
  powerPreference: 'high-performance' });
ren.outputColorSpace = T.SRGBColorSpace;
/* GOTY: tone mapping FÍLMICO (ACES) — los blancos ruedan suave en vez de
   recortarse, los atardeceres saturan como en cine — y SOMBRAS suaves (PCF).
   La exposición la maneja el ciclo del día, capítulo a capítulo. */
ren.toneMapping = T.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.12;
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = TX.cielo;
scene.backgroundIntensity = 1;
/* el canvas del cielo ya trae un "suelo" pintado bajo el horizonte: el PMREM
   sale directo, sin el parche que necesitaba la foto de SENDA */
const pm = new T.PMREMGenerator(ren);
scene.environment = pm.fromEquirectangular(TX.cielo).texture;
scene.fog = new T.Fog(new T.Color('#030304'), 200, 1200);
const cam = new T.PerspectiveCamera(72, 1, .1, 1200);
cam.rotation.order = 'YXZ';

/* luz: UNA direccional (el sol) + hemisferio. Lambert por fragmento.
   El sol PROYECTA SOMBRA: su caja de sombra (±78 m) viaja pegada al jugador —
   con un mapa de 900 m una sola caja fija daría texels de medio metro; así el
   texel queda en ~15 cm y las copas dibujan sombra de verdad sobre el sendero. */
const SOLD = new T.Vector3(.5, .7, .3).normalize();   /* dirección actual del sol */
const sol = new T.DirectionalLight(0xffffff, 2.7);
sol.position.copy(SOLD).multiplyScalar(420);
{
  const sc = sol.shadow.camera;
  sc.left = sc.bottom = -78; sc.right = sc.top = 78;
  sc.near = 40; sc.far = 760;
  sol.shadow.mapSize.set(1024, 1024);
  sol.shadow.bias = -0.0006;
  sol.shadow.normalBias = 1.6;      /* sin esto el terreno de quads de 5 m se acnea */
}
scene.add(sol); scene.add(sol.target);
/* el "cielo" que rebota acá es la TIERRA: luz cenicienta azulada */
const hemi = new T.HemisphereLight(0x8fa4c8, 0x1a1a1c, .32);
scene.add(hemi);
/* el DESTELLO del sol: un sprite aditivo donde apunta SOLD. Con niebla y ACES
   es lo que hace que mirar contra el sol "queme" como en un juego grande. */
const glare = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const d = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  d.addColorStop(0, 'rgba(255,248,225,1)');
  d.addColorStop(.12, 'rgba(255,238,190,.85)');
  d.addColorStop(.4, 'rgba(255,214,140,.22)');
  d.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = d; g.fillRect(0, 0, 128, 128);
  const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c),
    transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
  s.scale.set(300, 300, 1);
  scene.add(s);
  return s;
})();
/* la ventana de la cabaña, de noche, VUELCA luz cálida al porche */
const focoCasa = new T.PointLight(0xffb46a, 0, 26, 1.7);
scene.add(focoCasa);
/* LA TIERRA, entera, PINTADA: océanos, continentes, nubes y terminador.
   No es un puntito: a esta distancia la Tierra se ve cuatro veces más grande
   que la Luna desde la Tierra. Siempre visible: acá no hay atmósfera. */
const LUNAS = [];
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(64, 64, 60, 0, 6.284); g.clip();
  g.fillStyle = '#2a5f9e'; g.fillRect(0, 0, 128, 128);       /* océano */
  for (let i = 0; i < 9; i++){                                /* continentes */
    g.fillStyle = i % 2 ? '#4a7a3a' : '#8a7a4e';
    const x = rnd() * 128, y = rnd() * 128;
    g.beginPath();
    g.ellipse(x, y, 10 + rnd() * 22, 8 + rnd() * 14, rnd() * 3, 0, 6.284);
    g.fill();
  }
  for (let i = 0; i < 26; i++){                               /* nubes */
    g.fillStyle = 'rgba(255,255,255,' + (.25 + rnd() * .3).toFixed(2) + ')';
    const x = rnd() * 128, y = rnd() * 128;
    g.beginPath();
    g.ellipse(x, y, 6 + rnd() * 16, 2.5 + rnd() * 5, rnd() * 3, 0, 6.284);
    g.fill();
  }
  const term = g.createLinearGradient(20, 0, 108, 0);         /* terminador */
  term.addColorStop(0, 'rgba(0,0,8,.88)');
  term.addColorStop(.42, 'rgba(0,0,8,0)');
  g.fillStyle = term; g.fillRect(0, 0, 128, 128);
  /* halo atmosférico */
  g.restore ? 0 : 0;
  const c2 = document.createElement('canvas'); c2.width = c2.height = 144;
  const g2 = c2.getContext('2d');
  const halo = g2.createRadialGradient(72, 72, 56, 72, 72, 70);
  halo.addColorStop(0, 'rgba(140,180,255,.5)');
  halo.addColorStop(1, 'rgba(140,180,255,0)');
  g2.fillStyle = halo; g2.beginPath(); g2.arc(72, 72, 70, 0, 6.284); g2.fill();
  g2.drawImage(c, 8, 8);
  const sp = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c2),
    transparent: true, opacity: .98, depthWrite: false, fog: false }));
  sp.scale.set(118, 118, 1);
  sp.userData.dir = new T.Vector3(.5, .48, -.38).normalize();
  scene.add(sp); LUNAS.push(sp);
}

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = tierra del sendero · G = hojarasca bajo el bosque. Se pinta UNA vez en un
   canvas de 512: el sendero como trazo gordo entre los puntos de la historia,
   la hojarasca como manchas de ruido donde después van los árboles. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* grava oscura: manchas */
  g.fillStyle = '#003800';
  for (let i = 0; i < 900; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 6 + rnd() * 22;
    if (vnoise(x * .02, y * .02) < .52) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.284); g.fill();
  }
  g.filter = 'blur(6px)';
  g.drawImage(SPL, 0, 0);
  g.filter = 'none';
  /* el sendero: R fuerte, con borde difuso */
  for (const [w, c] of [[16, 'rgba(140,0,0,.55)'], [8, 'rgba(255,0,0,.85)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* claros: cabaña y santuario sin hojarasca, con algo de tierra */
  for (const k of ['modulo', 'radiotelescopio']){
    g.fillStyle = 'rgba(160,0,0,.5)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 12, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4
   texturas, pero con TODO el pipeline de three gratis — RECIBE las sombras del
   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo
   (antes el terreno y los árboles se iluminaban por recetas distintas y había
   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 7 }
};
const matTerr = new T.MeshLambertMaterial({ map: TX.pasto });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  /* en calidad baja, un solo tap: cuatro muestras a pantalla llena es relleno de
     pixeles, que es lo que mata a un telefono de gama baja. */
  try { if (typeof GFX !== 'undefined' && (GFX === 'b' || GFX === 'bajos'))
    sh.defines = Object.assign({}, sh.defines, { SUELO_BARATO: '' }); } catch(e){}
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;
      /* ---- SUELO SIN REJILLA: teselado estocastico ----
         Una sola muestra a escala fija repite el mismo parche decenas de veces
         ALINEADO, y a media distancia el ojo encuentra las filas enseguida: es la
         cuadricula que se veia. Aca cada celda del parche se lee con un
         desplazamiento Y un giro sacados de su propia posicion, y las cuatro celdas
         vecinas se cruzan con pesos bilineales al cubo. Sin periodo no hay rejilla. */
      float h21_(vec2 p){ return fract(sin(dot(p, vec2(41.31, 289.07))) * 43758.5453); }
      vec2 h22_(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)),
                                               dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
      float ruido_(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h21_(i), h21_(i + vec2(1.0, 0.0)), f.x),
                   mix(h21_(i + vec2(0.0, 1.0)), h21_(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      vec3 sinGrilla_(sampler2D t, vec2 uv){
        vec2 cel = floor(uv), f = fract(uv);
        #if defined(SUELO_BARATO)
          vec2 h = h22_(cel);
          float a = h.x * 6.2831853;
          mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
          return texture2D(t, R * (uv - cel - 0.5) + h).rgb;
        #else
          vec3 acc = vec3(0.0); float ws = 0.0;
          for (int j = 0; j < 2; j++){ for (int i = 0; i < 2; i++){
            vec2 c = cel + vec2(float(i), float(j));
            vec2 h = h22_(c);
            float a = h.x * 6.2831853;
            mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
            float w = (1.0 - abs(f.x - float(i))) * (1.0 - abs(f.y - float(j)));
            w = w * w * w;
            acc += texture2D(t, R * (uv - c) + h).rgb * w; ws += w;
          } }
          return acc / max(ws, 1e-4);
        #endif
      }`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = sinGrilla_(map, uvT);
      c = mix(c, sinGrilla_(tHoja, uvT*1.3), clamp(spl.g*1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT*1.6).rgb, clamp(spl.r*1.35, 0., 1.));
      c = mix(c, sinGrilla_(tRoca, uvT*.9), vRocoso);
      /* la luz del suelo varia en dos frecuencias: manchones grandes y grano cercano.
         Sin esto, incluso sin rejilla, todo el terreno se lee con el mismo brillo. */
      c *= 0.86 + 0.20 * ruido_(vMapUv * 6.3) + 0.14 * ruido_(vMapUv * 71.0);
      diffuseColor.rgb *= c;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    scene.add(m);
    terrChunks.push(m);
  }
}

/* falda del horizonte: tapa la parte BAJA de la foto del cielo (que es oscura)
   con suelo que a esa distancia ya es color de niebla puro */
/* EL SUELO MAS BAJO DEL MUNDO. Se mide una vez, barriendo el mapa cada 12 m: unas
   5.000 llamadas a H, imperceptible al lado de las que cuesta el terreno. Hace
   falta porque la falda del horizonte estaba clavada en -10 y en varios mundos el
   suelo baja mas: los metros de abajo quedaban tapados por una chapa lisa. */
const SUELO_MIN = (() => {
  let m = 1e9;
  for (let x = -MITAD; x <= MITAD; x += 12)
    for (let z = -MITAD; z <= MITAD; z += 12){
      const h = H(x, z);
      if (h < m) m = h;
    }
  return m;
})();
{
  const f = new T.Mesh(new T.CircleGeometry(1150, 24),
    new T.MeshLambertMaterial({ color: 0x4a4a4c }));
  f.rotation.x = -Math.PI / 2;
  /* DEBAJO del suelo mas bajo, no en -10 a mano: con -10 la falda enterraba los
     crateres, las hoyas y el fondo de las gargantas, y se veia como una mancha
     lisa con el canto recto. A 1.150 m, veinte metros son un grado de
     horizonte: no se nota, y el fondo del mundo aparece. */
  f.position.y = Math.min(-10, SUELO_MIN - 8);
  f.frustumCulled = false;
  scene.add(f);
  /* PARED DE LOMAS LEJANAS: una falda plana converge exactamente a la altura del
     ojo, así que desde cualquier punto alto (la colina del roble, la cámara del
     menú) se veía la franja oscura de la foto del cielo entre la falda y el
     horizonte. Este anillo sube hasta +70 a 1.100 m: a esa distancia la niebla lo
     pinta liso y se lee como una serranía en la bruma que CIERRA el horizonte. */
  const pared = new T.Mesh(new T.CylinderGeometry(1100, 660, 78, 24, 1, true),
    new T.MeshLambertMaterial({ color: 0x3c3c40, side: T.BackSide }));
  /* la pared baja LO MISMO que la falda: si no, queda una ranura entre las dos
     por donde se ve la franja oscura de la foto del cielo. */
  pared.position.y = 31 + Math.min(0, SUELO_MIN - 8 + 10);
  pared.frustumCulled = false;
  scene.add(pared);
}

/* --------------------- EL CAMPO DE ROCAS + PIEDRITAS -----------------------
   El mare está sembrado de rocas de impacto: cuatro siluetas grises
   deformadas con ruido, más densas alrededor del cráter grande (eyecta). */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
const ARB = [];                                /* [x,z,r] choque */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (k !== 'crater' && Math.hypot(x - p.x, z - p.z) < 16) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function geoRoca(sem, punta){
  const g = new T.SphereGeometry(1, 7, 5);
  const P = g.attributes.position, UV = g.attributes.uv;
  for (let i = 0; i < P.count; i++){
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const k = .6 + .62 * vnoise(x * 2.1 + sem, z * 2.1 + y * 1.3 + sem * 2);
    P.setXYZ(i, x * k, y * k * punta, z * k);
    UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
  }
  g.computeVertexNormals();
  return g;
}
function plantar(){
  const variantes = [geoRoca(3, .55), geoRoca(17, .72), geoRoca(41, .62), geoRoca(77, .9)];
  const posV = [[], [], [], []];
  const PASO_A = 18;
  const CTA = { tot: 0, dens: 0, camino: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-5, 5), z = gz + rr(-5, 5);
    let dens = vnoise(x * .011 + 60, z * .011 + 22);
    const dl = Math.hypot(x - POI.crater.x, z - POI.crater.z);
    dens += .22 * Math.exp(-((dl - 185) * (dl - 185)) / (70 * 70));
    if (dens < .46){ CTA.dens++; continue; }
    if (dens < .58 && rnd() > (dens - .46) * 6){ CTA.dens++; continue; }
    if (molesta(x, z, 13)){ CTA.camino++; continue; }
    const y = H(x, z);
    const pend = Math.max(Math.abs(H(x + 2, z) - y), Math.abs(H(x, z + 2) - y));
    if (pend > 1.6){ CTA.dens++; continue; }
    CTA.ok++;
    const sc = rr(.5, 2.7);
    posV[(rnd() * 4) | 0].push([x, y - sc * .18, z, sc]);
    if (sc > 1.4) ARB.push([x, z, sc * .8]);
  }
  const matRoca = new T.MeshLambertMaterial({ map: TX.roca });
  for (let v = 0; v < 4; v++){
    const arr = posV[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(variantes[v], matRoca, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(0, rr(0, 6.28), rr(-.08, .08)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.85, 1.1), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;
    scene.add(im);
  }
  /* PIEDRITAS: sin colisión ni sombra, puro detalle del regolito */
  const chico = new T.InstancedMesh(geoRoca(5, .5), matRoca, 400);
  for (let i = 0; i < 400; i++){
    const x = rr(-MITAD + 8, MITAD - 8), z = rr(-MITAD + 8, MITAD - 8);
    const sc = rr(.08, .3);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, H(x, z) - sc * .2, z), Q4, new T.Vector3(sc, sc, sc));
    chico.setMatrixAt(i, M4);
  }
  chico.frustumCulled = false;
  scene.add(chico);
  /* CARGA CAÍDA del alunizaje: cajas y chapas regadas cerca de la senda
     entre el módulo y la grieta — la historia sin palabras */
  const matMet = new T.MeshLambertMaterial({ map: TX.metal });
  for (let i = 0; i < 6; i++){
    const t = .15 + i * .13;
    const a = POI.modulo, b = POI.grieta;
    const x = a.x + (b.x - a.x) * t + rr(8, 16) * (i % 2 ? 1 : -1);
    const z = a.z + (b.z - a.z) * t + rr(8, 16) * (i % 2 ? -1 : 1);
    const m = new T.Mesh(new T.BoxGeometry(rr(1.2, 2.4), .08, rr(.8, 1.6)), matMet);
    m.position.set(x, H(x, z) + .05, z);
    m.rotation.set(rr(-.3, .3), rr(0, 6.28), rr(-.25, .25));
    m.castShadow = true;
    scene.add(m);
  }
}
plantar();

/* luz por capítulo: dirección/intensidad del sol, cielo, niebla, hemisferio y

const LUZCAP = [
  { sol: [.5, .55, .3],  solI: 2.7, bg: 1.0, fog: '#030304', fogFar: 1300, hemiI: .32, exp: 1.05 },
  { sol: [.2, .75, .2],  solI: 2.9, bg: 1.0, fog: '#030304', fogFar: 1300, hemiI: .34, exp: 1.05 },

let luzDe = LUZCAP[0], luzA = LUZCAP[0], luzK = 1;

function ponCap(n, silencio){

function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* sin atmósfera no hay atardecer de colores: el sol es blanco hasta abajo */
  /* la ventana de la cabaña se enciende sola cuando oscurece, y VUELCA luz */
  if (ventanaMat){
    const osc = cl(1 - (SOLD.y * 420) / 160, 0, 1);
    ventanaMat.color.setRGB(.35 + .65 * osc, .29 + .55 * osc, .2 + .28 * osc);
    focoCasa.intensity = osc * osc * 60;
  }
}

/* ================= AUDIO GENERADO (Higgsfield) ============================
   Ambiente + música + pasos por mundo, cargados SOBRE el sintetizado: cuando
   decodifican lo apagan; si una URL falla (offline o el navegador no decodifica
   AAC) el sintetizado sigue solo. Vive acá (motor compartido) y no en la
   sección AMB, que cada mundo reescribe. Los mk_*.py pisan MUNDO_AUDIO. */
const MUNDO_AUDIO = { amb: 'amb-luna.mp3', mus: 'mus-luna.m4a', paso: 'pasos-arena.mp3', pasoRate: 1.1 };
/* CIELO fotográfico generado (equirectangular). Vacío = deja el cielo actual
   (senda ya trae su foto). Los mk_*.py lo pisan con el de cada mundo. Se carga
   y reemplaza el fondo pintado; si falla, queda el pintado. */
const MUNDO_CIELO = 'cielo-luna.jpg';
/* disposición del MENÚ por mundo (clases en #menu): cada juego arma su portada
   distinta. '' = centrado (senda). Los mk_*.py lo pisan. */
const MUNDO_MENU = 'm-der';
/* PROPS 3D generados (Tripo, estáticos): edificios/vehículos de cada mundo.
   Se colocan en su POI, se apoyan en el terreno y OCULTAN la estructura
   procedural (que pasa como grupo en `ocultar`). Si el GLB no llega, queda la
   procedural. Los mk_*.py llaman propGLB en su bloque de estructura. */
function propGLB(o){
  if (!GLTF){ return; }
  new GLTF().load(AX(o.url), g => {
    const m = g.scene;
    m.scale.setScalar(o.esc || 1);
    m.rotation.set(o.rx || 0, o.giro || 0, o.rz || 0);
    m.position.set(o.x, 0, o.z);
    m.traverse(n => { if (n.isMesh){ n.castShadow = true; n.receiveShadow = true;
      n.frustumCulled = false; if (n.material) n.material.metalness = 0; } });
    /* AUTO-APOYO: el punto más bajo del modelo se posa en el suelo + o.y */
    m.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(m);
    m.position.y = H(o.x, o.z) + (o.y || 0) - caja.min.y;
    scene.add(m);
    if (o.ocultar){ const a = Array.isArray(o.ocultar) ? o.ocultar : [o.ocultar];
      for (const x of a) x.visible = false; }         /* apagar la procedural */
    window.__PROPS = (window.__PROPS || 0) + 1;
  }, undefined, () => {});
}
function cargarCieloFoto(){
  if (!MUNDO_CIELO) return;
  new T.TextureLoader().load(AX(MUNDO_CIELO), tex => {
    tex.mapping = T.EquirectangularReflectionMapping;
    tex.colorSpace = T.SRGBColorSpace;
    scene.background = tex;
    /* HIELO dibuja el cielo en un DOMO; los demás usan scene.background */
    if (typeof DOMO !== 'undefined' && DOMO){ DOMO.material.map = tex; DOMO.material.needsUpdate = true; }
  }, undefined, () => {});
}
function cargarAudioReal(){
  const A2 = AMB.ctx; if (!A2 || AMB._cargado) return;
  AMB._cargado = true;
  const carga = async url => A2.decodeAudioData(await (await fetch(url)).arrayBuffer());
  /* música y pasos en PARALELO e independientes: si el m4a no decodifica (AAC),
     los pasos no lo esperan. El AMBIENTE viene del sintetizado del motor (viento
     limpio + voces de cada mundo): la pista de ambiente generada traía golpes y
     jadeos que sonaban raro al estar quieto, así que no se usa. */
  carga(AX(MUNDO_AUDIO.mus)).then(bm => {
    const nm = A2.createBufferSource(); nm.buffer = bm; nm.loop = true;
    AMB.musGain = A2.createGain(); AMB.musGain.gain.value = .3;
    nm.connect(AMB.musGain); AMB.musGain.connect(AMB.master); nm.start();
  }).catch(() => {});
  carga(AX(MUNDO_AUDIO.paso)).then(bp => {
    AMB.pasoSrc = A2.createBufferSource(); AMB.pasoSrc.buffer = bp; AMB.pasoSrc.loop = true;
    AMB.pasoSrc.playbackRate.value = MUNDO_AUDIO.pasoRate || 1.4;
    AMB.pasoGain = A2.createGain(); AMB.pasoGain.gain.value = 0;
    AMB.pasoSrc.connect(AMB.pasoGain); AMB.pasoGain.connect(AMB.master); AMB.pasoSrc.start();
  }).catch(() => {});
}

/* ========================= CINEMÁTICAS =====================================
   Cámara sobre rieles: cada paso vuela de `de` a `a` mirando a `mira`, con
   subtítulo y letterbox. Se saltea con un toque. El sol (y su caja de sombra)
   siguen a la cámara mientras dura. */
const CINE = { on: false, i: 0, t: 0, pasos: null, fin: null };
const _cv1 = new T.Vector3(), _cv2 = new T.Vector3(), _cv3 = new T.Vector3();
function cinematica(pasos, fin){
  CINE.on = true; CINE.pasos = pasos; CINE.i = 0; CINE.t = 0; CINE.fin = fin || null;
  fase = 'cine';
  $('hud').classList.remove('on');
  document.body.classList.add('cine');
}
function terminaCine(){
  if (!CINE.on) return;
  CINE.on = false;
  document.body.classList.remove('cine');
  $('cineTxt').textContent = '';
  fase = 'juego';
  $('hud').classList.add('on');
  cam.fov = 72; cam.updateProjectionMatrix();
  if (CINE.fin){ const f = CINE.fin; CINE.fin = null; f(); }
}
function pasoCine(dt){
  const p = CINE.pasos[CINE.i];
  if (!p){ terminaCine(); return; }
  CINE.t = Math.min(1, CINE.t + dt / (p.dur || 3));
  const k = CINE.t * CINE.t * (3 - 2 * CINE.t);
  _cv1.set(p.de[0], p.de[1], p.de[2]);
  _cv2.set(p.a[0], p.a[1], p.a[2]);
  cam.position.lerpVectors(_cv1, _cv2, k);
  _cv3.set(p.mira[0], p.mira[1], p.mira[2]);
  cam.lookAt(_cv3);
  cam.fov = p.fov || 58; cam.updateProjectionMatrix();

/* la cine de CAPÍTULO: dos tomas que muestran adónde hay que ir */
function cineObjetivo(C){
  const o = POI[C.obj], oy = H(o.x, o.z), py = H(px, pz);
  const dx2 = o.x - px, dz2 = o.z - pz, dd = Math.hypot(dx2, dz2) || 1;
  const ux = dx2 / dd, uz = dz2 / dd;
  cinematica([
    { de: [px - ux * 7, py + 3.5, pz - uz * 7], a: [px + ux * 8, py + 15, pz + uz * 8],
      mira: [o.x, oy + 6, o.z], dur: 2.7, txt: C.n + ' · ' + C.t },
    { de: [o.x - ux * 44 + uz * 12, oy + 19, o.z - uz * 44 - ux * 12],
      a: [o.x - ux * 15, oy + 6, o.z - uz * 15],
      mira: [o.x, oy + 3.5, o.z], dur: 2.7, txt: C.objT }
  ]);
}

const MIXERS = [];

/* ====================== BIBLIOTECA DE CLIPS PRESTADOS =====================
   Los personajes del repo salieron todos del mismo tipo de rig: comparten los
   NUEVE huesos estandar (Hips, Spine, LeftArm, RightArm, LeftForeArm,
   RightForeArm, LeftUpLeg, RightUpLeg, Head). El AnimationMixer de three ata
   las pistas de un clip POR NOMBRE DE NODO, asi que un clip de un modelo anda
   igual en otro. Por eso no hace falta generar animacion para cada personaje:
   se PRESTA la que ya existe en el repo.
     viajera.glb / dante.glb  ->  solo traen Idle (patinaban sin mover la pierna)
     hyper/char.glb           ->  Casual_Walk
     reliquia/hero.glb        ->  RunFast
     aero/hero-idle.glb       ->  Idle
   Se cargan los tres donantes UNA sola vez y se reparten a todos. */
const CLIPS = { quieto: null, andar: null, correr: null, listos: 0, cola: [] };
{
  /* reliquia/hero.glb y aero/hero-idle.glb piden KHR_draco_mesh_compression
     como extension REQUERIDA, asi que el GLTFLoader los rechaza enteros y no
     cargaban. DRACO comprime solo la GEOMETRIA: las pistas de animacion son
     accesores normales. Asi que se extrajeron a GLB de SOLO ANIMACION (sin
     mallas, sin skins, sin texturas): 39 y 85 KB, sin ninguna extension.
     Ver scratchpad/mundos/extrae_clip.py. */
  const DON = [['andar', AX('anim/andar.glb')], ['correr', AX('anim/correr.glb')],
               ['quieto', AX('anim/quieto2.glb')]   /* Idle, no Idle_02: el 02 es el de
                 MIRAR A LOS COSTADOS, que molesta y encima pelea con el de
                 caminar cada vez que se cambia de clip */];
  const fin = () => {
    CLIPS.listos++;
    if (CLIPS.listos < DON.length) return;
    /* los personajes que cargaron antes que la biblioteca esperan en la cola */
    for (const npc of CLIPS.cola.splice(0)) armarAcciones(npc);
  };
  for (const [k, u] of DON){
    if (!GLTF){ fin(); continue; }
    new GLTF().load(u, g => {
      if (g.animations && g.animations.length){
        CLIPS[k] = g.animations[0];
        /* la POSE DE REPOSO del donante: sin esto no se puede retargetear */
        CLIPS[k + 'Rest'] = reposoDe(g.scene);
      }
      fin();
    }, undefined, fin);
  }
}
/* ======================== RETARGET DE LOS CLIPS ===========================
   Los 11 personajes de per/*.glb no traen animacion y se les presta uno de los
   tres clips de anim/*.glb. Comparten los MISMOS 26 nombres de hueso, pero NO la
   pose de reposo: el rig sale ajustado a cada malla y los marcos de cada
   articulacion quedan girados de cualquier manera. Medido sobre los GLB, la
   rotacion local de reposo de Hips va de 2,4 grados en canon-cuerdas a 133,5 en
   volcan-obrero, y la de Spine02 de 6,0 a 133,5.

   POR QUE NO ALCANZA UNA CORRECCION FIJA POR HUESO (lo que habia antes)
   Se hacia  q_donante * inv(reposoDonante) * reposoDestino , o sea una constante
   por hueso. Eso puede acertar UN fotograma pero no todos: la rotacion local se
   compone en el marco del PADRE, y ese marco cambia en cada fotograma cuando el
   padre se mueve. Con las caderas a cien grados de diferencia una constante no
   puede ser correcta a la vez para el reposo y para el movimiento, y por eso el
   personaje quedaba derecho quieto pero encorvado al caminar.

   LO QUE SE HACE AHORA: espacio de MUNDO, que es donde "girar el brazo treinta
   grados hacia adelante" significa lo mismo en los dos rigs. Por hueso b y
   fotograma f:
       delta   = mundoAnimadoDonante(b) * inv(mundoReposoDonante(b))
       mundoDestino(b) = delta * mundoReposoDestino(b)
       localDestino(b) = inv(mundoDestino(padre)) * mundoDestino(b)
   El pase va de padre a hijo porque mundoDestino(padre) es el resultado YA
   corregido: ahi esta justamente la parte que una constante no puede reproducir.

   El cero del donante viaja dentro del propio GLB: mk_anim.py le dejo como pose
   de reposo de los nodos la POSE NEUTRA del clip (el promedio de sus fotogramas),
   asi que aca no hay que promediar nada. Eso importa porque los clips de la
   libreria vienen con un sesgo constante grande (Idle tiene la cadera 40 grados
   fuera de su bind, Run_02 la columna 27) y si se tomara ese sesgo como cero se
   le sumaria al personaje, que es la joroba que se veia.

   Costo: 26 huesos x ~70-127 fotogramas x 3 clips por personaje, una sola vez al
   cargarlo. Son unos pocos milisegundos y no toca el bucle de dibujado, asi que
   no depende de GFX. */
const _rtQ = new T.Quaternion(), _rtI = new T.Quaternion(),
      _rtD = new T.Quaternion(), _rtL = new T.Quaternion();
/* El rig de un GLB por NOMBRE de hueso: rotacion y posicion locales de reposo
   mas el nombre del PADRE. El padre hace falta porque el retarget pasa por
   mundo; la version anterior solo guardaba q y p y por eso no podia hacerlo. */
function reposoDe(raiz){
  const R = {};
  raiz.traverse(o => {
    if (!o.name || R[o.name] !== undefined) return;
    const pa = o.parent;
    R[o.name] = { q: o.quaternion.clone(), p: o.position.clone(),
                  padre: (pa && pa.name && R[pa.name]) ? pa.name : null };
  });
  return R;
}
/* rotaciones de mundo de la pose de reposo, mas el orden padre-antes-que-hijo */
function mundoDe(rig){
  const W = {}, orden = [];
  const sube = nom => {
    if (W[nom]) return W[nom];
    const h = rig[nom];
    W[nom] = (h.padre && rig[h.padre]) ? sube(h.padre).clone().multiply(h.q)
                                       : h.q.clone();
    orden.push(nom);
    return W[nom];
  };
  for (const nom in rig) sube(nom);
  return { W, orden };
}
function retargetClip(clip, rigDon, modelo){
  if (!clip || !rigDon) return clip;
  /* el reposo se lee UNA vez y se guarda: si un personaje ya tiene acciones
     sonando, sus huesos no estan en reposo y leerlos daria un cero falso */
  const rigDst = modelo.userData._rig || (modelo.userData._rig = reposoDe(modelo));
  const A = mundoDe(rigDon), B = mundoDe(rigDst);
  const c2 = clip.clone();
  const rot = {}, pos = [];
  for (const tr of c2.tracks){
    const i = tr.name.lastIndexOf('.');
    if (i < 0) continue;
    const nom = tr.name.slice(0, i), prop = tr.name.slice(i + 1);
    if (prop === 'quaternion' && rigDon[nom] && rigDst[nom]) rot[nom] = tr;
    else if (prop === 'position') pos.push([nom, tr]);
  }
  /* mk_anim.py deja todas las pistas con el MISMO reloj, asi que se recorre por
     indice de fotograma. Si alguna vez no fuera asi, mejor devolver el clip sin
     tocar que escribir cualquier cosa. */
  let nf = -1, mezcla = false;
  for (const n in rot){
    const c = rot[n].values.length / 4;
    if (nf < 0) nf = c; else if (c !== nf) mezcla = true;
  }
  if (nf <= 0 || mezcla) return c2;

  const orden = A.orden.filter(n => rigDst[n]);
  const Wd = {}, Wt = {}, prev = {};
  for (const n of orden){ Wd[n] = new T.Quaternion(); Wt[n] = new T.Quaternion(); }
  for (let f = 0; f < nf; f++){
    // 1) pose del donante, de local a mundo
    for (const n of orden){
      const tr = rot[n];
      if (tr){ const k = f * 4;
        _rtQ.set(tr.values[k], tr.values[k+1], tr.values[k+2], tr.values[k+3]); }
      else _rtQ.copy(rigDon[n].q);
      const pa = rigDon[n].padre;
      if (pa && Wd[pa]) Wd[n].copy(Wd[pa]).multiply(_rtQ); else Wd[n].copy(_rtQ);
    }
    // 2) el giro de mundo del donante, aplicado al reposo del destino
    for (const n of orden){
      if (rot[n]){
        _rtD.copy(Wd[n]).multiply(_rtI.copy(A.W[n]).invert());
        Wt[n].copy(_rtD).multiply(B.W[n]);
      } else {
        const pa = rigDst[n].padre;
        if (pa && Wt[pa]) Wt[n].copy(Wt[pa]).multiply(rigDst[n].q);
        else Wt[n].copy(B.W[n]);
      }
    }
    // 3) de vuelta a local, que es lo que consume el AnimationMixer
    for (const n of orden){
      const tr = rot[n]; if (!tr) continue;
      const pa = rigDst[n].padre;
      if (pa && Wt[pa]) _rtL.copy(_rtI.copy(Wt[pa]).invert()).multiply(Wt[n]);
      else _rtL.copy(Wt[n]);
      /* continuidad de signo: dos cuaterniones opuestos son la misma rotacion
         pero interpolados dan la vuelta larga, y se ve un tironeo */
      const p = prev[n];
      if (p && (p[0]*_rtL.x + p[1]*_rtL.y + p[2]*_rtL.z + p[3]*_rtL.w) < 0){
        _rtL.set(-_rtL.x, -_rtL.y, -_rtL.z, -_rtL.w);
      }
      const k = f * 4;
      tr.values[k] = _rtL.x; tr.values[k+1] = _rtL.y;
      tr.values[k+2] = _rtL.z; tr.values[k+3] = _rtL.w;
      prev[n] = [_rtL.x, _rtL.y, _rtL.z, _rtL.w];
    }
  }
  /* Solo la cadera trae traslacion: mk_anim.py tiro las otras 23, que eran
     constantes y llevaban los LARGOS DE HUESO del donante (aplicadas al
     personaje le pisaban sus proporciones y le estiraban la malla). Va en delta
     y escalada por la relacion de alturas de cadera, si no un personaje bajo
     flota y uno alto se hunde. */
  for (const par of pos){
    const h = rigDon[par[0]], hd = rigDst[par[0]];
    if (!h || !hd) continue;
    const tr = par[1], k = h.p.y ? (hd.p.y / h.p.y) : 1;
    for (let i = 0; i < tr.values.length; i += 3){
      tr.values[i]     = hd.p.x + (tr.values[i]     - h.p.x) * k;
      tr.values[i + 1] = hd.p.y + (tr.values[i + 1] - h.p.y) * k;
      tr.values[i + 2] = hd.p.z + (tr.values[i + 2] - h.p.z) * k;
    }
  }
  return c2;
}
/* le arma a un personaje las tres acciones, con lo propio primero y lo prestado
   despues: si el GLB ya trae un clip de caminar, ese gana. */function armarAcciones(npc){
  const m = npc.modelo;
  if (!m) return;
  if (CLIPS.listos < 3){ if (CLIPS.cola.indexOf(npc) < 0) CLIPS.cola.push(npc); return; }
  const propios = npc.clipsPropios || [];
  const buscar = rx => propios.find(c => rx.test(c.name || '')) || null;
  /* lo PROPIO ya viene en su propio reposo: no se toca. Lo PRESTADO se
     retargetea al reposo de este modelo. */
  const pQuieto = buscar(/idle|quiet/i), pAndar = buscar(/walk|camin/i),
        pCorrer = buscar(/run|corr/i);
  const cQuieto = pQuieto || retargetClip(CLIPS.quieto, CLIPS.quietoRest, m);
  const cAndar  = pAndar  || retargetClip(CLIPS.andar,  CLIPS.andarRest,  m);
  const cCorrer = pCorrer || retargetClip(CLIPS.correr, CLIPS.correrRest, m) || cAndar;
  if (!cQuieto && !cAndar) return;
  /* Sin HUESOS no se ata nada. El perro es una sola pieza: se le ataban las tres
     acciones igual, npc.acc quedaba definido, y el balanceo a mano —lo unico que
     puede moverlo— no corria nunca porque su condicion es justamente !npc.acc.
     Estaba congelado desde el primer dia. */
  let _hue = false;
  m.traverse(o => { if (o.isBone) _hue = true; });
  if (!_hue) return;
  const mix = npc.mixer || new T.AnimationMixer(m);
  if (!npc.mixer){ npc.mixer = mix; MIXERS.push(mix); }
  const A = npc.acc = {};
  for (const par of [['quieto', cQuieto], ['andar', cAndar], ['correr', cCorrer]]){
    if (!par[1]) continue;
    let a;
    try { a = mix.clipAction(par[1]); } catch(e){ continue; }
    a.enabled = true;
    a.setEffectiveWeight(par[0] === 'quieto' ? 1 : 0);
    a.play();
    /* desfase propio: sin esto los seis personajes de un mundo respiran y giran
       la cabeza en el mismo fotograma, y se ve a un coro, no a gente */
    a.time = Math.random() * (a.getClip().duration || 1);
    A[par[0]] = a;
  }
  npc.estAnim = 'quieto';
}
/* la MEZCLA: los pesos siguen a la velocidad de verdad del personaje, asi que
   nadie patina ni corre en el lugar. */
function mezclaAcciones(npc, vel, dt){
  const A = npc.acc;
  if (!A) return;
  /* UN SOLO CLIP A LA VEZ. Mezclar por peso parece lo elegante y es lo que
     rompia todo: el mixer acumula los cuaterniones de cada pista y los normaliza,
     y con el Idle mirando a un costado y el Casual_Walk al frente, el hueso Hips
     interpolaba por el camino largo y ACOSTABA al personaje en el aire. Los
     torsos retorcidos con la cabeza en el pecho eran lo mismo, mas suave.
     Con histeresis: elegir por un umbral seco hace que a velocidad de frontera
     el personaje parpadee entre quieto y caminando cada cuadro. */
  const est = npc.estAnim || 'quieto';
  let q = est;
  if (est === 'quieto')      q = vel > 0.55 ? (vel > 4.2 ? 'correr' : 'andar') : 'quieto';
  else if (est === 'andar')  q = vel < 0.30 ? 'quieto' : (vel > 4.2 ? 'correr' : 'andar');
  else                       q = vel < 3.4 ? (vel < 0.30 ? 'quieto' : 'andar') : 'correr';
  if (!A[q]) q = A.andar ? 'andar' : 'quieto';
  if (q !== est){
    npc.estAnim = q;
    for (const k in A){
      const a = A[k];
      a.setEffectiveWeight(k === q ? 1 : 0);
      if (k === q){ a.paused = false; a.enabled = true; }
    }
  }
  /* el clip avanza al ritmo del paso: si no, se arrastra o patina */
  if (A.andar) A.andar.timeScale = cl(vel / 1.9, .55, 2.1);
  if (A.correr) A.correr.timeScale = cl(vel / 5.4, .6, 1.9);
  /* el Idle de Meshy mira a los costados. La queja no era que mire: era que lo
     hace rapido, sin parar y todos a la vez. A 0,42 el MISMO clip se lee como
     respirar, y el desfase por personaje rompe el coro. */
  if (A.quieto) A.quieto.timeScale = 0.42;
}
/* carga un personaje 3D generado y lo cuelga del Group del NPC, apagando la
   figura procedural; si falla, la procedural se queda. Reproduce su clip. */
function ponerModelo(npc){
  if (!GLTF || !npc.glb) return;
  new GLTF().load(AX(npc.glb), g => {
    const m = g.scene;
    m.scale.setScalar(npc.glbEsc || 1);
    m.position.y = npc.glbY || 0;
    m.rotation.y = npc.glbGiro || 0;
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material){ o.material.metalness = 0; } } });
    /* apagar la figura procedural (queda de respaldo si el modelo no llegó) */
    npc.fig.traverse(o => { if (o.isMesh) o.visible = false; });
    npc.fig.add(m);
    npc.modelo = m;
    if (g.animations && g.animations.length){
      /* LOS CLIPS QUE CORRESPONDEN, NO EL PRIMERO DEL ARCHIVO. Antes esto era
         `mix.clipAction(g.animations[0]).play()`, y para los modelos que solo
         traen `Idle` eso es la animacion de ESTAR QUIETO puesta encima de un
         personaje que camina: patinaba sin mover una pierna. `armarAcciones` usa
         los clips propios si los hay y presta los compartidos si no. */
      npc.clipsPropios = g.animations || [];
      armarAcciones(npc);
      const mix = npc.mixer || new T.AnimationMixer(m);
      if (!npc.acc) mix.clipAction(g.animations[0]).play();
      npc.mixer = mix; MIXERS.push(mix);
      /* si el clip es de CAMINAR (Meshy sube las dos manos a la vez), le
         manejamos los brazos a mano igual que al cuerpo en 1ª persona */
      if (/walk|camin/i.test(g.animations[0].name || '')){
        const arm = {};
        m.traverse(o => { if (o.isBone){
          if (o.name === 'LeftArm') arm.la = o; else if (o.name === 'RightArm') arm.ra = o;
          else if (o.name === 'LeftForeArm') arm.lf = o;
          else if (o.name === 'RightForeArm') arm.rf = o; } });
        for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
        npc.arms = arm; npc.armPh = 0;
      }
    }
    npc.cargado = true;
  }, undefined, () => {});
}
function nuevoNPC(o){
  o.fig.position.set(o.x, H(o.x, o.z) + (o.vuela ? (o.alto || 2.2) : 0), o.z);
  o.fig.rotation.y = o.giro || 0;
  scene.add(o.fig);
  o.fase = rr(0, 6.28); o.li = 0;
  NPCS.push(o);
  ponerModelo(o);
  return o;
}
function npcTick(dt){
  for (const mix of MIXERS) mix.update(dt);
  for (const npc of NPCS){
    /* el modelo 3D generado ya trae su propia orientación: si el clip es de
       caminar, no le sumamos el balanceo procedural de las extremidades */
    const f = npc.fig;
    const d = Math.hypot(px - f.position.x, pz - f.position.z);
    let anda = 0;
    if (npc.sigue){
      if (d > 40){                       /* nunca se queda atrás de verdad */
        f.position.x = px - Math.sin(yaw) * -3 + 1.5;
        f.position.z = pz - Math.cos(yaw) * -3 + 1.5;
      } else if (d > 3.4){
        const vel2 = (corre ? 10.8 : 5.8) * dt;
        f.rotation.y = Math.atan2(px - f.position.x, pz - f.position.z);
        f.position.x += (px - f.position.x) / d * Math.min(vel2, d - 3.2);
        f.position.z += (pz - f.position.z) / d * Math.min(vel2, d - 3.2);
        anda = 1;
      }
    } else if (d < 11){
      const objY = Math.atan2(px - f.position.x, pz - f.position.z);
      let dy = objY - f.rotation.y;
      while (dy > Math.PI) dy -= 6.283;
      while (dy < -Math.PI) dy += 6.283;
      f.rotation.y += dy * Math.min(1, dt * 3);
    }
    /* la mezcla de animacion, con la velocidad de verdad de este personaje:
       `anda` ya lo calculo el bloque de arriba para moverlo. */
    if (npc.acc) mezclaAcciones(npc, anda ? (corre ? 10.8 : 5.8) : 0, dt);
    const suelo = H(f.position.x, f.position.z);
    f.position.y = npc.vuela
      ? suelo + (npc.alto || 2.2) + Math.sin(t0 * 1.7 + npc.fase) * .25
      : suelo;
    const L2 = f.userData.lim || {};
    const sw = anda ? Math.sin(t0 * 9) * .55 : Math.sin(t0 * 1.4 + npc.fase) * .06;
    if (L2.bI){ L2.bI.rotation.x = sw; L2.bD.rotation.x = -sw;
      /* hay figuras con brazos pero sin piernas (el pingüino aletea) */
      if (L2.pI){ L2.pI.rotation.x = -sw; L2.pD.rotation.x = sw; } }
    if (L2.p1 && !L2.bI){ const s2 = anda ? Math.sin(t0 * 11) * .6 : 0;
      L2.p1.rotation.x = s2; L2.p4.rotation.x = s2;
      L2.p2.rotation.x = -s2; L2.p3.rotation.x = -s2; }
    if (L2.cola) L2.cola.rotation.x = Math.sin(t0 * (anda ? 13 : 6) + npc.fase) * .4;
    if (L2.rot) for (const r of L2.rot) r.rotation.y += dt * 28;
    if (f.userData.late)
      f.userData.late.emissiveIntensity = .6 + .35 * Math.sin(t0 * 2.2 + npc.fase);
    /* brazos del modelo 3D con clip de caminar: colgando + vaivén al andar
       (pisa lo que dejó el mixer, que subía las dos manos a la vez) */
    if (npc.arms){
      npc.armPh += dt * (anda ? (corre ? 9 : 6.2) : 0);
      const swA = Math.sin(npc.armPh) * (anda ? 0.42 : 0)
        + Math.sin(t0 * 1.3 + npc.fase) * 0.03 * (anda ? 0 : 1);
      apuntarBrazos(npc.arms, swA);
    }
  }
}
function npcCerca(){
  let mejor = null, md = 4.4;
  for (const npc of NPCS){
    if (!npc.clave) continue;
    const d = Math.hypot(px - npc.fig.position.x, pz - npc.fig.position.z);
    if (d < md){ md = d; mejor = npc; }
  }
  return mejor;
}
function hablaNPC(npc){
  const lineas = (L[LANG].npc && L[LANG].npc[npc.clave]) || [];
  if (!lineas.length) return;
  const txt = lineas[npc.li % lineas.length];
  npc.li++;
  dialogo(npc.nombre, txt, npc.alHablar || null, npc.cara);
}

/* ========================= ITEMS USABLES ================================== */
const ITEMS = [];
function nuevoItem(o){ o.activo = true; ITEMS.push(o); return o; }
function itemCerca(){
  for (const it of ITEMS){
    if (!it.activo) continue;
    if (Math.hypot(px - it.x, pz - it.z) < (it.r || 3.5)) return it;
  }
  return null;
}
/* ¿qué haría el botón USAR ahora mismo? El capítulo manda, después los
   items, después charlar con quien esté cerca. */
function accionUsable(){
  const C = CAPS[cap];
  const p = POI[C.obj];
  /* DENTRO DEL TRASLADO manda el traslado y nada mas: si no, llegar al objetivo
     encima de la mecanica dispararia el capitulo a toda velocidad —y el dialogo
     congela la fisica— y ademas no habria como salirse, porque salirse es el
     mismo boton. */
  if (BOTE.modo){
    const t2 = BOTE.accion();
    return t2 ? { tipo: 'bote', tr: t2 } : null;
  }
  if (C.usar && Math.hypot(px - p.x, pz - p.z) < 7 && MISION.lista(cap))
    return { tipo: 'cap' };
  const tr = BOTE.accion();
  if (tr) return { tipo: 'bote', tr };
  const it = itemCerca();
  if (it) return { tipo: 'item', it };
  const npc = npcCerca();
  if (npc) return { tipo: 'npc', npc };
  return null;
}
function usarAccion(){
  if (enDlg) return;
  const acc = accionUsable();
  if (!acc) return;
  if (acc.tipo === 'bote') BOTE.usar(acc.tr);
  else if (acc.tipo === 'cap') llegaObjetivo();
  else if (acc.tipo === 'item'){ acc.it.activo = false; acc.it.fn(acc.it); }
  else hablaNPC(acc.npc);
}
