/* ===================== EL CUERPO EN PRIMERA PERSONA ========================
   Como en los juegos de parkour: MANOS y antebrazos siempre a la vista
   (viewmodel colgado de la cámara) que bombean al caminar y se aprietan al
   correr; PIERNAS de verdad con rodilla al mirar hacia abajo; y un torso y
   cabeza que NO se dibujan (colorWrite=false) pero SÍ proyectan: tu propia
   sombra camina entera por el suelo. Colores por mundo en MUNDO_CUERPO. */
const MUNDO_CUERPO = { mangas: 0xe8ecf2, guantes: 0xd8dde2, pantalon: 0xe8ecf2, botas: 0x8a9096, glb: 'npc/cuerpo-luna.glb' };  /* traje lunar blanco */
const CUERPO = {};
{
  const mM = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.mangas });
  const mG = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.guantes });
  const mPa = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.pantalon });
  const mB = new T.MeshLambertMaterial({ color: MUNDO_CUERPO.botas });
  /* material FANTASMA: invisible a la cámara, visible para el sol */
  const mF = new T.MeshLambertMaterial({ color: 0x000000 });
  mF.colorWrite = false; mF.depthWrite = false;

  /* --- viewmodel: dos antebrazos con puño, hijos de la CÁMARA --- */
  scene.add(cam);                 /* la cámara entra a la escena para tener hijos */
  const vm = new T.Group();
  const brazoVM = s2 => {
    const g = new T.Group();
    const puno = new T.Mesh(new T.BoxGeometry(.09, .08, .11), mG);
    puno.rotation.z = s2 * .18;
    g.add(puno);
    const pulgar = new T.Mesh(new T.BoxGeometry(.028, .03, .05), mG);
    pulgar.position.set(-s2 * .052, .012, .012);
    g.add(pulgar);
    const ante = new T.Mesh(new T.CapsuleGeometry(.05, .3, 3, 8), mM);
    ante.position.set(s2 * .07, -.16, .15);
    ante.rotation.x = .95;
    ante.rotation.z = -s2 * .3;
    g.add(ante);
    g.position.set(s2 * .23, -.26, -.46);
    vm.add(g);
    return g;
  };
  CUERPO.bI = brazoVM(-1);
  CUERPO.bD = brazoVM(1);
  cam.add(vm);
  CUERPO.vm = vm;

  /* --- el cuerpo en el mundo: piernas visibles + resto sólo-sombra --- */
  const root = new T.Group();
  const pierna = s2 => {
    const cad = new T.Group();
    cad.position.set(s2 * .115, .98, .03);
    const muslo = new T.Mesh(new T.CapsuleGeometry(.075, .3, 3, 8), mPa);
    muslo.geometry.translate(0, -.21, 0);
    muslo.castShadow = true;
    cad.add(muslo);
    const rodilla = new T.Group();
    rodilla.position.set(0, -.46, 0);
    const canilla = new T.Mesh(new T.CapsuleGeometry(.06, .28, 3, 8), mPa);
    canilla.geometry.translate(0, -.19, 0);
    canilla.castShadow = true;
    rodilla.add(canilla);
    const bota = new T.Mesh(new T.BoxGeometry(.11, .09, .24), mB);
    bota.position.set(0, -.42, .05);
    bota.castShadow = true;
    rodilla.add(bota);
    cad.add(rodilla);
    root.add(cad);
    return { cad, rodilla };
  };
  const pI = pierna(-1), pD = pierna(1);
  CUERPO.pI = pI.cad; CUERPO.rI = pI.rodilla;
  CUERPO.pD = pD.cad; CUERPO.rD = pD.rodilla;
  /* torso, cabeza y brazos FANTASMA: sólo existen en la sombra */
  const torso = new T.Mesh(new T.CapsuleGeometry(.17, .5, 4, 8), mF);
  torso.position.y = 1.28; torso.castShadow = true; root.add(torso);
  const cabeza = new T.Mesh(new T.SphereGeometry(.12, 8, 6), mF);
  cabeza.position.y = 1.72; cabeza.castShadow = true; root.add(cabeza);
  CUERPO.bsI = new T.Mesh(new T.CapsuleGeometry(.05, .55, 3, 6), mF);
  CUERPO.bsI.geometry.translate(0, -.3, 0);
  CUERPO.bsI.position.set(-.28, 1.5, 0); CUERPO.bsI.castShadow = true;
  root.add(CUERPO.bsI);
  CUERPO.bsD = CUERPO.bsI.clone();
  CUERPO.bsD.position.x = .28;
  root.add(CUERPO.bsD);
  root.visible = false;
  vm.visible = false;
  scene.add(root);
  CUERPO.root = root;
}
/* CUERPO 3D generado (riggeado + caminar) en PRIMERA PERSONA: se cuelga del
   mismo Group que sigue al jugador; se apaga el cuerpo procedural; se ENCOGE
   el hueso de la cabeza para no tapar la cámara; el clip de caminar avanza a
   la velocidad del paso. Si el GLB no llega, queda el procedural. */
function cargarCuerpoGLB(){
  if (!GLTF || !MUNDO_CUERPO.glb) return;
  new GLTF().load(AX(MUNDO_CUERPO.glb), g => {
    const m = g.scene;
    m.rotation.y = Math.PI;                 /* de frente a la marcha */
    const arm = {};
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material) o.material.metalness = 0; }
      if (o.isBone && /head|cabeza|neck/i.test(o.name) && !CUERPO.headBone)
        CUERPO.headBone = o;
      /* brazos: los manejamos a mano porque el clip de Meshy sube las dos manos
         a la vez (quedaban "arriba" al estar quieto). Los dejamos colgando. */
      if (o.isBone){
        if (o.name === 'LeftArm') arm.la = o;
        else if (o.name === 'RightArm') arm.ra = o;
        else if (o.name === 'LeftForeArm') arm.lf = o;
        else if (o.name === 'RightForeArm') arm.rf = o;
      } });
    for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
    CUERPO.arms = arm;
    CUERPO.root.add(m);
    CUERPO.glb = m;
    /* LOS CLIPS PRESTADOS, IGUAL QUE UN PERSONAJE. Este GLB no trae animaciones
       propias: sin esto el cuerpo es una estatua que se desliza, que es lo que
       se reporto como «la pose al moverse es rara». `armarAcciones` le presta
       quieto/andar/correr retargeteados a su esqueleto, y si los clips todavia
       no cargaron lo deja en la cola y lo arma solo cuando lleguen. */
    CUERPO.npc = { modelo: m, clipsPropios: (g.animations || []) };
    armarAcciones(CUERPO.npc);
    /* apagar el cuerpo procedural (piernas + fantasma + viewmodel) */
    CUERPO.root.traverse(o => { if (o.isMesh && o !== m && !m.getObjectById(o.id)) o.visible = false; });
    CUERPO.pI.visible = CUERPO.pD.visible = false;
    CUERPO.bsI.visible = CUERPO.bsD.visible = false;
    if (g.animations && g.animations.length){
      CUERPO.mixer = new T.AnimationMixer(m);
      CUERPO.accion = CUERPO.mixer.clipAction(g.animations[0]);
      CUERPO.accion.play();
    }
  }, undefined, () => {});
}
cargarCuerpoGLB();
cargarCieloFoto();
/* apunta los brazos de un modelo Meshy SIN depender de su pose de bind (que
   varía por modelo): orienta cada hombro para que el brazo señale HACIA ABAJO
   en el mundo (algo adelante y afuera), con `sw` de vaivén. Así quedan colgando
   normales en los 5 cuerpos y en los NPC, sin importar cómo vino riggeado. */
const _brAim = new T.Vector3(), _brTgt = new T.Vector3(), _brPw = new T.Quaternion();
function apuntarBrazos(A, sw, outX, fwdZ, forebend){
  outX = outX == null ? 0.17 : outX;
  fwdZ = fwdZ == null ? 0.12 : fwdZ;
  forebend = forebend == null ? 0.28 : forebend;
  const aim = (up, fore, side, s) => {
    if (!up || !fore) return;
    _brAim.copy(fore.position).normalize();
    _brTgt.set(side * outX, -1, fwdZ + s).normalize();
    up.parent.getWorldQuaternion(_brPw);
    _brTgt.applyQuaternion(_brPw.invert());
    up.quaternion.setFromUnitVectors(_brAim, _brTgt);
  };
  aim(A.la, A.lf, 1, sw);
  aim(A.ra, A.rf, -1, -sw);
  if (A.lf && A.lf.userData.bindQ){ A.lf.quaternion.copy(A.lf.userData.bindQ); A.lf.rotateX(forebend); }
  if (A.rf && A.rf.userData.bindQ){ A.rf.quaternion.copy(A.rf.userData.bindQ); A.rf.rotateX(forebend); }
}
function cuerpoTick(dt){
  const enJuego = fase === 'juego';
  CUERPO.root.visible = enJuego;
  CUERPO.vm.visible = enJuego && !enDlg && !CUERPO.glb;   /* con GLB no hay viewmodel */
  if (!enJuego) return;
  CUERPO.root.position.set(px, H(px, pz), pz);
  CUERPO.root.rotation.y = yaw;
  const v = Math.min(1, Math.hypot(pvx, pvz) / VEL);
  /* --- rama del CUERPO 3D generado --- */
  if (CUERPO.glb){
    /* PRIMERO, LOS CLIPS. Si los prestados llegaron, el cuerpo camina y corre
       como cualquier personaje del mundo, con la mezcla que sigue a la velocidad
       de verdad: es lo que arregla la pose. El mixer lo actualiza `npcTick`
       junto con los demas, asi que aca solo se elige el clip. */
    if (CUERPO.npc && !CUERPO.npc.acc) armarAcciones(CUERPO.npc);
    if (CUERPO.npc && CUERPO.npc.acc){
      mezclaAcciones(CUERPO.npc, Math.hypot(pvx, pvz), dt);
    } else {
      /* RESPALDO, para el caso de que los clips no lleguen: lo de antes, que es
         mejor que una estatua con los brazos en cruz. */
      if (CUERPO.mixer){
        CUERPO.mixer.timeScale = v * (corre ? 2.4 : 1.4);
        CUERPO.mixer.update(dt);
      }
      if (CUERPO.arms){
        const sw = Math.sin(bobF) * v * (corre ? 0.5 : 0.34) + Math.sin(t0 * 1.4) * 0.03 * (1 - v);
        apuntarBrazos(CUERPO.arms, sw);
      }
    }
    /* achicar la cabeza CADA cuadro (el mixer la reescribe) para no taparte */
    if (CUERPO.headBone) CUERPO.headBone.scale.setScalar(0.02);
    return;
  }
  const sw = Math.sin(bobF) * (corre ? .95 : .62) * v;
  /* piernas: péndulo desde la cadera, rodilla que se dobla al recoger */
  CUERPO.pI.rotation.x = sw;
  CUERPO.pD.rotation.x = -sw;
  CUERPO.rI.rotation.x = Math.max(0, -sw) * 1.25;
  CUERPO.rD.rotation.x = Math.max(0, sw) * 1.25;
  /* brazos de la sombra, en contrafase con las piernas */
  CUERPO.bsI.rotation.x = -sw * .8;
  CUERPO.bsD.rotation.x = sw * .8;
  /* el viewmodel BOMBEA: quieto respira, caminando alterna, corriendo los
     puños se juntan y suben (parkour) */
  const pump = Math.sin(bobF) * v;
  const amp = corre ? .10 : .06;
  const baseX = corre ? .17 : .23;
  const baseY = -.26 + (corre ? .035 : 0);   /* corriendo los puños SUBEN */
  const resp = Math.sin(t0 * 1.3) * .006;
  CUERPO.bD.position.set(baseX, baseY + pump * amp + resp, -.46 + Math.cos(bobF) * .05 * v);
  CUERPO.bI.position.set(-baseX, baseY - pump * amp + resp, -.46 - Math.cos(bobF) * .05 * v);
  CUERPO.bD.rotation.z = -.06 + pump * .16;
  CUERPO.bI.rotation.z = .06 + pump * .16;
  CUERPO.bD.rotation.x = -.12 + pump * .14;
  CUERPO.bI.rotation.x = -.12 - pump * .14;
}

/* ========================= AMBIENTE SONORO ================================
   En el vacío NO HAY sonido de afuera. Todo lo que se oye vive adentro del
   casco, sintetizado con WebAudio:
     · TU RESPIRACIÓN: ruido filtrado que sube y baja con un ritmo de calma
     · el ENLACE del módulo: hum + portadora, sube al ACERCARSE a la base
     · BLIPS de radio del traje, cada tanto
     · ESTÁTICA del espacio profundo cuando el sol se esconde
   ========================================================================== */
const AMB = { ctx: null, master: null, on: true, viento: null, pos: null,
  noche: null, tBlip: 5 };
try { AMB.on = localStorage.getItem('luna_son') !== '0'; } catch(e){}
function ambienteOn(){
  if (AMB.ctx){ if (AMB.ctx.state === 'suspended') AMB.ctx.resume(); return; }
  try { AMB.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const A2 = AMB.ctx;
  AMB.master = A2.createGain();
  AMB.master.gain.value = AMB.on ? 1 : 0;
  AMB.master.connect(A2.destination);
  const buf = A2.createBuffer(1, A2.sampleRate * 3, A2.sampleRate);
  const d = buf.getChannelData(0); let l = 0;
  for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1;
    l = l * .972 + w * .028; d[i] = l * 3.0; }
  /* la respiración: el mismo ruido, pasabajos hondo; el vaivén lo pone ambTick */
  const nv = A2.createBufferSource(); nv.buffer = buf; nv.loop = true;
  const fv = A2.createBiquadFilter(); fv.type = 'lowpass'; fv.frequency.value = 480;
  AMB.viento = A2.createGain(); AMB.viento.gain.value = .05;
  nv.connect(fv); fv.connect(AMB.viento); AMB.viento.connect(AMB.master); nv.start();
  /* el enlace del módulo: hum de 60 Hz + portadora fina */
  const o1 = A2.createOscillator(); o1.frequency.value = 60;
  const o2 = A2.createOscillator(); o2.frequency.value = 1210;
  const g2 = A2.createGain(); g2.gain.value = .04;
  AMB.pos = A2.createGain(); AMB.pos.gain.value = 0;
  o1.connect(AMB.pos); o2.connect(g2); g2.connect(AMB.pos);
  AMB.pos.connect(AMB.master); o1.start(); o2.start();
  /* estática del espacio profundo */
  const ne = A2.createBufferSource(); ne.buffer = buf; ne.loop = true;
  ne.playbackRate.value = 2.1;
  const fe = A2.createBiquadFilter(); fe.type = 'bandpass';
  fe.frequency.value = 3100; fe.Q.value = 1.6;
  AMB.noche = A2.createGain(); AMB.noche.gain.value = 0;
  ne.connect(fe); fe.connect(AMB.noche); AMB.noche.connect(AMB.master); ne.start();
}
/* blip de radio del traje */
function blip(){
  const A2 = AMB.ctx; if (!A2) return;
  const nb = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < nb; i++){

/* ================================ JUGADOR ================================== */
const stats = { t: 0, dist: 0 };
let px = POI.inicio.x, pz = POI.inicio.z, yaw = 0, pitch = -.03;
let pvx = 0, pvz = 0, bobF = 0, corre = false;
const OJO = 1.7, VEL = 5.4, VEL_CORRE = 10.0;   /* paso lunar, más flotado */
/* ALTURA DE MAS DEL OJO. La pone el traslado del mundo: sentado en un rover
   el ojo va a la altura del asiento, y volando va donde este el vuelo. En cero
   —o sea a pie— la camara queda exactamente como estaba. */
let altExtra = 0;
const DED = { mov: null, mira: null };
let movV = { x: 0, y: 0 }, keyV = { x: 0, y: 0 }, keyL = { x: 0, y: 0 };
function fisica(dt){
  /* dentro del traslado no se camina: tiene su propio paso */
  if (BOTE.modo){ BOTE.paso(dt); return; }
  yaw -= keyL.x * 2.2 * dt;
  pitch = cl(pitch - keyL.y * 1.7 * dt, -1.2, 1.2);
  let mx = movV.x + keyV.x, my = movV.y + keyV.y;
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  const sp = corre ? VEL_CORRE : VEL;
  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  pvx = (-sy * -my + cy * mx) * sp;
  pvz = (-cy * -my - sy * mx) * sp;
  let nx = cl(px + pvx * dt, -MITAD + 6, MITAD - 6);
  let nz = cl(pz + pvz * dt, -MITAD + 6, MITAD - 6);
  /* a través de las rocas y las máquinas, no */
  for (const a of ARB){
    const dx = nx - a[0], dz = nz - a[1], d = Math.hypot(dx, dz), rq = a[2] + .5;
    if (d < rq && d > 1e-4){ nx = a[0] + dx / d * rq; nz = a[1] + dz / d * rq; }
  }
  stats.dist += Math.hypot(nx - px, nz - pz);
  px = nx; pz = nz;
  bobF += dt * (1.3 + 4.5 * Math.min(1, Math.hypot(pvx, pvz) / VEL));   /* 1/6 g */
  stats.t += dt;
}
function ponCam(){
  const v = Math.min(1, Math.hypot(pvx, pvz) / VEL);
  let ex = px, ez = pz;
  /* con CUERPO 3D: el ojo va a la altura de la frente y un pelo ADELANTE del
     cuello, así al mirar abajo ves el pecho y las piernas sin el agujero del
     cuello, y la cabeza colapsada queda detrás del lente */
  if (CUERPO.glb){ ex = px + Math.sin(yaw) * -.16; ez = pz + Math.cos(yaw) * -.16; }
  cam.position.set(ex, H(px, pz) + OJO + altExtra + Math.abs(Math.sin(bobF)) * .11 * v, ez);
  cam.rotation.y = yaw;
  cam.rotation.x = pitch + Math.sin(bobF * 2) * .004 * v;
  /* FOV PROGRESIVO: antes saltaba de 72 a 77 en un cuadro al empezar a correr y se
     sentia un tironazo. Ahora persigue el objetivo y llega en medio segundo (el
     factor 6 da el 95% en 0,5 s). El reloj se saca aca porque esta funcion no
     recibe dt. */
  {
    const _n = performance.now();
    const _d = Math.min(.1, (_n - (window.__fovT || _n)) / 1000);
    window.__fovT = _n;
    const _obj = 72 + (corre ? 5 : 0);
    window.__fovS = (window.__fovS == null ? _obj : window.__fovS + (_obj - window.__fovS) * Math.min(1, _d * 6));
    cam.fov = window.__fovS;
  }
  cam.updateProjectionMatrix();
}

/* ================= EL BOTE LUNAR: EL TRASLADO PROPIO DE LA LUNA =================
   EL BOTE LUNAR. La Luna es el unico mundo del grupo donde la GRAVEDAD es el
   personaje —el mundo entero esta construido sobre eso— y hasta ahora se caminaba
   igual que en la Tierra, a 5,4 m/s, con la gravedad de adorno.

   HAY DOS MOCHILAS DE SALTO, en el modulo y en el radiotelescopio: los dos sitios
   del guion donde hay equipo de la mision. Puesta, no se camina: se REBOTA. La
   mochila devuelve el envion sola en cada aterrizaje —no hay que apretar nada— y
   con 3,1 m/s² de gravedad cada rebote dura casi cinco segundos y cruza sesenta
   metros. Encadenar es la mecanica: la velocidad horizontal se CONSERVA porque no
   hay aire, asi que cada rebote es una decision de rumbo y no de tiempo.

   Y LA ALTURA ES SOBRE EL TERRENO DE ACA, no sobre el de donde saltaste: un
   crater te deja mas alto y una loma te corta el vuelo. Sin esa linea, volar
   sobre relieve no se sentia en absoluto —era una parabola sobre un plano—, que
   es justo lo contrario de lo que este mundo tiene para mostrar. Por encima de
   metro y medio tampoco chocas con las piedras, que es la otra mitad del bote.
   ========================================================================== */
const BOTE = (() => {
  const A = { modo: null, vel: 0, hd: 0, act: null, PUE: [], nPaso: 0, tSim: 0 };
  const TT = {
    es: { toma: 'MOCHILA DE SALTO · ◉ USAR para ponertela',
          va:   'PALANCA para el rumbo · cada rebote va mas lejos · ◉ USAR en el suelo para sacartela',
          baja: '◉ USAR para sacartela' },
    en: { toma: 'JUMP PACK · ◉ USE to strap in',
          va:   'STICK to steer · each bound goes further · ◉ USE on the ground to unstrap',
          baja: '◉ USE to unstrap' },
    pt: { toma: 'MOCHILA DE SALTO · ◉ USAR para vestir',
          va:   'ALAVANCA para o rumo · cada salto vai mais longe · ◉ USAR no chao para tirar',
          baja: '◉ USAR para tirar' }
  };
  const tx = k => ((TT[LANG] || TT.en)[k] || '');

  const RTOMA = 8;
  const G_LUNA = 3.1;      /* la gravedad de la Luna, redonda: 1/6 de la de acá */
  const IMP = 7.6;         /* el envion de cada rebote */
  const V_MAX = 17;
  const ACEL = 4.2;
  const GIRO = 1.4;
  let alt = 0, vy = 0, rebotes = 0;

  /* --------------------- donde estan las mochilas -------------------------- */
  /* DOS, en el modulo y en el radiotelescopio: los dos sitios del guion donde hay
     equipo de la mision, o sea los dos donde tendria sentido que hubiera una. */
  for (const k of ['modulo', 'radiotelescopio']){
    const p = POI[k];
    if (!p) continue;
    const a = k.length * .9;
    A.PUE.push({ x: p.x + Math.sin(a) * 13, z: p.z + Math.cos(a) * 13,
      hd: a + Math.PI, lib: true });
  }

  /* ------------------------------ la mochila ------------------------------- */
  const mBla = new T.MeshLambertMaterial({ color: 0xe8e6e0 });
  const mTob = new T.MeshLambertMaterial({ color: 0xb8bcc4 });
  const mFue = new T.MeshLambertMaterial({ color: 0x9fd8ff });
  function armaMochila(){
    const g = new T.Group();
    const cu = new T.Mesh(new T.BoxGeometry(.62, .78, .34), mBla);
    cu.position.y = .55; g.add(cu);
    for (const s of [-1, 1]){
      const to = new T.Mesh(new T.CylinderGeometry(.09, .12, .5, 6), mTob);
      to.position.set(s * .22, .18, .05); g.add(to);
    }
    const ar = new T.Mesh(new T.TorusGeometry(.2, .04, 4, 8), mTob);
    ar.rotation.x = Math.PI / 2; ar.position.y = 1.02; g.add(ar);
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    return g;
  }
  /* la llama de los toberas, que solo se ve mientras rebotas */
  const llama = new T.Mesh(new T.ConeGeometry(.28, 1.1, 6), mFue);
  llama.rotation.x = Math.PI;
  llama.visible = false;
  scene.add(llama);
  for (const P of A.PUE){
    P.g = armaMochila();
    P.g.position.set(P.x, H(P.x, P.z), P.z);
    P.g.rotation.y = P.hd;
    scene.add(P.g);
  }

  /* ---------------------------- lo que se hace ---------------------------- */
  A.accion = () => {
    if (A.modo) return alt < .6 ? { baja: true } : null;
    for (const P of A.PUE)
      if (P.lib && Math.hypot(px - P.x, pz - P.z) < RTOMA) return { P };
    return null;
  };
  A.usar = c => {
    if (c.baja){ A.suelta(); return; }
    const P = c.P;
    P.lib = false; P.g.visible = false; A.act = P;
    A.modo = 'bote'; A.vel = 3; A.hd = yaw;
    alt = 0; vy = IMP; rebotes = 0;
    altExtra = 0;
    llama.visible = true;
  };
  A.suelta = () => {
    if (!A.modo) return;
    const P = A.act;
    A.modo = null; A.vel = 0; altExtra = 0; alt = 0; vy = 0;
    llama.visible = false;
    if (P){
      P.x = px + Math.cos(A.hd) * 1.3; P.z = pz - Math.sin(A.hd) * 1.3;
      P.lib = true;
      P.g.position.set(P.x, H(P.x, P.z), P.z);
      P.g.rotation.y = A.hd;
      P.g.visible = true;
    }
    pvx = 0; pvz = 0;
  };

  A.paso = dt => {
    A.nPaso++; A.tSim += dt;
    pitch = cl(pitch - keyL.y * 1.7 * dt, -1.2, 1.2);
    const mx = cl(movV.x + keyV.x, -1, 1), my = cl(movV.y + keyV.y, -1, 1);
    /* EN EL AIRE SE GIRA IGUAL, y no es un descuido: acá no hay aire contra el
       que girar, pero tampoco hay aire que te frene, y un traje con toberas gira
       porque para eso están. Lo que NO se puede es frenar en seco. */
    A.hd -= mx * GIRO * dt;
    yaw = A.hd;
    /* SOLTAR LA PALANCA ES DEJAR DE EMPUJAR. Antes el pedido con la palanca
       suelta era la velocidad que ya llevabas, y como aca no hay rozamiento
       eso queria decir para siempre. En el AIRE sigue costando frenar (el
       clamp de abajo lo baja al 35%), que es lo correcto sin atmosfera. */
    const obj = my < -.1 ? V_MAX * (-my) : 0;
    A.vel += cl(obj - A.vel, -ACEL * dt * (alt > .5 ? .35 : 1), ACEL * dt);
    A.vel = cl(A.vel, 0, V_MAX);
    const ux = -Math.sin(A.hd), uz = -Math.cos(A.hd);
    let nx = cl(px + ux * A.vel * dt, -MITAD + 6, MITAD - 6);
    let nz = cl(pz + uz * A.vel * dt, -MITAD + 6, MITAD - 6);
    /* volando se pasa POR ENCIMA de las piedras: es media razón de ser del bote */
    if (alt < 1.4){
      for (const o of ARB){
        const bx = nx - o[0], bz = nz - o[1], d = Math.hypot(bx, bz), rq = o[2] + .6;
        if (o[2] > 0 && d < rq && d > 1e-4){
          nx = o[0] + bx / d * rq; nz = o[1] + bz / d * rq; A.vel *= .6;
        }
      }
    }
    stats.dist += Math.hypot(nx - px, nz - pz);
    /* la vertical, con la gravedad de la Luna: a 3,1 m/s² cada rebote dura casi
       cinco segundos y cruza sesenta metros. Es la misma cuenta de siempre, pero
       con el número del sitio donde estás, y por eso se siente el sitio. */
    const h0 = H(px, pz);
    px = nx; pz = nz;
    vy -= G_LUNA * dt;
    alt += vy * dt;
    /* el suelo se mueve debajo mientras volás: la altura es sobre EL TERRENO DE
       ACÁ, no sobre el de donde saltaste, así que un cráter te deja más alto y
       una loma te corta el vuelo. Sin esto, volar sobre relieve no se sentía. */
    alt += h0 - H(px, pz);
    if (alt <= 0){
      alt = 0;
      /* REBOTE. No hay que apretar nada: la mochila devuelve el envión sola, y
         cada rebote es una decisión de rumbo, no de tiempo. Encadenar es lo que
         hace la mecánica: la velocidad se conserva porque no hay aire. */
      vy = IMP;
      rebotes++;
    }
    altExtra = alt;
    pvx = ux * A.vel; pvz = uz * A.vel;
    bobF += dt * (1.2 + A.vel * .1);
    llama.position.set(px, H(px, pz) + alt + .35, pz);
    llama.scale.y = cl(.3 + Math.max(0, vy) / IMP, .25, 1.3);
    stats.t += dt;
  };
  A.aviso = acc => {
    if (A.modo) return alt < .6 ? tx('baja') : tx('va');
    if (acc && acc.tipo === 'bote') return tx('toma');
    return '';
  };
  A.rebotes = () => rebotes;

  A.est = () => ({ modo: A.modo, vel: +A.vel.toFixed(2), porque: A.porque,
    nPaso: A.nPaso, tSim: +A.tSim.toFixed(2), alto: +altExtra.toFixed(2),
    hd: +A.hd.toFixed(2),
    pue: A.PUE.map(P => ({ x: Math.round(P.x), z: Math.round(P.z), lib: P.lib })) });
  return A;
})();

/* -------- objetivo: marcador 3D + distancia + botón USAR ------------------- */
/* ================= LO QUE FALTA, Y COMO SE AGARRA =========================
   Los trece mundos se trababan en el capitulo que pide juntar N cosas: el
   mecanismo andaba, pero el mojon apuntaba al sitio del capitulo y no a las
   cosas, y ningun renglon de la pantalla decia que existieran ni con que boton
   se levantan. Estas tres piezas son lo que lo arregla, y son iguales en los
   trece. */
const VERBO = {
  es: { item: 'RECOGER', npc: 'HABLAR', cap: 'SEGUIR',
        junta: 'Junta lo que falta', quedan: n => '◈ faltan ' + n },
  en: { item: 'PICK UP', npc: 'TALK',   cap: 'CONTINUE',
        junta: 'Collect what you need', quedan: n => '◈ ' + n + ' to go' },
  pt: { item: 'PEGAR',   npc: 'FALAR',  cap: 'SEGUIR',
        junta: 'Pega o que falta', quedan: n => '◈ faltam ' + n }
};
/* la cosa pendiente mas cercana: lo unico que los trece mundos tienen igual es
   la lista ITEMS, asi que la guia se arma con eso y no con la mision de cada uno */
function itemPendiente(){
  let mej = null, dm = 1e9;
  for (const it of ITEMS){
    if (!it.activo) continue;
    const d = Math.hypot(px - it.x, pz - it.z);
    if (d < dm){ dm = d; mej = it; }
  }
  return mej;
}
function pistaAccion(acc){
  const e = document.getElementById('pistaUso');
  if (!e) return;
  const V = VERBO[LANG] || VERBO.en;
  const tecla = document.body.classList.contains('sinTactil') ? 'E' : '◉';
  const t = (acc && V[acc.tipo]) ? tecla + ' · ' + V[acc.tipo] : '';
  e.textContent = t;
  e.classList.toggle('on', !!t && !enDlg);
}
function pasoObjetivo(){
  const C = CAPS[cap];
  const V = VERBO[LANG] || VERBO.en;
  /* EL MOJON APUNTA A LO QUE FALTA. Mientras la mision del capitulo no este
     lista el capitulo no se cierra, asi que apuntar al sitio del capitulo es
     mandar al jugador a un lugar donde no va a pasar nada —y era exactamente lo
     que pasaba: se trababan los trece—. Con la mision pendiente, la marca y los
     metros van a la cosa mas cercana que quede. Es seguro: `pend` solo existe
     cuando `MISION.lista(cap)` es falso, que es justo cuando el disparo
     automatico y la accion 'cap' ya estan apagados. */
  /* Si la MISION sabe a donde hay que ir, manda ella: hay mundos donde lo que
     falta no son objetos que se levantan (en exo son tres criaturas que hay que
     ir a buscar y llevar al anillo). Si no lo sabe, se usa la cosa mas cercana. */
  const pend = (MISION && MISION.lista && !MISION.lista(cap))
    ? ((MISION.guia && MISION.guia()) || itemPendiente()) : null;
  const p = pend || POI[C.obj];
  const d = Math.hypot(px - p.x, pz - p.z);
  $('objD').textContent = Math.round(d) + ' m';
  {
    const oT = $('objT');
    if (pend){
      if (!oT.dataset.orig) oT.dataset.orig = oT.textContent;
      oT.textContent = V.junta;
      const q = ITEMS.filter(i => i.activo).length;
      const ta = $('tarea');
      if (!ta.textContent) ta.textContent = V.quedan(q);
      /* se marca que el contador lo prendimos NOSOTROS, para poder apagarlo al
         terminar la mision sin pisarle el suyo al mundo */
      if (!ta.classList.contains('on')){ ta.classList.add('on'); ta.dataset.auto = '1'; }
    } else {
      if (oT.dataset.orig){
        oT.textContent = oT.dataset.orig;
        delete oT.dataset.orig;
      }
      const ta = $('tarea');
      if (ta.dataset.auto){ ta.classList.remove('on'); delete ta.dataset.auto; }
    }
  }
  marca3d.position.set(p.x, H(p.x, p.z) + 6.5 + Math.sin(t0 * 2) * .5, p.z);
  marca3d.rotation.y = t0 * 1.4;
  marca3d.visible = !enDlg;
  const cerca = d < (C.usar ? 7 : 10);
  /* los capítulos automáticos también esperan a que la MISIÓN esté lista */

/* ========================= JOYSTICK DIBUJADO =============================
   Se dibuja en un canvas propio (no en el del juego) para no tocar el render:
   solo se repinta cuando la palanca se mueve. El estilo lo pone cada mundo. */
const JOY = { el: $('joy'), cv: null, g: null, x: 0, y: 0, act: false, id: -1,
  aro: '#f0c088', pal: '#ffe6c4', glifo: '≈', trama: 'arena' };
JOY.cv = JOY.el.querySelector('canvas'); JOY.g = JOY.cv.getContext('2d');
function joyDibuja(){
  const g = JOY.g, N = 300, c = N / 2, R = N * .42;
  g.clearRect(0, 0, N, N);
  /* el aro: doble trazo con la trama del mundo por dentro */
  g.save();
  g.beginPath(); g.arc(c, c, R, 0, 6.2832);
  g.fillStyle = 'rgba(0,0,0,.34)'; g.fill();
  g.clip();
  joyTrama(g, N, c, R);
  g.restore();
  g.lineWidth = 6; g.strokeStyle = JOY.aro; g.globalAlpha = .78;
  g.beginPath(); g.arc(c, c, R, 0, 6.2832); g.stroke();
  g.lineWidth = 1.5; g.globalAlpha = .34;
  g.beginPath(); g.arc(c, c, R - 12, 0, 6.2832); g.stroke();
  g.globalAlpha = 1;
  /* la marca de AUTO-CORRER arriba: se prende cuando la palanca llega */
  const autoOn = JOY.act && -JOY.y > .80;
  g.save();
  g.globalAlpha = autoOn ? 1 : .3;
  g.strokeStyle = autoOn ? JOY.pal : JOY.aro; g.lineWidth = autoOn ? 7 : 4;
  g.beginPath(); g.arc(c, c, R - 3, -2.36, -0.78); g.stroke();
  g.restore();
  /* la palanca */
  const kx = c + JOY.x * (R - 34), ky = c + JOY.y * (R - 34), r = N * .155;
  g.beginPath(); g.arc(kx, ky + 4, r, 0, 6.2832);
  g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
  const grd = g.createRadialGradient(kx - r * .3, ky - r * .4, r * .1, kx, ky, r);
  grd.addColorStop(0, JOY.pal); grd.addColorStop(1, JOY.aro);
  g.beginPath(); g.arc(kx, ky, r, 0, 6.2832); g.fillStyle = grd; g.fill();
  g.lineWidth = 2.5; g.strokeStyle = 'rgba(0,0,0,.45)'; g.stroke();
  /* el glifo del mundo en la palanca */
  g.fillStyle = 'rgba(0,0,0,.55)'; g.font = '900 ' + Math.round(r * 1.05) + 'px system-ui';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(JOY.glifo, kx, ky + 1);
}
/* la TRAMA del fondo del aro: cada mundo tiene la suya */
function joyTrama(g, N, c, R){
  g.globalAlpha = .26; g.strokeStyle = JOY.aro; g.fillStyle = JOY.aro;
  const T = JOY.trama;
  if (T === 'arena' || T === 'viento'){                 /* rayas / rafagas */
    g.lineWidth = T === 'viento' ? 2 : 3.5;
    for (let i = -6; i <= 6; i++){
      g.beginPath();
      for (let k = 0; k <= 20; k++){
        const x = c - R + (k / 20) * R * 2;
        const y = c + i * 22 + Math.sin(k * .6 + i) * (T === 'viento' ? 9 : 4);
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  } else if (T === 'hoja'){                             /* nervaduras */
    g.lineWidth = 2.5;
    for (let i = 0; i < 9; i++){
      const a = i / 9 * 6.2832;
      g.beginPath(); g.moveTo(c, c);
      g.quadraticCurveTo(c + Math.cos(a) * R * .5 - Math.sin(a) * 26,
                         c + Math.sin(a) * R * .5 + Math.cos(a) * 26,
                         c + Math.cos(a) * R, c + Math.sin(a) * R);
      g.stroke();
    }
  } else if (T === 'lava'){                             /* grietas */
    g.lineWidth = 3;
    for (let i = 0; i < 7; i++){
      const a = i / 7 * 6.2832;
      g.beginPath(); g.moveTo(c, c);
      let x = c, y = c;
      for (let k = 0; k < 5; k++){
        x += Math.cos(a + Math.sin(k * 2.3 + i) * .7) * R / 5;
        y += Math.sin(a + Math.sin(k * 2.3 + i) * .7) * R / 5;
        g.lineTo(x, y);
      }
      g.stroke();
    }
  } else if (T === 'junco'){                            /* burbujas */
    for (let i = 0; i < 26; i++){
      const a = i * 2.399, rr = R * Math.sqrt(i / 26) * .93;
      g.beginPath(); g.arc(c + Math.cos(a) * rr, c + Math.sin(a) * rr,
        3 + (i % 4) * 2.2, 0, 6.2832); g.fill();
    }
  } else if (T === 'roca' || T === 'marmol'){           /* estratos / venas */
    g.lineWidth = T === 'marmol' ? 1.8 : 5;
    for (let i = -5; i <= 5; i++){
      g.beginPath();
      for (let k = 0; k <= 24; k++){
        const x = c - R + (k / 24) * R * 2;
        const y = c + i * 25 + (T === 'marmol'
          ? Math.sin(k * 1.1 + i * 2) * 14 : Math.sin(k * .35 + i) * 3);
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  } else {                                              /* anillos de tronco */
    g.lineWidth = 2.4;
    for (let i = 1; i <= 8; i++){
      g.beginPath();
      for (let k = 0; k <= 40; k++){
        const a = k / 40 * 6.2832, rr = R * i / 8.6 * (1 + Math.sin(a * 3 + i) * .06);
        const x = c + Math.cos(a) * rr, y = c + Math.sin(a) * rr;
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  }
  g.globalAlpha = 1;
}
joyDibuja();
{
  const R = () => JOY.el.getBoundingClientRect();
  const mueve = e => {
    const b = R(), c = b.width / 2;
    /* si la palanca esta oculta (modo PC) el rectangulo mide 0 y las divisiones
       de abajo dan NaN, que se propaga a movV y deja al jugador clavado */
    if (!(c > 0)) return;
    let dx = (e.clientX - b.left - c) / (c * .78), dy = (e.clientY - b.top - c) / (c * .78);
    const d = Math.hypot(dx, dy); if (d > 1){ dx /= d; dy /= d; }
    JOY.x = dx; JOY.y = dy;
    movV.x = dx; movV.y = dy;
    /* AUTO-CORRER: palanca del todo hacia ARRIBA (y con poco desvio lateral) */
    const arriba = -dy, lateral = Math.abs(dx);
    corre = arriba > .80 && lateral < .62;
    /* CORRER lo decide la palanca (o Shift): el boton de arriba solo se pinta */
    marcaCorre();
    joyDibuja();
  };
  JOY.el.addEventListener('pointerdown', e => {
    e.preventDefault(); JOY.act = true; JOY.id = e.pointerId;
    /* la captura del puntero no esta en todos los navegadores y tira si el
       evento es sintetico: no puede tumbar al resto del control */
    try { JOY.el.setPointerCapture(e.pointerId); } catch(e2){}
    JOY.el.style.opacity = '1'; mueve(e);
  });
  JOY.el.addEventListener('pointermove', e => { if (JOY.act && e.pointerId === JOY.id) mueve(e); });
  const suelta = e => {
    if (!JOY.act || e.pointerId !== JOY.id) return;
    JOY.act = false; JOY.id = -1; JOY.x = JOY.y = 0; movV.x = movV.y = 0;
    corre = false;
    marcaCorre();
    JOY.el.style.opacity = '.9'; joyDibuja();
  };
  JOY.el.addEventListener('pointerup', suelta);
  JOY.el.addEventListener('pointercancel', suelta);
}

/* som = lado del mapa de sombra (0 = sin sombras, para la gama baja) */
const GFXQ = { b: { dpr: .7, fogK: .78, som: 0 },
               m: { dpr: 1.15, fogK: 1, som: 1024 },
               a: { dpr: 2, fogK: 1.25, som: 2048 } };
let SOMBRAS = true;
const FOCO = { x: 0, z: 0 };

let rs = 1, rsVotos = 0, tRS = 0, fps = 60;
function aplicaRS(){
  const dpr = Math.min(window.devicePixelRatio || 1, GFXQ[GFX].dpr);
  ren.setPixelRatio(dpr * rs);

function rsTick(dt){
  tRS += dt;
  if (tRS < .8) return;
  tRS = 0;
  const quiere = fps < 34 ? -1 : (fps > 55 ? 1 : 0);
  if (quiere === 0 || (rsVotos !== 0 && Math.sign(rsVotos) !== quiere)){ rsVotos = 0; return; }
  rsVotos += quiere;
  if (Math.abs(rsVotos) < 2) return;
  rsVotos = 0;
  if (quiere < 0 && rs > .5){ rs = Math.max(.5, rs - .1); aplicaRS(); }
  else if (quiere > 0 && rs < 1){ rs = Math.min(1, rs + .08); aplicaRS(); }
}

/* ================================ BUCLE ==================================== */
/* SELLO DE BUILD. La linea de abajo dice con que version estas jugando, y es
   lo unico que distingue «no entro el cambio» de «el navegador te dio la copia
   vieja». Los ocho mundos nuevos lo tenian y estos cinco no. */
const BUILD = 'f6e9ff8';
let t0 = 0, tPrev = performance.now(), msAcum = 0, nCuadros = 0;
function bucle(t){
  requestAnimationFrame(bucle);
  const dt = Math.min(.05, (t - tPrev) / 1000) || .016;
  tPrev = t; t0 += dt;
  msAcum += dt; nCuadros++;
  if (msAcum > .5){ fps = fps * .3 + (nCuadros / msAcum) * .7; msAcum = 0; nCuadros = 0;
    $('fps').textContent = fps.toFixed(0) + ' fps · ' + (rs * 100 | 0) + '% · ' +
      ren.info.render.calls + ' dib · ' + (ren.info.render.triangles / 1000).toFixed(0) + 'k tri' + ' · b' + BUILD; }
  if (fase === 'cine'){
    pasoCine(dt);
    pasoLuz(dt);
    npcTick(dt);
    MISION.tick(dt);
    FOCO.x = cam.position.x; FOCO.z = cam.position.z;
  } else if (fase !== 'juego'){
    /* MENÚ: el valle se ve DETRÁS, con una cámara que orbita despacio entre la
       cabaña y el lago (el pedido: que el fondo del menú sea el mapa) */
    const cx2 = (POI.modulo.x + POI.crater.x) / 2, cz2 = (POI.modulo.z + POI.crater.z) / 2;
    const a = t0 * .045;
    cam.position.set(cx2 + Math.cos(a) * 240, 64 + Math.sin(t0 * .1) * 10,
                     cz2 + Math.sin(a) * 240);
    cam.lookAt(cx2, 0, cz2);
    cam.fov = 62; cam.updateProjectionMatrix();
    pasoLuz(dt);
    FOCO.x = cx2; FOCO.z = cz2;
  } else if (fase === 'juego'){ FOCO.x = px; FOCO.z = pz; }
  /* el sol (y su caja de sombra) viajan con el foco de la cámara; con el sol
     casi acostado la sombra direccional se apaga (rayos horizontales barren
     el mapa entero y el resultado es puro artefacto, no una sombra) */
  sol.target.position.set(FOCO.x, 0, FOCO.z);
  sol.position.set(FOCO.x + SOLD.x * 420, SOLD.y * 420, FOCO.z + SOLD.z * 420);
  sol.castShadow = SOMBRAS && SOLD.y > .12;
  glare.position.set(cam.position.x + SOLD.x * 950, cam.position.y + SOLD.y * 950,
                     cam.position.z + SOLD.z * 950);
  glare.material.opacity = cl((sol.intensity - .6) / 1.6, 0, 1);
  if (fase === 'juego'){
    if (!enDlg) fisica(dt);
    pasoLuz(dt);
    pasoObjetivo();
    rsTick(dt);
    ambTick(dt);
    npcTick(dt);
    MISION.tick(dt);
    /* luciérnagas ondulando */
    if (luci.visible){
      const P = luci.geometry.attributes.position;
      for (let i = 0; i < P.count; i++){
        P.array[i*3+1] = luci0[i*3+1] + Math.sin(t0 * .9 + i * 1.7) * .5;
      }
      P.needsUpdate = true;
    }
  }
  cuerpoTick(dt);
  /* los PASOS suenan mientras caminás, más rápido al correr */
  if (AMB.pasoGain){
    const cam2 = fase === 'juego' ? Math.min(1, Math.hypot(pvx, pvz) / VEL) : 0;
    AMB.pasoGain.gain.value = cam2 * (corre ? .5 : .34);
    if (AMB.pasoSrc) AMB.pasoSrc.playbackRate.value = (MUNDO_AUDIO.pasoRate || 1.4) * (corre ? 1.5 : 1);
  }
  pasoTolvas(t0);
  if (beaconMat) beaconMat.opacity = .35 + .65 * (.5 + .5 * Math.sin(t0 * 3.6));
  if (balizaMat) balizaMat.opacity = .5 + .5 * (.5 + .5 * Math.sin(t0 * 2.2));
  /* las lunas y la Tierra solo viven de noche, pegadas al cielo de la cámara */
  for (const lu of LUNAS){
    lu.position.set(cam.position.x + lu.userData.dir.x * 900,
      cam.position.y + lu.userData.dir.y * 900,
      cam.position.z + lu.userData.dir.z * 900);
  }
  if (fase === 'juego') ponCam();
  ren.render(scene, cam);
}

     Cambiar el tamaño exige tirar el mapa viejo para que three lo recree. */

    sol.shadow.mapSize.set(s, s);

  }

/* =========================== GANCHOS DE PRUEBA ============================= */
window.__S = {
  T, scene, ren, cam, POI, CAPS, H,
  get(){ return { fase, cap, enDlg, px: +px.toFixed(1), pz: +pz.toFixed(1),
    yaw: +yaw.toFixed(2), fps: +fps.toFixed(1), rs,
    dib: ren.info.render.calls, tri: ren.info.render.triangles,
    dist: Math.round(stats.dist), obj: CAPS[cap].obj,
    dObj: Math.round(Math.hypot(px - POI[CAPS[cap].obj].x, pz - POI[CAPS[cap].obj].z)),
    solY: +sol.position.y.toFixed(0), bg: +scene.backgroundIntensity.toFixed(2),
    luci: luci.visible, usar: $('bUsar').classList.contains('on'),
    save: (() => { try { return JSON.parse(localStorage.getItem('luna1') || 'null'); } catch(e){ return null; } })() };
  },
  entrar, tp(x, z){ px = x; pz = z; },
  lang(){ return LANG; }, setLang, gfx(){ return GFX; }, setGfx,
  amb(){ return AMB.ctx ? { estado: AMB.ctx.state, master: AMB.master.gain.value,
    viento: +AMB.viento.gain.value.toFixed(3), pos: +AMB.pos.gain.value.toFixed(3),
    noche: +AMB.noche.gain.value.toFixed(3) } : null; },
  pr(){ return ren.getPixelRatio(); },
  sombras(){ return { on: SOMBRAS, sol: sol.castShadow, mapa: sol.shadow.mapSize.x,
    tipo: ren.shadowMap.type, tone: ren.toneMapping, exp: +ren.toneMappingExposure.toFixed(2),
    terr: terrChunks[0].receiveShadow, solY: +SOLD.y.toFixed(2),
    foco: +focoCasa.intensity.toFixed(1) }; },
  sendaPts(){ return SENDA_PTS; }, arboles(){ return ARB; },
  partes(){ return window.__PARTES || 0; },
  paneles(){ return window.__PANELES || 0; },
  balizas(){ return window.__BALIZAS || 0; },
  rover(){ return window.__ROVER || 0; },
  props(){ return window.__PROPS || 0; },
  bodyDur(){ return CUERPO.accion ? CUERPO.accion.getClip().duration : 0; },
  bodyTime(t){ if (CUERPO.accion){ CUERPO.mixer.timeScale = 0; CUERPO.accion.time = t;
    CUERPO.mixer.update(0); if (CUERPO.headBone) CUERPO.headBone.scale.setScalar(0.02); } },
  armCal(outX, fwdZ, swing, forebend){ if (!CUERPO.glb || !CUERPO.arms) return;
    CUERPO.mixer && (CUERPO.mixer.timeScale = 0); CUERPO.mixer && CUERPO.mixer.update(0);
    apuntarBrazos(CUERPO.arms, swing || 0, outX, fwdZ, forebend);
    if (CUERPO.headBone) CUERPO.headBone.scale.setScalar(0.02); },
  /* la palanca a mano y el sitio del traslado, para probarlo sin un dedo */
  palanca(x, y){ movV.x = x; movV.y = y; },
  bote(){ return BOTE.est(); },
  boteIr(k){ const P = BOTE.PUE[k]; if (!P) return null;
    px = P.gx != null ? P.gx : P.x; pz = P.gz != null ? P.gz : P.z;
    return BOTE.est(); },
  mira(y, p){ yaw = y; if (p != null) pitch = p; },
  dlgOk(){ if (enDlg) $('dlgGo').onclick(); },
  usar(){ usarAccion(); },
  cap(n){ ponCap(n, true); },
  corre(v){ corre = !!v; },
  cine(){ return { on: CINE.on, paso: CINE.i }; },

    sigue: !!x.sigue, x: +x.fig.position.x.toFixed(1), z: +x.fig.position.z.toFixed(1) })); },
  items(){ return ITEMS.filter(i => i.activo).map(i => ({ x: +i.x.toFixed(1), z: +i.z.toFixed(1) })); },
  mision(){ return MISION.estado(); },
  med(){ return { on: MED.on, v: +MED.v.toFixed(3) }; },
  medSet(v){ medPon(v); },
  accion(){ const a = accionUsable(); return a ? a.tipo : null; },
  cuerpo(){ return { visible: CUERPO.root.visible, vm: CUERPO.vm.visible,
    pierna: +CUERPO.pD.rotation.x.toFixed(3), brazoY: +CUERPO.bD.position.y.toFixed(3) }; },
  audio(){ return { amb: !!AMB.ambReal, mus: !!AMB.musGain, paso: !!AMB.pasoGain,
    pasoVol: AMB.pasoGain ? +AMB.pasoGain.gain.value.toFixed(2) : null }; },
  modelos(){ let sk = 0, mx = MIXERS.length;
    scene.traverse(o => { if (o.isSkinnedMesh) sk++; });
    return { skinned: sk, mixers: mx, glb: !!GLTF,
      cargados: NPCS.filter(n => n.cargado).map(n => n.clave || n.nombre) }; },
  cuerpoGLB(){ return CUERPO.glb ? { cargado: true, mixer: !!CUERPO.mixer,
    cabeza: !!CUERPO.headBone } : null; },
  luzYa(){ luzK = .999; pasoLuz(1); },
  pix(){
    ren.render(scene, cam);
    const gl = ren.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const b = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b);
    const at = (fx, fy) => { const x = Math.floor(fx*(w-1)), y = Math.floor((1-fy)*(h-1));
      const i = (y*w + x)*4; return [b[i], b[i+1], b[i+2]]; };
    const set = new Set(); let neg = 0, n = 0;
    for (let i = 0; i < b.length; i += 4*41){
      set.add((b[i]>>4)+','+(b[i+1]>>4)+','+(b[i+2]>>4));
      if (b[i]+b[i+1]+b[i+2] < 14) neg++;
      n++;
    }
    return { w, h, colores: set.size, negro: +(neg/n).toFixed(3),
      arriba: at(.5,.08), centro: at(.5,.5), abajo: at(.5,.92) };
  }
};
