<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0c081a"/>
<title>EXO</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0c081a;color:#f0eef8;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(14,10,26,.62);border:1px solid rgba(190,170,255,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#ece4ff}
  #objD{font-size:11.5px;color:#b0a0d8;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#cdbcf4;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  #btns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;
    gap:9px;align-items:flex-end;pointer-events:auto}
  .b{min-width:86px;text-align:center;padding:12px 15px;border-radius:14px;font-weight:800;
    font-size:13px;background:rgba(20,14,36,.62);border:1.5px solid rgba(190,170,255,.4);
    color:#ece4ff;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  .b.usar{background:rgba(60,180,150,.78);border-color:#a0ffe0;font-size:15px;display:none}
  .b.usar.on{display:block}
  .b.corre.on{background:rgba(60,180,150,.78)}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#dfeecd;
    background:rgba(12,8,22,.5);border:1px solid rgba(190,230,180,.26);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(190,230,180,.16);border:1px solid rgba(190,230,180,.3);color:#ece4ff}
  #dlg{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(560px,92vw);
    background:rgba(12,8,22,.88);border:1px solid rgba(190,170,255,.35);border-radius:16px;
    padding:16px 18px 13px;display:none;pointer-events:auto;backdrop-filter:blur(6px);z-index:5}
  #dlg.on{display:block}
  #dlgT{font-weight:900;letter-spacing:.05em;color:#cdbcf4;font-size:13px;margin-bottom:6px}
  #dlgB{font-size:14.5px;line-height:1.5;color:#f0eef8;white-space:pre-wrap}
  #dlgGo{margin-top:12px;text-align:center;padding:11px;border-radius:11px;font-weight:800;
    background:linear-gradient(180deg,#2a9a80,#14584a);border:1px solid #a0ffe0;cursor:pointer}
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#9fd0c8;
    background:rgba(12,8,22,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(190,170,255,.4);background:#0006}
  #dlgCara.on{display:block}

  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(8,6,16,.16) 0%,rgba(8,6,16,.34) 55%,rgba(7,5,14,.72) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#f2e8ff,#9a6ee8);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#a290c4;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#ece4ff;
    background:rgba(30,22,52,.8);border:1.5px solid rgba(190,170,255,.4)}
  .mbtn.go{background:linear-gradient(180deg,#2a9a80,#14584a);border-color:#a0ffe0}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#9a6ee8;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#a290c4;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(18,14,34,.72);border:1.5px solid rgba(190,170,255,.35);color:#cfc4e8}
  .chip.on{background:linear-gradient(180deg,#2a9a80,#14584a);border-color:#a0ffe0;color:#f2e8ff}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#0c081a;color:#a290c4;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
    <div class="b" id="bSon">🔊</div>
    <div class="b corre" id="bCorre">CORRER</div>
    <div class="b" id="bMenu">MENÚ</div>
  </div>
  <div id="dlg"><div id="dlgFila"><canvas id="dlgCara" width="96" height="96"></canvas><div style="flex:1;min-width:0"><div id="dlgT"></div><div id="dlgB"></div></div></div><div id="dlgGo">SEGUIR ▸</div></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <h1>EXO</h1>
  <div class="sub">el bosque que brilla · un planeta que respira despacio</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>

    <div class="chip" data-l="es">ESPAÑOL</div>

  </div>

    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">CARGANDO EXO…</div>

<script>
/* ============================================================================
   EXO — mundo hermano bioluminiscente, 100% procedural sobre el motor de
   SENDA (este fork CONSERVA el agua: acá el lago BRILLA). Un planeta en
   crepúsculo perpetuo alrededor de una enana violeta:
     · HOJAS ALIENÍGENAS pintadas en canvas (racimos de pétalos con puntas
       de luz), corteza índigo acanalada, musgo verdeazul — y el VIENTO de
       SENDA meciendo todo, porque este bosque también respira
     · el LAGO DE LUZ: el shader de agua de SENDA (ruido azulejable,
       profundidad, espuma que lame) MÁS emisión cian en el bajío que
       pulsa despacio: el agua es la lámpara del valle
     · HONGOS FAROL instanciados que laten de noche, esporas a la deriva,
       DOS LUNAS pintadas (una con anillos), monolitos con runa encendida
     · de noche el mundo no se apaga: SE ENCIENDE (capítulo 5)
   HISTORIA (6 caps, ES/EN/PT): NARA, xenobotánica caída del cielo, y la
   Madre — el árbol que apagó al bosque para esperar una semilla.
   ========================================================================== */
(async () => {
'use strict';
const Q = new URLSearchParams(location.search);
const LOC = Q.has('local');
/* CERO descargas de assets: todas las texturas se pintan al vuelo. */
/* assets compartidos de los mundos hermanos (cielos, modelos 3D, audio). Se
   define acá arriba —antes del armado del mundo— porque los mk_*.py insertan
   propGLB()/AX() en el cuerpo del build, que corre mucho antes. */
const HASHAX = 'fb644fc';
const AX = f => (LOC ? '/assets/mundos/'
  : 'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@' + HASHAX + '/assets/mundos/') + f;
const TRE = LOC ? '/_vthree/build/three.module.js'
  : 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* importmap ANTES de cargar GLTFLoader (que importa 'three' por specifier).
   Se inyecta al vuelo: el import de three es por URL absoluta, así que no lo
   afecta, y el mapa resuelve el 'three' de GLTFLoader al MISMO módulo. */
{
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: TRE } });
  document.head.appendChild(im);
}
const T = await import(TRE);
/* GLTFLoader para los personajes 3D generados (riggeados + animados). Si por
   lo que sea no carga, GLTF queda null y todo cae al personaje procedural. */
let GLTF = null;
try {
  const GLU = LOC ? '/_vthree/examples/jsm/loaders/GLTFLoader.js'
    : 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
  GLTF = (await import(GLU)).GLTFLoader;
} catch (e) {}
const $ = i => document.getElementById(i);

/* ---------------- azar reproducible: el valle es SIEMPRE el mismo ---------- */
let _s = 20270707;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- terreno: ruido de valor FBM, determinista ---------------- */
const MAPA = 900, MITAD = MAPA / 2;
const AGUA_Y = -3.2;
function hash2(i, j){
  /* Math.imul, no `*`: en JS el producto de enteros grandes se hace float y
     PIERDE los bits bajos (>2^53) — el hash quedaba sesgado hacia abajo y el
     ruido casi nunca pasaba de 0,36. Medido: la compuerta de densidad rechazaba
     3.356 de 3.481 celdas y el "bosque" tenía 83 árboles. */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260801;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* PUNTOS DE LA HISTORIA (fijos, el terreno se allana alrededor) */
const POI = {
  inicio:  { x: -40,  z: 400 },
  capsula: { x: 160,  z: 250 },
  madre:   { x: -40,  z: 20 },
  orilla:  { x: -200, z: -170 },
  anillo:  { x: 120,  z: -330 },
  lagoluz: { x: -120, z: -60 }
};
function alturaBase(x, z){
  let h = fbm(x * .006 + 210, z * .006 + 17) * 34 - 12;      /* colinas grandes */
  h += fbm(x * .02 + 96, z * .02 + 63) * 5;                /* detalle */
  /* cuenca del lago */
  const dl = Math.hypot(x - POI.lagoluz.x, z - POI.lagoluz.z);
  h -= 16 * Math.exp(-(dl * dl) / (150 * 150));
  /* la colina del roble */
  const dr = Math.hypot(x - POI.madre.x, z - POI.madre.z);
  h += 14 * Math.exp(-(dr * dr) / (170 * 170));
  /* CORREDOR SECO a lo largo de la senda. La cuenca del lago hundía el camino y
     el muelle quedaba en una isla: no se podía llegar caminando (lo reportó el
     jugador; la sonda teletransportaba y no lo vio). En vez de una loma puntual,
     se levanta el terreno a lo largo de los tramos de senda que cruzan la zona
     baja: donde va el jugador, el suelo nunca baja de -2,2. */
  for (const [a, b] of SECO){
    const abx = b.x - a.x, abz = b.z - a.z;
    const t = Math.max(0, Math.min(1,
      ((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz || 1)));
    const ds = Math.hypot(x - (a.x + abx * t), z - (a.z + abz * t));
    const w = Math.exp(-(ds * ds) / (17 * 17));
    h = h * (1 - w) + Math.max(h, -2.2) * w;
  }
  return h;
}
function H(x, z){
  let h = alturaBase(x, z);
  /* allanar alrededor de cada punto de la historia (mezcla suave) */
  for (const k in POI){
    if (k === 'lagoluz') continue;
    const p = POI[k];
    const d = Math.hypot(x - p.x, z - p.z);
    const w = Math.exp(-(d * d) / (26 * 26));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* HAY AGUA SOLO DONDE HAY LAGO. El plano de agua mide 380x380 alrededor del
   lago; el resto del valle puede estar más bajo que la cota del agua y aun así
   es tierra seca. La primera versión trataba TODO lo bajo como agua: la mitad
   del mapa quedaba sin árboles y sin poder caminarse (medido: 1.827 de 3.481
   celdas rechazadas por "agua" que no existe). */
function enAgua(x, z, margenY){
  return Math.abs(x - POI.lagoluz.x) < 192 && Math.abs(z - POI.lagoluz.z) < 192 &&
         H(x, z) < AGUA_Y + (margenY == null ? .5 : margenY);
}
/* la SENDA que une los puntos (para pintar tierra en el splat y guiar) */
const SENDA = [POI.inicio, POI.capsula, POI.madre, POI.orilla, POI.anillo];
/* EL CAMINO REAL ES CURVO. El splat lo pinta con curvas (control ±90 m), pero
   los chequeos de "no plantar acá" y el corredor seco usaban las RECTAS entre
   puntos: por eso había árboles ENCIMA del sendero visible (lo reportó el
   jugador) y el corredor seco podía no coincidir con el camino pintado. Ahora
   la curva se muestrea UNA vez y esa polilínea manda en todo: splat, plantado
   y terreno seco. */
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 6.1, i * 9.3) - .5) * 105;
  const mz = (a.z + b.z) / 2 + (fbm(i * 3.7, i * 5.1) - .5) * 105;
  const seg = [];
  for (let k = 0; k <= 24; k++){
    const t = k / 24, u = 1 - t;
    const P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
/* tramos que cruzan la zona baja del lago: el terreno se mantiene seco A LO
   LARGO DE LA CURVA (tramos 3 y 4: roble→muelle→santuario) */
const SECO = [];
for (const si of [3, 4])
  for (let k = 1; k < PTS_SEG[si].length; k++)
    SECO.push([{ x: PTS_SEG[si][k-1][0], z: PTS_SEG[si][k-1][1] },
               { x: PTS_SEG[si][k][0],   z: PTS_SEG[si][k][1] }]);
for (const k in POI) POI[k].h = alturaBase(POI[k].x, POI[k].z);
POI.orilla.h = AGUA_Y + 1.1;                    /* el muelle nace a orilla */


/* ==================== TEXTURAS PROCEDURALES (canvas) ========================
   No hay créditos de generación: acá TODO se PINTA, hasta las hojas con
   recorte alfa. El ruido azulejable es el mismo del terreno. */
const lienzo = (n, fn) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const valT = (x, y, per) => {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
  const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
  return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
};
const fbmT = (x, y, per, oct) => {
  let v = 0, amp = .55, p = per;
  for (let o = 0; o < oct; o++){ v += amp * valT(x * p, y * p, p); amp *= .5; p *= 2; }
  return cl(v, 0, 1);
};
const mezC = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
function texSuelo(n, colA, colB, pecas, chispas){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const t = fbmT(x / n, y / n, 6, 4);
      let c = mezC(colA, colB, t);
      const r = hash2(x + 7, y + 13);
      if (pecas && r > .967) c = mezC(c, [10, 8, 16], .55);
      else if (chispas && r < .006) c = [140, 255, 220];      /* esporas pegadas */
      const gr = .92 + .16 * hash2(x + 91, y + 57);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* corteza índigo ACANALADA: vetas verticales torcidas por el ruido */
function texCorteza(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const tw = fbmT(x / n, y / n, 4, 3);
      const veta = .5 + .5 * Math.sin((x / n * 14 + tw * 3.2) * 6.283);
      let c = mezC([52, 40, 80], [112, 90, 152], veta * .7 + tw * .3);
      if (hash2(x + 3, y + 9) > .992) c = [120, 240, 210];    /* liquen que brilla */
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* HOJAS ALIENÍGENAS con recorte alfa: racimo de pétalos alargados que van
   del índigo oscuro en la base a la punta ENCENDIDA, más motas de luz */
function texHojas(n, base, punta){
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 30; i++){
    const cx = n * (.15 + rnd() * .7), cy = n * (.15 + rnd() * .7);
    const a = rnd() * 6.283, L = n * (.09 + rnd() * .13), W2 = L * (.3 + rnd() * .2);
    const d = g.createLinearGradient(cx - Math.cos(a) * L, cy - Math.sin(a) * L,
                                     cx + Math.cos(a) * L, cy + Math.sin(a) * L);
    d.addColorStop(0, 'rgb(' + base.join(',') + ')');
    d.addColorStop(.75, 'rgb(' + mezC(base, punta, .55).map(Math.round).join(',') + ')');
    d.addColorStop(1, 'rgb(' + punta.join(',') + ')');
    g.fillStyle = d;
    g.save();
    g.translate(cx, cy); g.rotate(a);
    g.beginPath(); g.ellipse(0, 0, L, W2, 0, 0, 6.284); g.fill();
    g.restore();
  }
  /* motas bioluminiscentes en las hojas */
  for (let i = 0; i < 40; i++){
    g.fillStyle = 'rgba(' + punta.join(',') + ',.9)';
    g.beginPath(); g.arc(rnd() * n, rnd() * n, .8 + rnd() * 1.6, 0, 6.284); g.fill();
  }
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
/* el CIELO de EXO: crepúsculo violeta con nebulosa y estrellas */

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = tierra del sendero · G = hojarasca bajo el bosque. Se pinta UNA vez en un
   canvas de 512: el sendero como trazo gordo entre los puntos de la historia,
   la hojarasca como manchas de ruido donde después van los árboles. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* hojarasca: manchas */
  g.fillStyle = '#003800';
  for (let i = 0; i < 900; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 6 + rnd() * 22;
    if (vnoise(x * .02, y * .02) < .52) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.284); g.fill();
  }
  g.filter = 'blur(6px)';
  g.drawImage(SPL, 0, 0);
  g.filter = 'none';
  /* el sendero: R fuerte, con borde difuso */
  for (const [w, c] of [[16, 'rgba(140,0,0,.55)'], [8, 'rgba(255,0,0,.85)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* claros: cabaña y santuario sin hojarasca, con algo de tierra */
  for (const k of ['capsula', 'anillo']){
    g.fillStyle = 'rgba(160,0,0,.5)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 12, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4
   texturas, pero con TODO el pipeline de three gratis — RECIBE las sombras del
   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo
   (antes el terreno y los árboles se iluminaban por recetas distintas y había
   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 7 }
};
const matTerr = new T.MeshLambertMaterial({ map: TX.pasto });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = texture2D(map, uvT).rgb;
      c = mix(c, texture2D(tHoja, uvT*1.3).rgb, clamp(spl.g*1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT*1.6).rgb, clamp(spl.r*1.35, 0., 1.));
      c = mix(c, texture2D(tRoca, uvT*.9).rgb, vRocoso);
      diffuseColor.rgb *= c;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    scene.add(m);
    terrChunks.push(m);
  }
}

/* falda del horizonte: tapa la parte BAJA de la foto del cielo (que es oscura)
   con suelo que a esa distancia ya es color de niebla puro */
{
  const f = new T.Mesh(new T.CircleGeometry(1150, 24),
    new T.MeshLambertMaterial({ color: 0x1c3236 }));
  f.rotation.x = -Math.PI / 2;
  f.position.y = -10;
  f.frustumCulled = false;
  scene.add(f);
  /* PARED DE LOMAS LEJANAS: una falda plana converge exactamente a la altura del
     ojo, así que desde cualquier punto alto (la colina del roble, la cámara del
     menú) se veía la franja oscura de la foto del cielo entre la falda y el
     horizonte. Este anillo sube hasta +70 a 1.100 m: a esa distancia la niebla lo
     pinta liso y se lee como una serranía en la bruma que CIERRA el horizonte. */
  const pared = new T.Mesh(new T.CylinderGeometry(1100, 660, 78, 24, 1, true),
    new T.MeshLambertMaterial({ color: 0x262040, side: T.BackSide }));
  pared.position.y = 31;         /* base -8, borde +70 */
  pared.frustumCulled = false;
  scene.add(pared);
}
/* ------------------------------- EL LAGO ----------------------------------- */
/* AGUA VIVA: plano con grilla (para el oleaje de vértices) + normal perturbada
   por ondas que CORREN en el fragmento — el reflejo del cielo (PMREM) se mueve
   con ellas, que es lo que hace que el agua se lea como agua y no como vidrio.
   El plano es cuadrado a propósito: donde el terreno está más alto lo tapa la
   prueba de profundidad, así que la orilla la dibuja el propio lago. */
const AGUAU = { value: 0 };
/* RUIDO AZULEJABLE para el agua: 3 octavas de ruido de valor con la retícula en
   módulo (los bordes empalman). Es lo que mata el "se ve programado": los senos
   puros hacen crestas RECTAS que se repiten; el ruido no se repite nunca a la
   vista. Se genera una vez en un canvas de 256. */
const RUIDO = (() => {
  const N2 = 256, c = document.createElement('canvas');
  c.width = c.height = N2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2);
  const val = (x, y, per) => {
    const i = Math.floor(x), j = Math.floor(y);
    const fx = x - i, fy = y - j;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
    const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
    return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
  };
  for (let y = 0; y < N2; y++) for (let x = 0; x < N2; x++){
    let v = 0, amp = .55, per = 8;
    for (let o = 0; o < 3; o++){ v += amp * val(x / N2 * per, y / N2 * per, per); amp *= .5; per *= 2; }
    const k = Math.round(cl(v, 0, 1) * 255), i4 = (y * N2 + x) * 4;
    img.data[i4] = img.data[i4+1] = img.data[i4+2] = k; img.data[i4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
})();
/* TEXTURA DE PROFUNDIDAD: el agua "no tenía masa" (dicho del jugador, y es
   exacto) porque la orilla era el corte seco del polígono contra el terreno.
   Se precalcula cuánto terreno hay DEBAJO de cada punto del agua (256x256 sobre
   los 380x380 del plano) y con eso el shader hace lo que hace el agua real:
   transparente y clara en el bajío, honda y oscura en el centro, espuma
   lamiendo la orilla, y las olas se aplanan al llegar a la costa. */
const PROF = (() => {
  const N2 = 256, c = document.createElement('canvas');
  c.width = c.height = N2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2);
  for (let j = 0; j < N2; j++) for (let i = 0; i < N2; i++){
    const x = POI.lagoluz.x + (i / (N2 - 1) - .5) * 380;
    const z = POI.lagoluz.z + (j / (N2 - 1) - .5) * 380;
    const d = cl((AGUA_Y - H(x, z)) / 7, 0, 1);        /* 0 = orilla, 1 = hondo */
    const k = Math.round(d * 255), i4 = (j * N2 + i) * 4;
    img.data[i4] = img.data[i4+1] = img.data[i4+2] = k; img.data[i4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
  return t;
})();
const aguaMat = new T.MeshStandardMaterial({ color: 0x0d3038, metalness: .95,

    .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tProf;varying vec2 vWp;varying float vD;varying float vAlt;varying float vProf;')

      vWp = position.xy;

      /* DOMINIO DEFORMADO: antes de calcular la ola, la posición se tuerce con
         dos senos lentos. Las crestas dejan de ser líneas rectas: se curvan y
         serpentean como en el mar de verdad. */
      vec2 pw = position.xy + vec2(sin(position.y*.021 + uT*.33),

      float hh = sin(pw.x*.052 + uT*1.02)*.22

               + sin((pw.x + pw.y)*.093 + uT*1.61)*.11
               + cos(pw.x*.019 - pw.y*.029 + uT*.47)*.15;

      hh *= smoothstep(0.0, 0.22, vProf);

    .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tRuido;varying vec2 vWp;varying float vD;varying float vAlt;varying float vProf;')

        float lejos = clamp(1.0 - vD / 320.0, .3, 1.0);
        vec2 uvA = vWp*.048 + vec2(uT*.020,  uT*.013);
        vec2 uvB = vWp*.19  + vec2(-uT*.036, uT*.028);
        vec2 uvC = vWp*.55  + vec2(uT*.05,  -uT*.041);
        float e2 = .02;
        float n1  = texture2D(tRuido, uvA).r;
        float n2  = texture2D(tRuido, uvB).r;
        n3  = texture2D(tRuido, uvC).r;
        float gxA = texture2D(tRuido, uvA + vec2(e2, 0.)).r - n1;
        float gyA = texture2D(tRuido, uvA + vec2(0., e2)).r - n1;
        float gxB = texture2D(tRuido, uvB + vec2(e2, 0.)).r - n2;
        float gyB = texture2D(tRuido, uvB + vec2(0., e2)).r - n2;
        float gxC = texture2D(tRuido, uvC + vec2(e2, 0.)).r - n3;
        float gyC = texture2D(tRuido, uvC + vec2(0., e2)).r - n3;

                     gyA*2.4 + gyB*3.6 + gyC*2.2) * lejos;

           chicas — no manchones. El micro-rizado la recorta en hilos. */
        espuma = smoothstep(1.42, 1.62, n2*.9 + n3*.75 + max(vAlt, 0.)*.9)

         volumen que le faltaba. */
      diffuseColor.rgb = mix(vec3(.10, .55, .50), diffuseColor.rgb,
                             smoothstep(0.0, 0.55, vProf));

      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.55, .98, .90), espuma * .6);
      /* y el borde mismo se DESVANECE: nada de corte poligonal seco */
      diffuseColor.a *= smoothstep(0.0, 0.05, vProf);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, .85, espuma);`)

    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>

/* ------------------------------ LOS ÁRBOLES --------------------------------
   Tronco: cilindro con corteza fotográfica. Copa: 7 tarjetas con hojas reales
   y recorte alfa, orientadas al azar dentro de un elipsoide. TODO instanciado:
   setecientos árboles en cuatro llamadas de dibujo. */
/* fusión a mano de varias geometrías indexadas (sin dependencias) */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
function geoCopa(nq, radio, alto){
  const geos = [];
  for (let i = 0; i < nq; i++){
    const g = new T.PlaneGeometry(radio * rr(1.5, 2.2), radio * rr(1.2, 1.8));
    const e = new T.Euler(rr(-0.6, 0.6), rr(0, 6.28), rr(-0.5, 0.5));
    g.rotateX(e.x); g.rotateY(e.y); g.rotateZ(e.z);
    const a = rr(0, 6.28), rd = rr(0, radio * .55);
    g.translate(Math.cos(a) * rd, alto + rr(-radio * .35, radio * .5), Math.sin(a) * rd);
    geos.push(g);
  }
  return fusiona(geos);
}
/* ÁRBOL CON RAMAS. El reclamo era justo: un cilindro con una nube de hojas no es
   un árbol. Acá el tronco es cónico, salen 4-5 RAMAS inclinadas hacia arriba a
   distintas alturas, y las hojas van EN LA PUNTA de cada rama más una corona
   arriba. Devuelve {leña, hojas}: dos geometrías fusionadas por especie, que
   después van instanciadas (mil árboles = 4 llamadas de dibujo igual). */
function geoArbol(altura, nRamas, rHojas){
  const lena = [], puntas = [];
  const tr = new T.CylinderGeometry(.16, .42, altura, 6, 1, true);
  tr.translate(0, altura / 2, 0);
  lena.push(tr);
  for (let i = 0; i < nRamas; i++){
    const hFrac = .42 + .5 * (i / Math.max(1, nRamas - 1)) + rr(-.04, .04);
    const largo = altura * rr(.3, .45) * (1.15 - hFrac * .5);
    const inclina = rr(.6, 1.0);                 /* desde la vertical */
    const giro = i * 2.399 + rr(-.3, .3);        /* ángulo áureo: no se apilan */
    const g = new T.CylinderGeometry(.05, .13, largo, 4, 1, true);
    g.translate(0, largo / 2, 0);
    g.rotateZ(inclina); g.rotateY(giro);
    const y0 = altura * hFrac;
    g.translate(0, y0, 0);
    lena.push(g);
    /* punta de la rama, para colgar las hojas ahí */
    const px2 = Math.cos(giro) * Math.sin(inclina) * largo;
    const pz2 = -Math.sin(giro) * Math.sin(inclina) * largo;
    puntas.push([px2, y0 + Math.cos(inclina) * largo, pz2]);
  }
  puntas.push([0, altura * 1.02, 0]);            /* la corona */
  const hojas = [];
  for (const [qx, qy, qz] of puntas){
    const esCorona = qy > altura;
    const n = esCorona ? 4 : 2;
    for (let k = 0; k < n; k++){
      const r2 = rHojas * (esCorona ? 1.25 : .9) * rr(.85, 1.2);
      const g = new T.PlaneGeometry(r2 * 2.1, r2 * 1.6);
      g.rotateX(rr(-.6, .6)); g.rotateY(rr(0, 6.28)); g.rotateZ(rr(-.5, .5));
      g.translate(qx + rr(-.4, .4), qy + rr(-.2, .5), qz + rr(-.4, .4));
      hojas.push(g);
    }
  }
  return { lena: fusiona(lena), hojas: fusiona(hojas) };
}
/* VIENTO: las copas y los arbustos se mecen en el vertex shader. La fase sale de
   la posición EN EL MUNDO (instanceMatrix), así cada árbol va a su ritmo, y la
   amplitud crece con la altura: la base quieta, la copa meciéndose. */
const VIENTO = { value: 0 };
function conViento(mat, fuerza){
  mat.onBeforeCompile = sh => {
    /* el uniforme LEE de VIENTO.value: un solo reloj para todas las copas */
    sh.uniforms.uViento = {};
    Object.defineProperty(sh.uniforms.uViento, 'value',
      { get: () => VIENTO.value, set: () => {} });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uViento;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          #ifdef USE_INSTANCING
            vec4 wq = instanceMatrix * vec4(transformed, 1.0);
          #else
            vec4 wq = vec4(transformed, 1.0);
          #endif
          float sw = sin(uViento*1.7 + wq.x*.21 + wq.z*.17)
                   + .5*sin(uViento*2.9 + wq.z*.33 + wq.x*.07)
                   + .22*sin(uViento*6.1 + wq.x*1.3 + wq.y*.9);
          float amp = ${fuerza.toFixed(2)} * max(transformed.y - .6, 0.0) * .075;
          transformed.x += sw * amp;
          transformed.z += .6 * sw * amp;
        }`);
  };
  return mat;
}
const ARB = [];                                /* [x,z,r] choque */
/* ¿está el punto a menos de `margen` del sendero o de un punto de la historia?
   Lo usan árboles, ROCAS y ARBUSTOS: plantar una roca con colisión en el medio
   del sendero es una trampa invisible (la sonda se la comió caminando). */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (k !== 'lagoluz' && Math.hypot(x - p.x, z - p.z) < 16) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function plantar(){
  /* GRILLA TEMBLADA en vez de tiros al azar: una celda de 15 m con jitter de
     ±5 garantiza separación mínima (~5 m en el peor caso, ~15 típica) — nada de
     árboles amontonados — y el ruido decide la DENSIDAD por zona, así hay
     espesura y claros pero repartidos por todo el valle. */
  const pos1 = [], pos2 = [];
  const PASO_A = 17;   /* con el hash arreglado, 15 daba 1.875 árboles y 205k tri visibles */
  const CTA = { tot: 0, dens: 0, agua: 0, camino: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-5, 5), z = gz + rr(-5, 5);
    const dens = vnoise(x * .011 + 60, z * .011 + 22);
    if (dens < .36){ CTA.dens++; continue; }              /* claro */
    if (dens < .52 && rnd() > (dens - .36) * 5){ CTA.dens++; continue; }
    const y = H(x, z);
    if (enAgua(x, z, 1.2)){ CTA.agua++; continue; }
    if (molesta(x, z, 15)){ CTA.camino++; continue; }     /* LEJOS del camino */
    CTA.ok++;
    (rnd() < .6 ? pos1 : pos2).push([x, y, z, rr(.75, 1.5)]);
    ARB.push([x, z, .7]);
  }
  /* la LEÑA también se mece (misma fórmula y misma fase que sus hojas: como la
     amplitud crece con la altura, la punta de la rama y su mata de hojas se
     mueven JUNTAS y el árbol no se desarma) */
  const matTr = conViento(new T.MeshLambertMaterial({ map: TX.corteza }), 1);
  TX.corteza.repeat.set(1.4, 2.0);
  /* SEIS SILUETAS distintas (3 por especie): antes todos los árboles de una
     especie eran clones rotados y el bosque se veía estampado */
  /* siluetas alien: más flacas y altas que un pino terrestre */
  const esp1v = [geoArbol(10.5, 5, 2.0), geoArbol(12.5, 6, 2.2), geoArbol(8.6, 4, 1.9)];
  const esp2v = [geoArbol(8.4, 4, 1.8), geoArbol(10.2, 5, 1.9), geoArbol(7.0, 4, 1.6)];
  const matC1 = conViento(new T.MeshLambertMaterial({ map: TX.hojas1, alphaTest: .18, side: T.DoubleSide }), 1);
  const matC2 = conViento(new T.MeshLambertMaterial({ map: TX.hojas2, alphaTest: .18, side: T.DoubleSide }), 1);
  /* SOMBRA DE LAS COPAS: el material de profundidad por defecto ignora el alfa
     y cada copa sombrearía como un cartel SÓLIDO. Uno propio con el mismo mapa
     y alphaTest hace que la sombra sea el calado de las hojas. */
  const depthHojas = tex => new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking,
    map: tex, alphaTest: .35, side: T.DoubleSide });
  const dH1 = depthHojas(TX.hojas1), dH2 = depthHojas(TX.hojas2);
  const arma = (posiciones, esp, matC, dC) => {
    if (!posiciones.length) return;
    const iT = new T.InstancedMesh(esp.lena, matTr, posiciones.length);
    const iC = new T.InstancedMesh(esp.hojas, matC, posiciones.length);
    for (let i = 0; i < posiciones.length; i++){
      const [x, y, z, s] = posiciones[i];
      Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
      M4.compose(V3.set(x, y - .3, z), Q4, new T.Vector3(s, s * rr(.9, 1.25), s));
      iT.setMatrixAt(i, M4); iC.setMatrixAt(i, M4);
    }
    iT.frustumCulled = iC.frustumCulled = false;
    iT.castShadow = iT.receiveShadow = true;
    iC.castShadow = true;
    iC.customDepthMaterial = dC;
    scene.add(iT); scene.add(iC);
  };
  for (let v = 0; v < 3; v++){
    arma(pos1.filter((_, i) => i % 3 === v), esp1v[v], matC1, dH1);
    arma(pos2.filter((_, i) => i % 3 === v), esp2v[v], matC2, dH2);
  }
  /* ARBUSTOS: un domo de tarjetas ANCLADO al suelo (antes eran hojas sueltas
     flotando: con razón se veían mal). Tinte más oscuro que los árboles y
     plantados sólo donde el ruido dice bosque, no en el medio del pasto. */
  const domo = (() => {
    const gs = [];
    for (let k = 0; k < 6; k++){
      const g = new T.PlaneGeometry(rr(1.3, 1.8), rr(.9, 1.2));
      g.rotateX(rr(-.35, .1)); g.rotateY(k / 6 * 6.28 + rr(-.3, .3)); g.rotateZ(rr(-.25, .25));
      const a = k / 6 * 6.28, rd = rr(.15, .4);
      g.translate(Math.cos(a) * rd, rr(.3, .75), Math.sin(a) * rd);
      gs.push(g);
    }
    return fusiona(gs);
  })();
  const matA = conViento(new T.MeshLambertMaterial({ map: TX.hojas2, alphaTest: .18,
    side: T.DoubleSide, color: 0x9ab88a }), .6);
  const arb = new T.InstancedMesh(domo, matA, 420);
  let pa = 0, ita = 0;
  while (pa < 420 && ita < 30000){
    ita++;
    const x = rr(-MITAD + 10, MITAD - 10), z = rr(-MITAD + 10, MITAD - 10);
    if (vnoise(x * .011 + 60, z * .011 + 22) < .42) continue;   /* sólo en el bosque */
    const y = H(x, z);
    if (enAgua(x, z, 1) || molesta(x, z, 10)) continue;
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, y, z), Q4,
      new T.Vector3(1, 1, 1).multiplyScalar(rr(.8, 1.7)));
    arb.setMatrixAt(pa, M4);
    pa++;
  }
  arb.count = pa;
  arb.frustumCulled = false;
  scene.add(arb);
  /* ROCAS. Las anteriores estaban mal por tres lados (lo dijo el jugador y es
     cierto): el centro quedaba ARRIBA del suelo (flotaban con luz por abajo),
     el icosaedro embarraba la textura en los polos, y caían en pendientes donde
     una punta quedaba en el aire. Ahora: esfera deformada con ruido (uv decente,
     repetida x2), ACHATADA, ENTERRADA un cuarto, y sólo en suelo llano. */
  const gr = new T.SphereGeometry(1, 9, 7);
  { const P = gr.attributes.position, UV = gr.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
      const k = .74 + .42 * vnoise(x * 1.9 + 9 + y * 1.1, z * 1.9 + 4);
      P.setXYZ(i, x * k, y * k * .58, z * k);
      UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
    }
    gr.computeVertexNormals(); }
  window.__ROCAS = [];
  const roq = new T.InstancedMesh(gr, new T.MeshLambertMaterial({ map: TX.roca }), 70);
  let nr = 0;
  for (let i = 0; i < 200 && nr < 70; i++){
    const x = rr(-MITAD + 10, MITAD - 10), z = rr(-MITAD + 10, MITAD - 10);
    if (molesta(x, z, 14) || enAgua(x, z, 1)) continue;
    const y = H(x, z);
    /* pendiente: en ladera empinada una punta queda en el aire */
    const pend = Math.max(Math.abs(H(x + 2, z) - y), Math.abs(H(x, z + 2) - y));
    if (pend > 1.1) continue;
    const s = rr(.9, 3.0);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, y - s * .16, z), Q4, new T.Vector3(s, s, s));
    roq.setMatrixAt(nr, M4);
    if (s > 1.6) ARB.push([x, z, s * .75]);
    window.__ROCAS.push([x, z, s, +pend.toFixed(2)]);
    nr++;
  }
  roq.count = nr;
  roq.frustumCulled = false;
  roq.castShadow = roq.receiveShadow = true;
  scene.add(roq);
  /* HONGOS FAROL: tallo + sombrero que EMITE luz; laten en el bucle.
     Viven en la espesura y cerca del agua, nunca en el camino. */
  const gTallo = new T.CylinderGeometry(.09, .16, 1.0, 6, 1, true);
  gTallo.translate(0, .5, 0);
  const gSomb = new T.SphereGeometry(.55, 8, 5, 0, 6.284, 0, 1.7);
  gSomb.scale(1, .62, 1);
  gSomb.translate(0, 1.0, 0);
  window.__HONGO_MAT = new T.MeshLambertMaterial({ color: 0x14303a,
    emissive: 0x36e8c4, emissiveIntensity: .9 });
  const matTallo2 = new T.MeshLambertMaterial({ map: TX.madera });
  const iSomb = new T.InstancedMesh(gSomb, window.__HONGO_MAT, 220);
  const iTallo = new T.InstancedMesh(gTallo, matTallo2, 220);
  let nh = 0, ith = 0;
  while (nh < 220 && ith < 40000){
    ith++;
    const x = rr(-MITAD + 10, MITAD - 10), z = rr(-MITAD + 10, MITAD - 10);
    const cerca = Math.hypot(x - POI.lagoluz.x, z - POI.lagoluz.z);
    const dens = vnoise(x * .011 + 60, z * .011 + 22);
    if (dens < .45 && cerca > 220) continue;
    if (enAgua(x, z, .6) || molesta(x, z, 8)) continue;
    const sc = rr(.5, 1.6);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), rr(-.1, .1)));
    M4.compose(V3.set(x, H(x, z), z), Q4, new T.Vector3(sc, sc, sc));
    iSomb.setMatrixAt(nh, M4); iTallo.setMatrixAt(nh, M4);
    nh++;
  }
  iSomb.count = iTallo.count = nh;
  iSomb.frustumCulled = iTallo.frustumCulled = false;
  scene.add(iSomb); scene.add(iTallo);
  window.__FLORA = pos1.length + pos2.length + pa + nh;
}

/* ---------------- LA MADRE: el árbol que apagó al bosque -------------------

{

/* ---------------- LA ORILLA: la semilla de luz ------------------------------
   Una raíz colosal que se arquea y entra al agua, tres piedras encendidas,
   y la SEMILLA: una vaina que late sobre su pedestal de roca. */
let semillaMat = null;
{
  const p = POI.orilla;
  const dir = Math.atan2(POI.lagoluz.x - p.x, POI.lagoluz.z - p.z);
  const matTrM = new T.MeshLambertMaterial({ map: TX.corteza });
  const puntos = [];
  for (let i = 0; i <= 10; i++){
    const t = i / 10;
    puntos.push(new T.Vector3(
      p.x + Math.sin(dir) * t * 22,
      H(p.x, p.z) + Math.sin(t * 3.1415) * 5.5 - t * 2.5,
      p.z + Math.cos(dir) * t * 22));
  }
  const raiz = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(puntos), 12, .7, 6), matTrM);
  raiz.castShadow = true;
  scene.add(raiz);
  ARB.push([p.x + Math.sin(dir) * 4, p.z + Math.cos(dir) * 4, 1.6]);
  /* piedras encendidas */
  const matPiedraLuz = new T.MeshLambertMaterial({ color: 0x1a2a30,
    emissive: 0x2ab8a0, emissiveIntensity: .5 });
  for (let i = 0; i < 3; i++){
    const a = dir + (i - 1) * .8;
    const x = p.x + Math.sin(a) * 6, z = p.z + Math.cos(a) * 6;
    const m = new T.Mesh(new T.SphereGeometry(rr(.5, .8), 7, 5), matPiedraLuz);
    m.position.set(x, H(x, z) + .3, z);
    m.scale.y = .6;
    scene.add(m);
  }
  /* la semilla, latiendo sobre su pedestal */
  const pedX = p.x - Math.sin(dir) * 3, pedZ = p.z - Math.cos(dir) * 3;
  const ped = new T.Mesh(new T.CylinderGeometry(.5, .7, 1.0, 7),
    new T.MeshLambertMaterial({ map: TX.roca }));
  ped.position.set(pedX, H(pedX, pedZ) + .5, pedZ);
  ped.castShadow = true;
  scene.add(ped);
  semillaMat = new T.MeshLambertMaterial({ color: 0x123a34,
    emissive: 0x50ffd8, emissiveIntensity: .9 });
  const sem = new T.Mesh(new T.SphereGeometry(.42, 8, 6), semillaMat);
  sem.scale.y = 1.35;
  sem.position.set(pedX, H(pedX, pedZ) + 1.45, pedZ);
  scene.add(sem);
  ARB.push([pedX, pedZ, .9]);
}

{

  { sol: [.2, .55, .2],  solI: 1.5, bg: 1.05,fog: '#342a52', fogFar: 400, hemiI: .92, exp: 1.16 },
  { sol: [-.6, .25, .2], solI: 1.1, bg: .85, fog: '#3c2a58', fogFar: 340, hemiI: .78, exp: 1.2 },
  { sol: [-.8, .12, .1], solI: .65, bg: .55, fog: '#2c1e44', fogFar: 300, hemiI: .62, exp: 1.14 },
  { sol: [-.4, .05, -.3],solI: .32, bg: .35, fog: '#1a1030', fogFar: 260, hemiI: .52, exp: 1.06 },
  { sol: [.6, .4, .35],  solI: 1.25,bg: .95, fog: '#362a52', fogFar: 380, hemiI: .85, exp: 1.16 }
];
let cap = 0, enDlg = false, fase = 'menu';
let luzDe = LUZCAP[0], luzA = LUZCAP[0], luzK = 1;
function guardar(){ try { localStorage.setItem('exo1', JSON.stringify({ cap, t: stats.t, dist: stats.dist })); } catch(e){} }
function cargar(){ try { return JSON.parse(localStorage.getItem('exo1') || 'null'); } catch(e){ return null; } }
function ponCap(n, silencio){
  cap = cl(n, 0, CAPS.length - 1);
  const C = CAPS[cap];
  $('objT').textContent = C.objT;
  luzDe = mezclaLuz(); luzA = LUZCAP[cap]; luzK = 0;
  luci.visible = cap === 3 || cap === 4;
  MISION.alCap(cap);
  if (!silencio){
    $('capN').textContent = C.n;
    $('capT').textContent = C.t;
    $('capCard').classList.add('on');
    clearTimeout(ponCap._t);
    ponCap._t = setTimeout(() => $('capCard').classList.remove('on'), 3400);
    /* la CINEMÁTICA del capítulo: la cámara te muestra adónde vas */
    cineObjetivo(C);
  }
  guardar();
}
function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* la ventana de la cabaña se enciende sola cuando oscurece, y VUELCA luz */
  if (ventanaMat){
    const osc = cl(1 - (SOLD.y * 420) / 160, 0, 1);
    ventanaMat.color.setRGB(.16 + .3 * osc, .3 + .68 * osc, .27 + .6 * osc);
    focoCasa.intensity = osc * osc * 60;
  }
}
function dialogo(titulo, cuerpo, alCerrar, cara){
  enDlg = true;
  $('dlgT').textContent = titulo;
  $('dlgB').textContent = cuerpo;
  /* si habla un PERSONAJE, su retrato se pinta al vuelo (canvas) */
  const cv = $('dlgCara');

    const g = cv.getContext('2d');
    g.clearRect(0, 0, 96, 96);

    $('dlg').classList.remove('on');

}

/* ================= AUDIO GENERADO (Higgsfield) ============================
   Ambiente + música + pasos por mundo, cargados SOBRE el sintetizado: cuando
   decodifican lo apagan; si una URL falla (offline o el navegador no decodifica
   AAC) el sintetizado sigue solo. Vive acá (motor compartido) y no en la
   sección AMB, que cada mundo reescribe. Los mk_*.py pisan MUNDO_AUDIO. */
const MUNDO_AUDIO = { amb: 'amb-exo.mp3', mus: 'mus-exo.m4a', paso: 'pasos-musgo.mp3', pasoRate: 1.4 };
/* CIELO fotográfico generado (equirectangular). Vacío = deja el cielo actual
   (senda ya trae su foto). Los mk_*.py lo pisan con el de cada mundo. Se carga
   y reemplaza el fondo pintado; si falla, queda el pintado. */
const MUNDO_CIELO = 'cielo-exo.jpg';
/* disposición del MENÚ por mundo (clases en #menu): cada juego arma su portada
   distinta. '' = centrado (senda). Los mk_*.py lo pisan. */
const MUNDO_MENU = 'm-abajo';
/* PROPS 3D generados (Tripo, estáticos): edificios/vehículos de cada mundo.
   Se colocan en su POI, se apoyan en el terreno y OCULTAN la estructura
   procedural (que pasa como grupo en `ocultar`). Si el GLB no llega, queda la
   procedural. Los mk_*.py llaman propGLB en su bloque de estructura. */
function propGLB(o){
  if (!GLTF){ return; }
  new GLTF().load(AX(o.url), g => {
    const m = g.scene;
    m.scale.setScalar(o.esc || 1);
    m.rotation.set(o.rx || 0, o.giro || 0, o.rz || 0);
    m.position.set(o.x, 0, o.z);
    m.traverse(n => { if (n.isMesh){ n.castShadow = true; n.receiveShadow = true;
      n.frustumCulled = false; if (n.material) n.material.metalness = 0; } });
    /* AUTO-APOYO: el punto más bajo del modelo se posa en el suelo + o.y */
    m.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(m);
    m.position.y = H(o.x, o.z) + (o.y || 0) - caja.min.y;
    scene.add(m);
    if (o.ocultar){ const a = Array.isArray(o.ocultar) ? o.ocultar : [o.ocultar];
      for (const x of a) x.visible = false; }         /* apagar la procedural */
    window.__PROPS = (window.__PROPS || 0) + 1;
  }, undefined, () => {});
}
function cargarCieloFoto(){
  if (!MUNDO_CIELO) return;
  new T.TextureLoader().load(AX(MUNDO_CIELO), tex => {
    tex.mapping = T.EquirectangularReflectionMapping;
    tex.colorSpace = T.SRGBColorSpace;
    scene.background = tex;
    /* HIELO dibuja el cielo en un DOMO; los demás usan scene.background */
    if (typeof DOMO !== 'undefined' && DOMO){ DOMO.material.map = tex; DOMO.material.needsUpdate = true; }
  }, undefined, () => {});
}
function cargarAudioReal(){
  const A2 = AMB.ctx; if (!A2 || AMB._cargado) return;
  AMB._cargado = true;
  const carga = async url => A2.decodeAudioData(await (await fetch(url)).arrayBuffer());
  /* música y pasos en PARALELO e independientes: si el m4a no decodifica (AAC),
     los pasos no lo esperan. El AMBIENTE viene del sintetizado del motor (viento
     limpio + voces de cada mundo): la pista de ambiente generada traía golpes y
     jadeos que sonaban raro al estar quieto, así que no se usa. */
  carga(AX(MUNDO_AUDIO.mus)).then(bm => {
    const nm = A2.createBufferSource(); nm.buffer = bm; nm.loop = true;
    AMB.musGain = A2.createGain(); AMB.musGain.gain.value = .3;
    nm.connect(AMB.musGain); AMB.musGain.connect(AMB.master); nm.start();
  }).catch(() => {});
  carga(AX(MUNDO_AUDIO.paso)).then(bp => {
    AMB.pasoSrc = A2.createBufferSource(); AMB.pasoSrc.buffer = bp; AMB.pasoSrc.loop = true;
    AMB.pasoSrc.playbackRate.value = MUNDO_AUDIO.pasoRate || 1.4;
    AMB.pasoGain = A2.createGain(); AMB.pasoGain.gain.value = 0;
    AMB.pasoSrc.connect(AMB.pasoGain); AMB.pasoGain.connect(AMB.master); AMB.pasoSrc.start();
  }).catch(() => {});
}

/* ========================= CINEMÁTICAS =====================================
   Cámara sobre rieles: cada paso vuela de `de` a `a` mirando a `mira`, con
   subtítulo y letterbox. Se saltea con un toque. El sol (y su caja de sombra)
   siguen a la cámara mientras dura. */
const CINE = { on: false, i: 0, t: 0, pasos: null, fin: null };
const _cv1 = new T.Vector3(), _cv2 = new T.Vector3(), _cv3 = new T.Vector3();
function cinematica(pasos, fin){
  CINE.on = true; CINE.pasos = pasos; CINE.i = 0; CINE.t = 0; CINE.fin = fin || null;
  fase = 'cine';
  $('hud').classList.remove('on');
  document.body.classList.add('cine');
}
function terminaCine(){
  if (!CINE.on) return;
  CINE.on = false;
  document.body.classList.remove('cine');
  $('cineTxt').textContent = '';
  fase = 'juego';
  $('hud').classList.add('on');
  cam.fov = 72; cam.updateProjectionMatrix();
  if (CINE.fin){ const f = CINE.fin; CINE.fin = null; f(); }
}
function pasoCine(dt){
  const p = CINE.pasos[CINE.i];
  if (!p){ terminaCine(); return; }
  CINE.t = Math.min(1, CINE.t + dt / (p.dur || 3));
  const k = CINE.t * CINE.t * (3 - 2 * CINE.t);
  _cv1.set(p.de[0], p.de[1], p.de[2]);
  _cv2.set(p.a[0], p.a[1], p.a[2]);
  cam.position.lerpVectors(_cv1, _cv2, k);
  _cv3.set(p.mira[0], p.mira[1], p.mira[2]);
  cam.lookAt(_cv3);
  cam.fov = p.fov || 58; cam.updateProjectionMatrix();
  $('cineTxt').textContent = p.txt || '';
  if (CINE.t >= 1){ CINE.i++; CINE.t = 0;
    if (CINE.i >= CINE.pasos.length) terminaCine(); }
}
$('cineSkip').addEventListener('pointerdown', e => { e.preventDefault(); terminaCine(); });
/* la cine de CAPÍTULO: dos tomas que muestran adónde hay que ir */
function cineObjetivo(C){
  const o = POI[C.obj], oy = H(o.x, o.z), py = H(px, pz);
  const dx2 = o.x - px, dz2 = o.z - pz, dd = Math.hypot(dx2, dz2) || 1;
  const ux = dx2 / dd, uz = dz2 / dd;
  cinematica([
    { de: [px - ux * 7, py + 3.5, pz - uz * 7], a: [px + ux * 8, py + 15, pz + uz * 8],
      mira: [o.x, oy + 6, o.z], dur: 2.7, txt: C.n + ' · ' + C.t },
    { de: [o.x - ux * 44 + uz * 12, oy + 19, o.z - uz * 44 - ux * 12],
      a: [o.x - ux * 15, oy + 6, o.z - uz * 15],
      mira: [o.x, oy + 3.5, o.z], dur: 2.7, txt: C.objT }
  ]);
}

/* ========================= PERSONAJES Y CRIATURAS ==========================
   Figuras 100% procedurales con partes animables (userData.lim): humanos con
   brazos y piernas en péndulo, perro con cola, dron con rotores, criatura
   que late. npcTick las hace CAMINAR detrás del jugador si `sigue`. */
const NPCS = [];
function figHumano(colTraje, colCasco){
  const g = new T.Group();
  const mT = new T.MeshLambertMaterial({ color: colTraje });
  const mC = new T.MeshLambertMaterial({ color: colCasco || 0xd8dde2 });
  const torso = new T.Mesh(new T.CapsuleGeometry(.32, .55, 4, 8), mT);
  torso.position.y = 1.08; g.add(torso);
  const cabeza = new T.Mesh(new T.SphereGeometry(.25, 10, 8), mC);
  cabeza.position.y = 1.78; g.add(cabeza);
  const visor = new T.Mesh(new T.SphereGeometry(.19, 8, 6),
    new T.MeshLambertMaterial({ color: 0x18242f }));
  visor.position.set(0, 1.79, .13); visor.scale.set(.92, .68, .6); g.add(visor);
  const lim = {};
  for (const [k, sx] of [['bI', -.44], ['bD', .44]]){
    const b = new T.Mesh(new T.CapsuleGeometry(.085, .5, 3, 6), mT);
    b.geometry.translate(0, -.3, 0);
    b.position.set(sx, 1.46, 0); g.add(b); lim[k] = b;
  }
  for (const [k, sx] of [['pI', -.16], ['pD', .16]]){
    const p2 = new T.Mesh(new T.CapsuleGeometry(.105, .5, 3, 6), mT);
    p2.geometry.translate(0, -.32, 0);
    p2.position.set(sx, .74, 0); g.add(p2); lim[k] = p2;
  }
  const mochi = new T.Mesh(new T.BoxGeometry(.4, .5, .2), mC);
  mochi.position.set(0, 1.22, -.3); g.add(mochi);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figPerro(col){
  const g = new T.Group();
  const m = new T.MeshLambertMaterial({ color: col });
  const mOsc = new T.MeshLambertMaterial({ color: 0x2a1e14 });
  const cuerpo = new T.Mesh(new T.BoxGeometry(.62, .3, .27), m);
  cuerpo.position.y = .46; g.add(cuerpo);
  const cabeza = new T.Mesh(new T.BoxGeometry(.24, .22, .2), m);
  cabeza.position.set(.4, .6, 0); g.add(cabeza);
  const hocico = new T.Mesh(new T.BoxGeometry(.12, .1, .12), mOsc);
  hocico.position.set(.54, .55, 0); g.add(hocico);
  for (const sz of [-1, 1]){
    const oreja = new T.Mesh(new T.BoxGeometry(.05, .12, .06), mOsc);
    oreja.position.set(.36, .76, sz * .07); g.add(oreja);
  }
  const lim = {};
  let pi = 0;
  for (const sx of [-.22, .22]) for (const sz of [-.09, .09]){
    const pata = new T.Mesh(new T.CylinderGeometry(.045, .04, .34, 5), m);
    pata.geometry.translate(0, -.17, 0);
    pata.position.set(sx, .34, sz); g.add(pata);
    lim['p' + (++pi)] = pata;
  }
  const cola = new T.Mesh(new T.CylinderGeometry(.03, .015, .3, 5), m);
  cola.geometry.translate(0, .15, 0);
  cola.position.set(-.32, .52, 0);
  cola.rotation.x = .0; cola.rotation.z = .8;
  g.add(cola); lim.cola = cola;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figDron(col){
  const g = new T.Group();
  const m = new T.MeshLambertMaterial({ color: col });
  const cuerpo = new T.Mesh(new T.SphereGeometry(.3, 10, 8), m);
  cuerpo.scale.y = .6; g.add(cuerpo);
  const ojo = new T.Mesh(new T.SphereGeometry(.08, 8, 6),
    new T.MeshBasicMaterial({ color: 0x7fe8ff }));
  ojo.position.set(0, 0, .27); g.add(ojo);
  const lim = { rot: [] };
  for (const [sx, sz] of [[-.34, -.34], [.34, -.34], [-.34, .34], [.34, .34]]){
    const brazo = new T.Mesh(new T.BoxGeometry(.2, .03, .05), m);
    brazo.position.set(sx * .7, .12, sz * .7);
    brazo.rotation.y = Math.atan2(sz, sx);
    g.add(brazo);
    const rotor = new T.Mesh(new T.CylinderGeometry(.16, .16, .02, 8),
      new T.MeshLambertMaterial({ color: 0x333a40, transparent: true, opacity: .6 }));
    rotor.position.set(sx, .18, sz);
    g.add(rotor); lim.rot.push(rotor);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData.lim = lim;
  return g;
}
function figCriatura(col){
  const g = new T.Group();
  const domo = new T.Mesh(new T.SphereGeometry(.3, 10, 8),
    new T.MeshLambertMaterial({ color: 0x10201c, emissive: col,
      emissiveIntensity: .8, transparent: true, opacity: .92 }));
  domo.position.y = .42; domo.scale.y = 1.15; g.add(domo);
  const lim = {};
  let pi = 0;
  for (const a of [.6, 2.2, 4.0, 5.6]){
    const pata = new T.Mesh(new T.CylinderGeometry(.02, .015, .3, 4),
      new T.MeshLambertMaterial({ color: 0x1a2a26 }));
    pata.geometry.translate(0, -.15, 0);
    pata.position.set(Math.cos(a) * .18, .3, Math.sin(a) * .18);
    pata.rotation.z = Math.cos(a) * .4; pata.rotation.x = -Math.sin(a) * .4;
    g.add(pata); lim['p' + (++pi)] = pata;
  }
  for (const sz of [-1, 1]){
    const ojo = new T.Mesh(new T.SphereGeometry(.045, 6, 5),
      new T.MeshBasicMaterial({ color: 0xffffff }));
    ojo.position.set(sz * .1, .48, .26); g.add(ojo);
  }
  g.userData.lim = lim;
  g.userData.late = domo.material;
  return g;
}
const MIXERS = [];
/* carga un personaje 3D generado y lo cuelga del Group del NPC, apagando la
   figura procedural; si falla, la procedural se queda. Reproduce su clip. */
function ponerModelo(npc){
  if (!GLTF || !npc.glb) return;
  new GLTF().load(AX(npc.glb), g => {
    const m = g.scene;
    m.scale.setScalar(npc.glbEsc || 1);
    m.position.y = npc.glbY || 0;
    m.rotation.y = npc.glbGiro || 0;
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false;
      if (o.material){ o.material.metalness = 0; } } });
    /* apagar la figura procedural (queda de respaldo si el modelo no llegó) */
    npc.fig.traverse(o => { if (o.isMesh) o.visible = false; });
    npc.fig.add(m);
    npc.modelo = m;
    if (g.animations && g.animations.length){
      const mix = new T.AnimationMixer(m);
      mix.clipAction(g.animations[0]).play();
      npc.mixer = mix; MIXERS.push(mix);
      /* si el clip es de CAMINAR (Meshy sube las dos manos a la vez), le
         manejamos los brazos a mano igual que al cuerpo en 1ª persona */
      if (/walk|camin/i.test(g.animations[0].name || '')){
        const arm = {};
        m.traverse(o => { if (o.isBone){
          if (o.name === 'LeftArm') arm.la = o; else if (o.name === 'RightArm') arm.ra = o;
          else if (o.name === 'LeftForeArm') arm.lf = o;
          else if (o.name === 'RightForeArm') arm.rf = o; } });
        for (const k in arm) arm[k].userData.bindQ = arm[k].quaternion.clone();
        npc.arms = arm; npc.armPh = 0;
      }
    }
    npc.cargado = true;
  }, undefined, () => {});
}
function nuevoNPC(o){
  o.fig.position.set(o.x, H(o.x, o.z) + (o.vuela ? (o.alto || 2.2) : 0), o.z);
  o.fig.rotation.y = o.giro || 0;
  scene.add(o.fig);
  o.fase = rr(0, 6.28); o.li = 0;
  NPCS.push(o);
  ponerModelo(o);
  return o;
}
function npcTick(dt){
  for (const mix of MIXERS) mix.update(dt);
  for (const npc of NPCS){
    /* el modelo 3D generado ya trae su propia orientación: si el clip es de
       caminar, no le sumamos el balanceo procedural de las extremidades */
    const f = npc.fig;
    const d = Math.hypot(px - f.position.x, pz - f.position.z);
    let anda = 0;
    if (npc.sigue){
      if (d > 40){                       /* nunca se queda atrás de verdad */
        f.position.x = px - Math.sin(yaw) * -3 + 1.5;
        f.position.z = pz - Math.cos(yaw) * -3 + 1.5;
      } else if (d > 3.4){
        const vel2 = (corre ? 10.8 : 5.8) * dt;
        f.rotation.y = Math.atan2(px - f.position.x, pz - f.position.z);
        f.position.x += (px - f.position.x) / d * Math.min(vel2, d - 3.2);
        f.position.z += (pz - f.position.z) / d * Math.min(vel2, d - 3.2);
        anda = 1;
      }
    } else if (d < 11){
      const objY = Math.atan2(px - f.position.x, pz - f.position.z);
      let dy = objY - f.rotation.y;
      while (dy > Math.PI) dy -= 6.283;
      while (dy < -Math.PI) dy += 6.283;
      f.rotation.y += dy * Math.min(1, dt * 3);
    }
    const suelo = H(f.position.x, f.position.z);
    f.position.y = npc.vuela
      ? suelo + (npc.alto || 2.2) + Math.sin(t0 * 1.7 + npc.fase) * .25
      : suelo;
    const L2 = f.userData.lim || {};
    const sw = anda ? Math.sin(t0 * 9) * .55 : Math.sin(t0 * 1.4 + npc.fase) * .06;
    if (L2.bI){ L2.bI.rotation.x = sw; L2.bD.rotation.x = -sw;
      /* hay figuras con brazos pero sin piernas (el pingüino aletea) */
      if (L2.pI){ L2.pI.rotation.x = -sw; L2.pD.rotation.x = sw; } }
    if (L2.p1 && !L2.bI){ const s2 = anda ? Math.sin(t0 * 11) * .6 : 0;
      L2.p1.rotation.x = s2; L2.p4.rotation.x = s2;
      L2.p2.rotation.x = -s2; L2.p3.rotation.x = -s2; }
    if (L2.cola) L2.cola.rotation.x = Math.sin(t0 * (anda ? 13 : 6) + npc.fase) * .4;
    if (L2.rot) for (const r of L2.rot) r.rotation.y += dt * 28;
    if (f.userData.late)
      f.userData.late.emissiveIntensity = .6 + .35 * Math.sin(t0 * 2.2 + npc.fase);
    /* brazos del modelo 3D con clip de caminar: colgando + vaivén al andar
       (pisa lo que dejó el mixer, que subía las dos manos a la vez) */
    if (npc.arms){
      npc.armPh += dt * (anda ? (corre ? 9 : 6.2) : 0);
      const swA = Math.sin(npc.armPh) * (anda ? 0.42 : 0)
        + Math.sin(t0 * 1.3 + npc.fase) * 0.03 * (anda ? 0 : 1);
      apuntarBrazos(npc.arms, swA);
    }
  }
}
