/* =========================== GANCHOS DE PRUEBA ============================= */
window.__S = {
  T, scene, ren, cam, POI, H,
  /* CAPS por GETTER: cambiar de idioma REASIGNA la lista, y la copia
     congelada hacia que la sonda leyera siempre los textos en espanol */
  get CAPS(){ return CAPS; },
  get(){ return { fase, cap, enDlg, px: +px.toFixed(1), pz: +pz.toFixed(1),
    yaw: +yaw.toFixed(2), fps: +fps.toFixed(1), rs,
    dib: ren.info.render.calls, tri: ren.info.render.triangles,
    dist: Math.round(stats.dist), obj: CAPS[cap].obj,
    dObj: Math.round(Math.hypot(px - POI[CAPS[cap].obj].x, pz - POI[CAPS[cap].obj].z)),
    solY: +sol.position.y.toFixed(0), bg: +scene.backgroundIntensity.toFixed(2),
    luci: luci.visible, usar: $('bUsar').classList.contains('on'),
    save: (() => { try { return JSON.parse(localStorage.getItem('dunas1') || 'null'); } catch(e){ return null; } })() };
  },
  entrar, tp(x, z){ px = x; pz = z; },
  lang(){ return LANG; }, setLang, gfx(){ return GFX; }, setGfx,
  amb(){ return AMB.ctx ? { estado: AMB.ctx.state, master: AMB.master.gain.value,
    viento: +AMB.viento.gain.value.toFixed(3), pos: +AMB.pos.gain.value.toFixed(3),
    noche: +AMB.noche.gain.value.toFixed(3) } : null; },
  pr(){ return ren.getPixelRatio(); },
  sombras(){ return { on: SOMBRAS, sol: sol.castShadow, mapa: sol.shadow.mapSize.x,
    tipo: ren.shadowMap.type, tone: ren.toneMapping, exp: +ren.toneMappingExposure.toFixed(2),
    terr: terrChunks[0].receiveShadow, solY: +SOLD.y.toFixed(2),
    foco: +focoCasa.intensity.toFixed(1) }; },
  sendaPts(){ return SENDA_PTS; }, arboles(){ return ARB; },
  ruinas(){ return window.__RUINAS || 0; },
  senales(){ return window.__SENALES || 0; },
  campamento(){ return window.__CAMPAMENTO || 0; },
  sembrados(){ return window.__SEMBRADOS || 0; },
  cajas(){ return window.__CAJAS || null; },
  planta(){ return window.__PLANTA || null; },
  pozo(){ return { abierto: POZO.abierto, k: +POZO.k.toFixed(2),
    aguaY: +aguaMesh.position.y.toFixed(2), visible: aguaMesh.visible }; },
  hoguera(){ return { on: HOGUERA.on, opacidad: +beaconMat.opacity.toFixed(2),
    foco: +focoHog.intensity.toFixed(0) }; },
  banderas(){ return BANDERAS.length; },
  props(){ return window.__PROPS || 0; },
  bodyDur(){ return CUERPO.accion ? CUERPO.accion.getClip().duration : 0; },
  bodyTime(t){ if (CUERPO.accion){ CUERPO.mixer.timeScale = 0; CUERPO.accion.time = t;
    CUERPO.mixer.update(0); if (CUERPO.headBone) CUERPO.headBone.scale.setScalar(0.02); } },
  armCal(outX, fwdZ, swing, forebend){ if (!CUERPO.glb || !CUERPO.arms) return;
    CUERPO.mixer && (CUERPO.mixer.timeScale = 0); CUERPO.mixer && CUERPO.mixer.update(0);
    apuntarBrazos(CUERPO.arms, swing || 0, outX, fwdZ, forebend);
    if (CUERPO.headBone) CUERPO.headBone.scale.setScalar(0.02); },
  /* la palanca a mano y el sitio del traslado, para probarlo sin un dedo */
  palanca(x, y){ movV.x = x; movV.y = y; },
  caballo(){ return CABALLO.est(); },
  caballoIr(k){ const P = CABALLO.PUE[k]; if (!P) return null;
    px = P.x; pz = P.z; ojoY = H(px, pz); aireY = 0; enAire = false;
    return CABALLO.est(); },
  mira(y, p){ yaw = y; if (p != null) pitch = p; },
  dlgOk(){ if (enDlg) $('dlgGo').onclick(); },
  usar(){ usarAccion(); },
  cap(n){ ponCap(n, true); },
  corre(v){ corre = !!v; },
  cine(){ return { on: CINE.on, paso: CINE.i }; },
  cineSkip(){ terminaCine(); },
  /* diagnostico por personaje: a cuanto quedo de encarar al jugador, que
     clips tiene atados y con que peso. */
  npcDiag(){ return NPCS.map(n => {
    const f = n.fig;
    const rumbo = Math.atan2(px - f.position.x, pz - f.position.z);
    let e = rumbo - f.rotation.y;
    while (e > Math.PI) e -= 6.283;
    while (e < -Math.PI) e += 6.283;
    return { nombre: n.nombre, glb: (n.glb || '').split('/').pop(),
      d: +Math.hypot(px - f.position.x, pz - f.position.z).toFixed(1),
      errGrados: Math.round(Math.abs(e) * 57.3),
      sigue: !!n.sigue, vel: +(n.vel || 0).toFixed(2),
      acc: n.acc ? Object.keys(n.acc).map(k =>
        k[0] + n.acc[k].getEffectiveWeight().toFixed(2)).join(' ') : 'SIN ACCIONES',
      propios: (n.clipsPropios || []).map(c => (c.name||'').split('|')[1] || '?').join(',') };
  }); },
  clips(){ return { listos: CLIPS.listos, cola: CLIPS.cola.length,
    quieto: CLIPS.quieto && CLIPS.quieto.name, andar: CLIPS.andar && CLIPS.andar.name,
    correr: CLIPS.correr && CLIPS.correr.name }; },
  /* pesos de las acciones de cada personaje, para ver si de verdad animan */
  npcAnim(){ return NPCS.filter(n => n.acc).map(n => ({ nombre: n.nombre,
    vel: +(n.vel || 0).toFixed(2),
    w: Object.keys(n.acc).map(k => k[0] + ':' + n.acc[k].getEffectiveWeight().toFixed(2)).join(' ') })); },
  npcs(){ return NPCS.map(x => ({ nombre: x.nombre, clave: x.clave || null,
    sigue: !!x.sigue, x: +x.fig.position.x.toFixed(1), z: +x.fig.position.z.toFixed(1) })); },
  items(){ return ITEMS.filter(i => i.activo).map(i => ({ x: +i.x.toFixed(1), z: +i.z.toFixed(1) })); },
  mision(){ return MISION.estado(); },
  med(){ return { on: MED.on, v: +MED.v.toFixed(3) }; },
  medSet(v){ medPon(v); },
  accion(){ const a = accionUsable(); return a ? a.tipo : null; },
  cuerpo(){ return { visible: CUERPO.root.visible, vm: CUERPO.vm.visible,
    pierna: +CUERPO.pD.rotation.x.toFixed(3), brazoY: +CUERPO.bD.position.y.toFixed(3) }; },
  audio(){ return { amb: !!AMB.ambReal, mus: !!AMB.musGain, paso: !!AMB.pasoGain,
    pasoVol: AMB.pasoGain ? +AMB.pasoGain.gain.value.toFixed(2) : null }; },
  modelos(){ let sk = 0, mx = MIXERS.length;
    scene.traverse(o => { if (o.isSkinnedMesh) sk++; });
    return { skinned: sk, mixers: mx, glb: !!GLTF,
      cargados: NPCS.filter(n => n.cargado).map(n => n.clave || n.nombre) }; },
  cuerpoGLB(){ return CUERPO.glb ? { cargado: true, mixer: !!CUERPO.mixer,
    cabeza: !!CUERPO.headBone } : null; },
  luzYa(){ luzK = .999; pasoLuz(1); },
  pix(){
    ren.render(scene, cam);
    const gl = ren.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const b = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b);
    const at = (fx, fy) => { const x = Math.floor(fx*(w-1)), y = Math.floor((1-fy)*(h-1));
      const i = (y*w + x)*4; return [b[i], b[i+1], b[i+2]]; };
    const set = new Set(); let neg = 0, n = 0;
    for (let i = 0; i < b.length; i += 4*41){
      set.add((b[i]>>4)+','+(b[i+1]>>4)+','+(b[i+2]>>4));
      if (b[i]+b[i+1]+b[i+2] < 14) neg++;
      n++;
    }
    return { w, h, colores: set.size, negro: +(neg/n).toFixed(3),
      arriba: at(.5,.08), centro: at(.5,.5), abajo: at(.5,.92) };
  }
};
