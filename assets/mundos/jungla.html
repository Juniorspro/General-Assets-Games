<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0d1a0e"/>
<title>JUNGLA</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0d1a0e;color:#f0eef8;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(14,10,26,.62);border:1px solid rgba(196,232,150,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#eef7e2}
  #objD{font-size:11.5px;color:#b0a0d8;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#cdbcf4;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  /* la columna de botones se corre para dejarle el rincon del pulgar derecho
     al SALTO, que antes la tapaba entera */
  /* ---------------------------- HUD DE ARRIBA -----------------------------
     MENU y SONIDO se tocan una vez cada tanto, no en medio de la accion: van
     ARRIBA a la derecha y CUADRADOS. Antes estaban abajo, alargados y apretados
     contra el boton de salto, o sea justo donde apoya el pulgar con el que se
     juega. */
  #btns{position:absolute;right:max(10px,2.5vw);top:max(10px,2.5vh);display:flex;
    flex-direction:row;gap:8px;align-items:flex-start;pointer-events:auto}
  .b{width:46px;height:46px;min-width:0;padding:0;display:grid;place-items:center;
    text-align:center;border-radius:12px;font-weight:800;font-size:16px;
    background:rgba(20,14,36,.62);border:1.5px solid rgba(196,232,150,.4);
    color:#eef7e2;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  /* USAR sigue abajo: es de accion, tiene que estar donde esta el pulgar */
  .b.usar{position:absolute;right:calc(20px + min(84px,19vw));bottom:max(16px,5vh);
    width:auto;height:auto;padding:13px 20px;font-size:15px;border-radius:14px;
    background:rgba(60,180,150,.78);border-color:#bff2a0;display:none}
  .b.usar.on{display:grid}
  /* CORRER ya no es un boton: es un indicador chiquito al lado del contador */
  .b.corre{display:none}
  #corriendo{position:absolute;left:12px;top:calc(10px + 2.3em);pointer-events:none;
    display:none;font:800 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.14em;padding:5px 8px;border-radius:7px;
    background:rgba(20,14,36,.62);border:1px solid rgba(196,232,150,.4);color:#eef7e2}
  #corriendo.on{display:block}
  /* ------------------------ JOYSTICK Y SALTO (TACTIL) ---------------------
     Antes el medio izquierdo de la pantalla era una zona invisible de arrastre:
     nadie sabia donde tocar. Ahora hay una PALANCA dibujada, con el estilo del
     mundo, y un boton de SALTO. La palanca del todo hacia ARRIBA = correr. */
  #joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(150px,32vw);aspect-ratio:1;pointer-events:auto;touch-action:none;
    opacity:.9;transition:opacity .25s}
  /* La palanca y el salto se esconden SOLO si el aparato no tiene tactil.
     Antes se escondian al detectar mouse/teclado (body.pc), y en un portatil
     tactil o en un celular que se declara «pointer:fine» el jugador se quedaba
     sin ningun control: el joystick recien aparecia DESPUES del primer toque,
     y ese primer toque no hacia nada. La ayuda de teclado sigue saliendo
     igual: tener las dos cosas a la vez no molesta. */
  body.sinTactil #joy,body.sinTactil #bSalta{display:none}
  /* con dialogo abierto no se camina: la palanca y el salto estorban */
  body.hablando #joy,body.hablando #bSalta{opacity:0;pointer-events:none;
    transition:opacity .18s}
  #joy canvas{width:100%;height:100%;display:block}
  #bSalta{position:absolute;right:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(84px,19vw);aspect-ratio:1;border-radius:50%;pointer-events:auto;
    touch-action:none;display:grid;place-items:center;font-weight:900;
    font-size:11px;letter-spacing:.1em;cursor:pointer;
    background:rgba(0,0,0,.42);border:2px solid #a8e07a;color:#e6ffd0;
    box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
  #bSalta:active{transform:translateY(2px) scale(.96);filter:brightness(1.35)}
  #bSalta span{display:block;font-size:24px;line-height:1}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#dfeecd;
    background:rgba(12,8,22,.5);border:1px solid rgba(190,230,180,.26);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  /* con la ayuda de PC en la esquina, el contador baja */
  body.pc #recol{top:calc(10px + 13em)}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(190,230,180,.16);border:1px solid rgba(190,230,180,.3);color:#eef7e2}
  /* ---------------------- DIALOGO: CHICO Y ABAJO -------------------------
     Antes el globo crecia con el texto y un capitulo de cinco parrafos ocupaba
     media pantalla en medio de la cara. Ahora el texto va PARTIDO EN PAGINAS y
     la caja tiene alto FIJO y chico, pegada abajo: no salta entre paginas y
     deja ver el paisaje, que es de lo que se trata. */
  #dlg{position:absolute;left:50%;bottom:max(12px,3vh);transform:translateX(-50%);
    width:min(720px,94vw);display:none;pointer-events:auto;align-items:flex-end;gap:0}
  #dlg.on{display:flex}
  #dlgFoto,#dlgCara{width:min(104px,17vw);aspect-ratio:3/4;flex:0 0 auto;
    border-radius:10px 10px 4px 4px;border:1.5px solid rgba(196,232,150,.35);background:rgba(12,8,22,.88);
    display:none;object-fit:cover;object-position:50% 10%;
    box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #dlgFoto.on,#dlgCara.on{display:block}
  #dlgGlobo{position:relative;flex:1 1 auto;min-width:0;margin-left:11px;
    background:rgba(12,8,22,.88);border:1.5px solid rgba(196,232,150,.35);border-radius:4px;
    padding:9px 13px 8px;backdrop-filter:blur(7px);
    box-shadow:0 8px 26px rgba(0,0,0,.5);display:flex;flex-direction:column}
  #dlgGlobo::before,#dlgGlobo::after{content:'';position:absolute;left:-10px;top:16px;
    width:0;height:0;border:10px solid transparent}
  #dlgGlobo::before{border-right-color:rgba(196,232,150,.35)}
  #dlgGlobo::after{left:-8px;border-right-color:rgba(12,8,22,.88)}
  #dlgT{font-weight:900;letter-spacing:.06em;color:#cdbcf4;font-size:11.5px;margin-bottom:4px}
  /* ALTO FIJO: cuatro renglones. Lo que sobre queda en blanco, que es mejor que
     una caja que cambia de tamano en cada SIGUIENTE. */
  #dlgB{font-size:13.5px;line-height:1.42;color:#f0eef8;white-space:pre-wrap;
    height:5.7em;overflow:hidden;flex:0 0 auto}
  #dlgPie{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  #dlgPag{font:800 10.5px ui-monospace,monospace;letter-spacing:.1em;color:#cdbcf4;opacity:.65}
  #dlgGo{padding:7px 16px;border-radius:7px;font-weight:800;font-size:11.5px;
    letter-spacing:.08em;background:linear-gradient(180deg,#3f9a3a,#1c5424);border:1px solid #bff2a0;cursor:pointer;
    white-space:nowrap}
  @media (max-height:430px){
    #dlgB{height:4.3em;font-size:12.5px}
    #dlgFoto,#dlgCara{width:min(86px,15vw)}
  }
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#9fd0c8;
    background:rgba(12,8,22,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(196,232,150,.4);background:#0006}
  #dlgCara.on{display:block}

  /* contador de RECOLECCION: va debajo del objetivo, con su propio icono */
  #recol{position:absolute;left:12px;top:calc(10px + 4.6em);pointer-events:none;
    display:none;font:800 12.5px/1 ui-sans-serif,system-ui,sans-serif;
    padding:6px 9px;border-radius:9px;letter-spacing:.05em;
    background:rgba(0,0,0,.42);border:1px solid rgba(196,232,150,.35);color:#cdbcf4;
    backdrop-filter:blur(4px)}
  #recol.on{display:block}
  #recol.lleno{border-color:#cdbcf4;box-shadow:0 0 14px -2px #cdbcf4}
  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(6,16,8,.16) 0%,rgba(6,16,8,.34) 55%,rgba(5,14,7,.74) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#f2fae6,#8fd06a);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#a8c48c;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#eef7e2;
    background:rgba(20,38,20,.82);border:1.5px solid rgba(196,232,150,.4)}
  .mbtn.go{background:linear-gradient(180deg,#3f9a3a,#1c5424);border-color:#bff2a0}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#8fd06a;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#a8c48c;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(16,32,16,.74);border:1.5px solid rgba(196,232,150,.35);color:#d2e6c0}
  .chip.on{background:linear-gradient(180deg,#3f9a3a,#1c5424);border-color:#bff2a0;color:#f2fae6}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#0c081a;color:#a8c48c;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
    <div class="b" id="bSon">🔊</div>
    <div class="b corre" id="bCorre">CORRER</div>
    <div class="b" id="bMenu" aria-label="menu">II</div>
  </div>
  <div id="dlg"><img id="dlgFoto" alt=""><canvas id="dlgCara" width="192" height="256"></canvas><div id="dlgGlobo"><div id="dlgT"></div><div id="dlgB"></div><div id="dlgPie"><div id="dlgPag"></div><div id="dlgGo">SIGUIENTE &#9656;</div></div></div></div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
  <div id="bSalta"><span>⤒</span><b id="bSaltaT">SALTO</b></div>
  <div id="recol"></div>
  <div id="corriendo"></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <h1>JUNGLA</h1>
  <div class="sub">la selva que se tragó un templo · cuatro piedras, una puerta</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>
  <div class="fila" id="fLang">
    <div class="chip" data-l="es">ESPAÑOL</div>
    <div class="chip" data-l="en">ENGLISH</div>
    <div class="chip" data-l="pt">PORTUGUÊS</div>
  </div>
  <div class="filaT" id="tGfx">GRÁFICOS</div>
  <div class="fila" id="fGfx">
    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">CARGANDO JUNGLA…</div>

<script>
/* ============================================================================
   JUNGLA — selva húmeda al mediodía sobre el motor de SENDA. Un valle roto por
   quebradas, una cascada que cae 30 m a una laguna de jade, y un TEMPLO
   ESCALONADO cerrado con cuatro llaves de piedra.
     · TERRENO DE CRESTAS (ruido "ridged"): lomos filosos, dos quebradas
       talladas a lo largo de curvas, y una MESETA al norte con un escalón
       vertical justo donde cae el agua
     · el DOSEL: selva instanciada de 4 siluetas + palmeras y árboles GLB del
       repo, helechos, lianas colgando, flores que brillan, y RAYOS DE LUZ
       (conos aditivos) atravesando las hojas
     · la CASCADA: sábana de agua tejida a mano entre el labio del acantilado
       y la laguna, con dos capas que corren a distinta velocidad, bruma que
       sube y su rugido posicional en el audio
     · la laguna usa el shader de agua de SENDA (ruido azulejable, profundidad,
       espuma que lame la orilla) en verde jade
   HISTORIA (6 caps, ES/EN/PT): MIRA SOLÍS busca el templo que su padre no
   llegó a abrir. MISIÓN: las CUATRO LLAVES DE PIEDRA y la puerta del templo.
   ========================================================================== */
(async () => {
'use strict';
const Q = new URLSearchParams(location.search);
const LOC = Q.has('local');
/* assets: los de los mundos (cielo/audio/npc) y CUALQUIERA del repo (los GLB
   de g3/hyper/reliquia/arcade que sembramos por la selva). Un solo HASH para
   los dos: se pisa después de commitear los assets. */
const HASHR = '23a6b87';
const RAIZ = LOC ? '/assets/'
  : 'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@' + HASHR + '/assets/';
const AX = f => RAIZ + 'mundos/' + f;
const AR = f => RAIZ + f;
const TRE = LOC ? '/_vthree/build/three.module.js'
  : 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* importmap ANTES de cargar GLTFLoader (que importa 'three' por specifier) */
{
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: TRE } });
  document.head.appendChild(im);
}
const T = await import(TRE);
let GLTF = null;
try {
  const GLU = LOC ? '/_vthree/examples/jsm/loaders/GLTFLoader.js'
    : 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
  GLTF = (await import(GLU)).GLTFLoader;
} catch (e) {}
const $ = i => document.getElementById(i);

/* ---------------- azar reproducible: la selva es SIEMPRE la misma ---------- */
let _s = 20260806;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
/* rampa suave entre dos cotas (el escalón de la cascada la usa) */
const ss = (a, b, t) => { const k = cl((t - a) / (b - a || 1e-6), 0, 1); return k * k * (3 - 2 * k); };

/* ---------------- terreno: ruido de valor FBM + CRESTAS, determinista -------
   El carácter de JUNGLA es el relieve QUEBRADO: en vez de colinas redondas
   (senda/exo) el ruido va "ridged" (1-|2n-1|), que deja lomos filosos y
   vallecitos entre ellos. Encima se talla todo lo demás a mano:
     · una MESETA al norte 34 m más alta, con el escalón casi vertical justo
       en la garganta de la cascada y una rampa mansa al este (por ahí sube
       la senda)
     · la CUENCA de la laguna al pie del salto
     · DOS QUEBRADAS excavadas a lo largo de curvas (la grande baja al sureste
       desde la laguna; la chica corta la meseta al este del templo)
   ------------------------------------------------------------------------- */
const MAPA = 900, MITAD = MAPA / 2;
const AGUA_Y = -4.5;
function hash2(i, j){
  /* Math.imul, no `*`: con el producto float se pierden los bits bajos y el
     ruido nunca pasa de ~0,36 (medido en exo: el bosque quedaba en 83 árboles) */
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ 20260806;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z){
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z){
  let v = 0, amp = .5, f = 1;
  for (let o = 0; o < 4; o++){ v += amp * vnoise(x * f, z * f); amp *= .5; f *= 2.03; }
  return v;
}
/* ruido de CRESTAS: los lomos de la selva */
function ridge(x, z, f){
  let v = 0, amp = .55, ff = f;
  for (let o = 0; o < 4; o++){
    const n = vnoise(x * ff + 37, z * ff + 91);
    v += amp * (1 - Math.abs(n * 2 - 1));
    amp *= .5; ff *= 2.07;
  }
  return v;
}
/* PUNTOS DE LA HISTORIA (fijos, el terreno se allana alrededor) */
const POI = {
  inicio:     { x:   60, z:  400 },
  campamento: { x:  -80, z:  250 },
  cascada:    { x: -150, z:   40 },   /* el mirador, orilla sur de la laguna */
  laguna:     { x: -150, z:  -70 },   /* centro del agua (NO se allana) */
  templo:     { x:  130, z: -250, r: 34 },   /* la pirámide necesita pad grande */
  puerta:     { x:  104, z: -250, r: 19 },   /* el atrio, al pie de la cara oeste */
  santuario:  { x:  186, z: -300, r: 15 },
  llave1:     { x:   57, z:  126 },   /* fondo de la quebrada grande */
  llave2:     { x: -232, z: -152 },   /* la cornisa detrás del salto */
  llave3:     { x:  -66, z: -302 },   /* las ruinas de la meseta oeste */
  llave4:     { x:  322, z: -166 }    /* el higuerón del este */
};
/* ------------------------- las QUEBRADAS ----------------------------------- */
const QUEBRADA = [
  { w: 34, prof: 26, pts: [[-54, 28], [10, 84], [104, 168], [206, 268], [300, 372]] },
  { w: 22, prof: 17, pts: [[236, -186], [292, -258], [352, -344]] }
];
function distPoli(x, z, pts){
  let best = 1e9;
  for (let i = 1; i < pts.length; i++){
    const ax = pts[i-1][0], az = pts[i-1][1], bx = pts[i][0], bz = pts[i][1];
    const abx = bx - ax, abz = bz - az;
    const t = cl(((x - ax) * abx + (z - az) * abz) / (abx * abx + abz * abz || 1), 0, 1);
    const dx = x - (ax + abx * t), dz = z - (az + abz * t);
    const d = Math.hypot(dx, dz);
    if (d < best) best = d;
  }
  return best;
}
/* EL ESCALÓN: sube 34 m al norte. Cerca de la garganta (x≈-150) lo hace en
   18 m — pared casi vertical, la que salta el agua — y lejos, al este, en
   130 m: una rampa por la que se puede subir caminando al templo. */
function escalon(x, z){
  const cerca = Math.exp(-Math.pow((x - POI.laguna.x) / 122, 2));
  const z0 = -118 - 34 * (1 - cerca);
  const z1 = z0 - (13 + 121 * (1 - cerca));
  return ss(z0, z1, z);
}
function alturaBase(x, z){
  let h = -16 + ridge(x, z, .0053) * 50;          /* lomos quebrados */
  h += fbm(x * .019 + 41, z * .019 + 77) * 6 - 2; /* detalle */
  h += 34 * escalon(x, z);                        /* la meseta del norte */
  /* cuenca de la laguna al pie del salto */
  const dl = Math.hypot(x - POI.laguna.x, z - POI.laguna.z);
  h -= 46 * Math.exp(-(dl * dl) / (122 * 122));
  /* las quebradas: fondo hondo y paredes que caen rápido */
  for (const q of QUEBRADA){
    const d = distPoli(x, z, q.pts);
    h -= q.prof * Math.exp(-Math.pow(d / q.w, 3));
  }
  /* CORREDOR SECO a lo largo de la senda que bordea la laguna: si el camino
     se hunde bajo el agua no se puede llegar caminando (le pasó a senda/exo).
     Donde va el jugador el suelo nunca baja de -2,2. */
  for (const [a, b] of SECO){
    const abx = b.x - a.x, abz = b.z - a.z;
    const t = cl(((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz || 1), 0, 1);
    const ds = Math.hypot(x - (a.x + abx * t), z - (a.z + abz * t));
    const w = Math.exp(-(ds * ds) / (18 * 18));
    h = h * (1 - w) + Math.max(h, -2.2) * w;
  }
  return h;
}
function H(x, z){
  let h = alturaBase(x, z);
  /* allanar alrededor de cada punto de la historia (claro para construir) */
  for (const k in POI){
    if (k === 'laguna') continue;
    const p = POI[k];
    const d = Math.hypot(x - p.x, z - p.z);
    const rp = p.r || 24;
    const w = Math.exp(-(d * d) / (rp * rp));
    h = h * (1 - w) + (p.h != null ? p.h : alturaBase(p.x, p.z)) * w;
  }
  return h;
}
/* HAY AGUA SÓLO EN LA LAGUNA: el resto del valle puede estar más bajo que la
   cota del agua (el fondo de la quebrada lo está) y sigue siendo tierra seca. */
function enAgua(x, z, margenY){
  return Math.abs(x - POI.laguna.x) < 190 && Math.abs(z - POI.laguna.z) < 190 &&
         H(x, z) < AGUA_Y + (margenY == null ? .5 : margenY);
}
/* la SENDA que une los puntos (pinta tierra en el splat y guía al jugador) */
const SENDA = [POI.inicio, POI.campamento, POI.cascada, POI.templo];
/* EL CAMINO ES CURVO y esa curva manda en todo: splat, plantado y suelo seco */
const SENDA_PTS = [], PTS_SEG = [[]];
for (let i = 1; i < SENDA.length; i++){
  const a = SENDA[i - 1], b = SENDA[i];
  const mx = (a.x + b.x) / 2 + (fbm(i * 5.3, i * 8.1) - .5) * 96;
  const mz = (a.z + b.z) / 2 + (fbm(i * 2.9, i * 6.7) - .5) * 96;
  const seg = [];
  for (let k = 0; k <= 24; k++){
    const t = k / 24, u = 1 - t;
    const P = [u*u*a.x + 2*u*t*mx + t*t*b.x, u*u*a.z + 2*u*t*mz + t*t*b.z];
    seg.push(P);
    if (i === 1 || k > 0) SENDA_PTS.push(P);
  }
  PTS_SEG.push(seg);
}
/* los dos tramos que bordean la laguna se mantienen SECOS a lo largo de la curva */
const SECO = [];
for (const si of [2, 3])
  for (let k = 1; k < PTS_SEG[si].length; k++)
    SECO.push([{ x: PTS_SEG[si][k-1][0], z: PTS_SEG[si][k-1][1] },
               { x: PTS_SEG[si][k][0],   z: PTS_SEG[si][k][1] }]);
for (const k in POI) POI[k].h = alturaBase(POI[k].x, POI[k].z);
POI.cascada.h = AGUA_Y + 1.2;                   /* el mirador nace a la orilla */
POI.puerta.h = POI.templo.h;                    /* atrio y pirámide, mismo nivel */


/* ==================== TEXTURAS (canvas + las generadas) =====================
   Todo se PINTA al vuelo (ruido azulejable, el mismo del terreno) y arriba de
   eso, cuando llegan, se enchufan las DOS texturas fotográficas generadas:
   tex-jungla-1 (suelo de selva: musgo, barro, hojarasca) al musgo del terreno
   y tex-jungla-2 (mampostería con musgo) a la roca del terreno y a TODA la
   piedra del templo. Si no llegan, queda lo pintado y el mundo se ve igual. */
const lienzo = (n, fn) => {
  const c = document.createElement('canvas'); c.width = c.height = n;
  fn(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
};
const valT = (x, y, per) => {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
  const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
  return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
};
const fbmT = (x, y, per, oct) => {
  let v = 0, amp = .55, p = per;
  for (let o = 0; o < oct; o++){ v += amp * valT(x * p, y * p, p); amp *= .5; p *= 2; }
  return cl(v, 0, 1);
};
const mezC = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
function texSuelo(n, colA, colB, pecas, brotes){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const t = fbmT(x / n, y / n, 6, 4);
      let c = mezC(colA, colB, t);
      const r = hash2(x + 7, y + 13);
      if (pecas && r > .964) c = mezC(c, [24, 16, 10], .6);        /* hojas secas */
      else if (brotes && r < .010) c = [150, 206, 96];             /* brotes nuevos */
      const gr = .9 + .2 * hash2(x + 91, y + 57);
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0] * gr; img.data[i4+1] = c[1] * gr; img.data[i4+2] = c[2] * gr;
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* corteza tropical: vetas verticales con musgo y liquen pegado */
function texCorteza(n){
  return lienzo(n, g => {
    const img = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const tw = fbmT(x / n, y / n, 4, 3);
      const veta = .5 + .5 * Math.sin((x / n * 12 + tw * 3.4) * 6.283);
      let c = mezC([44, 34, 24], [116, 94, 62], veta * .65 + tw * .35);
      if (hash2(x + 3, y + 9) > .986) c = mezC(c, [72, 128, 54], .8);   /* musgo */
      const i4 = (y * n + x) * 4;
      img.data[i4] = c[0]; img.data[i4+1] = c[1]; img.data[i4+2] = c[2];
      img.data[i4+3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
/* HOJAS DE SELVA con recorte alfa: hojas anchas y lanceoladas, con nervadura
   clara y algún borde amarillento (lo que hace que el dosel no se vea liso) */
function texHojas(n, base, punta, flor){
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 34; i++){
    const cx = n * (.12 + rnd() * .76), cy = n * (.12 + rnd() * .76);
    const a = rnd() * 6.283, L = n * (.10 + rnd() * .15), W2 = L * (.26 + rnd() * .22);
    const d = g.createLinearGradient(cx - Math.cos(a) * L, cy - Math.sin(a) * L,
                                     cx + Math.cos(a) * L, cy + Math.sin(a) * L);
    d.addColorStop(0, 'rgb(' + base.join(',') + ')');
    d.addColorStop(.7, 'rgb(' + mezC(base, punta, .6).map(Math.round).join(',') + ')');
    d.addColorStop(1, 'rgb(' + punta.join(',') + ')');
    g.fillStyle = d;
    g.save();
    g.translate(cx, cy); g.rotate(a);
    g.beginPath(); g.ellipse(0, 0, L, W2, 0, 0, 6.284); g.fill();
    /* nervadura */
    g.strokeStyle = 'rgba(' + mezC(punta, [235, 245, 200], .5).map(Math.round).join(',') + ',.55)';
    g.lineWidth = Math.max(1, n * .004);
    g.beginPath(); g.moveTo(-L * .9, 0); g.lineTo(L * .9, 0); g.stroke();
    g.restore();
  }
  if (flor) for (let i = 0; i < 14; i++){
    g.fillStyle = 'rgba(' + flor.join(',') + ',.92)';
    g.beginPath(); g.arc(rnd() * n, rnd() * n, n * (.012 + rnd() * .018), 0, 6.284); g.fill();
  }
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
/* HELECHO: una fronda con foliolos, para el sotobosque */
function texHelecho(n){
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.clearRect(0, 0, n, n);
  for (let f = 0; f < 5; f++){
    const bx = n * (.12 + f * .19), largo = n * (.55 + rnd() * .35);
    const incl = -1.57 + rr(-.5, .5);
    g.save();
    g.translate(bx, n * .98); g.rotate(incl + 1.57);
    g.strokeStyle = 'rgb(46,86,34)'; g.lineWidth = Math.max(1, n * .008);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -largo); g.stroke();
    for (let k = 1; k < 13; k++){
      const t = k / 13, y = -largo * t, L = largo * .26 * (1 - t * .8);
      for (const s of [-1, 1]){
        g.fillStyle = 'rgb(' + mezC([40, 78, 30], [126, 178, 66], t).map(Math.round).join(',') + ')';
        g.beginPath();
        g.ellipse(s * L * .55, y, L * .55, largo * .035, s * .5, 0, 6.284);
        g.fill();
      }
    }
    g.restore();
  }
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
/* AGUA DE LA CASCADA: rayas verticales de espuma que corren al desplazar la uv */
function texSalto(n){

  const g = c.getContext('2d');

    const d = g.createLinearGradient(0, y0, 0, y0 + L);

  }

/* mancha suave, sirve de bruma, polen y rayo de luz */
const texMancha = (() => {

/* RAYO DE LUZ: la primera versión eran CONOS aditivos y se veían como cuñas
   blancas con borde duro (se notaba la geometría, quedaba feo). Ahora los rayos
   son PUNTOS: un cuadrado con una columna de luz pintada adentro, suave en los
   cuatro lados, que siempre mira a la cámara. Un solo draw call para todos. */
const texRayo = (() => {
  const N2 = 128, c = document.createElement('canvas');
  c.width = N2; c.height = N2 * 2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2 * 2);
  for (let y = 0; y < N2 * 2; y++) for (let x = 0; x < N2; x++){
    const u = (x / (N2 - 1) - .5) * 2, v = y / (N2 * 2 - 1);
    /* ancho: gaussiana angosta (la columna) · alto: entra fuerte arriba y se
       apaga abajo, con los dos extremos en cero para que no se corte */
    const an = Math.exp(-u * u * 7.5);
    const al = Math.sin(Math.pow(v, .8) * 3.1416) * (1 - v * .55);
    const a = Math.max(0, an * al);
    const i4 = (y * N2 + x) * 4;
    img.data[i4] = 255; img.data[i4+1] = 250; img.data[i4+2] = 224;
    img.data[i4+3] = Math.round(cl(a, 0, 1) * 255);
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
  t.colorSpace = T.SRGBColorSpace;
  return t;
})();

/* tone mapping FÍLMICO (ACES) + sombras suaves (PCF). La exposición la maneja

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = barro pisado del sendero · G = hojarasca bajo el dosel. Se pinta UNA vez
   en un canvas de 512: el sendero como trazo gordo curvo entre los puntos de
   la historia, la hojarasca como manchas de ruido donde después va la selva,
   y claros de tierra en el campamento, el templo y cada llave. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* hojarasca: manchas grandes, la selva tapa casi todo el suelo */
  g.fillStyle = '#004200';
  for (let i = 0; i < 1300; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 7 + rnd() * 26;
    if (vnoise(x * .02, y * .02) < .44) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.284); g.fill();
  }
  g.filter = 'blur(6px)';
  g.drawImage(SPL, 0, 0);
  g.filter = 'none';
  /* el sendero: R fuerte, con borde difuso */
  for (const [w, c] of [[15, 'rgba(140,0,0,.5)'], [7, 'rgba(255,0,0,.85)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* claros de tierra: campamento, templo, santuario y las cuatro llaves */
  for (const [k, r] of [['campamento', 13], ['templo', 17], ['santuario', 11],
                        ['llave1', 8], ['llave2', 8], ['llave3', 9], ['llave4', 9]]){
    g.fillStyle = 'rgba(150,0,0,.45)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), r, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4
   texturas, pero con TODO el pipeline de three gratis — RECIBE las sombras del
   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo
   (antes el terreno y los árboles se iluminaban por recetas distintas y había
   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 7 }
};
const matTerr = new T.MeshLambertMaterial({ map: TX.musgo });
TEXGEN.suelo.push(matTerr);   /* la textura generada del suelo entra acá */
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = texture2D(map, uvT).rgb;
      c = mix(c, texture2D(tHoja, uvT*1.3).rgb, clamp(spl.g*1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT*1.6).rgb, clamp(spl.r*1.35, 0., 1.));
      c = mix(c, texture2D(tRoca, uvT*.9).rgb, vRocoso);
      diffuseColor.rgb *= c;`);
};

/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    scene.add(m);
    terrChunks.push(m);
  }
}

/* falda del horizonte: tapa la parte BAJA de la foto del cielo (que es oscura)
   con suelo que a esa distancia ya es color de niebla puro */
{
  const f = new T.Mesh(new T.CircleGeometry(1150, 24),
    new T.MeshLambertMaterial({ color: 0x8eab85 }));   /* color de NIEBLA, no de arena */
  f.rotation.x = -Math.PI / 2;
  f.position.y = -46;
  f.frustumCulled = false;
  scene.add(f);
  /* PARED DE LOMAS LEJANAS: una falda plana converge exactamente a la altura del
     ojo, así que desde cualquier punto alto (la colina del roble, la cámara del
     menú) se veía la franja oscura de la foto del cielo entre la falda y el
     horizonte. Este anillo sube hasta +70 a 1.100 m: a esa distancia la niebla lo
     pinta liso y se lee como una serranía en la bruma que CIERRA el horizonte. */
  const pared = new T.Mesh(new T.CylinderGeometry(1100, 660, 122, 24, 1, true),
    new T.MeshLambertMaterial({ color: 0x87a67e, side: T.BackSide }));
  pared.position.y = 15;         /* base -46 (debajo de la quebrada), borde +76 */
  pared.frustumCulled = false;
  scene.add(pared);
}
/* ------------------------------- EL LAGO ----------------------------------- */
/* AGUA VIVA: plano con grilla (para el oleaje de vértices) + normal perturbada
   por ondas que CORREN en el fragmento — el reflejo del cielo (PMREM) se mueve
   con ellas, que es lo que hace que el agua se lea como agua y no como vidrio.
   El plano es cuadrado a propósito: donde el terreno está más alto lo tapa la
   prueba de profundidad, así que la orilla la dibuja el propio lago. */
const AGUAU = { value: 0 };
/* RUIDO AZULEJABLE para el agua: 3 octavas de ruido de valor con la retícula en
   módulo (los bordes empalman). Es lo que mata el "se ve programado": los senos
   puros hacen crestas RECTAS que se repiten; el ruido no se repite nunca a la
   vista. Se genera una vez en un canvas de 256. */
const RUIDO = (() => {
  const N2 = 256, c = document.createElement('canvas');
  c.width = c.height = N2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2);
  const val = (x, y, per) => {
    const i = Math.floor(x), j = Math.floor(y);
    const fx = x - i, fy = y - j;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const h = (a, b) => hash2(((a % per) + per) % per + 101, ((b % per) + per) % per + 37);
    const a = h(i, j), b = h(i + 1, j), c2 = h(i, j + 1), d = h(i + 1, j + 1);
    return a + (b - a) * sx + (c2 - a) * sy + (a - b - c2 + d) * sx * sy;
  };
  for (let y = 0; y < N2; y++) for (let x = 0; x < N2; x++){
    let v = 0, amp = .55, per = 8;
    for (let o = 0; o < 3; o++){ v += amp * val(x / N2 * per, y / N2 * per, per); amp *= .5; per *= 2; }
    const k = Math.round(cl(v, 0, 1) * 255), i4 = (y * N2 + x) * 4;
    img.data[i4] = img.data[i4+1] = img.data[i4+2] = k; img.data[i4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
})();
/* TEXTURA DE PROFUNDIDAD: el agua "no tenía masa" (dicho del jugador, y es
   exacto) porque la orilla era el corte seco del polígono contra el terreno.
   Se precalcula cuánto terreno hay DEBAJO de cada punto del agua (256x256 sobre
   los 380x380 del plano) y con eso el shader hace lo que hace el agua real:
   transparente y clara en el bajío, honda y oscura en el centro, espuma
   lamiendo la orilla, y las olas se aplanan al llegar a la costa. */
const PROF = (() => {
  const N2 = 256, c = document.createElement('canvas');
  c.width = c.height = N2;
  const g = c.getContext('2d'), img = g.createImageData(N2, N2);
  for (let j = 0; j < N2; j++) for (let i = 0; i < N2; i++){
    const x = POI.laguna.x + (i / (N2 - 1) - .5) * 380;
    const z = POI.laguna.z + (j / (N2 - 1) - .5) * 380;
    const d = cl((AGUA_Y - H(x, z)) / 7, 0, 1);        /* 0 = orilla, 1 = hondo */
    const k = Math.round(d * 255), i4 = (j * N2 + i) * 4;
    img.data[i4] = img.data[i4+1] = img.data[i4+2] = k; img.data[i4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
  return t;
})();
/* MENOS ESPEJO: con metalness .9 la laguna reflejaba el cielo entero y se
   veía BLANCA (la trampa conocida del agua clara). Con .45 y más rugosidad
   manda el color propio del agua y el jade se lee de verdad. */
const aguaMat = new T.MeshStandardMaterial({ color: 0x0d3d2a, metalness: .12,
  roughness: .38, transparent: true, opacity: .95 });
aguaMat.envMapIntensity = .22;
aguaMat.onBeforeCompile = sh => {
  sh.uniforms.uT = AGUAU;
  sh.uniforms.tRuido = { value: RUIDO };
  sh.uniforms.tProf = { value: PROF };
  aguaMat.userData.sh = sh;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tProf;varying vec2 vWp;varying float vD;varying float vAlt;varying float vProf;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vWp = position.xy;
      vProf = texture2D(tProf, position.xy / 380.0 + 0.5).r;
      /* DOMINIO DEFORMADO: antes de calcular la ola, la posición se tuerce con
         dos senos lentos. Las crestas dejan de ser líneas rectas: se curvan y
         serpentean como en el mar de verdad. */
      vec2 pw = position.xy + vec2(sin(position.y*.021 + uT*.33),
                                   cos(position.x*.017 - uT*.27)) * 16.0;
      float hh = sin(pw.x*.052 + uT*1.02)*.22
               + cos(pw.y*.047 - uT*.83)*.18
               + sin((pw.x + pw.y)*.093 + uT*1.61)*.11
               + cos(pw.x*.019 - pw.y*.029 + uT*.47)*.15;
      /* la ola se APLANA al entrar al bajío: si no, el borde del agua sube y
         baja despegándose de la costa y se ve la lámina */
      hh *= smoothstep(0.0, 0.22, vProf);
      transformed.z += hh;
      vAlt = hh;
      vD = -(modelViewMatrix * vec4(transformed, 1.0)).z;`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tRuido;varying vec2 vWp;varying float vD;varying float vAlt;varying float vProf;')
    /* OJO CON EL ORDEN DEL PIPELINE: color_fragment y roughnessmap corren ANTES
       que normal_fragment_begin. Todo el cálculo (ruido, espuma, gradiente) se
       hace en color_fragment y la normal sólo CONSUME el gradiente después. */
    .replace('#include <color_fragment>', `#include <color_fragment>
      float espuma; vec2 aguaG; float n3;
      {
        /* TRES ESCALAS de rizado por ruido. La primera versión usaba capas de
           ~90 m y ~23 m: en la pantalla del celular eran manchones lechosos sin
           detalle (captura del jugador: "está horrible", y sí). Escalas nuevas:
           oleaje ~20 m + olitas ~4,5 m + micro-rizado ~1,5 m. El detalle fino es
           lo que hace que el agua se lea como agua a cualquier distancia. */
        float lejos = clamp(1.0 - vD / 320.0, .3, 1.0);
        vec2 uvA = vWp*.048 + vec2(uT*.020,  uT*.013);
        vec2 uvB = vWp*.19  + vec2(-uT*.036, uT*.028);
        vec2 uvC = vWp*.55  + vec2(uT*.05,  -uT*.041);
        float e2 = .02;
        float n1  = texture2D(tRuido, uvA).r;
        float n2  = texture2D(tRuido, uvB).r;
        n3  = texture2D(tRuido, uvC).r;
        float gxA = texture2D(tRuido, uvA + vec2(e2, 0.)).r - n1;
        float gyA = texture2D(tRuido, uvA + vec2(0., e2)).r - n1;
        float gxB = texture2D(tRuido, uvB + vec2(e2, 0.)).r - n2;
        float gyB = texture2D(tRuido, uvB + vec2(0., e2)).r - n2;
        float gxC = texture2D(tRuido, uvC + vec2(e2, 0.)).r - n3;
        float gyC = texture2D(tRuido, uvC + vec2(0., e2)).r - n3;
        aguaG = vec2(gxA*2.4 + gxB*3.6 + gxC*2.2,
                     gyA*2.4 + gyB*3.6 + gyC*2.2) * lejos;
        /* ESPUMA ESCASA: vetas finas donde coinciden la cresta y las dos capas
           chicas — no manchones. El micro-rizado la recorta en hilos. */
        espuma = smoothstep(1.42, 1.62, n2*.9 + n3*.75 + max(vAlt, 0.)*.9)
               * smoothstep(.35, .6, n3) * lejos;
      }
      /* MASA DEL AGUA: bajío claro y verdoso -> hondo oscuro. Es la señal de
         volumen que le faltaba. */
      diffuseColor.rgb = mix(vec3(.10, .40, .28), diffuseColor.rgb,
                             smoothstep(0.0, 0.55, vProf));
      /* espuma que LAME la orilla, ondulando con el ruido fino y el tiempo */
      float lame = smoothstep(.065, .018, vProf + sin(uT*1.4 + vWp.x*.3 + vWp.y*.23)*.012);
      espuma = max(espuma, lame * (.45 + .55 * n3));
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.80, .93, .84), espuma * .5);
      /* y el borde mismo se DESVANECE: nada de corte poligonal seco */
      diffuseColor.a *= smoothstep(0.0, 0.05, vProf);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, .85, espuma);`)
    /* EL AGUA ES LA LÁMPARA: el bajío EMITE luz cian que late despacio */
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += vec3(.02, .08, .05) *
        (1.0 - smoothstep(0.0, 0.5, vProf));`)
    .replace('#include <normal_fragment_begin>', `#include <normal_fragment_begin>
      normal = normalize(normal + vec3(aguaG.x, aguaG.y, 0.0));`);
};
const agua = new T.Mesh(new T.PlaneGeometry(380, 380, 84, 84), aguaMat);
agua.rotation.x = -Math.PI / 2;
agua.position.set(POI.laguna.x, AGUA_Y, POI.laguna.z);
scene.add(agua);

/* ------------------------------- LA SELVA -----------------------------------
   Cuatro capas, todas instanciadas (miles de plantas en un puñado de llamadas
   de dibujo):
     1. DOSEL: árboles altos de tronco flaco con ramas arriba (la luz llega al
        suelo sólo por los huecos) + palmeras de tronco curvo
     2. SOTOBOSQUE: helechos y matas, densísimo, tapa el piso
     3. LIANAS colgando del dosel y flores que brillan en la penumbra
     4. RAYOS DE LUZ: conos aditivos inclinados como el sol, y capas de vapor
   Arriba de eso se siembran GLB del repo (palmeras, árboles, troncos caídos,
   tótems) para romper la repetición de las siluetas pintadas.              */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
function geoCopa(nq, radio, alto){
  const geos = [];
  for (let i = 0; i < nq; i++){
    const g = new T.PlaneGeometry(radio * rr(1.5, 2.2), radio * rr(1.2, 1.8));
    g.rotateX(rr(-0.6, 0.6)); g.rotateY(rr(0, 6.28)); g.rotateZ(rr(-0.5, 0.5));
    const a = rr(0, 6.28), rd = rr(0, radio * .55);
    g.translate(Math.cos(a) * rd, alto + rr(-radio * .35, radio * .5), Math.sin(a) * rd);

/* ÁRBOL DE SELVA: tronco alto y flaco con CONTRAFUERTES en la base, las ramas
   sólo en el tercio de arriba (así el sotobosque queda abierto y se camina),
   y la fronda en la punta de cada rama más la corona. */
function geoArbol(altura, nRamas, rHojas){
  const lena = [], puntas = [];
  const tr = new T.CylinderGeometry(.22, .52, altura, 6, 1, true);
  tr.translate(0, altura / 2, 0);
  lena.push(tr);
  /* contrafuertes: tres aletas de raíz en la base */
  for (let i = 0; i < 3; i++){
    const a = i / 3 * 6.284 + rr(-.3, .3);
    const g = new T.ConeGeometry(.42, altura * .17, 4);
    g.rotateZ(1.15); g.rotateY(-a);
    g.translate(Math.cos(a) * .55, altura * .075, Math.sin(a) * .55);
    lena.push(g);
  }
  for (let i = 0; i < nRamas; i++){
    const hFrac = .66 + .3 * (i / Math.max(1, nRamas - 1)) + rr(-.03, .03);
    const largo = altura * rr(.22, .34);
    const inclina = rr(.75, 1.15);
    const giro = i * 2.399 + rr(-.3, .3);
    const g = new T.CylinderGeometry(.05, .14, largo, 4, 1, true);
    g.translate(0, largo / 2, 0);
    g.rotateZ(inclina); g.rotateY(giro);
    const y0 = altura * hFrac;
    g.translate(0, y0, 0);
    lena.push(g);
    const px2 = Math.cos(giro) * Math.sin(inclina) * largo;
    const pz2 = -Math.sin(giro) * Math.sin(inclina) * largo;
    puntas.push([px2, y0 + Math.cos(inclina) * largo, pz2]);
  }
  puntas.push([0, altura * 1.03, 0]);
  const hojas = [];
  for (const [qx, qy, qz] of puntas){
    const esCorona = qy > altura;
    const n = esCorona ? 5 : 3;
    for (let k = 0; k < n; k++){
      const r2 = rHojas * (esCorona ? 1.3 : 1.0) * rr(.85, 1.25);
      const g = new T.PlaneGeometry(r2 * 2.2, r2 * 1.5);
      g.rotateX(rr(-.7, .7)); g.rotateY(rr(0, 6.28)); g.rotateZ(rr(-.5, .5));
      g.translate(qx + rr(-.6, .6), qy + rr(-.3, .6), qz + rr(-.6, .6));
      hojas.push(g);
    }
  }
  return { lena: fusiona(lena), hojas: fusiona(hojas) };
}
/* PALMERA: tronco en arco (anillado) y frondas radiales que cuelgan */
function geoPalma(altura){
  const lena = [], hojas = [];
  const seg = 6, curva = rr(1.4, 3.6), dir = rr(0, 6.283);
  let cx = 0, cz = 0;
  for (let i = 0; i < seg; i++){
    const t = i / seg, h = altura / seg;
    const g = new T.CylinderGeometry(.2 - t * .07, .26 - t * .07, h * 1.06, 5, 1, true);
    const dx = Math.cos(dir) * curva * t * t, dz = Math.sin(dir) * curva * t * t;
    g.translate(dx, altura * t + h / 2, dz);
    lena.push(g);
    cx = dx; cz = dz;
  }
  const top = [cx, altura, cz];
  for (let i = 0; i < 9; i++){
    const a = i / 9 * 6.284 + rr(-.15, .15);
    const L = rr(2.6, 4.2);
    const g = new T.PlaneGeometry(L * 2, L * .62);
    g.rotateZ(rr(-.5, -.15));
    g.rotateY(a);
    g.translate(top[0] + Math.cos(a) * L * .82, top[1] - rr(.1, 1.1), top[2] + Math.sin(a) * L * .82);
    hojas.push(g);
  }
  return { lena: fusiona(lena), hojas: fusiona(hojas) };
}
/* VIENTO: las copas se mecen en el vertex shader; la fase sale de la posición
   EN EL MUNDO (instanceMatrix), así cada planta va a su ritmo. */
const VIENTO = { value: 0 };
function conViento(mat, fuerza){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uViento = {};
    Object.defineProperty(sh.uniforms.uViento, 'value',
      { get: () => VIENTO.value, set: () => {} });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uViento;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          #ifdef USE_INSTANCING
            vec4 wq = instanceMatrix * vec4(transformed, 1.0);
          #else
            vec4 wq = vec4(transformed, 1.0);
          #endif
          float sw = sin(uViento*1.5 + wq.x*.19 + wq.z*.15)
                   + .5*sin(uViento*2.6 + wq.z*.31 + wq.x*.07)
                   + .22*sin(uViento*5.6 + wq.x*1.2 + wq.y*.8);
          float amp = ${fuerza.toFixed(2)} * max(transformed.y - .6, 0.0) * .07;
          transformed.x += sw * amp;
          transformed.z += .6 * sw * amp;
        }`);
  };
  return mat;
}
const ARB = [];                                /* [x,z,r] choque */
/* ¿está el punto encima del sendero o de un punto de la historia? */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    /* el claro es del tamaño del sitio: la pirámide mide 38 m de base y con 15 m
       fijos crecían árboles ADENTRO de la piedra (y su sombra la dejaba negra) */
    if (k !== 'laguna' && Math.hypot(x - p.x, z - p.z) < (p.r ? p.r + 5 : 15)) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
/* un punto libre alrededor de (cx,cz): ni en el agua, ni en el camino, ni en
   una pendiente imposible. Devuelve null si no encontró en 60 intentos. */
function puntoLibre(cx, cz, radio, margen, maxPend){
  for (let i = 0; i < 60; i++){
    const a = rr(0, 6.283), rd = radio * Math.sqrt(rnd());
    const x = cl(cx + Math.cos(a) * rd, -MITAD + 12, MITAD - 12);
    const z = cl(cz + Math.sin(a) * rd, -MITAD + 12, MITAD - 12);
    if (enAgua(x, z, 1.2) || molesta(x, z, margen)) continue;
    const y = H(x, z);
    if (maxPend){
      const pend = Math.max(Math.abs(H(x + 2, z) - y), Math.abs(H(x, z + 2) - y));
      if (pend > maxPend) continue;
    }
    return [x, y, z];
  }
  return null;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
/* ---- GLB del repo CLONADOS en masa (una carga, N clones) ------------------ */
function propMuchos(url, lista, o){
  if (!GLTF || !lista.length) return;
  o = o || {};
  new GLTF().load(AR(url), g => {
    const base = g.scene;
    base.traverse(n => { if (n.isMesh && n.material){
      const mm = n.material;
      /* algunos GLB del repo salen BLANCOS: traen emissive del glTF y
         KHR_materials_specular. Se apagan los dos. */
      if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
      if ('specularIntensity' in mm) mm.specularIntensity = 0;
      if ('metalness' in mm) mm.metalness = 0;
      if ('envMapIntensity' in mm) mm.envMapIntensity = .4;
      if (o.tinte && mm.color) mm.color.multiplyScalar(o.tinte);
    } });
    base.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(base);
    const abajo = caja.min.y, alto = caja.max.y - caja.min.y || 1;
    for (const p of lista){
      const m = base.clone(true);
      const esc = (o.esc || 1) * (p[2] || 1) / alto * (o.altoObjetivo || alto);
      m.scale.setScalar(esc);
      m.rotation.set(o.rx || 0, p[3] != null ? p[3] : rr(0, 6.283), o.rz || 0);
      m.position.set(p[0], H(p[0], p[1]) - abajo * esc + (o.y || 0), p[1]);
      /* SÍ al recorte por frustum: son estáticos y su caja es correcta. Con
         frustumCulled=false los 39 props se dibujaban siempre (medido: +200k
         triángulos por cuadro estando del otro lado del valle). */
      m.traverse(n => { if (n.isMesh){ n.castShadow = !!o.sombra; n.receiveShadow = true; } });
      scene.add(m);
      if (o.choque) ARB.push([p[0], p[1], o.choque]);
      window.__PROPS = (window.__PROPS || 0) + 1;
    }
  }, undefined, () => {});
}

      blending: T.AdditiveBlending, sizeAttenuation: true, fog: false }));
    RAYOS.frustumCulled = false;
    RAYOS.userData.n = n2;
    scene.add(RAYOS);
  }
  /* ---- VAPOR: capas horizontales enormes y tenues a media altura --------- */
  {
    const mv = new T.MeshBasicMaterial({ map: texMancha, color: 0xd8ecc8,
      transparent: true, opacity: .10, depthWrite: false, side: T.DoubleSide, fog: false });
    for (let i = 0; i < 8; i++){
      const p = new T.Mesh(new T.PlaneGeometry(rr(220, 420), rr(220, 420)), mv);
      p.rotation.x = -Math.PI / 2;

      p.userData.y0 = p.position.y;

      scene.add(p);

  }
  window.__FLORA = pos1.length + pos2.length + posP.length + ph + pm2 + nf;
}

/* =================== LO CONSTRUIDO: el templo, el salto, el campo ==========
   Todo lo que no es vegetación: el TEMPLO ESCALONADO con su puerta de cuatro
   huecos, la CASCADA (sábana tejida a mano entre el labio y la laguna), el
   campamento de la expedición, los cuatro sitios de las llaves y el patio del
   santuario. Los materiales de piedra se anotan en TEXGEN.piedra: cuando llega
   la textura generada, TODA la piedra del mundo cambia de golpe. */
const matPiedra = new T.MeshLambertMaterial({ map: TX.roca, color: 0xbcc2a8 });
const matPiedraOsc = new T.MeshLambertMaterial({ map: TX.roca, color: 0x76806a });
const matMadera = new T.MeshLambertMaterial({ map: TX.madera });
TX.roca.repeat.set(3, 3);
TEXGEN.piedra.push(matPiedra, matPiedraOsc);
let runaMat = null, semillaMat = null, ventanaMat = null;
const FUEGOS = [];                             /* sprites de llama que titilan */
/* LLAMA. La primera versión era una elipse con degradado radial y con blending
   aditivo se veía como un HUEVO blanco (captura de la puerta del templo). Ahora
   es una LENGUA de fuego: bezier angosto y alto, degradado vertical, halo suave
   aparte y mucho menos alfa. */
function fuego(x, y, z, esc, luz){
  const W2 = 64, H2 = 96;
  const c = document.createElement('canvas'); c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  const halo = g.createRadialGradient(32, 74, 1, 32, 68, 26);
  halo.addColorStop(0, 'rgba(255,206,140,.42)');
  halo.addColorStop(1, 'rgba(255,150,60,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W2, H2);
  const gr = g.createLinearGradient(0, H2, 0, 4);
  gr.addColorStop(0, 'rgba(255,250,226,.95)');
  gr.addColorStop(.22, 'rgba(255,214,132,.8)');
  gr.addColorStop(.55, 'rgba(248,146,50,.42)');
  gr.addColorStop(1, 'rgba(200,70,20,0)');
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(32, H2 - 2);
  g.quadraticCurveTo(9, 62, 30, 6);
  g.quadraticCurveTo(38, 34, 42, 46);
  g.quadraticCurveTo(56, 66, 32, H2 - 2);
  g.fill();
  const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c),
    transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: true }));
  s.scale.set(esc * .55, esc * .95, 1);
  s.position.set(x, y + esc * .42, z);
  scene.add(s);
  const L2 = luz ? new T.PointLight(0xffa54a, 5, 22, 1.8) : null;
  if (L2){ L2.position.set(x, y + 1.4, z); scene.add(L2); }
  FUEGOS.push({ s, L2, e: esc, f: rr(0, 6.28) });
  return s;
}
/* ------------------------------- EL TEMPLO ---------------------------------
   Pirámide de seis cuerpos con la escalinata al sur, el altar arriba y —al pie
   de la cara OESTE— la PUERTA: una laja de seis metros con cuatro huecos, uno
   por llave. Al abrirse baja al suelo y la boca vuelca luz verde. */
const TEMPLO = { puerta: null, abierta: 0, huecos: [], haz: null, boca: null };
{
  const p = POI.templo, y = H(p.x, p.z);
  const NT = 6, W0 = 38, HT = 3.6;
  /* TODA la piedra de la pirámide se FUSIONA en dos mallas (una por material):
     eran ~50 draw calls de cajas sueltas. */
  const claro = [], oscuro = [];
  const caja = (lista, w, h, d, x, yy, z, rx) => {
    const g = new T.BoxGeometry(w, h, d);
    if (rx) g.rotateX(rx);
    g.translate(x, yy, z);
    lista.push(g);
  };
  for (let i = 0; i < NT; i++){
    const w = W0 - i * 5.4;
    caja(i % 2 ? oscuro : claro, w, HT, w, p.x, y + HT / 2 + i * HT - .6, p.z);
  }
  /* la escalinata sur */
  for (let k = 0; k < 18; k++)
    caja(claro, 9.5, 1.3, 1.35, p.x, y + .65 + k * 1.2, p.z + 19.5 - k * 1.0);
  /* barandas de la escalinata: dos serpientes de piedra */
  for (const sx of [-1, 1])
    caja(oscuro, 1.1, 1.4, 22, p.x + sx * 5.6, y + 11.6, p.z + 9.5, -Math.atan2(21.6, 18));
  /* el altar de arriba: cuatro columnas, dintel y la boca oscura */
  const yTop = y + NT * HT - .6;
  for (const [sx, sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const g = new T.CylinderGeometry(.6, .7, 5.2, 7);
    g.translate(p.x + sx * 3.4, yTop + 2.6, p.z + sz * 3.4);
    claro.push(g);
  }
  caja(oscuro, 9.4, 1.5, 9.4, p.x, yTop + 6, p.z);
  caja(claro, 3.2, 1.4, 3.2, p.x, yTop + .7, p.z);
  /* el HAZ: sale del altar cuando el templo se abre */
  const haz = new T.Mesh(new T.CylinderGeometry(2.0, 3.4, 120, 12, 1, true),
    new T.MeshBasicMaterial({ map: texHaz, color: 0x8cff9a, transparent: true,
      opacity: 0, blending: T.AdditiveBlending, depthWrite: false,
      side: T.DoubleSide, fog: false }));
  haz.position.set(p.x, yTop + 62, p.z);
  haz.frustumCulled = false;
  scene.add(haz);
  TEMPLO.haz = haz;
  /* ---- LA PUERTA, al pie de la cara oeste ---- */
  const dx = p.x - W0 / 2 - .9;
  const boca = new T.Mesh(new T.BoxGeometry(1.2, 6.4, 6.2),
    new T.MeshBasicMaterial({ color: 0x05100a }));
  boca.position.set(dx + .7, y + 3.2, p.z);
  scene.add(boca);
  TEMPLO.boca = boca;
  /* el resplandor del interior (pasoLuz lo enciende al oscurecer). Va con la
     mancha suave y aditivo: como plano de color liso se veía un CARTEL celeste
     colgado en la puerta. */
  ventanaMat = new T.MeshBasicMaterial({ map: texMancha, color: 0x1c4a28,
    transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false });
  const ven = new T.Mesh(new T.PlaneGeometry(5.4, 5.8), ventanaMat);
  ven.position.set(dx + .05, y + 3.1, p.z);
  ven.rotation.y = -Math.PI / 2;
  scene.add(ven);
  focoCasa.position.set(dx - 2.5, y + 2.6, p.z);
  /* jambas y dintel (van a la malla fusionada) */
  for (const sz of [-1, 1]) caja(claro, 1.6, 7.6, 1.5, dx, y + 3.8, p.z + sz * 3.8);
  caja(oscuro, 2.0, 1.6, 9.4, dx, y + 8.2, p.z);
  /* la LAJA que cierra (se hunde al abrirse) */
  const puerta = new T.Mesh(new T.BoxGeometry(1.1, 6.6, 6.0), matPiedraOsc);
  puerta.position.set(dx - .1, y + 3.3, p.z);
  puerta.castShadow = puerta.receiveShadow = true;
  puerta.userData.y0 = puerta.position.y;
  scene.add(puerta);
  TEMPLO.puerta = puerta;
  /* los CUATRO HUECOS: dos por jamba, con su glifo que se enciende al traer
     la llave (runaMat late en el bucle) */
  runaMat = new T.MeshBasicMaterial({ color: 0x9cff7a, transparent: true, opacity: .18 });
  for (let i = 0; i < 4; i++){
    const sz = i < 2 ? -1 : 1, sy = i % 2 ? 1 : -1;
    const hx = dx - .62, hy = y + 3.4 + sy * 1.9, hz = p.z + sz * 3.8;
    caja(oscuro, .5, 1.15, 1.0, hx, hy, hz);
    const gl = new T.Mesh(new T.PlaneGeometry(.9, 1.05), runaMat);
    gl.position.set(hx - .32, hy, hz);
    gl.rotation.y = -Math.PI / 2;
    gl.visible = false;
    scene.add(gl);
    TEMPLO.huecos.push(gl);
  }
  /* braseros a los lados de la puerta */
  for (const sz of [-1, 1]){
    const g = new T.CylinderGeometry(.9, .6, 1.5, 8);
    g.translate(dx - 4.2, y + .75, p.z + sz * 6.5);
    claro.push(g);
    fuego(dx - 4.2, y + 1.5, p.z + sz * 6.5, 2.0, sz > 0);
  }
  /* las dos mallas fusionadas de la pirámide */
  for (const [lista, mat] of [[claro, matPiedra], [oscuro, matPiedraOsc]]){
    const m = new T.Mesh(fusiona(lista), mat);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
  ARB.push([p.x, p.z, 21]);                    /* no se atraviesa la pirámide */
  ARB.push([dx - 3.2, p.z, 2.0]);
  window.__PARTES = 6;
}
/* ------------------------------ LA CASCADA ---------------------------------
   La sábana se TEJE entre dos cotas que se buscan en el terreno: el labio (el
   punto más al sur donde la meseta todavía está alta) y el pie (el primero que
   ya está bajo el agua). Así el agua cae siempre pegada al acantilado, aunque
   se toque la fórmula del terreno. */
const CASCADA = { texA: null, texB: null, bruma: null, espuma: null, y0: 0, zPie: 0 };
{
  const XF = POI.laguna.x;
  /* el LABIO: el punto más al sur donde la meseta todavía está alta. Con el
     umbral en 9 m el labio caía DEMASIADO abajo (el salto medía 15 m en vez de
     los 30 del guion): con 13 y seis metros más al norte, el agua sale de
     arriba del escalón. */
  let zLab = -158;
  for (let z = -196; z < -104; z += .5) if (H(XF, z) > 13) zLab = z;
  zLab -= 6;
  let zPie = zLab + 12;
  for (let z = zLab; z < -50; z += .5){ if (H(XF, z) < AGUA_Y - 1.5){ zPie = z; break; } }
  const yLab = H(XF, zLab);
  CASCADA.y0 = yLab; CASCADA.zPie = zPie;
  const cols = 9, rows = 13;
  /* la sábana se TEJE: una malla de 9x13 entre el labio y el pie, que se ensancha
     al caer y se comba hacia adelante. La misma función hace el PAREDÓN de atrás
     (más ancho y 2,5 m más al norte): sin él la sábana blanca flotaba sobre una
     loma verde y no se leía como salto.
     OJO: los vértices están en coordenadas del MUNDO, así que NO se puede
     escalar la malla (escalar x movía todo 50 m al oeste: el paredón aparecía
     corrido). El ancho se pasa por parámetro. */
  const tejer = (wT, wB, dz) => {
    const PA = [], UA = [], IA = [];
    for (let r = 0; r <= rows; r++){
      const t = r / rows;
      const w = wT + (wB - wT) * t;
      const zz = zLab + (zPie - zLab) * Math.pow(t, .8) + dz;
      const yy = yLab + 1 + (AGUA_Y - 1.4 - yLab - 1) * Math.pow(t, 1.35);
      for (let c = 0; c <= cols; c++){
        const u = c / cols;
        PA.push(XF + (u - .5) * w, yy, zz + Math.sin(u * 3.1416) * (1.2 + 2.6 * t));
        UA.push(u * 2, t * 3.2);
      }
    }
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
      const a = r * (cols + 1) + c, b = a + 1, d = a + cols + 1, e = d + 1;
      IA.push(a, d, b, b, d, e);
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(PA), 3));
    g.setAttribute('uv', new T.BufferAttribute(new Float32Array(UA), 2));
    g.setIndex(IA);
    g.computeVertexNormals();
    return g;
  };
  const gS = tejer(19, 31, 0);
  const hoja = (tex, op, dz, blend) => {
    const m = new T.Mesh(dz ? tejer(19, 31, dz) : gS,
      new T.MeshBasicMaterial({ map: tex, transparent: true,
        opacity: op, depthWrite: false, side: T.DoubleSide, blending: blend,
        color: 0xe6f6ff }));
    m.frustumCulled = false;
    scene.add(m);
    return m;
  };
  /* el PAREDÓN mojado, detrás del agua */
  {
    /* ANCHO: 54 m arriba contra los 19 del agua, así queda roca a los dos lados
       del chorro. (La versión con MACIZOS de cajas apoyadas en H() quedaba con
       bloques FLOTANDO sobre el acantilado: la pared tejida sigue la misma
       curva que el agua y nunca despega.) */
    const roca = new T.Mesh(tejer(54, 70, -3.0), new T.MeshLambertMaterial({ map: TX.roca,
      color: 0x5a6252, side: T.DoubleSide }));
    roca.frustumCulled = false;
    roca.receiveShadow = true;
    scene.add(roca);
    TEXGEN.piedra.push(roca.material);
  }
  CASCADA.texA = TX.salto.clone(); CASCADA.texA.needsUpdate = true;
  CASCADA.texB = TX.salto.clone(); CASCADA.texB.needsUpdate = true;
  CASCADA.texB.repeat.set(1.7, 1.3);
  hoja(CASCADA.texA, .96, 0, T.NormalBlending);
  hoja(CASCADA.texB, .42, 1.1, T.AdditiveBlending);
  /* ESPUMA DEL IMPACTO: un disco aditivo sobre el agua, en el pie del salto,
     que late (es lo que dice "acá está cayendo el agua") */
  {
    const esp = new T.Mesh(new T.CircleGeometry(15, 20),
      new T.MeshBasicMaterial({ map: texMancha, color: 0xf2fbff, transparent: true,
        opacity: .5, blending: T.AdditiveBlending, depthWrite: false, fog: true }));
    esp.rotation.x = -Math.PI / 2;
    esp.position.set(XF, AGUA_Y + .18, zPie + 4);
    scene.add(esp);
    CASCADA.espuma = esp;
  }
  /* la BRUMA del pie: puntos que suben y vuelven a nacer */
  {
    const N2 = 190, P = new Float32Array(N2 * 3);
    for (let i = 0; i < N2; i++){
      P[i*3] = XF + rr(-16, 16);
      P[i*3+1] = AGUA_Y + rnd() * 16;
      P[i*3+2] = zPie + rr(-9, 9);
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(P, 3));
    CASCADA.bruma = new T.Points(g, new T.PointsMaterial({ size: 5.5, map: texMancha,
      color: 0xe8f6ea, transparent: true, opacity: .17, depthWrite: false,
      blending: T.AdditiveBlending, sizeAttenuation: true }));
    CASCADA.bruma.frustumCulled = false;
    scene.add(CASCADA.bruma);
  }
  /* piedras mojadas en el pie del salto: SÓLO donde hay tierra seca (antes se
     apoyaban sobre la cota del agua y quedaban flotando como manchas negras) y
     bien enterradas */
  {
    const gs = [];
    for (let i = 0; i < 22; i++){
      const a = rr(0, 6.283), rd = rr(12, 42);
      const x = XF + Math.cos(a) * rd, z = zPie + Math.sin(a) * rd * .7;
      const yy = H(x, z);
      if (yy < AGUA_Y + .4) continue;              /* está en el agua: no va */
      const s = rr(1.2, 3.2);
      const g2 = new T.SphereGeometry(s, 7, 5);
      g2.scale(1, .55, 1);
      g2.translate(x, yy - s * .38, z);
      gs.push(g2);
    }
    if (gs.length){
      const m = new T.Mesh(fusiona(gs), matPiedraOsc);
      m.castShadow = m.receiveShadow = true;
      scene.add(m);
    }
  }
}
/* ---------------------------- EL CAMPAMENTO --------------------------------
   Lo que quedó de la expedición del padre de Mira: la carpa, los cajones, el
   fogón todavía tibio y una mesa de campaña. */
{
  const _e0 = scene.children.length;
  const p = POI.campamento, y = H(p.x, p.z);
  /* carpa procedural (la tapa el GLB si llega) */
  const matTela = new T.MeshLambertMaterial({ color: 0xc8a24a });
  for (const s2 of [-1, 1]){
    const lado = new T.Mesh(new T.PlaneGeometry(4.6, 3.4), matTela);
    lado.position.set(p.x + s2 * .9, y + 1.1, p.z);
    lado.rotation.set(0, Math.PI / 2, s2 * .5);
    lado.castShadow = true;
    scene.add(lado);
  }
  const cum = new T.Mesh(new T.CylinderGeometry(.06, .06, 5, 5), matMadera);
  cum.position.set(p.x, y + 2.3, p.z);
  cum.rotation.z = Math.PI / 2;
  scene.add(cum);
  /* mesa de campaña */
  const mesa = new T.Mesh(new T.BoxGeometry(2.2, .12, 1.2), matMadera);
  mesa.position.set(p.x + 5, y + .85, p.z + 3);
  mesa.castShadow = true;
  scene.add(mesa);
  for (const [ax, az] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const pt = new T.Mesh(new T.CylinderGeometry(.06, .06, .85, 5), matMadera);
    pt.position.set(p.x + 5 + ax, y + .42, p.z + 3 + az * .5);
    scene.add(pt);
  }
  /* el fogón */
  for (let i = 0; i < 9; i++){
    const a = i / 9 * 6.283;
    const pd = new T.Mesh(new T.SphereGeometry(rr(.22, .38), 6, 4), matPiedraOsc);
    pd.position.set(p.x + 4 + Math.cos(a) * 1.5, y + .1, p.z - 3 + Math.sin(a) * 1.5);
    pd.scale.y = .7;
    scene.add(pd);
  }
  fuego(p.x + 4, y + .35, p.z - 3, 2.2, true);
  ARB.push([p.x, p.z, 2.4]);
  propGLB({ url: 'prop/carpa-hielo.glb', x: p.x, z: p.z, esc: 3.2, giro: .7,
    ocultar: scene.children.slice(_e0, _e0 + 3) });
  propMuchos('hyper/p-crate.glb', [[p.x + 3.4, p.z + 6, 1], [p.x + 5.2, p.z + 7.4, 1.1],
    [p.x - 4.6, p.z + 4.2, .9], [p.x - 6.2, p.z - 2.6, 1], [p.x + 7, p.z - 1, .95],
    [p.x - 2.4, p.z + 8, 1.05]], { altoObjetivo: 1.1, sombra: true });
}
/* --------------------- LOS CUATRO SITIOS DE LAS LLAVES ---------------------
   Cada llave es una laja tallada sobre su pedestal, con un glifo que respira.
   El sitio cambia: el fondo de la quebrada (con los restos del que bajó antes),
   la cornisa detrás del salto, las ruinas de la meseta y el higuerón del este. */
const LLAVES = [];
{
  const matGlifo = new T.MeshBasicMaterial({ color: 0xd8ff8a, transparent: true, opacity: .85 });
  const halo = (() => new T.SpriteMaterial({ map: texMancha, color: 0xe8f0a0,
    transparent: true, opacity: .5, blending: T.AdditiveBlending, depthWrite: false }))();
  const arma = (k, i) => {
    const p = POI[k], y = H(p.x, p.z);
    const ped = new T.Mesh(new T.CylinderGeometry(.85, 1.15, 1.5, 8), matPiedra);
    ped.position.set(p.x, y + .75, p.z);

/* ------------- lo que se mueve en JUNGLA, cuadro a cuadro ------------------ */
function mundoTick(dt){
  /* la cascada CORRE: dos capas a distinta velocidad = agua, no cartel */
  if (CASCADA.texA){
    CASCADA.texA.offset.y -= dt * 1.15;
    CASCADA.texB.offset.y -= dt * 1.75;
    CASCADA.texB.offset.x += dt * .05;
  }
  if (CASCADA.espuma){
    const k = .42 + .16 * Math.sin(t0 * 1.9) + .06 * Math.sin(t0 * 5.3);
    CASCADA.espuma.material.opacity = k;
    CASCADA.espuma.scale.setScalar(.94 + .08 * Math.sin(t0 * 1.3));
  }
  /* la bruma sube y vuelve a nacer abajo */
  if (CASCADA.bruma){
    const P = CASCADA.bruma.geometry.attributes.position;
    for (let i = 0; i < P.count; i++){
      P.array[i*3+1] += dt * (1.4 + (i % 7) * .35);
      P.array[i*3] += Math.sin(t0 * .7 + i) * dt * .8;
      if (P.array[i*3+1] > AGUA_Y + 22){
        P.array[i*3] = POI.laguna.x + rr(-16, 16);
        P.array[i*3+1] = AGUA_Y - 1;
        P.array[i*3+2] = CASCADA.zPie + rr(-9, 9);
      }
    }
    P.needsUpdate = true;
  }
  /* el relleno acompaña al sol: de noche baja (si no, el bosque nocturno se
     ve gris parejo y se pierde la luz verde del templo) */
  relleno.intensity = .26 + .55 * cl(SOLD.y * 1.5, 0, 1);
  /* los rayos de luz respiran (y se apagan si el sol se acuesta) */
  if (RAYOS) RAYOS.material.opacity = cl((SOLD.y - .12) * 1.15, 0, 1) *
    (.26 + .09 * Math.sin(t0 * .5));
  /* las capas de vapor derivan despacio */
  for (let i = 0; i < VAPOR.length; i++){
    const v = VAPOR[i];
    v.position.x += Math.sin(t0 * .05 + i) * dt * 1.6;
    v.position.y = v.userData.y0 + Math.sin(t0 * .18 + i * 1.7) * 1.4;
  }
  /* llamas que titilan y su luz */
  for (const f of FUEGOS){
    const k = .85 + .3 * Math.sin(t0 * 7 + f.f) + .12 * Math.sin(t0 * 17 + f.f * 3);
    f.s.scale.set(f.e * .55 * (.92 + .08 * k), f.e * .95 * k, 1);
    if (f.L2) f.L2.intensity = 4 + 2.4 * k;
  }
  /* las llaves que todavía están en la selva giran y flotan */
  for (const L2 of LLAVES){
    if (L2.tomada) continue;
    L2.g.rotation.y += dt * .7;
    L2.g.position.y = L2.y0 + Math.sin(t0 * 1.5 + L2.i) * .28;
  }
  /* las bandadas dan vueltas altas */
  for (const b of AVES){
    const u = b.userData;
    u.a += dt * u.v;
    b.position.set(u.cx + Math.cos(u.a) * u.r, u.y + Math.sin(u.a * 2.3) * 6,
      u.cz + Math.sin(u.a) * u.r);
  }
  /* la puerta del templo: baja hasta hundirse y la boca vuelca luz */
  if (TEMPLO.abierta > 0 && TEMPLO.abierta < 1){
    TEMPLO.abierta = Math.min(1, TEMPLO.abierta + dt / 4);
    const k = TEMPLO.abierta;
    TEMPLO.puerta.position.y = TEMPLO.puerta.userData.y0 - k * 6.8;
    TEMPLO.haz.material.opacity = k * .5;
  }
}

function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* la ventana de la cabaña se enciende sola cuando oscurece, y VUELCA luz */
  if (ventanaMat){
    const osc = cl(1 - (SOLD.y * 420) / 160, 0, 1);
    ventanaMat.color.setRGB(.16 + .3 * osc, .3 + .68 * osc, .27 + .6 * osc);
    focoCasa.intensity = osc * osc * 60 * (TEMPLO ? TEMPLO.abierta : 0);
  }
}
/* el texto se PARTE EN PAGINAS por parrafo: antes entraba entero en un solo
   cuadro que ocupaba media pantalla en medio de la cara. Cada pagina se escribe
   letra por letra; SIGUIENTE completa si esta escribiendo, pasa de pagina si
   quedan, y recien cierra en la ultima. */
let _dlgTim = null, _dlgFull = '', _dlgPags = [], _dlgP = 0, _dlgCerrar = null;
function _dlgPinta(){
  const txt = _dlgPags[_dlgP] || '';
  if (_dlgTim) clearInterval(_dlgTim);
  _dlgFull = txt;
  let i = 0;
  $('dlgB').textContent = '';
  _dlgTim = setInterval(() => {
    i += 2;
    $('dlgB').textContent = _dlgFull.slice(0, i);
    if (i >= _dlgFull.length){ clearInterval(_dlgTim); _dlgTim = null; }
  }, 16);
  const hay = _dlgPags.length > 1;
  $('dlgPag').textContent = hay ? (_dlgP + 1) + '/' + _dlgPags.length : '';
  $('dlgGo').textContent = (_dlgP < _dlgPags.length - 1) ? Tx('dlgMas') : Tx('dlgGo');
}
function dialogo(titulo, cuerpo, alCerrar, cara, retrato){
  enDlg = true;
  $('dlgT').textContent = titulo;
  const img = $('dlgFoto'), cv = $('dlgCara');
  if (retrato){
    img.src = retrato; img.classList.add('on'); cv.classList.remove('on');
  } else if (cara){
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 192, 256);
    g.save(); g.translate(0, 24); cara(g, 192); g.restore();
    cv.classList.add('on'); img.classList.remove('on');
  } else { cv.classList.remove('on'); img.classList.remove('on'); }
  /* partir por parrafo; si un parrafo es larguisimo se corta por oracion */
  _dlgPags = [];
  for (const par of String(cuerpo).split(/\n\s*\n/)){
    const p = par.trim();
    if (!p) continue;
    if (p.length <= 185){ _dlgPags.push(p); continue; }
    let acc = '';
    for (const or of p.split(/(?<=[.!?»])\s+/)){
      if ((acc + ' ' + or).trim().length > 185 && acc){ _dlgPags.push(acc.trim()); acc = or; }
      else acc = (acc + ' ' + or).trim();
    }
    if (acc) _dlgPags.push(acc);
  }
  if (!_dlgPags.length) _dlgPags = [''];
  _dlgP = 0; _dlgCerrar = alCerrar || null;
  _dlgPinta();
  $('dlg').classList.add('on');
  document.body.classList.add('hablando');
  $('dlgGo').onclick = () => {
    if (_dlgTim){                                  /* escribiendo: completar */
      clearInterval(_dlgTim); _dlgTim = null;
      $('dlgB').textContent = _dlgFull;
      return;
    }
    if (_dlgP < _dlgPags.length - 1){ _dlgP++; _dlgPinta(); return; }
    $('dlg').classList.remove('on');
    document.body.classList.remove('hablando');
    enDlg = false;
    const f = _dlgCerrar; _dlgCerrar = null;
    if (f) f();
  };
}
