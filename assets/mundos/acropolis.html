<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1c1006"/>
<title>ACRÓPOLIS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#180b06;color:#f5efe9;
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(26,11,6,.62);border:1px solid rgba(255,195,150,.25);border-radius:12px;
    padding:7px 14px;text-align:center;backdrop-filter:blur(4px);max-width:86vw}
  #objT{font-weight:800;font-size:13px;letter-spacing:.04em;color:#ffe9d6}
  #objD{font-size:11.5px;color:#d8a887;margin-top:1px}
  #capCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);text-align:center;
    opacity:0;transition:opacity 1.1s;pointer-events:none;width:92vw}
  #capCard.on{opacity:1}
  #capN{font-size:13px;letter-spacing:.34em;color:#f2c9a4;font-weight:700}
  #capT{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.65)}
  /* la columna de botones se corre para dejarle el rincon del pulgar derecho
     al SALTO, que antes la tapaba entera */
  /* ---------------------------- HUD DE ARRIBA -----------------------------
     MENU y SONIDO se tocan una vez cada tanto, no en medio de la accion: van
     ARRIBA a la derecha y CUADRADOS. Antes estaban abajo, alargados y apretados
     contra el boton de salto, o sea justo donde apoya el pulgar con el que se
     juega. */
  #btns{position:absolute;right:max(10px,2.5vw);top:max(10px,2.5vh);display:flex;
    flex-direction:row;gap:8px;align-items:flex-start;pointer-events:auto}
  .b{width:46px;height:46px;min-width:0;padding:0;display:grid;place-items:center;
    text-align:center;border-radius:12px;font-weight:800;font-size:16px;
    background:rgba(32,13,8,.62);border:1.5px solid rgba(255,195,150,.4);
    color:#ffe9d6;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
  .b:active{transform:translateY(1px);filter:brightness(1.3)}
  /* USAR: REDONDO, abajo, al lado del salto. Dos motivos.
     Sitio: position FIXED y no absolute. #btns se subio arriba a la derecha y es
     absolute, asi que un hijo absolute dejaba de colgar de la pantalla y colgaba de
     EL: su "bottom" se medía desde la caja de arriba y el boton aparecia arriba.
     Forma: es el unico boton de accion que se toca en medio del juego, con el pulgar
     y sin mirar; una pastilla alargada al lado de un salto redondo se toca peor y se
     ve peor. Mismo diametro que el salto, a su izquierda. */
  .b.usar{position:fixed;right:calc(max(14px,3.5vw) + min(84px,19vw) + 12px);
    bottom:max(16px,5vh);width:min(72px,16vw);height:min(72px,16vw);
    aspect-ratio:1;border-radius:50%;padding:0;display:none;place-items:center;
    font-size:clamp(10px,2.6vw,13px);line-height:1.05;text-align:center;
    letter-spacing:.04em}
  .b.usar.on{display:grid}
  /* CORRER ya no es un boton: es un indicador chiquito al lado del contador */
  .b.corre{display:none}
  #corriendo{position:absolute;left:12px;top:calc(10px + 2.3em);pointer-events:none;
    display:none;font:800 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.14em;padding:5px 8px;border-radius:7px;
    background:rgba(32,13,8,.62);border:1px solid rgba(255,195,150,.4);color:#ffe9d6}
  #corriendo.on{display:block}
  /* AVISO de la obra: el cartelito corto que explica el andamio y la polea sin
     tutorial. Centrado y por encima del boton USAR, que es el que hay que
     apretar; asi el ojo va del texto al boton sin buscar. */
  #pista{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(max(16px,5vh) + 62px);pointer-events:none;opacity:0;
    transition:opacity .25s;max-width:min(72vw,460px);text-align:center;
    font:800 12.5px/1.45 ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em;
    padding:8px 14px;border-radius:11px;background:rgba(20,9,5,.66);
    border:1px solid rgba(255,195,150,.4);color:#ffe9d6;backdrop-filter:blur(4px)}
  #pista.on{opacity:1}
  /* ------------------------ JOYSTICK Y SALTO (TACTIL) ---------------------
     Antes el medio izquierdo de la pantalla era una zona invisible de arrastre:
     nadie sabia donde tocar. Ahora hay una PALANCA dibujada, con el estilo del
     mundo, y un boton de SALTO. La palanca del todo hacia ARRIBA = correr. */
  #joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(150px,32vw);aspect-ratio:1;pointer-events:auto;touch-action:none;
    opacity:.9;transition:opacity .25s}
  /* La palanca y el salto se esconden SOLO si el aparato no tiene tactil.
     Antes se escondian al detectar mouse/teclado (body.pc), y en un portatil
     tactil o en un celular que se declara «pointer:fine» el jugador se quedaba
     sin ningun control: el joystick recien aparecia DESPUES del primer toque,
     y ese primer toque no hacia nada. La ayuda de teclado sigue saliendo
     igual: tener las dos cosas a la vez no molesta. */
  body.sinTactil #joy,body.sinTactil #bSalta{display:none}
  /* con dialogo abierto no se camina: la palanca y el salto estorban */
  /* con dialogo abierto los controles SE VAN de la pantalla, no solo se
     transparentan: quedaban encima del globo y tapaban el texto. */
  body.hablando #joy,body.hablando #bSalta{opacity:0;pointer-events:none;
    transform:translateY(140%);transition:opacity .18s,transform .22s}
  /* y el globo se apoya abajo, que es el lugar que quedo libre */
  body.hablando #dlg{bottom:max(10px,2vh)}
  /* el boton USAR tambien se aparta: pegado abajo a la derecha, se le ponia
     encima del globo y tapaba el final de cada linea */
  body.hablando .b.usar{opacity:0;pointer-events:none}
  #joy canvas{width:100%;height:100%;display:block}
  #bSalta{position:absolute;right:max(14px,3.5vw);bottom:max(16px,5vh);
    width:min(84px,19vw);aspect-ratio:1;border-radius:50%;pointer-events:auto;
    touch-action:none;display:grid;place-items:center;font-weight:900;
    font-size:11px;letter-spacing:.1em;cursor:pointer;
    background:rgba(0,0,0,.42);border:2px solid #eae2cf;color:#fffaf0;
    box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
  #bSalta:active{transform:translateY(2px) scale(.96);filter:brightness(1.35)}
  #bSalta span{display:block;font-size:24px;line-height:1}

  /* ---------------------- BARRA DE ARRIBA: PAUSA Y SONIDO -------------------
     Estaban abajo a la derecha, alargados y peleando lugar con el salto. Van
     ARRIBA y CUADRADOS, que es donde no molestan al pulgar ni al dialogo. */
  #hudTop{position:absolute;right:max(10px,2.5vw);top:max(10px,2vh);display:flex;
    gap:8px;pointer-events:auto;z-index:6}
  #hudTop .bt{width:44px;height:44px;border-radius:12px;display:grid;
    place-items:center;font-size:19px;line-height:1;cursor:pointer;
    background:rgba(0,0,0,.46);border:1.5px solid rgba(255,195,150,.35);color:#f2c9a4;
    backdrop-filter:blur(4px)}
  #hudTop .bt:active{transform:translateY(1px);filter:brightness(1.35)}
  /* ayuda de controles de PC: sale sola al detectar mouse/teclado */
  /* EL SELLO EN LA PORTADA: dos veces la duda fue «esto esta actualizado o el
     navegador me dio una copia vieja», y la respuesta solo estaba en la linea de
     fps —chiquita, tapada por la barra de estado del telefono y visible unicamente
     DENTRO del juego—. Aca se ve antes de tocar nada. */
  #mSello{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font:800 10.5px/1 ui-monospace,monospace;letter-spacing:.12em;
    color:rgba(255,255,255,.42);pointer-events:none;z-index:3}
  #pcHelp{position:absolute;left:10px;top:30px;display:none;pointer-events:none;
    font:600 11px/1.5 ui-sans-serif,system-ui,sans-serif;color:#dfeecd;
    background:rgba(24,10,6,.5);border:1px solid rgba(190,230,180,.26);
    border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);max-width:44vw}
  body.pc #pcHelp{display:block}
  /* con la ayuda de PC en la esquina, el contador baja */
  body.pc #recol{top:calc(10px + 13em)}
  #pcHelp b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.16em;opacity:.6;margin-bottom:6px}
  #pcHelp .row{margin-top:4px;white-space:nowrap}
  #pcHelp kbd{display:inline-block;min-width:13px;text-align:center;padding:1px 5px;
    margin-right:1px;border-radius:5px;font:700 10px ui-monospace,monospace;
    background:rgba(190,230,180,.16);border:1px solid rgba(190,230,180,.3);color:#ffe9d6}
  /* ---------------------- DIALOGO: CHICO Y ABAJO -------------------------
     Antes el globo crecia con el texto y un capitulo de cinco parrafos ocupaba
     media pantalla en medio de la cara. Ahora el texto va PARTIDO EN PAGINAS y
     la caja tiene alto FIJO y chico, pegada abajo: no salta entre paginas y
     deja ver el paisaje, que es de lo que se trata. */
  #dlg{position:absolute;left:50%;bottom:max(12px,3vh);transform:translateX(-50%);
    width:min(720px,94vw);display:none;pointer-events:auto;align-items:flex-end;gap:0;z-index:5}
  #dlg.on{display:flex}
  #dlgFoto,#dlgCara{width:min(104px,17vw);aspect-ratio:3/4;flex:0 0 auto;
    border-radius:10px 10px 4px 4px;border:1.5px solid rgba(255,195,150,.35);background:rgba(24,10,6,.88);
    display:none;object-fit:cover;object-position:50% 10%;
    box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #dlgFoto.on,#dlgCara.on{display:block}
  #dlgGlobo{position:relative;flex:1 1 auto;min-width:0;margin-left:11px;
    background:rgba(24,10,6,.88);border:1.5px solid rgba(255,195,150,.35);border-radius:4px;
    padding:9px 13px 8px;backdrop-filter:blur(7px);
    box-shadow:0 8px 26px rgba(0,0,0,.5);display:flex;flex-direction:column}
  #dlgGlobo::before,#dlgGlobo::after{content:'';position:absolute;left:-10px;top:16px;
    width:0;height:0;border:10px solid transparent}
  #dlgGlobo::before{border-right-color:rgba(255,195,150,.35)}
  #dlgGlobo::after{left:-8px;border-right-color:rgba(24,10,6,.88)}
  #dlgT{font-weight:900;letter-spacing:.06em;color:#f2c9a4;font-size:11.5px;margin-bottom:4px}
  /* ALTO FIJO: cuatro renglones. Lo que sobre queda en blanco, que es mejor que
     una caja que cambia de tamano en cada SIGUIENTE. */
  #dlgB{font-size:13.5px;line-height:1.42;color:#f5efe9;white-space:pre-wrap;
    height:5.7em;overflow:hidden;flex:0 0 auto}
  #dlgPie{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  #dlgPag{font:800 10.5px ui-monospace,monospace;letter-spacing:.1em;color:#f2c9a4;opacity:.65}
  #dlgGo{padding:7px 16px;border-radius:7px;font-weight:800;font-size:11.5px;
    letter-spacing:.08em;background:linear-gradient(180deg,#c26327,#7c3a14);border:1px solid #ffd2a0;cursor:pointer;
    white-space:nowrap}
  @media (max-height:430px){
    #dlgB{height:4.3em;font-size:12.5px}
    #dlgFoto,#dlgCara{width:min(86px,15vw)}
  }
  #fps{position:absolute;left:10px;top:10px;font:10px ui-monospace,monospace;color:#e8b48c;
    background:rgba(24,10,6,.5);padding:3px 6px;border-radius:6px}
  /* viñeta cinematográfica: oscurece apenas las esquinas, gratis (es CSS) */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 78% 68% at 50% 46%,transparent 62%,rgba(0,0,10,.34) 100%)}

  /* ---------------- CINEMÁTICAS: barras, subtítulo, saltear --------------- */
  #cineTop,#cineBot{position:fixed;left:0;width:100%;height:0;background:#000;
    z-index:6;transition:height .5s ease}
  #cineTop{top:0}#cineBot{bottom:0}
  body.cine #cineTop,body.cine #cineBot{height:11vh}
  #cineTxt{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);z-index:7;
    font-size:15.5px;font-weight:700;letter-spacing:.06em;color:#fff;
    text-shadow:0 1px 12px #000,0 0 4px #000;opacity:0;transition:opacity .4s;
    text-align:center;width:92vw;pointer-events:none}
  body.cine #cineTxt{opacity:1}
  #cineSkip{position:fixed;right:14px;top:13vh;z-index:7;display:none;
    padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;
    letter-spacing:.12em;cursor:pointer}
  body.cine #cineSkip{display:block}

  /* diálogo con PERSONAJE: la carita pintada + el nombre */
  #dlgFila{display:flex;gap:12px;align-items:flex-start}
  #dlgCara{width:64px;height:64px;border-radius:12px;flex:0 0 64px;display:none;
    border:1.5px solid rgba(255,195,150,.4);background:#0006}
  #dlgCara.on{display:block}

  /* contador de RECOLECCION: va debajo del objetivo, con su propio icono */
  #recol{position:absolute;left:12px;top:calc(10px + 4.6em);pointer-events:none;
    display:none;font:800 12.5px/1 ui-sans-serif,system-ui,sans-serif;
    padding:6px 9px;border-radius:9px;letter-spacing:.05em;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,195,150,.35);color:#f2c9a4;
    backdrop-filter:blur(4px)}
  #recol.on{display:block}
  #recol.lleno{border-color:#f2c9a4;box-shadow:0 0 14px -2px #f2c9a4}
  /* la TAREA del capítulo (contador, sin idioma: iconos y números) */
  #tarea{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;display:none}
  #tarea.on{display:block}
  /* PISTA: que hace el boton USAR ahora mismo. Sin esto el boton se prendia y
     listo, y en PC ni siquiera hay boton a la vista: estabas encima de la cosa
     sin una sola pista de que se podia levantar ni con que tecla. */
  #pistaUso{font-size:12px;font-weight:900;letter-spacing:.08em;margin-top:3px;
    display:none;color:#ffe9a8;text-shadow:0 1px 3px rgba(0,0,0,.75)}
  #pistaUso.on{display:block}

  /* medidor de supervivencia (oxígeno / calor) */
  #medidor{position:absolute;left:12px;bottom:16px;width:150px;display:none;
    pointer-events:none}
  #medidor.on{display:block}
  #medIco{font-size:14px;margin-bottom:3px;text-shadow:0 1px 6px #000}
  #medBar{height:9px;border-radius:6px;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #medFill{height:100%;width:100%;border-radius:6px;transition:width .3s linear;
    background:linear-gradient(90deg,#7fd4ff,#cfefff)}
  #medFill.rojo{background:linear-gradient(90deg,#ff5a4a,#ffb09a)}

  /* fundido a negro para reaparecer */
  #fundido{position:fixed;inset:0;z-index:8;background:#000;opacity:0;
    pointer-events:none;transition:opacity .7s}

  /* ---------------- MENÚ ---------------- */
  /* el menú es un velo: DETRÁS se ve el valle en vivo (cámara cinemática) */
  #menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:
    linear-gradient(180deg,rgba(18,8,5,.16) 0%,rgba(18,8,5,.34) 55%,rgba(15,7,4,.72) 100%);
    text-align:center;padding:16px;overflow-y:auto}
  #menu h1{margin:0;font-size:54px;font-weight:900;letter-spacing:.22em;
    background:linear-gradient(180deg,#fff7e2,#d8963c);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #menu .sub{color:#c69a7c;font-size:13px;margin:6px 0 26px;letter-spacing:.08em}
  .mbtn{display:block;width:min(320px,84vw);margin:7px auto;padding:15px;font-size:16px;
    font-weight:800;letter-spacing:.06em;border-radius:14px;cursor:pointer;color:#ffe9d6;
    background:rgba(52,22,12,.8);border:1.5px solid rgba(255,195,150,.4)}
  .mbtn.go{background:linear-gradient(180deg,#c26327,#7c3a14);border-color:#ffd2a0}
  /* portadas distintas por mundo: cada juego alinea su menú diferente */
  #menu.m-izq{align-items:flex-start;text-align:left;padding-left:min(10vw,110px)}
  #menu.m-izq .mbtn,#menu.m-izq #fLang,#menu.m-izq #fGfx{margin-left:0;margin-right:auto}
  #menu.m-der{align-items:flex-end;text-align:right;padding-right:min(10vw,110px)}
  #menu.m-der .mbtn,#menu.m-der #fLang,#menu.m-der #fGfx{margin-right:0;margin-left:auto}
  #menu.m-abajo{justify-content:flex-end;padding-bottom:min(9vh,74px)}
  #menu.m-arriba{justify-content:flex-start;padding-top:min(7vh,56px)}
  #menu.m-grande h1{font-size:70px;letter-spacing:.3em}
  #menu.m-compacto h1{font-size:40px;letter-spacing:.5em;font-weight:800}
  #mCap{color:#e8a24e;font-size:12px;margin-top:14px;letter-spacing:.1em;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .fila{display:flex;gap:8px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
  .filaT{font-size:10.5px;letter-spacing:.22em;color:#c69a7c;margin-top:16px;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .chip{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:rgba(30,13,8,.72);border:1.5px solid rgba(255,195,150,.35);color:#e8c8ae}
  .chip.on{background:linear-gradient(180deg,#c26327,#7c3a14);border-color:#ffd2a0;color:#fff3e6}
  #cargando{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:#180b06;color:#c69a7c;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="cineTop"></div><div id="cineBot"></div>
<div id="cineTxt"></div><div id="cineSkip">SALTEAR ▸▸</div>
<div id="fundido"></div>

<div id="hud">
  <div id="hudTop"><div class="bt" id="bSon">🔊</div><div class="bt" id="bMenu">☰</div></div>
  <div id="obj"><div id="objT">…</div><div id="objD"></div><div id="tarea"></div><div id="pistaUso"></div></div>
  <div id="capCard"><div id="capN"></div><div id="capT"></div></div>
  <div id="fps"></div>
  <div id="btns">
    <div class="b usar" id="bUsar">◉ USAR</div>
    <div class="b" id="bMenu" aria-label="menu">II</div>
  </div>
  <div id="dlg"><img id="dlgFoto" alt=""><canvas id="dlgCara" width="192" height="256"></canvas><div id="dlgGlobo"><div id="dlgT"></div><div id="dlgB"></div><div id="dlgPie"><div id="dlgPag"></div><div id="dlgGo">SIGUIENTE &#9656;</div></div></div></div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
  <div id="bSalta"><span>⤒</span><b id="bSaltaT">SALTO</b></div>
  <div id="recol"></div>
  <div id="corriendo"></div>
  <div id="pista"></div>
  <div id="medidor"><div id="medIco"></div><div id="medBar"><div id="medFill"></div></div></div>
  <div id="pcHelp"></div>
</div>

<div id="menu">
  <div id="mSello"></div>
  <h1>ACRÓPOLIS</h1>
  <div class="sub">el santuario sobre el mar · levantar las cinco columnas</div>
  <div class="mbtn go" id="mJugar">EMPEZAR LA HISTORIA</div>
  <div class="mbtn" id="mSeguir" style="display:none">CONTINUAR</div>
  <div id="mCap"></div>
  <div class="filaT" id="tLang">IDIOMA</div>
  <div class="fila" id="fLang">
    <div class="chip" data-l="es">ESPAÑOL</div>
    <div class="chip" data-l="en">ENGLISH</div>
    <div class="chip" data-l="pt">PORTUGUÊS</div>
  </div>
  <div class="filaT" id="tGfx">GRÁFICOS</div>
  <div class="fila" id="fGfx">
    <div class="chip" data-g="b">BAJOS</div>
    <div class="chip" data-g="m">MEDIOS</div>
    <div class="chip" data-g="a">ALTOS</div>
  </div>
</div>
<div id="cargando">CARGANDO ACRÓPOLIS…</div>

<script>
/* ============================================================================
   DUNAS — modo historia en primera persona sobre el motor de SENDA. Un mar de
   dunas al atardecer dorado: 900 x 900 m de arena esculpida por CRESTAS
   TRANSVERSALES asimétricas (barlovento largo y manso, sotavento corto y
   filoso, como las dunas de verdad) que meandrean con un FBM lento, más las
   grandes olas de fondo, la HOYA del oasis y la DUNA MADRE de la cresta final.

   HISTORIA (6 capítulos, ES/EN/PT): sos SIRA, la zahorí de la caravana de

   sombrearse entre si al atardecer. */
sol.layers.enable(NOREFLEJO);
scene.add(sol); scene.add(sol.target);
const hemi = new T.HemisphereLight(0xbfe4f0, 0xa89a80, 1.05);
scene.add(hemi);
/* el DESTELLO del sol: un sprite aditivo donde apunta SOLD. Con niebla y ACES
   es lo que hace que mirar contra el sol "queme" como en un juego grande. */
const glare = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const d = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  d.addColorStop(0, 'rgba(255,248,225,1)');
  d.addColorStop(.12, 'rgba(255,238,190,.85)');
  d.addColorStop(.4, 'rgba(255,214,140,.22)');
  d.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = d; g.fillRect(0, 0, 128, 128);
  const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c),
    transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
  s.scale.set(300, 300, 1);

/* el FOGÓN del campamento vuelca luz cálida sobre la lona al caer el sol */

const AZUL_OCASO = new T.Color(0xb0a8ff);
/* LA LUNA y cuatro estrellas: discos suaves que solo viven de noche */
const LUNAS = [];
{

/* --------------------------- SPLAT DE CONTROL ------------------------------
   R = tierra del sendero · G = hojarasca bajo el bosque. Se pinta UNA vez en un
   canvas de 512: el sendero como trazo gordo entre los puntos de la historia,
   la hojarasca como manchas de ruido donde después van los árboles. */
const SPL = document.createElement('canvas'); SPL.width = SPL.height = 512;
const wx2u = x => (x + MITAD) / MAPA * 512;
const wz2u = z => (z + MITAD) / MAPA * 512;
{
  const g = SPL.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  /* grava oscura: manchas */
  g.fillStyle = '#003800';
  for (let i = 0; i < 900; i++){
    const x = rnd() * 512, y = rnd() * 512, r = 6 + rnd() * 22;
    if (vnoise(x * .02, y * .02) < .52) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.284); g.fill();
  }
  g.filter = 'blur(6px)';
  g.drawImage(SPL, 0, 0);
  g.filter = 'none';
  /* el sendero: R fuerte, con borde difuso */
  for (const [w, c] of [[16, 'rgba(140,0,0,.55)'], [8, 'rgba(255,0,0,.85)']]){
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(wx2u(SENDA_PTS[0][0]), wz2u(SENDA_PTS[0][1]));
    for (const P of SENDA_PTS) g.lineTo(wx2u(P[0]), wz2u(P[1]));
    g.stroke();
  }
  /* explanadas: el campamento, las ruinas y el fondo del oasis, pisados */
  for (const k of ['campamento', 'ruinas', 'oasis']){
    g.fillStyle = 'rgba(160,0,0,.5)';
    g.beginPath(); g.arc(wx2u(POI[k].x), wz2u(POI[k].z), 12, 0, 6.284); g.fill();
  }
}
const splTex = new T.CanvasTexture(SPL);
splTex.colorSpace = T.NoColorSpace;

/* ----------------------------- MATERIAL DEL TERRENO ------------------------
   Antes era un ShaderMaterial propio: sol+hemi calculados a mano, SIN sombras,
   sin tone mapping y con la niebla sincronizada por uniformes. Ahora es un
   Lambert con el SPLAT inyectado en map_fragment: el mismo mezclado de 4
   texturas, pero con TODO el pipeline de three gratis — RECIBE las sombras del
   sol, pasa por ACES, y la niebla y el colorspace son los del resto del mundo
   (antes el terreno y los árboles se iluminaban por recetas distintas y había
   que emparejarlos a ojo). La roca por pendiente se calcula en el VÉRTICE: la
   malla del terreno no rota, así que la normal del objeto ES la del mundo. */
const uniTerr = {
  tTierra: { value: TX.tierra }, tHoja: { value: TX.hojarasca },
  tRoca: { value: TX.roca }, tSplat: { value: splTex },
  repite: { value: MAPA / 5 }   /* parche de 5 m, no de 7 */
};
/* MeshSTANDARD, no Lambert: Lambert no tiene normalMap ni roughnessMap, y por
   eso los suelos se veian planos —peor que las texturas procedurales— aunque la
   foto de base fuera buena. Con Standard el relieve del normal agarra la luz del
   sol y el roughness decide donde brilla. El splat de cuatro capas no cambia: se
   inyecta en el mismo `map_fragment`, que existe igual en Standard. */
const matTerr = new T.MeshStandardMaterial({ map: TX.pasto,
  roughness: .92, metalness: 0 });
matTerr.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uniTerr);
  /* en BAJOS el suelo va a un solo tap: cuatro muestras a pantalla llena es
     relleno de pixeles, que es justo lo que mata a un telefono de gama baja. */
  if (GFX === 'b') sh.defines = Object.assign({}, sh.defines, { SUELO_BARATO: '' });
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vRocoso;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  vRocoso = smoothstep(.82, .6, normal.y);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D tTierra, tHoja, tRoca, tSplat;
      uniform float repite;
      varying float vRocoso;
      /* ------------------- SUELO SIN CUADRICULA -------------------------
         Con una sola muestra a escala fija el mismo parche de 7 m se repite
         128 veces ALINEADO, y a media distancia se ven las bandas. Se mezclan
         DOS muestras a escalas que no son multiplos (1 y 0,37), una girada 90
         grados, con una mascara de ruido suave: el patron de una no coincide
         con el de la otra en ningun punto y la cuadricula deja de existir.
         Es la misma idea del «stochastic tiling», sin texturas de mas. */
      float h21_(vec2 p){ return fract(sin(dot(p, vec2(41.31, 289.07))) * 43758.5453); }
      vec2 h22_(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)),
                                               dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
      float ruido_(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h21_(i), h21_(i + vec2(1.0, 0.0)), f.x),
                   mix(h21_(i + vec2(0.0, 1.0)), h21_(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      /* ---- teselado ESTOCASTICO: cada celda con su origen y su angulo ----
         Antes se cruzaban dos muestras alineadas a los ejes con una mascara de
         frecuencia 3 sobre 900 m: constante en pantalla, o sea una sola muestra
         alineada, o sea la rejilla. Aqui cada celda del parche se lee con un
         desplazamiento y un giro sacados de su propia posicion, y las cuatro
         vecinas se cruzan con pesos bilineales al cubo. Sin periodo no hay
         rejilla que encontrar. */
      vec3 sinGrilla_(sampler2D t, vec2 uv, vec2 uvw){
        vec2 cel = floor(uv), f = fract(uv);
        #if defined(SUELO_BARATO)
          /* un solo tap: la celda le da el giro y el origen. No borra el patron
             tan bien como cuatro, pero lo desalinea, que es lo que se ve. */
          vec2 h = h22_(cel);
          float a = h.x * 6.2831853;
          mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
          return texture2D(t, R * (uv - cel - 0.5) + h).rgb;
        #else
          vec3 acc = vec3(0.0);
          float ws = 0.0;
          for (int j = 0; j < 2; j++){
            for (int i = 0; i < 2; i++){
              vec2 c = cel + vec2(float(i), float(j));
              vec2 h = h22_(c);
              float a = h.x * 6.2831853;
              mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
              float w = (1.0 - abs(f.x - float(i))) * (1.0 - abs(f.y - float(j)));
              w = w * w * w;
              acc += texture2D(t, R * (uv - c) + h).rgb * w;
              ws += w;
            }
          }
          return acc / max(ws, 1e-4);
        #endif
      }`)
    .replace('#include <map_fragment>', `
      vec2 uvT = vMapUv * repite;
      vec3 spl = texture2D(tSplat, vMapUv).rgb;
      vec3 c = sinGrilla_(map, uvT, vMapUv);
      c = mix(c, sinGrilla_(tHoja, uvT * 1.3, vMapUv + 0.41), clamp(spl.g * 1.5, 0., 1.));
      c = mix(c, texture2D(tTierra, uvT * 1.6).rgb, clamp(spl.r * 1.35, 0., 1.));
      c = mix(c, sinGrilla_(tRoca, uvT * .9, vMapUv + 0.77), vRocoso);
      /* la luz del suelo varia de a manchones grandes: sin esto, incluso sin
         cuadricula, todo el terreno se lee con el mismo brillo y parece mosaico */
      /* dos frecuencias: manchones grandes de luz Y variacion cercana. A 5,7 sobre
         el mapa entero era UN solo manchon y no rompia nada de lo que se ve. */
      c *= 0.86 + 0.20 * ruido_(vMapUv * 6.3) + 0.14 * ruido_(vMapUv * 71.0);
      diffuseColor.rgb *= c;`);
};

/* las FOTOS del suelo generadas se enchufan acá cuando llegan (ver
   cargarTexFoto, que corre junto con el cielo) */
/* ---------------------- malla del terreno en 36 trozos --------------------- */
const CHN = 6, CVERT = 30;                    /* 6x6 trozos de 30x30 celdas */
const terrChunks = [];
{
  const paso = MAPA / (CHN * CVERT);
  for (let cj = 0; cj < CHN; cj++) for (let ci = 0; ci < CHN; ci++){
    const g = new T.PlaneGeometry(MAPA / CHN, MAPA / CHN, CVERT, CVERT);
    g.rotateX(-Math.PI / 2);
    const ox = -MITAD + (ci + .5) * MAPA / CHN;
    const oz = -MITAD + (cj + .5) * MAPA / CHN;
    const P = g.attributes.position, UV = g.attributes.uv;
    for (let i = 0; i < P.count; i++){
      const x = P.getX(i) + ox, z = P.getZ(i) + oz;
      P.setY(i, H(x, z));
      /* uv GLOBAL del valle, para que el splat y el tileado sigan entre trozos */
      UV.setXY(i, (x + MITAD) / MAPA, (z + MITAD) / MAPA);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    /* los vértices son LOCALES al trozo; la posición del mesh los lleva al mundo.
       (la primera versión además trasladaba la geometría: doble desplazamiento y
       los 36 trozos caían apilados en el centro) */
    const m = new T.Mesh(g, matTerr);
    m.position.set(ox, 0, oz);
    m.receiveShadow = true;
    m.castShadow = true;          /* las lomas se sombrean entre sí al atardecer */
    /* CAPA 1 = "esto NO va al espejo del agua". Los 36 trozos de terreno son casi
       todos los triangulos del mundo, y una segunda pasada de render que los
       vuelva a dibujar es lo que hacia impagable el reflejo. El agua devuelve el
       cielo, el brocal, la horca, las palmeras y las columnas —que es lo que se
       queria ver— pero no las dunas, que ademas quedan casi todas por debajo del
       plano del agua y las recorta el clip del propio Reflector.
       La camara principal y el sol SI ven la capa 1 (el sol, para que las lomas
       se sigan sombreando entre si). */
    m.layers.set(NOREFLEJO);
    scene.add(m);
    terrChunks.push(m);
  }
}

/* EL SUELO MAS BAJO DEL MUNDO. Se mide una vez, barriendo el mapa cada 12 m: unas
   5.000 llamadas a H, imperceptible al lado de las 150.000 que cuesta el terreno.
   Hace falta porque la falda del horizonte estaba clavada en -10 y en este mundo
   el suelo baja mas: los metros de abajo quedaban tapados por una chapa lisa. */
const SUELO_MIN = (() => {
  let m = 1e9;
  for (let x = -MITAD; x <= MITAD; x += 12)
    for (let z = -MITAD; z <= MITAD; z += 12){
      const h = H(x, z);
      if (h < m) m = h;
    }
  return m;
})();
/* falda del horizonte: tapa la parte BAJA de la foto del cielo (que es oscura)
   con suelo que a esa distancia ya es color de niebla puro */
{
  const f = new T.Mesh(new T.CircleGeometry(1150, 24),
    new T.MeshLambertMaterial({ color: 0xc2e1e9 }));   /* color de NIEBLA, no de arena */
  f.rotation.x = -Math.PI / 2;
  /* DEBAJO del suelo mas bajo, no en -10 a mano: con -10 la falda enterraba
     15 m de la garganta del cañon y 27 m de acropolis, y se veia como una
     mancha lisa con el canto recto. A 1.150 m, veinte metros de diferencia
     son un grado de horizonte: no se nota, y el fondo del mundo aparece. */
  f.position.y = Math.min(-10, SUELO_MIN - 8);
  f.frustumCulled = false;
  scene.add(f);
  /* PARED DE LOMAS LEJANAS: una falda plana converge exactamente a la altura del
     ojo, así que desde cualquier punto alto (la colina del roble, la cámara del
     menú) se veía la franja oscura de la foto del cielo entre la falda y el
     horizonte. Este anillo sube hasta +70 a 1.100 m: a esa distancia la niebla lo
     pinta liso y se lee como una serranía en la bruma que CIERRA el horizonte. */
  const pared = new T.Mesh(new T.CylinderGeometry(1100, 660, 78, 24, 1, true),
    new T.MeshLambertMaterial({ color: 0xbfe0e8, side: T.BackSide }));
  /* la pared baja LO MISMO que la falda: si no, queda una ranura entre las dos
     por donde se ve la franja negra de la foto del cielo. */
  pared.position.y = 31 + Math.min(0, SUELO_MIN - 8 + 10);
  pared.frustumCulled = false;
  scene.add(pared);
}
/* --------------------------- REMOLINOS DE ARENA ----------------------------
   Cuatro torbellinos que vagan por la llanura en círculos lentos: conos
   translúcidos con vetas verticales pintadas, girando rápido sobre sí mismos.
   Un mar de dunas sin remolinos está muerto. */
const dustTex = lienzo(128, (g, n) => {
  g.clearRect(0, 0, n, n);
  for (let i = 0; i < 90; i++){
    g.strokeStyle = 'rgba(214,150,100,' + (.05 + rnd() * .12).toFixed(3) + ')';
    g.lineWidth = 1 + rnd() * 3;
    const x = rnd() * n;
    g.beginPath(); g.moveTo(x, 0);
    g.bezierCurveTo(x + 8, n * .3, x - 8, n * .6, x + rnd() * 10 - 5, n);
    g.stroke();
  }
});
const TOLVAS = [];
{
  const geoT = new T.CylinderGeometry(3.2, .6, 30, 10, 1, true);
  geoT.translate(0, 15, 0);
  for (let i = 0; i < 4; i++){
    const m = new T.Mesh(geoT, new T.MeshLambertMaterial({ map: dustTex,
      transparent: true, opacity: .16, side: T.DoubleSide, depthWrite: false }));
    m.userData = { cx: [250, -300, 40, -180][i], cz: [160, 60, -110, 300][i],
      R: 65 + i * 22, w: .05 + i * .011, f: i * 2.1 };
    scene.add(m);
    TOLVAS.push(m);
  }
}
function pasoTolvas(t){
  for (const m of TOLVAS){
    const u = m.userData;
    const x = u.cx + Math.cos(t * u.w + u.f) * u.R;
    const z = u.cz + Math.sin(t * u.w + u.f) * u.R;
    m.position.set(x, H(x, z) - .5, z);
    m.rotation.y = t * 5 + u.f;
    m.material.opacity = .1 + .07 * Math.abs(Math.sin(t * .3 + u.f));
  }
}

/* --------------------- LA SIEMBRA DEL MAR DE DUNAS -------------------------
   Acá no hay bosque: hay MATAS secas en las hondonadas (al pie de la duna la
   arena todavía guarda algo de humedad), PIEDRAS de arenisca comidas por el
   viento, y los BLOQUES de una ciudad enterrada que asoman en vetas por todo
   el mapa — la arena no tapó nada, solo lo escondió. La densidad es alta a
   propósito: la arena pelada no da escala, las matas sí. */
function fusiona(geos){
  let nv = 0; for (const g of geos) nv += g.attributes.position.count;
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), U = new Float32Array(nv * 2);
  const I = [];
  let off = 0;
  for (const g of geos){
    P.set(g.attributes.position.array, off * 3);
    N.set(g.attributes.normal.array, off * 3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, off * 2);
    const idx = g.index.array;
    for (let k = 0; k < idx.length; k++) I.push(idx[k] + off);
    off += g.attributes.position.count;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(P, 3));
  g.setAttribute('normal', new T.BufferAttribute(N, 3));
  g.setAttribute('uv', new T.BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
const ARB = [];                                /* [x,z,r] choque */
function molesta(x, z, margen){
  for (const k in POI){ const p = POI[k];
    if (Math.hypot(x - p.x, z - p.z) < (p.pr || 26) * .72) return true; }
  const m2 = margen * margen;
  for (const P of SENDA_PTS){
    const dx = x - P[0], dz = z - P[1];
    if (dx * dx + dz * dz < m2) return true;
  }
  return false;
}
const M4 = new T.Matrix4(), V3 = new T.Vector3(), Q4 = new T.Quaternion(), E3 = new T.Euler();
function geoRoca(sem, punta){
  const g = new T.SphereGeometry(1, 7, 5);
  const P = g.attributes.position, UV = g.attributes.uv;
  for (let i = 0; i < P.count; i++){
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const k = .6 + .62 * vnoise(x * 2.1 + sem, z * 2.1 + y * 1.3 + sem * 2);
    P.setXYZ(i, x * k, y * k * punta, z * k);
    UV.setXY(i, UV.getX(i) * 2, UV.getY(i) * 1.4);
  }
  g.computeVertexNormals();
  return g;
}
/* MATA de esparto: ocho briznas tiesas abiertas en abanico, fundidas en una
   sola geometría para poder instanciarla mil veces sin pagar mil dibujados */
function geoMata(sem, alto){
  const gs = [];
  for (let i = 0; i < 8; i++){
    const a = i / 8 * 6.283 + sem;
    const h = alto * (.6 + .7 * vnoise(i * 3.1 + sem, sem * 2.3));
    /* sin tapas (openEnded): son 48 triángulos por mata en vez de 120, y hay
       mil seiscientas matas — es la diferencia entre 200k y 80k triángulos */
    const g = new T.CylinderGeometry(.02, .085, h, 3, 1, true);
    g.translate(0, h / 2, 0);
    g.rotateZ(Math.cos(a) * .55); g.rotateX(Math.sin(a) * .55);
    g.translate(Math.cos(a) * .09, 0, Math.sin(a) * .09);
    gs.push(g);
  }
  return fusiona(gs);
}
function plantar(){
  const vMata = [geoMata(3, 1.15), geoMata(19, 1.7)];
  const vRoca = [geoRoca(3, .55), geoRoca(17, .72), geoRoca(41, .62)];
  const posM = [[], []], posR = [[], [], []], posB = [];
  const PASO_A = 14;
  const CTA = { tot: 0, dens: 0, camino: 0, mata: 0, roca: 0, bloque: 0, ok: 0 };
  window.__PLANTA = CTA;
  for (let gz = -MITAD + 12; gz < MITAD - 12; gz += PASO_A)
  for (let gx = -MITAD + 12; gx < MITAD - 12; gx += PASO_A){
    CTA.tot++;
    const x = gx + rr(-5, 5), z = gz + rr(-5, 5);
    if (molesta(x, z, 9)){ CTA.camino++; continue; }
    const y = H(x, z);
    const cr = crestaDuna(x, z);
    const dr = Math.hypot(x - POI.ruinas.x, z - POI.ruinas.z);
    const dOa = Math.hypot(x - POI.oasis.x, z - POI.oasis.z);
    /* MATAS: en las hondonadas y cerca del oasis, nunca en la cresta pelada */
    const dM = vnoise(x * .014 + 60, z * .014 + 22) * .78 + (1 - cr) * .5 +
      .5 * Math.exp(-(dOa * dOa) / (90 * 90));
    if (dM > .74){
      CTA.ok++; CTA.mata++;
      posM[(rnd() * 2) | 0].push([x, y - .06, z, rr(.7, 2.1)]);
      continue;
    }
    /* PIEDRAS de arenisca: donde la duna se pela y alrededor de las ruinas */
    let dR = vnoise(x * .0075 + 11, z * .0075 + 91);
    dR += .2 * Math.exp(-((dr - 110) * (dr - 110)) / (95 * 95));
    if (dR > .60){
      CTA.ok++; CTA.roca++;
      const sc = rr(.5, 2.5);
      posR[(rnd() * 3) | 0].push([x, y - sc * .3, z, sc]);
      if (sc > 1.3) ARB.push([x, z, sc * .75]);
      continue;
    }
    /* BLOQUES labrados de la ciudad enterrada: en vetas, más cerca de las ruinas */
    let dB = vnoise(x * .021 + 5, z * .021 + 7);
    dB += .32 * Math.exp(-(dr * dr) / (160 * 160));
    if (dB > .755){
      CTA.ok++; CTA.bloque++;
      posB.push([x, y, z, rr(1.1, 3.6)]);
      continue;
    }
    CTA.dens++;
  }
  const matMata = new T.MeshLambertMaterial({ color: 0xc4a869 });
  for (let v = 0; v < 2; v++){
    const arr = posM[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(vMata[v], matMata, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(rr(-.1, .1), rr(0, 6.28), rr(-.1, .1)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.8, 1.3), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    scene.add(im);                 /* sin sombra: son mil y no se notaría */
  }
  const matRoca = new T.MeshLambertMaterial({ map: TX.roca });
  for (let v = 0; v < 3; v++){
    const arr = posR[v];
    if (!arr.length) continue;
    const im = new T.InstancedMesh(vRoca[v], matRoca, arr.length);
    for (let i = 0; i < arr.length; i++){
      const [x, y, z, sc] = arr[i];
      Q4.setFromEuler(E3.set(rr(-.1, .1), rr(0, 6.28), rr(-.1, .1)));
      M4.compose(V3.set(x, y, z), Q4, new T.Vector3(sc, sc * rr(.7, 1.05), sc));
      im.setMatrixAt(i, M4);
    }
    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;
    scene.add(im);
  }
  /* los bloques: dados de arenisca hundidos 40% en la arena y girados a mano
     (la arena los tumbó hace mil años; ninguno quedó a plomo) */
  if (posB.length){
    const im = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), matRoca, posB.length);
    for (let i = 0; i < posB.length; i++){
      const [x, y, z, sc] = posB[i];
      const alt = sc * rr(.4, .8);
      Q4.setFromEuler(E3.set(rr(-.22, .22), rr(0, 6.28), rr(-.22, .22)));
      M4.compose(V3.set(x, y + alt * .12, z), Q4, new T.Vector3(sc, alt, sc * rr(.7, 1.2)));
      im.setMatrixAt(i, M4);
      if (sc > 2) ARB.push([x, z, sc * .5]);

    im.frustumCulled = false;
    im.castShadow = im.receiveShadow = true;

  }
  /* GUIJARROS: sin colisión ni sombra, puro detalle de la arena */
  const chico = new T.InstancedMesh(geoRoca(5, .5), matRoca, 420);
  for (let i = 0; i < 420; i++){
    const x = rr(-MITAD + 8, MITAD - 8), z = rr(-MITAD + 8, MITAD - 8);
    const sc = rr(.08, .32);
    Q4.setFromEuler(E3.set(0, rr(0, 6.28), 0));
    M4.compose(V3.set(x, H(x, z) - sc * .2, z), Q4, new T.Vector3(sc, sc, sc));
    chico.setMatrixAt(i, M4);
  }
  chico.frustumCulled = false;
  scene.add(chico);
  /* LO QUE SE FUE CAYENDO del carro: cántaros rotos y tablas medio enterradas
     a los costados de la huella. Cuentan la historia sin hablar. */
  const matMad = new T.MeshLambertMaterial({ map: TX.oscuro });
  const matAre2 = new T.MeshLambertMaterial({ map: TX.roca });
  for (let i = 0; i < 22; i++){
    const P = SENDA_PTS[(3 + i * 5) % SENDA_PTS.length];
    const x = P[0] + rr(5, 13) * (i % 2 ? 1 : -1);
    const z = P[1] + rr(5, 13) * (i % 3 ? -1 : 1);
    const y = H(x, z);
    if (i % 3 === 0){
      const j = new T.Mesh(new T.CylinderGeometry(.34, .22, .62, 9, 1, true), matAre2);
      j.position.set(x, y + .2, z);
      j.rotation.set(1.3 + rr(-.3, .3), rr(0, 6.28), rr(-.3, .3));
      j.castShadow = true; scene.add(j);
    } else {
      const m = new T.Mesh(new T.BoxGeometry(rr(1.1, 2.3), .1, rr(.2, .34)), matMad);
      m.position.set(x, y + .06, z);
      m.rotation.set(rr(-.2, .2), rr(0, 6.28), rr(-.2, .2));
      m.castShadow = true; scene.add(m);
    }
  }
}

/* ------------- MODELOS DEL REPO, CLONADOS EN MASA ---------------------------
   Nada de esto se genera: son GLB que ya viven en el repo (palmeras, tótems,
   cajones, vigas). Se carga UNO y se CLONA en cada punto; el clon se apoya solo
   en la arena. Ojo con los materiales del glTF: si traen emissive o specular
   el modelo sale BLANCO plano, hay que apagarlos a mano. */
function sembrarGLB(url, puntos, o){
  if (!GLTF || !puntos || !puntos.length) return;
  o = o || {};
  new GLTF().load(url, g => {
    const base = g.scene;
    base.traverse(n => { if (n.isMesh && n.material){
      const mm = n.material;
      if (mm.emissive) mm.emissive.setRGB(0, 0, 0);
      mm.specularIntensity = 0;
      mm.metalness = 0;
      mm.envMapIntensity = .45;
      n.castShadow = !!o.sombra;
      n.receiveShadow = false;
      n.frustumCulled = false;
    } });
    base.updateWorldMatrix(true, true);
    const caja = new T.Box3().setFromObject(base);
    const alto = caja.max.y - caja.min.y;
    window.__CAJAS = window.__CAJAS || {};
    window.__CAJAS[url.split('/').pop()] = +alto.toFixed(2);
    for (const p of puntos){
      const m = base.clone(true);
      const e = (p[2] || 1) * (o.esc || 1);
      m.scale.setScalar(e);
      m.rotation.y = p[3] != null ? p[3] : rr(0, 6.28);
      m.position.set(p[0], H(p[0], p[1]) + (o.y || 0) - caja.min.y * e, p[1]);
      scene.add(m);
      window.__SEMBRADOS = (window.__SEMBRADOS || 0) + 1;
    }
  }, undefined, () => {});
}
/* BANDERAS de tela: planos colgados de un mástil que ONDEAN de verdad (los
   vértices se mueven por seno, más cuanto más lejos del mástil). En un mundo
   donde no se mueve nada más que la arena, una tela viva cambia todo. */
const BANDERAS = [];
function bandera(x, y, z, w, h, giro){
  const g = new T.PlaneGeometry(w, h, 8, 3);
  g.translate(w / 2, 0, 0);
  const m = new T.Mesh(g, new T.MeshLambertMaterial({ map: TX.tela,
    side: T.DoubleSide }));
  m.position.set(x, y, z);
  m.rotation.y = giro || 0;
  m.castShadow = true;
  scene.add(m);
  m.userData.p0 = Float32Array.from(g.attributes.position.array);
  m.userData.f = rr(0, 6.28);
  m.userData.w = w;
  BANDERAS.push(m);
  return m;
}
function pasoBanderas(t){
  for (const m of BANDERAS){
    const P = m.geometry.attributes.position, p0 = m.userData.p0, f = m.userData.f;
    for (let i = 0; i < P.count; i++){
      const x = p0[i*3], y = p0[i*3+1];
      P.array[i*3+2] = Math.sin(t * 3.1 + x * 2.2 + f) * .2 * x;
      P.array[i*3+1] = y + Math.sin(t * 2.4 + x * 1.6 + f) * .06 * x;
    }
    P.needsUpdate = true;
  }
}

/* ===================== LA OBRA: ANDAMIOS Y POLEA DE CANASTO ==================
   POR QUE ESTA ESTO. Hasta aca el mundo se caminaba en dos dimensiones: el
   terreno y nada mas. Un mundo que trata de LEVANTAR CINCO COLUMNAS y no tiene
   una sola tabla por la que trepar es raro, y ademas los quince mundos se movian
   todos igual. Acá la obra da el eje que faltaba: SE SUBE.

   TRES PIEZAS, y las tres se usan con los controles que ya hay:
     1. EL ANDAMIO. Ocho tablones en espiral alrededor de la torre, 1,3 m de
        subida y ~2,3 m de salto entre uno y el siguiente. Los numeros no son al
        azar: con SALTO_V 8,2 y GRAV 22 el salto sube 1,53 m y a paso normal
        cruza ~2,7 m antes de volver a bajar de 1,3 m, asi que cada tabla se
        alcanza con margen pero ninguna se alcanza caminando. Se usa con SALTO
        (espacio en PC, el boton ⤒ en tactil): nada nuevo que aprender.
     2. EL ARQUITRABE. La plataforma de marmol a 10,4 m: el nivel al que hay que
        subir los tambores. Desde ahi arranca una PASARELA de tablones que cruza
        POR ENCIMA de la columnata (pasa entre dos columnas en pie y por arriba de
        los capiteles) con un hueco de 2,1 m en el medio que hay que saltar, y
        muere en un descansillo asomado al santuario. Ese es el premio: ves la
        obra desde donde la ve el que la construye.
     3. LA POLEA DE CANASTO. Dos canastos colgados de la misma cuerda sobre dos
        motones: uno abajo, otro arriba, contrapesados como la de verdad. USAR
        (E en PC, el boton ◉ USAR en tactil) sube el que tengas al lado y baja el
        otro, asi que el MISMO gesto sirve para subir y para bajar. Es el atajo
        para el que no quiere trepar, y la unica forma comoda de bajar.

   LO QUE NO HACE, a proposito:
     · no toca la historia ni la mision. Los capitulos siguen disparandose por
       cercania a su POI (10 m, o 7 m con USAR) y las cinco columnas siguen
       necesitando USAR a menos de 5 m EN EL SUELO. El descansillo de la pasarela
       queda a 17 m del centro del santuario: mirás, no disparás. No se saltea
       ningun capitulo desde arriba.
     · no estorba a ningun objetivo. La obra esta al noroeste del santuario, del
       lado OPUESTO al que se llega desde el campamento, asi que no se le pone
       delante al marcador 3D del objetivo; y a 26 m del centro, fuera del radio
       de todos los disparadores. Las cinco columnas tendidas estan en el arco
       este: la pasarela no pasa por encima de ninguna.
     · no sirve para salirse del mapa: sube 10,4 m en un sitio, el tope de
       coordenadas del jugador sigue siendo el de siempre y no hay nada al lado a
       lo que se pueda pasar desde arriba.
   El costo de dibujado es geometria opaca chica (unas cuarenta cajas y cilindros
   de pocos lados, un material compartido por familia), no relleno de pixeles:
   no hace falta degradarla en BAJOS. */
/* TABLAS: las superficies por las que se puede caminar que NO son el terreno.
   Cajas alineadas a los ejes con el ALTO ABSOLUTO de su cara de arriba; el
   jugador las consulta en soporte(). Son una docena: la busqueda es lineal y a
   ojo del perfilador no existe. */
const TABLAS = [];
const OBRA = { x: 133, z: 84, alto: 10.4, y0: 0 };
{
  const p = OBRA, y0 = H(p.x, p.z);
  p.y0 = y0;
  /* TRES MATERIALES Y TRES DIBUJADAS. El mundo entero va en unas sesenta llamadas
     de dibujado; un andamio hecho de sesenta cajas sueltas las DUPLICABA, y eso
     en un celular se paga en el bucle, no en el relleno. Asi que toda la madera
     estatica de la obra son tres InstancedMesh de una caja: barras, tablones y
     marmol. Lo unico con malla propia son los dos canastos, que se mueven. */
  const FAM = { mad: [], tab: [], mar: [] };
  const _e = new T.Euler(0, 0, 0, 'YXZ'), _q = new T.Quaternion(),
        _v = new T.Vector3(), _s = new T.Vector3();
  /* pon(): una caja de la obra. Las barras se hacen LARGAS EN Z (sz), asi que
     para inclinarlas hay que girar sobre X —sobre Z una barra larga en Z solo
     gira sobre su propio eje y no se ve nada—, y el orden YXZ deja que la
     inclinacion vaya primero, en el marco de la barra, y el giro ry despues. */
  const pon = (fam, x, y, z, sx, sy, sz, ry, rx) => {
    _e.set(rx || 0, ry || 0, 0);
    FAM[fam].push(new T.Matrix4().compose(_v.set(x, y, z),
      _q.setFromEuler(_e), _s.set(sx, sy, sz)));
  };
  /* tabla(): registra una superficie PISABLE y le pone su caja encima. `y` es la
     cara de arriba, la que se pisa; el registro lo consulta soporte(). */
  const tabla = (fam, x, z, sx, sz, y, gr) => {
    const g = gr || .18;
    pon(fam, x, y - g / 2, z, sx * 2, g, sz * 2, 0, 0);
    const t = { x, z, sx, sz, y };
    TABLAS.push(t);
    return t;
  };
  /* ---- 1) LA TORRE DE ANDAMIO -----------------------------------------------
     Cuatro postes, anillos de travesaños, riostras en cruz y OCHO TABLONES en
     espiral de radio 3, arrancando del lado del santuario y dando tres cuartos
     de vuelta. Los numeros salen de la fisica que ya estaba: con SALTO_V 8,2 y
     GRAV 22 el salto llega a 1,53 m, asi que un escalon de 1,3 m se alcanza con
     23 cm de margen y NO se alcanza caminando (el escalon gratis son 45 cm).
     El salto cruza ~2,7 m a paso normal antes de bajar de 1,3 m, y entre tablon
     y tablon hay 2,3 m: entra caminando, sin obligar a correr.
     Los postes van AFUERA de la espiral (radio 5,4) para que su choque de ARB no
     le coma el borde a ningun tablon. */
  const R = 3.0, PASO = 1.3, LADO = 3.82;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]){
    pon('mad', p.x + sx * LADO, y0 + (OBRA.alto + 1.2) / 2, p.z + sz * LADO,
        .3, OBRA.alto + 1.2, .3);
    ARB.push([p.x + sx * LADO, p.z + sz * LADO, .25]);
  }
  for (let c = 0; c < 4; c++){
    const ax = Math.cos(c * Math.PI / 2), az = Math.sin(c * Math.PI / 2);
    const cx = p.x + ax * LADO, cz = p.z + az * LADO, ry = c * Math.PI / 2;
    for (let k = 0; k < 4; k++)      /* anillos: el andamio necesita horizontales */
      pon('mad', cx, y0 + 2.6 + k * 2.6, cz, .11, .11, LADO * 2 + .3, ry, 0);
    /* una riostra por vano y por cara, en zigzag. La inclinacion NO es a gusto:
       el vano mide 7,64 de ancho por 2,6 de alto, asi que la diagonal va a
       atan(2,6/7,64) = 0,33 rad y mide 8,07. Con cualquier otro numero la barra
       se sale de la cara y se ve que es un adorno pegado. */
    for (let k = 0; k < 4; k++)
      pon('mad', cx, y0 + 1.3 + k * 2.6, cz, .1, .1, 8.07, ry,
          (k % 2 ? -1 : 1) * 0.33);
  }
  for (let i = 0; i < 8; i++){
    const a = -3 * Math.PI / 4 + i * Math.PI / 4;
    const x = p.x + Math.sin(a) * R, z = p.z + Math.cos(a) * R;
    const y = y0 + PASO * (i + 1);
    tabla('tab', x, z, .9, .9, y, .16);
    pon('mad', x, y0 + (y - y0) / 2, z, .15, y - y0, .15);   /* la pata del tablon */
  }
  /* ---- 2) EL ARQUITRABE y la PASARELA sobre la columnata --------------------
     La plataforma de marmol a 10,4 m es el nivel al que hay que subir los
     tambores. De ahi sale una pasarela de tablones que cruza POR ENCIMA de la
     columnata —pasa por el pasillo entre las columnas de x=130 y x=137 y por
     arriba de los capiteles, que llegan a 47,7— con un HUECO de 2,1 m en el
     medio, y muere en un descansillo asomado al santuario a 17 m de su centro:
     lo justo para mirar y no lo suficiente para disparar un capitulo. */
  const YA = y0 + OBRA.alto;
  tabla('mar', p.x, p.z - 6, 3.2, 3.2, YA, .34);
  /* las cuatro patas de piedra de la plataforma NO van a ARB. El choque de ARB es
     un cilindro infinito en altura: metiendolas le abriria cuatro agujeros de
     ochenta centimetros en el medio de la plataforma, y andar chocando contra
     postes invisibles a diez metros del suelo es peor que poder atravesar una
     pata al ras del suelo. Lo mismo vale para los pies de la pasarela. */
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    pon('mar', p.x + sx * 2.8, y0 + OBRA.alto / 2, p.z - 6 + sz * 2.8, .5, OBRA.alto, .5);
  tabla('tab', p.x, p.z - 12.5, 1.0, 3.4, YA, .16);
  tabla('tab', p.x, p.z - 19.6, 1.0, 1.6, YA, .16);
  tabla('mar', p.x, p.z - 23.4, 2.2, 2.2, YA, .3);
  /* pies de la pasarela: fuera de ARB por lo de arriba, y ademas porque le
     estrangularian el ancho pisable a un puente de dos metros de ancho. */
  for (const dz of [-12.5, -19.6]) for (const sx of [-1, 1])
    pon('mad', p.x + sx * 1.35, y0 + OBRA.alto / 2, p.z + dz, .24, OBRA.alto, .24);
  /* una sola cuerda de baranda a un costado: no choca, pero desde abajo le dice
     al ojo por donde va el camino de arriba */
  pon('mad', p.x - 1.05, YA + .95, p.z - 16.4, .07, .07, 15.2, 0, 0);
  /* ---- 3) LA POLEA DE CANASTO ----------------------------------------------
     DOS canastos de la MISMA cuerda sobre dos motones, contrapesados como la de
     verdad: cuando uno sube el otro baja. Por eso USAR sirve para subir y para
     bajar sin un segundo boton — siempre subis el canasto que estas pisando.
     El eje va pegado al borde este del arquitrabe, asi que arriba se sale del
     canasto a la plataforma sin hueco. */
  const PX = p.x + 4.2, ZA = p.z - 7.4, ZB = p.z - 4.6;
  for (const z of [p.z - 9.4, p.z - 2.6]){
    pon('mad', PX, y0 + (OBRA.alto + 2.2) / 2, z, .34, OBRA.alto + 2.2, .34);
    ARB.push([PX, z, .27]);
  }
  pon('mad', PX, y0 + OBRA.alto + 2.0, p.z - 6, .24, .24, 7.2, 0, 0);
  const matMad = new T.MeshLambertMaterial({ color: 0x6d5334 });
  const matTab = new T.MeshLambertMaterial({ map: TX.hojarasca });
  const matMar = new T.MeshLambertMaterial({ color: 0xe8e0cc });
  const matSog = new T.MeshLambertMaterial({ color: 0xbfa477 });
  const gMoton = new T.TorusGeometry(.3, .085, 5, 10);
  const CAN = [];
  for (let i = 0; i < 2; i++){
    const z = i === 0 ? ZA : ZB;
    const mo = new T.Mesh(gMoton, matMad);
    mo.position.set(PX, y0 + OBRA.alto + 1.78, z);
    mo.rotation.y = Math.PI / 2;
    scene.add(mo);
    const g = new T.Group();
    const aro = new T.Mesh(new T.CylinderGeometry(1.02, .86, .95, 12, 1, true), matTab);
    aro.position.y = .6; aro.castShadow = true; g.add(aro);
    const piso = new T.Mesh(new T.CylinderGeometry(.88, .88, .14, 12), matMad);
    piso.position.y = .07; piso.receiveShadow = true; g.add(piso);
    const sog = new T.Mesh(new T.CylinderGeometry(.035, .035, 1, 4), matSog);
    g.add(sog);                                  /* se estira sola en el tick */
    scene.add(g);
    /* el piso pisable del canasto es una TABLA que se mueve: el jugador la
       consulta igual que cualquier otra, no hay un caso especial en la fisica.
       sx llega hasta el borde del arquitrabe para que no quede hueco arriba. */
    const t = { x: PX, z, sx: 1.1, sz: .88, y: y0 + .14, canasto: true };
    TABLAS.push(t);
    CAN.push({ g, sog, mo, tab: t });
  }
  /* k = 0: el canasto A abajo y el B arriba. k = 1: al revés. Arranca en 1 para
     que el primero que te encontras al llegar por el suelo sea el B, el de abajo. */
  const POL = { k: 1, obj: 1, montado: null, x: PX, za: ZA, zb: ZB };
  const ponPolea = () => {
    const yA = y0 + .14 + POL.k * OBRA.alto;
    const yB = y0 + .14 + (1 - POL.k) * OBRA.alto;
    for (let i = 0; i < 2; i++){
      const c = CAN[i], y = i === 0 ? yA : yB;
      c.tab.y = y;
      c.g.position.set(PX, y - .14, c.tab.z);
      /* la cuerda va del moton al aro: se estira con el canasto, si no queda
         colgando en el aire y se ve el truco */
      const largo = Math.max(.25, (y0 + OBRA.alto + 1.78) - (y - .14 + 1.07));
      c.sog.scale.y = largo;
      c.sog.position.y = 1.07 + largo / 2;
      c.mo.rotation.z = (i === 0 ? 1 : -1) * POL.k * 9;
    }
  };
  ponPolea();
  POL.tick = dt => {
    if (POL.k === POL.obj) return;
    /* 4,4 s de punta a punta: rapido para que valga como atajo, lento para que
       se entienda que te esta subiendo una maquina y no un ascensor */
    const d = Math.sign(POL.obj - POL.k) * dt / 4.4;
    POL.k = Math.abs(POL.obj - POL.k) <= Math.abs(d) ? POL.obj : POL.k + d;
    ponPolea();
    if (POL.k === POL.obj) POL.montado = null;      /* llegaste: te suelta */
  };
  /* ¿hay un canasto al alcance de la mano Y a la altura de los pies? El segundo
     requisito es lo que evita que USAR llame al canasto desde el arquitrabe
     cuando el canasto esta abajo: hay que estar EN la estacion, no arriba de ella. */
  POL.cerca = (x, z, pies) => {
    if (POL.montado) return null;
    for (const c of CAN)
      if (Math.hypot(x - c.tab.x, z - c.tab.z) < 2.3 && Math.abs(pies - c.tab.y) < 1.4)
        return c;
    return null;
  };
  POL.montar = c => {
    if (!c || POL.montado || POL.k !== POL.obj) return false;
    POL.montado = c;
    POL.obj = POL.k > .5 ? 0 : 1;   /* el canasto que pisas va al otro extremo */
    return true;
  };
  /* las TRES dibujadas de la obra. computeBoundingSphere() no es opcional: el
     recorte por frustum de three usa object.boundingSphere si el objeto tiene una
     —InstancedMesh la tiene— y arranca en null, asi que sin esta llamada la
     calcula una vez y despues no se entera de nada. Con ella, la obra entera se
     recorta bien cuando le das la espalda: tres llamadas de dibujado y ninguna
     cuando no se ve. */
  for (const [fam, mat] of [['mad', matMad], ['tab', matTab], ['mar', matMar]]){
    const arr = FAM[fam];
    const im = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), mat, arr.length);
    for (let i = 0; i < arr.length; i++) im.setMatrixAt(i, arr[i]);
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = im.receiveShadow = true;
    im.computeBoundingSphere();
    scene.add(im);
  }
  OBRA.POL = POL;
  OBRA.piezas = FAM.mad.length + FAM.tab.length + FAM.mar.length;
  window.__OBRA = OBRA;
}
/* ---------------- EL OASIS Y EL POZO ----------------------------------------
   La hoya: un cuenco de arena con las palmeras en corro y, en el fondo, la boca
   del pozo tapada por la arena. El pozo se levanta sobre una PLATAFORMA de
   piedra (yb) para que el agua no se lo coma; cuando la manivela cede, el AGUA
   SUBE 4 m hasta 55 cm por encima del fondo de la hoya: el terreno recorta el
   disco solo, así que la orilla queda donde tiene que quedar, con bancos de
   arena asomando. El agua refleja el cielo por PMREM. */
let aguaMesh = null, aguaMat = null, manivela = null;
const POZO = { abierto: false, k: 0 };
{
  const p = POI.oasis, y = H(p.x, p.z);
  const yb = y + .62;                       /* la plataforma seca del pozo */
  const NIVEL = y + .55;                    /* dónde queda el agua al final */
  const matAre = new T.MeshLambertMaterial({ map: TX.roca });
  const matMad = new T.MeshLambertMaterial({ map: TX.oscuro });
  /* la explanada de piedra: el agua llega hasta acá y no la tapa (sin esto el
     brocal quedaba hundido en el charco y el pozo no se leía) */
  const apr = new T.Mesh(new T.CylinderGeometry(4.7, 5.1, 1.4, 22), matAre);
  apr.position.set(p.x, yb - .4, p.z);
  apr.receiveShadow = apr.castShadow = true;
  scene.add(apr);
  /* el brocal: anillo de piedra sobre la plataforma */
  const bro = new T.Mesh(new T.CylinderGeometry(2.15, 2.35, 1.25, 16, 1, true), matAre);
  bro.position.set(p.x, yb + .92, p.z);
  bro.castShadow = bro.receiveShadow = true;
  scene.add(bro);
  const boca = new T.Mesh(new T.CircleGeometry(2.05, 16),
    new T.MeshLambertMaterial({ color: 0x14100c }));
  boca.rotation.x = -Math.PI / 2;
  boca.position.set(p.x, yb + 1.38, p.z);
  scene.add(boca);
  /* la horca: dos postes, el travesaño, la manivela y el balde colgando */
  for (const sx of [-1, 1]){
    const po = new T.Mesh(new T.CylinderGeometry(.13, .16, 3.6, 6), matMad);
    po.position.set(p.x + sx * 2.4, yb + 2.1, p.z);
    po.castShadow = true;
    scene.add(po);
  }
  const tra = new T.Mesh(new T.CylinderGeometry(.11, .11, 5.2, 8), matMad);
  tra.rotation.z = Math.PI / 2;
  tra.position.set(p.x, yb + 3.8, p.z);
  tra.castShadow = true;
  scene.add(tra);
  manivela = new T.Mesh(new T.CylinderGeometry(.07, .07, 1.5, 6), matMad);
  manivela.geometry.translate(0, .75, 0);
  manivela.position.set(p.x + 2.62, yb + 3.8, p.z);
  manivela.rotation.z = 1.4;
  manivela.castShadow = true;
  scene.add(manivela);
  const bal = new T.Mesh(new T.CylinderGeometry(.36, .3, .5, 9), matMad);
  bal.position.set(p.x, yb + 2.8, p.z);
  bal.castShadow = true;
  scene.add(bal);
  const cue = new T.Mesh(new T.CylinderGeometry(.02, .02, 1, 4), matMad);
  cue.position.set(p.x, yb + 3.3, p.z);
  scene.add(cue);
  ARB.push([p.x, p.z, 5.2]);
  /* EL AGUA. OJO: con roughness bajo y envMapIntensity alto sale BLANCA (refleja
     el cielo dorado entero); el brillo del reflejo lo maneja el bucle según la
     luz del capítulo. */
  /* ================== EL AGUA, CON OLA Y ORILLA ==================
     Antes era un disco con la textura corriendose: `CircleGeometry` + map.offset.
     Eso no puede tener olas —un CircleGeometry es un abanico, un vertice en el
     centro y el resto en el borde: no hay vertices por dentro que puedan moverse—
     ni bajio ni orilla, y el canto era un poligono seco. Este es el mismo
     tratamiento del agua del PANTANO con la paleta de ESTE sitio.
     La geometria pasa a PlaneGeometry de 40x40 porque la ola necesita vertices
     por dentro; el borde circular lo da ahora el desvanecido de alfa, que ademas
     no tiene canto. */
  const AGUAU = { value: 0 };
  window.__AGUAU = AGUAU;
  const R_AGUA = 22.0;
  aguaMat = new T.MeshStandardMaterial({ color: 0x0b2428, roughness: 0.22,
    metalness: .55, map: TX.agua, transparent: true, opacity: .96,
    envMapIntensity: .5 });
  aguaMat.map.repeat.set(7, 7);
  aguaMat.onBeforeCompile = sh => {
    sh.uniforms.uT = AGUAU;
    sh.uniforms.tOla = { value: TX.agua };
    aguaMat.userData.sh = sh;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uT;varying vec2 vWp;varying float vD;varying float vProf;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vWp = position.xy;
        /* PROFUNDIDAD por radio: 0 en la orilla, 1 en el medio. Sin mapa de
           profundidad porque esto es una poza, no un mapa de agua. */
        vProf = smoothstep(1.0, 0.55, length(position.xy) / ${R_AGUA.toFixed(1)});
        /* DOMINIO DEFORMADO: la posicion se tuerce con dos senos lentos antes de
           calcular la ola, asi las crestas serpentean en vez de ser rectas. */
        vec2 pw = position.xy + vec2(sin(position.y * .21 + uT * .27),
                                     cos(position.x * .17 - uT * .21)) * 2.4;
        float hh = sin(pw.x * .52 + uT * .95) * .34
                 + cos(pw.y * .44 - uT * .78) * .28
                 + sin((pw.x + pw.y) * .95 + uT * 1.4) * .17;
        hh *= 0.070 * smoothstep(0.0, 0.35, vProf);   /* se aplana en la orilla */
        transformed.z += hh;
        vD = -(modelViewMatrix * vec4(transformed, 1.0)).z;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uT;uniform sampler2D tOla;varying vec2 vWp;varying float vD;varying float vProf;')
      /* OJO CON EL ORDEN: color_fragment y roughnessmap corren ANTES que
         normal_fragment_begin. Todo el calculo se hace aca y la normal solo
         CONSUME el gradiente despues. */
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec2 aguaG;
        {
          /* tres capas de rizo a distinta escala y velocidad; la normal sale de su
             GRADIENTE, que es lo que rompe el reflejo en vez de teñirlo */
          float lejos = clamp(1.0 - vD / 140.0, .35, 1.0);
          vec2 uvA = vWp * .085 + vec2(uT * .016,  uT * .011);
          vec2 uvB = vWp * .27  + vec2(-uT * .026, uT * .021);
          vec2 uvC = vWp * .74  + vec2(uT * .038, -uT * .031);
          float e2 = .02;
          float n1 = texture2D(tOla, uvA).r, n2 = texture2D(tOla, uvB).r, n3 = texture2D(tOla, uvC).r;
          aguaG = vec2(
            (texture2D(tOla, uvA + vec2(e2, 0.)).r - n1) * 2.1 +
            (texture2D(tOla, uvB + vec2(e2, 0.)).r - n2) * 2.6 +
            (texture2D(tOla, uvC + vec2(e2, 0.)).r - n3) * 1.5,
            (texture2D(tOla, uvA + vec2(0., e2)).r - n1) * 2.1 +
            (texture2D(tOla, uvB + vec2(0., e2)).r - n2) * 2.6 +
            (texture2D(tOla, uvC + vec2(0., e2)).r - n3) * 1.5) * lejos;
        }
        /* MASA: color de bajio en el canto -> color de hondo en el medio */
        diffuseColor.rgb = mix(vec3(.34,.36,.32), vec3(.045,.145,.16),
                               smoothstep(0.0, 0.62, vProf));
        /* y la ORILLA se desvanece: nada de corte poligonal seco */
        diffuseColor.a *= smoothstep(0.0, 0.16, vProf);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        /* en el bajio el agua es mas mate: hay barro y espuma, no espejo */
        roughnessFactor = mix(.86, roughnessFactor, smoothstep(0.0, 0.5, vProf));`)
      .replace('#include <normal_fragment_begin>', `#include <normal_fragment_begin>
        normal = normalize(normal + vec3(aguaG.x, aguaG.y, 0.0));`);
  };
  /* PlaneGeometry y no CircleGeometry: la ola vive en los vertices y un
     abanico no tiene vertices por dentro. El borde circular lo da el alfa. */
  aguaMesh = new T.Mesh(new T.PlaneGeometry(R_AGUA * 2, R_AGUA * 2, 40, 40), aguaMat);
  aguaMesh.rotation.x = -Math.PI / 2;
  aguaMesh.position.set(p.x, NIVEL - 4, p.z);
  aguaMesh.visible = false;
  scene.add(aguaMesh);
  /* ---- REFLEJO DE VERDAD -----------------------------------------------------
     Antes el agua solo devolvia el CIELO (envMap PMREM), asi que el brocal, la
     horca, las palmeras y las columnas que estan al borde no aparecian: se veia
     una chapa dorada, no una pila de agua. Un Reflector si los devuelve, pero es
     una SEGUNDA PASADA DE RENDER de la escena entera, y esto tiene que correr a
     60 en un celular. Por eso el espejo se paga con cuatro reglas:
       · resolucion 512 en ALTOS, 384 en MEDIOS, 256 en BAJOS. Nunca mas de 512;
       · multisample 0: el MSAA del blanco de reflejo se paga cuatro veces y en
         una lamina de agua con rizos encima no se nota;
       · APAGADO mientras el pozo esta tapado (que es la mitad de la partida);
       · APAGADO a mas de ESPEJO.lejos metros, que es casi todo el mapa. El
         reflejo solo existe cuando estas mirando el agua de cerca.
     El disco tintado con los rizos queda ENCIMA con menos opacidad: el espejo
     pone lo que hay alrededor y el disco pone el color del agua y el movimiento
     (un Reflector solo no tiene ni tinte ni rizos). */
  const ESPEJO = { m: null, lejos: 78, res: 384, on: false };
  if (Reflector){
    ESPEJO.m = new Reflector(new T.CircleGeometry(21.4, 40), {
      textureWidth: 384, textureHeight: 384, multisample: 0,
      color: 0x8fa3a0, clipBias: .003 });
    ESPEJO.m.rotation.x = -Math.PI / 2;
    ESPEJO.m.position.set(p.x, NIVEL - 4 - .04, p.z);   /* justo abajo del disco */
    ESPEJO.m.visible = false;
    scene.add(ESPEJO.m);
    /* con espejo debajo, el disco de arriba tiene que dejar ver: al 0,93 que
       tenia lo tapaba entero. Y el reflejo de cielo por PMREM baja, porque si no
       se suman dos reflejos y el agua vuelve a salir blanca. */
    aguaMat.opacity = .52;
    ESPEJO.on = true;
  }
  /* la resolucion del espejo la manda la calidad grafica, y en BAJOS se puede
     apagar del todo: aca solo se guarda el enganche, decide setGfx. */
  ESPEJO.calidad = g => {
    if (!ESPEJO.m) return;
    /* 512 solo en ALTOS. En MEDIOS 384: la mitad de los pixeles del espejo, y en
       una lamina de agua con rizos encima no se le nota la diferencia. En BAJOS
       256 si algun dia se prende, pero por lo medido va apagado. */
    ESPEJO.res = g === 'b' ? 256 : (g === 'a' ? 512 : 384);
    ESPEJO.on = ESPEJO_BAJOS || g !== 'b';
    const rt = ESPEJO.m.getRenderTarget();
    if (rt.width !== ESPEJO.res) rt.setSize(ESPEJO.res, ESPEJO.res);
    /* sin espejo, el disco vuelve a ser el agua opaca de antes */
    aguaMat.opacity = ESPEJO.on ? .52 : .93;
  };
  window.__ESPEJO = ESPEJO;   /* para poder verificarlo desde la sonda */
  POZO.abrir = () => {
    if (POZO.abierto) return;
    POZO.abierto = true;
    aguaMesh.visible = true;
  };
  POZO.tick = dt => {
    if (manivela && POZO.abierto && POZO.k < 1) manivela.rotation.y += dt * 2.2;
    /* el reloj de la ola. La textura ya no se corre a mano: la mueve el
       sombreador, en tres capas y a tres velocidades. */
    if (window.__AGUAU) window.__AGUAU.value += dt;
    if (!POZO.abierto) return;
    POZO.k = Math.min(1, POZO.k + dt / 6);
    const k = POZO.k * POZO.k * (3 - 2 * POZO.k);
    aguaMesh.position.y = NIVEL - 4 + k * 4;
    if (ESPEJO.m){
      ESPEJO.m.position.y = aguaMesh.position.y - .04;
      /* la pasada de espejo SOLO si hay agua, esta encendida y estas cerca */
      const d = Math.hypot(px - p.x, pz - p.z);
      const vis = ESPEJO.on && POZO.k > .02 && d < ESPEJO.lejos;
      ESPEJO.m.visible = vis;
      /* y el disco de arriba se OPACA cuando el espejo se apaga: al 0,52 que usa
         con espejo, sin espejo se ve la arena del fondo a traves del agua. El
         cruce se hace en los ultimos 8 m del alcance para que no salte de un
         cuadro al otro justo en el borde. */
      aguaMat.opacity = vis ? .93 - .41 * cl((ESPEJO.lejos - d) / 8, 0, 1) : .93;
    }
  };
  /* gancho de PRUEBA: prender/apagar el espejo a mano para medir su costo en fps
     sin tocar la calidad grafica (que cambia diez cosas mas a la vez) */
  POZO.espejoForzar = (v, res) => {
    if (!ESPEJO.m) return;
    ESPEJO.on = !!v;
    aguaMat.opacity = v ? .52 : .93;
    if (res){ ESPEJO.res = res; ESPEJO.m.getRenderTarget().setSize(res, res); }
  };
  /* el bucle de dibujado pregunta esto CADA CUADRO: tiene que ser un booleano y
     no un objeto nuevo, que en el celular se paga en recolecciones de basura. */
  POZO.espejoVisible = () => !!(ESPEJO.m && ESPEJO.m.visible);
  POZO.espejo = () => ({ hay: !!ESPEJO.m, on: ESPEJO.on, res: ESPEJO.res,
    visible: !!(ESPEJO.m && ESPEJO.m.visible), opacidad: +aguaMat.opacity.toFixed(2) });
  POZO.espejoCalidad = ESPEJO.calidad;
  window.__POZO = POZO;
}

/* --------- EL PALMAR: seis palmeras GLB y veinte instanciadas --------------
   El GLB de palmera del repo pesa 28 mil triángulos: seis clones alcanzan para
   el primer plano del pozo. El resto del palmar son estas: tronco de siete
   lados y copa de diez hojas, INSTANCIADAS (dos dibujados para veinte

const gTronco = new T.CylinderGeometry(.17, .34, 1, 7, 1, true);
gTronco.translate(0, .5, 0);
function geoCopa(){
  const gs = [new T.SphereGeometry(.42, 7, 5)];
  for (let i = 0; i < 10; i++){
    const f = new T.ConeGeometry(.5, 3.6, 4);
    f.scale(1, 1, .16);
    f.translate(0, 1.8, 0);
    f.rotateZ(1.02 + (i % 3) * .12);
    f.rotateY(i / 10 * 6.283);
    gs.push(f);
  }
  return fusiona(gs);
}

/* luz por capítulo: dirección/intensidad del sol, cielo, niebla, hemisferio y
   EXPOSICIÓN del tone mapping (la cámara "abre" en el atardecer, "cierra" de
   noche: el mismo truco de exposición que usan los juegos grandes) */
const LUZCAP = [
  { sol: [.62, .44, .30],  solI: 2.7, bg: 1.0,  fog: '#e3ac72', fogFar: 500, hemiI: .95, exp: 1.06 },
  { sol: [.52, .30, .22],  solI: 2.6, bg: 1.0,  fog: '#e2a366', fogFar: 470, hemiI: .88, exp: 1.10 },
  { sol: [.80, .17, .06],  solI: 2.3, bg: .96,  fog: '#e2934e', fogFar: 430, hemiI: .74, exp: 1.20 },
  { sol: [.92, .075, -.05],solI: 1.5, bg: .82,  fog: '#d47a42', fogFar: 380, hemiI: .60, exp: 1.28 },
  { sol: [.88, .02, -.12], solI: .55, bg: .52,  fog: '#7a6480', fogFar: 350, hemiI: .30, exp: 1.24 },
  { sol: [.60, -.04, -.24],solI: .16, bg: .42,  fog: '#493c50', fogFar: 330, hemiI: .24, exp: 1.14 }
];
let cap = 0, enDlg = false, fase = 'menu';
let luzDe = LUZCAP[0], luzA = LUZCAP[0], luzK = 1;
function guardar(){ try { localStorage.setItem('dunas1', JSON.stringify({ cap, t: stats.t, dist: stats.dist })); } catch(e){} }
function cargar(){ try { return JSON.parse(localStorage.getItem('dunas1') || 'null'); } catch(e){ return null; } }
function ponCap(n, silencio){
  cap = cl(n, 0, CAPS.length - 1);
  const C = CAPS[cap];
  $('objT').textContent = C.objT;
  luzDe = mezclaLuz(); luzA = LUZCAP[cap]; luzK = 0;
  luci.visible = cap >= 2 && cap <= 4;
  MISION.alCap(cap);
  /* LA FUENTE SAGRADA. El capitulo 4 es bajar a la fuente y encontrar la pila
     tapada de hojas; el 5 ya es amasar la cal, o sea que el agua tiene que estar.
     POZO.abrir() no lo llamaba NADIE, asi que la pila del oasis se quedaba seca
     toda la partida y el agua de este mundo no se veia nunca. Se ata al guion:
     al pasar al capitulo 5 el agua sube a la vista; si la partida se retoma
     desde un save ya avanzado, sube de golpe (no hay nada que mostrar). */
  if (cap >= 4 && POZO.abrir){
    POZO.abrir();
    if (silencio) POZO.k = 1;
  }
  if (!silencio){
    $('capN').textContent = C.n;
    $('capT').textContent = C.t;
    $('capCard').classList.add('on');
    clearTimeout(ponCap._t);
    ponCap._t = setTimeout(() => $('capCard').classList.remove('on'), 3400);
    /* la CINEMÁTICA del capítulo: la cámara te muestra adónde vas */
    cineObjetivo(C);
  }

}
function mezclaLuz(){
  /* estado ACTUAL de la luz (para arrancar la transición desde donde está) */
  return { sol: [SOLD.x, SOLD.y, SOLD.z],
    solI: sol.intensity, bg: scene.backgroundIntensity,
    fog: '#' + scene.fog.color.getHexString(), fogFar: scene.fog.far,
    hemiI: hemi.intensity, exp: ren.toneMappingExposure };
}
function pasoLuz(dt){
  if (luzK >= 1) return;
  luzK = Math.min(1, luzK + dt / 7);           /* la transición dura ~7 s */
  const k = luzK * luzK * (3 - 2 * luzK);
  const A2 = luzDe, B2 = luzA;
  /* la DIRECCIÓN del sol se mezcla acá; su POSICIÓN la pone el bucle cada
     cuadro, pegada al jugador, para que la caja de sombra lo siga */
  SOLD.set(A2.sol[0] + (B2.sol[0] - A2.sol[0]) * k,
           A2.sol[1] + (B2.sol[1] - A2.sol[1]) * k,
           A2.sol[2] + (B2.sol[2] - A2.sol[2]) * k).normalize();
  sol.intensity = A2.solI + (B2.solI - A2.solI) * k;
  hemi.intensity = A2.hemiI + (B2.hemiI - A2.hemiI) * k;
  scene.backgroundIntensity = A2.bg + (B2.bg - A2.bg) * k;
  scene.fog.color.set(A2.fog).lerp(new T.Color(B2.fog), k);
  scene.fog.far = (A2.fogFar + (B2.fogFar - A2.fogFar) * k) * GFXQ[GFX].fogK;
  const eA = A2.exp != null ? A2.exp : 1.12, eB = B2.exp != null ? B2.exp : 1.12;
  ren.toneMappingExposure = eA + (eB - eA) * k;
  /* el ATARDECER AZUL: el halo del sol vira del caramelo al azul al caer */
  glare.material.color.set(0xfff0dc).lerp(AZUL_OCASO, cl(1 - SOLD.y * 2.4, 0, 1));
  /* el fogón del campamento: brasa siempre, hoguera cuando cae el sol */
  if (fuegoMat){
    const osc = cl(1 - (SOLD.y * 420) / 170, 0, 1);
    focoCasa.intensity = 8 + osc * osc * 52;
  }
}
/* el texto se PARTE EN PAGINAS por parrafo: antes entraba entero en un solo
   cuadro que ocupaba media pantalla en medio de la cara. Cada pagina se escribe
   letra por letra; SIGUIENTE completa si esta escribiendo, pasa de pagina si
   quedan, y recien cierra en la ultima. */
let _dlgTim = null, _dlgFull = '', _dlgPags = [], _dlgP = 0, _dlgCerrar = null;
function _dlgPinta(){
  const txt = _dlgPags[_dlgP] || '';
  if (_dlgTim) clearInterval(_dlgTim);
  _dlgFull = txt;
  let i = 0;
  $('dlgB').textContent = '';
  _dlgTim = setInterval(() => {
    i += 2;
    $('dlgB').textContent = _dlgFull.slice(0, i);
    if (i >= _dlgFull.length){ clearInterval(_dlgTim); _dlgTim = null; }
  }, 16);
  const hay = _dlgPags.length > 1;
  $('dlgPag').textContent = hay ? (_dlgP + 1) + '/' + _dlgPags.length : '';
  $('dlgGo').textContent = (_dlgP < _dlgPags.length - 1) ? Tx('dlgMas') : Tx('dlgGo');
}
function dialogo(titulo, cuerpo, alCerrar, cara, retrato){
  enDlg = true;
  $('dlgT').textContent = titulo;
  const img = $('dlgFoto'), cv = $('dlgCara');
  if (retrato){
    img.src = retrato; img.classList.add('on'); cv.classList.remove('on');
  } else if (cara){
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 192, 256);
    g.save(); g.translate(0, 24); cara(g, 192); g.restore();
    cv.classList.add('on'); img.classList.remove('on');
  } else { cv.classList.remove('on'); img.classList.remove('on'); }
  /* partir por parrafo; si un parrafo es larguisimo se corta por oracion */
  _dlgPags = [];
  for (const par of String(cuerpo).split(/\n\s*\n/)){
    const p = par.trim();
    if (!p) continue;
    if (p.length <= 185){ _dlgPags.push(p); continue; }
    let acc = '';
    for (const or of p.split(/(?<=[.!?»])\s+/)){
      if ((acc + ' ' + or).trim().length > 185 && acc){ _dlgPags.push(acc.trim()); acc = or; }
      else acc = (acc + ' ' + or).trim();
    }
    if (acc) _dlgPags.push(acc);
  }
  if (!_dlgPags.length) _dlgPags = [''];
  _dlgP = 0; _dlgCerrar = alCerrar || null;
  _dlgPinta();
  $('dlg').classList.add('on');
  document.body.classList.add('hablando');
  $('dlgGo').onclick = () => {
    if (_dlgTim){                                  /* escribiendo: completar */
      clearInterval(_dlgTim); _dlgTim = null;
      $('dlgB').textContent = _dlgFull;
      return;
    }
    if (_dlgP < _dlgPags.length - 1){ _dlgP++; _dlgPinta(); return; }
    $('dlg').classList.remove('on');
    document.body.classList.remove('hablando');
    enDlg = false;
    const f = _dlgCerrar; _dlgCerrar = null;
    if (f) f();
  };
}
