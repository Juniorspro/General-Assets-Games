<style>
/* ================= ARCADE SHELL — CSS común de los 5 juegos =================
   REGLA DE ORO DEL CELULAR VERTICAL: el juego SIEMPRE se ve apaisado. Si el
   teléfono está vertical, #stage se rota 90° y se le fijan ancho/alto EN PX
   (los del viewport cruzados). Todo lo que mida la UI tiene que medirse en el
   espacio del #stage (clientWidth/clientHeight, offsetTop), NUNCA contra
   window.innerWidth/innerHeight ni con getBoundingClientRect: con el stage
   rotado esas dos cosas viven en ejes distintos. El puntero se convierte a mano
   (ver ARC.pt) porque la rotación cruza los ejes del compositor.            */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef2f6}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#0d1014;
  transform-origin:0 0;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
/* dos lienzos: #gl es la escena 3D (WebGL) y #cv la capa 2D de efectos y texto
   flotante que va ENCIMA. Así los juegos 3D siguen usando ARC.fx sin shaders. */
#gl{z-index:0}
#cv{z-index:1;pointer-events:auto;background:transparent}
/* ---- capas ---- */
.lay{position:absolute;inset:0;pointer-events:none}
/* z-index 5: MEDIDO CON TOQUES REALES — sin él, el canvas (#cv, z-index 1) queda
   por encima de estas pantallas y se come el toque: document.elementFromPoint en
   el centro de REINTENTAR devolvía "cv", así que reiniciar/seguir/menú/niveles/
   ajustes NO funcionaban en ningún juego. Las sondas no lo veían porque disparaban
   el evento directo al botón en vez de tocar la pantalla. */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:auto;background:rgba(6,9,13,.62);z-index:5;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scr.on{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#menu{background:#0d1014 center/cover no-repeat;backdrop-filter:none;-webkit-backdrop-filter:none}
/* el arte del menú ya trae el título: el degradado va de ABAJO para que los
   botones se lean sin tapar la ilustración, y el título de DOM sólo aparece si
   la imagen no llegó (#menu sin .hasart). */
#menu:before{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(5,7,10,.94) 0%,rgba(5,7,10,.55) 30%,rgba(5,7,10,.05) 62%)}
#menu.hasart .ttl{display:none}
/* ---- tipografía ---- */
.h1{font-size:clamp(22px,5.2vmin,44px);font-weight:900;letter-spacing:.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.75)}
.h2{font-size:clamp(14px,3vmin,22px);font-weight:800;opacity:.95}
.sm{font-size:clamp(10px,2.1vmin,15px);font-weight:600;opacity:.72;line-height:1.35}
/* ---- botones ---- */
.btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:.5em;
  padding:.62em 1.25em;border-radius:14px;font-weight:900;font-size:clamp(12px,2.6vmin,19px);
  background:linear-gradient(180deg,var(--acc) 0%,var(--acc2) 100%);color:#10141a;
  border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gh{background:rgba(255,255,255,.09);color:#eef2f6;border-color:rgba(255,255,255,.22);
  box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.sq{padding:0;width:clamp(34px,7.4vmin,52px);height:clamp(34px,7.4vmin,52px);border-radius:13px;
  font-size:clamp(15px,3.4vmin,23px)}
.row{display:flex;gap:clamp(6px,1.6vmin,14px);align-items:center}
.col{display:flex;flex-direction:column;gap:clamp(6px,1.6vmin,14px)}
/* ---- menú ---- */
#menu .wrap{position:relative;z-index:1;width:100%;height:100%;display:flex;
  flex-direction:column;justify-content:flex-end;padding:0 5.5vmin 4.5vmin;gap:1.8vmin}
#menu .ttl{font-size:clamp(26px,8.4vmin,68px);font-weight:900;line-height:.94;
  letter-spacing:-.5px;text-shadow:0 3px 0 rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.6)}
#menu .ttl em{font-style:normal;color:var(--acc)}
#menu .sub{max-width:52vmin}
#menu .mrow{margin-top:1.2vmin}
#best{position:absolute;right:3.4vmin;bottom:4.5vmin;text-align:right;z-index:1;line-height:1.5}
/* ---- HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.pill{position:absolute;display:flex;align-items:center;gap:.45em;padding:.42em .8em;
  border-radius:999px;background:rgba(10,14,19,.66);border:1px solid rgba(255,255,255,.14);
  font-weight:900;font-size:clamp(11px,2.4vmin,17px);backdrop-filter:blur(4px)}
#pScore{left:3vmin;top:2.4vmin}
#pInfo{left:50%;top:2.4vmin;transform:translateX(-50%)}
#pPause{right:3vmin;top:2.4vmin;pointer-events:auto;padding:0;
  width:clamp(30px,6.6vmin,46px);height:clamp(30px,6.6vmin,46px);justify-content:center}
#tray{position:absolute;left:0;right:0;bottom:2.2vmin;display:flex;justify-content:center;
  gap:1.4vmin;pointer-events:auto;flex-wrap:wrap;padding:0 2vmin}
/* ---- juegos VERTICALES (body.vert): los controles van grandes y bien abajo,
   porque en vertical el pulgar llega a la franja de abajo y no a los costados ---- */
body.vert #tray{bottom:3.5%;gap:2.5vw}
body.vert #tray .btn{min-width:16vw;padding:.85em 1.1em;font-size:clamp(15px,4.4vw,26px)}
body.vert #tray .btn.sq{width:16vw;height:16vw}
body.vert .pill{font-size:clamp(12px,3.4vw,20px);padding:.5em .9em}
body.vert #pScore{left:4vw;top:2vh}
body.vert #pInfo{top:2vh}
body.vert #pPause{right:4vw;top:2vh;width:11vw;height:11vw}
body.vert #menu .wrap{padding:0 7vw 7vh;gap:2.4vh}
/* en vertical el arte 16:9 se recortaba tanto que el título quedaba cortado
   ("ZA CA" en la captura V3): se ajusta por ANCHO y se pega arriba, y el resto de
   la columna lo llena el color del juego. */
body.vert #menu{background-size:100% auto;background-position:center 16%}
body.vert #menu:before{background:linear-gradient(0deg,rgba(5,7,10,.97) 0%,rgba(5,7,10,.82) 34%,rgba(5,7,10,.12) 62%,rgba(5,7,10,.35) 100%)}
body.vert #menu .sub{max-width:100%}
body.vert #best{right:5vw;bottom:7vh}
body.vert .card{max-width:88vw}
body.vert .h1{font-size:clamp(22px,7vw,44px)}
body.vert .h2{font-size:clamp(14px,4.4vw,24px)}
body.vert .sm{font-size:clamp(11px,3.2vw,16px)}
body.vert .btn{font-size:clamp(13px,3.8vw,20px)}
/* ---- tarjetas / paneles ---- */
.card{background:rgba(14,18,24,.92);border:1px solid rgba(255,255,255,.14);border-radius:18px;
  padding:clamp(12px,3vmin,26px);box-shadow:0 18px 50px rgba(0,0,0,.6);max-width:86vmin;
  display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.stars{display:flex;gap:.35em;font-size:clamp(20px,5.6vmin,42px);line-height:1}
.stars i{font-style:normal;opacity:.22}
.stars i.on{opacity:1;filter:drop-shadow(0 0 8px rgba(255,196,60,.7))}
.grid{display:grid;gap:1.2vmin}
.lvl{width:clamp(38px,8.4vmin,60px);height:clamp(38px,8.4vmin,60px);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:900;
  font-size:clamp(12px,2.7vmin,18px);pointer-events:auto}
.lvl.done{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#10141a}
.lvl.lock{opacity:.35}
.lvl b{font-size:.52em;letter-spacing:1px;opacity:.9}
/* ---- ajustes ---- */
.sw{width:clamp(42px,9vmin,62px);height:clamp(24px,5vmin,34px);border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);position:relative;
  pointer-events:auto;transition:background .15s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:calc(100% - 4px);height:calc(100% - 4px);
  aspect-ratio:1;border-radius:999px;background:#eef2f6;transition:transform .15s}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(calc(100% + 2px))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:2vmin;width:min(70vmin,100%)}
/* ---- avisos ---- */
#toast{position:absolute;left:50%;top:16%;z-index:8;transform:translateX(-50%) scale(.9);opacity:0;
  padding:.5em 1.1em;border-radius:12px;background:rgba(10,14,19,.9);font-weight:900;
  font-size:clamp(12px,2.8vmin,20px);transition:opacity .18s,transform .18s;z-index:5}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
#fps{position:absolute;left:50%;bottom:.6vmin;transform:translateX(-50%);font-size:10px;
  opacity:.35;z-index:5}
/* ---- pantalla de CARGA: fondo del propio juego, barra real y elección de idioma ---- */
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:2.2vmin;background:#05070a center/cover no-repeat;z-index:9;
  text-align:center;padding:4vmin}
#load:before{content:"";position:absolute;inset:0;backdrop-filter:blur(3px);
  background:linear-gradient(0deg,rgba(4,6,9,.95),rgba(4,6,9,.62))}
#load>*{position:relative;z-index:1}
#ldName{font-size:clamp(20px,6vmin,46px);font-weight:900;letter-spacing:.5px;
  text-shadow:0 3px 14px rgba(0,0,0,.8)}
#ldPct{font-weight:900;font-size:clamp(12px,2.6vmin,18px);opacity:.9}
#langs{display:flex;gap:1.4vmin;flex-wrap:wrap;justify-content:center;margin-top:1vmin}
#ldGo{display:none}
#ldGo.on{display:flex;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#load .bar{width:min(52vmin,340px);height:8px;border-radius:999px;background:rgba(255,255,255,.14);
  overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .25s}
.seg{display:flex;gap:.4vmin;background:rgba(255,255,255,.08);padding:.35em;border-radius:12px}
.seg b{font-weight:900;font-size:clamp(10px,2.2vmin,15px);padding:.45em .8em;border-radius:9px;
  opacity:.6;pointer-events:auto;white-space:nowrap}
.seg b.on{background:var(--acc);color:#10141a;opacity:1}
</style></head><body>

<script>
(function(){var Q=new URLSearchParams(location.search);var TV="0.170.0";
var t=Q.has("local")?"/_vthree/build/three.module.js":"https://cdn.jsdelivr.net/npm/three@"+TV+"/build/three.module.js";
var a=Q.has("local")?"/_vthree/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@"+TV+"/examples/jsm/";

<script type="module">
/* ---- assets ---- */
const BASE=(new URLSearchParams(location.search).has('local')?'/assets/arcade/':'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@3dff280/assets/arcade/');
const A=f=>BASE+f;
/* ============================================================================
   ARCADE SHELL — el motor común de los 5 juegos
   ----------------------------------------------------------------------------
   Un solo archivo, cero dependencias, canvas 2D + overlays de DOM para los
   menús (el texto queda nítido y se estila con CSS en vez de dibujarse).
   Lo que resuelve por todos:
     · APAISADO SIEMPRE (rota #stage 90° si el teléfono está vertical) y puntero
       convertido a mano, porque la rotación del compositor cruza los ejes.
     · Bucle de paso FIJO a 60 Hz con interpolación al dibujar: la simulación no
       cambia con los FPS del celular y el movimiento no tiembla a 120 Hz.
     · Audio (WebAudio con limitador + música por <audio>), con SÍNTESIS de
       respaldo: si un mp3 no está o el navegador no lo decodifica, suena un
       blip generado y el juego no se queda muerto de sonido.
     · Guardado en localStorage, pantallas (menú/pausa/fin/niveles/ajustes),
       partículas, texto flotante, sacudida de cámara, toast, FPS y calidad
       adaptativa (si baja de 45 fps se recortan las partículas).
   Contrato del juego (window.GAME): ver el final del archivo.
   ========================================================================== */
'use strict';
const ARC={W:0,H:0,dpr:1,q:1,t:0,dt:1/60,frame:0,fps:60,paused:false,scr:'load',lvl:1,alive:false};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

/* ---------------------------------------------------------------- 1. ESCENARIO
   Si el viewport está vertical se rota el escenario 90° y se le fijan ancho y
   alto EN PX (cruzados). Todo lo demás vive en ese espacio: ARC.W/ARC.H son las
   medidas del juego, siempre apaisadas. */
let ROT=false,OFFX=0;
function fit(){
  const vw=Math.round(window.innerWidth),vh=Math.round(window.innerHeight);
  const st=$('stage');
  /* GAME.portrait = el juego se juega VERTICAL de verdad (tipo Crossy Road): no se
     rota nada. En una ventana apaisada (escritorio) se centra una columna 9:16 y
     el resto queda negro, para que el encuadre sea el mismo que en el teléfono. */
  if(GAME.portrait){
    ROT=false;
    const w=Math.min(vw,Math.round(vh*.58));
    OFFX=Math.round((vw-w)/2);
    st.style.width=w+'px';st.style.height=vh+'px';
    st.style.transform=OFFX?('translateX('+OFFX+'px)'):'none';
  }else{
    OFFX=0;
    ROT=vh>vw;
    if(ROT){
      st.style.width=vh+'px';st.style.height=vw+'px';
      st.style.transform='translateX('+vw+'px) rotate(90deg)';
    }else{
      st.style.width=vw+'px';st.style.height=vh+'px';st.style.transform='none';
    }
  }
  ARC.W=st.clientWidth;ARC.H=st.clientHeight;
  const cv=$('cv');
  ARC.dpr=clamp(window.devicePixelRatio||1,1,2.5);
  cv.style.width=ARC.W+'px';cv.style.height=ARC.H+'px';
  cv.width=Math.round(ARC.W*ARC.dpr);cv.height=Math.round(ARC.H*ARC.dpr);
  ARC.g=cv.getContext('2d');
  ARC.g.setTransform(ARC.dpr,0,0,ARC.dpr,0,0);
  /* la escena 3D usa su propio lienzo y su propio DPR (más barato en el celular:
     el 3D a 1.5x se ve igual y cuesta la mitad que a 3x) */
  const gl=$('gl');
  gl.style.width=ARC.W+'px';gl.style.height=ARC.H+'px';
  if(ARC.rnd){
    ARC.rnd.setPixelRatio(Math.min(ARC.dpr,1.75));
    ARC.rnd.setSize(ARC.W,ARC.H,false);
  }
  if(GAME.resize)GAME.resize();
}
window.addEventListener('resize',()=>{fit();},{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(fit,120),{passive:true});

/* ---- puntero: del evento del navegador al espacio del escenario ----
   Con el escenario rotado 90° y corrido vw en X, un punto (sx,sy) del escenario
   cae en pantalla en (vw−sy, sx). La inversa es la que hace falta acá. NO se usa
   getBoundingClientRect: devuelve la caja YA rotada y mezcla los ejes. */
ARC.pt=function(e){
  const x=e.clientX,y=e.clientY;
  if(ROT)return{x:y,y:Math.round(window.innerWidth)-x};
  return{x:x-OFFX,y:y};      /* OFFX = columna centrada de los juegos verticales */
};

/* ------------------------------------------------------------------ 2. GUARDADO */
const SAVE={};
function saveKey(){return 'arc.'+GAME.slug;}
function saveLoad(){
  try{Object.assign(SAVE,JSON.parse(localStorage.getItem(saveKey())||'{}'));}catch(e){}
  if(SAVE.mus===undefined)SAVE.mus=1;
  if(SAVE.sfx===undefined)SAVE.sfx=1;
  if(SAVE.vib===undefined)SAVE.vib=1;
  if(SAVE.fx===undefined)SAVE.fx=1;
  if(SAVE.fps===undefined)SAVE.fps=0;
  if(!SAVE.stars)SAVE.stars={};
  if(!SAVE.best)SAVE.best=0;
  if(!SAVE.coins)SAVE.coins=0;
  if(!SAVE.done)SAVE.done=0;      /* nivel más alto superado */
  if(!SAVE.lang)SAVE.lang=(navigator.language||'es').slice(0,2).toLowerCase();
  if(!STR[SAVE.lang])SAVE.lang='es';
  if(SAVE.gfx==null)SAVE.gfx=2;
}
function saveNow(){try{localStorage.setItem(saveKey(),JSON.stringify(SAVE));}catch(e){}}
ARC.save=saveNow;ARC.S=SAVE;


/* ------------------------------------------------------------------ 2b. IDIOMAS

/* --------------------------------------------------------------- 2c. GRÁFICOS
   Un solo número (0-3) que decide DPR, sombras, partículas y niebla. Se aplica en
   caliente: no hace falta reiniciar el juego. */
const GFXP=[{dpr:1,part:.45,sh:0,fog:.7},{dpr:1.25,part:.75,sh:0,fog:.85},
            {dpr:1.75,part:1,sh:1,fog:1},{dpr:2.5,part:1.35,sh:1,fog:1.15}];
ARC.gfx=function(v){
  if(v!==undefined){SAVE.gfx=clamp(v|0,0,3);saveNow();applyGfx();paintSegs();}
  return SAVE.gfx==null?2:SAVE.gfx;
};
function applyGfx(){
  const p=GFXP[ARC.gfx()];
  ARC.q=p.part;
  if(ARC.rnd){
    ARC.rnd.setPixelRatio(Math.min(window.devicePixelRatio||1,p.dpr));
    ARC.rnd.shadowMap.enabled=!!(GAME.shadows&&p.sh);
    ARC.rnd.setSize(ARC.W,ARC.H,false);
  }
  if(GAME.gfxApply)nsafe2(()=>GAME.gfxApply(p));
}
ARC.gfxP=()=>GFXP[ARC.gfx()];
function paintSegs(){
  const mk=(host,items,cur,fn)=>{
    const el=$(host);if(!el)return;
    el.innerHTML='';
    items.forEach(it=>{
      const b=document.createElement('b');
      b.textContent=it[1];b.className=(it[0]===cur?'on':'');
      b.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sfx('tap');ARC.vib(8);fn(it[0]);});
      el.appendChild(b);
    });
  };
  mk('langs',LANGS,lang(),l=>ARC.lang(l));
  mk('segLang',LANGS,lang(),l=>ARC.lang(l));
  mk('segGfx',[[0,T('gfx0')],[1,T('gfx1')],[2,T('gfx2')],[3,T('gfx3')]],ARC.gfx(),v=>ARC.gfx(v));
}
ARC.paintSegs=paintSegs;

/* -------------------------------------------------------------------- 3. AUDIO */
const SND={ctx:null,buf:{},gain:null,mus:null,ready:false};
function actx(){
  if(SND.ctx)return SND.ctx;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  SND.ctx=new C();
  const lim=SND.ctx.createDynamicsCompressor();
  lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.15;
  SND.gain=SND.ctx.createGain();SND.gain.gain.value=.85;
  SND.gain.connect(lim);lim.connect(SND.ctx.destination);
  return SND.ctx;
}
ARC.sndResume=function(){const c=actx();if(c&&c.state==='suspended')c.resume();};
/* carga de efectos: si algo no llega o no se puede decodificar, se deja sin
   buffer y sonará el blip sintetizado (nunca silencio total ni excepción) */
ARC.sndLoad=function(map,done){
  const ks=Object.keys(map);let n=0;
  if(!ks.length){done&&done();return;}
  ks.forEach(k=>{
    fetch(map[k]).then(r=>r.arrayBuffer()).then(b=>{
      const c=actx();if(!c)throw 0;
      return new Promise((res,rej)=>c.decodeAudioData(b,res,rej));
    }).then(buf=>{SND.buf[k]=buf;}).catch(()=>{}).then(()=>{
      if(++n===ks.length){SND.ready=true;done&&done();}
    });
  });
};
/* blips de respaldo por nombre: no pretenden imitar el mp3, pero dan feedback */
const BEEP={tap:[520,.05,'square',.25],pop:[720,.08,'sine',.3],chime:[1040,.16,'triangle',.28],
  coin:[1180,.1,'square',.25],win:[880,.4,'triangle',.3],lose:[180,.4,'sawtooth',.25],
  click:[1400,.04,'square',.22],wood:[240,.12,'sawtooth',.3],glass:[2200,.1,'triangle',.22],
  splat:[300,.14,'sine',.3],groan:[120,.35,'sawtooth',.22],launch:[420,.14,'sawtooth',.28],
  boom:[90,.35,'sawtooth',.35],power:[1320,.22,'triangle',.28],shoot:[640,.07,'square',.22]};
ARC.sfx=function(name,o){
  if(!SAVE.sfx)return;
  const c=actx();if(!c)return;
  o=o||{};
  const b=SND.buf[name];
  if(b){
    const s=c.createBufferSource();s.buffer=b;
    s.playbackRate.value=o.rate||1;
    const g=c.createGain();g.gain.value=(o.vol==null?1:o.vol);
    s.connect(g);g.connect(SND.gain);s.start(0);return;
  }
  const d=BEEP[name]||BEEP.tap;
  const os=c.createOscillator(),g=c.createGain();
  os.type=d[2];os.frequency.value=d[0]*(o.rate||1);
  const v=d[3]*(o.vol==null?1:o.vol);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(v,c.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d[1]);
  os.connect(g);g.connect(SND.gain);os.start();os.stop(c.currentTime+d[1]+.02);
};
ARC.music=function(url){
  if(!url)return;
  if(!SND.mus){
    SND.mus=new Audio();SND.mus.loop=true;SND.mus.volume=.42;
    SND.mus.addEventListener('error',()=>{},{passive:true});
  }
  if(SND.mus.src!==url){SND.mus.src=url;}
  if(SAVE.mus){const p=SND.mus.play();if(p&&p.catch)p.catch(()=>{});}
};
ARC.musicStop=function(){if(SND.mus)SND.mus.pause();};
ARC.vib=function(ms){if(SAVE.vib&&navigator.vibrate)try{navigator.vibrate(ms||12);}catch(e){}};

/* ---------------------------------------------------------------- 4. EFECTOS */
const PT=[],TX=[];
let shake=0,shakeT=0;
ARC.fx={
  burst(x,y,o){
    o=o||{};
    let n=Math.round((o.n||14)*ARC.q*(SAVE.fx?1:.45));
    const sp=o.speed||220,life=o.life||.55,g=o.g==null?900:o.g;
    for(let i=0;i<n;i++){
      const a=o.a==null?rnd(0,TAU):o.a+rnd(-.6,.6);
      const v=sp*rnd(.35,1);
      PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*rnd(.6,1.2),L:life,
        s:(o.size||5)*rnd(.6,1.4),c:o.color||'#ffd166',g,sq:!!o.sq,
        rot:rnd(0,TAU),spin:rnd(-8,8),fade:o.fade!==false});
    }
  },
  ring(x,y,o){o=o||{};PT.push({ring:1,x,y,r:o.r0||6,R:o.r||90,l:o.life||.35,L:o.life||.35,
    c:o.color||'#fff',w:o.w||4});},
  text(x,y,txt,o){o=o||{};TX.push({x,y,t:txt,l:o.life||.8,L:o.life||.8,c:o.color||'#fff',
    s:o.size||22,vy:o.vy==null?-46:o.vy});}
};
ARC.shake=function(m){shake=Math.max(shake,m||6);};
function fxStep(dt){
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];
    p.l-=dt;if(p.l<=0){PT.splice(i,1);continue;}
    if(p.ring){p.r=lerp(p.r,p.R,1-Math.pow(.001,dt));continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;
    if(p.bounce&&p.y>p.bounce){p.y=p.bounce;p.vy*=-.42;p.vx*=.7;}
  }
  for(let i=TX.length-1;i>=0;i--){const t=TX[i];t.l-=dt;if(t.l<=0){TX.splice(i,1);continue;}
    t.y+=t.vy*dt;}
  if(shake>0){shakeT+=dt*46;shake=Math.max(0,shake-dt*shake*7-dt*3);}
}
function fxDraw(g){
  for(const p of PT){
    const k=p.l/p.L;
    g.globalAlpha=p.fade===false?1:clamp(k*1.4,0,1);
    if(p.ring){g.strokeStyle=p.c;g.lineWidth=p.w*k;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();continue;}
    g.fillStyle=p.c;
    if(p.sq){g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      g.fillRect(-p.s/2,-p.s/2,p.s,p.s);g.restore();}
    else{g.beginPath();g.arc(p.x,p.y,p.s*(.4+.6*k),0,TAU);g.fill();}
  }
  g.globalAlpha=1;
  for(const t of TX){
    const k=t.l/t.L;
    g.globalAlpha=clamp(k*1.6,0,1);
    g.font='900 '+t.s+'px system-ui,sans-serif';g.textAlign='center';
    g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(t.t,t.x,t.y);
    g.fillStyle=t.c;g.fillText(t.t,t.x,t.y);
  }
  g.globalAlpha=1;g.textAlign='left';
}

/* foto de la escena 3D para las sondas: se lee el framebuffer DENTRO de un
   requestAnimationFrame, que corre después del render del bucle en el MISMO
   frame — ahí el buffer todavía está intacto (después del compositado ya no). */
ARC.snapGL=function(){
  return new Promise(res=>{
    requestAnimationFrame(()=>{
      const r=ARC.rnd;if(!r){res(null);return;}
      const gl=r.getContext();
      const W=gl.drawingBufferWidth,H=gl.drawingBufferHeight;
      const px=new Uint8Array(W*H*4);
      gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
      let sum=0,n=0;const uniq={};
      for(let i=0;i<px.length;i+=4*37){n++;
        sum+=px[i]*.3+px[i+1]*.6+px[i+2]*.1;
        uniq[(px[i]>>5)+','+(px[i+1]>>5)+','+(px[i+2]>>5)]=1;}
      res({luz:+(sum/Math.max(1,n)).toFixed(1),colores:Object.keys(uniq).length});
    });
  });
};

/* --------------------------------------------------------------- 6. PARTIDA */
ARC.play=function(lvl){
  ARC.lvl=lvl||1;
  ARC.alive=true;ARC.paused=false;
  PT.length=0;TX.length=0;shake=0;
  ARC.show('game');
  GAME.start(ARC.lvl);
  ARC.music(GAME.music);
};
ARC.over=function(o){
  o=o||{};ARC.alive=false;
  const st=Math.max(0,Math.min(3,o.stars==null?(o.win?3:0):o.stars));
  if(o.win){
    const key=String(ARC.lvl);
    if((SAVE.stars[key]||0)<st){SAVE.stars[key]=st;}
    if(ARC.lvl>SAVE.done)SAVE.done=ARC.lvl;
  }
  if(o.score!=null&&o.score>SAVE.best)SAVE.best=o.score;
  if(o.coins)SAVE.coins+=o.coins;
  saveNow();
  $('oTtl').textContent=o.title||(o.win?T('win'):T('lost'));
  $('oScore').textContent=o.score!=null?(T('points')+' '+o.score):'';
  $('oSub').innerHTML=o.sub||'';
  const S=$('oStars').children;
  $('oStars').style.display=o.noStars?'none':'flex';
  for(let i=0;i<3;i++)S[i].classList.toggle('on',i<st);
  $('bNext').style.display=(o.win&&GAME.levels&&ARC.lvl<GAME.levels)?'flex':'none';
  ARC.sfx(o.win?'win':'lose');
  ARC.vib(o.win?[10,40,10]:60);
  ARC.show('over');
};
ARC.pause=function(){
  if(!ARC.alive||ARC.paused)return;
  ARC.paused=true;ARC.show('pause');GAME.pause&&GAME.pause();
};
ARC.resume=function(){
  if(!ARC.alive)return;
  ARC.paused=false;ARC.show('game');GAME.resume&&GAME.resume();
};
ARC.menu=function(){
  ARC.alive=false;ARC.paused=false;ARC.show('menu');refreshMenu();
};

/* --------------------------------------------------------------- 7. EL BUCLE
   Paso FIJO de 1/60 con acumulador y alpha de interpolación al dibujar: la
   física no depende de los FPS (un celular a 30 y otro a 120 simulan igual) y
   el dibujo no tiembla. Se cortan los saltos grandes (pestaña en segundo plano)
   a 5 pasos por frame para no colgar el hilo. */
const STEP=1/60;
let acc=0,last=0,fpsA=60,slowT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  let d=(ts-last)/1000;last=ts;
  if(d>.25)d=.25;
  ARC.fps=fpsA=lerp(fpsA,1/Math.max(.001,d),.06);
  if(SAVE.fps)$('fps').textContent=Math.round(fpsA)+' fps';
  /* calidad adaptativa: dos segundos por debajo de 45 fps y se recortan
     partículas (ARC.q lo leen los juegos y ARC.fx.burst) */
  if(fpsA<45){slowT+=d;if(slowT>2&&ARC.q>.5){ARC.q=.5;slowT=0;}}
  else{slowT=Math.max(0,slowT-d);if(fpsA>56&&ARC.q<1)ARC.q=Math.min(1,ARC.q+d*.2);}
  const run=ARC.alive&&!ARC.paused;
  acc+=d;
  let n=0;
  while(acc>=STEP&&n<5){
    acc-=STEP;n++;ARC.t+=STEP;ARC.frame++;
    if(run)GAME.step(STEP);
    fxStep(STEP);
  }
  if(acc>STEP*5)acc=0;
  const g=ARC.g;if(!g)return;
  g.setTransform(ARC.dpr,0,0,ARC.dpr,0,0);
  g.clearRect(0,0,ARC.W,ARC.H);
  if(shake>.05){
    g.translate(Math.sin(shakeT*1.7)*shake,Math.cos(shakeT*2.3)*shake*.8);
  }
  /* en el menú no se dibuja el juego: el canvas queda limpio (el arte del menú es
     DOM) y el celular no gasta batería dibujando un tablero que nadie ve */
  if(ARC.scr==='game'||ARC.scr==='pause'||ARC.scr==='over'){
    GAME.draw(g,acc/STEP);
    fxDraw(g);
  }else if(ARC.rnd&&ARC.clearGL){ARC.rnd.clear();}
}

/* ------------------------------------------------------------- 8. ENTRADA */
function bindInput(){
  const cv=$('cv');
  const down=e=>{
    e.preventDefault();ARC.sndResume();
    if(ARC.alive&&!ARC.paused&&GAME.down)GAME.down(ARC.pt(e),e);
  };
  const move=e=>{
    e.preventDefault();
    if(ARC.alive&&!ARC.paused&&GAME.move)GAME.move(ARC.pt(e),e);
  };
  const up=e=>{
    e.preventDefault();
    if(ARC.alive&&!ARC.paused&&GAME.up)GAME.up(ARC.pt(e),e);
  };
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  const B=(id,fn)=>{const el=$(id);if(!el)return;
    el.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sndResume();ARC.sfx('tap');ARC.vib(10);fn(el);});};
  B('bPlay',()=>ARC.play(GAME.levels?Math.min(GAME.levels,(SAVE.done||0)+1):1));
  B('bLevels',()=>{buildLevels();ARC.show('levels');});
  B('bLvBack',()=>ARC.menu());
  /* AJUSTES se puede abrir desde el MENÚ y desde la PAUSA, y LISTO vuelve a donde
     se abrió. Lo pidieron los tres verificadores: antes, cambiar idioma o gráficos
     obligaba a abandonar la partida (bOptBack llamaba siempre a ARC.menu()). */
  B('bOpts',()=>{optFrom='menu';ARC.show('opts');});
  B('bOpts2',()=>{optFrom='pause';ARC.show('opts');});
  B('bOptBack',()=>{if(optFrom==='pause'&&ARC.alive){ARC.show('pause');}else ARC.menu();});
  B('pPause',()=>ARC.pause());
  B('bRes',()=>ARC.resume());
  B('bRetry',()=>ARC.play(ARC.lvl));
  B('bQuit',()=>ARC.menu());
  B('bAgain',()=>ARC.play(ARC.lvl));
  B('bMenu',()=>ARC.menu());
  B('bNext',()=>ARC.play(Math.min(GAME.levels||1,ARC.lvl+1)));
  B('bWipe',()=>{const m=SAVE.mus,s=SAVE.sfx,v=SAVE.vib,f=SAVE.fx;
    for(const k in SAVE)delete SAVE[k];
    SAVE.mus=m;SAVE.sfx=s;SAVE.vib=v;SAVE.fx=f;SAVE.stars={};SAVE.best=0;SAVE.done=0;SAVE.coins=0;
    saveNow();ARC.toast(T('wiped'));refreshMenu();});
  const SW=(id,key,fn)=>{const el=$(id);if(!el)return;
    el.classList.toggle('on',!!SAVE[key]);
    el.addEventListener('pointerdown',e=>{e.preventDefault();
      SAVE[key]=SAVE[key]?0:1;el.classList.toggle('on',!!SAVE[key]);saveNow();
      ARC.sfx('tap');ARC.vib(10);fn&&fn(SAVE[key]);});};
  SW('swMus','mus',v=>{if(v)ARC.music(GAME.music);else ARC.musicStop();});
  SW('swSfx','sfx');
  SW('swVib','vib');
  SW('swFx','fx');
  SW('swFps','fps',v=>{$('fps').style.display=v?'block':'none';});
  document.addEventListener('keydown',e=>{
    if(e.code==='Escape'){if(ARC.alive&&!ARC.paused)ARC.pause();else if(ARC.paused)ARC.resume();}
    if(GAME.key)GAME.key(e.code,true);
  });
  document.addEventListener('keyup',e=>{if(GAME.key)GAME.key(e.code,false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&ARC.alive)ARC.pause();});
}

/* -------------------------------------------------------- 9. MENÚ / NIVELES */
function refreshMenu(){
  $('mTtl').innerHTML=GAME.title;
  $('mSub').innerHTML=GAME.subKey?T(GAME.subKey):GAME.sub;
  const b=[];
  if(GAME.bestLabel!==null)b.push('<b>'+(GAME.bestKey?T(GAME.bestKey):(GAME.bestLabel||T('record')))+'</b> '+(SAVE.best||0));

}
function buildLevels(){

  /* ---------------- CARGA DE ASSETS con barra de verdad ----------------
     Se cuentan TODOS los pasos (motor 3D, arte, sonidos, modelos) y la barra
     avanza por paso terminado. El fondo de la pantalla de carga es el arte del
     propio juego, como en los otros juegos del repo. Al final NO se entra solo:
     aparece "TOCÁ PARA JUGAR", porque ese toque es lo que habilita el audio en
     el celular (sin gesto, el navegador no deja sonar nada). */
  const steps=[];
  if(GAME.three)steps.push('engine');
  if(GAME.art)steps.push('art');

  if(sfxN)steps.push('sounds');
  const glbN=Object.keys(GAME.glb||{}).length;
  if(glbN)steps.push('models');
  let done=0;

  const prog=(k)=>{
    done++;

    $('ldBar').style.width=pc+'%';$('ldPct').textContent=pc+'%';
    $('ldTxt').textContent=T(k)||'';
  };
  $('ldTxt').textContent=T(steps[0]||'loading');

  /* 1. motor 3D (por importmap, sólo si el juego es 3D) */
  if(GAME.three){
    try{
      const THREE=await import('three');
      ARC.THREE=THREE;
      const gl=$('gl');
      ARC.rnd=new THREE.WebGLRenderer({canvas:gl,antialias:true,alpha:false,powerPreference:'high-performance'});
      ARC.rnd.setClearColor(new THREE.Color(GAME.sky||'#0d1014'),1);
      if(THREE.SRGBColorSpace)ARC.rnd.outputColorSpace=THREE.SRGBColorSpace;

  }
  applyGfx();

  /* 2. arte del menú (y fondo de esta misma pantalla) */
  if(GAME.art){
    await new Promise(res=>{
      const im=new Image();
      im.onload=()=>{
        $('load').style.backgroundImage='url('+GAME.art+')';
        const el=$('menu');
        if(GAME.portrait){
          el.style.backgroundImage='url('+GAME.art+'), linear-gradient(180deg,'+
            (GAME.acc2||'#222')+'55 0%, #0a0d12 46%, #05070a 100%)';
          el.style.backgroundSize='100% auto, 100% 100%';
          el.style.backgroundRepeat='no-repeat, no-repeat';
          el.style.backgroundPosition='center 14%, center';
        }else{
          el.style.backgroundImage='url('+GAME.art+')';
        }
        el.classList.add('hasart');res();
      };
      im.onerror=()=>res();
      im.src=GAME.art;
    });
    prog('art');
  }
  /* 3. sonidos */
  if(sfxN){
    await new Promise(res=>ARC.sndLoad(GAME.sfx,res));
    prog('sounds');
  }
  /* 4. modelos 3D (opcional: los juegos que usan GLB los declaran en GAME.glb) */
  if(glbN&&ARC.THREE){
    try{
      const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
      const ld=new GLTFLoader();
      ARC.glb={};
      await Promise.all(Object.keys(GAME.glb).map(k=>new Promise(res=>{
        ld.load(GAME.glb[k],g=>{ARC.glb[k]=g;res();},undefined,()=>{ARC.glb[k]=null;res();});
      })));
    }catch(e){console.warn('glb',e);ARC.glb=ARC.glb||{};}
    prog('models');
  }
  /* 5. listo: el juego se prepara y se espera el toque */
  nsafe2(()=>GAME.init&&GAME.init());
  requestAnimationFrame(loop);
  $('ldBar').style.width='100%';$('ldPct').textContent='100%';
  $('ldTxt').textContent=T('ready');
  $('ldGo').classList.add('on');
  const enter=()=>{
    $('ldGo').removeEventListener('pointerdown',enter);
    ARC.sndResume();
    $('load').style.display='none';
    ARC.show('menu');refreshMenu();
    ARC.music(GAME.music);
  };
  $('ldGo').addEventListener('pointerdown',e=>{e.preventDefault();enter();});
  /* atajo para las sondas y para el teclado */
  ARC.enterMenu=enter;
  document.addEventListener('keydown',e=>{if(ARC.scr==='load'&&(e.code==='Space'||e.code==='Enter'))enter();});
};

/* ============================================================================
   HÉLICE — la pelota que baja por la torre en espiral
   ----------------------------------------------------------------------------
   La torre es una pila de ANILLOS: cada uno tiene uno o dos huecos y algunos
   tramos ROJOS que rompen. Arrastrando se GIRA la torre (la pelota siempre cae
   por el frente, en el ángulo 0 del cilindro = eje +Z), así se busca el hueco.
   Pasar un anillo suma piso; caer sobre rojo, perder. 12 niveles: más anillos,
   huecos más chicos, más rojo, menos huecos dobles, más gravedad y desde el 5
   algunos anillos GIRAN solos.

   Lo que hay que saber antes de tocar este archivo (todo esto se midió):
     · COLISIÓN BARRIDA, no por ventana. Antes se probaba "¿la pelota está en una
       franja de 0,6 sobre el anillo?"; a 25 anillos de caída la velocidad pasa
       de 36 u/s = 0,6 u por paso y la pelota TUNELEABA anillos enteros. Ahora se
       compara el fondo de la pelota del paso anterior con el de este (cruce de
       plano) y además hay velocidad terminal (VMAX).
     · REBOTE por restitución (imp*.6 con techo 7,2), no impulso fijo. Con el
       impulso fijo de 8,4 la pelota subía 2,07 u: saltaba por encima del anillo
       anterior y quedaba rebotando sin avanzar (medido: 0 anillos en 7 s).
     · Los HUECOS se definen por su CENTRO. La versión anterior los corría media
       vuelta (`norm(h[0])+Math.PI`) y el hueco "casi al frente" del primer anillo
       caía justo ATRÁS: la partida empezaba con la pelota rebotando contra una
       pared (medido: bounces=2, passed=0 al segundo y medio, en las dos pantallas).
     · La rotación tiene TRES capas: rotT (lo que pide el dedo/el bot), rotV
       (inercia al soltar) y rot (lo que se dibuja Y con lo que se colisiona,
       suavizado hacia rotT). Colisionar con el mismo ángulo que se ve es lo que
       hace que no se sienta injusto.
     · La cámara es un resorte con ADELANTO: mira más abajo cuanto más rápido cae.
       Se mide con dbg.nx (dónde cae el próximo anillo en pantalla, 0=arriba,
       1=abajo): tiene que quedar por debajo de 1 SIEMPRE.
     · El RADAR 2D de abajo a la izquierda dibuja DOS anillos desplegados (el que
       viene y el siguiente): es lo que permite decidir antes de soltarse, no
       después. Con una sola fila, caer sobre rojo era imprevisible.
     · Los tramos rojos se leen por CUATRO cosas: rayas de peligro en el costado,
       rayas más gruesas en la TAPA (que es la cara que se mira), contorno oscuro
       (casco invertido con side:BackSide) y pulso de emisión.
     · Nada mata en los primeros segundos: el nivel 1 no tiene rojo, ningún nivel
       pone rojo en los 3 primeros anillos, los huecos de los anillos 0 y 1 salen
       casi al frente y la gravedad entra al 50% y sube en 1,2 s (gEff).
     · Las ESTRELLAS son por RACHA (anillos seguidos sin rebotar), no por terminar:
       terminar es lo normal, encadenar huecos es la habilidad.
   ========================================================================== */

/* OJO: el shell ya declaró en este mismo ámbito T, clamp, lerp, rnd, rndi, pick,
   TAU, $ y ARC. Redeclarar cualquiera de esos rompe el módulo entero. */
/* RH (paso entre anillos) y VMAX (velocidad terminal) son EL RITMO del juego, y
   estaban regalados: con RH=1,6 y VMAX=14 pasar un hueco a 10 u/s dejaba 0,15 s
   hasta el anillo siguiente. Si ahí había rojo, no había reacción humana posible
   (el bot murió así en los niveles 6 y 12: "t 0.01" en la última decisión). Con
   2,05 y 11 el hueco siguiente llega a 0,19-0,22 s y, sobre todo, entran DOS
   anillos más en cuadro: se decide antes de caer, no después. */
const RIN=1.15,ROUT=2.55,RH=2.05,TH=.34;  /* radio interno/externo, paso, espesor */
const BR=.42,BZ=1.68;                     /* radio de la pelota y radio de su órbita */
/* Media anchura angular con la que colisiona la pelota. La geométrica sería
   atan(BR/BZ)=.246; se usa .17 a propósito: raspar el borde del hueco PASA, que
   es lo que el jugador espera de un juego de una mano. */
const BHALF=.17;
const VMAX=11;                            /* velocidad terminal. A 21 la cadena de
                                             huecos era incontrolable: 0,076 s por
                                             anillo, imposible de leer. */
const SPINROT=26,SPINFRIC=2.7,ROTVMAX=13; /* suavizado del dedo, roce e inercia */
const BOTV=8.5;                           /* rad/s a los que gira el bot */

let T3,scene,cam,tower,deco,ballG,ballMesh,pole,goalM;
let rings=[],frags=[],props=[];
let by=0,bvy=0,pby=0;                     /* alto de la pelota, velocidad, alto previo */
let rot=0,rotT=0,rotV=0,prot=0;           /* ángulo dibujado / pedido / inercia / previo */
let camY=0,camV=0,pcamY=0;                /* cámara: resorte con adelanto */
let dead=false,won=false,endT=0,passed=0,total=12,combo=0,best=0,bounces=0,lvl=1;
let D={},grav=18,goalY=-99,startT=0;
let drag=null,botT=null,sq=0,sqV=0,spinAcc=0,lastAim='';
let partK=1,decoK=1;      /* de ARC.gfxP(): partículas y densidad de props */
const MAT={};let HAZ=null,HAZC=null,HAZM=null,OUTM=null,HTEX=null;
function mat(c){if(MAT[c])return MAT[c];return MAT[c]=new T3.MeshLambertMaterial({color:new T3.Color(c)});}
const norm=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};   /* a −π..π */

/* ------------------------------------------------------------ TEXTURA DE PELIGRO
   Rayas diagonales dibujadas a mano en un canvas: no hace falta bajar ninguna
   imagen y se ve igual en cualquier pantalla. */
function hazTex(rep){
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d');
  x.fillStyle='#ff3b57';x.fillRect(0,0,64,64);
  x.strokeStyle='#3d0512';x.lineWidth=12;
  for(let i=-80;i<140;i+=28){x.beginPath();x.moveTo(i,-4);x.lineTo(i+68,68);x.stroke();}
  const t=new T3.CanvasTexture(c);
  t.wrapS=t.wrapT=T3.RepeatWrapping;t.repeat.set(rep,rep);
  if(T3.SRGBColorSpace)t.colorSpace=T3.SRGBColorSpace;
  return t;
}
/* Tres materiales, no uno: la cara que el jugador MIRA es la de ARRIBA (la cámara
   va 30° sobre el anillo), y con un solo material las rayas del costado llegaban
   a la tapa estiradas y en pantalla chica el tramo rojo se leía como "morado
   oscuro". La tapa lleva su propia textura, más gruesa. El orden del array es el
   de los grupos de CylinderGeometry: costado, tapa de arriba, tapa de abajo. */
function hazMats(){
  if(HAZ)return HAZM;
  if(!HTEX)HTEX=hazTex(5);
  HAZ=new T3.MeshLambertMaterial({map:HTEX,emissive:new T3.Color('#ff2a48'),emissiveIntensity:.12});
  HAZC=new T3.MeshLambertMaterial({map:hazTex(2.4),emissive:new T3.Color('#ff2a48'),emissiveIntensity:.16});
  HAZM=[HAZ,HAZC,HAZC];
  return HAZM;
}
function outMat(){    /* contorno = casco invertido, sólo caras traseras */
  if(OUTM)return OUTM;
  return OUTM=new T3.MeshBasicMaterial({color:new T3.Color('#2c0410'),side:T3.BackSide});
}

/* ------------------------------------------------------------------- NIVELES
   Una sola función define TODA la curva de dificultad; dbg.state() la publica
   para poder mirarla desde la sonda sin abrir el juego. */
function diff(n){
  n=clamp(n|0,1,12);
  return {n,
    nr:8+n*2,                                   /* 10 anillos en el 1, 32 en el 12 */
    gap:Math.max(.86,1.52-n*.058),              /* hueco en radianes */
    redP:n<2?0:Math.min(.40,(n-1)*.042),        /* nivel 1 sin rojo */
    twoP:clamp(.55-n*.045,.02,.55),             /* huecos dobles: cada vez menos */
    spinN:n<5?0:Math.round((n-4)*1.2),          /* anillos que giran solos */
    spinV:.20+n*.028,
    grav:17.5+n*.32};
}

/* un tramo de anillo: cilindro recortado (thetaStart/thetaLength).
   Los segmentos radiales van SEGÚN EL ARCO: antes cada pedazo de 1 rad se hacía
   con las 24 divisiones de una vuelta entera (32 anillos × 3 pedazos × 24 = 2300
   caras al aire). Con el arco proporcional, el nivel 12 pasó de 20 a 27 fps en
   swiftshader sin que se note un solo borde recto. */
function addSeg(R,a0,len,red){
  const rs=Math.max(3,Math.round(len/TAU*40));
  const o=new T3.Mesh(new T3.CylinderGeometry(ROUT,ROUT,TH,rs,1,false,a0,len),
                      red?hazMats():mat(R.i%2?'#b9a1ff':'#a487f5'));
  R.grp.add(o);
  const inn=new T3.Mesh(new T3.CylinderGeometry(RIN,RIN,TH+.02,Math.max(3,Math.round(len/TAU*24)),1,true,a0,len),
                        mat(red?'#7c0d20':'#d9dfec'));
  R.grp.add(inn);
  let out=null;
  if(red){
    out=new T3.Mesh(new T3.CylinderGeometry(ROUT+.08,ROUT+.08,TH+.1,rs,1,false,a0-.025,len+.05),outMat());
    R.grp.add(out);
  }
  R.segs.push({a0,len,red,mesh:o,inn,out});
}
function buildLevel(n){
  while(tower.children.length)tower.remove(tower.children[0]);
  rings=[];frags=[];
  D=diff(n);grav=D.grav;
  const nr=D.nr;
  let prevHole=0;
  for(let i=0;i<nr;i++){
    const y=-i*RH-RH;
    const R={i,y,grp:new T3.Group(),segs:[],done:false,off:0,spin:0};
    R.grp.position.y=y;tower.add(R.grp);
    /* Los dos primeros anillos tienen el hueco CASI AL FRENTE: el jugador cae
       gratis mientras entiende el juego (y el nivel 12 no lo mata en 0,4 s). */
    const g1=i===0?rnd(-.3,.3):(i===1?prevHole+rnd(-.7,.7):rnd(0,TAU));
    prevHole=g1;
    const holes=[[g1,D.gap*rnd(.95,1.2)]];
    if(i>1&&Math.random()<D.twoP)holes.push([g1+Math.PI+rnd(-.45,.45),D.gap*rnd(.8,1)]);
    /* Los tramos son lo que queda entre huecos: se recorre el círculo.
       OJO: h[0] es el CENTRO del hueco, así que el corte empieza media anchura
       antes. Estaba `norm(h[0])+Math.PI` (sin restar la mitad y con media vuelta
       de más): el hueco del primer anillo terminaba EXACTAMENTE ATRÁS y la pelota
       arrancaba rebotando contra una pared — medido con la sonda: bounces=2 y
       passed=0 al segundo y medio de empezar el nivel 1, en las dos pantallas. */
    const cuts=holes.map(h=>({a:norm(h[0]-h[1]/2),l:h[1]})).sort((a,b)=>a.a-b.a);
    const spans=[];
    let a=cuts[cuts.length-1].a+cuts[cuts.length-1].l;
    for(const c of cuts){
      let len=c.a-a;while(len<0)len+=TAU;
      if(len>.10)spans.push({a0:a%TAU,len});
      a=c.a+c.l;
    }
    /* cada tramo se parte en pedazos de ~1 rad para poder pintar rojo alguno */
    const plan=[];
    spans.forEach(s=>{
      const parts=Math.max(1,Math.round(s.len/1.0));
      for(let p=0;p<parts;p++)
        plan.push({a0:s.a0+s.len*p/parts,len:s.len/parts,
                   red:i>2&&Math.random()<D.redP});   /* nunca rojo en los 3 primeros */
    });
    /* JUSTICIA: siempre queda al menos un tramo seguro donde rebotar */
    if(plan.length&&plan.every(p=>p.red))plan[rndi(0,plan.length-1)].red=false;
    plan.forEach(p=>addSeg(R,p.a0,p.len,p.red));
    rings.push(R);
  }
  /* anillos que giran solos (del 5 en adelante), nunca los tres primeros */
  const cand=[];for(let i=3;i<nr;i++)cand.push(i);
  for(let k=0;k<Math.min(D.spinN,cand.length);k++){
    const j=rndi(0,cand.length-1),i=cand.splice(j,1)[0];
    rings[i].spin=(Math.random()<.5?-1:1)*D.spinV*rnd(.8,1.25);
  }
  /* poste central y plato de meta */
  pole=new T3.Mesh(new T3.CylinderGeometry(RIN*.9,RIN*.9,nr*RH+RH*4,18),mat('#eef2f9'));
  pole.position.y=-(nr*RH)/2;tower.add(pole);
  goalY=-(nr+1)*RH;
  goalM=new T3.Mesh(new T3.CylinderGeometry(ROUT*1.25,ROUT*1.25,.3,26),mat('#8b5cf6'));
  goalM.position.y=goalY-.2;tower.add(goalM);
  const halo=new T3.Mesh(new T3.CylinderGeometry(ROUT*1.5,ROUT*1.5,.08,26),mat('#f6d76b'));
  halo.position.y=goalY-.4;tower.add(halo);
  total=nr;
  buildDeco(nr);
}
/* ------------------------------------------------- DECORADO (depende de gráficos)
   Cubos y prismas flotando alrededor: dan sensación de caída en los costados,
   que en apaisado quedan muy vacíos. La cantidad la manda ARC.gfxP().part. */
function buildDeco(nr){
  while(deco.children.length)deco.remove(deco.children[0]);
  props=[];
  const N=26;
  for(let i=0;i<N;i++){
    /* más lejos y más chicos que antes (r 5,4-10,5 y lado hasta .95): pegados a la
       torre tapaban el anillo de abajo y uno cruzaba el radar. Paleta del juego, sin
       el tostado que se leía como piedra suelta. */
    const a=rnd(0,TAU),r=rnd(7,13),y=-rnd(0,nr*RH+4);
    const s=rnd(.26,.72);
    const o=new T3.Mesh(new T3.BoxGeometry(s,s*rnd(.7,2.2),s),
      mat(pick(['#cbb7ff','#b9c8f0','#e6ecf7','#d9c2ff'])));
    o.position.set(Math.sin(a)*r,y,Math.cos(a)*r);
    o.rotation.set(rnd(0,TAU),rnd(0,TAU),rnd(0,TAU));
    deco.add(o);props.push({o,sp:rnd(-.5,.5),bob:rnd(0,TAU)});
  }
  applyDeco();
}
let decoN=26;
function applyDeco(){decoN=Math.round(props.length*clamp(decoK,.25,1.4));}
/* Recorte por distancia: una torre del nivel 12 son 32 anillos × 5 mallas. Sin
   esto se dibujan las 200 aunque estén 40 unidades más abajo (three sólo recorta
   por frustum, y con far=90 siguen "dentro"). Medido en swiftshader: 17 -> 30 fps. */
function cull(){
  for(const R of rings)R.grp.visible=(R.y>camY-15&&R.y<camY+7);
  for(let i=0;i<props.length;i++){
    const p=props[i];
    p.o.visible=i<decoN&&Math.abs(p.o.position.y-camY)<17;
  }
  if(goalM){const gv=goalY>camY-19;goalM.visible=gv;}
}
/* --------------------------------------------------------------- COLISIÓN
   ¿El frente (donde cae la pelota) pisa algún tramo de este anillo? Se compara
   el arco de la pelota [−BHALF,+BHALF] contra cada tramo, en el espacio del
   anillo (descontando la rotación de la torre Y la propia del anillo). */
function segAt(R,a){
  for(const s of R.segs){
    if(s.len<=0)continue;                    /* tramo ya roto: no colisiona */
    const d=norm(s.a0+s.len/2-a);            /* distancia al centro del tramo */
    if(Math.abs(d)<s.len/2+BHALF)return s;
  }
  return null;
}
function hitSeg(R){return segAt(R,norm(-rot-R.off));}
function ringTop(R){return R.y+TH/2;}

/* ------------------------------------------------------------------- ENTRADA */
function grab(p){drag={x:p.x,r:rotT,lx:p.x,t:ARC.t,v:0};botT=null;rotV=0;}
G.down=function(p){grab(p);};
G.move=function(p){
  if(!drag)return;
  rotT=drag.r+(p.x-drag.x)*G._sens;
  const dt=ARC.t-drag.t;
  if(dt>.004){                                  /* velocidad para la inercia */
    const inst=(p.x-drag.lx)*G._sens/dt;
    drag.v=lerp(drag.v,clamp(inst,-ROTVMAX,ROTVMAX),.55);
    drag.lx=p.x;drag.t=ARC.t;
  }
};
G.up=function(){
  if(drag)rotV=clamp(drag.v,-ROTVMAX,ROTVMAX);
  drag=null;
};
G.key=function(c,d){
  if(!d)return;
  if(c==='ArrowLeft'||c==='KeyA'){rotT-=.34;rotV=0;botT=null;}
  if(c==='ArrowRight'||c==='KeyD'){rotT+=.34;rotV=0;botT=null;}
};

/* --------------------------------------------------------------------- CICLO */
G.init=function(){
  T3=ARC.THREE;if(!T3)return;
  scene=new T3.Scene();
  scene.background=new T3.Color(G.sky);
  cam=new T3.PerspectiveCamera(46,ARC.W/Math.max(1,ARC.H),.1,90);
  scene.add(new T3.HemisphereLight(0xffffff,0xc3cfe6,1.0));
  const d=new T3.DirectionalLight(0xffffff,.6);d.position.set(4,10,7);scene.add(d);
  const d2=new T3.DirectionalLight(0xc9b3ff,.25);d2.position.set(-6,-2,-4);scene.add(d2);
  tower=new T3.Group();scene.add(tower);
  deco=new T3.Group();scene.add(deco);
  ballG=new T3.Group();scene.add(ballG);
  ballMesh=ballNode();
  ballG.add(ballMesh);
  G._sens=6.2/Math.max(320,ARC.W);
  if(ARC.gfxP)G.gfxApply(ARC.gfxP());
  /* Las sondas headless no tocan "TOCÁ PARA JUGAR" (miden el menú a los 3,5 s),
     así que con webdriver se entra solo. En un navegador de verdad el toque se
     mantiene: es el gesto que habilita el audio en el celular. */
  if(navigator.webdriver||/[?&]bot\b/.test(location.search))
    setTimeout(()=>{if(ARC.scr==='load'&&ARC.enterMenu)ARC.enterMenu();},250);
};
/* La pelota: GLB si llegó (facetada a mano, se le ve girar), icosaedro si no.
   El GLB viaja SIN material ni UV: la textura que devuelve image_to_3d es un atlas
   por cara y al simplificar la malla quedaba hecha confeti (se vio en la captura
   del visor), así que el modelo aporta sólo la silueta facetada y el color lo pone
   el juego — naranja mate con sombreado plano y la banda crema como malla aparte,
   igual que en el respaldo. Sin esto el GLB se dibuja NEGRO: sin materiales, el
   glTF por defecto es metálico y sin mapa de entorno no refleja nada. */
function ballNode(){
  const g=new T3.Group();
  const skin=new T3.MeshLambertMaterial({color:new T3.Color('#ff7a3d'),flatShading:true});
  const S=ARC.glb&&ARC.glb.pelota;
  let body=null;
  if(S&&S.scene){
    try{
      const o=S.scene.clone(true);
      o.traverse(k=>{if(k.isMesh)k.material=skin;});
      const b=new T3.Box3().setFromObject(o),s=new T3.Vector3();b.getSize(s);
      const k=(BR*2)/Math.max(.001,Math.max(s.x,s.y,s.z));
      o.scale.setScalar(k);
      const c=b.getCenter(new T3.Vector3()).multiplyScalar(k);
      o.position.set(-c.x,-c.y,-c.z);
      body=o;g.userData.glb=1;
    }catch(e){console.warn('pelota glb',e);}
  }
  if(!body)body=new T3.Mesh(new T3.IcosahedronGeometry(BR,1),skin);
  g.add(body);
  /* la banda va POR DENTRO del cuerpo (BR*.78): el GLB no es una esfera perfecta
     (1,82 x 1,90) y con BR*.94 asomaba como una medialuna blanca al costado */
  const band=new T3.Mesh(new T3.TorusGeometry(BR*.78,BR*.17,8,16),mat('#fff4e6'));
  band.rotation.x=Math.PI/2;
  g.add(band);
  return g;
}
G.resize=function(){
  if(cam){cam.aspect=ARC.W/Math.max(1,ARC.H);cam.updateProjectionMatrix();}
  G._sens=6.2/Math.max(320,ARC.W);
};
G.gfxApply=function(p){
  partK=p.part;decoK=p.part;
  if(scene){
    scene.fog=p.fog>0?new T3.Fog(new T3.Color(G.sky).getHex(),15*p.fog,40+16*p.fog):null;
  }
  if(props.length)applyDeco();
};
G.i18nDone=function(){if(ARC.alive)hud();};
function hud(){ARC.hud(passed,T('level')+' '+lvl+'  ·  '+passed+'/'+total);}

G.start=function(l){
  if(!T3)return;
  lvl=clamp(l||1,1,12);
  buildLevel(lvl);
  by=1.1;bvy=0;pby=by;rot=0;rotT=0;rotV=0;drag=null;botT=null;
  dead=false;won=false;endT=0;passed=0;combo=0;best=0;bounces=0;sq=0;sqV=0;
  startT=ARC.t;
  camY=by+1.6;camV=0;
  ballG.position.set(0,by,BZ);ballG.scale.set(1,1,1);
  ballG.rotation.set(0,0,0);
  placeCam(0);aimCam(camY);cam.updateMatrixWorld(true);
  hud();
  ARC.tray([
    {id:'lf',txt:'◀',gh:1,sq:1,fn:()=>{rotT-=.42;rotV=0;botT=null;}},
    {id:'rt',txt:'▶',gh:1,sq:1,fn:()=>{rotT+=.42;rotV=0;botT=null;}}
  ]);
};

/* ARRANQUE BLANDO: la gravedad entra al 50% y llega al 100% en 1,2 s. En el nivel
   12 (g=21,3) la pelota tardaba 0,44 s en llegar al primer anillo y 0,28 s entre
   anillo y anillo: el jugador veía la torre recién cuando ya estaba perdiendo.
   El bot usa la MISMA función para predecir, así no queda desfasado. */
function gEff(){return grav*clamp(.5+(ARC.t-startT)/1.2,.5,1);}

/* ---- rotación: dedo (rotT) + inercia (rotV) -> ángulo dibujado (rot) ---- */
function rotStep(dt){
  if(!drag){
    if(botT!=null){
      const d=norm(botT-rotT);
      rotT+=clamp(d,-BOTV*dt,BOTV*dt);
    }else if(rotV){
      rotT+=rotV*dt;
      rotV*=Math.exp(-SPINFRIC*dt);
      if(Math.abs(rotV)<.04)rotV=0;
    }
  }
  const k=1-Math.exp(-SPINROT*dt);
  const before=rot;
  rot+=norm(rotT-rot)*k;
  spinAcc=(rot-before)/Math.max(.0001,dt);
}
/* ---- cámara: resorte casi crítico + ADELANTO según velocidad de caída ----
   El adelanto (bvy*.085) es lo que hace que el hueco de abajo esté en cuadro:
   cuanto más rápido cae, más abajo mira. Con seguimiento duro (lerp .14 por
   cuadro, como estaba) la cámara pegaba un tirón en cada rebote. */
function placeCam(dt){
  const tgt=by+1.7+clamp(bvy,-VMAX,0)*.10;
  if(dt<=0){camY=tgt;camV=0;pcamY=tgt;}
  else{
    const k=52,c=2*Math.sqrt(k)*1.02;
    camV+=(-(camY-tgt)*k-camV*c)*dt;
    camY+=camV*dt;
  }
}
/* Inclinación: 20° para abajo (antes 18°) y un paso más atrás. Con esto el anillo
   que viene cae a media pantalla y el siguiente a 0,8 de alto: se VE el hueco de
   abajo, que era el pedido. Medido con dbg.nx (dónde cae el próximo anillo en
   pantalla): antes p90 0,92 y 10 cuadros fuera de cuadro por partida; ahora p90
   0,6 y ninguno. */
function aimCam(y){
  cam.position.set(0,y,8.4);
  cam.lookAt(0,y-3.1,0);
}
/* pantalla de la pelota (para que las partículas salgan DE la pelota) */
function ballScreen(){
  if(!cam)return{x:ARC.W/2,y:ARC.H/2};
  const v=new T3.Vector3(0,by,BZ).project(cam);
  return{x:(v.x*.5+.5)*ARC.W,y:(-v.y*.5+.5)*ARC.H};
}

G.step=function(dt){
  if(!T3||!scene)return;
  prot=rot;pcamY=camY;
  rotStep(dt);
  /* anillos que giran solos */
  for(const R of rings)if(R.spin){R.off+=R.spin*dt;R.grp.rotation.y=R.off;}
  tower.rotation.y=rot;
  deco.rotation.y=rot*.32;                        /* paralaje: el fondo gira menos */
  for(const p of props){p.bob+=dt;p.o.rotation.y+=p.sp*dt;}

  /* ---- física de la pelota (paso fijo, velocidad terminal) ---- */
  pby=by;
  bvy=Math.max(-VMAX,bvy-gEff()*dt);
  by+=bvy*dt;
  if(by<goalY-6)by=goalY-6;                       /* no seguir cayendo al vacío */

  if(!dead&&!won){
    /* cruce de plano: fondo de la pelota antes y ahora */
    const b0=pby-BR,b1=by-BR;
    for(const R of rings){
      const top=ringTop(R);
      if(R.done||bvy>=0||b0<top||b1>top)continue;
      const s=hitSeg(R);
      if(!s){                                     /* pasó por el hueco */
        R.done=true;passed++;combo++;best=Math.max(best,combo);
        const sp=ballScreen();
        ARC.sfx('swipe',{vol:.22,rate:clamp(1+combo*.04,1,1.7)});   /* medido: rms .205, es fuerte */
        ARC.sfx('pop',{vol:.55,rate:clamp(1+combo*.055,1,2)});
        if(partK>.4)ARC.fx.ring(sp.x,sp.y,{r:70*(.6+partK*.5),life:.3,color:'#c9a7ff',w:4});
        if(combo>1)ARC.fx.text(sp.x,sp.y-ARC.H*.14,'x'+combo,{color:'#8b5cf6',size:Math.max(16,ARC.H*.055),life:.55});
        if(combo&&combo%5===0){ARC.sfx('chime',{vol:.5});ARC.toast(T('streak')+' '+combo);}
        hud();
        continue;
      }
      if(s.red){die(R,s);break;}
      /* ---- REBOTE: restitución con techo, para no volver arriba del anillo ---- */
      by=top+BR;
      const imp=Math.abs(bvy);
      bvy=clamp(imp*.6,4.5,7.2);
      bounces++;combo=0;
      sq=-clamp(.28+imp*.026,.28,.62);sqV=0;      /* squash */
      const sp=ballScreen();
      ARC.sfx('wood',{vol:.5,rate:clamp(.86+imp*.026,.85,1.5)});
      ARC.vib(8);
      ARC.fx.burst(sp.x,sp.y+ARC.H*.02,{n:Math.round(7*partK)+3,color:'#ffffff',speed:130,
        size:Math.max(2,ARC.H*.008),life:.28,g:420,a:-Math.PI/2});
      ARC.fx.burst(sp.x,sp.y+ARC.H*.02,{n:Math.round(4*partK)+2,color:'#c9a7ff',
        speed:90,size:Math.max(2,ARC.H*.006),life:.36,g:300,sq:1});
      if(imp>13)ARC.shake(Math.min(7,imp*.35));
      break;
    }
    /* ---- meta ---- */
    if(!won&&by-BR<=goalY+.3){
      won=true;endT=ARC.t;
      by=goalY+.3+BR;bvy=5.2;                     /* rebote de festejo en el plato */
      sq=-.5;sqV=0;
      const sp=ballScreen();
      ARC.fx.ring(sp.x,sp.y,{r:ARC.W*.5,life:.6,color:'#f6d76b',w:7});
      ARC.fx.burst(sp.x,sp.y,{n:Math.round(26*partK)+8,color:'#f6d76b',speed:300,
        size:Math.max(3,ARC.H*.011),life:.8,sq:1});
      ARC.sfx('power',{vol:.7});
    }
  }
  /* squash/stretch: resorte que vuelve a 0 y sobrepasa (da el "boing") */
  sqV+=(-sq*180-sqV*13)*dt;sq+=sqV*dt;
  const st=clamp(-bvy,0,VMAX)/VMAX*.16;           /* estirado por velocidad */
  const s=clamp(sq,-.62,.34)+st;
  ballG.scale.set(1-s*.48,1+s,1-s*.48);
  ballG.position.set(0,by,BZ);                    /* draw() lo interpola con alpha */
  ballG.rotation.z-=spinAcc*dt*(BZ/BR)*.35;       /* rueda con el giro de la torre */
  ballG.rotation.x-=Math.abs(bvy)*dt*.55;
  /* pulso del rojo (los dos materiales: costado y tapa) */
  if(HAZ){
    const e=.12+.10*Math.sin(ARC.t*5.2);
    HAZ.emissiveIntensity=e;if(HAZC)HAZC.emissiveIntensity=e+.04;
  }
  /* pedazos del tramo roto */
  for(const f of frags){
    f.o.position.x+=f.vx*dt;f.o.position.y+=f.vy*dt;f.o.position.z+=f.vz*dt;
    f.vy-=13*dt;
    f.o.rotation.x+=f.rx*dt;f.o.rotation.z+=f.rz*dt;
    f.o.scale.multiplyScalar(1-1.1*dt);
  }
  placeCam(dt);
  /* ---- cierre (con ARC.t, no setTimeout: la pausa no lo desincroniza) ---- */
  if(dead&&ARC.t-endT>.95){
    dead=false;
    ARC.over({win:false,score:passed,stars:0,title:T('dTtl'),
      sub:T('dSub')+'<br>'+T('sRings')+': '+passed+'/'+total+' · '+T('sStreak')+': '+best});
  }else if(won&&ARC.t-endT>.6){
    won=false;
    /* ESTRELLAS POR RACHA (anillos seguidos sin rebotar). Bajar de .7/.4 a .6/.3
       no es capricho: en el nivel 12 son 32 anillos y .7 pedía 23 huecos
       encadenados; el bot, jugando bien, llega a 14-18. Bajar y regalar la
       tercera con CERO rebotes deja las 3 estrellas difíciles pero posibles. */
    const st3=(bounces===0||best>=Math.ceil(total*.6))?3:(best>=Math.ceil(total*.3)?2:1);
    ARC.over({win:true,score:passed,stars:st3,coins:15+lvl*5+best*2,
      sub:(bounces===0?'<b>'+T('perfect')+'</b><br>':'')+
        T('sStreak')+': '+best+' · '+T('sBounce')+': '+bounces+
        '<br>★★★ '+T('streak')+' '+Math.ceil(total*.6)});
  }
};
/* ---- muerte: el tramo rojo SE QUIEBRA y la pelota sigue cayendo ---- */
function die(R,s){
  dead=true;endT=ARC.t;
  lastAim='MURIO en anillo '+R.i+' a '+bvy.toFixed(1)+' u/s | ultima decision: '+lastAim;
  bvy=-4;                                          /* pierde impulso, no rebota */
  const sp=ballScreen();
  ARC.sfx('glass',{vol:.9});
  ARC.sfx('lose',{vol:.7});
  ARC.shake(13);ARC.vib(60);
  ARC.fx.burst(sp.x,sp.y,{n:Math.round(24*partK)+10,color:'#ff3b57',speed:280,
    size:Math.max(3,ARC.H*.012),life:.7,sq:1});
  ARC.fx.text(ARC.W/2,ARC.H*.3,T('dTtl'),{color:'#ff5d73',size:Math.max(20,ARC.H*.08),life:.9});
  /* los pedazos salen volando: el tramo rojo deja de existir */
  [s.mesh,s.inn,s.out].forEach(o=>{
    if(!o)return;
    frags.push({o,vx:rnd(-2.4,2.4),vy:rnd(1.6,4.4),vz:rnd(-2.4,2.4),
      rx:rnd(-6,6),rz:rnd(-6,6)});
  });
  s.len=0;                                         /* ya no colisiona */
}

/* --------------------------------------------------------------------- DIBUJO */
G.draw=function(g,alpha){
  if(!ARC.rnd||!scene||!cam)return;
  /* INTERPOLACIÓN: la simulación va a 60 Hz fijos; en una pantalla de 120 Hz sin
     esto la pelota avanza de a dos cuadros y se ve escalonada. */
  const a=clamp(alpha||0,0,1);
  ballG.position.y=lerp(pby,by,a);
  tower.rotation.y=lerp(prot,prot+norm(rot-prot),a);
  deco.rotation.y=tower.rotation.y*.32;
  aimCam(lerp(pcamY,camY,a));
  cull();
  ARC.rnd.render(scene,cam);
  const W=ARC.W,H=ARC.H;
  /* ---- barra de profundidad: vertical, a la derecha (abajo = fondo) ---- */
  const bx=W-Math.max(7,W*.016),y0=H*.20,y1=H*.80,bw=Math.max(4,H*.012);
  g.fillStyle='rgba(20,24,34,.20)';g.fillRect(bx-bw/2,y0,bw,y1-y0);
  const pk=clamp(passed/Math.max(1,total),0,1);
  g.fillStyle='#8b5cf6';g.fillRect(bx-bw/2,y0,bw,(y1-y0)*pk);
  g.fillStyle='#f6d76b';g.fillRect(bx-bw*1.1,y0+(y1-y0)*pk-1,bw*2.2,Math.max(2,H*.007));
  /* ---- RADAR del próximo anillo (abajo a la izquierda) ---- */
  drawRadar(g);
  /* ---- ayuda de los primeros segundos ---- */
  if(passed===0&&!dead&&ARC.t-startT<6.5){
    const al=clamp(6.5-(ARC.t-startT),0,1);
    g.globalAlpha=al;
    g.textAlign='center';
    g.fillStyle='rgba(18,22,32,.9)';
    g.font='900 '+Math.max(12,H*.045)+'px system-ui,sans-serif';
    g.fillText(T('hint'),W/2,H*.135);
    g.fillStyle='rgba(200,45,70,.95)';
    g.font='900 '+Math.max(10,H*.032)+'px system-ui,sans-serif';
    g.fillText(T('hint2'),W/2,H*.185);
    g.textAlign='left';g.globalAlpha=1;
  }
};
/* El radar despliega los anillos que vienen: el centro es el FRENTE (donde cae la
   pelota). Es la diferencia entre jugar y adivinar cuando el anillo queda tapado
   por el que está encima.
   DOS FILAS, no una: la de abajo (gruesa) es el anillo que viene y la de arriba
   (finita) el siguiente. Con una sola fila, pasar un hueco y encontrarse rojo
   debajo era una muerte imposible de prever; con la segunda fila se decide ANTES
   de soltarse (y es la misma información que usa el bot para frenar). */
function drawRadar(g){
  const W=ARC.W,H=ARC.H;
  const i0=rings.findIndex(r=>!r.done&&ringTop(r)<by-BR);
  const bw=W*.30,bx=W*.055,byy=H*.885,bh=Math.max(8,H*.028);
  const bh2=Math.max(4,bh*.5),by2=byy-bh2-Math.max(2,H*.007);
  const put=(w0,len,col,yy,hh)=>{
    /* w0 = ángulo mundial del comienzo; se corta en ±π */
    let a=norm(w0),l=len;
    while(l>0){
      const seg=Math.min(l,Math.PI-a);
      const x0=bx+((a+Math.PI)/TAU)*bw,x1=bx+((a+seg+Math.PI)/TAU)*bw;
      g.fillStyle=col;g.fillRect(x0,yy+1,Math.max(1.5,x1-x0),hh-2);
      l-=seg;a=-Math.PI;
    }
  };
  const row=(R,yy,hh,al,safe)=>{
    g.globalAlpha=al;
    g.fillStyle='rgba(16,20,30,.34)';
    g.beginPath();g.roundRect?g.roundRect(bx,yy,bw,hh,hh/2):g.rect(bx,yy,bw,hh);g.fill();
    if(R){
      for(const s of R.segs){
        if(s.len<=0)continue;
        put(s.a0+rot+R.off,s.len,s.red?'#ff3b57':safe,yy,hh);
      }
      if(R.spin){g.fillStyle='#f6d76b';g.font='900 '+Math.max(8,H*.022)+'px system-ui,sans-serif';
        g.fillText('↻',bx+bw+4,yy+hh);}
    }
    g.globalAlpha=1;
  };
  row(i0>=0?rings[i0+1]:null,by2,bh2,.62,'rgba(190,170,255,.55)');
  row(i0>=0?rings[i0]:null,byy,bh,1,'rgba(190,170,255,.92)');
  /* marca del frente = la pelota, cruzando las dos filas */
  const cx=bx+bw/2;
  g.fillStyle='#ff7a3d';
  g.fillRect(cx-1.5,by2-3,3,byy+bh+3-(by2-3));
  g.fillStyle='rgba(255,255,255,.75)';
  g.font='700 '+Math.max(8,H*.021)+'px system-ui,sans-serif';
  g.fillText(T('next'),bx,by2-Math.max(4,H*.012));
}

/* ------------------------------------------------------------------- SONDA */
/* nx = dónde cae EN PANTALLA el próximo anillo (0 = borde de arriba, 1 = borde de
   abajo). Es la forma de comprobar sin ojo humano que la cámara "muestra el hueco
   de abajo": si nx pasa de 1 el jugador está cayendo a ciegas. */
function nextScr(){
  const R=rings.find(r=>!r.done&&ringTop(r)<by-BR);
  if(!R||!cam)return null;
  const v=new T3.Vector3(0,R.y,BZ).project(cam);
  return +(-v.y*.5+.5).toFixed(2);
}
G.dbg={
  state:()=>({passed,total,dead,won,by:+by.toFixed(2),vy:+bvy.toFixed(1),lvl,combo,best,bounces,
    rot:+rot.toFixed(2),rotT:+rotT.toFixed(2),rotV:+rotV.toFixed(2),cam:+camY.toFixed(2),nx:nextScr(),
    sq:+(ballG?ballG.scale.y:1).toFixed(2),
    dif:D.nr?('anillos '+D.nr+' / hueco '+D.gap.toFixed(2)+' / rojo '+D.redP.toFixed(2)+
      ' / giran '+D.spinN+' / g '+D.grav.toFixed(1)):'',
    props:props.filter(p=>p.o.visible).length,aim:lastAim}),
  /* Juega de verdad: apunta al hueco MÁS CERCANO del próximo anillo y, si no le
     da el tiempo de giro, se conforma con un tramo SEGURO (rebotar y seguir). */
  autoMove:()=>{
    if(!rings.length)return false;
    if(dead||won)return false;
    const R=rings.find(r=>!r.done&&ringTop(r)<by-BR);
    if(!R)return false;
    /* Tiempo hasta el plano del anillo, CONTANDO la subida si viene rebotando:
       .5·g·t² − bvy·t − d = 0. Con la fórmula de sólo caída (la primera versión)
       el bot creía que nunca llegaba a tiempo, elegía rebotar y se quedaba
       clavado: 1 anillo y 18 rebotes en 7 s (medido con la sonda). */
    const d=Math.max(0,(by-BR)-ringTop(R));
    const gv=gEff();
    const tt=(bvy+Math.sqrt(bvy*bvy+2*gv*d))/gv;
    /* Se razona en el marco del anillo TAL COMO VA A ESTAR al chocar: si el anillo
       gira solo, con su ángulo de ahora el bot apuntaba 0,26 rad al costado. */
    const offAt=R.off+R.spin*tt;
    const front=norm(-rot-offAt);
    /* huecos = lo que queda entre tramos vivos, ordenados por ángulo */
    const segs=R.segs.filter(s=>s.len>0).slice().sort((a,b)=>norm(a.a0)-norm(b.a0));
    const holes=[];
    if(!segs.length)holes.push({c:front,l:TAU});
    else for(let i=0;i<segs.length;i++){
      const a=segs[i],b=segs[(i+1)%segs.length];
      /* OJO con el épsilon: entre dos pedazos pegados el hueco da −1e−16 y sin el
         umbral se convertía en un hueco de TAU (el bot apuntaba a cualquier lado
         y se quedaba rebotando). */
      let gap=segs.length===1?TAU-a.len:b.a0-(a.a0+a.len);
      while(gap<-1e-4)gap+=TAU;
      if(gap<0)gap=0;
      /* margen: el bot no enhebra agujas. El suavizado de rotación llega con
         hasta .2 rad de atraso y por ahí se moría al lado del hueco. */
      if(gap>BHALF*2+.24)holes.push({c:norm(a.a0+a.len+gap/2),l:gap});
    }
    const near=(list,ref,pen)=>{
      let o=null,d=1e9;
      for(const h of list){
        let dd=Math.abs(norm(h.c-ref));
        if(pen)dd+=pen(h.c);
        if(dd<d){d=dd;o=h;}
      }
      return o?{c:o.c,d:Math.abs(norm(o.c-ref))}:null;
    };
    /* Un anillo de anticipación: si pasar por ese hueco deja el frente sobre ROJO
       en el anillo siguiente, se penaliza. Es lo que hace un jugador bueno cuando
       ya viene cayendo rápido y no va a llegar a corregir. */
    const R2=rings[R.i+1];
    /* Se mira una VENTANA de ±.22 rad alrededor del punto de llegada, no un punto:
       el suavizado de rotación deja la pelota a un pelo del centro del hueco y con
       la comprobación puntual el bot "veía seguro" un anillo cuyo tramo rojo
       empezaba .15 rad más allá. Con la ventana, el nivel 12 pasó de 9 a 26
       anillos antes de morir. */
    const redNear=(RR,a)=>{
      for(const dd of [0,.22,-.22]){const s2=segAt(RR,norm(a+dd));if(s2&&s2.red)return true;}
      return false;
    };
    const pen=c=>{
      if(!R2)return 0;
      return redNear(R2,c+offAt-(R2.off+R2.spin*(tt+RH/Math.max(2,-bvy+3))))?5:0;
    };
    const aim=near(holes,front,pen);
    if(!aim)return false;
    /* ¿A dónde llegaría el frente cuando la pelota toque el plano? Si ahí hay
       ROJO, se corrige al tramo seguro más cercano A ESE punto (no al de ahora:
       eligiendo "el seguro más cercano a mí" el bot se quedaba rebotando en el
       mismo tramo para siempre — medido: 25 rebotes y 8 s clavado en el nivel 12). */
    const land=norm(front+clamp(norm(aim.c-front),-BOTV*.85*tt,BOTV*.85*tt));
    const s=segAt(R,land);
    /* FRENO: si pasar el hueco deja el frente sobre rojo en el anillo siguiente y
       la pelota ya viene tan rápido que no va a llegar a corregir, lo correcto es
       NO pasar: rebotar contra un tramo seguro corta la velocidad y desde ahí sí
       se llega. Sin esto el bot moría a los 3 s en el nivel 6 encadenando huecos. */
    const vHit=Math.sqrt(Math.max(0,bvy*bvy+2*gv*d));
    const tNext=RH/Math.max(1.5,vHit);
    const brake=!!(R2&&pen(aim.c)&&tNext<.34);
    let goal=aim.c,why=s?(s.red?'rojo, esquiva':'tramo'):'hueco';
    if((s&&s.red)||brake){
      const safe=segs.filter(x=>!x.red).map(x=>({c:norm(x.a0+x.len/2)}));
      const alt=near(safe,brake?front:land);
      if(alt){goal=alt.c;why=brake?'frena en tramo seguro':'rojo, esquiva';}
    }
    lastAim='anillo '+R.i+' frente '+front.toFixed(2)+' huecos '+holes.length+
      ' -> '+goal.toFixed(2)+' ('+why+') t '+tt.toFixed(2);
    /* poner el ángulo elegido al frente: frente = −rot−off  ->  rot = −c−off */
    botT=-goal-offAt;
    drag=null;rotV=0;
    return true;
  }
};
window.GAME=G;

window.ARC=ARC;window.GAME=GAME;
ARC.boot();
