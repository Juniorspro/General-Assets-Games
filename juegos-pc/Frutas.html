<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FRUTAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07070b;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#f2eee6;user-select:none;-webkit-user-select:none;touch-action:none}

/* ══════════ EL MARCO ES VERTICAL Y NO SE GIRA ══════════
   Al revés de los juegos 3D de este repo, que se dibujan apaisados adentro de un
   teléfono vertical. Un casual se juega con el teléfono como uno lo tiene y un
   solo pulgar: girarlo sería pedirle al jugador que cambie de postura.
   El lienzo se dibuja con el ANCHO clavado en 720 y el alto según la forma de
   la pantalla —lo calcula `medir()`— así que el marco la llena entera y una
   ficha de 40 px mide lo mismo en un teléfono de 360 y en uno de 1440. */
#caja{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  overflow:hidden;background:#000;--ac:#f2eee6}
canvas{display:block;width:100%;height:100%}
/* ══════════ EL TELON DEL MENU ══════════
   En el menu el lienzo no dibuja nada, asi que sin esto el menu es un panel
   gris sobre negro — o sea la pantalla de opciones de cualquier cosa. Es el
   MISMO fondo generado que usa la partida, asi que el menu y el juego se ven
   del mismo sitio, y va en DOM y no en el lienzo porque no hay que redibujarlo
   sesenta veces por segundo para que quede quieto.
   ── Y NO RECIBE TOQUES, QUE ES LO QUE ROMPIO EL JUEGO UNA VEZ ──
   Un elemento con `opacity:0` SIGUE RECIBIENDO el dedo. Medido con
   `elementFromPoint` en el medio de la pantalla y en partida: lo que estaba
   debajo del dedo era `tela` y no el lienzo, o sea que NINGUN toque llegaba al
   juego. Y no lo vio ninguna sonda, porque las sondas llaman a `JUEGO.baja`
   directo y se saltean todo el camino entre el dedo y el juego. */
#tela{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;
  transition:opacity .6s;z-index:1;pointer-events:none}
#tela.on{opacity:1}

/* ══════════ LO QUE VA EN DOM Y LO QUE VA EN EL LIENZO ══════════
   En el lienzo: el juego y las cinemáticas. En DOM: sólo el texto que hay que
   TRADUCIR y que tiene que quedar nítido en cualquier densidad de pantalla.
   Un texto dibujado en un lienzo de 720 se ve borroso en un teléfono de 1440, y
   el nombre del juego es justo lo que se mira primero. */
.pan{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:2.6vh;padding:6vw;text-align:center;z-index:5;
  background:linear-gradient(180deg,rgba(7,7,11,.34) 0%,rgba(7,7,11,.74) 44%,
    rgba(7,7,11,.93) 100%)}
.pan.on{display:flex}
/* ── EL TAMAÑO DEL TÍTULO SALE DEL LARGO DEL NOMBRE ──
   Con 11vw clavado, un nombre de diez letras —con un cuarto de em de espaciado
   entre cada una— mide mas que el marco y sale CORTADO por los dos lados.
   `--h1` lo calcula el arranque a partir de la cantidad de letras, así que el
   próximo nombre largo entra solo. */
.pan h1{font-size:clamp(26px,var(--h1,11vw),64px);letter-spacing:.26em;font-weight:800;
  text-indent:.26em;line-height:1;
  text-shadow:0 0 30px var(--ac),0 4px 22px #000}
.em{width:clamp(90px,27vw,158px);height:auto;margin-bottom:-1.4vh;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.75))}
.em[hidden]{display:none}
#pFin h1{font-size:clamp(24px,7.5vw,42px);letter-spacing:.16em;text-indent:.16em}
.pan p{font-size:clamp(12px,3.4vw,17px);line-height:1.6;opacity:.62;max-width:24em}
.fila{display:flex;gap:2.6vw;flex-wrap:wrap;justify-content:center}
.bt{appearance:none;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.05);
  color:inherit;font:inherit;font-size:clamp(12px,3.5vw,16px);font-weight:700;
  letter-spacing:.16em;padding:1.5vh 5.5vw;border-radius:999px;cursor:pointer}
.bt.p{background:var(--ac);color:#0b0b10;border-color:var(--ac)}
.bt:disabled{opacity:.34}
.bt.ch{padding:.9vh 3.4vw;font-size:11px;letter-spacing:.12em}

/* ══════════ EL SELECTOR DE NIVELES ══════════
   Los tres juegos de niveles necesitan una reja con el progreso: qué está
   abierto, cuántas estrellas dio cada uno. Y tiene que poder DESLIZARSE, porque
   son doscientos niveles y en un teléfono entran veinte por pantalla.
   `justify-content:flex-start` a propósito: centrado, con la reja más alta que
   el marco, el navegador recorta por ARRIBA y las primeras filas quedan
   inalcanzables — un defecto clásico de flex con overflow. */
#pNiveles{justify-content:flex-start;padding-top:4vh;gap:1.8vh}
#rejaN{display:grid;grid-template-columns:repeat(5,1fr);gap:2.2vw;width:100%;
  max-width:520px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;padding:1vh .5vw 3vh}
.nv{position:relative;aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-weight:800;font-size:clamp(13px,4vw,19px);color:inherit;font-family:inherit}
.nv.hecho{border-color:var(--ac);background:rgba(255,255,255,.10)}
.nv.trabado{opacity:.26;cursor:default}
.nv .es{font-size:9px;letter-spacing:.08em;color:#ffd76a;line-height:1;height:9px}
#tituN{font-size:clamp(15px,4.6vw,22px);letter-spacing:.2em;font-weight:800}

/* ══════════ EL HUD ══════════
   Arriba el número grande —los puntos en los de puntaje, el nivel en los de
   niveles— y debajo su rótulo. A los costados, dos fichas chicas para lo que
   cambia dentro del nivel (movimientos, burbujas que quedan). */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:4}
#hud.on{opacity:1}
#marca{position:absolute;top:2.2vh;left:0;right:0;text-align:center;
  font-size:clamp(28px,9.4vw,54px);font-weight:800;letter-spacing:.04em;
  text-shadow:0 3px 18px rgba(0,0,0,.75)}
#sub{position:absolute;top:calc(2.2vh + 10.6vw);left:0;right:0;text-align:center;
  font-size:clamp(10px,3vw,14px);letter-spacing:.28em;opacity:.55}
.fic{position:absolute;top:2.4vh;font-size:clamp(10px,3vw,14px);letter-spacing:.14em;
  font-weight:700;opacity:.72;padding:.7vh 3vw;border-radius:999px;
  background:rgba(7,7,11,.5);border:1px solid rgba(255,255,255,.12)}
#ficI{left:3.5vw}
#ficD{right:3.5vw}
.fic[hidden]{display:none}
/* ── LA FICHA DEL MULTIPLICADOR ──
   Debajo del marcador y con su propia barrita: la barra es la ventana de la
   racha, o sea el tiempo que queda para que el próximo acierto la sostenga. Sin
   la barra, la racha se corta sola y el jugador no sabe por qué. */
#combo{position:absolute;top:calc(2.2vh + 15vw);left:0;right:0;text-align:center;
  font-size:clamp(18px,6vw,34px);font-weight:800;letter-spacing:.06em;
  color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.6),0 3px 12px #000;
  opacity:0;transform:scale(.7);transition:opacity .18s,transform .18s}
#combo.on{opacity:1;transform:scale(1)}
#comboV{position:absolute;top:calc(2.2vh + 22vw);left:38%;right:38%;height:4px;
  background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden;
  opacity:0;transition:opacity .18s}
#combo.on ~ #comboV{opacity:.8}
#comboB{height:100%;width:0;background:#ffd76a}
#reloj{position:absolute;left:12%;right:12%;bottom:3.2vh;height:6px;
  background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
/* ── Y SUBE CUANDO HAY FILA DE BOTONES ──
   Medido con `cajas()` en BURBUJAS: el reloj caia en y 857 y la fila de botones
   ocupaba de 840 a 871, o sea la barra dibujada por ENCIMA de DESHACER. Los dos
   viven anclados abajo y ninguno sabia del otro. */
body.conAcc #reloj{bottom:9.6vh}
#relojB{height:100%;width:100%;background:#f2eee6}
#relojB.poco{background:#e0553f}
/* ══════════ LOS BOTONES DE PARTIDA ══════════
   DESHACER y REINICIAR sólo existen en los juegos de niveles, y son la mitad de
   lo que hace que un rompecabezas se pueda jugar: sin deshacer, un movimiento
   mal pensado cuesta el nivel entero y el jugador cierra el juego. Van con
   `pointer-events:auto` porque el HUD entero está en `none` — si no, el botón
   se ve y no se puede tocar, que es exactamente el defecto que ya costó una
   vuelta con el telón. */
#acc{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;gap:3vw;
  justify-content:center;pointer-events:auto}
#acc[hidden]{display:none}
#acc .bt{background:rgba(7,7,11,.62)}
/* ── Y NO RECIBEN EL DEDO CON EL HUD APAGADO ──
   `#hud` va a `opacity:0` entre partidas, y un elemento invisible SIGUE
   RECIBIENDO toques: con `pointer-events:auto` clavado, los tres botones se
   quedarían comiendo el dedo por encima del menú. Es exactamente el defecto que
   ya dejó un juego sin poder empezar, y ahí lo causaba el telón. */
#hud:not(.on) #acc{pointer-events:none}

/* el pie de la cinemática: el único texto de una cinemática, y va en DOM por lo
   mismo que el título — hay que poder traducirlo y tiene que leerse */
#cine{position:absolute;left:8%;right:8%;bottom:9vh;text-align:center;z-index:5;
  font-size:clamp(13px,3.8vw,19px);line-height:1.5;opacity:0;transition:opacity .5s;
  text-shadow:0 2px 16px #000;pointer-events:none}
#cine.on{opacity:.96}
#salta{position:absolute;right:4vw;top:3vh;z-index:6;font-size:11px;letter-spacing:.2em;
  opacity:0;transition:opacity .4s;pointer-events:none}
#salta.on{opacity:.4}

#estr{font-size:clamp(22px,7vw,38px);letter-spacing:.18em;color:#ffd76a;
  text-shadow:0 0 20px rgba(255,215,106,.55)}
#estr[hidden]{display:none}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#velo{position:absolute;inset:0;background:#07070b;opacity:0;pointer-events:none;
  z-index:6;transition:opacity .45s}
#velo.on{opacity:1}
</style></head><body>
<div id="caja">
  <canvas id="c"></canvas>
  <div id="tela"></div>
  <div id="hud">
    <div id="marca">0</div>
    <div id="sub"></div>
    <div class="fic" id="ficI" hidden></div>
    <div class="fic" id="ficD" hidden></div>
    <div id="combo"></div>
    <div id="comboV"><div id="comboB"></div></div>
    <div id="reloj"><div id="relojB"></div></div>
    <div id="acc" hidden>
      <button class="bt ch" id="bDes" data-i18n="deshacer"></button>
      <button class="bt ch" id="bRei" data-i18n="reiniciar"></button>
      <button class="bt ch" id="bSal" data-i18n="salir"></button>
    </div>
  </div>
  <div id="cine"></div>
  <div id="salta"></div>
  <div id="velo"></div>
  <div id="flash"></div>

  <div class="pan on" id="pIdioma">
    <img class="em" id="emI" alt="" hidden>
    <h1>FRUTAS</h1>
    <div class="fila">
      <button class="bt p" data-lang="es">ESPAÑOL</button>
      <button class="bt" data-lang="en">ENGLISH</button>
      <button class="bt" data-lang="pt">PORTUGUÊS</button>
    </div>
  </div>

  <div class="pan" id="pMenu">
    <img class="em" id="emM" alt="" hidden>
    <h1>FRUTAS</h1>
    <p data-i18n="sub"></p>
    <div class="fila">
      <button class="bt p" id="bJugar" data-i18n="jugar"></button>
      <button class="bt" id="bComo" data-i18n="como"></button>
    </div>
    <p id="mejor" style="opacity:.42;letter-spacing:.2em;font-size:12px"></p>
    <div class="fila" style="gap:1.8vw">
      <button class="bt ch" data-lang="es">ES</button>
      <button class="bt ch" data-lang="en">EN</button>
      <button class="bt ch" data-lang="pt">PT</button>
    </div>
  </div>

  <div class="pan" id="pNiveles">
    <div id="tituN" data-i18n="niveles"></div>
    <div id="rejaN"></div>
    <div class="fila"><button class="bt ch" id="bNMenu" data-i18n="menu"></button></div>
  </div>

  <div class="pan" id="pFin">
    <h1 id="finT"></h1>
    <div id="estr" hidden></div>
    <p id="finP"></p>
    <div class="fila">
      <button class="bt p" id="bOtra" data-i18n="otra"></button>
      <button class="bt" id="bMenu" data-i18n="menu"></button>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{}}</script>
<script type="module">
/* ══════════════════════ EL MARCO Y EL RELOJ ══════════════════════ */
const $ = (i) => document.getElementById(i);

/* ── EL ANCHO DE DISEÑO ES FIJO Y EL ALTO NO ──
   Todo lo que un juego escribe —una posición, un radio, un tamaño de letra—
   está en unidades de diseño con el ancho clavado en 720, así que una moneda de
   40 px mide lo mismo en un teléfono de 360 y en uno de 1440. Eso es lo que
   evita el defecto que aparece sólo en un tamaño de pantalla y que nadie puede
   reproducir.

   PERO EL ALTO NO PUEDE SER FIJO, y eso se vio en la primera captura: con
   720×1280 clavado —9:16, la relación de un teléfono de 2016— en un teléfono de
   hoy (412×892, o sea 0,46) el marco entraba por el ancho y quedaban DOS BANDAS
   NEGRAS arriba y abajo. Un minijuego que se abre adentro de TikTok tiene que
   ocupar la pantalla entera; una banda negra se lee a que el juego está roto.
   Así que el alto se calcula de la pantalla y los juegos lo leen: lo que se
   ancla abajo se escribe como `AL - algo`, no como un número. Se topa arriba y
   abajo para que una ventana de escritorio muy ancha o muy alta no deforme el
   diseño — ahí sí quedan bandas, y ahí sí corresponde. */
const AN = 720;
let AL = 1280;
const AL_MIN = 1100, AL_MAX = 1760;

const lienzo = $('c');
const g = lienzo.getContext('2d');
const caja = $('caja');
let ESC = 1, DPR = 1;

function medir(){
  const vw = window.innerWidth, vh = window.innerHeight;
  /* el alto de diseño sale de la forma de la pantalla, así que el marco la llena
     entera y no hay bandas */
  let e = vw / AN;
  AL = Math.round(vh / e);
  if (AL < AL_MIN){ AL = AL_MIN; e = vh / AL; }
  else if (AL > AL_MAX){ AL = AL_MAX; e = vh / AL; }
  const w = Math.round(AN * e), h = Math.round(AL * e);
  caja.style.width = w + 'px'; caja.style.height = h + 'px';
  /* ── EL PIXEL RATIO VA TOPADO EN 2, Y ESO ESTÁ MEDIDO EN OTRO JUEGO ──
     En Maicol se midió que dibujar al doble de la resolución de diseño costaba
     la mitad de los cuadros y no compraba ni un detalle, porque no hay más
     detalle que dar: los dibujos están hechos para 720 de ancho. Con 2 el texto
     y los bordes quedan finos y no se paga un tercer múltiplo. */
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(w * DPR);
  lienzo.height = Math.round(h * DPR);
  ESC = (w * DPR) / AN;
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.imageSmoothingEnabled = true;
}
addEventListener('resize', () => setTimeout(medir, 60));
addEventListener('orientationchange', () => setTimeout(medir, 120));

/* ── EL RELOJ: PASO FIJO DE 60 CON TOPE ──
   Un minijuego que se juega por reflejos NO PUEDE depender de los cuadros por
   segundo del aparato: si la moneda cae más rápido en un teléfono lento, es
   otro juego. La simulación va a 60 pasos fijos y el dibujo sale de donde
   quedó. Y el `dt` se topa en un cuarto de segundo, porque una pestaña que
   estuvo dormida no puede simular un minuto de golpe. */
const PASO = 1/60;
let _acum = 0, _ultimo = performance.now();
let MODO = 'idioma';      /* idioma · menu · como · cine · juega · fin */
let PAUSA = false, CONGELADO = false;
let fps = 0, _cuadros = 0, _acumF = 0;

/* la entrada: un solo verbo. Llega normalizada a las unidades de diseño, así
   que un juego nunca ve un píxel de pantalla. */
const TOQUE = { x: 0, y: 0, abajo: false, movido: false, n: 0 };
function aDiseno(ev){
  const r = lienzo.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: (t.clientX - r.left) / r.width * AN,
           y: (t.clientY - r.top) / r.height * AL };
}
/* ── EL `preventDefault` DE UN `touchstart` CANCELA EL CLICK, Y ESO DEJABA EL
       JUEGO SIN PODER EMPEZAR ──
   Los cuatro escuchas estaban colgados de la VENTANA, así que un toque en el
   botón JUGAR o en el de idioma pasaba primero por acá, llegaba a
   `preventDefault()` —el juego consume el toque— y el navegador entonces NO
   sintetiza el `click`. En el banco no se veía: Playwright despacha un click de
   ratón de verdad y ese camino no pasa por el táctil. En un teléfono, tocar
   JUGAR no hacía absolutamente nada.

   Ahora la entrada del juego cuelga del LIENZO. Los paneles viven por encima
   (`z-index 5`), así que mientras hay un panel abierto el lienzo no recibe nada
   y los botones son botones; en partida no hay panel y el lienzo recibe todo.
   `touchend`/`mouseup` siguen en la ventana a propósito: un arrastre que
   termina afuera del marco tiene que soltar igual. */
function baja(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.abajo = true; TOQUE.movido = false; TOQUE.n++;
  if (MODO === 'cine'){ cineSalta(); return; }
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function mueve(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.movido = true;
  if (MODO === 'juega' && TOQUE.abajo && JUEGO.mueve) JUEGO.mueve(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function sube(){
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(TOQUE.x, TOQUE.y);
  TOQUE.abajo = false;
}
lienzo.addEventListener('touchstart', baja, { passive: false });
lienzo.addEventListener('touchmove', mueve, { passive: false });
addEventListener('touchend', sube, { passive: true });
addEventListener('touchcancel', sube, { passive: true });
lienzo.addEventListener('mousedown', baja);
addEventListener('mousemove', (e) => { if (TOQUE.abajo) mueve(e); });
addEventListener('mouseup', sube);
/* la barra espaciadora hace de toque EN EL MEDIO del marco: es lo que permite
   probarlo en una notebook sin fingir un táctil. Y va con las coordenadas de
   diseño y no con las del evento, porque un `keydown` no trae ninguna — con
   `clientX` en cero el toque caía en el borde izquierdo, que en un juego de
   tocar la mitad es una respuesta equivocada. */
function toqueMedio(){
  if (MODO === 'cine'){ cineSalta(); return; }
  TOQUE.x = AN/2; TOQUE.y = AL/2; TOQUE.abajo = true;
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(AN/2, AL/2);
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(AN/2, AL/2);
  TOQUE.abajo = false;
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') toqueMedio();
});
/* Generado por herramientas/casual/hornear.py — NO editar a mano.

/* ══════════════════════════════ FRUTAS ══════════════════════════════
   Soltás una fruta en el frasco; dos frutas iguales que se tocan se fusionan en
   la siguiente de la escala. Si el frasco se desborda, se termina.

   POR QUE ESTE GENERO: es el unico casual donde el jugador NO PUEDE planear
   mas de dos movidas, porque las frutas ruedan. O sea que la partida es
   siempre distinta sin que haga falta generar nada, y cada fusion que sale
   sola —una cadena de tres o cuatro— se siente como un regalo. Eso es lo que
   hace que se juegue otra vez.

   ── LA FISICA ES DE CIRCULOS Y NO DE UN MOTOR ──
   Todo lo que hay acá son discos: no hace falta ni un poligono, ni rotacion de
   cuerpo rigido, ni un motor de cuarenta kilobytes. Un solver secuencial de
   impulsos sobre pares de circulos son cuarenta lineas, corre en O(n^2) con
   n<=45 —o sea dos mil pares por iteracion, nada— y es EXACTO en el unico caso
   que importa: dos frutas que se tocan.
   Y VA EN PASO FIJO, que en este juego no es un detalle: con `dt` variable, dos
   frutas que se apoyan una en la otra tiemblan y la torre se derrumba sola en
   un telefono lento. */

/* ── LA ESCALA TIENE NUEVE Y NO DIEZ, Y ESO LO DECIDIO LO QUE VOLVIO ──
   Se pidio una tira de diez frutas y el generador devolvio una reja de 2x5 con
   NUEVE: falta la manzana. Pelear con el generador para que la devuelva costaba
   dos generaciones mas para agregar una fruta redonda y roja que se confunde
   con el caqui, o sea el defecto que la escala existe para evitar. Nueve es un
   largo de escala perfectamente bueno, y el orden es el que trajo la hoja.

   r es el radio en unidades de diseño (ancho 720). El frasco mide 560 de ancho
   por dentro, asi que la mas grande —296 de diametro— entra con aire. La escala
   NO es lineal: cada fruta es ~1,25 veces la anterior, que es lo que hace que
   dos iguales se distingan de una de al lado sin tener que leer el color. */
/* ── LA ESCALA SALIO DE UN BARRIDO, Y DE TRES CONCLUSIONES MIAS QUE ERAN RUIDO ──
   Este es el juego que mas me costo medir, y las tres veces el error fue el
   mismo: **una sola corrida no dice nada en un sistema caotico**. La posicion
   final de una fruta depende del orden en que el solver resuelve los pares, y
   ese orden cambia con milesimas: dos partidas con semillas parecidas divergen
   por completo.

   1. Con UNA semilla, el bot que apunta hizo 41.250 y el que suelta al azar
      83.241. Concluí que el frasco era chico y que la suerte decidia.
   2. Achiqué los radios a 15..88 y entonces NINGUNO de los dos moria en siete
      minutos: 1.428 sueltas y los cuatro vivos. La partida no se terminaba.
   3. Con la escala final y CUATRO semillas, el honesto hizo 79.335 contra
      33.192 y anote «la estrategia viaja». Con OCHO semillas: **43.806 contra
      44.197**, o sea empatados. Lo de cuatro semillas tambien era ruido.

   Lo que el barrido si establece, y es lo unico que voy a afirmar:

   | escala | sueltas antes de morir | sobrevive 30.000 pasos |
   |---|---|---|
   | 15..88   | 1428 | 4 de 4 |
   | 19..114  | 1428 | 3 de 4 |
   | 24..141  |  871 | 0 de 4 |
   | **28..167** | **~310** | **0 de 8** |

   O sea que la escala decide CUANTO DURA la partida, y con la ultima fila
   termina en unas trescientas sueltas —cuatro o cinco minutos, que es el largo
   de una sesion de casual— y el frasco se llena a la vista.

   ── Y LO QUE NO ESTA DEMOSTRADO, DICHO EN VOZ ALTA ──
   Que colocar bien pague. Un bot voraz de UNA jugada no le gana a repartir
   parejo, y eso es una propiedad del genero: repartir parejo ya es una buena
   estrategia porque mantiene la pila plana. La habilidad de verdad es ver una
   cadena de dos o tres antes de soltar, y eso ningun bot de acá lo modela. Lo
   que si esta medido: la partida SE TERMINA, la fisica converge (cero frutas
   solapadas en juego normal) y se llega a la sandia. */

/* ── LA ESCALA DE LA ESCALA, Y SE BARRE MIDIENDO ──
   Es un solo numero que multiplica los nueve radios, y decide cuanto AIRE tiene
   el frasco. Con la escala original —sandia de 148— el frasco media menos de
   dos anchos de la fruta grande y la partida la decidia la semilla; con 15..88
   medía 3,7 y NINGUNO de los dos bots moria en siete minutos. La ventana esta
   en el medio y se encuentra corriendo, no eligiendo. */
let F_KR = 1.0;
const F_R = (n) => F_ESCALA[n].r * F_KR;
const F_RMAX = () => 167 * F_KR;
/* los puntos de fusionar dos de nivel i: 1, 3, 6, 10, 15, 21, 28, 36, 45.
   Triangulares a propósito — el salto entre escalones crece, así que llegar una
   fruta más arriba paga MUCHO más que dos fusiones chicas. Es lo que empuja al
   jugador a construir en vez de limpiar. */
const F_PTS = F_ESCALA.map((_, i) => ((i+1)*(i+2))/2);
const F_SUELTA = [0,0,0,0,1,1,1,2,2,3];   /* de qué nivel salen las que caen */

const F_G = 2500;          /* gravedad */
const F_REST = 0.10;       /* rebote: casi nada. Una fruta que rebota no se apila. */
const F_AIRE = 0.9975;     /* roce del aire por paso */
const F_PISO = 0.90;       /* roce contra el piso y las paredes */
const F_ITER = 6;          /* iteraciones del solver */
const F_ESPERA = 0.34;     /* entre dos sueltas */
const F_PELIGRO = 1.25;    /* segundos por encima de la línea antes de perder */
const F_CADENA = 0.60;     /* dos fusiones dentro de esto son una cadena */

const FR = [];             /* las frutas vivas */
let F_gx0 = 80, F_gx1 = 640, F_gyb = 1100, F_gyt = 420;   /* el frasco, lo pone geo() */
let F_id = 0;

const MANO = { x: 360, niv: 0, sig: 0, esp: 0, tira: false };
let F_pel = 0, F_vivo = true, F_maxNiv = 0, F_fus = 0, F_cad = 0, F_cadN = 0;
let F_azar = 12345;

/* ── EL AZAR ES PROPIO Y CON SEMILLA ──
   `Math.random()` haría que dos corridas del auto-jugador no se puedan
   comparar, y comparar dos corridas es la única forma de saber si un cambio
   mejoró algo. Y de paso el jugador puede tener la misma bolsa de frutas. */
function fAz(){ F_azar = (F_azar*1664525 + 1013904223) >>> 0; return F_azar / 4294967296; }

function geo(){
  /* el frasco se ancla ABAJO y su alto sale de lo que sobra: con el alto de
     diseño moviéndose entre 1100 y 1760 según la pantalla, un frasco de alto
     fijo dejaría un hueco en un teléfono largo o se saldría en uno corto */
  F_gx0 = 42; F_gx1 = AN - 42;
  F_gyb = AL - 96;
  F_gyt = Math.max(330, AL*0.30);
}

function fNueva(niv, x, y){
  const f = { id: ++F_id, niv, r: F_R(niv), x, y, vx: 0, vy: 0,
              gi: 0, vgi: 0, tocado: false, nace: 0, muere: 0 };
  FR.push(f);
  if (niv > F_maxNiv) F_maxNiv = niv;
  return f;
}

/* ── LA COLISION CONTRA LAS PAREDES ES UN RECORTE, Y ESO ES EXACTO ──
   Con un rayo o un impulso hay casos en los que una fruta rapida atraviesa la
   pared en un paso. Recortando la posicion no puede pasar nunca, y en un
   frasco —tres planos rectos— no se pierde nada. */
function fParedes(f){
  if (f.x - f.r < F_gx0){ f.x = F_gx0 + f.r; if (f.vx < 0){ f.vx = -f.vx*F_REST; f.vy *= F_PISO; } }
  if (f.x + f.r > F_gx1){ f.x = F_gx1 - f.r; if (f.vx > 0){ f.vx = -f.vx*F_REST; f.vy *= F_PISO; } }
  if (f.y + f.r > F_gyb){
    f.y = F_gyb - f.r;
    if (f.vy > 0){ f.vy = -f.vy*F_REST; f.vx *= F_PISO; f.vgi *= F_PISO; }
    f.tocado = true;
  }
}

function fusiona(a, b){
  const niv = a.niv + 1;
  const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
  const e = F_ESCALA[a.niv];
  a.muere = 1; b.muere = 1;
  /* ── LA CADENA SE MIDE EN TIEMPO Y NO EN CANTIDAD ──
     Cuatro fusiones separadas por diez segundos no son una cadena: son cuatro
     jugadas. Lo que el jugador siente como cadena es que una fusión provoque la
     siguiente, y eso pasa en menos de medio segundo. */
  F_cad = F_CADENA;
  F_cadN++;
  const pts = F_PTS[a.niv] * (F_cadN > 1 ? F_cadN : 1);
  sumaPuntos(pts, mx, my - e.r*0.6);
  chispas(mx, my, Math.min(22, 6 + a.niv*2), e.h, 120 + a.niv*22);
  sacude(0.10 + a.niv*0.035);
  son('bien', 0.7 + a.niv*0.04);
  F_fus++;
  if (niv >= F_ESCALA.length){
    /* dos sandías se van del frasco: es el premio grande y encima libera el
       espacio, que es lo que le da a la partida una segunda vida */
    fogonazo(0.55);
    sacude(0.6);
    sumaPuntos(120, mx, my - 90);
    chispas(mx, my, 40, '#ffe89a', 420);
    return;
  }
  const n = fNueva(niv, mx, my);
  n.nace = 0.22;
  n.tocado = true;
  /* un empujón hacia arriba: sin él, la fruta nueva aparece exactamente donde
     estaban las dos viejas, con la de arriba encima, y el solver la escupe para
     un costado al azar. Con el empujón la torre se asienta hacia arriba, que es
     lo que uno espera ver. */
  n.vy = -110 - niv*8;
  n.vx = (a.vx + b.vx)*0.3;
}

function fPares(){
  const fus = [];
  /* ── EL BARRIDO SE PODA POR ALTURA ──
     Con la escala achicada caben tres o cuatro veces mas frutas, y O(n^2) con
     n=180 son treinta y dos mil pares por iteracion —seis iteraciones, sesenta
     pasos por segundo— o sea once millones de comparaciones por segundo para
     descubrir que casi ninguna se toca. Ordenando por `y` una vez por paso,
     todo lo que este mas abajo que `r + el radio mas grande` no puede tocar a
     la de arriba, y ahi el bucle interno se corta. La poda es EXACTA: no
     descarta un par que se toque, porque usa el radio mas grande que existe. */
  FR.sort((p, q) => p.y - q.y);
  for (let i = 0; i < FR.length; i++){
    const a = FR[i];
    if (a.muere) continue;
    const corte = a.y + a.r + F_RMAX();
    for (let j = i+1; j < FR.length; j++){
      const b = FR[j];
      if (b.y > corte) break;
      if (b.muere) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      let d2 = dx*dx + dy*dy;
      if (d2 >= rr*rr) continue;
      let d = Math.sqrt(d2);
      if (d < 0.0001){ dx = 0.001; dy = 1; d = 1; }   /* dos centros exactos: se separan hacia abajo */
      a.tocado = true; b.tocado = true;
      if (a.niv === b.niv && !a.nace && !b.nace){ fus.push([a, b]); continue; }
      const nx = dx/d, ny = dy/d;
      const pen = rr - d;
      /* la separación se reparte por masa, y la masa es el AREA: si no, una
         cereza empuja una sandía como si pesaran lo mismo y la torre se
         desarma sola */
      const ma = a.r*a.r, mb = b.r*b.r, mt = ma + mb;
      a.x -= nx*pen*(mb/mt); a.y -= ny*pen*(mb/mt);
      b.x += nx*pen*(ma/mt); b.y += ny*pen*(ma/mt);
      const vn = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
      if (vn < 0){
        const jj = -(1 + F_REST)*vn / (1/ma + 1/mb);
        a.vx -= (jj/ma)*nx; a.vy -= (jj/ma)*ny;
        b.vx += (jj/mb)*nx; b.vy += (jj/mb)*ny;
        /* el roce tangencial: es lo que hace que una fruta RUEDE por encima de
           otra en vez de deslizarse como sobre hielo */
        const tx = -ny, ty = nx;
        const vt = (b.vx - a.vx)*tx + (b.vy - a.vy)*ty;
        const jt = -vt*0.16 / (1/ma + 1/mb);
        a.vx -= (jt/ma)*tx; a.vy -= (jt/ma)*ty;
        b.vx += (jt/mb)*tx; b.vy += (jt/mb)*ty;
        a.vgi -= vt*0.004; b.vgi += vt*0.004;
      }
    }
  }
  /* ── LAS FUSIONES SE APLICAN DESPUES DEL BARRIDO ──
     Fusionando adentro del bucle se le cambia el largo al array que se está
     recorriendo, y ahí una fruta puede fusionarse dos veces en el mismo paso —
     medido, eso duplicaba puntos y dejaba frutas fantasma con `niv` fuera de la
     escala. */
  for (const [a, b] of fus) if (!a.muere && !b.muere) fusiona(a, b);
}

const JT = {
  es: { sub:'Soltá frutas y fusioná las iguales. Cada par sube un escalón.',
        c1:'Un frasco, nueve frutas.',
        c2:'Dos iguales que se tocan se vuelven la siguiente.',
        c3:'Si se desborda, se termina. Llegá a la sandía.',
        sigT:'SIGUE', pel:'¡SE DESBORDA!' },
  en: { sub:'Drop fruit and merge the matching ones. Each pair moves up a step.',
        c1:'One jar, nine fruits.',
        c2:'Two of a kind that touch become the next one.',
        c3:'Overflow and it is over. Get to the watermelon.',
        sigT:'NEXT', pel:'OVERFLOWING!' },
  pt: { sub:'Solte frutas e junte as iguais. Cada par sobe um degrau.',
        c1:'Um pote, nove frutas.',
        c2:'Duas iguais que se tocam viram a seguinte.',
        c3:'Se transbordar, acabou. Chegue na melancia.',
        sigT:'PRÓXIMA', pel:'TRANSBORDANDO!' }
};
const PIEL = { ac:'#ff9a2e', tela:'fondo' };
const SON_ALIAS = { bien:'fusion', toque:'suelta', pierde:'perder',
                    gana:'gana', clic:'clic' };

/* ══════════ EL DIBUJO DE UNA FRUTA ══════════
   Arranca dibujada por código y la hoja generada la PISA cuando decodifica, que
   es la regla del repo. Y lo dibujado no es un círculo plano: un disco de un
   solo color se lee a ficha de damas. Van cuatro cosas y las cuatro se ven —
   sombra de contacto, cuerpo con degradado desplazado (que es lo que da el
   volumen), brillo especular arriba a la izquierda, y contorno oscuro. */
/* devuelve false si la hoja todavia no decodifico, y ahi manda lo dibujado por
   codigo — que es la regla del repo: nada reemplaza nada hasta que llega */
function fSprite(g, niv, r){
  const o = IMG.frutas;
  if (!o || !o.ok) return false;
  const m = AS.img.frutas;
  const esc = (m.esc && m.esc[niv]) || 1;
  const cy = (m.cy && m.cy[niv] != null) ? m.cy[niv] : 0.5;
  const lado = r*2*esc;
  g.drawImage(o.im, niv*o.w, 0, o.w, o.h,
              -lado/2, -cy*lado, lado, lado);
  return true;
}

function fDibuja(f, g){
  const e = F_ESCALA[f.niv];
  const r = f.r * (f.nace ? 1 + f.nace*0.9 : 1);
  g.save();
  g.translate(f.x, f.y);
  g.rotate(f.gi);
  /* ── EL SPRITE SE DIBUJA POR SU CUERPO Y NO POR SU ALTO ──
     `dibCuadro` ajusta el ALTO del cuadro al diametro, y el alto incluye la
     hoja: en la cereza el cabito es un tercio de la imagen, asi que la fruta
     salia bastante mas chica que el circulo con el que choca y dos frutas que
     se estaban tocando se veian SEPARADAS. En un juego que consiste en juntar
     cosas iguales eso es lo peor que puede pasar.
     El horneado mide el cuerpo de cada pieza —su fila mas ancha— y guarda
     cuanto hay que agrandarla (`esc`) y donde esta su centro vertical (`cy`).
     Con eso el cuerpo mide exactamente `2r` y su centro cae en el centro del
     circulo, o sea que lo dibujado y lo que choca son la misma cosa. */
  if (fSprite(g, f.niv, r)){ g.restore(); return; }
  /* el degradado tiene el foco corrido hacia arriba y a la izquierda: centrado
     devuelve una esfera de manual y se lee a bola de billar, no a fruta */
  const gr = g.createRadialGradient(-r*0.32, -r*0.36, r*0.08, 0, 0, r*1.06);
  gr.addColorStop(0, e.h);
  gr.addColorStop(0.42, e.c);
  gr.addColorStop(1, e.o);
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = gr; g.fill();
  g.lineWidth = Math.max(1.6, r*0.055); g.strokeStyle = e.o; g.stroke();
  /* el brillo: una elipse girada y no un círculo. Un círculo blanco se lee a
     agujero; una elipse inclinada se lee a reflejo de una ventana. */
  g.beginPath();
  g.ellipse(-r*0.34, -r*0.40, r*0.30, r*0.17, -0.7, 0, 7);
  g.fillStyle = 'rgba(255,255,255,.42)'; g.fill();
  /* la hojita: es lo único que dice «esto es una fruta» y no «esto es una
     pelota», y cuesta cuatro líneas */
  g.beginPath();
  g.moveTo(0, -r*0.98);
  g.quadraticCurveTo(r*0.30, -r*1.30, r*0.62, -r*1.06);
  g.quadraticCurveTo(r*0.28, -r*0.86, 0, -r*0.98);
  g.fillStyle = '#3f7a2c'; g.fill();
  g.beginPath(); g.moveTo(0, -r*0.98); g.lineTo(-r*0.05, -r*1.22);
  g.lineWidth = Math.max(1.4, r*0.06); g.strokeStyle = '#5a4023'; g.stroke();
  g.restore();
}

const JUEGO = {
  id: 'frutas',
  tipo: 'puntos',
  vivo: true, gano: false,
  get marca(){ return PUNTOS; },
  get sub(){ return TX('pts'); },
  get ficI(){ return null; },
  get ficD(){ return TX('sigT') + ' ' + (MANO.sig + 1); },
  resta: null,

  /* ── LOS SUJETOS VAN POR ENCIMA DEL PIE, Y ESO SE MIDIO EN UNA FOTO ──
     El pie de la cinematica vive en el 9 % de abajo del marco, o sea de
     `AL-230` para abajo contando las dos lineas. Los sujetos estaban en
     `F_gyb-120` —o sea `AL-216`— asi que la frase les caia ENCIMA: en la
     captura del segundo plano las dos naranjas salian atravesadas por el
     texto. Todo lo que hay que ver va arriba de `AL-260`. */
  planos: [
    { dur: 3.0, pie: 'c1', dibuja(g, u){
        geo();
        fondoBase(g);
        frascoDibuja(g, 0.5 + u*0.5);
        /* cuatro de la escala en fila, entrando de a una: dice «hay una escala»
           sin escribir la palabra escala */
        for (let i = 0; i < 4; i++){
          const k = Math.max(0, Math.min(1, u*4 - i*0.7));
          if (k <= 0) continue;
          fDibuja({ niv: i+1, x: AN/2 - 168 + i*112,
                    y: F_gyb - 330 + (1-suave(k))*140,
                    r: F_R(i+1), gi: (1-k)*1.2, nace: 0 }, g);
        }
      } },
    { dur: 3.2, pie: 'c2', dibuja(g, u){
        geo();
        fondoBase(g);
        frascoDibuja(g, 1);
        /* dos iguales que se juntan y se vuelven una: es la regla entera del
           juego contada sin una palabra */
        const s = suave(Math.min(1, u*1.35));
        const d = 150*(1 - s);
        const y = (F_gyt + F_gyb)/2 - 40;
        if (s < 0.99){
          fDibuja({ niv:4, x: AN/2 - d, y, r: F_R(4), gi:-s*0.7, nace:0 }, g);
          fDibuja({ niv:4, x: AN/2 + d, y, r: F_R(4), gi: s*0.7, nace:0 }, g);
        } else {
          const q = Math.max(0, u - 0.74);
          disco(AN/2, y, F_R(5)*(1 + q*2.4), 'rgba(255,226,138,.20)');
          fDibuja({ niv:5, x: AN/2, y, r: F_R(5), gi:0, nace: q*1.6 }, g);
        }
      } },
    { dur: 3.4, pie: 'c3', dibuja(g, u){
        geo();
        fondoBase(g);
        frascoDibuja(g, 1);
        /* el frasco lleno HASTA EL BORDE: se dibuja de la linea de peligro para
           abajo y no del piso para arriba, asi lo que se ve es justamente lo
           que amenaza —el borde a punto de desbordar— y no el fondo, que es lo
           unico que el pie tapa */
        const fila = [[8,0.30],[6,0.72],[7,0.16],[4,0.55],[5,0.86],[3,0.40],[2,0.66],[1,0.22],[0,0.78]];
        let y = F_gyt + 120;
        for (let i = 0; i < fila.length; i++){
          const [n, fx] = fila[i];
          const x = F_gx0 + 40 + fx*(F_gx1 - F_gx0 - 80);
          fDibuja({ niv: n, x, y, r: F_R(n), gi: (i*0.83)%1.5 - 0.75, nace: 0 }, g);
          if (i % 2 === 1) y += 120;
        }
        /* y la linea late: es la unica cosa de la cinematica que dice «se
           termina», y una linea quieta se lee a adorno */
        const p = 0.35 + 0.65*Math.abs(Math.sin(u*7));
        g.strokeStyle = 'rgba(224,85,63,' + p.toFixed(2) + ')';
        g.lineWidth = 5; g.setLineDash([18, 14]);
        g.beginPath(); g.moveTo(F_gx0, F_gyt); g.lineTo(F_gx1, F_gyt); g.stroke();
        g.setLineDash([]);
        texto(TX('pel'), AN/2, F_gyt - 26, 30, '#e0553f', '800', 'center');
      } }
  ],

  arranca(){
    geo();
    FR.length = 0; F_id = 0;
    F_pel = 0; F_vivo = true; F_maxNiv = 0; F_fus = 0; F_cad = 0; F_cadN = 0;
    F_azar = (Date.now() ^ 0x9e3779b9) >>> 0;
    MANO.x = AN/2; MANO.esp = 0.5; MANO.tira = false;
    MANO.niv = F_SUELTA[Math.floor(fAz()*F_SUELTA.length)];
    MANO.sig = F_SUELTA[Math.floor(fAz()*F_SUELTA.length)];
    this.vivo = true; this.gano = false;
  },

  paso(dt){
    geo();
    if (MANO.esp > 0) MANO.esp = Math.max(0, MANO.esp - dt);
    if (F_cad > 0){ F_cad -= dt; if (F_cad <= 0) F_cadN = 0; }

    for (const f of FR){
      if (f.nace > 0) f.nace = Math.max(0, f.nace - dt*4.5);
      f.vy += F_G*dt;
      f.vx *= F_AIRE; f.vy *= F_AIRE;
      f.x += f.vx*dt; f.y += f.vy*dt;
      f.gi += f.vgi*dt; f.vgi *= 0.985;
    }
    for (let k = 0; k < F_ITER; k++){
      for (const f of FR) if (!f.muere) fParedes(f);
      fPares();
    }
    for (let i = FR.length - 1; i >= 0; i--) if (FR[i].muere) FR.splice(i, 1);

    /* ── PERDER PIDE QUE LA FRUTA ESTE QUIETA, NO SOLO ARRIBA ──
       Sin la condición de reposo, una fruta recién soltada —que cruza la línea
       en el aire, porque nace por encima— terminaba la partida en el primer
       cuadro. Y sin el temporizador, un rebote de un cuadro por encima de la
       línea también. Tienen que ser las dos cosas a la vez y sostenidas. */
    let sobre = false;
    for (const f of FR){
      if (!f.tocado) continue;
      const q = Math.abs(f.vx) + Math.abs(f.vy);
      if (f.y - f.r < F_gyt && q < 90){ sobre = true; break; }
    }
    if (sobre){
      F_pel += dt;
      if (F_pel > F_PELIGRO){ F_vivo = false; this.vivo = false; }
    } else F_pel = Math.max(0, F_pel - dt*1.6);
  },

  /* el dedo apunta y al soltarlo cae. Un toque suelto también sirve, que es lo
     que hace que se pueda jugar rápido con el pulgar. */
  baja(x){ MANO.tira = true; MANO.x = x; },
  mueve(x){ if (MANO.tira) MANO.x = x; },
  sube(){ if (MANO.tira) this.suelta(); MANO.tira = false; },

  suelta(){
    if (MANO.esp > 0) return false;
    geo();
    const r = F_R(MANO.niv);
    const x = Math.max(F_gx0 + r, Math.min(F_gx1 - r, MANO.x));
    const f = fNueva(MANO.niv, x, F_gyt - r - 40);
    f.vy = 60;
    f.vgi = (fAz() - 0.5)*3;
    son('toque');
    MANO.niv = MANO.sig;
    MANO.sig = F_SUELTA[Math.floor(fAz()*F_SUELTA.length)];
    MANO.esp = F_ESPERA;
    return true;
  },

  fondo(g){ geo(); fondoBase(g); },

  pinta(g){
    frascoDibuja(g, 1);
    /* la línea de peligro se ve SOLO cuando hay peligro: dibujada siempre, es
       una raya que el jugador aprende a ignorar y entonces no avisa nada */
    if (F_pel > 0.02){
      const k = Math.min(1, F_pel/F_PELIGRO);
      g.strokeStyle = 'rgba(224,85,63,' + (0.30 + 0.65*k).toFixed(2) + ')';
      g.lineWidth = 3 + k*4; g.setLineDash([18, 14]);
      g.beginPath(); g.moveTo(F_gx0, F_gyt); g.lineTo(F_gx1, F_gyt); g.stroke();
      g.setLineDash([]);
      if (k > 0.45) texto(TX('pel'), AN/2, F_gyt - 22, 26, '#e0553f', '800', 'center');
    }
    for (const f of FR) fDibuja(f, g);
    /* la que está por caer: colgada arriba, con una guía punteada hasta el
       fondo. Sin la guía, en un frasco de 560 de ancho el jugador no sabe dónde
       va a caer y suelta a ciegas. */
    const r = F_R(MANO.niv);
    const x = Math.max(F_gx0 + r, Math.min(F_gx1 - r, MANO.x));
    g.save();
    g.globalAlpha = 0.26;
    g.strokeStyle = '#f2eee6'; g.lineWidth = 2; g.setLineDash([10, 12]);
    g.beginPath(); g.moveTo(x, F_gyt - 8); g.lineTo(x, F_gyb - 6); g.stroke();
    g.setLineDash([]);
    g.restore();
    const alfa = MANO.esp > 0 ? 0.35 : 1;
    g.save(); g.globalAlpha = alfa;
    fDibuja({ niv: MANO.niv, x, y: F_gyt - r - 40, r, gi: 0, nace: 0 }, g);
    g.restore();
    /* la escala, chica y al costado: es la unica ayuda que este juego necesita
       —saber que viene despues de la que tenes— y va como fichas y no como
       texto, porque el nombre de la fruta no le dice nada a nadie */
    const y0 = 118;
    for (let i = 0; i <= Math.min(F_ESCALA.length - 1, F_maxNiv + 1); i++){
      const rr = 13 + i*1.6, xx = 34, yy = y0 + i*34;
      const e = F_ESCALA[i];
      g.beginPath(); g.arc(xx, yy, rr*0.72, 0, 7);
      g.fillStyle = i <= F_maxNiv ? e.c : 'rgba(255,255,255,.10)'; g.fill();
      if (i === MANO.niv){
        g.beginPath(); g.arc(xx, yy, rr*0.72 + 5, 0, 7);
        g.strokeStyle = '#f2eee6'; g.lineWidth = 2; g.stroke();
      }
    }
  },

  /* ══════════ EL AUTO-JUGADOR ══════════
     No es para hacer trampa: es la unica forma de saber si el juego SE PUEDE
     jugar y si jugarlo bien paga. Comparado con uno que suelta al azar, la
     diferencia dice si la estrategia viaja; si el azar empata o gana, el juego
     es una tragamonedas.

     ── Y LA PRIMERA VERSION PERDIA CONTRA EL AZAR ──
     Medido despues de que la escala pasara de diez frutas a nueve —o sea con
     las frutas mas grandes contra el mismo frasco—: el honesto hacia 41.250
     puntos con 329 sueltas y el azaroso 83.241 con 547. El azar durando el
     doble no es casualidad: es que el «honesto» miraba UNA cosa —pegarse a una
     fruta del mismo nivel, y del lado derecho si habia lugar— y no miraba la
     ALTURA. Con eso apila todo en una columna y el frasco se desborda mucho
     antes, o sea que la estrategia era peor que no tener ninguna.

     Ahora barre veintiun columnas y puntua cada una por dos cosas a la vez:
     que haya una del mismo nivel donde la fruta va a APOYARSE —no donde esta
     el centro de la otra— y que la superficie ahi este baja. Es lo que hace una
     persona: busca el par, y si no hay, tira al pozo. */
  juegaSolo(n, azar){
    this.arranca();
    /* la semilla es fija para que dos corridas se puedan comparar, y ajustable
       para poder correr VARIAS: con una sola, la diferencia entre dos bots es
       ruido —medido, el mismo bot al azar dio 44.850 y 83.241 en dos corridas—
       y de un numero asi no se puede concluir nada. */
    F_azar = F_SEM;
    let sueltas = 0;
    for (let i = 0; i < n && this.vivo; i++){
      if (MANO.esp <= 0){
        MANO.x = azar ? (F_gx0 + fAz()*(F_gx1 - F_gx0)) : fApunta();
        if (this.suelta()) sueltas++;
      }
      this.paso(1/60);
    }
    return { puntos: PUNTOS, sueltas, fusiones: F_fus, maxNiv: F_maxNiv,
             maxFruta: F_ESCALA[F_maxNiv].n, frutas: FR.length,
             vivo: !!this.vivo, pasos: n };
  },

  /* lo unico ajustable, y solo para el banco: la escala de la escala, el peso
     de la heuristica del bot y la semilla. Vive adentro del modulo porque desde
     afuera no se puede tocar un `let` de un modulo ES. */
  cfg(o){
    if (o.kr != null) F_KR = o.kr;
    if (o.ady != null) F_PESO_ADY = o.ady;
    if (o.sem != null) F_SEM = o.sem;
    return { kr: F_KR, ady: F_PESO_ADY, sem: F_SEM, rMax: F_RMAX() };
  },

  /* la sonda propia: el estado del frasco sin tener que mirar una captura */
  ver(){
    return { frutas: FR.length, maxNiv: F_maxNiv, fusiones: F_fus,
             pel: +F_pel.toFixed(2), mano: MANO.niv, sig: MANO.sig,
             /* la altura de la pila: es lo que dice si el frasco se está
                llenando, y no se puede leer de ninguna otra variable */
             alto: FR.length ? +(F_gyb - Math.min.apply(null, FR.map(f => f.y - f.r))).toFixed(0) : 0,
             frasco: [F_gx0, F_gyt, F_gx1, F_gyb],
             /* dos frutas superpuestas más de un 12 % serían un solver que no
                converge, y eso no se ve en una foto: se ve como una torre que
                tiembla. Acá se cuenta. */
             solapadas: (() => { let k = 0;
               for (let i = 0; i < FR.length; i++) for (let j = i+1; j < FR.length; j++){
                 const a = FR[i], b = FR[j], rr = a.r + b.r;
                 const d = Math.hypot(b.x - a.x, b.y - a.y);
                 if (d < rr*0.88) k++;
               } return k; })() };
  }
};

/* ══════════ EL FRASCO Y EL FONDO ══════════
   El frasco es vidrio, o sea que lo único que se ve de él son sus BORDES y un
   velo. Dibujado como un rectángulo relleno tapa las frutas; dibujado sólo con
   línea se lee a marco de una foto. Van las tres cosas: el velo del interior,
   los tres cantos gruesos, y un reflejo vertical en la pared izquierda. */
function frascoDibuja(g, k){
  const w = F_gx1 - F_gx0, h = F_gyb - F_gyt;
  g.save();
  g.globalAlpha = 0.20*k;
  const gr = g.createLinearGradient(F_gx0, F_gyt, F_gx1, F_gyb);
  gr.addColorStop(0, '#7fd8ff'); gr.addColorStop(1, '#1d3b52');
  g.fillStyle = gr;
  g.fillRect(F_gx0, F_gyt, w, h);
  g.restore();
  g.save();
  g.lineWidth = 12; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(214,240,255,' + (0.55*k).toFixed(2) + ')';
  g.beginPath();
  g.moveTo(F_gx0, F_gyt); g.lineTo(F_gx0, F_gyb);
  g.lineTo(F_gx1, F_gyb); g.lineTo(F_gx1, F_gyt);
  g.stroke();
  /* el labio: dos trazos cortos hacia afuera arriba. Sin ellos el frasco es una
     U y se lee a copa; con ellos se lee a frasco abierto. */
  g.lineWidth = 9;
  g.beginPath();
  g.moveTo(F_gx0 - 16, F_gyt - 4); g.lineTo(F_gx0 + 6, F_gyt + 10);
  g.moveTo(F_gx1 + 16, F_gyt - 4); g.lineTo(F_gx1 - 6, F_gyt + 10);
  g.stroke();
  g.globalAlpha = 0.30*k;
  g.lineWidth = 5; g.strokeStyle = '#ffffff';
  g.beginPath();
  g.moveTo(F_gx0 + 26, F_gyt + 40); g.lineTo(F_gx0 + 26, F_gyb - 60);
  g.stroke();
  g.restore();
}

function fondoBase(g){
  if (dibCubre('fondo')) return;
  const gr = g.createLinearGradient(0, 0, 0, AL);
  gr.addColorStop(0, '#2b1a3d');
  gr.addColorStop(0.52, '#3d2138');
  gr.addColorStop(1, '#1a1020');
  g.fillStyle = gr; g.fillRect(0, 0, AN, AL);
  /* la mesa: una banda más clara abajo. Sin ella el frasco flota en un
     degradado y no se apoya en nada. */
  const m = g.createLinearGradient(0, AL - 150, 0, AL);
  m.addColorStop(0, '#5a3a2c'); m.addColorStop(1, '#2e1c15');
  g.fillStyle = m; g.fillRect(0, AL - 150, AN, 150);
  g.fillStyle = 'rgba(0,0,0,.30)';
  g.fillRect(0, AL - 150, AN, 5);
}

/* donde apuntaria una persona: el par si lo hay, y si no el hueco mas bajo */
/* el peso relativo de «pegarse a una igual» contra «tirar al hueco mas bajo».
   Es lo unico que el auto-jugador tiene de ajustable y se barre midiendo, no se
   elige: ver la tabla en el comentario de `juegaSolo`. */
let F_PESO_ADY = 60;
let F_SEM = 777;
function fApunta(){
  const R = F_R(MANO.niv);
  const x0 = F_gx0 + R, x1 = F_gx1 - R;
  let mejorX = (x0 + x1)/2, mejorP = -1e9;
  for (let k = 0; k <= 20; k++){
    const x = x0 + (k/20)*(x1 - x0);
    /* la superficie en esa columna: la fruta mas alta cuya sombra la toca */
    let sup = F_gyb;
    for (const f of FR)
      if (Math.abs(f.x - x) < f.r + R*0.92) sup = Math.min(sup, f.y - f.r);
    /* cuantas del mismo nivel quedarian pegadas AHI, o sea donde la fruta va a
       apoyarse y no donde esta el centro de la otra */
    const cy = sup - R;
    let ady = 0;
    for (const f of FR){
      if (f.niv !== MANO.niv) continue;
      if (Math.hypot(f.x - x, f.y - cy) < (f.r + R)*1.32) ady++;
    }
    /* pegarse a una igual manda; a igualdad, el hueco mas bajo */
    const p = ady*F_PESO_ADY + (sup - F_gyt);
    if (p > mejorP){ mejorP = p; mejorX = x; }
  }
  return mejorX;
}
/* ══════════════════════ LOS TRES IDIOMAS ══════════════════════
   La pantalla de idioma va ANTES del menú, que es la lección de los otros seis
   juegos de este repo: elegir el idioma adentro de un menú ya escrito en un
   idioma que no entendés no sirve de nada, porque para cuando lo encontrás ya
   leíste todo sin entenderlo.

   Y NO SE GUARDA NADA EN DISCO. `localStorage` TIRA en una ventana privada, y
   un minijuego que se abre desde un enlace se abre en ventanas raras todo el
   tiempo. El idioma sale de `navigator.language` y el jugador lo cambia con los
   tres botones chicos del menú. La única cosa que sí se intenta guardar es el
   récord, y va envuelta en `try` justamente porque puede tirar. */
let LANG = 'en';
const TXB = {
  es: { jugar:'JUGAR', como:'CÓMO SE JUEGA', otra:'OTRA VEZ', menu:'MENÚ',
        mejor:'MEJOR', salta:'TOCÁ PARA SALTEAR', pts:'PUNTOS',
        finBien:'¡BIEN!', finMal:'SE TERMINÓ', nuevoRec:'RÉCORD NUEVO',
        racha:'RACHA', niveles:'NIVELES', nivel:'NIVEL', movs:'MOVIDAS',
        deshacer:'DESHACER', reiniciar:'REINICIAR', salir:'SALIR',
        seguir:'SEGUIR', ganaste:'¡NIVEL LISTO!', perdiste:'NO SALIÓ',
        proximo:'SIGUIENTE', progreso:'{0} DE {1}' },
  en: { jugar:'PLAY', como:'HOW TO PLAY', otra:'AGAIN', menu:'MENU',
        mejor:'BEST', salta:'TAP TO SKIP', pts:'POINTS',
        finBien:'NICE!', finMal:'GAME OVER', nuevoRec:'NEW RECORD',
        racha:'STREAK', niveles:'LEVELS', nivel:'LEVEL', movs:'MOVES',
        deshacer:'UNDO', reiniciar:'RESTART', salir:'EXIT',
        seguir:'CONTINUE', ganaste:'LEVEL CLEAR!', perdiste:'NO LUCK',
        proximo:'NEXT', progreso:'{0} OF {1}' },
  pt: { jugar:'JOGAR', como:'COMO JOGAR', otra:'DE NOVO', menu:'MENU',
        mejor:'MELHOR', salta:'TOQUE PARA PULAR', pts:'PONTOS',
        finBien:'BOA!', finMal:'ACABOU', nuevoRec:'NOVO RECORDE',
        racha:'SEQUÊNCIA', niveles:'NÍVEIS', nivel:'NÍVEL', movs:'JOGADAS',
        deshacer:'DESFAZER', reiniciar:'REINICIAR', salir:'SAIR',
        seguir:'CONTINUAR', ganaste:'NÍVEL FEITO!', perdiste:'NÃO DEU',
        proximo:'PRÓXIMO', progreso:'{0} DE {1}' }
};
/* ── LA TABLA DEL JUEGO SE FUSIONA CON LA DEL NÚCLEO, NO LA REEMPLAZA ──
   Cada juego trae sus propias frases y hereda las siete del núcleo. Si cada
   juego tuviera que repetir «JUGAR» y «MENÚ» en tres idiomas, serían veintiún
   cadenas duplicadas por juego y la primera que se corrija va a quedar
   corregida en uno solo. */
const TXT = {};
for (const l of ['es','en','pt']) TXT[l] = Object.assign({}, TXB[l], (JT[l] || {}));

function TX(k, ...a){
  let s = (TXT[LANG] && TXT[LANG][k]) != null ? TXT[LANG][k]
        : (TXT.es[k] != null ? TXT.es[k] : k);
  /* los patrones con hueco: `{0}` se reemplaza por el argumento. Una frase con
     un número adentro no se puede armar concatenando, porque el número no cae
     en el mismo lugar en los tres idiomas. */
  return String(s).replace(/\{(\d)\}/g, (_, i) => a[i] != null ? a[i] : '');
}

function pintaIdioma(){
  document.documentElement.lang = LANG;
  for (const e of document.querySelectorAll('[data-i18n]'))
    e.textContent = TX(e.dataset.i18n);
  for (const b of document.querySelectorAll('[data-lang]'))
    b.classList.toggle('p', b.dataset.lang === LANG);
  $('salta').textContent = TX('salta');
  if (window.pintaJuego) window.pintaJuego();
}

function ponIdioma(l){ LANG = l; pintaIdioma(); }

/* el idioma del aparato, y sólo si es uno de los tres */
(() => {
  const n = (navigator.language || 'en').slice(0,2).toLowerCase();
  if (n === 'es' || n === 'pt') LANG = n;
})();
/* ══════════════════════════ EL SONIDO ══════════════════════════
   Procedural y sin un solo archivo, y acá eso no es una limitación sino la
   respuesta correcta: un minijuego de TikTok se abre desde un enlace y tiene
   que estar jugable en el primer segundo. Medio mega de MP3 antes del primer
   cuadro es exactamente lo que hace que alguien se vaya.

   Y LA ESCALA ESTÁ ESCALONADA, que es la regla que ya se midió en Eco, en
   RECREO y en PULSO: la cama de fondo tiene que quedar MUY por debajo de un
   acierto, porque si compiten, el acierto deja de ser un acontecimiento y pasa
   a ser un matiz. Fondo 0,03 · toque 0,10 · acierto 0,18 · error 0,22 · final
   0,30. */
let AUD = null, MAESTRO = null, ANAL = null, RUIDO = null, CAMA = null;
let SILENCIO = false;

function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAESTRO = AUD.createGain(); MAESTRO.gain.value = 0.9;
  MAESTRO.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAESTRO.connect(ANAL);
  /* un segundo de ruido blanco generado una vez: cada golpe es el mismo ruido
     con otro filtro y otro sobre, así que no hay que generar nada más */
  const n = AUD.sampleRate;
  RUIDO = AUD.createBuffer(1, n, n);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
}

function env(gn, t0, at, dur, pico){
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t0 + at);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function tono(t0, f0, f1, dur, pico, tipo){
  if (!AUD) return;
  const o = AUD.createOscillator(); o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const gn = AUD.createGain(); o.connect(gn); gn.connect(MAESTRO);
  env(gn, t0, Math.min(0.02, dur*0.2), dur, pico);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function ruido(t0, dur, f, q, pico, tipo){
  if (!AUD) return null;
  const s = AUD.createBufferSource(); s.buffer = RUIDO; s.loop = true;
  const b = AUD.createBiquadFilter(); b.type = tipo || 'bandpass';
  b.frequency.value = f; b.Q.value = q;
  const gn = AUD.createGain();
  s.connect(b); b.connect(gn); gn.connect(MAESTRO);
  env(gn, t0, Math.min(0.01, dur*0.2), dur, pico);
  s.start(t0); s.stop(t0 + dur + 0.05);
  return b;
}

/* ── LA ESCALA PENTATÓNICA NO ES UN GUSTO ──
   Un acierto suena cien veces por partida. En cualquier otra escala, dos notas
   seguidas pueden sonar mal juntas y a los treinta segundos molesta; en
   pentatónica cualquier nota pega con cualquier otra. Es la misma decisión que
   en POMPOM, y ahí se notó al primer minuto de juego. */
const PENTA = [0, 2, 4, 7, 9];
function nota(i){ /* i = grado, sube por octavas */
  const o = Math.floor(i / 5), s = PENTA[((i % 5) + 5) % 5];
  return 220 * Math.pow(2, (s + 12*o) / 12);
}

let _racha = 0;
function son(tipo, k){
  if (!AUD || SILENCIO) return;
  const t = AUD.currentTime, v = k == null ? 1 : k;
  if (tipo === 'toque'){
    tono(t, 620, 460, 0.05, 0.10*v, 'sine');
  } else if (tipo === 'bien'){
    /* ── LA RACHA SUBE DE NOTA, Y ES LO QUE ENGANCHA ──
       Con una nota fija, veinte aciertos son el mismo sonido veinte veces. Con
       la escala subiendo, la racha SE ESCUCHA: el jugador oye que va bien antes
       de mirar el número, y perder la racha se siente porque el tono vuelve
       abajo. Es la mitad del enganche de un minijuego y cuesta dos líneas. */
    _racha = Math.min(_racha + 1, 14);
    tono(t, nota(_racha + 4), nota(_racha + 4)*1.5, 0.16, 0.18*v, 'triangle');
    tono(t + 0.03, nota(_racha + 9), nota(_racha + 9), 0.10, 0.07*v, 'sine');
  } else if (tipo === 'mal'){
    _racha = 0;
    tono(t, 190, 78, 0.30, 0.22*v, 'sawtooth');
    ruido(t, 0.16, 260, 0.8, 0.14*v, 'lowpass');
  } else if (tipo === 'gana'){
    _racha = 0;
    for (let i = 0; i < 5; i++)
      tono(t + i*0.085, nota(6 + i*2), nota(6 + i*2), 0.30, 0.30, 'triangle');
  } else if (tipo === 'pierde'){
    _racha = 0;
    for (let i = 0; i < 3; i++)
      tono(t + i*0.13, nota(8 - i*3), nota(8 - i*3)*0.98, 0.34, 0.24, 'sawtooth');
  } else if (tipo === 'raspa'){
    const b = ruido(t, 0.09, 2600, 0.6, 0.13*v);
    if (b) b.frequency.linearRampToValueAtTime(1400, t + 0.09);
  } else if (tipo === 'clic'){
    ruido(t, 0.035, 1800, 1.4, 0.12*v);
  } else if (tipo === 'pop'){
    /* una burbuja que revienta: un golpe de ruido corto y agudo mas un tono que
       cae rapido. El tono solo suena a bip; el ruido solo, a chasquido. */
    ruido(t, 0.05, 1500 + 900*Math.random(), 1.1, 0.14*v);
    tono(t, 900, 320, 0.07, 0.09*v, 'sine');
  } else if (tipo === 'caida'){
    /* algo apoyandose: casi todo grave, porque lo que dice «peso» es lo de
       abajo. Con un tono agudo se lee a boton y no a bloque. */
    tono(t, 150, 62, 0.13, 0.16*v, 'sine');
    ruido(t, 0.06, 220, 0.7, 0.10*v, 'lowpass');
  }
}
function rachaCero(){ _racha = 0; }

/* la cama: dos senos muy graves y desafinados entre sí, que baten cada pocos
   segundos. Dos senos idénticos suenan a tono de prueba; desafinados suenan a
   instrumento, y es lo que ya se midió en POMPOM. */
function camaFondo(on){
  if (!AUD) return;
  if (on && !CAMA){
    const o = AUD.createOscillator(); o.type = 'sine'; o.frequency.value = 55;
    const o2 = AUD.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.4;
    const gn = AUD.createGain(); gn.gain.value = 0.030;
    o.connect(gn); o2.connect(gn); gn.connect(MAESTRO);
    o.start(); o2.start();
    CAMA = { o, o2, gn };
  } else if (!on && CAMA){
    CAMA.gn.gain.setTargetAtTime(0.0001, AUD.currentTime, 0.25);
    const c = CAMA; CAMA = null;
    setTimeout(() => { try { c.o.stop(); c.o2.stop(); } catch(e){} }, 900);
  }
}
function pico(){
  if (!ANAL) return 0;
  const a = new Uint8Array(ANAL.fftSize);
  ANAL.getByteTimeDomainData(a);
  let m = 0;
  for (const v of a) m = Math.max(m, Math.abs(v - 128) / 128);
  return +m.toFixed(4);
}
/* ══════════════════ LOS ASSETS GENERADOS ══════════════════
   Las imágenes y el sonido están generados con Rezona y horneados en base64
   dentro del archivo por `herramientas/casual/hornear.py`. Este módulo es lo
   único que los conoce: los juegos piden `IMG.pj` o `dibCuadro('pj', 2, …)` y
   no saben de dónde salió.

   ── Y NADA REEMPLAZA NADA HASTA QUE LLEGA ──
   Es la regla del repo y acá pesa más que en ningún otro juego: un data URI se
   decodifica de forma ASINCRÓNICA, así que un juego que naciera esperando la
   foto daría un cuadro —o veinte— en negro justo en el primer segundo, que es
   el único que un minijuego tiene para engancharte. Todo lo dibujado por código
   sigue en pie y la imagen lo PISA cuando está lista. Si una no decodifica,
   cuesta esa pieza y no la pantalla. */

const IMG = {}, SON = {};
let AS_LISTAS = 0, AS_PEDIDAS = 0, AS_FALLADAS = 0;

function cargaImg(){
  if (typeof AS === 'undefined' || !AS.img) return;
  for (const k in AS.img){
    const m = AS.img[k];
    const o = { ok: false, n: m.n || 1, w: m.w || 0, h: m.h || 0,
                im: new Image(), msk: null, cache: {} };
    IMG[k] = o; AS_PEDIDAS++;
    o.im.onload = () => {
      o.ok = true; AS_LISTAS++;
      if (!o.w){ o.w = o.im.width; o.h = o.im.height; }
    };
    o.im.onerror = () => { AS_FALLADAS++; };
    o.im.src = m.d;
    if (m.m){ o.msk = new Image(); o.msk.src = m.m; }
  }
}

/* el sonido necesita el contexto, así que se carga cuando el contexto existe —
   o sea con el primer toque. Ningún navegador deja sonar nada antes de un
   gesto, así que decodificar antes sería trabajo tirado. */
let _sonPedido = false;
function cargaSon(){
  if (_sonPedido || !AUD || typeof AS === 'undefined' || !AS.son) return;
  _sonPedido = true;
  for (const k in AS.son){
    const b = atob(AS.son[k]);
    const ab = new ArrayBuffer(b.length), v = new Uint8Array(ab);
    for (let i = 0; i < b.length; i++) v[i] = b.charCodeAt(i);
    AUD.decodeAudioData(ab, (buf) => {
      SON[k] = buf;
      /* ── Y SI EL TEMA QUE HACE FALTA ERA ESTE, ARRANCA AHORA ──
         `decodeAudioData` es asincronico, asi que el primer pedido de musica
         casi siempre llega ANTES de que el buffer exista: sin esto, el menu
         se quedaria con la cama de osciladores para siempre y el tema
         generado no sonaria nunca. */
      if (_musK === k) musQuiere(k);
    }, () => {});
  }
}

/* ══════════ LA MÚSICA ══════════
   Va con `BufferSource` en bucle y no con un `<audio loop>`: el loop de un
   `<audio>` vuelve al cero con un hueco de milisegundos y en un tema de nueve
   segundos eso se escucha en cada vuelta. Más la cola fundida sobre la cabeza,
   que la pone el horneado.

   Y SE CRUZAN, no se cortan: el menú y la partida son dos temas, y un corte en
   seco entre los dos se lee a error y no a que empezó el juego. */
const MUS_VOL = { menu: 0.30, mus: 0.26 };
let MUS = null;

function musPon(k){
  if (!AUD) return;
  if (MUS && MUS.k === k) return;
  if (MUS){
    const v = MUS; MUS = null;
    v.gn.gain.cancelScheduledValues(AUD.currentTime);
    v.gn.gain.setTargetAtTime(0.0001, AUD.currentTime, 0.28);
    setTimeout(() => { try { v.src.stop(); } catch(e){} }, 1200);
  }
  if (!k || !SON[k]) return;
  const src = AUD.createBufferSource();
  src.buffer = SON[k]; src.loop = true;
  const gn = AUD.createGain(); gn.gain.value = 0.0001;
  src.connect(gn); gn.connect(MAESTRO);
  src.start();
  gn.gain.setTargetAtTime(MUS_VOL[k] != null ? MUS_VOL[k] : 0.26, AUD.currentTime, 0.35);
  MUS = { k, src, gn };
}
/* ── QUE TEMA QUIERE EL JUEGO ──
   Un solo sitio decide si suena la muestra o la cama de osciladores, y se
   acuerda de lo que se le pidio para poder arrancarlo cuando el buffer llegue.
   Repartido en cinco llamadas, el dia que se agregue una pantalla va a quedar
   una sin musica y nadie se va a enterar hasta jugarla. */
let _musK = null;
function musQuiere(k){
  _musK = k;
  cargaSon();
  if (k && SON[k]){ camaFondo(false); musPon(k); return; }
  musPon(null);
  camaFondo(!!k);
}

/* la música se agacha mientras suena algo importante: si compiten, el
   acontecimiento deja de ser un acontecimiento y pasa a ser un matiz */
function musAgacha(k, seg){
  if (!MUS) return;
  const g0 = MUS_VOL[MUS.k] != null ? MUS_VOL[MUS.k] : 0.26;
  MUS.gn.gain.cancelScheduledValues(AUD.currentTime);
  MUS.gn.gain.setTargetAtTime(g0*k, AUD.currentTime, 0.05);
  MUS.gn.gain.setTargetAtTime(g0, AUD.currentTime + (seg || 0.5), 0.25);
}

/* ══════════ EL SONIDO: LA MUESTRA PRIMERO Y EL OSCILADOR DE RED ══════════
   `son()` sigue siendo el de siempre —está medido y funciona— y esto lo
   ENVUELVE: si el juego declaró un alias y la muestra decodificó, suena la
   muestra; si no, suena el sintetizado. Un juego mudo por un decodificador es
   peor que un juego con bips, y ya pasó una vez en este repo. */
const _sonProc = son;
son = function(tipo, k){
  if (!AUD || SILENCIO) return;
  const al = (typeof SON_ALIAS !== 'undefined' && SON_ALIAS) ? SON_ALIAS[tipo] : null;
  if (al && SON[al]){
    if (tipo === 'bien') _racha = Math.min(_racha + 1, 14);
    else if (tipo === 'mal' || tipo === 'gana' || tipo === 'pierde') _racha = 0;
    const src = AUD.createBufferSource();
    src.buffer = SON[al];
    const gn = AUD.createGain();
    gn.gain.value = (k == null ? 1 : k) * 0.85;
    src.connect(gn); gn.connect(MAESTRO);
    src.start();
    return;
  }
  _sonProc(tipo, k);
};

/* ══════════ DIBUJO ══════════ */

/* el fondo se dibuja por COVER y no estirado: la imagen viene 720x1280 y el
   alto de diseño se mueve entre 1100 y 1760 según la pantalla, así que
   estirándola la entrada del boliche sale aplastada en un teléfono largo */
function dibCubre(k){
  const o = IMG[k];
  if (!o || !o.ok) return false;
  const e = Math.max(AN/o.im.width, AL/o.im.height);
  const w = o.im.width*e, h = o.im.height*e;
  g.drawImage(o.im, (AN - w)/2, (AL - h)/2, w, h);
  return true;
}

/* un cuadro de una hoja de sprites, centrado en x y APOYADO en y (los pies),
   que es como se piensa un personaje. `esp` lo espeja. */
function dibCuadro(k, i, x, y, alto, esp, lienzo){
  const o = IMG[k];
  if (!o || !o.ok) return false;
  const src = lienzo || o.im;
  const e = alto / o.h, w = o.w*e;
  g.save();
  g.translate(x, y);
  if (esp) g.scale(-1, 1);
  g.drawImage(src, (i % o.n)*o.w, 0, o.w, o.h, -w/2, -alto, w, alto);
  g.restore();
  return true;
}

/* ── EL TEÑIDO: LA HOJA SE PINTA UNA VEZ Y SE GUARDA ──
   El personaje se generó con la ropa BLANCA para poder pintarla del color que
   la regla pida. Pintar por cuadro serían tres operaciones de lienzo sesenta
   veces por segundo para obtener siempre lo mismo: se hornea una hoja por
   color la primera vez que se pide y después son copias.

   `multiply` sobre blanco devuelve el color exacto y sobre el contorno oscuro
   lo deja oscuro, que es justo lo que tiene que pasar. Y donde la máscara es
   transparente no cambia nada, así que la piel y el pelo no se tocan. */
function tenido(k, color){
  const o = IMG[k];
  if (!o || !o.ok) return null;
  if (o.cache[color]) return o.cache[color];
  /* ── Y NO SE CACHEA UN TEÑIDO HECHO SIN LA MÁSCARA ──
     La máscara es una segunda imagen y decodifica DESPUÉS de la hoja. Sin esta
     guarda, el primer cuadro teñía con la hoja entera de máscara —o sea todo el
     sprite, piel incluida— y GUARDABA eso para siempre: medido en la captura,
     el visitante salía azul de la cara a las zapatillas.
     Mientras la máscara no esté, se devuelve la hoja cruda sin teñir y sin
     guardar nada: un visitante de blanco por dos cuadros es infinitamente mejor
     que uno pintado entero por el resto de la partida. */
  if (AS.img[k] && AS.img[k].m && !(o.msk && o.msk.complete)) return o.im;
  const c = document.createElement('canvas');
  c.width = o.im.width; c.height = o.im.height;
  const x = c.getContext('2d');
  x.drawImage(o.im, 0, 0);
  const t = document.createElement('canvas');
  t.width = c.width; t.height = c.height;
  const y = t.getContext('2d');
  /* la máscara es la de la ropa si la hay; si no, el sprite entero (que en ese
     caso se generó blanco a propósito, como la bola de MANCHA) */
  y.drawImage(o.msk && o.msk.complete ? o.msk : o.im, 0, 0);
  y.globalCompositeOperation = 'source-in';
  y.fillStyle = color; y.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'multiply';
  x.drawImage(t, 0, 0);
  o.cache[color] = c;
  return c;
}

/* una textura como patrón repetible, guardada. Se hornean embaldosadas de
   verdad (la banda del borde fundida sobre el opuesto), así que se repiten sin
   espejo y sin costura. */
function patron(k){
  const o = IMG[k];
  if (!o || !o.ok) return null;
  if (!o.pat) o.pat = g.createPattern(o.im, 'repeat');
  return o.pat;
}

/* un sello (la salpicadura, la bola) teñido y girado. El sello se horneó con el
   RGB en blanco puro, así que el color sale exacto y no multiplicado por lo que
   la generación hubiera puesto de gris. */
function dibSello(k, x, y, r, gi, color){
  const c = tenido(k, color);
  if (!c) return false;
  g.save();
  g.translate(x, y);
  if (gi) g.rotate(gi);
  g.drawImage(c, -r, -r, r*2, r*2);
  g.restore();
  return true;
}

function asEstado(){
  return { pedidas: AS_PEDIDAS, listas: AS_LISTAS, falladas: AS_FALLADAS,
           son: Object.keys(SON).length,
           mus: MUS ? MUS.k : null };
}
/* ══════════════════ EL JUGO Y LA RACHA ══════════════════
   Lo que separa un minijuego de una demostración de una mecánica. Va en el
   núcleo y no en cada juego por la razón de siempre —cinco copias divergen— y
   porque acá hay algo más: la RACHA es una segunda capa de juego que los cinco
   heredan de una.

   ── POR QUÉ UN MULTIPLICADOR Y NO PUNTOS MÁS GRANDES ──
   Un minijuego de cuarenta segundos con un solo verbo tiene un problema de
   diseño concreto: la décima vez que hacés la cosa vale lo mismo que la
   primera, así que a los quince segundos ya sabés cuánto vas a sacar. Con el
   multiplicador la partida tiene una CURVA: los primeros cuatro aciertos valen
   uno, el quinto vale dos, y a partir de ahí cada error no cuesta un punto,
   cuesta la escalera entera. Eso convierte «tocar bien» en «no cortar la
   racha», que es una decisión aunque el verbo sea el mismo.

   Y LA VENTANA ES DE TIEMPO Y NO SÓLO DE ACIERTOS: dudar también corta. En un
   juego que se filma, eso es lo que hace que el jugador se apure. */

const COMBO = { n: 0, t: 0, mult: 1, max: 0, brillo: 0 };
const COMBO_VENT = 2.8;          /* segundos de gracia entre dos aciertos */
const COMBO_ESC = 4;             /* aciertos por escalón */
const COMBO_TOPE = 5;            /* x5 y no más: con x10 la última partida borra
                                    todas las anteriores y el récord deja de
                                    querer decir algo */

function comboCero(){
  COMBO.n = 0; COMBO.t = 0; COMBO.mult = 1; COMBO.brillo = 0;
  pintaCombo();
}
function comboSuma(){
  COMBO.n++;
  COMBO.t = COMBO_VENT;
  const m = Math.min(COMBO_TOPE, 1 + Math.floor(COMBO.n / COMBO_ESC));
  if (m !== COMBO.mult){
    COMBO.mult = m;
    COMBO.brillo = 1;
    /* el escalón suena, y suena distinto de un acierto: si sonara igual, subir
       de multiplicador no se notaría hasta mirar el número */
    son('combo');
    sacude(0.35);
  }
  if (COMBO.n > COMBO.max) COMBO.max = COMBO.n;
  pintaCombo();
}
function comboCorta(){
  if (COMBO.n === 0 && COMBO.mult === 1) return;
  COMBO.n = 0; COMBO.mult = 1; COMBO.t = 0; COMBO.brillo = 0;
  pintaCombo();
}
function comboPaso(dt){
  if (COMBO.brillo > 0) COMBO.brillo -= dt*2.2;
  if (COMBO.t <= 0) return;
  COMBO.t -= dt;
  if (COMBO.t <= 0) comboCorta();
  else if (COMBO.mult > 1) pintaCombo();
}

/* la ficha del multiplicador vive en DOM como el resto del HUD: es un número
   que tiene que quedar nítido en cualquier densidad de pantalla. Y se escribe
   sólo cuando cambia, salvo la barra de la ventana, que es un ancho. */
let _comboUlt = '';
function pintaCombo(){
  const e = $('combo');
  if (!e) return;
  const v = COMBO.mult > 1 ? ('x' + COMBO.mult) : '';
  if (v !== _comboUlt){ e.textContent = v; _comboUlt = v; e.classList.toggle('on', !!v); }
  const b = $('comboB');
  if (b) b.style.width = (COMBO.t > 0 ? (COMBO.t/COMBO_VENT*100) : 0).toFixed(0) + '%';
}

/* ── SUMAR PUNTOS PASA POR UN SOLO SITIO ──
   Acá se aplica el multiplicador, se sube la racha y sale el número flotante.
   Repartido, cada juego tendría que acordarse de las tres cosas y la primera
   que se olvide es el número, que es justo lo que hace que el punto se sienta
   ganado. */
function sumaPuntos(n, x, y){
  comboSuma();
  const g0 = n * COMBO.mult;
  PUNTOS += g0;
  if (x != null) flota('+' + g0, x, y, COMBO.mult > 1 ? '#ffd76a' : '#f2eee6',
                       COMBO.mult > 1 ? 44 : 34);
  return g0;
}

/* ══════════ PARTÍCULAS ══════════
   Con gravedad y con roce, y el color lo elige quien las tira. Son la
   diferencia entre «el bicho desapareció» y «le pegué»: sin nada, un objeto que
   se va del cuadro se lee a error de dibujo. */
const PART = [];
const PART_TOPE = 220;           /* tope duro: sin él, una racha larga en MANCHA
                                    llena el array y el cuadro se cae */
function chispas(x, y, n, col, fuerza){
  const f = fuerza || 1;
  for (let i = 0; i < n && PART.length < PART_TOPE; i++){
    const a = Math.random()*6.283, v = (90 + Math.random()*260)*f;
    PART.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60*f,
                r: 3 + Math.random()*6, t: 0.38 + Math.random()*0.42, T: 0, col });
  }
}
function partPaso(dt){
  for (let i = PART.length - 1; i >= 0; i--){
    const p = PART[i];
    p.T += dt;
    if (p.T >= p.t){ PART.splice(i, 1); continue; }
    p.vy += 1500*dt;
    p.vx *= 1 - 2.2*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ══════════ NÚMEROS FLOTANTES ══════════ */
const FLOT = [];
function flota(txt, x, y, col, tam){
  if (FLOT.length > 24) FLOT.shift();
  FLOT.push({ txt, x, y, col: col || '#f2eee6', tam: tam || 34, t: 0.9, T: 0 });
}
function flotPaso(dt){
  for (let i = FLOT.length - 1; i >= 0; i--){
    const f = FLOT[i];
    f.T += dt;
    if (f.T >= f.t) FLOT.splice(i, 1);
  }
}

/* ══════════ SACUDÓN ══════════
   Se aplica SÓLO a la capa del juego y no al fondo: sacudiendo el fondo
   aparecen dos franjas negras en los bordes, y eso se ve peor que no sacudir.
   Y decae rápido: un sacudón de medio segundo no es un golpe, es un terremoto. */
let SAC = 0;
function sacude(k){ SAC = Math.min(1.4, SAC + k); }
function sacPaso(dt){ if (SAC > 0) SAC = Math.max(0, SAC - dt*4.2); }
function sacAplica(){
  if (SAC <= 0.002) return false;
  const k = SAC*SAC;               /* al cuadrado: el final del sacudón se apaga
                                      y no queda un temblor largo y parejo */
  g.save();
  g.translate((Math.random() - 0.5)*26*k, (Math.random() - 0.5)*26*k);
  return true;
}

/* los tres cosméticos van con el `dt` del reloj y no con el paso fijo: son
   dibujo, así que tienen que verse igual de suaves a 30 y a 120 cuadros. La
   ventana de la racha NO está acá — vive adentro de la simulación, porque en
   dos de los cinco juegos el multiplicador es física y no puntos. */
function jugoPaso(dt){
  partPaso(dt); flotPaso(dt); sacPaso(dt);
}
function jugoPinta(){
  for (const p of PART){
    const u = 1 - p.T/p.t;
    g.globalAlpha = Math.min(1, u*1.8);
    disco(p.x, p.y, p.r*u, p.col);
  }
  g.globalAlpha = 1;
  for (const f of FLOT){
    const u = f.T/f.t;
    g.globalAlpha = Math.min(1, (1 - u)*2.2);
    /* sube y frena: con velocidad constante se lee a texto que se desliza */
    texto(f.txt, f.x, f.y - 80*(1 - (1 - u)*(1 - u)), f.tam*(1 + 0.14*(1 - u)), f.col);
    g.globalAlpha = 1;
  }
}
function jugoCero(){ PART.length = 0; FLOT.length = 0; SAC = 0; comboCero(); }
/* ══════════════════════ EL PROGRESO Y LA REJA DE NIVELES ══════════════════════
   Lo que separa un casual adictivo de un minijuego: que lo que hiciste QUEDE.
   Sin progreso guardado, un rompecabezas de doscientos niveles es el nivel 1
   doscientas veces — no hay a qué volver.

   TRES COSAS QUE ESTO TIENE QUE HACER BIEN:

   1. NO PUEDE FALLAR SI NO HAY DISCO. `localStorage` TIRA en una ventana
      privada, y esto se abre desde enlaces todo el tiempo. Todo va envuelto en
      `try`: sin disco el juego se juega igual y lo único que se pierde es el
      progreso, que es infinitamente mejor que una pantalla en blanco.
   2. LO QUE SE GUARDA ES LO MEJOR, NO LO ÚLTIMO. Rejugar un nivel que ya salió
      con tres estrellas y hacerlo con una no puede BAJARLE la nota: eso castiga
      justamente al que vuelve a jugar.
   3. EL FORMATO TIENE QUE SOBREVIVIR A UN JSON ROTO. Una versión anterior del
      juego, un dedo en la consola, media escritura: `JSON.parse` tira y ahí se
      cae el módulo entero. Va con `try` y con respaldo a vacío. */

const PROG = { est: {}, ultimo: 1 };
const P_CLAVE = 'cas_' + JUEGO.id + '_prog';

function progCarga(){
  try {
    const s = localStorage.getItem(P_CLAVE);
    if (!s) return;
    const o = JSON.parse(s);
    if (o && typeof o === 'object'){
      if (o.est && typeof o.est === 'object') PROG.est = o.est;
      if (o.ultimo) PROG.ultimo = o.ultimo|0;
    }
  } catch(e){ PROG.est = {}; PROG.ultimo = 1; }
}
function progGuarda(){
  try { localStorage.setItem(P_CLAVE, JSON.stringify(PROG)); } catch(e){}
}
/* cuántos niveles tiene este juego; los de puntaje devuelven 0 */
function progTotal(){ return JUEGO.nivelesTotal || 0; }
/* el 1 siempre está abierto; el resto pide que el anterior esté hecho */
function progAbierto(n){ return n <= 1 || PROG.est[n-1] != null; }
function progHecho(n){ return PROG.est[n] != null; }
function progEstrellas(n){ return PROG.est[n] || 0; }
/* el primero que falta: es el nivel que abre el botón JUGAR, así que quien
   vuelve al juego sigue donde estaba en vez de tener que buscarlo en la reja */
function progSiguiente(){
  const T = progTotal();
  for (let n = 1; n <= T; n++) if (!progHecho(n)) return n;
  return T;                      /* están todos: se queda en el último */
}
function progGana(n, estrellas){
  const e = Math.max(1, Math.min(3, estrellas|0));
  if (!(PROG.est[n] > e)) PROG.est[n] = e;   /* nunca baja la nota */
  PROG.ultimo = Math.max(PROG.ultimo, Math.min(progTotal(), n+1));
  progGuarda();
}
function progContados(){
  let n = 0, e = 0;
  for (const k in PROG.est){ n++; e += PROG.est[k]|0; }
  return { hechos: n, estrellas: e };
}

/* ── LA REJA SE ARMA UNA VEZ Y DESPUÉS SÓLO SE REPINTA ──
   Doscientos botones creados de nuevo en cada visita al selector son doscientos
   nodos que el navegador tiene que descartar y volver a hacer, y encima se
   pierde la posición del deslizamiento: el jugador vuelve del nivel 140 y la
   reja lo deja arriba de todo, mirando el 1. */
let _rejaHecha = false;
function rejaArma(){
  const T = progTotal();
  if (_rejaHecha || !T) return;
  const r = $('rejaN');
  r.innerHTML = '';
  for (let n = 1; n <= T; n++){
    const b = document.createElement('button');
    b.className = 'nv';
    b.dataset.n = n;
    b.innerHTML = '<span class="num">' + n + '</span><span class="es"></span>';
    b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const k = +b.dataset.n;
      if (!progAbierto(k)) return;
      son('clic');
      empieza(k);
    });
    r.appendChild(b);
  }
  /* el alto de la reja sale de lo que sobra entre el título y el botón MENÚ; en
     px y no en vh porque el marco puede ser más chico que la ventana */
  r.style.maxHeight = Math.round(caja.clientHeight * 0.66) + 'px';
  _rejaHecha = true;
}
function rejaPinta(){
  const T = progTotal();
  if (!T) return;
  const r = $('rejaN');
  for (const b of r.children){
    const n = +b.dataset.n;
    const ab = progAbierto(n), e = progEstrellas(n);
    b.classList.toggle('trabado', !ab);
    b.classList.toggle('hecho', e > 0);
    b.disabled = !ab;
    b.querySelector('.es').textContent = e ? '★'.repeat(e) : '';
  }
}
function verNiveles(){
  MODO = 'niveles';
  rejaArma();
  rejaPinta();
  verPantalla('pNiveles');
  /* deja a la vista el primero que falta: con doscientos niveles, abrir la reja
     arriba de todo obliga a deslizar medio minuto para llegar a donde uno iba */
  const b = $('rejaN').querySelector('[data-n="' + progSiguiente() + '"]');
  if (b) $('rejaN').scrollTop = Math.max(0, b.offsetTop - $('rejaN').clientHeight*0.35);
}
/* ══════════════════════ LA CINEMÁTICA ══════════════════════
   Cuatro o cinco planos de tres segundos, dibujados en el MISMO lienzo con la
   misma tinta que el juego. Nada de fotos: una imagen pegada arriba de un juego
   de dos colores se ve pegada arriba, y eso ya costó una vuelta en POMPOM.

   TRES REGLAS, Y LAS TRES SALEN DE HABERSE EQUIVOCADO ANTES:

   1. ES UNA FUNCIÓN DEL TIEMPO, NO UNA MÁQUINA DE ESTADOS. `cinePon(t)` recibe
      el segundo y dibuja. Por eso la prueba puede fotografiar el segundo 7,4
      sin esperar siete segundos, y por eso los defectos de encuadre se
      encuentran mirando un instante en vez de mirando el código.

   2. SE PUEDE SALTEAR, CON GRACIA DE MEDIO SEGUNDO. Una cinemática obligatoria
      se ve una vez; vista cinco veces es un peaje, y un minijuego se abre
      veinte veces. La gracia no es capricho: el mismo toque que apretó JUGAR
      llega a veces como un segundo evento y se la comería entera — es
      exactamente la guarda que hizo falta en BARRIO y en POMPOM.

   3. SÓLO LA PRIMERA VEZ. Después queda en su botón del menú. */
const CINE = { on: false, t: 0, dur: 0, plano: -1, gracia: 0, alTerminar: null };

function cineArranca(alTerminar){
  CINE.on = true; CINE.t = 0; CINE.plano = -1; CINE.gracia = 0.55;
  CINE.alTerminar = alTerminar || null;
  CINE.dur = JUEGO.planos.reduce((a, p) => a + p.dur, 0);
  MODO = 'cine';
  $('cine').classList.add('on');
  $('salta').classList.add('on');
  $('hud').classList.remove('on');
  for (const p of document.querySelectorAll('.pan')) p.classList.remove('on');
}
function cineSalta(){
