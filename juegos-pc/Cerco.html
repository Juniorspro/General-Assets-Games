<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10141d">
<title>CERCO</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   A · MARCO, PIEL Y PANTALLAS
   Vertical NATIVO: el tablero es cuadrado y la camara lo recorre, asi que lo
   que decide el formato es la mano — el telefono como uno lo agarra. Nada
   que girar y ninguna pantalla de «gira el celular».
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --fondo:#10141d; --tabla:#171d29; --linea:#212a3a; --piedra:#2f3a4e;
  --tinta:#e8edf6; --tinta2:#8f9cb3;
  --yo:#f0a13a; --yo2:#ffd9a0;
  --acento:#f0a13a; --mal:#e0556e;
  --mw:412px; --mh:892px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070b;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#marco{position:fixed;inset:0;display:flex;flex-direction:column;
  background:var(--fondo);color:var(--tinta);overflow:hidden}

/* ── el lienzo ── */
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}

/* ══ HUD ══════════════════════════════════════════════════════════════════
   Todo lo que es TEXTO vive en el DOM y no en el lienzo: tiene que poder
   traducirse y tiene que salir nitido en cualquier densidad. Y todo lo que
   es texto esta en la misma columna de arriba o en la de abajo, asi el
   solapamiento no depende de acordarse de un pixel.                        */
/* ══ EL VELO DE LAS DOS FRANJAS ══════════════════════════════════════════
   EL HUD SE DIBUJA ENCIMA DEL TABLERO Y EL TABLERO SE LLENA DE COLOR. Medido
   el contraste de cada tinta contra los ocho colores de cuerpo: sobre el
   tablero vacio se lee todo (6,62 · 15,63 · 8,63) y sobre territorio —de
   quien sea— NO SE LEE NADA: la mejor casilla de la matriz da 3,10 y la peor
   1,00, que es el `10,5 %` en `--yo` encima del territorio propio, o sea
   exactamente el mismo color. Y eso NO se arregla eligiendo otra tinta: hay
   ocho cuerpos repartidos cada 45 grados de tono, asi que cualquier color que
   gane contra uno pierde contra su complementario. La unica salida es
   respaldo.
   EL 0,70 ESTA MEDIDO Y NO ELEGIDO: con el velo al color del fondo, el peor
   caso del numero grande pasa de 1,00 a 4,12 y el de los rotulitos de 1,13 a
   3,17. Por debajo de 0,62 el numero grande no llega a 3,3.
   Y VA EN DEGRADADO, cerrado en el canto y abierto hacia adentro: las dos
   franjas suman el 14 % de la pantalla, y el medio —que es donde se juega— no
   se toca. Es el mismo reparto que el velo del menu.
   EN LA CAMPANA NO HACIA FALTA POR SUERTE GEOMETRICA: dos a cuatro cuerpos
   sobre un tablero chico dejan el HUD casi siempre sobre fondo vacio. Con
   ocho cuerpos y 92 de lado, el HUD pasa la partida encima de territorio. */
#velo{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(16,20,29,.70) 0, rgba(16,20,29,.70) 52px, rgba(16,20,29,0) 106px),
    linear-gradient(to top,    rgba(16,20,29,.70) 0, rgba(16,20,29,.70) 58px, rgba(16,20,29,0) 118px)}
#velo.off{display:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 9px) 13px 0;
  z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:7px}
#hud.off{display:none}
#fila1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#vidas{display:flex;gap:5px;align-items:center;height:26px}
.cor{width:17px;height:17px;position:relative;transition:transform .22s,opacity .22s}
/* LOS DOS LOBULOS PIVOTAN SOBRE LA PUNTA DEL CORAZON, no sobre su propio pie.
   Con `transform-origin:50% 100%` cada lobulo gira alrededor de SU centro de
   abajo, y como esos dos centros estan a ocho pixeles uno del otro lo que sale
   son dos bollos separados con una muesca en V ABAJO: un corazon dado vuelta.
   Fotografiado y contado. Los dos origenes tienen que caer en el MISMO punto
   —el pie del corazon— y de ahi los lobulos se abren hacia arriba.          */
.cor::before,.cor::after{content:'';position:absolute;width:9px;height:13px;border-radius:5px 5px 0 0;
  background:var(--yo);top:1px}
.cor::before{left:8px;transform:rotate(-45deg);transform-origin:0 100%}
.cor::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
.cor.ida{opacity:.2;transform:scale(.72)}
.cor.ida::before,.cor.ida::after{background:var(--tinta2)}
.cor.late{animation:late .5s ease}
@keyframes late{0%,100%{transform:scale(1)}35%{transform:scale(1.45)}}
#nivRot{flex:1;text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;
  color:var(--tinta2);line-height:15px;padding-top:3px}
#nivRot b{display:block;font-size:9px;font-weight:700;letter-spacing:.2em;opacity:.62}
#bPausa{pointer-events:auto;width:32px;height:26px;border:0;background:transparent;
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
#bPausa i{width:4px;height:14px;border-radius:2px;background:var(--tinta2);display:block}

/* ── LA BARRA DE REPARTO ──────────────────────────────────────────────────
   Una sola barra donde cada jugador ocupa su tajada y una marca dice donde
   esta la meta. Con cuatro contadores sueltos habria que leer cuatro
   numeros y restarlos; asi el estado de la partida se lee de una ojeada.  */
#barra{position:relative;height:9px;border-radius:5px;overflow:hidden;
  background:rgba(255,255,255,.07);display:flex}
#barra i{display:block;height:100%;width:0;transition:width .18s linear}
#meta{position:absolute;top:-3px;width:2px;height:15px;border-radius:1px;
  background:var(--tinta);box-shadow:0 0 0 1px rgba(0,0,0,.5);left:0}

/* ── el mapa chico ──

   EL 66 ESTA MEDIDO Y NO ELEGIDO. `#hud` es una columna: 9 px de relleno de
   arriba + `#fila1` + 7 de hueco + los 9 de `#barra`. Y `#fila1` NO mide 26 como
   las vidas: lo estira `#nivRot`, que lleva dos renglones y da 33. O sea que la
   barra ocupa de y 49 a 58, y con el mapa en 52 se pisaban seis pixeles en la
   franja x 325..399 —medido con `cajas()`: `choques: ["barra×mini"]`—. Con 66
   quedan ocho de aire. Si manana el rotulo cambia de alto, este numero se vuelve
   a medir; no se adivina.                                                    */
#mini{position:absolute;right:13px;top:calc(env(safe-area-inset-top,0px) + 66px);
  width:74px;height:74px;z-index:3;pointer-events:none;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.22);background:transparent;
  box-shadow:0 2px 10px rgba(0,0,0,.35)}
#mini.off{display:none}

/* ── LA TABLA DE POSICIONES (solo arena) ──────────────────────────────────
   EL 148 SALE DE LA MISMA CUENTA QUE EL 66 DEL MAPA: 66 de arranque + 74 de
   alto + 8 de aire, o sea el mismo hueco que hay entre la barra y el mapa. Y
   mide 74 de ancho para caer en la misma columna: dos cajas apiladas con
   anchos distintos se leen a dos cosas sueltas y no a una columna de datos.

   OCHO FILAS SIEMPRE, tambien las de los muertos: sacando al que se murio,
   los puestos de abajo SUBEN sin que nadie haya hecho nada —y el alto de la
   caja cambiaria en el medio de la partida—. El muerto se atenua y se queda. */
#tabla{position:absolute;right:13px;top:calc(env(safe-area-inset-top,0px) + 148px);
  width:74px;z-index:3;pointer-events:none;border-radius:8px;padding:5px 6px;
/* EL RESPALDO ESTA MEDIDO: con .28 las filas de los rivales —que van en
     `--tinta2`— dan 1,11 de contraste contra el peor de los ocho colores de
     cuerpo, o sea que la tabla se borra en cuanto queda encima de territorio.
     Con .76 el peor caso pasa a 4,71 y la fila propia a 11,12. La tabla mide
     74 px de 412 y vive en la esquina: no tapa nada que se juegue.        */
  background:rgba(0,0,0,.76);border:1.5px solid rgba(255,255,255,.14);
  display:flex;flex-direction:column;gap:3px}
#tabla.off{display:none}
#tabla .tf{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;
  letter-spacing:.02em;color:var(--tinta2);line-height:11px;height:11px}
#tabla .tf.yo{color:var(--tinta)}
#tabla .tf.muerto{opacity:.34}
#tabla .tn{width:9px;text-align:right;opacity:.7;font-variant-numeric:tabular-nums}
#tabla .tc{width:6px;height:6px;border-radius:2px;flex:none}
#tabla .tp{flex:1;text-align:right;font-variant-numeric:tabular-nums}

/* ── pie ── */
#pie{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 11px);
  padding:0 15px;display:flex;align-items:flex-end;justify-content:space-between;z-index:3;pointer-events:none}
#pie.off{display:none}
#pct{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--tinta2)}
#pct b{display:block;font-size:25px;letter-spacing:0;color:var(--yo);line-height:1.05}
#reloj{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--tinta2);text-align:right}
#reloj b{display:block;font-size:25px;letter-spacing:.02em;color:var(--tinta);line-height:1.05;
  font-variant-numeric:tabular-nums}
#reloj.poco b{color:var(--mal)}

/* ── la pista del tutorial ── */
#pista{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  text-align:center;font-size:14px;font-weight:700;line-height:1.35;z-index:4;pointer-events:none;
  color:var(--tinta);background:rgba(16,20,29,.9);border:1.5px solid rgba(255,255,255,.14);
  border-radius:14px;padding:10px 14px;box-shadow:0 8px 22px rgba(0,0,0,.45);
  opacity:0;transform:translateY(8px);transition:opacity .28s,transform .28s}
#pista.on{opacity:1;transform:none}

/* EL TUTORIAL SE VE CADA VEZ QUE SE ABRE EL JUEGO, asi que TIENE que poder
   saltearse: obligatorio una vez es un tutorial y obligatorio siempre es un
   peaje. Va del lado libre —el mapa chico esta apagado en el tutorial—.   */
#tSalt{position:absolute;left:13px;top:calc(env(safe-area-inset-top,0px) + 58px);
  z-index:4;display:none}
#tSalt.on{display:block}

/* ── aviso corto ── */
#aviso{position:absolute;left:0;right:0;top:41%;text-align:center;z-index:6;pointer-events:none;
  font-size:22px;font-weight:900;letter-spacing:.12em;color:var(--acento);
  text-shadow:0 3px 16px rgba(0,0,0,.9);opacity:0;transition:opacity .2s}
#aviso.on{opacity:1}

/* ══ PANELES ══════════════════════════════════════════════════════════════
   EL VELO SE ABRE EN EL MEDIO. Cerrado arriba —donde va el titulo— y abajo
   —donde van los botones—, y translucido en la franja del medio: detras
   sigue corriendo el tablero, que es lo unico que este juego tiene que
   ensenar antes de que alguien toque nada.                                 */
.pan{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:26px 22px;
  background:linear-gradient(180deg,rgba(16,20,29,.985) 0%,rgba(16,20,29,.93) 28%,
    rgba(16,20,29,.74) 50%,rgba(16,20,29,.94) 76%,rgba(16,20,29,.995) 100%);
  animation:ent .24s ease}
.pan.on{display:flex}
@keyframes ent{from{opacity:0}to{opacity:1}}
.pan h1{font-size:46px;font-weight:900;letter-spacing:.26em;margin-left:.26em;line-height:1}
.pan h2{font-size:24px;font-weight:900;letter-spacing:.14em;margin-left:.14em}
.pan .sub{font-size:13px;font-weight:600;color:var(--tinta2);text-align:center;line-height:1.5;margin-top:10px}
.pan .pie{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--tinta2);opacity:.5;text-align:center}
.bt{border:0;background:var(--yo);color:#1b1204;font-size:14px;font-weight:800;
  letter-spacing:.16em;padding:15px 0;border-radius:14px;cursor:pointer;width:100%;
  box-shadow:0 5px 0 rgba(0,0,0,.42);transition:transform .1s,box-shadow .1s}
.bt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.42)}
.bt.sec{background:transparent;color:var(--tinta);border:2px solid rgba(255,255,255,.2);box-shadow:none}
.bt.sec:active{transform:none;background:rgba(255,255,255,.08)}
.col{display:flex;flex-direction:column;gap:11px;width:100%;max-width:290px}
.fila{display:flex;gap:10px;width:100%;max-width:290px}
/* EL PIE VA PEGADO A SU BOTON, y por eso lleva margen negativo: `.col` reparte
   once pixeles parejos, asi que sin esto la linea queda a la misma distancia
   del boton de arriba que del de abajo y no se sabe de cual habla.          */
.btSub{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--tinta2);
  text-align:center;opacity:.66;margin:-6px 0 1px}
.fila .bt{flex:1}

/* la marca: un cuadrado cerrandose sobre si mismo, que es el juego entero */
.marca{width:76px;height:76px;position:relative;margin-bottom:10px}
.marca i{position:absolute;display:block;border-radius:2px}
.marca .z{background:var(--yo);opacity:.28}
.marca .t{background:var(--yo2);box-shadow:0 0 8px rgba(255,217,160,.5)}
.marca .c{background:var(--yo);border-radius:50%;box-shadow:0 0 10px rgba(240,161,58,.8)}

/* ── lista de niveles ── */
#pNiv{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
#nvCab{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:330px;margin-bottom:4px}
#nvCab h2{font-size:19px}
#nvMundos{display:flex;gap:5px;width:100%;max-width:360px;margin:12px 0;justify-content:center}
.mtab{border:1.5px solid rgba(255,255,255,.18);background:transparent;color:var(--tinta2);
  font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:8px 6px;border-radius:9px;
  cursor:pointer;flex:1 1 0;min-width:0}
.mtab.sel{background:var(--yo);color:#1b1204;border-color:var(--yo)}
.mtab.cerr{opacity:.3}
#nvGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:330px;
  overflow-y:auto;flex:1;align-content:start;padding:2px 2px 16px}
.nvB{aspect-ratio:1;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  border-radius:12px;font-size:16px;font-weight:800;color:var(--tinta);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nvB.ok{background:var(--yo);color:#1b1204;border-color:var(--yo)}
.nvB.cerr{opacity:.28;background:transparent}
.nvB s{font-size:9px;letter-spacing:.06em;opacity:.85;text-decoration:none}

/* ── ajustes ── */
.aj{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  max-width:290px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.aj span{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--tinta2)}
.aj input[type=range]{width:130px;accent-color:var(--yo)}
.chip{border:1.5px solid rgba(255,255,255,.18);background:transparent;color:var(--tinta2);
  font-size:11px;font-weight:800;padding:7px 11px;border-radius:9px;cursor:pointer}
.chip.sel{background:var(--yo);color:#1b1204;border-color:var(--yo)}

/* ── carga ── */
#carga{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;background:var(--fondo);transition:opacity .4s}
#carga.off{opacity:0;pointer-events:none}
#cSub{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--tinta2)}
#cBarra{width:150px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#cBarra i{display:block;height:100%;width:35%;background:var(--yo);border-radius:2px;
  animation:cb 1.1s ease-in-out infinite}
@keyframes cb{0%{margin-left:-35%}100%{margin-left:100%}}

@media (max-height:700px){
  .pan h1{font-size:36px}.marca{transform:scale(.78);margin-bottom:0}
  .bt{padding:13px 0}.col{gap:9px}
}
</style></head><body>

<div id="marco">
  <canvas id="cv"></canvas>

  <div id="velo" class="off"></div>

  <div id="hud" class="off">
    <div id="fila1">
      <div id="vidas"></div>
      <div id="nivRot"><b id="nrM">MUNDO 1</b><span id="nrN">NIVEL 1-1</span></div>
      <button id="bPausa" aria-label="pausa"><i></i><i></i></button>
    </div>
    <div id="barra"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><div id="meta"></div></div>
  </div>

  <canvas id="mini" class="off" width="74" height="74"></canvas>
  <div id="tabla" class="off"></div>

  <div id="pista"></div>
  <button id="tSalt" class="chip">SALTEAR</button>
  <div id="aviso"></div>

  <div id="pie" class="off">
    <div id="pct"><b>0%</b><span id="pctR">META 40%</span></div>
    <div id="reloj"><b>1:30</b><span id="relR">TIEMPO</span></div>
  </div>

  <!-- idioma -->
  <div id="pIdioma" class="pan">
    <div class="marca">
      <i class="z" style="left:8px;top:30px;width:38px;height:38px"></i>
      <i class="t" style="left:8px;top:8px;width:3px;height:24px"></i>
      <i class="t" style="left:8px;top:8px;width:46px;height:3px"></i>
      <i class="c" style="left:49px;top:3px;width:13px;height:13px"></i>
    </div>
    <h1>CERCO</h1>
    <div class="sub" style="margin-bottom:20px">idioma · language · idioma</div>
    <div class="col">
      <button class="bt" data-lang="es">ESPAÑOL</button>
      <button class="bt" data-lang="en">ENGLISH</button>
      <button class="bt" data-lang="pt">PORTUGUÊS</button>
    </div>
  </div>

  <!-- menu -->
  <div id="pMenu" class="pan">
    <div class="marca">
      <i class="z" style="left:8px;top:30px;width:38px;height:38px"></i>
      <i class="t" style="left:8px;top:8px;width:3px;height:24px"></i>
      <i class="t" style="left:8px;top:8px;width:46px;height:3px"></i>
      <i class="c" style="left:49px;top:3px;width:13px;height:13px"></i>
    </div>
    <h1>CERCO</h1>
    <div class="sub" id="mSub"></div>
    <div class="col" style="margin-top:20px">
      <button class="bt" id="mJugar">ARENA</button>
      <div class="btSub" id="mJugarSub"></div>
      <button class="bt sec" id="mNiv">CAMPAÑA</button>
      <div class="btSub" id="mNivSub"></div>
      <div class="fila">
        <button class="bt sec" id="mTuto">CÓMO SE JUEGA</button>
        <button class="bt sec" id="mAj">AJUSTES</button>
      </div>
    </div>
    <div class="pie" id="mPie" style="margin-top:20px"></div>
  </div>

  <!-- lista de niveles -->
  <div id="pNiv" class="pan">
    <div id="nvCab"><h2 id="nvTit">NIVELES</h2><button class="chip" id="nvVolver">VOLVER</button></div>
    <div class="sub" id="nvSub" style="margin:0"></div>
    <div id="nvMundos"></div>
    <div id="nvGrid"></div>
  </div>

  <!-- ajustes -->
  <div id="pAj" class="pan">
    <h2 id="ajTit">AJUSTES</h2>
    <div style="height:14px"></div>
    <div class="aj"><span id="ajMus">MÚSICA</span><input type="range" id="rMus" min="0" max="100" value="45"></div>
    <div class="aj"><span id="ajFx">SONIDOS</span><input type="range" id="rFx" min="0" max="100" value="80"></div>
    <div class="aj"><span id="ajCal">GRÁFICOS</span><div style="display:flex;gap:6px">
      <button class="chip" data-cal="0">BAJO</button><button class="chip" data-cal="1">MEDIO</button><button class="chip" data-cal="2">ALTO</button>
    </div></div>
    <div class="aj"><span id="ajIdi">IDIOMA</span><div style="display:flex;gap:6px">
      <button class="chip" data-l2="es">ES</button><button class="chip" data-l2="en">EN</button><button class="chip" data-l2="pt">PT</button>
    </div></div>
    <div style="height:18px"></div>
    <div class="col">
      <button class="bt sec" id="ajBorrar">BORRAR EL PROGRESO</button>
      <button class="bt" id="ajVolver">VOLVER</button>
    </div>
  </div>

  <!-- pausa -->
  <div id="pPausa" class="pan">
    <h2 id="paTit">PAUSA</h2>
    <div class="sub" id="paSub"></div>
    <div class="col" style="margin-top:22px">
      <button class="bt" id="paSeguir">SEGUIR</button>
      <button class="bt sec" id="paRe">REINICIAR</button>
      <button class="bt sec" id="paSalir">SALIR AL MENÚ</button>
    </div>
  </div>

  <!-- final -->
  <div id="pFin" class="pan">

<script type="module">
import * as THREE from 'three';
/* ══════════════════════════════════════════════════════════════════════════
   B · CONSTANTES, MUNDOS, IDIOMAS Y GUARDADO
   ══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
const mez = (a, b, k) => a + (b - a) * k;

/* AZAR CON SEMILLA. Un nivel tiene que ser EL MISMO nivel en cualquier
   aparato y en cualquier intento: con un azar de verdad, «el 3-5» no querria
   decir nada y reintentar seria jugar otro mapa.                           */
function azar(s) {
  let x = (s | 0) || 1;
  return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x |= 0; return (x >>> 0) / 4294967296; };
}

/* ── LAS CUATRO DIRECCIONES ───────────────────────────────────────────────
   El indice ES la direccion y su opuesta es `d^1`. Con eso la regla de «no
   se puede dar media vuelta» —la de cualquier juego de estela— se escribe en
   una comparacion y no en una tabla que alguien tiene que mantener.        */
const DIR = [[1, 0], [-1, 0], [0, 1], [0, -1]];    /* der · izq · abajo · arriba */
const DNOM = ['der', 'izq', 'abajo', 'arriba'];

/* ── LO QUE HAY EN UNA CELDA ──────────────────────────────────────────────
   `z` es el DUENO del terreno y `t` el dueno de la ESTELA, y son dos cosas
   distintas a proposito: se puede estar parado sobre tierra propia y tener
   estela de otro en la misma celda. Guardarlo en un solo numero obligaria a
   inventar combinaciones y el dia que entre un cuarto rival no alcanzan.   */
const LIBRE = 0;      /* z: nadie                                           */
const PIEDRA = 9;     /* z: roca — bloquea, mata y corta el relleno         */
const NJUG = 8;       /* el jugador es el 1; los rivales van del 2 al 8     */
/* OCHO Y NO CUATRO, Y EL TECHO NO ES ARBITRARIO: `PIEDRA` vale 9, o sea que
   los identificadores 1..8 son exactamente los que entran por debajo de la
   roca sin tener que ensanchar `z` ni `t` a un tipo mas grande. La campana
   sigue usando de 2 a 4 y no paga un byte por los cuatro que no siembra.   */

/* ── LOS COLORES ──────────────────────────────────────────────────────────
   TRES POR JUGADOR, Y EN LA ESFERA EL REPARTO SE DA VUELTA. En el tablero
   plano el terreno era OSCURO y la estela clara: el fondo era papel, asi que
   lo propio tenia que ensuciarlo. Un planeta no es papel — es una superficie
   iluminada, el terreno es LO QUE MAS SE VE, y un terreno oscuro sobre una
   esfera clara se lee a mancha y no a territorio. Ahora:

   · `z` es el color VIVO y saturado, que es el que cubre el planeta;
   · `t` es el MISMO tono mas claro, para que la estela se distinga contra el
     terreno propio —que es justo donde hay que verla, porque volver a casa es
     cruzar lo propio—;
   · `c` es la cabeza, casi blanca, para encontrarse de una ojeada.

   Y VIVOS PERO NO AL TOPE (L 0,50 · 0,66 · 0,86): la escena lleva luz, o sea
   que el color se MULTIPLICA por ella. Con el terreno ya en el techo, la cara
   iluminada del planeta satura y las ocho familias se aplastan contra el
   blanco; con medio tono de aire, la luz tiene donde trabajar y la esfera se
   lee redonda, que es la mitad del pedido.

   LOS TONOS SE CONSERVAN CLAVADOS de la paleta plana y no se reordenan: la
   campana usa SOLO los ids 2 a 4, asi que esos tres estan lo mas lejos que se
   puede del ambar del jugador (169 · 261 · 338) y los otros cuatro rellenan
   los huecos de a 45 grados para la arena. Reordenarlos «prolijo» dejaria al
   unico rival del mundo 1 pegado al color del jugador.                      */
const COLS = [
  null,
  { z: '#e68d19', t: '#f8b359', c: '#fde0b9' },   /* 1 · vos · ambar    */
  { z: '#19e6c1', t: '#59f8dc', c: '#b9fdf1' },   /* 2 · verde agua     */
  { z: '#6119e6', t: '#9059f8', c: '#d1b9fd' },   /* 3 · violeta        */
  { z: '#e61964', t: '#f85993', c: '#fdb9d2' },   /* 4 · rosa           */
  { z: '#b3e619', t: '#d1f859', c: '#ecfdb9' },   /* 5 · verde limon    */
  { z: '#19e634', t: '#59f86d', c: '#b9fdc2' },   /* 6 · verde          */
  { z: '#1968e6', t: '#5996f8', c: '#b9d4fd' },   /* 7 · azul           */
  { z: '#e619d5', t: '#f859eb', c: '#fdb9f8' },   /* 8 · magenta        */
];
/* EL PLANETA SIN DUENO ES CLARO Y NEUTRO, y eso tampoco es gusto: es el
   FONDO contra el que se juzgan los ocho colores. Con un fondo oscuro los
   cuatro tonos frios se acercan entre si —todos leen «claro contra oscuro»—
   y con uno claro se leen por lo que son. Es la misma razon por la que la
   mesa de un juego de cartas es clara.                                      */
const C_TABLA = '#dfe6ee', C_PIEDRA = '#6b7689', C_LINEA = '#c2ccd9';

/* ── LOS NUMEROS DEL CUERPO, DERIVADOS ────────────────────────────────────
   EL ENCUADRE NO SE PIDE EN CELDAS, SE PIDE EN PLANETA, y eso no es un gusto:
   es geometria. Una esfera de radio 1 vista desde `d` subtiende `asin(1/d)`,
   asi que el disco que ocupa en pantalla sale de una cuenta cerrada; pedir «19
   celdas de arco» en cambio ata el encuadre al TAMANO del planeta, y entonces
   la arena —que tiene un planeta cinco veces mas grande que el tutorial— se
   veria como un plano, porque diecinueve celdas de 58 son un pedacito chato.
   Pidiendo disco, el planeta ocupa SIEMPRE lo mismo y lo que cambia es cuanto
   mide una celda: en un planeta grande tu territorio se ve chico, que es
   exactamente lo que este juego tiene que hacer sentir.

   `DISCO` es el DIAMETRO del planeta en fraccion del ALTO del cuadro. De ahi
   sale la distancia despejando: con `s = DISCO·tan(fov/2)`,
        tan(asin(1/d)) = s   →   d = √(1+s²)/s
   Con 0,86 y un lente de 46 grados eso da 2,92 radios: el planeta llena el
   cuadro a lo ancho —en 9:16 el ancho es el 46 % del alto, asi que un disco
   del 86 % del alto lo desborda— y deja cielo arriba, abajo y en las cuatro
   esquinas, que es lo unico que hace que se lea a REDONDO. Mas cerca se ve
   plano otra vez; mas lejos aparece una franja de cielo que no dice nada.   */
const DISCO = 0.86;
/* EN LA ARENA LA CAMARA SE ALEJA CON EL TERRENO, y el interpolador va con la
   RAIZ de la tajada y no lineal por la misma razon de siempre: lo que uno
   tiene que seguir viendo es el BORDE de lo propio, y el lado de un
   territorio crece como la raiz de su area. Satura en la tajada pareja
   (`OCUPA/8` = 9,9 %): mas alla de eso uno ya va ganando y alejarse mas solo
   achica la cabeza. El piso son 0,62 porque ahi una celda de la arena mide
   9,7 px en un marco de 412 — por debajo de diez, la cabeza y la estela
   dejan de distinguirse, que es lo unico que este juego pide ver.          */
const DISCO_MIN = 0.62;
const DISCO_SAT = 0.10;
const VEL = 5.4;
/* SIETE VIDAS Y NO TRES, Y EL NUMERO SALE DE UNA TASA MEDIDA. En el plano el
   bot honesto se comia 0,42 cortes por partida; en la esfera se come 1,48, y
   35 de sus 52 muertes son un rival pisandole la estela EN MEDIO DE UNA
   EXCURSION. La causa es geometrica y no de dificultad: en un plano uno se
   apoya de espaldas contra el borde, y una esfera NO TIENE BORDE. Barrido de
   vidas contra niveles ganados: 3->32 · 4->37 · 5->37 · 6->39 · 7->40 · 8->40
   · 99->40. Siete es el valor mas chico que llega a 40 de 40.                */
const VIDAS = 7;

/* ── LOS CINCO MUNDOS ─────────────────────────────────────────────────────
   Lo que crece no es «la dificultad» como numero suelto: crecen el PLANETA,
   la CANTIDAD DE RIVALES y lo BIEN QUE JUEGAN. Y el planeta es el que mas
   pesa, porque con la vista fija en 19 celdas de arco uno de 30 tiene 120 de
   circunferencia: seis pantallas de vuelta, o sea que hay que acordarse de
   por donde se venia. `n` es el lado de UNA CARA del cubo y el planeta son
   seis, asi que las celdas son 6n²: 1.944 el mundo 1 y 5.400 el 5, contra
   1.936 y 5.476 de los tableros planos de 44 y 74 que reemplazan — o sea el
   MISMO tamano de juego, doblado sobre una esfera.
   `pat` es el dibujo de las rocas: no es decoracion, es lo que hace que dos
   mundos del mismo tamano se jueguen distinto.                             */
const MUNDOS = [
  { k: 'm1', nom: 'LLANO',  n: 18, pat: 'vacio',   riv: 2, per: 0.52, seg: 115 },
  { k: 'm2', nom: 'PILARES',n: 21, pat: 'pilares', riv: 3, per: 0.64, seg: 115 },
  { k: 'm3', nom: 'CRUCE',  n: 24, pat: 'cruz',    riv: 3, per: 0.74, seg: 121 },
  { k: 'm4', nom: 'ISLAS',  n: 27, pat: 'islas',   riv: 4, per: 0.84, seg: 126 },
  { k: 'm5', nom: 'ANILLO', n: 30, pat: 'anillo',  riv: 4, per: 0.93, seg: 132 },
];

/* ── UN CUERPO MAS QUE EN EL PLANO, Y ES DE LA ESFERA ─────────────────────
   La tabla plana iba 1·2·2·3·3 y sobre la esfera el juego se rompia: el
   auto-jugador honesto pasaba 34 de 40. No es que la esfera de MENOS —el
   planeta se ocupa igual, medido 87,8 % contra 85,7 % del plano— es que un
   cierre cualquiera vale MUCHO MAS:

                              plano     esfera
     reclamo medio             2,03 %    2,52 %
     reclamo p50               1,19      1,30   ← igual
     reclamo p99               9,08     19,24   ← el doble
     el mayor reclamo         16,84     51,02   ← medio planeta de un saque
     reclamos > 20 % de N         0        17
     tajada del bot: sigma      9,4      14,6

   La mediana no se mueve y la cola se duplica, y eso es geometria y no
   equilibrio: en un tablero PLANO una vuelta pegada al borde no encierra
   nada, asi que hay vueltas baratas e inutiles. En una esfera NO HAY BORDE,
   asi que toda vuelta cerrada es un circulo maximo y parte el planeta al
   medio. Con dos cuerpos eso es una moneda al aire.

   El tercer cuerpo es lo que hace que una vuelta bisectriz CUESTE algo.
   Medido con el mayor multiplicador de meta con el que los 40 niveles se
   pasan —el mismo criterio con el que se derivo META_A/META_B—:

     plano (control)              0,590   ← y el banco reproduce su propia
     esfera, tabla plana          0,160     derivacion: el 5-2 tapa en 0,590
     esfera, planetas +35 %       0,206     y este archivo ya decia "con 0,58
     esfera, +35 % y un rival     0,286     ya pierde el 5-2"
     esfera, UN RIVAL MAS         0,601   ← mejor que el plano

   Y no es que suba el promedio: los tres niveles que se caian (1-1 con 0,160,
   3-8 con 0,285 y 3-5 con 0,312) DESAPARECEN de la lista de peores. Agrandar
   el planeta se probo y mide PEOR, asi que queda descartado.                */

/* ── EL OBJETIVO NO SE ESCRIBE: SE DERIVA DEL REPARTO ─────────────────────
   Estaba como una fraccion ABSOLUTA del tablero por mundo (0,40 a 0,55) y el
   juego era imposible, no dificil. Dos mediciones lo explican:

   · el tablero termina ocupado casi entero — 79,5 % de media sobre los 40
     niveles — y repartido entre TODOS los que juegan, asi que la parte pareja
     de uno es 0,795/nj: 39,8 % a dos, 26,5 % a tres y 19,9 % a cuatro;
   · y el `meta` viejo SUBIA justo donde entra el tercer rival, o sea que en el
     mundo 5 le pedia el 55 % a uno mientras los otros tres se repartian el 25.

   Y el modelo del reparto le gana al fisico, medido: prediciendo la tajada del
   bot con 0,795/nj el coeficiente de variacion es 0,278, y con el modelo de
   recorrido (VEL·seg/libres, o sea cuanto alcanza a encerrar uno solo) es
   0,312 — porque los rivales se comen lo que uno no agarra.

   El multiplicador es el ULTIMO valor con el que el auto-jugador honesto pasa
   los 40 de 40: 0,55 al entrar a un mundo y 0,72 al salir. Con 0,58 ya pierde
   el 5-2. O sea que este objetivo es el mas exigente que esta DEMOSTRADO que
   se puede cumplir, y no un numero elegido a ojo.                          */
const OCUPA = 0.795;
/* LA META VUELVE A LA DEL PLANO. Bajarla fue lo primero que probe y la
   medicion lo desmintio: barriendo META_A de 0,50 a 0,22 con la misma
   diferencia, los ganados dan 32/32/33/34/34/34/36/37 y NUNCA llegan a 40.
   Lo que faltaba no era meta, era reloj y vidas.                             */
const META_A = 0.55, META_B = 0.72;
const RIV_TOPE = 4;
const NIV_MUNDO = 8;
const NIVELES = MUNDOS.length * NIV_MUNDO;

/* La semilla sale del par (mundo, nivel) y de nada mas.                    */
const semNivel = (m, n) => (m + 1) * 100003 + (n + 1) * 7919 + 29;
/* LA SAL ES 29 Y NO 13, Y ES UN RECHAZO POR TANDA. Este juego no reintenta un
   nivel: la semilla sale del par (mundo, nivel), asi que cuando UNO sale malo
   lo unico que se puede mover es la sal de todos. Con 13 el 2-5 quedaba sin
   pasar, y no es estructural: con la misma cfg, 19 de 20 semillas se ganan.
   Barridas las sales, 29 y 97 dan las dos 40 de 40 con el del azar en 0.     */

/* Dentro de un mundo tambien hay curva: ocho niveles con el mismo tablero y
   los mismos rivales son el mismo nivel ocho veces.                        */
function cfgNivel(m, n) {
  const M = MUNDOS[m], u = NIV_MUNDO > 1 ? n / (NIV_MUNDO - 1) : 0;
  /* Los tres ultimos niveles de un mundo suman un rival, con tope: la rampa
     estaba escrita como `M.riv < 3`, que con la tabla nueva no se cumpliria
     NUNCA y la curva de adentro del mundo desapareceria sin que nada falle. */
  const riv = Math.min(RIV_TOPE, M.riv + (n >= 5 ? 1 : 0));
  return {
    mundo: m, nivel: n, pat: M.pat,
    n: Math.round(M.n + u * 4),
    riv,
    per: cl(M.per + u * 0.10, 0, 1),
    /* la parte pareja, por el multiplicador — nunca una fraccion escrita     */
    meta: OCUPA / (1 + riv) * (META_A + u * (META_B - META_A)),
    seg: M.seg,
    sem: semNivel(m, n),
  };
}

/* ══════════════════════ LA ARENA ══════════════════════
   ES EL OTRO JUEGO, Y CONTRADICE A PROPOSITO LO DE ARRIBA. La campana
   deriva un objetivo del reparto justamente para que se pueda TERMINAR; la
   arena no se termina: no hay meta, no hay reloj, hay una vida y se juega
   hasta que a uno lo cortan. Las dos cosas no se pueden promediar —una pide
   un tablero chico con un final y la otra uno grande sin final— asi que
   conviven como dos modos y no como una dificultad.

   CADA NUMERO SALE DE UNA CUENTA:
   · `n` 38 son 6·38² = 8.664 celdas —los 8.464 del tablero plano de 92, con
     el redondeo que impone que un planeta tenga seis caras iguales—: con
     `OCUPA` 0,795 repartido entre ocho, la parte pareja de cada uno es 9,9 %
     — un numero que se mueve lo suficiente como para que el marcador diga
     algo, y un planeta lo bastante grande como para que ocho cuerpos no se
     pisen en el primer minuto. Su circunferencia son 152 celdas: ocho
     pantallas de vuelta.
   · `riv` 7, o sea ocho cuerpos contando al jugador: es el reparto del juego
     que se esta imitando y lo que hace que la tabla de posiciones tenga algo
     que ordenar.
   · sin roca (`pat:'vacio'`): la roca de la campana es lo que hace que un
     planeta chico se juegue distinto, y en uno de ocho mil celdas lo unico
     que agregaria es una forma de morir que no es otro jugador.
   · y `per` es un ARREGLO y no un numero. Siete bots con la misma cabeza son
     un bot repetido siete veces: salen todos igual de lejos, vuelven a la vez
     y la tabla queda ordenada por suerte. Con siete precisiones se reparten
     en mansos y temerarios sin escribir siete cerebros.                     */
/* LA ARENA CRECE PORQUE EN LA ESFERA EL MUNDO ES MAS CHICO DE LO QUE PARECE.
   Con 38 la arena tiene 8.664 celdas —las mismas 8.464 del tablero plano— y
   sin embargo el bot honesto moria a los 11 segundos con el 0,29 % del
   planeta, contra 55,5 s y 7,04 % en el plano. Medidas las muertes: 393 de
   415 son CORTES, con 60,7 celdas de estela encima. La causa no es la
   cantidad de celdas sino el DIAMETRO: dos puntos del tablero plano llegaban
   a estar a 130 celdas, y en una esfera el antipoda esta a 2n = 76. Ocho
   cuerpos quedaban al doble de cerca. Barrido de n contra el bot y el del
   azar: 38 -> 0,29 % y 0,62 · 48 -> 1,68 y 0,46 · 58 -> 2,51 y 0,26 ·
   68 -> 2,18 y 0,18 · 78 -> 5,78 y 0,13. En 58 el honesto saca 9,7 veces lo
   del azar, que es CIFRA POR CIFRA la separacion del plano (7,04 contra
   0,70). Los ocho cuerpos no se tocan: son la identidad de la arena.        */
const ARENA_N = 58;
const ARENA_RIV = 7;
const ARENA_PER = [0.55, 0.68, 0.74, 0.80, 0.86, 0.90, 0.95];
/* CUANTA VENTAJA HAY QUE SACAR para que «vas primero» quiera decir algo. Un
   cuadrado de arranque son 0,3 % del tablero y la parte pareja de ocho es
   9,9 %: con 0,8 % ya se sacaron dos cuerpos y medio de diferencia, que es
   una ventaja que se ve en la tabla. Sin este numero el cartel sale en el
   primer cuadro, porque `tablaPos` desempata por id y el jugador es el 1.  */
const ARENA_VENT = 0.008;

function cfgArena(sem) {
  return {
    mundo: -1, nivel: -1, pat: 'vacio',
    n: ARENA_N, riv: ARENA_RIV, per: ARENA_PER,
    meta: 0, seg: 0, arena: true,
    /* LA SEMILLA ES AL AZAR EN EL JUEGO Y FIJA EN LA AUDITORIA, y esa
       diferencia es la que hace que las dos cosas sirvan: una partida
       reproducible no se siente una arena, y un banco que no se repite no
       mide nada.                                                           */
    sem: sem == null ? (Math.random() * 2147483647) | 0 : (sem | 0),
  };
}

const PROG = { lang: null, hechos: {}, vol: 0.45, fx: 0.8, cal: 1, visto: 0, ult: 0,
  /* EL RECORD DE LA ARENA ES SU UNICO PROGRESO. No hay niveles que abrir ni
     nada que desbloquear: lo unico que queda de una corrida es hasta donde
     se llego, y sin guardarlo la arena no tiene con que compararse.        */
  rec: 0, recB: 0 };
function cargaProg() {
  try {
    const s = localStorage.getItem('cerco');
    if (!s) return false;
    const o = JSON.parse(s);
    if (o && typeof o === 'object') Object.assign(PROG, o);
    /* EL TUTORIAL SE VE CADA VEZ QUE SE ABRE EL JUEGO: la marca se pone en
       cero DESPUES de leer el disco, asi que sigue valiendo dentro de la
       sesion —hecho una vez, no vuelve a salir entre nivel y nivel— y es el
       unico dato del guardado que se descarta a proposito.                */
    PROG.visto = 0;
    if (PROG.lang) LANG = PROG.lang;
    return !!PROG.lang;
  } catch (e) { return false; }
}
function guardaProg() { try { PROG.lang = LANG; localStorage.setItem('cerco', JSON.stringify(PROG)); } catch (e) {} }
function borraProg() {
  PROG.hechos = {}; PROG.visto = 0; PROG.ult = 0; PROG.rec = 0; PROG.recB = 0;
  try { localStorage.removeItem('cerco'); } catch (e) {}
}
const idNiv = (m, n) => m * NIV_MUNDO + n;
const hecho = (m, n) => !!PROG.hechos[idNiv(m, n)];
const perfecto = (m, n) => PROG.hechos[idNiv(m, n)] === 2;
function anota(m, n, perf) {
  const k = idNiv(m, n), v = perf ? 2 : 1;
  if ((PROG.hechos[k] | 0) < v) PROG.hechos[k] = v;
  if (k + 1 > PROG.ult && k + 1 < NIVELES) PROG.ult = k + 1;

/* «el siguiente al ultimo hecho, mas uno de gracia»: con el siguiente y nada
   mas, un nivel que a alguien no le sale le cierra el juego entero.        */
function abierto(k) {
  if (k <= 0) return true;
  let alto = 0;
  for (const s in PROG.hechos) { const i = +s; if (i + 1 > alto) alto = i + 1; }

}

/* ── POR QUE UN CUBO INFLADO Y NO UNA ESFERA DE VERDAD ────────────────────
   El juego entero cuelga de que CADA CELDA TENGA EXACTAMENTE CUATRO VECINOS
   DE ARISTA. Una esfera partida por latitud y longitud no lo cumple: en los
   polos convergen n celdas y ahi no hay cuatro direcciones. Un icosaedro
   subdividido da triangulos, o sea TRES vecinos, y entonces «izquierda» y
   «derecha» dejan de ser un giro de noventa grados.

   Un cubo de seis caras de n×n con los vertices llevados a la esfera SI lo
   cumple, y lo cumple TAMBIEN EN LAS OCHO ESQUINAS: la celda de la esquina
   de una cara tiene dos vecinas dentro de su cara y una en cada una de las
   dos caras que la tocan. Lo unico singular son los ocho VERTICES del cubo
   —donde se juntan tres cuadrados— y un relleno de cuatro vecinos no pasa
   nunca por un vertice: pasa por aristas.

   O SEA QUE EL TEOREMA DEL JUEGO SOBREVIVE. Lo que uno encierra con su
   estela es suyo, y «encierra» sigue siendo literal: el terreno propio mas
   la estela forman un anillo 4-conexo, y un anillo 4-conexo separa la
   superficie bajo relleno de 4 vecinos.

   LO QUE NO SOBREVIVE ES LA PALABRA «AFUERA». En el plano el relleno
   arrancaba del borde, que es un sitio que siempre existe. Una esfera no
   tiene borde: una curva cerrada la parte en DOS pedazos y los dos son
   finitos. Asi que «afuera» pasa a ser una MEDIDA y no una posicion —el
   pedazo mas grande— y eso es una decision de diseno, no un teorema: esta
   medida abajo, en `auditaFuera`.

   DE AHI SALE QUE LA ROCA SE PUEDA CRUZAR EN EL RELLENO, igual que antes.
   Como la barrera es el terreno propio y nada mas, dejar pasar la roca no
   abre ninguna fuga —y al reves, si la roca bloqueara, un hueco rodeado de
   piedra se regalaria sin que nadie lo hubiera rodeado nunca.              */

/* ── LAS SEIS CARAS ───────────────────────────────────────────────────────
   Cada una con su centro y sus dos ejes, y los seis cumplen `ex × ey = C`.
   Eso no es cosmetico: es lo que hace que la mano de la pantalla sea LA
   MISMA en las seis. Con una cara al reves, cruzar esa arista invertiria
   izquierda y derecha y el jugador no tendria forma de saberlo.            */
const CARAS = [
  { C: [ 1, 0, 0], ex: [ 0, 0,-1], ey: [0, 1, 0] },   /* 0 · +X */
  { C: [-1, 0, 0], ex: [ 0, 0, 1], ey: [0, 1, 0] },   /* 1 · -X */
  { C: [ 0, 1, 0], ex: [ 1, 0, 0], ey: [0, 0,-1] },   /* 2 · +Y */
  { C: [ 0,-1, 0], ex: [ 1, 0, 0], ey: [0, 0, 1] },   /* 3 · -Y */
  { C: [ 0, 0, 1], ex: [ 1, 0, 0], ey: [0, 1, 0] },   /* 4 · +Z */
  { C: [ 0, 0,-1], ex: [-1, 0, 0], ey: [0, 1, 0] },   /* 5 · -Z */
];

/* DIR sigue valiendo DENTRO de una cara: der · izq · abajo · arriba.
   Lo que cambia al cruzar una arista es que la direccion se REMAPEA, y eso
   lo guarda la tabla ND: nadie mas tiene que saber que hay caras.          */
const OPUE = [1, 0, 3, 2];
const GIRO_CW  = [2, 3, 1, 0];   /* der→abajo→izq→arriba (horario en pantalla) */
const GIRO_CCW = [3, 2, 0, 1];

const nrm = v => { const m = Math.hypot(v[0], v[1], v[2]); return [v[0] / m, v[1] / m, v[2] / m]; };
const pto = (v, w) => v[0] * w[0] + v[1] * w[1] + v[2] * w[2];

/* el centro de la celda (f,x,y) llevado a la esfera */
function posCel(f, x, y, n) {
  const c = CARAS[f], u = (x + 0.5) / n * 2 - 1, v = (y + 0.5) / n * 2 - 1;
  return nrm([c.C[0] + u * c.ex[0] + v * c.ey[0],
              c.C[1] + u * c.ex[1] + v * c.ey[1],
              c.C[2] + u * c.ex[2] + v * c.ey[2]]);
}

/* LA PROYECCION AL REVES: de un punto de la esfera a la celda que lo
   contiene. Es lo que resuelve las costuras SIN una tabla de aristas
   escrita a mano —doce aristas por dos sentidos son veinticuatro casos, y
   uno mal escrito no falla: manda al cuerpo a otra cara sin que nada avise—.
   El eje dominante dice la cara y de ahi salen u y v por division.         */
function aCelda(p, n) {
  const ax = Math.abs(p[0]), ay = Math.abs(p[1]), az = Math.abs(p[2]);
  let f;
  if (ax >= ay && ax >= az) f = p[0] > 0 ? 0 : 1;
  else if (ay >= az)        f = p[1] > 0 ? 2 : 3;
  else                      f = p[2] > 0 ? 4 : 5;
  const c = CARAS[f], w = pto(p, c.C);
  const u = pto(p, c.ex) / w, v = pto(p, c.ey) / w;
  let x = Math.floor((u + 1) / 2 * n), y = Math.floor((v + 1) / 2 * n);
  if (x < 0) x = 0; else if (x >= n) x = n - 1;
  if (y < 0) y = 0; else if (y >= n) y = n - 1;
  return (f * n + y) * n + x;
}

/* HACIA DONDE SE SIGUE ANDANDO DESPUES DE CRUZAR UNA COSTURA.
   NO sirve usar `ex`/`ey` de la cara de destino: esos son los ejes del PLANO
   del cubo y la superficie ya se curvo, asi que lejos del centro de la cara
   no son tangentes. Las tangentes de verdad son los mismos ejes proyectados
   al plano tangente del punto, y sobre ellas la direccion es la componente
   mas grande del propio paso.                                              */
function dirEn(f, pDest, pOrig) {
  const c = CARAS[f];
  const dx = pto(c.ex, pDest), dy = pto(c.ey, pDest);
  const Tx = nrm([c.ex[0] - dx * pDest[0], c.ex[1] - dx * pDest[1], c.ex[2] - dx * pDest[2]]);
  const Ty = nrm([c.ey[0] - dy * pDest[0], c.ey[1] - dy * pDest[1], c.ey[2] - dy * pDest[2]]);
  const w = [pDest[0] - pOrig[0], pDest[1] - pOrig[1], pDest[2] - pOrig[2]];
  const A = pto(w, Tx), B = pto(w, Ty);
  return Math.abs(A) >= Math.abs(B) ? (A > 0 ? 0 : 1) : (B > 0 ? 2 : 3);
}

/* ── LAS TABLAS ───────────────────────────────────────────────────────────
   Se arman UNA VEZ por n y de ahi en mas todo el juego es `j = NB[i*4+d]`.
   Ni el relleno, ni el campo de distancia, ni los bots, ni el auditor saben
   que hay caras: esa es toda la gracia de precalcularlas.                  */
const GEO_CACHE = {};
function geoDe(n) {
  if (GEO_CACHE[n]) return GEO_CACHE[n];
  const N = 6 * n * n;
  const NB = new Int32Array(N * 4), ND = new Uint8Array(N * 4);
  const POS = new Float32Array(N * 3);
  for (let f = 0; f < 6; f++) for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = (f * n + y) * n + x, p = posCel(f, x, y, n);
    POS[i * 3] = p[0]; POS[i * 3 + 1] = p[1]; POS[i * 3 + 2] = p[2];
  }
  for (let f = 0; f < 6; f++) {
    const c = CARAS[f];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const i = (f * n + y) * n + x;
      const pi = [POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2]];
      for (let d = 0; d < 4; d++) {
        const nx = x + DIR[d][0], ny = y + DIR[d][1];
        if (nx >= 0 && ny >= 0 && nx < n && ny < n) {
          NB[i * 4 + d] = (f * n + ny) * n + nx; ND[i * 4 + d] = d;
          continue;
        }
        /* la celda virtual de al lado, llevada a la esfera y devuelta a la
           reja por la proyeccion inversa: funciona igual en el medio de una
           arista que en una esquina del cubo.                              */
        const u = (nx + 0.5) / n * 2 - 1, v = (ny + 0.5) / n * 2 - 1;
        const pv = nrm([c.C[0] + u * c.ex[0] + v * c.ey[0],
                        c.C[1] + u * c.ex[1] + v * c.ey[1],
                        c.C[2] + u * c.ex[2] + v * c.ey[2]]);
        const j = aCelda(pv, n), fj = (j / (n * n)) | 0;
        const pj = [POS[j * 3], POS[j * 3 + 1], POS[j * 3 + 2]];
        NB[i * 4 + d] = j; ND[i * 4 + d] = dirEn(fj, pj, pi);
      }
    }
  }
  /* PASOS POR RADIAN, para que una distancia sobre la esfera se pueda
     comparar contra un campo BFS, que cuenta PASOS. Una vuelta entera son
     4n celdas, o sea 2n/π por radian; y el ×4/π es la razon media entre la
     distancia de manzana y la recta para direcciones al azar, que es lo que
     el campo mide de verdad.                                               */
  const g = { NB, ND, POS, N, kD: 8 * n / (Math.PI * Math.PI) };
  GEO_CACHE[n] = g;
  return g;
}

/* distancia en PASOS estimados entre dos celdas */
function distCel(M, i, j) {
  const P = M.POS;
  let c = P[i * 3] * P[j * 3] + P[i * 3 + 1] * P[j * 3 + 1] + P[i * 3 + 2] * P[j * 3 + 2];
  if (c > 1) c = 1; else if (c < -1) c = -1;
  return Math.acos(c) * M.kD;
}

/* UN DISCO DE K CELDAS POR BFS, y no un cuadrado de x±r: un cuadrado se
   parte cuando cae sobre una arista del cubo y deja media casa en otra cara.
   Esto da exactamente K celdas contiguas donde sea, esquina incluida.      */
function discoN(M, i0, K, out) {
  const NB = M.NB;
  if (!M._dv || M._dv.length !== M.N) { M._dv = new Int32Array(M.N); M._ds = 0; }
  const vis = M._dv; M._ds++; const s = M._ds;
  const q = out; let qa = 0, qb = 0;
  vis[i0] = s; q[qb++] = i0;
  while (qa < qb && qb < K) {
    const c = q[qa++], b = c * 4;
    for (let d = 0; d < 4; d++) {
      const k = NB[b + d];
      if (vis[k] === s) continue;
      vis[k] = s; q[qb++] = k;
      if (qb >= K) break;
    }
  }
  return qb;
}

/* ══════════════════════ EL MODELO ══════════════════════ */

function nuevoM(n) {
  const g = geoDe(n);
  return {
    n, N: g.N, NB: g.NB, ND: g.ND, POS: g.POS, kD: g.kD,
    z: new Uint8Array(g.N), t: new Uint8Array(g.N),
    jug: [], f: 0, libres: g.N, cuenta: new Int32Array(NJUG + 1),
    sucio: true, reloj: 0, arena: false,

       «afuera»: el peor reparto que vio un relleno y cuantas veces estuvo
       apretado. Cuestan dos comparaciones por cerrado y son lo unico que hace
       comprobable la unica decision de diseno que la esfera obliga a tomar. */
    peorRep: 1, dudas: 0, cerrados: 0,
    _vis: null, _pila: null, _bq: null, _disco: null,
  };
}

function nuevoJug(id, bot) {
  return {
    id, bot: bot || null, i: 0, d: 0, ped: null,
    vivo: true, fuera: false, estela: 0, cola: [], cortes: 0, cerros: 0,

       vos: dos numeros distintos que en la campana no hacia falta separar,
       porque ahi el rival no es un marcador, es un obstaculo.              */
    matas: 0,
    dc: null, dcSucio: true, plan: null, muerteT: 0,

}

/* ── RECLAMAR ─────────────────────────────────────────────────────────────
   ES UNA SOLA FUNCION Y LA USAN CUATRO COSAS: el jugador, los bots, el
   auditor y el dibujo del destello. Con dos cuentas, el auditor estaria
   aprobando un juego que no existe.

   EN EL PLANO EL RELLENO ARRANCABA DEL BORDE. Una esfera no tiene borde: la
   estela cerrada la parte en dos pedazos y los DOS son finitos, asi que
   «afuera» deja de ser una posicion. Se etiquetan las componentes del
   complemento y **la mas grande es afuera**; todo lo demas se reclama.

   ESO ES UNA DECISION DE DISENO Y NO UN TEOREMA, y por eso se mide: cuando el
   pedazo encerrado fuera mas grande que el que queda libre, la regla elegiria
   el lado equivocado. `M.peorRep` guarda el reparto mas apretado que se vio y
   `M.dudas` cuenta las veces que estuvo por debajo de tres cuartos. Con ocho
   cuerpos sobre 8.664 celdas, encerrar mas de la mitad del tablero libre en
   una sola vuelta pide un cerco de miles de celdas de perimetro.           */
function reclama(M, p) {
  const N = M.N, id = p.id, z = M.z, t = M.t, NB = M.NB;
  let nue = 0;
  for (let i = 0; i < N; i++) if (t[i] === id) { t[i] = 0; if (z[i] !== id) { z[i] = id; nue++; } }
  p.estela = 0; p.cola.length = 0;

  if (!M._vis || M._vis.length !== N) { M._vis = new Int32Array(N); M._pila = new Int32Array(N); }
  const lab = M._vis, pila = M._pila;
  lab.fill(0);
  let comp = 0, mejor = 0, mejorTam = -1, libres = 0;
  for (let s = 0; s < N; s++) {
    if (lab[s] || z[s] === id) continue;
    comp++;
    let sp = 0; pila[sp++] = s; lab[s] = comp; let tam = 0;
    while (sp > 0) {
      const c = pila[--sp]; tam++;
      const b = c * 4;
      for (let d = 0; d < 4; d++) {
        const k = NB[b + d];
        if (lab[k] || z[k] === id) continue;
        lab[k] = comp; pila[sp++] = k;
      }
    }
    libres += tam;
    if (tam > mejorTam) { mejorTam = tam; mejor = comp; }
  }
  for (let i = 0; i < N; i++) {
    if (lab[i] === mejor || lab[i] === 0) continue;
    const v = z[i];
    if (v === PIEDRA || v === id) continue;   /* la roca sigue siendo roca */
    z[i] = id; nue++;
  }
  if (libres > 0) {
    const rep = mejorTam / libres;
    if (rep < M.peorRep) M.peorRep = rep;
    if (rep < 0.75) M.dudas++;
    M.cerrados++;
  }
  p.fuera = false; p.cerros++;
  M.sucio = true;
  for (const q of M.jug) q.dcSucio = true;
  return nue;
}

/* ── EL CAMPO DE DISTANCIA AL BORDE, CON SIGNO ────────────────────────────
   Un BFS por celda para decidir cada paso costaria, sobre los cuarenta
   niveles, cientos de millones de visitas. El campo cuesta O(N) UNA VEZ por
   cambio de terreno —el mismo precio que el relleno que lo provoco— y se
   calcula PEREZOSO: un bot que no esta volviendo a casa no lo paga.

   Y LLEVA SIGNO, que es lo que lo hace servir para las dos mitades del
   viaje. Con el campo medido desde el terreno propio, TODO lo propio vale
   cero: adentro no hay pendiente, asi que un bot parado en el medio de su
   casa no tiene por donde subir y sale dando vueltas al azar hasta chocarse
   con el borde. Medido en el plano, eso eran DIECISEIS TICS seguidos en el
   cero, y el terreno crece, o sea que empeora solo a lo largo de la partida.
   El cero pasa a ser EL BORDE: hacia afuera +1, +2… y hacia adentro −1, −2… */
const DC_NADA = -1e6;
function campoCasa(M, p) {
  const N = M.N, NB = M.NB;
  if (!p.dc || p.dc.length !== N) p.dc = new Int32Array(N);
  const dc = p.dc; dc.fill(DC_NADA);
  if (!M._bq || M._bq.length !== N) M._bq = new Int32Array(N);
  const q = M._bq; let qa = 0, qb = 0;
  /* semilla: las celdas propias que dan a algo pisable que no es propio */
  for (let i = 0; i < N; i++) {
    if (M.z[i] !== p.id) continue;
    const b = i * 4;
    for (let d = 0; d < 4; d++) {
      const k = NB[b + d];
      if (M.z[k] === PIEDRA || M.z[k] === p.id) continue;
      dc[i] = 0; q[qb++] = i; break;
    }
  }
  /* un terreno encerrado sin una sola salida no tiene borde: se cae al campo
     de antes para que el bot al menos tenga un gradiente y no un plano.    */
  if (!qb) for (let i = 0; i < N; i++) if (M.z[i] === p.id) { dc[i] = 0; q[qb++] = i; }
  while (qa < qb) {
    const c = q[qa++], v = dc[c], b = c * 4;
    for (let d = 0; d < 4; d++) {
      const k = NB[b + d];
      if (dc[k] !== DC_NADA || M.z[k] === PIEDRA) continue;
      /* lo propio baja y lo ajeno sube. Una celda propia vecina de una de
         afuera ya se sembro en cero, asi que las dos ramas no se cruzan.   */
      dc[k] = M.z[k] === p.id ? v - 1 : v + 1;
      q[qb++] = k;
    }
  }
  p.dcSucio = false;
  return dc;
}
const verCasa = (M, p) => (p.dcSucio || !p.dc ? campoCasa(M, p) : p.dc);

function recuenta(M) {
  M.cuenta.fill(0);
  for (let i = 0; i < M.N; i++) { const v = M.z[i]; if (v > 0 && v < PIEDRA) M.cuenta[v]++; }
  M.sucio = false;
}
function tajada(M, id) {
  if (M.sucio) recuenta(M);
  return M.libres > 0 ? M.cuenta[id] / M.libres : 0;
}
/* LA TABLA DEJA AL MUERTO ADENTRO, EN CERO. Sacarlo hace que los puestos de
   abajo SUBAN cuando alguien se muere: uno mira el marcador, ve que paso de
   sexto a quinto sin haber hecho nada, y el numero deja de significar.     */
function tablaPos(M) {
  if (M.sucio) recuenta(M);
  const f = [];
  for (const p of M.jug) f.push({ id: p.id, pct: M.libres > 0 ? M.cuenta[p.id] / M.libres : 0, vivo: p.vivo, matas: p.matas });
  f.sort((a, b) => b.pct - a.pct || a.id - b.id);
  for (let i = 0; i < f.length; i++) f[i].pos = i + 1;
  return f;
}
const puestoDe = (M, id) => { const t = tablaPos(M); for (const f of t) if (f.id === id) return f.pos; return t.length; };

/* ── EL TIC ───────────────────────────────────────────────────────────────
   TODOS LOS CUERPOS VAN A LA MISMA VELOCIDAD Y ARRANCAN ALINEADOS, asi que
   cruzan el borde de celda en el mismo instante: la fraccion es UNA, del
   tablero, y no una por jugador. Con una por jugador habria que decidir en
   que orden se resuelven dos cabezas que entran a la misma celda, y el
   resultado dependeria del orden del array.

   EN LA ESFERA EL MOVIMIENTO SON DOS LECTURAS DE TABLA y ninguna suma de
   coordenadas: `NB` dice a que celda se va y `ND` con que rumbo se llega.
   Las dos se leen con el `i` y el `d` VIEJOS —de ahi el `b` calculado antes
   de escribir nada— porque cruzando una costura el rumbo cambia, y leerlo
   despues seria leer el rumbo de la cara nueva con el indice de la vieja.

   Y SE FUE LA MUERTE POR SALIRSE DEL TABLERO: una esfera no tiene borde.
   Es la unica regla del juego que la conversion elimina, y no se reemplaza
   por nada — en la referencia tampoco hay pared.                          */
function tic(M) {
  const NB = M.NB, ND = M.ND, vivos = [];
  for (const p of M.jug) {
    if (!p.vivo) continue;
    if (p.ped != null && p.ped !== OPUE[p.d]) p.d = p.ped;
    p.ped = null;
    const b = p.i * 4 + p.d;
    p.i = NB[b]; p.d = ND[b];
    vivos.push(p);
  }

  /* LAS MUERTES SE JUNTAN Y SE APLICAN TODAS DE UNA, y la estela se mira
     ANTES de que nadie deje la de este paso: si no, el que se mueve primero
     tendria ventaja sobre el que se mueve segundo por estar antes en la
     lista.                                                                 */
  const mata = new Set();
  for (const p of vivos) {
    const i = p.i;
    if (M.z[i] === PIEDRA) { mata.add(p); continue; }
    const te = M.t[i];
    if (te !== 0) {
      /* el dueno de la estela es el que cae: pisar la propia es suicidio y
         pisar la ajena es un corte. Una sola regla, dos resultados.        */
      const q = M.jug[te - 1];
      if (q && q.vivo) { mata.add(q); if (q !== p) p.matas++; }
    }
  }
  for (let a = 0; a < vivos.length; a++) for (let b = a + 1; b < vivos.length; b++)
    if (vivos[a].i === vivos[b].i) { mata.add(vivos[a]); mata.add(vivos[b]); }

  for (const p of mata) muere(M, p);

  for (const p of vivos) {
    if (!p.vivo) continue;
    const i = p.i;
    if (M.z[i] === p.id) { if (p.fuera) reclama(M, p); }
    else { if (M.t[i] !== p.id) { M.t[i] = p.id; p.estela++; p.cola.push(i); } p.fuera = true; }
  }
  for (const p of vivos) if (p.vivo && p.bot) piensa(M, p);
}

function muere(M, p) {
  if (!p.vivo) return;
  p.vivo = false; p.cortes++;
  for (let i = 0; i < M.N; i++) if (M.t[i] === p.id) M.t[i] = 0;
  /* EN LA ARENA EL TERRENO SE PIERDE ENTERO, y es la otra mitad de lo que
     hace que cortar a alguien signifique algo. En la campana el corte cuesta
     tiempo y posicion —el terreno espera— porque ahi la partida tiene reloj
     y meta; sin reloj ni meta, un corte que no borra nada no cuesta nada, y
     entonces la tabla de posiciones no se puede mover.

     Y esto es tambien lo que hace que el juego respire: lo que el muerto
     suelta vuelve a ser tablero libre y ahi vuelve a haber para todos.     */
  if (M.arena) {
    const z = M.z;
    for (let i = 0; i < M.N; i++) if (z[i] === p.id) z[i] = LIBRE;
    M.sucio = true;
    for (const q of M.jug) q.dcSucio = true;
  }
  p.estela = 0; p.cola.length = 0; p.fuera = false; p.plan = null;
  p.muerteT = M.reloj;
}

/* ── RENACER ──────────────────────────────────────────────────────────────
   EL TERRENO NO SE PIERDE. Perderlo entero en cada corte convierte tres
   vidas en tres intentos del nivel completo con el reloj corriendo; lo que
   un corte tiene que costar es TIEMPO y POSICION, que es lo que cuesta
   volver a salir desde el medio de lo propio.                              */
function renace(M, p) {
  let mejor = -1, mejorV = -1;
  const cab = [];
  for (const q of M.jug) if (q !== p && q.vivo) cab.push(q.i);
  for (let i = 0; i < M.N; i++) {
    if (M.z[i] !== p.id) continue;
    let d = 1e9;
    for (const c of cab) { const e = distCel(M, i, c); if (e < d) d = e; }
    if (d > mejorV) { mejorV = d; mejor = i; }
  }
  if (mejor < 0) mejor = carvaCasa(M, p);
  p.i = mejor;
  p.vivo = true; p.fuera = false; p.estela = 0; p.ped = null; p.plan = null; p.dcSucio = true;
  /* mira hacia adentro de lo propio: renacer apuntando al vacio es salir sin
     haberlo pedido, y eso no es un renacimiento, es otro corte.            */
  let d0 = 0;
  for (let d = 0; d < 4; d++) if (M.z[M.NB[mejor * 4 + d]] === p.id) { d0 = d; break; }
  p.d = d0;
}

/* Carva una casa nueva donde mas neutral haya y mas lejos de las cabezas
   ajenas. Solo hace falta cuando a alguien le encerraron TODO el terreno.

   LA CASA ES UN DISCO DE 25 CELDAS y no un 5x5, porque en una esfera de cubo
   un cuadrado de x±r se parte al caer sobre una arista. El numero no es
   arbitrario: la bola L1 de radio 3 mide EXACTAMENTE 25 celdas, o sea la
   misma casa del plano celda por celda.

   Y NO SE BARRE CELDA POR CELDA: con 8.664 celdas y un BFS de 25 por
   candidato eso son doscientos mil pasos por renacimiento. El salto sale del
   tamano (`N/900`), asi que la cantidad de candidatos es la misma en el
   tutorial que en la arena y esto no se pone lento al crecer el planeta.  */
const CASA_K = 25;
function carvaCasa(M, p, K) {
  const k = K || CASA_K, N = M.N;
  const cab = [];
  for (const q of M.jug) if (q !== p && q.vivo) cab.push(q.i);
  if (!M._disco || M._disco.length < k) M._disco = new Int32Array(Math.max(k, 64));
  const tmp = M._disco;
  const salto = Math.max(1, Math.round(N / 900));
  let mejor = -1, mejorV = -1e9;
  for (let c = 0; c < N; c += salto) {
    if (discoN(M, c, k, tmp) < k) continue;
    let lib = 0, roca = 0;
    for (let j = 0; j < k; j++) { const v = M.z[tmp[j]]; if (v === PIEDRA) roca++; else if (v === LIBRE) lib++; }
    if (roca > 0) continue;
    let d = 1e9;
    for (const q of cab) { const e = distCel(M, c, q); if (e < d) d = e; }
    /* EN LA ARENA PESA EL HUECO Y NO LA DISTANCIA, porque carvar PISA lo que
       haya: con ocho cuerpos renaciendo todo el tiempo, un renacimiento que
       prefiere terreno ajeno le roba a alguien una casa cada vez que lo
       cortan. En la campana da igual —renacer casi nunca llega hasta aca,
       porque el terreno propio no se pierde.                               */
    const v = lib * (M.arena ? 6 : 2) + Math.min(d, 30) * 3;
    if (v > mejorV) { mejorV = v; mejor = c; }
  }
  if (mejor < 0) mejor = 0;
  const m = discoN(M, mejor, k, tmp);
  for (let j = 0; j < m; j++) { const i = tmp[j]; if (M.z[i] !== PIEDRA) M.z[i] = p.id; }
  M.sucio = true;
  for (const q of M.jug) q.dcSucio = true;
  return mejor;
}

/* ── EL PASO DE RELOJ ─────────────────────────────────────────────────────
   La fraccion se acumula y los ticks salen enteros: asi un telefono a 30 y
   una notebook a 144 juegan EL MISMO juego.                                */
const RENACE_S = 1.15;
function paso(M, dt) {
  M.reloj += dt;
  for (const p of M.jug) if (!p.vivo && M.reloj - p.muerteT >= RENACE_S && p.cortes < (p.topeCortes || 1e9)) renace(M, p);
  M.f += VEL * dt;
  let g = 0;
  while (M.f >= 1 && g < 8) { M.f -= 1; tic(M); g++; }
  if (M.f >= 1) M.f = 0;
}

/* ══════════════════════ EL MAPA ══════════════════════ */

/* LAS CASAS VAN EN ESPIRAL DE FIBONACCI Y NO EN UN CIRCULO. En el plano el
   circulo existia para que dos casas no nacieran pegadas; en una esfera un
   circulo es una LATITUD, o sea que con ocho cuerpos los ocho quedarian en la
   misma franja y los dos polos vacios. La espiral aurea reparte n puntos sobre
   la esfera dejando a cada uno la misma area, que es exactamente lo que el
   circulo hacia en el plano.

   Y LLEVA DOS GIROS SORTEADOS y no uno: el de longitud (`a0`) mueve la
   espiral alrededor del eje, pero el primer punto sigue cayendo siempre cerca
   del mismo polo, y un polo del cubo es una ESQUINA —tres caras— asi que sin
   el segundo giro (`b0`, alrededor de X) todos los niveles nacerian con una
   casa en el mismo vertice.                                                */
const GA = Math.PI * (3 - Math.sqrt(5));
function ptoFib(j, nj, a0, b0) {
  const yy = nj === 1 ? 0 : 1 - (j + 0.5) * 2 / nj;
  const rr = Math.sqrt(Math.max(0, 1 - yy * yy));
  const th = GA * j + a0;
  const x = Math.cos(th) * rr, y = yy, z = Math.sin(th) * rr;
  const cb = Math.cos(b0), sb = Math.sin(b0);
  return [x, y * cb - z * sb, y * sb + z * cb];
}

const CASA_LIMPIA = 49;   /* el anillo de roca que se limpia alrededor */

function generaMapa(cfg) {
  const n = cfg.n, M = nuevoM(n), R = azar(cfg.sem);
  M.arena = !!cfg.arena;
  /* EL AZAR DEL CEREBRO SALE DE LA SEMILLA DEL NIVEL, y no es prolijidad:
     con `Math.random` la misma auditoria devolvia gana 3, 4, 4, 7 y 5 sobre
     el MISMO binario, asi que comparar dos ajustes no significaba nada — tres
     mediciones seguidas se leyeron como regresion y eran ruido. Y del lado del
     jugador vale lo mismo: un nivel con semilla tiene que ser EL MISMO nivel,
     o reintentar el que casi ganaste es jugar otro.                          */
  M.az = azar(cfg.sem ^ 0x5bf03635);
  ponPiedras(M, cfg, R);

  const nj = 1 + cfg.riv;
  const a0 = R() * Math.PI * 2, b0 = R() * Math.PI * 2;
  const tmp = new Int32Array(Math.max(CASA_K, CASA_LIMPIA));
  for (let j = 0; j < nj; j++) {
    const c = aCelda(ptoFib(j, nj, a0, b0), n);
    /* `per` PUEDE SER UN ARREGLO, y con eso la arena tiene siete cabezas
       distintas sin escribir siete cerebros: uno manso que sale poco, uno
       temerario que se va al otro lado del tablero, y cinco en el medio. La
       campana le sigue pasando un numero, asi que no cambia nada.         */
    const per = Array.isArray(cfg.per) ? cfg.per[(j - 1) % cfg.per.length] : cfg.per;
    const p = nuevoJug(j + 1, j === 0 ? null : { per });
    M.jug.push(p);
    let m = discoN(M, c, CASA_K, tmp);
    for (let k = 0; k < m; k++) M.z[tmp[k]] = p.id;
    /* un anillo alrededor de la casa se limpia de roca: nacer con la unica
       salida tapada es perder antes de tocar la pantalla.                  */
    m = discoN(M, c, CASA_LIMPIA, tmp);
    for (let k = 0; k < m; k++) if (M.z[tmp[k]] === PIEDRA) M.z[tmp[k]] = LIBRE;
    p.i = c; p.d = 0;
  }

  /* CONEXIDAD POR CONSTRUCCION: lo que no se alcanza desde la casa del
     jugador pasa a ser roca. Un bolsillo suelto no rompe el relleno —la
     barrera es el terreno propio— pero si rompe el juego: seria terreno que
     cuenta para la meta y al que no se puede llegar.                      */
  selloSueltos(M);
  M.libres = 0;
  for (let i = 0; i < M.N; i++) if (M.z[i] !== PIEDRA) M.libres++;
  M.sucio = true;
  M.cfg = cfg;
  return M;
}

/* ── LAS PIEDRAS ──────────────────────────────────────────────────────────
   EN EL PLANO LOS CUATRO PATRONES ERAN DIBUJOS EN UNA GRILLA; aca son
   propiedades de una DIRECCION, medidas sobre `POS`. Eso no es una traduccion
   cosmetica: un rectangulo en la grilla de una cara se parte al cruzar una
   arista, y una franja definida por un angulo contra un eje da la vuelta al
   planeta entera sin saber que las caras existen.

   LAS FRACCIONES DE ROCA ESTAN CALCULADAS CONTRA LAS DEL PLANO, no elegidas:
   pilares 7,7 % (el plano daba 7-9), cruz 9,1 (8,9), islas 5,1 (5,0), anillo
   6,3 (6,0). Una franja de semiancho `hw` alrededor de un circulo maximo cubre
   `sin(hw)` de la esfera, y `hw = grosor·π/(4n)` es lo que convierte un grosor
   en celdas a un angulo.                                                    */
function ponPiedras(M, cfg, R) {
  const n = M.n, N = M.N, z = M.z, P = M.POS;

  /* un eje al azar y dos perpendiculares: `U`/`V` son los que dan la longitud
     alrededor del eje, o sea donde van las puertas.                        */
  const eje = () => {
    const u = R() * 2 - 1, t = R() * Math.PI * 2, s = Math.sqrt(Math.max(0, 1 - u * u));
    return nrm([Math.cos(t) * s, u, Math.sin(t) * s]);
  };
  const perp = (A) => {
    const h = Math.abs(A[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const U = nrm([A[1] * h[2] - A[2] * h[1], A[2] * h[0] - A[0] * h[2], A[0] * h[1] - A[1] * h[0]]);
    const V = [A[1] * U[2] - A[2] * U[1], A[2] * U[0] - A[0] * U[2], A[0] * U[1] - A[1] * U[0]];
    return [U, V];
  };
  /* puertas: sin ellas una franja cerrada parte el planeta en dos y el sellado
     de sueltos se llevaria la mitad del tablero.                            */
  const puerta = (a, q, w) => {
    for (let k = 0; k < q; k++) {
      let e = a - k * Math.PI * 2 / q;
      e = Math.abs(((e % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
      if (Math.PI - e < w) return true;
    }
    return false;
  };
  /* franja alrededor de una latitud `lat` medida desde el ecuador del eje A */
  const franja = (A, lat, hw, q, w) => {
    const [U, V] = perp(A);
    for (let i = 0; i < N; i++) {
      const x = P[i * 3], y = P[i * 3 + 1], zz = P[i * 3 + 2];
      let s = x * A[0] + y * A[1] + zz * A[2];
      if (s > 1) s = 1; else if (s < -1) s = -1;
      const la = Math.asin(s);
      if (Math.abs(Math.abs(la) - lat) > hw) continue;
      if (q > 0) {
        const a = Math.atan2(x * V[0] + y * V[1] + zz * V[2], x * U[0] + y * U[1] + zz * U[2]);
        if (puerta(a, q, w)) continue;
      }
      z[i] = PIEDRA;
    }
  };
  const disco = (c, k, buf) => { const m = discoN(M, c, k, buf); for (let j = 0; j < m; j++) z[buf[j]] = PIEDRA; };

  switch (cfg.pat) {
    case 'pilares': {
      const q = Math.round(N / 90), buf = new Int32Array(9);
      for (let i = 0; i < q; i++) disco(Math.floor(R() * N), 5 + Math.floor(R() * 5), buf);
      break;
    }
    case 'cruz': {
      /* DOS CIRCULOS MAXIMOS PERPENDICULARES, que es lo que una cruz ES en una
         esfera: se cruzan en cuatro puntos y parten el planeta en cuatro.  */
      const hw = 3 * Math.PI / (4 * n);
      const A = eje(), [U] = perp(A);
      franja(A, 0, hw, 4, 0.22);
      franja(U, 0, hw, 4, 0.22);
      break;
    }
    case 'islas': {
      const q = Math.round(N / 280), buf = new Int32Array(20);
      for (let i = 0; i < q; i++) disco(Math.floor(R() * N), 8 + Math.floor(R() * 13), buf);
      break;
    }
    case 'anillo': {
      /* dos anillos a 45 grados del ecuador: en el plano era uno concentrico,
         y en una esfera el equivalente de «un anillo alrededor del centro» son
         los dos paralelos que rodean los dos polos.                         */
      franja(eje(), Math.PI / 4, 3 * Math.PI / (4 * n), 4, 0.22);
      break;
    }
  }
}

function selloSueltos(M) {
  const N = M.N, NB = M.NB, vis = new Uint8Array(N), q = new Int32Array(N);
  let qa = 0, qb = 0, ini = -1;
  for (let i = 0; i < N; i++) if (M.z[i] === 1) { ini = i; break; }
  if (ini < 0) for (let i = 0; i < N; i++) if (M.z[i] !== PIEDRA) { ini = i; break; }
  if (ini < 0) return;
  vis[ini] = 1; q[qb++] = ini;
  while (qa < qb) {
    const c = q[qa++], b = c * 4;
    for (let d = 0; d < 4; d++) {
      const k = NB[b + d];
      if (vis[k] || M.z[k] === PIEDRA) continue;
      vis[k] = 1; q[qb++] = k;
    }
  }
  for (let i = 0; i < N; i++) if (!vis[i] && M.z[i] !== PIEDRA) M.z[i] = PIEDRA;
}

/* ── LA AUDITORIA DEL MAPA ────────────────────────────────────────────────
   Cuatro propiedades, y las cuatro rompen el nivel de formas que una captura
   no muestra: terreno inalcanzable que cuenta para la meta, una casa tapada,
   dos casas pegadas, o una meta que ni ocupando todo se alcanza.          */
function auditaMapa(M) {
  const N = M.N, NB = M.NB, ND = M.ND, cfg = M.cfg;
  const vis = new Uint8Array(N), q = new Int32Array(N);
  let qa = 0, qb = 0;
  const ini = M.jug[0].i;
  vis[ini] = 1; q[qb++] = ini;
  while (qa < qb) {
    const c = q[qa++], b = c * 4;
    for (let d = 0; d < 4; d++) {
      const k = NB[b + d];
      if (vis[k] || M.z[k] === PIEDRA) continue;
      vis[k] = 1; q[qb++] = k;
    }
  }
  let libres = 0, alcanz = 0;
  for (let i = 0; i < N; i++) { if (M.z[i] !== PIEDRA) { libres++; if (vis[i]) alcanz++; } }
  let salidas = 99, cerca = 1e9;
  for (const p of M.jug) {
    let s = 0;
    for (let d = 0; d < 4; d++) {
      let i = p.i, dd = d, ok = true;
      for (let k = 0; k < 3; k++) { const b = i * 4 + dd; i = NB[b]; dd = ND[b]; if (M.z[i] === PIEDRA) { ok = false; break; } }
      if (ok) s++;
    }
    if (s < salidas) salidas = s;
    for (const r of M.jug) if (r !== p) { const e = distCel(M, r.i, p.i); if (e < cerca) cerca = e; }
  }
  if (M.jug.length < 2) cerca = 999;
  const malos = [];
  if (alcanz !== libres) malos.push('sueltas:' + (libres - alcanz));
  if (salidas < 2) malos.push('casa tapada');
  if (cerca < M.n * 0.30) malos.push('casas pegadas:' + cerca.toFixed(1));
  if (cfg && cfg.meta > 0.92) malos.push('meta imposible');
  return { n: M.n, N, libres, alcanz, salidas, cerca: +cerca.toFixed(1), roca: N - libres, meta: cfg ? cfg.meta : 0, malos };
}

/* ══════════════════════ LOS BOTS ══════════════════════ */

function legales(M, p) {
  const out = [], NB = M.NB, b = p.i * 4;
  for (let d = 0; d < 4; d++) {
    if (d === OPUE[p.d]) continue;                   /* nada de media vuelta */
    const i = NB[b + d];
    if (M.z[i] === PIEDRA) continue;
    if (M.t[i] === p.id) continue;                   /* la propia estela mata */
    out.push(d);
  }
  return out;
}

const rnd = M => M.az ? M.az() : Math.random();

/* ── CUANTO FALTA PARA QUE ME CORTEN ──────────────────────────────────────
   EL PELIGRO NO ES QUE UN RIVAL ESTE CERCA DE MI CABEZA: ES QUE LLEGUE A MI
   ESTELA ANTES QUE YO A CASA. Medido contra la cabeza y con un radio fijo,
   el bot se TRABABA: salia, veia un rival a nueve celdas —con la estela en
   cero, o sea sin una sola celda que perder— se volvia, y repetia. En el
   nivel 4-2 eso fueron TREINTA Y DOS abortos y el 2,1 % del tablero.
   Sin estela no hay riesgo: parado en lo propio a nadie lo pueden cortar.

   Y ACA LA ESFERA OBLIGA A CAMBIAR EL METODO, no solo la formula. En el plano
   la distancia de cuadricula tenia forma cerrada —|dx|+|dy|— asi que el
   numero era EXACTO y gratis. En una esfera de cubo no hay forma cerrada, y
   el primer reemplazo fue el angulo escalado (`acos(cos) * kD`, con
   kD = 8n/pi^2 = pasos por radian por el 4/pi medio de L1 sobre L2). En
   promedio acierta y en cada caso particular no, porque el 4/pi es una MEDIA
   sobre direcciones: contra un BFS de verdad, en n = 18, 26, 33 y 38, la
   estimacion da de media 0,96 a 0,98 del valor real y va de **0,47 a 1,58**.
   El extremo que importa es el de arriba: decir que un rival esta un 58 % mas
   lejos de lo que esta es exactamente el error que mata, porque el bot se
   queda afuera creyendose seguro. Medido, esa era la diferencia entre 35 y 40
   niveles ganados de 40.

   ASI QUE ACA SE CUENTAN PASOS DE VERDAD, y el BFS es barato porque va
   ACOTADO: la unica pregunta que `piensa` hace es «¿hay una cabeza rival a
   `lim` pasos o menos de mi estela?», asi que se siembra en las cabezas
   rivales y se corta en `lim`. Con `lim` entre 1 y 20 eso es un disco chico
   alrededor de siete cuerpos y no la esfera entera, y la respuesta es exacta
   para la comparacion que se hace con ella. Lo que queda mas alla devuelve
   1e9, que es lo mismo que «no hace falta volver».
   Y VA CON MARCA DE GENERACION (`_rg`) en vez de borrar el arreglo: limpiar
   6.500 enteros por cuerpo y por tic cuesta mas que el propio BFS.

   `distCel` —la estimacion angular— se queda, pero SOLO donde su error no
   decide nada: sembrar casas lejos unas de otras y limpiar la roca alrededor,
   donde el umbral esta a tres veces del valor medido.                       */
function riesgo(M, p, lim) {
  const c = p.cola;
  if (!c.length) return 1e9;
  /* EL CONTROL `ciego` NO ES TORPEZA: ES NO MIRAR. Juega la misma geometria
     —esquiva piedras y su propia estela todos los tics— y lo unico que no
     hace es preguntar donde estan los rivales, o sea que se vuelve a casa
     por el tramo y no por el corte. Es el unico control que aisla LA
     decision de este juego.                                                */
  if (p.bot && p.bot.ciego) return 1e9;
  if (lim < 1) return 1e9;
  const N = M.N, NB = M.NB, t = M.t, z = M.z;
  if (!M._rq || M._rq.length !== N) { M._rq = new Int32Array(N); M._rv = new Int32Array(N); M._rg = 0; }
  const q = M._rq, vis = M._rv, g = ++M._rg;
  let qa = 0, qb = 0;
  for (const r of M.jug) {
    if (r === p || !r.vivo) continue;
    if (t[r.i] === p.id) return 0;
    if (vis[r.i] !== g) { vis[r.i] = g; q[qb++] = r.i; }
  }
  for (let d = 1; d <= lim && qa < qb; d++) {
    const fin = qb;
    while (qa < fin) {
      const b = q[qa++] * 4;
      for (let k = 0; k < 4; k++) {
        const j = NB[b + k];
        if (vis[j] === g || z[j] === PIEDRA) continue;
        if (t[j] === p.id) return d;
        vis[j] = g; q[qb++] = j;
      }
    }
  }
  return 1e9;
}

/* EL BOT NO CUENTA PASOS: MIRA LA PROFUNDIDAD.
   Contando pasos, el tramo se gasta tambien caminando adentro de lo propio —y
   como el terreno crece, a mitad de partida casi todo el tramo se va en cruzar
   la casa y las vueltas se achican solas. Medido asi, el bot cercaba 40 celdas
   por vuelta donde hacen falta mas del doble. `dc` ya dice a cuantos pasos de
   lo propio esta cada celda, o sea que «salir» es subir por ese campo, «correr
   el costado» es mantenerlo y «volver» es bajarlo: los tres modos son el mismo
   numero y ninguno depende de por donde se venia. Y ESO SOBREVIVE ENTERO A LA
   ESFERA, porque `dc` sale de un BFS sobre `NB` y un BFS no sabe de caras.  */
function piensa(M, p) {
  const b = p.bot; if (!b) return;
  if (b.azar) return piensaAzar(M, p);
  const NB = M.NB, per = b.per, leg = legales(M, p);
  if (!leg.length) return;
  const dc = verCasa(M, p), aqui = dc[p.i];
  const enCasa = aqui <= 0;                       /* cero es el borde        */

  /* LO QUE `per` GOBIERNA ES CUANTO SE ARRIESGA, no la punteria: un bot que
     sale mas hondo y corre mas de costado cerca mas por vuelta y se expone
     mas tiempo. El area de una vuelta es hondo x lado.                      */
  const hondo  = Math.round(mez(4, 14, per));
  const largo  = Math.round(mez(6, 34, per));
  const tope   = Math.round(mez(18, 96, per));
  const margen = Math.round(mez(6, 1, per));

  if (enCasa) p.plan = null;
  if (!p.plan) p.plan = { modo: 'salir', lado: rnd(M) < 0.5 ? 1 : -1, resta: largo };

  /* volver cuando el rival llega a la estela antes que yo a casa: `aqui` son
     mis pasos hasta lo propio, y el margen es lo unico que `per` mueve aca. */
  if (p.estela > tope || riesgo(M, p, aqui + margen) <= aqui + margen) p.plan.modo = 'volver';
  else if (p.plan.modo === 'salir') { if (aqui >= hondo) p.plan.modo = 'lado'; }
  else if (p.plan.modo === 'lado') { if (p.plan.resta <= 0) p.plan.modo = 'volver'; else p.plan.resta--; }

  const base = p.i * 4;
  let mejor = -1e9, d = leg[0];
  for (const k of leg) {
    const i = NB[base + k];
    const dd = dc[i];
    let v;
    if (p.plan.modo === 'volver') v = -dd * 10;
    else if (p.plan.modo === 'salir') v = dd * 10;
    else v = -Math.abs(dd - hondo) * 10;        /* paralelo al borde         */
    /* seguir derecho cuando empata: un bot que zigzaguea gasta el doble de
       estela para encerrar lo mismo. En la esfera «derecho» es el rumbo que
       trae (`p.d`) y no una direccion de pantalla: `dirDe` desaparece con el
       plano, porque el rumbo ya es un dato del cuerpo.                      */
    if (k === p.d) v += 3;
    if (M.t[i] !== 0 && M.t[i] !== p.id) v += 60;   /* de paso, un corte      */
    if (M.z[i] === p.id && p.plan.modo !== 'volver') v -= 25;
    v += rnd(M) * 2;
    if (v > mejor) { mejor = v; d = k; }
  }
  p.ped = d;
}

function piensaAzar(M, p) {
  const leg = legales(M, p);
  if (!leg.length) return;
  p.ped = leg[Math.floor(rnd(M) * leg.length)];
}

/* ══════════════════════ AUDITORIAS ══════════════════════ */

/* ── LA GEOMETRIA, ANTES QUE NADA ────────────────────────────────────────
   LA TABLA DE VECINOS SE CONSTRUYE POR PROYECCION INVERSA y no con una lista
   de 24 costuras escrita a mano, justamente porque una entrada mal escrita no
   falla: TELETRANSPORTA el cuerpo a otra cara y desde afuera eso se ve como
   que el juego hace trampa. Lo que se comprueba es la propiedad que el juego
   necesita y no el procedimiento: que ir y volver devuelva al mismo sitio
   (`NB[NB[i,d], OPUE[ND[i,d]]] === i`) y que cada celda tenga CUATRO vecinos
   distintos. La segunda no es redundante: en una esfera de cubo las ocho
   esquinas tienen tres cuadrados, y si la proyeccion inversa se equivocara
   ahi, una celda tendria un vecino repetido — o sea un cuerpo que cruza una
   arista y sale por donde entro.                                           */
function auditaGeo(n) {
  const g = geoDe(n || 38), NB = g.NB, ND = g.ND, N = g.N;
  let asim = 0, repes = 0, fuera = 0, primero = null;
  for (let i = 0; i < N; i++) {
    const b = i * 4;
    for (let d = 0; d < 4; d++) {
      const j = NB[b + d], nd = ND[b + d];
      if (j < 0 || j >= N || nd < 0 || nd > 3) { fuera++; continue; }
      const v = NB[j * 4 + OPUE[nd]];
      if (v !== i) { asim++; if (!primero) primero = { i, d, j, nd, vuelve: v }; }
    }
    for (let a = 0; a < 4; a++) for (let c = a + 1; c < 4; c++)
      if (NB[b + a] === NB[b + c]) repes++;
  }
  /* que las posiciones esten sobre la esfera y que un vecino este a un paso:
     si `posCel` se saliera de la normalizacion, `distCel` mentiria en todo el
     juego sin que nada fallara.                                             */
  const P = g.POS;
  let peorR = 0, peorPaso = 0, mejorPaso = 9;
  for (let i = 0; i < N; i += Math.max(1, (N / 900) | 0)) {
    const b = i * 3;
    const r = Math.hypot(P[b], P[b + 1], P[b + 2]);
