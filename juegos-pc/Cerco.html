    if (Math.abs(r - 1) > peorR) peorR = Math.abs(r - 1);
    for (let d = 0; d < 4; d++) {
      const e = distCel(g, i, NB[i * 4 + d]);
      if (e > peorPaso) peorPaso = e;
      if (e < mejorPaso) mejorPaso = e;
    }
  }
  return {
    n: n || 38, N, asim, repes, fuera, primero,
    radio: +peorR.toExponential(1),
    paso: [+mejorPaso.toFixed(3), +peorPaso.toFixed(3)],
    ok: asim === 0 && repes === 0 && fuera === 0,
  };
}

/* ── «AFUERA» ES UNA MEDIDA Y HAY QUE MEDIRLA ────────────────────────────
   En el plano el relleno arrancaba del borde del tablero y el resultado era
   EXACTO: terreno mas estela forman un anillo 4-conexo y un anillo 4-conexo
   separa el plano. Una esfera no tiene borde, asi que el anillo la parte en
   dos pedazos FINITOS y hay que elegir cual es «afuera». La regla es el mas
   grande, y eso es una decision de diseno: falla cuando el pedazo cercado
   supera a lo que queda sin duenos —o sea cuando alguien esta a punto de
   ganar el planeta entero—. Lo que esta funcion informa es CUANTO FALTO para
   que fallara: `peorRep` es la fraccion mas chica que «afuera» llego a tener
   de todo el complemento (1 es holgado, 0,5 es empate) y `dudas` cuantos
   cierres bajaron de 0,75.                                                 */
function auditaFuera(veces) {
  const filas = [];
  let peor = 1, dudas = 0, cerrados = 0;
  for (let m = 0; m < MUNDOS.length; m++) for (let n = 0; n < NIV_MUNDO; n++) {
    const r = juegaSolo(m, n, 'bot');
    filas.push({ niv: (m + 1) + '-' + (n + 1), rep: r.peorRep, dudas: r.dudas, cerrados: r.cerrados });
    if (r.peorRep < peor) peor = r.peorRep;
    dudas += r.dudas; cerrados += r.cerrados;
  }
  const N = veces || 6;
  for (let i = 0; i < N; i++) {
    const r = juegaArena(1000 + i * 37, 'bot', 120);
    filas.push({ niv: 'arena ' + r.sem, rep: r.peorRep, dudas: r.dudas, cerrados: r.cerrados });
    if (r.peorRep < peor) peor = r.peorRep;
    dudas += r.dudas; cerrados += r.cerrados;
  }
  return { de: filas.length, peorRep: +peor.toFixed(3), dudas, cerrados, ok: dudas === 0, filas };
}

/* LA REGLA, CONTRA FORMAS CONOCIDAS. Un relleno que devuelva «algo» no
   prueba nada: hay que pedirle un numero que se pueda contar a mano.
   LOS CUATRO CASOS SIGUEN SIENDO LOS DEL PLANO, celda por celda: van en el
   medio de la cara +Z con n=24, y el recorrido mas ancho llega a x=19 y el
   mas alto a y=4, o sea que NINGUNO toca una arista. Eso es a proposito: lo
   que estos cuatro casos prueban es la REGLA DEL RELLENO, y meterlos en una
   costura mezclaria dos cosas que fallan por motivos distintos —la costura
   ya la prueba `auditaGeo`—.                                               */
const CR = (x, y) => (4 * 24 + y) * 24 + x;    /* celda de la cara +Z, n=24 */
const DER = 0, IZQ = 1, ABA = 2, ARR = 3;

function auditaRegla() {
  const out = [];
  /* 1 · una mordida rectangular: se sale del terreno, se rodea un 5×3 y se
        vuelve. Tienen que quedar EXACTAMENTE esas quince celdas mas la
        estela, ni una mas.                                                */
  {
    const M = nuevoM(24), p = nuevoJug(1, null); M.jug.push(p);
    for (let y = 4; y < 14; y++) for (let x = 4; x < 14; x++) M.z[CR(x, y)] = 1;
    p.i = CR(13, 8); p.d = DER;
    const cam = [DER, DER, DER, DER, DER, DER, ARR, ARR, ARR, ARR,
                 IZQ, IZQ, IZQ, IZQ, IZQ, IZQ];
    let antes = 0; for (let i = 0; i < M.N; i++) if (M.z[i] === 1) antes++;
    for (const c of cam) { p.ped = c; tic(M); }
    let desp = 0; for (let i = 0; i < M.N; i++) if (M.z[i] === 1) desp++;
    /* seis de ida, cuatro de subida, cinco de vuelta = 15 de estela, mas el
       interior 5×3 = 15. La sexta de la vuelta cae en terreno propio.     */
    out.push({ caso: 'mordida', antes, desp, gano: desp - antes, esperado: 30, ok: desp - antes === 30 });
  }
  /* 2 · rodear una roca: la roca SIGUE SIENDO ROCA y lo de alrededor pasa a
        ser terreno. Si la roca se reclamara, el tablero perderia el unico
        obstaculo que tiene.                                               */
  {
    const M = nuevoM(24), p = nuevoJug(1, null); M.jug.push(p);
    for (let y = 4; y < 14; y++) for (let x = 4; x < 14; x++) M.z[CR(x, y)] = 1;
    M.z[CR(16, 8)] = PIEDRA;
    p.i = CR(13, 8); p.d = DER;
    const cam = [ARR, DER, DER, DER, DER, ABA, ABA, IZQ, IZQ, IZQ, IZQ];
    for (const c of cam) { p.ped = c; tic(M); }
    const roca = M.z[CR(16, 8)] === PIEDRA, mio = M.z[CR(16, 7)] === 1;
    out.push({ caso: 'roca', sigueRoca: roca, mio, ok: roca && mio });
  }
  /* 3 · encerrar a un rival: su terreno pasa a ser mio. Sin esto los rivales
        serian decoracion que estorba.                                     */
  {
    const M = nuevoM(24), p = nuevoJug(1, null), q = nuevoJug(2, null); M.jug.push(p, q);
    for (let y = 4; y < 14; y++) for (let x = 4; x < 14; x++) M.z[CR(x, y)] = 1;
    for (let y = 7; y < 10; y++) for (let x = 15; x < 18; x++) M.z[CR(x, y)] = 2;
    q.i = CR(16, 8); q.vivo = false;
    let suyo0 = 0; for (let i = 0; i < M.N; i++) if (M.z[i] === 2) suyo0++;
    p.i = CR(13, 8); p.d = DER;
    const cam = [ARR, ARR, ARR, DER, DER, DER, DER, DER, DER,
                 ABA, ABA, ABA, ABA, ABA, ABA, IZQ, IZQ, IZQ, IZQ, IZQ, IZQ,
                 ARR, ARR, ARR];
    for (const c of cam) { p.ped = c; tic(M); }
    let suyo1 = 0; for (let i = 0; i < M.N; i++) if (M.z[i] === 2) suyo1++;
    out.push({ caso: 'rival', suyo0, suyo1, ok: suyo0 === 9 && suyo1 === 0 });
  }
  /* 4 · la propia estela mata, y la ajena mata a su dueno. Es LA regla que
        hace que salir cueste algo.                                        */
  {
    const M = nuevoM(24), p = nuevoJug(1, null); M.jug.push(p);
    for (let y = 4; y < 8; y++) for (let x = 4; x < 8; x++) M.z[CR(x, y)] = 1;
    p.i = CR(7, 6); p.d = DER;
    const cam = [DER, DER, ABA, IZQ, ARR, ARR];
    for (const c of cam) { if (p.vivo) { p.ped = c; tic(M); } }
    out.push({ caso: 'propia estela', vivo: p.vivo, ok: !p.vivo });
  }
  return { casos: out, malos: out.filter(o => !o.ok).map(o => o.caso) };
}

/* ═══════════════════════════════════════════════════════════════════════════
   LOS AUTO-JUGADORES · lo unico que prueba que hay una decision adentro
   ───────────────────────────────────────────────────────────────────────────
   Tres cerebros y el tercero es el control: el que juega al azar tiene que
   perder por lejos, porque si llega parecido al honesto entonces el juego no
   esta pidiendo nada y la geometria nueva no arreglo eso, lo tapo.

   Y LOS TRES DEVUELVEN `peorRep`, `dudas` y `cerrados`: la regla del relleno
   en la esfera —«la componente mas grande es afuera»— es una DECISION y no un
   teorema, asi que cada partida tiene que informar cuanto le falto para
   fallar. Eso es lo que junta `auditaFuera`.
   ═══════════════════════════════════════════════════════════════════════ */

function juegaSolo(m, nn, modo, sem) {
  const cfg = cfgNivel(m, nn);
  if (sem != null) cfg.sem = sem;
  const M = generaMapa(cfg);
  const yo = M.jug[0];
  yo.bot = modo === 'azar'  ? { azar: true }
         : modo === 'ciego' ? { per: 0.80, ciego: true }
         :                    { per: 0.80 };
  yo.topeCortes = VIDAS;
  for (let j = 1; j < M.jug.length; j++) M.jug[j].topeCortes = 1e9;
  const DT = 1 / VEL;                     /* un tic exacto por paso          */
  let t = 0, gano = false;
  const tope = Math.ceil(cfg.seg * VEL) + 40;
  for (let k = 0; k < tope; k++) {
    paso(M, DT); t += DT;
    if (tajada(M, 1) >= cfg.meta) { gano = true; break; }
    if (yo.cortes >= VIDAS && !yo.vivo) break;
    if (t >= cfg.seg) break;
  }
  return {
    m, n: nn, modo, gano, seg: +t.toFixed(1), meta: +(cfg.meta * 100).toFixed(1),
    pct: +(tajada(M, 1) * 100).toFixed(1), cortes: yo.cortes, cerros: yo.cerros,
    riv: M.jug.slice(1).map(q => +(tajada(M, q.id) * 100).toFixed(1)),
    peorRep: +M.peorRep.toFixed(3), dudas: M.dudas, cerrados: M.cerrados,
  };
}

function juegaArena(sem, modo, seg) {
  const cfg = cfgArena(sem);
  const M = generaMapa(cfg);
  const yo = M.jug[0];
  yo.bot = modo === 'azar'  ? { azar: true }
         : modo === 'ciego' ? { per: 0.86, ciego: true }
         :                    { per: 0.86 };
  yo.topeCortes = 1;                      /* una vida: la arena es asi       */
  for (let j = 1; j < M.jug.length; j++) M.jug[j].topeCortes = 1e9;
  const DT = 1 / VEL, lim = seg || 120;
  let t = 0, mejor = 0;

  /* EL PUESTO SE GUARDA EN EL ULTIMO TIC VIVO Y NO AL SALIR DEL BUCLE.
     En la arena morir BORRA el terreno, asi que preguntando despues el
     jugador lee 0% y sale ultimo SIEMPRE, por construccion — el numero seria
     del cadaver y no de la partida. Medido en el plano con la semilla 1001:
     ultimo vivo pos 7 con 2,52%, ya muerto pos 8 con 0,00.                 */
  let ultPos = puestoDe(M, 1), ultPct = tajada(M, 1);
  const tope = Math.ceil(lim * VEL) + 8;
  for (let k = 0; k < tope; k++) {
    paso(M, DT); t += DT;
    const pc = tajada(M, 1);
    if (pc > mejor) mejor = pc;
    if (!yo.vivo) break;
    ultPct = pc; ultPos = puestoDe(M, 1);
    if (t >= lim) break;
  }
  return {
    modo, sem: cfg.sem, seg: +t.toFixed(1), vivo: yo.vivo,
    pct: +(ultPct * 100).toFixed(2), mejor: +(mejor * 100).toFixed(2),
    pos: ultPos, matas: yo.matas, cerros: yo.cerros,
    riv: tablaPos(M).map(f => f.id + ':' + (f.pct * 100).toFixed(1)),
    peorRep: +M.peorRep.toFixed(3), dudas: M.dudas, cerrados: M.cerrados,
  };
}

function auditaArena(modo, veces, segs) {
  const r = [], t0 = Date.now(), N = veces || 12;
  for (let i = 0; i < N; i++) r.push(juegaArena(1000 + i * 37, modo || 'bot', segs));
  const med = k => +(r.reduce((a, x) => a + x[k], 0) / r.length).toFixed(2);
  return {
    modo: modo || 'bot', de: r.length, ms: Date.now() - t0,
    segMedio: med('seg'), mejorMedio: med('mejor'), posMedio: med('pos'),
    matasMedio: med('matas'), vivos: r.filter(x => x.vivo).length,
    peorPos: Math.max(...r.map(x => x.pos)), mejorPos: Math.min(...r.map(x => x.pos)),
    peorRep: +Math.min(...r.map(x => x.peorRep)).toFixed(3),
    dudas: r.reduce((a, x) => a + x.dudas, 0),
  };
}

function auditaTodo(modo) {
  const r = [], t0 = Date.now();
  for (let m = 0; m < MUNDOS.length; m++) for (let n = 0; n < NIV_MUNDO; n++) r.push(juegaSolo(m, n, modo || 'bot'));
  const gana = r.filter(x => x.gano).length;
  return {
    modo: modo || 'bot', de: r.length, gana, ms: Date.now() - t0,
    pctMedio: +(r.reduce((a, x) => a + x.pct, 0) / r.length).toFixed(1),
    cortesMedio: +(r.reduce((a, x) => a + x.cortes, 0) / r.length).toFixed(2),
    peorRep: +Math.min(...r.map(x => x.peorRep)).toFixed(3),
    dudas: r.reduce((a, x) => a + x.dudas, 0),
    malos: r.filter(x => !x.gano).map(x => (x.m + 1) + '-' + (x.n + 1) + ' ' + x.pct + '/' + x.meta),
  };
}

function auditaMapas() {
  const malos = [], filas = [];
  for (let m = 0; m < MUNDOS.length; m++) for (let n = 0; n < NIV_MUNDO; n++) {
    const M = generaMapa(cfgNivel(m, n)), a = auditaMapa(M);
    filas.push({ niv: (m + 1) + '-' + (n + 1), n: a.n, N: a.N, libres: a.libres, roca: a.roca, cerca: a.cerca });
    if (a.malos.length) malos.push((m + 1) + '-' + (n + 1) + ': ' + a.malos.join(','));
  }
  for (let i = 0; i < 4; i++) {
    const s = 1000 + i * 37, M = generaMapa(cfgArena(s)), a = auditaMapa(M);
    filas.push({ niv: 'arena ' + s, n: a.n, N: a.N, libres: a.libres, roca: a.roca, cerca: a.cerca });
    if (a.malos.length) malos.push('arena ' + s + ': ' + a.malos.join(','));
  }
  return { de: filas.length, malos, filas };
}
/* ══════════════════════════════════════════════════════════════════════════
   D · AUDIO
   Procedural y sin un byte de asset, y aca eso ademas es lo correcto: lo que
   suena en CERCO es tierra que se cierra y una estela que se corta — un tono
   con cuerpo y un golpe seco, o sea ruido filtrado. Un clip grabado pesaria
   cientos de kilobytes y encima se cortaria en cada vuelta del bucle.
   TODO CUELGA DE UN MAESTRO para que el analizador de las sondas pueda decir
   si algo sono de verdad: «no tiro excepcion» no es «se escucho».
   ══════════════════════════════════════════════════════════════════════════ */
const AU = { ctx: null, maes: null, mus: null, fx: null, an: null, ruido: null, on: false, cama: null, acorde: 0, abre: 0 };

/* Un solo bufer de ruido de un segundo, generado una vez. Cada golpe lo
   reproduce con otro filtro y otro sobre: dos rellenos de ruido distintos
   cuestan lo mismo que dos filtros y pesan el doble.                       */
function auRuido() {
  if (AU.ruido) return AU.ruido;
  const n = AU.ctx.sampleRate, b = AU.ctx.createBuffer(1, n, n), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  AU.ruido = b; return b;
}

function auArranca() {
  if (AU.on) return;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try { AU.ctx = new C(); } catch (e) { return; }
  AU.maes = AU.ctx.createGain(); AU.maes.gain.value = 0.9;
  AU.an = AU.ctx.createAnalyser(); AU.an.fftSize = 2048;
  AU.maes.connect(AU.an); AU.an.connect(AU.ctx.destination);
  AU.mus = AU.ctx.createGain(); AU.mus.gain.value = PROG.vol; AU.mus.connect(AU.maes);
  AU.fx  = AU.ctx.createGain(); AU.fx.gain.value  = PROG.fx;  AU.fx.connect(AU.maes);
  AU.on = true;
  auCama();
}
function auDesp() { if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); }
function auVol() { if (!AU.on) return; AU.mus.gain.value = PROG.vol; AU.fx.gain.value = PROG.fx; }

/* ── LA CAMA ──────────────────────────────────────────────────────────────
   Cuatro voces DOBLADAS y desafinadas un pelo entre si: dos senos identicos
   suenan a tono de prueba y dos que baten cada varios segundos suenan a
   instrumento. Y un pasabajos que respira cada 19 s.

   LO PROPIO DE ESTE JUEGO ES QUE EL FILTRO SE ABRE CON LA TAJADA. Cuanto mas
   tablero es tuyo, mas brillo tiene la cama: la musica dice como vas sin un
   numero y sin un cartel, que es justo lo que un tablero de setenta celdas de
   lado no puede mostrar de una ojeada. Y no es un segundo tema —eso seria un
   corte— es el MISMO acorde abriendose.                                     */
const AU_RAIZ = [55, 58.27, 61.74, 49, 51.91];   /* una por mundo            */
const AU_GR = [0, 12, 19, 26];                   /* raiz · octava · quinta · novena */
function auCama() {
  if (!AU.on) return;
  const c = AU.ctx, t = c.currentTime;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
  lp.frequency.value = 400; lp.connect(AU.mus);
  const lfo = c.createOscillator(), lg = c.createGain();
  lfo.frequency.value = 1 / 19; lg.gain.value = 190;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t);
  AU.cama = { lp, voces: [] };
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; g.gain.value = 0.030 / (1 + i * 0.5);
    o.connect(g); g.connect(lp); o.start(t);
    AU.cama.voces.push({ o, g, i, det: j ? 1.00027 : 1 });
  }
  auAcorde(0); auAbre(0);
}
/* Cada mundo TRANSPONE la raiz; no cambia de tema. Cinco temas serian cinco
   cortes, y este juego no tiene un solo corte.                             */
function auAcorde(m) {
  if (!AU.on || !AU.cama) return;
  AU.acorde = m;
  const r = AU_RAIZ[cl(m, 0, AU_RAIZ.length - 1)], t = AU.ctx.currentTime;
  for (const v of AU.cama.voces)
    v.o.frequency.setTargetAtTime(r * Math.pow(2, AU_GR[v.i] / 12) * v.det, t, 0.9);
}
/* `k` es cuanto falta para la meta, de 0 a 1. El corte va lento a proposito
   (medio segundo de constante): siguiendo la tajada cuadro a cuadro el filtro
   late en cada reclamo y eso se escucha peor que no moverlo.               */
function auAbre(k) {
  if (!AU.on || !AU.cama) return;
  AU.abre = cl(k, 0, 1);
  AU.cama.lp.frequency.setTargetAtTime(400 + AU.abre * 1500, AU.ctx.currentTime, 0.5);
}

/* ── LOS EFECTOS ─────────────────────────────────────────────────────────
   LA ESCALA SE MIDE CON `sonMide`, QUE BARRE EL CLIP ENTERO: la ventana del
   analizador son 42,7 ms y un efecto dura entre 150 y 700, asi que una sola
   lectura cae donde caiga y devuelve la cama.
   Y la Q va ABIERTA: un pasabanda estrecho sobre ruido blanco se come casi
   toda la energia — ya costo una vuelta en POMPOM y otra en FLECHAS.      */
function auEnv(g, t, a, d, pico) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(pico, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function auTono(f, t, dur, pico, tipo, f1) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = tipo || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(g); g.connect(AU.fx);
  auEnv(g, t, 0.008, dur, pico);
  o.start(t); o.stop(t + dur + 0.06);
}
function auRoce(t, dur, f0, f1, pico, q) {
  const c = AU.ctx, s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
  s.buffer = auRuido(); s.loop = true;
  bp.type = 'bandpass'; bp.Q.value = q || 0.9;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  s.connect(bp); bp.connect(g); g.connect(AU.fx);
  auEnv(g, t, 0.012, dur, pico);
  s.start(t); s.stop(t + dur + 0.08);
}
function son(k, arg) {
  if (!AU.on) return;
  auDesp();
  const t = AU.ctx.currentTime;
  switch (k) {
    /* ── TIERRA: el acto central, y SUENA MAS CUANTO MAS SE CERRO. Con un
          sonido fijo, encerrar tres celdas y encerrar trescientas dan lo
          mismo, y entonces el unico premio del juego no informa nada.      */
    case 'tierra': {
      const k2 = cl((arg || 0) / 260, 0, 1);
      const g = [0, 7, 12, 16, 19];
      const cu = 2 + Math.round(k2 * 3);                 /* de dos a cinco notas */
      for (let i = 0; i < cu; i++)
        auTono(261.63 * Math.pow(2, g[i] / 12), t + i * 0.055, 0.26, 0.19, 'sine');
      auRoce(t, 0.22 + k2 * 0.25, 700, 2600 + k2 * 1800, 0.11 + k2 * 0.07, 0.8);
      break;
    }
    /* ── EL CORTE: lo mas fuerte del juego, y tiene que serlo. Es lo unico
          que cuesta una vida. Golpe grave que CAE — uno que sube suena a
          premio — mas un raspon ancho.                                     */
    case 'corte':
      auTono(190, t, 0.34, 0.40, 'triangle', 62);
      auRoce(t, 0.26, 1800, 220, 0.34, 0.7);
      break;
    /* SALIR DE LO PROPIO ES EL UNICO AVISO DE QUE ESTAS EXPUESTO, y estaba
       puesto «flojo porque suena una vez por vuelta». Medido con `sonMide`,
       flojo era 1,09 VECES LA CAMA: o sea que no existia. Un aviso que no se
       oye no es discreto, es un aviso que no esta. Va al doble de pico y con
       un golpecito grave adelante — un roce agudo solo tiene poca masa y se
       pierde debajo del pad, que es grave.
       Y sigue por DEBAJO de `casi` (2,2x), que es la alarma de verdad: esto
       avisa que arrancaste, aquello avisa que te vienen a cortar.          */
    case 'sale':
      auRoce(t, 0.16, 2000, 3800, 0.34, 0.9);
      auTono(330, t, 0.10, 0.13, 'sine');
      break;
    /* un rival llegando a la estela: dos golpes, que es lo que se lee a
       alarma — uno solo se confunde con el roce de salir.                   */
    case 'casi':
      auTono(740, t, 0.09, 0.20, 'square');
      auTono(740, t + 0.13, 0.09, 0.20, 'square');
      break;
    /* los dos que confirman: el toque de un boton y el paso del tutorial que
       se dio por hecho. Medidos en 1,23x y 1,12x la cama — o sea que tocar un
       boton no sonaba y avanzar de paso tampoco. Un acuse de recibo inaudible
       se lee a que el juego no te escucho.                                  */
    case 'ui':   auTono(880, t, 0.06, 0.24, 'sine'); break;
    case 'des':
      auRoce(t, 0.18, 2600, 900, 0.30, 1.2);
      auTono(659.25, t + 0.02, 0.12, 0.16, 'sine');
      break;
    case 'gana': { const r = 440, g = [0, 4, 7, 12];
      for (let i = 0; i < 4; i++) auTono(r * Math.pow(2, g[i] / 12), t + i * 0.075, 0.32, 0.22, 'sine');
      auRoce(t, 0.55, 800, 4200, 0.12, 0.9); break; }
    case 'perf': { const r = 523.25, g = [0, 4, 7, 12, 16, 19];
      for (let i = 0; i < 6; i++) auTono(r * Math.pow(2, g[i] / 12), t + i * 0.068, 0.44, 0.21, 'sine');
      auRoce(t, 0.75, 1000, 5400, 0.14, 0.9); break; }
    case 'pierde':
      auTono(174.6, t, 0.55, 0.24, 'sawtooth', 87.3);
      auTono(130.8, t + 0.10, 0.55, 0.20, 'sawtooth', 65.4);
      break;
  }
}
/* Agacha la cama mientras suena algo que hay que escuchar: sin esto la
   fanfarria compite con el pad y no se oye ninguna de las dos.

   `f` ES UNA FRACCION Y `dur` PUEDE NO ESTAR, y esa segunda forma no es un
   adorno: hay DOS agachadas distintas y con una sola firma una de las dos
   sale rota. La de la fanfarria dura lo que dura el sonido y se levanta
   sola; la de la PAUSA dura lo que dure la pausa —no hay forma de saberlo
   de antemano— y la levanta quien despausa. Con `dur` obligatorio, los tres
   llamadores de la pausa pasaban un booleano y `t + undefined` es NaN:
   `setTargetAtTime` TIRA con un valor no finito, y esa excepcion se llevaba
   puesto a `partidaSale` entero —o sea salir al menu desde la pausa— sin que
   nada del audio pareciera tener que ver.                                  */
function auAgacha(f, dur) {
  if (!AU.on) return;
  const t = AU.ctx.currentTime, g = AU.mus.gain;
  g.cancelScheduledValues(t);
  g.setTargetAtTime(PROG.vol * f, t, 0.05);
  if (dur > 0) g.setTargetAtTime(PROG.vol, t + dur, 0.35);
}
/* ══════════════════════════════════════════════════════════════════════════
   E · EL DIBUJO — EL PLANETA
   EL TABLERO SE SUBE COMO TEXTURA, UNA POR CARA, Y NO COMO GEOMETRIA. Un
   planeta de n=58 son 20.184 celdas: una malla por celda serian veinte mil
   objetos para pintar cuadrados de color liso. Seis mallas de (n+1)² vertices
   con una `DataTexture` de n×n cada una y filtro NEAREST son SEIS ordenes de
   dibujo, y el escalon duro del vecino mas cercano es justo el estilo.
   Y LA ESTELA VA EN LA MISMA TEXTURA QUE EL TERRENO. Dibujada aparte serian
   ocho listas de celdas que hay que proyectar a la esfera cada cuadro; en la
   textura cuesta escribir cuatro bytes por celda que cambio, y el dia que se
   toque el color de una estela no hay un segundo dibujante que corregir.
   Lo unico que se dibuja aparte son los CUERPOS —una malla instanciada de
   ocho cubos— y las esquirlas.
   ══════════════════════════════════════════════════════════════════════════ */

const V = {
  ren: null, esc: null, cam: null, cv: null, dpr: 1,
  W: 0, H: 0, n: 0, N: 0,
  caras: [], tex: [], buf: [], suc: [],
  pz: null, pt: null, fl: null, flAct: null,
  cuer: null, cuerM: null, esq: null, esqG: null, esqP: [],
  cpos: null, cmira: null, carr: null, dist: 0, distT: 0,
  sac: 0,
  cort: null, viv: null, gan: new Int32Array(NJUG + 1),
  cuadros: 0, msDib: 0, mini: null, minR: null, miniCam: null,
  _v: null, _v2: null, _v3: null, _q: null, _m: null, _ob: null,
};

const vpRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const VP_Z = [], VP_T = [], VP_C = [];
const VP_ROCA = vpRGB(C_PIEDRA), VP_TABLA = vpRGB(C_TABLA);
for (let i = 0; i <= NJUG; i++) {
  VP_Z.push(COLS[i] ? vpRGB(COLS[i].z) : VP_TABLA);
  VP_T.push(COLS[i] ? vpRGB(COLS[i].t) : VP_TABLA);
  VP_C.push(COLS[i] ? vpRGB(COLS[i].c) : VP_TABLA);
}

/* EL RADIO ES UNO Y LA CAMARA SE ACERCA: con el radio saliendo de `n`, cambiar
   de mundo movería tambien las luces, el tamano de los cubos y el plano
   cercano. Con radio fijo lo unico que cambia entre mundos es cuanto arco
   entra en la pantalla, que es exactamente lo que `DISCO` ya dice.        */
/* Un THREE.Color por jugador, hecho UNA vez. setColorAt con un Color nuevo
   por cuerpo y por cuadro son ocho objetos por cuadro para decir siempre lo
   mismo, y encima parsea la cadena hexadecimal cada vez.               */
const VP_TC = [];
const VP_R = 1;
const VP_ALTO = 0.028;          /* cuanto sobresale un cuerpo de la superficie */
const VP_ATRAS = 0.62;          /* cuanto se corre la camara HACIA ATRAS       */
const VP_DPR = [1, 1.5, 2];

/* ── EL LIENZO ────────────────────────────────────────────────────────────
   La densidad la topa la calidad y no el aparato: a dpr 3 en un marco de
   412×892 serian 3,3 millones de pixeles por cuadro.                       */
function vpMide() {
  const m = $('marco'), r = m.getBoundingClientRect();
  const d = Math.min(window.devicePixelRatio || 1, VP_DPR[cl(PROG.cal | 0, 0, 2)]);
  const W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
  if (W === V.W && H === V.H && d === V.dpr) return;
  V.W = W; V.H = H; V.dpr = d;
  V.ren.setPixelRatio(d);
  V.ren.setSize(W, H, false);
  V.cam.aspect = W / H; V.cam.updateProjectionMatrix();
  /* `sizeAttenuation:false` pide el tamano en pixeles DEL BUFER, no de CSS, asi
     que sin multiplicar por el dpr las estrellas salen a la mitad en cualquier
     telefono — que es justo donde se juega.                                 */
  if (V.est) for (const e of V.est) e.material.size = e.userData.px * d;
}

/* EL LIENZO DEL CIELO, dibujado UNA vez: un degrade vertical y tres nebulosas
   muy flojas. LAS ESTRELLAS NO ESTAN ACA, y el motivo esta medido: la camara
   abre 46 grados sobre una esfera de cielo que envuelve 180 en el alto del
   lienzo, o sea que 512 pixeles de textura se estiran sobre 892 de pantalla
   con un aumento de 6,8 — una estrella de un pixel sale como una mancha
   cuadrada de diez. Un lienzo mas grande solo corre el problema: lo que hace
   falta es que la estrella NO se agrande con la distancia, y eso es un
   `Points` con `sizeAttenuation` apagado (`vpEstrellas`).                   */
function vpCielo() {
  const w = 1024, h = 512, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0.00, '#060a16');
  gr.addColorStop(0.40, '#101c40');
  gr.addColorStop(0.66, '#1d2d5e');
  gr.addColorStop(1.00, '#090f24');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  /* las nebulosas van por debajo del 9 % de opacidad a proposito: estan para
     que el cielo no sea un plano de un solo valor, no para competirle al
     planeta — que es lo unico que hay que mirar.                            */
  for (const [nx, ny, nr, col] of [[0.22, 0.30, 0.30, '#4d6bd8'],
                                   [0.74, 0.60, 0.26, '#8a4fc9'],
                                   [0.48, 0.82, 0.22, '#2f7fb8']]) {
    const r = g.createRadialGradient(nx * w, ny * h, 0, nx * w, ny * h, nr * w);
    r.addColorStop(0, col); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 0.085; g.fillStyle = r; g.fillRect(0, 0, w, h);
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  /* un lienzo es sRGB; sin declararlo entra como lineal y el cielo sale el
     doble de claro, que es justo lo contrario de lo que tiene que hacer.    */
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* LAS ESTRELLAS SON UNA NUBE DE PUNTOS, no dibujo del lienzo, y eso arregla
   DOS cosas de una. Una: con `sizeAttenuation` apagado el tamano se pide EN
   PIXELES, asi que una estrella mide lo mismo este el cielo donde este —que es
   literalmente lo que hace una estrella—. Y dos: se reparten sobre la esfera
   con `z` uniforme, que es el reparto parejo de verdad, asi que el apelotonado
   de los polos que obligaba a estirar las elipses NO PUEDE EXISTIR.
   VAN EN DOS MALLAS Y NO EN UNA porque `PointsMaterial` tiene UN tamano para
   todos sus puntos: una nube fina y numerosa mas un punado de gordas es lo que
   hace que un cielo se lea a profundidad y no a ruido parejo. Dos ordenes de
   dibujo.
   EL COLOR VA EN ESPACIO DE TRABAJO: `vertexColors` no convierte nada, asi que
   sale de `setHex(..., sRGB)` —que si convierte— multiplicado por el brillo.
   Y con semilla fija, porque un cielo que cambia en cada partida deja de ser
   un sitio.                                                                 */
function vpEstrellas(n, brMin, col) {
  let sm = 20260911 + n;
  const az = () => (sm = (sm * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const pos = new Float32Array(n * 3), rgb = new Float32Array(n * 3);
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const z = az() * 2 - 1, a = az() * 6.2832, r = Math.sqrt(Math.max(0, 1 - z * z));
    pos[i * 3] = Math.cos(a) * r * 16; pos[i * 3 + 1] = z * 16;
    pos[i * 3 + 2] = Math.sin(a) * r * 16;
    const q = az();
    c.setHex(q > 0.90 ? 0xcfe0ff : q > 0.76 ? 0xffe7c4 : 0xffffff, THREE.SRGBColorSpace);
    const b = brMin + az() * (1 - brMin);
    rgb[i * 3] = c.r * b; rgb[i * 3 + 1] = c.g * b; rgb[i * 3 + 2] = c.b * b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(rgb, 3));
  const m = new THREE.PointsMaterial({ size: 2, sizeAttenuation: false,
    vertexColors: true, depthWrite: false });
  const p = new THREE.Points(g, m);
  p.renderOrder = -998; p.frustumCulled = false;
  p.userData.px = col;
  return p;
}

function vpInit() {
  /* EL COLOR SE CONSTRUYE CON `setHex` Y NO CON TRES FLOTANTES, y no es un
     detalle: en three r169 el constructor de tres numeros los toma en el
     espacio DE TRABAJO —o sea lineal— mientras que `setHex` los toma en sRGB
     y convierte. Metiendo bytes de sRGB como lineales y dejando que la salida
     los vuelva a codificar, todo sale lavado: el ambar del jugador pasa de
     `#f8b359` a un beige. Es el mismo defecto que el mapa de las caras.   */
  if (!VP_TC.length) for (let i = 0; i <= NJUG; i++) {
    const t = VP_T[i];
    VP_TC.push(new THREE.Color().setHex((t[0] << 16) | (t[1] << 8) | t[2], THREE.SRGBColorSpace));
  }
  V.cv = $('cv'); V.mini = $('mini');
  V.ren = new THREE.WebGLRenderer({ canvas: V.cv, antialias: false, alpha: false });
  /* NADA DE TONE MAPPING, Y ESO ES UNA DECISION. Este juego no tiene un solo
     valor por encima de uno —ni sol, ni emisivo, ni HDRI— asi que cualquier
     curva de exposicion solo puede AGACHAR los colores puros: medido, ACES
     baja el ambar del jugador un 18 % y lo acerca al resto. El espacio de
     salida si va declarado, porque es lo que convierte el lineal con el que
     three trabaja a los bytes que la pantalla espera.                     */
  V.ren.toneMapping = THREE.NoToneMapping;
  V.ren.outputColorSpace = THREE.SRGBColorSpace;
  V.ren.setClearColor(new THREE.Color().setHex(0x0d1526, THREE.SRGBColorSpace), 1);
  V.ren.autoClear = false;
  V.esc = new THREE.Scene();
  V.cam = new THREE.PerspectiveCamera(46, 1, 0.02, 24);
  /* EL PLANO LEJANO DEL MINIMAPA CORTA EN 8 Y ESO NO ES UN AHORRO: es lo que
     saca de el las estrellas y la esfera del cielo, que viven a radio 16 y 18.
     El minimapa mide setenta y cuatro pixeles y su camara abre 38 grados, o sea
     que le entran diez veces mas estrellas que a la vista de juego y a ese
     tamano eso no es un cielo, es ruido encima de lo unico que hay que leer.
     El planeta esta a 4,1 con radio 1, asi que 8 lo deja entero con margen.  */
  V.miniCam = new THREE.PerspectiveCamera(38, 1, 0.5, 8);

  /* DOS LUCES Y NINGUNA SOMBRA. Lo que hace que una esfera se lea a esfera no
     es una sombra proyectada —no hay nada que la reciba— sino el degrade de
     una direccional contra un hemisferico que NO deje el lado oscuro en
     negro: un planeta con la mitad negra se lee a agujero.

     LAS INTENSIDADES SALEN DE UNA CUENTA Y NO DE PROBAR. Desde r155 three no
     escala las luces por pi y el difuso de Lambert es `albedo/pi`, asi que el
     multiplicador que le llega a un color es `(hemi + dir·cos)/pi`. Con 1,55 y
     1,25 eso daba **0,891 en la cara iluminada**: o sea que el ambar #f8b359
     salia al 89 % de lo que es, los ocho colores se acercaban entre si y el
     cuadro entero se leia lavado. Con 2,05 y 1,15 la cara al sol llega a
     **1,019**, o sea el color puro, y ni un pelo mas: por encima de uno se
     recorta, y recortar un color saturado le corre el TONO.

     Y EL SUELO DEL HEMISFERICO SE ACLARA de `0x2a3350` a `0x46578f` por la
     misma cuenta: la cara de sombra recibe `hemi_suelo/pi`, y con el azul
     viejo eso eran 0,10 de luz —o sea el agujero que este comentario dice que
     hay que evitar—. Con el nuevo son 0,21 y el lado oscuro queda TENIDO de
     azul en vez de apagado, que es lo que hace una atmosfera de verdad.    */
  const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x46578f, 2.05);
  V.esc.add(hemi);
  /* EL SOL CUELGA DE LA CAMARA Y NO DEL MUNDO, y esto NO es una licencia: es
     lo unico que puede funcionar en un juego que recorre un planeta ENTERO.
     Con la direccional fija en el mundo, media esfera es el lado oscuro —y
     medido en la arena, el tablero sin dueno llegaba a la pantalla como un
     azul apagado en vez del gris claro que es—. En un juego cuya UNICA regla
     es «del mismo color», que el mismo color se lea distinto segun por donde
     uno ande es el peor defecto posible: mas grave que perder el degrade.
     Lo que se conserva es el degrade, que es lo que hace que una esfera se
     lea a esfera: el sol va CORRIDO del eje de la vista —0,30 hacia arriba y
     0,24 a la izquierda— asi que el centro del cuadro recibe 0,937 del maximo
     y el limbo se va apagando solo. O sea una luz de estudio atada al tripode,
     que es lo que hace cualquier visor de modelos.
     Medido: el centro llega a `(2,05 + 1,15·0,937)/pi = 0,996` del color, o
     sea el color puro sin recortar, y ese numero ya NO depende de donde este
     parado el jugador.                                                     */
  const sol = new THREE.DirectionalLight(0xfff4e2, 1.15);
  sol.position.set(0.85, 1.1, 0.7);
  V.esc.add(sol);
  V.sol = sol;

  /* el halo: una esfera apenas mas grande dibujada por dentro. Cuesta una
     orden de dibujo y es lo que despega el planeta del fondo.              */
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(VP_R * 1.10, 40, 24),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setHex(0x5f8ff5, THREE.SRGBColorSpace), side: THREE.BackSide,
      transparent: true, opacity: 0.42, depthWrite: false }));
  V.esc.add(halo);

  /* EL CIELO ES UNA ESFERA DE VERDAD Y NO EL COLOR DE FONDO, y la razon es que
     un color plano no tiene nada que mirar: medido en la captura, el cuarto de
     arriba del cuadro era una banda de azul marino lisa de punta a punta. Y un
     cielo con estrellas ancladas AL MUNDO hace ademas que recorrer el planeta
     se vea: la camara orbita, asi que las estrellas se corren por detras, y
     eso —aparte del limbo— es lo unico que dice que uno esta viajando.

     VA COMO ESFERA Y NO COMO `scene.background` porque este juego dibuja con
     `autoClear = false` y dos pasadas con tijera propias: una esfera con
     `depthWrite:false` y `renderOrder` negativo se dibuja primero pase lo que
     pase, sin depender de como three decida tratar el fondo con el borrado
     manual. Cuesta UNA orden de dibujo y sale en las dos pasadas, o sea que el
     minimapa tambien tiene cielo. Radio 18: la camara nunca pasa de 4,1 y el
     plano lejano esta en 24, asi que la esfera entra entera por construccion. */
  const cielo = new THREE.Mesh(
    new THREE.SphereGeometry(18, 32, 20),
    new THREE.MeshBasicMaterial({ map: vpCielo(), side: THREE.BackSide, depthWrite: false }));
  cielo.renderOrder = -999;
  V.esc.add(cielo);
  /* LA CUENTA SALE DE UNA CUENTA Y NO DE UN NUMERO LINDO: el cono de la camara
     abre 46 grados de alto por 22 de ancho, o sea `4·asin(sin11,1·sin23)` =
     0,30 estereorradianes sobre los 12,57 de la esfera — el 2,4 % —, y de eso
     el planeta se come casi dos tercios: en pantalla cae el 0,84 % de la nube.
     Con las 640 que tenia el lienzo llegaban TRES, medido en la captura. Con
     5.400 llegan unas cuarenta y cinco, que es un cielo.                     */
  V.est = [vpEstrellas(5400, 0.16, 1.7), vpEstrellas(480, 0.55, 3.2)];
  for (const e of V.est) V.esc.add(e);

  V.cpos = new THREE.Vector3(0, 0, 3); V.cmira = new THREE.Vector3();
  V.carr = new THREE.Vector3(0, 1, 0);
  V._v = new THREE.Vector3(); V._v2 = new THREE.Vector3(); V._v3 = new THREE.Vector3();
  V._q = new THREE.Quaternion(); V._m = new THREE.Matrix4();
  V._ob = new THREE.Object3D();

  vpCuerpos();
  vpMide();
  addEventListener('resize', vpMide);
}

/* ── LOS CUERPOS ──────────────────────────────────────────────────────────
   Ocho cubos en UNA malla instanciada: sueltos serian ocho ordenes de dibujo
   para ocho cajas, y con `instanceColor` cada uno conserva su color sin un
   material propio.                                                         */
function vpCuerpos() {
  const g = new THREE.BoxGeometry(0.034, 0.034, 0.034);
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  V.cuer = new THREE.InstancedMesh(g, m, NJUG);
  V.cuer.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  V.cuer.frustumCulled = false;
  V.cuer.count = 0;
  V.esc.add(V.cuer);

  /* las esquirlas: un solo `Points`, con el buffer al maximo y el tope de
     dibujo moviendose. Crear geometria por muerte seria alojar y soltar en
     el peor cuadro posible.                                                */
  V.esqG = new THREE.BufferGeometry();
  V.esqG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3 * 160), 3));
  V.esqG.setAttribute('color', new THREE.BufferAttribute(new Float32Array(3 * 160), 3));
  V.esqG.setDrawRange(0, 0);
  V.esq = new THREE.Points(V.esqG, new THREE.PointsMaterial({
    size: 0.045, vertexColors: true, transparent: true, opacity: 0.92, depthWrite: false }));
  V.esq.frustumCulled = false;
  V.esc.add(V.esq);
}

/* ── EL PLANETA ───────────────────────────────────────────────────────────
   Una malla por cara, con sus (n+1)² vertices puestos EXACTAMENTE donde
   `posCel` pone los centros de celda: `normalize(C + u·ex + v·ey)`. La UV va
   en `(vx/n, vy/n)`, asi la celda (x,y) cae en el texel (x+0.5, y+0.5)/n de
   una textura de n×n — que es por lo que NEAREST no puede desalinearse.    */
function vpPlaneta(n) {
  for (const c of V.caras) { V.esc.remove(c); c.geometry.dispose(); c.material.dispose(); }
  for (const t of V.tex) t.dispose();
  V.caras = []; V.tex = []; V.buf = []; V.suc = [];
  const L = n + 1;
  for (let f = 0; f < 6; f++) {
    const C = CARAS[f].C, ex = CARAS[f].ex, ey = CARAS[f].ey;
    const pos = new Float32Array(L * L * 3), uv = new Float32Array(L * L * 2);
    for (let vy = 0; vy < L; vy++) for (let vx = 0; vx < L; vx++) {
      const u = vx / n * 2 - 1, v = vy / n * 2 - 1, o = (vy * L + vx);
      let X = C[0] + u * ex[0] + v * ey[0];
      let Y = C[1] + u * ex[1] + v * ey[1];
      let Z = C[2] + u * ex[2] + v * ey[2];
      const r = VP_R / Math.hypot(X, Y, Z);
      pos[o * 3] = X * r; pos[o * 3 + 1] = Y * r; pos[o * 3 + 2] = Z * r;
      uv[o * 2] = vx / n; uv[o * 2 + 1] = vy / n;
    }
    const idx = new Uint32Array(n * n * 6);
    for (let y = 0, k = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const a = y * L + x, b = a + 1, c = b + L, d = a + L;
      idx[k++] = a; idx[k++] = b; idx[k++] = c;
      idx[k++] = a; idx[k++] = c; idx[k++] = d;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    /* la normal de una esfera ES la posicion: calcularla promediando caras
       daria lo mismo con un barrido de mas.                                */
    geo.setAttribute('normal', new THREE.BufferAttribute(pos.slice(), 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    const buf = new Uint8Array(n * n * 4);
    const tex = new THREE.DataTexture(buf, n, n, THREE.RGBAFormat);
    /* UNA `DataTexture` NACE EN `NoColorSpace`, o sea lineal, y esto es un
       mapa de COLOR: sin declararlo, los bytes de sRGB entran como si fueran
       lineales, la salida los vuelve a codificar y el planeta entero sale
       lavado. Es la causa de que los ocho colores se parecieran entre si. */
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false; tex.needsUpdate = true;
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex }));
    mesh.frustumCulled = false;
    V.esc.add(mesh);
    V.caras.push(mesh); V.tex.push(tex); V.buf.push(buf); V.suc.push(true);
  }
}

/* el color de una celda, con el damero y el destello del cercado adentro: un
   solo sitio decide de que color es una celda, asi el mapa chico y el planeta
   no pueden decir cosas distintas.                                         */
function vpPinta(M, i) {
  const n = M.n, f = (i / (n * n)) | 0, r = i - f * n * n;
  const x = r % n, y = (r / n) | 0;
  const t = M.t[i], z = M.z[i];
  let c;
  if (t) c = VP_T[t];
  else if (z === PIEDRA) c = VP_ROCA;
  else if (z > 0) c = VP_Z[z];
  else c = VP_TABLA;
  /* EL DAMERO ES LA REJA. Con una celda de 1 texel no hay linea que dibujar,
     asi que la cuadricula se hace moviendo el valor un 6 % de a una celda:
     se sigue pudiendo contar de una ojeada y no cuesta un solo triangulo. */
  const k = ((x + y + f) & 1) ? 1.055 : 0.945;
  let R = c[0] * k, G = c[1] * k, B = c[2] * k;
  const fl = V.fl[i];
  if (fl > 0) {
    const d = z > 0 && z < PIEDRA ? VP_C[z] : VP_C[1];
    R += (d[0] - R) * fl; G += (d[1] - G) * fl; B += (d[2] - B) * fl;
  }
  const b = V.buf[f], o = (y * n + x) * 4;
  b[o] = R > 255 ? 255 : R; b[o + 1] = G > 255 ? 255 : G;
  b[o + 2] = B > 255 ? 255 : B; b[o + 3] = 255;
  V.suc[f] = true;
}

function vpNuevo(M) {
  const n = M.n;
  if (V.n !== n) { V.n = n; vpPlaneta(n); }
  V.N = M.N;
  V.pz = new Uint8Array(M.N); V.pt = new Uint8Array(M.N);
  V.fl = new Float32Array(M.N); V.flAct = [];
  V.pz.set(M.z); V.pt.set(M.t);
  for (let i = 0; i < M.N; i++) vpPinta(M, i);
  V.cort = new Int32Array(NJUG + 1);
  V.viv = new Uint8Array(NJUG + 1);
  for (const p of M.jug) { V.cort[p.id] = p.cortes; V.viv[p.id] = 1; }
  V.esqP.length = 0; V.sac = 0;
  V.distT = V.dist = vpDist(M);
  /* la camara se PLANTA en el sitio de arranque en vez de viajar hasta el:
     con el suavizado corriendo desde el cuadro anterior, el primer segundo de
     cada nivel seria la camara cruzando el planeta.                        */
  vpCam(M, 1e3);
}

/* ── LO QUE CAMBIO ────────────────────────────────────────────────────────
   Un barrido del planeta por tic contra la copia anterior. Escribe la textura
   de las celdas que cambiaron, enciende el destello del cercado y dispara las
   esquirlas: los tres salen de UN solo sitio en vez de tres avisos que
   alguien tiene que acordarse de mandar.                                   */
function vpTras(M) {
  const z = M.z, t = M.t, pz = V.pz, pt = V.pt;
  V.gan.fill(0);
  for (let i = 0; i < V.N; i++) {
    if (z[i] === pz[i] && t[i] === pt[i]) continue;
    if (z[i] !== pz[i] && z[i] > 0 && z[i] < PIEDRA) {
      V.gan[z[i]]++;
      /* el destello vive en la celda y se apaga solo: una lista de cercos con
         su reloj seria un segundo estado que se puede desincronizar del
         tablero, y el tablero ya sabe de quien es cada celda.              */
      if (V.fl[i] <= 0) V.flAct.push(i);
      V.fl[i] = 1;
    }
    pz[i] = z[i]; pt[i] = t[i];
    vpPinta(M, i);
  }
  for (const p of M.jug) {
    if (p.cortes !== V.cort[p.id]) {
      V.cort[p.id] = p.cortes;
      vpEsquirlas(M, p.i, p.id);
      if (p.id === 1) V.sac = 1;
    }
    V.viv[p.id] = p.vivo ? 1 : 0;
  }
  return V.gan;
}

function vpEsquirlas(M, i, id) {
  const ct = VP_T[id] || VP_T[1], cc = VP_C[id] || VP_C[1];
  const P = M.POS, nx = P[i * 3], ny = P[i * 3 + 1], nz = P[i * 3 + 2];
  for (let k = 0; k < 14; k++) {
    const a = Math.random() * Math.PI * 2, s = Math.sin(a), co = Math.cos(a);
    /* dos tangentes cualesquiera de la normal: la esquirla sale POR LA
       SUPERFICIE y no en una direccion del mundo, que en una esfera saldria
       para adentro la mitad de las veces.                                  */
    let tx, ty, tz;
    if (Math.abs(nz) < 0.9) { tx = -ny; ty = nx; tz = 0; } else { tx = 0; ty = -nz; tz = ny; }
    const tl = Math.hypot(tx, ty, tz); tx /= tl; ty /= tl; tz /= tl;
    const ux = ny * tz - nz * ty, uy = nz * tx - nx * tz, uz = nx * ty - ny * tx;
    const v = 0.22 + Math.random() * 0.42;
    const cr = (k & 1) ? ct : cc;
    V.esqP.push({
      x: nx * VP_R, y: ny * VP_R, z: nz * VP_R,
      vx: (tx * co + ux * s) * v + nx * 0.30,
      vy: (ty * co + uy * s) * v + ny * 0.30,
      vz: (tz * co + uz * s) * v + nz * 0.30,
      r: cr[0] / 255, g: cr[1] / 255, b: cr[2] / 255,
      t: 0, vida: 0.42 + Math.random() * 0.3,
    });
  }
  if (V.esqP.length > 160) V.esqP.splice(0, V.esqP.length - 160);
}

/* ── LA CAMARA ────────────────────────────────────────────────────────────
   Va SOBRE LA NORMAL DEL JUGADOR, corrida hacia atras en el sentido del
   viaje. Con la camara en un punto fijo del mundo, al dar la vuelta al
   planeta el jugador terminaria mirandose la espalda desde el otro lado; con
   la camara colgada de su normal, el planeta es lo que gira — que es
   literalmente lo que se pidio.
   Y EL ARRIBA ES LA TANGENTE DEL VIAJE: sin eso, cruzar el borde de una cara
   da vuelta la pantalla de golpe, porque los ejes de las dos caras no son los
   mismos.                                                                  */
function vpDist(M) {
  /* LA DISTANCIA SALE DE CUANTO PLANETA SE QUIERE VER, y es una cuenta cerrada
     y no una estimacion. Una esfera de radio 1 a distancia `d` subtiende
     `asin(1/d)`, que proyectado sobre el plano de imagen mide `tan(asin(1/d))`
     medios cuadros de alto sobre `tan(fov/2)`. Pidiendo que el DIAMETRO sea
     `k` veces el alto del cuadro:
          tan(asin(1/d)) = k·tan(fov/2) = s   →   d = √(1+s²)/s
     LA VERSION ANTERIOR TRATABA EL ARCO COMO SI FUERA UNA CUERDA PLANA y lo
     topaba en 2,4 rad, que son 137 grados: mas de un hemisferio, o sea un
     encuadre que ninguna camara puede tener. Medido, dejaba el planeta a
     cuatro radios con un tercio del cuadro en cielo vacio.                 */
  const k = M.arena
    ? DISCO + (DISCO_MIN - DISCO) * Math.min(1, Math.sqrt(tajada(M, M.jug[0].id) / DISCO_SAT))
    : DISCO;
  const s = k * Math.tan(V.cam.fov * Math.PI / 360);
  /* el piso es geometrico y no de gusto: por debajo de un radio la camara
     estaria DENTRO del planeta, y `s` grande la lleva justo ahi.           */
  return Math.max(VP_R * 1.25, VP_R * Math.sqrt(1 + s * s) / s);
}

function vpPos(M, p, v) {
  const P = M.POS, i = p.i, j = M.NB[i * 4 + p.d], f = M.f;
  v.set(P[i * 3] + (P[j * 3] - P[i * 3]) * f,
        P[i * 3 + 1] + (P[j * 3 + 1] - P[i * 3 + 1]) * f,
        P[i * 3 + 2] + (P[j * 3 + 2] - P[i * 3 + 2]) * f).normalize();
  return v;
}

function vpCam(M, dt) {
  const p = M.jug[0];
  const nrm = vpPos(M, p, V._v);                       /* donde esta        */
  const j = M.NB[p.i * 4 + p.d];
  const ade = V._v2.set(M.POS[j * 3], M.POS[j * 3 + 1], M.POS[j * 3 + 2])
    .normalize().sub(nrm);
  ade.addScaledVector(nrm, -ade.dot(nrm));             /* tangente del viaje */
  if (ade.lengthSq() < 1e-9) ade.set(0, 0, 1).addScaledVector(nrm, -nrm.z);
  ade.normalize();

  V.distT = vpDist(M);
  V.dist += (V.distT - V.dist) * (1 - Math.exp(-dt * 1.2));

  const tp = V._v3.copy(nrm).addScaledVector(ade, -VP_ATRAS).normalize()
    .multiplyScalar(V.dist);
  const a = 1 - Math.exp(-dt * 9);
  V.cpos.lerp(tp, a);
  V.cmira.lerp(V._v3.copy(nrm).multiplyScalar(VP_R * 0.86).addScaledVector(ade, VP_R * 0.10), a);
  V.carr.lerp(ade, a).normalize();

  if (V.sac > 0) {
    V.sac = Math.max(0, V.sac - dt * 3.4);
    const s = V.sac * V.sac * 0.045;
    V.cpos.x += (Math.random() * 2 - 1) * s;
    V.cpos.y += (Math.random() * 2 - 1) * s;
  }
  V.cam.position.copy(V.cpos);
  V.cam.up.copy(V.carr);
  V.cam.lookAt(V.cmira);

  /* el sol se recoloca con la camara: `oj` es el eje de la vista, `carr` el
     arriba de pantalla y su producto cruzado la derecha. Una direccional de
     three apunta de su posicion al origen, y el origen ES el planeta, asi que
     alcanza con ponerla sobre esa direccion.                               */
  if (V.sol) {
    const oj = V._v.copy(V.cpos).normalize();
    const de = V._v2.crossVectors(V.carr, oj).normalize();
    V.sol.position.copy(oj).addScaledVector(V.carr, 0.30)
      .addScaledVector(de, -0.24).normalize().multiplyScalar(8);
  }
}

/* ══════════════════════════ EL CUADRO ══════════════════════════ */
function vpDibuja(M, dt) {
  const t0 = performance.now();

  /* el destello del cercado: solo las celdas encendidas, no el planeta. */
  if (V.flAct.length) {
    const q = [];
    for (const i of V.flAct) {
      V.fl[i] -= dt * 2.4;
      if (V.fl[i] > 0) q.push(i); else V.fl[i] = 0;
      vpPinta(M, i);
    }
    V.flAct = q;
  }
  for (let f = 0; f < 6; f++) if (V.suc[f]) { V.tex[f].needsUpdate = true; V.suc[f] = false; }

  /* los cuerpos */
  let c = 0;
  for (const p of M.jug) {
    if (!p.vivo) continue;
    const nrm = vpPos(M, p, V._v);
    V._ob.position.copy(nrm).multiplyScalar(VP_R + VP_ALTO);
    V._ob.quaternion.setFromUnitVectors(V._v2.set(0, 1, 0), nrm);
    V._ob.updateMatrix();
    V.cuer.setMatrixAt(c, V._ob.matrix);
    V.cuer.setColorAt(c, VP_TC[p.id] || VP_TC[1]);
    c++;
  }
  V.cuer.count = c;
  V.cuer.instanceMatrix.needsUpdate = true;
  if (V.cuer.instanceColor) V.cuer.instanceColor.needsUpdate = true;

  /* las esquirlas */
  const ap = V.esqG.attributes.position.array, ac = V.esqG.attributes.color.array;
  let k = 0;
  for (let i = 0; i < V.esqP.length; i++) {
    const s = V.esqP[i];
    s.t += dt;
    if (s.t >= s.vida) continue;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    s.vx *= 0.96; s.vy *= 0.96; s.vz *= 0.96;
    ap[k * 3] = s.x; ap[k * 3 + 1] = s.y; ap[k * 3 + 2] = s.z;
    ac[k * 3] = s.r; ac[k * 3 + 1] = s.g; ac[k * 3 + 2] = s.b;
    V.esqP[k++] = s;
  }
  V.esqP.length = k;
  V.esqG.setDrawRange(0, k);
  V.esqG.attributes.position.needsUpdate = true;
  V.esqG.attributes.color.needsUpdate = true;

  const ren = V.ren;
  ren.setScissorTest(false);
  ren.setViewport(0, 0, V.W, V.H);
  ren.clear();
  ren.render(V.esc, V.cam);
  vpMiniPinta(M);

  V.msDib = performance.now() - t0;
  V.cuadros++;
}

/* ── EL MAPA CHICO ────────────────────────────────────────────────────────
   UNA SEGUNDA PASADA EN EL MISMO LIENZO y no un segundo contexto: el planeta,
   sus texturas y sus luces ya estan subidos a la GPU, y un `<canvas>` aparte
   obligaria a mantener una copia entera del tablero del otro lado. El
   `<canvas id="mini">` se queda vacio y sirve de MEDIDA: la sonda de HUD
   sigue teniendo una caja que medir y el mapa se dibuja exactamente ahi.   */
function vpMiniPinta(M) {
  const el = V.mini;
  if (!el || el.classList.contains('off')) return;
  const rm = $('marco').getBoundingClientRect(), r = el.getBoundingClientRect();
  const w = Math.max(8, Math.round(r.width)), h = Math.max(8, Math.round(r.height));
  const x = Math.round(r.left - rm.left), y = Math.round(rm.bottom - r.bottom);
  const p = M.jug[0];
  const nrm = vpPos(M, p, V._v);
  V.miniCam.aspect = w / h; V.miniCam.updateProjectionMatrix();
  V.miniCam.position.copy(nrm).multiplyScalar(VP_R * 4.1);
  V.miniCam.up.copy(V.carr);
  V.miniCam.lookAt(0, 0, 0);
  const ren = V.ren;
  ren.setScissorTest(true);
  ren.setScissor(x, y, w, h);
  ren.setViewport(x, y, w, h);
  ren.clear();
  ren.render(V.esc, V.miniCam);
  ren.setScissorTest(false);
}
/* ══════════════════════════════════════════════════════════════════════════
   f.js · LA PARTIDA: el dedo, las vidas, el reloj y el marcador
   ──────────────────────────────────────────────────────────────────────────
   EL DEDO NO ES UN JOYSTICK, ES UN GESTO. Un joystick fijo en una esquina se
   pelea con el tablero —que ocupa la pantalla entera— y encima obliga a
   mirarlo. Aca se arrastra donde uno quiera: lo que se lee es el
   DESPLAZAMIENTO desde el ultimo cambio de rumbo, y cuando pasa la zona
   muerta se dobla y el ancla se muda al dedo. O sea: una pasada de dedo es
   UNA vuelta, y encadenar vueltas es seguir arrastrando.

   Y LO QUE SE ESCRIBE ES `p.ped`, que es EL MISMO campo que usan los bots y
   el auto-jugador. Si el dedo escribiera el rumbo directo, el jugador podria
   doblar a mitad de celda y los bots no: dos fisicas distintas en el mismo
   tablero, y la auditoria estaria aprobando un juego que nadie juega.

   EL BUFFER DE UNA VUELTA es la unica pieza que no esta en el modelo. A 5,4
   celdas por segundo un tic dura 185 ms: dos toques mas rapidos que eso
   —bajar y doblar en la misma pasada— pisarian el primero. Se guarda UNA
   sola vuelta pendiente y se suelta en cuanto `tic` consumio la anterior.
   Con mas de una el cuerpo dejaria de responder a lo ultimo que se pidio.
   ══════════════════════════════════════════════════════════════════════ */

const P = {
  on: false, pausa: false, fin: null, tuto: false, arena: false,
  m: 0, nv: 0, cfg: null, M: null, yo: null,
  seg: 0, cortesVistos: 0, pct: 0, mejor: 0, casi: false, ganUlt: 0,
  giros: 0, gd: 0,
  /* EL PUESTO Y LA TAJADA SE FOTOGRAFIAN EN EL ULTIMO TIC CON VIDA. En la
     arena morir BORRA el terreno, asi que preguntando DESPUES del corte el
     panel de fin diria «8º con 0 %» siempre —es exactamente lo que el banco
     informo la primera vez, y no era el juego: era la medicion—.           */
  posUlt: 8, pctUlt: 0, primero: false, tab: null,
  hCor: [], hPct: '', hMeta: '', hRel: '', hPoco: false, hNiv: '', hTab: '',
};

/* ══════════════════════ EL DEDO ══════════════════════ */
const ENT = { id: null, ax: 0, ay: 0, cola: null };
/* 30 px y no 15: con re-anclaje, un barrido de 60 px son DOS vueltas. En el
   plano dos vueltas seguidas eran medio cuadrado; en la esfera siguen
   siendolo, pero un flick de dedo no tiene que pedir dos.                 */
const ENT_MIN = 30;

/* EL GIRO ES RELATIVO Y NO ABSOLUTO, y no es una preferencia: en una esfera
   «arriba» no existe. Lo unico que el cuerpo sabe es hacia donde va, asi que
   lo unico que se le puede pedir es izquierda o derecha — que ademas es el
   control de Paper.io 3D. Y sale gratis una propiedad que el plano no tenia:
   UNA VUELTA DE 90 GRADOS NUNCA PUEDE SER MEDIA VUELTA, o sea que el control
   no se puede suicidar solo.
   `p.ped` es un INDICE DE DIRECCION ABSOLUTO (0-3), asi que el giro se
   resuelve aca con GIRO_CW/GIRO_CCW y el modelo no se entera de nada.     */
function entPide(giro) {                      /* +1 derecha · -1 izquierda  */
  const p = P.yo;
  if (!p || !P.on || P.pausa || P.fin) return false;
  const base = p.ped != null ? p.ped : p.d;   /* se gira sobre lo ya pedido  */
  const d = (giro > 0 ? GIRO_CW : GIRO_CCW)[base];
  if (d === p.d) return false;                /* no cambia nada             */
  if (p.ped != null) {
    if (p.ped === d) return false;
    ENT.cola = d;
    return true;
  }
  p.ped = d;
  return true;
}
/* corre DESPUES de `paso`: ahi `tic` ya vacio `ped` y el pendiente puede
   entrar sin pisar nada. */
function entSuelta() {
  const p = P.yo;
  if (!p || ENT.cola == null) return;
  if (p.ped != null) return;
  if (ENT.cola !== p.d && ENT.cola !== OPUE[p.d]) p.ped = ENT.cola;
  ENT.cola = null;
}

function entBaja(e) {
  if (!P.on || P.pausa || P.fin) return;
  if (ENT.id !== null) return;
  ENT.id = e.pointerId; ENT.ax = e.clientX; ENT.ay = e.clientY;
  try { e.target.setPointerCapture(e.pointerId); } catch (x) {}
}
function entMueve(e) {
  if (ENT.id !== e.pointerId) return;
  /* SOLO EL EJE HORIZONTAL. Arrastrar hacia arriba es pedir «seguir
     derecho», que es lo que el cuerpo ya hace; hacia abajo seria media
     vuelta, que mata. Ninguno de los dos tiene nada que pedir, asi que la
     histeresis entre ejes del plano sobra: aca hay un solo eje.           */
  const dx = e.clientX - ENT.ax;
  if (Math.abs(dx) < ENT_MIN) return;
  entPide(dx > 0 ? 1 : -1);
  /* el ancla se muda haya doblado o no: si no, un arrastre largo deja el
     desplazamiento saturado y la vuelta siguiente sale con un pixel.      */
  ENT.ax = e.clientX; ENT.ay = e.clientY;
}
function entSube(e) {
  if (ENT.id !== e.pointerId) return;
  ENT.id = null;
}
const ENT_TEC = {
  ArrowRight: 1, ArrowLeft: -1, KeyD: 1, KeyA: -1,
};
function entTecla(e) {
  const g = ENT_TEC[e.code];
  if (g) { entPide(g); e.preventDefault(); return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (P.on && !P.fin) pausaPon(!P.pausa); }
}
function entInit() {
  const c = $('cv');
  c.addEventListener('pointerdown', entBaja);
  c.addEventListener('pointermove', entMueve);
  c.addEventListener('pointerup', entSube);
  c.addEventListener('pointercancel', entSube);
  addEventListener('keydown', entTecla);
}

/* ══════════════════════ LA PARTIDA ══════════════════════ */
function partidaArranca(m, nv, tuto, arena) {
  P.m = m; P.nv = nv; P.tuto = !!tuto; P.arena = !!arena;
  /* entrar a un nivel de verdad apaga el tutorial, y va ACA porque esta es la
     unica puerta por la que se entra a una partida —`juega`, el boton de
     siguiente, la sonda—. En `juega` sola, la proxima puerta que se agregue
     entra con la pista del tutorial puesta encima del nivel 1-1.           */
  if (!P.tuto) { TUT.on = false; cl2($('tSalt'), 'on', false); cl2($('pista'), 'on', false); }
  P.cfg = P.arena ? cfgArena() : (tuto ? tutCfg() : cfgNivel(m, nv));
  P.M = generaMapa(P.cfg);
  P.yo = P.M.jug[0];
  /* el tope de cortes es lo que hace que la tercera vida sea la ultima: sin
     el, `paso` revive para siempre y las vidas serian un numero que baja.
     EN LA ARENA ES UNA, y es la mitad de por que la arena es otro juego: el
     corte no cuesta terreno, cuesta la corrida entera.                     */
  P.yo.topeCortes = P.tuto ? 1e9 : (P.arena ? 1 : VIDAS);
  P.seg = P.cfg.seg;
  P.on = true; P.pausa = false; P.fin = null;
  P.cortesVistos = 0; P.pct = 0; P.mejor = 0; P.casi = false; P.ganUlt = 0;
  P.giros = 0; P.gd = P.yo.d;
  P.posUlt = 1 + P.cfg.riv; P.pctUlt = 0; P.primero = false; P.tab = null;
  P.hCor = []; P.hPct = ''; P.hMeta = ''; P.hRel = ''; P.hPoco = false;
  P.hNiv = ''; P.hTab = '';
  vpNuevo(P.M);
  hudArma();
  hudPinta(true);
  cl2($('velo'), 'off', false);
  cl2($('hud'), 'off', false);
  cl2($('pie'), 'off', P.tuto);
  cl2($('mini'), 'off', P.tuto);
  cl2($('tabla'), 'off', !P.arena);
  auAbre(0);
  return P.M;
}

function partidaPaso(dt) {
  if (!P.on || P.pausa || P.fin) return;
  const M = P.M, yo = P.yo;
  paso(M, dt);
  entSuelta();
  const gan = vpTras(M);
  P.ganUlt = gan[1];

  /* LAS VUELTAS SE CUENTAN POR EL RUMBO QUE EL CUERPO TOMO, no por los toques
     que se pidieron: un pedido puede quedar en la cola y no salir nunca, y el
     tutorial estaria dando por hecho un gesto que no ocurrio.              */
  if (yo.d !== P.gd) { P.giros++; P.gd = yo.d; }

  /* ── lo que gano este cuadro ── */
  if (gan[1] > 0) {
    son('tierra', gan[1]);
    if (gan[1] >= 90) avisa(TX('avTierra'));
  }
  /* ── los cortes ── */
  if (yo.cortes !== P.cortesVistos) {
    P.cortesVistos = yo.cortes;
    son('corte');
    hudPinta(true);
    /* EN LA ARENA EL PRIMER CORTE CIERRA, y se corta ACA y no mas abajo: el
       `return` tiene que ganarle a la lectura de la tajada, porque el terreno
       ya se libero y leerlo despues del corte devuelve cero.               */
    /* Y SIN AVISO: «SIN VIDAS» mentiria, porque en la arena no hay vidas que
       gastar —hay una y es la corrida—. Que el cartel no quede debajo del
       panel lo resuelve `avisaCorta`, que corre desde `termina`.            */
    if (P.arena) { termina('arena'); return; }
    if (!P.tuto && yo.cortes >= VIDAS) { avisa(TX('avSinVidas')); termina('vidas'); return; }
    avisa(TX('avCorte'));
  }

  P.pct = tajada(M, 1);
  if (P.pct > P.mejor) P.mejor = P.pct;
  auAbre(P.cfg.meta > 0 ? P.pct / P.cfg.meta : 0);

  if (P.arena) {
    /* la foto del ultimo tic con vida: el puesto y la tajada que el panel de
       fin va a mostrar. Ver el comentario de `P.posUlt`.                   */
    const tb = tablaPos(M);
    P.tab = tb;                       /* `hudArena` la reusa: recontar dos veces por cuadro es
                                         barrer el tablero entero de gusto.                    */
    P.pctUlt = P.pct;
    P.posUlt = tb.findIndex((f) => f.id === 1) + 1;
    /* EL RELOJ SUBE EN VEZ DE BAJAR: acá no hay plazo, así que lo único que
       un número de tiempo puede decir es cuánto aguantaste — que es
       literalmente el marcador de este modo.                               */
    P.seg += dt;
    /* IR PRIMERO SE AVISA UNA SOLA VEZ. Con el aviso cada vez que se cruza el
       puesto, en una pelea pareja el cartel parpadea varias veces por segundo
       y deja de querer decir algo.                                         */
    /* Y PIDE VENTAJA DE VERDAD, no ganar el desempate. `tablaPos` desempata
       por id y el jugador es el 1, asi que en el primer cuadro —con los ocho
       en 0,3 %— el cartel salia SIEMPRE: un «vas primero» que aparece antes
       de haber hecho nada no dice nada. Con medio cuerpo de ventaja sobre el
       segundo, el cartel vuelve a significar algo.                          */
    const vent = P.posUlt === 1 ? tb[0].pct - tb[1].pct : 0;
    if (!P.primero && vent > ARENA_VENT) { P.primero = true; son('casi'); avisa(TX('avPrimero')); }
    else if (P.primero && P.posUlt > 2) P.primero = false;
    hudPinta(false);
    return;
  }

  if (!P.tuto) {
    if (!P.casi && P.pct >= P.cfg.meta * 0.82 && P.pct < P.cfg.meta) {
      P.casi = true; son('casi'); avisa(TX('avCasi'));
    }
    if (P.pct >= P.cfg.meta) { termina('gana'); return; }
    P.seg -= dt;
    if (P.seg <= 0) { P.seg = 0; termina('tiempo'); return; }
  }
  hudPinta(false);
}

function termina(fin) {
  P.fin = fin;
  avisaCorta();
  const perf = fin === 'gana' && P.yo.cortes === 0;
  if (fin === 'gana') {
    son(perf ? 'perf' : 'gana');
    if (!P.tuto) anota(P.m, P.nv, perf);
  } else son('pierde');
  /* LA FANFARRIA PIDE SILENCIO Y SE LEVANTA SOLA. La cama es un pad sostenido
     y el remate dura dos segundos: sin agachar, las dos suenan a la vez y no se
     escucha ninguna. Va con duracion —a diferencia de la de la pausa, que dura
     lo que dure la pausa y la levanta quien despausa—.                       */
  auAgacha(0.25, 2.2);
  hudPinta(true);
  if (P.tuto) { tutFin(); return; }
  if (P.arena) {
    /* EL RECORD ES EL PICO Y NO LA TAJADA DEL FINAL, y es la unica lectura
       honesta: al morir el terreno se libera, asi que la del final es cero
       por construccion. Lo que uno recuerda de una corrida es cuanto llego a
       tener, no cuanto le quedaba en el ultimo cuadro.                     */
    const rec = P.mejor > (PROG.rec || 0);
    if (rec) PROG.rec = P.mejor;
    if (P.yo.matas > (PROG.recB || 0)) PROG.recB = P.yo.matas;
    guardaProg();
    finPon({ tuto: false, arena: true, pos: P.posUlt, pct: P.mejor,
             matas: P.yo.matas, seg: P.seg, rec, recAnt: PROG.rec });
    verPanel('pFin');
    return;
  }
  finPon({ tuto: false, fin, perf, pct: P.pct, meta: P.cfg.meta, cortes: P.yo.cortes, m: P.m, nv: P.nv });
  verPanel('pFin');
}

function pausaPon(v) {
  if (!P.on || P.fin) return;
  P.pausa = !!v;
  if (P.pausa) { son('ui'); auAgacha(0.22); verPanel('pPausa'); }
  else { auAgacha(1); verPanel(null); }
}

function partidaSale() {
  P.on = false; P.pausa = false; P.fin = null;
  /* Y EL TUTORIAL SE APAGA ACA, no en quien lo cierra. Hay TRES caminos que
     sacan al jugador de una partida —terminarla, saltearla y la PAUSA, que
     durante el tutorial tambien tiene su SALIR— y con la bandera apagada solo
     en los dos primeros, salir desde la pausa dejaba `TUT.on` prendido: medido,
     el nivel 1-1 arrancaba con `tutOn: true` y la pista del tutorial puesta
     encima. Apagarlo en el unico sitio por el que pasan los tres es la unica
     forma de que el proximo camino que se agregue no lo vuelva a perder.     */
  TUT.on = false;
  cl2($('velo'), 'off', true);
  cl2($('hud'), 'off', true);
  cl2($('pie'), 'off', true);
  cl2($('mini'), 'off', true);
  cl2($('tabla'), 'off', true);
  cl2($('pista'), 'on', false);
  cl2($('tSalt'), 'on', false);
  auAgacha(1); auAbre(0);
}

/* siguiente nivel: el ultimo del ultimo mundo no tiene siguiente, y un boton
   que lleva a la nada se lee a juego roto. */
function partidaSig() {
  let m = P.m, nv = P.nv + 1;
  if (nv >= NIV_MUNDO) { m++; nv = 0; }
  if (m >= MUNDOS.length) return null;
  return [m, nv];
}

/* ══════════════════════ EL MARCADOR ══════════════════════
   TODO SE ESCRIBE SOLO CUANDO CAMBIA. `textContent` ensucia el layout aunque
   el valor sea el mismo, y aca hay cuatro numeros por cuadro a sesenta por
   segundo: doscientos cuarenta reflujos para pintar lo mismo.              */
function cl2(el, c, v) { if (el) el.classList.toggle(c, !!v); }

function hudArma() {
  const v = $('vidas');
  v.innerHTML = '';
  P.hCor = [];
  const t = $('tabla');
  t.innerHTML = '';
  P.hTab = '';
  if (P.arena) {
    /* LAS OCHO FILAS SE ARMAN UNA VEZ Y DESPUES SOLO SE ESCRIBEN. Rehaciendo
       el HTML por cuadro son ocho nodos nuevos sesenta veces por segundo para
       mostrar lo mismo, y encima el navegador rehace el layout en cada una. */
    for (let i = 0; i < 1 + P.cfg.riv; i++) {
      const f = document.createElement('div');
      f.className = 'tf';
      f.innerHTML = '<span class="tn"></span><i class="tc"></i><span class="tp"></span>';
      t.appendChild(f);
    }
    return;   /* una vida no es un corazon que se gasta: es la corrida entera */
  }
  if (P.tuto) return;
  for (let i = 0; i < VIDAS; i++) {
    const d = document.createElement('div');
    d.className = 'cor';
    v.appendChild(d); P.hCor.push(d);
  }
}

function fmtReloj(s) {
  s = Math.max(0, Math.ceil(s));
  const m = (s / 60) | 0, r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

function hudPinta(todo) {
  const M = P.M, cfg = P.cfg;
  if (!M) return;

  /* la barra: la tajada de cada uno, y la marca de la meta */
  const bs = $('barra').getElementsByTagName('i');
  if (M.sucio) recuenta(M);
  for (let i = 0; i < bs.length; i++) {
    const id = i + 1;
    const w = id <= (1 + cfg.riv) && M.libres > 0 ? M.cuenta[id] / M.libres : 0;
    bs[i].style.width = (w * 100).toFixed(2) + '%';
    if (todo) bs[i].style.background = COLS[id] ? COLS[id].t : 'transparent';
  }
  if (todo) {
    $('meta').style.left = (cl(cfg.meta, 0, 1) * 100).toFixed(2) + '%';
    $('meta').style.display = (P.tuto || P.arena) ? 'none' : 'block';
  }

  if (P.arena) { hudArena(todo); return; }

  if (!P.tuto) {
    const pc = Math.round(P.pct * 100) + '%';
    if (pc !== P.hPct) { $('pct').firstElementChild.textContent = pc; P.hPct = pc; }
    const mt = TX('metaR', Math.round(cfg.meta * 100));
    if (mt !== P.hMeta) { $('pctR').textContent = mt; P.hMeta = mt; }
    const rl = fmtReloj(P.seg);
    if (rl !== P.hRel) { $('reloj').firstElementChild.textContent = rl; P.hRel = rl; }
    const poco = P.seg <= 10.5;
    if (poco !== P.hPoco) { cl2($('reloj'), 'poco', poco); P.hPoco = poco; }
    if (todo) $('relR').textContent = TX('tiempo');
  }

  if (todo) {
    const nv = P.tuto ? TX('tutTit') : TX('nivel', P.m + 1, P.nv + 1);
    if (nv !== P.hNiv) {
      $('nrN').textContent = nv;
      $('nrM').textContent = P.tuto ? '' : nomMundo(P.m);
      P.hNiv = nv;
    }
    for (let i = 0; i < P.hCor.length; i++) {
      const ida = i < P.yo.cortes;
      const d = P.hCor[P.hCor.length - 1 - i];   /* se gastan de derecha a izquierda */
      if (ida && !d.classList.contains('ida')) {
        d.classList.add('ida', 'late');
        setTimeout(() => d.classList.remove('late'), 520);
      } else if (!ida) d.classList.remove('ida', 'late');
    }
  }
}

/* ── EL MARCADOR DE LA ARENA ──────────────────────────────────────────────
   Los dos numeros del pie cambian de significado y no de sitio: donde iba la
   meta va el puesto, y donde iba el reloj van las bajas. Reusar los mismos
   elementos no es ahorro de HTML — es que quien juega ya sabe DONDE mirar, y
   moverle los numeros de lugar entre un modo y otro le cuesta esa costumbre.  */
function hudArena(todo) {
  const M = P.M;
  const t = P.tab || tablaPos(M);
  const pc = (P.pct * 100).toFixed(1) + '%';
  if (pc !== P.hPct) { $('pct').firstElementChild.textContent = pc; P.hPct = pc; }
  if (todo) $('pctR').textContent = TX('terreno');

  const ba = String(P.yo.matas);
  if (ba !== P.hRel) { $('reloj').firstElementChild.textContent = ba; P.hRel = ba; }
  if (todo) { $('relR').textContent = TX('bajas'); cl2($('reloj'), 'poco', false); P.hPoco = false; }

  const ps = TX('pos', P.posUlt);
  if (ps !== P.hNiv) {
    $('nrN').textContent = ps;
    $('nrM').textContent = TX('puesto');
    P.hNiv = ps;
  }

  /* LA TABLA SE ESCRIBE SOLO CUANDO CAMBIA, y la firma es el texto entero:
     con ocho filas a sesenta cuadros por segundo son casi mil quinientas
     escrituras de DOM por segundo para mostrar el mismo reparto.           */
  const fs = $('tabla').children;
  let firma = '';
  for (let i = 0; i < fs.length && i < t.length; i++) firma += t[i].id + ':' + Math.round(t[i].pct * 1000) + (t[i].vivo ? '' : 'x') + '|';
  if (firma === P.hTab) return;
  P.hTab = firma;
  for (let i = 0; i < fs.length && i < t.length; i++) {
    const f = fs[i], d = t[i], c = COLS[d.id];
    f.children[0].textContent = String(d.pos);
    f.children[1].style.background = c ? c.t : 'transparent';
    f.children[2].textContent = (d.pct * 100).toFixed(1) + '%';
    cl2(f, 'yo', d.id === 1);
    cl2(f, 'muerto', !d.vivo);
  }
}

/* ── el aviso corto ── */
let AV_T = 0;
function avisa(txt, ms) {
  const a = $('aviso');
  a.textContent = txt;
  cl2(a, 'on', true);
  clearTimeout(AV_T);
  AV_T = setTimeout(() => cl2(a, 'on', false), ms || 900);
}
/* Y SE LO BAJA AL ABRIR EL PANEL, desde `termina` y de ningun otro sitio. El
   aviso flota en la franja del medio, que es justo donde el panel escribe el
   subtitulo, y el panel es translucido a proposito: cualquier cartel que
   siguiera puesto se lee POR DETRAS del texto del final. Fotografiado dos
   veces, con dos avisos distintos —«SIN VIDAS» primero y «¡TIERRA!» despues—,
   asi que la cuenta no es «sacar el aviso que molesta» sino que el que abre el
   panel baje el que haya.                                                   */
function avisaCorta() { clearTimeout(AV_T); cl2($('aviso'), 'on', false); }

/* ── el panel de fin ──
   SE PINTA DESDE UNA FUNCION Y NO DESDE EL SITIO QUE GANO: cambiar de idioma
   con el panel puesto tiene que repintarlo, y para eso hay que poder volver a
   pintarlo sin volver a ganar. Por eso el estado se guarda en `FIN`.
   Y LO PINTA UNA SOLA FUNCION PARA LOS DOS CIERRES —el del nivel y el del
   tutorial—: con dos pintores, el dia que se agregue un campo uno de los dos
   se queda corto, y el que se queda corto es siempre el que nadie mira.   */
let FIN = null;
function finPon(o) { FIN = o; finPinta(); }
function finPinta() {
  if (!FIN) return;
  const f = FIN;
  if (f.arena) {
    $('fTit').textContent = TX('arenaFin');
    $('fSub').textContent = TX('arenaFinSub', f.pos);
    /* EL SINGULAR ES UNA FRASE ENTERA Y NO UN SUFIJO: en ingles son «kill» y
       «kills», dos palabras distintas en la tabla. Es la leccion que la vuelta
       165 ya habia pagado con «1 cortes», y volvio con otro contador.       */
    $('fDatos').textContent = TX(f.matas === 1 ? 'arenaD1' : 'arenaD',
                                 (f.pct * 100).toFixed(1), f.matas, fmtReloj(f.seg))
      + ' · ' + (f.rec ? TX('arenaNuevo') : TX('arenaRec', (f.recAnt * 100).toFixed(1)));
    $('fSig').style.display = '';
    $('fSig').textContent = TX('arenaOtra');
    /* REINTENTAR NO EXISTE ACA, y no es un olvido: una arena no se «reintenta»
       —no hay un nivel al que volver— asi que el boton y OTRA VEZ harian
       exactamente lo mismo con dos nombres distintos.                       */
    $('fRe').style.display = 'none';
    $('fMenu').textContent = TX('menuCorto');
    return;
  }
  $('fRe').style.display = '';
  if (f.tuto) {
    $('fTit').textContent = TX('tutGana');
    $('fSub').textContent = TX('tutGanaSub');
    $('fDatos').textContent = TX('tutDatos');
    $('fSig').style.display = '';
    $('fSig').textContent = TX('jugar');
    $('fRe').textContent = TX('tuto');
    $('fMenu').textContent = TX('menuCorto');
    return;
  }
  const gana = f.fin === 'gana';
  $('fTit').textContent = TX(gana ? (f.perf ? 'ganaPerf' : 'gana') : (f.fin === 'vidas' ? 'pierdeV' : 'pierdeT'));
  /* UN CORTE NO SON «1 cortes», y el singular es una FRASE por idioma y no un
     sufijo: en ingles son «cut»/«cuts», dos palabras distintas. Y el numero de
     vidas del subtitulo sale de VIDAS y no escrito en palabras — con «tres»
     puesto a mano, cambiar VIDAS deja la frase mintiendo sin que nada falle. */
  $('fSub').textContent = TX(gana ? (f.perf ? 'ganaPerfSub' : 'ganaSub') : (f.fin === 'vidas' ? 'pierdeVSub' : 'pierdeTSub'), VIDAS);
  $('fDatos').textContent = f.cortes === 1
    ? TX('datos1', Math.round(f.pct * 100), Math.round(f.meta * 100))
    : TX('datos', Math.round(f.pct * 100), Math.round(f.meta * 100), f.cortes);
  const sig = gana ? partidaSig() : null;
  $('fSig').style.display = sig ? '' : 'none';
  $('fSig').textContent = TX('siguiente');
  $('fRe').textContent = TX('reintentar');
  $('fMenu').textContent = TX('menuCorto');
}
/* ══════════════════════════════════════════════════════════════════════════
   g.js · EL TUTORIAL: cuatro cosas que HACER y una que mirar
   ──────────────────────────────────────────────────────────────────────────
   CADA PASO ESPERA A QUE SE HAGA LA COSA. Un tutorial que avanza con el reloj
   se saltea leyendo, y lo que se saltea es exactamente lo que despues no se
   entiende. Los cuatro primeros pasos tienen una CONDICION medida sobre el
   mismo modelo que juega el juego —el rumbo del cuerpo, la estela, los
   cerrados, las celdas ganadas— asi que no se puede pasar sin entender.

   Y NO HAY RIVAL (`riv: 0`). Con uno, el tutorial tiene un cuerpo suelto que
   puede pisarte la estela en el medio del paso 3 y dejarte esperando una
   condicion que acaba de romper. Nadie aprende a cercar mientras lo cazan.
   Lo que se pierde es la regla que no se puede practicar solo —que te corten—
   y por eso el paso 5 es un cartel y no una prueba: es la unica del juego que
   no se puede ensayar sin alguien enfrente.

   SE PUEDE SALTEAR, y no es una cortesia: `PROG.visto` se pone en cero DESPUES
   de leer el disco, o sea que esto sale CADA VEZ que se abre el juego.
   Obligatorio una vez es un tutorial; obligatorio siempre es un peaje.
   ══════════════════════════════════════════════════════════════════════ */

const TUT = { on: false, paso: 0, t: 0, fin: 0 };

/* el minimo que un cartel tiene que estar en pantalla antes de que su
   condicion pueda darse por cumplida: si no, un paso que ya estaba hecho
   —el dedo venia arrastrando— parpadea y no lo lee nadie. */
const TUT_LEER = 0.9;
const TUT_CIERRE = 2.6;   /* el paso 5 no se hace, se mira */

/* EL PLANETA DEL TUTORIAL ES CHICO Y PELADO. Con n=12 la circunferencia son
   48 celdas contra las 19 de la vista: un cuarto de vuelta entra en pantalla
   de una, asi que se ve de donde se salio mientras se vuelve. En un tutorial
   sin mapa chico —esta apagado— eso es lo unico que reemplaza al mapa. Sin
   piedras, porque ninguno de los cinco pasos habla de piedras.

   Y CHICO TIENE UN SEGUNDO TRABAJO EN LA ESFERA: 864 celdas es el unico
   tamano en el que el paso 4 —«una vuelta grande», 40 celdas ganadas— es una
   fraccion del planeta que se ve crecer. En uno de 8.664 son el 0,46 % y la
   vuelta no se nota.                                                        */
function tutCfg() {
  return {
    mundo: -1, nivel: -1, pat: 'vacio', n: 12, riv: 0,
    per: 0.6, meta: 1.1, seg: 0, sem: 20260911,
  };
}

/* cuanto terreno cuenta como «una vuelta grande». La casa son 5x5 = 25
   celdas, asi que 40 es rodear una superficie mas ancha que la propia casa:
   se llega con una vuelta de nueve por nueve y no se llega pegandose a la
   pared de casa, que es justo la diferencia que el paso 4 quiere ensenar. */
const TUT_GRANDE = 40;

const TUT_PASOS = [
  { k: 'tut1', ok: () => P.giros >= 1 },
  { k: 'tut2', ok: () => P.yo.estela >= 5 },
  { k: 'tut3', ok: () => P.yo.cerros >= 1 },
  { k: 'tut4', ok: () => P.ganUlt >= TUT_GRANDE },
  { k: 'tut5', ok: () => false },            /* este se mira, no se hace */
];

function tutArranca() {
  TUT.on = true; TUT.paso = 0; TUT.t = 0; TUT.fin = 0;
  partidaArranca(-1, -1, true);
  cl2($('tSalt'), 'on', true);
  $('tSalt').textContent = TX('salt');
  tutPista();
}

function tutPista() {
  const p = TUT_PASOS[TUT.paso];
  const e = $('pista');
  if (!p) { cl2(e, 'on', false); return; }
  e.textContent = TX(p.k);
  cl2(e, 'on', true);
}

function tutPaso(dt) {
  if (!TUT.on || !P.on || P.pausa || P.fin) return;
  TUT.t += dt;
  const p = TUT_PASOS[TUT.paso];
  if (!p) return;

  /* el ultimo no tiene condicion: se queda el rato que tarda en leerse y
     cierra por el mismo camino que gana un nivel, asi que la fanfarria, el
     marcador y el panel son los de siempre y no una segunda contabilidad. */
  if (TUT.paso === TUT_PASOS.length - 1) {
    if (TUT.t >= TUT_CIERRE) termina('gana');
    return;
  }

  if (TUT.t < TUT_LEER || !p.ok()) return;
  TUT.paso++; TUT.t = 0;
  son('des');
  tutPista();
}

/* EL CIERRE PASA POR `finPon` Y NO ESCRIBE EL PANEL A MANO: cambiar de idioma
   con el panel puesto tiene que repintarlo, y el unico que sabe repintarlo es
   el pintor. Con dos, el del tutorial es el que se queda viejo.            */
function tutFin() {
  TUT.on = false;
  cl2($('pista'), 'on', false);
  cl2($('tSalt'), 'on', false);
  PROG.visto = 1; guardaProg();
  finPon({ tuto: true });
  verPanel('pFin');
}

/* saltear deja el tutorial por hecho y devuelve al MENU y no al juego: el que
   lo salteo no eligio todavia que jugar. El que lo termina si —por eso su
   panel ofrece JUGAR—.                                                     */
function tutSalta() {
  if (!TUT.on) return;
  TUT.on = false;
  son('ui');
  PROG.visto = 1; guardaProg();
  partidaSale();
  vaMenu();
}
/* ══════════════════════════════════════════════════════════════════════════
   h.js · LOS PANELES: menu, niveles, ajustes, pausa y fin
   ──────────────────────────────────────────────────────────────────────────
   UN SOLO SITIO ABRE Y CIERRA (`verPanel`), y de ahi cuelga todo lo demas:
   con cada boton apagando el panel que conoce, el dia que se agrega uno queda
   una pantalla encima de otra y no falla nada — se ve como un juego trabado.

   EL VELO ES UN DEGRADADO Y NO UNA OPACIDAD PAREJA: cerrado arriba y abajo,
   donde viven el titulo y los botones, y abierto en el medio, asi que el
   tablero sigue corriendo detras del menu. Un panel opaco encima de una
   escena que ya se esta dibujando tira a la basura lo unico que este juego
   tiene para mostrar antes de que alguien toque nada.
   ══════════════════════════════════════════════════════════════════════ */

let PANEL = null;
function verPanel(id) {
  const ps = document.getElementsByClassName('pan');
  for (let i = 0; i < ps.length; i++) ps[i].classList.toggle('on', ps[i].id === id);
  PANEL = id;
}

/* ── el idioma se escribe entero, y de UNA funcion ──
   `pintaIdioma` la llaman el arranque Y los seis botones de idioma, asi que
   no hay forma de agregar un texto que quede sin traducir en uno de los dos
   caminos. Y repinta TAMBIEN lo que ya esta en pantalla —el panel de fin, la
