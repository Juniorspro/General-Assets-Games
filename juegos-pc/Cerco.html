     el, `paso` revive para siempre y las vidas serian un numero que baja.  */
  P.yo.topeCortes = P.tuto ? 1e9 : VIDAS;
  P.seg = P.cfg.seg;
  P.on = true; P.pausa = false; P.fin = null;
  P.cortesVistos = 0; P.pct = 0; P.mejor = 0; P.casi = false; P.ganUlt = 0;
  P.giros = 0; P.gdx = P.yo.dx; P.gdy = P.yo.dy;
  P.hCor = []; P.hPct = ''; P.hMeta = ''; P.hRel = ''; P.hPoco = false; P.hNiv = '';
  vpNuevo(P.M);
  hudArma();
  hudPinta(true);
  cl2($('hud'), 'off', false);
  cl2($('pie'), 'off', P.tuto);
  cl2($('mini'), 'off', P.tuto);
  auAbre(0);
  return P.M;
}

function partidaPaso(dt) {
  if (!P.on || P.pausa || P.fin) return;
  const M = P.M, yo = P.yo;
  paso(M, dt);
  entSuelta();
  const gan = vpTras(M);
  P.ganUlt = gan[1];

  /* LAS VUELTAS SE CUENTAN POR EL RUMBO QUE EL CUERPO TOMO, no por los toques
     que se pidieron: un pedido puede quedar en la cola y no salir nunca, y el
     tutorial estaria dando por hecho un gesto que no ocurrio.              */
  if (yo.dx !== P.gdx || yo.dy !== P.gdy) { P.giros++; P.gdx = yo.dx; P.gdy = yo.dy; }

  /* ── lo que gano este cuadro ── */
  if (gan[1] > 0) {
    son('tierra', gan[1]);
    if (gan[1] >= 90) avisa(TX('avTierra'));
  }
  /* ── los cortes ── */
  if (yo.cortes !== P.cortesVistos) {
    P.cortesVistos = yo.cortes;
    son('corte');
    hudPinta(true);
    if (!P.tuto && yo.cortes >= VIDAS) { avisa(TX('avSinVidas')); termina('vidas'); return; }
    avisa(TX('avCorte'));
  }

  P.pct = tajada(M, 1);
  if (P.pct > P.mejor) P.mejor = P.pct;
  auAbre(P.cfg.meta > 0 ? P.pct / P.cfg.meta : 0);

  if (!P.tuto) {
    if (!P.casi && P.pct >= P.cfg.meta * 0.82 && P.pct < P.cfg.meta) {
      P.casi = true; son('casi'); avisa(TX('avCasi'));
    }
    if (P.pct >= P.cfg.meta) { termina('gana'); return; }
    P.seg -= dt;
    if (P.seg <= 0) { P.seg = 0; termina('tiempo'); return; }
  }
  hudPinta(false);
}

function termina(fin) {
  P.fin = fin;
  const perf = fin === 'gana' && P.yo.cortes === 0;
  if (fin === 'gana') {
    son(perf ? 'perf' : 'gana');
    if (!P.tuto) anota(P.m, P.nv, perf);
  } else son('pierde');
  /* LA FANFARRIA PIDE SILENCIO Y SE LEVANTA SOLA. La cama es un pad sostenido
     y el remate dura dos segundos: sin agachar, las dos suenan a la vez y no se
     escucha ninguna. Va con duracion —a diferencia de la de la pausa, que dura
     lo que dure la pausa y la levanta quien despausa—.                       */
  auAgacha(0.25, 2.2);
  hudPinta(true);
  if (P.tuto) { tutFin(); return; }
  finPon({ tuto: false, fin, perf, pct: P.pct, meta: P.cfg.meta, cortes: P.yo.cortes, m: P.m, nv: P.nv });
  verPanel('pFin');
}

function pausaPon(v) {
  if (!P.on || P.fin) return;
  P.pausa = !!v;
  if (P.pausa) { son('ui'); auAgacha(0.22); verPanel('pPausa'); }
  else { auAgacha(1); verPanel(null); }
}

function partidaSale() {
  P.on = false; P.pausa = false; P.fin = null;
  /* Y EL TUTORIAL SE APAGA ACA, no en quien lo cierra. Hay TRES caminos que
     sacan al jugador de una partida —terminarla, saltearla y la PAUSA, que
     durante el tutorial tambien tiene su SALIR— y con la bandera apagada solo
     en los dos primeros, salir desde la pausa dejaba `TUT.on` prendido: medido,
     el nivel 1-1 arrancaba con `tutOn: true` y la pista del tutorial puesta
     encima. Apagarlo en el unico sitio por el que pasan los tres es la unica
     forma de que el proximo camino que se agregue no lo vuelva a perder.     */
  TUT.on = false;
  cl2($('hud'), 'off', true);
  cl2($('pie'), 'off', true);
  cl2($('mini'), 'off', true);
  cl2($('pista'), 'on', false);
  cl2($('tSalt'), 'on', false);
  auAgacha(1); auAbre(0);
}

/* siguiente nivel: el ultimo del ultimo mundo no tiene siguiente, y un boton
   que lleva a la nada se lee a juego roto. */
function partidaSig() {
  let m = P.m, nv = P.nv + 1;
  if (nv >= NIV_MUNDO) { m++; nv = 0; }
  if (m >= MUNDOS.length) return null;
  return [m, nv];
}

/* ══════════════════════ EL MARCADOR ══════════════════════
   TODO SE ESCRIBE SOLO CUANDO CAMBIA. `textContent` ensucia el layout aunque
   el valor sea el mismo, y aca hay cuatro numeros por cuadro a sesenta por
   segundo: doscientos cuarenta reflujos para pintar lo mismo.              */
function cl2(el, c, v) { if (el) el.classList.toggle(c, !!v); }

function hudArma() {
  const v = $('vidas');
  v.innerHTML = '';
  P.hCor = [];
  if (P.tuto) return;
  for (let i = 0; i < VIDAS; i++) {
    const d = document.createElement('div');
    d.className = 'cor';
    v.appendChild(d); P.hCor.push(d);
  }
}

function fmtReloj(s) {
  s = Math.max(0, Math.ceil(s));
  const m = (s / 60) | 0, r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

function hudPinta(todo) {
  const M = P.M, cfg = P.cfg;
  if (!M) return;

  /* la barra: la tajada de cada uno, y la marca de la meta */
  const bs = $('barra').getElementsByTagName('i');
  if (M.sucio) recuenta(M);
  for (let i = 0; i < bs.length; i++) {
    const id = i + 1;
    const w = id <= (1 + cfg.riv) && M.libres > 0 ? M.cuenta[id] / M.libres : 0;
    bs[i].style.width = (w * 100).toFixed(2) + '%';
    if (todo) bs[i].style.background = COLS[id] ? COLS[id].t : 'transparent';
  }
  if (todo) {
    $('meta').style.left = (cl(cfg.meta, 0, 1) * 100).toFixed(2) + '%';
    $('meta').style.display = P.tuto ? 'none' : 'block';
  }

  if (!P.tuto) {
    const pc = Math.round(P.pct * 100) + '%';
    if (pc !== P.hPct) { $('pct').firstElementChild.textContent = pc; P.hPct = pc; }
    const mt = TX('metaR', Math.round(cfg.meta * 100));
    if (mt !== P.hMeta) { $('pctR').textContent = mt; P.hMeta = mt; }
    const rl = fmtReloj(P.seg);
    if (rl !== P.hRel) { $('reloj').firstElementChild.textContent = rl; P.hRel = rl; }
    const poco = P.seg <= 10.5;
    if (poco !== P.hPoco) { cl2($('reloj'), 'poco', poco); P.hPoco = poco; }
    if (todo) $('relR').textContent = TX('tiempo');
  }

  if (todo) {
    const nv = P.tuto ? TX('tutTit') : TX('nivel', P.m + 1, P.nv + 1);
    if (nv !== P.hNiv) {
      $('nrN').textContent = nv;
      $('nrM').textContent = P.tuto ? '' : nomMundo(P.m);
      P.hNiv = nv;
    }
    for (let i = 0; i < P.hCor.length; i++) {
      const ida = i < P.yo.cortes;
      const d = P.hCor[P.hCor.length - 1 - i];   /* se gastan de derecha a izquierda */
      if (ida && !d.classList.contains('ida')) {
        d.classList.add('ida', 'late');
        setTimeout(() => d.classList.remove('late'), 520);
      } else if (!ida) d.classList.remove('ida', 'late');
    }
  }
}

/* ── el aviso corto ── */
let AV_T = 0;
function avisa(txt, ms) {
  const a = $('aviso');
  a.textContent = txt;
  cl2(a, 'on', true);
  clearTimeout(AV_T);
  AV_T = setTimeout(() => cl2(a, 'on', false), ms || 900);
}

/* ── el panel de fin ──
   SE PINTA DESDE UNA FUNCION Y NO DESDE EL SITIO QUE GANO: cambiar de idioma
   con el panel puesto tiene que repintarlo, y para eso hay que poder volver a
   pintarlo sin volver a ganar. Por eso el estado se guarda en `FIN`.
   Y LO PINTA UNA SOLA FUNCION PARA LOS DOS CIERRES —el del nivel y el del
   tutorial—: con dos pintores, el dia que se agregue un campo uno de los dos
   se queda corto, y el que se queda corto es siempre el que nadie mira.   */
let FIN = null;
function finPon(o) { FIN = o; finPinta(); }
function finPinta() {
  if (!FIN) return;
  const f = FIN;
  if (f.tuto) {
    $('fTit').textContent = TX('tutGana');
    $('fSub').textContent = TX('tutGanaSub');
    $('fDatos').textContent = TX('tutDatos');
    $('fSig').style.display = '';
    $('fSig').textContent = TX('jugar');
    $('fRe').textContent = TX('tuto');
    $('fMenu').textContent = TX('menuCorto');
    return;
  }
  const gana = f.fin === 'gana';
  $('fTit').textContent = TX(gana ? (f.perf ? 'ganaPerf' : 'gana') : (f.fin === 'vidas' ? 'pierdeV' : 'pierdeT'));
  /* UN CORTE NO SON «1 cortes», y el singular es una FRASE por idioma y no un
     sufijo: en ingles son «cut»/«cuts», dos palabras distintas. Y el numero de
     vidas del subtitulo sale de VIDAS y no escrito en palabras — con «tres»
     puesto a mano, cambiar VIDAS deja la frase mintiendo sin que nada falle. */
  $('fSub').textContent = TX(gana ? (f.perf ? 'ganaPerfSub' : 'ganaSub') : (f.fin === 'vidas' ? 'pierdeVSub' : 'pierdeTSub'), VIDAS);
  $('fDatos').textContent = f.cortes === 1
    ? TX('datos1', Math.round(f.pct * 100), Math.round(f.meta * 100))
    : TX('datos', Math.round(f.pct * 100), Math.round(f.meta * 100), f.cortes);
  const sig = gana ? partidaSig() : null;
  $('fSig').style.display = sig ? '' : 'none';
  $('fSig').textContent = TX('siguiente');
  $('fRe').textContent = TX('reintentar');
  $('fMenu').textContent = TX('menuCorto');
}
/* ══════════════════════════════════════════════════════════════════════════
   g.js · EL TUTORIAL: cuatro cosas que HACER y una que mirar
   ──────────────────────────────────────────────────────────────────────────
   CADA PASO ESPERA A QUE SE HAGA LA COSA. Un tutorial que avanza con el reloj
   se saltea leyendo, y lo que se saltea es exactamente lo que despues no se
   entiende. Los cuatro primeros pasos tienen una CONDICION medida sobre el
   mismo modelo que juega el juego —el rumbo del cuerpo, la estela, los
   cerrados, las celdas ganadas— asi que no se puede pasar sin entender.

   Y NO HAY RIVAL (`riv: 0`). Con uno, el tutorial tiene un cuerpo suelto que
   puede pisarte la estela en el medio del paso 3 y dejarte esperando una
   condicion que acaba de romper. Nadie aprende a cercar mientras lo cazan.
   Lo que se pierde es la regla que no se puede practicar solo —que te corten—
   y por eso el paso 5 es un cartel y no una prueba: es la unica del juego que
   no se puede ensayar sin alguien enfrente.

   SE PUEDE SALTEAR, y no es una cortesia: `PROG.visto` se pone en cero DESPUES
   de leer el disco, o sea que esto sale CADA VEZ que se abre el juego.
   Obligatorio una vez es un tutorial; obligatorio siempre es un peaje.
   ══════════════════════════════════════════════════════════════════════ */

const TUT = { on: false, paso: 0, t: 0, fin: 0 };

/* el minimo que un cartel tiene que estar en pantalla antes de que su
   condicion pueda darse por cumplida: si no, un paso que ya estaba hecho
   —el dedo venia arrastrando— parpadea y no lo lee nadie. */
const TUT_LEER = 0.9;
const TUT_CIERRE = 2.6;   /* el paso 5 no se hace, se mira */

/* EL MAPA DEL TUTORIAL ES CHICO Y PELADO. 26 celdas contra las 19 de la vista
   quiere decir que casi todo el tablero entra en pantalla de una: en un
   tutorial sin mapa chico —esta apagado— no se puede pedir que alguien busque
   el borde. Sin piedras, porque ninguno de los cinco pasos habla de piedras. */
function tutCfg() {
  return {
    mundo: -1, nivel: -1, pat: 'vacio', n: 26, riv: 0,
    per: 0.6, meta: 1.1, seg: 0, sem: 20260911,
  };
}

/* cuanto terreno cuenta como «una vuelta grande». La casa son 5x5 = 25
   celdas, asi que 40 es rodear una superficie mas ancha que la propia casa:
   se llega con una vuelta de nueve por nueve y no se llega pegandose a la
   pared de casa, que es justo la diferencia que el paso 4 quiere ensenar. */
const TUT_GRANDE = 40;

const TUT_PASOS = [
  { k: 'tut1', ok: () => P.giros >= 1 },
  { k: 'tut2', ok: () => P.yo.estela >= 5 },
  { k: 'tut3', ok: () => P.yo.cerros >= 1 },
  { k: 'tut4', ok: () => P.ganUlt >= TUT_GRANDE },
  { k: 'tut5', ok: () => false },            /* este se mira, no se hace */
];

function tutArranca() {
  TUT.on = true; TUT.paso = 0; TUT.t = 0; TUT.fin = 0;
  partidaArranca(-1, -1, true);
  cl2($('tSalt'), 'on', true);
  $('tSalt').textContent = TX('salt');
  tutPista();
}

function tutPista() {
  const p = TUT_PASOS[TUT.paso];
  const e = $('pista');
  if (!p) { cl2(e, 'on', false); return; }
  e.textContent = TX(p.k);
  cl2(e, 'on', true);
}

function tutPaso(dt) {
  if (!TUT.on || !P.on || P.pausa || P.fin) return;
  TUT.t += dt;
  const p = TUT_PASOS[TUT.paso];
  if (!p) return;

  /* el ultimo no tiene condicion: se queda el rato que tarda en leerse y
     cierra por el mismo camino que gana un nivel, asi que la fanfarria, el
     marcador y el panel son los de siempre y no una segunda contabilidad. */
  if (TUT.paso === TUT_PASOS.length - 1) {
    if (TUT.t >= TUT_CIERRE) termina('gana');
    return;
  }

  if (TUT.t < TUT_LEER || !p.ok()) return;
  TUT.paso++; TUT.t = 0;
  son('des');
  tutPista();
}

/* EL CIERRE PASA POR `finPon` Y NO ESCRIBE EL PANEL A MANO: cambiar de idioma
   con el panel puesto tiene que repintarlo, y el unico que sabe repintarlo es
   el pintor. Con dos, el del tutorial es el que se queda viejo.            */
function tutFin() {
  TUT.on = false;
  cl2($('pista'), 'on', false);
  cl2($('tSalt'), 'on', false);
  PROG.visto = 1; guardaProg();
  finPon({ tuto: true });
  verPanel('pFin');
}

/* saltear deja el tutorial por hecho y devuelve al MENU y no al juego: el que
   lo salteo no eligio todavia que jugar. El que lo termina si —por eso su
   panel ofrece JUGAR—.                                                     */
function tutSalta() {
  if (!TUT.on) return;
  TUT.on = false;
  son('ui');
  PROG.visto = 1; guardaProg();
  partidaSale();
  vaMenu();
}
/* ══════════════════════════════════════════════════════════════════════════
   h.js · LOS PANELES: menu, niveles, ajustes, pausa y fin
   ──────────────────────────────────────────────────────────────────────────
   UN SOLO SITIO ABRE Y CIERRA (`verPanel`), y de ahi cuelga todo lo demas:
   con cada boton apagando el panel que conoce, el dia que se agrega uno queda
   una pantalla encima de otra y no falla nada — se ve como un juego trabado.

   EL VELO ES UN DEGRADADO Y NO UNA OPACIDAD PAREJA: cerrado arriba y abajo,
   donde viven el titulo y los botones, y abierto en el medio, asi que el
   tablero sigue corriendo detras del menu. Un panel opaco encima de una
   escena que ya se esta dibujando tira a la basura lo unico que este juego
   tiene para mostrar antes de que alguien toque nada.
   ══════════════════════════════════════════════════════════════════════ */

let PANEL = null;
function verPanel(id) {
  const ps = document.getElementsByClassName('pan');
  for (let i = 0; i < ps.length; i++) ps[i].classList.toggle('on', ps[i].id === id);
  PANEL = id;
}

/* ── el idioma se escribe entero, y de UNA funcion ──
   `pintaIdioma` la llaman el arranque Y los seis botones de idioma, asi que
   no hay forma de agregar un texto que quede sin traducir en uno de los dos
   caminos. Y repinta TAMBIEN lo que ya esta en pantalla —el panel de fin, la
   pista del tutorial, el marcador— porque cambiar de idioma con un panel
   puesto tiene que cambiarlo: es literalmente el defecto que en Z Force
   costo 107 claves.                                                        */
function pintaIdioma() {
  const T = (id, k, ...a) => { const e = $(id); if (e) e.textContent = TX(k, ...a); };
  T('mSub', 'sub');
  T('mJugar', 'jugar'); T('mNiv', 'niveles'); T('mTuto', 'tuto'); T('mAj', 'ajustes');
  T('mPie', 'pie');
  T('nvTit', 'niveles'); T('nvVolver', 'volver'); T('nvSub', 'nivelesSub');
  T('ajTit', 'ajTit'); T('ajMus', 'musica'); T('ajFx', 'efectos');
  T('ajCal', 'graficos'); T('ajIdi', 'idioma');
  T('ajBorrar', 'borrar'); T('ajVolver', 'volver');
  T('paTit', 'pausa'); T('paSub', 'pausaSub');
  T('paSeguir', 'seguir'); T('paRe', 'reiniciar'); T('paSalir', 'salir');
  T('cSub', 'cargando'); T('tSalt', 'salt');
  const cal = LANGS[LANG].calN || LANGS.es.calN;
  chips('[data-cal]', b => { b.textContent = cal[+b.dataset.cal] || ''; });
  finPinta();
  if (TUT.on) tutPista();
  if (P.on) hudPinta(true);
  nvPinta();
  marcaChips();
}

function chips(sel, f) {
  const l = document.querySelectorAll(sel);
  for (let i = 0; i < l.length; i++) f(l[i]);
}
function marcaChips() {
  chips('[data-cal]', b => b.classList.toggle('sel', (+b.dataset.cal) === (PROG.cal | 0)));
  chips('[data-l2]', b => b.classList.toggle('sel', b.dataset.l2 === LANG));
}

/* ══════════════════════ LA LISTA DE NIVELES ══════════════════════
   El mundo va por PESTANA y no todo junto: cuarenta botones en una columna
   son cuarenta botones que hay que scrollear para llegar al ultimo, y el
   ultimo es justo al que uno quiere volver.                                */
let NV_M = 0;
function nvAbre() {
  NV_M = cl(Math.floor(PROG.ult / NIV_MUNDO), 0, MUNDOS.length - 1);
  nvPinta();
  verPanel('pNiv');
}
function nvPinta() {
  const tab = $('nvMundos'), gr = $('nvGrid');
  if (!tab || !gr) return;
  tab.innerHTML = '';
  for (let m = 0; m < MUNDOS.length; m++) {
    const b = document.createElement('button');
    b.className = 'mtab';
    b.textContent = nomMundo(m);
    /* un mundo esta abierto si su PRIMER nivel lo esta: preguntando por el
       ultimo, la pestana del mundo en el que uno esta parado sale cerrada. */
    const libre = abierto(idNiv(m, 0));
    b.classList.toggle('sel', m === NV_M);
    b.classList.toggle('cerr', !libre);
    if (libre) b.onclick = () => { son('ui'); NV_M = m; nvPinta(); };
    tab.appendChild(b);
  }
  gr.innerHTML = '';
  for (let n = 0; n < NIV_MUNDO; n++) {
    const k = idNiv(NV_M, n), libre = abierto(k);
    const b = document.createElement('button');
    b.className = 'nvB';
    b.classList.toggle('ok', hecho(NV_M, n));
    b.classList.toggle('cerr', !libre);
    b.innerHTML = (n + 1) + (perfecto(NV_M, n) ? '<s>◆</s>' : '');
    if (libre) b.onclick = () => { son('ui'); juega(NV_M, n); };
    gr.appendChild(b);
  }
}

/* ══════════════════════ LOS CAMINOS ══════════════════════ */
function juega(m, n) {
  auDesp();
  partidaArranca(m, n, false);
  auAcorde(m);
  verPanel(null);
}
function vaMenu() {
  partidaSale();
  verPanel('pMenu');
}
/* JUGAR arranca en el ultimo abierto y no siempre en el 1-1: en un juego de
   cuarenta niveles, el boton grande tiene que llevar a donde uno quedo.   */
function juegaUltimo() {
  const k = cl(PROG.ult | 0, 0, NIVELES - 1);
  juega(Math.floor(k / NIV_MUNDO), k % NIV_MUNDO);
}

function uiInit() {
  const cl1 = (id, f) => { const e = $(id); if (e) e.onclick = f; };

  chips('[data-lang]', b => {
    b.onclick = () => { LANG = b.dataset.lang; guardaProg(); pintaIdioma(); auDesp(); son('ui'); arranqueUI(); };
  });
  chips('[data-l2]', b => {
    b.onclick = () => { LANG = b.dataset.l2; guardaProg(); son('ui'); pintaIdioma(); };
  });
  chips('[data-cal]', b => {
    b.onclick = () => { PROG.cal = +b.dataset.cal; guardaProg(); son('ui'); vpMide(); marcaChips(); };
  });

  cl1('mJugar', () => { son('ui'); juegaUltimo(); });
  cl1('mNiv', () => { son('ui'); nvAbre(); });
  cl1('mTuto', () => { son('ui'); auDesp(); tutArranca(); verPanel(null); });
  cl1('mAj', () => { son('ui'); verPanel('pAj'); });
  cl1('nvVolver', () => { son('ui'); verPanel('pMenu'); });
  cl1('ajVolver', () => { son('ui'); verPanel(P.on ? 'pPausa' : 'pMenu'); });
  cl1('ajBorrar', () => {
    son('des'); borraProg();
    $('ajBorrar').textContent = TX('borrado');
    setTimeout(() => { $('ajBorrar').textContent = TX('borrar'); }, 1100);
    nvPinta();
  });

  cl1('bPausa', () => pausaPon(true));
  cl1('paSeguir', () => { son('ui'); pausaPon(false); });
  cl1('paRe', () => { son('ui'); P.pausa = false; auAgacha(1); juega(P.m, P.nv); });
  cl1('paSalir', () => { son('ui'); vaMenu(); });

  /* EL PANEL DE FIN TIENE DOS DUENOS —el nivel y el tutorial— y los tres
     botones cambian de destino segun cual cerro. Se pregunta por `P.tuto`,
     que sigue puesto hasta que `partidaSale` corra: guardar una segunda
     bandera seria un estado mas que se puede desincronizar del primero.  */
  cl1('fSig', () => {
    son('ui');
    if (P.tuto) { partidaSale(); juegaUltimo(); return; }
    const s = partidaSig();
    if (s) juega(s[0], s[1]); else vaMenu();
  });
  cl1('fRe', () => {
    son('ui');
    if (P.tuto) { partidaSale(); tutArranca(); verPanel(null); return; }
    juega(P.m, P.nv);
  });
  cl1('fMenu', () => { son('ui'); vaMenu(); });

  cl1('tSalt', () => tutSalta());

  const rm = $('rMus'), rf = $('rFx');
  if (rm) { rm.value = Math.round(PROG.vol * 100); rm.oninput = () => { PROG.vol = rm.value / 100; auVol(); guardaProg(); }; }
  if (rf) { rf.value = Math.round(PROG.fx * 100); rf.oninput = () => { PROG.fx = rf.value / 100; auVol(); guardaProg(); }; }
}

/* ══════════════════════ EL ARRANQUE ══════════════════════
   EL TUTORIAL VA ANTES DEL MENU, y sale cada vez que se abre el juego —
   `PROG.visto` se descarta al leer el disco—. Entrar al menu primero
   convierte la lection en una opcion, y lo que es opcional en un menu no lo
   toca nadie: despues no se entiende el juego y la culpa parece del juego.  */
function arranqueUI() {
  if (!PROG.lang) { verPanel('pIdioma'); return; }
  if (!PROG.visto) { auDesp(); tutArranca(); verPanel(null); return; }
  verPanel('pMenu');
}

/* ══════════════════════════════════════════════════════════════════════════
   z · ARRANQUE, RELOJ Y SONDAS
   ──────────────────────────────────────────────────────────────────────────
   EL RELOJ DEL JUEGO ES DE PASO FIJO Y VIVE EN `paso(M, dt)` —c.js—, no aca:
   lo unico que hace este bucle es entregarle un `dt` topado. El tope de 0,05
   no es cosmetico: una pestana que estuvo dormida devuelve dos segundos de
   golpe, y dos segundos son once tics simulados en un cuadro con todos los
   cuerpos cruzando media pantalla sin que nadie pueda doblar.

   Y EL DIBUJO VA DESPUES DE TODO, incluido el tutorial: `tutPaso` puede
   cerrar la partida —el paso 5 llama a `termina`— y dibujar antes de eso
   pintaria un cuadro del mundo que ya termino.
   ══════════════════════════════════════════════════════════════════════ */
let ULT = 0, MSDIB = 0;
function bucle(ts) {
  requestAnimationFrame(bucle);
  const dt = Math.min(0.05, ULT ? (ts - ULT) / 1000 : 0); ULT = ts;
  partidaPaso(dt);
  tutPaso(dt);
  if (P.on) {
    vpCam(P.M, dt);
    vpDibuja(P.M, dt);
    vpMiniPinta(P.M);
    MSDIB = MSDIB * 0.9 + V.msDib * 0.1;
  }
}

/* EL AUDIO DESPIERTA CON EL PRIMER GESTO Y NO AL CARGAR: ningun navegador
   deja sonar nada antes de uno, asi que un `auArranca()` en el arranque deja
   el contexto suspendido y la cama muda para el resto de la partida. Va
   DELEGADO EN CAPTURA sobre el documento: colgandolo de cada boton habria
   que acordarse en los quince que hay y en el proximo que se agregue.     */
function auEngancha() {
  const f = () => { auArranca(); auDesp(); };
  for (const k of ['pointerdown', 'click', 'keydown'])
    addEventListener(k, f, { capture: true, once: false, passive: true });
}

function arranca() {
  cargaProg();
  vpInit();
  entInit();
  uiInit();
  auEngancha();
  pintaIdioma();
  arranqueUI();
  setTimeout(() => {
    const c = $('carga');
    c.classList.add('off');
    setTimeout(() => { c.style.display = 'none'; }, 420);
  }, 340);
  requestAnimationFrame(bucle);
}
arranca();

/* ══════════════════════════ SONDAS ══════════════════════════
   Una afirmacion sin numero no vale. Lo que se pueda medir por el camino del
   dedo se mide por ahi: los bots entran por `p.ped` —el mismo campo que
   escribe `entPide`— y el tutorial se juega moviendo el cuerpo, no
   escribiendole los contadores que sus pasos miran.                       */
window.__C = {
  est() {
    const M = P.M;
    return {
      on: P.on, panel: PANEL, tuto: P.tuto, lang: LANG, pausa: P.pausa, fin: P.fin,
      m: P.m, nv: P.nv, n: M ? M.n : 0, riv: P.cfg ? P.cfg.riv : 0,
      pct: M ? +(tajada(M, 1) * 100).toFixed(1) : 0,
      meta: P.cfg ? +(P.cfg.meta * 100).toFixed(1) : 0,
      cortes: P.yo ? P.yo.cortes : 0, cerros: P.yo ? P.yo.cerros : 0,
      estela: P.yo ? P.yo.estela : 0, fuera: P.yo ? P.yo.fuera : false,
      vivo: P.yo ? P.yo.vivo : false, seg: +P.seg.toFixed(1),
      giros: P.giros, ganUlt: P.ganUlt,
      tutOn: TUT.on, tutPaso: TUT.paso, pista: $('pista').textContent,
      hechos: cuentaHechos(), ult: PROG.ult, cal: PROG.cal,
      ms: +MSDIB.toFixed(3), dpr: V.dpr,
    };
  },

  /* ── caminos ── */
  nivel(m, n) { juega(m, n); return this.est(); },
  tut() { tutArranca(); verPanel(null); return this.est(); },
  menu() { vaMenu(); return this.est(); },
  panel(id) { verPanel(id); return { panel: PANEL }; },
  clic(id) { const e = $(id); if (!e) return 'no hay ' + id; e.click(); return this.est(); },
  lang(l) { LANG = l; guardaProg(); pintaIdioma(); return { lang: LANG, sub: $('mSub').textContent, pista: $('pista').textContent, fTit: $('fTit').textContent }; },

  /* ── el dedo, de verdad: el mismo gesto que hace una persona ──
     `entBaja`/`entMueve` piden un puntero con coordenadas de pantalla, asi
     que un arrastre sintetico sobre el lienzo ejerce la zona muerta, la
     histeresis del eje y la cola — que es lo unico que prueba que doblar
     funciona como doblar y no como escribir `p.ped`.                      */
  arrastra(dx, dy) {
    const c = $('cv'), r = c.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    const ev = (t, x, y) => c.dispatchEvent(new PointerEvent(t, { pointerId: 7, clientX: x, clientY: y, bubbles: true }));
    ev('pointerdown', x0, y0);
    ev('pointermove', x0 + dx, y0 + dy);
    ev('pointerup', x0 + dx, y0 + dy);
    return { ped: P.yo ? P.yo.ped : null, dx: P.yo ? P.yo.dx : 0, dy: P.yo ? P.yo.dy : 0 };
  },
  tecla(k) { entTecla({ key: k, preventDefault() {} }); return { ped: P.yo ? P.yo.ped : null }; },

  /* adelanta la simulacion SIN dibujar: lo que se mide aca es el modelo, y
     el dibujo a resolucion de software cuesta mas que la fisica entera. */
  anda(n, dt) { for (let i = 0; i < (n || 60); i++) partidaPaso(dt || 0.016); return this.est(); },

  /* ── el tutorial jugado por el camino del jugador ──
     Cada paso se cumple MOVIENDO el cuerpo y no tocando su contador: si se
     escribiera `P.giros` a mano, la prueba estaria aprobando su propia
     cuenta en vez del gesto.                                             */
  juegaTut(tope) {
    const T = tope || 6000, hist = [];
    /* UN CUADRADO Y NO UN ZIGZAG. La primera version doblaba alternando eje
       —derecha, abajo, derecha, abajo— y eso no es un cuadrado: es una
       escalera que se aleja de casa y NO VUELVE NUNCA. Medido, se clavaba en
       el paso 3 con 2.401 vueltas sin cerrar una sola area. Doblar siempre
       para el MISMO lado es lo unico que devuelve al punto de partida, y
       volver es exactamente lo que cierra.                                */
    const R = [[1, 0], [0, 1], [-1, 0], [0, -1]];   /* der · abajo · izq · arriba */
    /* Y EL LADO CRECE AL LLEGAR AL PASO 4, porque si no el cuerpo ya no sale.
       Medido con lado fijo de nueve: los dos primeros pasos salian y el
       cuarto se clavaba 3.000 vueltas, y la causa es que despues de cerrar
       el primer cuadrado ESE CUADRADO YA ES TERRENO PROPIO — el segundo se
       traza entero adentro de lo ganado, sin una celda de estela y sin nada
       que cerrar. Lo que hace una persona al leer «cuanto mas grande la
       vuelta» es justamente eso: irse mas lejos. Con el lado en infinito el
       cuerpo dobla solo contra la pared y recorre el borde del tablero.   */
    const CELDA = 1 / (VEL * 0.016);              /* cuadros por celda      */
    let g = 0, prev = -1, ri = 0, quiere = 0;
    while (TUT.on && g++ < T) {
      if (TUT.paso !== prev) { hist.push({ paso: TUT.paso, t: g, pista: $('pista').textContent }); prev = TUT.paso; quiere = 0; }
      const yo = P.yo, n = P.M.n;
      /* NADIE CORRE CONTRA LA PARED. Si el rumbo de ahora se acaba en tres
         celdas, se dobla ya: sin esto el driver muere contra el borde y lo
         que se mediria seria el renacimiento, no el gesto.                */
      const pared = (d) => {
        const x = yo.ix + R[d][0] * 3, y = yo.iy + R[d][1] * 3;
        return x < 1 || y < 1 || x > n - 2 || y > n - 2;
      };
      const dAct = R.findIndex((d) => d[0] === yo.dx && d[1] === yo.dy);
      if (--quiere <= 0 || (dAct >= 0 && pared(dAct))) {
        /* del ciclo se toma el primero que no sea media vuelta ni pared */
        for (let k = 0; k < 4; k++) {
          const d = R[(ri + k) % 4];
          if (d[0] === -yo.dx && d[1] === -yo.dy) continue;
          if (pared((ri + k) % 4)) continue;
          this.arrastra(d[0] * 90, d[1] * 90);
          ri = (ri + k + 1) % 4;
          break;
        }
        quiere = TUT.paso >= 3 ? 1e9 : Math.round(9 * CELDA);
      }
      partidaPaso(0.016);
      tutPaso(0.016);
    }
    return { hist, vueltas: g, tutOn: TUT.on, panel: PANEL, fTit: $('fTit').textContent, fDatos: $('fDatos').textContent, visto: PROG.visto };
  },

  /* ── el nivel puesto, jugado solo ──
     ENTRA POR `p.ped`, o sea por el mismo campo que escribe el dedo: un bot
     que escriba `dx`/`dy` estaria jugando otra fisica y ganar no probaria
     nada. `azar` es el control — sin el, que el honesto termine no dice que
     haya una decision adentro.                                           */
  /* Y ARRANCA EL NIVEL ELLA MISMA. Tomando la partida que hubiera puesta,
     lo que se mide al abrir el juego es EL TUTORIAL —que es lo que corre por
     omision— y ese mapa no tiene rival ni meta alcanzable: medido, doce mil
     vueltas llenando el tablero al 100 % sin terminar nunca. Un bot que juega
     otro mapa que el jugador no prueba nada.                               */
  juega(m, nv, modo, tope) {
    juega(m, nv);
    const yo = P.yo;
    yo.bot = modo === 'azar' ? { azar: true } : { per: 0.80 };
    const T = tope || 12000;
    let g = 0;
    while (P.on && !P.fin && g++ < T) partidaPaso(1 / VEL);
    yo.bot = null;
    return {
      fin: P.fin, pct: +(P.pct * 100).toFixed(1), meta: +(P.cfg.meta * 100).toFixed(1),
      cortes: yo.cortes, cerros: yo.cerros, seg: +P.seg.toFixed(1), vueltas: g,
      gano: P.fin === 'gana', panel: PANEL, fTit: $('fTit').textContent,
    };
  },

  /* ── auditorias del modelo puro ── */
  regla() { return auditaRegla(); },
  mapas() { return auditaMapas(); },
  audita(modo) { return auditaTodo(modo); },
  solo(m, n, modo) { return juegaSolo(m, n, modo); },

  /* ── maquetacion ──
     Se mide con `getBoundingClientRect` contra el MARCO y no contra la
     ventana: el juego vive adentro de `#marco`, y medir contra la ventana
     da «entra» siempre en una pantalla grande.                           */
  /* EL ENCUADRE, que desde afuera no se puede preguntar: `V` es un `const` del
     modulo y `page.evaluate` no lo ve. Devuelve lo que decide que se ve —el
     lienzo de verdad, la escala, el centro de camara y cuantas celdas entran—
     mas donde cae el tablero EN PANTALLA, que es la unica forma de comprobar
     que no se sale por un lado.                                             */
  vista() {
    if (!P.on) return { on: false };
    const r = V.cv.getBoundingClientRect(), n = P.M.n;
    /* las cuatro esquinas del tablero, en pixeles de pantalla */
    /* LA CAMARA ES LA ESQUINA DE ARRIBA A LA IZQUIERDA, no el centro, que es
       como lo hace `vpDibuja`: `px(x) = (x - camx) * esc`. Con la cuenta del
       centro esta sonda informaba el tablero cien pixeles corrido y a mitad de
       pantalla, o sea un defecto de encuadre que no existia.                */
    const px = (cx, cy) => [
      r.left + (cx - V.camx) * V.esc,
      r.top + (cy - V.camy) * V.esc,
    ];
    const a = px(0, 0), b = px(n, n);
    return {
      on: true, n, dpr: V.dpr, esc: +V.esc.toFixed(3),
      cam: [+V.camx.toFixed(2), +V.camy.toFixed(2)],
      vis: [+V.visW.toFixed(2), +V.visH.toFixed(2)],
      lienzo: [Math.round(r.width), Math.round(r.height), V.W, V.H],
      tablero: [Math.round(a[0]), Math.round(a[1]), Math.round(b[0]), Math.round(b[1])],
      yo: P.yo ? [P.yo.ix, P.yo.iy] : null,
    };
  },

  cajas() {
    const ids = ['vidas', 'nivRot', 'bPausa', 'barra', 'mini', 'pista', 'tSalt', 'pct', 'reloj', 'aviso'];
    const R = [], vis = [];
    for (const id of ids) {
      const e = $(id); if (!e) continue;
      const s = getComputedStyle(e);
      if (s.display === 'none' || s.visibility === 'hidden' || +s.opacity < 0.05) continue;
      const c = e.getBoundingClientRect();
      if (c.width < 1 || c.height < 1) continue;
      R.push({ id, x: c.left, y: c.top, w: c.width, h: c.height }); vis.push(id);
    }
    const m = $('marco').getBoundingClientRect(), ch = [], fuera = [];
    for (let i = 0; i < R.length; i++) {
      const a = R[i];
      if (a.x < m.left - 1 || a.y < m.top - 1 || a.x + a.w > m.right + 1 || a.y + a.h > m.bottom + 1) fuera.push(a.id);
      for (let j = i + 1; j < R.length; j++) {
        const b = R[j];
        if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) ch.push(a.id + '×' + b.id);
      }
    }
    return { vis, choques: ch, fuera, marco: [Math.round(m.width), Math.round(m.height)] };
  },

  /* cada panel se enciende para medirlo y se devuelve como estaba: un panel
     medido con `display:none` da caja cero y aprueba cualquier cosa.     */
  paneles() {
    const out = {}, m = $('marco').getBoundingClientRect();
    for (const id of ['pIdioma', 'pMenu', 'pNiv', 'pAj', 'pPausa', 'pFin']) {
      const e = $(id); if (!e) continue;
      const pre = e.classList.contains('on');
      e.classList.add('on');
      const hs = [...e.querySelectorAll('button,h1,h2,.sub,.pie,.aj,#nvGrid,#nvMundos')].filter(x => x.offsetWidth > 0);
      let alto = 0, cortado = 0;
      for (const x of hs) {
        const c = x.getBoundingClientRect();
        alto = Math.max(alto, c.bottom - m.top);
        if (c.bottom > m.bottom + 1 || c.top < m.top - 1) cortado++;
      }
      out[id] = { n: hs.length, alto: Math.round(alto), cortado };
      if (!pre) e.classList.remove('on');
    }
    return out;
  },

  /* ── audio ──
     MIDE UN EFECTO BARRIENDOLO ENTERO: la ventana del analizador son 42,7 ms
     y un efecto dura entre 200 y 700, asi que una sola lectura cae donde
     caiga y lo que devuelve es la cama. Y el fondo se mide ANTES con la
     misma regla — comparar contra un numero sacado de otra ventana no
     significa nada.                                                      */
  sonMide(k, arg, ms) {
    auArranca(); auDesp();
    if (!AU.on) return Promise.resolve({ on: false });
    const d = new Float32Array(AU.an.fftSize), T = ms || 900;
    const lee = () => {
      AU.an.getFloatTimeDomainData(d);
      let p = 0, s = 0;
      for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > p) p = v; s += d[i] * d[i]; }
      return { p, r: Math.sqrt(s / d.length) };
    };
    return new Promise(res => {
      let fp = 0, fr = 0, n0 = 0;
      const t0 = setInterval(() => {
        const x = lee(); if (x.p > fp) fp = x.p; if (x.r > fr) fr = x.r;
        if (++n0 < 14) return;
        clearInterval(t0);
        son(k, arg);
        let pp = 0, rr = 0, n = 0;
        const t1 = setInterval(() => {
          const y = lee(); if (y.p > pp) pp = y.p; if (y.r > rr) rr = y.r;
          if (++n < Math.ceil(T / 16)) return;
          clearInterval(t1);
          res({ on: true, k, fondoPico: +fp.toFixed(4), fondoRms: +fr.toFixed(4),
                pico: +pp.toFixed(4), rms: +rr.toFixed(4), veces: +(rr / (fr || 1e-9)).toFixed(2) });
        }, 16);
      }, 16);
    });
  },
  son(k, arg) { auArranca(); auDesp(); son(k, arg); return { on: AU.on, acorde: AU.acorde, abre: +AU.abre.toFixed(3) }; },
  audio(ms) {
    if (!AU.on) return Promise.resolve({ on: false });
    const d = new Float32Array(AU.an.fftSize);
    return new Promise(res => setTimeout(() => {
      AU.an.getFloatTimeDomainData(d);
      let p = 0, s = 0;
      for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > p) p = v; s += d[i] * d[i]; }
      res({ on: true, pico: +p.toFixed(4), rms: +Math.sqrt(s / d.length).toFixed(4), acorde: AU.acorde, abre: +AU.abre.toFixed(3) });
    }, ms || 320));
  },

  costo(n) {
    if (!P.on) return { err: 'no hay partida' };
    const N = n || 90, t0 = performance.now();
    for (let i = 0; i < N; i++) vpDibuja(P.M, 0.016);
    return { ms: +((performance.now() - t0) / N).toFixed(3), n: N, dpr: V.dpr, w: V.W, h: V.H };
  },
};
</script></body></html>
