/* ── LA UNICA REGLA DEL JUEGO ─────────────────────────────────────────────
   Una flecha sale deslizandose POR SU PROPIO TRAZADO, como una serpiente que
   se mete en su propio tubo, y cuando la cabeza pasa el borde sigue derecho.
   De ahi sale un teorema que es TODO el juego:

     las unicas celdas nuevas que la pieza llega a ocupar son las del RAYO
     que va de su cabeza al borde en la direccion de su punta.

   El cuerpo recorre celdas que la pieza YA ocupa —son suyas— asi que no
   pueden estorbarle. Por lo tanto:

     una flecha puede salir  <=>  el rayo desde su cabeza esta libre.

   Eso es lo que hace que el generador pueda ser correcto por construccion y
   que el dibujo y la regla no se puedan desincronizar: hay UNA cuenta.     */

function nuevoTab(nx, ny) {
  return { nx, ny, piezas: [], ocu: new Int16Array(nx * ny).fill(-1) };
}
const idx = (T, x, y) => y * T.nx + x;
const dentro = (T, x, y) => x >= 0 && y >= 0 && x < T.nx && y < T.ny;

/* La direccion de salida sale del ULTIMO SEGMENTO del trazado y no se guarda
   aparte: guardada, un trazado editado y una direccion vieja apuntan a lados
   distintos y la punta dibujada miente sobre por donde sale.               */
function dirDe(p) {
  const n = p.cel.length, a = p.cel[n - 2], b = p.cel[n - 1];
  const dx = b[0] - a[0], dy = b[1] - a[1];
  for (let d = 0; d < 4; d++) if (DIR[d][0] === dx && DIR[d][1] === dy) return d;
  return 0;
}

/* El rayo: de la cabeza al borde, sin contar la cabeza. Devuelve las celdas,
   que ademas son por donde el cuerpo se va a estirar al salir — el dibujo de
   la salida usa ESTA lista, no una copia.                                  */
function rayo(T, p) {
  const n = p.cel.length, h = p.cel[n - 1], d = DIR[dirDe(p)], r = [];
  let x = h[0] + d[0], y = h[1] + d[1];
  while (dentro(T, x, y)) { r.push([x, y]); x += d[0]; y += d[1]; }
  return r;
}
function puedeSalir(T, p) {
  const n = p.cel.length, h = p.cel[n - 1], d = DIR[dirDe(p)];
  let x = h[0] + d[0], y = h[1] + d[1];
  while (dentro(T, x, y)) {
    const o = T.ocu[idx(T, x, y)];
    if (o !== -1 && o !== p.i) return false;
    x += d[0]; y += d[1];
  }
  return true;
}
/* Quien bloquea: lo necesita la sacudida de la pieza que estorba, que es la
   unica forma de ENSENIAR la regla sin escribirla en un cartel.            */
function quienBloquea(T, p) {
  const n = p.cel.length, h = p.cel[n - 1], d = DIR[dirDe(p)];
  let x = h[0] + d[0], y = h[1] + d[1];
  while (dentro(T, x, y)) {
    const o = T.ocu[idx(T, x, y)];
    if (o !== -1 && o !== p.i) return o;
    x += d[0]; y += d[1];
  }
  return -1;
}
function largoRayo(T, x, y, D) {
  let n = 0, cx = x + D[0], cy = y + D[1];
  while (dentro(T, cx, cy)) { n++; cx += D[0]; cy += D[1]; }
  return n;
}
function pon(T, p) { for (const c of p.cel) T.ocu[idx(T, c[0], c[1])] = p.i; }
function quita(T, p) { for (const c of p.cel) T.ocu[idx(T, c[0], c[1])] = -1; }
const vivas = T => T.piezas.filter(p => !p.fuera);
const legales = T => vivas(T).filter(p => puedeSalir(T, p));

/* ── EL GENERADOR VA AL REVES, Y POR ESO NO PUEDE GENERAR UN NIVEL IMPOSIBLE
   Se arranca del tablero VACIO y se meten piezas de a una, exigiendo que el
   rayo de la que entra este libre EN ESE MOMENTO. Hacia adelante eso dice
   exactamente que la ultima insertada es la primera que puede salir, y
   sacandola queda el estado de antes de insertarla — o sea que el orden
   inverso de insercion ES una solucion, y existe por construccion.
   Y no es que el orden sea unico: al insertar la pieza k+1 se le puede tapar
   el rayo a la k, y ahi aparece la dependencia que hace que haya que pensar. */
/* Cuantas veces seguidas puede fallar una colocacion antes de dar el tablero
   por lleno. Cada falla cuesta doce barridos del tablero, asi que el techo de
   trabajo por nivel es PACIENCIA*12*celdas — con 220 y el mundo mas grande,
   377 mil comprobaciones, que es nada. Lo que compra es que el generador se
   entere de que el tablero esta lleno en vez de seguir intentando.        */
const PACIENCIA = 220;
function genTablero(cfg) {
  const rnd = azar(cfg.sem);
  const T = nuevoTab(cfg.nx, cfg.ny);
  const orden = [];                    /* el orden de insercion */
  let n0 = 0, fallas = 0;                /* n0: cuantas de rayo cero van */
  const NC = cfg.nx * cfg.ny;
  const bloqM = new Int32Array(NC);      /* cuantos rayos ajenos cruzan cada celda */
  const bloqQ = [];                      /* y de quienes: uno por celda */
  for (let i = 0; i < NC; i++) bloqQ.push([]);
  const reBloq = () => {
    bloqM.fill(0); for (let i = 0; i < NC; i++) bloqQ[i].length = 0;
    for (const p of T.piezas) for (const c of rayo(T, p)) {
      const k = idx(T, c[0], c[1]); bloqM[k]++; bloqQ[k].push(p.i);
    }
  };

  /* EL BUCLE SE CORTA POR FALLAS SEGUIDAS Y NO POR UN TOPE DE INTENTOS, y eso
     no es prolijidad: es lo unico que hace que la segunda fase EXISTA.
     Medido con el tope: los mundos 4, 5 y 6 salian SIEMPRE por agotar los
     intentos sin llegar siquiera a `cfg.n` piezas —18,4 de 22,5 pedidas en el
     mundo 6— asi que la fase de cierre no corria NI UNA VEZ en veinte niveles
     y `legales` se quedaba donde cayera. Y el motivo estaba a la vista en el
     desglose: 75.103 de 95.400 pruebas no encontraban NI UNA posicion
     candidata, porque con el tablero al 70 % casi ningun rayo llega libre al
     borde. O sea que el numero de piezas no es algo que se pida: es lo que el
     tablero da. Se pide un PISO, se persigue el numero de legales, y se para
     cuando el tablero deja de admitir nada — que es lo que `fallas` mide.

     DOS FASES, Y LA SEGUNDA ES LA QUE HACE EL JUEGO. La primera llena hasta
     el piso `cfg.n`. Medido ahi, la curva se PLANCHA a partir del tercer
     mundo —`legales/piezas` clavado en 0,42 del 3 al 6— porque ponderar y
     esperar que las piezas se tapen solas es rezar. La segunda persigue el
     numero: mientras queden mas legales que `cfg.lib` se siguen metiendo
     piezas ELEGIDAS POR CUANTAS LEGALES TAPAN, y la que no tapa ninguna se
     descarta. El nivel no se puede volver imposible haciendo eso: la que
     entra tiene el rayo libre en ese momento, asi que ella misma es la
     primera que puede salir.                                              */
  const objetivo = () => legales(T).length;
  while (fallas < PACIENCIA) {
    if (T.piezas.length >= cfg.n && objetivo() <= cfg.lib) break;
    const cierre = T.piezas.length >= cfg.n;
    if (T.piezas.length >= cfg.n + cfg.extra) break;
    reBloq();
    /* en la fase de cierre solo cuentan las piezas que HOY pueden salir:
       tapar una que ya esta tapada no baja el numero que se persigue */
    const legAhora = cierre ? new Set(legales(T).map(p => p.i)) : null;
    /* MEJOR DE VARIAS. La primera version elegia una posicion y la usaba, y
       medido daba `azar 1,000` en los 120 niveles: cualquier orden servia, o
       sea que el juego no pedia NADA. La palanca no es poner mas piezas sino
       poner cada una donde TAPE el rayo de las que ya estan — eso es lo que
       crea la dependencia que hay que deducir. Se arman varias candidatas
       validas y gana la que tapa a mas piezas distintas.                   */
    let mejor = null, mejorPt = -1, mejorLr = 1;
    for (let intento = 0; intento < 12; intento++) {
    /* EN EL CIERRE SE PRUEBAN LAS CUATRO DIRECCIONES Y NO UNA AL AZAR. La
       fase de cierre busca una aguja en un pajar —una cabeza con el rayo
       libre cuyo CUERPO ademas tape el rayo de una legal— y sortear la
       direccion tira tres cuartos de las posiciones posibles en cada prueba.
       Con `intento & 3` las cuatro entran siempre y no cuesta un scan mas.  */
    const d = cierre ? (intento & 3) : ((rnd() * 4) | 0), D = DIR[d], B = DIR[d ^ 1];

    /* CANDIDATAS A CABEZA: libres y con el rayo libre. Y ponderadas por
       vecinos ocupados, que es lo que hace que el tablero quede COMPACTO en
       vez de una lluvia de piezas sueltas: sin la ponderacion el nivel se ve
       a manchas y encima casi todas las piezas tienen el rayo libre, o sea
       que no hay orden que deducir.                                        */
    const cand = [];
    for (let y = 0; y < T.ny; y++) for (let x = 0; x < T.nx; x++) {
      if (T.ocu[idx(T, x, y)] !== -1) continue;
      const bx = x + B[0], by = y + B[1];        /* la celda de atras tiene que entrar */
      if (!dentro(T, bx, by) || T.ocu[idx(T, bx, by)] !== -1) continue;
      let lx = x + D[0], ly = y + D[1], ok = true;
      while (dentro(T, lx, ly)) {
        if (T.ocu[idx(T, lx, ly)] !== -1) { ok = false; break; }
        lx += D[0]; ly += D[1];
      }
      if (!ok) continue;
      let vec = 0;
      for (let k = 0; k < 4; k++) {
        const ax = x + DIR[k][0], ay = y + DIR[k][1];
        if (!dentro(T, ax, ay) || T.ocu[idx(T, ax, ay)] !== -1) vec++;
      }
      /* EL LARGO DEL RAYO MANDA, y es la correccion mas cara de este juego.
         Sin ella, medido, DIEZ de diecisiete piezas salian con rayo de largo
         CERO: pegadas al borde y apuntando hacia afuera, o sea legales
         siempre y sin nada que leer. La razon es que la condicion de
         insercion —«el rayo tiene que estar libre»— es trivial de cumplir en
         el borde, asi que el generador se amontonaba ahi. Una flecha que
         apunta hacia ADENTRO tiene que cruzar el amontonamiento entero, y es
         la unica que otra puede tapar.
         El rayo corto no se prohibe: una flecha que sale de una son las que
         hacen que el nivel se pueda empezar. Lo que se hace es que sean
         POCAS.                                                             */
      const lr = largoRayo(T, x, y, D);
      if (lr === 0 && n0 >= cfg.b0) continue;   /* el tope de rayo cero es DURO */
      const wR = lr === 0 ? 1 : (lr === 1 ? 3 : 12 + lr * 3);
      cand.push({ x, y, lr, peso: (1 + vec * vec * 3) * (1 + bloqM[idx(T, x, y)] * 4) * wR });
    }
    if (!cand.length) continue;

    let tot = 0; for (const c of cand) tot += c.peso;
    let r = rnd() * tot, sel = cand[cand.length - 1];
    for (const c of cand) { r -= c.peso; if (r <= 0) { sel = c; break; } }

    /* EL CUERPO SE CONSTRUYE HACIA ATRAS, y el primer paso es forzosamente la
       opuesta de la salida: la punta apunta a lo largo del ultimo segmento.
       Despues puede doblar, pero nunca 180 grados — eso seria pisarse a si
       misma, y una pieza que se pisa no puede deslizarse por su trazado.   */
    const largo = cfg.lmin + ((rnd() * (cfg.lmax - cfg.lmin + 1)) | 0);
    const cel = [[sel.x, sel.y]];
    const usa = new Set([sel.y * T.nx + sel.x]);
    let cx = sel.x, cy = sel.y, cd = d ^ 1;      /* hacia donde retrocede */
    let ok = true;
    for (let s = 1; s < largo; s++) {
      /* y en el cierre se mira doblar casi siempre: el que dobla es el
         cuerpo, y el cuerpo es lo que tapa */
      if (s > 1 && rnd() < (cierre ? 0.85 : cfg.dobla)) {
        /* doblar: las dos perpendiculares, y entre las dos gana la que cruza
           mas rayos ajenos — el trazado es el que hace el bloqueo, asi que
           doblar al azar desperdicia la mitad de la palanca */
        const per = (cd === 0 || cd === 1) ? [2, 3] : [0, 1];
        if (rnd() < 0.5) per.reverse();
        let elg = -1, elgPt = -1;
        for (const nd of per) {
          const nx2 = cx + DIR[nd][0], ny2 = cy + DIR[nd][1];
          if (!dentro(T, nx2, ny2) || T.ocu[idx(T, nx2, ny2)] !== -1 || usa.has(ny2 * T.nx + nx2)) continue;
          const pt = bloqM[idx(T, nx2, ny2)];
          if (pt > elgPt) { elgPt = pt; elg = nd; }
        }
        if (elg >= 0) cd = elg;
      }
      const nx2 = cx + DIR[cd][0], ny2 = cy + DIR[cd][1];
      if (!dentro(T, nx2, ny2) || T.ocu[idx(T, nx2, ny2)] !== -1 || usa.has(ny2 * T.nx + nx2)) {
        /* no se puede seguir: la pieza vale igual si ya llego al minimo */
        if (cel.length >= cfg.lmin) break;
        ok = false; break;
      }
      cel.unshift([nx2, ny2]); usa.add(ny2 * T.nx + nx2); cx = nx2; cy = ny2;
    }
    if (!ok || cel.length < 2) continue;

    /* cuantas PIEZAS DISTINTAS quedan tapadas por este trazado: contar celdas
       premiaria una pieza larga que cruza cuatro veces el rayo de la misma,
       y eso no crea ninguna dependencia nueva */
    const tap = new Set();
    for (const c of cel) for (const q of bloqQ[idx(T, c[0], c[1])]) if (!legAhora || legAhora.has(q)) tap.add(q);
    if (cierre && tap.size === 0) continue;      /* en el cierre, una pieza que no tapa nada solo estorba */
    const pt = tap.size * 10 + cel.length;
    if (pt > mejorPt) { mejorPt = pt; mejor = cel; mejorLr = sel.lr; }
    }   /* fin de las candidatas */

    if (!mejor) { fallas++; continue; }
    fallas = 0;
    if (mejorLr === 0) n0++;
    const p = { i: T.piezas.length, cel: mejor, fuera: false };
    T.piezas.push(p); pon(T, p); orden.push(p.i);
  }
  T.orden = orden.slice().reverse();     /* una solucion, por construccion */
  return T;
}

/* ── EL VALIDADOR ES INDEPENDIENTE DEL GENERADOR ──────────────────────────
   De nada sirve un validador que aprueba el juego que el generador cree haber
   hecho: tiene que buscar la solucion SOLO, con la misma `puedeSalir` que usa
   el dedo del jugador. DFS con memoria de estados muertos sobre la mascara de
   piezas que quedan — la mayoria de las 2^n mascaras no se alcanzan nunca. */
function resuelve(T, topeNodos) {
  const n = T.piezas.length;
  if (n === 0) return { ok: true, orden: [], nodos: 0 };
  if (n > 30) return { ok: false, orden: null, nodos: 0, motivo: 'demasiadas' };
  const ocu = Int16Array.from(T.ocu);
  const W = { nx: T.nx, ny: T.ny, ocu };
  const malos = new Set();
  const sol = [];
  let nodos = 0, tope = topeNodos || 400000, corto = false;

  const libre = p => {
    const m = p.cel.length, h = p.cel[m - 1], d = DIR[dirDe(p)];
    let x = h[0] + d[0], y = h[1] + d[1];
    while (x >= 0 && y >= 0 && x < W.nx && y < W.ny) {
      const o = ocu[y * W.nx + x];
      if (o !== -1 && o !== p.i) return false;
      x += d[0]; y += d[1];
    }
    return true;
  };

  function dfs(mask) {
    if (mask === 0) return true;
    if (malos.has(mask)) return false;
    if (++nodos > tope) { corto = true; return false; }
    for (let i = 0; i < n; i++) {
      if (!(mask & (1 << i))) continue;
      const p = T.piezas[i];
      if (!libre(p)) continue;
      for (const c of p.cel) ocu[c[1] * W.nx + c[0]] = -1;
      sol.push(i);
      if (dfs(mask & ~(1 << i))) return true;
      sol.pop();
      for (const c of p.cel) ocu[c[1] * W.nx + c[0]] = i;
      if (corto) return false;
    }
    malos.add(mask);
    return false;
  }
  const ok = dfs((1 << n) - 1);
  return { ok, orden: ok ? sol.slice() : null, nodos, corto };
}

/* ── LOS DOS AUTO-JUGADORES ───────────────────────────────────────────────
   El honesto resuelve y ejecuta; el del azar toca al azar entre las legales.
   La SEPARACION entre los dos es la unica prueba de que hay una decision
   adentro: si el que toca al azar termina el nivel, el nivel no pide nada. */
function juegaSolo(T0, modo, sem) {
  const T = clonaTab(T0);
  if (modo === 'honesto') {
    const r = resuelve(T);
    if (!r.ok) return { gano: false, toques: 0, motivo: 'sin solucion' };
    let t = 0;
    for (const i of r.orden) {
      const p = T.piezas[i];
      if (!puedeSalir(T, p)) return { gano: false, toques: t, motivo: 'la solucion no se puede jugar' };
      quita(T, p); p.fuera = true; t++;
    }
    return { gano: vivas(T).length === 0, toques: t };
  }
  const rnd = azar(sem || 12345);
  let t = 0, fallos = 0;
  while (vivas(T).length) {
    const L = legales(T);
    if (!L.length) return { gano: false, toques: t, fallos, motivo: 'trabado' };
    /* EL BOT QUE IMPORTA ES ESTE. Toca al azar ENTRE LAS LEGALES, o sea que
       mira el camino pero no piensa el orden: si gana siempre, el orden no
       decide nada y el nivel es un tramite. El de mas abajo —que ni mira— es
       el control de que la regla del camino existe.                        */
    if (modo === 'legal') {
      const p = L[(rnd() * L.length) | 0];
      quita(T, p); p.fuera = true; t++; continue;
    }
    /* el del azar toca CUALQUIER pieza viva, no solo las legales: es lo que
       hace un jugador que no mira el camino, y las que estan bloqueadas son
       las que le cuestan una vida */
    const V = vivas(T), p = V[(rnd() * V.length) | 0];
    if (!puedeSalir(T, p)) { fallos++; if (fallos > 400) return { gano: false, toques: t, fallos, motivo: 'no acierta' }; continue; }
    quita(T, p); p.fuera = true; t++;
  }
  return { gano: true, toques: t, fallos };
}

function clonaTab(T) {
  const C = nuevoTab(T.nx, T.ny);
  C.piezas = T.piezas.map(p => ({ i: p.i, cel: p.cel.map(c => [c[0], c[1]]), fuera: false }));
  for (const p of C.piezas) pon(C, p);
  C.orden = T.orden ? T.orden.slice() : null;
  return C;
}

/* ── LA AUDITORIA ─────────────────────────────────────────────────────────
   Un nivel generado y no jugado es un nivel roto que todavia no se sabe. Se
   comprueba: que exista solucion buscada por el validador, que la solucion se
   pueda ejecutar de verdad, que la cantidad de piezas sea la pedida, y —lo
   que decide si el nivel es un juego o un tramite— cuantas piezas se pueden
   sacar en el primer toque y si el que toca al azar lo termina.            */
function auditaNivel(m, n) {
  const cfg = cfgNivel(m, n);
  const T = genTablero(cfg);
  const nP = T.piezas.length;
  const r = resuelve(T);
  const h = juegaSolo(T, 'honesto');
  /* LA METRICA DE ESTE JUEGO NO ES «GANA O PIERDE», Y ESO SALIO DE UN
     TEOREMA: sacar una pieza solo puede LIBERAR rayos, nunca taparlos, asi
     que el conjunto de legales solo crece y cualquier orden legal termina el
     tablero. O sea que el juego no es de ORDEN sino de LECTURA, y lo que hay
     que medir es cuan probable es acertar sin mirar el camino:
       pAcierto  = legales/vivas promediado a lo largo de la partida
       fallosAzar = toques errados de quien no mira, hasta vaciar el tablero
     Con tres vidas, un `fallosAzar` alto significa que el que no lee pierde.  */
  const S = clonaTab(T); let acum = 0, pasos = 0;
  while (vivas(S).length) {
    const V = vivas(S), L = legales(S);
    acum += L.length / V.length; pasos++;
    const p = L[0]; quita(S, p); p.fuera = true;
  }
  const pAcierto = pasos ? acum / pasos : 1;
  let fallos = 0;
  for (let s = 0; s < 8; s++) fallos += juegaSolo(T, 'azar', cfg.sem + s * 977).fallos | 0;
  let celdas = 0; for (const p of T.piezas) celdas += p.cel.length;
  return {
    m, n, piezas: nP, pedidas: cfg.n, celdas,
    densidad: +(celdas / (cfg.nx * cfg.ny)).toFixed(3),
    ok: r.ok && h.gano && nP >= 2,
    libres: legales(T).length, nodos: r.nodos,
    pAcierto: +pAcierto.toFixed(3), fallos: +(fallos / 8).toFixed(1),
    largoMedio: +(celdas / nP).toFixed(2),
  };
}
function auditaTodo() {
  const t0 = Date.now(); const malos = []; let sumLib = 0, sumAc = 0, sumDen = 0, sumP = 0, maxNod = 0, sumFa = 0, sumLg = 0;
  for (let m = 0; m < MUNDOS.length; m++) for (let n = 0; n < NIV_MUNDO; n++) {
    const a = auditaNivel(m, n);
    if (!a.ok) malos.push(m + '-' + n);
    sumLib += a.libres; sumAc += a.pAcierto; sumDen += a.densidad;
    sumP += a.piezas; sumFa += a.fallos; sumLg += a.largoMedio;
    if (a.nodos > maxNod) maxNod = a.nodos;
  }
  const N = NIVELES;
  return {
    niveles: N, malos, ms: Date.now() - t0,
    libresMedio: +(sumLib / N).toFixed(2), pAciertoMedio: +(sumAc / N).toFixed(3),
    fallosMedio: +(sumFa / N).toFixed(1), largoMedio: +(sumLg / N).toFixed(2),
    densidadMedia: +(sumDen / N).toFixed(3), piezasMedio: +(sumP / N).toFixed(1), maxNodos: maxNod,
  };
}
/* ══════════════════════════════════════════════════════════════════════════
   D · AUDIO
   Procedural y sin un byte de asset, y aca eso ademas es lo correcto: los
   sonidos de este juego son un roce de papel y un golpe seco, que es ruido
   filtrado — un clip grabado pesa cientos de kilobytes y encima se corta en
   cada vuelta del bucle. Todo cuelga de UN maestro para que el analizador de
   las sondas pueda decir si algo sono de verdad.
   ══════════════════════════════════════════════════════════════════════════ */
const AU = { ctx: null, maes: null, mus: null, fx: null, an: null, ruido: null, on: false, latido: null, acorde: 0 };

/* Un solo bufer de ruido de un segundo, generado una vez. Cada roce lo
   reproduce con otro filtro y otro sobre: dos rellenos de ruido distintos
   cuestan lo mismo que dos filtros y pesan el doble.                       */
function auRuido() {
  if (AU.ruido) return AU.ruido;
  const n = AU.ctx.sampleRate, b = AU.ctx.createBuffer(1, n, n), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  AU.ruido = b; return b;
}

function auArranca() {
  if (AU.on) return;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try { AU.ctx = new C(); } catch (e) { return; }
  AU.maes = AU.ctx.createGain(); AU.maes.gain.value = 0.9;
  AU.an = AU.ctx.createAnalyser(); AU.an.fftSize = 2048;
  AU.maes.connect(AU.an); AU.an.connect(AU.ctx.destination);
  AU.mus = AU.ctx.createGain(); AU.mus.gain.value = PROG.vol; AU.mus.connect(AU.maes);
  AU.fx = AU.ctx.createGain();  AU.fx.gain.value  = PROG.fx;  AU.fx.connect(AU.maes);
  AU.on = true;
  auCama();
}
function auDesp() { if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); }
function auVol() { if (!AU.on) return; AU.mus.gain.value = PROG.vol; AU.fx.gain.value = PROG.fx; }

/* ── LA CAMA ──────────────────────────────────────────────────────────────
   Cuatro senos DOBLADOS y desafinados un pelo entre si: dos senos identicos
   suenan a tono de prueba y dos que baten cada varios segundos suenan a
   instrumento. Encima un pasabajos que se abre y se cierra cada 21 s — eso
   es lo que hace que respire en vez de zumbar.                             */
const AU_ESC = [0, 3, 5, 7, 10];                 /* pentatonica menor       */
const AU_RAIZ = [55, 58.27, 61.74, 49, 51.91, 46.25];  /* una por mundo     */
function auCama() {
  if (!AU.on) return;
  const c = AU.ctx, t = c.currentTime;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
  lp.frequency.value = 420; lp.connect(AU.mus);
  const lfo = c.createOscillator(), lg = c.createGain();
  lfo.frequency.value = 1 / 21; lg.gain.value = 210;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t);
  AU.cama = { lp, voces: [] };
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 2; j++) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; g.gain.value = 0.028 / (1 + i * 0.5);
      o.connect(g); g.connect(lp); o.start(t);
      AU.cama.voces.push({ o, g, i, det: j ? 1.00023 : 1 });
    }
  }
  auAcorde(0);
}
/* Cada mundo TRANSPONE la raiz; no cambia de tema. Seis temas serian seis
   cortes, y este juego no tiene un solo corte.                             */
function auAcorde(m) {
  if (!AU.on || !AU.cama) return;
  AU.acorde = m;
  const r = AU_RAIZ[cl(m, 0, AU_RAIZ.length - 1)], t = AU.ctx.currentTime;
  const gr = [0, 12, 19, 24];
  for (const v of AU.cama.voces) {
    const f = r * Math.pow(2, (gr[v.i] + (v.i === 3 ? AU_ESC[2] : 0)) / 12) * v.det;
    v.o.frequency.setTargetAtTime(f, t, 0.9);
  }
}

/* ── LOS EFECTOS ─────────────────────────────────────────────────────────
   LA ESCALA ESTA MEDIDA CON `sonMide`, QUE BARRE EL CLIP ENTERO. La ventana
   del analizador son 42,7 ms y un efecto dura entre 200 y 700, asi que una
   sola lectura cae donde caiga y devuelve la cama: medido asi, `sale` daba
   0,94 VECES EL FONDO —o sea que el acto central del juego sonaba mas flojo
   que el silencio— y la fanfarria 1,22. La causa eran ocho senos de la cama
   que se refuerzan entre si contra efectos de 200 ms; la cama bajo a un
   tercio y los efectos subieron. `sale` es el que mas se dispara —uno por
   flecha— asi que queda por debajo de ganar, que es el acontecimiento.    */
function auEnv(g, t, a, d, pico) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(pico, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function auTono(f, t, dur, pico, tipo) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = tipo || 'sine'; o.frequency.setValueAtTime(f, t);
  o.connect(g); g.connect(AU.fx);
  auEnv(g, t, 0.008, dur, pico);
  o.start(t); o.stop(t + dur + 0.06);
  return o;
}
function auRoce(t, dur, f0, f1, pico, q) {
  const c = AU.ctx, s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
  s.buffer = auRuido(); s.loop = true;
  bp.type = 'bandpass'; bp.Q.value = q || 1.1;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  s.connect(bp); bp.connect(g); g.connect(AU.fx);
  auEnv(g, t, 0.012, dur, pico);
  s.start(t); s.stop(t + dur + 0.08);
}
function son(k) {
  if (!AU.on) return;
  auDesp();
  const t = AU.ctx.currentTime;
  switch (k) {
    /* la flecha corriendose: papel sobre papel, agudo y corto */
    /* la Q ABIERTA no es un gusto: un pasabanda estrecho sobre ruido blanco se
       come casi toda la energia — medido, con Q 1,3 `sale` daba 1,28 veces el
       fondo por mas que se le subiera el pico. Es el mismo defecto que en
       POMPOM dejaba el sonido de reventar doce veces por debajo.           */
    case 'sale':  auRoce(t, 0.20, 1500, 3800, 0.55, 0.8); auTono(520, t, 0.10, 0.10, 'sine'); break;
    /* la que no puede: golpe seco y grave — NO es un pitido de error, es la
       flecha chocando con la que esta adelante                              */
    case 'mal':   auRoce(t, 0.11, 420, 150, 0.30, 2.6); auTono(96, t, 0.13, 0.26, 'triangle'); break;
    case 'vida':  auTono(330, t, 0.16, 0.22, 'triangle'); auTono(220, t + 0.09, 0.24, 0.20, 'triangle'); break;
    case 'ui':    auTono(880, t, 0.05, 0.10, 'sine'); break;
    case 'des':   auRoce(t, 0.16, 2600, 900, 0.18, 1.4); break;
    case 'gana': { const r = 440, g = [0, 4, 7, 12];
      for (let i = 0; i < 4; i++) auTono(r * Math.pow(2, g[i] / 12), t + i * 0.075, 0.30, 0.20, 'sine');
      auRoce(t, 0.5, 900, 4200, 0.11, 0.9); break; }
    case 'perf': { const r = 523.25, g = [0, 4, 7, 12, 16, 19];
      for (let i = 0; i < 6; i++) auTono(r * Math.pow(2, g[i] / 12), t + i * 0.068, 0.42, 0.19, 'sine');
      auRoce(t, 0.7, 1100, 5200, 0.13, 0.9); break; }
    case 'trab':  auTono(160, t, 0.30, 0.20, 'sawtooth'); auTono(151, t, 0.30, 0.16, 'sawtooth'); break;
  }
}
/* Agacha la cama mientras suena algo que hay que escuchar: sin esto la
   fanfarria compite con el pad y ninguna de las dos se oye.                */
function auAgacha(f, dur) {
  if (!AU.on) return;
  const t = AU.ctx.currentTime, g = AU.mus.gain;
  g.cancelScheduledValues(t);
  g.setTargetAtTime(PROG.vol * f, t, 0.05);
  g.setTargetAtTime(PROG.vol, t + dur, 0.35);
}
/* ══════════════════════════════════════════════════════════════════════════
   E · ESTADO, ENCUADRE Y DIBUJO
   Todo se dibuja por codigo: no hay una sola imagen en el archivo. Un juego
   de dos colores sobre papel no gana nada con una foto, y una foto pegada
   encima de un dibujo se ve pegada encima.
   ══════════════════════════════════════════════════════════════════════════ */
const JU = {
  T: null, m: 0, n: 0, vidas: VIDAS, toques: 0, fallos: 0,
  fase: 'menu',            /* menu · juega · pausa · fin                    */
  cw: 0, bx: 0, by: 0, bw: 0, bh: 0,
  tinte: '#181614', tut: false, sal: 0,
  rehace: 0,               /* >0: se acabaron las vidas y el tablero NO escucha */
};

let CV = null, CX = null, PXR = 1, ANCHO = 412, ALTO = 892;

function medir() {
  CV = $('cv'); CX = CV.getContext('2d');
  const r = $('marco').getBoundingClientRect();
  ANCHO = Math.round(r.width); ALTO = Math.round(r.height);
  PXR = cl(window.devicePixelRatio || 1, 1, 2.5);
  CV.width = Math.round(ANCHO * PXR); CV.height = Math.round(ALTO * PXR);
  CX.setTransform(PXR, 0, 0, PXR, 0, 0);
  if (JU.T) encuadre();
}

/* ── EL ENCUADRE ──────────────────────────────────────────────────────────
   La celda sale del lado que APRIETA. Con un tamanio escrito a mano, el
   mundo 6 —11x13— se sale por el ancho en un telefono angosto y el mundo 1
   —6x8— queda del tamanio de un sello en uno grande.                      */
const PAD_ARR = 64, PAD_ABJ = 96, PAD_LAT = 15;
function encuadre() {
  const T = JU.T;
  const dw = ANCHO - PAD_LAT * 2, dh = ALTO - PAD_ARR - PAD_ABJ;
  JU.cw = Math.floor(Math.min(dw / T.nx, dh / T.ny));
  JU.bw = JU.cw * T.nx; JU.bh = JU.cw * T.ny;
  JU.bx = Math.round((ANCHO - JU.bw) / 2);
  JU.by = Math.round(PAD_ARR + (dh - JU.bh) / 2);
}
const pcx = x => JU.bx + (x + 0.5) * JU.cw;
const pcy = y => JU.by + (y + 0.5) * JU.cw;

/* ── EL CAMINO DE UNA PIEZA ───────────────────────────────────────────────
   Cuerpo + rayo + un poco mas alla del borde. El rayo sale de `rayo()`, la
   MISMA funcion con la que la regla decide si puede salir: asi lo que se ve
   deslizarse y lo que la regla midio no pueden ser dos cosas distintas.    */
function caminoDe(T, p) {
  const d = DIR[dirDe(p)], pts = [];
  for (const c of p.cel) pts.push([pcx(c[0]), pcy(c[1])]);
  const r = rayo(T, p);
  for (const c of r) pts.push([pcx(c[0]), pcy(c[1])]);
  const ult = p.cel[p.cel.length - 1];
  let x = ult[0] + (r.length + 1) * d[0], y = ult[1] + (r.length + 1) * d[1];
  for (let i = 0; i < p.cel.length + 3; i++) {
    pts.push([pcx(x), pcy(y)]); x += d[0]; y += d[1];
  }
  return pts;
}
/* Devuelve el tramo de una polilinea entre dos largos de arco. Es lo que
   hace que la flecha se DESLICE POR SU PROPIO TRAZO en vez de trasladarse
   entera: la cola recorre exactamente el camino que hizo la cabeza.        */
function subPoli(pts, a, b) {
  const out = []; let acu = 0;
  a = Math.max(0, a);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1];
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy);
    if (L < 1e-6) continue;
    const s0 = acu, s1 = acu + L; acu = s1;
    if (s1 < a || s0 > b) continue;
    const ta = cl((a - s0) / L, 0, 1), tb = cl((b - s0) / L, 0, 1);
    const A = [p0[0] + dx * ta, p0[1] + dy * ta], B = [p0[0] + dx * tb, p0[1] + dy * tb];
    if (!out.length) out.push(A);
    out.push(B);
  }
  if (out.length < 2) return null;
  return out;
}

/* ── EL TRAZO ─────────────────────────────────────────────────────────────
   Cuerpo redondeado + punta triangular. La punta se dibuja aparte y no como
   un remate del trazo: un trazo con `lineCap` no puede ser un triangulo, y
   sin triangulo esto no se lee a flecha — se lee a cable.                  */
function trazo(pts, col, gr, alfa) {
  CX.globalAlpha = alfa;
  CX.strokeStyle = col; CX.lineWidth = gr;
  CX.lineJoin = 'round'; CX.lineCap = 'round';
  CX.beginPath(); CX.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) CX.lineTo(pts[i][0], pts[i][1]);
  CX.stroke();
  /* la punta */
  const n = pts.length, a = pts[n - 2], b = pts[n - 1];
  let dx = b[0] - a[0], dy = b[1] - a[1];
  const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
  const px = -dy, py = dx, cwv = JU.cw;
  const tipx = b[0] + dx * cwv * 0.36, tipy = b[1] + dy * cwv * 0.36;
  const bax = b[0] - dx * cwv * 0.10, bay = b[1] - dy * cwv * 0.10;
  const w = cwv * 0.33;
  CX.fillStyle = col;
  CX.beginPath();
  CX.moveTo(tipx, tipy);
  CX.lineTo(bax + px * w, bay + py * w);
  CX.lineTo(bax - px * w, bay - py * w);
  CX.closePath(); CX.fill();
  CX.globalAlpha = 1;
}

/* ── EL PAPEL ── */
function rectRed(x, y, w, h, r) {
  CX.beginPath();
  CX.moveTo(x + r, y);
  CX.arcTo(x + w, y, x + w, y + h, r);
  CX.arcTo(x + w, y + h, x, y + h, r);
  CX.arcTo(x, y + h, x, y, r);
  CX.arcTo(x, y, x + w, y, r);
  CX.closePath();
}
function dibujaPapel() {
  const x = JU.bx, y = JU.by, w = JU.bw, h = JU.bh, r = Math.min(16, JU.cw * 0.5);
  CX.save();
  CX.shadowColor = 'rgba(30,25,18,.20)'; CX.shadowBlur = 16; CX.shadowOffsetY = 6;
  CX.fillStyle = '#fbfaf6'; rectRed(x, y, w, h, r); CX.fill();
  CX.restore();
  /* la reja, apenas: sin ella el papel es un rectangulo y no se ve que las
     flechas caen en casillas — que es lo que hay que poder contar.         */
  CX.save(); rectRed(x, y, w, h, r); CX.clip();
  CX.strokeStyle = 'rgba(24,22,20,.055)'; CX.lineWidth = 1;
  CX.beginPath();
  for (let i = 1; i < JU.T.nx; i++) { CX.moveTo(x + i * JU.cw + .5, y); CX.lineTo(x + i * JU.cw + .5, y + h); }
  for (let j = 1; j < JU.T.ny; j++) { CX.moveTo(x, y + j * JU.cw + .5); CX.lineTo(x + w, y + j * JU.cw + .5); }
  CX.stroke(); CX.restore();
  CX.strokeStyle = 'rgba(24,22,20,.13)'; CX.lineWidth = 1.5;
  rectRed(x + .75, y + .75, w - 1.5, h - 1.5, r); CX.stroke();
}

/* ── UNA PIEZA ── */
function dibujaPieza(p, dt) {
  const T = JU.T, gr = JU.cw * 0.26;
  let col = JU.tinte, alfa = 1, ox = 0, oy = 0;

  if (p.mal > 0) { p.mal -= dt; col = '#c8452f'; }
  if (p.tmb > 0) {
    p.tmb -= dt;
    const k = cl(p.tmb / 0.34, 0, 1), a = JU.cw * 0.16 * k * k;
    const s = Math.sin(p.tmb * 46);
    ox = p.tmbD[0] * a * s; oy = p.tmbD[1] * a * s;
    col = '#c8452f';
  }
  let pts;
  if (p.sal > 0) {
    const cam = caminoDe(T, p);
    const L = (p.cel.length - 1) * JU.cw;
    const R = rayo(T, p).length * JU.cw;
    const tot = L + R + JU.cw * 1.4;
    const s = p.sal * tot;
    pts = subPoli(cam, s, s + L + 0.001);
    if (!pts) return;
  } else {
    pts = p.cel.map(c => [pcx(c[0]), pcy(c[1])]);
  }
  if (pts.length < 2) { const q = pts[0]; pts = [[q[0] - .01, q[1]], q]; }
  if (ox || oy) pts = pts.map(q => [q[0] + ox, q[1] + oy]);
  /* la sombra: una copia corrida, ancha y floja. Es lo unico que despega la
     flecha del papel — sin ella se lee a tinta impresa y no a pieza.       */
  CX.save();
  CX.globalAlpha = 0.13 * alfa;
  CX.strokeStyle = '#2a2520'; CX.lineWidth = gr * 1.05;
  CX.lineJoin = 'round'; CX.lineCap = 'round';
  CX.beginPath(); CX.moveTo(pts[0][0], pts[0][1] + gr * 0.34);
  for (let i = 1; i < pts.length; i++) CX.lineTo(pts[i][0], pts[i][1] + gr * 0.34);
  CX.stroke(); CX.restore();
  trazo(pts, col, gr, alfa);
}

function dibuja(dt) {
  CX.clearRect(0, 0, ANCHO, ALTO);
  if (!JU.T) return;
  dibujaPapel();
  CX.save();
  const r = Math.min(16, JU.cw * 0.5);
  rectRed(JU.bx, JU.by, JU.bw, JU.bh, r); CX.clip();
  for (const p of JU.T.piezas) {
    if (p.fuera && !(p.sal > 0)) continue;
    dibujaPieza(p, dt);
  }
  CX.restore();
}

/* ── EL DEDO ──────────────────────────────────────────────────────────────
   Primero la celda exacta; si esta vacia, la flecha mas cercana dentro de
   media celda. Lo que tiene que costar es LEER cual sale, no clavar el
   pixel: un trazo mide un cuarto de celda y un dedo mide mas que eso.      */
function piezaEn(px, py) {
  const T = JU.T; if (!T) return null;
  const x = Math.floor((px - JU.bx) / JU.cw), y = Math.floor((py - JU.by) / JU.cw);
  if (dentro(T, x, y)) {
    const o = T.ocu[idx(T, x, y)];
    if (o !== -1 && !T.piezas[o].fuera) return T.piezas[o];
  }
  let mejor = null, md = JU.cw * 0.55;
  for (const p of T.piezas) {
    if (p.fuera) continue;
    for (let i = 0; i < p.cel.length - 1; i++) {
      const a = [pcx(p.cel[i][0]), pcy(p.cel[i][1])], b = [pcx(p.cel[i + 1][0]), pcy(p.cel[i + 1][1])];
      const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
      const t = L2 ? cl(((px - a[0]) * dx + (py - a[1]) * dy) / L2, 0, 1) : 0;
      const d = Math.hypot(px - (a[0] + dx * t), py - (a[1] + dy * t));
      if (d < md) { md = d; mejor = p; }
    }
  }
  return mejor;
}
/* ══════════════════════════════════════════════════════════════════════════
   F · EL JUEGO
   Un verbo: tocar una flecha. Todo lo demas sale de `puedeSalir`, que es la
   misma funcion que usan el generador y el validador.

   NO HAY DESHACER, Y NO ES UN OLVIDO. Sacar una pieza solo puede LIBERAR
   rayos —nunca taparlos— asi que el conjunto de legales solo crece: el
   tablero no se puede trabar y el orden no se puede arruinar. Un boton de
   deshacer aca no arreglaria nada y estaria diciendo que el juego se puede
   arruinar. Lo que si cuesta es equivocarse, y eso lo cobran los corazones.
   ══════════════════════════════════════════════════════════════════════════ */

function nuevoNivel(m, n, tut) {
  JU.m = m; JU.n = n; JU.tut = !!tut;
  JU.T = tut ? tabTutorial() : genTablero(cfgNivel(m, n));
  JU.tinte = tut ? '#181614' : MUNDOS[m].tinte;
  JU.vidas = VIDAS; JU.toques = 0; JU.fallos = 0; JU.rehace = 0;
  JU.fase = 'juega'; JU.sal = 0;
  for (const p of JU.T.piezas) { p.sal = 0; p.mal = 0; p.tmb = 0; p.tmbD = [0, 0]; }
  encuadre();
  if (!PANEL) { $('hud').classList.remove('off'); $('pie').classList.remove('off'); }
  pintaHud();
  auAcorde(tut ? 0 : m);
  if (JU.tut) tutArranca(); else pistaVer(null);
}

/* Reiniciar es volver a generar CON LA MISMA SEMILLA: el tablero tiene que
   ser el mismo, porque lo que uno dedujo del intento anterior es justamente
   lo que este juego pide.                                                  */
function reinicia() { nuevoNivel(JU.m, JU.n, JU.tut); son('ui'); }

function pintaHud() {
  const v = $('vidas');
  if (v.children.length !== VIDAS) {
    v.innerHTML = '';
    for (let i = 0; i < VIDAS; i++) { const d = document.createElement('div'); d.className = 'cor'; v.appendChild(d); }
  }
  for (let i = 0; i < VIDAS; i++) v.children[i].classList.toggle('ida', i >= JU.vidas);
  const T = JU.T;
  if (T) {
    const q = vivas(T).length;
    $('restan').innerHTML = '<b>' + q + '</b> / ' + T.piezas.length;
    $('toques').textContent = JU.toques;
  }
  $('nrM').textContent = JU.tut ? TX('tutTit') : nomMundo(JU.m);
  $('nrN').textContent = JU.tut ? '' : TX('nivel', JU.m + 1, JU.n + 1);
}

/* ── el toque ── */
function toqueEn(px, py) {
  if (JU.fase !== 'juega') return;
  /* SIN VIDAS EL TABLERO NO ESCUCHA MAS. Con el reinicio colgado de un
     `setTimeout`, entre el ultimo corazon y el tablero nuevo quedaban 780 ms
     en los que se podia seguir tocando: medido, un jugador que machaca
     TERMINA EL NIVEL con las vidas en negativo y se lo cuenta como hecho.  */
  if (JU.rehace > 0) return;
  const T = JU.T, p = piezaEn(px, py);
  if (!p) return;
  if (JU.tut && !tutDeja(p)) return;
  JU.toques++;
  if (puedeSalir(T, p)) saca(p); else falla(p);
  pintaHud();
}

function saca(p) {
  const T = JU.T;
  const R = rayo(T, p).length;
  quita(T, p); p.fuera = true;
  /* la duracion sale del LARGO DEL CAMINO y no de un numero fijo: una flecha
     de dos celdas pegada al borde y una de siete que cruza el tablero no
     pueden tardar lo mismo o la larga se ve teletransportada.              */
  const cel = (p.cel.length - 1) + R + 1.4;
  p.salDur = cl(0.10 + cel * 0.045, 0.20, 0.60);
  p.sal = 0.0001;
  son('sale');
  if (JU.tut) tutMira('saca', p);
  if (vivas(T).length === 0) { JU.sal = 0.45; }
}

function falla(p) {
  const T = JU.T, b = quienBloquea(T, p);
  p.mal = 0.34;
  if (b >= 0) {
    const q = T.piezas[b], d = DIR[dirDe(p)];
    q.tmb = 0.34; q.tmbD = [d[0], d[1]];
  }
  JU.fallos++;
  son('mal');
  /* EN EL TUTORIAL EL ERROR NO CUESTA, y no es una concesion: el paso 2 PIDE
     que se toque la que no puede. Cobrar un corazon por hacer lo que el
     juego acaba de mandar a hacer es enseniar exactamente lo contrario.   */
  if (JU.tut) { tutMira('falla', p); pintaHud(); return; }
  const v = $('vidas').children[Math.max(0, JU.vidas - 1)];
  JU.vidas = Math.max(0, JU.vidas - 1);
  if (v) { v.classList.remove('late'); void v.offsetWidth; v.classList.add('late'); }
  if (JU.vidas > 0) { pistaVer('pistaTrabada', 1600); return; }
  /* el reinicio va en el RELOJ DE LA SIMULACION y no en un temporizador de
     pared: asi dura lo mismo a 30 y a 144 cuadros, y sobre todo asi hay UN
     solo sitio que decide que el tablero no escucha.                       */
  son('vida');
  avisa(TX('sinVidas'), 1100);
  JU.rehace = 0.78;
}

/* ── el reloj ── */
function paso(dt) {
  const T = JU.T; if (!T) return;
  for (const p of T.piezas) {
    if (p.sal > 0) { p.sal += dt / p.salDur; if (p.sal >= 1) p.sal = 0; }
  }
  if (JU.sal > 0) {
    JU.sal -= dt;
    if (JU.sal <= 0) { JU.sal = 0; gana(); }
  }
  if (JU.rehace > 0) {
    JU.rehace -= dt;
    if (JU.rehace <= 0) { JU.rehace = 0; nuevoNivel(JU.m, JU.n, JU.tut); avisa(TX('sinVidasSub'), 900); }
  }
}

/* EL PANEL DE FIN GUARDA LO QUE DESCRIBE, NO EL TEXTO YA RESUELTO. Con las
   cuatro cadenas escritas en `gana()`, cambiar de idioma con el panel puesto
   lo dejaba en el idioma anterior: el titulo, el subtitulo, la ficha y el
   boton. Es el mismo defecto que en Z Force costo 107 claves. `FIN` es el
   estado y `pintaFin()` el unico que escribe — lo llaman `gana()` y
   `pintaIdioma()`, asi que no pueden decir cosas distintas.                */
let FIN = null;
function pintaFin() {
  if (!FIN) return;
  if (FIN.tut) {
    $('fTit').textContent = TX('tutGana');
    $('fSub').textContent = TX('tutGanaSub');
    $('fDatos').textContent = TX('tutDatos');
    $('fSig').textContent = TX('jugar');
    return;
  }
  $('fTit').textContent = TX(FIN.perf ? 'ganaPerf' : 'gana');
  $('fSub').textContent = TX(FIN.perf ? 'ganaPerfSub' : 'ganaSub');
  $('fDatos').textContent = TX('datos', FIN.piezas, FIN.toques);
  $('fSig').textContent = TX('siguiente');
}

function gana() {
  if (JU.fase !== 'juega') return;
  JU.fase = 'fin';
  const perf = JU.fallos === 0;
  if (JU.tut) {
    son('gana'); auAgacha(0.25, 1.2);
    FIN = { tut: true };
    pintaFin();
    $('fRe').style.display = 'none'; $('fMenu').style.display = 'none';
    $('fSig').style.display = '';
    PROG.visto = 1; guardaProg();
    verPanel('pFin');
    return;
  }
  son(perf ? 'perf' : 'gana'); auAgacha(0.25, 1.4);
  anota(JU.m, JU.n, perf);
  FIN = { tut: false, perf, piezas: JU.T.piezas.length, toques: JU.toques };
  pintaFin();
  $('fRe').style.display = ''; $('fMenu').style.display = '';
  const k = idNiv(JU.m, JU.n);
  $('fSig').style.display = (k + 1 < NIVELES) ? '' : 'none';
  verPanel('pFin');
}

function siguiente() {
  const k = idNiv(JU.m, JU.n) + 1;
  if (k >= NIVELES) { alMenu(); return; }
  cierraPanel(); nuevoNivel((k / NIV_MUNDO) | 0, k % NIV_MUNDO, false);
}

/* ── avisos y pista ── */
let AV_T = 0;
function avisa(txt, ms) {
  const a = $('aviso'); a.textContent = txt; a.classList.add('on');
  clearTimeout(AV_T); AV_T = setTimeout(() => a.classList.remove('on'), ms || 1000);
}
let PI_T = 0, PI_K = null;
function pistaVer(k, ms) {
  const e = $('pista');
  clearTimeout(PI_T);
  if (!k) { PI_K = null; e.classList.remove('on'); return; }
  PI_K = k; e.textContent = TX(k); e.classList.add('on');
  if (ms) PI_T = setTimeout(() => { if (PI_K === k) { PI_K = null; e.classList.remove('on'); } }, ms);
}
/* Repintar la pista al cambiar de idioma: la escribe una sola vez por paso,
   asi que sin esto se queda en el idioma anterior hasta que el jugador
   avanza — y en el tutorial eso es medio tutorial en otro idioma.          */
function pistaRepinta() { if (PI_K) $('pista').textContent = TX(PI_K); }
/* ══════════════════════════════════════════════════════════════════════════
   G · EL TUTORIAL
   Cuatro pasos, y CADA UNO ESPERA A QUE SE HAGA LA COSA: un tutorial que se
   pasa leyendo se saltea, y lo que se saltea es justo lo que despues no se
   entiende. Se ve APENAS EMPIEZA el juego —pedido textual— y vuelve a verse
   en cada arranque, porque la marca se descarta al leer el disco.
   ══════════════════════════════════════════════════════════════════════════ */

/* EL UNICO TABLERO ESCRITO A MANO DE TODO EL JUEGO, y tiene que serlo: cada
   paso nombra una flecha concreta («ésa no puede», «la que estorba») y un
   tablero que cambia cada vez no puede decir eso. Igual se COMPRUEBA con la
   misma regla que los 120 generados — ver `__F.audTut()`.                  */
function tabTutorial() {
  const T = nuevoTab(5, 6);
  const cels = [
    [[2, 1], [2, 0]],                 /* A · arriba, la cabeza en el borde  */
    [[0, 2], [1, 2]],                 /* B · derecha, tapada por C          */
    [[2, 2], [3, 2]],                 /* C · derecha, libre — es la que estorba */
    [[0, 4], [1, 4], [2, 4]],         /* D · derecha, tapada por E          */
    [[4, 5], [4, 4]],                 /* E · arriba, libre                  */
  ];
  for (let i = 0; i < cels.length; i++) {
    const p = { i, cel: cels[i], fuera: false };
    T.piezas.push(p); pon(T, p);
  }
  T.tut = { A: 0, B: 1, C: 2, D: 3, E: 4 };
  T.orden = [4, 3, 2, 1, 0];
  return T;
}

const TUT = { paso: 0 };
function tutArranca() { TUT.paso = 0; tutPinta(); }
function tutPinta() { pistaVer('tut' + (TUT.paso + 1)); }

/* Que se puede tocar en cada paso. Cerrar el resto no es paternalismo: con
   todo abierto, el paso 2 —«ésa no puede»— depende de que el jugador toque
   justo la que el cartel nombra, y si toca otra el cartel miente.          */
function tutDeja(p) {
  const K = JU.T.tut;
  if (TUT.paso === 0) return p.i === K.A;
  if (TUT.paso === 1) return p.i === K.B;
  if (TUT.paso === 2) return p.i === K.C;
  return true;
}
function tutMira(ev, p) {
  const K = JU.T.tut;
  if (TUT.paso === 0 && ev === 'saca' && p.i === K.A) { TUT.paso = 1; tutPinta(); return; }
  if (TUT.paso === 1 && ev === 'falla' && p.i === K.B) { TUT.paso = 2; tutPinta(); return; }
  if (TUT.paso === 2 && ev === 'saca' && p.i === K.C) { TUT.paso = 3; tutPinta(); return; }
}
/* ══════════════════════════════════════════════════════════════════════════
   H · PANTALLAS, MENU Y DEDO
   ══════════════════════════════════════════════════════════════════════════ */
let PANEL = null;
function verPanel(id) {
  cierraPanel();
  PANEL = id; $(id).classList.add('on');
  document.body.classList.add('conPanel');
  $('hud').classList.add('off'); $('pie').classList.add('off');
  pistaVer(null);
}
function cierraPanel() {
  if (PANEL) $(PANEL).classList.remove('on');
  PANEL = null; document.body.classList.remove('conPanel');
  if (JU.fase === 'juega') { $('hud').classList.remove('off'); $('pie').classList.remove('off'); if (PI_K) $('pista').classList.add('on'); }
}
function alMenu() {
  JU.fase = 'menu'; JU.T = null; pistaVer(null);
  verPanel('pMenu'); pintaMenu();
}

/* ── el menu ── */
function pintaMenu() {
  $('mSub').textContent = TX('sub');
  $('mJugar').textContent = TX('jugar');
  $('mNiv').textContent = TX('niveles');
  $('mTuto').textContent = TX('tuto');
  $('mAj').textContent = TX('ajustes');
  $('mPie').textContent = TX('de', cuentaHechos(), NIVELES) + ' · ' + TX('pie');
}

/* ── la lista ── */
let NV_M = 0;
function abreNiveles() {
  NV_M = (PROG.ult / NIV_MUNDO) | 0;
  verPanel('pNiv'); pintaNiveles();
}
function pintaNiveles() {
  $('nvTit').textContent = TX('niveles');
  $('nvSub').textContent = TX('nivelesSub');
  $('nvVolver').textContent = TX('volver');
  const tabs = $('nvMundos'); tabs.innerHTML = '';
  for (let m = 0; m < MUNDOS.length; m++) {
    const b = document.createElement('button');
    b.className = 'mtab' + (m === NV_M ? ' sel' : '') + (abierto(m * NIV_MUNDO) ? '' : ' cerr');
    b.textContent = nomMundo(m);
    b.onclick = () => { if (!abierto(m * NIV_MUNDO)) return; NV_M = m; son('ui'); pintaNiveles(); };
    tabs.appendChild(b);
  }
  const g = $('nvGrid'); g.innerHTML = '';
  for (let n = 0; n < NIV_MUNDO; n++) {
    const k = idNiv(NV_M, n), ab = abierto(k);
    const b = document.createElement('button');
    b.className = 'nvB' + (hecho(NV_M, n) ? ' ok' : '') + (ab ? '' : ' cerr') + (perfecto(NV_M, n) ? ' perf' : '');
    b.innerHTML = (n + 1) + (hecho(NV_M, n) ? '<s>OK</s>' : '');
    b.onclick = () => { if (!ab) return; son('ui'); cierraPanel(); nuevoNivel(NV_M, n, false); };
    g.appendChild(b);
  }
}

/* ── ajustes ── */
function pintaAj() {
  $('ajTit').textContent = TX('ajTit');
  $('ajMus').textContent = TX('musica');
  $('ajFx').textContent = TX('efectos');
  $('ajIdi').textContent = TX('idioma');
  $('ajBorrar').textContent = TX('borrar');
  $('ajVolver').textContent = TX('volver');
  $('rMus').value = Math.round(PROG.vol * 100);
  $('rFx').value = Math.round(PROG.fx * 100);
  for (const b of document.querySelectorAll('[data-l2]')) b.classList.toggle('sel', b.dataset.l2 === LANG);
}

/* ── el idioma se repinta ENTERO ─────────────────────────────────────────
   Cada pantalla tiene su funcion de pintado y cambiar de idioma las llama a
   todas: escrito panel por panel, el que no este abierto se queda en el
   idioma anterior hasta la proxima vez que alguien lo abra.                */
function pintaIdioma() {
  document.documentElement.lang = LANG;
  pintaMenu(); pintaAj(); pistaRepinta();
  if (PANEL === 'pNiv') pintaNiveles();
  $('paTit').textContent = TX('pausa'); $('paSub').textContent = TX('pausaSub');
  $('paSeguir').textContent = TX('seguir'); $('paRe').textContent = TX('reiniciar');
  $('paSalir').textContent = TX('salir');
  $('fRe').textContent = TX('reiniciar'); $('fMenu').textContent = TX('menuCorto');
  /* El titulo, el subtitulo, la ficha y el boton del panel de fin los escribe
     `pintaFin()` desde `FIN`, que es el estado. Repintados acá campo por
     campo habria que adivinar si la victoria fue perfecta y cuantas piezas
     tenia el tablero — y `fSig` lleva DOS rotulos distintos. Y no se toca su
     `display`: en el ultimo nivel esta apagado a proposito.                */
  pintaFin();
  $('cSub').textContent = TX('cargando');
  if (JU.T) pintaHud();
}
function ponIdioma(l) {
  LANG = l; guardaProg(); pintaIdioma();
}

/* ── el dedo ─────────────────────────────────────────────────────────────
   Se decide al SOLTAR y no al apoyar. Apoyando, cualquier arrastre sobre el
   tablero saca una flecha que nadie pidio — y en un juego donde equivocarse
   cuesta un corazon eso es un castigo que el jugador no cometio.           */
let TQ = null;
function xy(e) {
  const t = (e.changedTouches && e.changedTouches[0]) || e;
  const r = $('marco').getBoundingClientRect();
  return [t.clientX - r.left, t.clientY - r.top];
}
function engancha() {
  const c = $('cv');
  c.addEventListener('pointerdown', e => {
    if (PANEL || JU.fase !== 'juega') return;
    auArranca(); auDesp();
    TQ = xy(e); e.preventDefault();
  }, { passive: false });
  c.addEventListener('pointerup', e => {
    if (!TQ) return;
    const p = xy(e);
    if (Math.hypot(p[0] - TQ[0], p[1] - TQ[1]) < 22) toqueEn(p[0], p[1]);
    TQ = null; e.preventDefault();
  }, { passive: false });
  c.addEventListener('pointercancel', () => { TQ = null; });

  /* todo boton despierta el audio: ningun navegador deja sonar nada antes de
     un gesto de verdad, y el primero que hay es el del idioma.             */
  document.addEventListener('pointerdown', () => { auArranca(); auDesp(); }, { capture: true });

  for (const b of document.querySelectorAll('[data-lang]'))
    b.onclick = () => { son('ui'); ponIdioma(b.dataset.lang); arrancaJuego(); };
  for (const b of document.querySelectorAll('[data-l2]'))
    b.onclick = () => { son('ui'); ponIdioma(b.dataset.l2); };

  $('mJugar').onclick = () => { son('ui'); cierraPanel(); const k = cl(PROG.ult, 0, NIVELES - 1); nuevoNivel((k / NIV_MUNDO) | 0, k % NIV_MUNDO, false); };
  $('mNiv').onclick = () => { son('ui'); abreNiveles(); };
  $('mTuto').onclick = () => { son('ui'); cierraPanel(); nuevoNivel(0, 0, true); };
  $('mAj').onclick = () => { son('ui'); pintaAj(); verPanel('pAj'); };
  $('nvVolver').onclick = () => { son('ui'); alMenu(); };
  $('ajVolver').onclick = () => { son('ui'); alMenu(); };
  $('ajBorrar').onclick = () => { borraProg(); son('ui'); $('ajBorrar').textContent = TX('borrado'); pintaMenu(); };
  $('rMus').oninput = () => { PROG.vol = $('rMus').value / 100; auVol(); guardaProg(); };
  $('rFx').oninput  = () => { PROG.fx  = $('rFx').value / 100;  auVol(); guardaProg(); son('ui'); };

  $('bPausa').onclick = () => { if (JU.fase !== 'juega') return; son('ui'); JU.fase = 'pausa'; verPanel('pPausa'); };
  $('paSeguir').onclick = () => { son('ui'); JU.fase = 'juega'; cierraPanel(); };
  $('paRe').onclick = () => { JU.fase = 'juega'; cierraPanel(); reinicia(); };
  $('paSalir').onclick = () => { son('ui'); alMenu(); };
  $('fRe').onclick = () => { JU.fase = 'juega'; cierraPanel(); reinicia(); };
  $('fMenu').onclick = () => { son('ui'); alMenu(); };
  $('fSig').onclick = () => {
    son('ui');
    if (JU.tut) { cierraPanel(); const k = cl(PROG.ult, 0, NIVELES - 1); nuevoNivel((k / NIV_MUNDO) | 0, k % NIV_MUNDO, false); }
    else siguiente();
  };

  addEventListener('resize', () => setTimeout(medir, 60));
  addEventListener('orientationchange', () => setTimeout(medir, 220));
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && JU.fase === 'juega') $('bPausa').onclick();
    if (e.key === 'r' && JU.fase === 'juega') reinicia();
  });
}

/* Apenas hay idioma se entra al TUTORIAL, no al menu. Pedido textual: «con
   tutorial apenas empieza». Dentro de la sesion no se repite.              */
function arrancaJuego() {
  if (!PROG.visto) { cierraPanel(); nuevoNivel(0, 0, true); }
  else alMenu();
}

/* ══════════════════════════════════════════════════════════════════════════
   Z · ARRANQUE, RELOJ Y SONDAS
   ══════════════════════════════════════════════════════════════════════════ */
let ULT = 0, DIBMS = 0;
function bucle(ts) {
  requestAnimationFrame(bucle);
  const dt = Math.min(0.05, ULT ? (ts - ULT) / 1000 : 0); ULT = ts;
  if (JU.fase === 'juega') paso(dt);
  const t0 = performance.now();
  dibuja(dt);
  DIBMS = DIBMS * 0.9 + (performance.now() - t0) * 0.1;
}

function arranca() {
  const hab = cargaProg();
  medir(); engancha(); pintaIdioma();
  setTimeout(() => { const c = $('carga'); c.classList.add('off'); setTimeout(() => c.style.display = 'none', 420); }, 340);
  if (hab) arrancaJuego(); else verPanel('pIdioma');
  requestAnimationFrame(bucle);
}
arranca();

/* ══════════════════════ SONDAS ══════════════════════
   Una afirmacion sin numero no vale. Todo lo que mide entra POR EL MISMO
   CAMINO QUE EL DEDO (`toqueEn` con pixeles), no escribiendo el estado: una
   sonda que se saltea la entrada no esta midiendo el juego.                */
function _fin() { for (const p of JU.T.piezas) p.sal = 0; if (JU.sal > 0) { JU.sal = 0; gana(); } }
window.__F = {
  est() {
    const T = JU.T;
    return {
      fase: JU.fase, panel: PANEL, m: JU.m, n: JU.n, tut: JU.tut, lang: LANG,
      piezas: T ? T.piezas.length : 0, vivas: T ? vivas(T).length : 0,
      legales: T ? legales(T).length : 0, vidas: JU.vidas, toques: JU.toques,
      fallos: JU.fallos, tutPaso: TUT.paso, pista: PI_K,
      nx: T ? T.nx : 0, ny: T ? T.ny : 0, cw: JU.cw,
      caja: T ? [JU.bx, JU.by, JU.bw, JU.bh] : null, ms: +DIBMS.toFixed(3),
      hechos: cuentaHechos(), ult: PROG.ult,
    };
  },
  nivel(m, n) { cierraPanel(); nuevoNivel(m, n, false); return this.est(); },
  tut() { cierraPanel(); nuevoNivel(0, 0, true); return this.est(); },
  menu() { alMenu(); return this.est(); },
  lang(l) { ponIdioma(l); return { lang: LANG, sub: $('mSub').textContent, pista: $('pista').textContent }; },
  panel(id) { verPanel(id); return { panel: PANEL }; },
  clic(id) { const e = $(id); if (!e) return 'no hay ' + id; e.click(); return this.est(); },
  legales() { return legales(JU.T).map(p => p.i); },
  /* toca una pieza por el pixel de su cabeza, o sea como la tocaria un dedo */
  toca(i) {
    const p = JU.T.piezas[i]; if (!p || p.fuera) return { err: 'no esta' };
    const c = p.cel[p.cel.length - 1];
    const antes = { vivas: vivas(JU.T).length, vidas: JU.vidas };
    toqueEn(pcx(c[0]), pcy(c[1]));
    return { antes, ahora: { vivas: vivas(JU.T).length, vidas: JU.vidas, tutPaso: TUT.paso, fase: JU.fase } };
  },
  tocaPx(x, y) { toqueEn(x, y); return this.est(); },
  /* juega el nivel puesto, tocando de verdad. `azar` es el control: sin el,
     que el honesto termine no prueba que haya una decision adentro.        */
  juega(modo, topeVidas) {
    /* ADELANTA LA SIMULACION. Sin `paso`, la bandera de «sin vidas» no se
       descuenta nunca y el bot mide un juego que no existe — el tablero deja
       de escuchar y el bucle gira en el vacio hasta el tope.               */
    let g = 0, r = azar(1234567), perdidas = 0, prev = 0, tope = topeVidas === undefined ? 3 : topeVidas;
    while (JU.fase === 'juega' && vivas(JU.T).length && g++ < 4000) {
      /* una derrota es una TRANSICION de 0 a >0: leer el valor suelto no la ve,
         porque el propio `paso` ya lo bajo antes de que nadie lo mire.      */
      if (JU.rehace > 0 && prev <= 0) perdidas++;
      prev = JU.rehace;
      paso(0.016);
      if (JU.rehace > 0) { if (perdidas > tope) break; continue; }
      const L = legales(JU.T), V = vivas(JU.T);
      const p = modo === 'azar' ? V[(r() * V.length) | 0] : L[0];
      if (!p) break;
      const c = p.cel[p.cel.length - 1];
      toqueEn(pcx(c[0]), pcy(c[1]));
      _fin();
    }
    _fin();
    /* `gano` ES DE ESTA CORRIDA Y NO DEL DISCO. `hecho()` lee el progreso
       guardado, asi que despues de una tanda del bot honesto el del azar
       informaba 20 de 20 con OCHENTA derrotas: estaba leyendo las victorias
       de la corrida anterior. Ganar es terminar el tablero SIN que el nivel
       se te reinicie, o sea sin quedarte sin corazones ni una vez.        */
    const quedan = JU.T ? vivas(JU.T).length : 0;
    return { fase: JU.fase, vivas: quedan, toques: JU.toques, fallos: JU.fallos, vidas: JU.vidas, perdidas, vueltas: g, gano: perdidas === 0 && quedan === 0, hecho: hecho(JU.m, JU.n) };
  },
  /* el tutorial jugado paso por paso, por el mismo camino */
  juegaTut() {
    const K = JU.T.tut, hist = [];
    const pasos = [K.A, K.B, K.C];
    for (const i of pasos) { hist.push({ paso: TUT.paso, toca: i }); this.toca(i); _fin(); }
    let g = 0;
    while (JU.fase === 'juega' && vivas(JU.T).length && g++ < 40) {
      const L = legales(JU.T); if (!L.length) break;
      this.toca(L[0].i); _fin();
    }
    return { hist, fase: JU.fase, tutPaso: TUT.paso, vidas: JU.vidas, fTit: $('fTit').textContent };
  },
  audita() { return auditaTodo(); },
  /* fuerza fallos hasta quedarse sin vidas y comprueba lo unico que importa:
     que el tablero DEJE DE ESCUCHAR entre el ultimo corazon y el reinicio.  */
  pierde() {
    const T = JU.T, tap = p => { const c = p.cel[p.cel.length - 1]; toqueEn(pcx(c[0]), pcy(c[1])); };
    const mal = () => vivas(JU.T).find(p => !puedeSalir(JU.T, p));
    let k = 0;
    while (JU.vidas > 0 && k++ < 20) { const p = mal(); if (!p) return { err: 'no hay ninguna bloqueada' }; tap(p); }
    const antes = vivas(JU.T).length;
    const buena = legales(JU.T)[0];
    if (buena) tap(buena);                       /* con las vidas en cero, esto NO puede sacar nada */
    const sordo = vivas(JU.T).length === antes;
    let g = 0; while (JU.rehace > 0 && g++ < 200) paso(0.016);
    return { vidas: JU.vidas, sordo, fallosGastados: k, piezasTrasReinicio: vivas(JU.T).length, total: JU.T.piezas.length, toques: JU.toques, fase: JU.fase, hecho: hecho(JU.m, JU.n) };
  },
  /* el tutorial se audita con la MISMA regla que los 120 generados */
  audTut() {
    const T = tabTutorial(), r = resuelve(clonaTab(T), 200000);
    const est = tabTutorial().piezas.map(p => ({
      i: p.i, dir: DNOM[dirDe(p)], puede: puedeSalir(tabTutorial(), p),
    }));
    const T2 = tabTutorial();
    return {
      piezas: T.piezas.length, resuelto: r.ok, orden: r.orden, nodos: r.nodos,
      legalesAlEmpezar: legales(T2).map(p => p.i),
      bloqueos: T2.piezas.map(p => quienBloquea(T2, p)), est,
    };
  },
  cajas() {
    const ids = ['vidas', 'nivRot', 'bPausa', 'restan', 'toques', 'pista'];
    const R = [], vis = [];
    for (const id of ids) {
      const e = $(id); if (!e) continue;
      const s = getComputedStyle(e); if (s.display === 'none' || s.visibility === 'hidden' || +s.opacity < 0.05) continue;
      const c = e.getBoundingClientRect(); if (c.width < 1 || c.height < 1) continue;
      R.push({ id, x: c.left, y: c.top, w: c.width, h: c.height }); vis.push(id);
    }
    const ch = [], m = $('marco').getBoundingClientRect(), fuera = [];
    for (let i = 0; i < R.length; i++) {
      const a = R[i];
      if (a.x < -1 || a.y < -1 || a.x + a.w > m.width + 1 || a.y + a.h > m.height + 1) fuera.push(a.id);
      for (let j = i + 1; j < R.length; j++) {
        const b = R[j];
        if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) ch.push(a.id + '×' + b.id);
      }
    }
    return { vis, choques: ch, fuera, marco: [Math.round(m.width), Math.round(m.height)] };
  },
  paneles() {
    const out = {};
    for (const id of ['pIdioma', 'pMenu', 'pNiv', 'pAj', 'pPausa', 'pFin']) {
      const e = $(id), pre = e.classList.contains('on');
      e.classList.add('on');
      const hs = [...e.querySelectorAll('button,h1,h2,.sub,.pie,.aj')].filter(x => x.offsetWidth > 0);
      let alto = 0, cortado = 0;
      const m = $('marco').getBoundingClientRect();
      for (const x of hs) { const c = x.getBoundingClientRect(); alto = Math.max(alto, c.bottom - m.top); if (c.bottom > m.height + 1 || c.top < -1) cortado++; }
      out[id] = { n: hs.length, alto: Math.round(alto), cortado };
      if (!pre) e.classList.remove('on');
    }
    return out;
  },
  audio(ms) {
    if (!AU.on) return { on: false };
    const n = AU.an.frequencyBinCount, d = new Float32Array(AU.an.fftSize);
    return new Promise(res => {
      setTimeout(() => {
        AU.an.getFloatTimeDomainData(d);
        let pico = 0, s = 0;
        for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > pico) pico = v; s += d[i] * d[i]; }
        res({ on: true, pico: +pico.toFixed(4), rms: +Math.sqrt(s / d.length).toFixed(4), acorde: AU.acorde });
      }, ms || 300);
    });
  },
  son(k) { auArranca(); auDesp(); son(k); return { on: AU.on }; },
  /* MIDE UN EFECTO BARRIENDOLO ENTERO. La ventana del analizador son 42,7 ms
     y un efecto dura entre 200 y 700: una sola lectura cae donde caiga y lo
     que devuelve es la cama. Se muestrea cada cuadro y se toma el pico.   */
  sonMide(k, ms) {
    auArranca(); auDesp();
    if (!AU.on) return Promise.resolve({ on: false });
    const d = new Float32Array(AU.an.fftSize), T = ms || 800;
    const lee = () => {
      AU.an.getFloatTimeDomainData(d);
      let p = 0, s = 0;
      for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > p) p = v; s += d[i] * d[i]; }
      return { p, r: Math.sqrt(s / d.length) };
    };
    return new Promise(res => {
      /* el fondo se mide ANTES y con la misma regla, si no la comparacion
         estaria contra un numero sacado de otra ventana                   */
      let fp = 0, fr = 0, n0 = 0;
      const t0 = setInterval(() => {
        const x = lee(); if (x.p > fp) fp = x.p; if (x.r > fr) fr = x.r;
        if (++n0 >= 12) {
          clearInterval(t0);
          son(k);
          let pp = 0, rr = 0, n = 0;
          const t1 = setInterval(() => {
            const y = lee(); if (y.p > pp) pp = y.p; if (y.r > rr) rr = y.r;
            if (++n >= Math.ceil(T / 16)) {
              clearInterval(t1);
              res({ on: true, k, fondoPico: +fp.toFixed(4), fondoRms: +fr.toFixed(4),
                    pico: +pp.toFixed(4), rms: +rr.toFixed(4), veces: +(rr / (fr || 1e-9)).toFixed(2) });
            }
          }, 16);
        }
      }, 16);
    });
  },
  costo(n) {
    const N = n || 90, t0 = performance.now();
    for (let i = 0; i < N; i++) dibuja(0.016);
    return { ms: +((performance.now() - t0) / N).toFixed(3), n: N };
  },
};
</script></body></html>
