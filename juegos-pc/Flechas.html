<!doctype html><html lang="es"><head>
<meta charset="utf-8">

<title>FLECHAS</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   A · MARCO, PIEL Y PANTALLAS
   Vertical NATIVO: el tablero es mas alto que ancho en los seis mundos, asi
   que el telefono como uno lo agarra ES el formato del juego. Nada que girar.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --papel:#f4f1ea; --papel2:#e9e4d8; --tinta:#181614; --tinta2:#4a453d;
  --acento:#c8452f; --ok:#2f7d4f; --mw:412px; --mh:892px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#100f0d;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#marco{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 0%,var(--papel) 0%,var(--papel2) 70%,#ded7c7 100%);
  color:var(--tinta);overflow:hidden}

/* el grano del papel: dos degradados repetidos, cero bytes de imagen */
#marco::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.022) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.016) 0 1px,transparent 1px 4px)}

/* ── el lienzo ── */
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}

/* ── HUD ── */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:3;pointer-events:none}
#hud.off{display:none}
#vidas{display:flex;gap:6px;align-items:center;height:30px}
.cor{width:19px;height:19px;position:relative;transition:transform .22s,opacity .22s}
.cor::before,.cor::after{content:'';position:absolute;width:10px;height:15px;border-radius:6px 6px 0 0;
  background:var(--acento);top:1px}
.cor::before{left:0;transform:rotate(-45deg);transform-origin:50% 100%}
.cor::after{right:0;transform:rotate(45deg);transform-origin:50% 100%}
.cor.ida{opacity:.16;transform:scale(.74)}
.cor.ida::before,.cor.ida::after{background:var(--tinta2)}
.cor.late{animation:late .5s ease}
@keyframes late{0%,100%{transform:scale(1)}35%{transform:scale(1.4)}}
#nivRot{flex:1;text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;
  color:var(--tinta2);line-height:16px;padding-top:5px}
#nivRot b{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.55}
#bPausa{pointer-events:auto;width:34px;height:30px;border:0;background:transparent;
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
#bPausa i{width:4px;height:15px;border-radius:2px;background:var(--tinta2);display:block}

/* ── pie: toques + deshacer ── */
#pie{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;z-index:3;pointer-events:none}
#pie.off{display:none}
#toques,#restan{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--tinta2);opacity:.62}
#restan{opacity:.85}#restan b{font-size:17px;letter-spacing:.02em;color:var(--tinta)}

/* ── la pista del tutorial ── */
#pista{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);
  text-align:center;font-size:14px;font-weight:700;line-height:1.35;z-index:4;pointer-events:none;
  color:var(--tinta);background:rgba(255,255,255,.82);border:1.5px solid rgba(24,22,20,.14);
  border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.09);
  opacity:0;transform:translateY(8px);transition:opacity .28s,transform .28s}
#pista.on{opacity:1;transform:none}

/* ── aviso corto ── */
#aviso{position:absolute;left:0;right:0;top:44%;text-align:center;z-index:6;pointer-events:none;
  font-size:20px;font-weight:900;letter-spacing:.1em;color:var(--acento);
  text-shadow:0 2px 10px rgba(255,255,255,.9);opacity:0;transition:opacity .2s}
#aviso.on{opacity:1}

/* ── PANELES ── */
.pan{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:26px 22px;
  background:linear-gradient(180deg,rgba(244,241,234,.97) 0%,rgba(233,228,216,.99) 100%);
  animation:ent .24s ease}
.pan.on{display:flex}
@keyframes ent{from{opacity:0}to{opacity:1}}
.pan h1{font-size:44px;font-weight:900;letter-spacing:.22em;margin-left:.22em;line-height:1}
.pan h2{font-size:24px;font-weight:900;letter-spacing:.14em;margin-left:.14em}
.pan .sub{font-size:13px;font-weight:600;color:var(--tinta2);text-align:center;line-height:1.5;margin-top:10px}
.pan .pie{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--tinta2);opacity:.5;text-align:center}
.bt{border:0;background:var(--tinta);color:var(--papel);font-size:14px;font-weight:800;
  letter-spacing:.16em;padding:15px 0;border-radius:14px;cursor:pointer;width:100%;
  box-shadow:0 5px 0 rgba(24,22,20,.22);transition:transform .1s,box-shadow .1s}
.bt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(24,22,20,.22)}
.bt.sec{background:transparent;color:var(--tinta);border:2px solid rgba(24,22,20,.2);box-shadow:none}
.bt.sec:active{transform:none;background:rgba(24,22,20,.06)}
.col{display:flex;flex-direction:column;gap:11px;width:100%;max-width:290px}
.fila{display:flex;gap:10px;width:100%;max-width:290px}
.fila .bt{flex:1}

/* la marca: la flecha del juego, dibujada con bordes */
.marca{width:88px;height:60px;position:relative;margin-bottom:6px}
.marca i{position:absolute;background:var(--tinta);border-radius:3px;display:block}
.marca .h{height:6px}.marca .v{width:6px}
.marca .p{width:0;height:0;background:transparent;border-left:15px solid var(--tinta);
  border-top:11px solid transparent;border-bottom:11px solid transparent;border-radius:0}

/* ── lista de niveles ── */
#pNiv{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
#nvCab{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:330px;margin-bottom:4px}
#nvCab h2{font-size:19px}
#nvMundos{display:flex;gap:5px;width:100%;max-width:360px;margin:12px 0;justify-content:center}
.mtab{flex:0 0 auto;border:1.5px solid rgba(24,22,20,.18);background:transparent;color:var(--tinta2);
  font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:8px 7px;border-radius:9px;cursor:pointer;flex:1 1 0;min-width:0}
.mtab.sel{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.mtab.cerr{opacity:.3}
#nvGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:330px;
  overflow-y:auto;flex:1;align-content:start;padding:2px 2px 16px}
.nvB{aspect-ratio:1;border:1.5px solid rgba(24,22,20,.18);background:rgba(255,255,255,.6);
  border-radius:12px;font-size:16px;font-weight:800;color:var(--tinta);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nvB.ok{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.nvB.cerr{opacity:.3;background:transparent}
.nvB s{font-size:9px;letter-spacing:.1em;opacity:.8;text-decoration:none}
.nvB.perf::after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;
  border-radius:50%;background:var(--acento)}

/* ── ajustes ── */
.aj{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  max-width:290px;padding:11px 0;border-bottom:1px solid rgba(24,22,20,.1)}
.aj span{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--tinta2)}
.aj input[type=range]{width:130px;accent-color:var(--tinta)}
.chip{border:1.5px solid rgba(24,22,20,.18);background:transparent;color:var(--tinta2);
  font-size:11px;font-weight:800;padding:7px 11px;border-radius:9px;cursor:pointer}
.chip.sel{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

/* ── carga ── */
#carga{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;background:var(--papel2);transition:opacity .4s}
#carga.off{opacity:0;pointer-events:none}
#cSub{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--tinta2)}
#cBarra{width:150px;height:3px;border-radius:2px;background:rgba(24,22,20,.14);overflow:hidden}
#cBarra i{display:block;height:100%;width:35%;background:var(--tinta);border-radius:2px;
  animation:cb 1.1s ease-in-out infinite}
@keyframes cb{0%{margin-left:-35%}100%{margin-left:100%}}

@media (max-height:700px){
  .pan h1{font-size:36px}.marca{transform:scale(.8);margin-bottom:0}
  .bt{padding:13px 0}.col{gap:9px}
}
</style></head><body>

<div id="marco">

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   B · CONSTANTES, MUNDOS, IDIOMAS Y GUARDADO
   ══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
const mez = (a, b, k) => a + (b - a) * k;

/* AZAR CON SEMILLA. Un nivel tiene que ser EL MISMO nivel en cualquier aparato
   y en cualquier intento: si el tablero cambiara al reintentar, lo que uno
   leyo del intento anterior no valdria nada — y este juego entero consiste en
   leer que tiene cada flecha delante.                                       */
function azar(s) {
  let x = (s | 0) || 1;
  return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x |= 0; return (x >>> 0) / 4294967296; };
}

/* ── LAS CUATRO DIRECCIONES ───────────────────────────────────────────────
   El indice ES la direccion, y su opuesta es `d^1`. Eso no es un truco de
   bits por elegancia: la pieza entra al tablero por detras de su punta, o sea
   que el primer paso del cuerpo es SIEMPRE la opuesta de la direccion de
   salida, y con una tabla de opuestas escrita aparte los dos numeros se
   separan el dia que alguien reordene la lista.                             */
const DIR = [[1, 0], [-1, 0], [0, 1], [0, -1]];   /* der · izq · abajo · arriba */
const DNOM = ['der', 'izq', 'abajo', 'arriba'];

/* ── LOS SEIS MUNDOS ──────────────────────────────────────────────────────
   Lo que crece no es «la dificultad» como numero suelto: crecen el TABLERO y
   la CANTIDAD DE PIEZAS, y de esas dos sale todo lo demas. Mas piezas en el
   mismo hueco es menos rayos libres, o sea MENOS PROBABILIDAD DE ACERTAR SIN
   MIRAR: medido, `pAcierto` cae de 0,610 en el mundo 1 a 0,356 en el 6 y los
   fallos del que no lee suben de 4,6 a 35,1 contra tres corazones.
   `nlo`/`nhi` interpolan a lo largo de los veinte niveles de cada mundo, asi
   que dentro de un mundo tambien hay una curva y no veinte niveles iguales. */
const MUNDOS = [
  /* `b0` es el TOPE DE FLECHAS CON RAYO CERO —cabeza en el borde y apuntando
     hacia afuera— y no es un peso mas: es lo unico que deja que la fase de
     cierre cumpla su numero. Una flecha asi no tiene NI UNA CELDA entre su
     cabeza y el borde, o sea que es legal siempre y NADIE puede taparla
     nunca. Medido antes de ponerlo: de 26 legales del mundo 6, 23 eran de
     rayo cero — el cierre metia piezas persiguiendo un numero que la
     geometria le prohibia bajar. Tampoco pueden ser cero: son las flechas
     con las que un nivel se empieza. Son POCAS y contadas.                 */
  { nom: 'papel',  nx: 6,  ny: 8,  nlo: 4 ,  nhi: 6 ,  lmin: 2, lmax: 4, dobla: 0.30, lib: 3, b0: 4, extra: 8 , tinte: '#2b2b2b' },
  { nom: 'tinta',  nx: 7,  ny: 9,  nlo: 6 ,  nhi: 9 , lmin: 2, lmax: 5, dobla: 0.36, lib: 3, b0: 3, extra: 10, tinte: '#1f3550' },
  { nom: 'cable',  nx: 8,  ny: 10, nlo: 8 , nhi: 11, lmin: 2, lmax: 5, dobla: 0.42, lib: 3, b0: 3, extra: 12, tinte: '#0f4a44' },
  { nom: 'nudo',   nx: 9,  ny: 11, nlo: 9 , nhi: 12, lmin: 3, lmax: 6, dobla: 0.48, lib: 3, b0: 2, extra: 14, tinte: '#5a2f14' },
  { nom: 'telar',  nx: 10, ny: 12, nlo: 10, nhi: 14, lmin: 3, lmax: 6, dobla: 0.52, lib: 3, b0: 2, extra: 16, tinte: '#4a1f3d' },
  { nom: 'salida', nx: 11, ny: 13, nlo: 12, nhi: 16, lmin: 3, lmax: 7, dobla: 0.56, lib: 2, b0: 2, extra: 18, tinte: '#0e0e0e' },
];
const NIV_MUNDO = 20;
const NIVELES = MUNDOS.length * NIV_MUNDO;
const VIDAS = 3;

/* La semilla de un nivel sale del par (mundo, nivel) y de nada mas: asi el
   nivel 3 del mundo 2 es el mismo tablero para todo el mundo, y se puede
   hablar de «el 2-3» y que signifique algo.                                */
const semNivel = (m, n) => (m + 1) * 100003 + (n + 1) * 7919 + 13;

function cfgNivel(m, n) {
  const M = MUNDOS[m], k = NIV_MUNDO > 1 ? n / (NIV_MUNDO - 1) : 0;
  return {
    nx: M.nx, ny: M.ny, lmin: M.lmin, lmax: M.lmax, dobla: M.dobla,
    lib: M.lib, b0: M.b0, extra: M.extra,
    n: Math.round(mez(M.nlo, M.nhi, k)),
    sem: semNivel(m, n),
  };
}

/* ══════════════════════ IDIOMAS ══════════════════════ */
const LANGS = {
  es: {
    sub: 'sacá todas las flechas · mirá lo que cada una tiene delante',
    jugar: 'JUGAR', tuto: 'CÓMO SE JUEGA', niveles: 'NIVELES', ajustes: 'AJUSTES',
    volver: 'VOLVER', seguir: 'SEGUIR', reiniciar: 'REINICIAR', salir: 'SALIR AL MENÚ',
    /* el panel de fin pone REINICIAR y esta al lado, en fila: con la etiqueta
       larga el boton se parte en dos renglones mientras sus vecinos van en
       uno. En la pausa van apilados y ahi la larga entra.                  */
    menuCorto: 'MENÚ',
    siguiente: 'SIGUIENTE', pausa: 'PAUSA', pausaSub: 'las flechas te esperan',
    nivelesSub: 'tocá uno para jugarlo',
    gana: '¡LIMPIO!', ganaSub: 'no quedó ni una',
    ganaPerf: '¡PERFECTO!', ganaPerfSub: 'sin un solo error',
    datos: '{0} flechas · {1} toques',
    ajTit: 'AJUSTES', musica: 'MÚSICA', efectos: 'SONIDOS', idioma: 'IDIOMA',
    borrar: 'BORRAR EL PROGRESO', borrado: 'BORRADO',
    mundo: 'MUNDO {0}', nivel: 'NIVEL {0}-{1}', de: '{0} de {1}',
    mundos: ['PAPEL','TINTA','CABLE','NUDO','TELAR','SALIDA'],
    sinVidas: 'SE ACABARON', sinVidasSub: 'el tablero vuelve a empezar',
    pistaTrabada: 'ésa tiene algo en el camino',
    pie: 'sin un solo asset · todo dibujado por código', cargando: 'CARGANDO',
    tutTit: 'TUTORIAL',
    tut1: 'tocá una flecha y sale por donde apunta',
    tut2: 'ésa no puede: hay otra en su camino',
    tut3: 'sacá primero la que estorba',
    tut4: 'ahora sí · vaciá el tablero',
    tutGana: '¡ESO ES TODO!', tutGanaSub: 'ya sabés jugar',
    tutDatos: 'una flecha, un camino libre · nada más',
  },
  en: {
    sub: 'clear every arrow · look at what each one has ahead',
    jugar: 'PLAY', tuto: 'HOW TO PLAY', niveles: 'LEVELS', ajustes: 'SETTINGS',
    volver: 'BACK', seguir: 'RESUME', reiniciar: 'RESTART', salir: 'BACK TO MENU', menuCorto: 'MENU',
    siguiente: 'NEXT', pausa: 'PAUSED', pausaSub: 'the arrows will wait',
    nivelesSub: 'tap one to play it',
    gana: 'CLEAR!', ganaSub: 'not one left',
    ganaPerf: 'PERFECT!', ganaPerfSub: 'not a single mistake',
    datos: '{0} arrows · {1} taps',
    ajTit: 'SETTINGS', musica: 'MUSIC', efectos: 'SOUNDS', idioma: 'LANGUAGE',
    borrar: 'ERASE PROGRESS', borrado: 'ERASED',

/* ══════════════════════ EL GUARDADO ══════════════════════

const PROG = { lang: null, hechos: {}, vol: 0.5, fx: 0.8, visto: 0, ult: 0 };
function cargaProg() {
  try {
    const s = localStorage.getItem('flechas');
    if (!s) return false;

    if (o && typeof o === 'object') Object.assign(PROG, o);
    /* EL TUTORIAL SE VE CADA VEZ QUE SE ABRE EL JUEGO, y por eso la marca no
       sobrevive a una recarga. Pedido textual: «con tutorial apenas empieza».
       Se pone en cero DESPUES de leer el disco, asi que sigue valiendo DENTRO
       de la sesion —hecho una vez, no vuelve a dispararse entre nivel y
       nivel— y es el unico dato del guardado que se descarta a proposito.  */
    PROG.visto = 0;

function guardaProg() { try { PROG.lang = LANG; localStorage.setItem('flechas', JSON.stringify(PROG)); } catch (e) {} }
function borraProg() {

  try { localStorage.removeItem('flechas'); } catch (e) {}
}
const idNiv = (m, n) => m * NIV_MUNDO + n;
const hecho = (m, n) => !!PROG.hechos[idNiv(m, n)];
const perfecto = (m, n) => PROG.hechos[idNiv(m, n)] === 2;
function anota(m, n, perf) {

/* «el siguiente al ultimo hecho, mas uno de gracia»: con el siguiente y nada

function abierto(k) {
  if (k <= 0) return true;

  for (const s in PROG.hechos) { const i = +s; if (i + 1 > alto) alto = i + 1; }

/* ══════════════════════════════════════════════════════════════════════════
   C · EL MODELO: PIEZAS, LA REGLA DE SALIDA, EL GENERADOR Y EL VALIDADOR
   NO TOCA NI EL DOM NI EL LIENZO, asi que se concatena con b.js y se corre en
   node: la economia del juego se afina antes de dibujar un solo pixel.
