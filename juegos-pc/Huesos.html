}

/* ── EL KIT: UNA MALLA INSTANCIADA POR PIEZA ───────────────────────────────
   Catorce esqueletos sueltos serían catorce por dieciocho = 252 llamadas de
   dibujo. Con un InstancedMesh por PIEZA son DIECIOCHO, haya uno o haya
   catorce, porque la pieza `pecho` del bicho 7 es la instancia 7 de la misma
   malla.                                                                  */
function armaKit(receta, cupo) {
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const mallas = {};
  for (const k in receta.piezas) {
    const im = new THREE.InstancedMesh(receta.piezas[k], mat, cupo);
    im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
    im.count = 0;
    im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cupo * 3).fill(1), 3);
    esc.add(im); mallas[k] = im;
  }
  return { receta, mat, mallas, cupo, n: 0 };
}

/* el cuerpo son PIVOTES y nada más: sin mallas, así que crear catorce cuesta
   catorce objetos vacíos y el dibujo lo hace el kit */
function armaCuerpo(receta) {
  const h = {}, raiz = new THREE.Object3D();
  for (const k in receta.huesos) {
    const d = receta.huesos[k], o = new THREE.Object3D();
    o.position.set(d.x || 0, d.y || 0, d.z || 0);
    o.rotation.order = 'YXZ';
    (d.padre ? h[d.padre] : raiz).add(o);
    h[k] = o;
  }
  /* la altura de la cadera es el CERO de la pose: `poseAplica` le suma el
     rebote encima, así que tiene que salir de la receta y no de un número
     escrito en la función de mezcla */
  return { raiz, h, baseY: receta.huesos.pelvis.y, alto: receta.alto };
}

/* escribe en el kit la pose de todos los cuerpos vivos; una pasada, sin
   crear un solo objeto */
const _KM = new THREE.Matrix4();
const _KCERO = new THREE.Matrix4().makeScale(0, 0, 0);
function kitPinta(kit, cuerpos) {
  const hs = kit.receta.hueso || {};
  let n = 0;
  for (const c of cuerpos) {
    if (!c.vive) continue;
    c.cuerpo.raiz.updateMatrixWorld(true);
    /* UNA PIEZA QUE NO LE TOCA A ESTE CUERPO VA CON MATRIZ CERO y no se
       saltea: las instancias de un InstancedMesh son un rango contiguo, así
       que saltear una correría el índice y el bicho 7 pintaría la cabeza del
       8. Una matriz de escala cero no dibuja un solo píxel.               */
    for (const k in kit.mallas)
      kit.mallas[k].setMatrixAt(n, (c.sin && c.sin[k]) ? _KCERO : c.cuerpo.h[hs[k] || k].matrixWorld);
    if (c.tinte !== undefined) for (const k in kit.mallas) kit.mallas[k].setColorAt(n, c.tinte);
    n++;
    if (n >= kit.cupo) break;
  }
  for (const k in kit.mallas) {
    const m = kit.mallas[k];
    m.count = n; m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
  }
  kit.n = n;
}

/* ══════════════════════════════════════════════════════════════════════════
   LAS POSES — cada una es una función del tiempo a doce rotaciones
   ══════════════════════════════════════════════════════════════════════════
   EL RITMO DEL CICLO NO ES UN NÚMERO AL LADO: sale de la velocidad y de la
   zancada (`ω = 2π·v / zancada`). Escrito a mano, el pie patina en cuanto
   cambia la velocidad — el defecto que en RECREO tenía a Baldi a 2,7 metros
   por paso.                                                                */
const POSE = {};
const _P = {};   // el destino de la pose: se rellena y se mezcla, sin alojar

function poseCero(p) {
  p.pelX = 0; p.pelY = 0; p.pelZ = 0; p.alt = 0;
  p.troX = 0; p.troY = 0; p.troZ = 0;
  p.pecX = 0; p.pecY = 0; p.pecZ = 0;
  p.cueX = 0; p.cueY = 0;
  p.hIX = 0.05; p.hIZ = 0.16; p.hIY = 0;
  p.hDX = 0.05; p.hDZ = -0.16; p.hDY = 0;
  p.aIX = -0.28; p.aDX = -0.28;
  p.mIX = 0; p.mDX = 0; p.pIX = 0; p.pDX = 0;
  return p;
}

/* quieto: respira, se balancea y CAMBIA EL PESO de una pierna a la otra. El
   cambio de peso es lo que más se nota y lo que menos se ve venir; sin él
   una pose de reposo se lee a maniquí que sube y baja.                     */
POSE.quieto = (p, t) => {
  poseCero(p);
  const r = Math.sin(t * 1.55), peso = Math.sin(t * 0.37);
  p.alt = r * 0.012;
  p.pecX = -0.05 + r * 0.035;
  p.cueX = 0.04 - r * 0.03;
  p.cueY = Math.sin(t * 0.29) * 0.22;
  p.pelZ = peso * 0.045;
  p.troZ = -peso * 0.030;
  p.hIZ += 0.05 + r * 0.020; p.hDZ -= 0.05 + r * 0.020;
  p.hIX += peso * 0.05; p.hDX -= peso * 0.05;
  p.aIX -= 0.16; p.aDX -= 0.20;
  p.mIX = -peso * 0.05; p.mDX = peso * 0.05;
};

/* caminar y correr son la MISMA curva con otra amplitud: son el mismo gesto
   a otra velocidad, y con dos curvas sueltas se separan al mezclarlas */
function poseAndar(p, f, k) {
  poseCero(p);
  const s = Math.sin(f), c = Math.cos(f);
  p.mIX = s * 0.86 * k; p.mDX = -s * 0.86 * k;
  p.pIX = Math.max(0, -Math.sin(f - 0.55)) * 1.28 * k;
  p.pDX = Math.max(0, -Math.sin(f + Math.PI - 0.55)) * 1.28 * k;
  p.hIX = 0.05 - s * 0.62 * k; p.hDX = 0.05 + s * 0.62 * k;
  p.aIX = -0.28 - (0.42 + s * 0.30) * k; p.aDX = -0.28 - (0.42 - s * 0.30) * k;
  /* el rebote va al DOBLE de la frecuencia del vaivén, porque hay DOS
     pisadas por ciclo; a la misma frecuencia el cuerpo cojea */
  p.alt = -Math.abs(c) * 0.055 * k;
  p.pelY = -s * 0.16 * k;         // la cadera bascula…
  p.troY = s * 0.13 * k;          // …y el tronco gira al revés
  p.pelZ = c * 0.045 * k;
  p.pecX = -0.10 * k - Math.abs(c) * 0.05 * k;
  p.cueX = 0.09 * k;              // la cabeza compensa el rebote
}
POSE.camina = (p, t, v) => poseAndar(p, t, 0.62);
POSE.corre = (p, t, v) => {
  poseAndar(p, t, 1.0);
  p.pecX -= 0.16; p.cueX += 0.13;   // inclinado hacia adelante
  p.troX = -0.10;
};

/* el combo: cada golpe es CARGA (se junta) → ACTIVO (el latigazo) → FIN
   (la recuperación). `u` va de 0 a 1 sobre el golpe entero.                */
function poseTajo(p, u, lado, alto) {
  poseCero(p);
  const car = 0.28, act = 0.46;
  let k;
  if (u < car) k = -suav(u / car);                       // atrás
  else if (u < act) k = mez(-1, 1, suav((u - car) / (act - car)));
  else k = mez(1, 0, suav((u - act) / (1 - act)));
  const s = lado;
  p.pelY = -k * 0.42 * s; p.troY = -k * 0.34 * s; p.pecY = -k * 0.30 * s;
  p.cueY = k * 0.30 * s;                                 // mira lo que corta
  p.pecX = -0.10 - k * 0.14;
  p.hDX = 0.05 - 0.30 - k * 1.15 - alto * 0.55;
  p.hDZ = -0.16 - 0.50 * (1 - k) * s;
  p.aDX = -0.28 - 0.90 * (1 - Math.abs(k)) - 0.15;
  p.hIX = 0.05 + k * 0.42; p.hIZ = 0.16 + 0.30;
  p.aIX = -0.28 - 0.70;
  p.mIX = -k * 0.30 * s * 0.4; p.mDX = k * 0.30 * s * 0.4;
  p.alt = -Math.abs(k) * 0.045;
}
POSE.golpe0 = (p, u) => poseTajo(p, u, +1, 0);
POSE.golpe1 = (p, u) => poseTajo(p, u, -1, 0);
/* el tercero es de arriba abajo y no de costado: si los tres fueran el mismo
   tajo espejado, el remate no se leería como remate */
POSE.golpe2 = (p, u) => {
  poseCero(p);
  const car = 0.36, act = 0.54;
  let k;
  if (u < car) k = -suav(u / car);
  else if (u < act) k = mez(-1, 1, suav((u - car) / (act - car)));
  else k = mez(1, 0, suav((u - act) / (1 - act)));
  p.pecX = -0.14 + k * 0.52;
  p.troX = k * 0.24;
  p.cueX = 0.10 - k * 0.20;
  p.hDX = 0.05 - 1.05 - k * 1.95;   // de por encima de la cabeza al piso
  p.hDZ = -0.16 - 0.12;
  p.hIX = 0.05 - 0.85 - k * 1.55; p.hIZ = 0.16 + 0.12;
  p.aDX = -0.10 - Math.max(0, -k) * 0.55;
  p.aIX = -0.10 - Math.max(0, -k) * 0.55;
  p.mIX = -0.22 - k * 0.16; p.mDX = 0.30 + k * 0.10;
  p.pIX = 0.30; p.pDX = 0.16;
  p.alt = -0.06 - Math.max(0, k) * 0.16;
};

/* esquive: se agacha y se tira; el cuerpo se cierra, que es lo único que lo
   distingue de "caminar rápido" en un cuadro suelto */
POSE.esquiva = (p, u) => {
  poseCero(p);
  const k = Math.sin(u * Math.PI);
  p.alt = -k * 0.42;
  p.pecX = -k * 0.95; p.troX = -k * 0.30; p.cueX = k * 0.75;
  p.mIX = k * 1.20; p.mDX = k * 0.95;
  p.pIX = k * 1.55; p.pDX = k * 1.30;
  p.hIX = 0.05 - k * 0.75; p.hDX = 0.05 - k * 0.60;
  p.aIX = -0.28 - k * 1.35; p.aDX = -0.28 - k * 1.20;
};

/* recibir: el tronco se va para atrás y los brazos se abren. Dura poco y por
   eso vale la pena que sea grande — un cuadro y medio de lectura */
POSE.dano = (p, u) => {
  poseCero(p);
  const k = Math.sin(Math.min(1, u) * Math.PI);
  p.pecX = k * 0.55; p.troX = k * 0.28; p.cueX = -k * 0.42;
  p.hIX = 0.05 + k * 0.85; p.hDX = 0.05 + k * 0.70;
  p.hIZ = 0.16 + k * 0.45; p.hDZ = -0.16 - k * 0.45;
  p.aIX = -0.28 - k * 0.35; p.aDX = -0.28 - k * 0.35;
  p.alt = -k * 0.10; p.pIX = k * 0.30; p.pDX = k * 0.22;
};

/* morirse: se DESARMA. Se le va la altura, se le abren las piernas y la
   cabeza cae al final — un fundido a invisible se lee a error de dibujo */
POSE.muere = (p, u) => {
  poseCero(p);
  const k = suav(Math.min(1, u));
  p.alt = -k * 1.05;
  p.pelX = k * 0.35; p.pecX = k * 0.95; p.troX = k * 0.55;
  p.cueX = -k * 0.30 + suav(Math.max(0, (u - 0.55) / 0.45)) * 1.35;
  p.mIX = -k * 1.45; p.mDX = -k * 1.15;
  p.pIX = k * 1.85; p.pDX = k * 1.55;
  p.hIX = 0.05 + k * 1.75; p.hDX = 0.05 + k * 1.55;
  p.hIZ = 0.16 + k * 0.60; p.hDZ = -0.16 - k * 0.60;
  p.pelZ = k * 0.42;
};

/* la carga del esqueleto: levanta el arma y SE QUEDA. El aviso es lo que
   hace justa la pelea, así que tiene que durar y verse desde atrás */
POSE.carga = (p, u) => {
  poseCero(p);
  const k = suav(Math.min(1, u));
  p.hDX = 0.05 - k * 2.35; p.hDZ = -0.16 - k * 0.30;
  p.aDX = -0.28 + k * 0.20;
  p.pecX = -k * 0.20; p.troY = k * 0.28; p.pelY = k * 0.20;
  p.cueX = k * 0.14;
  p.hIX = 0.05 - k * 0.55; p.hIZ = 0.16 + k * 0.42;
  p.alt = -k * 0.06;
};
POSE.tajo = (p, u) => poseTajo(p, u, +1, 0.35);

/* ── LA MEZCLA ─────────────────────────────────────────────────────────────
   Un corte entre dos poses se ve aunque el bicho esté a veinte metros. La
   mezcla es promediar las dos evaluaciones, que es todo lo que un crossfade
   es cuando las poses son funciones.                                       */
const _PA = poseCero({}), _PB = poseCero({});
function poseAplica(cuerpo, nom, arg, nom2, arg2, k) {
  POSE[nom](_PA, arg || 0);
  if (nom2 && k > 0.001) {
    POSE[nom2](_PB, arg2 || 0);
    for (const q in _PA) _PA[q] = mez(_PA[q], _PB[q], k);
  }
  const h = cuerpo.h, p = _PA;
  h.pelvis.position.y = cuerpo.baseY + p.alt;
  h.pelvis.rotation.set(p.pelX, p.pelY, p.pelZ);
  h.torso.rotation.set(p.troX, p.troY, p.troZ);
  h.pecho.rotation.set(p.pecX, p.pecY, p.pecZ);
  h.cuello.rotation.set(p.cueX, p.cueY, 0);
  h.hombroI.rotation.set(p.hIX, p.hIY, p.hIZ);
  h.hombroD.rotation.set(p.hDX, p.hDY, p.hDZ);
  h.anteI.rotation.x = p.aIX; h.anteD.rotation.x = p.aDX;
  h.musloI.rotation.x = p.mIX; h.musloD.rotation.x = p.mDX;
  h.pantI.rotation.x = p.pIX; h.pantD.rotation.x = p.pDX;
}

/* ── LA ZANCADA SE MIDE SOBRE EL PROPIO CICLO ──────────────────────────────
   `pasos/s = velocidad ÷ zancada`, y la zancada la trae la ANIMACIÓN: es
   cuánto barre el pie hacia atrás mientras está apoyado, por dos pasos que
   hay en un ciclo. Con un número escrito al lado, el pie patina en cuanto se
   toca la amplitud del ciclo — y eso no falla, se ve.                      */
const PASO_M = {};
function midePaso(nom) {
  const c = armaCuerpo(recetaHeroe());
  let mn = 1e9, mx = -1e9;
  const v = new THREE.Vector3();
  for (let i = 0; i <= 48; i++) {
    poseAplica(c, nom, i / 48 * Math.PI * 2, null, 0, 0);
    c.raiz.position.set(0, 0, 0); c.raiz.rotation.y = 0;
    c.raiz.updateMatrixWorld(true);
    v.set(0, -0.44, 0).applyMatrix4(c.h.pantI.matrixWorld);
    mn = Math.min(mn, v.z); mx = Math.max(mx, v.z);
  }
  return (mx - mn) * 2;          // dos pasos por ciclo
}
function midePasos() { PASO_M.camina = midePaso('camina'); PASO_M.corre = midePaso('corre'); }
/* la zancada de AHORA sale de mezclar las dos con la misma `k` con la que se
   mezclan las poses: si no, al pasar de caminar a correr el pie patina justo
   en la transición, que es cuando más se mira */
function zancada(k) { return mez(PASO_M.camina || 1.35, PASO_M.corre || 2.04, lim(k, 0, 1)); }
/* ══════════════════════════════════════════════════════════════════════════
   EL JUGADOR — moverse, correr, esquivar y el combo de tres
   ══════════════════════════════════════════════════════════════════════════ */

const JUG = {
  x: 0, z: 0, y: 0, rumbo: 0, vx: 0, vz: 0,
  vida: J_VIDA, vidaMax: J_VIDA, agu: J_AGU,
  nivel: 1, xp: 0, xpSig: XP_NIVEL(1),
  golpe: -1, gT: 0, gDio: false, gVent: 0,
  esqT: 0, esqEsp: 0, esqX: 0, esqZ: 0,
  danoT: 0, invT: 0, muerto: false, muerteT: 0,
  fase: 0, anda: 0, corre: false, bajas: 0, tiempo: 0,
  cuerpo: null, kit: null,
};
let JUG_MEZ = { a: 'quieto', b: null, k: 0 };   // qué pose se está mezclando

function jugArranca() {
  Object.assign(JUG, {
    x: 0, z: 0, rumbo: 0, vx: 0, vz: 0, vida: J_VIDA, vidaMax: J_VIDA, agu: J_AGU,
    nivel: 1, xp: 0, xpSig: XP_NIVEL(1), golpe: -1, gT: 0, gDio: false, gVent: 0,
    esqT: 0, esqEsp: 0, danoT: 0, invT: 0, muerto: false, muerteT: 0,
    fase: 0, anda: 0, corre: false, bajas: 0, tiempo: 0, vive: true,
  });
  JUG.y = H(0, 0);
  if (!JUG.cuerpo) {
    JUG.cuerpo = armaCuerpo(recetaHeroe());
    JUG.kit = armaKit(recetaHeroe(), 1);
  }
}

const jugAtacando = () => JUG.golpe >= 0;
const jugFaseGolpe = () => {                     // 0 carga · 1 activo · 2 fin
  const g = J_COMBO[JUG.golpe];
  return JUG.gT < g.carga ? 0 : (JUG.gT < g.carga + g.activo ? 1 : 2);
};
const jugLargoGolpe = g => g.carga + g.activo + g.fin;

function jugPide(que) {
  if (JUG.muerto) return false;
  if (que === 'esquiva') {
    if (JUG.esqT > 0 || JUG.esqEsp > 0 || JUG.agu < J_AGU_ESQ) return false;
    /* esquivar CANCELA el golpe: si no, el jugador queda clavado en la
       recuperación de un tajo mientras le llega un hachazo que veía venir, y
       eso se lee a que el botón no anduvo */
    JUG.golpe = -1; JUG.gVent = 0;
    JUG.esqT = J_ESQ_T; JUG.esqEsp = J_ESQ_ESPERA; JUG.agu -= J_AGU_ESQ;
    const l = Math.hypot(JUG.entX || 0, JUG.entZ || 0);
    if (l > 0.2) { JUG.esqX = JUG.entX / l; JUG.esqZ = JUG.entZ / l; }
    else { JUG.esqX = Math.sin(JUG.rumbo); JUG.esqZ = Math.cos(JUG.rumbo); }
    JUG.rumbo = Math.atan2(JUG.esqX, JUG.esqZ);
    son('esquiva');
    return true;
  }
  if (que === 'ataca') {
    if (JUG.esqT > 0 || JUG.agu < J_AGU_GOLPE) return false;
    if (JUG.golpe < 0) { JUG.golpe = 0; JUG.gT = 0; JUG.gDio = false; JUG.agu -= J_AGU_GOLPE; son('tajo'); return true; }
    /* ENCADENAR SÓLO EN LA VENTANA. Sin ventana, machacar el botón encadena
       los tres golpes al instante y el tercero —que es el caro— sale gratis */
    if (JUG.gVent > 0 && JUG.golpe < J_COMBO.length - 1) {
      JUG.golpe++; JUG.gT = 0; JUG.gDio = false; JUG.gVent = 0;
      JUG.agu -= J_AGU_GOLPE; son('tajo'); return true;
    }
    return false;
  }
  return false;
}

function jugPaso(dt, ent) {
  JUG.tiempo += dt;
  JUG.entX = ent.x; JUG.entZ = ent.z;
  if (JUG.muerto) { JUG.muerteT += dt; jugPose(dt); return; }

  JUG.invT = Math.max(0, JUG.invT - dt);
  JUG.danoT = Math.max(0, JUG.danoT - dt);
  JUG.esqEsp = Math.max(0, JUG.esqEsp - dt);
  JUG.gVent = Math.max(0, JUG.gVent - dt);

  /* ── el esquive manda sobre todo lo demás ── */
  if (JUG.esqT > 0) {
    JUG.esqT -= dt;
    const u = 1 - JUG.esqT / J_ESQ_T;
    const v = J_ESQ_V * (1 - suav(lim(u, 0, 1)) * 0.72);   // arranca fuerte y frena
    JUG.vx = JUG.esqX * v; JUG.vz = JUG.esqZ * v;
    if (JUG.esqT <= 0) { JUG.vx *= 0.25; JUG.vz *= 0.25; }
  } else if (jugAtacando()) {
    JUG.gT += dt;
    const g = J_COMBO[JUG.golpe];
    /* EL GOLPE EMPUJA HACIA ADELANTE, y no es adorno: sin ese medio metro,
       apuntar a un blanco que retrocede obliga a soltar el botón y volver a
       apretarlo, y el combo de tres deja de existir en la práctica */
    const emp = JUG.gT < g.carga + g.activo ? g.empuje * (1 - JUG.gT / (g.carga + g.activo)) : 0;
    JUG.vx = Math.sin(JUG.rumbo) * emp; JUG.vz = Math.cos(JUG.rumbo) * emp;
    /* EL GOLPE SE RESUELVE UNA VEZ, en la ventana activa. Resolviéndolo en
       cada cuadro del arco, un tajo de 110 ms le pega siete veces al mismo
       bicho y el peón se muere de un toque. */
    if (!JUG.gDio && jugFaseGolpe() === 1) { JUG.gDio = true; jugResuelveGolpe(); }
    if (JUG.gT >= jugLargoGolpe(g)) {
      JUG.gVent = J_COMBO_VENTANA;
      if (JUG.golpe === J_COMBO.length - 1) JUG.gVent = 0;   // el remate no encadena
      JUG.golpe = -1;
    }
  } else {
    /* ── caminar ─────────────────────────────────────────────────────────
       LO QUE SE ACELERA ES SÓLO LO QUE FALTA EN LA DIRECCIÓN PEDIDA, y el
       roce se aplica a lo de costado. Sumando al vector y topando el total,
       doblar FRENA y el tope real queda por debajo del ajuste —el defecto
       que ya costó una vuelta en Z Force—.                                */
    const l = Math.hypot(ent.x, ent.z);
    JUG.corre = ent.corre && l > 0.55 && JUG.agu > 1;
    const vMax = (JUG.corre ? J_CORRE : J_VEL) * (l > 0.34 ? Math.min(1, l) : 0);
    if (l > 0.06) {
      const dx = ent.x / l, dz = ent.z / l;
      JUG.rumbo = angAmort(JUG.rumbo, Math.atan2(dx, dz), 15.5, dt);
      const act = JUG.vx * dx + JUG.vz * dz;
      const falta = vMax - act;
      if (falta > 0) {
        const a = Math.min(falta, 46 * dt);
        JUG.vx += dx * a; JUG.vz += dz * a;
      }
      const lx = JUG.vx - dx * act, lz = JUG.vz - dz * act;
      const f = Math.exp(-11 * dt);
      JUG.vx = dx * act + lx * f; JUG.vz = dz * act + lz * f;
    } else {
      const f = Math.exp(-13 * dt);
      JUG.vx *= f; JUG.vz *= f;
    }
    if (JUG.corre && vMax > 0.2) JUG.agu = Math.max(0, JUG.agu - J_AGU_CORRE * dt);
  }

  /* el aguante se recupera cuando no se gasta, y no mientras se corre */
  if (!JUG.corre && JUG.esqT <= 0) JUG.agu = Math.min(J_AGU, JUG.agu + J_AGU_REC * dt);

  /* ── mover y chocar ── */
  const nx = JUG.x + JUG.vx * dt, nz = JUG.z + JUG.vz * dt;
  const c = corrigeChoque(nx, nz, J_RADIO);
  JUG.x = c.x; JUG.z = c.z;
  const r = largo2(JUG.x, JUG.z);
  if (r > MUNDO_R * 0.955) {                 // el borde del mundo empuja, no frena
    const k = (MUNDO_R * 0.955) / r;
    JUG.x *= k; JUG.z *= k;
  }
  JUG.y = H(JUG.x, JUG.z);

  /* LA FASE DEL PASO SALE DE LA DISTANCIA Y NO DEL RELOJ: así el sonido del
     pie, el balanceo del cuerpo y la cámara son EL MISMO número y no se
     pueden desincronizar, y frenar no patina */
  const v = Math.hypot(JUG.vx, JUG.vz);
  JUG.anda = amort(JUG.anda, JUG.esqT > 0 || jugAtacando() ? 0 : v, 12, dt);
  const antes = JUG.fase;
  JUG.fase += (v * dt) / zancada(JUG_MEZ.b === 'corre' ? JUG_MEZ.k : 0) * Math.PI * 2;
  if (v > 0.6 && Math.floor(antes / Math.PI) !== Math.floor(JUG.fase / Math.PI)) son('pisa');

  jugPose(dt);
}

/* la mezcla de poses: qué se está haciendo manda, y el resto se funde */
function jugPose(dt) {
  let a = 'quieto', arg = JUG.tiempo, b = null, brg = 0, obj = 0;
  if (JUG.muerto) { a = 'muere'; arg = Math.min(1, JUG.muerteT / 1.15); }
  else if (JUG.esqT > 0) { a = 'esquiva'; arg = 1 - JUG.esqT / J_ESQ_T; }
  else if (jugAtacando()) {
    a = 'golpe' + JUG.golpe; arg = JUG.gT / jugLargoGolpe(J_COMBO[JUG.golpe]);
  } else if (JUG.danoT > 0) { a = 'dano'; arg = 1 - JUG.danoT / 0.32; }
  else {
    const v = JUG.anda;
    if (v > 0.35) {
      a = 'camina'; arg = JUG.fase;
      b = 'corre'; brg = JUG.fase;
      obj = lim((v - J_VEL * 0.72) / (J_CORRE - J_VEL * 0.72), 0, 1);
    } else {
      a = 'quieto'; arg = JUG.tiempo;
      b = 'camina'; brg = JUG.fase; obj = lim(v / 1.5, 0, 1);
    }
  }
  JUG_MEZ.a = a; JUG_MEZ.b = b;
  JUG_MEZ.k = b ? obj : 0;
  poseAplica(JUG.cuerpo, a, arg, b, brg, JUG_MEZ.k);
  JUG.cuerpo.raiz.position.set(JUG.x, JUG.y, JUG.z);
  JUG.cuerpo.raiz.rotation.y = JUG.rumbo;
}

/* ── EL CHOQUE SALE DE LA MISMA LISTA QUE DIBUJA EL BOSQUE ─────────────────
   Con una segunda lista "para el choque" el día que se agregue un árbol se
   camina a través de él, o peor: hay una pared invisible donde no hay nada. */
let SOLIDOS = [], SOL_REJA = null, SOL_PASO = 8;
function preparaChoque(solidos) {
  SOLIDOS = solidos; SOL_REJA = new Map();
  for (const s of solidos) {
    const i = Math.floor(s.x / SOL_PASO), j = Math.floor(s.z / SOL_PASO);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const k = (i + a) * 10007 + (j + b);
      (SOL_REJA.get(k) || SOL_REJA.set(k, []).get(k)).push(s);
    }
  }
}
function solidosCerca(x, z) {
  if (!SOL_REJA) return SOLIDOS;
  return SOL_REJA.get(Math.floor(x / SOL_PASO) * 10007 + Math.floor(z / SOL_PASO)) || [];
}
function corrigeChoque(x, z, r) {
  /* una sola pasada de separación por eje de menor penetración: dos círculos
     encimados empujan en sentidos opuestos y dejan al cuerpo trabado */
  for (const s of solidosCerca(x, z)) {
    const dx = x - s.x, dz = z - s.z, R = s.r + r;
    const d2 = dx * dx + dz * dz;
    if (d2 < R * R && d2 > 1e-9) {
      const d = Math.sqrt(d2), k = (R - d) / d;
      x += dx * k; z += dz * k;
    }
  }
  return { x, z };
}

/* ── ESQUIVAR UN TRONCO ────────────────────────────────────────────────────
   Nadie tiene pathfinding acá y no hace falta: lo que hay son árboles
   sueltos, no un laberinto. Con la dirección derecha, un cuerpo empujado
   hacia afuera del tronco y empujando hacia adelante se ANULA, y los dos se
   quedan clavados —medido: el bot y un peón a tres metros, cada uno de un
   lado del mismo árbol, mil quinientos segundos sin moverse—. Alcanza con
   rodear el primer tronco que se cruza.                                    */
function rodea(x, z, dx, dz, r, alcance) {
  const A = alcance === undefined ? 4.2 : alcance;
  let peor = null, pd = 1e9;
  for (const s of solidosCerca(x, z)) {
    const ax = s.x - x, az = s.z - z;
    const t = ax * dx + az * dz;                 // cuánto adelante está
    if (t < 0.05 || t > A) continue;             // detrás, o más lejos que el destino
    const px = ax - dx * t, pz = az - dz * t;    // cuánto de costado
    const lat = Math.hypot(px, pz);
    if (lat > s.r + r + 0.12) continue;          // no está en el camino
    if (t < pd) { pd = t; peor = { r: s.r, px, pz, lat }; }
  }
  if (!peor) return { x: dx, z: dz };
  /* SE ARMA COMO VECTOR Y NO COMO ÁNGULO: con un ángulo hay que acertar el
     signo de la convención, y equivocarse no falla —dirige HACIA el tronco,
     el choque lo empuja afuera, y el cuerpo orbita el árbol para siempre.
     Medido con el signo al revés: mil bajas menos, dos mil segundos girando. */
  const lx = dz, lz = -dx;                       // la perpendicular
  const sg = (peor.px * lx + peor.pz * lz) > 0 ? -1 : 1;   // al lado contrario
  const k = 0.55 + 1.05 * (1 - peor.lat / (peor.r + r + 0.12));
  const nx = dx + lx * sg * k, nz = dz + lz * sg * k;
  const l = Math.hypot(nx, nz) || 1;
  return { x: nx / l, z: nz / l };
}

/* ── LA CÁMARA ─────────────────────────────────────────────────────────────
   Al hombro y no justo atrás: de frente al eje del cuerpo las piernas se
   tapan entre ellas y la zancada casi no se lee.                          */
let CAM_YAW = 0, CAM_PIT = -0.13, CAM_D_ACT = CAM_D;
function camPaso(dt, giroX, giroY) {
  if (!JUG.cuerpo) return;      // en el menú no hay cuerpo todavía
  CAM_YAW -= giroX; CAM_PIT = lim(CAM_PIT - giroY, -0.95, 0.52);
  const ojo = new THREE.Vector3(JUG.x, JUG.y + CAM_MIRA, JUG.z);
  const dir = new THREE.Vector3(
    Math.sin(CAM_YAW) * Math.cos(CAM_PIT), Math.sin(CAM_PIT), Math.cos(CAM_YAW) * Math.cos(CAM_PIT));
  const lado = new THREE.Vector3(Math.cos(CAM_YAW), 0, -Math.sin(CAM_YAW));
  /* SE MARCHA HACIA ATRÁS Y SE CORTA EN EL ÚLTIMO PUNTO LIBRE. Sin esto la
     cámara se mete adentro de un árbol y lo que llena la pantalla es la cara
     interior de un tronco. Y por debajo de CAM_MIN pasa a PRIMERA PERSONA
     entera: una cámara "al hombro" a veinte centímetros no es al hombro, es
     estar adentro del muñeco.
     EL SIGNO: `dir` es hacia dónde MIRA la cámara, así que la cámara va en
     `ojo − dir·d`. Sumándolo queda DELANTE del jugador mirando para el otro
     lado: el héroe no aparece nunca y el juego se ve como un bosque vacío.
     Medido con la matriz de instancia, el cuello del jugador caía en z de
     vista +4,98 —o sea cinco metros DETRÁS del lente— y proyectaba igual en
     el medio del cuadro, porque un punto de atrás proyecta dado vuelta y cae
     adentro. Es la misma trampa que en RECREO dio un autobús «entero y
     centrado» con la cámara mirando al revés.                              */
  let d = CAM_D;
  for (let i = 8; i >= 1; i--) {
    const p = i / 8 * CAM_D;
    const px = ojo.x - dir.x * p + lado.x * CAM_LADO;
    const pz = ojo.z - dir.z * p + lado.z * CAM_LADO;
    const py = ojo.y - dir.y * p + CAM_H * 0.30;
    let libre = py > H(px, pz) + 0.35;
    if (libre) for (const s of solidosCerca(px, pz)) {
      if (dist2(px, pz, s.x, s.z) < (s.r + 0.42) * (s.r + 0.42)) { libre = false; break; }
    }
    if (libre) { d = p; break; }
    d = (i - 1) / 8 * CAM_D;
  }
  CAM_D_ACT = amort(CAM_D_ACT, d, d < CAM_D_ACT ? 34 : 7.5, dt);
  const pri = CAM_D_ACT < CAM_MIN;
  const dd = pri ? 0 : CAM_D_ACT, ll = pri ? 0 : CAM_LADO;
  const px = ojo.x - dir.x * dd + lado.x * ll;
  const pz = ojo.z - dir.z * dd + lado.z * ll;
  const py = ojo.y - dir.y * dd + (pri ? J_ALTO - CAM_MIRA : CAM_H * 0.30);
  cam.position.set(px, Math.max(py, H(px, pz) + 0.28), pz);
  cam.rotation.set(CAM_PIT, CAM_YAW + Math.PI, 0);
  /* la cabeza se achica a la centésima parte en primera persona: una cámara
     metida en la cabeza no puede ver la cabeza, sólo su interior */
  const e = pri ? 0.01 : 1;
  JUG.cuerpo.h.cuello.scale.setScalar(e);
  /* la caja de sombra sigue al jugador: 26 m de lado son 79 texels por metro
     contra los 9 que daría cubrir el mundo entero */
  solLuz.position.set(JUG.x + 24, JUG.y + 40, JUG.z + 16);
  solLuz.target.position.set(JUG.x, JUG.y, JUG.z);
  solLuz.target.updateMatrixWorld();
}

/* la dirección de la entrada es RELATIVA A LA CÁMARA: con el joystick en
   ejes de mundo, girar la cámara deja "adelante" apuntando a otro lado */
function entradaMundo(jx, jz) {
  const s = Math.sin(CAM_YAW), c = Math.cos(CAM_YAW);
  return { x: jx * c - jz * s, z: -jx * s - jz * c };
}
/* ══════════════════════════════════════════════════════════════════════════
   LOS ESQUELETOS — una sola máquina de estados para las cuatro clases
   ══════════════════════════════════════════════════════════════════════════
   La diferencia entre un peón y el rey son NÚMEROS, no ramas. Un enemigo con
   su propio `if` es un enemigo que el día que se corrija un defecto se queda
   sin corregir — y eso no falla, hace otra cosa.                           */

let ESQS = [], ESQ_KIT = null, ESQ_TINTE = new THREE.Color();

function esqArranca(lista) {
  ESQS = lista.map((s, i) => ({
    id: i, cl: s.cl, zona: s.zona, x: s.x, z: s.z, y: H(s.x, s.z),
    rumbo: Math.atan2(-s.x, -s.z), vx: 0, vz: 0,
    vida: ESQ[s.cl].vida, vidaMax: ESQ[s.cl].vida,
    sx: s.x, sz: s.z, est: 'duerme', t: 0, esp: 0, atur: 0, muerteT: 0, vive: true, gDio: false,
    fase: Math.random() * 6.283, ronX: s.x, ronZ: s.z, ronT: 0,
    cuerpo: null, tinte: null,
    /* la corona y la capa son del rey y de nadie más */
    sin: s.cl === 'rey' ? null : { corona: 1, capa: 1 },
  }));
  if (!ESQ_KIT) ESQ_KIT = armaKit(recetaEsq(), ESQ_TURBA + 2);
  for (const e of ESQS) {
    e.cuerpo = armaCuerpo(recetaEsq());
    e.cuerpo.raiz.scale.setScalar(ESQ[e.cl].esc);
    e.tinte = new THREE.Color(ESQ[e.cl].color).convertSRGBToLinear();
  }
}

const esqVivos = z => ESQS.filter(e => e.vive && e.zona === z).length;

/* ── UNA ZONA CERRADA NO PERSIGUE ──────────────────────────────────────────
   Medido: el REY tiene 60 m de vista, así que se levantaba de la ceniza y
   cruzaba el mapa a buscarte — cuatro de los ocho golpes que mataban al bot
   eran suyos, a nivel 2 y en tierra de las ruinas. Un jefe que te caza antes
   de que su zona se abra no es dificultad: borra la progresión entera, que es
   lo único que convierte "matar esqueletos" en una partida.                */
const esqDespierto = e => e.zona <= ZONA_ACT;

/* SÓLO SE DIBUJAN Y SE SIMULAN LOS QUE ESTÁN CERCA. Con los treinta corriendo
   siempre, el mundo entero pelea a la vez y el cupo del kit no alcanza; y con
   una lista pintada sin filtrar, la instancia 20 se dibuja en un sitio donde
   no hay nadie. El filtro es UNO y lo usan la simulación y el dibujo.      */
function esqCerca() {
  const v = CAL[CALIDAD].vista + 10, out = [];
  for (const e of ESQS) {
    if (!e.vive) continue;
    if (dist2(e.x, e.z, JUG.x, JUG.z) > v * v) continue;
    out.push(e);
    if (out.length >= ESQ_TURBA) break;
  }
  return out;
}

function esqPaso(dt) {
  const cerca = esqCerca();
  for (const e of cerca) {
    const D = ESQ[e.cl];
    e.t += dt; e.fase += dt;
    e.atur = Math.max(0, e.atur - dt);
    e.esp = Math.max(0, e.esp - dt);
    const d = Math.sqrt(dist2(e.x, e.z, JUG.x, JUG.z));

    if (e.est === 'muere') { e.muerteT += dt; if (e.muerteT > ESQ_MUERE) e.vive = false; esqPose(e, dt, d); continue; }
    if (e.atur > 0) { e.vx *= Math.exp(-9 * dt); e.vz *= Math.exp(-9 * dt); esqMueve(e, dt); esqPose(e, dt, d); continue; }

    switch (e.est) {
      case 'duerme':
        /* SE DESPIERTA POR VISTA Y NO POR UN RELOJ. Cada clase tiene su
           alcance: el rey te ve de lejos, un peón no. */
        if (d < D.vista && !JUG.muerto && esqDespierto(e)) { e.est = 'persigue'; e.t = 0; son('gruñe'); }
        break;
      case 'ronda': {
        e.ronT -= dt;
        if (e.ronT <= 0) {
          const a = Math.random() * 6.283, r = 2.5 + Math.random() * 5;
          e.ronX = e.x + Math.cos(a) * r; e.ronZ = e.z + Math.sin(a) * r;
          e.ronT = 2.5 + Math.random() * 3;
        }
        esqVa(e, dt, e.ronX, e.ronZ, D.vel * 0.42);
        if (d < D.vista && !JUG.muerto && esqDespierto(e)) { e.est = 'persigue'; e.t = 0; }
        break;
      }
      case 'persigue': {
        if (JUG.muerto || !esqDespierto(e)) { e.est = 'ronda'; e.ronT = 0; break; }
        if (d > D.vista * 1.5) { e.est = 'ronda'; e.ronT = 0; break; }
        /* LA CORREA: arrastrado lejos de su sitio, se vuelve. Sin esto se
           puede sacar a los nueve de la ceniza de a uno hasta el claro del
           arranque y pelearlos en fila — que es exactamente no jugar. */
        if (dist2(e.x, e.z, e.sx, e.sz) > (D.vista * 1.7) * (D.vista * 1.7)) { e.est = 'vuelve'; break; }
        /* SE PARA A SU ALCANCE Y NO ENCIMA. Yendo siempre al centro del
           jugador, un bruto de 62 cm de radio lo empuja fuera del suyo y no
           llega a pegarle nunca: la pelea se convierte en un forcejeo.     */
        const para = D.alc * 0.78 + J_RADIO;
        if (d > para) esqVa(e, dt, JUG.x, JUG.z, D.vel);
        else { e.vx *= Math.exp(-10 * dt); e.vz *= Math.exp(-10 * dt); esqMira(e, dt, 7); }
        if (d < D.alc && e.esp <= 0) { e.est = 'carga'; e.t = 0; e.gDio = false; }
        break;
      }
      case 'vuelve': {
        esqVa(e, dt, e.sx, e.sz, D.vel * 0.85);
        if (dist2(e.x, e.z, e.sx, e.sz) < 9) { e.est = 'ronda'; e.ronT = 0; e.vida = e.vidaMax; }
        break;
      }
      case 'carga':
        e.vx *= Math.exp(-12 * dt); e.vz *= Math.exp(-12 * dt);
        esqMira(e, dt, 4.5);                  // sigue apuntando, pero despacio
        if (e.t >= D.carga) { e.est = 'golpe'; e.t = 0; son('tajoEsq'); }
        break;
      case 'golpe': {
        const largo = 0.42;
        /* el golpe da EN UN INSTANTE del arco y no durante todo el estado; si
           no, quedarse pegado al bicho recibe cuatro veces el mismo tajo */
        if (!e.gDio && e.t > largo * 0.38) {
          e.gDio = true;
          const dz = Math.cos(e.rumbo), dx = Math.sin(e.rumbo);
          const rx = JUG.x - e.x, rz = JUG.z - e.z;
          const dd = Math.hypot(rx, rz);
          const frente = dd > 0.001 ? (rx * dx + rz * dz) / dd : 1;
          if (dd < D.alc + J_RADIO && frente > 0.35) jugRecibe(D.dano, e.x, e.z, D.empuje, e.cl);
        }
        if (e.t >= largo) { e.est = 'persigue'; e.esp = D.cad; }
        break;
      }
    }
    esqMueve(e, dt);
    esqPose(e, dt, d);
  }
  kitPinta(ESQ_KIT, cerca);
}

function esqVa(e, dt, tx, tz, vel) {
  const dx = tx - e.x, dz = tz - e.z, l = Math.hypot(dx, dz);
  if (l < 0.05) return;
  const g = rodea(e.x, e.z, dx / l, dz / l, ESQ[e.cl].radio, Math.min(l, 4.2));
  const ux = g.x, uz = g.z;
  e.vx = amort(e.vx, ux * vel, 8, dt); e.vz = amort(e.vz, uz * vel, 8, dt);
  e.rumbo = angAmort(e.rumbo, Math.atan2(ux, uz), 6.5, dt);
}
function esqMira(e, dt, k) {
  e.rumbo = angAmort(e.rumbo, Math.atan2(JUG.x - e.x, JUG.z - e.z), k, dt);
}

function esqMueve(e, dt) {
  const D = ESQ[e.cl];
  let x = e.x + e.vx * dt, z = e.z + e.vz * dt;
  const c = corrigeChoque(x, z, D.radio);
  x = c.x; z = c.z;
  /* LOS ESQUELETOS NO SE ATRAVIESAN ENTRE ELLOS: sin esto, una turba de
     catorce converge en el mismo punto y lo que se ve es UN bicho grueso */
  for (const o of ESQS) {
    if (o === e || !o.vive || o.est === 'muere') continue;
    const R = D.radio + ESQ[o.cl].radio;
    const d2 = dist2(x, z, o.x, o.z);
    if (d2 < R * R && d2 > 1e-6) {
      const d = Math.sqrt(d2), k = (R - d) / d * 0.5;
      x += (x - o.x) * k; z += (z - o.z) * k;
    }
  }
  const r = largo2(x, z);
  if (r > MUNDO_R * 0.96) { const k = MUNDO_R * 0.96 / r; x *= k; z *= k; }
  e.x = x; e.z = z; e.y = H(x, z);
}

function esqPose(e, dt, d) {
  const D = ESQ[e.cl];
  let a = 'quieto', arg = e.fase, b = null, brg = 0, k = 0;
  if (e.est === 'muere') { a = 'muere'; arg = Math.min(1, e.muerteT / (ESQ_MUERE * 0.72)); }
  else if (e.atur > 0) { a = 'dano'; arg = 1 - e.atur / ESQ_ATURDE; }
  else if (e.est === 'carga') { a = 'carga'; arg = Math.min(1, e.t / D.carga); }
  else if (e.est === 'golpe') { a = 'tajo'; arg = Math.min(1, e.t / 0.42); }
  /* LA CADENCIA SALE DE LA VELOCIDAD Y DE LA ZANCADA (`ω = 2π·v/zancada`), y
     la fase se adelanta SIEMPRE —también en carga o aturdido— porque si no,
     al volver a caminar el ciclo arranca de donde quedó hace tres segundos y
     el primer paso sale con el pie en el aire.                             */
  const v = Math.hypot(e.vx, e.vz);
  e.paso = (e.paso || 0) + (v * dt) / (zancada(0) * D.esc) * Math.PI * 2;
  if (a === 'quieto' && v > 0.25) { b = 'camina'; brg = e.paso; k = lim(v / (D.vel * 0.9), 0, 1); }
  poseAplica(e.cuerpo, a, arg, b, brg, k);
  e.cuerpo.raiz.position.set(e.x, e.y, e.z);
  e.cuerpo.raiz.rotation.y = e.rumbo;
  e.cuerpo.raiz.scale.setScalar(D.esc);
  /* el tinte parpadea al recibir: es el único acuse de recibo que hay de que
     el golpe entró, porque una barra de vida sobre catorce bichos es ruido */
  const f = e.atur > 0 ? e.atur / ESQ_ATURDE : 0;
  e.tinte.setHex(D.color).convertSRGBToLinear();
  if (f > 0) e.tinte.lerp(ESQ_TINTE.setRGB(2.2, 0.55, 0.42), f * 0.85);
  if (e.est === 'carga') {
    const q = Math.min(1, e.t / D.carga);
    e.tinte.lerp(ESQ_TINTE.setRGB(1.35, 0.62, 0.30), q * 0.42);
  }
}

function esqRecibe(e, dano, dx, dz, empuje) {
  if (!e.vive || e.est === 'muere') return false;
  e.vida -= dano;
  e.atur = ESQ_ATURDE;
  const l = Math.hypot(dx, dz) || 1;
  e.vx += dx / l * empuje / (1 + ESQ[e.cl].radio * 2.2);
  e.vz += dz / l * empuje / (1 + ESQ[e.cl].radio * 2.2);
  if (e.vida <= 0) {
    e.est = 'muere'; e.muerteT = 0; e.vida = 0;
    son('rompe');
    jugGanaXp(ESQ[e.cl].xp);
    JUG.vida = Math.min(JUG.vidaMax, JUG.vida + e.vidaMax * MATA_CURA);
    JUG.bajas++;
    return true;
  }
  son('pega');
  return false;
}
/* ══════════════════════════════════════════════════════════════════════════
   EL DAÑO, LA XP Y LAS ZONAS — una sola cuenta, y la usan todos
   ══════════════════════════════════════════════════════════════════════════
   El golpe del jugador se resuelve en UNA función. Con la cuenta escrita en
   el sitio del jugador y otra vez en el del auto-jugador, el auto-jugador
   estaría probando un juego que no existe.                                */

let ZONA_ACT = 0, PART = 'menu', FIN_T = 0, GANO = false;
let SANGRE = 0, SACUDE = 0, AVISO = '', AVISO_T = 0;

/* ¿este esqueleto entra en el arco del golpe? */
function enArco(e, x, z, rumbo, alc, arco) {
  const R = alc + ESQ[e.cl].radio;
  const dx = e.x - x, dz = e.z - z, d2 = dx * dx + dz * dz;
  if (d2 > R * R) return false;
  const d = Math.sqrt(d2);
  if (d < 0.05) return true;
  const c = (dx * Math.sin(rumbo) + dz * Math.cos(rumbo)) / d;
  return c > Math.cos(arco * 0.5);
}

function jugResuelveGolpe() {
  const g = J_COMBO[JUG.golpe];
  const mult = 1 + (JUG.nivel - 1) * NIV_DANO;
  let n = 0;
  for (const e of ESQS) {
    if (!e.vive || e.est === 'muere') continue;
    if (!enArco(e, JUG.x, JUG.z, JUG.rumbo, g.alc, g.arco)) continue;
    esqRecibe(e, Math.round(g.dano * mult), e.x - JUG.x, e.z - JUG.z, g.empuje);
    n++;
    /* SÓLO EL REMATE BARRE. Los dos primeros son tajos y le dan a UNO: si
       los tres pegaran a todos, una turba de seis se limpia machacando el
       botón y las clases dejan de significar algo. */
    if (JUG.golpe < J_COMBO.length - 1) break;
  }
  if (n) { SACUDE = Math.max(SACUDE, JUG.golpe === 2 ? 0.30 : 0.16); son('impacto'); }
  return n;
}

const TALLY = { golpes: 0, dano: 0, porCl: {}, esquivados: 0 };
function jugRecibe(dano, dx, dz, empuje, cl) {
  if (JUG.muerto) return;
  /* LOS CUADROS DE INVENCIBILIDAD DEL ESQUIVE SON LA MITAD DEL JUEGO: sin
     ellos esquivar es "correr un poco" y el aviso de carga no sirve de nada */
  if (JUG.esqT > 0 && (J_ESQ_T - JUG.esqT) < J_ESQ_INV) { TALLY.esquivados++; son('roza'); return; }
  if (JUG.invT > 0) return;
  JUG.vida -= dano;
  TALLY.golpes++; TALLY.dano += dano; TALLY.porCl[cl || '?'] = (TALLY.porCl[cl || '?'] || 0) + 1;
  JUG.invT = 0.42; JUG.danoT = 0.32;
  const l = Math.hypot(JUG.x - dx, JUG.z - dz) || 1;
  JUG.vx += (JUG.x - dx) / l * empuje;
  JUG.vz += (JUG.z - dz) / l * empuje;
  SANGRE = Math.min(1, SANGRE + 0.55);
  SACUDE = Math.max(SACUDE, 0.34);
  son('dano');
  if (JUG.vida <= 0) {
    JUG.vida = 0; JUG.muerto = true; JUG.muerteT = 0; JUG.golpe = -1; JUG.esqT = 0;
    son('muere'); PART = 'fin'; GANO = false; FIN_T = 0;
  }
}

function jugGanaXp(n) {
  JUG.xp += n;
  while (JUG.xp >= JUG.xpSig) {
    JUG.xp -= JUG.xpSig; JUG.nivel++;
    JUG.xpSig = XP_NIVEL(JUG.nivel);
    JUG.vidaMax += NIV_VIDA;
    /* SUBIR DE NIVEL CURA. Sin eso, la recompensa de matar a diez llega justo
       cuando no queda vida para usarla y la progresión se siente un castigo */
    JUG.vida = Math.min(JUG.vidaMax, JUG.vida + NIV_VIDA * 2.2);
    avisa(T('subiste', JUG.nivel));
    son('nivel');
  }
}

function avisa(txt, seg) { AVISO = txt; AVISO_T = seg || 2.6; }

/* ── LAS ZONAS ─────────────────────────────────────────────────────────────
   Una zona se abre cuando la anterior quedó limpia. Es lo único que
   convierte "matar esqueletos" en una partida con principio y final.      */
function zonasPaso(dt) {
  const quedan = esqVivos(ZONA_ACT);
  if (quedan === 0 && ZONA_ACT < ZONAS.length - 1) {
    ZONA_ACT++;
    /* ── LIMPIAR UNA ZONA ES EL PUNTO DE CONTROL ───────────────────────────
       Antes abrir la siguiente era PURO COSTO: te la ganabas con la vida por
       la mitad y entrabas a pelear contra cosas del doble de vida. Medido con
       el bot en tres semillas: doce bajas, nivel 2, muerto en la ceniza, las
       tres veces — el juego no se podía terminar. Curar entero y regalar un
       nivel es lo que convierte la puerta en un respiro y no en un embudo. */
    JUG.vida = JUG.vidaMax;
    jugGanaXp(JUG.xpSig - JUG.xp);
    avisa(T('abre') + ' · ' + T('z' + ZONAS[ZONA_ACT].id), 3.4);
    son('zona');
  } else if (quedan === 0 && ZONA_ACT === ZONAS.length - 1 && PART === 'juego') {
    PART = 'fin'; GANO = true; FIN_T = 0; son('gana');
  }
}

/* la niebla, el cielo y la luz salen de la zona EN LA QUE ESTÁ EL JUGADOR y
   no de la que le toca matar: lo que hay que ver es dónde estás parado */
const _CN = new THREE.Color(), _CC = new THREE.Color(), _CL = new THREE.Color();
let ZONA_VIS = 0;
function zonaMezcla(dt) {
  const zi = zonaDe(JUG.x, JUG.z), Z = ZONAS[zi];
  if (!esc.fog) { esc.fog = new THREE.FogExp2(Z.niebla, Z.nieblaD); esc.background = new THREE.Color(Z.cielo); ZONA_VIS = zi; }
  const k = 1 - Math.exp(-1.9 * dt);
  esc.fog.color.lerp(_CN.setHex(Z.niebla), k);
  esc.fog.density = mez(esc.fog.density, Z.nieblaD * (CALIDAD === 'baja' ? 1.22 : 1), k);
  esc.background.lerp(_CC.setHex(Z.cielo), k);
  solLuz.color.lerp(_CL.setHex(Z.luz), k);
  solLuz.intensity = mez(solLuz.intensity, Z.sol, k);
  ambLuz.intensity = mez(ambLuz.intensity, Z.amb, k);
  hemLuz.intensity = mez(hemLuz.intensity, Z.amb * 1.62, k);
  ZONA_VIS = zi;
}
/* ══════════════════════════════════════════════════════════════════════════
   EL SONIDO Y LA INTERFAZ
   ══════════════════════════════════════════════════════════════════════════
   El audio es PROCEDURAL y no un archivo, por lo mismo que en Eco: lo que
   suena acá son golpes de hueso, pisadas y una cama de aire. Un clip pesa
   cientos de kilobytes y encima se corta en cada vuelta del bucle, y ese
   corte se escucha más que la cama.                                       */

let AC = null, MAESTRO = null, CAMA = null, CAMA_G = null, RUIDO = null, ANAL = null;

function audioArranca() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  MAESTRO = AC.createGain(); MAESTRO.gain.value = 0.85; MAESTRO.connect(AC.destination);
  /* el analizador cuelga del MAESTRO y de nada más: es lo único que prueba
     que algo sonó de verdad, y con dos caminos de audio uno queda sin medir */
  ANAL = AC.createAnalyser(); ANAL.fftSize = 2048; MAESTRO.connect(ANAL);

  const n = AC.sampleRate * 1.0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  RUIDO = b;

  /* la cama: viento grave filtrado. Va debajo de todo, porque un golpe tiene
     que ser un ACONTECIMIENTO y no un matiz por encima de un zumbido        */
  CAMA = AC.createBufferSource(); CAMA.buffer = RUIDO; CAMA.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; f.Q.value = 0.7;
  CAMA_G = AC.createGain(); CAMA_G.gain.value = 0.030;
  CAMA.connect(f); f.connect(CAMA_G); CAMA_G.connect(MAESTRO);
  CAMA.start();
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.055;
  const lg = AC.createGain(); lg.gain.value = 120;
  lfo.connect(lg); lg.connect(f.frequency); lfo.start();
}

function _ruido(dur, tipo, frec, Q, vol, caida) {
  const s = AC.createBufferSource(); s.buffer = RUIDO;
  const f = AC.createBiquadFilter(); f.type = tipo; f.frequency.value = frec; f.Q.value = Q;
  const g = AC.createGain();
  const t = AC.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur * (caida || 1));
  s.connect(f); f.connect(g); g.connect(MAESTRO);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
function _tono(f0, f1, dur, vol, tipo) {
  const o = AC.createOscillator(); o.type = tipo || 'square';
  const g = AC.createGain(); const t = AC.currentTime;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MAESTRO); o.start(t); o.stop(t + dur + 0.03);
}

const SON = {
  pisa:    () => _ruido(0.13, 'lowpass', 420, 1.0, 0.075, 0.7),
  tajo:    () => _ruido(0.19, 'bandpass', 2400, 0.9, 0.085, 0.8),
  tajoEsq: () => _ruido(0.22, 'bandpass', 1500, 1.1, 0.070, 0.9),
  /* el impacto son DOS cosas: el golpe grave del cuerpo y el chasquido del
     hueso. Con una sola suena a caja de cartón */
  impacto: () => { _ruido(0.16, 'lowpass', 260, 1.2, 0.34, 0.6); _ruido(0.10, 'highpass', 2600, 0.8, 0.20, 0.5); },
  pega:    () => _ruido(0.11, 'bandpass', 1900, 1.4, 0.16, 0.6),
  rompe:   () => { _ruido(0.42, 'bandpass', 1250, 0.6, 0.30, 1.0); _ruido(0.30, 'highpass', 3200, 0.7, 0.18, 0.9); },
  dano:    () => { _tono(220, 90, 0.26, 0.24, 'sawtooth'); _ruido(0.22, 'lowpass', 700, 0.8, 0.26, 0.8); },
  roza:    () => _ruido(0.14, 'highpass', 4200, 0.9, 0.11, 0.6),

/* ══════════════════════════════════════════════════════════════════════════
   LA ENTRADA Y EL BUCLE

const ENT = { x: 0, z: 0, corre: false };
const TECLAS = {};
let JOY = { id: -1, cx: 0, cy: 0, dx: 0, dy: 0, r: 54 };
let GIRO = { id: -1, px: 0, py: 0, x: 0, y: 0 };
let MUNDO = null, SEM = 1;

/* ── EL MARCO ESTÁ GIRADO EN VERTICAL, así que un toque de pantalla NO cae
   donde uno cree. `getBoundingClientRect` sobre un elemento girado devuelve
   la caja ALINEADA A LOS EJES, y para un joystick redondo eso da el cuadrado
   equivocado. La conversión es la inversa del rotate(90deg).              */
function aMarco(px, py) {
  if (!document.body.classList.contains('girado')) {
    const r = document.getElementById('marco').getBoundingClientRect();
    return { x: px - r.left, y: py - r.top };
  }
  const W = innerWidth, H = innerHeight;
  return { x: (py - H / 2) + ANCHO / 2, y: ALTO / 2 - (px - W / 2) };
}
function dMarco(dx, dy) {
  return document.body.classList.contains('girado') ? { x: dy, y: -dx } : { x: dx, y: dy };
}

function armaEntrada() {
  const lz = document.getElementById('lienzo');

  addEventListener('keydown', e => {
    TECLAS[e.code] = true;
    if (e.code === 'Escape') { PART === 'juego' ? pausa(true) : (PART === 'pausa' ? pausa(false) : 0); }
    if (e.code === 'Space' && PART === 'juego') { e.preventDefault(); jugPide('esquiva'); }
  });
  addEventListener('keyup', e => { TECLAS[e.code] = false; });
  addEventListener('blur', () => { for (const k in TECLAS) TECLAS[k] = false; });

  /* EN PC EL BOTÓN IZQUIERDO ATACA Y EL DERECHO NO HACE NADA: con el ratón
     capturado no hay menú contextual que valga, y un botón que abre el menú
     del navegador en medio de una pelea es peor que no tener botón          */
  lz.addEventListener('contextmenu', e => e.preventDefault());
  lz.addEventListener('mousedown', e => {
    if (PART !== 'juego') return;
    if (e.button === 0) { jugPide('ataca'); if (!document.pointerLockElement) lz.requestPointerLock(); }
  });
  addEventListener('mousemove', e => {
    if (document.pointerLockElement === lz) { GIRO.x += e.movementX * 0.0028; GIRO.y += e.movementY * 0.0022; }
  });

  /* táctil: el joystick nace DONDE SE APOYA el dedo en su cuarto de pantalla.
     Con el joystick clavado en un sitio hay que buscarlo mirando el pulgar. */
  const zonaJoy = p => p.x < ANCHO * 0.42;
  lz.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    const p = aMarco(e.clientX, e.clientY);
    if (zonaJoy(p) && JOY.id < 0) {
      JOY.id = e.pointerId; JOY.cx = p.x; JOY.cy = p.y; JOY.dx = 0; JOY.dy = 0;
      const j = document.getElementById('joy');
      j.style.left = p.x + 'px'; j.style.top = p.y + 'px'; j.style.opacity = 1;
    } else if (GIRO.id < 0) { GIRO.id = e.pointerId; GIRO.px = e.clientX; GIRO.py = e.clientY; }
  }, { passive: false });
  addEventListener('pointermove', e => {
    if (e.pointerId === JOY.id) {
      const p = aMarco(e.clientX, e.clientY);
      JOY.dx = p.x - JOY.cx; JOY.dy = p.y - JOY.cy;
      const l = Math.hypot(JOY.dx, JOY.dy);
      JOY.bruto = l / JOY.r;
      if (l > JOY.r) { JOY.dx *= JOY.r / l; JOY.dy *= JOY.r / l; }
      const q = document.getElementById('joyP');
      q.style.transform = `translate(${JOY.dx}px,${JOY.dy}px)`;
    } else if (e.pointerId === GIRO.id) {
      const d = dMarco(e.clientX - GIRO.px, e.clientY - GIRO.py);
      GIRO.x += d.x * 0.0060; GIRO.y += d.y * 0.0048;
      GIRO.px = e.clientX; GIRO.py = e.clientY;
    }
  });
  const suelta = e => {
    if (e.pointerId === JOY.id) {
      JOY.id = -1; JOY.dx = JOY.dy = 0; JOY.bruto = 0;
      document.getElementById('joy').style.opacity = 0;
      document.getElementById('joyP').style.transform = 'translate(0,0)';
    }
    if (e.pointerId === GIRO.id) GIRO.id = -1;
  };
  addEventListener('pointerup', suelta); addEventListener('pointercancel', suelta);

  const bt = (id, fn) => {
    const e = document.getElementById(id);
    e.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); fn(); }, { passive: false });
  };
  bt('bAtaca', () => jugPide('ataca'));
  bt('bEsq', () => jugPide('esquiva'));
  bt('bCam', () => { CAM_YAW = JUG.rumbo + Math.PI; });   // volver a poner la cámara detrás
  bt('bPausa', () => pausa(true));
}

function entradaLee() {
  let x = 0, z = 0, corre = false;
  if (JOY.id >= 0) {
    x = JOY.dx / JOY.r; z = JOY.dy / JOY.r;
    /* CORRER ES EMPUJAR MÁS ALLÁ DEL ARO, no llegar al borde. Con el umbral
       sobre el valor YA RECORTADO, un pulgar que lleva la palanca al canto
       —o sea lo normal— corre siempre y caminar deja de existir. */
    corre = (JOY.bruto || 0) > 1.30;
  } else {
    if (TECLAS.KeyW || TECLAS.ArrowUp) z -= 1;
    if (TECLAS.KeyS || TECLAS.ArrowDown) z += 1;
    if (TECLAS.KeyA || TECLAS.ArrowLeft) x -= 1;
    if (TECLAS.KeyD || TECLAS.ArrowRight) x += 1;
    corre = !!(TECLAS.ShiftLeft || TECLAS.ShiftRight);
  }
  const m = entradaMundo(x, z);
  ENT.x = m.x; ENT.z = m.z; ENT.corre = corre;
  return ENT;
}

function nuevaPartida(sem) {
  SEM = sem || (Date.now() & 0xffff);
  MUNDO = siembra(SEM);
  preparaChoque(MUNDO.solidos);

  armaVegetacion(MUNDO);

  esqArranca(siembraEsq(SEM, MUNDO.solidos));
  ZONA_ACT = 0; TALLY.golpes = 0; TALLY.dano = 0; TALLY.porCl = {}; TALLY.esquivados = 0; SANGRE = 0; SACUDE = 0; AVISO_T = 0;
  DICHO[0] = DICHO[1] = DICHO[2] = DICHO[3] = false;
  CAM_YAW = Math.PI; CAM_PIT = -0.13; CAM_D_ACT = CAM_D;

}
function pausa(v) {
  if (v && PART === 'juego') { PART = 'pausa'; verPanel('pPausa'); document.exitPointerLock?.(); }
  else if (!v && PART === 'pausa') { PART = 'juego'; verPanel(null); }
}

/* ── EL MENÚ MUESTRA EL JUEGO ──────────────────────────────────────────────
   Un panel negro delante de NADA tira a la basura lo único que este menú
   tiene para enseñar: que es un bosque con esqueletos adentro. El velo del
   panel ya es un degradado —cerrado arriba y abajo, donde van el título y los
   botones, y abierto en la franja del medio— así que lo único que faltaba era
   que hubiera algo detrás. Es lo mismo que POMPOM, DASH y RezUno.
   SE SIEMBRA UNA SOLA VEZ, con semilla fija: el menú tiene que verse igual
   cada vez que se vuelve a él, y `nuevaPartida` resiembra igual.
   Y LOS ESQUELETOS NO SE MUEVEN NI PEGAN: acá se les corre la POSE y nada
   más. `esqPaso` es el que decide y hace daño, y un héroe que se muere solo
   mientras alguien mira el título no es un demo, es un defecto.            */
const MENU_SEM = 3141;
const MENU_X = 0.64;              // a qué fracción de media pantalla cae el héroe
let MENU_LISTO = false, MENU_T = 0;
function menuMundo() {
  MENU_LISTO = true;
  MUNDO = siembra(MENU_SEM);
  preparaChoque(MUNDO.solidos);
  armaSuelo();
  armaVegetacion(MUNDO);
  jugArranca();
  esqArranca(siembraEsq(MENU_SEM, MUNDO.solidos));
  ZONA_ACT = 0; ZONA_VIS = 0;
  JUG.x = 0; JUG.z = 0; JUG.y = H(0, 0); JUG.rumbo = 0;
}
function menuPaso(dt) {
  if (!MENU_LISTO) return;
  MENU_T += dt;
  JUG.rumbo = Math.sin(MENU_T * 0.21) * 0.5;
  poseAplica(JUG.cuerpo, 'quieto', MENU_T, null, 0, 0);
  JUG.cuerpo.raiz.position.set(JUG.x, JUG.y, JUG.z);
  JUG.cuerpo.raiz.rotation.y = JUG.rumbo;
  const cerca = esqCerca();
  for (const e of cerca) esqPose(e, dt, 99);
  kitPinta(ESQ_KIT, cerca);
  /* la cámara ORBITA despacio: una vuelta cada 78 s. Más rápido compite con
     el título, que es lo que hay que leer primero. */
  /* la cámara ORBITA despacio: una vuelta cada 78 s. Más rápido compite con
     el título, que es lo que hay que leer primero. Y va CORRIDA de costado
     para que el héroe caiga en el tercio izquierdo: la columna de botones vive
     centrada, así que un héroe en el medio queda detrás de JUGAR. */
  /* ── DÓNDE CAE EL HÉROE EN EL CUADRO SE DERIVA, NO SE TANTEA ────────────
     Con el corrimiento escrito a mano (2,3 m) quedaba en el 62 % del ancho,
     o sea DETRÁS de la fila de GRÁFICOS, que llega hasta el 74 %. Y el
     número correcto depende del campo y de la distancia, así que un metraje
     fijo se rompe en cuanto se toca cualquiera de los dos o cambia la
     proporción de la pantalla. Se elige la FRACCIÓN de media pantalla y el
     corrimiento sale de ahí: `lat = frac · tan(fov/2) · aspecto · d`.      */
  const a = MENU_T * 0.081, d = 6.3;
  const lat = MENU_X * Math.tan(cam.fov * Math.PI / 360) * cam.aspect * d;
  const lx = Math.cos(a), lz = -Math.sin(a);
  cam.position.set(JUG.x + Math.sin(a) * d - lx * lat, JUG.y + 2.20, JUG.z + Math.cos(a) * d - lz * lat);
  cam.lookAt(JUG.x - lx * lat, JUG.y + 1.05, JUG.z - lz * lat);
}

/* ── EL BUCLE ──────────────────────────────────────────────────────────────
   PASO FIJO CON INTERPOLACIÓN. Un teléfono a 30 y una notebook a 144 tienen
   que jugar el MISMO juego: con el paso variable la velocidad, el alcance del
   golpe y la ventana del combo salen distintos, y eso no es rendimiento, es
   otro juego.                                                              */
let ACUM = 0, FPS = 60, _fpsN = 0, _fpsT = 0;
function bucle() {
  requestAnimationFrame(bucle);       // primero, así una excepción no lo mata
  const dt = Math.min(0.25, reloj.getDelta());
  _fpsN++; _fpsT += dt;
  if (_fpsT > 0.5) { FPS = _fpsN / _fpsT; _fpsN = 0; _fpsT = 0; }

  try {
    /* CONGELAR ES QUE NO AVANCE NADA, no sólo la física: con las partículas y
       la cámara corriendo, la foto sale de tres cuadros después del instante
       que la sonda pidió. Se sigue DIBUJANDO, que es lo que hace falta. */
    if (PART === 'juego' && !CONGELADO) {
      ACUM += dt;
      let n = 0;
      while (ACUM >= PASO && n < PASO_MAX) { unPaso(PASO); ACUM -= PASO; n++; }
      if (n === PASO_MAX) ACUM = 0;    // no perseguir el reloj: ir en cámara lenta
    }
    if (PART === 'menu') menuPaso(dt);
    else if (!CONGELADO) { camPaso(dt, GIRO.x, GIRO.y); GIRO.x = 0; GIRO.y = 0; }
    /* el sacudón envuelve SÓLO a la cámara y no al marco: sacudiendo el marco
       aparecen dos franjas negras en los bordes */
    if (SACUDE > 0 && !CONGELADO) {
      SACUDE = Math.max(0, SACUDE - dt * 3.4);
      const s = SACUDE * SACUDE * 0.34;
      cam.position.x += (Math.random() - 0.5) * s;
      cam.position.y += (Math.random() - 0.5) * s;
      cam.position.z += (Math.random() - 0.5) * s;
    }
    SANGRE = Math.max(0, SANGRE - dt * 1.5);
    matPost.uniforms.uSangre.value = SANGRE * 0.75 + (JUG.vida < JUG.vidaMax * 0.28 && !JUG.muerto
      ? 0.10 + Math.sin(performance.now() * 0.004) * 0.05 : 0);
    matPost.uniforms.uT.value = performance.now() * 0.06;
    vegRevisaMapas();
    if (PART !== 'menu') { pintaHud(); pintaAviso(dt); dialogoPaso(dt); }
    zonaMezcla(dt);
    /* en el menú todavía no hay cuerpo: `nuevaPartida` lo crea. Sin esta
       guarda son sesenta excepciones por segundo antes de jugar. */
    if (JUG.kit && JUG.cuerpo) kitPinta(JUG.kit, [JUG]);
    ren.info.reset();
    ren.setRenderTarget(RT); ren.render(esc, cam);
    ren.setRenderTarget(null); ren.render(escPost, camPost);
  } catch (err) {
    if (!window.__errs) window.__errs = [];
    window.__errs.push('' + (err && err.message || err));
  }
}

function unPaso(dt) {
  jugPaso(dt, entradaLee());
  esqPaso(dt);
  zonasPaso(dt);
  if (ZONA_ACT === 2 && !DICHO[3] && esqVivos(2) <= 1) dialogoRey();
  if (PART === 'fin') { verPanel('pFin'); pintaFin(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   ARRANQUE Y SONDAS
   ══════════════════════════════════════════════════════════════════════════ */
function armaPaneles() {

    };

function arranca() {

/* ══════════════════════════════════════════════════════════════════════════
   `window.__H` — una afirmación sin número no vale
   ══════════════════════════════════════════════════════════════════════════ */
const _v3 = new THREE.Vector3();
function _pto(hueso, y) { return _v3.set(0, y || 0, 0).applyMatrix4(hueso.matrixWorld).clone(); }
/* UNA SONDA QUE TIRA EN EL MENÚ NO SE PUEDE CORRER, y la regresión se corre
   justamente ahí. `JUG.cuerpo` no existe hasta que empieza una partida, así
   que las tres sondas que miden el rig se arman uno de descarte con LA MISMA
   receta: miden el mismo esqueleto, no uno parecido. */
let _CMED = null;
function _cuerpoMedir() {
  if (JUG.cuerpo) return JUG.cuerpo;
  if (!_CMED) _CMED = armaCuerpo(recetaHeroe());
  return _CMED;
}

window.__H = {
  est() {
    const i = ren.info.render;
    return {
      fps: +FPS.toFixed(1), llamadas: i.calls, tri: i.triangles,
      part: PART, cal: CALIDAD, rt: [RT.width, RT.height],
      zonaAct: ZONA_ACT, zonaVis: ZONA_VIS,
      jug: { x: +JUG.x.toFixed(2), z: +JUG.z.toFixed(2), y: +JUG.y.toFixed(2),
             vida: Math.round(JUG.vida), vidaMax: JUG.vidaMax, agu: Math.round(JUG.agu),
             niv: JUG.nivel, xp: JUG.xp, xpSig: JUG.xpSig, bajas: JUG.bajas,
             muerto: JUG.muerto, golpe: JUG.golpe, esq: +JUG.esqT.toFixed(2) },
      esq: { vivos: ESQS.filter(e => e.vive).length, cerca: ESQ_KIT ? ESQ_KIT.n : 0,
             porZona: [0, 1, 2].map(z => esqVivos(z)) },
      veg: VEG.reduce((a, v) => a + v.malla.count, 0), vegMallas: VEG.length,
      errs: (window.__errs || []).length,
    };
  },
  nueva(s) { audioArranca(); nuevaPartida(s || 7); return this.est(); },
  cal(c) { aplicaCalidad(c); return { cal: CALIDAD, rt: [RT.width, RT.height], sombra: CAL[c].sombra }; },
  idi(k) { IDIOMA = k; pintaIdioma(); return { idi: IDIOMA, zona: document.getElementById('zonaTit').textContent }; },
  ir(x, z) { JUG.x = x; JUG.z = z; JUG.y = H(x, z); JUG.vx = JUG.vz = 0; return { x: JUG.x, z: JUG.z, y: +JUG.y.toFixed(2), zona: zonaDe(x, z) }; },
  mira(y, p) { CAM_YAW = y; if (p !== undefined) CAM_PIT = p; return { yaw: CAM_YAW, pit: CAM_PIT }; },
  congela(v) { CONGELADO = !!v; return CONGELADO; },

  /* caminar DE VERDAD: por el mismo camino que usa el dedo, con la física y
     el choque puestos. Un teletransporte no prueba que el mundo se recorra. */
  anda(n, dx, dz, corre) {
    const x0 = JUG.x, z0 = JUG.z; let dentro = 0;
    for (let i = 0; i < n; i++) {
      const m = { x: dx, z: dz, corre: !!corre };
      jugPaso(PASO, m);
      for (const s of solidosCerca(JUG.x, JUG.z))
        if (dist2(JUG.x, JUG.z, s.x, s.z) < (s.r + J_RADIO * 0.9) * (s.r + J_RADIO * 0.9)) { dentro++; break; }
    }
    return { rec: +Math.hypot(JUG.x - x0, JUG.z - z0).toFixed(2), dentroDeAlgo: dentro,
             x: +JUG.x.toFixed(2), z: +JUG.z.toFixed(2), zona: zonaDe(JUG.x, JUG.z) };
  },
  ataca() { return jugPide('ataca'); },
  esquiva() { return jugPide('esquiva'); },
  pasos(n) { for (let i = 0; i < n; i++) unPaso(PASO); return this.est(); },

  esqs(n) {
    return ESQS.filter(e => e.vive).slice(0, n || 6).map(e => ({
      cl: e.cl, est: e.est, zona: e.zona, vida: Math.round(e.vida),
      d: +Math.sqrt(dist2(e.x, e.z, JUG.x, JUG.z)).toFixed(1),
    }));
  },
  /* trae un esqueleto al lado, para poder medir una pelea sin caminar 80 m */
  trae(d, cl) {
    const e = ESQS.find(x => x.vive && x.est !== 'muere' && (!cl || x.cl === cl)); if (!e) return null;
    const a = JUG.rumbo;
    e.x = JUG.x + Math.sin(a) * (d || 2.0); e.z = JUG.z + Math.cos(a) * (d || 2.0);
    e.y = H(e.x, e.z); e.est = 'persigue'; e.atur = 0; e.esp = 0;
    return { cl: e.cl, d: +Math.sqrt(dist2(e.x, e.z, JUG.x, JUG.z)).toFixed(2), vida: e.vida };
  },
  /* al revés que `trae`: lleva al JUGADOR hasta la clase pedida. Hace falta
     para fotografiar al rey EN SU CENIZA — traído al bosque saldría con la
     niebla, el suelo y la luz de otra zona, o sea otra foto. */
  vaA(cl, d) {
    const e = ESQS.find(x => x.vive && x.cl === cl); if (!e) return null;
    const dd = d === undefined ? 5.2 : d, a = Math.atan2(e.x, e.z);
    JUG.x = e.x - Math.sin(a) * dd; JUG.z = e.z - Math.cos(a) * dd;
    JUG.y = H(JUG.x, JUG.z); JUG.vx = JUG.vz = 0;
    JUG.rumbo = Math.atan2(e.x - JUG.x, e.z - JUG.z);
    CAM_YAW = JUG.rumbo; CAM_PIT = -0.06;
    ZONA_ACT = e.zona; e.est = 'persigue'; e.atur = 0;
    camPaso(0.5, 0, 0);
    return { cl: e.cl, zona: e.zona, vida: e.vida,
             d: +Math.sqrt(dist2(e.x, e.z, JUG.x, JUG.z)).toFixed(2),
             zonaPie: zonaDe(JUG.x, JUG.z) };
  },

  /* ── EL AUTO-JUGADOR ───────────────────────────────────────────────────
     Va al más cercano, se para a su alcance y machaca el combo; esquiva
     cuando el bicho está cargando. Juega por el MISMO camino que el dedo
     —`jugPide` y la entrada— así que si termina la partida, la partida se
     puede terminar. */
  juega(tope, tonto) {
    const T0 = tope || 60000; let n = 0, huyo = 0, esq = 0;
    while (n < T0 && PART === 'juego') {
      n++;
      let m = null, md = 1e9, cerca = 0, peligro = null;
      for (const e of ESQS) {
        if (!e.vive || e.est === 'muere') continue;
        const d2 = dist2(e.x, e.z, JUG.x, JUG.z), D = ESQ[e.cl];
        const alc = (D.alc + J_RADIO) * 1.12;
        if (d2 < alc * alc) {
          cerca++;
          /* SE ESQUIVA AL QUE ESTÁ POR PEGARTE, no al blanco. Un jugador no
             mira "el más cercano de la zona": mira el brazo que se levantó. */
          if (e.est === 'carga' && e.t > D.carga - 0.10) peligro = e;
        }
        if (e.zona !== ZONA_ACT) continue;
        if (d2 < md) { md = d2; m = e; }
      }
      let ex = 0, ez = 0;
      if (tonto) {
        const a = Math.random() * 6.283; ex = Math.cos(a); ez = Math.sin(a);
        if (Math.random() < 0.05) jugPide('ataca');
        if (Math.random() < 0.01) jugPide('esquiva');
      } else if (peligro && JUG.agu > J_AGU_ESQ + J_AGU_GOLPE + 6) {
        const dx = (peligro.x - JUG.x), dz = (peligro.z - JUG.z), l = Math.hypot(dx, dz) || 1;
        JUG.entX = -dz / l; JUG.entZ = dx / l;
        if (jugPide('esquiva')) esq++;
      } else if (m) {
        const d = Math.sqrt(md), dx = (m.x - JUG.x) / d, dz = (m.z - JUG.z) / d;
        const g = J_COMBO[0].alc * 0.92;
        /* SE SEPARA CUANDO LO RODEAN: correr son 5,6 contra los 1,9 de un
           bruto, y esa ventaja ES la herramienta contra una turba. */
        if (cerca >= 3 && JUG.agu > 30) { huyo++; ex = -dx; ez = -dz; }
        else if (d > g) { ex = dx; ez = dz; }
        else if (!jugAtacando() && JUG.esqT <= 0 && JUG.agu > J_AGU_GOLPE + 4) jugPide('ataca');
      }
      if (ex || ez) {
        if (n % 12 === 0) {
          const dd = dist2(JUG.x, JUG.z, this._px || 0, this._pz || 0);
          this._atasco = (dd < 0.02 && md > 4) ? (this._atasco || 0) + 1 : 0;
          this._px = JUG.x; this._pz = JUG.z;
        }
        if ((this._atasco || 0) > 2) {
          const t = n * 0.06; ex = Math.cos(t); ez = Math.sin(t);
          if ((this._atasco || 0) > 8) this._atasco = 0;
        }
        const l = Math.hypot(ex, ez), g = rodea(JUG.x, JUG.z, ex / l, ez / l, J_RADIO, Math.min(Math.sqrt(md), 4.2));
        ex = g.x; ez = g.z;
      }
      jugPaso(PASO, { x: ex, z: ez, corre: md > 64 || cerca >= 3 });
      esqPaso(PASO); zonasPaso(PASO);
      if (PART === 'fin') break;
    }
    return { pasos: n, seg: +(n * PASO).toFixed(1), part: PART, gano: GANO,
             bajas: JUG.bajas, niv: JUG.nivel, vida: Math.round(JUG.vida),
             huyo, esq, vivos: ESQS.filter(e => e.vive).length, errs: (window.__errs || []).length };
  },
  audita(s) { return audita(s === undefined ? SEM : s); },
  auditaN(n) {
    let malas = 0, peor = null;
    for (let i = 1; i <= (n || 40); i++) { const a = audita(i); if (!a.ok) { malas++; if (!peor) peor = { sem: i, a }; } }
    return { semillas: n || 40, malas, peor };
  },

  /* ── LAS ANIMACIONES SE MIDEN ──────────────────────────────────────────
     El recorrido de una mano y de un pie a lo largo del ciclo es la ÚNICA
     prueba de que una animación anima y de que dos son distintas. Un clip
     mal pesado gira igual y no desplaza un solo vértice.                   */
  medirPose(nom, ciclo) {
    const c = _cuerpoMedir(), mx = [], mn = [];
    const pts = [['manoD', c.h.anteD, -0.30], ['manoI', c.h.anteI, -0.30],
                 ['pieI', c.h.pantI, -0.44], ['cabeza', c.h.cuello, 0.19]];
    const acum = {};
    for (const [k] of pts) acum[k] = { mnx: 1e9, mxx: -1e9, mny: 1e9, mxy: -1e9, mnz: 1e9, mxz: -1e9 };
    const N = 40, L = ciclo || (nom === 'quieto' ? 12 : (nom === 'camina' || nom === 'corre' ? 6.283 : 1));
    for (let i = 0; i <= N; i++) {
      poseAplica(c, nom, i / N * L, null, 0, 0);
      c.raiz.position.set(0, 0, 0); c.raiz.rotation.y = 0;
      c.raiz.updateMatrixWorld(true);
      for (const [k, h, y] of pts) {
        const p = _pto(h, y), a = acum[k];
        a.mnx = Math.min(a.mnx, p.x); a.mxx = Math.max(a.mxx, p.x);
        a.mny = Math.min(a.mny, p.y); a.mxy = Math.max(a.mxy, p.y);
        a.mnz = Math.min(a.mnz, p.z); a.mxz = Math.max(a.mxz, p.z);
      }
    }
    const r = { pose: nom };
    for (const k in acum) {
      const a = acum[k];
      r[k] = [+(a.mxx - a.mnx).toFixed(3), +(a.mxy - a.mny).toFixed(3), +(a.mxz - a.mnz).toFixed(3)];
    }
    return r;
  },
  /* planta una pose y CONGELA: el bucle sigue dibujando pero no avanza, así
     la foto es del instante que se pidió y no de tres cuadros después */
  pose(nom, u, quien) {
    CONGELADO = true;
    const c = quien === 'esq' && ESQS[0] ? ESQS[0].cuerpo : _cuerpoMedir();
    poseAplica(c, nom, u || 0, null, 0, 0);
    c.raiz.updateMatrixWorld(true);
    if (quien === 'esq' && ESQS[0]) kitPinta(ESQ_KIT, [ESQS[0]]); else if (JUG.kit && JUG.cuerpo) kitPinta(JUG.kit, [JUG]);
    return { pose: nom, u: u || 0 };
  },

  /* ── DE DÓNDE SALE LA OSCURIDAD ────────────────────────────────────────
     Una escena negra tiene cinco sospechosos —el sol, el ambiente, el
     hemisférico, la exposición y el color del material— y mirando la pantalla
     los cinco se ven igual. Ésta los apaga de a uno y mide el búfer. */
  luz(v) {
    if (v) {
      if (v.sol !== undefined) solLuz.intensity = v.sol;
      if (v.amb !== undefined) ambLuz.intensity = v.amb;
      if (v.hem !== undefined) hemLuz.intensity = v.hem;
      if (v.exp !== undefined) ren.toneMappingExposure = v.exp;
    }
    const s = solLuz.intensity, a = ambLuz.intensity, h = hemLuz.intensity;
    const uno = (S, A, Hm) => { solLuz.intensity = S; ambLuz.intensity = A; hemLuz.intensity = Hm;
                                const r = this.brillo(); solLuz.intensity = s; ambLuz.intensity = a; hemLuz.intensity = h; return r.medio; };
    return {
      ajuste: { sol: s, amb: a, hem: h, exp: +ren.toneMappingExposure.toFixed(2) },
      todo: this.brillo(), nada: uno(0, 0, 0), soloSol: uno(s, 0, 0), soloAmb: uno(0, a, 0), soloHem: uno(0, 0, h),
      niebla: esc.fog ? { c: '#' + esc.fog.color.getHexString(), d: +(esc.fog.density || 0).toFixed(4) } : null,
      fondo: esc.background && esc.background.getHexString ? '#' + esc.background.getHexString() : '' + esc.background,
      suelos: Object.keys(MAT_SUELO).map(k => [k, '#' + MAT_SUELO[k].color.getHexString(), !!MAT_SUELO[k].map]),
      solPos: solLuz.position.toArray().map(x => +x.toFixed(1)),
      solTgt: solLuz.target.position.toArray().map(x => +x.toFixed(1)),
      jug: [+JUG.x.toFixed(1), +JUG.z.toFixed(1)],
      /* EL SUELO PELADO: blanco y sin foto. Si con eso sigue negro, no es la
         textura ni el tinte — es que no le llega luz o no se está dibujando. */
      sueloPelado: (() => {
        const g = [];
        for (const k in MAT_SUELO) { const m = MAT_SUELO[k]; g.push([m, m.map, m.color.clone()]); m.map = null; m.color.setRGB(1, 1, 1); m.needsUpdate = true; }
        const r = this.brillo();
        for (const [m, mp, c] of g) { m.map = mp; m.color.copy(c); m.needsUpdate = true; }
        return r;
      })(),
      /* y sin vegetación: 833 tarjetas alfa pueden estar tapando el suelo */
      sinVeg: (() => {
        const v = VEG.map(x => x.malla.visible); VEG.forEach(x => { x.malla.visible = false; });
        const r = this.brillo();
        VEG.forEach((x, i) => { x.malla.visible = v[i]; });
        return r;
      })(),
    };
  },
  /* ¿SE ESTÁN DIBUJANDO LOS CUERPOS? Un kit instanciado con `count` en 0, o
     con la malla fuera de la escena, se ve exactamente igual que un juego sin
     personajes — y en una foto oscura eso se confunde con falta de luz. */
  kits() {
    const uno = (n, k) => {
      if (!k) return { n, kit: null };
      const m = k.mallas[Object.keys(k.mallas)[0]];
      return { n, piezas: Object.keys(k.mallas).length, count: m.count, cupo: k.cupo,
               enEsc: !!m.parent, vis: m.visible, culled: m.frustumCulled };
    };
    const p = JUG.cuerpo ? _pto(JUG.cuerpo.h.cuello, 0.19) : null;
    const pv = p ? p.clone().project(cam) : null;
    return { jug: uno('jug', JUG.kit), esq: uno('esq', ESQ_KIT),
             jugXYZ: p ? [+p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)] : null,
             jugPant: pv ? [+((pv.x + 1) / 2).toFixed(3), +((1 - pv.y) / 2).toFixed(3), +pv.z.toFixed(3)] : null,
             cam: [+cam.position.x.toFixed(2), +cam.position.y.toFixed(2), +cam.position.z.toFixed(2)],
             camMira: [+CAM_YAW.toFixed(2), +CAM_PIT.toFixed(2)],
    };
  },
  /* atajo de diagnóstico: pinta los kits de un color plano para saber si el
     problema es que no se dibujan o que son del color del suelo */
  /* dónde cae de verdad UNA instancia, leída de la matriz que se le mandó a
     la GPU, y en qué z de vista queda. La proyección a NDC no distingue
     «adelante» de «atrás»: un punto detrás de la cámara proyecta igual, dado
     vuelta, y cae dentro del cuadro. Eso ya costó una vuelta en RECREO. */
  inst() {
    const m = new THREE.Matrix4(), v = new THREE.Vector3(), out = [];
    for (const [n, k] of [['jug', JUG.kit], ['esq', ESQ_KIT]]) {
      if (!k) continue;
      for (const p of ['cuello', 'pelvis']) {
        const im = k.mallas[p]; if (!im || !im.count) continue;
        im.getMatrixAt(0, m); v.setFromMatrixPosition(m);
        const vw = v.clone().applyMatrix4(cam.matrixWorldInverse);
        const nd = v.clone().project(cam);
        out.push({ n, p, mundo: [+v.x.toFixed(2), +v.y.toFixed(2), +v.z.toFixed(2)],
                   zVista: +vw.z.toFixed(2),
                   pant: [+((nd.x + 1) / 2).toFixed(3), +((1 - nd.y) / 2).toFixed(3)],
                   esc: +new THREE.Vector3().setFromMatrixScale(m).x.toFixed(3) });
      }
    }
    return { cam: [+cam.position.x.toFixed(2), +cam.position.y.toFixed(2), +cam.position.z.toFixed(2)],
             near: cam.near, far: cam.far, fov: cam.fov, asp: +cam.aspect.toFixed(3), inst: out };
  },
  /* CUÁNTO OCUPA EL HÉROE EN LA PANTALLA. Un encuadre no se elige a ojo: en
     un marco apaisado de teléfono, un personaje por debajo del 20% del alto no
     deja ver una animación, y por encima del 45% tapa lo que hay que esquivar. */
  encuadre(cf) {
    if (cf) { if (cf.d !== undefined) { CAM_D = cf.d; CAM_D_ACT = cf.d; } if (cf.h !== undefined) CAM_H = cf.h; if (cf.m !== undefined) CAM_MIRA = cf.m;
             camPaso(0.5, 0, 0); cam.updateMatrixWorld(true); }
    const c = JUG.cuerpo; if (!c) return null;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, det = 0;
    const v = new THREE.Vector3();
    for (const k in c.h) {
      v.setFromMatrixPosition(c.h[k].matrixWorld);
      const dv = v.clone().applyMatrix4(cam.matrixWorldInverse);
      if (dv.z > -0.05) { det++; continue; }
      const n = v.project(cam);
      const px = (n.x + 1) / 2, py = (1 - n.y) / 2;
      x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
    }
    return { detras: det, x: [+x0.toFixed(3), +x1.toFixed(3)], y: [+y0.toFixed(3), +y1.toFixed(3)],
             pctAlto: +((y1 - y0) * 100).toFixed(1), pctAncho: +((x1 - x0) * 100).toFixed(1),
             centroX: +(((x0 + x1) / 2) * 100).toFixed(1), centroY: +(((y0 + y1) / 2) * 100).toFixed(1),
             camD: +CAM_D_ACT.toFixed(2), camY: +cam.position.y.toFixed(2) };
  },
  pintaKits(a, b) {
    for (const [k, c] of [[JUG.kit, a], [ESQ_KIT, b]]) {
      if (!k) continue;
      k.mat.vertexColors = false; k.mat.color.setRGB(c[0], c[1], c[2]); k.mat.needsUpdate = true;
    }
    return 'ok';
  },
  tex() {
    const s = {};
    for (const fam in SPR_MAN) s[fam] = SPR_MAN[fam].map(p => !!(TEX[p.k] && TEX[p.k].image)).filter(Boolean).length;
    return { listas: TEX_LISTAS, falladas: TEX_FALLADAS, porFam: s,
             suelos: ZONAS.map(z => !!(MAT_SUELO[z.suelo] && MAT_SUELO[z.suelo].map)) };
  },
  /* lee el BÚFER de verdad: `drawImage` sobre un lienzo WebGL sin
     `preserveDrawingBuffer` devuelve cero */
  /* SE LEE EL CUADRO ENTERO, no una esquina. `readRenderTargetPixels` empieza
     en la esquina de ABAJO A LA IZQUIERDA, así que pedir 120×68 de un destino
     de 372×172 devuelve el 13% del cuadro y todo suelo: la primera versión de
     esta sonda informaba 8,8 sobre una escena cuyo cielo mide 65. Y las
     franjas van de ARRIBA hacia abajo, que es como se lee una pantalla —en
     WebGL la fila 0 es la de abajo. */
  brillo() {
    const W = RT.width, Hh = RT.height, px = new Uint8Array(W * Hh * 4);
    ren.setRenderTarget(RT); ren.render(esc, cam);
    ren.readRenderTargetPixels(RT, 0, 0, W, Hh, px);
    ren.setRenderTarget(null);
    let s = 0, mx = 0, n = 0;
    const fr = [0, 0, 0, 0, 0], fn = [0, 0, 0, 0, 0];
    for (let j = 0; j < Hh; j++) for (let i = 0; i < W; i++) {
      const o = (j * W + i) * 4;
      const l = px[o] * 0.2126 + px[o + 1] * 0.7152 + px[o + 2] * 0.0722;
      s += l; mx = Math.max(mx, l); n++;
      const f = Math.min(4, Math.floor((Hh - 1 - j) / Hh * 5)); fr[f] += l; fn[f]++;
    }
    return { medio: +(s / n).toFixed(1), max: Math.round(mx),
             franjas: fr.map((v, i) => +(v / fn[i]).toFixed(1)) };
  },
  /* solapamientos del HUD: dos elementos que se pisan no se ven en una foto
     chica y sí en el teléfono del usuario */
  cajas() {
    const ids = ['bVida', 'bAgu', 'bXp', 'nivel', 'zona', 'restan', 'dialogo', 'aviso'];
    const c = [], ch = [];
    for (const id of ids) {
      const e = document.getElementById(id); if (!e) continue;
      const s = getComputedStyle(e);
      if (s.display === 'none' || s.visibility === 'hidden' || +s.opacity < 0.05) continue;
      if (!e.offsetWidth || !e.offsetHeight) continue;
      c.push({ id, x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight });
    }
    for (let i = 0; i < c.length; i++) for (let j = i + 1; j < c.length; j++) {
      const a = c[i], b = c[j];
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) ch.push(a.id + '×' + b.id);
    }
    return { n: c.length, choques: ch, marco: [ANCHO, ALTO] };
  },
  audio() {
    if (!ANAL) return { on: false };
    const b = new Uint8Array(ANAL.fftSize); ANAL.getByteTimeDomainData(b);
    let mx = 0, s = 0;
    for (let i = 0; i < b.length; i++) { const v = (b[i] - 128) / 128; mx = Math.max(mx, Math.abs(v)); s += v * v; }
    return { on: true, pico: +mx.toFixed(4), rms: +Math.sqrt(s / b.length).toFixed(4) };
  },
  son(k) { audioArranca(); son(k); return k; },
  paso() { return { camina: +PASO_M.camina.toFixed(3), corre: +PASO_M.corre.toFixed(3),
                    cadCamina: +(J_VEL / PASO_M.camina).toFixed(2),
                    cadCorre: +(J_CORRE / PASO_M.corre).toFixed(2) }; },
  /* PATINAJE: cuánto se desliza el pie apoyado. Es la única prueba de que la
     zancada medida y la velocidad del juego describen el mismo movimiento. */
  patina(corre) {
    const c = _cuerpoMedir(), v = new THREE.Vector3();
    const z = zancada(corre ? 1 : 0), vel = corre ? J_CORRE : J_VEL;
    let mn = 1e9, mx = -1e9;
    for (let i = 0; i <= 48; i++) {
      poseAplica(c, corre ? 'corre' : 'camina', i / 48 * Math.PI * 2, null, 0, 0);
      c.raiz.position.set(0, 0, 0); c.raiz.rotation.y = 0; c.raiz.updateMatrixWorld(true);
      v.set(0, -0.44, 0).applyMatrix4(c.h.pantI.matrixWorld);
      mn = Math.min(mn, v.z); mx = Math.max(mx, v.z);
    }
    const barre = (mx - mn) * 2;
    return { zancada: +z.toFixed(3), barre: +barre.toFixed(3),
             desliza: +(z - barre).toFixed(3), pct: +((z - barre) / z * 100).toFixed(1),
             cadencia: +(vel / z).toFixed(2), pasosSeg: +(vel / z * 2).toFixed(2) };
  },
  tally() {
    const c = ESQS.filter(e => e.vive && e.est !== 'muere')
      .map(e => ({ cl: e.cl, est: e.est, d: +Math.sqrt(dist2(e.x, e.z, JUG.x, JUG.z)).toFixed(1) }))
      .sort((a, b) => a.d - b.d).slice(0, 6);
    return { golpes: TALLY.golpes, dano: TALLY.dano, porCl: TALLY.porCl,
             esquivados: TALLY.esquivados, cerca: c };
  },
  zona0() {
    return ESQS.filter(e => e.vive && e.zona === ZONA_ACT).map(e => ({
      cl: e.cl, est: e.est, vida: Math.round(e.vida),
      d: +Math.sqrt(dist2(e.x, e.z, JUG.x, JUG.z)).toFixed(2),
      x: +e.x.toFixed(1), z: +e.z.toFixed(1), v: +Math.hypot(e.vx, e.vz).toFixed(2),
      dSpawn: +Math.sqrt(dist2(e.x, e.z, e.sx, e.sz)).toFixed(1),
      enTurba: esqCerca().indexOf(e) >= 0,
    }));
  },
  /* ── LA CORONA ES DEL REY Y DE NADIE MÁS ───────────────────────────────
     Se mide leyendo la MATRIZ DE INSTANCIA que se subió a la GPU, no la
     lista de clases: es lo único que prueba que lo que se dibuja coincide
     con lo que se quiso dibujar. Una matriz de escala cero no pinta nada. */
  corona() {
    if (!ESQ_KIT) return null;
    const cerca = esqCerca(), im = ESQ_KIT.mallas.corona, m = new THREE.Matrix4();
    const v = new THREE.Vector3();
    let con = 0, sin = 0; const clases = {};
    for (let i = 0; i < im.count; i++) {
      im.getMatrixAt(i, m); v.setFromMatrixScale(m);
      const cl = cerca[i] ? cerca[i].cl : '?';
      if (v.x > 1e-4) { con++; clases[cl] = (clases[cl] || 0) + 1; } else sin++;
    }
    return { instancias: im.count, conCorona: con, sinCorona: sin, clases,
             piezas: Object.keys(ESQ_KIT.mallas).length };
  },
  errs() { return window.__errs || []; },
};

arranca();

</script>
