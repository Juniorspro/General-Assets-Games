   amortiguamiento**, y el tiempo hasta ese pico es un cuarto de periodo. La
   primera version tenia ω = 7,6 con empujones de 0,18: medido, el pico daba
   **2,4 %** de deformacion, o sea invisible. Con ω = 13 (k = 169) y ζ = 0,35
   —que es lo que deja UN rebote, y es lo que separa la goma de la gelatina—
   quedo en 7,7 %, y ahi aparecio la parte que me faltaba de la cuenta: **el
   amortiguamiento se come el 36 % del pico**, porque el factor vale
   `exp(-ζ·arccos(ζ)/√(1-ζ²))` = 0,64. O sea que el empujon para un 14 % no es
   1,8 sino 3,2 — y ese numero se comprobo midiendo la curva, no derivandolo:
   pico **-14,0 %** a los 0,12 s. */
const SQ_W = 13, SQ_K = SQ_W*SQ_W, SQ_C = 2*0.35*SQ_W;
function sqPaso(dt){
  SQ.v += (-SQ_K*SQ.x - SQ_C*SQ.v)*dt;
  SQ.x += SQ.v*dt;
  SQ.x = cl(SQ.x, -0.34, 0.34);
}
const matJugA = new T.MeshLambertMaterial({ color: 0x2de2a8, emissive: 0x0e5a44, emissiveIntensity: 0.55 });
const matJugB = new T.MeshBasicMaterial({ color: 0x5ad9ff });
let jugCuerpo = null;

function ponIcono(){
  while (gJug.children.length) gJug.remove(gJug.children[0]);
  matJugA.color.set(COLES[ICONO.c1]);
  matJugA.emissive.set(COLES[ICONO.c1]).multiplyScalar(0.30);
  matJugB.color.set(COLES[ICONO.c2]);
  const nave = JUG.modo === 'nave';
  const g = new T.Group();
  if (nave){
    const cu = new T.Mesh(new T.ConeGeometry(0.44, 1.05, 12), matJugA);
    cu.rotation.z = -Math.PI/2; cu.castShadow = true;
    g.add(cu);
    const ca = new T.Mesh(GEO.esfera, matJugB);
    ca.scale.setScalar(0.42); ca.position.set(-0.08, 0, 0.30);
    g.add(ca);
  } else if (FORMAS[ICONO.forma] === 'diamante'){
    const cu = new T.Mesh(new T.OctahedronGeometry(0.62), matJugA);
    cu.castShadow = true; g.add(cu);
    const nu = new T.Mesh(new T.OctahedronGeometry(0.30), matJugB);
    nu.position.z = 0.42; g.add(nu);
  } else if (FORMAS[ICONO.forma] === 'redondo'){
    const cu = new T.Mesh(GEO.esfera, matJugA);
    cu.scale.setScalar(JUG_LADO*1.08); cu.castShadow = true; g.add(cu);
    const nu = new T.Mesh(GEO.esfera, matJugB);
    nu.scale.setScalar(JUG_LADO*0.46); nu.position.z = 0.34; g.add(nu);
  } else {
    const cu = new T.Mesh(GEO.caja, matJugA);
    cu.scale.setScalar(JUG_LADO); cu.castShadow = true; g.add(cu);
    const nu = new T.Mesh(GEO.caja, matJugB);
    nu.scale.set(JUG_LADO*0.44, JUG_LADO*0.44, JUG_LADO*0.44);
    nu.position.z = JUG_LADO*0.36; g.add(nu);
  }
  jugCuerpo = g;
  gJug.add(g);
}

/* ══════════ LAS PARTICULAS ══════════
   Una sola malla instanciada con el tope de la calidad: las que no se usan van a
   escala cero, que cuesta una matriz y ni una llamada de dibujo. */
const PART = [];
const PART_TOPE = 160;
const matPart = new T.MeshBasicMaterial({ color: 0xffffff });
const mPart = new T.InstancedMesh(GEO.part, matPart, PART_TOPE);
mPart.frustumCulled = false;
mPart.instanceColor = new T.InstancedBufferAttribute(new Float32Array(PART_TOPE*3), 3);
esc3.add(mPart);

function chispas(x, y, n, c){
  const tope = Math.min(PART_TOPE, CALIDADES[CALIDAD].part);
  for (let i = 0; i < n && PART.length < tope; i++){
    const a = Math.random()*6.2832, v = 2 + Math.random()*9;
    PART.push({ x, y, z: -PROF/2 + Math.random()*1.2, vx: Math.cos(a)*v, vy: Math.sin(a)*v,
                t: 0.25 + Math.random()*0.35, t0: 0.6, s: 0.10 + Math.random()*0.20, c });
  }
}
function pasoPart(dt){
  for (let i = PART.length - 1; i >= 0; i--){
    const p = PART[i];
    p.t -= dt; if (p.t <= 0){ PART.splice(i, 1); continue; }
    p.vy -= 26*dt; p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ══════════ EL TAMANO ══════════ */
function mide(){
  /* ── EL MARCO SE GIRA SI LA PANTALLA ES VERTICAL ──
     Y adentro va todo, asi que el HUD y los menus quedan alineados por
     construccion. En una pantalla apaisada no se gira nada. */
  const W = innerWidth, H = innerHeight;
  const vert = H > W;
  const m = $('marco');
  const aw = vert ? H : W, ah = vert ? W : H;
  m.className = vert ? 'girado' : 'derecho';
  m.style.width = aw + 'px'; m.style.height = ah + 'px';
  const q = CALIDADES[CALIDAD].esc;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  ESC = q*dpr;
  ren.setPixelRatio(ESC);
  ren.setSize(aw, ah, false);
  ANCHO = ren.domElement.width; ALTO = ren.domElement.height;
  cam.aspect = aw/ah;
  cam.updateProjectionMatrix();
  U = ANCHO/VISTA_ANCHO;
  /* ── LA DISTANCIA DE LA CAMARA SALE DE UNA CUENTA ──
     Se quieren ver `VISTA_ANCHO` bloques de ancho sobre el plano z = 0:
     `D = (ancho/2) / (aspecto · tan(fov/2))`. Escrita a mano, cambiar el campo o
     la proporcion de pantalla cambiaria cuantos bloques de aviso hay. */
  CAM.d = (VISTA_ANCHO*0.5)/(cam.aspect*Math.tan(FOV_Y*Math.PI/360));
  CAM.alto = VISTA_ANCHO/cam.aspect;
  /* el telon del cielo, pegado a la camara y justo por delante del plano lejano */
  const zc = -200;
  cielo.position.set(0, 0, zc);
  cielo.scale.set(2*Math.abs(zc)*Math.tan(FOV_Y*Math.PI/360)*cam.aspect*1.05,
                  2*Math.abs(zc)*Math.tan(FOV_Y*Math.PI/360)*1.05, 1);
}
addEventListener('resize', mide);

/* ══════════════════════ LOS EFECTOS ══════════════════════
   ── EL SACUDON ES SOLO TRASLACION, Y ESO NO ES UN DETALLE ──
   Girar la camara rompe la linealidad de la x, que es la propiedad de la que
   depende que se pueda despegar en un bloque exacto. Una traslacion pura de una
   camara que mira derecho la conserva EXACTAMENTE, y un acercamiento tambien
   —escala a los dos por igual, asi que el cubo y el pico siguen alineados—. Por
   eso los dos efectos de camara de este juego son esos dos y ningun otro.

   ── Y EL LATIDO ES UN ACERCAMIENTO, NO UN TEMBLOR ──
   A 128 BPM el pulso son 2,1 Hz, y por encima de un hertz cualquier movimiento
   se lee a temblor por chico que sea: es la leccion que en BARRIO costo una
   vuelta entera. Un 0,8 % de acercamiento en el golpe no se lee a temblor, se
   lee a que el mundo respira con el tema. */
const EFE = { sac: 0, zoom: 0, hit: 0 };
let _sacX = 0, _sacY = 0;
function sacude(f){ if (f > EFE.sac) EFE.sac = Math.min(1.4, f); }
function acerca(f){ EFE.zoom = f; }

function efePaso(dt){
  EFE.sac = Math.max(0, EFE.sac - dt*3.4);
  EFE.zoom += (0 - EFE.zoom)*Math.min(1, dt*4.5);
  const a = EFE.sac*EFE.sac;                   /* al cuadrado: cae mas natural */
  _sacX = (Math.random()*2 - 1)*a*0.42;
  _sacY = (Math.random()*2 - 1)*a*0.42;
}

/* ── EL DESTELLO Y LA VIÑETA VIVEN EN EL DOM ──
   Cuestan cero triangulos y se componen en la GPU del navegador. Y el destello
   se escribe SOLO cuando cambia: en cero, no se toca el DOM. */
const elFlash = $('flash');
let FLA = 0, FLA_ANT = -1;
function destella(col, f){ FLA = Math.max(FLA, f); elFlash.style.setProperty('--fc', col); }
function flaPaso(dt){
  FLA = Math.max(0, FLA - dt*2.6);
  const v = +FLA.toFixed(3);
  if (v !== FLA_ANT){ FLA_ANT = v; elFlash.style.opacity = v; }
}

/* ══════════ LA CAMARA ══════════
   `CAM.y` es el CENTRO de la banda visible, no un desplazamiento: con la camara
   mirando derecho, el centro de la banda ES la altura de la camara, asi que la
   cuenta de «el piso al 80 % del alto» sale de una linea. */
const CAM = { x: 0, y: 3, d: 10, alto: 9.2 };
let CAM_OFS = 0.30;
function ponCam(dt){
  CAM.x = JUG.x - VISTA_ANCHO*CAM_OFS;
  const H = CAM.alto*0.5;
  /* ── EN NAVE Y EN GRAVEDAD INVERTIDA SE CENTRA EL PASILLO ──
     Los dos entran enteros en pantalla, asi que seguir al jugador en vertical
     solo hace que las paredes se muevan y cuesten mas de leer. */
  const obj = JUG.modo === 'nave' ? ALTO_PASILLO*0.5
            : JUG.grav < 0 ? ALTO_GRAV*0.5
            /* el piso queda al 80 % del alto: `centro = 0,6·semialto` */
            : cl(H*0.6 + JUG.y*0.20, H*0.6, H*0.6 + 3.2);
  CAM.y += (obj - CAM.y)*Math.min(1, dt*6);
  const t = musTiempo();
  const pul = t == null ? 0 : Math.pow(1 - (((t % 1) + 1) % 1), 3);
  const d = CAM.d*(1 - 0.012*pul + EFE.zoom);
  cam.position.set(CAM.x + VISTA_ANCHO*0.5 + _sacX, CAM.y + _sacY, d);
  cam.rotation.set(0, 0, 0);
  /* la caja de sombra sigue al jugador: repartida sobre el nivel entero, la
     sombra de un cubo mediria dos texels y temblaria */
  /* ── LA LUZ VA CASI DE ARRIBA, Y ESO NO ES ESTETICA ──
     Con el foco corrido nueve bloques hacia la camara, la sombra de una pared
     salia larga y hacia atras: en perspectiva se veia DESPEGADA de su pared, y
     en el pasillo de la nave eran cuatro manchones sueltos sobre el piso. A 63
     grados de elevacion la sombra mide medio alto del objeto y queda debajo de
     el, que es lo que la vuelve informacion en vez de ruido. */
  sol.position.set(JUG.x + 7, CAM.y + 16, 3);
  sol.target.position.set(JUG.x, CAM.y, -PROF/2);
  const s = sol.shadow.camera;
  s.left = -13; s.right = 13; s.top = 13; s.bottom = -13;
  s.updateProjectionMatrix();
}

/* ══════════ UN CUADRO ══════════ */
const _v3 = new T.Vector3();
let MODO3D = '';
/* ── EL JUGADOR SE COLOCA EN UNA FUNCION Y NO ADENTRO DEL PINTADO ──
   La sonda mide con el cuadro congelado y sin dibujar, asi que leyendo la
   posicion del grupo lo que se lee es la del ultimo cuadro dibujado: medido, el
   anclaje del aplaste daba 0,3171 de error, que es exactamente la altura a la
   que estaba el jugador cuando se dibujo por ultima vez. Con la colocacion
   aparte, la sonda la llama ella y mide el instante que pidio.
   Es la quinta vez en este repo que una medicion sale mal por leer un estado que
   solo se pone al dibujar. */
function ponJug(){
  gSq.visible = JUG.vivo;
  if (JUG.vivo){
    /* ── EL APLASTE SE ANCLA EN LA CARA QUE TOCA, NO EN EL CENTRO ──
       La escala de un grupo va alrededor de su origen, y el origen estaba en el
       centro del cubo: aplastado media deformacion, el cubo se HUNDE la mitad de
       eso en el piso y estirado flota. Anclando la cara de apoyo —la de abajo
       apoyado, la de arriba con la gravedad invertida— el contacto se queda
       quieto, que es lo unico que hace que la deformacion se lea a deformacion.
       Y el volumen se conserva: si no, el cubo cambia de tamano en vez de
       deformarse. */
    const k = SQ.x, alto = JUG_LADO*(1 - k);
    const cy = JUG.grav > 0 ? JUG.y + alto*0.5 : JUG.y + JUG_LADO - alto*0.5;
    gSq.position.set(JUG.x, cy, -JUG_LADO*0.5);
    gSq.scale.set(1 + k*0.55, 1 - k, 1 + k*0.25);
    gJug.rotation.z = JUG.modo === 'nave' ? JUG.giro : -JUG.giro;
  }
}

function pinta(){
  if (REV3D !== MUNDO.rev) mundo3D();
  /* la nave y el cubo son mallas distintas, asi que el icono se rearma al cambiar
     de modo — una vez, no en cada cuadro */
  if (MODO3D !== JUG.modo){ MODO3D = JUG.modo; ponIcono(); }
  const t = musTiempo();
  /* el pulso: 1 en el golpe y cae hasta el siguiente. Sale del reloj de la
     musica, asi que la imagen y el tema no pueden desincronizarse. */
  const pulso = t == null ? 0 : Math.pow(1 - (((t % 1) + 1) % 1), 3);

  /* el color del tramo: cambia solo con la x y funde en siete bloques */
  paletaPaso(NIVELES[EST.nivel]);
  ponTelon();

  /* el canto y la reja laten con el compas: es lo unico estetico del juego y no
     cuesta ni una llamada de dibujo, porque los materiales son compartidos */
  matReja.opacity = 0.11 + pulso*0.10;
  /* el fondo late con el compas, y CADA CAPA CON SU FUERZA: latiendo todas
     igual, las tres se leen como una sola imagen y el paralaje deja de contar */
  CAPAS[0].mat.opacity = CAPAS[0].opa + pulso*0.14;
  CAPAS[1].mat.opacity = CAPAS[1].opa + pulso*0.07;
  CAPAS[2].mat.opacity = CAPAS[2].opa + pulso*0.04;
  matMotas.opacity = 0.28 + pulso*0.42;
  ren.toneMappingExposure = 1.10 + pulso*0.12;

  /* el jugador */
  ponJug();

  /* lo que se mueve por su cuenta */
  for (const m of SUELTOS){
    const u = m.userData;
    if (u.sierra) m.rotation.y = (t || 0)*2.4;
    else if (u.moneda){
      m.visible = !u.moneda.tomada;
      m.rotation.y = (t || 0)*1.9;
      m.position.y = u.moneda.y + Math.sin((t || 0)*2.2)*0.14;
    } else if (u.portal){
      m.material.opacity = 0.42 + pulso*0.30;
      /* el portal gira: es lo que dice que esta vivo y esperando */
      m.rotation.y = (t || 0)*1.4;
    }
  }
  if (INST.orbe){
    /* un orbe usado se apaga, y eso hay que poder verlo: es la diferencia entre
       «no llegue» y «ya lo gaste» */
    let algo = false;
    MUNDO.orbes.forEach((o, i) => { if (o.usado) algo = true; });
    matOrbe.color.setHex(0xffd447);
    matOrbe.opacity = 1; matOrbe.transparent = false;
    if (algo){
      MUNDO.orbes.forEach((o, i) => {
        const s = o.usado ? 0.55 : 1;
        _m4.compose(new T.Vector3(o.x, o.y, -PROF/2 + 0.5), _q.identity(),
                    new T.Vector3(s, s, s));
        INST.orbe.setMatrixAt(i, _m4);
      });
      INST.orbe.instanceMatrix.needsUpdate = true;
    }
  }

  /* las particulas */
  const n = Math.min(PART.length, PART_TOPE);
  for (let i = 0; i < PART_TOPE; i++){
    if (i < n){
      const p = PART[i], k = cl(p.t/p.t0, 0.15, 1), s = p.s*k;
      _m4.compose(_v3.set(p.x, p.y, p.z), _q.identity(), new T.Vector3(s, s, s));
      mPart.setMatrixAt(i, _m4);
      _c.set(p.c); mPart.setColorAt(i, _c);
    } else {
      _m4.compose(_v3.set(0, -999, 0), _q.identity(), new T.Vector3(0, 0, 0));
      mPart.setMatrixAt(i, _m4);
    }
  }
  mPart.instanceMatrix.needsUpdate = true;
  if (mPart.instanceColor) mPart.instanceColor.needsUpdate = true;

  ren.info.reset();
  ren.render(esc3, cam);
}

/* ── EL BRILLO SE LEE DEL BUFER, Y HAY QUE DIBUJAR PRIMERO ──
   Un lienzo WebGL sin `preserveDrawingBuffer` sale en cero si se lo copia con
   `drawImage`: la unica lectura honesta es `readPixels` justo despues de un
   render. Es la misma leccion que en ECO. */
function brilloDe(){
  pinta();
  const gl = ren.getContext();
  const w = ren.domElement.width, h = ren.domElement.height;
  const px = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let m = 0, mx = 0;
  for (let i = 0; i < px.length; i += 4){
    const l = 0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2];
    m += l; if (l > mx) mx = l;
  }
  return { medio: +(m/(w*h)).toFixed(1), max: Math.round(mx), w, h };
}

function partDe(){
  return { n: PART.length, count: mPart.count, vis: mPart.visible,
           cull: mPart.frustumCulled, mat: !!mPart.material,
           tope: Math.min(PART_TOPE, CALIDADES[CALIDAD].part),
           m0: Array.from(mPart.instanceMatrix.array.slice(0, 16)).map(v => +v.toFixed(2)),
           padre: mPart.parent ? mPart.parent.type : null };
}

const _cajaCubo = new T.Box3();
function cuboDe(){
  ponJug();
  gSq.updateMatrixWorld(true);
  _cajaCubo.setFromObject(gSq);
  /* la caja envolvente crece con el GIRO, asi que para comprobar el anclaje hay
     que mirar la cara de apoyo sin el giro: sale de la posicion y la escala que
     el objeto tiene puestas, no de repetir la cuenta del dibujo */
  const eY = gSq.scale.y, py = gSq.position.y;
  const pie = py - JUG_LADO*eY*0.5, techo = py + JUG_LADO*eY*0.5;
  return { abajo: +_cajaCubo.min.y.toFixed(4), arriba: +_cajaCubo.max.y.toFixed(4),
           alto: +(_cajaCubo.max.y - _cajaCubo.min.y).toFixed(4),
           ancho: +(_cajaCubo.max.x - _cajaCubo.min.x).toFixed(4),
           pie: +pie.toFixed(4), techo: +techo.toFixed(4),
           ancla: +((JUG.grav > 0 ? pie - JUG.y : techo - (JUG.y + JUG_LADO))).toFixed(4),
           altoG: +(JUG_LADO*eY).toFixed(4), anchoG: +(JUG_LADO*gSq.scale.x).toFixed(4),
           pieJug: +JUG.y.toFixed(4), grav: JUG.grav, sq: +SQ.x.toFixed(4) };
}
function efeDe(){
  return { sac: +EFE.sac.toFixed(3), zoom: +EFE.zoom.toFixed(4), hit: +EFE.hit.toFixed(3),
           sq: +SQ.x.toFixed(3), sqv: +SQ.v.toFixed(3), flash: +FLA.toFixed(3),
           /* cuanto se corre la camara, en bloques, y cuanto cambia el encuadre */
           sacBloques: +Math.hypot(_sacX, _sacY).toFixed(3),
           camD: +cam.position.z.toFixed(3), camDBase: +CAM.d.toFixed(3),
           opacidades: CAPAS.map(c => +c.mat.opacity.toFixed(3)),
           motas: +matMotas.opacity.toFixed(3) };
}

function costoDe(){
  const r = ren.info.render, mm = ren.info.memory;
  return { llamadas: r.calls, triangulos: r.triangles, geo: mm.geometries, tex: mm.textures,
           programas: ren.info.programs ? ren.info.programs.length : -1 };
}

/* ── PROYECTAR UN PUNTO DEL MUNDO A FRACCIONES DE PANTALLA ──
   Es la sonda con la que se ajusta el encuadre: «el piso al 80 %» se mide, no se
   estima. Y con la camara mirando derecho tiene que salir LINEAL en x, que es la
   propiedad de la que depende que se pueda apuntar. */
function proy(x, y){
  /* ── LA MATRIZ SE PONE AL DIA ACA, Y NO ES UN DETALLE ──
     `Object3D.matrixWorld` se recalcula al DIBUJAR, asi que proyectar justo
     despues de mover la camara usa la matriz del cuadro anterior: medido, la
     sonda devolvia al jugador en −0,595 del ancho con la camara puesta donde
     corresponde. Es la cuarta vez en este repo que una medicion sale mal por
     esto — en PISTOLA y en RECREO costo una vuelta cada una. */
  cam.updateMatrixWorld(true);
  _v3.set(x, y, 0).project(cam);
  return [(_v3.x + 1)/2, (1 - _v3.y)/2];
}

/* ══════════════════════ EL ESTADO, EL PROGRESO Y EL AUTO-JUGADOR ══════════════════════ */

const DT = 1/60;                 /* paso fijo */
let SIN_RELOJ = false;           /* lo usa la sonda para poder adelantar */
const EST = {
  p: 'carga',                    /* la pantalla */
  nivel: 0, intentos: 0, pct: 0, mejor: 0,
  practica: false, corriendo: false,
  muerto: 0,                     /* reloj de la pausa de la muerte */
  pedido: 0,                     /* el salto pedido, guardado unas centesimas */
  gano: false,
  chk: null,                     /* el punto de control de practica */
  x0: 0                          /* el bloque desde el que arranco este intento */
};

/* ══════════ EL PROGRESO GUARDADO ══════════
   Por nivel: el mejor porcentaje, las tres monedas y si esta hecho. Y el
   `try/catch` no es ceremonia: en una ventana privada `localStorage` TIRA, y una
   red que tira no es una red. */
const PROG = { niv: [], icono: { forma: 0, c1: 0, c2: 1 }, lang: null,
               cal: 'media', mus: 70, fx: 80 };
for (let i = 0; i < NIVELES.length; i++) PROG.niv.push({ mejor: 0, mon: [false, false, false], hecho: false });

function cargaProg(){
  try {
    const s = localStorage.getItem('rotor_v1');
    if (!s) return;
    const o = JSON.parse(s);
    if (o.niv) for (let i = 0; i < PROG.niv.length && i < o.niv.length; i++){
      const a = o.niv[i], b = PROG.niv[i];
      b.mejor = +a.mejor || 0; b.hecho = !!a.hecho;
      if (a.mon) for (let k = 0; k < 3; k++) b.mon[k] = !!a.mon[k];
    }
    if (o.icono){ ICONO.forma = o.icono.forma | 0; ICONO.c1 = o.icono.c1 | 0; ICONO.c2 = o.icono.c2 | 0; }
    if (o.lang && TXT[o.lang]) LANG = o.lang;
    if (o.cal && CALIDADES[o.cal]) CALIDAD = o.cal;
    if (o.mus != null) VOL_MUS = cl(+o.mus, 0, 100)/100;
    if (o.fx != null) VOL_FX = cl(+o.fx, 0, 100)/100;
  } catch(e){}
}
function guardaProg(){
  try {
    localStorage.setItem('rotor_v1', JSON.stringify({
      niv: PROG.niv, icono: ICONO, lang: LANG, cal: CALIDAD,
      mus: Math.round(VOL_MUS*100), fx: Math.round(VOL_FX*100)
    }));
  } catch(e){}
}

/* ══════════ UN PASO ══════════
   ── LA X LA PONE EL RELOJ CUANDO HAY RELOJ, Y SE INTEGRA CUANDO NO ──
   Las dos cosas pasan por `pasoCuerpo`, o sea por LA MISMA fisica: si el bot
   tuviera la suya, ganar no probaria nada. Lo unico que cambia es de donde sale
   la x — del tema en la partida de verdad, integrada en el bot y en el respaldo
   sin audio. */
function avanza(c, med, dt, apretado, xForzada){
  c.x = (xForzada == null) ? c.x + med.v*dt : xForzada;
  pasoCuerpo(c, med, dt, apretado);
}

/* ── EL HUECO LIBRE EN UNA X, Y SE DEVUELVE EL MAS ANCHO ──
   La primera version buscaba «el hueco que contiene a la nave», y eso tiene dos
   defectos que se ven en la medicion: la respuesta depende de donde este la nave,
   y si la nave YA esta metida en una pared no contiene a ninguno — medido, con la
   nave a y 6,29 dentro de la pared de arriba la funcion devolvia el pasillo
   entero libre y el piloto apuntaba al medio del pasillo, que era justo la pared.
   El mas ancho no depende de nada: en un pasillo con dos paredes, el hueco de la
   pared ES el intervalo libre mas ancho. La banda va de 0 a 9,2 porque el pasillo
   se construye asi. */
function huecoLibre(x){
  const B0 = 0, B1 = ALTO_PASILLO;
  const iv = [];
  for (const r of cerca(MUNDO.iSol, x)){
    if (r.x > x || r.x + r.w < x) continue;
    const a = Math.max(B0, r.y), b = Math.min(B1, r.y + r.h);
    if (b > a) iv.push([a, b]);
  }
  iv.sort((p, q) => p[0] - q[0]);
  let lo = B0, ancho = -1, mejor = [B0, B1];
  for (const [a, b] of iv){
    if (a - lo > ancho){ ancho = a - lo; mejor = [lo, a]; }
    if (b > lo) lo = b;
  }
  if (B1 - lo > ancho){ mejor = [lo, B1]; }
  return mejor;
}

/* ══════════════════════ EL AUTO-JUGADOR ══════════════════════
   ── ES LO UNICO QUE PRUEBA QUE UN NIVEL SE PUEDE PASAR ──
   El generador tira patrones y no declara la solucion; el bot la encuentra. Si
   no llega al 100 %, el nivel se rechaza y se vuelve a tirar con otra semilla.

   ── Y LA RAMIFICACION VA A UN SOLO NIVEL DE PROFUNDIDAD ──
   Ramificar cada decision es exponencial: con horizonte de 45 pasos y dos
   opciones por paso son millones de pasos de fisica por decision. Lo que se hace
   en su lugar es ramificar UNA vez —apretar ahora o no— y adentro de cada rama
   usar una politica REACTIVA: saltar cuando, sin saltar, se muere dentro de
   medio tiempo. Con «nunca salta» adentro, una cadena de tres picos mata las dos
   ramas y el bot elige a ciegas; con la reactiva, las cadenas se resuelven sin
   ramificar. */
function copia(c){
  return { x: c.x, y: c.y, vy: c.vy, grav: c.grav, modo: c.modo,
           piso: c.piso, vivo: c.vivo, giro: c.giro, apretado: c.apretado };
}

function botOrbeCerca(c){
  for (const o of MUNDO.orbes){
    if (o.usado) continue;
    if (Math.abs(o.x - c.x) < 1.4 && Math.abs(o.y - (c.y + 0.43)) < 1.4) return true;
  }
  return false;
}

/* ── EL PILOTO ──
   Dos cosas, y las dos salieron de una muerte medida:
   · SE BARRE HACIA ADELANTE hasta encontrar la pared que viene. Con una sola
     muestra a tres bloques, una pared de 1,2 de ancho se ve durante 0,12 s: la
     nave se enteraba pegada a ella. El barrido la encuentra a diez bloques.
   · Y SE APUNTA CON LA VELOCIDAD, NO CON LA POSICION. La nave ACELERA, asi que
     una regla de «subo si estoy abajo» se pasa de largo y oscila; pidiendole una
     velocidad proporcional al error, frena antes de llegar. */
function botNave(c, med){
  let obj = ALTO_PASILLO*0.5 - JUG_LADO*0.5;
  for (let d = 0.4; d <= 10; d += 0.4){
    const h = huecoLibre(c.x + d);
    if (h[1] - h[0] < ALTO_PASILLO - 1.2){ obj = (h[0] + h[1])*0.5 - JUG_LADO*0.5; break; }
  }
  const vObj = cl((obj - c.y)*6.0, -med.naveMax, med.naveMax);
  return c.vy < vObj;
}

/* ── LA POLITICA: SALTAR EN EL ULTIMO MOMENTO POSIBLE ──
   La primera version saltaba «cuando veia la muerte dentro de `mira` pasos», y
   eso no es lo mismo: en un hueco, ver el hueco y saltar da un despegue
   DEMASIADO TEMPRANO y se cae del otro lado. Medido, los cuatro fallos de los
   niveles 2 y 3 eran exactamente eso —`plano: true`, o sea caido al vacio, y uno
   golpeando el labio de enfrente de costado a 0,11 bloques de haberlo pisado—.

   La ventana de despegue de un hueco `w` sale de tres cosas y da poco: para
   pararse en el labio la caja tiene que solaparlo (0,43), para aterrizar tambien,
   y encima el solape del aterrizaje tiene que ser MAYOR que lo que la caja baja
   en un paso (`imp/60`), porque con menos el eje de menor penetracion resuelve
   como choque de costado, o sea muerte. Queda `4,86 − imp/60 − w`: con w = 3,5
   eso es una ventana de un bloque, seis pasos. Saltar «cuando se ve» la pierde
   entera; saltar en el ultimo momento la clava.

   Y se escribe en dos rollouts cortos: si esperando un paso y saltando en el
   siguiente todavia se vive, se espera. */
function botVive(c, med, n, apretaPrimero){
  const d = copia(c);
  for (let i = 0; i < n; i++){
    avanza(d, med, DT, i === 0 ? apretaPrimero : false);
    if (!d.vivo) return false;
    if (d.x >= MUNDO.largo) return true;
  }
  return true;
}
function botReactiva(c, med, mira){
  if (c.modo === 'nave') return botNave(c, med);
  if (!c.piso && !botOrbeCerca(c)) return false;
  const d = copia(c); avanza(d, med, DT, false);
  if (!d.vivo) return true;                        /* un paso mas y se muere */
  if (botVive(d, med, mira, true)) return false;   /* saltando el que viene, vive */
  return botVive(c, med, mira, true);              /* hay que saltar ahora */
}

/* rueda con esa politica y devuelve si sobrevive: el AVANCE no informa nada,
   porque la x sale del reloj y avanza igual se salte o no */
function botRueda(c0, med, pasos, mira){
  const c = copia(c0);
  for (let i = 0; i < pasos; i++){
    avanza(c, med, DT, botReactiva(c, med, mira));
    if (!c.vivo) return false;
    if (c.x >= MUNDO.largo) return true;
  }
  return true;
}

/* ── Y EL HORIZONTE LARGO ES PARA LO QUE «TARDE» NO RESUELVE ──
   Subirse a una plataforma o pisar un pad pide saltar TEMPRANO, y ahi esperar no
   sirve. La regla es la misma de siempre: si esperar sobrevive el horizonte
   largo, se espera; si no, se aprieta. */
function botElige(c, med, pasos, mira){
  if (c.modo === 'nave') return botNave(c, med);
  if (!c.piso && !botOrbeCerca(c)) return false;
  const A = copia(c); avanza(A, med, DT, false);
  if (A.vivo && botRueda(A, med, pasos, mira)) return false;
  const B = copia(c); avanza(B, med, DT, true);
  return B.vivo && botRueda(B, med, pasos, mira);
}

/* juega el nivel que ya esta en MUNDO y devuelve cuanto llego */
function juegaSolo(opt){
  const o = opt || {};
  const med = MUNDO.med;
  const azar = !!o.azar;
  /* el horizonte en PASOS sale del tempo, no de un numero a mano: un salto dura
     un tiempo, asi que mirar 1,6 tiempos es mirar poco mas de un salto */
  const pasos = Math.ceil(1.6*60/med.bpm*60);
  /* el vuelo dura un tiempo exacto, asi que `mira` tiene que pasar de 60 pasos
     por tiempo: con menos, el rollout corta antes de aterrizar y no ve el labio */
  const mira = Math.ceil(1.35*60/med.bpm*60);
  const c = {}; jugPone(c, 0);
  for (const ob of MUNDO.orbes) ob.usado = false;
  let i = 0, tope = Math.ceil((MUNDO.largo/med.v)*60) + 400;
  let mon = 0;
  while (c.vivo && c.x < MUNDO.largo && i < tope){
    const a = azar ? (az() < 0.10) : botElige(c, med, pasos, mira);
    avanza(c, med, DT, a);
    for (const m of MUNDO.monedas)
      if (!m.tomada && Math.abs(m.x - c.x) < 0.7 && Math.abs(m.y - (c.y + 0.43)) < 0.8){
        m.tomada = true; mon++;
      }
    i++;
  }
  return { pct: Math.round(cl(c.x/MUNDO.largo, 0, 1)*100), pasos: i, vivo: c.vivo,
           murioEn: c.vivo ? -1 : Math.round(c.x), monedas: mon, largo: MUNDO.largo };
}

/* ══════════ LA VALIDACION ══════════
   Se tira, se juega, y si no se termina se cambia la semilla. Es lo que evita
   que exista un nivel imposible. */
function armaNivel(id){
  for (let s = 1; s <= 40; s++){
    generaNivel(id, s);
    const r = juegaSolo({});
    if (r.pct >= 100){ MUNDO.semilla = s; return r; }
  }
  /* si cuarenta semillas no dan uno jugable, algo esta mal en el generador y hay
     que saberlo: dejar el ultimo es dejar un nivel imposible en el juego */
  MUNDO.semilla = 0;
  return null;
}

function audita(){
  const out = [];
  for (let i = 0; i < NIVELES.length; i++){
    const t0 = performance.now();
    const r = armaNivel(i);
    const azar = juegaSolo({ azar: true });
    out.push({ nivel: i, nom: NIVELES[i].nom, semilla: MUNDO.semilla,
               ok: !!r && r.pct >= 100, pct: r ? r.pct : -1, pasos: r ? r.pasos : -1,
               monedas: r ? r.monedas : -1, azarPct: azar.pct,
               largo: MUNDO.largo, sol: MUNDO.sol.length, mat: MUNDO.mat.length,
               ms: Math.round(performance.now() - t0) });
  }
  return out;
}

/* ══════════════════════ LA PARTIDA ══════════════════════ */
const CHK = { lista: [] };

function snapshot(){
  return { c: copia(JUG), orbes: MUNDO.orbes.map(o => o.usado),
           mon: MUNDO.monedas.map(m => m.tomada) };
}
function restaura(s){
  const c = s.c;
  JUG.x = c.x; JUG.y = c.y; JUG.vy = c.vy; JUG.grav = c.grav; JUG.modo = c.modo;
  JUG.piso = c.piso; JUG.vivo = true; JUG.giro = c.giro; JUG.apretado = false;
  for (let i = 0; i < MUNDO.orbes.length; i++) MUNDO.orbes[i].usado = s.orbes[i];
  for (let i = 0; i < MUNDO.monedas.length; i++) MUNDO.monedas[i].tomada = s.mon[i];
}

/* las semillas validadas se buscan UNA vez, en la pantalla de carga: validar al
   entrar a un nivel serian dos segundos de nada justo cuando el jugador ya toco */
const SEMILLAS = [];
function preparaNiveles(){
  for (let i = 0; i < NIVELES.length; i++){ armaNivel(i); SEMILLAS[i] = MUNDO.semilla; }
  return SEMILLAS.slice();
}

function arranca(nivel){
  EST.nivel = nivel;
  generaNivel(nivel, SEMILLAS[nivel] || 1);
  EST.mejor = PROG.niv[nivel].mejor;
  EST.gano = false; EST.muerto = 0;
  CHK.lista.length = 0;
  reintenta(true);
}

/* ── REINTENTAR NO ES VOLVER A CERO SI HAY PUNTO DE CONTROL ──
   Es la unica concesion del genero: sin practica, un tema de treinta compases se
   aprende de memoria a fuerza de repetir los primeros cinco. */
function reintenta(nuevo){
  const chk = (EST.practica && CHK.lista.length) ? CHK.lista[CHK.lista.length - 1] : null;
  for (const o of MUNDO.orbes) o.usado = false;
  if (chk){ restaura(chk); }
  else {
    for (const m of MUNDO.monedas) m.tomada = false;
    jugPone(JUG, 0);
  }
  EST.x0 = JUG.x;
  EST.pct = Math.round(cl(JUG.x/MUNDO.largo, 0, 1)*100);
  EST.corriendo = true; EST.muerto = 0; EST.gano = false;
  if (!nuevo) EST.intentos++;
  PART.length = 0;
  CAM.x = JUG.x - VISTA_ANCHO*CAM_OFS;
  musArranca(EST.nivel, tiempoDeX(JUG.x));
}

/* ── LA GUARDA IBA AL REVES, Y SE LLEVABA LA PARTIDA ──
   Decia `if (!JUG.vivo) return`, y a `muere()` se la llama JUSTO cuando `vivo`
   acaba de pasar a false: o sea que salia sin hacer nada y `corriendo` quedaba en
   true. Medido con la sonda: el jugador seguia cayendo hasta y = −197 con el
   juego «corriendo», sin morir, sin reintentar y sin contar el intento. Lo que
   hay que preguntar es si la partida sigue en pie, no si el cuerpo esta vivo. */
function muere(){
  if (!EST.corriendo) return;
  JUG.vivo = false; EST.corriendo = false; EST.muerto = 0.75;
  /* ── LA MUERTE SE SIENTE, Y SON CUATRO COSAS A LA VEZ ──
     Las esquirlas dicen que el cubo se rompio, el destello y el sacudon que fue
     un golpe, el acercamiento que la partida se termino, y el `hit` FRENA EL
     JUEGO cuatro cuadros: sin ese freno, el cuadro en que se choca y el cuadro
     en que ya no hay cubo son el mismo y no se llega a ver que paso. */
  chispas(JUG.x, JUG.y + 0.4, 34, COLES[ICONO.c1]);
  chispas(JUG.x, JUG.y + 0.4, 14, COLES[ICONO.c2]);
  destella('#ff5a4a', 1.0); sacude(1.2); acerca(0.08);
  EFE.hit = 0.07;
  son('muere'); musPara();
}

function gana(){
  EST.gano = true; EST.corriendo = false; EST.pct = 100;
  const P = PROG.niv[EST.nivel];
  /* ── EL MODO PRACTICA NO PUNTUA ──
     Con puntos de control, «cien por ciento» dejaria de querer decir nada. Lo
     que si guarda son las monedas: son lo que la practica existe para juntar. */
  if (!EST.practica){ P.mejor = 100; P.hecho = true; }
  for (let i = 0; i < MUNDO.monedas.length && i < 3; i++)
    if (MUNDO.monedas[i].tomada) P.mon[i] = true;
  guardaProg(); son('gana'); musPara();
  destella('#8ef0c4', 1.0); acerca(-0.10);
  chispas(JUG.x, JUG.y + 0.5, 30, COLES[ICONO.c1]);
}

/* ── UN PASO DE PARTIDA ──
   La x sale del reloj de la musica; si no hay audio se integra, asi el juego se
   puede jugar igual sin sonido. */
function pasoJuego(dt, apretado){
  if (!EST.corriendo) return;
  const med = MUNDO.med;
  /* `SIN_RELOJ` lo pone la sonda: la x sale del reloj de audio, que en una
     tanda sincronica no avanza, asi que sin este interruptor no hay forma de
     adelantar la simulacion sin esperarla en tiempo real. Y no es un atajo: es
     el mismo camino que usa el juego cuando no hay audio. */
  const t = SIN_RELOJ ? null : musTiempo();
  const xf = t == null ? null : cl(EST.x0 + xDeTiempo(t), EST.x0, MUNDO.largo + 8);
  /* ── EL SALTO PEDIDO SE GUARDA UNAS CENTESIMAS ──
     Un toque puede durar menos que un paso de fisica —16 ms— y entonces se
     perderia entero. Con el pedido guardado, un toque cortito cuenta igual. */
  const ap = apretado || EST.pedido > 0;
  EST.pedido = Math.max(0, EST.pedido - dt);
  avanza(JUG, med, dt, ap, xf);
  for (const m of MUNDO.monedas)
    if (!m.tomada && Math.abs(m.x - JUG.x) < 0.7 && Math.abs(m.y - (JUG.y + 0.43)) < 0.8){
      m.tomada = true; son('moneda');
      chispas(m.x, m.y, 14, '#ffd447');
      destella('#ffd447', 0.34); sacude(0.16);
    }
  /* la estela: en el piso son chispas del roce y en la nave es el chorro. Cuesta
     nada y es lo que hace que se lea que va rapido. */
  if (JUG.modo === 'nave') chispas(JUG.x - 0.55, JUG.y + 0.42, 1, '#ffd447');
  else if (JUG.piso && Math.random() < 0.35) chispas(JUG.x - 0.4, JUG.y + 0.05, 1, COLES[ICONO.c2]);
  if (!JUG.vivo){ muere(); return; }
  EST.pct = Math.round(cl(JUG.x/MUNDO.largo, 0, 1)*100);
  if (!EST.practica && EST.pct > PROG.niv[EST.nivel].mejor){
    PROG.niv[EST.nivel].mejor = EST.pct; EST.mejor = EST.pct;
  }
  if (JUG.x >= MUNDO.largo){ gana(); return; }
  /* ── LOS PUNTOS DE CONTROL SE PONEN SOLOS Y EN SITIO SEGURO ──
     Uno puesto justo antes de un pico convierte la practica en una trampa: se
     reaparece muriendo. Se exige piso, seis bloques de avance y nada mortal en
     los dos bloques que vienen. */
  if (EST.practica && JUG.piso && JUG.modo === 'cubo' && JUG.grav > 0){
    const ult = CHK.lista.length ? CHK.lista[CHK.lista.length - 1].c.x : -99;
    if (JUG.x - ult > 6 && seguro(JUG.x)){
      CHK.lista.push(snapshot());
      chispas(JUG.x, JUG.y + 0.3, 4, '#2de2a8');
    }
  }
}

function seguro(x){
  for (let d = 0; d <= 2.2; d += 0.4)
    for (const r of cerca(MUNDO.iMat, x + d))
      if (r.x < x + d + 0.6 && r.x + r.w > x + d - 0.6) return false;
  return true;
}

function toca(){
  if (!EST.corriendo) return false;
  EST.pedido = 0.12;
  return true;
}

/* ══════════════════════ EL ARMADO, EL BUCLE Y LAS SONDAS ══════════════════════ */

/* ── LAS PANTALLAS SON UNA SOLA FUNCION ──
   Con un `classList` por boton desparramado, la proxima pantalla que se agregue
   queda encendida encima de otra y nadie se entera hasta verlo. */
const PANS = ['pIdioma', 'pMenu', 'pNiveles', 'pIconos', 'pAjustes', 'pPausa', 'pFin'];
function pantalla(n){
  EST.p = n;
  for (const p of PANS) $(p).classList.toggle('on', p === n);
  document.body.classList.toggle('jugando', n === 'juego');
  document.body.classList.toggle('practicando', n === 'juego' && EST.practica);
  /* ── EL MENU MUESTRA EL JUEGO CORRIENDO ──
     Un panel encima de un lienzo quieto tira a la basura lo unico que este juego
     tiene para mostrar; el velo ya esta abierto en el medio justamente para eso.
     Y lo juega EL MISMO bot que valida los niveles, asi que no hay una segunda
     animacion que mantener sincronizada con nada. En la PAUSA no corre: ahi la
     escena tiene que quedarse quieta, que es lo que una pausa significa. */
  destella('#ffffff', 0);
  const q = n !== 'juego' && n !== 'pPausa';
  if (q && !DEMO) demoArranca();
  DEMO = q;
  CAM_OFS = q ? 0.82 : 0.30;
}

let DEMO = false, DEMO_ACUM = 0;
function demoArranca(){
  const n = EST.nivel;
  generaNivel(n, SEMILLAS[n] || 1);
  for (const o of MUNDO.orbes) o.usado = false;
  for (const m of MUNDO.monedas) m.tomada = false;
  jugPone(JUG, 0);
  DEMO_ACUM = 0;
  musArranca(n, 0);
}
function demoPaso(dt){
  if (!DEMO || !MUNDO.med) return;
  const med = MUNDO.med;
  const ph = Math.ceil(1.6*60/med.bpm*60), mira = Math.ceil(1.35*60/med.bpm*60);
  DEMO_ACUM = Math.min(DEMO_ACUM + dt, DT*6);
  while (DEMO_ACUM >= DT){
    DEMO_ACUM -= DT;
    avanza(JUG, med, DT, botElige(JUG, med, ph, mira));
    if (!JUG.vivo || JUG.x >= MUNDO.largo){ demoArranca(); return; }
  }
}

/* ══════════ EL IDIOMA LLEGA A CADA PALABRA ══════════
   Un solo repintado que barre TODO: con llamadas repartidas, la etiqueta que se
   agregue manana se queda en el idioma anterior. Es la leccion que en PUERTA
   BLANCA costo una vuelta entera. */
function repinta(){
  $('mSub').textContent = TX('sub');
  $('mTx').textContent = TX('texto');
  $('mPie').textContent = TX('pie');
  $('bJugar').textContent = TX('jugar');
  $('bIconos').textContent = TX('iconos');
  $('bAjustes').textContent = TX('ajustes');
  $('nTit').textContent = TX('niveles');
  $('nSub').textContent = TX('elegi');
  $('nVolver').textContent = TX('volver');
  $('iTit').textContent = TX('icono');
  $('iSub').textContent = TX('forma') + ' · ' + TX('color');
  $('iVolver').textContent = TX('volver');
  $('aTit').textContent = TX('ajus');
  $('aSub').textContent = TX('idioma') + ' · ' + TX('calidad');
  $('aMusL').textContent = TX('mus');
  $('aFxL').textContent = TX('fx');
  $('aVolver').textContent = TX('volver');
  $('pTit').textContent = TX('pausa');
  $('bSigo').textContent = TX('sigo');
  $('bReint').textContent = TX('reint');
  $('bSalir').textContent = TX('salir');
  $('fMenu').textContent = TX('menu');
  $('fSigue').textContent = TX('sigue');
  $('pract').textContent = TX('practOn');
  pintaPract();
  pintaLista();
  pintaFilas();
  pintaHud(true);
}
function pintaPract(){
  $('bPract').textContent = TX('pract') + (EST.practica ? ' ·' : '');
  $('bPract').classList.toggle('sel', EST.practica);
  $('pSub').textContent = NIVELES[EST.nivel].nom + ' · ' + EST.pct + '%';
}

/* ── LA LISTA DE NIVELES ──
   Cada ficha dice nombre, dificultad, tempo, mejor porcentaje y monedas: con el
   nombre solo, tres niveles son tres botones iguales. */
function pintaLista(){
  const L = $('lista'); L.innerHTML = '';
  NIVELES.forEach((N, i) => {
    const P = PROG.niv[i];
    const b = document.createElement('button');
    b.className = 'niv';
    const mon = P.mon.map(m => m ? '◆' : '◇').join('');
    const cc = 'rgb(' + N.col2.join(',') + ')';
    b.innerHTML = '<i class="cl" style="background:' + cc + '"></i>'
      + '<div class="n">' + N.nom + '</div>'
      + '<div class="d" style="color:' + cc + '99">' + difNom(N.dif) + ' · ' + N.bpm + ' BPM · ' + N.compases + '</div>'
      + '<div class="mo" style="color:' + (P.mon.some(m => m) ? '#ffd447' : 'rgba(255,255,255,.22)') + '">' + mon + '</div>'
      + '<div class="cara d' + N.dif + '">' + (P.hecho ? '✓' : N.dif) + '</div>'
      + '<i class="pb" style="width:' + P.mejor + '%"></i>';
    b.onclick = () => { son('clic'); entra(i); };
    L.appendChild(b);
  });
}

/* las filas de opciones: forma, los dos colores, idioma y calidad */
function fila(cont, items, sel, fn){
  cont.innerHTML = '';
  items.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'bt' + (i === sel ? ' sel' : '');
    b.textContent = t; b.onclick = () => { son('clic'); fn(i); };
    cont.appendChild(b);
  });
}
function pintaFilas(){
  /* ── NO HAY VISTA PREVIA, Y ES MEJOR ASI ──
     El demo del menu corre detras con el cubo de verdad, asi que elegir un color
     se ve en el objeto que se va a jugar. Una vista previa aparte seria un
     SEGUNDO dibujante del icono, y dos dibujantes terminan diciendo cosas
     distintas — es la razon por la que en 2D compartian una funcion. */
  fila($('iForma'), ['■', '◆', '●'], ICONO.forma, (i) => { ICONO.forma = i; guardaProg(); pintaFilas(); ponIcono(); });
  fila($('iCol1'), COLES.map(() => '●'), ICONO.c1, (i) => { ICONO.c1 = i; guardaProg(); pintaFilas(); ponIcono(); });
  fila($('iCol2'), COLES.map(() => '●'), ICONO.c2, (i) => { ICONO.c2 = i; guardaProg(); pintaFilas(); ponIcono(); });
  [...$('iCol1').children].forEach((b, i) => { b.style.color = COLES[i]; });
  [...$('iCol2').children].forEach((b, i) => { b.style.color = COLES[i]; });
  const idis = ['es', 'en', 'pt'];
  fila($('aIdi'), ['ES', 'EN', 'PT'], idis.indexOf(LANG), (i) => { LANG = idis[i]; guardaProg(); repinta(); });
  const cals = ['baja', 'media', 'alta'];
  fila($('aCal'), [TX('baja'), TX('media'), TX('alta')], cals.indexOf(CALIDAD),
       (i) => { CALIDAD = cals[i]; guardaProg(); mide(); pintaFilas(); });
}

/* ══════════ EL HUD ══════════
   Se escribe SOLO cuando cambia: escribir en el DOM sesenta veces por segundo
   obliga al navegador a recalcular el layout para poner el mismo texto. */
const HUD = { pct: -1, int: -1, mej: -1, tema: '' };
function pintaHud(forzar){
  if (forzar || HUD.pct !== EST.pct){
    HUD.pct = EST.pct;
    $('barraI').style.width = EST.pct + '%';
    $('pct').textContent = EST.pct + '%';
  }
  if (forzar || HUD.int !== EST.intentos){
    HUD.int = EST.intentos;
    $('intentos').textContent = TX('intento') + ' ' + (EST.intentos + 1);
  }
  if (forzar || HUD.mej !== EST.mejor){
    HUD.mej = EST.mejor;
    $('mejor').textContent = TX('mejor') + ' ' + EST.mejor + '%';
  }
  const t = NIVELES[EST.nivel].nom + ' · ' + NIVELES[EST.nivel].bpm;
  if (forzar || HUD.tema !== t){ HUD.tema = t; $('tema').textContent = t; }
}

/* ══════════ ENTRAR, PAUSAR Y SALIR ══════════ */
function entra(n){
  EST.intentos = 0;
  arranca(n);
  pantalla('juego');
  /* ── LA CAMARA SE COLOCA DE UNA AL ENTRAR ──
     `arranca` corre ANTES de `pantalla`, o sea con `CAM_OFS` todavia en el 82 %
     del demo, y `CAM.y` viene del menu: medido, el primer cuadro de la partida
     proyectaba al jugador en −0,64 del ancho, fuera de pantalla por la izquierda.
     Un `dt` grande hace que el suavizado llegue en un paso. */
  ponCam(1);
  pintaHud(true);
}
function pausa(){
  if (EST.p !== 'juego') return;
  EST.corriendo = false; musPara();
  pintaPract();
  pantalla('pPausa');
}
function sigue(){
  /* volver de la pausa REARRANCA el intento y no lo retoma, y es a proposito:
     retomarlo obligaria a empalmar la musica en el instante exacto en que se
     paro, y un tema que retoma medio tiempo corrido se escucha peor que un
     reintento */
  pantalla('juego'); reintenta(true); ponCam(1); pintaHud(true);
}
function salir(){ EST.corriendo = false; musPara(); pantalla('pNiveles'); pintaLista(); }

$('bJugar').onclick = () => { son('clic'); pantalla('pNiveles'); pintaLista(); };
$('bIconos').onclick = () => { son('clic'); pantalla('pIconos'); pintaFilas(); };
$('bAjustes').onclick = () => { son('clic'); pantalla('pAjustes'); pintaFilas(); };

$('iVolver').onclick = () => { son('clic'); pantalla('pMenu'); };
$('aVolver').onclick = () => { son('clic'); pantalla('pMenu'); };

$('bSigo').onclick = () => { son('clic'); sigue(); };
$('bReint').onclick = () => { son('clic'); CHK.lista.length = 0; pantalla('juego'); reintenta(true); ponCam(1); pintaHud(true); };

/* ══════════ LA ENTRADA ══════════
   Un toque en cualquier lado salta, asi que NO hacen falta coordenadas y el
   marco girado no complica nada: los botones son DOM y de la rotacion se ocupa
   el navegador. Mantener apretado salta en cadena, que es la regla del genero. */
let APRETADO = false;
function abajo(e){
  if (EST.p !== 'juego') return;
  APRETADO = true; toca();
  if (e && e.cancelable) e.preventDefault();
}
function arriba(){ APRETADO = false; }
const env = $('envase');
env.addEventListener('pointerdown', abajo);
addEventListener('pointerup', arriba);
addEventListener('pointercancel', arriba);
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Escape'){ EST.p === 'pPausa' ? sigue() : pausa(); return; }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ abajo(e); }
});
addEventListener('keyup', (e) => {

/* el audio no puede existir antes de un gesto de verdad, y el primer gesto de
   verdad es el boton de idioma, no JUGAR */

     contexto: se rearma con el primer gesto y no en un temporizador */
  if (DEMO && !MUS.on) demoArranca();
}, true);

/* ══════════════════════ EL BUCLE ══════════════════════ */
let CONGELADO = false;
let acum = 0, tPrev = 0, PASOS = 0;
function bucle(ts){
  requestAnimationFrame(bucle);
  const dt = tPrev ? Math.min(0.25, (ts - tPrev)/1000) : 0;
  tPrev = ts;
  musPaso();
  /* ── CONGELAR CONGELA EL CUADRO ENTERO, NO SOLO LA FISICA ──
     `ponCam` y las particulas quedaban afuera de la guarda, asi que la sonda
     plantaba un instante y el cuadro siguiente lo devolvia a su sitio: las
     chispas de la muerte se vencian antes de la foto y la camara volvia al
     encuadre normal. Es la cuarta vez en este repo —en PISTOLA hizo falta un
     `CAM_FIJA` por esto mismo— y la salida correcta es que congelar signifique
     que NADA avanza. Quien fotografia coloca la camara el mismo (`ponCam(1)`). */
  if (!CONGELADO){
    /* ── EL FRENO DE LA MUERTE COME TIEMPO DE SIMULACION, NO DE DIBUJO ──
       Se sigue dibujando —si no, la pantalla se congela y se lee a que el juego
       se colgo— y lo que se detiene son los pasos de fisica. */
    if (EFE.hit > 0){ EFE.hit -= dt; acum = 0; }
    else {
      acum += dt;
      let n = 0;
      while (acum >= DT && n < 8){ paso(DT); acum -= DT; n++; }
      if (acum > DT*8) acum = 0;
      demoPaso(dt);
    }
    efePaso(dt);
    sqPaso(dt);
    flaPaso(dt);
    ponCam(dt);
    pasoPart(dt);
    /* ── EL LATIDO DEL MENU SE ESCRIBE SOLO CON UN PANEL ABIERTO ──
       Escribir una variable de CSS sesenta veces por segundo durante la partida
       obliga al navegador a recalcular el layout para no cambiar nada. En un
       menu no hay nada que recalcular y el boton late con el tema. */
    if (EST.p !== 'juego') ponPulsoMenu();
  }
  pinta();
  pintaHud(false);
}
function paso(dt){
  PASOS++;
  if (EST.p !== 'juego') return;
  if (EST.corriendo){ pasoJuego(dt, APRETADO); return; }
  if (EST.gano){
    /* se espera un momento antes del cartel: cortar en el mismo cuadro tira a la
       basura lo unico que un cien por ciento tiene para mostrar */
    EST.muerto += dt;
    if (EST.muerto > 1.1){ EST.muerto = 0; pantalla('pFin'); pintaFin(); }
    return;
  }
  if (EST.muerto > 0){
    EST.muerto -= dt;
    /* ── SE REINTENTA SOLO ──
       Es la regla del genero: la muerte no abre un menu, vuelve a empezar. Un
       cartel de derrota cada cuatro segundos convierte el juego en un tramite. */
    if (EST.muerto <= 0) reintenta(false);
  }
}
let _pulAnt = -1;
function ponPulsoMenu(){
  const t = musTiempo();
  const p = t == null ? 0 : Math.pow(1 - (((t % 1) + 1) % 1), 3);
  const v = +p.toFixed(2);
  if (v !== _pulAnt){ _pulAnt = v; document.body.style.setProperty('--pulso', v); }
}

function pintaFin(){
  const P = PROG.niv[EST.nivel];
  const ultimo = PROG.niv.every(p => p.hecho);
  $('fTit').textContent = ultimo ? TX('fin') : TX('gano');
  $('fSub').textContent = NIVELES[EST.nivel].nom + ' · ' + TX('ganoS');
  $('fTx').textContent = ultimo ? TX('finT')
    : (TX('intento') + ' ' + (EST.intentos + 1) + ' · ' + P.mon.filter(m => m).length + '/3 ◆');
  $('fSigue').style.display = (EST.nivel + 1 < NIVELES.length) ? 'block' : 'none';
}

/* ══════════════════════ EL ARRANQUE ══════════════════════ */
function pon(p, txt){ $('cBarra').style.width = p + '%'; if (txt) $('cSub').textContent = txt; }
/* ── EL MENU CON IMAGENES, Y DEGRADANDO ──
   Las dos son adornos: si el base64 no decodifica, el menu se queda como estaba
   —titulo con relleno de degradado y el demo detras— y no hay un hueco. Por eso
   la clase `hay` la pone el `onload` de la propia imagen y no el codigo que la
   pide: preguntar «llego?» es lo unico que distingue un menu con foto de un menu
   con un rectangulo vacio. */
function ponMenuImg(){
  if (typeof IMG === 'undefined') return;
  const f = $('mFondo'), se = $('mSello');
  const pf = new Image();
  pf.onload = () => { f.style.backgroundImage = 'url(' + IMG.m_fondo + ')';
                      f.classList.add('hay'); };
  pf.src = IMG.m_fondo;
  se.onload = () => se.classList.add('hay');
  se.onerror = () => se.classList.remove('hay');
  se.src = IMG.m_sello;
}
function arrancaTodo(){
  cargaProg();

  /* las fotos empiezan a decodificar aca y el juego NO las espera: son telones */
  telonCarga();
  ponMenuImg();
  pon(12, 'ROTOR');
  /* los tres niveles se generan y SE JUEGAN acá: uno que no se pueda terminar
     tiene que morir en la pantalla de carga, no en las manos del jugador */
  setTimeout(() => {
    pon(35, NIVELES[0].nom);
    const s = preparaNiveles();
    pon(88, s.every(x => x > 0) ? 'OK' : '!');
    generaNivel(0, SEMILLAS[0] || 1);
    jugPone(JUG, 0);
    ponIcono();
    repinta();
    setTimeout(() => {
      pon(100);
      $('carga').classList.add('ido');
      /* si ya eligio idioma alguna vez, no se vuelve a preguntar */
      let visto = false;
      try { visto = !!localStorage.getItem('rotor_v1'); } catch(e){}
      pantalla(visto ? 'pMenu' : 'pIdioma');
      requestAnimationFrame(bucle);
    }, 240);
  }, 60);
}

/* ══════════════════════ LAS SONDAS ══════════════════════

window.__errs = [];

addEventListener('unhandledrejection', (e) => window.__errs.push('promesa: ' + e.reason));

  proy(x, y){ const p = proy(+x, +y); return [+p[0].toFixed(4), +p[1].toFixed(4)]; },

  /* adelanta la simulacion sin esperar: la x sale del reloj de la musica, asi que

  pasos(n){
    SIN_RELOJ = true;
    /* ── Y ADELANTA LOS EFECTOS CON LA FISICA, NO SOLO LA FISICA ──
       El bucle de verdad corre un paso de fisica y un paso de efectos por cuadro,
       los dos a 60. Adelantando solo la fisica con el cuadro congelado, los
       resortes no se integran nunca: medido, el empujon del salto (−3,3) seguia
       entero en la velocidad del resorte veintisiete pasos despues y el
       aterrizaje (+3,25) lo CANCELABA — un aplaste de 0,05 donde el juego hace
       14 %. La sonda estaba midiendo un juego que no existe. Las particulas van
       por lo mismo: sin envejecerlas, ciento cincuenta pasos de chispas quedan
       TODAS puestas y la foto sale con una alfombra de escombros de punta a
       punta del piso. */
    for (let i = 0; i < (n | 0); i++){
      paso(DT); efePaso(DT); sqPaso(DT); flaPaso(DT); pasoPart(DT); ponCam(DT);

  },
  congela(v){ CONGELADO = !!v; return CONGELADO; },
  /* ── EL BOT JUGANDO LA PARTIDA DE VERDAD ──
     `juegaSolo` prueba que el NIVEL se puede pasar; esto prueba que el JUEGO se

     mismo camino que el dedo, y de ahi salen las muertes, los reintentos, el
     porcentaje guardado y la pantalla del final. */
  autoJuega(tope){
    SIN_RELOJ = true;
    const med = MUNDO.med;
    const ph = Math.ceil(1.6*60/med.bpm*60), mira = Math.ceil(1.35*60/med.bpm*60);
    let i = 0;
    for (; i < (tope || 24000); i++){

         `pasos`: sin ellos, dos mil pasos de aterrizajes dejan el resorte
         acumulado y las chispas TODAS puestas — la foto de una corrida del bot
         sale con una alfombra de escombros y un cubo deformado al tope. Y LA
         CAMARA VA EN LA MISMA LISTA: sin ella se queda donde arranco, asi que el
         jugador termina proyectando en **17,9 veces el ancho de la pantalla** y
         la foto sale con el nivel vacio y sin cubo — que es exactamente lo que

      efePaso(DT); sqPaso(DT); flaPaso(DT); pasoPart(DT); ponCam(DT);
      paletaPaso(NIVELES[EST.nivel]);

  },

     encuadre normal y parece que la sonda no hizo nada. Es la cuarta vez en este

  foto(nivel, x, y, modo, grav){

    ponCam(1);

             sello: $('mSello').classList.contains('hay'),
             fondo: $('mFondo').classList.contains('hay'),
             selloAlto: Math.round($('mSello').getBoundingClientRect().height) };
  },
  /* el tramo de paleta: cambia cada 128 bloques, o sea cada ocho compases */
  pal(){
    return { tramo: PAL.i, x0: +PAL.x0.toFixed(1), listo: PAL.listo,
             c1: '#' + _p1.getHexString(), c2: '#' + _p2.getHexString() };
  },
  /* adelanta SOLO los relojes de los efectos: con el cuadro congelado, el resorte
     y el sacudon no avanzan y no hay forma de medirlos paso a paso */
  efePasos(n){ for (let i = 0; i < (n | 0); i++){ efePaso(DT); sqPaso(DT); flaPaso(DT); } return efeDe(); },
  demo(){ return { on: DEMO, x: +JUG.x.toFixed(1), vivo: JUG.vivo, nivel: EST.nivel }; },
  progreso(){ return PROG.niv.map(p => ({ mejor: p.mejor, mon: p.mon.slice(), hecho: p.hecho })); },
  reset(){ try { localStorage.removeItem('rotor_v1'); } catch(e){} return true; }
};
</script>
