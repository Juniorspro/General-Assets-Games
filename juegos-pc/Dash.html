<title>ROTOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060a;color:#eaf0fb;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}

/* ══════════ EL MARCO SE GIRA, Y NO HAY PANTALLA DE «GIRA EL CELULAR» ══════════
   Este juego es apaisado y el telefono se agarra vertical. Las dos salidas malas
   son encogerlo —en un 412x892 un 16:9 sin girar mide 412x232, o sea el 11 % de
   la pantalla— y pedirle al jugador que gire el aparato, que es una pantalla que
   no hace nada y que la mitad de la gente no obedece.
   Asi que se gira el MARCO 90 grados y adentro va TODO: el lienzo, el HUD y los
   menus. Una sola transformacion, y nada puede quedar desalineado.
   Y ACA NO HACEN FALTA COORDENADAS DEL DEDO: un toque en cualquier lado salta,
   asi que el marco girado no complica nada. Los botones son DOM y de la rotacion
   se ocupa el navegador. (Ojo si algun dia hace falta leer donde toco: con el
   marco girado `getBoundingClientRect` devuelve la caja alineada a los ejes y
   miente, y hay que medir con `offsetLeft`/`offsetTop`.) */
#envase{position:fixed;inset:0;overflow:hidden}
#marco{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
#marco.girado{transform:translate(-50%,-50%) rotate(90deg)}
#marco.derecho{transform:translate(-50%,-50%)}
#cv{display:block;width:100%;height:100%}

/* ══════════ EL HUD ══════════ */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s}
body.jugando #hud{opacity:1}
/* la barra de progreso arriba: es la ficha del genero. Dice cuanto falta, y el
   numero al costado dice cuanto, porque una barra sola no se puede comparar
   contra el intento anterior */
#barra{position:absolute;left:6%;right:24%;top:10px;height:13px;border-radius:99px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);overflow:hidden}
#barra i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#2de2a8,#5ad9ff);transition:width .06s linear}
/* el numero va AL LADO de la barra y no encima: adentro se pisa con ella, y una
   barra sola no se puede comparar contra el intento anterior */
#pct{position:absolute;right:6%;top:10px;
  font:800 12px/13px system-ui,sans-serif;letter-spacing:.06em;color:#8ef0c4}
#mejor{position:absolute;right:6%;top:30px;font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.14em;color:rgba(220,235,255,.50)}
#intentos{position:absolute;left:50%;top:26%;transform:translateX(-50%);
  font:800 clamp(15px,2.6vh,22px)/1 system-ui,sans-serif;letter-spacing:.16em;
  color:rgba(255,255,255,.20)}
#tema{position:absolute;left:6%;top:30px;font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.14em;color:rgba(220,235,255,.50)}
#pract{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  font:800 10px/1 system-ui,sans-serif;letter-spacing:.20em;color:#8ef0c4;
  padding:5px 12px;border-radius:99px;background:rgba(20,90,60,.42);display:none}
body.practicando #pract{display:block}
#bPausa{position:absolute;right:8px;top:44px;width:34px;height:34px;border-radius:10px;
  border:1px solid rgba(255,255,255,.16);background:rgba(10,14,22,.55);color:#eaf0fb;
  font:700 13px/1 system-ui;pointer-events:auto;display:none}
body.jugando #bPausa{display:block}

/* ══════════ LAS PANTALLAS ══════════ */
.pan{position:absolute;inset:0;z-index:20;display:none;place-items:center;
  padding:16px;overflow:hidden}
.pan.on{display:grid}
/* ── EL VELO ES UN DEGRADADO Y SE ABRE DONDE ESTA LA ACCION ──
   Cerrado arriba, donde va el titulo, y abierto en la franja de abajo, que es
   justo donde el nivel tiene el piso, el cubo y los picos. Con una opacidad
   pareja el demo de atras no se veia: medido, quedaba al 28 % de brillo y el cubo
   se leia a mancha. */
.pan::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,6,10,.95),rgba(5,6,10,.88) 42%,
    rgba(6,8,14,.66) 56%,rgba(6,8,14,.34) 76%,rgba(5,6,10,.88))}
.caja{position:relative;text-align:center;width:min(430px,92%)}
h1{font:800 clamp(26px,6.2vh,44px)/1 system-ui,sans-serif;letter-spacing:.20em;
  text-indent:.20em;
  background:linear-gradient(180deg,#eafcff 0%,#77e6ff 45%,#2b7fd6 64%,#b8f2d6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(0,180,255,.35))}
h1::after{content:'';display:block;width:84px;height:2px;margin:11px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,#2de2a8,transparent)}
.sub{font:700 9.5px/1.7 ui-monospace,monospace;letter-spacing:.24em;
  color:rgba(190,215,245,.46);text-transform:uppercase;margin:8px 0 16px}
.tx{font-size:12.5px;line-height:1.6;color:rgba(220,235,255,.80);margin-bottom:14px;
  text-shadow:0 1px 4px rgba(0,0,0,.85)}
.bt{display:block;width:100%;margin-top:9px;padding:13px 16px;border-radius:12px;
  border:1px solid rgba(90,217,255,.28);background:rgba(9,14,24,.72);color:#eaf0fb;
  font:800 14px/1 system-ui,sans-serif;letter-spacing:.08em;transition:transform .1s}
.bt:active{transform:scale(.97)}
.bt.p{background:linear-gradient(135deg,#2de2a8,#5ad9ff);color:#04222c;border-color:transparent}
.fila{display:flex;gap:7px;margin-top:9px}
.fila .bt{margin-top:0}
.bt.sel{background:linear-gradient(135deg,#2de2a8,#5ad9ff);color:#04222c;border-color:transparent}
.pie{margin-top:13px;font-size:10.5px;line-height:1.6;color:rgba(200,222,250,.58);
  text-shadow:0 1px 4px rgba(0,0,0,.9)}

/* ── LA LISTA DE NIVELES: UNA FICHA POR NIVEL, COMO EN EL GENERO ──
   Cada ficha dice el nombre, la dificultad, el tema, el mejor porcentaje y las
   tres monedas. Todo eso junto es lo que hace que un nivel se pueda ELEGIR: con
   el nombre solo, tres niveles son tres botones iguales. */
.niv{display:block;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;
  border:1px solid rgba(120,210,255,.22);background:rgba(10,16,28,.80);
  color:#eaf0fb;text-align:left;position:relative;overflow:hidden}
.niv:active{transform:scale(.985)}
.niv .n{font:800 15px/1.2 system-ui,sans-serif;letter-spacing:.05em}
.niv .d{font:700 9px/1 ui-monospace,monospace;letter-spacing:.16em;margin-top:5px;
  color:rgba(200,225,250,.55)}
.niv .pb{position:absolute;left:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#2de2a8,#5ad9ff)}
.niv .mo{position:absolute;right:46px;top:15px;font:700 15px/1 system-ui;letter-spacing:.16em}
.cara{position:absolute;right:12px;bottom:12px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font:800 11px/1 system-ui}
.d1{background:#2de2a8;color:#04221a}
.d2{background:#5ad9ff;color:#032430}
.d3{background:#ff7a4a;color:#2a0d04}

#carga{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:#05060a;transition:opacity .3s}
#carga.ido{opacity:0;pointer-events:none}
.barc{width:min(240px,60%);height:4px;border-radius:99px;background:rgba(255,255,255,.10);
  overflow:hidden;margin:16px auto 0}
.barc i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2de2a8,#5ad9ff);
  transition:width .3s}
</style>

<script type="module">
import * as T from 'three';


/* ══════════════════════ LAS MEDIDAS, Y DE DONDE SALEN ══════════════════════
   Todo se mide en BLOQUES y en TIEMPOS de compas, no en pixeles ni en segundos,
   y esa es la decision de la que cuelga el juego entero.

   ── UN TIEMPO SON CUATRO BLOQUES ──
   De ahi sale la velocidad: `V = 4 · BPM / 60`. Asi un obstaculo puesto en la
   corchea cae SIEMPRE en un multiplo de dos bloques, y «que vaya al ritmo» deja
   de ser algo que hay que sincronizar a mano: es una propiedad de la grilla.

   ── Y EL SALTO DURA EXACTAMENTE UN TIEMPO ──
   Que es lo que lo vuelve una unidad musical. Fijado el aire en `T = 60/BPM` y
   el alto en 2,4 bloques, la gravedad y el impulso SALEN de una cuenta:
       g = 8·alto/T²      v = 4·alto/T
   Con eso el salto mide cuatro bloques de largo en los tres niveles, aunque los
   tres vayan a otro tempo. Escribiendo la gravedad a mano, el salto mediria
   distinto en cada nivel y los patrones dejarian de servir. */
const BLOQ_POR_TIEMPO = 4;
const SALTO_ALTO = 2.4;          /* bloques de apice */
const JUG_LADO = 0.86;           /* el cubo es un poco mas chico que su celda */
/* ── EL PASILLO DE LA NAVE MIDE LO QUE ENTRA EN PANTALLA ──
   `py()` deja ver `ALTO/U − 0,9` bloques, o sea 8,33 en un marco de telefono. Con
   el techo en 9,2 —y hasta con 8,2— caia POR ENCIMA del borde de arriba: medido
   en la foto, la nave volaba en un pasillo sin tapa visible, y un limite que no
   se ve no es un limite, es una muerte sorpresa. Con 7,6 entra entero y quedan
   ocho decimas de aire arriba y abajo. */
const ALTO_PASILLO = 7.6;
/* y el techo del tramo de gravedad invertida, por la misma razon */
const ALTO_GRAV = 7.0;

function medidasDe(bpm){
  const T = 60/bpm;                         /* un tiempo, en segundos */
  return {
    bpm, T,
    v: BLOQ_POR_TIEMPO*bpm/60,              /* bloques por segundo */
    g: 8*SALTO_ALTO/(T*T),
    imp: 4*SALTO_ALTO/T,
    /* el pad amarillo lanza el doble de alto, o sea raiz de dos veces el impulso */
    impPad: 4*SALTO_ALTO/T*Math.SQRT2,
    /* la nave: subir y bajar son aceleraciones, no velocidades, porque lo que se
       controla es la CURVA. Con velocidad directa la nave se lee a ascensor. */
    naveA: 8*SALTO_ALTO/(T*T)*0.62,
    naveMax: 4*SALTO_ALTO/T*0.70
  };
}

/* ══════════ EL ENCUADRE ══════════
   Se ven 20 bloques de ancho, y el numero sale de dos cuentas y no del gusto:
   · el jugador va al 30 %, o sea que quedan 14 bloques de aviso, y el salto mide
     4 — hay tiempo de leer lo que viene;
   · y en un marco de 2,17 a 1 eso deja **9,2 bloques de alto**, que es
     exactamente lo que mide el pasillo de la nave: el tramo de nave llena la
     pantalla sin que haya que mover la camara.
   Con 26 el cubo medía el 7 % del alto y se leía a punto. */
const VISTA_ANCHO = 20;

/* ══════════ LOS TRES NIVELES ══════════
   Cada uno con su tempo, su dificultad y su mezcla de modos. Los nombres son
   propios: esto es un juego del genero, no una copia de otro. */
const NIVELES = [
  { id: 0, nom: 'NEON DRIVE',   bpm: 128, dif: 1, compases: 26, modos: ['cubo'],
    col: [0x10, 0x1c, 0x30], col2: [0x2d, 0xe2, 0xa8] },
  { id: 1, nom: 'GRAVEDAD CERO', bpm: 140, dif: 2, compases: 28,
    modos: ['cubo', 'gravedad'], col: [0x1e, 0x12, 0x30], col2: [0xb0, 0x7a, 0xff] },
  { id: 2, nom: 'ROTOR',         bpm: 150, dif: 3, compases: 30,
    modos: ['cubo', 'gravedad', 'nave'], col: [0x2a, 0x10, 0x18], col2: [0xff, 0x7a, 0x4a] }
];
/* ── LA DIFICULTAD SALE DE LA TABLA COMO TODO LO DEMAS ──
   Estaba como un array de tres cadenas en castellano, o sea texto escrito derecho
   en el codigo sin pasar por `TX`: medido en la captura, el juego en ingles decia
   LEVELS · PICK A TRACK y abajo FÁCIL · NORMAL · DIFÍCIL. */
const difNom = (d) => TX('dif' + d);

/* ══════════ EL AZAR CON SEMILLA ══════════
   Un nivel tiene que ser EL MISMO nivel siempre: con azar de verdad, «el pico
   del compas nueve» deja de querer decir algo y no se puede aprender de memoria,
   que es de lo que vive este genero. */
let _sem = 1;
function sem(n){ _sem = (n | 0) || 1; }
function az(){ _sem = (_sem*1664525 + 1013904223) >>> 0; return _sem/4294967296; }
function azr(a, b){ return a + az()*(b - a); }
function azi(a, b){ return Math.floor(azr(a, b + 1)); }

const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, k) => a + (b - a)*k;
const $ = (id) => document.getElementById(id);

/* ══════════ LOS TRES IDIOMAS ══════════ */
const TXT = {
  es: { dif1:'FÁCIL', dif2:'NORMAL', dif3:'DIFÍCIL', sub:'UN CUBO, TRES TEMAS Y NINGUNA VIDA', jugar:'JUGAR', iconos:'ICONO',
        ajustes:'AJUSTES', volver:'VOLVER', niveles:'NIVELES', elegi:'ELEGÍ UN TEMA',
        icono:'ICONO', forma:'FORMA', color:'COLOR', ajus:'AJUSTES',
        mus:'MÚSICA', fx:'EFECTOS', idioma:'IDIOMA', calidad:'GRÁFICOS',
        baja:'BAJA', media:'MEDIA', alta:'ALTA',
        pausa:'PAUSA', sigo:'SEGUIR', reint:'REINTENTAR', pract:'MODO PRÁCTICA',
        practOn:'PRÁCTICA', salir:'SALIR', intento:'INTENTO',
        mejor:'MEJOR', gano:'¡COMPLETO!', ganoS:'CIEN POR CIENTO',
        fin:'LOS TRES TEMAS', finT:'No queda ninguno. Probá el modo práctica para las monedas.',
        sigue:'SIGUIENTE', menu:'MENÚ',
        texto:'Un toque salta. Mantené para saltar en cadena. No hay vidas: si chocás, volvés al principio del tema.',
        pie:'Los obstáculos caen en el compás. La música y el nivel son lo mismo.' },
  en: { dif1:'EASY', dif2:'NORMAL', dif3:'HARD', sub:'ONE CUBE, THREE TRACKS, NO LIVES', jugar:'PLAY', iconos:'ICON',
        ajustes:'SETTINGS', volver:'BACK', niveles:'LEVELS', elegi:'PICK A TRACK',
        icono:'ICON', forma:'SHAPE', color:'COLOUR', ajus:'SETTINGS',
        mus:'MUSIC', fx:'SFX', idioma:'LANGUAGE', calidad:'GRAPHICS',
        baja:'LOW', media:'MEDIUM', alta:'HIGH',
        pausa:'PAUSED', sigo:'RESUME', reint:'RETRY', pract:'PRACTICE MODE',
        practOn:'PRACTICE', salir:'QUIT', intento:'ATTEMPT',
        mejor:'BEST', gano:'COMPLETE!', ganoS:'ONE HUNDRED PERCENT',
        fin:'ALL THREE TRACKS', finT:'Nothing left. Try practice mode for the coins.',
        sigue:'NEXT', menu:'MENU',
        texto:'Tap to jump. Hold to chain jumps. No lives: crash and you go back to the start of the track.',
        pie:'Obstacles land on the beat. The music and the level are the same thing.' },
  pt: { dif1:'FÁCIL', dif2:'NORMAL', dif3:'DIFÍCIL', sub:'UM CUBO, TRÊS FAIXAS, NENHUMA VIDA', jugar:'JOGAR', iconos:'ÍCONE',
        ajustes:'AJUSTES', volver:'VOLTAR', niveles:'NÍVEIS', elegi:'ESCOLHA UMA FAIXA',
        icono:'ÍCONE', forma:'FORMA', color:'COR', ajus:'AJUSTES',
        mus:'MÚSICA', fx:'EFEITOS', idioma:'IDIOMA', calidad:'GRÁFICOS',
        baja:'BAIXA', media:'MÉDIA', alta:'ALTA',
        pausa:'PAUSA', sigo:'CONTINUAR', reint:'DE NOVO', pract:'MODO TREINO',
        practOn:'TREINO', salir:'SAIR', intento:'TENTATIVA',
        mejor:'MELHOR', gano:'COMPLETO!', ganoS:'CEM POR CENTO',
        fin:'AS TRÊS FAIXAS', finT:'Não sobrou nenhuma. Tente o modo treino pelas moedas.',
        sigue:'PRÓXIMO', menu:'MENU',
        texto:'Um toque salta. Segure para saltar em cadeia. Não há vidas: se bater, volta ao início da faixa.',
        pie:'Os obstáculos caem no compasso. A música e o nível são a mesma coisa.' }
};
let LANG = 'en';
const TX = (k) => (TXT[LANG] && TXT[LANG][k]) || TXT.es[k] || k;

const CALIDADES = { baja: { esc: 0.60, part: 26 }, media: { esc: 0.85, part: 70 },
                    alta: { esc: 1.00, part: 130 } };
let CALIDAD = 'media';

/* ══════════════════════ LA MUSICA, Y ES EL RELOJ ══════════════════════
   ── POR QUE ES PROCEDURAL Y NO UN MP3 ──
   El pedido es que el nivel vaya al ritmo. Con un tema grabado hay que MEDIRLE
   el tempo y despues confiar en que no se corra; con un tema generado por
   codigo, el compas es un numero que el juego ya tiene, asi que la sincronia no
   se ajusta: es exacta por construccion. Y pesa cero bytes, que en un HTML
   autocontenido de un solo archivo no es un detalle.
   Es electronica de verdad y no bips: bombo en cada tiempo, clap en el 2 y el 4,
   charles en las corcheas, un bajo con filtro que se abre, un arpegio de
   dieciseisavos y una linea de lead de dos compases.

   ── Y EL RELOJ DEL JUEGO SALE DE ACA ──
   `AudioContext.currentTime` es el unico reloj que no se atrasa cuando el
   navegador pierde cuadros. Si la simulacion corriera con el reloj de pantalla,
   una tanda de cuadros perdidos correria el nivel respecto de la musica y el
   juego dejaria de estar en tiempo — que es exactamente el defecto que este
   genero no puede tener. */
let AUD = null, MAE = null, GMUS = null, GFX = null, RUI = null;
let VOL_MUS = 0.70, VOL_FX = 0.80;
let ANAL = null;

function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAE = AUD.createGain(); MAE.gain.value = 0.9; MAE.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAE.connect(ANAL);
  /* dos buses: sin ellos, bajar «la musica» bajaria tambien el sonido de saltar,
     y son dos perillas distintas porque son dos cosas distintas */
  GMUS = AUD.createGain(); GMUS.gain.value = VOL_MUS; GMUS.connect(MAE);
  GFX = AUD.createGain(); GFX.gain.value = VOL_FX; GFX.connect(MAE);
  const n = Math.floor(AUD.sampleRate*0.6);
  RUI = AUD.createBuffer(1, n, AUD.sampleRate);
  const d = RUI.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
}

/* ══════════ LAS TRES PISTAS ══════════
   Cada una es una escala, un bajo y un motivo. La escala es menor pentatonica en
   las tres: en un tema que se repite treinta veces por partida, cualquier nota
   suena bien con cualquier otra y eso es la diferencia entre musica y tortura.
   Lo que cambia entre pistas es el tempo, la raiz y la densidad. */
const ESCALA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
const PISTAS = [
  { raiz: 55.00, arp: [0, 4, 2, 5], lead: [7, 5, 4, 2, 4, 5, 7, 8], densidad: 0.55 },
  { raiz: 61.74, arp: [0, 3, 5, 3], lead: [5, 7, 8, 7, 5, 4, 2, 0], densidad: 0.72 },
  { raiz: 49.00, arp: [0, 5, 3, 7], lead: [9, 7, 5, 7, 9, 10, 9, 7], densidad: 0.88 }
];
const nota = (raiz, g) => raiz*Math.pow(2, ESCALA[((g % ESCALA.length) + ESCALA.length) % ESCALA.length]/12);

const MUS = { on: false, t0: 0, bpm: 128, pista: 0, prox: 0, paso: 0, ganancia: 1 };

/* ── EL PLANIFICADOR MIRA ADELANTE Y NO CUELGA DEL BUCLE DE DIBUJO ──
   `requestAnimationFrame` se atrasa y se PAUSA en segundo plano; el reloj de
   audio no. Se agenda todo lo que entre en los proximos 180 ms. */
const MIRA = 0.18;
/* ── ARRANCA DESDE UN TIEMPO, NO SIEMPRE DESDE CERO ──
   Lo pide el modo practica: si el punto de control esta en el bloque 96, la
   musica tiene que retomar en el compas que le corresponde. Y puede hacerlo sin
   ninguna cuenta nueva justamente porque el nivel y el tema comparten la grilla:
   el bloque 96 ES el tiempo 24. */
function musArranca(nivel, desdeT){
  armaAudio(); if (!AUD) return;
  const N = NIVELES[nivel];
  const d = Math.max(0, desdeT || 0);
  MUS.on = true; MUS.bpm = N.bpm; MUS.pista = nivel;
  const dur = 60/N.bpm/4;
  MUS.t0 = AUD.currentTime + 0.12 - d*60/N.bpm;
  MUS.paso = Math.floor(d*4);
  MUS.prox = MUS.t0 + MUS.paso*dur;
  MUS.ganancia = 1;
}
function musPara(){ MUS.on = false; }
/* el tiempo musical, en TIEMPOS de compas. Es el reloj del juego. */
function musTiempo(){
  if (!AUD || !MUS.on) return null;
  return (AUD.currentTime - MUS.t0)*MUS.bpm/60;
}

function musPaso(){
  if (!MUS.on || !AUD) return;
  const dur = 60/MUS.bpm/4;                 /* un dieciseisavo */
  const P = PISTAS[MUS.pista];
  while (MUS.prox < AUD.currentTime + MIRA){
    const t = MUS.prox, s = MUS.paso, s16 = s % 16;
    const g = MUS.ganancia;
    /* el bombo: en cada tiempo, y es lo que el jugador siente como el pulso */
    if (s16 % 4 === 0) golpe(t, 0.42*g);
    /* el clap en el 2 y el 4 */
    if (s16 === 4 || s16 === 12) clap(t, 0.26*g);
    /* el charles en las corcheas, y abierto en la contra */
    if (s16 % 2 === 0) charles(t, s16 % 4 === 2 ? 0.14*g : 0.09*g, s16 % 8 === 6);
    /* el bajo: la fundamental en cada tiempo, con un octavo que empuja */
    if (s16 % 4 === 0 || s16 % 8 === 3)
      bajo(t, nota(P.raiz, P.arp[(s16/4 | 0) % 4]), dur*(s16 % 4 === 0 ? 3.4 : 1.6), 0.30*g);
    /* el arpegio de dieciseisavos, que es lo que da la sensacion de velocidad */
    if (az2(s) < P.densidad)
      arp(t, nota(P.raiz*4, P.arp[s16 % 4] + (s16 % 8 >= 4 ? 5 : 0)), dur*1.5, 0.075*g);
    /* y el lead, una nota por tiempo sobre dos compases */
    if (s16 % 4 === 0){
      const i = (s/4 | 0) % 8;
      lead(t, nota(P.raiz*2, P.lead[i]), 60/MUS.bpm*0.9, 0.10*g);
    }
    MUS.prox += dur; MUS.paso++;
  }
}
/* un azar barato y DETERMINISTA por paso: con `Math.random` el arpegio cambiaria
   en cada intento y el tema dejaria de ser el mismo tema */
function az2(s){ let x = (s*2654435761) >>> 0; x ^= x >>> 15; return ((x*1274126177) >>> 0)/4294967296; }

function golpe(t, v){
  const o = AUD.createOscillator(), g = AUD.createGain();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(g); g.connect(GMUS); o.start(t); o.stop(t + 0.19);
}
function clap(t, v){
  const s = AUD.createBufferSource(); s.buffer = RUI;
  const f = AUD.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 1.2;
  const g = AUD.createGain();
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  s.connect(f); f.connect(g); g.connect(GMUS); s.start(t); s.stop(t + 0.15);
}
function charles(t, v, abierto){
  const s = AUD.createBufferSource(); s.buffer = RUI;
  const f = AUD.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
  const g = AUD.createGain();
  const d = abierto ? 0.09 : 0.035;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(GMUS); s.start(t); s.stop(t + d + 0.02);
}
function bajo(t, f0, d, v){
  const o = AUD.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f0;
  const fl = AUD.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 6;
  /* el filtro que se abre y se cierra es TODO el sonido de un bajo electronico:
     con el filtro fijo suena a organo */
  fl.frequency.setValueAtTime(180, t);
  fl.frequency.linearRampToValueAtTime(1100, t + d*0.35);
  fl.frequency.linearRampToValueAtTime(220, t + d);
  const g = AUD.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(GMUS); o.start(t); o.stop(t + d + 0.02);
}
function arp(t, f0, d, v){
  const o = AUD.createOscillator(); o.type = 'square'; o.frequency.value = f0;
  const g = AUD.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(GMUS); o.start(t); o.stop(t + d + 0.02);
}
function lead(t, f0, d, v){
  /* dos osciladores desafinados un pelo: dos senos identicos suenan a tono de
     prueba, y dos que baten cada tanto suenan a instrumento */
  for (const det of [1, 1.006]){
    const o = AUD.createOscillator(); o.type = 'triangle'; o.frequency.value = f0*det;
    const g = AUD.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.02);
    g.gain.setValueAtTime(v, t + d*0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(GMUS); o.start(t); o.stop(t + d + 0.02);
  }
}

/* ══════════ LOS EFECTOS ══════════ */
function son(k){
  armaAudio(); if (!AUD) return;
  const t = AUD.currentTime, g = AUD.createGain(); g.connect(GFX);
  if (k === 'salta'){
    const o = AUD.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(360, t);
    o.frequency.exponentialRampToValueAtTime(780, t + 0.07);
    g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); o.start(t); o.stop(t + 0.1);
  } else if (k === 'muere'){
    const s = AUD.createBufferSource(); s.buffer = RUI;
    const f = AUD.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(2600, t);
    f.frequency.exponentialRampToValueAtTime(180, t + 0.4);
    g.gain.setValueAtTime(0.34, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    s.connect(f); f.connect(g); s.start(t); s.stop(t + 0.47);
  } else if (k === 'portal' || k === 'pad'){
    const o = AUD.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(k === 'pad' ? 300 : 620, t);
    o.frequency.exponentialRampToValueAtTime(k === 'pad' ? 1200 : 240, t + 0.18);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); o.start(t); o.stop(t + 0.22);
  } else if (k === 'moneda'){
    for (let i = 0; i < 3; i++){
      const o = AUD.createOscillator(); o.type = 'triangle';
      o.frequency.value = 880*Math.pow(2, i*0.25);
      const gg = AUD.createGain(); gg.connect(GFX);
      const t0 = t + i*0.06;
      gg.gain.setValueAtTime(0.0001, t0);
      gg.gain.linearRampToValueAtTime(0.16, t0 + 0.01);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(gg); o.start(t0); o.stop(t0 + 0.18);
    }
  } else if (k === 'gana'){
    [0, 4, 7, 12].forEach((n, i) => {
      const o = AUD.createOscillator(); o.type = 'triangle';
      o.frequency.value = 440*Math.pow(2, n/12);
      const gg = AUD.createGain(); gg.connect(GFX);
      const t0 = t + i*0.1;
      gg.gain.setValueAtTime(0.0001, t0);
      gg.gain.linearRampToValueAtTime(0.2, t0 + 0.015);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
      o.connect(gg); o.start(t0); o.stop(t0 + 0.44);
    });
  } else if (k === 'clic'){
    const o = AUD.createOscillator(); o.type = 'triangle'; o.frequency.value = 700;
    g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); o.start(t); o.stop(t + 0.08);
  }
}
function ponVol(){
  if (GMUS) GMUS.gain.value = VOL_MUS;
  if (GFX) GFX.gain.value = VOL_FX;
}

/* ══════════════════════ EL NIVEL ══════════════════════
   ── SE ARMA PEGANDO PATRONES SOBRE LA GRILLA DEL COMPAS ──
   Un patron mide un compas —cuatro tiempos, o sea dieciseis bloques— y todo lo
   que pone cae en corcheas. Asi «el nivel va al ritmo» no es algo que haya que
   sincronizar: es lo unico que el generador sabe hacer.

   ── Y UN NIVEL GENERADO Y NO JUGADO ES UN NIVEL ROTO QUE TODAVIA NO SE SABE ──
   Es la regla que en este repo ya costo siete niveles imposibles en Maicol y una
   nube 37 de 42 en BARRIO. El generador tira, y despues el auto-jugador de `g.js`
   lo tiene que terminar al 100 %: si no llega, se rechaza y se vuelve a tirar con
   otra semilla. El validador y el juego comparten la MISMA fisica, asi que el
   validador no puede aprobar un juego que no existe. */
const MUNDO = {
  largo: 0,            /* en bloques */
  sol: [],             /* solidos: se para arriba, se muere de costado */
  mat: [],             /* mortales: picos y sierras */
  pads: [], orbes: [], portales: [], monedas: [],
  sierras: [],         /* solo para dibujar: su caja mortal ya esta en `mat` */
  techo: [],           /* tramos con techo, para gravedad y nave */
  nivel: 0, med: null,
  /* ── LA REVISION ──
     La sube `generaNivel` y el dibujo la mira para saber si tiene que rearmar
     las mallas. Con una llamada explicita, el dia que se agregue un camino que
     genere un nivel —el demo del menu, una sonda, la validacion— se olvida y se
     dibuja el nivel anterior. */
  rev: 0,
  /* los indices arrancan vacios: `cerca()` se puede llamar antes de generar */
  iSol: [], iMat: []
};

const rect = (x, y, w, h, t) => ({ x, y, w, h, t });

/* ── LOS PATRONES ──
   Cada uno declara lo que pone y NADA MAS: no declara la solucion. La solucion
   la encuentra el auto-jugador, que es lo que garantiza que exista de verdad.
   `d` es la dificultad minima de nivel en la que el patron puede salir. */
const PATRONES = [
  { n: 'vacio', d: 1, pon(){} },
  { n: 'pico1', d: 1, pon(P, x){ P.pico(x + 8); } },
  { n: 'pico2', d: 1, pon(P, x){ P.pico(x + 4); P.pico(x + 12); } },
  { n: 'dobles', d: 1, pon(P, x){ P.pico(x + 7); P.pico(x + 8); } },
  { n: 'pico3', d: 2, pon(P, x){ P.pico(x + 4); P.pico(x + 9); P.pico(x + 14); } },
  /* ── TRES PICOS SEGUIDOS NO SE PUEDEN PASAR, Y ES ARITMETICA ──
     El salto deja la caja por encima de los 0,82 de un pico durante 3,25 bloques
     (`9,6·u(1−u) > 0,82` da u de 0,094 a 0,906, y el salto mide 4). Tres picos
     pegados ocupan 3,50 contando el ancho de la caja: no hay despegue que sirva.
     Dos si (2,50), y por eso `dobles` existe y este patron paso a ser otra cosa:
     un muro del que hay que saltar TARDE, porque bajarse caminando aterriza justo
     encima de los dos picos. Eso es una prueba de tiempo y no de reflejo. */
  { n: 'trampa', d: 3, pon(P, x){
      P.bloque(x + 6, 0, 1.2, 1.6); P.pico(x + 8); P.pico(x + 9);
    } },
  /* ── LA PLATAFORMA VA A 1,6 Y NO A 2,0, Y ES ARITMETICA ──
     El apice del salto son 2,4 bloques, asi que una plataforma cuya cara de
     arriba este en 2,6 NO SE PUEDE ALCANZAR: se podia pasar por debajo saltando
     los dos picos, pero la moneda de arriba era imposible y la plataforma era
     decoracion. Con la cara en 2,2 se aterriza encima con 0,2 de sobra. */
  { n: 'plata', d: 1, pon(P, x){
      P.bloque(x + 6, 1.6, 5, 0.6);
      P.pico(x + 7); P.pico(x + 9);
      P.moneda(x + 8.5, 3.4);
    } },
  /* ── EL HUECO SE MIDE CONTRA EL SALTO, NO SE ELIGE ──
     El salto mide 4,00 bloques exactos. Para pararse en el labio la caja tiene
     que solaparlo, y para aterrizar tambien: la ventana de despegue mide
     `4,86 − ancho` bloques, y encima hay que restarle los 0,34 que la caja baja
     en un paso, porque aterrizar con menos solape que eso se resuelve como
     choque de costado, o sea muerte. Con 4,0 de hueco la ventana queda en 0,52
     bloques = 3,7 pasos: injugable. De ahi salen 3,0 · 3,5 · 3,9. */
  { n: 'hueco', d: 1, pon(P, x, dif){ const w = [0, 2.7, 3.0, 3.3][dif];
      P.hueco(x + 6, x + 6 + w); } },
  { n: 'escalera', d: 2, pon(P, x){
      P.bloque(x + 5, 0, 2, 1); P.bloque(x + 8, 0, 2, 2); P.bloque(x + 11, 0, 2, 3);
    } },
  { n: 'sierra', d: 2, pon(P, x){ P.sierra(x + 8, 0.75, 0.85); } },
  /* ── EL PAD Y SU MURO: EL SITIO DEL MURO SALE DEL VUELO, NO SE ELIGE ──
     El pad lanza con raiz de dos veces el impulso, o sea que el apice es el
     doble: 4,8 bloques. Con el muro a 4,6 de alto habia 0,2 de margen y el
     lanzamiento NO LO CLAREABA — medido, el bot moria ahi en los dos niveles que
     usan el patron. En vueltas de pad, `y = 4h·u(√2−u)`, asi que la bajada cruza
     los 3,0 bloques en u = 1,140, o sea **4,56 bloques despues del pad** — y ese
     numero no depende del tempo, porque `v·T` son siempre 4 bloques. El muro va
     ahi. Y la moneda va en el apice (u = 0,707 → 2,83 bloques), que es el unico
     sitio del vuelo al que se llega. */
  { n: 'pad', d: 2, pon(P, x){
      P.pad(x + 5); P.bloque(x + 9, 0, 1.4, 3.0); P.moneda(x + 7.8, 4.4);
    } },
  { n: 'orbe', d: 2, pon(P, x){ P.hueco(x + 5, x + 12); P.orbe(x + 8, 2.2); } },
  { n: 'muro', d: 3, pon(P, x){ P.bloque(x + 7, 0, 1.2, 2); P.pico(x + 12); } },
  { n: 'sierras2', d: 3, pon(P, x){ P.sierra(x + 5, 0.75, 0.8); P.sierra(x + 12, 0.75, 0.8); } }
];

/* ── LOS TRAMOS DE NAVE ──
   Un pasillo con techo y aperturas. La nave no se apoya en nada, asi que lo unico
   que la mata es el techo, el piso y los bloques: sin techo, «volar» seria subir
   sin limite y el modo no significaria nada. */
function tramoNave(P, x, largo, dif){
  P.techo.push(rect(x, ALTO_PASILLO, largo, 1.4, 'techo'));
  P.sol.push(rect(x, ALTO_PASILLO, largo, 1.4, 'techo'));
  /* ── LA PRIMERA PARED VA A OCHO BLOQUES Y NO A SEIS ──
     La nave entra pegada al piso y tiene que trepar hasta el hueco: con la pared
     a seis bloques son medio segundo para subir hasta cuatro, contando la
     aceleracion, y eso no alcanza. */
  const n = Math.floor((largo - 8)/8);
  for (let i = 0; i < n; i++){
    const bx = x + 8 + i*8;
    /* una pared de arriba y una de abajo, dejando un hueco de tres bloques: con
       menos de tres la nave no pasa ni con la trayectoria perfecta */
    const hueco = 3.4 + (3 - dif)*0.5;
    const abajo = azr(0.6, Math.max(0.9, ALTO_PASILLO - 0.4 - hueco));
    P.bloque(bx, 0, 1.2, abajo);
    P.bloque(bx, abajo + hueco, 1.2, ALTO_PASILLO - (abajo + hueco));
  }
}

function generaNivel(id, semilla){
  const N = NIVELES[id];
  sem((semilla || 1)*7919 + id*104729 + 11);
  const M = MUNDO;
  M.nivel = id; M.med = medidasDe(N.bpm);
  M.sol.length = 0; M.mat.length = 0; M.pads.length = 0; M.orbes.length = 0;
  M.portales.length = 0; M.monedas.length = 0; M.sierras.length = 0; M.techo.length = 0;
  M.largo = N.compases*16;

  /* la caja de herramientas que los patrones usan. Va como metodos y no como
     funciones sueltas para que un patron no pueda escribir en otra cosa. */
  const huecos = [];
  const P = {
    sol: M.sol, techo: M.techo,
    pico(x){ M.mat.push(rect(x + 0.18, 0, 0.64, 0.82, 'pico')); },
    bloque(x, y, w, h){ M.sol.push(rect(x, y, w, h, 'bloque')); },
    sierra(x, y, r){ M.sierras.push({ x, y, r });
                     M.mat.push(rect(x - r*0.66, y - r*0.66, r*1.32, r*1.32, 'sierra')); },
    pad(x){ M.pads.push({ x, y: 0 }); },
    orbe(x, y){ M.orbes.push({ x, y, usado: false }); },
    moneda(x, y){ if (M.monedas.length < 3) M.monedas.push({ x, y, tomada: false }); },
    hueco(a, b){ huecos.push([a, b]); }
  };

  /* ── EL PRIMER COMPAS Y EL ULTIMO VAN VACIOS ──
     Aparecer al lado de un pico no es dificultad, es una emboscada; y terminar
     justo sobre un obstaculo convierte el 99 % en una loteria. */
  const compases = N.compases;
  const usables = PATRONES.filter(p => p.d <= N.dif);
  const conNave = N.modos.indexOf('nave') >= 0;
  const conGrav = N.modos.indexOf('gravedad') >= 0;
  let c = 2;
  while (c < compases - 2){
    const x = c*16;
    /* ── LOS TRAMOS ESPECIALES SE ANUNCIAN CON UN PORTAL Y OCUPAN COMPASES ENTEROS ──
       A mitad de compas, el cambio de modo cae en contratiempo y se lee a error. */
    if (conNave && c > 5 && c % 9 === 0 && c + 4 < compases - 2){
      M.portales.push({ x: x + 1, t: 'nave' });
      tramoNave(P, x, 64, N.dif);
      M.portales.push({ x: x + 62, t: 'cubo' });
      c += 4; continue;
    }
    if (conGrav && c > 3 && c % 7 === 0 && c + 3 < compases - 2){
      M.portales.push({ x: x + 1, t: 'grav' });
      M.techo.push(rect(x, ALTO_GRAV, 48, 1.2, 'techo'));
      M.sol.push(rect(x, ALTO_GRAV, 48, 1.2, 'techo'));
      /* los picos del tramo invertido cuelgan del techo */
      for (let k = 0; k < 3; k++){
        const bx = x + 6 + k*16;
        M.mat.push(rect(bx + 0.18, ALTO_GRAV - 0.82, 0.64, 0.82, 'picoInv'));
      }
      M.portales.push({ x: x + 46, t: 'norm' });
      c += 3; continue;
    }
    const pat = usables[azi(0, usables.length - 1)];
    pat.pon(P, x, N.dif);
    c++;
  }

  /* ── EL PISO SE ARMA AL FINAL, DESCONTANDO LOS HUECOS ──
     Al revés —piso entero y después agujerearlo— habría que partir rectángulos
     que ya existen, y eso deja bordes duplicados que el choque resuelve dos veces. */
  huecos.sort((a, b) => a[0] - b[0]);
  let px = -20;
  for (const [a, b] of huecos){
    if (a > px) M.sol.push(rect(px, -6, a - px, 6, 'piso'));
    px = Math.max(px, b);
  }
  M.sol.push(rect(px, -6, M.largo + 40 - px, 6, 'piso'));
  /* la pared del final: no se puede pasar de largo */
  M.sol.push(rect(M.largo + 2, -6, 4, 30, 'meta'));
  indexaMundo();
  M.rev++;
  return M;
}

/* ── EL SITIO EN BLOQUES DE UN TIEMPO DE COMPAS, Y AL REVES ──
   Estas dos son la juntura entre la musica y el nivel, y por eso viven en un
   solo sitio: con la cuenta escrita en dos lados, el dia que cambie
   `BLOQ_POR_TIEMPO` una de las dos queda apuntando a otro juego. */
const xDeTiempo = (t) => t*BLOQ_POR_TIEMPO;
const tiempoDeX = (x) => x/BLOQ_POR_TIEMPO;

/* ══════════ EL INDICE POR BLOQUE ══════════
   Sin esto el choque recorre los ~250 rectangulos del nivel en CADA paso, y el
   auto-jugador da varios miles de pasos por rama: validar tres niveles pasaria
   de segundos a minutos. Cada balde `i` guarda lo que se solapa con [i-1, i+2),
   asi que consultando por el bloque del jugador no hace falta mirar los vecinos.
   EL DESPLAZAMIENTO NO ES DECORATIVO: el piso arranca en x = -20 y la meta
   termina en largo+6, asi que sin corrimiento los indices negativos se recortan
   a cero y el primer bloque del nivel se consulta en el balde equivocado. */
const IDX_OFS = 26;
const VACIO = [];
function indexaLista(lista, largo){
  const idx = new Array(largo + IDX_OFS*2);
  for (const r of lista){
    const a = cl(Math.floor(r.x) - 1 + IDX_OFS, 0, idx.length - 1);
    const b = cl(Math.ceil(r.x + r.w) + 1 + IDX_OFS, 0, idx.length - 1);
    for (let i = a; i <= b; i++){ (idx[i] || (idx[i] = [])).push(r); }
  }
  for (let i = 0; i < idx.length; i++) if (!idx[i]) idx[i] = VACIO;
  return idx;
}
function cerca(idx, x){
  const i = Math.floor(x) + IDX_OFS;
  return (i >= 0 && i < idx.length) ? idx[i] : VACIO;
}
function indexaMundo(){
  MUNDO.iSol = indexaLista(MUNDO.sol, MUNDO.largo + 40);
  MUNDO.iMat = indexaLista(MUNDO.mat, MUNDO.largo + 40);
}

/* ══════════════════════ EL JUGADOR Y LOS MODOS ══════════════════════
   ── LA X NO SE INTEGRA: SALE DEL RELOJ DE LA MUSICA ──
   `x = tiempoMusical · 4 bloques`. Integrando la x con la fisica, una tanda de
   cuadros perdidos correria el nivel respecto del tema y el juego dejaria de
   estar en tiempo — que es el unico defecto que este genero no se puede permitir.
   Lo que si se integra es la Y, que es lo que el jugador controla.

   ── Y ES UN CUERPO CUALQUIERA, NO `J` ──
   Asi el auto-jugador puede PROBAR un salto antes de darlo: copia el estado, lo
   vuela un tiempo y mira si sobrevive. Con la fisica atada al jugador de verdad
   habria que escribir una segunda fisica para el bot, y entonces el bot estaria
   jugando otro juego. */
const JUG = { x: 0, y: 0, vy: 0, grav: 1, modo: 'cubo', piso: false,
              vivo: true, giro: 0, apretado: false };

function jugPone(c, x){
  c.x = x; c.y = 0; c.vy = 0; c.grav = 1; c.modo = 'cubo';
  c.piso = true; c.vivo = true; c.giro = 0; c.apretado = false;
}

/* la caja del jugador: un poco mas chica que su celda, que es lo que hace que
   pasar raspando un pico se sienta a pasar raspando y no a morir de casualidad */
function caja(c){
  const h = JUG_LADO;
  return { x: c.x - h/2, y: c.y, w: h, h: h };
}
const pisa = (A, B) => A.x < B.x + B.w && A.x + A.w > B.x && A.y < B.y + B.h && A.y + A.h > B.y;

/* ── EL CHOQUE RESUELVE PRIMERO LA Y Y DESPUES PREGUNTA POR LA X ──
   Es la regla del genero: por arriba se apoya, de costado se muere. Con la X
   resuelta primero, el cubo trepa las paredes y el juego se vuelve trivial. */
function chocaCuerpo(c, med, dt){
  /* ── CAERSE DEL MUNDO MATA, Y ESO NO ERA OBVIO ──
     Medido: sin plano de muerte, caer en un hueco no mata a nadie — la y se va a
     −7753 y el jugador SIGUE avanzando por debajo del nivel hasta la meta. O sea
     que el bot que apretaba al azar terminaba los tres temas al 100 %, que es la
     firma exacta de un juego en el que nada importa. Con el plano, el hueco pasa
     a ser el unico obstaculo que castiga apretar sin parar. */
  if (c.y < -3 || c.y > 20){ c.vivo = false; return; }
  c.piso = false;
  const b = caja(c);
  for (const r of cerca(MUNDO.iSol, c.x)){
    if (!pisa(b, r)) continue;
    const dArriba = (r.y + r.h) - b.y;          /* cuanto entro por abajo */
    const dAbajo = (b.y + b.h) - r.y;           /* cuanto entro por arriba */
    const dIzq = (b.x + b.w) - r.x;
    const dDer = (r.x + r.w) - b.x;
    const vert = Math.min(dArriba, dAbajo), hor = Math.min(dIzq, dDer);
    /* ── EL EJE DE MENOR PENETRACION ES EL UNICO QUE NO SE EQUIVOCA ──
       Es la misma regla que en CASTILLO y en PISTOLA. Con la normal sacada de
       centro a centro, un cubo medio metido en una losa se resuelve HACIA ADENTRO. */
    if (vert <= hor + 0.02){
      if (dArriba < dAbajo){
        /* apoyado sobre la cara de arriba del solido */
        if (c.vy <= 0.001 || c.grav > 0){ c.y = r.y + r.h; c.vy = 0; if (c.grav > 0) c.piso = true; }
        else { c.y = r.y + r.h; c.vy = 0; }
      } else {
        c.y = r.y - b.h; c.vy = 0; if (c.grav < 0) c.piso = true;
      }
      b.y = c.y;
    } else {
      /* entro de costado: en este genero eso es morirse */
      c.vivo = false; return;
    }
  }
  for (const r of cerca(MUNDO.iMat, c.x)) if (pisa(caja(c), r)){ c.vivo = false; return; }
}

/* ── UN PASO DE FISICA ──
   Paso fijo: un telefono a 30 y una notebook a 144 tienen que jugar el mismo
   juego, si no el salto mide distinto y los patrones dejan de servir. */
function pasoCuerpo(c, med, dt, apretado){
  c.apretado = !!apretado;
  if (c.modo === 'nave'){
    /* la nave: mantener acelera hacia arriba y soltar hacia abajo. Lo que se
       controla es la CURVA, no la velocidad — con velocidad directa se lee a
       ascensor y deja de haber inercia que administrar. */
    c.vy += (apretado ? med.naveA : -med.naveA)*dt*c.grav;
    c.vy = cl(c.vy, -med.naveMax, med.naveMax);
    c.giro = cl(c.vy/med.naveMax, -1, 1)*0.5;
  } else {
    /* ── MANTENER APRETADO SALTA EN CADENA, Y VA ACA Y NO EN EL DEDO ──
       Es la regla del genero, y ponerlo dentro del paso de fisica es lo que hace
       que el jugador y el bot usen EL MISMO camino. Estaba solo en el manejador
       del toque, o sea que `avanza()` no saltaba nunca: medido, el bot que
       apretaba en cada paso moria en el mismo pico y en la misma x (39,8) que el
       que no apretaba nunca — la firma exacta de una entrada que no hace nada. */
    if (apretado) intentaSalto(c, med);
    c.vy -= med.g*dt*c.grav;
    /* el cubo gira mientras esta en el aire y se endereza al caer: es lo unico
       que dice, sin texto, que el cubo no controla nada mientras vuela */
    if (!c.piso) c.giro += med.v*dt*0.42*c.grav;
    else c.giro = Math.round(c.giro/(Math.PI/2))*(Math.PI/2);
  }
  c.y += c.vy*dt;
  chocaCuerpo(c, med, dt);
  if (!c.vivo) return;

  /* ── EL PAD LANZA SIN QUE HAYA QUE TOCAR; EL ORBE HAY QUE TOCARLO ──
     Es la diferencia del genero y hay que respetarla: el pad es geometria, el
     orbe es una decision. */
  const b = caja(c);
  for (const p of MUNDO.pads){
    if (Math.abs(p.x + 0.5 - c.x) < 0.75 && Math.abs(c.y - p.y) < 0.5 && c.grav > 0){
      c.vy = med.impPad*c.grav; c.piso = false;
      if (c === JUG) son('pad');
    }
  }
  for (const o of MUNDO.orbes){
    if (o.usado || !apretado) continue;
    if (Math.abs(o.x - c.x) < 0.95 && Math.abs(o.y - (c.y + 0.43)) < 0.95){
      c.vy = med.imp*c.grav; o.usado = true;
      if (c === JUG) son('salta');
    }
  }
  for (const p of MUNDO.portales){
    if (Math.abs(p.x - c.x) > 0.55) continue;
    if (p.t === 'grav' && c.grav > 0){ c.grav = -1; c.vy = 0; if (c === JUG) son('portal'); }
    else if (p.t === 'norm' && c.grav < 0){ c.grav = 1; c.vy = 0; if (c === JUG) son('portal'); }
    else if (p.t === 'nave' && c.modo !== 'nave'){ c.modo = 'nave'; if (c === JUG) son('portal'); }
    else if (p.t === 'cubo' && c.modo !== 'cubo'){ c.modo = 'cubo'; if (c === JUG) son('portal'); }
  }
}

/* ── SALTAR ES UNA SOLA FUNCION, Y LA LLAMAN EL DEDO Y EL BOT ──
   Con dos caminos, el dia que el salto cambie el bot estaria midiendo otro
   juego. Y en el cubo solo se puede saltar DESDE EL PISO, que es la regla del
   genero: mantener apretado salta en cadena porque el toque queda pedido. */
function intentaSalto(c, med){
  if (c.modo === 'nave') return false;
  if (!c.piso) return false;
  c.vy = med.imp*c.grav; c.piso = false;
  if (c === JUG) son('salta');
  return true;
}

/* ══════════════════════════ EL DIBUJO, EN 3D ══════════════════════════
   ── LA JUGABILIDAD SIGUE SIENDO DEL PLANO XY, Y ESO NO ES UNA CONCESION ──
   El genero ES de dos ejes: se avanza y se salta, y nada mas. Lo que pasa a ser
   tridimensional es el MUNDO — los bloques se extruyen, el cubo tumbea de verdad,
   hay luz, sombra de contacto y perspectiva. Meter el juego en tres ejes seria
   otro juego, no este mejor dibujado.

   ── LA CAMARA MIRA DERECHO POR −Z, Y ESA ES LA DECISION QUE SOSTIENE TODO ──
   Con la camara inclinada, la proyeccion deja de ser lineal y la x de un pico en
   pantalla depende de su altura: en un juego donde hay que despegar en un bloque
   exacto, eso es injugable. Mirando derecho, x e y son EXACTAMENTE lineales sobre
   el plano de juego, y el volumen igual se lee: la camara va a la altura del
   medio de la banda visible, o sea POR ENCIMA de los bloques bajos, asi que se
   les ve la cara de arriba. Es el mismo encuadre de cualquier 2,5D.

   ── Y TODO COMPARTE EL PLANO z = 0 POR DELANTE ──
   Los solidos se extruyen hacia ATRAS (z de −PROF a 0) y el jugador tambien
   (z de −0,86 a 0). Si el cubo asomara hacia la camara, la perspectiva lo
   agrandaria un 4,5 % y con el a un 30 % del ancho eso lo correria 0,18 bloques
   respecto de los picos: se veria desalineado justo donde hay que medir. */

const cv = $('cv');
let ANCHO = 0, ALTO = 0, ESC = 1, U = 20;   /* U = pixeles por bloque, para las sondas */
const PROF = 1.6;                            /* cuanto se extruyen los solidos */
/* ── EL PISO SE EXTRUYE CUARENTA Y SEIS BLOQUES Y NO 1,6 ──
   Con la camara a 2,77 de alto, una superficie horizontal de 1,6 de fondo se ve
   como una FRANJA de dos centimetros y por encima aparece cielo a la altura del
   suelo: medido en la foto, el piso era una banda y arriba de ella el horizonte
   estaba roto. Extruido hasta la niebla, el suelo se pierde en el fondo y eso es
   justamente lo que hace que la escena se lea a profunda. */
const PROF_PISO = 46;
const FOV_Y = 50;

const ren = new T.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
ren.setClearColor(0x05060a, 1);
ren.outputColorSpace = T.SRGBColorSpace;
ren.toneMapping = T.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.15;
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;
ren.info.autoReset = false;

const esc3 = new T.Scene();
const cam = new T.PerspectiveCamera(FOV_Y, 2, 0.1, 260);
/* mira derecho por −Z: sin rotacion, y por eso la proyeccion es lineal */
esc3.add(cam);

/* ══════════ LA LUZ ══════════
   Una direccional con sombra —que es lo unico que apoya al cubo sobre el piso— y
   un hemisferico que le pone color al ambiente. Y el hemisferico NO puede tener
   el suelo negro: una cara que no mira al cielo recibiria cero, que es lo que en
   ECO dejo un ovalo malva plano y en BARRIO las casas en silueta. */
/* ── LA SOMBRA ES UNA PISTA, NO UN AGUJERO ──
   Con la direccional a 2,1 y poco ambiente, la zona sombreada quedaba casi negra
   y en el pasillo de la nave las sombras de las paredes de arriba se leian a
   manchones sueltos sobre el piso. Bajando la direccional y subiendo el ambiente,
   una sombra oscurece a la mitad en vez de borrar: la de contacto del cubo se
   sigue viendo —que es la que importa— y las otras pasan a ser un matiz. */
const sol = new T.DirectionalLight(0xffffff, 1.45);
sol.position.set(7, 12, 9);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
sol.shadow.camera.near = 1; sol.shadow.camera.far = 60;
sol.shadow.bias = -0.0012; sol.shadow.normalBias = 0.03;
esc3.add(sol);
esc3.add(sol.target);
const hemi = new T.HemisphereLight(0x9fc8ff, 0x2a2f3d, 0.70);
esc3.add(hemi);
/* ── Y UN AMBIENTE PARO, QUE HACE FALTA POR UNA RAZON DE JUEGO ──
   En gravedad invertida se camina sobre la CARA DE ABAJO del techo, y una cara
   que mira al piso no recibe nada de una direccional de arriba: sin ambiente,
   la superficie que hay que pisar sale negra. */
const amb = new T.AmbientLight(0x4a5570, 0.95);
esc3.add(amb);
/* la niebla es densa a proposito: es lo que come el borde lejano del suelo. En el
   plano de juego (z ~ 0) no tiñe nada; a 46 bloques se lleva mas de la mitad. */
const NIEBLA = new T.FogExp2(0x101c30, 0.020);
esc3.fog = NIEBLA;

/* ══════════ LOS MATERIALES ══════════
   Uno por familia y no uno por objeto: cada material es un programa compilado y
   una llamada de dibujo. El color del tema se reescribe al cambiar de nivel. */
const matSol  = new T.MeshLambertMaterial({ color: 0x171e2d });
const matPiso = new T.MeshLambertMaterial({ color: 0x2a3448 });
const matCanto = new T.MeshBasicMaterial({ color: 0x2de2a8 });
const matPico = new T.MeshLambertMaterial({ color: 0xeef4ff, emissive: 0x7f8fa6, emissiveIntensity: 0.35 });
const matPad  = new T.MeshBasicMaterial({ color: 0xffd447 });
const matOrbe = new T.MeshBasicMaterial({ color: 0xffd447 });
const matSierra = new T.MeshLambertMaterial({ color: 0xdfe7f2, emissive: 0x445064, emissiveIntensity: 0.4 });
const matMoneda = new T.MeshLambertMaterial({ color: 0xffd447, emissive: 0x8a6a10, emissiveIntensity: 0.7 });
const matFondo = new T.MeshBasicMaterial({ color: 0x2de2a8, transparent: true, opacity: 0.055,
                                           depthWrite: false });
/* ── EL FALDON DEL SUELO VA SIN LUZ, Y ESA ES LA RAZON DE QUE EXISTA ──
   La cara de adelante del piso, con Lambert y una luz casi vertical, medida en la
   captura daba (1, 3, 7): negra. Son ochenta y cinco pixeles de los 412 —el 21 %
   de la pantalla— sin un solo dato. Un material SIN LUZ no depende del angulo ni
   de la sombra y no puede salir negro; el degradado vertical le da el aire de
   estar iluminado desde arriba, que es lo que hace que se lea a canto de terreno. */
function lienzoFaldon(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, '#8a8a8a'); gr.addColorStop(1, '#1d1d1d');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const matFaldon = new T.MeshBasicMaterial({ map: lienzoFaldon(), color: 0x3d4a63 });

const GEO = {
  caja: new T.BoxGeometry(1, 1, 1),
  /* el pico es una piramide de cuatro caras: `ConeGeometry` con cuatro lados */
  pico: new T.ConeGeometry(0.72, 1, 4, 1),
  esfera: new T.SphereGeometry(0.5, 14, 10),
  aro: new T.TorusGeometry(0.40, 0.09, 8, 18),
  sierra: new T.CylinderGeometry(0.5, 0.5, 0.28, 12),
  part: new T.BoxGeometry(1, 1, 1)
};

/* ══════════ EL CIELO Y LA REJA ══════════
   El cielo va PEGADO A LA CAMARA, asi que no tiene paralaje: es un telon. La reja
   va PLANTADA EN EL MUNDO a z = −28 y su paralaje sale de la perspectiva, gratis
   y sin un solo numero que mantener — que es justo lo que en 2D habia que escribir
   a mano con un factor 0,5. */
function lienzoCielo(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 128);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#3b3b3b');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 128);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const matCielo = new T.MeshBasicMaterial({ map: lienzoCielo(), depthWrite: false, fog: false });
const cielo = new T.Mesh(new T.PlaneGeometry(1, 1), matCielo);
cielo.renderOrder = -10; cielo.frustumCulled = false;
cam.add(cielo);

function lienzoReja(){
  const n = 128, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, n, n);
  g.strokeStyle = '#ffffff'; g.lineWidth = 2;
  g.strokeRect(0.5, 0.5, n - 1, n - 1);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
}
const texReja = lienzoReja();
const matReja = new T.MeshBasicMaterial({ map: texReja, color: 0x2de2a8, transparent: true,
                                          opacity: 0.16, depthWrite: false, alphaMap: texReja });
const reja = new T.Mesh(new T.PlaneGeometry(1400, 240), matReja);
reja.position.set(600, 60, -56);
texReja.repeat.set(1400/4, 240/4);          /* una celda cada cuatro bloques: la grilla del compas */
esc3.add(reja);

/* las formas grandes del fondo: instanciadas y PLANTADAS, asi que su paralaje es
   el de verdad. La forma sale de la POSICION y no de un azar por cuadro. */
const fondo = new T.InstancedMesh(new T.PlaneGeometry(1, 1), matFondo, 240);
fondo.frustumCulled = false; fondo.castShadow = false; fondo.receiveShadow = false;
esc3.add(fondo);

/* ══════════ LAS MALLAS DEL NIVEL ══════════
   Se rearman cuando cambia el nivel, y el disparador es una REVISION que
   `generaNivel` incrementa: con una llamada explicita, el dia que se agregue un
   camino que genere un nivel (el demo del menu, una sonda) se olvida y se dibuja
   el nivel anterior. */
let REV3D = -1;
const INST = { sol: null, piso: null, canto: null, pico: null, pad: null, orbe: null,
               faldon: null };
const SUELTOS = [];                          /* sierras, monedas y portales */

function tiraInst(k){
  if (INST[k]){ esc3.remove(INST[k]); INST[k].dispose(); INST[k] = null; }
}
function nuevaInst(k, geo, mat, n, sombra){
  tiraInst(k);
  if (!n) return null;
  const m = new T.InstancedMesh(geo, mat, n);
  m.frustumCulled = false;
  m.castShadow = !!sombra; m.receiveShadow = !!sombra;
  esc3.add(m); INST[k] = m; return m;
}

const _m4 = new T.Matrix4(), _q = new T.Quaternion(), _v = new T.Vector3(), _e = new T.Euler();
function ponCaja(malla, i, x, y, w, h, z, d){
  _m4.compose(new T.Vector3(x + w/2, y + h/2, (z == null ? -PROF/2 : z)),
              _q.identity(), new T.Vector3(w, h, d == null ? PROF : d));
  malla.setMatrixAt(i, _m4);
}

function mundo3D(){
  const N = NIVELES[MUNDO.nivel];
  ponPaleta(N);

  /* los solidos van en DOS mallas —el piso y el resto— porque son dos colores y
     un `InstancedMesh` tiene un solo material */
  const pisos = MUNDO.sol.filter(r => r.t === 'piso' || r.t === 'techo');
  const cajas = MUNDO.sol.filter(r => r.t !== 'piso' && r.t !== 'techo');
  /* ── EL PISO RECIBE SOMBRA PERO NO LA PROYECTA ──
     Es una losa de cuarenta y seis bloques de fondo: proyectando, el techo del
     pasillo de la nave sombrea el suelo ENTERO y lo que aparece son manchones
     oscuros con el borde del mapa de sombra dibujado. Medido en la foto del
     tramo de nave, tres manchas en el medio del pasillo. Proyectan los bloques y
     el jugador, que son lo que hay que poder apoyar. */
  const mp = nuevaInst('piso', GEO.caja, matPiso, pisos.length, false);
  mp.receiveShadow = true;
  pisos.forEach((r, i) => ponCaja(mp, i, r.x, r.y, r.w, r.h, -PROF_PISO/2, PROF_PISO));
  mp.instanceMatrix.needsUpdate = true;

  /* el faldon: un plano por delante de la cara de adelante de cada piso */
  const mf = nuevaInst('faldon', new T.PlaneGeometry(1, 1), matFaldon, pisos.length, false);
  pisos.forEach((r, i) => {
    _m4.compose(new T.Vector3(r.x + r.w/2, r.y + r.h/2, 0.012), _q.identity(),
                new T.Vector3(r.w, r.h, 1));
    mf.setMatrixAt(i, _m4);
  });
  mf.instanceMatrix.needsUpdate = true;

  const mc = nuevaInst('sol', GEO.caja, matSol, cajas.length, true);
  cajas.forEach((r, i) => ponCaja(mc, i, r.x, r.y, r.w, r.h));
  if (mc) mc.instanceMatrix.needsUpdate = true;

  /* ── EL CANTO LUMINOSO VA EN LA CARA EN LA QUE SE APOYA ──
     Arriba en el piso y los bloques; ABAJO en un techo, porque ahi se apoya por
     debajo. Dibujado siempre arriba, el techo del tramo de gravedad invertida
     quedaba con su linea del lado que no se ve y el cubo colgaba de la nada. */
/* ── Y ES UN LABIO EN EL CANTO DE ADELANTE, NO UNA TAPA ──
     Cubriendo el fondo entero, lo que se ve desde arriba es una SUPERFICIE
     luminosa de bloque y medio: medido en la foto, el suelo salia como una losa
     de menta y el juego se leia a plataforma de otro color. El labio se ve de
     frente y de refilon, y la cara de arriba queda oscura, que es como se lee un
     borde encendido. */
  const gr = 0.14, lab = 0.22;
  const mk = nuevaInst('canto', GEO.caja, matCanto, MUNDO.sol.length, false);
  MUNDO.sol.forEach((r, i) => {
    const arriba = r.t !== 'techo';
    ponCaja(mk, i, r.x, arriba ? r.y + r.h - gr : r.y, r.w, gr, 0.01, lab);
  });
  mk.instanceMatrix.needsUpdate = true;

  /* los picos: una piramide, y los invertidos son la misma girada media vuelta */
  const picos = MUNDO.mat.filter(r => r.t === 'pico' || r.t === 'picoInv');
  const mi = nuevaInst('pico', GEO.pico, matPico, picos.length, true);
  picos.forEach((r, i) => {
    const inv = r.t === 'picoInv';
    _e.set(0, Math.PI/4, inv ? Math.PI : 0);
    _m4.compose(new T.Vector3(r.x + r.w/2, r.y + r.h/2, -PROF/2),
                _q.setFromEuler(_e), new T.Vector3(1, r.h, 1));
    mi.setMatrixAt(i, _m4);
  });
  if (mi) mi.instanceMatrix.needsUpdate = true;

  const mpa = nuevaInst('pad', GEO.caja, matPad, MUNDO.pads.length, false);
  MUNDO.pads.forEach((p, i) => ponCaja(mpa, i, p.x, p.y + 0.02, 1, 0.20, -PROF/2, PROF*0.8));
  if (mpa) mpa.instanceMatrix.needsUpdate = true;

  const mo = nuevaInst('orbe', GEO.aro, matOrbe, MUNDO.orbes.length, false);
  MUNDO.orbes.forEach((o, i) => {
    _m4.compose(new T.Vector3(o.x, o.y, -PROF/2 + 0.5), _q.identity(), new T.Vector3(1, 1, 1));
    mo.setMatrixAt(i, _m4);
  });
  if (mo) mo.instanceMatrix.needsUpdate = true;

  /* ── LAS SIERRAS, LAS MONEDAS Y LOS PORTALES VAN SUELTOS ──
     Son pocos —cinco, tres y ocho— y CADA UNO SE MUEVE POR SU CUENTA: girar una
     instancia obliga a reescribir su matriz cada cuadro y a subir el buffer
     entero, que para ocho objetos cuesta mas que ocho llamadas de dibujo. */
  for (const m of SUELTOS) esc3.remove(m);
  SUELTOS.length = 0;
  for (const s of MUNDO.sierras){
    const m = new T.Mesh(GEO.sierra, matSierra);
    m.position.set(s.x, s.y, -PROF/2);
    m.scale.set(s.r*2.1, 1, s.r*2.1);
    m.rotation.x = Math.PI/2;
    m.userData.sierra = s; m.castShadow = true;
    esc3.add(m); SUELTOS.push(m);
  }
  for (const c of MUNDO.monedas){
    const m = new T.Mesh(GEO.aro, matMoneda);
    m.position.set(c.x, c.y, -PROF/2 + 0.5);
    m.scale.setScalar(0.95);
    m.userData.moneda = c;
    esc3.add(m); SUELTOS.push(m);
  }
  for (const p of MUNDO.portales){
    const col = p.t === 'grav' ? 0xffd447 : p.t === 'norm' ? 0x5ad9ff
              : p.t === 'nave' ? 0xff6ad5 : 0x2de2a8;
    const mat = new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55 });
    const m = new T.Mesh(GEO.caja, mat);
    m.position.set(p.x, 5.2, -PROF/2);
    m.scale.set(0.30, 11.5, PROF*1.1);
    m.userData.portal = p;
    esc3.add(m); SUELTOS.push(m);
  }

  /* las formas del fondo, plantadas a lo largo del nivel */
  let k = 0;
  for (let bx = -20; bx < MUNDO.largo + 30 && k < 240; bx += 9){
    const h = ((bx*2654435761) >>> 0)/4294967296;
    const S = 3.0 + h*4.0;
    _e.set(0, 0, h < 0.45 ? Math.PI/4 : 0);
    /* van DETRAS del suelo y por encima del horizonte: metidas mas cerca se
       cruzaban con el plano del piso y aparecian como recortes */
    _m4.compose(new T.Vector3(bx + h*6, 4 + h*13, -50 - h*8),
                _q.setFromEuler(_e),
                new T.Vector3(h < 0.78 ? S*2.4 : S*1.2, S*(h < 0.78 ? 2.4 : 5.0), 1));
    fondo.setMatrixAt(k++, _m4);
  }
  fondo.count = k;
  fondo.instanceMatrix.needsUpdate = true;

  REV3D = MUNDO.rev;
}

/* ══════════ LA PALETA ══════════
   Los materiales son compartidos, asi que cambiar de nivel es reescribir seis
   colores y no reconstruir nada. */
const _c = new T.Color();
function ponPaleta(N){
  const c1 = N.col, c2 = N.col2;
  const a = (v) => (v[0] << 16) | (v[1] << 8) | v[2];
  matCanto.color.setHex(a(c2));
  matReja.color.setHex(a(c2));
  matFondo.color.setHex(a(c2));
  matPad.color.setHex(0xffd447);
  /* el cielo se tinta con el color del nivel, y el degradado ya trae la forma */
  matCielo.color.setHex(a(c1)).multiplyScalar(1);
  matCielo.color.multiplyScalar(2.2);
  /* el bloque NO se deriva del fondo: en el nivel 3, que es casi negro, un
     multiplicador del color del tema daba exactamente el color del cielo y los
     muros del pasillo se veian como rayas flotando */
  matSol.color.setHex(0x171e2d);
  matPiso.color.setHex(0x2a3448);
  matFaldon.color.setHex(a(c1)).multiplyScalar(1.0).lerp(_c.setHex(0x3d4a63), 0.55);
  hemi.color.setHex(a(c2)); hemi.groundColor.setHex(a(c1));
  /* la niebla se crea UNA vez: pasar de sin-niebla a con-niebla obliga a
     recompilar todos los shaders, y hacerlo al cambiar de nivel seria un tiron
     justo en el primer cuadro de la partida */
  NIEBLA.color.setHex(a(c1));
  sol.color.setHex(0xffffff);
}

/* ══════════ EL JUGADOR ══════════
   Se rearma al cambiar el icono, no cada cuadro. Y es EL MISMO objeto que se ve
   en el demo del menu, asi que el icono que se elige es el que se juega — no hay
   una segunda vista previa que pueda decir otra cosa. */
const FORMAS = ['cubo', 'diamante', 'redondo'];
const COLES = ['#2de2a8', '#5ad9ff', '#ffd447', '#ff6ad5', '#ff7a4a', '#b07aff'];
const ICONO = { forma: 0, c1: 0, c2: 1 };

const gJug = new T.Group();
esc3.add(gJug);
const matJugA = new T.MeshLambertMaterial({ color: 0x2de2a8, emissive: 0x0e5a44, emissiveIntensity: 0.55 });
const matJugB = new T.MeshBasicMaterial({ color: 0x5ad9ff });
let jugCuerpo = null;

function ponIcono(){
  while (gJug.children.length) gJug.remove(gJug.children[0]);
  matJugA.color.set(COLES[ICONO.c1]);
  matJugA.emissive.set(COLES[ICONO.c1]).multiplyScalar(0.30);
  matJugB.color.set(COLES[ICONO.c2]);
  const nave = JUG.modo === 'nave';
  const g = new T.Group();
  if (nave){
    const cu = new T.Mesh(new T.ConeGeometry(0.44, 1.05, 12), matJugA);
    cu.rotation.z = -Math.PI/2; cu.castShadow = true;
    g.add(cu);
    const ca = new T.Mesh(GEO.esfera, matJugB);
    ca.scale.setScalar(0.42); ca.position.set(-0.08, 0, 0.30);
    g.add(ca);
  } else if (FORMAS[ICONO.forma] === 'diamante'){
    const cu = new T.Mesh(new T.OctahedronGeometry(0.62), matJugA);
    cu.castShadow = true; g.add(cu);
    const nu = new T.Mesh(new T.OctahedronGeometry(0.30), matJugB);
    nu.position.z = 0.42; g.add(nu);
  } else if (FORMAS[ICONO.forma] === 'redondo'){
    const cu = new T.Mesh(GEO.esfera, matJugA);
    cu.scale.setScalar(JUG_LADO*1.08); cu.castShadow = true; g.add(cu);
    const nu = new T.Mesh(GEO.esfera, matJugB);
    nu.scale.setScalar(JUG_LADO*0.46); nu.position.z = 0.34; g.add(nu);
  } else {
    const cu = new T.Mesh(GEO.caja, matJugA);
    cu.scale.setScalar(JUG_LADO); cu.castShadow = true; g.add(cu);
    const nu = new T.Mesh(GEO.caja, matJugB);
    nu.scale.set(JUG_LADO*0.44, JUG_LADO*0.44, JUG_LADO*0.44);
    nu.position.z = JUG_LADO*0.36; g.add(nu);
  }
  jugCuerpo = g;
  gJug.add(g);
}

/* ══════════ LAS PARTICULAS ══════════
   Una sola malla instanciada con el tope de la calidad: las que no se usan van a
   escala cero, que cuesta una matriz y ni una llamada de dibujo. */
const PART = [];
const PART_TOPE = 160;
const matPart = new T.MeshBasicMaterial({ color: 0xffffff });
const mPart = new T.InstancedMesh(GEO.part, matPart, PART_TOPE);
mPart.frustumCulled = false;
mPart.instanceColor = new T.InstancedBufferAttribute(new Float32Array(PART_TOPE*3), 3);
esc3.add(mPart);

function chispas(x, y, n, c){
  const tope = Math.min(PART_TOPE, CALIDADES[CALIDAD].part);
  for (let i = 0; i < n && PART.length < tope; i++){
    const a = Math.random()*6.2832, v = 2 + Math.random()*9;
    PART.push({ x, y, z: -PROF/2 + Math.random()*1.2, vx: Math.cos(a)*v, vy: Math.sin(a)*v,
                t: 0.25 + Math.random()*0.35, t0: 0.6, s: 0.10 + Math.random()*0.20, c });
  }
}
function pasoPart(dt){
  for (let i = PART.length - 1; i >= 0; i--){
    const p = PART[i];
    p.t -= dt; if (p.t <= 0){ PART.splice(i, 1); continue; }
    p.vy -= 26*dt; p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ══════════ EL TAMANO ══════════ */
function mide(){
  /* ── EL MARCO SE GIRA SI LA PANTALLA ES VERTICAL ──
     Y adentro va todo, asi que el HUD y los menus quedan alineados por
     construccion. En una pantalla apaisada no se gira nada. */
  const W = innerWidth, H = innerHeight;
  const vert = H > W;
  const m = $('marco');
  const aw = vert ? H : W, ah = vert ? W : H;
  m.className = vert ? 'girado' : 'derecho';
  m.style.width = aw + 'px'; m.style.height = ah + 'px';
  const q = CALIDADES[CALIDAD].esc;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  ESC = q*dpr;
  ren.setPixelRatio(ESC);
  ren.setSize(aw, ah, false);
  ANCHO = ren.domElement.width; ALTO = ren.domElement.height;
  cam.aspect = aw/ah;
  cam.updateProjectionMatrix();
  U = ANCHO/VISTA_ANCHO;
  /* ── LA DISTANCIA DE LA CAMARA SALE DE UNA CUENTA ──
     Se quieren ver `VISTA_ANCHO` bloques de ancho sobre el plano z = 0:
     `D = (ancho/2) / (aspecto · tan(fov/2))`. Escrita a mano, cambiar el campo o
     la proporcion de pantalla cambiaria cuantos bloques de aviso hay. */
  CAM.d = (VISTA_ANCHO*0.5)/(cam.aspect*Math.tan(FOV_Y*Math.PI/360));
  CAM.alto = VISTA_ANCHO/cam.aspect;
  /* el telon del cielo, pegado a la camara y justo por delante del plano lejano */
  const zc = -200;
  cielo.position.set(0, 0, zc);
  cielo.scale.set(2*Math.abs(zc)*Math.tan(FOV_Y*Math.PI/360)*cam.aspect*1.05,
                  2*Math.abs(zc)*Math.tan(FOV_Y*Math.PI/360)*1.05, 1);
}
addEventListener('resize', mide);

/* ══════════ LA CAMARA ══════════
   `CAM.y` es el CENTRO de la banda visible, no un desplazamiento: con la camara
   mirando derecho, el centro de la banda ES la altura de la camara, asi que la
   cuenta de «el piso al 80 % del alto» sale de una linea. */
const CAM = { x: 0, y: 3, d: 10, alto: 9.2 };
let CAM_OFS = 0.30;
function ponCam(dt){
  CAM.x = JUG.x - VISTA_ANCHO*CAM_OFS;
  const H = CAM.alto*0.5;
  /* ── EN NAVE Y EN GRAVEDAD INVERTIDA SE CENTRA EL PASILLO ──
     Los dos entran enteros en pantalla, asi que seguir al jugador en vertical
     solo hace que las paredes se muevan y cuesten mas de leer. */
  const obj = JUG.modo === 'nave' ? ALTO_PASILLO*0.5
            : JUG.grav < 0 ? ALTO_GRAV*0.5
            /* el piso queda al 80 % del alto: `centro = 0,6·semialto` */
            : cl(H*0.6 + JUG.y*0.20, H*0.6, H*0.6 + 3.2);
  CAM.y += (obj - CAM.y)*Math.min(1, dt*6);
  cam.position.set(CAM.x + VISTA_ANCHO*0.5, CAM.y, CAM.d);
  cam.rotation.set(0, 0, 0);
  /* la caja de sombra sigue al jugador: repartida sobre el nivel entero, la
     sombra de un cubo mediria dos texels y temblaria */
  /* ── LA LUZ VA CASI DE ARRIBA, Y ESO NO ES ESTETICA ──
     Con el foco corrido nueve bloques hacia la camara, la sombra de una pared
     salia larga y hacia atras: en perspectiva se veia DESPEGADA de su pared, y
     en el pasillo de la nave eran cuatro manchones sueltos sobre el piso. A 63
     grados de elevacion la sombra mide medio alto del objeto y queda debajo de
     el, que es lo que la vuelve informacion en vez de ruido. */
  sol.position.set(JUG.x + 7, CAM.y + 16, 3);
  sol.target.position.set(JUG.x, CAM.y, -PROF/2);
  const s = sol.shadow.camera;
  s.left = -13; s.right = 13; s.top = 13; s.bottom = -13;
  s.updateProjectionMatrix();
}

/* ══════════ UN CUADRO ══════════ */
const _v3 = new T.Vector3();
let MODO3D = '';
function pinta(){
  if (REV3D !== MUNDO.rev) mundo3D();
  /* la nave y el cubo son mallas distintas, asi que el icono se rearma al cambiar
     de modo — una vez, no en cada cuadro */
  if (MODO3D !== JUG.modo){ MODO3D = JUG.modo; ponIcono(); }
  const t = musTiempo();
  /* el pulso: 1 en el golpe y cae hasta el siguiente. Sale del reloj de la
     musica, asi que la imagen y el tema no pueden desincronizarse. */
  const pulso = t == null ? 0 : Math.pow(1 - (((t % 1) + 1) % 1), 3);

  /* el canto y la reja laten con el compas: es lo unico estetico del juego y no
     cuesta ni una llamada de dibujo, porque los materiales son compartidos */
  matReja.opacity = 0.11 + pulso*0.10;
  matFondo.opacity = 0.045 + pulso*0.045;
  ren.toneMappingExposure = 1.10 + pulso*0.12;

  /* el jugador */
  gJug.visible = JUG.vivo;
  if (JUG.vivo){
    gJug.position.set(JUG.x, JUG.y + JUG_LADO*0.5, -JUG_LADO*0.5);
    gJug.rotation.z = JUG.modo === 'nave' ? JUG.giro : -JUG.giro;
  }

  /* lo que se mueve por su cuenta */
  for (const m of SUELTOS){
    const u = m.userData;
    if (u.sierra) m.rotation.y = (t || 0)*2.4;
    else if (u.moneda){
      m.visible = !u.moneda.tomada;
      m.rotation.y = (t || 0)*1.9;
      m.position.y = u.moneda.y + Math.sin((t || 0)*2.2)*0.14;
    } else if (u.portal){
      m.material.opacity = 0.42 + pulso*0.30;
    }
  }
  if (INST.orbe){
    /* un orbe usado se apaga, y eso hay que poder verlo: es la diferencia entre
       «no llegue» y «ya lo gaste» */
    let algo = false;
    MUNDO.orbes.forEach((o, i) => { if (o.usado) algo = true; });
    matOrbe.color.setHex(0xffd447);
    matOrbe.opacity = 1; matOrbe.transparent = false;
    if (algo){
      MUNDO.orbes.forEach((o, i) => {
        const s = o.usado ? 0.55 : 1;
        _m4.compose(new T.Vector3(o.x, o.y, -PROF/2 + 0.5), _q.identity(),
                    new T.Vector3(s, s, s));
        INST.orbe.setMatrixAt(i, _m4);
      });
      INST.orbe.instanceMatrix.needsUpdate = true;
    }
  }

  /* las particulas */
  const n = Math.min(PART.length, PART_TOPE);
  for (let i = 0; i < PART_TOPE; i++){
    if (i < n){
      const p = PART[i], k = cl(p.t/p.t0, 0.15, 1), s = p.s*k;
      _m4.compose(_v3.set(p.x, p.y, p.z), _q.identity(), new T.Vector3(s, s, s));
      mPart.setMatrixAt(i, _m4);
      _c.set(p.c); mPart.setColorAt(i, _c);
    } else {
      _m4.compose(_v3.set(0, -999, 0), _q.identity(), new T.Vector3(0, 0, 0));
      mPart.setMatrixAt(i, _m4);
    }
  }
  mPart.instanceMatrix.needsUpdate = true;
  if (mPart.instanceColor) mPart.instanceColor.needsUpdate = true;

  ren.info.reset();
  ren.render(esc3, cam);
}

/* ── EL BRILLO SE LEE DEL BUFER, Y HAY QUE DIBUJAR PRIMERO ──
   Un lienzo WebGL sin `preserveDrawingBuffer` sale en cero si se lo copia con
   `drawImage`: la unica lectura honesta es `readPixels` justo despues de un
   render. Es la misma leccion que en ECO. */
function brilloDe(){
  pinta();
  const gl = ren.getContext();
  const w = ren.domElement.width, h = ren.domElement.height;
  const px = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let m = 0, mx = 0;
  for (let i = 0; i < px.length; i += 4){
    const l = 0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2];
    m += l; if (l > mx) mx = l;
  }
  return { medio: +(m/(w*h)).toFixed(1), max: Math.round(mx), w, h };
}

function partDe(){
  return { n: PART.length, count: mPart.count, vis: mPart.visible,
           cull: mPart.frustumCulled, mat: !!mPart.material,
           tope: Math.min(PART_TOPE, CALIDADES[CALIDAD].part),
           m0: Array.from(mPart.instanceMatrix.array.slice(0, 16)).map(v => +v.toFixed(2)),
           padre: mPart.parent ? mPart.parent.type : null };
}

function costoDe(){
  const r = ren.info.render, mm = ren.info.memory;
  return { llamadas: r.calls, triangulos: r.triangles, geo: mm.geometries, tex: mm.textures,
           programas: ren.info.programs ? ren.info.programs.length : -1 };
}

/* ── PROYECTAR UN PUNTO DEL MUNDO A FRACCIONES DE PANTALLA ──
   Es la sonda con la que se ajusta el encuadre: «el piso al 80 %» se mide, no se
   estima. Y con la camara mirando derecho tiene que salir LINEAL en x, que es la
   propiedad de la que depende que se pueda apuntar. */
function proy(x, y){
  /* ── LA MATRIZ SE PONE AL DIA ACA, Y NO ES UN DETALLE ──
     `Object3D.matrixWorld` se recalcula al DIBUJAR, asi que proyectar justo
     despues de mover la camara usa la matriz del cuadro anterior: medido, la
     sonda devolvia al jugador en −0,595 del ancho con la camara puesta donde
     corresponde. Es la cuarta vez en este repo que una medicion sale mal por
     esto — en PISTOLA y en RECREO costo una vuelta cada una. */
  cam.updateMatrixWorld(true);
  _v3.set(x, y, 0).project(cam);
  return [(_v3.x + 1)/2, (1 - _v3.y)/2];
}

/* ══════════════════════ EL ESTADO, EL PROGRESO Y EL AUTO-JUGADOR ══════════════════════ */

const DT = 1/60;                 /* paso fijo */
let SIN_RELOJ = false;           /* lo usa la sonda para poder adelantar */
const EST = {
  p: 'carga',                    /* la pantalla */
  nivel: 0, intentos: 0, pct: 0, mejor: 0,
  practica: false, corriendo: false,
  muerto: 0,                     /* reloj de la pausa de la muerte */
  pedido: 0,                     /* el salto pedido, guardado unas centesimas */
  gano: false,
  chk: null,                     /* el punto de control de practica */
  x0: 0                          /* el bloque desde el que arranco este intento */
};

/* ══════════ EL PROGRESO GUARDADO ══════════
   Por nivel: el mejor porcentaje, las tres monedas y si esta hecho. Y el
   `try/catch` no es ceremonia: en una ventana privada `localStorage` TIRA, y una
   red que tira no es una red. */
const PROG = { niv: [], icono: { forma: 0, c1: 0, c2: 1 }, lang: null,
               cal: 'media', mus: 70, fx: 80 };
for (let i = 0; i < NIVELES.length; i++) PROG.niv.push({ mejor: 0, mon: [false, false, false], hecho: false });

function cargaProg(){
  try {
    const s = localStorage.getItem('rotor_v1');
    if (!s) return;
    const o = JSON.parse(s);
    if (o.niv) for (let i = 0; i < PROG.niv.length && i < o.niv.length; i++){
      const a = o.niv[i], b = PROG.niv[i];
      b.mejor = +a.mejor || 0; b.hecho = !!a.hecho;
      if (a.mon) for (let k = 0; k < 3; k++) b.mon[k] = !!a.mon[k];
    }
    if (o.icono){ ICONO.forma = o.icono.forma | 0; ICONO.c1 = o.icono.c1 | 0; ICONO.c2 = o.icono.c2 | 0; }
    if (o.lang && TXT[o.lang]) LANG = o.lang;
    if (o.cal && CALIDADES[o.cal]) CALIDAD = o.cal;
    if (o.mus != null) VOL_MUS = cl(+o.mus, 0, 100)/100;
    if (o.fx != null) VOL_FX = cl(+o.fx, 0, 100)/100;
  } catch(e){}
}
function guardaProg(){
  try {
    localStorage.setItem('rotor_v1', JSON.stringify({
      niv: PROG.niv, icono: ICONO, lang: LANG, cal: CALIDAD,
      mus: Math.round(VOL_MUS*100), fx: Math.round(VOL_FX*100)
    }));
  } catch(e){}
}

/* ══════════ UN PASO ══════════
   ── LA X LA PONE EL RELOJ CUANDO HAY RELOJ, Y SE INTEGRA CUANDO NO ──
   Las dos cosas pasan por `pasoCuerpo`, o sea por LA MISMA fisica: si el bot
   tuviera la suya, ganar no probaria nada. Lo unico que cambia es de donde sale
   la x — del tema en la partida de verdad, integrada en el bot y en el respaldo
   sin audio. */
function avanza(c, med, dt, apretado, xForzada){
  c.x = (xForzada == null) ? c.x + med.v*dt : xForzada;
  pasoCuerpo(c, med, dt, apretado);
}

/* ── EL HUECO LIBRE EN UNA X, Y SE DEVUELVE EL MAS ANCHO ──
   La primera version buscaba «el hueco que contiene a la nave», y eso tiene dos
   defectos que se ven en la medicion: la respuesta depende de donde este la nave,
   y si la nave YA esta metida en una pared no contiene a ninguno — medido, con la
   nave a y 6,29 dentro de la pared de arriba la funcion devolvia el pasillo
   entero libre y el piloto apuntaba al medio del pasillo, que era justo la pared.
   El mas ancho no depende de nada: en un pasillo con dos paredes, el hueco de la
   pared ES el intervalo libre mas ancho. La banda va de 0 a 9,2 porque el pasillo
   se construye asi. */
function huecoLibre(x){
  const B0 = 0, B1 = ALTO_PASILLO;
  const iv = [];
  for (const r of cerca(MUNDO.iSol, x)){
    if (r.x > x || r.x + r.w < x) continue;
    const a = Math.max(B0, r.y), b = Math.min(B1, r.y + r.h);
    if (b > a) iv.push([a, b]);
  }
  iv.sort((p, q) => p[0] - q[0]);
  let lo = B0, ancho = -1, mejor = [B0, B1];
  for (const [a, b] of iv){
    if (a - lo > ancho){ ancho = a - lo; mejor = [lo, a]; }
    if (b > lo) lo = b;
  }
  if (B1 - lo > ancho){ mejor = [lo, B1]; }
  return mejor;
}

/* ══════════════════════ EL AUTO-JUGADOR ══════════════════════
   ── ES LO UNICO QUE PRUEBA QUE UN NIVEL SE PUEDE PASAR ──
   El generador tira patrones y no declara la solucion; el bot la encuentra. Si
   no llega al 100 %, el nivel se rechaza y se vuelve a tirar con otra semilla.

   ── Y LA RAMIFICACION VA A UN SOLO NIVEL DE PROFUNDIDAD ──
   Ramificar cada decision es exponencial: con horizonte de 45 pasos y dos
   opciones por paso son millones de pasos de fisica por decision. Lo que se hace
   en su lugar es ramificar UNA vez —apretar ahora o no— y adentro de cada rama
   usar una politica REACTIVA: saltar cuando, sin saltar, se muere dentro de
   medio tiempo. Con «nunca salta» adentro, una cadena de tres picos mata las dos
   ramas y el bot elige a ciegas; con la reactiva, las cadenas se resuelven sin
   ramificar. */
function copia(c){
  return { x: c.x, y: c.y, vy: c.vy, grav: c.grav, modo: c.modo,
           piso: c.piso, vivo: c.vivo, giro: c.giro, apretado: c.apretado };
}

function botOrbeCerca(c){
  for (const o of MUNDO.orbes){
    if (o.usado) continue;
    if (Math.abs(o.x - c.x) < 1.4 && Math.abs(o.y - (c.y + 0.43)) < 1.4) return true;
  }
  return false;
}

/* ── EL PILOTO ──
   Dos cosas, y las dos salieron de una muerte medida:
   · SE BARRE HACIA ADELANTE hasta encontrar la pared que viene. Con una sola
     muestra a tres bloques, una pared de 1,2 de ancho se ve durante 0,12 s: la
     nave se enteraba pegada a ella. El barrido la encuentra a diez bloques.
   · Y SE APUNTA CON LA VELOCIDAD, NO CON LA POSICION. La nave ACELERA, asi que
     una regla de «subo si estoy abajo» se pasa de largo y oscila; pidiendole una
     velocidad proporcional al error, frena antes de llegar. */
function botNave(c, med){
  let obj = ALTO_PASILLO*0.5 - JUG_LADO*0.5;
  for (let d = 0.4; d <= 10; d += 0.4){
    const h = huecoLibre(c.x + d);
    if (h[1] - h[0] < ALTO_PASILLO - 1.2){ obj = (h[0] + h[1])*0.5 - JUG_LADO*0.5; break; }
  }
  const vObj = cl((obj - c.y)*6.0, -med.naveMax, med.naveMax);
  return c.vy < vObj;
}

/* ── LA POLITICA: SALTAR EN EL ULTIMO MOMENTO POSIBLE ──
   La primera version saltaba «cuando veia la muerte dentro de `mira` pasos», y
   eso no es lo mismo: en un hueco, ver el hueco y saltar da un despegue
   DEMASIADO TEMPRANO y se cae del otro lado. Medido, los cuatro fallos de los
   niveles 2 y 3 eran exactamente eso —`plano: true`, o sea caido al vacio, y uno
   golpeando el labio de enfrente de costado a 0,11 bloques de haberlo pisado—.

   La ventana de despegue de un hueco `w` sale de tres cosas y da poco: para
   pararse en el labio la caja tiene que solaparlo (0,43), para aterrizar tambien,
   y encima el solape del aterrizaje tiene que ser MAYOR que lo que la caja baja
   en un paso (`imp/60`), porque con menos el eje de menor penetracion resuelve
   como choque de costado, o sea muerte. Queda `4,86 − imp/60 − w`: con w = 3,5
   eso es una ventana de un bloque, seis pasos. Saltar «cuando se ve» la pierde
   entera; saltar en el ultimo momento la clava.

   Y se escribe en dos rollouts cortos: si esperando un paso y saltando en el
   siguiente todavia se vive, se espera. */
function botVive(c, med, n, apretaPrimero){
  const d = copia(c);
  for (let i = 0; i < n; i++){
    avanza(d, med, DT, i === 0 ? apretaPrimero : false);
    if (!d.vivo) return false;
    if (d.x >= MUNDO.largo) return true;
  }
  return true;
}
function botReactiva(c, med, mira){
  if (c.modo === 'nave') return botNave(c, med);
  if (!c.piso && !botOrbeCerca(c)) return false;
  const d = copia(c); avanza(d, med, DT, false);
  if (!d.vivo) return true;                        /* un paso mas y se muere */
  if (botVive(d, med, mira, true)) return false;   /* saltando el que viene, vive */
  return botVive(c, med, mira, true);              /* hay que saltar ahora */
}

/* rueda con esa politica y devuelve si sobrevive: el AVANCE no informa nada,
   porque la x sale del reloj y avanza igual se salte o no */
function botRueda(c0, med, pasos, mira){
  const c = copia(c0);
  for (let i = 0; i < pasos; i++){
    avanza(c, med, DT, botReactiva(c, med, mira));
    if (!c.vivo) return false;
    if (c.x >= MUNDO.largo) return true;
  }
  return true;
}

/* ── Y EL HORIZONTE LARGO ES PARA LO QUE «TARDE» NO RESUELVE ──
   Subirse a una plataforma o pisar un pad pide saltar TEMPRANO, y ahi esperar no
   sirve. La regla es la misma de siempre: si esperar sobrevive el horizonte
   largo, se espera; si no, se aprieta. */
function botElige(c, med, pasos, mira){
  if (c.modo === 'nave') return botNave(c, med);
  if (!c.piso && !botOrbeCerca(c)) return false;
