<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROTOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060a;color:#eaf0fb;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}

/* ══════════ EL MARCO SE GIRA, Y NO HAY PANTALLA DE «GIRA EL CELULAR» ══════════
   Este juego es apaisado y el telefono se agarra vertical. Las dos salidas malas
   son encogerlo —en un 412x892 un 16:9 sin girar mide 412x232, o sea el 11 % de
   la pantalla— y pedirle al jugador que gire el aparato, que es una pantalla que
   no hace nada y que la mitad de la gente no obedece.
   Asi que se gira el MARCO 90 grados y adentro va TODO: el lienzo, el HUD y los
   menus. Una sola transformacion, y nada puede quedar desalineado.
   Y ACA NO HACEN FALTA COORDENADAS DEL DEDO: un toque en cualquier lado salta,
   asi que el marco girado no complica nada. Los botones son DOM y de la rotacion
   se ocupa el navegador. (Ojo si algun dia hace falta leer donde toco: con el
   marco girado `getBoundingClientRect` devuelve la caja alineada a los ejes y
   miente, y hay que medir con `offsetLeft`/`offsetTop`.) */
#envase{position:fixed;inset:0;overflow:hidden}
#marco{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
#marco.girado{transform:translate(-50%,-50%) rotate(90deg)}
#marco.derecho{transform:translate(-50%,-50%)}
#cv{display:block;width:100%;height:100%}

/* ══════════ EL DESTELLO Y LA VIÑETA ══════════
   ── EL DESTELLO ES UN BORDE, NO UN VELO ──
   Un velo blanco de pantalla completa sube el brillo de TODO justo en el cuadro
   en que el jugador esta mirando que le paso: es la leccion de `destella()` en
   los casuales. Un radial con el centro transparente pinta los bordes, deja el
   medio limpio y encima lleva el COLOR del acontecimiento, que dice que paso sin
   escribir nada. Y va por CSS y no por WebGL: no cuesta un solo triangulo. */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:8;
  background:radial-gradient(ellipse at 50% 58%,transparent 32%,var(--fc,#fff) 105%)}
/* la viñeta empuja la vista al centro, que en un juego donde hay que mirar un
   bloque exacto es justo lo que hace falta */
#vin{position:absolute;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(ellipse at 50% 56%,transparent 46%,rgba(3,5,10,.62) 118%)}

/* ══════════ EL HUD ══════════ */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s}
body.jugando #hud{opacity:1}
/* la barra de progreso arriba: es la ficha del genero. Dice cuanto falta, y el
   numero al costado dice cuanto, porque una barra sola no se puede comparar
   contra el intento anterior */
#barra{position:absolute;left:6%;right:24%;top:10px;height:13px;border-radius:99px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);overflow:hidden}
#barra i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#2de2a8,#5ad9ff);transition:width .06s linear}
/* el numero va AL LADO de la barra y no encima: adentro se pisa con ella, y una
   barra sola no se puede comparar contra el intento anterior */
#pct{position:absolute;right:6%;top:10px;
  font:800 12px/13px system-ui,sans-serif;letter-spacing:.06em;color:#8ef0c4;
  text-shadow:0 1px 6px rgba(0,0,0,.85)}
#mejor{position:absolute;right:6%;top:30px;font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.14em;color:rgba(226,240,255,.72);text-shadow:0 1px 6px rgba(0,0,0,.85)}
/* ── LOS ROTULOS LLEVAN SOMBRA, Y NO ES ADORNO ──
   Con el telon de foto puesto, el cielo del nivel 1 es MINTA CLARO y el del 3 una
   banda roja: un gris al 20 % sobre eso no se lee. La sombra opaca no depende de
   lo que haya detras. */
#intentos{position:absolute;left:50%;top:26%;transform:translateX(-50%);
  font:800 clamp(15px,2.6vh,22px)/1 system-ui,sans-serif;letter-spacing:.16em;
  color:rgba(255,255,255,.28);text-shadow:0 2px 8px rgba(0,0,0,.75)}
#tema{position:absolute;left:6%;top:30px;font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.14em;color:rgba(226,240,255,.72);text-shadow:0 1px 6px rgba(0,0,0,.85)}
/* el modo, debajo del nombre del tema: el color lo pone el codigo, porque es el
   mismo con el que destella el portal al cambiar */
#modo{position:absolute;left:6%;top:46px;font:800 12px/1 system-ui,sans-serif;
  letter-spacing:.18em;text-shadow:0 1px 6px rgba(0,0,0,.85)}
#pract{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  font:800 10px/1 system-ui,sans-serif;letter-spacing:.20em;color:#8ef0c4;
  padding:5px 12px;border-radius:99px;background:rgba(20,90,60,.42);display:none}
body.practicando #pract{display:block}
#bPausa{position:absolute;right:8px;top:44px;width:34px;height:34px;border-radius:10px;
  border:1px solid rgba(255,255,255,.16);background:rgba(10,14,22,.55);color:#eaf0fb;
  font:700 13px/1 system-ui;pointer-events:auto;display:none}
body.jugando #bPausa{display:block}

/* ══════════ LAS PANTALLAS ══════════ */
.pan{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  padding:16px;overflow:hidden;
  /* ── LAS PANTALLAS ENTRAN, NO APARECEN ──
     `display:none` no se puede animar, asi que lo que se apaga es la visibilidad
     y lo que se anima son la opacidad y un desplazamiento chico. Sin la
     visibilidad, un panel apagado seguiria recibiendo el dedo — y eso ya costo
     una vuelta en los cinco minijuegos, donde un `#tela` con opacidad cero se
     comia TODOS los toques. */
  visibility:hidden;opacity:0;transition:opacity .19s ease,visibility .19s}
.pan.on{visibility:visible;opacity:1}
.pan .caja{transform:translateY(14px) scale(.985);transition:transform .24s cubic-bezier(.2,.9,.25,1)}
.pan.on .caja{transform:none}
/* ── EL VELO ES UN DEGRADADO Y SE ABRE DONDE ESTA LA ACCION ──
   Cerrado arriba, donde va el titulo, y abierto en la franja de abajo, que es
   justo donde el nivel tiene el piso, el cubo y los picos. Con una opacidad
   pareja el demo de atras no se veia: medido, quedaba al 28 % de brillo y el cubo
   se leia a mancha. */
.pan::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,6,10,.95),rgba(5,6,10,.88) 42%,
    rgba(6,8,14,.66) 56%,rgba(6,8,14,.34) 76%,rgba(5,6,10,.88))}
/* ── LA FOTO DEL MENU VA SOLO EN LA FRANJA DE ARRIBA ──
   Un telon de pantalla completa taparia el demo, que es lo unico que este menu
   tiene para mostrar. Arriba, donde el velo ya esta cerrado para que se lea el
   titulo, la foto no le quita nada a nadie: pone el sitio. Y se desvanece hacia
   abajo con una mascara, asi no queda un canto recto cruzando la pantalla. */
#mFondo{position:absolute;left:0;right:0;top:0;height:58%;z-index:-1;
  background-position:center 30%;background-size:cover;background-repeat:no-repeat;
  opacity:0;transition:opacity .5s ease;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 100%)}
#mFondo.hay{opacity:.62}
/* el sello: es una marca y no una ilustracion, asi que se mide en ALTO —en un
   telefono corto el aire lo pone el alto y no el ancho— */
/* ── Y SE MIDE EN PIXELES Y NO EN `vh` ──
   El marco esta GIRADO noventa grados, asi que `vh` es el alto de la VENTANA
   —892— y no el lado corto del cuadro —412—: medido, `9vh` daba 80 px de sello y
   el pie del menu se salia del cuadro. */
#mSello{display:none;height:46px;width:auto;margin:0 auto 4px;
  filter:drop-shadow(0 4px 14px rgba(0,220,200,.30))}
#mSello.hay{display:block}
.caja{position:relative;text-align:center;width:min(430px,92%)}
h1{font:800 clamp(26px,6.2vh,44px)/1 system-ui,sans-serif;letter-spacing:.20em;
  text-indent:.20em;
  background:linear-gradient(180deg,#eafcff 0%,#77e6ff 45%,#2b7fd6 64%,#b8f2d6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(0,180,255,.35))}
h1::after{content:'';display:block;width:84px;height:2px;margin:11px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,#2de2a8,transparent);
  animation:filo 2.6s ease-in-out infinite}
@keyframes filo{0%,100%{width:84px;opacity:.55}50%{width:158px;opacity:1}}
.sub{font:700 9.5px/1.7 ui-monospace,monospace;letter-spacing:.24em;
  color:rgba(190,215,245,.46);text-transform:uppercase;margin:8px 0 16px}
.tx{font-size:12.5px;line-height:1.6;color:rgba(220,235,255,.80);margin-bottom:14px;
  text-shadow:0 1px 4px rgba(0,0,0,.85)}
.bt{display:block;width:100%;margin-top:9px;padding:13px 16px;border-radius:12px;
  border:1px solid rgba(90,217,255,.28);background:rgba(9,14,24,.72);color:#eaf0fb;
  font:800 14px/1 system-ui,sans-serif;letter-spacing:.08em;transition:transform .1s}
.bt:active{transform:scale(.97)}
.bt.p{background:linear-gradient(135deg,#2de2a8,#5ad9ff);color:#04222c;border-color:transparent;
  /* ── EL BOTON LATE CON EL TEMA QUE ESTA SONANDO ──
     `--pulso` lo escribe el bucle, y SOLO mientras hay un panel abierto: escribir
     en el DOM sesenta veces por segundo durante la partida obligaria al navegador
     a recalcular el layout para no cambiar nada. */
  transform:scale(calc(1 + var(--pulso,0)*.022));
  box-shadow:0 0 calc(var(--pulso,0)*26px) rgba(90,217,255,calc(var(--pulso,0)*.55))}
.fila{display:flex;gap:7px;margin-top:9px}
.fila .bt{margin-top:0}
.bt.sel{background:linear-gradient(135deg,#2de2a8,#5ad9ff);color:#04222c;border-color:transparent}
.pie{margin-top:13px;font-size:10.5px;line-height:1.6;color:rgba(200,222,250,.58);
  text-shadow:0 1px 4px rgba(0,0,0,.9)}

/* ── LA LISTA DE NIVELES: UNA FICHA POR NIVEL, COMO EN EL GENERO ──
   Cada ficha dice el nombre, la dificultad, el tema, el mejor porcentaje y las
   tres monedas. Todo eso junto es lo que hace que un nivel se pueda ELEGIR: con
   el nombre solo, tres niveles son tres botones iguales. */
.niv{display:block;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;
  border:1px solid rgba(120,210,255,.22);background:rgba(10,16,28,.80);
  color:#eaf0fb;text-align:left;position:relative;overflow:hidden}
.niv:active{transform:scale(.985)}
.niv .n{font:800 15px/1.2 system-ui,sans-serif;letter-spacing:.05em}
.niv .d{font:700 9px/1 ui-monospace,monospace;letter-spacing:.16em;margin-top:5px;
  color:rgba(200,225,250,.55)}
.niv .pb{position:absolute;left:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#2de2a8,#5ad9ff)}
/* ── Y UNA FRANJA DEL COLOR DEL TEMA ──
   Es lo unico que ata la ficha al nivel que se va a ver: con las tres del mismo
   gris, elegir un tema es leer tres nombres. */
.niv .cl{position:absolute;left:0;top:0;bottom:0;width:4px}
.niv .mo{position:absolute;right:46px;top:15px;font:700 15px/1 system-ui;letter-spacing:.16em}
.cara{position:absolute;right:12px;bottom:12px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font:800 11px/1 system-ui}
.d1{background:#2de2a8;color:#04221a}
.d2{background:#5ad9ff;color:#032430}
.d3{background:#ff7a4a;color:#2a0d04}

#carga{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:#05060a;transition:opacity .3s}
#carga.ido{opacity:0;pointer-events:none}
.barc{width:min(240px,60%);height:4px;border-radius:99px;background:rgba(255,255,255,.10);
  overflow:hidden;margin:16px auto 0}
.barc i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2de2a8,#5ad9ff);
  transition:width .3s}
</style>
</head>
<body>

<div id="carga"><div class="caja">
  <h1>ROTOR</h1><div class="sub" id="cSub">CARGANDO</div>
  <div class="barc"><i id="cBarra"></i></div>
</div></div>

<div id="envase"><div id="marco">
  <canvas id="cv"></canvas>

  <div id="vin"></div>
  <div id="flash"></div>

  <div id="hud">
    <div id="barra"><i id="barraI"></i></div>
    <div id="pct">0%</div>
    <div id="tema"></div>
    <div id="modo"></div>
    <div id="mejor"></div>
    <div id="intentos"></div>
    <div id="pract"></div>
    <button id="bPausa">॥</button>
  </div>

  <div class="pan" id="pIdioma"><div class="caja">
    <h1>ROTOR</h1><div class="sub">IDIOMA · LANGUAGE</div>
    <button class="bt" data-lang="es">Castellano</button>
    <button class="bt" data-lang="en">English</button>
    <button class="bt" data-lang="pt">Português</button>
  </div></div>

  <div class="pan" id="pMenu"><div id="mFondo"></div><div class="caja">
    <img id="mSello" alt=""><h1>ROTOR</h1><div class="sub" id="mSub"></div>
    <p class="tx" id="mTx"></p>
    <button class="bt p" id="bJugar"></button>
    <button class="bt" id="bIconos"></button>
    <button class="bt" id="bAjustes"></button>
    <div class="pie" id="mPie"></div>
  </div></div>

  <div class="pan" id="pNiveles"><div class="caja">
    <h1 id="nTit"></h1><div class="sub" id="nSub"></div>
    <div id="lista"></div>
    <button class="bt" id="nVolver"></button>
  </div></div>

  <div class="pan" id="pIconos"><div class="caja">
    <h1 id="iTit"></h1><div class="sub" id="iSub"></div>
    <div class="fila" id="iForma"></div>
    <div class="fila" id="iCol1"></div>
    <div class="fila" id="iCol2"></div>
    <button class="bt" id="iVolver"></button>
  </div></div>

  <div class="pan" id="pAjustes"><div class="caja">
    <h1 id="aTit"></h1><div class="sub" id="aSub"></div>
    <div class="pie" id="aMusL"></div>
    <input type="range" id="aMus" min="0" max="100" value="70" style="width:100%">
    <div class="pie" id="aFxL"></div>
    <input type="range" id="aFx" min="0" max="100" value="80" style="width:100%">
    <div class="fila" id="aIdi"></div>
    <div class="fila" id="aCal"></div>
    <button class="bt" id="aVolver"></button>
  </div></div>

  <div class="pan" id="pPausa"><div class="caja">
    <h1 id="pTit"></h1><div class="sub" id="pSub"></div>
    <button class="bt p" id="bSigo"></button>
    <button class="bt" id="bReint"></button>
    <button class="bt" id="bPract"></button>
    <button class="bt" id="bSalir"></button>
  </div></div>

  <div class="pan" id="pFin"><div class="caja">
    <h1 id="fTit"></h1><div class="sub" id="fSub"></div>
    <p class="tx" id="fTx"></p>
    <button class="bt p" id="fSigue"></button>
    <button class="bt" id="fMenu"></button>
  </div></div>
</div></div>

/* ══════════════════════ LAS MEDIDAS, Y DE DONDE SALEN ══════════════════════
   Todo se mide en BLOQUES y en TIEMPOS de compas, no en pixeles ni en segundos,
   y esa es la decision de la que cuelga el juego entero.

   ── UN TIEMPO SON CUATRO BLOQUES ──
   De ahi sale la velocidad: `V = 4 · BPM / 60`. Asi un obstaculo puesto en la
   corchea cae SIEMPRE en un multiplo de dos bloques, y «que vaya al ritmo» deja
   de ser algo que hay que sincronizar a mano: es una propiedad de la grilla.

   ── Y EL SALTO DURA EXACTAMENTE UN TIEMPO ──
   Que es lo que lo vuelve una unidad musical. Fijado el aire en `T = 60/BPM` y
   el alto en 2,4 bloques, la gravedad y el impulso SALEN de una cuenta:
       g = 8·alto/T²      v = 4·alto/T
   Con eso el salto mide cuatro bloques de largo en los tres niveles, aunque los
   tres vayan a otro tempo. Escribiendo la gravedad a mano, el salto mediria
   distinto en cada nivel y los patrones dejarian de servir. */
const BLOQ_POR_TIEMPO = 4;
const SALTO_ALTO = 2.4;          /* bloques de apice */
const JUG_LADO = 0.86;           /* el cubo es un poco mas chico que su celda */
/* ── EL PASILLO DE LA NAVE MIDE LO QUE ENTRA EN PANTALLA ──
   `py()` deja ver `ALTO/U − 0,9` bloques, o sea 8,33 en un marco de telefono. Con
   el techo en 9,2 —y hasta con 8,2— caia POR ENCIMA del borde de arriba: medido
   en la foto, la nave volaba en un pasillo sin tapa visible, y un limite que no
   se ve no es un limite, es una muerte sorpresa. Con 7,6 entra entero y quedan

   medir menos que la distancia entre paredes o no llega a subir. Y la arana se
   teletransporta, asi que la suya solo tiene que dejar pasar al cuerpo. */

  const T = 60/bpm;                         /* un tiempo, en segundos */
  return {
    bpm, T,
    v: BLOQ_POR_TIEMPO*bpm/60,              /* bloques por segundo */
    g: 8*SALTO_ALTO/(T*T),
    imp: 4*SALTO_ALTO/T,
    /* el pad amarillo lanza el doble de alto, o sea raiz de dos veces el impulso */

    /* la nave: subir y bajar son aceleraciones, no velocidades, porque lo que se
       controla es la CURVA. Con velocidad directa la nave se lee a ascensor. */

         · robot k 0,80 a 1,21 → de 1,54 a 3,51 segun cuanto se mantenga

    impOvni: 4*SALTO_ALTO/T*0.913,
    robotMin: 4*SALTO_ALTO/T*0.80,
    robotMax: 4*SALTO_ALTO/T*1.21,
    robotT: 0.26,
    /* el columpio: gravedad que se da vuelta, con tope para que un pasillo largo
       no lo ponga a caer mas rapido de lo que el pasillo mide */
    colA: 8*SALTO_ALTO/(T*T)*0.78,

  };

/* ══════════════════════ LA MUSICA, Y ES EL RELOJ ══════════════════════
   ── POR QUE ES PROCEDURAL Y NO UN MP3 ──
   El pedido es que el nivel vaya al ritmo. Con un tema grabado hay que MEDIRLE
   el tempo y despues confiar en que no se corra; con un tema generado por
   codigo, el compas es un numero que el juego ya tiene, asi que la sincronia no
   se ajusta: es exacta por construccion. Y pesa cero bytes, que en un HTML
   autocontenido de un solo archivo no es un detalle.
   Es electronica de verdad y no bips: bombo en cada tiempo, clap en el 2 y el 4,
   charles en las corcheas, un bajo con filtro que se abre, un arpegio de
   dieciseisavos y una linea de lead de dos compases.

   ── Y EL RELOJ DEL JUEGO SALE DE ACA ──
   `AudioContext.currentTime` es el unico reloj que no se atrasa cuando el
   navegador pierde cuadros. Si la simulacion corriera con el reloj de pantalla,
   una tanda de cuadros perdidos correria el nivel respecto de la musica y el
   juego dejaria de estar en tiempo — que es exactamente el defecto que este
   genero no puede tener. */
let AUD = null, MAE = null, GMUS = null, GFX = null, RUI = null;
let VOL_MUS = 0.70, VOL_FX = 0.80;
let ANAL = null;

function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAE = AUD.createGain(); MAE.gain.value = 0.9; MAE.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAE.connect(ANAL);
  /* dos buses: sin ellos, bajar «la musica» bajaria tambien el sonido de saltar,
     y son dos perillas distintas porque son dos cosas distintas */
  GMUS = AUD.createGain(); GMUS.gain.value = VOL_MUS; GMUS.connect(MAE);
  GFX = AUD.createGain(); GFX.gain.value = VOL_FX; GFX.connect(MAE);
  const n = Math.floor(AUD.sampleRate*0.6);
  RUI = AUD.createBuffer(1, n, AUD.sampleRate);
  const d = RUI.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  musCarga();
}

const MUS = { on: false, t0: 0, bpm: 158, pista: 0, ganancia: 1 };

/* ══════════ LA CANCION ══════════
   ── LA MUSICA PASO DE OSCILADORES A UNA MUESTRA, Y ESO CAMBIA EL RELOJ ──
   Antes el tema se sintetizaba, asi que el reloj del juego salia de contar
   dieciseisavos agendados. Ahora hay UN archivo —el que el usuario trajo— y el
   reloj sale de `AudioContext.currentTime` contra el instante en que la muestra
   arranco. Es el mismo reloj de siempre y por la misma razon: es el unico que no
   se atrasa cuando el navegador pierde cuadros.

   ── Y EL ARCHIVO YA EMPIEZA EN UN TIEMPO ──
   `hornear_musica.py` le recorta la cabeza hasta el primer tiempo medido
   (0,348 s), asi que el instante cero de la muestra ES el tiempo cero del nivel y
   no hace falta ningun desfase en ejecucion. Un desfase acá seria un numero que
   hay que mantener en dos sitios. */
let MUS_BUF = null, MUS_SRC = null, MUS_LISTA = false;
function musCarga(){
  armaAudio(); if (!AUD || MUS_LISTA || typeof MUS_B64 === 'undefined') return;
  MUS_LISTA = true;
  /* el data URI se decodifica una sola vez y queda en memoria: un
     `BufferSource` nuevo por intento cuesta nada y es lo que permite arrancar
     desde un punto de control sin volver a decodificar 235 KB */
  fetch(MUS_B64).then(r => r.arrayBuffer()).then(a => AUD.decodeAudioData(a))
    .then(b => { MUS_BUF = b; })
    .catch(() => { MUS_LISTA = false; });
}

function musArranca(nivel, desdeT){
  armaAudio(); if (!AUD) return;
  const N = NIVELES[nivel];
  const d = Math.max(0, desdeT || 0);
  MUS.on = true; MUS.bpm = N.bpm; MUS.pista = nivel;
  const T = 60/N.bpm;
  /* el tiempo 0 del JUEGO, que puede caer en el pasado si se retoma un punto de
     control: asi `musTiempo()` devuelve el tiempo musical correcto sin restar
     nada afuera */
  MUS.t0 = AUD.currentTime + 0.10 - d*T;
  MUS.ganancia = 1;
  musPara2();
  if (MUS_BUF){
    MUS_SRC = AUD.createBufferSource();
    MUS_SRC.buffer = MUS_BUF;
    MUS_SRC.connect(GMUS);
    /* arranca en el segundo que le corresponde al punto de control: el nivel y el
       tema comparten la grilla, asi que el bloque 96 ES el tiempo 24 */
    MUS_SRC.start(AUD.currentTime + 0.10, Math.min(MUS_BUF.duration - 0.05, d*T));
  }
}
function musPara2(){
  if (MUS_SRC){ try { MUS_SRC.stop(); } catch(e){} MUS_SRC.disconnect(); MUS_SRC = null; }
}
function musPara(){ MUS.on = false; musPara2(); }
/* el tiempo musical, en TIEMPOS de compas. Es el reloj del juego. */
function musTiempo(){
  if (!AUD || !MUS.on) return null;
  return (AUD.currentTime - MUS.t0)*MUS.bpm/60;
}
/* ── Y LA AGACHADA SE APLICA POR GANANCIA, NO PARANDO LA MUESTRA ──
   La usa el freno de la muerte: parar y rearrancar una muestra de treinta
   segundos se escucha como un corte, y bajarla un instante no. */
function musPaso(){
  if (!MUS.on || !AUD) return;
  if (GMUS) GMUS.gain.value = VOL_MUS*MUS.ganancia;
}

/* ── LO QUE SE FUE: LOS SEIS INSTRUMENTOS ──
   El tema se sintetizaba con bombo, clap, charles, bajo, arpegio y lead, y con
   una cancion de verdad eso pasa a ser codigo vivo que nadie llama: el dia que
   se toque va a estar roto sin que nada lo diga. Lo unico que quedo del
   sintetizador son los efectos de `son()`, que siguen pesando cero. */

function son(k){
  armaAudio(); if (!AUD) return;
  const t = AUD.currentTime, g = AUD.createGain(); g.connect(GFX);
  if (k === 'salta'){
    const o = AUD.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(360, t);
    o.frequency.exponentialRampToValueAtTime(780, t + 0.07);
    g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); o.start(t); o.stop(t + 0.1);
  } else if (k === 'muere'){
    const s = AUD.createBufferSource(); s.buffer = RUI;
    const f = AUD.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(2600, t);
    f.frequency.exponentialRampToValueAtTime(180, t + 0.4);
    g.gain.setValueAtTime(0.34, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    s.connect(f); f.connect(g); s.start(t); s.stop(t + 0.47);
  } else if (k === 'portal' || k === 'pad'){
    const o = AUD.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(k === 'pad' ? 300 : 620, t);
    o.frequency.exponentialRampToValueAtTime(k === 'pad' ? 1200 : 240, t + 0.18);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); o.start(t); o.stop(t + 0.22);
  } else if (k === 'moneda'){
    for (let i = 0; i < 3; i++){
      const o = AUD.createOscillator(); o.type = 'triangle';
      o.frequency.value = 880*Math.pow(2, i*0.25);
      const gg = AUD.createGain(); gg.connect(GFX);
      const t0 = t + i*0.06;
      gg.gain.setValueAtTime(0.0001, t0);
      gg.gain.linearRampToValueAtTime(0.16, t0 + 0.01);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(gg); o.start(t0); o.stop(t0 + 0.18);
    }
  } else if (k === 'gana'){
    [0, 4, 7, 12].forEach((n, i) => {
      const o = AUD.createOscillator(); o.type = 'triangle';
      o.frequency.value = 440*Math.pow(2, n/12);
      const gg = AUD.createGain(); gg.connect(GFX);
      const t0 = t + i*0.1;
      gg.gain.setValueAtTime(0.0001, t0);
      gg.gain.linearRampToValueAtTime(0.2, t0 + 0.015);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
      o.connect(gg); o.start(t0); o.stop(t0 + 0.44);
    });
  } else if (k === 'clic'){
    const o = AUD.createOscillator(); o.type = 'triangle'; o.frequency.value = 700;
    g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); o.start(t); o.stop(t + 0.08);
  }
}
function ponVol(){
  if (GMUS) GMUS.gain.value = VOL_MUS;
  if (GFX) GFX.gain.value = VOL_FX;
}

/* ══════════════════════ EL NIVEL ══════════════════════
   ── SE ARMA PEGANDO PATRONES SOBRE LA GRILLA DEL COMPAS ──
   Un patron mide un compas —cuatro tiempos, o sea dieciseis bloques— y todo lo
   que pone cae en corcheas. Asi «el nivel va al ritmo» no es algo que haya que
   sincronizar: es lo unico que el generador sabe hacer.

   ── Y UN NIVEL GENERADO Y NO JUGADO ES UN NIVEL ROTO QUE TODAVIA NO SE SABE ──
   Es la regla que en este repo ya costo siete niveles imposibles en Maicol y una
   nube 37 de 42 en BARRIO. El generador tira, y despues el auto-jugador de `g.js`
   lo tiene que terminar al 100 %: si no llega, se rechaza y se vuelve a tirar con
   otra semilla. El validador y el juego comparten la MISMA fisica, asi que el
   validador no puede aprobar un juego que no existe. */
const MUNDO = {
  largo: 0,            /* en bloques */
  sol: [],             /* solidos: se para arriba, se muere de costado */
  mat: [],             /* mortales: picos y sierras */
  pads: [], orbes: [], portales: [], monedas: [],
  sierras: [],         /* solo para dibujar: su caja mortal ya esta en `mat` */
  techo: [],           /* tramos con techo, para gravedad y nave */
  nivel: 0, med: null,
  tramos: [],          /* los diez tramos de modo, con su paleta */
  /* ── LA REVISION ──
     La sube `generaNivel` y el dibujo la mira para saber si tiene que rearmar
     las mallas. Con una llamada explicita, el dia que se agregue un camino que
     genere un nivel —el demo del menu, una sonda, la validacion— se olvida y se
     dibuja el nivel anterior. */
  rev: 0,
  /* los indices arrancan vacios: `cerca()` se puede llamar antes de generar */
  iSol: [], iMat: []
};

const rect = (x, y, w, h, t) => ({ x, y, w, h, t });

/* ══════════ EL NIVEL, TRAMO POR TRAMO ══════════
   ── ESTE NIVEL ESTA ESCRITO Y NO SORTEADO, Y ES A PROPOSITO ──
   Los tres niveles anteriores se generaban con patrones al azar y semilla, y eso
   servia para tres temas de un solo modo. Con OCHO modos en un nivel el azar no
   sirve: cada modo pide su propia altura de pasillo, su propia distancia entre
   paredes y su propio portal, y un sorteo que respete todo eso ya es una lista
   escrita. Lo que NO cambia es la validacion: el auto-jugador de `g.js` lo tiene
   que terminar al 100 %, y comparte la fisica con el juego.

   ── Y LOS TRAMOS CAEN EN COMPASES ENTEROS ──
   Los tramos de modo miden dos compases —32 bloques, ocho tiempos, 3,04 s a
   158 BPM— asi que los ocho portales caen en el primer tiempo de un compas. A
   mitad de compas el cambio de modo se lee a error. */
const TRAMOS = [
  { x: 0,   w: 24, modo: 'cubo',     arma: 'entrada' },
  { x: 24,  w: 24, modo: 'cubo',     arma: 'cubo' },
  { x: 48,  w: 32, modo: 'nave',     arma: 'nave' },
  { x: 80,  w: 32, modo: 'bola',     arma: 'bola' },
  { x: 112, w: 32, modo: 'ovni',     arma: 'ovni' },
  { x: 144, w: 32, modo: 'onda',     arma: 'onda' },
  { x: 176, w: 32, modo: 'robot',    arma: 'robot' },
  { x: 208, w: 32, modo: 'arana',    arma: 'arana' },
  { x: 240, w: 32, modo: 'columpio', arma: 'columpio' },
  { x: 272, w: 30, modo: 'cubo',     arma: 'orbes' }
];
const LARGO_NIVEL = 302;

/* ── LOS CONSTRUCTORES DE TRAMO ──
   Cada uno pone lo que su modo necesita y NADA MAS: no declara la solucion. La
   solucion la encuentra el auto-jugador, que es lo que garantiza que exista. */
const ARMA = {

  /* la entrada: compas y medio casi vacio. Aparecer al lado de un pico no es
     dificultad, es una emboscada — y ademas el primer compas es la entrada del
     tema, o sea que el nivel arranca cuando arranca la cancion. */
  /* ── Y LLEVA EL PAD AMARILLO, PORQUE UN PAD NO SE DECIDE ──
     El pad lanza al pisarlo y el orbe hay que apretarlo: son las dos mitades del
     genero y las dos tienen que ESTAR en el nivel, no solo en el codigo. Va en la
     entrada porque es donde no hay nada que esquivar todavia. Su apice son
     `2·2,4 = 4,8` bloques y cae en `u = 0,707`, o sea 2,83 bloques despues del
     pad: ahi va la moneda, que es el unico sitio del vuelo al que se llega. El
     vuelo mide `4·√2 = 5,66` bloques, asi que se aterriza en x+13,66 y quedan
     4,3 hasta el primer pico — un salto entero. */
  entrada(P, x, w){
    P.pad(x + 8, 'amar'); P.moneda(x + 10.83, 5.2);
    P.pico(x + 18); P.pico(x + 22);
  },

  cubo(P, x, w){
    P.pico(x + 2); P.pico(x + 6);
    P.pico(x + 10); P.pico(x + 11);          /* dobles: 2,50 de ancho, entra */
    P.hueco(x + 14, x + 17.0);               /* 3,0 de hueco contra 4,0 de salto */
    /* el pad rosa lanza 0,68 del cubo, o sea apice 1,11: es un salto corto y su
       gracia es que no se puede elegir — pisarlo obliga */
    P.pad(x + 19, 'rosa');
    P.pico(x + 21);
  },

  /* ── LA NAVE: UN PASILLO CON PAREDES CADA OCHO BLOQUES ──
     Lo unico que la mata es el techo, el piso y las paredes: sin techo, «volar»
     seria subir sin limite y el modo no significaria nada. */
  nave(P, x, w){
    P.techo(x, w, ALTO_PASILLO);
    /* la primera pared va a ocho bloques y no a seis: la nave entra pegada al
       piso y tiene que trepar hasta el hueco, y con seis no alcanza contando la
       aceleracion */
    for (let i = 0; i*8 + 8 < w; i++){
      const bx = x + 8 + i*8, hueco = 3.4;
      const abajo = [1.0, 2.6, 0.8][i % 3];
      P.bloque(bx, 0, 1.2, abajo);
      P.bloque(bx, abajo + hueco, 1.2, ALTO_PASILLO - (abajo + hueco));
    }
    P.moneda(x + 12, 2.6);
  },

  /* ── LA BOLA: PICOS QUE ALTERNAN PISO Y TECHO ──
     La bola no salta: da vuelta la gravedad. Asi que lo que hay que medir es el
     CRUCE: con el pasillo en 6 bloques y la gravedad del cubo, ir de una cara a
     la otra tarda `sqrt(2·6/g)` = 0,30 s, o sea 3,2 bloques. Los picos van cada
     ocho, que deja mas de un cruce de aire para decidir. */
  bola(P, x, w){
    P.techo(x, w, ALTO_BOLA);
    for (let i = 0; i < 4; i++){
      const bx = x + 6 + i*8;
      if (i % 2 === 0){ P.pico(bx); P.pico(bx + 1); }
      else { P.picoInv(bx, ALTO_BOLA); P.picoInv(bx + 1, ALTO_BOLA); }
    }
  },

  /* ── EL OVNI: PILARES QUE SE SALTAN EN EL AIRE ──
     Su apice son 2,0 bloques desde donde este, y puede tocar cuantas veces
     quiera: lo que lo acota es que cada toque sube poco. Los pilares miden 1,6 —
     un solo toque los clarea— y el hueco del final pide DOS. */
  ovni(P, x, w){
    P.techo(x, w, ALTO_OVNI);
    P.bloque(x + 6, 0, 1.2, 1.6);
    P.bloque(x + 13, 0, 1.2, 1.6);
    P.bloque(x + 20, 0, 1.2, 2.4);
    P.hueco(x + 25, x + 29.0);
    P.moneda(x + 27, 3.0);
  },

  /* ── LA ONDA: EL PASILLO EN ZIGZAG ──
     Va a 45 grados exactos, asi que la geometria es la unica dificultad: para
     pasar de un hueco al siguiente hay que subir `dy` en `dx` bloques, y a 45
     grados eso pide `dy <= dx`. Con paredes cada seis y huecos que se corren 2,2,
     sobra — y con el hueco en 1,9 no perdona un cuadro de mas. */
  onda(P, x, w){
    P.techo(x, w, ALTO_ONDA);
    const alturas = [1.0, 3.2, 1.0, 3.2, 1.6];
    for (let i = 0; i < alturas.length; i++){
      const bx = x + 6 + i*6, abajo = alturas[i], hueco = 1.9;
      if (bx + 1.0 > x + w) break;
      P.bloque(bx, 0, 1.0, abajo);
      P.bloque(bx, abajo + hueco, 1.0, ALTO_ONDA - (abajo + hueco));
    }
  },

  /* ── EL ROBOT: TRES MUROS QUE PIDEN TRES CARGAS DISTINTAS ──
     Su apice va de 1,54 a 3,51 bloques segun cuanto se mantenga el dedo, asi que
     el modo se juega MIDIENDO el tiempo. Los muros van en 1,2 · 2,2 · 3,0: el
     primero sale con un toque corto, el ultimo pide la carga entera y deja medio
     bloque de sobra. */
  robot(P, x, w){
    P.bloque(x + 7, 0, 0.9, 1.2);
    P.bloque(x + 15, 0, 0.9, 2.2);
    P.bloque(x + 24, 0, 0.9, 3.0);
    P.moneda(x + 24.4, 4.2);
  },

  /* ── LA ARANA: SE TELETRANSPORTA A LA CARA DE ENFRENTE ──
     Necesita las dos caras a la vez, asi que su tramo lleva techo; y como el
     cambio es instantaneo, lo que se prueba es el TIEMPO y no la trayectoria. */
  arana(P, x, w){
    P.techo(x, w, ALTO_ARANA);
    P.pico(x + 7); P.pico(x + 8);
    P.picoInv(x + 14, ALTO_ARANA); P.picoInv(x + 15, ALTO_ARANA);
    P.pico(x + 21); P.pico(x + 22);
    P.picoInv(x + 27, ALTO_ARANA);
  },

  /* ── EL COLUMPIO: PAREDES ANCHAS, PORQUE EL ARCO ES MAS GRANDE ──
     Invierte su gravedad, asi que no tiene tope de subida como la nave: el arco
     es simetrico y mas amplio. Con el hueco de la nave (3,4) se pasaba de largo,
     asi que va en 4,4 y las paredes cada diez. */
  columpio(P, x, w){
    P.techo(x, w, ALTO_COL);
    const abajos = [1.2, 2.4, 1.0];
    for (let i = 0; i < abajos.length; i++){
      const bx = x + 9 + i*10, hueco = 4.4, abajo = abajos[i];
      if (bx + 1.1 > x + w) break;
      P.bloque(bx, 0, 1.1, abajo);
      P.bloque(bx, abajo + hueco, 1.1, ALTO_COL - (abajo + hueco));
    }
  },

  /* ── EL FINAL: UNA CADENA DE ORBES SOBRE EL VACIO ──
     Es el unico tramo donde el vacio dura mas que un salto, asi que los orbes
     dejan de ser un adorno y pasan a ser el piso. Van cada cuatro bloques, que es
     exactamente lo que mide un salto: el que mantiene apretado los engancha en
     fila, y el que suelta se cae. */
  orbes(P, x, w){
    /* ── LA ALTURA DE LOS ORBES SALE DEL ARCO, NO SE ELIGE ──
       El salto describe `y = 9,6·u(1−u)` con `u = dx/4`, asi que a dos bloques del
       labio el cuerpo esta en 2,40 y el orbe se engancha si su y esta a menos de
       0,95 de `y + 0,43`. La primera version los puso en 2,0 a CUATRO bloques del
       labio, donde el arco ya bajo a 0,37: medido, la diferencia daba 1,20 y el
       orbe NO se enganchaba — el bot no saltaba nunca porque las dos ramas morian,
       y eso es exactamente la firma de un tramo imposible. A 2,5 de alto y cada
       cuatro bloques —que es lo que mide un salto— la cadena se engancha sola.
       Y todos amarillos: el rosa impulsa 0,72, o sea un arco de 2,88 bloques, y
       en el medio de una cadena de cuatro eso deja al jugador corto. */
    P.hueco(x + 4, x + 16);
    P.orbe(x + 6, 2.5, 'amar');
    P.orbe(x + 10, 2.5, 'amar');
    P.orbe(x + 14, 2.5, 'amar');
    P.moneda(x + 10, 4.6);
    P.pico(x + 20); P.pico(x + 24);
  }
};

function generaNivel(id, semilla){
  const N = NIVELES[id];
  sem((semilla || 1)*7919 + id*104729 + 11);
  const M = MUNDO;
  M.nivel = id; M.med = medidasDe(N.bpm);
  M.sol.length = 0; M.mat.length = 0; M.pads.length = 0; M.orbes.length = 0;
  M.portales.length = 0; M.monedas.length = 0; M.sierras.length = 0; M.techo.length = 0;
  M.tramos = [];
  M.largo = LARGO_NIVEL;

  /* la caja de herramientas de los tramos. Va como metodos y no como funciones
     sueltas para que un tramo no pueda escribir en otra cosa. */
  const huecos = [];
  const P = {
    pico(x){ M.mat.push(rect(x + 0.18, 0, 0.64, 0.82, 'pico')); },
    /* el pico invertido cuelga del techo, o sea que su punta mira abajo */
    picoInv(x, alto){ M.mat.push(rect(x + 0.18, alto - 0.82, 0.64, 0.82, 'picoInv')); },
    bloque(x, y, w, h){ M.sol.push(rect(x, y, w, h, 'bloque')); },
    sierra(x, y, r){ M.sierras.push({ x, y, r });
                     M.mat.push(rect(x - r*0.66, y - r*0.66, r*1.32, r*1.32, 'sierra')); },
    pad(x, t){ M.pads.push({ x, y: 0, t: t || 'amar' }); },
    orbe(x, y, t){ M.orbes.push({ x, y, t: t || 'amar', usado: false }); },
    moneda(x, y){ if (M.monedas.length < 3) M.monedas.push({ x, y, tomada: false }); },
    hueco(a, b){ huecos.push([a, b]); },
    /* el techo va a las DOS listas: `techo` es para dibujarlo y `sol` para que
       choque. Con una sola, el techo se ve y no frena, o frena y no se ve. */
    techo(x, w, alto){
      M.techo.push(rect(x, alto, w, 1.4, 'techo'));
      M.sol.push(rect(x, alto, w, 1.4, 'techo'));
    }
  };

  /* ── LOS PORTALES SE PONEN AL ARMAR EL TRAMO, NO EN UNA SEGUNDA LISTA ──
     Con dos listas —los tramos y sus portales— el dia que se mueva un tramo el
     portal queda donde estaba y el modo cambia a mitad de camino. */
  for (let i = 0; i < TRAMOS.length; i++){
    const T = TRAMOS[i], ant = i > 0 ? TRAMOS[i - 1] : null;
    if (ant && ant.modo !== T.modo) M.portales.push({ x: T.x + 1.0, t: T.modo });
    M.tramos.push({ x: T.x, w: T.w, modo: T.modo, pal: i });
    ARMA[T.arma](P, T.x, T.w);
  }

  /* ── EL PISO SE ARMA AL FINAL, DESCONTANDO LOS HUECOS ──
     Al revés —piso entero y después agujerearlo— habría que partir rectángulos
     que ya existen, y eso deja bordes duplicados que el choque resuelve dos veces. */
  huecos.sort((a, b) => a[0] - b[0]);
  let px = -20;
  for (const [a, b] of huecos){
    if (a > px) M.sol.push(rect(px, -6, a - px, 6, 'piso'));
    px = Math.max(px, b);
  }
  M.sol.push(rect(px, -6, M.largo + 40 - px, 6, 'piso'));
  /* la pared del final: no se puede pasar de largo */
  M.sol.push(rect(M.largo + 2, -6, 4, 30, 'meta'));
  indexaMundo();
  M.rev++;
  return M;
}

/* ── EL TRAMO EN EL QUE ESTA UNA X ──
   Lo usan la paleta y el rotulo del HUD. Con diez tramos una busqueda lineal
   alcanza, y con un modulo el color cambiaria a mitad de tramo — que es justo lo
   que los portales existen para evitar. */
function tramoDe(x){
  const L = MUNDO.tramos;
  for (let i = L.length - 1; i >= 0; i--) if (x >= L[i].x) return L[i];
  return L[0] || null;
}

/* ── EL SITIO EN BLOQUES DE UN TIEMPO DE COMPAS, Y AL REVES ──
   Estas dos son la juntura entre la musica y el nivel, y por eso viven en un
   solo sitio: con la cuenta escrita en dos lados, el dia que cambie
   `BLOQ_POR_TIEMPO` una de las dos queda apuntando a otro juego. */
const xDeTiempo = (t) => t*BLOQ_POR_TIEMPO;
const tiempoDeX = (x) => x/BLOQ_POR_TIEMPO;

/* ══════════ EL INDICE POR BLOQUE ══════════
   Sin esto el choque recorre los ~250 rectangulos del nivel en CADA paso, y el
   auto-jugador da varios miles de pasos por rama: validar tres niveles pasaria
   de segundos a minutos. Cada balde `i` guarda lo que se solapa con [i-1, i+2),
   asi que consultando por el bloque del jugador no hace falta mirar los vecinos.
   EL DESPLAZAMIENTO NO ES DECORATIVO: el piso arranca en x = -20 y la meta
   termina en largo+6, asi que sin corrimiento los indices negativos se recortan
   a cero y el primer bloque del nivel se consulta en el balde equivocado. */
const IDX_OFS = 26;
const VACIO = [];
function indexaLista(lista, largo){
  const idx = new Array(largo + IDX_OFS*2);
  for (const r of lista){
    const a = cl(Math.floor(r.x) - 1 + IDX_OFS, 0, idx.length - 1);
    const b = cl(Math.ceil(r.x + r.w) + 1 + IDX_OFS, 0, idx.length - 1);
    for (let i = a; i <= b; i++){ (idx[i] || (idx[i] = [])).push(r); }
  }
  for (let i = 0; i < idx.length; i++) if (!idx[i]) idx[i] = VACIO;
  return idx;
}
function cerca(idx, x){
  const i = Math.floor(x) + IDX_OFS;
  return (i >= 0 && i < idx.length) ? idx[i] : VACIO;
}
function indexaMundo(){
  MUNDO.iSol = indexaLista(MUNDO.sol, MUNDO.largo + 40);
  MUNDO.iMat = indexaLista(MUNDO.mat, MUNDO.largo + 40);
}

/* ══════════════════════ EL JUGADOR Y LOS MODOS ══════════════════════
   ── LA X NO SE INTEGRA: SALE DEL RELOJ DE LA MUSICA ──
   `x = tiempoMusical · 4 bloques`. Integrando la x con la fisica, una tanda de
   cuadros perdidos correria el nivel respecto del tema y el juego dejaria de
   estar en tiempo — que es el unico defecto que este genero no se puede permitir.
   Lo que si se integra es la Y, que es lo que el jugador controla.

   ── Y ES UN CUERPO CUALQUIERA, NO `J` ──
   Asi el auto-jugador puede PROBAR un salto antes de darlo: copia el estado, lo
   vuela un tiempo y mira si sobrevive. Con la fisica atada al jugador de verdad
   habria que escribir una segunda fisica para el bot, y entonces el bot estaria
   jugando otro juego. */
const JUG = { x: 0, y: 0, vy: 0, grav: 1, modo: 'cubo', piso: false,
              vivo: true, giro: 0, apretado: false, carga: 0, mira: -1 };

function jugPone(c, x){
  c.x = x; c.y = 0; c.vy = 0; c.grav = 1; c.modo = 'cubo';
  c.piso = true; c.vivo = true; c.giro = 0; c.apretado = false;
  c.carga = 0; c.mira = -1;
  /* ── LOS ORBES USADOS VIVEN EN EL CUERPO Y NO EN EL MUNDO ──
     Un orbe se gasta por INTENTO, y el bot corre docenas de intentos imaginarios
     por cuadro: con la marca en `MUNDO.orbes[i].usado`, un rollout que engancha
     el orbe siguiente lo deja gastado para el cuerpo de verdad, y el jugador
     llega a un orbe que ya nadie puede tocar. Medido: el bot moria en el segundo
     orbe de la cadena del final por esto y no por la geometria. La marca es del
     cuerpo, `copia()` se la lleva, y el mundo solo se entera de lo que gasta el
     jugador —que es lo que el dibujo necesita para apagarlo. */
  c.uso = new Uint8Array(MUNDO.orbes.length);
}

/* la caja del jugador: un poco mas chica que su celda, que es lo que hace que
   pasar raspando un pico se sienta a pasar raspando y no a morir de casualidad */
function caja(c){
  const h = JUG_LADO;
  return { x: c.x - h/2, y: c.y, w: h, h: h };
}
const pisa = (A, B) => A.x < B.x + B.w && A.x + A.w > B.x && A.y < B.y + B.h && A.y + A.h > B.y;

/* ── LA CARA DE ENFRENTE, QUE ES LO QUE LA ARANA NECESITA ──
   Devuelve la `y` a la que quedaria el cuerpo apoyado en la superficie opuesta, o
   `null` si no hay ninguna. Se busca la MAS CERCANA, que es la que la arana
   alcanza: con la mas lejana, un tramo con dos techos teletransportaria por
   encima del de al lado. */
function caraDeEnfrente(c){
  const h = JUG_LADO;
  let mejor = null;
  for (const r of cerca(MUNDO.iSol, c.x)){
    if (r.x > c.x + h/2 || r.x + r.w < c.x - h/2) continue;
    if (c.grav > 0){
      /* apoyado en el piso: la cara de enfrente es la de abajo de algo de arriba */
      if (r.y < c.y + h - 0.02) continue;
      const d = r.y - h;
      if (mejor == null || d < mejor) mejor = d;
    } else {
      if (r.y + r.h > c.y + 0.02) continue;
      const d = r.y + r.h;
      if (mejor == null || d > mejor) mejor = d;
    }
  }
  return mejor;
}

/* ── EL CHOQUE RESUELVE PRIMERO LA Y Y DESPUES PREGUNTA POR LA X ──
   Es la regla del genero: por arriba se apoya, de costado se muere. Con la X
   resuelta primero, el cubo trepa las paredes y el juego se vuelve trivial. */
function chocaCuerpo(c, med, dt){
  /* ── CAERSE DEL MUNDO MATA, Y ESO NO ERA OBVIO ──
     Medido: sin plano de muerte, caer en un hueco no mata a nadie — la y se va a
     −7753 y el jugador SIGUE avanzando por debajo del nivel hasta la meta. O sea
     que el bot que apretaba al azar terminaba los tres temas al 100 %, que es la
     firma exacta de un juego en el que nada importa. Con el plano, el hueco pasa
     a ser el unico obstaculo que castiga apretar sin parar. */
  if (c.y < -3 || c.y > 20){ c.vivo = false; return; }
  c.piso = false;
  const b = caja(c);
  for (const r of cerca(MUNDO.iSol, c.x)){
    if (!pisa(b, r)) continue;
    const dArriba = (r.y + r.h) - b.y;          /* cuanto entro por abajo */
    const dAbajo = (b.y + b.h) - r.y;           /* cuanto entro por arriba */
    const dIzq = (b.x + b.w) - r.x;
    const dDer = (r.x + r.w) - b.x;
    const vert = Math.min(dArriba, dAbajo), hor = Math.min(dIzq, dDer);
    /* ── EL EJE DE MENOR PENETRACION ES EL UNICO QUE NO SE EQUIVOCA ──
       Es la misma regla que en CASTILLO y en PISTOLA. Con la normal sacada de
       centro a centro, un cubo medio metido en una losa se resuelve HACIA ADENTRO. */
    if (vert <= hor + 0.02){
      /* ── EL GOLPE DEL ATERRIZAJE SE MIDE ANTES DE PONER LA VELOCIDAD EN CERO ──
         Y sale del propio `vy`, asi que un salto largo aplasta mas que un
         escaloncito. Solo para el jugador de verdad: `chocaCuerpo` la corren
         tambien las copias del bot, y si el bot sacudiera la camara los efectos
         irian por un camino que el dedo no recorre. */
      const golpe = Math.abs(c.vy);
      if (dArriba < dAbajo){
        /* apoyado sobre la cara de arriba del solido */
        if (c.vy <= 0.001 || c.grav > 0){ c.y = r.y + r.h; c.vy = 0; if (c.grav > 0) c.piso = true; }
        else { c.y = r.y + r.h; c.vy = 0; }
      } else {
        c.y = r.y - b.h; c.vy = 0; if (c.grav < 0) c.piso = true;
      }
      if (c === JUG && c.piso && golpe > 4){
        golpeaSq(Math.min(4.2, golpe*0.16));
        sacude(Math.min(0.30, golpe*0.010));
      }
      b.y = c.y;
    } else {
      /* entro de costado: en este genero eso es morirse */
      c.vivo = false; return;
    }
  }
  for (const r of cerca(MUNDO.iMat, c.x)) if (pisa(caja(c), r)){ c.vivo = false; return; }
}

/* ── UN PASO DE FISICA ──
   Paso fijo: un telefono a 30 y una notebook a 144 tienen que jugar el mismo
   juego, si no el salto mide distinto y los patrones dejan de servir. */
function pasoCuerpo(c, med, dt, apretado){
  /* ── EL FLANCO SE CALCULA ANTES DE PISAR `apretado` ──
     Cuatro de los ocho modos se manejan con TOQUES y no con MANTENER —la bola,
     el ovni, la arana y el robot— asi que hace falta saber si el dedo acaba de
     bajar. Y va aca adentro, no en el manejador del dedo: asi el bot entra por
     el mismo camino y su decision es la misma decision. */
  const flanco = !!apretado && !c.apretado;
  c.apretado = !!apretado;
  const M = c.modo;

  if (M === 'nave'){
    /* la nave: mantener acelera hacia arriba y soltar hacia abajo. Lo que se
       controla es la CURVA, no la velocidad — con velocidad directa se lee a
       ascensor y deja de haber inercia que administrar. */
    c.vy += (apretado ? med.naveA : -med.naveA)*dt*c.grav;
    c.vy = cl(c.vy, -med.naveMax, med.naveMax);
    c.giro = cl(c.vy/med.naveMax, -1, 1)*0.5;

  } else if (M === 'columpio'){
    /* ── EL COLUMPIO ES LA GRAVEDAD QUE SE DA VUELTA, NO UN MOTOR ──
       Es la diferencia con la nave y es la que hace que se sienta otro modo: la
       nave EMPUJA mientras se mantiene, y el columpio invierte la gravedad, asi
       que el arco es simetrico y no hay techo de velocidad que lo aplaste.
       Igual lleva tope, porque sin el, un pasillo largo lo pone a caer mas rapido
       de lo que el pasillo mide. */
    const dir = apretado ? 1 : -1;
    c.vy += med.colA*dt*c.grav*dir;
    c.vy = cl(c.vy, -med.colMax, med.colMax);
    c.giro = cl(c.vy/med.colMax, -1, 1)*0.42;
    c.mira = dir;

  } else if (M === 'onda'){
    /* ── LA ONDA VA A CUARENTA Y CINCO GRADOS EXACTOS, Y ESO SALE DE UNA CUENTA ──
       No hay aceleracion ni inercia: la velocidad vertical es la MISMA que la
       horizontal, asi que la trayectoria es una diagonal perfecta. Y como la x
       sale del reloj —`v` bloques por segundo— la vertical es `v` y nada mas.
       Por eso este modo es el mas dificil del genero: no perdona un cuadro. */
    c.vy = (apretado ? 1 : -1)*med.v*c.grav;
    c.giro = (apretado ? 1 : -1)*c.grav*0.72;

  } else if (M === 'bola'){
    /* la bola no salta: cada toque DA VUELTA la gravedad, y solo apoyada. En el
       aire el toque no hace nada, que es lo que obliga a tocar en el momento. */
    if (flanco && c.piso){
      c.grav = -c.grav; c.piso = false; c.vy = 0;
      if (c === JUG){ son('salta'); golpeaSq(-2.6); destella('#7ad9ff', 0.22); }
    }
    c.vy -= med.g*dt*c.grav;
    /* la bola RUEDA: el giro sale del avance y no del tiempo en el aire */
    c.giro -= med.v*dt*0.55*c.grav;

  } else if (M === 'ovni'){
    /* el ovni salta EN EL AIRE, tantas veces como se toque. Lo que lo acota es
       que el impulso es chico —dos bloques de apice contra los 2,4 del cubo— asi
       que subir cuesta varios toques y cada uno se paga. */
    if (flanco){
      c.vy = med.impOvni*c.grav; c.piso = false;
      if (c === JUG){ son('salta'); golpeaSq(-2.8); destella('#c9a7ff', 0.20); }
    }
    c.vy -= med.g*dt*c.grav;
    c.giro = cl(c.vy/med.impOvni, -1, 1)*0.16;

  } else if (M === 'robot'){
    /* ── EL ROBOT CARGA EL SALTO MIENTRAS SE MANTIENE ──
       El impulso arranca en el minimo y sube mientras el dedo siga abajo, hasta
       `robotT` segundos. De ahi sale un apice variable —de 1,54 a 3,52 bloques—
       y con eso el modo pide algo que ningun otro pide: MEDIR cuanto tiempo se
       aprieta. Se implementa poniendo la velocidad, no sumando fuerza: sumando,
       el apice depende del cuadro en que se suelte y no del tiempo apretado. */
    if (flanco && c.piso){
      c.piso = false; c.carga = 0; c.vy = med.robotMin*c.grav;
      if (c === JUG){ son('salta'); golpeaSq(-2.4); }
    }
    if (apretado && c.carga != null && c.carga < med.robotT && c.vy*c.grav > 0){
      c.carga += dt;
      const k = cl(c.carga/med.robotT, 0, 1);
      c.vy = (med.robotMin + (med.robotMax - med.robotMin)*k)*c.grav;
    }
    c.vy -= med.g*dt*c.grav;
    if (!c.piso) c.giro += med.v*dt*0.20*c.grav;
    else c.giro = 0;

  } else if (M === 'arana'){
    /* ── LA ARANA NO SALTA: SE TELETRANSPORTA A LA OTRA CARA ──
       Y eso no se puede escribir como un impulso: hay que BUSCAR la superficie
       de enfrente, porque si no hay ninguna el toque no puede hacer nada. Con un
       impulso, un toque sin techo mandaria la arana al vacio. */
    if (flanco){
      const d = caraDeEnfrente(c);
      if (d != null){
        c.y = d; c.grav = -c.grav; c.vy = 0; c.piso = true;
        if (c === JUG){ son('portal'); golpeaSq(2.2); sacude(0.18);
                        destella('#ff7ae0', 0.26); }
      }
    }
    c.vy -= med.g*dt*c.grav;
    c.giro = 0;

  } else {
    /* ── EL CUBO: MANTENER APRETADO SALTA EN CADENA, Y VA ACA Y NO EN EL DEDO ──
       Es la regla del genero, y ponerlo dentro del paso de fisica es lo que hace
       que el jugador y el bot usen EL MISMO camino. Estaba solo en el manejador
       del toque, o sea que `avanza()` no saltaba nunca: medido, el bot que
       apretaba en cada paso moria en el mismo pico y en la misma x (39,8) que el
       que no apretaba nunca — la firma exacta de una entrada que no hace nada. */
    if (apretado) intentaSalto(c, med);
    c.vy -= med.g*dt*c.grav;
    /* el cubo gira mientras esta en el aire y se endereza al caer: es lo unico
       que dice, sin texto, que el cubo no controla nada mientras vuela */
    if (!c.piso) c.giro += med.v*dt*0.42*c.grav;
    else c.giro = Math.round(c.giro/(Math.PI/2))*(Math.PI/2);
  }
  c.y += c.vy*dt;
  chocaCuerpo(c, med, dt);
  if (!c.vivo) return;

  /* ── EL PAD LANZA SIN QUE HAYA QUE TOCAR; EL ORBE HAY QUE TOCARLO ──
     Es la diferencia del genero y hay que respetarla: el pad es geometria, el
     orbe es una decision. */
  const b = caja(c);
  /* ── LOS PADS SON GEOMETRIA Y LOS ORBES SON UNA DECISION ──
     El pad lanza al pisarlo, se quiera o no; el orbe hay que APRETARLO estando
     encima. Es la diferencia del genero y hay que respetarla, porque es lo que
     convierte un orbe en una prueba de tiempo y un pad en una consecuencia. */
  for (const p of MUNDO.pads){
    if (Math.abs(p.x + 0.5 - c.x) > 0.75) continue;
    if (Math.abs(c.y - p.y) > 0.55) continue;
    const k = PAD_K[p.t] || 1;
    if (p.t === 'azul'){
      /* el pad azul da vuelta la gravedad y empuja hacia el otro lado */
      c.grav = -c.grav; c.vy = med.imp*0.86*c.grav;
    } else c.vy = med.impPad*k*c.grav;
    c.piso = false;
    if (c === JUG){ son('pad'); golpeaSq(-4.7*Math.min(1.2, k)); sacude(0.40);
                    destella(PAD_COL[p.t] || '#ffd447', 0.42); }
  }
  /* ── LOS OCHO ORBES DE GEOMETRY DASH ──
     amarillo salta medio, rosa poco, rojo mucho, azul da vuelta la gravedad,
     verde salta Y la da vuelta, negro clava hacia abajo, arana pega a la cara de
     enfrente y el de guion empuja. Cada uno es una linea, y estan todos en la
     MISMA lista porque lo que los distingue es el tipo y no el camino. */
  for (let oi = 0; oi < MUNDO.orbes.length; oi++){
    const o = MUNDO.orbes[oi];
    if (!apretado || (c.uso && c.uso[oi])) continue;
    if (Math.abs(o.x - c.x) > 0.95 || Math.abs(o.y - (c.y + 0.43)) > 0.95) continue;
    const t = o.t || 'amar';
    if (t === 'azul'){ c.grav = -c.grav; c.vy = med.imp*0.62*c.grav; }
    else if (t === 'verde'){ c.grav = -c.grav; c.vy = med.imp*c.grav; }
    else if (t === 'negro'){ c.vy = -med.imp*1.15*c.grav; }
    else if (t === 'arana'){
      const d = caraDeEnfrente(c);
      if (d == null) continue;                 /* sin cara de enfrente no sirve */
      c.y = d; c.grav = -c.grav; c.vy = 0; c.piso = true;
    }
    else c.vy = med.imp*(ORBE_K[t] || 1)*c.grav;
    c.piso = false;
    if (c.uso) c.uso[oi] = 1;
    if (c === JUG){
      o.usado = true;
      son(t === 'negro' ? 'pad' : 'salta');
      golpeaSq(t === 'negro' ? 3.4 : -3.7*(ORBE_K[t] || 1));
      destella(ORBE_COL[t] || '#ffd447', 0.30);
      if (t === 'azul' || t === 'verde' || t === 'arana') sacude(0.20);
    }
  }
  for (const p of MUNDO.portales){
    if (Math.abs(p.x - c.x) > 0.55) continue;
    let cambio = false;
    if (p.t === 'grav'){ if (c.grav > 0){ c.grav = -1; c.vy = 0; cambio = true; } }
    else if (p.t === 'norm'){ if (c.grav < 0){ c.grav = 1; c.vy = 0; cambio = true; } }
    else if (MODOS[p.t]){
      if (c.modo !== p.t){
        c.modo = p.t; c.carga = 0; c.giro = 0; cambio = true;
        /* ── AL CAMBIAR DE MODO LA VELOCIDAD SE ACOMODA AL MODO NUEVO ──
           La onda va a 45 grados exactos y la nave tiene tope: entrando con la
           velocidad de una caida de cubo, el primer cuadro del tramo nuevo saldria
           de la trayectoria antes de que el jugador toque nada. */
        if (p.t === 'onda' || p.t === 'nave' || p.t === 'columpio') c.vy = 0;
      }
    }
    /* ── UN CAMBIO DE MODO SE ANUNCIA CON UN TIRON DE CAMARA ──
       Es lo unico que dice, sin texto, que las reglas acaban de cambiar. */
    if (cambio && c === JUG){
      son('portal'); acerca(0.09); sacude(0.34);
      destella(MODO_COL[p.t] || '#5ad9ff', 0.5);
    }
  }
}

/* ── SALTAR ES UNA SOLA FUNCION, Y LA LLAMAN EL DEDO Y EL BOT ──
   Con dos caminos, el dia que el salto cambie el bot estaria midiendo otro
   juego. Y en el cubo solo se puede saltar DESDE EL PISO, que es la regla del
   genero: mantener apretado salta en cadena porque el toque queda pedido. */
function intentaSalto(c, med){
  if (c.modo !== 'cubo') return false;
  if (!c.piso) return false;
  c.vy = med.imp*c.grav; c.piso = false;
  if (c === JUG){ son('salta'); golpeaSq(-3.3); }
  return true;
}

/* ══════════════════════════ EL DIBUJO, EN 3D ══════════════════════════
   ── LA JUGABILIDAD SIGUE SIENDO DEL PLANO XY, Y ESO NO ES UNA CONCESION ──
   El genero ES de dos ejes: se avanza y se salta, y nada mas. Lo que pasa a ser
   tridimensional es el MUNDO — los bloques se extruyen, el cubo tumbea de verdad,
   hay luz, sombra de contacto y perspectiva. Meter el juego en tres ejes seria
   otro juego, no este mejor dibujado.

   ── LA CAMARA MIRA DERECHO POR −Z, Y ESA ES LA DECISION QUE SOSTIENE TODO ──
   Con la camara inclinada, la proyeccion deja de ser lineal y la x de un pico en
   pantalla depende de su altura: en un juego donde hay que despegar en un bloque
   exacto, eso es injugable. Mirando derecho, x e y son EXACTAMENTE lineales sobre
   el plano de juego, y el volumen igual se lee: la camara va a la altura del
   medio de la banda visible, o sea POR ENCIMA de los bloques bajos, asi que se
   les ve la cara de arriba. Es el mismo encuadre de cualquier 2,5D.

   ── Y TODO COMPARTE EL PLANO z = 0 POR DELANTE ──
   Los solidos se extruyen hacia ATRAS (z de −PROF a 0) y el jugador tambien
   (z de −0,86 a 0). Si el cubo asomara hacia la camara, la perspectiva lo
   agrandaria un 4,5 % y con el a un 30 % del ancho eso lo correria 0,18 bloques
   respecto de los picos: se veria desalineado justo donde hay que medir. */

const cv = $('cv');
let ANCHO = 0, ALTO = 0, ESC = 1, U = 20;   /* U = pixeles por bloque, para las sondas */
const PROF = 1.6;                            /* cuanto se extruyen los solidos */
/* ── EL PISO SE EXTRUYE CUARENTA Y SEIS BLOQUES Y NO 1,6 ──
   Con la camara a 2,77 de alto, una superficie horizontal de 1,6 de fondo se ve
   como una FRANJA de dos centimetros y por encima aparece cielo a la altura del
   suelo: medido en la foto, el piso era una banda y arriba de ella el horizonte
   estaba roto. Extruido hasta la niebla, el suelo se pierde en el fondo y eso es
   justamente lo que hace que la escena se lea a profunda. */
/* ── Y ES LARGO PORQUE SU BORDE LEJANO NO PUEDE VERSE ──
   Con 70 bloques, la niebla se come el 56 % en el borde y quedaba una LINEA DURA
   cruzando la pantalla: las torres de las tres capas cortaban todas en esa misma
   fila y se leian como apoyadas en una repisa, no a tres distancias. Con 140 la
   niebla se lleva el 96 % y el suelo se funde con el cielo en el horizonte, asi
   que cada torre corta donde le toca por su propia z. */
const PROF_PISO = 140;
/* ── EL TECHO DE UN PASILLO NO SE EXTRUYE COMO EL SUELO, Y ESO SE MIDIO ──
   El suelo mide 140 de fondo porque tiene que llegar hasta donde la niebla lo
   cierra: con densidad 0,013, un 95 % de niebla cae en 133 bloques, asi que el
   numero esta derivado y no elegido. Un TECHO no: su cara de abajo no recibe sol
   —solo ambiente y el rebote del hemisferico— asi que extruida 140 bloques es una
   cuna casi negra de un tercio de pantalla, y su cara de +X, que la niebla lleva
   al color del horizonte, aparece adentro del pasillo como dos triangulos beige
   cruzando la banda de juego (medido en el tramo de la onda). Con 6,5 de fondo el
   techo se lee a viga —el mismo lenguaje que los bloques, que miden 1,6— y las
   dos caras problematicas se quedan en un canto. */
const PROF_TECHO = 6.5;
const FOV_Y = 50;

const ren = new T.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
ren.setClearColor(0x05060a, 1);
ren.outputColorSpace = T.SRGBColorSpace;
ren.toneMapping = T.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.15;
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;
ren.info.autoReset = false;

const esc3 = new T.Scene();
const cam = new T.PerspectiveCamera(FOV_Y, 2, 0.1, 260);
/* mira derecho por −Z: sin rotacion, y por eso la proyeccion es lineal */
esc3.add(cam);

/* ══════════ LA LUZ ══════════
   Una direccional con sombra —que es lo unico que apoya al cubo sobre el piso— y
   un hemisferico que le pone color al ambiente. Y el hemisferico NO puede tener
   el suelo negro: una cara que no mira al cielo recibiria cero, que es lo que en
   ECO dejo un ovalo malva plano y en BARRIO las casas en silueta. */
/* ── LA SOMBRA ES UNA PISTA, NO UN AGUJERO ──
   Con la direccional a 2,1 y poco ambiente, la zona sombreada quedaba casi negra
   y en el pasillo de la nave las sombras de las paredes de arriba se leian a
   manchones sueltos sobre el piso. Bajando la direccional y subiendo el ambiente,
   una sombra oscurece a la mitad en vez de borrar: la de contacto del cubo se
   sigue viendo —que es la que importa— y las otras pasan a ser un matiz. */
const sol = new T.DirectionalLight(0xffffff, 1.45);
sol.position.set(7, 12, 9);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
sol.shadow.camera.near = 1; sol.shadow.camera.far = 60;
sol.shadow.bias = -0.0012; sol.shadow.normalBias = 0.03;
esc3.add(sol);
esc3.add(sol.target);
const hemi = new T.HemisphereLight(0x9fc8ff, 0x2a2f3d, 0.70);
esc3.add(hemi);
/* ── Y UN AMBIENTE PARO, QUE HACE FALTA POR UNA RAZON DE JUEGO ──
   En gravedad invertida se camina sobre la CARA DE ABAJO del techo, y una cara
   que mira al piso no recibe nada de una direccional de arriba: sin ambiente,
   la superficie que hay que pisar sale negra. */
const amb = new T.AmbientLight(0x4a5570, 0.95);
esc3.add(amb);
/* la niebla es densa a proposito: es lo que come el borde lejano del suelo. En el
   plano de juego (z ~ 0) no tiñe nada; a 46 bloques se lleva una cuarta parte y a
   125 —donde vive la capa lejana— casi todo, que es lo que la deja como una
   insinuacion en el horizonte en vez de un dibujo. */
const NIEBLA = new T.FogExp2(0x101c30, 0.013);
esc3.fog = NIEBLA;

/* ══════════ LOS MATERIALES ══════════
   Uno por familia y no uno por objeto: cada material es un programa compilado y
   una llamada de dibujo. El color del tema se reescribe al cambiar de nivel. */
const matSol  = new T.MeshLambertMaterial({ color: 0x171e2d });
const matPiso = new T.MeshLambertMaterial({ color: 0x2a3448 });
const matCanto = new T.MeshBasicMaterial({ color: 0x2de2a8 });
const matPico = new T.MeshLambertMaterial({ color: 0xeef4ff, emissive: 0x7f8fa6, emissiveIntensity: 0.35 });
const matPad  = new T.MeshBasicMaterial({ color: 0xffffff });
const matOrbe = new T.MeshBasicMaterial({ color: 0xffffff });
const matSierra = new T.MeshLambertMaterial({ color: 0xdfe7f2, emissive: 0x445064, emissiveIntensity: 0.4 });
const matMoneda = new T.MeshLambertMaterial({ color: 0xffd447, emissive: 0x8a6a10, emissiveIntensity: 0.7 });
/* ── EL FALDON DEL SUELO VA SIN LUZ, Y ESA ES LA RAZON DE QUE EXISTA ──
   La cara de adelante del piso, con Lambert y una luz casi vertical, medida en la
   captura daba (1, 3, 7): negra. Son ochenta y cinco pixeles de los 412 —el 21 %
   de la pantalla— sin un solo dato. Un material SIN LUZ no depende del angulo ni
   de la sombra y no puede salir negro; el degradado vertical le da el aire de
   estar iluminado desde arriba, que es lo que hace que se lea a canto de terreno. */
function lienzoFaldon(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, '#8a8a8a'); gr.addColorStop(1, '#1d1d1d');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const matFaldon = new T.MeshBasicMaterial({ map: lienzoFaldon(), color: 0x3d4a63 });
/* ── UN FALDON DE COSTADO SE PROBO, SE MIDIO Y SE DESCARTO ──
   La cuna oscura de la esquina de arriba parecia ser el CORTE de la losa del
   techo —140 bloques de fondo vistos desde cinco al costado— asi que se le puso
   el mismo faldon sin luz que a la cara de adelante. Y no era: pintando la
   escena con las NORMALES, la cuna resulto DOS superficies encimadas —una que
   mira a +X, que era el faldon nuevo, y detras una que mira ABAJO, que es la cara
   de abajo del techo—. O sea que el faldon tapaba con un plano claro un problema
   que estaba detras. Y encima un plano sin luz no puede ganar en los dos sitios:
   medido, con 0x2b344a se veia demasiado OSCURO contra el cielo de atardecer y
   demasiado CLARO adentro del pasillo de la onda, donde salia como dos triangulos
   beige cruzando la pantalla. Lo que si arreglo la cuna fue la niebla: llevada al
   color del horizonte medido de la foto, el corte se disuelve solo. */

const GEO = {
  caja: new T.BoxGeometry(1, 1, 1),
  /* el pico es una piramide de cuatro caras: `ConeGeometry` con cuatro lados */
  pico: new T.ConeGeometry(0.72, 1, 4, 1),
  esfera: new T.SphereGeometry(0.5, 14, 10),
  aro: new T.TorusGeometry(0.40, 0.09, 8, 18),
  sierra: new T.CylinderGeometry(0.5, 0.5, 0.28, 12),
  part: new T.BoxGeometry(1, 1, 1)
};

/* ══════════ EL CIELO Y LA REJA ══════════
   El cielo va PEGADO A LA CAMARA, asi que no tiene paralaje: es un telon. La reja
   va PLANTADA EN EL MUNDO a z = −28 y su paralaje sale de la perspectiva, gratis
   y sin un solo numero que mantener — que es justo lo que en 2D habia que escribir
   a mano con un factor 0,5. */
/* ── EL CIELO EN EL HORIZONTE VALE EXACTAMENTE LO QUE LA NIEBLA ──
   Y ese numero no se elige: se resuelve. El cielo es un gris multiplicado por
   `CIELO_K` veces el color del nivel, y la niebla es ese color a secas, asi que
   para que el borde lejano del suelo se funda con el cielo hace falta
   `gris_lineal · CIELO_K = 1`, o sea gris 0,4545 en lineal = 180 en sRGB. Con
   otro valor queda una LINEA DURA cruzando la pantalla a la altura del horizonte
   —medida en la captura— y las tres capas de torres cortan todas en esa misma
   fila, asi que se leen apoyadas en una repisa en vez de a tres distancias.
   Por debajo del horizonte el gris se queda quieto: ahi el suelo tapa todo, y si
   siguiera bajando el poco que asoma entre las torres delataria el empalme. */
const CIELO_K = 2.2;
function lienzoCielo(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 128;
  const g = c.getContext('2d');
  const gris = Math.round(255*Math.pow(1/CIELO_K, 1/2.2));
  const hex = '#' + gris.toString(16).padStart(2, '0').repeat(3);
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, hex);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  g.fillStyle = hex; g.fillRect(0, 64, 4, 64);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const matCielo = new T.MeshBasicMaterial({ map: lienzoCielo(), depthWrite: false, fog: false });
const cielo = new T.Mesh(new T.PlaneGeometry(1, 1), matCielo);
cielo.renderOrder = -10; cielo.frustumCulled = false;
cam.add(cielo);

/* ══════════ EL TELON DE FOTO ══════════
   ── VA PEGADO A LA CAMARA, IGUAL QUE EL CIELO ──
   Puesto en el mundo habria que resolver la perspectiva: un punto en y = 0 a
   ciento noventa unidades NO cae en la misma linea de pantalla que el piso, que
   esta a diez — cae veinte veces mas cerca del centro. Pegado a la camara, el
   paralaje se hace corriendo la TEXTURA, y el borde de abajo se coloca resolviendo
   la unica ecuacion que hay: dos puntos caen en la misma linea de pantalla cuando
   `y/dist` coincide, o sea `y_telon = -190·camY/camZ`.

   ── Y SE REPITE EN ESPEJO ──
   Ninguna de estas fotos es continua por los bordes y coserlas ensucia el centro,
   que es lo que mas se mira. Con `MirroredRepeat` la copia de al lado va dada
   vuelta, o sea que los dos bordes que se tocan son EL MISMO borde: la costura no
   puede existir. Es la regla que ya ordeno las texturas de BARRIO. */
const TELON_Z = -190, TELON_COPIAS = 1.25, TELON_PARALAJE = 0.10;
const matTelon = new T.MeshBasicMaterial({ transparent: true, opacity: 0,
                                           depthWrite: false, fog: false });
const telon = new T.Mesh(new T.PlaneGeometry(1, 1), matTelon);
telon.renderOrder = -9; telon.frustumCulled = false; telon.visible = false;
cam.add(telon);
const TELON_TEX = {};
let telonProp = 2.36;
/* ── LA FOTO NO REEMPLAZA NADA HASTA QUE LLEGA ──
   Un data URI se decodifica de forma asincronica: el telon nace apagado y se
   enciende cuando la textura esta lista. Si una falla, ese nivel se dibuja como
   se dibujaba antes —cielo en degradado y las tres capas de rombos— y no hay un
   solo cuadro en negro. */
function telonCarga(){
  if (typeof IMG === 'undefined') return;
  for (const k of ['p0']){
    const t = new T.TextureLoader().load(IMG[k], () => { TELON_TEX[k].listo = true; });
    t.wrapS = T.MirroredRepeatWrapping; t.wrapT = T.ClampToEdgeWrapping;
    t.colorSpace = T.SRGBColorSpace;
    t.repeat.set(TELON_COPIAS, 1);
    TELON_TEX[k] = { tex: t, listo: false,
                     prop: (IMG_TAM[k][0]/IMG_TAM[k][1]) };
  }
  decoCarga();
}
/* ── QUE PIEZAS ESTAN APAGADAS A MANO ──
   Lo consulta el dibujo, y no alcanza con poner `visible = false` desde afuera:
   el telon y la decoracion se prenden solos en cada cuadro —dependen de si su
   textura ya decodifico— asi que un apagado externo dura exactamente un cuadro y
   la foto de diagnostico sale con la pieza puesta. Ya paso: cuatro capturas de
   aislamiento salieron identicas y me llevaron a descartar dos piezas que en
   realidad nunca se habian apagado. */
const OCULTO = {};
function ponTelon(){
  const e = TELON_TEX.p0;
  if (!e || !e.listo || OCULTO.telon){ telon.visible = false; return; }
  telon.visible = true;
  if (matTelon.map !== e.tex){ matTelon.map = e.tex; matTelon.needsUpdate = true;
                               telonProp = e.prop; }
  matTelon.opacity = Math.min(1, matTelon.opacity + 0.08);
  /* el corrimiento de la textura ES el paralaje: mover la camara un bloque tiene
     que correr la imagen `p` bloques de pantalla, o sea `p/VISTA_ANCHO` del ancho
     del plano, o sea eso por las copias que caben */
  e.tex.offset.x = -CAM.x*TELON_PARALAJE*TELON_COPIAS/VISTA_ANCHO;
  const H = Math.abs(TELON_Z)*Math.tan(FOV_Y*Math.PI/360);
  const w = 2*H*cam.aspect*1.02, h = w/telonProp;
  const abajo = -Math.abs(TELON_Z)*cam.position.y/Math.max(0.001, cam.position.z);
  telon.position.set(0, abajo + h*0.5, TELON_Z);
  telon.scale.set(w, h, 1);
}

function lienzoReja(){
  const n = 128, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, n, n);
  g.strokeStyle = '#ffffff'; g.lineWidth = 2;
  g.strokeRect(0.5, 0.5, n - 1, n - 1);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
}
const texReja = lienzoReja();
const matReja = new T.MeshBasicMaterial({ map: texReja, color: 0x2de2a8, transparent: true,
                                          opacity: 0.16, depthWrite: false, alphaMap: texReja });
const reja = new T.Mesh(new T.PlaneGeometry(2600, 300), matReja);
reja.position.set(600, 70, -175);
texReja.repeat.set(2600/4, 300/4);          /* una celda cada cuatro bloques: la grilla del compas */
esc3.add(reja);

/* ══════════ LA DECORACION DE FONDO: SPRITES EN PARALAJE ══════════
   ── EL PARALAJE NO SE PROGRAMA: SALE DE LA PERSPECTIVA ──
   Los sprites van PLANTADOS en el mundo a tres profundidades y su velocidad
   relativa es la que la camara les da. En 2D esto eran tres factores que habia
   que mantener a mano; en 3D es geometria y no puede desincronizarse.

   ── Y LO QUE SE FUE SON LOS ROMBOS ──
   Antes el fondo eran tres capas de rombos y torres dibujados por codigo, con un
   estilo por nivel. Con UN nivel y una foto de horizonte detras, esas capas
   dejaban de aportar silueta y solo ensuciaban: lo que aporta ahora son trece
   objetos DIBUJADOS —cristales, arcos, nubes, engranajes, palmeras, faroles— que
   es lo que el pedido llama sprites de fondo.

   ── UNA MALLA POR SPRITE, Y NO UN ATLAS CON UN SHADER ──
   Un atlas con UV por instancia pide parchear el shader; trece mallas
   instanciadas cuestan trece llamadas de dibujo y ninguna linea de GLSL. A
   diecinueve llamadas de base, trece mas no mueven el cuadro, y cada sprite
   conserva su propia transparencia y su propia proporcion. */
/* ── LAS TRES CAPAS, Y CADA SPRITE VIVE EN UNA SOLA ──
   La primera version ponia los TRECE sprites en las TRES capas con nueve copias
   cada uno: 351 objetos sobre 332 bloques, o sea uno por bloque. Medido en la
   foto, lo que aparecio no fue profundidad sino una CINTA continua de calcomanias
   pegada a la altura del juego, con los mismos valores que el nivel — los orbes
   amarillos del final se perdian contra un arbusto. Con un sprite por capa la
   cinta se parte en tres, y cada capa estrena su propio vocabulario de formas,
   que es lo que de verdad se lee a distancia. */
/* ── EL TAMANO APARENTE SE CUENTA, Y ERA DE BLOQUE ──
   Un objeto a `z` se ve `9,9/(9,9+|z|)` veces su tamano, porque el plano de juego
   esta a 9,9 de la camara. Con la capa de cerca a −34 y 3,4 de alto, un sprite del
   fondo aparecia midiendo **un bloque** — o sea exactamente lo que mide un
   obstaculo, y en el pasillo de la onda una estrella del fondo se leia a moneda.
   Las tres capas estan puestas para que NINGUNA pase de un bloque aparente: 0,36
   a 0,81 · 0,39 a 0,86 · 0,48 a 1,07, y la ultima encima llega con un 76 % de
   niebla. Y el fondo no se va mas lejos que eso porque la niebla lo cerraria: con
   densidad 0,013, a 150 bloques no queda nada que mirar. */
const DECO_Z = [-34, -60, -92];              /* cerca, medio, lejos */
const DECO_ESC = [2.6, 4.4, 8.0];            /* alto en bloques por capa */
/* ── Y LA PERSPECTIVA AEREA VA POR INSTANCIA, NO POR MATERIAL ──
   Una malla tiene UN color y sus instancias viven en las tres capas, asi que el
   tinte por capa tiene que ir en `instanceColor`. Sin el, la capa de 124 bloques
   sale igual de viva que la de 34 y las tres se leen a la misma distancia: eso
   es exactamente lo que hacia que el fondo se pegara encima del nivel. */
/* ── Y LA CAPA DE CERCA TAMBIEN SE APAGA, PORQUE COMPITE ──
   Medido en la foto del pasillo de la onda: con la capa de cerca al 0,92 una
   estrella del fondo se ve del mismo tamano y del mismo valor que un bloque, y
   en un pasillo donde hay que esquivar eso no es decoracion, es un obstaculo que
   no existe. El fondo tiene que estar CLARAMENTE detras en valor, no solo en z. */
const DECO_BRI = [0.86, 0.72, 0.58];         /* cuanto sobrevive de cada capa */
const DECO_N = [4, 6, 8];                    /* copias: pocas y grandes cerca */
const DEC = [];
function decoCarga(){
  if (typeof DECO === 'undefined' || !DECO.length) return;
  for (let i = 0; i < DECO.length; i++){
    const e = DECO[i];
    const t = new T.TextureLoader().load(e.d, () => { DEC[i].listo = true; });
    t.colorSpace = T.SRGBColorSpace;
    const mat = new T.MeshBasicMaterial({ map: t, transparent: false, alphaTest: 0.45,
                                          depthWrite: true, color: 0xffffff });
    /* la capa la decide el indice del sprite: un sprite = una distancia */
    const capa = i % DECO_Z.length;
    const m = new T.InstancedMesh(new T.PlaneGeometry(1, 1), mat, DECO_N[capa]);
    m.frustumCulled = false; m.renderOrder = -5; m.visible = false;
    esc3.add(m);
    DEC.push({ mat, malla: m, prop: e.p, listo: false, capa });
  }
}
/* ── Y SE REPARTEN CON UN AZAR CON SEMILLA, NO CON `Math.random` ──
   Si el sitio de cada objeto se sorteara por cuadro, el fondo parpadearia; y si
   se sorteara al arrancar, el nivel se veria distinto en cada intento. Con la
   posicion como semilla, el fondo ES parte del nivel. */
function armaDeco(N){
  if (!DEC.length) return;
  for (let i = 0; i < DEC.length; i++){
    const D = DEC[i], m = D.malla, capa = D.capa;
    const n = DECO_N[capa];
    const paso = (MUNDO.largo + 90)/n;
    /* flotar o apoyarse no puede depender de la capa: si dependiera, todas las
       nubes quedarian a la misma distancia y el cielo se leeria a una sola capa */
    const flota = ((((i*2654435761) >>> 0) % 5) < 2);
    for (let j = 0; j < n; j++){
      const h = ((((i*2654435761 + j*40503 + capa*1013904223) >>> 0) ^ 0x9e3779b9) >>> 0)/4294967296;
      const h2 = (((i*374761393 + j*668265263 + capa*2246822519) >>> 0))/4294967296;
      const alto = DECO_ESC[capa]*(0.62 + 0.76*h2);
      const ancho = alto*D.prop;
      /* apoyado se hunde un poco en la losa —asi el borde de abajo no dibuja una
         linea recta de punta a punta— y flotando sube con la capa */
      const y = flota ? 5.0 + h*7.5 + capa*2.2 : alto*0.5 - alto*0.16;
      const x = -30 + (j + h)*paso;
      _m4.compose(_v.set(x, y, DECO_Z[capa] + h2*6),
                  _q.identity(), _v2.set(ancho, alto, 1));
      m.setMatrixAt(j, _m4);
    }
    m.count = n;
    m.instanceMatrix.needsUpdate = true;
  }
}

/* ── LAS MOTAS LEJANAS ──
   Son lo unico del fondo que se mueve por su cuenta, y late con el compas: un
   cielo perfectamente quieto detras de un juego de ritmo se lee a papel tapiz.
   Van instanciadas y su posicion sale de una semilla, asi que no hay estado que
   guardar ni un array de doscientas cosas que recorrer en JavaScript. */
const matMotas = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true,
                                           opacity: 0.5, depthWrite: false });
const MOTAS_TOPE = 180;
const mMotas = new T.InstancedMesh(new T.PlaneGeometry(1, 1), matMotas, MOTAS_TOPE);
mMotas.frustumCulled = false; mMotas.renderOrder = -6;
esc3.add(mMotas);

/* ══════════ LAS MALLAS DEL NIVEL ══════════
   Se rearman cuando cambia el nivel, y el disparador es una REVISION que
   `generaNivel` incrementa: con una llamada explicita, el dia que se agregue un
   camino que genere un nivel (el demo del menu, una sonda) se olvida y se dibuja
   el nivel anterior. */
let REV3D = -1;
const INST = { sol: null, piso: null, canto: null, pico: null, pad: null, orbe: null,
               faldon: null };
const SUELTOS = [];                          /* sierras, monedas y portales */

function tiraInst(k){
  if (INST[k]){ esc3.remove(INST[k]); INST[k].dispose(); INST[k] = null; }
}
function nuevaInst(k, geo, mat, n, sombra){
  tiraInst(k);
  if (!n) return null;
  const m = new T.InstancedMesh(geo, mat, n);
  m.frustumCulled = false;
  m.castShadow = !!sombra; m.receiveShadow = !!sombra;
  esc3.add(m); INST[k] = m; return m;
}

const _m4 = new T.Matrix4(), _q = new T.Quaternion(), _v = new T.Vector3(),
      _v2 = new T.Vector3(), _e = new T.Euler();
function ponCaja(malla, i, x, y, w, h, z, d){
  _m4.compose(new T.Vector3(x + w/2, y + h/2, (z == null ? -PROF/2 : z)),
              _q.identity(), new T.Vector3(w, h, d == null ? PROF : d));
  malla.setMatrixAt(i, _m4);
}

function mundo3D(){
  const N = NIVELES[MUNDO.nivel];
  ponPaleta(N);

  /* los solidos van en DOS mallas —el piso y el resto— porque son dos colores y
     un `InstancedMesh` tiene un solo material */
  const pisos = MUNDO.sol.filter(r => r.t === 'piso' || r.t === 'techo');
  const cajas = MUNDO.sol.filter(r => r.t !== 'piso' && r.t !== 'techo');
  /* ── EL PISO RECIBE SOMBRA PERO NO LA PROYECTA ──
     Es una losa de cuarenta y seis bloques de fondo: proyectando, el techo del
     pasillo de la nave sombrea el suelo ENTERO y lo que aparece son manchones
     oscuros con el borde del mapa de sombra dibujado. Medido en la foto del
     tramo de nave, tres manchas en el medio del pasillo. Proyectan los bloques y
     el jugador, que son lo que hay que poder apoyar. */
  const mp = nuevaInst('piso', GEO.caja, matPiso, pisos.length, false);
  mp.receiveShadow = true;
  pisos.forEach((r, i) => {
    const d = r.t === 'techo' ? PROF_TECHO : PROF_PISO;
    ponCaja(mp, i, r.x, r.y, r.w, r.h, -d/2, d);
  });
  mp.instanceMatrix.needsUpdate = true;

  /* el faldon: un plano por delante de la cara de adelante de cada piso */
  const mf = nuevaInst('faldon', new T.PlaneGeometry(1, 1), matFaldon, pisos.length, false);
  pisos.forEach((r, i) => {
    _m4.compose(new T.Vector3(r.x + r.w/2, r.y + r.h/2, 0.012), _q.identity(),
                new T.Vector3(r.w, r.h, 1));
    mf.setMatrixAt(i, _m4);
  });
  mf.instanceMatrix.needsUpdate = true;

  const mc = nuevaInst('sol', GEO.caja, matSol, cajas.length, true);
  cajas.forEach((r, i) => ponCaja(mc, i, r.x, r.y, r.w, r.h));
  if (mc) mc.instanceMatrix.needsUpdate = true;

  /* ── EL CANTO LUMINOSO VA EN LA CARA EN LA QUE SE APOYA ──
     Arriba en el piso y los bloques; ABAJO en un techo, porque ahi se apoya por
     debajo. Dibujado siempre arriba, el techo del tramo de gravedad invertida
     quedaba con su linea del lado que no se ve y el cubo colgaba de la nada. */
/* ── Y ES UN LABIO EN EL CANTO DE ADELANTE, NO UNA TAPA ──
     Cubriendo el fondo entero, lo que se ve desde arriba es una SUPERFICIE
     luminosa de bloque y medio: medido en la foto, el suelo salia como una losa
     de menta y el juego se leia a plataforma de otro color. El labio se ve de
     frente y de refilon, y la cara de arriba queda oscura, que es como se lee un
     borde encendido. */
  const gr = 0.14, lab = 0.22;
  const mk = nuevaInst('canto', GEO.caja, matCanto, MUNDO.sol.length, false);
  MUNDO.sol.forEach((r, i) => {
    const arriba = r.t !== 'techo';
    ponCaja(mk, i, r.x, arriba ? r.y + r.h - gr : r.y, r.w, gr, 0.01, lab);
  });
