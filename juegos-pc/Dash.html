      cajas.push({ id, x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight });
    }
    const ch = [];
    for (let i = 0; i < cajas.length; i++) for (let j = i + 1; j < cajas.length; j++){
      const a = cajas[i], b = cajas[j];
      if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y)
        ch.push(a.id + '/' + b.id);
    }
    return { cajas: cajas.length, choques: ch };
  },
  textos(){
    const out = [];
    const sel = EST.p === 'juego' ? '.pan.on, #hud' : '.pan.on';
    document.querySelectorAll(sel).forEach(p => {
      p.querySelectorAll('*').forEach(e => {
        if (e.children.length) return;
        const t = (e.textContent || '').trim();
        if (t && getComputedStyle(e).display !== 'none') out.push(t);
      });
    });
    return out;
  },
  /* ── LAS SONDAS DE DIAGNOSTICO ──
     Sin ellas, «el nivel 1 no se puede pasar» es una frase; con ellas es una x. */
  diag(id, n){
    const o = [];
    for (let s = 1; s <= (n || 8); s++){
      generaNivel(id | 0, s);
      const r = juegaSolo({});
      o.push({ s, pct: r.pct, murio: r.murioEn, pasos: r.pasos });
    }
    return o;
  },
  /* ── QUE LO MATO, Y NO «MURIO EN LA X 42» ──
     Un numero de x no dice si fue un pico, una pared de costado o el plano de
     abajo, y esos tres se arreglan de maneras opuestas. */
  porQue(id, s){
    generaNivel(id | 0, s || 1);
    const med = MUNDO.med;
    const pasos = Math.ceil(1.6*60/med.bpm*60), mira = Math.ceil(1.35*60/med.bpm*60);
    const c = {}; jugPone(c, 0);
    for (const o of MUNDO.orbes) o.usado = false;
    let i = 0, prev = copia(c);
    while (c.vivo && c.x < MUNDO.largo && i < 12000){
      prev = copia(c);
      avanza(c, med, DT, botElige(c, med, pasos, mira));
      i++;
    }
    if (c.vivo) return { ok: true, pasos: i };
    const b = caja(c), tocaM = [], tocaS = [];
    for (const r of cerca(MUNDO.iMat, c.x)) if (pisa(b, r)) tocaM.push([+r.x.toFixed(2), r.y, r.t]);
    for (const r of cerca(MUNDO.iSol, c.x)) if (pisa(b, r)) tocaS.push([+r.x.toFixed(2), r.y, +r.w.toFixed(2), r.h, r.t]);
    const cerc = [];
    for (const r of cerca(MUNDO.iSol, c.x + 1)) cerc.push([+r.x.toFixed(2), r.y, +r.w.toFixed(2), r.h, r.t]);
    return { ok: false, pasos: i, x: +c.x.toFixed(2), y: +c.y.toFixed(2),
             prev: { x: +prev.x.toFixed(2), y: +prev.y.toFixed(2), vy: +prev.vy.toFixed(2),
                     piso: prev.piso, modo: prev.modo, grav: prev.grav },
             mat: tocaM, sol: tocaS, cercaSol: cerc,
             plano: (c.y < -3 || c.y > 20) };
  },
  rects(id, s){
    generaNivel(id | 0, s || 1);
    return { sol: MUNDO.sol.map(r => [+r.x.toFixed(2), r.y, +r.w.toFixed(2), r.h, r.t]),
             mat: MUNDO.mat.map(r => [+r.x.toFixed(2), r.y, r.t]), largo: MUNDO.largo };
  },
  /* el bot que aprieta al azar con probabilidad `p`: apretar sin parar es la
     estrategia que hay que VENCER, porque si gana, el nivel no pide nada */
  spam(id, s, p){
    generaNivel(id | 0, s || 1);
    const c = {}; jugPone(c, 0);
    const q = p == null ? 0.10 : p;
    let i = 0;
    for (; i < 6000 && c.vivo && c.x < MUNDO.largo; i++) avanza(c, MUNDO.med, DT, Math.random() < q);
    return { x: +c.x.toFixed(1), y: +c.y.toFixed(1), vivo: c.vivo, pasos: i,
             pct: Math.round(cl(c.x/MUNDO.largo, 0, 1)*100), largo: MUNDO.largo };
  },
  /* ── LOS EFECTOS SE MIDEN, NO SE MIRAN ──
     «tiembla» y «late» son frases; el sacudon en bloques y la variacion de la
     distancia de camara en por ciento son numeros. */
  efe(){ return efeDe(); },
  /* ── LA CAJA DEL CUBO SE MIDE SOBRE LA MALLA, NO SE RECALCULA ──
     El aplaste va en la escala de un grupo, asi que la unica forma honesta de
     comprobar que la cara de apoyo se queda quieta es preguntarle al objeto
     donde quedaron sus bordes. */
  cubo(){ return cuboDe(); },
  /* ── EL RASTRO DEL BOT DESDE UNA X, QUE ES LO QUE DICE POR QUE MURIO ──
     `juegaSolo` devuelve DONDE murio y eso no alcanza para arreglar un tramo: hay
     que ver la trayectoria. Planta un cuerpo en el modo del tramo y devuelve la y,
     la velocidad y la decision paso a paso. */
  botTrazo(x0, modo, n, cada){
    const med = MUNDO.med;
    const ph = Math.ceil(1.6*60/med.bpm*60), mira = Math.ceil(1.35*60/med.bpm*60);
    const c = {}; jugPone(c, x0);
    if (modo) c.modo = modo;
    const out = [];
    const k = cada || 6;
    for (let i = 0; i < (n || 300); i++){
      const a = botElige(c, med, ph, mira);
      avanza(c, med, DT, a);
      if (i % k === 0 || !c.vivo)
        out.push([+c.x.toFixed(2), +c.y.toFixed(2), +c.vy.toFixed(1), a ? 1 : 0,
                  c.modo, c.grav, c.piso ? 1 : 0]);
      if (!c.vivo) break;
      if (c.x >= MUNDO.largo) break;
    }
    return { vivo: c.vivo, x: +c.x.toFixed(2), pasos: out.length, t: out };
  },
  /* el estado de las imagenes: si una no decodifico, el juego se dibuja como se
     dibujaba antes y hay que poder distinguir las dos cosas */
  img(){
    const t = TELON_TEX['f' + EST.nivel] || {};
    return { telon: telon.visible, opa: +matTelon.opacity.toFixed(2),
             listo: !!t.listo, prop: t.prop ? +t.prop.toFixed(2) : null,
             esc: [telon.scale.x | 0, telon.scale.y | 0],
             y: +telon.position.y.toFixed(1),
             off: matTelon.map ? +matTelon.map.offset.x.toFixed(4) : null,
             sello: $('mSello').classList.contains('hay'),
             fondo: $('mFondo').classList.contains('hay'),
             selloAlto: Math.round($('mSello').getBoundingClientRect().height) };
  },
  /* el tramo de paleta: cambia cada 128 bloques, o sea cada ocho compases */
  pal(){
    return { tramo: PAL.i, x0: +PAL.x0.toFixed(1), listo: PAL.listo,
             c1: '#' + _p1.getHexString(), c2: '#' + _p2.getHexString() };
  },
  /* adelanta SOLO los relojes de los efectos: con el cuadro congelado, el resorte
     y el sacudon no avanzan y no hay forma de medirlos paso a paso */
  efePasos(n){ for (let i = 0; i < (n | 0); i++){ efePaso(DT); sqPaso(DT); flaPaso(DT); } return efeDe(); },
  demo(){ return { on: DEMO, x: +JUG.x.toFixed(1), vivo: JUG.vivo, nivel: EST.nivel }; },
  progreso(){ return PROG.niv.map(p => ({ mejor: p.mejor, mon: p.mon.slice(), hecho: p.hecho })); },
  reset(){ try { localStorage.removeItem('rotor_v1'); } catch(e){} return true; }
};
</script>
