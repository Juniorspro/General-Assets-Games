  { sem: 5527, bio: 'bosque',   forma: 'bosque',  viento: 1.6,  prec: 0.52, rival: 'CHINO'   },
  { sem: 6631, bio: 'bosque',   forma: 'torre',   viento: -3.4, prec: 0.57, rival: 'ZORRO'   },
  { sem: 7741, bio: 'monte',    forma: 'mesa',    viento: 3.0,  prec: 0.62, rival: 'BRUMA'   },
  { sem: 8849, bio: 'monte',    forma: 'pico',    viento: -4.0, prec: 0.68, rival: 'CACHO'   },
  { sem: 9953, bio: 'pradera',  forma: 'viga',    viento: 2.6,  prec: 0.74, rival: 'NIEBLA'  },
  { sem: 1063, bio: 'desierto', forma: 'torre',   viento: -4.6, prec: 0.80, rival: 'FIERRO'  },
  { sem: 1171, bio: 'monte',    forma: 'valle',   viento: 5.0,  prec: 0.86, rival: 'RAYO'    },
  { sem: 1283, bio: 'bosque',   forma: 'pico',    viento: -5.0, prec: 0.92, rival: 'EL VIEJO'},
];

/* ── EL PERFIL DEL TERRENO ────────────────────────────────────────────────
   Devuelve la altura de cada columna. Las dos mesetas de los arqueros se
   APLANAN DESPUES, siempre: una forma que deje al arquero en una pendiente
   lo deja parado en el canto de un bloque, y ahi el arco se dibuja medio
   metido en la tierra.                                                     */
function perfilDe(forma, rnd) {
  const h = new Array(NX);
  const ondas = (x, a, b) => 0.5 * a * Math.sin(x * 0.55 + b) + 0.4 * a * Math.sin(x * 1.31 + b * 2.1);
  const f1 = rnd() * 6.28, f2 = rnd() * 6.28;
  for (let x = 0; x < NX; x++) h[x] = 7;

  if (forma === 'llano' || forma === 'bosque' || forma === 'torre' || forma === 'viga') {
    for (let x = 0; x < NX; x++) h[x] = Math.round(7 + ondas(x, 1.6, f1));
  } else if (forma === 'escalon') {
    for (let x = 0; x < NX; x++) {
      const k = cl((x - (XA + 3)) / (XB - XA - 4), 0, 1);
      h[x] = Math.round(mez(6, 12, k * k * (3 - 2 * k)) + ondas(x, 0.9, f2));
    }
  } else if (forma === 'valle') {
    for (let x = 0; x < NX; x++) {
      const d = cl(Math.abs(x - (XA + XB) / 2) / ((XB - XA) / 2 + 2), 0, 1);
      h[x] = Math.round(mez(2, 10, d * d) + ondas(x, 0.8, f1));
    }
  } else if (forma === 'mesa') {
    for (let x = 0; x < NX; x++) {
      const cerca = Math.min(Math.abs(x - XA), Math.abs(x - XB));
      h[x] = cerca <= 2 ? Math.round(11 + ondas(x, 0.7, f1)) : Math.round(1 + rnd() * 1.4);
    }
  } else if (forma === 'pico') {
    for (let x = 0; x < NX; x++) {
      const d = cl(Math.abs(x - (XA + XB) / 2) / ((XB - XA) / 2 + 2), 0, 1);
      h[x] = Math.round(mez(15, 6, Math.pow(d, 0.85)) + ondas(x, 0.7, f2));
    }
  }
  for (let x = 0; x < NX; x++) h[x] = cl(h[x], 1, NY - 12);
  /* las dos mesetas: tres columnas planas a la altura de la del arquero */
  for (const X of [XA, XB]) {
    const hh = h[X];
    for (let d = -1; d <= 1; d++) { const x = X + d; if (x >= 0 && x < NX) h[x] = hh; }
  }
  return h;
}

/* ── ARMAR EL MUNDO ───────────────────────────────────────────────────────
   EL OBSTACULO SE BAJA HASTA QUE EL DUELO SE PUEDA JUGAR, y esto no es una
   red de seguridad de mas: `armaMundo` tiraba torres de 16 y 17 celdas de
   alto a tres columnas del arquero, y con V_MAX 30 desde la boca del arco no
   hay parabola que las pase — medido, la mas barata que las cruza pide 39,7.
   Los duelos 6 y 10 salian IMPOSIBLES en los dos sentidos y nada avisaba:
   desde afuera se ve igual que un jugador que no sabe apuntar.

   Asi que el generador PROPONE y el resolvedor —el mismo que usa el rival—
   DISPONE: se baja el obstaculo de a un 11 % hasta que haya tiro limpio en
   los dos sentidos. Es determinista (la semilla se rehace en cada intento),
   asi que el duelo n sigue siendo siempre el mismo duelo.                 */
function generaMundo(n) {
  let M = null;
  for (let i = 0; i < 9; i++) {
    M = armaMundo(n, 1 - i * 0.11);
    if (resuelve(M, 0, M.viento) && resuelve(M, 1, M.viento)) { M.oc = 1 - i * 0.11; return M; }
  }
  M.oc = 0;
  return M;
}

function armaMundo(n, oc) {
  const D = DUELO[n % DUELO.length];
  const B = BIOMAS[D.bio];
  const rnd = azar(D.sem);
  const M = nuevoMundo(NX, NY, NZ);
  M.n = n; M.paleta = B.pal; M.bio = D.bio; M.forma = D.forma;
  M.viento = D.viento; M.rival = D.rival; M.prec = D.prec;

  const h = perfilDe(D.forma, rnd);
  M.h = h;
  for (let x = 0; x < NX; x++) for (let y = 0; y < h[x]; y++) {
    const t = (y === h[x] - 1) ? B.sup : B.base;
    for (let z = 0; z < NZ; z++) pon(M, x, y, z, t);
  }

  /* LOS OBSTACULOS VAN LEJOS DE LOS DOS ARQUEROS. Uno pegado al arco tapa la
     salida de la flecha y el duelo se vuelve imposible sin que nada avise —
     y encima no se ve, porque desde la camara queda detras del arquero.    */
  const libre = x => Math.abs(x - XA) > 2.5 && Math.abs(x - XB) > 2.5;
  if (D.forma === 'torre') {
    /* LA TORRE VA EN EL MEDIO EXACTO Y NO SE MUEVE. Mide dos bloques, asi
       que x0 = XM-1 la deja ocupando [8,10] con su centro en 9,0, que es el
       medio entre los dos arqueros. Corrida una celda —que es lo que hacia
       el sorteo— la tiene mas cerca uno de los dos, y lo que ya varia es la
       altura, que es lo que de verdad cambia el tiro.                     */
    const x0 = XM - 1;
    const alt = h[x0] + Math.max(2, Math.round((8 + Math.floor(rnd() * 3)) * oc));
    for (let x = x0; x <= x0 + 1; x++) for (let y = h[x]; y < alt; y++)
      for (let z = 0; z < NZ; z++) pon(M, x, y, z, LADRILLO);
    /* la cornisa de metal: es lo unico que los craters no se llevan, asi que
       la torre puede perder ladrillos y seguir siendo una torre */
    for (let x = x0 - 1; x <= x0 + 2; x++) for (let z = 0; z < NZ; z++) pon(M, x, alt, z, METAL);
  } else if (D.forma === 'viga') {
    const y0 = Math.round(h[XM - 1] + Math.max(2, (9 + Math.floor(rnd() * 3)) * oc));
    for (let x = XM - 2; x <= XM + 1; x++) for (let z = 0; z < NZ; z++) pon(M, x, y0, z, METAL);
  } else if (D.forma === 'bosque') {
    for (let x = XA + 2; x < NX - 3; x++) {
      if (!libre(x) || rnd() > 0.34) continue;
      const t0 = h[x], alt = 4 + Math.floor(rnd() * 3);
      for (let y = t0; y < t0 + alt; y++) for (let z = 1; z < NZ - 1; z++) pon(M, x, y, z, MADERA);
      for (let dx = -1; dx <= 1; dx++) for (let dy = 0; dy <= 2; dy++)
        for (let z = 0; z < NZ; z++) {
          if (Math.abs(dx) + Math.abs(dy - 1) > 2) continue;
          if (en(M, x + dx, t0 + alt + dy - 1, z) === VACIO) pon(M, x + dx, t0 + alt + dy - 1, z, HOJA);
        }
      x += 2;
    }
  }

  M.pisoA = altura(M, XA);
  M.pisoB = altura(M, XB);
  return M;
}

/* ── EL CRATER ────────────────────────────────────────────────────────────
   SE LLEVA LA COLUMNA ENTERA EN z Y NO UNA ESFERA. Con esfera, un impacto en
   la cara de adelante deja un hueco de una celda de hondo y desde la camara
   —que mira casi de frente— eso se lee a mancha, no a agujero. Con cilindro
   se ve el hueco de lado a lado y el terreno cambia de verdad.
   Y LAS DOS MESETAS NO SE ROMPEN: dos tiros cortos al pie del rival le
   volarian el piso, y perder por caerse no es perder un duelo de arcos.   */
function crater(M, cx, cy, r) {
  let n = 0;
  const r2 = r * r;
  const R = Math.ceil(r);
  for (let x = Math.floor(cx) - R; x <= Math.floor(cx) + R; x++) {
    if (x < 0 || x >= M.nx) continue;
    const prot = (Math.abs(x - XA) <= PROTEGE_R) ? M.pisoA
               : (Math.abs(x - XB) <= PROTEGE_R) ? M.pisoB : -1;
    for (let y = Math.floor(cy) - R; y <= Math.floor(cy) + R; y++) {
      if (y < 0 || y >= M.ny) continue;
      if (prot >= 0 && y >= prot - 1) continue;
      const dx = (x + 0.5) - cx, dy = (y + 0.5) - cy;
      if (dx * dx + dy * dy > r2) continue;
      for (let z = 0; z < M.nz; z++) {
        const t = M.v[iM(M, x, y, z)];
        if (t !== VACIO && BLOQ[t].rompe === 1) { M.v[iM(M, x, y, z)] = VACIO; n++; }
      }
    }
  }
  return n;
}

/* de donde sale la flecha: la mano del arco. Sale de UNA funcion porque la
   usan el tiro del jugador, el del rival, el resolvedor balistico y el brazo
   que se dibuja — con cuatro cuentas, la flecha saldria de un sitio distinto
   del que se ve el arco.

   Y VA MEDIO CUERPO POR DELANTE, no en el eje del arquero. Con la boca en el
   centro, el arco se dibuja ADENTRO del torso y no se lee ninguno de los dos;
   y la flecha nace dentro de la caja del propio tirador, o sea que sale viva
   de milagro y solo porque `vuela` le perdona los primeros 0,30 s. Con 0,62
   —mas que el medio ancho del cuerpo, que es 0,52— nace al aire.          */
/* LA BOCA DEL ARCO ES LA MANO ADELANTADA, Y ESTABA A LA ALTURA DE LA PANZA.
   El hombro esta en 1,82 y el brazo alcanza 0,96: con 0,62 adelante y 1,55 de
   alto la mano quedaba 27 cm POR DEBAJO del hombro y a 0,68 de el —el 70 % del
   alcance— o sea el arco agarrado a la cadera y el codo doblado. Un arquero
   extiende el brazo: 0,84 adelante y 1,70 de alto dejan la mano a 0,85 del
   hombro (el 89 %) y casi al nivel de los ojos.
   Y SE MUEVE ACA Y NO EN EL DIBUJO porque de aca sale tambien el origen del
   vuelo: con dos numeros, la flecha saldria de donde no esta el arco.      */
const FRENTE_BOCA = 0.84;
function bocaDe(M, lado) {
  const X = lado ? XB : XA, piso = lado ? M.pisoB : M.pisoA;
  const s = lado ? -1 : 1;                 /* el de la derecha mira a -X */
  return { x: X + 0.5 + s * FRENTE_BOCA, y: piso + 1.70 };
}

/* ══════════════════════════════════════════════════════════════════════════
   D · LA BALISTICA, EL CHOQUE, EL RIVAL Y LA AUDITORIA

   UNA SOLA FUNCION VUELA UNA FLECHA, y la usan las CUATRO cosas que necesitan
   saber donde cae: el tiro del jugador, el tiro del rival, el resolvedor que
   le dice al rival como apuntar, y la auditoria que comprueba que cada duelo
   se pueda ganar. Con dos integradores, el rival estaria apuntando a un juego
   que no existe y la auditoria aprobaria duelos imposibles.                */

/* la caja del arquero: cuerpo y cabeza. Las mismas medidas que dibuja el rig
   —y por eso viven aca, antes de f.js— porque si el dibujo y el blanco fueran
   dos cuentas, el jugador le pegaria al aire donde ve un cuerpo.           */
const ARQ_MED = 0.52;   /* medio ancho del cuerpo    */
const ARQ_ALTO = 2.10;  /* del piso al cuello        */
const CAB_MED = 0.42;
const CAB_ALTO = 0.90;  /* del cuello a la coronilla */

function cajaArq(M, lado) {
  const X = (lado ? XB : XA) + 0.5, p = lado ? M.pisoB : M.pisoA;
  return { x: X, p,
    cx0: X - ARQ_MED, cx1: X + ARQ_MED, cy0: p, cy1: p + ARQ_ALTO,
    hx0: X - CAB_MED, hx1: X + CAB_MED, hy0: p + ARQ_ALTO, hy1: p + ARQ_ALTO + CAB_ALTO };
}

/* ── EL VUELO ─────────────────────────────────────────────────────────────
   Integracion a 240 pasos por segundo y no a 60. A 30 celdas/s un paso de
   1/60 son media celda: una viga de una celda de espesor se atraviesa sin
   tocarla y el jugador ve la flecha pasar POR DENTRO del metal.           */
function vuela(M, x0, y0, vx, vy, w, tirador) {
  let x = x0, y = y0, t = 0;
  const pts = [];
  let acum = 0;
  const A = cajaArq(M, 0), B = cajaArq(M, 1);
  for (let i = 0; i < 2400; i++) {
    /* muestreo para la estela y para la vista previa */
    if (acum <= 0) { pts.push(x, y); acum = 13; }
    acum--;
    const nvx = vx + w * PASO_F, nvy = vy - G * PASO_F;
    const nx = x + nvx * PASO_F, ny = y + nvy * PASO_F;
    t += PASO_F; vx = nvx; vy = nvy; x = nx; y = ny;

    if (x < -1.5 || x > NX + 1.5 || y < -2 || t > 9)
      return { fin: 'fuera', x, y, t, v: Math.hypot(vx, vy), pts };

    /* los arqueros primero: estan APOYADOS en el suelo, asi que su caja no
       se pisa con ningun bloque y el orden no puede dar dos respuestas */
    for (const [q, C] of [[0, A], [1, B]]) {
      if (q === tirador && t < 0.30) continue;
      if (x >= C.hx0 && x <= C.hx1 && y >= C.hy0 && y <= C.hy1)
        return { fin: 'arq', quien: q, cab: true, x, y, t, v: Math.hypot(vx, vy), pts };
      if (x >= C.cx0 && x <= C.cx1 && y >= C.cy0 && y <= C.cy1)
        return { fin: 'arq', quien: q, cab: false, x, y, t, v: Math.hypot(vx, vy), pts };
    }
    const bx = Math.floor(x), by = Math.floor(y);
    if (by < M.ny) {
      const tp = en(M, bx, by, ZC);
      if (tp !== VACIO)
        return { fin: 'suelo', tipo: tp, x, y, t, v: Math.hypot(vx, vy), pts };
    }
  }
  return { fin: 'fuera', x, y, t, v: Math.hypot(vx, vy), pts };
}

/* ── EL RESOLVEDOR ────────────────────────────────────────────────────────
   Fijado el tiempo de vuelo, la velocidad sale de dos ecuaciones y no hay
   nada que buscar:
       vx = (dx - w*t^2/2) / t        vy = (dy + g*t^2/2) / t
   Asi que se barre el TIEMPO y no el angulo. Y cada candidato se VUELA de
   verdad contra el terreno antes de darlo por bueno: la formula dice donde
   CAERIA, no si LLEGA — una parabola perfecta que atraviesa una torre es
   exactamente el tiro que un rival no puede hacer.                        */
function resuelve(M, desde, w) {
  const O = bocaDe(M, desde);
  const C = cajaArq(M, 1 - desde);
  const tx = C.x, ty = C.p + 0.95;
  let mejor = null;
  for (let t = 0.30; t <= 3.20; t += 0.02) {
    const vx = ((tx - O.x) - w * t * t / 2) / t;
    const vy = ((ty - O.y) + G * t * t / 2) / t;
    const v = Math.hypot(vx, vy);
    if (v > V_MAX) continue;
    if (mejor && v >= mejor.v) continue;      /* ya tenemos uno mas barato */
    const r = vuela(M, O.x, O.y, vx, vy, w, desde);
    if (r.fin !== 'arq' || r.quien === desde) continue;
    mejor = { vx, vy, v, t };
  }
  return mejor;
}

/* el rival apunta bien y despues se equivoca a proposito. El error va en el
   ANGULO y en la fuerza por separado: con un solo numero, un rival malo
   fallaria siempre para el mismo lado y se le aprenderia el sesgo.        */
function tiroRival(M, prec, rnd) {
  const s = resuelve(M, 1, M.viento);
  if (!s) {  /* no hay tiro limpio: tira alto y a la buena de Dios */
    return { vx: -14 - rnd() * 6, vy: 16 + rnd() * 7 };
  }
  const e = 1 - cl(prec, 0, 1);
  const ang = Math.atan2(s.vy, s.vx) + (rnd() * 2 - 1) * e * 0.30;
  const vel = cl(s.v * (1 + (rnd() * 2 - 1) * e * 0.22), 3, V_MAX);
  return { vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel };
}

/* ── EL DANO ──────────────────────────────────────────────────────────────
   Escala con la velocidad de impacto porque si no, una flecha que llega
   arrastrandose al final de una parabola de tres segundos pega lo mismo que
   una tensa — y entonces no habria ninguna razon para tirar fuerte.       */
function danoDe(r) {
  const k = cl(r.v / V_REF, 0.42, 1.30);
  return Math.max(6, Math.round((r.cab ? DANO_CABEZA : DANO_CUERPO) * k));
}

/* ── AUDITORIA ────────────────────────────────────────────────────────────
   Un duelo del que no se puede llegar al otro no es dificil: es imposible, y
   desde afuera se ve igual que un jugador que no sabe apuntar. Se comprueba
   en LOS DOS SENTIDOS —el rival tiene que poder contestar— y ademas que la
   boca del arco no nazca adentro de un bloque.                            */
function auditaDuelos() {
  const malos = [];
  const filas = [];
  for (let n = 0; n < DUELOS; n++) {
    const M = generaMundo(n);
    const a = resuelve(M, 0, M.viento);
    const b = resuelve(M, 1, M.viento);
    const oa = bocaDe(M, 0), ob = bocaDe(M, 1);
    const libreA = en(M, Math.floor(oa.x), Math.floor(oa.y), ZC) === VACIO;
    const libreB = en(M, Math.floor(ob.x), Math.floor(ob.y), ZC) === VACIO;
    const ok = !!a && !!b && libreA && libreB;
    if (!ok) malos.push({ n, a: !!a, b: !!b, libreA, libreB });
    filas.push({ n, forma: M.forma, va: a ? +a.v.toFixed(1) : null,
                 vb: b ? +b.v.toFixed(1) : null, ta: a ? +a.t.toFixed(2) : null,
                 pisoA: M.pisoA, pisoB: M.pisoB });
  }
  return { ok: malos.length === 0, malos, filas };
}

/* ── AUTO-JUGADOR ─────────────────────────────────────────────────────────
   Juega el duelo entero por el mismo camino que el dedo: resuelve, mete su
   propio error, vuela la flecha, aplica el crater y el dano. La separacion
   entre el honesto y el que tira al azar es lo unico que prueba que hay una
   decision adentro y no una moneda.                                       */
function juegaSolo(n, prec, sem) {
  const M = generaMundo(n);
  const rnd = azar(sem || (7000 + n * 131));
  let va = VIDA_MAX, vb = VIDA_MAX, flechas = 0, aciertos = 0, turno = 0;
  while (va > 0 && vb > 0 && flechas < 60) {
    const tirador = turno;
    let d;
    if (tirador === 0) {
      if (prec < 0) {                       /* el del azar: angulo y fuerza a ciegas */
        const ang = rnd() * 1.4 - 0.1, vel = 6 + rnd() * (V_MAX - 6);
        d = { vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel };
      } else {
        const s = resuelve(M, 0, M.viento);
        if (!s) d = { vx: 14 + rnd() * 6, vy: 16 + rnd() * 7 };
        else {
          const e = 1 - cl(prec, 0, 1);
          const ang = Math.atan2(s.vy, s.vx) + (rnd() * 2 - 1) * e * 0.30;
          const vel = cl(s.v * (1 + (rnd() * 2 - 1) * e * 0.22), 3, V_MAX);
          d = { vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel };
        }
      }
    } else d = tiroRival(M, M.prec, rnd);
    const O = bocaDe(M, tirador);
    const r = vuela(M, O.x, O.y, d.vx, d.vy, M.viento, tirador);
    flechas++;
    if (r.fin === 'arq') {
      const dn = danoDe(r);
      if (r.quien === 0) va -= dn; else { vb -= dn; if (tirador === 0) aciertos++; }
    } else if (r.fin === 'suelo') crater(M, r.x, r.y, CRATER_R);
    turno = 1 - turno;
  }
  return { gano: vb <= 0 && va > 0, va: Math.max(0, va), vb: Math.max(0, vb), flechas, aciertos };
}
/* ══════════════════════════════════════════════════════════════════════════
   E · EL DIBUJO EN 2D

   ESTE JUEGO NO ES TRIDIMENSIONAL Y NO TIENE QUE PARECERLO. La referencia
   —Bowmasters— es vector plano: siluetas saturadas, cantos redondeados, cero
   perspectiva y cero sombras proyectadas. Lo que da profundidad ahi no es el
   volumen sino LAS CAPAS: cielo, dos bandas de fondo, el terreno adelante, y
   cada una de un solo color mas plano y mas frio cuanto mas lejos.

   Y EN UN JUEGO DE TIRO PARABOLICO EL 2D NO ES UNA CONCESION: la unica
   decision es un vector en un plano, asi que la tercera dimension no aporta
   una sola eleccion y cuesta el apuntado. Con camara ortografica plana el
   puente entre el dedo y el mundo es una multiplicacion —error exactamente
   cero, medido— y no una matriz proyectada que hay que mantener al dia.

   LA UNIDAD ES LA CELDA Y EL LIENZO SE TRANSFORMA UNA VEZ. Todo se dibuja en
   coordenadas del mundo (x a la derecha, y hacia arriba) adentro de un
   `scale(PX, -PX)`: asi el dibujo y la fisica hablan el mismo idioma y no hay
   dos cuentas que se puedan separar. El precio es que los grosores de linea
   van en celdas, que es como corresponde — un arco no engorda porque la
   pantalla sea mas grande.
   ══════════════════════════════════════════════════════════════════════════ */

let CV = null, G2 = null;
let ANCHO = 412, ALTO = 892, DPR = 1;
let PX = 26, OFX = 0, OFY = 0;
let ENC_W = 8, ENC_H = 18, MIRA = 16;
let DIO = null;
let LLAM = 0, LLAM_ANT = 0;
let DET = 1;

/* ── LA CAMARA ────────────────────────────────────────────────────────────
   HAY UNA CAMARA PORQUE EL MAPA CRECIO, y las dos cosas son la misma
   decision. En un marco 9:16 el ancho manda: mostrar de una las trece celdas
   que separan a los arqueros deja el cuerpo en 62 px y la flecha en 20 —o
   sea que la flecha del rival, que cruza el cuadro en cuatro decimas, no se
   ve—. Con encuadre fijo no hay numero que arregle las dos cosas: agrandar
   el mapa achica todo lo que hay adentro.

   ASI QUE EL ENCUADRE SE ABRE EN REPOSO Y SE CIERRA SOBRE LA FLECHA. Lo
   unico que se achica es el plano de espera —el cuerpo del arquero baja de
   62 a 53 px— y lo que se AGRANDA es justamente lo que antes no se veia: en
   vuelo el cuerpo mide 73 px y la flecha 39 contra 33. Medido en el marco de
   412: 25,1 px por celda esperando y 34,9 en vuelo.

   Y APUNTAR NO SE ROMPE, que es lo que hay que comprobar antes de mover una
   camara en un juego de punteria: `mundoAPant` es una escala UNIFORME, asi
   que un DELTA pasado por `pantAMundo` conserva la direccion —la escala se
   divide sola al normalizar— y la fuerza sale de pixeles del marco. Las dos
   son invariantes al zoom, medido.                                        */
const CEL_REPOSO = 16.4;   /* celdas de ancho esperando  */
const CEL_VUELO  = 11.8;   /* celdas de ancho en vuelo   */
const CAM_VEL = 3.6;       /* con que rapidez sigue      */
const CAM_ZOOM = 2.8;      /* y con que rapidez cierra   */
const CAM_ALTO = 7;        /* cuanto puede subir sobre el piso siguiendo la flecha */
/* EL ENCUADRE SE CENTRA EN LA ARENA, NO EN EL MUNDO: el medio entre los dos
   arqueros es 8,5 y el del mundo 9, asi que centrando en el mundo el de la
   derecha queda media celda mas cerca del canto que el de la izquierda. */
const ENC_CX = (XA + XB) / 2 + 0.5;
const SUELO_Y = -1.15;     /* la linea del mundo que cae en el canto de abajo */
const CAM = { cx: ENC_CX, cy: 16, cel: CEL_REPOSO, foco: null };
/* medio alto visible, en celdas, para un ancho dado */
const camAlto = cel => ALTO * cel / (2 * ANCHO);

/* ── COLOR ────────────────────────────────────────────────────────────────
   Todo pasa por aca. Con los colores escritos a mano en cada sitio, subir la
   saturacion del juego seria tocar cuarenta literales y olvidarse de tres. */
const cl255 = v => v < 0 ? 0 : (v > 255 ? 255 : v);
function _h2r(h) { return [(h >> 16) & 255, (h >> 8) & 255, h & 255]; }
function _r2c(r) { return 'rgb(' + Math.round(cl255(r[0])) + ',' + Math.round(cl255(r[1])) + ',' + Math.round(cl255(r[2])) + ')'; }
function _rgba(r, a) { return 'rgba(' + Math.round(cl255(r[0])) + ',' + Math.round(cl255(r[1])) + ',' + Math.round(cl255(r[2])) + ',' + a + ')'; }
function _hsl(r) {
  const R = r[0] / 255, G = r[1] / 255, B = r[2] / 255;
  const mx = Math.max(R, G, B), mn = Math.min(R, G, B), d = mx - mn;
  let h = 0; const l = (mx + mn) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d !== 0) {
    if (mx === R) h = ((G - B) / d) % 6; else if (mx === G) h = (B - R) / d + 2; else h = (R - G) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, s, l];
}
function _rgbDe(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
/* LA SATURACION VA EN UNA FUNCION Y ANTES DEL TINTE, que es la leccion de
   MEKO: el tinte de paleta existe para DESATURAR hacia el color del aire, y
   saturando encima el ladrillo del fondo sale rosa chicle.                 */
const SAT_K = 1.34, SAT_TOPE = 0.78;
function satura(hex) {
  const r = typeof hex === 'number' ? _h2r(hex) : hex;
  const [h, s, l] = _hsl(r);
  if (s <= 0.004) return r.slice();
  return _rgbDe(h, Math.min(SAT_TOPE, s * SAT_K), l);
}
const mezR = (a, b, k) => [mez(a[0], b[0], k), mez(a[1], b[1], k), mez(a[2], b[2], k)];
function luz(r, k) {                       /* k>0 aclara, k<0 oscurece */
  const [h, s, l] = _hsl(r);
  return _rgbDe(h, s, cl(l + k, 0, 1));
}

/* ── LAS PALETAS ──────────────────────────────────────────────────────────
   Cuatro cielos y, con cada uno, los dos colores de las bandas del fondo. No
   son un degradado del terreno: en vector plano lo que separa una capa de la
   siguiente es que sean colores DISTINTOS, no el mismo mas claro.          */
const PALETAS = [
  { t: 0xdff0ff, k: 0.20, sol: [0.70, 0.19], solc: [255, 248, 216], nub: 18,
    cielo: ['#2f7fd6', '#4fa6e6', '#8fd2f2', '#d8f0ea'],
    lejos: [0x4f7fb8, 0x3f7a6a], bruma: 0.30 },
  { t: 0xffd9a0, k: 0.26, sol: [0.28, 0.30], solc: [255, 226, 168], nub: 9,
    cielo: ['#c8407f', '#ef7a52', '#f9b268', '#fbe0b0'],
    lejos: [0x8f4a86, 0xb9625a], bruma: 0.34 },
  { t: 0xd6ecff, k: 0.24, sol: [0.80, 0.13], solc: [222, 240, 255], nub: 24,
    cielo: ['#26489c', '#3f74c8', '#7fb2e2', '#cfe6ef'],
    lejos: [0x5560ab, 0x4a7fa8], bruma: 0.32 },
  { t: 0xd8ffd0, k: 0.18, sol: [0.40, 0.23], solc: [238, 255, 214], nub: 15,
    cielo: ['#1f7a86', '#38a58c', '#7ecf9c', '#d2eec6'],
    lejos: [0x2f6a72, 0x2f7a52], bruma: 0.28 },
];

/* ── EL CIELO ─────────────────────────────────────────────────────────────
   Un lienzo por paleta, dibujado una vez y pegado dos veces con un
   corrimiento: las nubes SE CORREN CON EL VIENTO, que es la mitad de lo que
   hacen. El viento es el unico dato del duelo que no se ve en el terreno, y
   un numero en el HUD se lee una vez y se olvida.                          */
const CIELOS = [];
let CIELO_OX = 0, CIELO_PI = 0;
function cieloLienzo(pi) {
  const key = pi + '|' + ANCHO + '|' + ALTO + '|' + DPR + '|' + DET;
  if (CIELOS[pi] && CIELOS[pi].key === key) return CIELOS[pi].c;
  const pal = PALETAS[pi];
  const W = Math.max(2, Math.round(ANCHO * DPR)), H = Math.max(2, Math.round(ALTO * DPR));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H), ps = pal.cielo;
  gr.addColorStop(0, ps[0]); gr.addColorStop(0.40, ps[1]);
  gr.addColorStop(0.72, ps[2]); gr.addColorStop(1, ps[3]);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  const sx = W * pal.sol[0], sy = H * pal.sol[1];
  for (const off of [-W, 0, W]) {
    const rg = g.createRadialGradient(sx + off, sy, 0, sx + off, sy, H * 0.55);
    rg.addColorStop(0, _rgba(pal.solc, 0.95));
    rg.addColorStop(0.08, _rgba(pal.solc, 0.52));
    rg.addColorStop(0.36, _rgba(pal.solc, 0.14));
    rg.addColorStop(1, _rgba(pal.solc, 0));
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  /* el disco del sol: en vector plano es un circulo y no un resplandor */
  g.fillStyle = _rgba(pal.solc, 0.90);
  g.beginPath(); g.arc(sx, sy, H * 0.035, 0, 6.2832); g.fill();

  /* LAS NUBES SE DIBUJAN TRES VECES —en -W, 0 y +W— porque el lienzo se pega
     en bucle: sin eso, al correrlas con el viento aparece la costura.      */
  const R = azar(pi * 1237 + 71);
  const nn = Math.max(4, Math.round(pal.nub * (DET === 0 ? 0.45 : DET === 1 ? 0.8 : 1)));
  for (let i = 0; i < nn; i++) {
    const cx = R() * W, cy = H * (0.06 + R() * 0.48), s = (0.5 + R() * 1.2) * (W / 900);
    const a = 0.16 + R() * 0.22;
    g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    for (const off of [-W, 0, W]) {
      g.beginPath();
      for (let k = 0; k < 5; k++) {
        const ex = cx + off + (k - 2) * 46 * s, ey = cy + Math.sin(k * 1.9 + i) * 11 * s;
        const rw = (74 - Math.abs(k - 2) * 15) * s;
        g.moveTo(ex + rw, ey); g.arc(ex, ey, rw, 0, 6.2832);
      }
      g.fill();
    }
  }
  CIELOS[pi] = { key, c };
  return c;
}

/* ── EL MARCO Y LA CAMARA ─────────────────────────────────────────────────
   No hay camara: hay una escala y dos corrimientos. `pantAMundo` es la
   inversa EXACTA de `mundoAPant` porque las dos son la misma division.    */
function encuadra() {
  PX = ANCHO / CAM.cel;
  ENC_W = ANCHO / (2 * PX);
  ENC_H = ALTO / (2 * PX);
  OFX = ANCHO / 2 - CAM.cx * PX;
  OFY = ALTO / 2 + CAM.cy * PX;
  MIRA = CAM.cy;
}
/* a donde quiere ir la camara AHORA. Sin foco, al plano de espera. */
function camObj() {
  if (!CAM.foco) return { x: ENC_CX, y: SUELO_Y + camAlto(CEL_REPOSO), cel: CEL_REPOSO };
  const y0 = SUELO_Y + camAlto(CEL_VUELO);
  /* la x se topa DENTRO de las alas del terreno (tres celdas a cada lado),
     asi que por mucho que la flecha se vaya de la arena no aparece el vacio
     de mas alla del mundo */
  return { x: cl(CAM.foco.x, XA + 1, XB - 1), y: cl(CAM.foco.y, y0, y0 + CAM_ALTO), cel: CEL_VUELO };
}
function camFoco(x, y) { CAM.foco = { x, y }; }
function camSuelta() { CAM.foco = null; }
function camPlanta() { const o = camObj(); CAM.cx = o.x; CAM.cy = o.y; CAM.cel = o.cel; encuadra(); }
function camPaso(dt) {
  const o = camObj();
  const kr = 1 - Math.exp(-dt * CAM_VEL), kz = 1 - Math.exp(-dt * CAM_ZOOM);
  CAM.cx += (o.x - CAM.cx) * kr;
  CAM.cy += (o.y - CAM.cy) * kr;
  CAM.cel += (o.cel - CAM.cel) * kz;
  /* EL PISO DE LA CAMARA SE MIDE CON EL ZOOM DEL CUADRO Y NO CON EL DE
     DESTINO: durante el cierre, la altura visible baja mas despacio que la
     camara, y sin este piso aparece una franja de vacio debajo del terreno.
     Con el, la camara solo puede bajar al ritmo al que se cierra.        */
  CAM.cy = Math.max(CAM.cy, SUELO_Y + camAlto(CAM.cel));
  encuadra();
}
function mundoAPant(x, y) { return { x: OFX + x * PX, y: OFY - y * PX }; }
function pantAMundo(dpx, dpy) { return { x: dpx / PX, y: -dpy / PX }; }

function escInit() {
  CV = $('cv');
  G2 = CV.getContext('2d', { alpha: false });
  aplicaCalidad();
}
/* LAS TRES CALIDADES CAMBIAN LO QUE CUESTA, NO LO QUE EL JUEGO ES: la misma
   partida, el mismo terreno y los mismos duelos en las tres.              */
function aplicaCalidad() {
  const C = CALIDADES[PROG.cal] || CALIDADES.media;
  DPR = Math.min(window.devicePixelRatio || 1, C.px);
  DET = C.det;
  CIELOS.length = 0;
  medir();
}
function medir() {
  const m = $('marco').getBoundingClientRect();
  ANCHO = Math.max(1, Math.round(m.width)); ALTO = Math.max(1, Math.round(m.height));
  document.documentElement.style.setProperty('--mw', ANCHO + 'px');
  if (CV) { CV.width = Math.round(ANCHO * DPR); CV.height = Math.round(ALTO * DPR); }
  if (CAM.foco) encuadra(); else camPlanta();
  if (DIO) rayasArma(DIO.M ? DIO.M.viento : 0);
}

/* ── LA CELDA CON LAS ESQUINAS REDONDEADAS ────────────────────────────────
   ES LO QUE SACA AL TERRENO DE PARECER MINECRAFT. Una reja de cuadrados se
   lee a voxel por muchos colores que tenga; redondeando SOLO las esquinas
   expuestas —las que tienen los dos lados al aire— la union de doscientas
   celdas sale con silueta continua y cantos blandos, que es la forma de
   cualquier plataforma de vector plano.

   Y EL RADIO ESTA TOPADO EN 0,26 A PROPOSITO: es dibujo sobre una fisica que
   sigue siendo cuadrada, asi que la diferencia entre lo que se ve y lo que
   choca no puede pasar de un cuarto de celda. Mas redondo se veria mejor y
   mentiria donde este juego no puede mentir.                              */
const RCOR = 0.26;
function celdaP(p, x, y, nD, nI, nA, nB) {
  const r = RCOR;
  const ti = !nI && !nA, td = !nD && !nA, bd = !nD && !nB, bi = !nI && !nB;
  p.moveTo(x + (bi ? r : 0), y);
  if (bd) { p.lineTo(x + 1 - r, y); p.quadraticCurveTo(x + 1, y, x + 1, y + r); }
  else p.lineTo(x + 1, y);
  if (td) { p.lineTo(x + 1, y + 1 - r); p.quadraticCurveTo(x + 1, y + 1, x + 1 - r, y + 1); }
  else p.lineTo(x + 1, y + 1);
  if (ti) { p.lineTo(x + r, y + 1); p.quadraticCurveTo(x, y + 1, x, y + 1 - r); }
  else p.lineTo(x, y + 1);
  if (bi) { p.lineTo(x, y + r); p.quadraticCurveTo(x, y, x + r, y); }
  else p.lineTo(x, y);
  p.closePath();
}

/* ── EL TERRENO ───────────────────────────────────────────────────────────
   Un `Path2D` por material, armado UNA VEZ y redibujado tal cual en cada
   cuadro: el terreno solo cambia cuando un crater lo cambia, y ahi se rehace
   entero. Con las celdas dibujadas de a una serian doscientas ordenes por
   cuadro para poner siempre lo mismo.                                     */
const CAPA = 0.30;         /* el alto de la tapa: lo que en vector plano
                              separa una plataforma de un rectangulo */
function terrArma(M) {
  const pal = PALETAS[(M.paleta || 0) % PALETAS.length];
  const tin = _h2r(pal.t);
  const solido = (x, y) => {
    if (y < 0) return true;
    if (x < 0) x = 0; else if (x >= M.nx) x = M.nx - 1;   /* el mundo sigue
       fuera del marco: tratando el borde como aire, el terreno aparece
       cortado en vertical justo en el canto de la pantalla. */
    if (y >= M.ny) return false;
    return en(M, x, y, ZC) !== VACIO;
  };
  const capas = new Map();
  const dame = t => {
    let o = capas.get(t);
    if (!o) {
      const base = mezR(satura(BLOQ[t].col), tin, pal.k * pal.bruma * 0.5);
      const tapa = mezR(satura(BLOQ[t].top), tin, pal.k * pal.bruma * 0.5);
      o = { t, fill: new Path2D(), cap: new Path2D(), lin: new Path2D(),
            col: base, cap0: tapa, borde: luz(base, -0.16), det: luz(base, -0.10) };
      capas.set(t, o);
    }
    return o;
  };
  /* las dos alas: el mundo se prolonga tres celdas para cada lado con la
     columna del borde, asi el terreno llega hasta el canto del marco */
  for (const [xa, xb, xs] of [[-3, -1, 0], [M.nx, M.nx + 2, M.nx - 1]]) {
    for (let x = xa; x <= xb; x++) for (let y = 0; y < M.ny; y++) {
      const t = en(M, xs, y, ZC); if (t === VACIO) continue;
      const o = dame(t);
      celdaP(o.fill, x, y, solido(x + 1, y) || x >= M.nx, solido(x - 1, y) || x < 0, solido(xs, y + 1), true);
    }
  }
  for (let y = 0; y < M.ny; y++) for (let x = 0; x < M.nx; x++) {
    const t = en(M, x, y, ZC); if (t === VACIO) continue;
    const o = dame(t);
    const nD = solido(x + 1, y), nI = solido(x - 1, y), nA = solido(x, y + 1), nB = solido(x, y - 1);
    celdaP(o.fill, x, y, nD, nI, nA, nB);
  }
  /* LA TAPA SE ARMA APARTE Y CON SU PROPIA REDONDEZ: metida en el mismo
     bucle que el relleno habria que inventarle vecinos, y una tapa con la
     esquina cuadrada al lado de un cuerpo redondeado se ve peor que las dos
     cuadradas.                                                            */
  for (let y = 0; y < M.ny; y++) for (let x = -3; x < M.nx + 3; x++) {
    const xs = cl(x, 0, M.nx - 1);
    const t = en(M, xs, y, ZC); if (t === VACIO) continue;
    if (solido(x, y + 1)) continue;
    const o = dame(t);
    const rd = solido(x + 1, y) && !solido(x + 1, y + 1);
    const ri = solido(x - 1, y) && !solido(x - 1, y + 1);
    const p = o.cap, y0 = y + 1 - CAPA, r = Math.min(RCOR, CAPA);
    p.moveTo(x, y0); p.lineTo(x + 1, y0);
    if (!rd && !solido(x + 1, y)) { p.lineTo(x + 1, y + 1 - r); p.quadraticCurveTo(x + 1, y + 1, x + 1 - r, y + 1); }
    else p.lineTo(x + 1, y + 1);
    if (!ri && !solido(x - 1, y)) { p.lineTo(x + r, y + 1); p.quadraticCurveTo(x, y + 1, x, y + 1 - r); }
    else p.lineTo(x, y + 1);
    p.closePath();
  }
  /* la textura: son marcas, no una foto. Van con el color del propio bloque
     un escalon mas oscuro, asi el material se lee y el cuadro no se ensucia */
  if (DET > 0) for (let y = 0; y < M.ny; y++) for (let x = 0; x < M.nx; x++) {
    const t = en(M, x, y, ZC); if (t === VACIO) continue;
    if (en(M, x, y + 1, ZC) === VACIO && (t === PASTO || t === NIEVE)) continue;
    const o = dame(t), p = o.lin, R = azar((x * 733) ^ (y * 199) ^ (t * 37));
    if (t === LADRILLO || t === PIEDRA) {
      const off = (y % 2) * 0.5;
      p.moveTo(x, y + 0.5); p.lineTo(x + 1, y + 0.5);
      p.moveTo(x + off, y); p.lineTo(x + off, y + 0.5);
      p.moveTo(x + (off + 0.5) % 1, y + 0.5); p.lineTo(x + (off + 0.5) % 1, y + 1);
    } else if (t === MADERA) {
      p.moveTo(x, y + 0.34); p.lineTo(x + 1, y + 0.34);
      p.moveTo(x, y + 0.70); p.lineTo(x + 1, y + 0.70);
    } else if (t === METAL) {
      for (const [dx, dy] of [[0.22, 0.22], [0.78, 0.22], [0.22, 0.78], [0.78, 0.78]]) {
        p.moveTo(x + dx + 0.06, y + dy); p.arc(x + dx, y + dy, 0.06, 0, 6.2832);
      }
    } else {
      /* TIERRA, ARENA Y PASTO TAMBIEN SE MARCAN EN MEDIA, y no es un lujo: el
         terreno de este juego baja de la plataforma hasta el canto de abajo,
         o sea que un cuarto de la pantalla es ese material. Sin una sola
         marca eso no se lee a tierra, se lee a un rectangulo marron —medido
         en la captura de la pradera, la banda de abajo salia lisa de punta a
         punta mientras la de piedra, que si tiene junta, se leia a muro.    */
      const nm = DET > 1 ? 3 : 2;
      for (let i = 0; i < nm; i++) {
        const ax = x + 0.15 + R() * 0.7, ay = y + 0.15 + R() * 0.7, s = 0.06 + R() * 0.09;
        p.moveTo(ax - s, ay); p.lineTo(ax + s, ay);
      }
    }
  }
  /* el pasto y la nieve: briznas en la tapa, que es lo unico que dice de que
     esta hecha la superficie sobre la que se para el arquero */
  const brizna = new Path2D();
  let hayBr = false, brCol = null;
  if (DET > 0) for (let x = -3; x < M.nx + 3; x++) {
    const xs = cl(x, 0, M.nx - 1);
    const hy = altura(M, xs); if (hy <= 0) continue;
    const t = en(M, xs, hy - 1, ZC);
    if (t !== PASTO && t !== HOJA) continue;
    hayBr = true;
    const o = dame(t); brCol = luz(o.cap0, 0.10);
    const R = azar((x * 977) ^ 61);
    const nb = DET > 1 ? 5 : 3;
    for (let i = 0; i < nb; i++) {
      const ax = x + 0.08 + R() * 0.84, al = 0.16 + R() * 0.22, dx = (R() - 0.5) * 0.18;
      brizna.moveTo(ax, hy); brizna.quadraticCurveTo(ax + dx * 0.5, hy + al * 0.6, ax + dx, hy + al);
    }
  }
  return { capas: [...capas.values()], brizna, hayBr, brCol };
}
function terrDibuja(g, T2) {
  for (const o of T2.capas) {
    g.fillStyle = _r2c(o.col); g.fill(o.fill); LLAM++;
    g.fillStyle = _r2c(o.cap0); g.fill(o.cap); LLAM++;
    if (DET > 0) {
      g.strokeStyle = _rgba(o.borde, 0.34); g.lineWidth = 0.045; g.stroke(o.lin); LLAM++;
    }
  }
  if (T2.hayBr) {
    g.strokeStyle = _r2c(T2.brCol); g.lineWidth = 0.055; g.lineCap = 'round';
    g.stroke(T2.brizna); LLAM++;
  }
}

/* ── EL FONDO ─────────────────────────────────────────────────────────────
   DOS BANDAS Y NADA MAS. En vector plano la profundidad es cuantas capas hay
   y de que color, no cuanto detalle tiene cada una: una banda con arboles
   dibujados uno por uno se lee mas cerca que el terreno.                  */
function crestaP(rnd, base, amp, freq, punta) {
  const p = new Path2D();
  const x0 = -4, x1 = NX + 4, paso = 0.5;
  const f1 = rnd() * 6.28, f2 = rnd() * 6.28;
  p.moveTo(x0, -4);
  for (let x = x0; x <= x1 + 0.01; x += paso) {
    let n = Math.sin(x * freq + f1) * 0.62 + Math.sin(x * freq * 2.3 + f2) * 0.38;
    if (punta) n = Math.pow(Math.abs(n), 0.62) * Math.sign(n);
    p.lineTo(x, base + n * amp);
  }
  p.lineTo(x1, -4); p.closePath();
  return p;
}
function arbolesP(rnd, base, n, alto, conif) {
  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const x = -3 + rnd() * (NX + 6), h = alto * (0.7 + rnd() * 0.6), w = h * (conif ? 0.34 : 0.52);
    const y = base + (rnd() - 0.5) * 1.2;
    if (conif) {
      for (let k = 0; k < 3; k++) {
        const kk = k / 3, yy = y + h * kk, ww = w * (1 - kk * 0.55), hh = h * 0.52;
        p.moveTo(x - ww, yy); p.lineTo(x, yy + hh); p.lineTo(x + ww, yy); p.closePath();
      }
    } else {
      p.moveTo(x + w, y + h * 0.55); p.arc(x, y + h * 0.55, w, 0, 6.2832);
      p.rect(x - w * 0.13, y, w * 0.26, h * 0.6);
    }
  }
  return p;
}
function fondoArma(M) {
  const pal = PALETAS[(M.paleta || 0) % PALETAS.length];
  const rnd = azar((M.n + 3) * 4517 + 19);
  const tin = _h2r(pal.t);
  const c1 = mezR(satura(pal.lejos[0]), tin, pal.bruma * 1.25);
  const c2 = mezR(satura(pal.lejos[1]), tin, pal.bruma * 0.60);
  const L = [];
  if (M.bio === 'monte') {
    L.push({ p: crestaP(rnd, 15, 6.2, 0.34, true), c: c1 });
    if (DET > 0) L.push({ p: crestaP(rnd, 10, 4.0, 0.52, true), c: c2 });
  } else if (M.bio === 'desierto') {
    L.push({ p: crestaP(rnd, 11, 3.0, 0.26, false), c: c1 });
    if (DET > 0) L.push({ p: crestaP(rnd, 7.5, 2.2, 0.42, false), c: c2 });
  } else if (M.bio === 'bosque') {
    L.push({ p: crestaP(rnd, 11, 2.4, 0.30, false), c: c1 });
    if (DET > 0) {
      L.push({ p: arbolesP(rnd, 10, DET > 1 ? 16 : 9, 4.6, true), c: c1 });
      L.push({ p: crestaP(rnd, 8, 1.8, 0.46, false), c: c2 });
    }
  } else {
    L.push({ p: crestaP(rnd, 12, 3.4, 0.28, false), c: c1 });
    if (DET > 0) {
      L.push({ p: crestaP(rnd, 8.5, 2.2, 0.44, false), c: c2 });
      L.push({ p: arbolesP(rnd, 8.2, DET > 1 ? 9 : 5, 3.0, false), c: c2 });
    }
  }
  return L;
}

/* ══════════════════════ EL MUNDO DIBUJADO ══════════════════════ */
function fondoDe(pi) {
  const pal = PALETAS[pi % PALETAS.length];
  /* el degradado de CSS no se va: es lo que se ve mientras el modulo carga y
     en el primer cuadro, antes de que haya nada dibujado. */
  $('marco').style.background = 'linear-gradient(180deg,' + pal.cielo[0] + ' 0%,' +
    pal.cielo[1] + ' 40%,' + pal.cielo[2] + ' 72%,' + pal.cielo[3] + ' 100%)';
  CIELO_PI = pi % PALETAS.length;
}
function soltaMundo() { DIO = null; }

function construyeMundo(M) {
  const pi = (M.paleta || 0) % PALETAS.length;
  fondoDe(pi);
  DIO = {
    M, pi,
    terr: terrArma(M),
    fondo: fondoArma(M),
    fl: null,                       /* la flecha en vuelo */
    pv: null,                       /* la vista previa */
    cla: [],                        /* las clavadas */
    eqD: new Float32Array(26 * 5), eqN: 0, eqC: [200, 200, 200],
    raD: new Float32Array(30 * 3), raN: 0,
    esD: new Float32Array(EST_N * 2), esI: 0, esN: 0,   /* la estela */
  };
  rayasArma(M.viento);
}
function rehaceTerreno() { if (DIO) DIO.terr = terrArma(DIO.M); }

/* ── LA FLECHA ────────────────────────────────────────────────────────────
   El rumbo sale de la VELOCIDAD y no de restar dos posiciones: en el apice
   vy cruza el cero y con posiciones la flecha pega un tiron justo ahi.    */
/* ── LA ESTELA ────────────────────────────────────────────────────────────
   ES LO QUE HACE VISIBLE LA FLECHA DEL RIVAL. Su vuelo dura unas cuatro
   decimas y la flecha mide 33 px: mirando el cuadro suelto no hay nada que
   ver, porque lo que la delata no es su forma sino su RECORRIDO. Catorce
   posiciones guardadas —siete celdas de cola a velocidad de crucero— y todas
   en UN solo trazo: son puntos que se achican, igual que la vista previa, y
   eso no es coqueteria — con una polilinea que se afina harian falta trece
   llamadas de dibujo por cuadro sobre un cuadro que cuesta setenta y cinco.
   Y de paso las dos cosas hablan el mismo idioma: puntos blancos = camino de
   la flecha, antes y despues de soltarla.                                 */
const EST_N = 14;
function flechaPon(x, y, vx, vy) {
  if (!DIO) return;
  DIO.fl = { x, y, a: Math.atan2(vy, vx) };
  DIO.esD[DIO.esI * 2] = x; DIO.esD[DIO.esI * 2 + 1] = y;
  DIO.esI = (DIO.esI + 1) % EST_N;
  if (DIO.esN < EST_N) DIO.esN++;
}
function flechaOculta() { if (DIO) { DIO.fl = null; DIO.esN = 0; DIO.esI = 0; } }
function previaPon(pts, n) {
  if (!DIO) return;
  const c = Math.min(n, Math.floor(pts.length / 2));
  DIO.pv = { pts, n: c };
}
function previaOculta() { if (DIO) DIO.pv = null; }
function clavaFlecha(x, y, ang) {
  if (!DIO) return;
  DIO.cla.push({ x, y, a: ang });
  if (DIO.cla.length > 14) DIO.cla.shift();
}
function limpiaClavadas() { if (DIO) DIO.cla.length = 0; }

const FL_L = 0.95;
function flechaP(g, x, y, a, col, pl) {
  g.save(); g.translate(x, y); g.rotate(a);
  g.lineCap = 'round';
  g.strokeStyle = col; g.lineWidth = 0.085;
  g.beginPath(); g.moveTo(-FL_L, 0); g.lineTo(0, 0); g.stroke(); LLAM++;
  g.fillStyle = col;
  g.beginPath(); g.moveTo(0.16, 0); g.lineTo(-0.10, 0.13); g.lineTo(-0.10, -0.13); g.closePath(); g.fill(); LLAM++;
  g.fillStyle = pl;
  g.beginPath();
  g.moveTo(-FL_L, 0); g.lineTo(-FL_L + 0.26, 0.15); g.lineTo(-FL_L + 0.20, 0); g.lineTo(-FL_L + 0.26, -0.15);
  g.closePath(); g.fill(); LLAM++;
  g.restore();
}

/* ── EL ESTALLIDO ────────────────────────────────────────────────────────
   Cinco datos por esquirla en un solo Float32Array: con un objeto por
   particula, veintiseis objetos nuevos por impacto son basura para el
   recolector justo en el cuadro del golpe.                                */
function estalla(x, y, tp, fuerza) {
  if (!DIO) return;
  const B = BLOQ[tp] || BLOQ[PIEDRA];
  DIO.eqC = satura(B.col);
  const n = DET === 0 ? 14 : (DET === 1 ? 20 : 26);
  const R = azar(((x * 977) | 0) ^ ((y * 613) | 0) ^ 7);
  for (let i = 0; i < n; i++) {
    const a = R() * 6.2832, v = (2.4 + R() * 6.0) * fuerza;
    DIO.eqD[i * 5] = x; DIO.eqD[i * 5 + 1] = y;
    DIO.eqD[i * 5 + 2] = Math.cos(a) * v;
    DIO.eqD[i * 5 + 3] = Math.abs(Math.sin(a)) * v * 1.15 + 1.5;
    DIO.eqD[i * 5 + 4] = 0.45 + R() * 0.42;
  }
  DIO.eqN = n;
}

/* ── LAS RAYAS DEL VIENTO ─────────────────────────────────────────────── */
/* LA BANDA DE LAS RAYAS ES FIJA Y NO SALE DEL ENCUADRE: con la camara
   moviendose, sembrarlas contra el alto visible del momento las dejaria
   apiladas en la franja del ultimo `medir()` — y encima habria que
   resembrarlas por cuadro, que es justo lo que este arreglo no hace. */
const RAYA_ALTO = 34;
function rayasArma(w) {
  if (!DIO) return;
  const n = Math.abs(w) < 0.4 ? 0 : (DET === 0 ? 12 : DET === 1 ? 20 : 30);
  const R = azar(((w * 100) | 0) + 991);
  for (let i = 0; i < n; i++) {
    DIO.raD[i * 3] = R() * (NX + 8) - 4;
    DIO.raD[i * 3 + 1] = 4 + R() * RAYA_ALTO;
    DIO.raD[i * 3 + 2] = 0.5 + R() * 1.2;
  }
  DIO.raN = n;
}

function escPaso(dt, w) {
  camPaso(dt);
  if (!DIO) return;
  CIELO_OX -= (w || 0) * dt * 1.9;
  if (DIO.eqN > 0) {
    let vivas = 0;
    for (let i = 0; i < DIO.eqN; i++) {
      const b = i * 5;
      if (DIO.eqD[b + 4] <= 0) continue;
      DIO.eqD[b + 4] -= dt;
      DIO.eqD[b + 3] -= 26 * dt;
      DIO.eqD[b] += DIO.eqD[b + 2] * dt;
      DIO.eqD[b + 1] += DIO.eqD[b + 3] * dt;
      if (DIO.eqD[b + 4] > 0) vivas++;
    }
    if (!vivas) DIO.eqN = 0;
  }
  if (DIO.raN > 0) {
    const v = (w || 0) * 0.85;
    for (let i = 0; i < DIO.raN; i++) {
      const b = i * 3;
      DIO.raD[b] += v * dt;
      if (DIO.raD[b] > NX + 5) DIO.raD[b] -= NX + 10;
      if (DIO.raD[b] < -5) DIO.raD[b] += NX + 10;
    }
  }
}

/* ══════════════════════ EL CUADRO ══════════════════════ */
function escDibuja() {
  if (!G2) return;
  LLAM = 0;
  const g = G2;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  /* el cielo: dos pegadas con el corrimiento del viento */
  const cie = cieloLienzo(CIELO_PI);
  let ox = CIELO_OX % ANCHO; if (ox > 0) ox -= ANCHO;
  g.imageSmoothingEnabled = true;
  g.drawImage(cie, ox, 0, ANCHO, ALTO); LLAM++;
  g.drawImage(cie, ox + ANCHO, 0, ANCHO, ALTO); LLAM++;

  if (!DIO) { LLAM_ANT = LLAM; return; }

  g.save();
  g.translate(OFX, OFY); g.scale(PX, -PX);
  g.lineJoin = 'round'; g.lineCap = 'round';

  for (const l of DIO.fondo) { g.fillStyle = _r2c(l.c); g.fill(l.p); LLAM++; }

  if (DIO.raN > 0) {
    g.strokeStyle = 'rgba(255,255,255,.34)'; g.lineWidth = 0.055;
    g.beginPath();
    for (let i = 0; i < DIO.raN; i++) {
      const b = i * 3;
      g.moveTo(DIO.raD[b], DIO.raD[b + 1]);
      g.lineTo(DIO.raD[b] + DIO.raD[b + 2] * Math.sign(DIO.M.viento || 1), DIO.raD[b + 1]);
    }
    g.stroke(); LLAM++;
  }

  terrDibuja(g, DIO.terr);

  /* las clavadas van DEBAJO de los arqueros: una flecha clavada en la meseta
     tapando la pierna se lee a que le entro por el pie */
  if (DIO.cla.length) for (const c of DIO.cla) flechaP(g, c.x, c.y, c.a, '#5a4130', '#e8e2d4');

  arqDibuja(g, ARQ[0]); arqDibuja(g, ARQ[1]);

  if (DIO.pv) {
    g.fillStyle = 'rgba(255,255,255,.72)';
    g.beginPath();
    for (let i = 0; i < DIO.pv.n; i++) {
      const x = DIO.pv.pts[i * 2], y = DIO.pv.pts[i * 2 + 1], r = 0.115 * (1 - i * 0.085);
      g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.2832);
    }
    g.fill(); LLAM++;
  }
  if (DIO.fl && DIO.esN > 1) {
    const n = DIO.esN;
    g.fillStyle = 'rgba(255,255,255,.36)';
    g.beginPath();
    for (let k = 0; k < n; k++) {
      const i = (DIO.esI - n + k + EST_N * 2) % EST_N;
      const u = (k + 1) / n, r = 0.105 * u * u;
      const x = DIO.esD[i * 2], y = DIO.esD[i * 2 + 1];
      g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.2832);
    }
    g.fill(); LLAM++;
  }
  if (DIO.fl) flechaP(g, DIO.fl.x, DIO.fl.y, DIO.fl.a, '#4a3222', '#f2ece0');

  if (DIO.eqN > 0) {
    g.fillStyle = _r2c(DIO.eqC);
    g.beginPath();
    for (let i = 0; i < DIO.eqN; i++) {
      const b = i * 5; if (DIO.eqD[b + 4] <= 0) continue;
      const k = cl(DIO.eqD[b + 4] / 0.6, 0, 1), s = 0.13 * k;
      g.rect(DIO.eqD[b] - s, DIO.eqD[b + 1] - s, s * 2, s * 2);
    }
    g.fill(); LLAM++;
  }

  g.restore();
  LLAM_ANT = LLAM;
}

function escCosto() {
  return { llamadas: LLAM_ANT, triangulos: 0, cal: PROG.cal,
           px: +DPR.toFixed(2), w: ANCHO, h: ALTO, det: DET,
           encW: +ENC_W.toFixed(2), encH: +ENC_H.toFixed(2), mira: +MIRA.toFixed(2),
           celda: +PX.toFixed(2),
           cam: { cx: +CAM.cx.toFixed(2), cy: +CAM.cy.toFixed(2), cel: +CAM.cel.toFixed(2),
                  foco: !!CAM.foco,
                  arqPx: +(ARQ_ALTO * PX).toFixed(1), flePx: +((FL_L + 0.16) * PX).toFixed(1),
                  bajo: +(CAM.cy - ENC_H).toFixed(3), izq: +(CAM.cx - ENC_W).toFixed(2),
                  der: +(CAM.cx + ENC_W).toFixed(2) } };
}
/* ══════════════════════════════════════════════════════════════════════════
   F · LOS DOS ARQUEROS, EN VECTOR PLANO

   EL DIBUJO Y EL BLANCO SON LOS MISMOS NUMEROS. `ARQ_MED`, `ARQ_ALTO`,
   `CAB_MED` y `CAB_ALTO` viven en `d.js` —donde esta el choque— y este
   archivo los LEE. Con dos juegos de medidas, el jugador le pegaria al aire
   donde ve un cuerpo, o al reves: le acertaria a una nada. En un juego cuyo
   unico verbo es apuntar, eso no es un detalle de dibujo.

   Y LA MANO DEL ARCO ES `bocaDe()`, la misma que usan la balistica, el
   resolvedor y el rival. La flecha sale exactamente de donde se ve el arco.

   EL BRAZO SIGUE A LA MANO, NO AL REVES. Lo natural seria pivotar el brazo
   desde el hombro y dejar que la mano caiga donde caiga — y ahi la boca del
   arco se mueve con la pose y deja de coincidir con `bocaDe()`. Aca la mano
   esta clavada en su punto y el codo se RESUELVE (`codoDe`, dos huesos): el
   dibujo se deriva de la fisica y no puede separarse de ella.

   EL RIVAL ES EL MISMO DIBUJO ESPEJADO EN X. Todo lo de abajo esta escrito
   en el marco local del arquero —x hacia adelante, y desde los pies— asi
   que no hay una sola cuenta aparte para el de la derecha. Y el espejo es
   una transformacion del lienzo, no un segundo juego de coordenadas.
   ══════════════════════════════════════════════════════════════════════════ */

const HOMBRO_Y = 1.82, BRAZO_L = 0.90;
const CADERA_Y = 0.88, PIERNA_L = 0.88;
/* dos huesos por brazo. La suma pasa apenas de BRAZO_L: con la suma justa,
   el codo se estira en linea recta al llegar al limite y el brazo se lee a
   palo en la pose que mas se mira, que es la de apuntar.                  */
const BR1 = 0.50, BR2 = 0.46;

/* ── EL TUMBO ─────────────────────────────────────────────────────────────
   ES DIBUJO Y NADA MAS, Y ESO NO ES UNA CONCESION: `cajaArq` —el blanco— vive
   clavada en la columna del arquero, en `d.js`, y de ella dependen el
   resolvedor, la auditoria de los doce duelos y el auto-jugador. Un cuerpo
   que se lleva su propia caja mientras rueda convertiria «apuntarle al
   arquero» en apuntarle a donde estaba hace medio segundo, y la auditoria
   aprobaria duelos que no se pueden pelear.
   Y NO HACE FALTA que la caja se mueva, porque los turnos son alternos: el
   unico momento en que un cuerpo esta fuera de su puesto es justo despues de
   recibir un flechazo, y ahi le toca tirar A EL. Por eso `espera` no pasa el
   turno mientras haya alguien en el piso (`arqCayendo`).

   EL CUERPO ES UN SOLIDO Y LOS MIEMBROS SON RESORTES. Con el cuerpo entero
   girando en bloque se lee a tabla que cae; lo que dice «esto es un cuerpo
   sin fuerzas» es que los brazos y las piernas lleguen TARDE — cada uno con
   su muelle subamortiguado apuntando a colgar hacia abajo en el MUNDO, o sea
   a `-rot` en el marco del arquero.                                        */
const G_RAG = 18;              /* la gravedad del tumbo, en celdas/s^2      */
/* EL IMPULSO ESTA CALIBRADO CONTRA EL TOPE, y el primer valor no lo estaba:
   con 2,4 y 3,2 el cuerpo llegaba al canto de la meseta y al maximo de giro
   TAMBIEN con un golpe de cuerpo, asi que un rozon y un cabezazo terminaban
   en la misma pose — el clamp se comia justo la diferencia que el empujon
   existe para mostrar. Medido el PICO —muestreando cada 16 ms el tumbo
   entero, porque una sola lectura a los 200 ms agarra a los dos a mitad de
   camino y devuelve el mismo numero— el cuerpo se va 0,755 celdas y gira
   80 grados, y la cabeza pega en el tope: 1,05 celdas y 93 grados, o sea
   1,4 veces mas lejos y boca arriba contra tumbado.                       */
const RAG_VX = 1.2, RAG_VY = 3.5, RAG_VR = 2.3;
/* EL TOPE SALE DE LA MESETA MEDIDA, no de un numero comodo: el aplanado de
   `c.js` va de X-1 a X+1, asi que el piso plano del rival llega a x=17 y el
   arquero esta en 15,5. Con 1,35 el cuerpo tumbado quedaba con el hombro
   colgando del canto Y ademas cortado por el borde del cuadro en reposo.  */
const RAG_XMIN = -1.05, RAG_XMAX = 0.15;
const RAG_ROT_MAX = 1.62;      /* boca arriba y no mas: no rueda de espaldas */
const RAG_K = 140, RAG_C = 11; /* muelle de miembro: zeta ~ 0,46            */
const RAG_LEV = 0.55;          /* lo que tarda en volver a ponerse de pie   */

/* un muelle subamortiguado, integrado en subpasos: con dt de 0,05 y K de 140
   el producto K*dt pasa de 1 y el integrador explota — el muelle sale
   disparado y el brazo desaparece de la pantalla. */
function muelle(a, k, obj, dt) {
  const v = k + 'v';
  const ns = Math.max(1, Math.ceil(dt * 120)), h = dt / ns;
  for (let i = 0; i < ns; i++) {
    a[v] += ((obj - a[k]) * RAG_K - a[v] * RAG_C) * h;
    a[k] += a[v] * h;
  }
}
const suave = u => u * u * (3 - 2 * u);

/* el perfil de media limba, de la empunadura a la punta. Es UNA curva y no
   cuatro tramos rectos: a los ~40 px que mide el arco en pantalla, lo unico
   que dice «esto es un arco» es que la silueta se curve hacia el blanco.

   Y ESTABA DADO VUELTA. Las puntas caian en x = +0,34, o sea DELANTE de la
   empunadura, asi que la cuerda —que va de punta a punta— pasaba por encima
   del puno y entre el arquero y el blanco. Un arco de verdad es al reves:
   target <- empunadura <- cuerda <- arquero, y la separacion entre las dos
   ES el brace height. Con la empunadura adelante (x = +0,02) y las puntas
   atras (-0,30) la curva bombea hacia el blanco, que es lo que hace una
   limba, y la cuerda queda del lado del que tira.                         */
const ARCO_PT = [0.02, 0.20, -0.03, 0.60, -0.30, 0.98];  /* p0, control, p1 */
const ARCO_PUNTA = [-0.30, 0.98];

/* EL NOCK: donde esta la cuerda. En reposo cae en la linea de las dos puntas
   —o sea recta— y al tensar viaja hacia atras por la linea de la flecha.
   0,85 sobre un arquero de 2,10 son unos 71 cm de apertura a escala de
   persona, que es lo que mide un tiro de verdad. */
const NOCK_0 = -0.30, NOCK_1 = -0.85;

const ARQ_COL = [
  /* 0 = el jugador. Los otros son los rivales, uno por duelo (se repiten a
     partir del 6): dos rivales del mismo color se leen a la misma persona. */
  { piel: 0xe0a878, ropa: 0x2f7fa8, det: 0xdfe6ea, arco: 0x8a5a2e, pelo: 0x3a2b22 },
  { piel: 0xd9a070, ropa: 0x8a4a3a, det: 0xe8d7b0, arco: 0x6f4a28, pelo: 0x241a14 },
  { piel: 0xe8c090, ropa: 0x4a7a3a, det: 0xd8e0c0, arco: 0x7a5230, pelo: 0x4a3a20 },
  { piel: 0xc98f66, ropa: 0x6a4a8a, det: 0xe0d8ee, arco: 0x5f4230, pelo: 0x1e1a24 },
  { piel: 0xf0c8a0, ropa: 0xb08030, det: 0xf0e6c8, arco: 0x8a6234, pelo: 0x6a4a20 },
  { piel: 0xb98a68, ropa: 0x2f5f6a, det: 0xcfe0e4, arco: 0x4f3a28, pelo: 0x2a2420 },
];

const ARQ = [null, null];

/* ── LOS COLORES DE UN ARQUERO ────────────────────────────────────────────
   Se resuelven UNA vez al crearlo y no por cuadro: `satura` pasa por HSL y
   volver a hacer esa cuenta doce veces por arquero y sesenta veces por
   segundo es trabajo puro para obtener siempre lo mismo.                  */
function arqPaleta(C) {
  const p = {};
  for (const k of ['piel', 'ropa', 'det', 'arco', 'pelo']) p[k] = satura(C[k]);
  p.ropaS = luz(p.ropa, -0.10);        /* la sombra del torso */
  p.ropaO = luz(p.ropa, -0.19);        /* la manga, para que el hombro no se funda */
  p.pielS = luz(p.piel, -0.11);
  p.arcoO = luz(p.arco, -0.14);
  p.borde = luz(p.ropa, -0.30);
  p.cuerda = [242, 238, 226];
  p.metal = [216, 221, 224];
  for (const k in p) if (Array.isArray(p[k])) p[k] = _r2c(p[k]);
  return p;
}

/* ── DIBUJO: PIEZAS ──────────────────────────────────────────────────────
   Todo son capsulas y rectangulos redondeados. No hay una sola linea recta
   con canto vivo en el cuerpo, y eso no es coqueteria: en vector plano el
   canto redondeado es lo que separa un personaje de una caja de prueba.  */
function capsu(g, x0, y0, x1, y1, w, col) {
  g.strokeStyle = col; g.lineWidth = w;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); LLAM++;
}
function rredon(g, x, y, w, h, r, col) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.fillStyle = col; g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, rr);
  else {
    g.moveTo(x + rr, y); g.lineTo(x + w - rr, y);
    g.quadraticCurveTo(x + w, y, x + w, y + rr); g.lineTo(x + w, y + h - rr);
    g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h); g.lineTo(x + rr, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - rr); g.lineTo(x, y + rr);
    g.quadraticCurveTo(x, y, x + rr, y);
  }
  g.fill(); LLAM++;
}
function disco(g, x, y, r, col) {
  g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); LLAM++;
}

/* ── EL CODO ─────────────────────────────────────────────────────────────
   Dos huesos y una circunferencia: el codo es uno de los dos cortes entre
   la esfera del hombro y la de la mano, y `s` elige cual. Sin esto el brazo
   es una capsula recta, y una capsula recta del hombro a la boca del arco
   no se lee a brazo: se lee a puntero.                                    */
function codoDe(sx, sy, hx, hy, s) {
  const dx = hx - sx, dy = hy - sy;
  let d = Math.hypot(dx, dy);
  const max = BR1 + BR2 - 0.004;
  if (d < 1e-4) { d = 1e-4; }
  const dd = Math.min(d, max);
  const ux = dx / d, uy = dy / d;
  const a = (dd * dd + BR1 * BR1 - BR2 * BR2) / (2 * dd);
  const h = Math.sqrt(Math.max(0, BR1 * BR1 - a * a));
  return [sx + ux * a + uy * h * s, sy + uy * a - ux * h * s];
}
/* EL NOCK NO PUEDE IRSE MAS ATRAS DE LO QUE EL BRAZO ALCANZA. Tensar es
   llevar el puno hasta `nock` sobre la linea de la flecha, y a angulos altos
   ese punto se va a metro y pico del hombro contra los 0,96 que mide el
   brazo: `codoDe` recorta la distancia pero sigue DIBUJANDO la mano donde se
   la pidieron, asi que el antebrazo se estira ocho pixeles sobre un arquero
   de cincuenta y tres. Se corta la linea contra la esfera del alcance — o
   sea que el arquero tensa lo que puede y no lo que se le pidio.
   (t^2 + 2t(P.d) + |P|^2 = R^2 con P = boca - hombro; se toma la raiz de
   atras, que es el punto mas lejos al que el puno todavia llega.)         */
const ALC_R = BR1 + BR2 - 0.02;
function nockTope(bx, by, ang, n) {
  const px = bx, py = by - HOMBRO_Y;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const pd = px * dx + py * dy, p2 = px * px + py * py;
  const disc = pd * pd - p2 + ALC_R * ALC_R;
  if (disc <= 0) return n;              /* la boca ya esta fuera: no hay corte */
  return Math.max(n, -pd - Math.sqrt(disc));
}

function brazoDib(g, P, sx, sy, hx, hy, s, manga) {
  const [ex, ey] = codoDe(sx, sy, hx, hy, s);
  capsu(g, sx, sy, ex, ey, 0.25, manga ? P.ropaO : P.pielS);
  capsu(g, ex, ey, hx, hy, 0.20, P.piel);
  disco(g, hx, hy, 0.125, P.piel);
}

/* ── EL ARQUERO ──────────────────────────────────────────────────────────
   El orden es de atras hacia adelante y no es negociable: la pierna y el
   brazo de atras, el cuerpo, la cabeza, y recien despues el arco y el brazo
   que lo sostiene. Con el arco debajo del torso, el unico objeto que dice
   de que se trata el juego queda tapado por una camiseta.                */
function arqDibuja(g, a) {
  if (!a || !a.puesto) return;
  const P = a.pal, S = a.P;
  g.save();
  g.translate(a.x, a.piso);
  if (a.lado) g.scale(-1, 1);
  /* EL TUMBO VA ANTES QUE TODO Y DESPUES DEL ESPEJO: escrito en el marco
     local, `-x` es «hacia atras» para los dos arqueros, y el espejo da vuelta
     el eje Y EL SENTIDO DEL GIRO a la vez, asi que los dos caen para el lado
     contrario al que les tiraron sin una sola cuenta aparte. Y pivota en la
     CADERA, no en los pies: un cuerpo que gira desde los tobillos se lee a
     poste que se cae, no a persona que sale despedida.                    */
  if (a.rag) {
    g.translate(a.rx, a.ry + CADERA_Y); g.rotate(a.rot); g.translate(0, -CADERA_Y);
  }
  g.lineCap = 'round'; g.lineJoin = 'round';

  const resp = S.resp, tr = S.torsoR + a.incl;
  const hy = HOMBRO_Y + resp;

  /* PIERNAS. Pivotan en la cadera; el pie es un ovalo aparte porque una
     capsula sola termina en punta y el arquero parece flotar.            */
  for (const [ang, zz] of [[S.piTR, 1], [S.piFR, 0]]) {
    const kx = Math.sin(ang) * PIERNA_L, ky = -Math.cos(ang) * PIERNA_L;
    const px = kx, py = CADERA_Y + resp * 0.4 + ky;
    capsu(g, 0, CADERA_Y + resp * 0.4, px, py, zz ? 0.28 : 0.30, zz ? P.ropaS : P.ropa);
    rredon(g, px - 0.13, py - 0.10, 0.42, 0.20, 0.09, zz ? '#2e2f38' : '#22232a');
  }

  /* BRAZO DE LA CUERDA: DE QUE LADO DEL TORSO VA LO DECIDE DONDE ESTA LA
     MANO, no una constante. Iba SIEMPRE detras, y eso valia cuando el puno
     estaba escrito a mano por detras del hombro; desde que el puno sale del
     nock —o sea de la linea de la flecha— a angulos de subida cae DELANTE
     del pecho, y dibujado atras el brazo entero desaparece adentro de la
     camiseta: el arquero tensa con un brazo que no se ve.                */
  const manoAdel = S.manoTx > -0.05;
  const braT = () => brazoDib(g, P, 0, hy, S.manoTx, S.manoTy + resp, -1, true);
  if (!manoAdel) braT();

  /* EL CARCAJ, antes del torso: cruzado a la espalda dice «este tipo tira
     flechas» sin un solo rotulo, y de perfil es la silueta que lo separa
     de un muneco cualquiera.                                             */
  g.save();
  g.translate(-0.20, CADERA_Y + 0.62 + resp); g.rotate(tr + 0.22);
  rredon(g, -0.14, -0.44, 0.28, 0.96, 0.11, P.arcoO);
  for (let k = 0; k < 3; k++) {
    capsu(g, -0.06 + k * 0.06, 0.40, -0.06 + k * 0.06, 0.74, 0.05, P.arco);
    capsu(g, -0.06 + k * 0.06, 0.74, -0.06 + k * 0.06, 0.86, 0.10, P.metal);
  }
  g.restore();

  /* TORSO. Se inclina desde la cadera, no desde el centro: un cuerpo que
     pivota por la panza se lee a muneco de resorte.                      */
  g.save();
  g.translate(0, CADERA_Y + resp * 0.4); g.rotate(tr);
  const th = ARQ_ALTO - CADERA_Y + resp * 0.6;
  rredon(g, -0.43, -0.06, 0.86, th + 0.06, 0.26, P.ropa);
  /* la pechera clara: lo unico que separa el frente de la espalda de lejos */
  rredon(g, 0.06, th * 0.30, 0.33, th * 0.52, 0.13, P.det);
  /* la sombra del costado de atras, que es todo el volumen que este dibujo
     necesita: en vector plano dos tonos leen mas que un degradado.       */
  rredon(g, -0.43, -0.06, 0.24, th + 0.06, 0.20, P.ropaS);
  rredon(g, -0.45, -0.02, 0.90, 0.19, 0.08, P.pelo);          /* el cinto */
  g.restore();

  /* CABEZA. Va en el cuello, que es justo donde empieza su caja de choque. */
  g.save();
  g.translate(Math.sin(tr) * -(ARQ_ALTO - CADERA_Y), ARQ_ALTO + resp);
  g.rotate(S.cabR + tr);
  rredon(g, -CAB_MED, 0.02, CAB_MED * 2, CAB_ALTO - 0.02, 0.30, P.piel);
  /* la nariz sale sobre el eje del tiro: es lo unico que dice para donde
     mira, y de perfil es lo que mas se lee */
  rredon(g, CAB_MED - 0.04, CAB_ALTO * 0.36, 0.17, 0.17, 0.07, P.piel);
  /* el pelo tapa la coronilla y baja por la nuca */
  g.fillStyle = P.pelo; g.beginPath();
  g.moveTo(-CAB_MED - 0.03, CAB_ALTO * 0.34);
  g.lineTo(-CAB_MED - 0.03, CAB_ALTO * 0.80);
  g.quadraticCurveTo(-CAB_MED - 0.03, CAB_ALTO + 0.06, 0, CAB_ALTO + 0.06);
  g.quadraticCurveTo(CAB_MED + 0.02, CAB_ALTO + 0.06, CAB_MED + 0.02, CAB_ALTO * 0.66);
  g.lineTo(CAB_MED * 0.34, CAB_ALTO * 0.74);
  g.lineTo(-CAB_MED * 0.10, CAB_ALTO * 0.62);
  g.closePath(); g.fill(); LLAM++;
  /* LA BANDA OSCURA DE LOS OJOS Y NO DOS PUNTITOS: a treinta pixeles de
     alto, un ojo de tres pixeles no existe; una franja si, y encima es la
     cara de la referencia.                                               */
  rredon(g, -0.10, CAB_ALTO * 0.50, CAB_MED + 0.16, 0.17, 0.07, '#22232a');
  disco(g, CAB_MED * 0.52, CAB_ALTO * 0.585, 0.048, '#f4f6f8');
  capsu(g, -0.02, CAB_ALTO * 0.30, CAB_MED * 0.62, CAB_ALTO * 0.30, 0.06, P.pielS);
  g.restore();

  /* EL ARCO. Cuelga de la boca, asi que girarlo apunta el arco sin mover la
     boca ni un milimetro — que es lo que garantiza que la flecha salga de
     donde se ve.                                                          */
  if (S.arcoVis) {
    g.save();
    g.translate(S.bocaX, S.bocaY + resp); g.rotate(S.arcoAng);
    const [p0x, p0y, cx, cy, p1x, p1y] = ARCO_PT;
    g.strokeStyle = P.arco; g.lineWidth = 0.105;
    g.beginPath();
    g.moveTo(p1x, -p1y); g.quadraticCurveTo(cx, -cy, p0x, -p0y);
    g.lineTo(p0x, p0y); g.quadraticCurveTo(cx, cy, p1x, p1y);
    g.stroke(); LLAM++;
    rredon(g, -0.09, -0.25, 0.20, 0.50, 0.08, P.pelo);        /* la empunadura */
    /* LA CUERDA VA APARTE Y SE MUEVE: tensar es tirar el nock hacia atras,
       y con la cuerda dibujada fija la unica senal de la tension serian
       los pies del arquero. La V del arco tensado sale sola.             */
    g.strokeStyle = P.cuerda; g.lineWidth = 0.045;
    g.beginPath();
    g.moveTo(ARCO_PUNTA[0], ARCO_PUNTA[1]);
    g.lineTo(S.nockX, 0); g.lineTo(ARCO_PUNTA[0], -ARCO_PUNTA[1]);
    g.stroke(); LLAM++;
    if (S.flVis) {
      /* LARGO DE FLECHA DE VERDAD: 1,02 sobre un arquero de 2,10 son unos
         85 cm, y con la apertura llena la punta queda justo pasando la
         empunadura — que es como se ve un arco tensado. Con los 0,94 de
         antes la punta se quedaba corta y la flecha parecia un palito. */
      capsu(g, S.nockX, 0, S.nockX + 0.88, 0, 0.06, '#8a6034');
      g.fillStyle = _r2c([216, 221, 224]); g.beginPath();
      g.moveTo(S.nockX + 1.02, 0); g.lineTo(S.nockX + 0.84, 0.078);
      g.lineTo(S.nockX + 0.84, -0.078); g.closePath(); g.fill(); LLAM++;
      /* el emplumado: dos trazos al lado del nock. Sin ellos la flecha es
         una linea, y una linea saliendo de la cuerda no se lee a flecha. */
      capsu(g, S.nockX + 0.05, 0, S.nockX + 0.22, 0.085, 0.028, P.det);
      capsu(g, S.nockX + 0.05, 0, S.nockX + 0.22, -0.085, 0.028, P.det);
    }
    g.restore();
  }

  if (manoAdel) braT();
  /* BRAZO DE ADELANTE: el que sostiene el arco. Ultimo, por encima de todo. */
  brazoDib(g, P, 0, hy, S.bocaX, S.bocaY + resp, 1, true);
  g.restore();

/* ── ENTRADA ──────────────────────────────────────────────────────────── */
function arqEntra(M) {
  for (let l = 0; l < 2; l++) {
    if (!ARQ[l]) {
      const C = l === 0 ? ARQ_COL[0] : ARQ_COL[1 + ((JU && JU.n >= 0 ? JU.n : 0) % (ARQ_COL.length - 1))];
      ARQ[l] = { lado: l, col: C, pal: arqPaleta(C), P: {} };
    }
    const a = ARQ[l];
    a.puesto = true;
    const piso = l ? M.pisoB : M.pisoA;
    a.piso = piso;
    a.x = (l ? XB : XA) + 0.5;
    a.est = 'quieto'; a.t = 0; a.k = 0; a.ang = 0.7;
    a.ocio = Math.random() * 5; a.sac = 0; a.incl = 0; a.inclObj = 0;
    ragCero(a);
    a.boca = bocaDe(M, l);
    arqPose(a, 0);
  }
}
function arqPiso(l, p) { const a = ARQ[l]; if (a) a.piso = p; }

/* al cambiar de duelo el rival cambia de color, y eso obliga a rehacerlo: un
   rival nuevo con la ropa del anterior se lee al mismo tipo otra vez */
function arqSuelta() {
  for (let l = 0; l < 2; l++) if (ARQ[l]) ARQ[l].puesto = false;
  ARQ[1] = null;      /* el jugador se queda; el rival se rehace por duelo */
}

/* ── ESTADOS ──────────────────────────────────────────────────────────────
   Cada uno dura lo que dura la cosa, y no hay dos que puedan estar puestos a
   la vez: `arqPose` es el UNICO sitio que escribe la pose, asi que no hay
   forma de que una animacion pise a la otra a mitad de camino.             */
function arqApunta(l, angMundo, k) {
  const a = ARQ[l]; if (!a) return;
  if (a.est === 'caido' || a.est === 'levanta' || a.est === 'gana' || a.est === 'pierde') return;
  a.est = 'apunta'; a.t = 0;
  /* el rival se dibuja espejado en x, asi que el angulo hay que llevarlo al
     marco local: PI menos el de mundo es su reflejo */

  if (a.ang > Math.PI) a.ang -= 6.2832;

function arqTira(l) {

}
function ragCero(a) {
  a.rag = false; a.muere = false;
  a.rx = 0; a.ry = 0; a.rot = 0;
  a.rvx = 0; a.rvy = 0; a.rvr = 0;
  a.mPiF = 0.10; a.mPiFv = 0; a.mPiT = -0.14; a.mPiTv = 0;
  a.mCab = 0; a.mCabv = 0; a.mBrF = 0; a.mBrFv = 0; a.mBrT = 0; a.mBrTv = 0;

/* EL EMPUJON SALE DEL DANO Y NO DE UNA CONSTANTE: un rozon de veinte y un
   cabezazo de setenta tienen que verse distinto, porque el numero que sube
   en la barra ya lo dice y el cuerpo no puede contradecirlo. Medido, un
   cuerpo se va 0,755 celdas y una cabeza pega en el tope de la meseta.   */

  const a = ARQ[l]; if (!a) return;
  const f = (cab ? 1.5 : 1.0) * cl((dn || DANO_CUERPO) / DANO_CUERPO, 0.75, 1.25);
  a.est = 'caido'; a.t = 0; a.rag = true; a.muere = !!mata; a.tocado = false;
  a.rx = 0; a.ry = 0; a.rot = 0;
  a.rvx = -RAG_VX * f; a.rvy = RAG_VY * f; a.rvr = RAG_VR * f;
  a.mBrFv = -9 * f; a.mBrTv = -7 * f; a.mCabv = -6 * f;

function arqFin(l, gano) {
  const a = ARQ[l]; if (!a) return;

     haga la pose de perder deshace el unico golpe que decidio el duelo. */
  if (a.est === 'caido' && a.muere) return;
  a.rag = false; ragCero(a);
  a.est = gano ? 'gana' : 'pierde'; a.t = 0;
}
function arqQuieto(l) {
  const a = ARQ[l]; if (!a) return;
  if (a.est === 'gana' || a.est === 'pierde') return;
  if (a.est === 'caido' || a.est === 'levanta') return;
  a.est = 'quieto'; a.t = 0; a.k = 0;
}

/* ── LA POSE ─────────────────────────────────────────────────────────────
   Todo esta escrito en el marco LOCAL del arquero (x hacia adelante, y desde
   los pies), asi que el rival —espejado— sale correcto sin una sola cuenta
   aparte. Y no escribe en el lienzo: deja los numeros en `a.P` y quien
   dibuja los lee. Asi una sonda puede leer la pose sin dibujar un cuadro. */
function arqPose(a, dt) {
  const e = a.est;
  a.t += dt;

  /* la boca del arco esta clavada: es `bocaDe` menos la posicion del arquero */
  const bx = Math.abs(a.boca.x - a.x);
  const by = a.boca.y - a.piso;

  let manoTx = -0.22, manoTy = 1.20;    /* la mano de la cuerda, en reposo */
  let torsoY = 0, torsoR = 0, cabR = 0, piFR = 0.10, piTR = -0.14, resp = 0;
  let arcoVis = true, flVis = false, arcoAng = a.ang, bocaX = bx, bocaY = by;
  let nock = NOCK_0;

  if (e === 'quieto') {
    a.ocio += dt;
    resp = Math.sin(a.ocio * 1.7) * 0.012;
    /* QUIETO NO ES UNA POSE: respira y cada tanto mira al otro. Un muneco
       clavado durante el turno del rival se lee a que el juego se colgo. */
    const g = a.ocio % 6.8;
    cabR = g < 1.0 ? Math.sin(g * Math.PI / 1.0) * 0.22 : 0;
    manoTx = -0.20 + Math.sin(a.ocio * 1.7) * 0.02; manoTy = 1.18 + resp;
    /* EN REPOSO EL ARCO CUELGA CASI VERTICAL, no cruzado en diagonal por
       delante del cuerpo: con -0,95 la punta de abajo caia en (-0,18 · 0,76),
       o sea DENTRO del torso y de las piernas, y lo que se veia era un palo
       atravesado. Casi a plomo, la punta de abajo roza el piso detras de los
       pies y la de arriba llega a la altura de los ojos. */
    arcoAng = -0.18;
    bocaX = 0.42; bocaY = 1.10;
  } else if (e === 'apunta') {
    /* la cuerda se tira hasta el menton y el cuerpo se echa atras: la
       tension es lo unico que dice cuanta fuerza lleva el tiro */
    const k = a.k;
    /* LA MANO DE LA CUERDA NO SE ESCRIBE: SE DERIVA DEL NOCK. Estaban los
       dos por separado, asi que el puno terminaba en un sitio y la cuerda
       en otro — o sea que el arquero tensaba el aire. Con el nock como
       unico dato, cuerda, flecha y puno son EL MISMO PUNTO por construccion. */
    nock = nockTope(bocaX, bocaY, arcoAng, mez(NOCK_0, NOCK_1, k));
    manoTx = bocaX + nock * Math.cos(arcoAng);
    manoTy = bocaY + nock * Math.sin(arcoAng);
    torsoR = -0.06 * k; piFR = 0.10 + 0.16 * k; piTR = -0.14 - 0.10 * k;
    flVis = true;
  } else if (e === 'tira') {
    /* el retroceso: 0,42 s. La mano de la cuerda vuelve de golpe y el torso
       se sacude — sin eso, soltar se ve como que la flecha aparecio sola. */
    const u = cl(a.t / 0.42, 0, 1);
    const g = Math.exp(-u * 7) * Math.sin(u * 26);
    torsoR = 0.10 * g; cabR = -0.14 * g; resp = -0.02 * Math.abs(g);
    arcoAng = a.ang + 0.16 * g;
    /* la cuerda vuelve de golpe y la mano con ella, por el mismo camino */
    nock = nockTope(bocaX, bocaY, arcoAng, mez(NOCK_1, NOCK_0, Math.min(1, u * 5)));
    manoTx = bocaX + nock * Math.cos(arcoAng);
    manoTy = bocaY + nock * Math.sin(arcoAng);
    if (u >= 1) { a.est = 'quieto'; a.ocio = 0; }
  } else if (e === 'caido' || e === 'levanta') {
    if (e === 'caido') {
      /* el solido: gravedad, un rebote y roce contra el piso */
      a.rvy -= G_RAG * dt;
      a.rx += a.rvx * dt; a.ry += a.rvy * dt; a.rot += a.rvr * dt;
      /* LA ALTURA DEL SUELO DEPENDE DE CUANTO ESTA GIRADO: acostado, la
         cadera queda a media panza del piso y no a los 0,88 de estar de
         pie. Con una altura fija, el cuerpo horizontal flota. */
      const hc = -(CADERA_Y - 0.30) * Math.abs(Math.sin(a.rot));
      if (a.ry <= hc) {

        } else {

          a.rvx *= r; a.rvr *= Math.max(0, 1 - dt * 6);
          if (!a.tocado) { a.tocado = true; son('tumbo'); }

         pendiente. Un cuerpo que se desliza al vacio se lee a defecto. */
      a.rx = cl(a.rx, RAG_XMIN, RAG_XMAX);
      a.rot = cl(a.rot, -0.25, RAG_ROT_MAX);
      if (!a.muere && a.t > 0.9 && Math.abs(a.rvy) < 0.35 && Math.abs(a.rvr) < 0.9) {

        a.r0x = a.rx; a.r0y = a.ry; a.r0r = a.rot;
      }
    } else {
      /* SE LEVANTA VOLVIENDO AL PUESTO, y la caja de choque no se entera
         nunca porque nunca se movio: al terminar, el cuerpo esta otra vez
         exactamente donde el resolvedor cree que esta. */
      const u = cl(a.t / RAG_LEV, 0, 1), k = suave(u);
      a.rx = a.r0x * (1 - k); a.ry = a.r0y * (1 - k); a.rot = a.r0r * (1 - k);
      if (u >= 1) { a.rag = false; ragCero(a); a.est = 'quieto'; a.ocio = 0; }
    }

    /* LOS MIEMBROS CUELGAN HACIA ABAJO EN EL MUNDO, o sea a `-rot` en este
       marco — y llegan TARDE, que es lo unico que separa un cuerpo sin
       fuerzas de un maniqui girando en bloque. */
    const o = -a.rot;
    muelle(a, 'mPiF', o + 0.26, dt);
    muelle(a, 'mPiT', o - 0.30, dt);
    muelle(a, 'mCab', o * 0.80, dt);
    muelle(a, 'mBrF', o - 0.22, dt);
    muelle(a, 'mBrT', o + 0.30, dt);

    torsoR = -a.rot * 0.22; cabR = a.mCab - torsoR; resp = 0;
    piFR = a.mPiF; piTR = a.mPiT;
    const hyR = HOMBRO_Y;
    manoTx = Math.sin(a.mBrT) * BRAZO_L * 0.92;
    manoTy = hyR - Math.cos(a.mBrT) * BRAZO_L * 0.92;
    bocaX = Math.sin(a.mBrF) * BRAZO_L * 0.92;
    bocaY = hyR - Math.cos(a.mBrF) * BRAZO_L * 0.92;
    arcoAng = -1.35 - a.rot;   /* el arco cuelga de la mano, tambien sin fuerza */
    flVis = false;
  } else if (e === 'gana') {
    /* los brazos arriba y saltitos: el arco se guarda, que es lo que hace
       cualquiera que dejo de tener a quien tirarle */
    const s = Math.sin(a.t * 7.2);
    resp = Math.abs(s) * 0.16;
    manoTx = -0.30; manoTy = 2.55 + s * 0.08;
    bocaX = 0.32; bocaY = 2.60 + s * 0.08; arcoAng = 1.35; flVis = false;
    cabR = s * 0.10; piFR = 0.06; piTR = -0.08;
  } else if (e === 'pierde') {
    const u = cl(a.t / 0.9, 0, 1), k = u * u * (3 - 2 * u);
    torsoR = -0.55 * k; cabR = -0.62 * k; resp = -0.42 * k;
    manoTx = 0.10; manoTy = mez(1.20, 0.55, k);
    arcoVis = k < 0.4; bocaX = bx; bocaY = by - 0.7 * k;
    piFR = 0.55 * k; piTR = -0.55 * k;
