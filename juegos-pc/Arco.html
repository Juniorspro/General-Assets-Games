  /* el arquero se inclina hacia el tiro cuando apunta alto o bajo — es la
     unica pista de la INTENCION antes de que la flecha salga */
  a.inclObj = (e === 'apunta') ? cl(a.ang * 0.10, -0.14, 0.14) : 0;
  a.incl += (a.inclObj - a.incl) * Math.min(1, dt * 9);

  /* EL NOCK ES EL MISMO PUNTO PARA LA CUERDA Y PARA LA FLECHA, asi que la
     flecha nunca puede quedar despegada de la cuerda por mucho que se tense */
  const P = a.P;
  P.resp = resp; P.torsoR = torsoR; P.cabR = cabR;
  P.piFR = piFR; P.piTR = piTR;
  P.manoTx = manoTx; P.manoTy = manoTy;
  P.arcoVis = arcoVis; P.flVis = flVis; P.arcoAng = arcoAng;
  P.bocaX = bocaX; P.bocaY = bocaY;
  P.nockX = nock;
}

function arqPaso(dt) {
  for (const a of ARQ) if (a && a.puesto) arqPose(a, dt);
}
const arqOcupado = a => !a || a.est === 'tira' || a.est === 'caido' || a.est === 'levanta';
const arqLibre = () => !ARQ[0] || (!arqOcupado(ARQ[0]) && (!ARQ[1] || !arqOcupado(ARQ[1])));
/* EL TURNO NO PASA MIENTRAS HAY ALGUIEN EN EL PISO — y el que se murio no
   cuenta, porque ese no se levanta nunca y el duelo se quedaria esperando. */
/* EL PLANO DEL REMATE ES EL CUERPO, NO EL PUESTO. Al terminar el duelo la
   camara se suelta y vuelve al reposo, y ahi el encuadre de espera —16,4
   celdas de ancho— NO ALCANZA para un cuerpo tumbado: acostado a 63 grados
   la cabeza del rival llega a x 17,19 contra un borde en 17,20, asi que el
   muerto salia CORTADO por el canto en la ultima imagen del duelo. Enfocando
   el cuerpo, el encuadre de vuelo lo deja con dos celdas y media de aire. */
const arqMuerto = () => {
  for (const a of ARQ) if (a && a.puesto && a.muere) return { x: a.x, y: a.piso + 1.0 };
  return null;
};
const arqCayendo = () => {
  for (const a of ARQ) {
    if (!a || !a.puesto) continue;
    if (a.est === 'levanta') return true;
    if (a.est === 'caido' && !a.muere) return true;
  }
  return false;
};
/* ══════════════════════════════════════════════════════════════════════════
   G · EL AUDIO, PROCEDURAL
   Ni un byte de asset. Lo que suena en un juego de arcos son golpes cortos
   —la cuerda, el impacto, la madera que se parte— y VIENTO, que no se acaba
   nunca. Las dos cosas se escriben mejor de lo que se graban: un golpe corto
   grabado pesa mas que todo esto junto, y un bucle de viento tiene una vuelta
   que se escucha en cada pasada.

   Y EL VIENTO NO ES AMBIENTE: es la mecanica. El duelo 12 tira con cinco
   celdas por segundo cuadrado en contra, y si eso solo se leyera en un
   numero del HUD, el jugador se enteraria despues de fallar. Aca la cama
   sopla mas fuerte cuanto mas viento hay, asi que se oye antes de tirar.
   ══════════════════════════════════════════════════════════════════════════ */

let AC = null, MAE = null, BMUS = null, BFX = null, ANA = null, RUIDO = null;
let MUS_ON = false, MUS_T = 0, MUS_RAIZ = 110, MUS_REL = null, PAD = [];
let VTO = null, VTO_W = 0;

/* pentatonica menor: el mismo puñado de sonidos suena cien veces por partida,
   y la escala en la que cualquier nota pega con cualquier otra es la
   diferencia entre musica y tortura */
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17];
const RAICES = [110.0, 98.0, 130.81, 116.54];

function auDesp() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  MAE = AC.createGain(); MAE.gain.value = 1;
  ANA = AC.createAnalyser(); ANA.fftSize = 2048;
  MAE.connect(ANA); MAE.connect(AC.destination);
  /* DOS BUSES Y NO UNO: con todo colgado del maestro, bajar «la musica»
     bajaria tambien los golpes y las dos perillas de ajustes describirian la
     misma cosa. El viento va en el de musica: es cama, no acontecimiento. */
  BMUS = AC.createGain(); BFX = AC.createGain();
  BMUS.connect(MAE); BFX.connect(MAE);
  auVol();
  const n = AC.sampleRate;
  RUIDO = AC.createBuffer(1, n, n);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  musArma(); vtoArma();
  if (AC.state === 'suspended') AC.resume();
}
function auVol() {
  if (!AC) return;
  BMUS.gain.setTargetAtTime(PROG.vol * 0.40, AC.currentTime, 0.05);
  BFX.gain.setTargetAtTime(PROG.fx, AC.currentTime, 0.05);
}

/* ── LA CAMA ──────────────────────────────────────────────────────────────
   Cuatro senos DOBLADOS Y DESAFINADOS dos milesimas: dos senos identicos
   suenan a tono de prueba y dos que baten cada pocos segundos suenan a
   instrumento. El pasabajos da una vuelta cada veintiun segundos, que es lo
   que hace que respire en vez de zumbar.                                   */
function musArma() {
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 0.6;
  const g = AC.createGain(); g.gain.value = 0.16;
  f.connect(g); g.connect(BMUS);
  const lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.frequency.value = 1 / 21; lg.gain.value = 240;
  lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  PAD = [];
  for (const r of [1, 1.5, 2, 2.25]) for (const dt of [1, 1.0021]) {
    const o = AC.createOscillator(); o.type = 'sine';
    const og = AC.createGain(); og.gain.value = r === 1 ? 0.34 : 0.19;
    o.connect(og); og.connect(f); o.start();
    PAD.push({ o, r, dt });
  }
  musRaiz(MUS_RAIZ);
  MUS_REL = setInterval(musPlanea, 140);
}
function musRaiz(hz) {
  MUS_RAIZ = hz;
  if (!AC) return;
  for (const p of PAD) p.o.frequency.setTargetAtTime(hz * p.r * p.dt, AC.currentTime, 1.4);
}
/* LA AGENDA CUELGA DEL RELOJ DE AUDIO Y NO DE UN rAF: un cuadro se atrasa y
   se pausa en segundo plano, y ahi la campana caeria fuera de tiempo o no
   caeria nunca. */
function musPlanea() {
  if (!AC || !MUS_ON) return;
  const ahora = AC.currentTime;
  if (MUS_T < ahora) MUS_T = ahora + 0.2;
  while (MUS_T < ahora + 0.6) {
    campana(MUS_T, MUS_RAIZ * 4 * Math.pow(2, PENTA[(Math.random() * PENTA.length) | 0] / 12));
    MUS_T += 2.4 + Math.random() * 3.0;
  }
}
function campana(t, hz) {
  const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = hz;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.10, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0006, t + 2.1);
  o.connect(g); g.connect(BMUS); o.start(t); o.stop(t + 2.2);
}
function musVer(v) { MUS_ON = v; if (AC) BMUS.gain.setTargetAtTime(v ? PROG.vol * 0.40 : 0, AC.currentTime, 0.5); }

/* ── EL VIENTO ────────────────────────────────────────────────────────────
   Ruido pasabajos con la ganancia y el corte atados a |viento|, mas un
   segundo LFO lento para que sople a rachas: un viento parejo se oye a
   estatica de radio y a los diez segundos el oido lo deja de escuchar.    */
function vtoArma() {
  const s = AC.createBufferSource(); s.buffer = RUIDO; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300; f.Q.value = 0.9;
  const g = AC.createGain(); g.gain.value = 0;
  s.connect(f); f.connect(g); g.connect(BMUS); s.start();
  const lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.frequency.value = 0.13; lg.gain.value = 0.35;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
  VTO = { f, g, base: 0 };
  auViento(0);
}
function auViento(w) {
  VTO_W = w;
  if (!AC || !VTO) return;
  const k = Math.min(1, Math.abs(w) / 5);
  VTO.base = 0.035 + k * 0.10;
  VTO.g.gain.setTargetAtTime(VTO.base, AC.currentTime, 0.8);
  VTO.f.frequency.setTargetAtTime(240 + k * 900, AC.currentTime, 0.8);
}

/* ── LOS GOLPES ───────────────────────────────────────────────────────────
   LA ESCALA ESTA ELEGIDA: el impacto en un cuerpo es lo mas fuerte del juego
   despues de ganar, y la cuerda tensandose lo mas flojo — porque la cuerda
   suena en cada tiro y un impacto decide el duelo.                        */
function ruidito(t, dur, hz, q, vol) {
  const s = AC.createBufferSource(); s.buffer = RUIDO;
  s.loop = true; s.playbackRate.value = 0.9 + Math.random() * 0.2;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz; f.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0004, t + dur);
  s.connect(f); f.connect(g); g.connect(BFX);
  s.start(t); s.stop(t + dur + 0.02);
}
function tono(t, dur, h0, h1, vol, tipo) {
  const o = AC.createOscillator(); o.type = tipo || 'sine';
  o.frequency.setValueAtTime(h0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, h1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0004, t + dur);
  o.connect(g); g.connect(BFX); o.start(t); o.stop(t + dur + 0.02);
}

/* cada material suena distinto AL CLAVARSE, y eso no es adorno: de noche o de
   lejos, el sonido es lo unico que dice contra que pego la flecha.         */
const CLAVA = {
  [TIERRA]:   [0.16, 320, 1.0, 0.24], [PASTO]:    [0.16, 300, 1.0, 0.22],
  [ARENA]:    [0.14, 260, 0.8, 0.20], [NIEVE]:    [0.18, 220, 0.7, 0.16],
  [PIEDRA]:   [0.11, 1700, 3.4, 0.30], [LADRILLO]: [0.12, 1300, 3.0, 0.28],
  [MADERA]:   [0.15, 700, 2.2, 0.30], [HOJA]:     [0.13, 2600, 1.6, 0.16],
  [METAL]:    [0.30, 2400, 8.0, 0.34],
};

function son(k, a) {
  if (!AC) return;
  const t = AC.currentTime + 0.001;
  if (k === 'tensa')      { ruidito(t, 0.07, 420 + (a || 0) * 700, 5.0, 0.055); }
  else if (k === 'tira')  { ruidito(t, 0.09, 1800, 1.6, 0.26); tono(t, 0.10, 420, 120, 0.16, 'triangle'); }
  else if (k === 'vuela') { ruidito(t, 0.34, 900, 0.9, 0.09); }
  else if (k === 'clava') {
    const c = CLAVA[a] || CLAVA[TIERRA];
    ruidito(t, c[0], c[1], c[2], c[3]);
    if (a === METAL) tono(t, 0.42, 2100, 1400, 0.12, 'triangle');
    else tono(t, c[0], 180, 90, 0.10);
  }
  else if (k === 'rompe') { ruidito(t, 0.26, 1100, 0.8, 0.30); ruidito(t + 0.05, 0.30, 2600, 1.2, 0.18); tono(t, 0.18, 150, 60, 0.16); }
  else if (k === 'pega')  { ruidito(t, 0.18, 380, 1.0, 0.38); tono(t, 0.20, 220, 70, 0.30); }
  else if (k === 'cabeza'){ ruidito(t, 0.20, 420, 1.0, 0.40); tono(t, 0.22, 260, 80, 0.32);
                            tono(t + 0.05, 0.55, 1320, 1320, 0.20, 'triangle'); }
  else if (k === 'tumbo') { ruidito(t, 0.22, 170, 0.9, 0.34); tono(t, 0.24, 120, 52, 0.24); }
  else if (k === 'falla') { tono(t, 0.16, 300, 190, 0.11, 'square'); }
  else if (k === 'turno') { tono(t, 0.14, 520, 660, 0.13, 'triangle'); }
  else if (k === 'ui')    { ruidito(t, 0.045, 1500, 2.2, 0.10); }
  else if (k === 'gana') {
    const b = MUS_RAIZ * 4;
    [0, 5, 7, 12].forEach((s, i) => tono(t + i * 0.10, 0.55, b * Math.pow(2, s / 12), b * Math.pow(2, s / 12), 0.26, 'triangle'));
    tono(t + 0.30, 0.9, b * 2, b * 2, 0.16, 'sine');
  }
  else if (k === 'pierde') {
    const b = MUS_RAIZ * 2;
    [0, -2, -5].forEach((s, i) => tono(t + i * 0.16, 0.7, b * Math.pow(2, s / 12), b * Math.pow(2, s / 12), 0.20, 'triangle'));
  }
}

/* la cuerda cruje MIENTRAS se tensa, y el crujido va atado a la tension y no
   a un temporizador: son el mismo numero, asi que el sonido no se puede
   separar de lo que el dedo esta haciendo */
let TENSA_ANT = -1;
function auTensa(k) {
  const n = Math.floor(cl(k, 0, 1) * 7);
  if (n !== TENSA_ANT) { if (n > TENSA_ANT && n > 0) son('tensa', k); TENSA_ANT = n; }
}
function auTensaCero() { TENSA_ANT = -1; }

function auNivel(ms) {
  return new Promise(r => {
    if (!AC || !ANA) { r({ pico: 0, rms: 0 }); return; }
    const buf = new Float32Array(ANA.fftSize);
    let pico = 0, sum = 0, n = 0;
    const t0 = performance.now();
    const paso = () => {
      ANA.getFloatTimeDomainData(buf);
      for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i]); if (v > pico) pico = v; sum += buf[i] * buf[i]; n++; }
      if (performance.now() - t0 < (ms || 700)) requestAnimationFrame(paso);
      else r({ pico: +pico.toFixed(4), rms: +Math.sqrt(sum / Math.max(1, n)).toFixed(4) });
    };
    paso();
  });
}
/* ══════════════════════════════════════════════════════════════════════════
   H · EL DUELO, EL HUD Y LOS PANELES

   TODO EL TURNO PASA POR UNA MAQUINA DE CUATRO ESTADOS —apunta · vuela ·
   espera · fin— y por una sola funcion de tiro (`tira`). El jugador y el
   rival entran por AHI los dos: con dos caminos, el rival estaria jugando un
   juego que no existe y la auditoria aprobaria duelos que no se pueden
   pelear. Es la misma regla que el resolvedor y el choque ya comparten.

   Y LA FLECHA QUE SE VE ES LA QUE SE VOLO. `vuela()` devuelve el recorrido
   muestreado; la animacion lo INTERPOLA en vez de volver a integrar. Con dos
   integradores, la flecha dibujada podria caer en un sitio y el dano
   aplicarse en otro — y eso no falla ruidosamente: se ve como punteria mala.
   ══════════════════════════════════════════════════════════════════════════ */

const JU = {
  n: 0, M: null, va: VIDA_MAX, vb: VIDA_MAX, turno: 0,
  est: 'apunta', t: 0, flechas: 0, aciertos: 0,
  fin: false, tuto: false, paso: 0, pausa: false,
};
const VU = { on: false, pts: null, r: null, t: 0, dur: 0, vx: 0, vy: 0, w: 0, quien: 0 };
const RIV = { d: null, k: 0 };      /* el tiro del rival, resuelto una sola vez */
const RIV_TENSA = 0.72;             /* lo que tarda en tensar, a la vista */
const DT_PTS = 13 * PASO_F;

/* ── PANELES ────────────────────────────────────────────────────────────── */
let PAN = null;
/* `on` MUESTRA Y `abre` ES OTRA COSA: `abre` es el velo partido —cerrado
   arriba y abajo, abierto en el medio— que sólo lleva el menú, para que el
   duelo se vea correr detrás. Toggleando `abre` como si fuera la
   visibilidad, ningún panel llegaba a `display:grid` y la interfaz entera
   quedaba invisible; lo cantó el banco: el click al idioma no encontraba
   nada que tocar.                                                         */
function verPanel(id) {
  for (const p of document.querySelectorAll('.pan')) p.classList.toggle('on', p.id === id);
  PAN = id;
  document.body.classList.toggle('conPanel', !!id);
  /* Y ACA SE AJUSTA EL TITULO, no al escribirlo: un elemento en display:none
     mide cero, asi que `pintaFin` —que corre ANTES de abrir el panel— no
     tiene con que medir y se rinde. Medido: el titulo quedaba en 55,62 px
     con la palabra pidiendo 455 y la caja dando 419.                      */
  if (id) titTodos();
}

/* ── EL HUD ───────────────────────────────────────────────────────────────
   Se escribe SOLO CUANDO CAMBIA. Escribir en el DOM cada cuadro obliga al
   navegador a recalcular el layout sesenta veces por segundo para poner el
   mismo texto — y en la barra de vida eso es el 90 % de los cuadros.      */
let HUD_ANT = '';
function pintaHud() {
  const M = JU.M; if (!M) return;
  const a = Math.max(0, JU.va), b = Math.max(0, JU.vb);
  const w = M.viento;
  const firma = a + '|' + b + '|' + JU.turno + '|' + JU.est + '|' + LANG + '|' + JU.n + '|' + (JU.tuto ? 1 : 0);
  if (firma === HUD_ANT) return;
  HUD_ANT = firma;
  $('vIzq').querySelector('i').style.width = (a / VIDA_MAX * 100) + '%';
  $('vDer').querySelector('i').style.width = (b / VIDA_MAX * 100) + '%';
  $('vIzq').querySelector('b').textContent = a;
  $('vDer').querySelector('b').textContent = b;
  $('nIzq').textContent = TX('vos');
  $('nDer').textContent = JU.tuto ? '—' : (M.rival || '');
  /* el viento con su FLECHA: un numero con signo hay que leerlo y traducirlo
     a un lado; una flecha se ve de reojo mientras se apunta */
  $('viento').innerHTML = Math.abs(w) < 0.2
    ? '<u>' + TX('calma') + '</u>'
    : '<u>' + TX('viento') + '</u> ' + (w > 0 ? '▶' : '◀') + ' ' + Math.abs(w).toFixed(1);
  $('duelo').textContent = JU.tuto ? TX('tutTit') : TX('duelo', JU.n + 1);
  /* Y EL TURNO DEL RIVAL SE ANUNCIA. Estaba en blanco: el rival se tomaba
     casi un segundo pensando sin una sola senial en pantalla, asi que desde
     afuera el juego se veia trabado y despues aparecia una flecha de la
     nada. Lo que faltaba no era la flecha, era saber que le tocaba a el. */
  const pi = JU.tuto ? TX('tut' + Math.min(4, JU.paso + 1))
    : (JU.turno === 0
        ? (JU.est === 'apunta' ? TX('pistaTira') : '')
        : ((JU.est === 'piensa' || JU.est === 'vuela') ? TX('pistaRival') : ''));
  /* la pista arranca en `opacity:0` y la enciende su clase: escribiendo sólo
     el texto, los cuatro pasos del tutorial no se leen en ninguna parte */
  $('pista').textContent = pi;
  $('pista').classList.toggle('on', !!pi);
  $('nIzq').classList.toggle('act', JU.turno === 0);
  $('nDer').classList.toggle('act', JU.turno === 1);
}
function avisa(tx, ms) {
  const e = $('aviso'); e.textContent = tx; e.classList.add('on');
  clearTimeout(avisa._t); avisa._t = setTimeout(() => e.classList.remove('on'), ms || 1300);
}
/* el numero del dano SALE DEL PUNTO DEL IMPACTO, proyectado con la misma
   camara: puesto en un sitio fijo del HUD no diria a quien le pegaron.    */
/* Y SE REPINTA CADA CUADRO MIENTRAS DURA: con la camara moviendose, un
   numero colocado una sola vez se despega del sitio donde pego la flecha. */
const GOL = { on: false, x: 0, y: 0 };
function golpeEn(x, y, tx, cab) {
  const e = $('golpe');
  e.textContent = tx; e.className = cab ? 'cab on' : 'on';
  GOL.on = true; GOL.x = x; GOL.y = y; golpeMueve();
  clearTimeout(golpeEn._t);
  golpeEn._t = setTimeout(() => { e.className = ''; GOL.on = false; }, 1000);
}
function golpeMueve() {
  if (!GOL.on) return;
  const p = mundoAPant(GOL.x, GOL.y), e = $('golpe');
  e.style.left = p.x + 'px'; e.style.top = p.y + 'px';
}

/* ── IDIOMA ───────────────────────────────────────────────────────────────
   Repinta TODO: el menu, los paneles, la reja de duelos, el HUD y la pista.
   Sin el HUD y la pista, cambiar de idioma en partida deja la mitad de la
   pantalla en el anterior — ya costo una vuelta en MEKO.                  */
/* EL TITULO SE MIDE Y SE ACHICA HASTA QUE ENTRA, y no es coqueteria: el h1
   sale de `--mw * 0.135` con espaciado de 0,22em, o sea unos 47 px por letra
   en un marco de 412. Medido en la captura del final, «¡GANASTE!» —nueve
   letras— pedia 420 px de los 379 que tiene la caja: la palabra salia CORTADA
   por el canto derecho y, peor, al desbordar un flex con align-items:center
   arrastraba los tres botones fuera del eje. Y no se arregla con un numero
   mas chico porque el largo cambia con el idioma: «VOCE VENCEU!» son doce.
   Una sola pasada alcanza —el ancho del texto es lineal en el cuerpo de la
   letra, porque el espaciado va en em— asi que se mide, se divide y listo. */
/* EL ANCHO DISPONIBLE SALE DEL MARCO Y NO DEL PADRE, y eso no es un detalle:
   `.caja` es un item de grilla, o sea `min-width:auto`, asi que NO PUEDE
   ACHICARSE POR DEBAJO DEL CONTENIDO — con el titulo en nowrap el padre crece
   hasta contenerlo y medirlo contra el padre devuelve «entra» siempre. Es un
   lazo: la cosa que se quiere medir mueve la regla. El marco no se mueve.  */
function titAjusta(el) {
  if (!el || !el.textContent) return;
  el.style.fontSize = '';
  el.style.whiteSpace = 'nowrap';
  const mm = $('marco');
  const hay = Math.min(430, ((mm ? mm.clientWidth : 412) - 40) * 0.92);
  if (hay <= 0) return;
  const base = parseFloat(getComputedStyle(el).fontSize) || 0;
  const w = el.scrollWidth;
  if (!base || !w || w <= hay) return;
  el.style.fontSize = (base * hay / w).toFixed(2) + 'px';
}
function titTodos() { for (const el of document.querySelectorAll('h1')) titAjusta(el); }

/* ── CARGA ────────────────────────────────────────────────────────────────
   El tutorial pasa por la MISMA carga que un duelo y lo unico que cambia es
   de donde sale el mundo: con una carga propia, cada cosa que se agregue a
   `cargaDuelo` hay que acordarse de agregarla dos veces.                  */
function arranca(M, tuto) {
  JU.M = M; JU.tuto = !!tuto;
  JU.va = JU.vb = VIDA_MAX; JU.turno = 0; JU.est = 'apunta'; JU.t = 0;
  JU.flechas = 0; JU.aciertos = 0; JU.fin = false; JU.paso = 0; JU.pausa = false;
  VU.on = false;
  construyeMundo(M);
  arqEntra(M);
  RIV.d = null; RIV.k = 0;
  flechaOculta(); previaOculta(); limpiaClavadas();
  /* la camara se PLANTA y no lerpea: viniendo del duelo anterior, el primer
     medio segundo del duelo nuevo seria un viaje que nadie pidio */
  camSuelta(); camPlanta();
  musRaiz(RAICES[(M.paleta || 0) % RAICES.length]);
  auViento(M.viento);
  verPanel(null);
  HUD_ANT = ''; pintaHud();
  document.body.classList.add('jugando');
}
function cargaDuelo(n) {
  JU.n = n;
  $('carga').classList.remove('ido');
  $('cBarra').style.width = '18%';
  verPanel(null);
  setTimeout(() => {
    arqSuelta();
    const M = generaMundo(n);
    $('cBarra').style.width = '78%';
    arranca(M, false);
    $('cBarra').style.width = '100%';
    setTimeout(() => $('carga').classList.add('ido'), 60);
  }, 40);
}

/* ── EL TIRO ──────────────────────────────────────────────────────────────
   UNA sola funcion, y la usan el dedo y el rival. */
function tira(l, vx, vy) {
  const M = JU.M;
  const O = bocaDe(M, l);
  const r = vuela(M, O.x, O.y, vx, vy, M.viento, l);
  VU.on = true; VU.pts = r.pts; VU.r = r; VU.t = 0; VU.dur = r.t;
  VU.vx = vx; VU.vy = vy; VU.w = M.viento; VU.quien = l;
  JU.est = 'vuela'; JU.t = 0;
  JU.flechas++;
  arqTira(l); son('tira'); son('vuela');
  previaOculta();
  auTensaCero();
  if (l === 0) tutAvanza('tira');
}

/* ── EL IMPACTO ──────────────────────────────────────────────────────────
   El crater se cava MEDIA CELDA MAS ALLA del punto de impacto, en la
   direccion del vuelo: cavado en el punto justo, la flecha clavada queda
   flotando en el aire que ella misma acaba de abrir. Asi queda en el labio,
   que es donde de verdad se clavaria una punta que entro y estallo.       */
function impacto(r) {
  const M = JU.M;
  camFoco(r.x, r.y);      /* la camara se queda donde pego */
  if (r.fin === 'arq') {
    const dn = danoDe(r);
    if (r.quien === 0) JU.va -= dn; else { JU.vb -= dn; if (VU.quien === 0) JU.aciertos++; }
    /* SI EL GOLPE MATA SE SABE ACA Y NO EN `termina`: el que se muere se
       queda en el piso, y para eso el tumbo tiene que enterarse en el mismo
       cuadro — enterandose despues, el cuerpo ya se levanto. */
    arqRecibe(r.quien, r.cab, dn, (r.quien === 0 ? JU.va : JU.vb) <= 0);
    son(r.cab ? 'cabeza' : 'pega');
    golpeEn(r.x, r.y, '-' + dn, r.cab);
    if (r.cab) avisa(TX('cabezazo'), 1100);
    estalla(r.x, r.y, LADRILLO, r.cab ? 1.3 : 0.9);
    flechaOculta();
  } else if (r.fin === 'suelo') {
    const dur = !esRompeT(r.tipo);
    const ang = Math.atan2(VU.vy - G * r.t, VU.vx + VU.w * r.t);
    if (dur) { son('clava', r.tipo); clavaFlecha(r.x, r.y, ang); }
    else {
      son('rompe');
      estalla(r.x, r.y, r.tipo, 1);
      const n = crater(M, r.x + Math.cos(ang) * 0.5, r.y + Math.sin(ang) * 0.5, CRATER_R);
      if (n > 0) rehaceTerreno();
      clavaFlecha(r.x, r.y, ang);
      /* los dos arqueros pueden haber quedado mas abajo: la meseta esta
         protegida, pero un crater al lado le cambia el piso a nadie — se
         relee igual, que cuesta dos lecturas y no puede desincronizarse */
      for (let l = 0; l < 2; l++) if (ARQ[l]) {
        const p = l ? M.pisoB : M.pisoA;
        arqPiso(l, p); ARQ[l].boca = bocaDe(M, l);
      }
    }
    flechaOculta();
  } else {
    son('falla'); avisa(TX('falla'), 900);
    flechaOculta();
  }
  if (r.fin !== 'arq' || r.quien === VU.quien) tutAvanza('falla');
  HUD_ANT = '';
}

/* ── EL PASO DEL DUELO ───────────────────────────────────────────────────*/
function duePaso(dt) {
  const M = JU.M; if (!M || JU.pausa) return;
  JU.t += dt;
  golpeMueve();

  if (JU.est === 'vuela') {
    VU.t += dt;
    const u = Math.min(VU.t, VU.dur);
    const i = u / DT_PTS, i0 = Math.min(VU.pts.length / 2 - 1, Math.floor(i));
    const i1 = Math.min(VU.pts.length / 2 - 1, i0 + 1), k = cl(i - i0, 0, 1);
    const x = mez(VU.pts[i0 * 2], VU.pts[i1 * 2], k);
    const y = mez(VU.pts[i0 * 2 + 1], VU.pts[i1 * 2 + 1], k);
    /* el rumbo sale de la VELOCIDAD en forma cerrada, no de restar dos
       posiciones dibujadas: en el apice vy cruza el cero y con posiciones la
       flecha pega un tiron justo ahi. */
    flechaPon(x, y, VU.vx + VU.w * u, VU.vy - G * u);
    camFoco(x, y);
    if (VU.t >= VU.dur) {
      VU.on = false;
      impacto(VU.r);
      JU.est = 'espera'; JU.t = 0;
    }
  } else if (JU.est === 'espera') {
    /* un respiro DESPUES del impacto: cortando al turno siguiente en el
       mismo cuadro, el golpe no se llega a ver y el duelo se lee a una
       sucesion de numeros. */
    if (JU.t < 0.95) return;
    /* EL TURNO NO PASA CON ALGUIEN EN EL PISO: el que acaba de recibir es
       justo el que tiene que tirar, y la caja de choque esta clavada en su
       columna — tirando desde el suelo, el dibujo y el blanco dirian cosas
       distintas. El que se murio no cuenta: ese no se levanta. */
    if (arqCayendo()) return;
    if (JU.va <= 0 || JU.vb <= 0) { termina(); return; }
    /* EN EL TUTORIAL EL TURNO NO PASA Y UN SOLO ACIERTO ALCANZA: el rival
       esta ahi de blanco, no de rival, y tres impactos para terminar de
       aprender a arrastrar el dedo son dos de mas. */
    if (JU.tuto) {
      if (JU.vb < VIDA_MAX) { termina(); return; }
      JU.est = 'apunta'; JU.t = 0; HUD_ANT = ''; arqQuieto(0); return;
    }
    JU.turno = 1 - JU.turno;
    JU.est = JU.turno === 0 ? 'apunta' : 'piensa';
    JU.t = 0; HUD_ANT = '';
    camSuelta();          /* la camara se abre otra vez al plano de espera */
    son('turno');
    if (JU.turno === 0) arqQuieto(0); else { RIV.d = null; RIV.k = 0; }
  } else if (JU.est === 'piensa') {
    /* EL RIVAL TENSA A LA VISTA, y eso no es adorno: antes apuntaba y
       soltaba EN EL MISMO CUADRO, o sea que el unico aviso de que la flecha
       venia era la flecha. Ahora el tiro se resuelve UNA vez —volver a
       resolverlo por cuadro daria un rival distinto en cada uno— y la
       tension sube de cero a fondo mientras el arco se llena. */
    if (!RIV.d) { RIV.d = tiroRival(M, M.prec, Math.random); RIV.k = 0; }
    RIV.k = Math.min(1, RIV.k + dt / RIV_TENSA);
    const ang = Math.atan2(RIV.d.vy, RIV.d.vx);
    arqApunta(1, ang, RIV.k * 0.9);
    if (RIV.k >= 1 && JU.t >= RIV_TENSA + 0.18) { const d = RIV.d; RIV.d = null; tira(1, d.vx, d.vy); }
  }
  pintaHud();
}

function termina() {
  JU.fin = true; JU.est = 'fin';
  const gano = JU.vb <= 0 && JU.va > 0;
  arqFin(0, gano); arqFin(1, !gano);
  /* EL ORDEN IMPORTA: `arqFin` es quien decide si el perdedor se queda en el
     piso, asi que preguntar por el muerto ANTES devuelve siempre null.     */
  const mu = arqMuerto();
  if (mu) camFoco(mu.x, mu.y); else camSuelta();
  son(gano ? 'gana' : 'pierde');
  if (gano && !JU.tuto && PROG.hechos.indexOf(JU.n) < 0) { PROG.hechos.push(JU.n); guardaProg(); }
  clearTimeout(termina._t);
  termina._t = setTimeout(() => { pintaFin(); verPanel('pFin'); }, 1500);
}
/* ══════════════════════════════════════════════════════════════════════════
   I · EL TUTORIAL

   SE ENTRA ACA Y NO AL MENU AL ABRIR EL JUEGO. El unico verbo de este es
   arrastrar el dedo hacia atras, y nada en la pantalla dice que se pueda
   hacer eso: un cartel en el menu se saltea, y lo que se saltea es
   exactamente lo que despues no se entiende.

   CUATRO PASOS Y CADA UNO ESPERA A QUE SE HAGA LA COSA. No se pasan leyendo:
   el 2 no aparece hasta que el arrastre paso de la mitad, el 3 hasta que la
   flecha salio, y el 4 hasta que fallo la primera. Es la misma regla que ya
   ordeno los tutoriales de ECO, RECREO, DUNA y MEKO.

   Y EL RIVAL NO TIRA. Un tutorial en el que se puede perder ensena miedo y
   no la mecanica: el jugador sale corriendo antes de entender que el viento
   empuja. Esta parado ahi porque hace falta un blanco, y nada mas.

   EL MUNDO ESTA ESCRITO A MANO Y NO GENERADO, y es la unica pieza del juego
   que lo esta: cada paso nombra una cosa concreta —el viento, la distancia—
   y una geometria que cambia cada vez no se puede nombrar. Llano y sin un
   solo obstaculo, porque lo que se ensena es el arco y no el terreno.     */

const TUT_VIENTO = 2.4;   /* se ve y se oye, y no alcanza para hacer imposible el tiro */

function mundoTuto() {
  const M = nuevoMundo(NX, NY, NZ);
  const B = BIOMAS.pradera;
  M.n = -1; M.paleta = B.pal; M.bio = 'pradera'; M.forma = 'llano';
  M.viento = TUT_VIENTO; M.rival = '—'; M.prec = 0;
  const h = [];
  for (let x = 0; x < NX; x++) h.push(6);
  M.h = h;
  for (let x = 0; x < NX; x++) for (let y = 0; y < 6; y++) {
    const t = (y === 5) ? B.sup : B.base;
    for (let z = 0; z < NZ; z++) pon(M, x, y, z, t);
  }
  M.pisoA = altura(M, XA);
  M.pisoB = altura(M, XB);
  return M;
}

function cargaTuto() {
  JU.n = -1;
  $('carga').classList.remove('ido');
  $('cBarra').style.width = '18%';
  verPanel(null);
  setTimeout(() => {
    arqSuelta();
    const M = mundoTuto();
    $('cBarra').style.width = '78%';
    arranca(M, true);
    PROG.visto = 1; guardaProg();
    $('cBarra').style.width = '100%';
    setTimeout(() => $('carga').classList.add('ido'), 60);
  }, 40);
}

/* el paso avanza con lo que el jugador HIZO, no con un reloj. Y el orden no
   importa: si alguien tira fuerte de una, los pasos 1 y 2 ya estan hechos. */
function tutAvanza(ev, k) {
  if (!JU.tuto || JU.fin) return;
  const p = JU.paso;
  if (ev === 'arrastra') {
    if (p < 1) { JU.paso = 1; HUD_ANT = ''; }
    if (p < 2 && k > 0.5) { JU.paso = 2; HUD_ANT = ''; }
  } else if (ev === 'tira') {
    if (p < 3) { JU.paso = 3; HUD_ANT = ''; }
  } else if (ev === 'falla') {
    if (p < 4) { JU.paso = 4; HUD_ANT = ''; }
  }
}

/* auditoria: un tutorial que no se puede terminar es peor que ninguno, y la
   unica forma de saberlo es resolverlo con el mismo resolvedor que los doce
   duelos. Comprueba ademas que el viento del tutorial NO lo haga imposible
   —barriendo con y sin viento— y que la boca del arco nazca al aire.     */
function auditaTuto() {
  const M = mundoTuto();
  const a = resuelve(M, 0, M.viento);
  const sinV = resuelve(M, 0, 0);
  const O = bocaDe(M, 0);
  const libre = en(M, Math.floor(O.x), Math.floor(O.y), ZC) === VACIO;
  return { ok: !!a && !!sinV && libre, v: a ? +a.v.toFixed(2) : null,
           ang: a ? +(Math.atan2(a.vy, a.vx) * 180 / Math.PI).toFixed(1) : null,
           libre, viento: M.viento, pisoA: M.pisoA, pisoB: M.pisoB };
}

/* ══════════════════════════════════════════════════════════════════════════
   Z · EL DEDO, LA UI Y EL BUCLE

   UN SOLO VERBO Y UN SOLO GESTO: se arrastra hacia atras y se suelta. Todo lo
   que el jugador decide entra por aca, y por eso el arrastre no se convierte
   a mano: pasa por `pantAMundo`, que es la INVERSA EXACTA de la matriz con la
   que la camara proyecta. Escrita a mano seria una segunda cuenta que hay que
   mantener igual a la primera, y el dia que se toque la guiñada de la camara
   el jugador apuntaria a un sitio y la flecha saldria hacia otro — y eso no
   falla en voz alta: se lee a que uno no sabe apuntar.

   LA DIRECCION SALE DE LA MATRIZ Y LA FUERZA DE LOS PIXELES, y son dos cosas
   distintas a proposito. La direccion tiene que ser la de la pantalla —lo que
   se ve es hacia donde va— pero la fuerza tiene que medir lo mismo tirando
   para arriba que para el costado, y el mundo esta apenas comprimido en x
   (3,4 % por la guiñada): con la fuerza sacada del mundo, el mismo arrastre
   pegaria mas fuerte en vertical que en horizontal sin que nada lo diga.
   ══════════════════════════════════════════════════════════════════════════ */

let ARR = null;                 /* el arrastre en curso, o null */
const ARR_MIN = 0.055;          /* por debajo de esto es un toque y no un tiro */

const puedeTirar = () => !!DIO && !!JU.M && !JU.fin && !JU.pausa && !PAN
  && JU.est === 'apunta' && JU.turno === 0 && arqLibre();

function relXY(ev) {
  const r = $('marco').getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

/* de un arrastre en pixeles al vector de salida de la flecha */
function tiroDe(dpx, dpy) {
  const maxPx = ARR_MAX_PX * ANCHO;
  const len = Math.hypot(dpx, dpy);
  const k = cl(len / maxPx, 0, 1);
  if (len < 1e-4) return { vx: 0, vy: 0, k: 0, ang: 0 };
  /* hacia atras: la flecha sale al reves del dedo */
  const w = pantAMundo(-dpx, -dpy);
  const wl = Math.hypot(w.x, w.y) || 1e-9;
  const v = k * V_MAX;
  return { vx: w.x / wl * v, vy: w.y / wl * v, k, ang: Math.atan2(w.y, w.x) };
}

function arrastreEmpieza(ev) {
  if (!puedeTirar()) return;
  const p = relXY(ev);
  ARR = { id: ev.pointerId, x0: p.x, y0: p.y, k: 0 };
  auTensaCero();
  try { $('cv').setPointerCapture(ev.pointerId); } catch (e) {}
  $('fuerza').classList.add('on');
}

function arrastreMueve(ev) {
  if (!ARR || ev.pointerId !== ARR.id) return;
  const p = relXY(ev);
  const d = tiroDe(p.x - ARR.x0, p.y - ARR.y0);
  ARR.k = d.k; ARR.vx = d.vx; ARR.vy = d.vy;
  $('fuerza').querySelector('i').style.width = (d.k * 100) + '%';
  arqApunta(0, d.ang, d.k);
  auTensa(d.k);
  tutAvanza('arrastra', d.k);
  /* LA VISTA PREVIA MUESTRA EL ARRANQUE Y NO LA PARABOLA ENTERA. Con la
     parabola completa el juego se contesta solo y el viento deja de ser una
     decision; con los primeros siete puntos —0,38 s de vuelo— alcanza para
     leer el angulo y no para saber donde cae.                            */
  if (d.k > 0.04) {
    const O = bocaDe(JU.M, 0);
    const r = vuela(JU.M, O.x, O.y, d.vx, d.vy, JU.M.viento, 0);
    previaPon(r.pts, 7);
  } else previaOculta();
}

function arrastreTermina(ev) {
  if (!ARR || (ev && ev.pointerId !== ARR.id)) return;
  const a = ARR; ARR = null;
  $('fuerza').classList.remove('on');
  $('fuerza').querySelector('i').style.width = '0%';
  previaOculta(); auTensaCero();
  if (!puedeTirar()) { arqQuieto(0); return; }
  if (a.k < ARR_MIN) { arqQuieto(0); avisa(TX('pistaFuerza'), 1200); return; }
  tira(0, a.vx, a.vy);
}

function enganchaDedo() {
  const cv = $('cv');
  cv.addEventListener('pointerdown', e => { auDesp(); arrastreEmpieza(e); e.preventDefault(); });
  cv.addEventListener('pointermove', arrastreMueve);
  cv.addEventListener('pointerup', arrastreTermina);
  /* `pointercancel` tambien suelta: sin esto, un gesto que el navegador se
     lleva —la barra de arriba, una llamada— deja el arrastre puesto y el
     arquero apuntando para siempre a donde quedo el dedo.                */
  cv.addEventListener('pointercancel', arrastreTermina);
  window.addEventListener('blur', () => arrastreTermina(null));
}

/* ── LA UI ────────────────────────────────────────────────────────────────
   Todos los botones pasan por `b()`: despiertan el audio y suenan. Repartido
   boton por boton, el proximo que se agregue queda mudo o sin despertar el
   contexto, y en un navegador eso es un juego que arranca sin sonido.     */
function enganchaUI() {
  const b = (id, f) => { const e = $(id); if (e) e.onclick = () => { auDesp(); son('ui'); f(); }; };

  for (const e of document.querySelectorAll('#pIdioma [data-lang]'))
    e.onclick = () => {
      auDesp(); son('ui');
      LANG = e.dataset.lang; guardaProg(); pintaIdioma();
      if (!PROG.visto) cargaTuto(); else verPanel('pMenu');
    };

  /* JUGAR va al primer duelo que falta y no al 1: ganado el 5, tocar JUGAR y
     volver al 1 obliga a pasar por la reja de duelos cada vez.            */
  b('bJugar', () => {
    let n = 0;
    while (n < DUELOS - 1 && PROG.hechos.indexOf(n) >= 0) n++;
    cargaDuelo(n);
  });
  b('bTuto', () => cargaTuto());
  b('bDuelos', () => { pintaDuelos(); verPanel('pDuelos'); });
  b('bAjustes', () => verPanel('pAjustes'));
  b('dVolver', () => verPanel('pMenu'));
  b('aVolver', () => verPanel('pMenu'));
  b('aBorrar', () => { borraProg(); pintaIdioma(); pintaDuelos(); avisa(TX('borrado'), 1200); });

  b('bPausa', () => { JU.pausa = true; arrastreTermina(null); verPanel('pPausa'); });
  b('bSigo', () => { JU.pausa = false; verPanel(null); });
  const reinicia = () => { JU.pausa = false; if (JU.tuto) cargaTuto(); else cargaDuelo(JU.n); };
  b('bReinicia', reinicia);
  b('bReini2', reinicia);
  const alMenu = () => {
    JU.pausa = false; JU.fin = true; VU.on = false;
    arrastreTermina(null);
    document.body.classList.remove('jugando');
    pintaDuelos(); verPanel('pMenu');
  };
  b('bSalir', alMenu);
  b('fMenu', alMenu);
  b('fRe', reinicia);
  b('fSig', () => cargaDuelo(Math.min(DUELOS - 1, JU.n + 1)));

  const sl = (id, k, f) => {
    const e = $(id); if (!e) return;
    e.value = Math.round(PROG[k] * 100);
    e.oninput = () => { auDesp(); PROG[k] = e.value / 100; auVol(); guardaProg(); if (f) f(); };
  };
  sl('aMus', 'vol');
  sl('aFx', 'fx', () => son('ui'));
}

/* ── EL BUCLE ─────────────────────────────────────────────────────────────
   El `requestAnimationFrame` va en la PRIMERA linea: con la llamada al final,
   una excepcion en el medio no rompe un cuadro, rompe el juego entero. Y el
   `dt` se topa en 0,05: una pestaña que estuvo dormida no puede devolver un
   salto de treinta segundos a la fisica.                                  */
window.__errs = [];
window.addEventListener('error', e => window.__errs.push('' + (e.message || e)));
window.addEventListener('unhandledrejection', e => window.__errs.push('' + (e.reason || e)));

let T_ANT = 0;
function bucle(ts) {
  requestAnimationFrame(bucle);
  const dt = T_ANT ? Math.min(0.05, (ts - T_ANT) / 1000) : 0;
  T_ANT = ts;
  if (!G2) return;
  duePaso(dt);
  arqPaso(dt);
  escPaso(dt, JU.M ? JU.M.viento : 0);
  escDibuja();
}

/* ── ARRANQUE ─────────────────────────────────────────────────────────────
   EL TUTORIAL ES LA PRIMERA PANTALLA Y NO EL MENU. El unico verbo del juego
   no esta escrito en ninguna parte de la pantalla: entrar al menu la primera
   vez es ofrecerle a alguien JUGAR sin haberle dicho que se arrastra.     */
function inicia() {
  cargaProg();
  const hab = !!PROG.lang;
  if (hab) LANG = PROG.lang;
  else LANG = (navigator.language || 'en').slice(0, 2).toLowerCase();
  if (!LANGS[LANG]) LANG = 'en';

  escInit();
  /* Y EL TITULO SE VUELVE A MEDIR AL CAMBIAR DE TAMANIO: `titAjusta` escribe
     un cuerpo de letra EN PIXELES, asi que sin esto un giro de telefono deja
     la palabra con el tamanio del marco anterior — chica en apaisado y
     cortada volviendo a vertical.                                         */
  const remedir = () => { medir(); titTodos(); };
  medir();
  window.addEventListener('resize', remedir);
  window.addEventListener('orientationchange', () => setTimeout(remedir, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', remedir);

  pintaIdioma();
  enganchaUI();
  enganchaDedo();
  requestAnimationFrame(bucle);

  $('carga').classList.add('ido');
  if (!hab) verPanel('pIdioma');
  else if (!PROG.visto) { verPanel(null); setTimeout(cargaTuto, 30); }
  else verPanel('pMenu');
}

/* ── SONDAS ───────────────────────────────────────────────────────────────
   `apunta` y `dispara` entran por LAS MISMAS funciones que el dedo, asi que
   lo que mide el banco es el juego y no un atajo. `avanza` corre la fisica
   con el paso de verdad — 1/60 — porque un paso grande se saltea impactos.  */
window.__A = {
  est: () => ({
    pan: PAN, jugando: document.body.classList.contains('jugando'),
    n: JU.n, tuto: JU.tuto, est: JU.est, turno: JU.turno,
    va: JU.va, vb: JU.vb, flechas: JU.flechas, aciertos: JU.aciertos,
    fin: JU.fin, paso: JU.paso, pausa: JU.pausa,
    viento: JU.M ? JU.M.viento : null, rival: JU.M ? JU.M.rival : null,
    lang: LANG, cal: PROG.cal, visto: PROG.visto, hechos: PROG.hechos.slice(),
  }),
  costo: () => escCosto(),
  audita: () => auditaDuelos(),
  auditaTuto: () => auditaTuto(),
  solo: (n, p, s) => juegaSolo(n, p === undefined ? 0.88 : p, s),
  todos: (p) => {
    const r = [];
    for (let n = 0; n < DUELOS; n++) r.push(juegaSolo(n, p === undefined ? 0.88 : p, 9000 + n * 71));
    return { gana: r.filter(x => x.gano).length, de: DUELOS, filas: r };
  },
  /* la linealidad del apuntado: se proyecta un desplazamiento del mundo a
     pixeles y se lo vuelve a traer. Tiene que dar 1,00000 — con camara
     ortografica la proyeccion es afin y la inversa es exacta. */
  lineal: () => {
    const o = mundoAPant(5, 8), q = [];
    for (const [dx, dy] of [[1, 0], [0, 1], [2, -1.5], [-3, 4]]) {
      const p = mundoAPant(5 + dx, 8 + dy);
      const w = pantAMundo(p.x - o.x, p.y - o.y);
      q.push({ dx, dy, x: +w.x.toFixed(5), y: +w.y.toFixed(5),
               err: +Math.hypot(w.x - dx, w.y - dy).toFixed(6) });
    }
    return { peor: Math.max(...q.map(a => a.err)), q };
  },
  /* el arrastre de verdad, en pixeles, por el mismo camino que el dedo */
  tiroDe: (dpx, dpy) => tiroDe(dpx, dpy),
  apunta: (dpx, dpy) => { const d = tiroDe(dpx, dpy); arqApunta(0, d.ang, d.k); return d; },
  dispara: (dpx, dpy) => {
    if (!puedeTirar()) return { ok: false, est: JU.est, turno: JU.turno };
    const d = tiroDe(dpx, dpy); tira(0, d.vx, d.vy);
    return { ok: true, k: +d.k.toFixed(3), vx: +d.vx.toFixed(2), vy: +d.vy.toFixed(2) };
  },
  /* dispara APUNTANDO BIEN, con el mismo resolvedor del rival: sirve para
     llegar al final de un duelo sin depender de la punteria de la sonda */
  clava: () => {
    if (!puedeTirar()) return { ok: false, est: JU.est };
    const s = resuelve(JU.M, 0, JU.M.viento);
    if (!s) return { ok: false, sin: true };
    arqApunta(0, Math.atan2(s.vy, s.vx), 0.9);
    tira(0, s.vx, s.vy);
    return { ok: true, v: +s.v.toFixed(2) };
  },
  avanza: (seg) => {
    const n = Math.round((seg || 1) * 60);
    for (let i = 0; i < n; i++) { duePaso(1 / 60); arqPaso(1 / 60); escPaso(1 / 60, JU.M ? JU.M.viento : 0); }
    escDibuja();
    return window.__A.est();
  },
  /* juega el duelo entero por el camino del jugador: apunta con el
     resolvedor, tira, y deja correr la fisica hasta que alguien cae */
  juega: (max) => {
    const t0 = performance.now();
    let n = 0;
    while (!JU.fin && n < (max || 40)) {
      if (JU.est === 'apunta' && JU.turno === 0) { window.__A.clava(); n++; }
      duePaso(1 / 60); arqPaso(1 / 60);
      if (performance.now() - t0 > 12000) break;
    }
    escDibuja();
    return Object.assign({ tiros: n, ms: Math.round(performance.now() - t0) }, window.__A.est());
  },
  lang: (k) => { LANG = k; guardaProg(); pintaIdioma(); return LANG; },
  /* SE DIBUJA UN CUADRO ANTES DE MEDIR. `escCosto` informa las llamadas del
     ULTIMO cuadro dibujado: midiendo justo despues de cambiar la calidad se
     informa la anterior, y las tres salen identicas — que es lo que devolvia
     esta sonda antes de esta linea.                                       */
  /* Y LA CLAVE SE COMPRUEBA. `aplicaCalidad` cae a `media` cuando no la
     reconoce, asi que una sonda que acepte cualquier cosa devuelve tres
     veces la misma calidad sin fallar — pedirle 0/1/2 en vez de los nombres
     informaba `det:1` en las tres y parecia que la palanca no hacia nada. */
  cal: (k) => { if (!CALIDADES[k]) return { error: 'calidad?', hay: Object.keys(CALIDADES) };
                PROG.cal = k; guardaProg(); aplicaCalidad(); pintaCal(); escDibuja(); return escCosto(); },
  panel: (id) => { verPanel(id); return PAN; },
  /* EL INDICE ES EL DE LA LISTA, 0..DUELOS-1, y se RECORTA a proposito:
     `armaMundo` hace `DUELO[n % largo]`, asi que pedir el 12 devuelve el 0
     con el rotulo diciendo DUELO 13 — un numero fuera de rango no falla,
     miente. Recortado, la sonda mide el duelo que dice medir.            */
  duelo: (n) => { cargaDuelo(cl(n | 0, 0, DUELOS - 1)); return JU.n; },
  tuto: () => { cargaTuto(); return JU.tuto; },
  nivel: (ms) => auNivel(ms),
  son: (k, a) => { auDesp(); son(k, a); return 1; },
  /* el HUD contra si mismo y contra el marco: un rotulo nuevo que nadie mide
     es un solapamiento esperando, y en teléfono ademas es un dedo que toca
     el cartel en vez del arquero */
  solapes: () => {
    const m = $('marco').getBoundingClientRect();
    const ids = ['vIzq', 'vDer', 'nIzq', 'nDer', 'viento', 'duelo', 'fuerza', 'pista', 'bPausa', 'bReinicia'];
    const c = [];
    for (const id of ids) {
      const e = $(id); if (!e) continue;
      const s = getComputedStyle(e);
      if (s.display === 'none' || s.visibility === 'hidden') continue;
      const r = e.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      c.push({ id, x0: r.left - m.left, y0: r.top - m.top, x1: r.right - m.left, y1: r.bottom - m.top });
    }
    const choques = [], fuera = [];
    for (let i = 0; i < c.length; i++) {
      const a = c[i];
      if (a.x0 < -1 || a.y0 < -1 || a.x1 > m.width + 1 || a.y1 > m.height + 1) fuera.push(a.id);
      for (let j = i + 1; j < c.length; j++) {
        const b2 = c[j];
        if (a.x0 < b2.x1 && b2.x0 < a.x1 && a.y0 < b2.y1 && b2.y0 < a.y1) choques.push(a.id + '×' + b2.id);
      }
    }
    /* Y EL PANEL ABIERTO TAMBIEN, aunque solo por el borde. La lista de
       arriba son los diez elementos del HUD, asi que una prueba que solo la
       mira NO PUEDE VER un titulo cortado adentro de un panel — que es
       exactamente lo que paso con «¡GANASTE!». Los botones de una columna
       con hueco no se pueden pisar entre ellos, asi que ahi lo unico que
       informa es si algo se sale; el `gDue` se saltea porque son cuarenta y
       ocho casillas de una reja y compararlas de a pares no dice nada.     */
    const pa = document.querySelector('.pan.on');
    if (pa) for (const e of pa.querySelectorAll('h1, .sub, .tx, .pie, .bt')) {
      if (e.closest('#gDue')) continue;
      const s2 = getComputedStyle(e);
      if (s2.display === 'none' || s2.visibility === 'hidden') continue;
      const r = e.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      if (r.left - m.left < -1 || r.right - m.left > m.width + 1 ||
          r.top - m.top < -1 || r.bottom - m.top > m.height + 1)
        fuera.push((e.id || e.className) + '@' + pa.id);
    }
    return { choques, fuera, n: c.length, marco: [Math.round(m.width), Math.round(m.height)] };
  },
  /* EL CUERPO Y LA CAJA DE CHOQUE SON DOS COSAS. El ragdoll es SOLO dibujo
     —`cajaArq` sigue clavada en XA/XB— asi que la sonda tiene que informar
     las dos: `rx/ry/rot` es donde se ve el cuerpo y no donde se le pega. */
  arq: () => ARQ.map(a => a && ({
    lado: a.lado, est: a.est, piso: a.piso, ang: +a.ang.toFixed(3),
    boca: [+a.boca.x.toFixed(2), +a.boca.y.toFixed(2)],
    puesto: !!a.puesto, rag: !!a.rag, muere: !!a.muere,
    rx: +a.rx.toFixed(3), ry: +a.ry.toFixed(3), rot: +a.rot.toFixed(3),
    tension: +a.k.toFixed(3),
  })),
  /* un golpe a mano, para poder mirar el tumbo sin depender de que la
     flecha acierte. `mata` deja al arquero en el piso: un muerto no se
     levanta, y eso hay que poder comprobarlo aparte. */
  golpe: (lado, cab, mata) => { arqRecibe(lado | 0, !!cab, cab ? DANO_CABEZA : DANO_CUERPO, !!mata); return window.__A.arq()[lado | 0]; },
  /* LA CAMARA A MANO, para poder MIRAR una pieza a tamano de estudio. A la
     escala de partida un arquero mide 53 px y el arco 40: a eso, un arco mal
     puesto y uno bien puesto se ven igual, asi que juzgar la pose en una
     captura de partida es juzgar una mancha. Planta la camara y dibuja. */
  mira: (x, y, cel) => { camFoco(x, y); CAM.cx = x; CAM.cy = y;
                         CAM.cel = cel || 4; encuadra(); escDibuja();
                         return { cx: CAM.cx, cy: CAM.cy, cel: CAM.cel }; },
  /* LA POSE, en el marco local del arquero. Es lo unico que dice donde cae
     el arco respecto del hombro y de la mano, que es lo que una foto de
     cuarenta pixeles no puede contestar. */
  pose: (l) => { const a = ARQ[l | 0]; if (!a) return null; const P = a.P;
                 return { est: a.est, bocaX: +P.bocaX.toFixed(3), bocaY: +P.bocaY.toFixed(3),
                          arcoAng: +P.arcoAng.toFixed(3), nockX: +P.nockX.toFixed(3),
                          manoTx: +P.manoTx.toFixed(3), manoTy: +P.manoTy.toFixed(3),
                          hombroY: +(HOMBRO_Y + P.resp).toFixed(3),
                          brazo: +Math.hypot(P.bocaX, P.bocaY - HOMBRO_Y - P.resp).toFixed(3),
                          brazoMax: +(BR1 + BR2).toFixed(3) }; },
  errs: () => window.__errs.slice(),
};

inicia();
</script></body></html>
