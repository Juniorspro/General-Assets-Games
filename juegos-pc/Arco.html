<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ARCO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07070b;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#f2eee6;user-select:none;-webkit-user-select:none;touch-action:none}

/* ══════════ EL MARCO ES VERTICAL Y NO SE GIRA ══════════
   Al revés de los juegos 3D de este repo, que se dibujan apaisados adentro de un
   teléfono vertical. Un casual se juega con el teléfono como uno lo tiene y un
   solo pulgar: girarlo sería pedirle al jugador que cambie de postura.
   El lienzo se dibuja con el ANCHO clavado en 720 y el alto según la forma de
   la pantalla —lo calcula `medir()`— así que el marco la llena entera y una
   ficha de 40 px mide lo mismo en un teléfono de 360 y en uno de 1440. */
#caja{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  overflow:hidden;background:#000;--ac:#f2eee6}
canvas{display:block;width:100%;height:100%}
/* ══════════ EL TELON DEL MENU ══════════
   En el menu el lienzo no dibuja nada, asi que sin esto el menu es un panel
   gris sobre negro — o sea la pantalla de opciones de cualquier cosa. Es el
   MISMO fondo generado que usa la partida, asi que el menu y el juego se ven
   del mismo sitio, y va en DOM y no en el lienzo porque no hay que redibujarlo
   sesenta veces por segundo para que quede quieto.
   ── Y NO RECIBE TOQUES, QUE ES LO QUE ROMPIO EL JUEGO UNA VEZ ──
   Un elemento con `opacity:0` SIGUE RECIBIENDO el dedo. Medido con
   `elementFromPoint` en el medio de la pantalla y en partida: lo que estaba
   debajo del dedo era `tela` y no el lienzo, o sea que NINGUN toque llegaba al
   juego. Y no lo vio ninguna sonda, porque las sondas llaman a `JUEGO.baja`
   directo y se saltean todo el camino entre el dedo y el juego. */
#tela{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;
  transition:opacity .6s;z-index:1;pointer-events:none}
#tela.on{opacity:1}

/* ══════════ LO QUE VA EN DOM Y LO QUE VA EN EL LIENZO ══════════
   En el lienzo: el juego y las cinemáticas. En DOM: sólo el texto que hay que
   TRADUCIR y que tiene que quedar nítido en cualquier densidad de pantalla.
   Un texto dibujado en un lienzo de 720 se ve borroso en un teléfono de 1440, y
   el nombre del juego es justo lo que se mira primero. */
.pan{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:2.6vh;padding:6vw;text-align:center;z-index:5;
  background:linear-gradient(180deg,rgba(7,7,11,.34) 0%,rgba(7,7,11,.74) 44%,
    rgba(7,7,11,.93) 100%)}
.pan.on{display:flex}
/* ── EL TAMAÑO DEL TÍTULO SALE DEL LARGO DEL NOMBRE ──
   Con 11vw clavado, un nombre de diez letras —con un cuarto de em de espaciado
   entre cada una— mide mas que el marco y sale CORTADO por los dos lados.
   `--h1` lo calcula el arranque a partir de la cantidad de letras, así que el
   próximo nombre largo entra solo. */
.pan h1{font-size:clamp(26px,var(--h1,11vw),64px);letter-spacing:.26em;font-weight:800;
  text-indent:.26em;line-height:1;
  text-shadow:0 0 30px var(--ac),0 4px 22px #000}
.em{width:clamp(90px,27vw,158px);height:auto;margin-bottom:-1.4vh;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.75))}
.em[hidden]{display:none}
#pFin h1{font-size:clamp(24px,7.5vw,42px);letter-spacing:.16em;text-indent:.16em}
.pan p{font-size:clamp(12px,3.4vw,17px);line-height:1.6;opacity:.62;max-width:24em}
.fila{display:flex;gap:2.6vw;flex-wrap:wrap;justify-content:center}
.bt{appearance:none;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.05);
  color:inherit;font:inherit;font-size:clamp(12px,3.5vw,16px);font-weight:700;
  letter-spacing:.16em;padding:1.5vh 5.5vw;border-radius:999px;cursor:pointer}
.bt.p{background:var(--ac);color:#0b0b10;border-color:var(--ac)}
.bt:disabled{opacity:.34}
.bt.ch{padding:.9vh 3.4vw;font-size:11px;letter-spacing:.12em}

/* ══════════ EL SELECTOR DE NIVELES ══════════
   Los tres juegos de niveles necesitan una reja con el progreso: qué está
   abierto, cuántas estrellas dio cada uno. Y tiene que poder DESLIZARSE, porque
   son doscientos niveles y en un teléfono entran veinte por pantalla.
   `justify-content:flex-start` a propósito: centrado, con la reja más alta que
   el marco, el navegador recorta por ARRIBA y las primeras filas quedan
   inalcanzables — un defecto clásico de flex con overflow. */
#pNiveles{justify-content:flex-start;padding-top:4vh;gap:1.8vh}
#rejaN{display:grid;grid-template-columns:repeat(5,1fr);gap:2.2vw;width:100%;
  max-width:520px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;padding:1vh .5vw 3vh}
.nv{position:relative;aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-weight:800;font-size:clamp(13px,4vw,19px);color:inherit;font-family:inherit}
.nv.hecho{border-color:var(--ac);background:rgba(255,255,255,.10)}
.nv.trabado{opacity:.26;cursor:default}
.nv .es{font-size:9px;letter-spacing:.08em;color:#ffd76a;line-height:1;height:9px}
#tituN{font-size:clamp(15px,4.6vw,22px);letter-spacing:.2em;font-weight:800}

/* ══════════ EL HUD ══════════
   Arriba el número grande —los puntos en los de puntaje, el nivel en los de
   niveles— y debajo su rótulo. A los costados, dos fichas chicas para lo que
   cambia dentro del nivel (movimientos, burbujas que quedan). */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:4}
#hud.on{opacity:1}
#marca{position:absolute;top:2.2vh;left:0;right:0;text-align:center;
  font-size:clamp(28px,9.4vw,54px);font-weight:800;letter-spacing:.04em;
  text-shadow:0 3px 18px rgba(0,0,0,.75)}
#sub{position:absolute;top:calc(2.2vh + 10.6vw);left:0;right:0;text-align:center;
  font-size:clamp(10px,3vw,14px);letter-spacing:.28em;opacity:.55}
.fic{position:absolute;top:2.4vh;font-size:clamp(10px,3vw,14px);letter-spacing:.14em;
  font-weight:700;opacity:.72;padding:.7vh 3vw;border-radius:999px;
  background:rgba(7,7,11,.5);border:1px solid rgba(255,255,255,.12)}
#ficI{left:3.5vw}
#ficD{right:3.5vw}
.fic[hidden]{display:none}
/* ── LA FICHA DEL MULTIPLICADOR ──
   Debajo del marcador y con su propia barrita: la barra es la ventana de la
   racha, o sea el tiempo que queda para que el próximo acierto la sostenga. Sin
   la barra, la racha se corta sola y el jugador no sabe por qué. */
#combo{position:absolute;top:calc(2.2vh + 15vw);left:0;right:0;text-align:center;
  font-size:clamp(18px,6vw,34px);font-weight:800;letter-spacing:.06em;
  color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.6),0 3px 12px #000;
  opacity:0;transform:scale(.7);transition:opacity .18s,transform .18s}
#combo.on{opacity:1;transform:scale(1)}
#comboV{position:absolute;top:calc(2.2vh + 22vw);left:38%;right:38%;height:4px;
  background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden;
  opacity:0;transition:opacity .18s}
#combo.on ~ #comboV{opacity:.8}
#comboB{height:100%;width:0;background:#ffd76a}
#reloj{position:absolute;left:12%;right:12%;bottom:3.2vh;height:6px;
  background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
/* ── Y SUBE CUANDO HAY FILA DE BOTONES ──
   Medido con `cajas()` en BURBUJAS: el reloj caia en y 857 y la fila de botones
   ocupaba de 840 a 871, o sea la barra dibujada por ENCIMA de DESHACER. Los dos
   viven anclados abajo y ninguno sabia del otro. */
body.conAcc #reloj{bottom:9.6vh}
#relojB{height:100%;width:100%;background:#f2eee6}
#relojB.poco{background:#e0553f}
/* ══════════ LOS BOTONES DE PARTIDA ══════════
   DESHACER y REINICIAR sólo existen en los juegos de niveles, y son la mitad de
   lo que hace que un rompecabezas se pueda jugar: sin deshacer, un movimiento
   mal pensado cuesta el nivel entero y el jugador cierra el juego. Van con
   `pointer-events:auto` porque el HUD entero está en `none` — si no, el botón
   se ve y no se puede tocar, que es exactamente el defecto que ya costó una
   vuelta con el telón. */
#acc{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;gap:3vw;
  justify-content:center;pointer-events:auto}
#acc[hidden]{display:none}
#acc .bt{background:rgba(7,7,11,.62)}
/* ── Y NO RECIBEN EL DEDO CON EL HUD APAGADO ──
   `#hud` va a `opacity:0` entre partidas, y un elemento invisible SIGUE
   RECIBIENDO toques: con `pointer-events:auto` clavado, los tres botones se
   quedarían comiendo el dedo por encima del menú. Es exactamente el defecto que
   ya dejó un juego sin poder empezar, y ahí lo causaba el telón. */
#hud:not(.on) #acc{pointer-events:none}

/* el pie de la cinemática: el único texto de una cinemática, y va en DOM por lo
   mismo que el título — hay que poder traducirlo y tiene que leerse */
#cine{position:absolute;left:8%;right:8%;bottom:9vh;text-align:center;z-index:5;
  font-size:clamp(13px,3.8vw,19px);line-height:1.5;opacity:0;transition:opacity .5s;
  text-shadow:0 2px 16px #000;pointer-events:none}
#cine.on{opacity:.96}
#salta{position:absolute;right:4vw;top:3vh;z-index:6;font-size:11px;letter-spacing:.2em;
  opacity:0;transition:opacity .4s;pointer-events:none}
#salta.on{opacity:.4}

#estr{font-size:clamp(22px,7vw,38px);letter-spacing:.18em;color:#ffd76a;
  text-shadow:0 0 20px rgba(255,215,106,.55)}
#estr[hidden]{display:none}

/* ══════════ EL VIDEO DE LA CAMARA ══════════
   Dos pixeles y transparente, NO `display:none`. Un video que el compositor
   considera que no se dibuja puede DEJAR DE ENTREGAR CUADROS, y sin cuadros no
   hay deteccion: es la leccion de RECREO, donde esconderlo dejaba el juego sin
   manos sin un solo error en la consola. */
#camVid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;
  pointer-events:none;z-index:0}
/* la linea de estado del sensor: permanente y en el MENU, no un aviso de dos
   segundos dentro de la partida. Un aviso de dos segundos en una pantalla que
   no se esta mirando no es un aviso — y el motivo por el que el sensor no anda
   es justamente lo que el jugador necesita saber antes de empezar. */
#sensor{font-size:clamp(10px,2.9vw,13px);letter-spacing:.14em;opacity:.62;
  line-height:1.5;max-width:22em}
#sensor.mal{color:#ffc98a;opacity:.85}
#sensor[hidden]{display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#velo{position:absolute;inset:0;background:#07070b;opacity:0;pointer-events:none;
  z-index:6;transition:opacity .45s}
#velo.on{opacity:1}
</style></head><body>
<div id="caja">
  <canvas id="c"></canvas>
  <video id="camVid" playsinline muted autoplay></video>
  <div id="tela"></div>
  <div id="hud">
    <div id="marca">0</div>
    <div id="sub"></div>
    <div class="fic" id="ficI" hidden></div>
    <div class="fic" id="ficD" hidden></div>
    <div id="combo"></div>
    <div id="comboV"><div id="comboB"></div></div>
    <div id="reloj"><div id="relojB"></div></div>
    <div id="acc" hidden>
      <button class="bt ch" id="bDes" data-i18n="deshacer"></button>
      <button class="bt ch" id="bRei" data-i18n="reiniciar"></button>
      <button class="bt ch" id="bSal" data-i18n="salir"></button>
    </div>
  </div>
  <div id="cine"></div>
  <div id="salta"></div>
  <div id="velo"></div>
  <div id="flash"></div>

  <div class="pan on" id="pIdioma">
    <img class="em" id="emI" alt="" hidden>
    <h1>ARCO</h1>
    <div class="fila">
      <button class="bt p" data-lang="es">ESPAÑOL</button>
      <button class="bt" data-lang="en">ENGLISH</button>
      <button class="bt" data-lang="pt">PORTUGUÊS</button>
    </div>
  </div>

  <div class="pan" id="pMenu">
    <img class="em" id="emM" alt="" hidden>
    <h1>ARCO</h1>
    <p data-i18n="sub"></p>
    <div class="fila">
      <button class="bt p" id="bJugar" data-i18n="jugar"></button>
      <button class="bt" id="bComo" data-i18n="como"></button>
    </div>
    <p id="sensor" hidden></p>
    <p id="mejor" style="opacity:.42;letter-spacing:.2em;font-size:12px"></p>
    <div class="fila" style="gap:1.8vw">
      <button class="bt ch" data-lang="es">ES</button>
      <button class="bt ch" data-lang="en">EN</button>
      <button class="bt ch" data-lang="pt">PT</button>
    </div>
  </div>

  <div class="pan" id="pNiveles">
    <div id="tituN" data-i18n="niveles"></div>
    <div id="rejaN"></div>
    <div class="fila"><button class="bt ch" id="bNMenu" data-i18n="menu"></button></div>
  </div>

  <div class="pan" id="pFin">
    <h1 id="finT"></h1>
    <div id="estr" hidden></div>
    <p id="finP"></p>
    <div class="fila">
      <button class="bt p" id="bOtra" data-i18n="otra"></button>
      <button class="bt" id="bMenu" data-i18n="menu"></button>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{}}</script>
<script type="module">
/* ══════════════════════ EL MARCO Y EL RELOJ ══════════════════════ */
const $ = (i) => document.getElementById(i);

/* ── EL ANCHO DE DISEÑO ES FIJO Y EL ALTO NO ──
   Todo lo que un juego escribe —una posición, un radio, un tamaño de letra—
   está en unidades de diseño con el ancho clavado en 720, así que una moneda de
   40 px mide lo mismo en un teléfono de 360 y en uno de 1440. Eso es lo que
   evita el defecto que aparece sólo en un tamaño de pantalla y que nadie puede
   reproducir.

   PERO EL ALTO NO PUEDE SER FIJO, y eso se vio en la primera captura: con
   720×1280 clavado —9:16, la relación de un teléfono de 2016— en un teléfono de
   hoy (412×892, o sea 0,46) el marco entraba por el ancho y quedaban DOS BANDAS
   NEGRAS arriba y abajo. Un minijuego que se abre adentro de TikTok tiene que
   ocupar la pantalla entera; una banda negra se lee a que el juego está roto.
   Así que el alto se calcula de la pantalla y los juegos lo leen: lo que se
   ancla abajo se escribe como `AL - algo`, no como un número. Se topa arriba y
   abajo para que una ventana de escritorio muy ancha o muy alta no deforme el
   diseño — ahí sí quedan bandas, y ahí sí corresponde. */
const AN = 720;
let AL = 1280;
const AL_MIN = 1100, AL_MAX = 1760;

const lienzo = $('c');
const g = lienzo.getContext('2d');
const caja = $('caja');
let ESC = 1, DPR = 1;

function medir(){
  const vw = window.innerWidth, vh = window.innerHeight;
  /* el alto de diseño sale de la forma de la pantalla, así que el marco la llena
     entera y no hay bandas */
  let e = vw / AN;
  AL = Math.round(vh / e);
  if (AL < AL_MIN){ AL = AL_MIN; e = vh / AL; }
  else if (AL > AL_MAX){ AL = AL_MAX; e = vh / AL; }
  const w = Math.round(AN * e), h = Math.round(AL * e);
  caja.style.width = w + 'px'; caja.style.height = h + 'px';
  /* ── EL PIXEL RATIO VA TOPADO EN 2, Y ESO ESTÁ MEDIDO EN OTRO JUEGO ──
     En Maicol se midió que dibujar al doble de la resolución de diseño costaba
     la mitad de los cuadros y no compraba ni un detalle, porque no hay más
     detalle que dar: los dibujos están hechos para 720 de ancho. Con 2 el texto
     y los bordes quedan finos y no se paga un tercer múltiplo. */
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(w * DPR);
  lienzo.height = Math.round(h * DPR);
  ESC = (w * DPR) / AN;
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.imageSmoothingEnabled = true;
}
addEventListener('resize', () => setTimeout(medir, 60));
addEventListener('orientationchange', () => setTimeout(medir, 120));

/* ── EL RELOJ: PASO FIJO DE 60 CON TOPE ──
   Un minijuego que se juega por reflejos NO PUEDE depender de los cuadros por
   segundo del aparato: si la moneda cae más rápido en un teléfono lento, es
   otro juego. La simulación va a 60 pasos fijos y el dibujo sale de donde
   quedó. Y el `dt` se topa en un cuarto de segundo, porque una pestaña que
   estuvo dormida no puede simular un minuto de golpe. */
const PASO = 1/60;
let _acum = 0, _ultimo = performance.now();
let MODO = 'idioma';      /* idioma · menu · como · cine · juega · fin */
let PAUSA = false, CONGELADO = false;
let fps = 0, _cuadros = 0, _acumF = 0;

/* la entrada: un solo verbo. Llega normalizada a las unidades de diseño, así
   que un juego nunca ve un píxel de pantalla. */
const TOQUE = { x: 0, y: 0, abajo: false, movido: false, n: 0 };
function aDiseno(ev){
  const r = lienzo.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: (t.clientX - r.left) / r.width * AN,
           y: (t.clientY - r.top) / r.height * AL };
}
/* ── EL `preventDefault` DE UN `touchstart` CANCELA EL CLICK, Y ESO DEJABA EL
       JUEGO SIN PODER EMPEZAR ──
   Los cuatro escuchas estaban colgados de la VENTANA, así que un toque en el
   botón JUGAR o en el de idioma pasaba primero por acá, llegaba a
   `preventDefault()` —el juego consume el toque— y el navegador entonces NO
   sintetiza el `click`. En el banco no se veía: Playwright despacha un click de
   ratón de verdad y ese camino no pasa por el táctil. En un teléfono, tocar
   JUGAR no hacía absolutamente nada.

   Ahora la entrada del juego cuelga del LIENZO. Los paneles viven por encima
   (`z-index 5`), así que mientras hay un panel abierto el lienzo no recibe nada
   y los botones son botones; en partida no hay panel y el lienzo recibe todo.
   `touchend`/`mouseup` siguen en la ventana a propósito: un arrastre que
   termina afuera del marco tiene que soltar igual. */
function baja(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.abajo = true; TOQUE.movido = false; TOQUE.n++;
  if (MODO === 'cine'){ cineSalta(); return; }
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function mueve(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.movido = true;
  if (MODO === 'juega' && TOQUE.abajo && JUEGO.mueve) JUEGO.mueve(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function sube(){
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(TOQUE.x, TOQUE.y);
  TOQUE.abajo = false;
}
lienzo.addEventListener('touchstart', baja, { passive: false });
lienzo.addEventListener('touchmove', mueve, { passive: false });
addEventListener('touchend', sube, { passive: true });
addEventListener('touchcancel', sube, { passive: true });
lienzo.addEventListener('mousedown', baja);
addEventListener('mousemove', (e) => { if (TOQUE.abajo) mueve(e); });
addEventListener('mouseup', sube);
/* la barra espaciadora hace de toque EN EL MEDIO del marco: es lo que permite
   probarlo en una notebook sin fingir un táctil. Y va con las coordenadas de
   diseño y no con las del evento, porque un `keydown` no trae ninguna — con
   `clientX` en cero el toque caía en el borde izquierdo, que en un juego de
   tocar la mitad es una respuesta equivocada. */
function toqueMedio(){
  if (MODO === 'cine'){ cineSalta(); return; }
  TOQUE.x = AN/2; TOQUE.y = AL/2; TOQUE.abajo = true;
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(AN/2, AL/2);
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(AN/2, AL/2);
  TOQUE.abajo = false;
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') toqueMedio();
});
/* ══════════════════════ EL GIROSCOPIO Y LA SACUDIDA ══════════════════════
   Dos cosas distintas que salen del mismo aparato: cuanto esta INCLINADO el
   telefono (`deviceorientation`) y cuando lo SACUDEN (`devicemotion`). La
   primera es una posicion y la segunda un acontecimiento, y por eso se leen de
   dos eventos y no de uno.

   ── POR QUE NO SE USA LA CAMARA PARA ESTO ──
   Es la leccion de BARRIO: para saber para donde esta mirando el jugador, lo
   obvio seria detectar la cara. Y no hace falta — el telefono YA sabe como esta
   orientado, sin camara, sin modelo y sin un milisegundo de deteccion. La
   orientacion del aparato ES la postura del jugador, porque el aparato lo tiene
   en la mano.

   ── LAS CINCO COSAS QUE HAY QUE HACER BIEN, Y CADA UNA COSTO UNA VUELTA ──
   1. EL PERMISO DE iOS. Desde iOS 13, `deviceorientation` no dispara hasta que
      `DeviceOrientationEvent.requestPermission()` se llama DENTRO de un gesto
      del usuario. Llamado en el arranque, la promesa se rechaza y el juego se
      queda sin sensor sin decir por que.
   2. EL CERO ES LA POSTURA EN LA QUE SE EMPEZO. Nadie juega con el telefono
      perfectamente vertical: con un cero absoluto, el juego arranca inclinado.
   3. ZONA MUERTA. Una mano nunca esta quieta, y sin zona muerta el mundo
      tiembla despacio todo el tiempo. 1,6 grados, que es lo que se midio en
      BARRIO.
   4. LA VUELTA CORTA. `beta` y `gamma` dan la vuelta: cruzando de 179 a -179 la
      diferencia cruda son 358 grados y el mundo pega media vuelta.
   5. LA SACUDIDA SE MIDE EN EL CAMBIO Y NO EN LA MAGNITUD. La gravedad ya son
      9,8: mirando el modulo de la aceleracion, el telefono quieto parece estar
      sacudiendose siempre. Lo que distingue una sacudida es que el vector
      CAMBIE rapido. */

const GIRO = {
  estado: 'no',        /* no · pidiendo · lista · negado · sin · insegura */
  on: false,
  x: 0, y: 0,          /* la inclinacion, de -1 a 1, ya con cero y zona muerta */
  crudo: { b: 0, g: 0, a: 0 },
  cero: { b: 0, g: 0, a: 0 },
  hayCero: false,
  n: 0,                /* eventos recibidos: distingue «no hay sensor» de «no llego ninguno» */
  sac: 0,              /* fuerza de la ultima sacudida, decae */
  sacN: 0,
  sacPico: 0,
  _sacFrio: 0,
  _ult: null,
  /* ── LO QUE CADA JUEGO AJUSTA ──
     `rango` son los grados de inclinacion que valen 1: un laberinto quiere poco
     (se juega con muñeca) y una camara quiere mas. `recentra` es la constante de
     tiempo con la que el cero persigue la postura actual — un juego de mirar la
     quiere para que dejar el telefono torcido no te deje mirando al techo, y un
     laberinto NO la quiere, porque ahi el cero es el nivel del piso. */
  rango: 30,
  recentra: 0,
  zona: 1.6
};
const GIRO_SAC_UMB = 22;      /* m/s^2 de CAMBIO para que cuente como sacudida */
const GIRO_SAC_FRIO = 0.42;   /* segundos entre dos sacudidas */

/* la vuelta corta: la diferencia entre dos angulos, siempre en (-180, 180] */
function giroDelta(a, b){
  let d = a - b;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

function giroEvento(e){
  if (e.beta == null && e.gamma == null) return;   /* el evento existe y viene vacio */
  GIRO.n++;
  GIRO.crudo.b = e.beta || 0;
  GIRO.crudo.g = e.gamma || 0;
  GIRO.crudo.a = e.alpha || 0;
  if (!GIRO.hayCero) giroCero();
  GIRO.on = true;
  giroCalcula();
}
function giroCero(){
  GIRO.cero.b = GIRO.crudo.b; GIRO.cero.g = GIRO.crudo.g; GIRO.cero.a = GIRO.crudo.a;
  GIRO.hayCero = true;
}
function giroCalcula(){
  /* en vertical, `gamma` es inclinar de costado y `beta` adelante y atras */
  const dg = giroDelta(GIRO.crudo.g, GIRO.cero.g);
  const db = giroDelta(GIRO.crudo.b, GIRO.cero.b);
  const z = GIRO.zona;
  const ap = (d) => {
    const s = Math.sign(d), m = Math.abs(d);
    if (m <= z) return 0;
    return Math.max(-1, Math.min(1, s*(m - z)/GIRO.rango));
  };
  GIRO.x = ap(dg);
  GIRO.y = ap(db);
}

/* ── LA SACUDIDA ──
   Se mira el CAMBIO del vector de aceleracion entre dos eventos. Y con
   `accelerationIncludingGravity`, que es la que existe en todos los aparatos —
   `acceleration` sin gravedad la informa solo una parte de ellos, y la
   diferencia entre dos lecturas ya le quita la gravedad, porque la gravedad no
   cambia. */
function giroMocion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const p = GIRO._ult;
  GIRO._ult = { x: a.x, y: a.y, z: a.z };
  if (!p) return;
  const d = Math.hypot(a.x - p.x, a.y - p.y, a.z - p.z);
  GIRO.sacPico = Math.max(GIRO.sacPico, d);
  if (d > GIRO_SAC_UMB && GIRO._sacFrio <= 0){
    GIRO._sacFrio = GIRO_SAC_FRIO;
    giroSacudida(Math.min(1, (d - GIRO_SAC_UMB)/34 + 0.35));
  }
}
/* quien quiera enterarse se cuelga de acá: el juego pone `GIRO.alSacudir` */
function giroSacudida(k){
  GIRO.sac = Math.max(GIRO.sac, k);
  GIRO.sacN++;
  if (GIRO.alSacudir) GIRO.alSacudir(k);
}

function giroPaso(dt){
  if (GIRO._sacFrio > 0) GIRO._sacFrio = Math.max(0, GIRO._sacFrio - dt);
  if (GIRO.sac > 0) GIRO.sac = Math.max(0, GIRO.sac - dt*3.2);
  /* el recentrado va DESPACIO y solo cuando el juego lo pide: rapido, el mundo
     se endereza solo mientras uno lo esta inclinando y no se puede jugar */
  if (GIRO.recentra > 0 && GIRO.hayCero){
    const k = Math.min(1, dt/GIRO.recentra);
    GIRO.cero.b += giroDelta(GIRO.crudo.b, GIRO.cero.b)*k;
    GIRO.cero.g += giroDelta(GIRO.crudo.g, GIRO.cero.g)*k;
    giroCalcula();
  }
}

/* ── SE PIDE DENTRO DE UN GESTO, Y DEVUELVE SI QUEDO ANDANDO ──
   Y no bloquea: si el permiso se niega o el aparato no tiene sensor, el juego
   tiene que seguir siendo jugable con el dedo. Cada juego trae su respaldo. */
async function giroPide(){
  if (GIRO.estado === 'lista' || GIRO.estado === 'pidiendo') return GIRO.on;
  GIRO.estado = 'pidiendo';
  /* sin HTTPS los sensores no existen en varios navegadores, y ahi no hay
     permiso que negar: ni preguntan. Es la causa mas facil de confundir con un
     error del juego. */
  if (!window.isSecureContext && location.protocol !== 'file:'){
    GIRO.estado = 'insegura'; return false;
  }
  if (typeof DeviceOrientationEvent === 'undefined'){ GIRO.estado = 'sin'; return false; }
  const DOE = DeviceOrientationEvent, DME = window.DeviceMotionEvent;
  try {
    if (DOE && typeof DOE.requestPermission === 'function'){
      const r = await DOE.requestPermission();
      if (r !== 'granted'){ GIRO.estado = 'negado'; return false; }
    }
    if (DME && typeof DME.requestPermission === 'function'){
      try { await DME.requestPermission(); } catch(e){}
    }
  } catch(e){ GIRO.estado = 'negado'; return false; }
  addEventListener('deviceorientation', giroEvento, { passive: true });
  addEventListener('devicemotion', giroMocion, { passive: true });
  GIRO.estado = 'lista';
  /* ── Y SE COMPRUEBA QUE LLEGUE ALGO ──
     En una notebook `deviceorientation` se registra sin error y NUNCA dispara:
     el estado diria «lista» con el sensor muerto, y el juego esperaria para
     siempre una inclinacion que no va a llegar. A los 1,2 s, si no llego ni un
     evento, se declara sin sensor y entra el respaldo. */
  setTimeout(() => { if (GIRO.n === 0 && GIRO.estado === 'lista') GIRO.estado = 'sin'; }, 1200);
  return true;
}

function giroVer(){
  return { estado: GIRO.estado, on: GIRO.on, n: GIRO.n,
           x: +GIRO.x.toFixed(3), y: +GIRO.y.toFixed(3),
           crudo: [Math.round(GIRO.crudo.b), Math.round(GIRO.crudo.g)],
           cero: [Math.round(GIRO.cero.b), Math.round(GIRO.cero.g)],
           sac: +GIRO.sac.toFixed(2), sacN: GIRO.sacN,
           sacPico: +GIRO.sacPico.toFixed(1),
           rango: GIRO.rango, recentra: GIRO.recentra };
}
/* ══════════════════════ LA MANO POR LA CAMARA ══════════════════════
   MediaPipe lee la mano y de los veintiun puntos sale UNA cosa: que gesto es.
   No se dibuja la mano en 3D ni se apunta con ella —eso ya lo hacen RECREO y
   RezUno—: acá lo unico que hace falta es piedra, papel o tijera, o sea un
   simbolo, y un simbolo es mucho mas barato y mucho mas robusto que una
   posicion.

   ── TODO LO QUE SIGUE SALE DE DOS JUEGOS QUE YA COSTARON SUS VUELTAS ──
   1. LA CAMARA SE PIDE CON `exact` Y NO COMO PREFERENCIA. `facingMode:'user'` a
      secas es un DESEO: el navegador abre la que quiera. Con `exact`, si la
      peticion vuelve ES esa camara; si no hay, tira y se prueba la otra.
   2. LA ENTRADA VA A 640x480 Y NO A 256x192. Medido en RezUno: diez veces mas
      pixeles NO cuestan mas —MediaPipe redimensiona adentro al tamano de sus
      modelos— y bajarla es regalar deteccion a cambio de nada.
   3. LOS UMBRALES VAN BAJOS (0,4 / 0,4 / 0,3). Soltar una mano ya encontrada no
      cuesta un cuadro: la medicion siguiente tiene que volver a correr el
      buscador de palma, que es la parte cara. Dudar sale mas caro que seguir.
   4. LA MEDICION CUELGA DEL CUADRO DE CAMARA y no del de render: con
      `requestVideoFrameCallback` corre una vez por cuadro de camara, que es lo
      unico que puede traer datos nuevos.
   5. GPU PRIMERO Y CPU DE RESPALDO: en telefonos viejos el delegado de GPU tira
      al crear la tarea, y un detector a 15 por segundo en CPU sigue siendo
      jugable.
   6. DOS CDN: el detector es una descarga de un tercero, y si ese tercero no
      contesta el juego se queda sin manos y el jugador no puede hacer nada.
   7. EL GESTO NO SE TOMA, SE SOSTIENE. Un gesto mal leido en un juego donde el
      gesto es la jugada es una derrota que el jugador no entiende: cada lectura
      tiene que ganar tres cuadros seguidos para valer. */

const MANO_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MANO_CDN = [
  { js: MANO_URL, wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm' }];
const MANO_MODELO = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const MANO_ENT_W = 640, MANO_ENT_H = 480;

const MANO = {
  estado: 'no',      /* no · pidiendo · lista · permiso · camara · cdn · modelo · insegura */
  det: null, vid: null, usa: '', espejo: true, delegado: '',
  pts: null,         /* los 21 puntos crudos, para dibujar */
  dedos: -1,         /* cuantos estirados, crudo */
  gesto: null,       /* 'piedra' · 'papel' · 'tijera' · null, ya votado */
  gestoCrudo: null,
  n: 0, hz: 0,
  _votos: [], _ultT: 0, _huecos: 0
};
/* ── LA CAMARA FRONTAL, Y ACA SI ES LA CORRECTA ──
   Al reves de RECREO y RezUno, donde se mete la mano POR DETRAS del telefono
   para que entre en la escena. Piedra papel o tijera se juega mostrando la mano
   DE FRENTE, como se juega de verdad, y el jugador tiene que poder verse: con la
   trasera habria que apuntar el telefono para el otro lado y jugar a ciegas. */
const MANO_PREF = 'user';

function manoFallo(q){ MANO.estado = q; if (window.pintaMano) window.pintaMano(); }

async function manoPide(){
  if (MANO.estado === 'lista' || MANO.estado === 'pidiendo') return MANO.estado === 'lista';
  MANO.estado = 'pidiendo';
  if (window.pintaMano) window.pintaMano();
  /* sin HTTPS `navigator.mediaDevices` NO EXISTE, asi que no hay permiso que
     negar: el navegador ni pregunta */
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ manoFallo('insegura'); return false; }
  const pedir = (v) => navigator.mediaDevices.getUserMedia({
    video: Object.assign({ width: { ideal: MANO_ENT_W }, height: { ideal: MANO_ENT_H },
                           frameRate: { ideal: 60 } }, v), audio: false });
  let flujo = null, cierto = '';
  const otra = MANO_PREF === 'user' ? 'environment' : 'user';
  try { flujo = await pedir({ facingMode: { exact: MANO_PREF } }); cierto = MANO_PREF; }
  catch(e){
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){ manoFallo('permiso'); return false; }
    try { flujo = await pedir({ facingMode: { exact: otra } }); cierto = otra; }
    catch(e2){
      if (e2 && (e2.name === 'NotAllowedError' || e2.name === 'SecurityError')){ manoFallo('permiso'); return false; }
      try { flujo = await pedir({}); }
      catch(e3){ manoFallo((e3 && (e3.name === 'NotFoundError' || e3.name === 'OverconstrainedError')) ? 'camara' : 'permiso'); return false; }
    }
  }
  const v = $('camVid');
  v.srcObject = flujo; MANO.vid = v;
  try { await v.play(); } catch(e){}
  try {
    const tr = flujo.getVideoTracks()[0];
    const s = tr.getSettings ? tr.getSettings() : {};
    /* ── EL ESPEJO SE LEE DEL TRACK Y LA REGLA ES ASIMETRICA ──
       Una camara que NO dice para donde mira no es la trasera: un telefono
       informa su `facingMode` y una webcam callada es de las que apuntan a la
       cara. Medido en el banco, `getSettings()` de una camara de notebook no
       trae la clave, y suponer «trasera» dejaba la imagen sin espejo. */
    MANO.usa = cierto || s.facingMode || 'user';
    MANO.espejo = (MANO.usa !== 'environment');
  } catch(e){ MANO.usa = cierto || 'user'; MANO.espejo = true; }

  let vision = null;
  for (const cdn of MANO_CDN){
    try { vision = await import(/* @vite-ignore */ cdn.js); MANO.cdn = cdn; break; } catch(e){}
  }
  if (!vision){ manoFallo('cdn'); return false; }
  try {
    const fs = await vision.FilesetResolver.forVisionTasks(MANO.cdn.wasm);
    for (const del of ['GPU','CPU']){
      try {
        MANO.det = await vision.HandLandmarker.createFromOptions(fs, {
          baseOptions: { modelAssetPath: MANO_MODELO, delegate: del },
          runningMode: 'VIDEO', numHands: 1,
          minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4,
          minTrackingConfidence: 0.3 });
        MANO.delegado = del; break;
      } catch(e){}
    }
  } catch(e){}
  if (!MANO.det){ manoFallo('modelo'); return false; }
  MANO.estado = 'lista';
  if (window.pintaMano) window.pintaMano();
  manoLazo();
  return true;
}

/* la medicion cuelga del cuadro de CAMARA: es lo unico que puede traer datos
   nuevos, y colgada del render se mide dos veces el mismo cuadro */
function manoLazo(){
  const v = MANO.vid;
  if (!v || !MANO.det) return;
  const paso = () => {
    if (!MANO.det) return;
    try {
      const t = performance.now();
      const r = MANO.det.detectForVideo(v, t);
      manoLee(r && r.landmarks && r.landmarks[0] ? r.landmarks[0] : null);
      if (MANO._ultT) MANO.hz = Math.round(1000/Math.max(1, t - MANO._ultT));
      MANO._ultT = t;
      MANO.n++;
    } catch(e){}
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
    else setTimeout(paso, 40);
  };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
  else setTimeout(paso, 40);
}

/* ══════════ DE VEINTIUN PUNTOS A UN SIMBOLO ══════════
   ── TODO SE MIDE EN PROPORCION AL TAMANO DE LA PALMA ──
   La mano puede estar a veinte centimetros o a un metro de la camara, asi que
   ninguna distancia en pixeles sirve. La palma —muñeca al nudillo del medio— es
   invariante a la distancia Y al tamano de la mano de quien juega. Es la misma
   regla que en RECREO.

   ── Y EL PULGAR NO SE MIDE COMO LOS DEMAS ──
   Los otros cuatro se estiran ALEJANDO la punta de la muñeca. El pulgar se abre
   hacia el COSTADO, y su punta puede quedar a la misma distancia de la muñeca
   abierto o cerrado: se mide contra el nudillo del MENIQUE, del que se aleja al
   abrirse y al que le cruza por delante al cerrarse. Sin esa distincion, «cinco
   dedos» no existe. */
const M_TIP = [4, 8, 12, 16, 20], M_PIP = [3, 6, 10, 14, 18];
function manoLee(pts){
  MANO.pts = pts;
  if (!pts){
    MANO.dedos = -1; MANO.gestoCrudo = null;
    MANO._huecos++;
    /* ── LA CADUCIDAD SE MIDE EN HUECOS Y NO EN MILISEGUNDOS ──
       280 ms fijos son once mediciones a 40 Hz y tres y media a 12: en un
       aparato lento, dos fallos seguidos borraban el gesto. */
    if (MANO._huecos > 5){ MANO.gesto = null; MANO._votos.length = 0; }
    return;
  }
  MANO._huecos = 0;
  const d = (a, b) => Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y);
  const palma = Math.max(0.0001, d(0, 9));
  const est = [];
  /* el pulgar: abierto se aleja del nudillo del meñique */
  est.push(d(4, 17)/palma > 0.92);
  for (let i = 1; i < 5; i++){
    /* la punta mas lejos de la muñeca que la falange de en medio */
    est.push(d(M_TIP[i], 0) > d(M_PIP[i], 0)*1.14);
  }
  const n = est.filter(Boolean).length;
  MANO.dedos = n;
  let g = null;
  if (n <= 1) g = 'piedra';
  else if (n >= 4) g = 'papel';
  else if (n === 2 && est[1] && est[2]) g = 'tijera';
  /* dos dedos que NO son el indice y el medio no son tijera: es una mano a
     medio cerrar, y tomarla por tijera es perder una ronda por una lectura */
  MANO.gestoCrudo = g;
  MANO._votos.push(g);
  if (MANO._votos.length > 3) MANO._votos.shift();
  if (MANO._votos.length === 3 && MANO._votos[0] === MANO._votos[1] &&
      MANO._votos[1] === MANO._votos[2]) MANO.gesto = MANO._votos[0];
}

function manoVer(){
  return { estado: MANO.estado, usa: MANO.usa, espejo: MANO.espejo,
           delegado: MANO.delegado, n: MANO.n, hz: MANO.hz,
           dedos: MANO.dedos, gesto: MANO.gesto, crudo: MANO.gestoCrudo,
           pts: MANO.pts ? MANO.pts.length : 0, huecos: MANO._huecos };
}
/* la sonda: una mano de mentira con los dedos que se pidan, para poder probar
   el camino entero sin una camara */
function manoFalsa(dedos, tijera){
  const p = [];
  for (let i = 0; i < 21; i++) p.push({ x: 0.5, y: 0.5, z: 0 });
  p[0] = { x: 0.5, y: 0.9, z: 0 };      /* muñeca */
  p[9] = { x: 0.5, y: 0.62, z: 0 };     /* nudillo del medio: la palma mide 0,28 */
  p[17] = { x: 0.40, y: 0.68, z: 0 };   /* nudillo del meñique */
  const abierto = [];
  if (tijera){ abierto.push(1, 2); }
  else if (dedos >= 4){ abierto.push(0, 1, 2, 3, 4); }
  else for (let i = 1; i <= dedos; i++) abierto.push(i);
  for (let i = 0; i < 5; i++){
    const ab = abierto.indexOf(i) >= 0;
    const bx = 0.34 + i*0.08;
    if (i === 0){
      /* el pulgar: abierto se va al costado y lejos del meñique */
      p[3] = { x: ab ? 0.72 : 0.50, y: 0.74, z: 0 };
      p[4] = { x: ab ? 0.82 : 0.46, y: 0.70, z: 0 };
    } else {
      p[M_PIP[i]] = { x: bx, y: 0.56, z: 0 };
      p[M_TIP[i]] = { x: bx, y: ab ? 0.30 : 0.66, z: 0 };
    }
  }
  manoLee(p);
  return manoVer();
}
/* Generado por herramientas/casual/hornear*.py — NO editar a mano.

   ── LAS CUATRO COSAS QUE HACEN QUE ESTO NO SEA UN JUEGO DE FÍSICA ──
   Un tiro parabólico entre dos puntos lo resuelve cualquiera en veinte líneas.
   Lo que separa eso de un juego son cuatro decisiones, y ninguna es la física:

   1. LA CÁMARA SIGUE LA FLECHA Y VUELVE. Con la cámara quieta, el tiro es un
      arco que cruza la pantalla y ya; siguiéndola, el tiro DURA, y el segundo y
      medio que tarda en llegar es todo el suspenso que el juego tiene.
   2. EL IMPACTO VA EN CÁMARA LENTA. El cuadro en que la flecha llega es el único
      que importa de todo el turno, y a velocidad normal pasa en 16 ms.
   3. EL VIENTO CAMBIA CADA TURNO Y SE VE. Sin él, el segundo tiro es el primero
      repetido: una vez que encontraste el ángulo, ganaste. Con viento hay que
      volver a calcular, y por eso se DIBUJA —la bandera, las hojas, la flecha
      del indicador— en vez de escribirlo en un número.
   4. Y DÓNDE PEGA IMPORTA. Un tiro a la cabeza vale el triple que uno al pie, o
      sea que apuntar bien no es sólo acertar: es elegir a qué acertar.

   ── EL MUNDO ES MÁS ANCHO QUE LA PANTALLA, Y ESO ES A PROPÓSITO ──
   En un marco vertical de 720, dos arqueros en los bordes están a un dedo de
   distancia y la parábola no tiene dónde crecer. El valle mide 1300 y la cámara
   se aleja para encuadrarlos a los dos y se acerca para seguir la flecha: el
   zoom no es un efecto, es lo que hace que quepan las dos cosas. */

const A_MUNDO = 1300;          /* ancho del valle en unidades de diseño */
const A_G = 1350;              /* gravedad: sale de querer un vuelo de ~1,6 s */
const A_VMAX = 1380;           /* la velocidad con el arco tensado al tope */
const A_TENSA = 260;           /* cuánto hay que arrastrar para el tope */
const A_VIDA = 100;
/* ── EL ALTO DEL ARQUERO, MEDIDO EN PANTALLA Y NO ELEGIDO ──
   Lo usan el dibujo Y el choque, que es lo que garantiza que se le pegue a lo
   que se ve. Estaba en 150 y en un telefono de 412x892 eso da SETENTA pixeles
   de alto en el duelo 1 y CINCUENTA Y SIETE en el 6 —medido con `ver()`: el
   zoom en reposo sale de la separacion, 0,82 y 0,67— o sea menos del ocho por
   ciento de la pantalla para el unico personaje del juego. En 260 pasa a 122 y
   100 pixeles, que es la escala a la que la cara y el arco se leen. */
const A_ALTO = 260;

/* ── LOS DOCE RIVALES ──
   `p` es la puntería: cuánto se desvía del tiro perfecto, en fracción. `v` es
   cuánto varía su error entre tiro y tiro — uno que siempre falla PARA EL MISMO
   LADO es predecible y se le gana leyéndolo, y uno que falla al azar no. Los dos
   números juntos son la personalidad, y por eso ninguno es «más difícil»: son
   difíciles de maneras distintas. */
const A_RIV = [
  { k: 'novato',  cara: 0, p: 0.26, v: 0.9, vida: 100 },
  { k: 'guardia', cara: 1, p: 0.20, v: 0.5, vida: 110 },
  { k: 'cazador', cara: 2, p: 0.15, v: 0.8, vida: 100 },
  { k: 'nomade',  cara: 3, p: 0.17, v: 0.3, vida: 105 },
  { k: 'barbaro', cara: 4, p: 0.22, v: 1.0, vida: 130 },
  { k: 'mago',    cara: 5, p: 0.13, v: 0.6, vida: 95 },
  { k: 'capitan', cara: 1, p: 0.11, v: 0.4, vida: 125 },
  { k: 'sombra',  cara: 2, p: 0.09, v: 0.7, vida: 100 },
  { k: 'reina',   cara: 3, p: 0.10, v: 0.2, vida: 115 },
  { k: 'coloso',  cara: 4, p: 0.15, v: 0.9, vida: 160 },
  { k: 'arquera', cara: 5, p: 0.07, v: 0.4, vida: 110 },
  { k: 'rey',     cara: 0, p: 0.05, v: 0.3, vida: 150 },
];

/* ── LAS ZONAS DEL CUERPO ──
   La altura se mide desde los PIES en fracción del alto, así que el reparto no
   cambia si el personaje cambia de tamaño. Y la cabeza es chica a propósito: si
   midiera un tercio, el triple de daño saldría de casualidad. */
const A_ZONAS = [
  { alto: [0.82, 1.00], k: 'cabeza', dano: 34, col: '#ff5a4a' },
  { alto: [0.48, 0.82], k: 'pecho',  dano: 20, col: '#ffb03c' },
  { alto: [0.00, 0.48], k: 'piernas', dano: 11, col: '#8ad7ff' },
];

let A_duelo = 1, A_puntos = 0, A_rachaG = 0;
let A_yo = { x: 150, y: 0, vida: A_VIDA, max: A_VIDA, cara: 0 };
let A_el = { x: A_MUNDO - 150, y: 0, vida: A_VIDA, max: A_VIDA, cara: 1 };
let A_riv = A_RIV[0];
let A_turno = 0;               /* 0 vos, 1 el rival */
let A_fase = 'apunta';         /* apunta · vuela · impacto · turno · fin */
let A_t = 0;
let A_viento = 0;              /* unidades/s², positivo empuja a la derecha */
let A_flecha = null;
let A_estela = [];
let A_lento = 0;               /* la cámara lenta del impacto */
let A_ultZona = '', A_ultT = 0;
let A_arrastre = null;         /* {x0,y0,x,y} mientras se tensa */
let A_camX = 0, A_camZ = 1, A_camMX = 0, A_camMZ = 1;
let A_sacIA = 0;               /* lo que el rival espera antes de tirar */
let A_props = [];              /* la decoración del valle, sembrada por duelo */
let A_azar = 5;
function aAz(){ A_azar = (A_azar*1664525 + 1013904223) >>> 0; return A_azar / 4294967296; }

/* ── EL TERRENO ──
   Una función del x y no una lista de puntos: así el suelo se puede consultar
   en cualquier sitio —para apoyar un árbol, para saber si la flecha se clavó—
   sin buscar en un array, y las dos plataformas salen de la misma cuenta que
   dibuja la colina. */
function aSuelo(x){
  const u = x/A_MUNDO;
  return 300
       + Math.sin(u*3.1 + 0.7)*70
       + Math.sin(u*7.3 + 2.1)*26
       + Math.sin(u*13.0 + 4.0)*9;
}

const PIEL = { ac:'#ffb03c', tela:'fondo' };

                    clic:'clic', caida:'tira' };

/* ══════════ EL AMBIENTE ══════════ */
const AMB = {
  foto: 'f_arco',
  cielo: ['#2e4a6b', '#c98a5a'],
  haz: 0.10,
  vineta: 0.36,
  part: { n: 14, dir: 'cae', forma: 'hoja', col: '#e8c98a',
          r0: 5, r1: 12, v0: 16, v1: 40, amp: 60, gira: 1.1,
          a0: 0.10, a1: 0.24 }
};

/* ══════════ LA CÁMARA ══════════
   Todo lo del valle se dibuja adentro de una transformación, así que el juego
   piensa en coordenadas de MUNDO y no se entera de que la cámara existe. Es lo
   que permitió que el seguimiento de la flecha se agregara sin tocar una sola
   línea de la física. */
/* ── EL ANCLA DE LA CÁMARA, EN DOS CONSTANTES Y NO EN CUATRO NÚMEROS ──
   `aCam` y `aAMundo` son la misma transformación y su inversa, así que un número
   cambiado en una y no en la otra hace que el dedo apunte a un sitio distinto
   del que se ve — y eso no falla, contesta mal. Ya pasó acá: el ancla se movió
   del 60 % al 78 % y hubo que acordarse de tocar los dos sitios a mano.
   `A_ANCLA_Y` es dónde cae el suelo en la pantalla y `A_OJO` cuánto por encima
   del suelo mira la cámara. Con el suelo en el 82 % quedan unos ciento cuarenta
   píxeles abajo, que es lo que ocupan el pie y el borde del marco: menos deja al
   arquero pegado al canto y más es pasto que no informa nada — medido en la
   captura, con el ancla en el 78 % y el ojo 120 por debajo del suelo sobraban
   doscientos noventa de verde plano. */
const A_ANCLA_Y = 0.82, A_OJO = 30;
function aCam(g){
  g.save();
  /* ── EL SUELO SE ANCLA AL 78 % DEL ALTO Y NO AL 60 % ──
     Medido en la captura: con el 60 %, el tercio de abajo de la pantalla era
     verde plano —trescientos cincuenta píxeles de pasto sin nada que mirar— y
     la parábola, que es donde pasa TODO, quedaba apretada arriba. La acción de
     este juego ocurre en el aire, así que el aire es lo que tiene que ocupar la
     pantalla. */
  g.translate(AN/2, AL*A_ANCLA_Y);
  g.scale(A_camZ, A_camZ);
  g.translate(-A_camX, -(aSuelo(A_camX) - A_OJO));
}
function aCamMeta(){
  if (A_fase === 'vuela' && A_flecha){
    /* siguiendo la flecha se acerca, pero NO se pega: con el zoom al tope la
       flecha llena la pantalla y no se ve hacia dónde va, que es lo único que
       hay para mirar mientras vuela */
    A_camMX = A_flecha.x;
    A_camMZ = 0.86;
  } else {
    /* en reposo encuadra a los dos, y el zoom sale del ANCHO que hay que
       mostrar y no de un número: con dos arqueros que se mueven de duelo en
       duelo, un zoom fijo deja a uno afuera */
    A_camMX = (A_yo.x + A_el.x)/2;
    /* el margen baja de 320 a 170: con 320 los arqueros quedaban en setenta y
       siete píxeles de alto sobre una pantalla de ochocientos noventa, o sea que
       no se distinguía a quién se le estaba tirando */
    const ancho = Math.abs(A_el.x - A_yo.x) + 170;
    A_camMZ = Math.max(0.46, Math.min(1.05, AN/ancho));
  }
}
function aCamPaso(dt){
  aCamMeta();
  /* el seguimiento va con constante de tiempo y no lineal: lineal se ve a
     cámara motorizada, y con resorte se ve a alguien apuntando la cámara */
  const k = Math.min(1, dt*(A_fase === 'vuela' ? 7 : 3.4));
  A_camX += (A_camMX - A_camX)*k;
  A_camZ += (A_camMZ - A_camZ)*k;
}
/* de pantalla a mundo: hace falta para saber dónde tocó el dedo */
function aAMundo(px, py){
  return { x: (px - AN/2)/A_camZ + A_camX,
           y: (py - AL*A_ANCLA_Y)/A_camZ + aSuelo(A_camX) - A_OJO };
}

const JUEGO = {
  id: 'arco',
  tipo: 'puntos',
  vivo: true, gano: false,
  get marca(){ return A_puntos; },
  get sub(){ return TX('r_' + A_riv.k); },
  get ficI(){ return TX('dueloC') + ' ' + A_duelo; },
  get ficD(){ return A_fase === 'apunta' && A_turno === 0 ? TX('tuTurno') : TX('suTurno'); },
  get resta(){ return Math.max(0, Math.min(1, A_yo.vida/A_yo.max)); },

  planos: [
    { dur: 3.0, pie: 'c1', dibuja(g, u){ aDemo(g, u, 0); } },
    { dur: 3.2, pie: 'c2', dibuja(g, u){ aDemo(g, u, 1); } },
    { dur: 3.2, pie: 'c3', dibuja(g, u){ aDemo(g, u, 2); } }
  ],

  arranca(){
    A_duelo = 1; A_puntos = 0; A_rachaG = 0;
    this.vivo = true; this.gano = false;
    this.dueloNuevo();
  },
  dueloNuevo(){
    A_riv = A_RIV[Math.min(A_RIV.length - 1, A_duelo - 1)];
    A_azar = (A_duelo*2654435761) >>> 0;
    for (let i = 0; i < 5; i++) aAz();
    /* la distancia crece con el duelo: el primero se resuelve de un tiro y el
       último obliga a leer el viento. Y crece MENOS que la potencia del arco,
       porque si no el último sería imposible en vez de difícil. */
    const sep = Math.min(A_MUNDO - 220, 620 + A_duelo*46);
    A_yo.x = (A_MUNDO - sep)/2;
    A_el.x = A_yo.x + sep;
    A_yo.y = aSuelo(A_yo.x); A_el.y = aSuelo(A_el.x);
    A_yo.vida = A_yo.max = A_VIDA + Math.min(40, A_rachaG*8);
    A_el.vida = A_el.max = A_riv.vida;
    A_el.cara = A_riv.cara;
    A_turno = 0;
    aSiembraProps();
    this.turnoNuevo();
    A_camX = (A_yo.x + A_el.x)/2; A_camZ = 0.6;
  },
  turnoNuevo(){
    A_fase = 'apunta'; A_t = 0; A_flecha = null; A_estela.length = 0;
    A_arrastre = null;
    /* ── EL VIENTO CAMBIA CADA TURNO Y CRECE CON EL DUELO ──
       Sin que cambie, el segundo tiro es el primero repetido y el duelo se gana
       encontrando el ángulo una sola vez. */
    const t = Math.min(300, 40 + A_duelo*22);
    A_viento = (aAz()*2 - 1)*t;
    A_sacIA = 0.9 + aAz()*0.6;
  },

  paso(dt){
    if (A_ultT > 0) A_ultT = Math.max(0, A_ultT - dt);
    /* ── LA CÁMARA LENTA VA EN EL PASO Y NO EN EL RELOJ DE DIBUJO ──
       Ralentizando el dibujo, la física seguiría a velocidad normal y el
       impacto pasaría igual de rápido: lo que hay que estirar es el TIEMPO del
       mundo. Y la cámara sí se mueve a velocidad real, porque una cámara que se
       ralentiza con la escena no se lee a cámara lenta, se lee a que el juego se
       colgó. */
    const dtm = A_lento > 0 ? dt*0.22 : dt;
    if (A_lento > 0) A_lento = Math.max(0, A_lento - dt);
    aCamPaso(dt);

    if (A_fase === 'vuela'){
      const f = A_flecha;
      f.vx += A_viento*dtm;
      f.vy += A_G*dtm;
      f.x += f.vx*dtm; f.y += f.vy*dtm;
      f.gi = Math.atan2(f.vy, f.vx);
      A_estela.push({ x: f.x, y: f.y, t: 0.5 });
      if (A_estela.length > 90) A_estela.shift();
      for (const e of A_estela) e.t -= dtm;
      /* ── EL BLANCO SE PRUEBA CONTRA EL SEGMENTO Y NO CONTRA EL PUNTO ──
         La flecha llega a 1400 unidades por segundo, o sea 23 por cuadro: contra
         el punto, atraviesa un cuerpo de 40 de ancho una vez de cada dos. Es el
         mismo defecto que en BURBUJAS tuvo el tirador. */
      const z = aPega(f, dtm);
      if (z) return this.impacto(z);
      if (f.y > aSuelo(f.x)) return this.impacto(null);
      if (f.x < -260 || f.x > A_MUNDO + 260 || f.y > 3000) return this.impacto(null);
      return;
    }
    if (A_fase === 'turno'){
      A_t += dt;
      if (A_t > 1.1) this.cambiaTurno();
      return;
    }
    if (A_fase === 'apunta' && A_turno === 1){
      A_t += dt;
      if (A_t > A_sacIA) this.tiraIA();
    }
  },

  /* ── EL TIRO, Y LOS DOS TIRADORES PASAN POR ACÁ ──
     Con dos funciones —una para el jugador y otra para el rival— la física se
     duplica, y el día que cambie la gravedad una de las dos se queda vieja: el
     rival tiraría distinto que uno y nadie se enteraría hasta jugar mucho. */
  tira(quien, ang, fuerza){
    const a = quien === 0 ? A_yo : A_el;
    const s = quien === 0 ? 1 : -1;
    const v = Math.max(0.12, Math.min(1, fuerza))*A_VMAX;
    A_flecha = { x: a.x + s*34, y: a.y - A_ALTO*0.62,
                 vx: Math.cos(ang)*v*s, vy: -Math.sin(ang)*v,
                 gi: 0, de: quien };
    A_estela.length = 0;
    A_fase = 'vuela';
    son('caida', 0.9);
    sacude(0.12);
  },

  tiraIA(){
    /* ── EL RIVAL RESUELVE LA PARÁBOLA Y DESPUÉS SE EQUIVOCA A PROPÓSITO ──
       Un rival que tira al azar no es fácil, es ABURRIDO: no aprende y no se
       puede leer. Éste calcula el tiro perfecto y le mete SU error, así que su
       personalidad es de cuánto falla y no de qué tan tonto es. */
    const t = aTiroPerfecto(A_el, A_yo, -1);
    const e = A_riv.p*(1 + (aAz()*2 - 1)*A_riv.v);
    this.tira(1, t.ang*(1 + e*0.35), t.f*(1 + e));
  },

  impacto(z){
    A_fase = 'impacto'; A_t = 0;
    const f = A_flecha;
    if (z){
      const vic = z.quien === 0 ? A_yo : A_el;
      vic.vida = Math.max(0, vic.vida - z.dano);
      A_ultZona = z.k; A_ultT = 1.4;
      /* ── Y ACÁ ES DONDE ENTRA LA CÁMARA LENTA ──
         Sólo cuando PEGA: ralentizando también los fallos, cada tiro fallado
         costaría un segundo de nada y el juego se haría lento en vez de tenso. */
      A_lento = z.k === 'cabeza' ? 0.85 : 0.5;
      son('bien', 1);
      son('pierde', 0.7);
      sacude(z.k === 'cabeza' ? 0.9 : 0.5);
      destella(z.col, z.k === 'cabeza' ? 1.0 : 0.55);
      chispas(f.x, f.y, z.k === 'cabeza' ? 26 : 14, z.col, 190);
      if (f.de === 0) A_puntos += sumaPuntos(z.dano*3, AN/2, AL*0.36);
    } else {
      A_ultZona = 'fallo'; A_ultT = 1.0;
      son('toque', 0.6);
      chispas(f.x, f.y, 8, '#c9b48a', 90);
    }
    /* la flecha se queda clavada un instante: desapareciendo en el cuadro del
       golpe, el jugador no llega a ver DÓNDE pegó */
    A_flecha.clavada = true;
  },

  cambiaTurno(){
    if (A_el.vida <= 0){
      A_rachaG++;
      A_puntos += sumaPuntos(200 + A_duelo*40 + A_yo.vida*2, AN/2, AL*0.36);
      son('gana', 1); destella('#ffd76a', 1.0);
      A_duelo++;
      if (A_duelo > A_RIV.length){ this.gano = true; this.vivo = false; return; }
      this.dueloNuevo();
      return;
    }
    if (A_yo.vida <= 0){ son('pierde'); this.vivo = false; return; }
    A_turno = 1 - A_turno;
    this.turnoNuevo();
  },

  /* ── EL ARRASTRE: SE TENSA HACIA ATRÁS ──
     Al revés de arrastrar hacia donde uno quiere tirar, que es lo que uno
     escribiría primero. Tensar hacia atrás es lo que hace el cuerpo con un arco
     de verdad, y encima deja la mano FUERA del sitio al que se apunta: con el
     otro esquema, el dedo tapa exactamente lo que hay que mirar. */
  baja(px, py){
    if (MODO !== 'juega') return;
    if (A_fase === 'impacto'){ A_fase = 'turno'; A_t = 0; return; }
    if (A_fase !== 'apunta' || A_turno !== 0) return;
    A_arrastre = { x0: px, y0: py, x: px, y: py };
    son('toque', 0.5);
  },
  mueve(px, py){ if (A_arrastre){ A_arrastre.x = px; A_arrastre.y = py; } },
  sube(){
    if (!A_arrastre || A_fase !== 'apunta' || A_turno !== 0){ A_arrastre = null; return; }
    const t = aTension();
    A_arrastre = null;
    if (t.f < 0.10) return;      /* un toque no es un tiro */
    this.tira(0, t.ang, t.f);
  },

  fondo(g){},
  pinta(g){ aPinta(g); },

  /* ══════════ EL AUTO-JUGADOR ══════════
     El honesto resuelve la parábola CON el viento puesto; el otro tira al azar.
     Si leer el viento no sirviera, los dos llegarían igual de lejos. */
  juegaSolo(n, azar){
    this.arranca();
    let v = 0, dueloMax = 1, tiros = 0, pegue = 0, cabezas = 0;
    const dt = 1/60;
    while (v < (n || 40000) && this.vivo){
      v++;
      if (A_fase === 'impacto'){ A_fase = 'turno'; A_t = 0; continue; }
      if (A_fase === 'apunta' && A_turno === 0){
        tiros++;
        if (azar) this.tira(0, 0.25 + Math.random()*1.1, 0.35 + Math.random()*0.65);
        else {
          const t = aTiroPerfecto(A_yo, A_el, 1);
          /* apunta a la cabeza y no al centro: es lo que hace una persona que
             ya entendió que la cabeza vale el triple */
          this.tira(0, t.ang, t.f);
        }
        const antes = A_el.vida;
        while (A_fase === 'vuela' && v < (n || 40000)){ this.paso(dt); v++; }
        if (A_el.vida < antes) pegue++;
        if (A_ultZona === 'cabeza') cabezas++;
        continue;
      }
      dueloMax = Math.max(dueloMax, A_duelo);
      this.paso(dt);
    }
    return JSON.stringify({ duelo: A_duelo, dueloMax, puntos: A_puntos,
                            tiros, pegue, cabezas,
                            tasa: tiros ? +(pegue/tiros).toFixed(3) : 0,
                            vueltas: v, vivo: this.vivo });
  },

  /* ── LA AUDITORÍA: QUE EL TIRO PERFECTO SEA PERFECTO ──
     Es la única propiedad que este juego necesita y no se puede mirar: si la
     solución de la parábola está mal, el rival falla siempre y el jugador no
     tiene con qué comparar. Se prueba con los doce duelos y con los dos
     sentidos del viento. */
  audita(){
    const gd = A_duelo, gv = A_viento;
    let peor = 0, malos = 0, n = 0, fuera = 0;
    const dt = 1/240;
    for (let d = 1; d <= A_RIV.length; d++){
      A_duelo = d; this.dueloNuevo();
      for (const w of [-1, -0.4, 0, 0.4, 1]){
        A_viento = w*Math.min(300, 40 + d*22);
        const t = aTiroPerfecto(A_yo, A_el, 1);
        if (!t.alcanza){ fuera++; continue; }
        /* se SIMULA el tiro con la misma integración del juego: comprobar la
           fórmula contra sí misma no probaría nada */
        let x = A_yo.x + 34, y = A_yo.y - A_ALTO*0.62;
        let vx = Math.cos(t.ang)*t.f*A_VMAX, vy = -Math.sin(t.ang)*t.f*A_VMAX;
        let dmin = 1e9;
        for (let i = 0; i < 3000; i++){
          vx += A_viento*dt; vy += A_G*dt; x += vx*dt; y += vy*dt;
          dmin = Math.min(dmin, Math.hypot(x - A_el.x, y - (A_el.y - A_ALTO*0.46)));
          if (y > aSuelo(x) && i > 20) break;
        }
        n++;
        peor = Math.max(peor, dmin);
        if (dmin > 46) malos++;
      }
    }
    A_duelo = gd; A_viento = gv; this.dueloNuevo();
    /* `fuera` son los tiros que NO ENTRAN en el tope del arco. Tiene que ser
       CERO: si el mejor tiro posible no llega, el duelo no se puede ganar y eso
       no se ve como dificultad, se ve como un rival invencible. */
    return JSON.stringify({ casos: n, malos, fuera, peorError: +peor.toFixed(1) });
  },

  ver(){
    return JSON.stringify({
      duelo: A_duelo, rival: A_riv.k, fase: A_fase, turno: A_turno,
      yo: [Math.round(A_yo.x), A_yo.vida], el: [Math.round(A_el.x), A_el.vida],
      viento: Math.round(A_viento), zona: A_ultZona, lento: +A_lento.toFixed(2),
      cam: [Math.round(A_camX), +A_camZ.toFixed(2)],
      flecha: A_flecha ? [Math.round(A_flecha.x), Math.round(A_flecha.y)] : null,
      props: A_props.length, puntos: A_puntos, vivo: this.vivo });
  },
  cfg(o){
    if (o.duelo){ A_duelo = o.duelo; this.dueloNuevo(); }
    if (o.viento != null) A_viento = o.viento;
    if (o.tira) this.tira(0, o.tira[0], o.tira[1]);
    return this.ver();
  }
};

/* ── LA TENSIÓN: DE DÓNDE SALEN EL ÁNGULO Y LA FUERZA ──
   El vector va del dedo AL ARQUERO, o sea al revés del arrastre: tirando hacia
   abajo y a la izquierda, la flecha sale hacia arriba y a la derecha. */
function aTension(){
  if (!A_arrastre) return { ang: 0.7, f: 0 };
  const dx = A_arrastre.x0 - A_arrastre.x, dy = A_arrastre.y0 - A_arrastre.y;
  const d = Math.hypot(dx, dy);
  return { ang: Math.atan2(-dy, Math.abs(dx) < 1 ? 1 : Math.abs(dx))*Math.sign(1),
           f: Math.min(1, d/A_TENSA), dx, dy, d };
}

/* ── EL TIRO PERFECTO, Y LA PRIMERA VERSIÓN ESTABA MAL ──
   Empezó como una bisección sobre el ÁNGULO: para cada ángulo se despejaba la
   velocidad que hacía llegar la flecha al blanco en x, y se miraba si a esa
   altura pasaba por arriba o por abajo. Suena bien y la auditoría lo desmintió:
   **24 casos malos de 60, con un error peor de 1034 unidades**. Dos razones, y
   las dos son de la misma familia — el viento ACOPLA las dos ecuaciones:
     · el tiempo y la velocidad se despejaban uno del otro con un punto fijo de
       seis vueltas, que no converge cuando el viento es fuerte, y
     · la función no es monótona en el ángulo, así que la bisección se queda con
       cualquier cosa aunque el punto fijo hubiera convergido.

   ── LO QUE SÍ FUNCIONA: BUSCAR SOBRE EL TIEMPO DE VUELO ──
   Fijado un tiempo `t`, las dos ecuaciones se DESACOPLAN y las dos tienen
   solución cerrada:
       vx = (dx − w·t²/2)/t        vy = (dy − g·t²/2)/t
   O sea que para CADA `t` hay un tiro exacto que pasa por el blanco: no hay
   nada que resolver, sólo que elegir. Y de todos ellos se toma el de velocidad
   mínima, que además es el que más margen deja contra el tope del arco.
   La velocidad como función de `t` tiene un solo mínimo —para `t` chico hace
   falta mucha vx y para `t` grande mucha vy— así que un barrido grueso y un
   refinado alrededor del mejor alcanzan y sobran.

   Y devuelve `alcanza`: si ni el mejor `t` entra en el tope del arco, el tiro
   NO EXISTE. Eso hay que poder decirlo — sin ese dato, un duelo con los
   arqueros demasiado lejos se vería como un rival que falla siempre. */
function aTiroPerfecto(de, a, s){
  const x0 = de.x + s*34, y0 = de.y - A_ALTO*0.62;
  const bx = a.x, by = a.y - A_ALTO*0.46;     /* se apunta al pecho alto, no a los pies */
  const dx = (bx - x0)*s, dy = by - y0, w = A_viento*s;
  const prueba = (t) => {
    const vx = (dx - w*t*t/2)/t, vy = (dy - A_G*t*t/2)/t;
    /* hacia atrás no es un tiro: la flecha sale del arco hacia adelante */
    if (vx <= 0) return null;
    return { t, vx, vy, v: Math.hypot(vx, vy), ang: Math.atan2(-vy, vx) };
  };
  let mej = null;
  for (let k = 0; k <= 70; k++){
    const c = prueba(0.22 + k*(3.6 - 0.22)/70);
    if (c && (!mej || c.v < mej.v)) mej = c;
  }
  if (!mej) return { ang: 0.8, f: 1, alcanza: false };
  /* el refinado: diez vueltas de sección alrededor del mejor grueso */
  let lo = Math.max(0.16, mej.t - 0.06), hi = mej.t + 0.06;
  for (let k = 0; k < 12; k++){
    const m1 = prueba(lo + (hi - lo)/3), m2 = prueba(hi - (hi - lo)/3);
    if (!m1 || !m2) break;
    if (m1.v < m2.v) hi = m2.t; else lo = m1.t;
    if (m1.v < mej.v) mej = m1;
    if (m2.v < mej.v) mej = m2;
  }
  return { ang: mej.ang, f: Math.min(1, mej.v/A_VMAX),
           alcanza: mej.v <= A_VMAX };
}

/* ── EL CHOQUE, POR SEGMENTO Y CONTRA LAS TRES ZONAS ── */
function aPega(f, dt){
  const quien = f.de === 0 ? 1 : 0;
  const a = quien === 0 ? A_yo : A_el;
  /* el alto del blanco es el MISMO que el del dibujo, y por eso está escrito una
     sola vez: con dos números, la flecha pasaría por encima de una cabeza que se
     ve, o pegaría en un aire que se ve vacío */
  const ax = a.x, base = a.y, alto = A_ALTO, ancho = 46;
  /* el segmento que la flecha recorrió en este paso */
  const px = f.x - f.vx*dt, py = f.y - f.vy*dt;
  for (let i = 1; i <= 6; i++){
    const t = i/6, x = px + (f.x - px)*t, y = py + (f.y - py)*t;
    if (Math.abs(x - ax) > ancho/2) continue;
    const h = (base - y)/alto;
    if (h < 0 || h > 1) continue;
    for (const z of A_ZONAS)
      if (h >= z.alto[0] && h < z.alto[1])
        return { quien, k: z.k, dano: z.dano, col: z.col, x, y };
  }
  return null;
}

function aSiembraProps(){
  A_props.length = 0;
  /* nada entre los dos arqueros a menos de 90 de cada uno: un árbol pegado al
     tirador tapa exactamente el sitio desde el que sale la flecha */
  for (let i = 0; i < 22; i++){
    const x = 40 + aAz()*(A_MUNDO - 80);
    if (Math.abs(x - A_yo.x) < 95 || Math.abs(x - A_el.x) < 95) continue;
    A_props.push({ x, y: aSuelo(x), t: (aAz()*4)|0, e: 0.7 + aAz()*0.6,
                   f: aAz()*6.283 });
  }
}

/* ══════════════════════════ DIBUJO ══════════════════════════ */
function aPinta(g){
  aCam(g);

  /* ── EL SUELO: UNA SOLA FIGURA Y NO UNA COLUMNA POR PÍXEL ──
     Muestreando cada 14 unidades salen unas noventa y cinco, y a este zoom eso
     es medio píxel entre muestra y muestra: por debajo de eso se estarían
     calculando senos para nada. */
  const pat = patron('a_pasto');
  g.beginPath();
  g.moveTo(-320, 4000);
  for (let x = -320; x <= A_MUNDO + 320; x += 14) g.lineTo(x, aSuelo(x));
  g.lineTo(A_MUNDO + 320, 4000);
  g.closePath();
  g.fillStyle = '#3f6b3a'; g.fill();
  if (pat){ g.save(); g.clip(); g.globalAlpha = 0.75; g.fillStyle = pat;
            g.fillRect(-320, 0, A_MUNDO + 640, 4000); g.restore(); }
  /* el labio claro del borde: es lo único que separa el pasto del cielo cuando
     los dos están en penumbra, y cuesta un trazo */
  g.beginPath();
  for (let x = -320; x <= A_MUNDO + 320; x += 14){
    if (x === -320) g.moveTo(x, aSuelo(x)); else g.lineTo(x, aSuelo(x));
  }
  g.strokeStyle = '#7fb85a'; g.lineWidth = 7; g.stroke();

  /* la decoración, ordenada por x para que la de adelante tape a la de atrás */
  for (const p of A_props) aProp(g, p);

  /* ── LA TRAZA DEL TIRO ANTERIOR ──
     Se queda puesta y desvanecida: es lo que convierte «fallé» en «fallé por
     poco y para este lado», o sea la única forma de corregir sin adivinar. */
  if (A_estela.length){
    g.beginPath();
    let n = 0;
    for (const e of A_estela){
      if (e.t <= 0) continue;
      if (n++ === 0) g.moveTo(e.x, e.y); else g.lineTo(e.x, e.y);
    }
    g.strokeStyle = 'rgba(255,246,224,.42)'; g.lineWidth = 4/A_camZ*0.5;
    g.lineCap = 'round'; g.stroke();
  }

  aArquero(g, A_yo, 1, A_turno === 0);
  aArquero(g, A_el, -1, A_turno === 1);
  if (A_flecha) aFlecha(g, A_flecha);

  /* ── LA GUÍA DEL TIRO ──
     Muestra los primeros tramos y NO la parábola entera: con la trayectoria
     completa el juego se resuelve solo y apuntar deja de ser una habilidad. Y
     con nada, un jugador nuevo no tiene forma de entender qué hace el arrastre.
     Ocho tramos son medio segundo de vuelo. */
  if (A_arrastre && A_turno === 0){
    const t = aTension();
    let x = A_yo.x + 34, y = A_yo.y - A_ALTO*0.62;
    let vx = Math.cos(t.ang)*t.f*A_VMAX, vy = -Math.sin(t.ang)*t.f*A_VMAX;
    const h = 0.055;
    g.fillStyle = 'rgba(255,246,224,.75)';
    for (let i = 0; i < 8; i++){
      vx += A_viento*h; vy += A_G*h; x += vx*h; y += vy*h;
      g.globalAlpha = 0.85 - i*0.09;
      g.beginPath(); g.arc(x, y, 7 - i*0.5, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }

  g.restore();

  /* ══ LO QUE VA EN PANTALLA Y NO EN EL MUNDO ══ */
  aBarras(g);
  aViento(g);
  if (A_arrastre && A_turno === 0) aTensor(g);
  if (A_ultT > 0 && A_ultZona){
    const al = Math.min(1, A_ultT/0.4);
    const z = A_ZONAS.find(z => z.k === A_ultZona);
    texto(TX(A_ultZona), AN/2, AL*0.30, A_ultZona === 'cabeza' ? 52 : 40,
          'rgba(' + (z ? hexRGB(z.col) : '201,180,138') + ',' + al.toFixed(2) + ')',
          '800', 'center');
  }
  if (A_fase === 'impacto')
    texto(TX('sigue'), AN/2, AL - 96, 22, 'rgba(242,238,230,.55)', '700', 'center');
}
function hexRGB(h){
  const n = parseInt(h.slice(1), 16);
  return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
}

/* ── EL ARQUERO ──
   Sprite generado si llegó, y si no un muñeco por código. El de código NO es un
   respaldo de compromiso: es lo que se ve el primer cuadro de cada partida
   —una imagen en base64 decodifica de forma asincrónica— así que tiene que ser
   presentable, no un rectángulo. */
function aArquero(g, a, s, activo){
  const alto = A_ALTO;
  g.save();
  g.translate(a.x, a.y);
  g.scale(s, 1);
  /* la sombra de contacto: sin ella el arquero flota sobre la colina */
  g.save();
  g.globalAlpha = 0.32;
  g.beginPath(); g.ellipse(0, 0, 34, 9, 0, 0, 7); g.fillStyle = '#000'; g.fill();
  g.restore();
  if (!dibCuadro('a_arqueros', a.cara % 6, 0, 0, alto)){
    const col = ['#4a8f5a', '#8a94a8', '#5a6b4a', '#c9a05a', '#a85a3c', '#6b5a9a'][a.cara % 6];
    /* piernas, tronco, cabeza: tres piezas y el contorno, que es lo que hace
       que una silueta plana se separe del pasto */
    g.strokeStyle = 'rgba(30,20,14,.55)'; g.lineWidth = 3;
    /* las medidas salen de `A_ALTO` y no son números sueltos: cambiando el alto
       del arquero, el muñeco de respaldo tiene que seguirlo o deja de coincidir
       con el blanco contra el que choca la flecha */
    const H = A_ALTO;
    caja2(-14, -H*0.42, 12, H*0.42, 5, '#3a2d22', 'rgba(30,20,14,.55)');
    caja2(3, -H*0.42, 12, H*0.42, 5, '#3a2d22', 'rgba(30,20,14,.55)');
    caja2(-20, -H*0.83, 40, H*0.44, 11, col, 'rgba(30,20,14,.55)');
    disco(2, -H*0.92, H*0.13, '#e8b48a');
    g.beginPath(); g.arc(2, -H*0.92, H*0.13, 0, 7); g.stroke();
  }
  /* el arco: se tensa de verdad cuando le toca, o sea que la cuerda dice cuánta
     fuerza lleva el tiro sin escribir un número */
  const t = (activo && A_arrastre && A_turno === 0) ? aTension().f : 0.12;
  g.save();
  g.translate(28, -A_ALTO*0.62);
  g.strokeStyle = '#8a6134'; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.arc(0, 0, 34, -1.15, 1.15); g.stroke();
  g.strokeStyle = 'rgba(255,246,224,.85)'; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(34*Math.cos(-1.15), 34*Math.sin(-1.15));
  g.lineTo(-t*26, 0);
  g.lineTo(34*Math.cos(1.15), 34*Math.sin(1.15));
  g.stroke();
  g.restore();
  g.restore();
  /* el aro del que tira: sin él, en una pantalla con dos arqueros iguales no
     hay forma de saber de quién es el turno sin leer la ficha del HUD */
  if (activo){
    const la = 0.5 + 0.3*Math.sin(performance.now()*0.005);
    g.save();
    g.globalAlpha = la;
    g.strokeStyle = '#ffd76a'; g.lineWidth = 4;
    g.beginPath(); g.ellipse(a.x, a.y + 2, 44, 13, 0, 0, 7); g.stroke();
    g.restore();
  }
}

function aFlecha(g, f){
  g.save();
  g.translate(f.x, f.y);
  g.rotate(f.gi);
  caja2(-30, -2.5, 46, 5, 2, '#c9a06a', null);
  g.fillStyle = '#e8e2d4';
  g.beginPath(); g.moveTo(24, 0); g.lineTo(10, -7); g.lineTo(10, 7);
  g.closePath(); g.fill();
  g.fillStyle = '#c94a3c';
  g.beginPath(); g.moveTo(-30, 0); g.lineTo(-18, -7); g.lineTo(-14, 0);
  g.lineTo(-18, 7); g.closePath(); g.fill();
  g.restore();
}

function aProp(g, p){
  g.save();
  g.translate(p.x, p.y);
  g.scale(p.e, p.e);
  /* el meneo del viento: el mismo número que empuja la flecha mueve los
     árboles, así que el jugador puede LEER el viento en la escena y no sólo en
     el indicador — que es lo que lo vuelve un dato del mundo y no del HUD */
  const w = A_viento/300;
  if (p.t === 0){
    if (!dibCuadro('a_cosas', 2, 0, 0, 96)){
      caja2(-6, -42, 12, 42, 4, '#5a4028', null);
      g.save(); g.rotate(w*0.10 + Math.sin(performance.now()*0.0011 + p.f)*0.03);
      disco(0, -58, 30, '#3f7a3a'); disco(-16, -46, 20, '#4a8f42');
      disco(17, -48, 18, '#357030');
      g.restore();
    }
  } else if (p.t === 1){
    if (!dibCuadro('a_cosas', 3, 0, 0, 46)){
      g.fillStyle = '#8a8478';
      g.beginPath(); g.ellipse(0, -14, 26, 16, 0, 0, 7); g.fill();
    }
  } else if (p.t === 2){
    if (!dibCuadro('a_cosas', 4, 0, 0, 42))
      caja2(-15, -34, 30, 34, 6, '#7a5230', 'rgba(30,20,14,.5)');
  } else {
    /* matas de pasto alto: se inclinan con el viento y son lo más barato que
       hay para que la colina no sea una franja lisa */
    g.save();
    g.rotate(w*0.34 + Math.sin(performance.now()*0.0017 + p.f)*0.06);
    g.strokeStyle = '#6ba84e'; g.lineWidth = 3; g.lineCap = 'round';
    for (let i = -2; i <= 2; i++){
      g.beginPath(); g.moveTo(i*5, 0);
      g.quadraticCurveTo(i*7, -14, i*9 + 6, -26);
      g.stroke();
    }
    g.restore();
  }
  g.restore();
}

/* ── LAS BARRAS DE VIDA VAN EN PANTALLA Y NO SOBRE LA CABEZA ──
   Sobre la cabeza serían del mundo, o sea que encogerían con el zoom justo
   cuando la cámara se aleja para encuadrar a los dos — y ahí es cuando hay que
   leerlas. Arriba, y con la cara al lado para saber cuál es cuál. */
function aBarras(g){
  /* ── Y VAN A 0,115 Y NO A 0,075 ──
     Ahí arriba está el nombre del rival, que lo escribe el HUD del núcleo: se
     pisaban, y medido en la captura «EL NOVATO» salía partido por las dos
     barras. Un solapamiento con el HUD no lo puede ver `solapes()`, porque esto
     se dibuja en el lienzo y aquello en el DOM. */
  const w = AN*0.36, h = 22, y = AL*0.115;
  for (const [a, x, col, esp] of [[A_yo, 26, '#7fe08a', false],
                                  [A_el, AN - 26 - w, '#ff6a5a', true]]){
    caja2(x, y, w, h, 11, 'rgba(12,10,8,.72)', 'rgba(255,255,255,.18)');
    const u = Math.max(0, a.vida/a.max);
    if (u > 0) caja2(x + 2, y + 2, Math.max(h - 4, (w - 4)*u), h - 4, 9, col, null);
    texto(Math.round(a.vida), x + w/2, y + h/2 + 1, 14, '#12100a', '800', 'center');
    /* ── Y LA CARA VA DEBAJO DE LA BARRA, NO AL COSTADO ──
       Al costado quedaba en `x − 22` = 4 y en `AN − 4`, o sea MITAD AFUERA del
       cuadro por los dos lados: medido en la captura, dos figuras cortadas
       pegadas a los bordes. Debajo entra entera y no tapa el numero. */
    dibCuadro('a_arqueros', a.cara % 6, esp ? AN - 32 : 32, y + h + 46, 44, esp);
  }
}

/* ── EL VIENTO: UNA FLECHA Y UNA BANDERA ──
   El número solo no dice nada —«120» no se compara con nada— y la bandera sola
   no dice cuánto. Las dos juntas sí: la flecha da el sentido y la fuerza de un
   vistazo y la bandera lo confirma en la escena. */
function aViento(g){
  const y = AL*0.055, k = A_viento/300;
  texto(TX('vientoC'), AN/2, y - 16, 13, 'rgba(242,238,230,.45)', '700', 'center');
  g.save();
  g.translate(AN/2, y + 8);
  g.strokeStyle = 'rgba(255,255,255,.20)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-92, 0); g.lineTo(92, 0); g.stroke();
  const L = k*88;
  g.strokeStyle = Math.abs(k) > 0.55 ? '#ff8a5c' : '#8ad7ff';
  g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(L, 0); g.stroke();
  if (Math.abs(L) > 6){
    const s = Math.sign(L);
    g.beginPath();
    g.moveTo(L, 0); g.lineTo(L - s*13, -8); g.moveTo(L, 0); g.lineTo(L - s*13, 8);
    g.stroke();
  }
  g.restore();
}

/* ── EL TENSOR: LO QUE SE VE MIENTRAS SE ARRASTRA ──
   Va en PANTALLA y no en el mundo porque es el dedo: dibujado en el mundo, el
   zoom lo cambiaría de tamaño y el mismo arrastre se vería distinto según lo
   lejos que estén los arqueros. */
function aTensor(g){
  const t = aTension();
  const a = A_arrastre;
  g.save();
  g.strokeStyle = 'rgba(255,246,224,.35)'; g.lineWidth = 3;
  g.setLineDash([10, 8]);
  g.beginPath(); g.moveTo(a.x0, a.y0); g.lineTo(a.x, a.y); g.stroke();
  g.setLineDash([]);
  g.restore();
  /* el aro de fuerza: se llena y cambia de color al llegar al tope, que es lo
     que dice «más no hay» sin escribirlo */
  const r = 46;
  g.save();
  g.translate(a.x, a.y);
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 7;
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.stroke();
  g.strokeStyle = t.f >= 0.995 ? '#ff8a5c' : '#ffd76a';
  g.beginPath(); g.arc(0, 0, r, -Math.PI/2, -Math.PI/2 + t.f*6.283); g.stroke();
  texto(Math.round(t.ang*57.3) + '°', 0, 2, 20, '#f2eee6', '800', 'center');
  g.restore();
}

/* la cinemática usa el juego de verdad, así que lo que se ve en la escena es
   exactamente lo que se ve jugando */
function aDemo(g, u, plano){
  const gd = A_duelo, gf = A_fase, gt = A_turno, ga = A_arrastre;
  const gfl = A_flecha, gv = A_viento, gz = A_ultZona, gzt = A_ultT;
  A_duelo = plano === 2 ? 4 : 1;
  JUEGO.dueloNuevo();
  A_viento = plano === 1 ? 240 : 60;
  A_camX = (A_yo.x + A_el.x)/2;
  /* el mismo encuadre que en partida, y no una copia con otros numeros: con
     320 de margen la cinematica mostraba arqueros mas chicos que el juego */
  A_camZ = Math.max(0.46, Math.min(1.05, AN/(Math.abs(A_el.x - A_yo.x) + 170)));
  if (plano === 0){
    /* se ve el arrastre: es el verbo entero del juego y no se puede contar con
       una frase */
    const d = 40 + u*200;
    A_arrastre = { x0: AN*0.30, y0: AL*0.62,
                   x: AN*0.30 - d*0.86, y: AL*0.62 + d*0.5 };
  } else if (plano === 1){
    A_arrastre = null;
    A_fase = 'vuela';
    const t = aTiroPerfecto(A_yo, A_el, 1);
    A_flecha = { x: A_yo.x + 34, y: A_yo.y - A_ALTO*0.62,
                 vx: Math.cos(t.ang)*t.f*A_VMAX, vy: -Math.sin(t.ang)*t.f*A_VMAX,
                 gi: 0, de: 0 };
    /* se adelanta la simulación hasta el instante `u`: la cinemática es una
       función del tiempo, así que el plano tiene que poder pintarse en
       cualquier momento sin haber corrido los anteriores */
    const dt = 1/120, T = u*1.15;
    A_estela.length = 0;
    for (let s = 0; s < T; s += dt){
      A_flecha.vx += A_viento*dt; A_flecha.vy += A_G*dt;
      A_flecha.x += A_flecha.vx*dt; A_flecha.y += A_flecha.vy*dt;
      A_estela.push({ x: A_flecha.x, y: A_flecha.y, t: 0.5 });
    }
    A_flecha.gi = Math.atan2(A_flecha.vy, A_flecha.vx);
    A_camX = A_flecha.x; A_camZ = 0.86;
  } else {
    A_arrastre = null; A_flecha = null;
    A_el.vida = A_el.max*0.34;
    A_ultZona = 'cabeza'; A_ultT = 1.4;
  }
  /* ── Y LA CINEMATICA DIBUJA SU PROPIO AMBIENTE ──
     En modo `cine` el bucle NO llama a `ambAtras`: la pantalla se limpia y lo
     unico que se pinta es lo que devuelve el plano. Sin esto, los tres planos
     salen sobre NEGRO —medido en la captura, el fondo generado no aparecia por
     ningun lado— y la cinematica se ve de otro juego que la partida. */
  ambAtras();
  aPinta(g);
  ambAdelante();
  A_duelo = gd; A_fase = gf; A_turno = gt; A_arrastre = ga;
  A_flecha = gfl; A_viento = gv; A_ultZona = gz; A_ultT = gzt;
}

/* ── LA TABLA DEL JUEGO SE FUSIONA CON LA DEL NÚCLEO, NO LA REEMPLAZA ──
   Cada juego trae sus propias frases y hereda las siete del núcleo. Si cada
   juego tuviera que repetir «JUGAR» y «MENÚ» en tres idiomas, serían veintiún
   cadenas duplicadas por juego y la primera que se corrija va a quedar
   corregida en uno solo. */
const TXT = {};
for (const l of ['es','en','pt']) TXT[l] = Object.assign({}, TXB[l], (JT[l] || {}));

function TX(k, ...a){
  let s = (TXT[LANG] && TXT[LANG][k]) != null ? TXT[LANG][k]
        : (TXT.es[k] != null ? TXT.es[k] : k);
  /* los patrones con hueco: `{0}` se reemplaza por el argumento. Una frase con
     un número adentro no se puede armar concatenando, porque el número no cae
     en el mismo lugar en los tres idiomas. */
  return String(s).replace(/\{(\d)\}/g, (_, i) => a[i] != null ? a[i] : '');
}

function pintaIdioma(){
  document.documentElement.lang = LANG;
  for (const e of document.querySelectorAll('[data-i18n]'))
    e.textContent = TX(e.dataset.i18n);
  for (const b of document.querySelectorAll('[data-lang]'))
    b.classList.toggle('p', b.dataset.lang === LANG);
  $('salta').textContent = TX('salta');
  if (window.pintaJuego) window.pintaJuego();
}

function ponIdioma(l){ LANG = l; pintaIdioma(); }

/* el idioma del aparato, y sólo si es uno de los tres */
