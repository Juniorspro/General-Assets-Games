<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e8eaf0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  #err{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#8e2b20;color:#fff;
    font:11px/1.5 ui-monospace,monospace;padding:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:20}
  #dist{position:absolute;left:16px;top:14px;font:700 12px/1.7 ui-monospace,monospace;
    letter-spacing:3px;color:#d8dee4;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  #dist b{color:#ffce9e}
  #hint{position:absolute;left:16px;bottom:12px;font:600 10px/1.8 ui-monospace,monospace;
    letter-spacing:2px;color:#8e97a1;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  #say{position:absolute;left:0;right:0;bottom:16%;text-align:center;
    font:700 clamp(12px,2.6vw,18px)/1.7 ui-monospace,monospace;letter-spacing:3px;
    color:#f2f5f8;text-shadow:0 2px 10px rgba(0,0,0,.95);opacity:0;transition:opacity .5s}
  #say.on{opacity:1}

  #menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;text-align:center;padding:28px;
    background:radial-gradient(70% 70% at 50% 42%,rgba(26,24,16,.80),rgba(3,4,6,.97))}
  #menu.hide{display:none}
  #menu .eyebrow{font-size:10px;letter-spacing:10px;color:#c9a15e}
  #menu h1{font-size:clamp(26px,7vw,54px);font-weight:900;letter-spacing:6px;color:#e8dcc4;
    text-shadow:0 3px 0 #2a2418, 0 8px 22px rgba(0,0,0,.8)}
  #menu p{color:#8d8776;max-width:470px;font-size:12px;line-height:1.9}
  #menu .play{margin-top:8px;pointer-events:auto;cursor:pointer;font:900 14px/1 ui-monospace,monospace;
    letter-spacing:5px;padding:17px 44px;border-radius:5px;border:2px solid #c9a15e;color:#fff;
    background:linear-gradient(180deg,#8a6c34,#4b3818);box-shadow:0 7px 0 #2b1f0c}
  #menu .play:active{transform:translateY(3px);box-shadow:0 4px 0 #2b1f0c}

  #ctl{position:fixed;right:14px;top:12px;z-index:60;display:flex;gap:8px;align-items:center}
  .ctlb{pointer-events:auto;cursor:pointer;font:700 10px/1 ui-monospace,monospace;letter-spacing:3px;
    padding:11px 14px;border-radius:4px;border:1px solid rgba(200,170,110,.5);
    color:#f0dcb4;background:rgba(28,22,12,.8)}
  .ctlb.rec{border-color:#e5484d;color:#ff9b9b}
  .ctlb.rec.on{background:#7d1c20;color:#fff}

  #touch{position:fixed;inset:0;z-index:40;display:none}
  #touch.on{display:block}
  #stick{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;
    border:2px solid rgba(220,210,190,.30);background:rgba(10,10,8,.30)}
  #knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;
    background:rgba(230,222,200,.5);border:2px solid rgba(255,255,255,.45)}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;
    border:2px solid rgba(220,205,170,.42);background:rgba(14,12,8,.30);
    color:#f2e8d2;font:800 12px/1 ui-monospace,monospace;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center}
  #bRun{right:24px;bottom:118px;width:104px;height:104px;font-size:12px}
  #bRun:active{background:rgba(200,160,80,.45)}

  #tape{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:24px;background:rgba(0,0,0,.94)}
  #tape.show{display:flex}
  #tape h2{font-size:13px;letter-spacing:5px;color:#e6c88e;font-weight:700}
  #tape video{max-width:min(92vw,620px);max-height:52vh;background:#000;border:1px solid #2a2a24}
  #tape .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #tape a,#tape button{cursor:pointer;text-decoration:none;font:700 11px/1 ui-monospace,monospace;
    letter-spacing:2px;padding:13px 20px;border-radius:4px;border:1px solid rgba(200,190,170,.35);
    color:#efe8d8;background:rgba(24,22,18,.9)}
  #tape .meta{font-size:10px;color:#8a8474;letter-spacing:1px;text-align:center;line-height:1.6}
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';

const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
document.getElementById('mtxt').textContent = IS_TOUCH
  ? 'Hay una casa al fondo del campo. Joystick para caminar, arrastrá para mirar.'
  : 'Hay una casa al fondo del campo. WASD para caminar, ratón para mirar, MAYÚS para correr.';
document.getElementById('hint').textContent = IS_TOUCH ? '' : 'WASD · RATÓN · MAYÚS CORRE';

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(1);                       // la cinta manda: se renderiza bajo y se sube
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(68, 1, 0.05, 1200);
const TL=new THREE.TextureLoader();
function T(key, rx, ry){
  const t=TL.load(CAMPODATA[key]); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=4;
  return t;
}

/* ============================================================================
   CIELO Y NIEBLA
============================================================================ */
{
  const sky=TL.load(CAMPODATA.sky, t=>{
    t.mapping=THREE.EquirectangularReflectionMapping;
    t.colorSpace=THREE.SRGBColorSpace;
    scene.background=t;
  });
  scene.fog=new THREE.Fog(0xb9bfa4, 60, 460);
}

/* ============================================================================
   EL CAMPO — suelo, y pasto alto que se mueve con el viento
============================================================================ */
const FIELD=520, HOUSE_Z=-260;
{
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),
    new THREE.MeshLambertMaterial({ map:T('grass',85,85), color:0xd8dcc0 }));
  g.rotation.x=-Math.PI/2; scene.add(g);
}

/* Una mata de pasto: dos planos en cruz con recorte. El viento va en el
   vértice, no en la CPU: son decenas de miles de matas. */
function bladeTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d'); x.clearRect(0,0,128,128);
  for(let i=0;i<42;i++){
    const bx=10+Math.random()*108, bh=44+Math.random()*76;
    const g=x.createLinearGradient(0,128,0,128-bh);
    const v=Math.random();
    g.addColorStop(0, `rgba(${58+v*26|0},${86+v*34|0},${30+v*20|0},1)`);
    g.addColorStop(1, `rgba(${118+v*50|0},${146+v*54|0},${62+v*30|0},1)`);
    x.strokeStyle=g; x.lineWidth=1.8+Math.random()*2.4; x.lineCap='round';
    x.beginPath(); x.moveTo(bx,128);
    x.quadraticCurveTo(bx+(Math.random()-0.5)*22, 128-bh*0.55, bx+(Math.random()-0.5)*34, 128-bh);
    x.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const grassMat=new THREE.MeshLambertMaterial({ map:bladeTex(), transparent:true, alphaTest:0.36,
  side:THREE.DoubleSide, fog:true });
grassMat.onBeforeCompile=(sh)=>{
  sh.uniforms.uTime={value:0};
  grassMat.userData.sh=sh;
  sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>
     // Sólo se dobla la parte de arriba de la mata, como el pasto de verdad
     float sway = uv.y * uv.y;
     vec4 wp = instanceMatrix * vec4(transformed,1.0);
     float ph = wp.x*0.09 + wp.z*0.07;
     transformed.x += sin(uTime*1.35 + ph)*0.30*sway;
     transformed.z += cos(uTime*1.02 + ph*1.3)*0.22*sway;`
  );
};
{
  const geo=new THREE.PlaneGeometry(1.5,1.5,1,2);
  geo.translate(0,0.75,0);
  const geo2=geo.clone(); geo2.rotateY(Math.PI/2);
  const merged=new THREE.BufferGeometry();
  // cruz de dos planos, fusionada a mano para no arrastrar utilidades
  const pa=geo.attributes.position.array, pb=geo2.attributes.position.array;
  const ua=geo.attributes.uv.array, ub=geo2.attributes.uv.array;
  const na=geo.attributes.normal.array, nb=geo2.attributes.normal.array;
  const ia=geo.index.array, ib=geo2.index.array;
  const pos=new Float32Array(pa.length+pb.length); pos.set(pa); pos.set(pb,pa.length);
  const uv =new Float32Array(ua.length+ub.length); uv.set(ua); uv.set(ub,ua.length);
  const nor=new Float32Array(na.length+nb.length); nor.set(na); nor.set(nb,na.length);
  const idx=new Uint16Array(ia.length+ib.length); idx.set(ia);
  for(let i=0;i<ib.length;i++) idx[ia.length+i]=ib[i]+pa.length/3;
  merged.setAttribute('position', new THREE.BufferAttribute(pos,3));
  merged.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  merged.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  merged.setIndex(new THREE.BufferAttribute(idx,1));

  const N = 34000;
  const im=new THREE.InstancedMesh(merged, grassMat, N);
  im.frustumCulled=false;
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), v=new THREE.Vector3(), s=new THREE.Vector3();
  // El generador congruente simple dejaba las matas alineadas en filas y a
  // 240p eso se ve como rayas. Este mezcla bits y reparte de verdad.
  let sd=1; const rr=()=>{ sd=(sd*1664525+1013904223)>>>0;
    let x=sd; x^=x>>>15; x=Math.imul(x,2246822519); x^=x>>>13; return (x>>>0)/4294967296; };
  for(let i=0;i<N;i++){
    // más denso cerca del camino, más ralo al fondo
    const x=(rr()-0.5)*FIELD*2.2, z=-rr()*FIELD*1.35+30;
    const sc=0.62+rr()*0.95;
    v.set(x,0,z); q.setFromAxisAngle(new THREE.Vector3(0,1,0), rr()*Math.PI);
    s.set(sc,sc*(0.8+rr()*0.7),sc);
    m4.compose(v,q,s); im.setMatrixAt(i,m4);
  }
  scene.add(im);
}

/* ============================================================================
   LA CASA — al fondo del campo, con luz en dos ventanas
============================================================================ */
const sidingMat  = new THREE.MeshLambertMaterial({ map:T('siding',7,3), color:0xcfc9ba });
const shingleMat = new THREE.MeshLambertMaterial({ map:T('shingle',9,3), color:0x8d8880 });
const woodMat    = new THREE.MeshLambertMaterial({ color:0x7a6a52 });
const glassMat   = new THREE.MeshBasicMaterial({ color:0x14181d, fog:true, side:THREE.DoubleSide });
const litMat     = new THREE.MeshBasicMaterial({ color:0xf0c274, fog:true, side:THREE.DoubleSide });
{
  const HW=9, HH=6.4, HD=8;
  const house=new THREE.Group(); house.position.set(0,0,HOUSE_Z); scene.add(house);
  const body=new THREE.Mesh(new THREE.BoxGeometry(HW*2,HH,HD), sidingMat);
  body.position.y=HH/2; house.add(body);
  const RISE=4.6, HALF=HD/2, SLOPE=Math.hypot(HALF,RISE), ANG=Math.atan2(RISE,HALF);
  for(const s of [-1,1]){
    const sl=new THREE.Mesh(new THREE.BoxGeometry(HW*2+1.4,0.34,SLOPE), shingleMat);
    sl.position.set(0, HH+RISE/2, s*HALF/2); sl.rotation.x=-s*ANG; house.add(sl);
  }
  const tri=new THREE.Shape();
  tri.moveTo(-HD/2,0); tri.lineTo(HD/2,0); tri.lineTo(0,RISE); tri.closePath();
  for(const s of [-1,1]){
    const g=new THREE.Mesh(new THREE.ShapeGeometry(tri),
      new THREE.MeshLambertMaterial({ map:T('siding',2,1), side:THREE.DoubleSide }));
    g.position.set(s*HW, HH, 0); g.rotation.y=Math.PI/2; house.add(g);
  }
  const zf=HD/2+0.08;                       // la fachada mira al campo
  for(let row=0;row<2;row++) for(let col=0;col<5;col++){

}

/* ============================================================================
   CINTA — el mismo revelado VHS de Rezona TV
============================================================================ */
let LOW_H=240, lw=1, lh=1;
let rtScene, rtA, rtB, readRT=null, writeRT=null;
const makeRT=(w,h)=>new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:true});
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadScene=new THREE.Scene();
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2)); quadScene.add(quad);
const VERT=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const FRAG=`
precision highp float;
varying vec2 vUv;
uniform sampler2D tScene,tPrev;
uniform vec2 uRes; uniform float uTime,uGlitch,uChroma,uNoise,uGhost,uScan,uFade;
float hash21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
vec3 rgb2yiq(vec3 c){ return vec3(dot(c,vec3(0.299,0.587,0.114)),dot(c,vec3(0.5959,-0.2746,-0.3213)),dot(c,vec3(0.2115,-0.5227,0.3112))); }
vec3 yiq2rgb(vec3 c){ return vec3(dot(c,vec3(1.0,0.956,0.619)),dot(c,vec3(1.0,-0.272,-0.647)),dot(c,vec3(1.0,-1.106,1.703))); }
void main(){
  vec2 suv=vUv;
  if(uGlitch>0.001){
    float band=floor(suv.y*18.0);
    if(hash21(vec2(band,floor(uTime*15.0)))<uGlitch*0.5)
      suv.x+=(hash21(vec2(band,3.0))-0.5)*0.10*uGlitch;
  }
  float bl=uChroma/uRes.x;
  vec3 a=rgb2yiq(texture2D(tScene,suv).rgb);
  vec3 b=rgb2yiq(texture2D(tScene,suv-vec2(bl,0.0)).rgb);
  vec3 c=rgb2yiq(texture2D(tScene,suv-vec2(bl*2.0,0.0)).rgb);
  vec3 col=yiq2rgb(vec3(a.x, (a.yz*0.5+b.yz*0.32+c.yz*0.18)));
  col*=uFade;
  vec3 prev=texture2D(tPrev,vUv+vec2(0.0012,0.0)).rgb;
  col=mix(col,max(col,prev*0.95),uGhost);
  col+=(hash21(vUv*uRes+fract(uTime)*137.0)-0.5)*uNoise;
  col*=1.0-uScan*0.5*(0.5+0.5*sin(vUv.y*uRes.y*3.14159));
  // Banda de conmutación de cabezas, abajo
  if(vUv.y<0.028){
    float k=(0.028-vUv.y)/0.028;
    col=mix(col, vec3(hash21(vec2(vUv.x*230.0, floor(uTime*20.0)))), k*0.75);
  }
  vec2 vc=vUv-0.5;
  col*=mix(0.72,1.0,smoothstep(0.95,0.30,length(vc)*1.35));
  col=col*1.06+vec3(0.012,0.010,0.008);
  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}`;
const COPY=`precision mediump float; varying vec2 vUv; uniform sampler2D tCur;
void main(){ gl_FragColor=vec4(texture2D(tCur,vUv).rgb,1.0); }`;
const vhs=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,depthTest:false,depthWrite:false,
  uniforms:{tScene:{value:null},tPrev:{value:null},uRes:{value:new THREE.Vector2(1,1)},
    uTime:{value:0},uGlitch:{value:0},uChroma:{value:2.6},uNoise:{value:0.055},
    uGhost:{value:0.24},uScan:{value:0.16},uFade:{value:1}}});
const copyMat=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:COPY,depthTest:false,depthWrite:false,
  uniforms:{tCur:{value:null}}});

function resize(){
  const W=innerWidth, H=innerHeight;
  renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix();
  lh=LOW_H; lw=Math.round(LOW_H*W/H);
  [rtScene,rtA,rtB].forEach(rt=>rt&&rt.dispose());
  rtScene=makeRT(lw,lh); rtA=makeRT(lw,lh); rtB=makeRT(lw,lh);
  readRT=null; writeRT=null;
  vhs.uniforms.uRes.value.set(lw,lh);
}
addEventListener('resize',resize); resize();

/* ============================================================================
   AUDIO — viento, pasos y grillos
============================================================================ */
let AC=null, master=null, streamDest=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.6; master.connect(AC.destination);
  streamDest=AC.createMediaStreamDestination(); master.connect(streamDest);
}
function noiseBuf(sec){
  const n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
let windGain=null;
function ambience(){
  if(!AC || windGain) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf(5); s.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
  const f2=AC.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=140;
  windGain=AC.createGain(); windGain.gain.value=0.0;
  s.connect(f).connect(f2).connect(windGain).connect(master); s.start();
  windGain.gain.setTargetAtTime(0.075, AC.currentTime, 2.0);
  // El viento respira
  const lfo=AC.createOscillator(); lfo.frequency.value=0.07;
  const lg=AC.createGain(); lg.gain.value=0.035;
  lfo.connect(lg).connect(windGain.gain); lfo.start();
  const chirp=()=>{
    if(!AC||!windGain) return;
    const t=AC.currentTime;
    const o=AC.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(3200+Math.random()*1400,t);
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t);
    for(let i=0;i<3;i++){
      g.gain.exponentialRampToValueAtTime(0.012, t+0.02+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.07+i*0.09);
    }
    o.connect(g).connect(master); o.start(t); o.stop(t+0.35);
    setTimeout(chirp, 1400+Math.random()*3600);
  };
  chirp();
}
function step(){
  if(!AC) return; const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=noiseBuf(0.16);
  const f=AC.createBiquadFilter(); f.type='bandpass';
  f.frequency.value=900+Math.random()*700; f.Q.value=0.9;
  const g=AC.createGain(); g.gain.setValueAtTime(0.14,t);
  g.gain.exponentialRampToValueAtTime(0.0006,t+0.15);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+0.18);
}

/* ============================================================================
   GRABACIÓN 4:3 · MP4 — el lienzo aparte, la interfaz nunca entra
============================================================================ */
const REC_W=960, REC_H=720;
const recCanvas=document.createElement('canvas'); recCanvas.width=REC_W; recCanvas.height=REC_H;
const recCtx=recCanvas.getContext('2d');
function drawRecFrame(){
  const c=renderer.domElement, cw=c.width, ch=c.height;
  let sw,sh;
  if(cw/ch>4/3){ sh=ch; sw=ch*4/3; } else { sw=cw; sh=cw*3/4; }
  recCtx.drawImage(c,(cw-sw)/2,(ch-sh)/2,sw,sh,0,0,REC_W,REC_H);
}
let recorder=null, chunks=[], recording=false, recT0=0, lastUrl=null;
function pickMime(){
  for(const m of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4',
                  'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function startRec(){
  if(recording || !window.MediaRecorder || !recCanvas.captureStream) return;
  try{
    drawRecFrame();
    const stream=recCanvas.captureStream(30);
    if(streamDest) streamDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    const mime=pickMime();
    recorder=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined);
    chunks=[];
    recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    recorder.onstop=finishRec;
    recorder.start(250);
    recording=true; recT0=performance.now();
    const rt=document.getElementById('recTime'); if(rt) rt.textContent='00:00';
    const b=document.getElementById('btnRec'); if(b){ b.textContent='■ DETENER'; b.classList.add('on'); }
  }catch(e){}
}
function stopRec(){
  if(!recording||!recorder) return;
  recording=false;
  const b=document.getElementById('btnRec'); if(b){ b.textContent='● GRABAR'; b.classList.remove('on'); }
  try{ recorder.stop(); }catch(e){}
}
function finishRec(){
  if(!chunks.length) return;
  const type=(recorder&&recorder.mimeType)||'video/webm';
  const isMp4=type.indexOf('mp4')>=0;
  const blob=new Blob(chunks,{type});
  if(lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl=URL.createObjectURL(blob);
  const name=`rezona_campo_${Date.now()}.${isMp4?'mp4':'webm'}`;
  const v=document.getElementById('tapeVid'), dl=document.getElementById('tapeDl');
  v.src=lastUrl; dl.href=lastUrl; dl.download=name;
  document.getElementById('tapeMeta').innerHTML=
    `${(blob.size/1048576).toFixed(1)} MB · ${REC_W}×${REC_H} (4:3) · ${isMp4?'MP4':'WEBM'}`+
    (isMp4?'':'<br>Tu navegador no ofrece MP4 al grabar; salió WEBM.');
  document.getElementById('tape').classList.add('show');
  const sh=document.getElementById('tapeShare'); sh.style.display='none';
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      sh.style.display='inline-block';
      sh.onclick=()=>navigator.share({files:[file],title:'REZONA · EL CAMPO'}).catch(()=>{});
    }
  }catch(e){}
}
document.getElementById('btnRec').addEventListener('click',()=>{ recording?stopRec():startRec(); });
document.getElementById('tapeClose').addEventListener('click',()=>{
  document.getElementById('tape').classList.remove('show');
});

/* ============================================================================
   JUGADOR
============================================================================ */
const P={ yaw:0, pitch:0, pos:new THREE.Vector3(0,1.66,60), bob:0, speed:0, stepT:0, arrived:false };
const keys={};
let started=false;
addEventListener('keydown',e=>{ keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });

const canvas=renderer.domElement;
if(!IS_TOUCH){
  canvas.addEventListener('click',()=>{
    if(!started) return;
    if(document.pointerLockElement!==canvas){ const p=canvas.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }
  });
  addEventListener('mousemove',e=>{
    if(document.pointerLockElement!==canvas) return;
    P.yaw-=e.movementX*0.0022; P.pitch-=e.movementY*0.0022;
    P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch));
  });
}
const move={x:0,y:0}; let running=false; const look={};
if(IS_TOUCH){
  document.getElementById('touch').classList.add('on');
  const stick=document.getElementById('stick'), knob=document.getElementById('knob');
  let sid=null, sc={x:0,y:0};
  stick.addEventListener('touchstart',e=>{ e.preventDefault();
    const r=stick.getBoundingClientRect(); sc={x:r.left+r.width/2,y:r.top+r.height/2};
    sid=e.changedTouches[0].identifier; }, {passive:false});
  addEventListener('touchstart',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===sid) continue;
      if(t.target.closest('#stick')||t.target.closest('.tbtn')||t.target.closest('.ctlb')) continue;
      look[t.identifier]={x:t.clientX,y:t.clientY};
    }
  }, {passive:true});
  addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===sid){
        let dx=t.clientX-sc.x, dy=t.clientY-sc.y;
        const d=Math.hypot(dx,dy), m=56;
        if(d>m){ dx*=m/d; dy*=m/d; }
        knob.style.transform=`translate(${dx}px,${dy}px)`;
        move.x=dx/m; move.y=dy/m;
      } else if(look[t.identifier]){
        const p=look[t.identifier];
        P.yaw-=(t.clientX-p.x)*0.0040; P.pitch-=(t.clientY-p.y)*0.0040;
        P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch));
        look[t.identifier]={x:t.clientX,y:t.clientY};
      }
    }
  }, {passive:false});
  const endT=e=>{ for(const t of e.changedTouches){
      if(t.identifier===sid){ sid=null; move.x=move.y=0; knob.style.transform=''; }
      delete look[t.identifier];
    } };
  addEventListener('touchend',endT); addEventListener('touchcancel',endT);
  const br=document.getElementById('bRun');
  br.addEventListener('touchstart',e=>{e.preventDefault(); running=true;}, {passive:false});
  br.addEventListener('touchend',  e=>{e.preventDefault(); running=false;}, {passive:false});
}

const sayEl=document.getElementById('say');
let sayT=0;
function say(txt, secs){
  sayEl.textContent=txt; sayEl.classList.add('on'); sayT=secs||4.5;
}
const MARKS=[
  {d:210, t:'La casa no se acerca al mismo ritmo que camino.'},
  {d:150, t:'Alguien dejó las luces encendidas.'},
  {d: 90, t:'El pasto aquí está pisado. Hacia la casa.'},
  {d: 40, t:'No hay puerta trasera. Nunca la hubo.'},
];
let markI=0;

/* ============================================================================
   BUCLE
============================================================================ */
const clock=new THREE.Clock();
const FWD=new THREE.Vector3(), RIGHT=new THREE.Vector3(), UPV=new THREE.Vector3(0,1,0);
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const et=clock.elapsedTime;

  let ix=0, iz=0;
  if(!IS_TOUCH){
    if(keys.KeyW||keys.ArrowUp) iz-=1;
    if(keys.KeyS||keys.ArrowDown) iz+=1;
    if(keys.KeyA||keys.ArrowLeft) ix-=1;
    if(keys.KeyD||keys.ArrowRight) ix+=1;
    running=!!(keys.ShiftLeft||keys.ShiftRight);
  } else { ix=move.x; iz=move.y; }
  const len=Math.hypot(ix,iz); if(len>1){ ix/=len; iz/=len; }
  const spd=(running?5.6:3.1);
  FWD.set(0,0,-1).applyAxisAngle(UPV,P.yaw);
  RIGHT.set(1,0,0).applyAxisAngle(UPV,P.yaw);
  if(started){
    P.pos.addScaledVector(FWD, -iz*spd*dt);
    P.pos.addScaledVector(RIGHT, ix*spd*dt);
  }
  P.pos.x=Math.max(-12.6,Math.min(12.6,P.pos.x));       // la valla encauza
  P.pos.z=Math.max(HOUSE_Z+7.5,Math.min(120,P.pos.z));

  P.speed=Math.min(1,len);
  P.bob+=dt*P.speed*(running?11.5:8.2);
  P.stepT+=dt*P.speed*(running?2.9:2.05);
  if(P.stepT>=1){ P.stepT-=1; step(); }

  camera.position.copy(P.pos);
  camera.position.y+=Math.sin(P.bob*2)*0.035*P.speed;
  camera.position.addScaledVector(RIGHT, Math.sin(P.bob)*0.022*P.speed);
  camera.rotation.set(0,0,0);
  camera.rotateY(P.yaw); camera.rotateX(P.pitch);
  camera.rotateZ(Math.sin(P.bob)*0.010*P.speed);

  const dist=Math.max(0, P.pos.z-HOUSE_Z-7);
  document.getElementById('m').textContent=Math.round(dist);
  if(started && markI<MARKS.length && dist<=MARKS[markI].d){
    say(MARKS[markI].t, 5.2); markI++; vhs.uniforms.uGlitch.value=0.5;
  }
  if(started && !P.arrived && dist<1.5){
    P.arrived=true; say('La puerta está abierta.', 8);
    vhs.uniforms.uGlitch.value=1.0;
  }
  if(sayT>0){ sayT-=dt; if(sayT<=0) sayEl.classList.remove('on'); }

  for(const m of motes){
    m.ph+=dt*0.5;
    m.s.position.y=m.y0+Math.sin(m.ph)*0.35;
    m.s.position.x+=Math.sin(m.ph*0.7)*dt*0.35;
  }
  if(grassMat.userData.sh) grassMat.userData.sh.uniforms.uTime.value=et;

  vhs.uniforms.uGlitch.value=Math.max(0, vhs.uniforms.uGlitch.value-dt*1.6);
  vhs.uniforms.uTime.value=et;

  if(!readRT) readRT=rtA;
  writeRT=(readRT===rtA)?rtB:rtA;
  renderer.setRenderTarget(rtScene);
  renderer.render(scene,camera);
  vhs.uniforms.tScene.value=rtScene.texture;
  vhs.uniforms.tPrev.value=readRT.texture;
  quad.material=vhs;
  renderer.setRenderTarget(writeRT);
  renderer.render(quadScene,quadCam);
  copyMat.uniforms.tCur.value=writeRT.texture;
  quad.material=copyMat;
  renderer.setRenderTarget(null);
  renderer.render(quadScene,quadCam);
  readRT=writeRT;

  if(recording){
    drawRecFrame();
    const s=Math.floor((performance.now()-recT0)/1000);
    const lbl=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    const el=document.getElementById('recTime');
    if(el && el.textContent!==lbl) el.textContent=lbl;
  }
}
animate();

function goFullscreen(){
  const el=document.documentElement;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  try{ const p=rq&&rq.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  try{ const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');
       if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  setTimeout(resize,220); setTimeout(resize,700);
}
document.getElementById('playBtn').addEventListener('click',()=>{
  started=true;
  goFullscreen();
  initAudio(); if(AC&&AC.state==='suspended') AC.resume().catch(()=>{});
  ambience();
  document.getElementById('menu').classList.add('hide');
  if(!IS_TOUCH){ const p=canvas.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }
  say('El campo empieza aquí.', 5);
});
