    ['modelo',  'bulto',       0.90, 0.78, 'susurro',  'no',       'encorvado',1.45],
    ['modelo',  'rincon',      0.65, 0.86, 'grito',    'parpadea', 'encorvado',1.70],
    ['modelo',  'asoma',       0.60, 0.90, 'grito',    'no',       'colgado',  1.80],
    ['modelo',  'cruza',       0.80, 0.72, 'paso',     'no',       'perro',    0.85],
    ['modelo',  'piso',        1.00, 0.68, 'chirrido', 'no',       'perro',    0.80],
    ['modelo',  'encima',      0.75, 0.94, 'grito',    'apaga',    'colgado',  1.60],
    ['modelo',  'cuelga',      1.20, 0.62, 'metal',    'no',       'colgado',  1.55],
    ['modelo',  'costadoI',    0.55, 0.88, 'grito',    'no',       'encorvado',1.75],
    ['modelo',  'costadoD',    0.55, 0.88, 'grito',    'no',       'perro',    0.90],
    ['modelo',  'esquina',     0.62, 0.96, 'grito',    'rojo',     'encorvado',1.80],
    ['modelo',  'puerta',      0.85, 0.80, 'portazo',  'no',       'colgado',  1.90]
  ];
  for (const v of V)
    SUSTOS.push({ id: id++, fam: v[0], donde: v[1], dur: v[2], fuerza: v[3],
                  son: v[4], luz: v[5], modelo: v[6], alto: v[7] });
  return SUSTOS.length;
}

/* ── LA AGENDA: DÓNDE CAE CADA SUSTO ──
   No se sortean al azar mientras se camina. Se reparten ANTES sobre el largo
   del pasillo, con dos reglas que son las que hacen que asuste:

     · NUNCA DOS SEGUIDOS A MENOS DE `SUS_SEP` METROS. Sin eso el azar apila
       tres en cinco metros, el jugador se acostumbra en diez segundos y el
       resto del pasillo es un trámite.
     · Y LOS PRIMEROS `SUS_PAZ` METROS NO TIENEN NINGUNO. Los primeros diez
       segundos el jugador está aprendiendo a no volcar el bol; un susto ahí es
       cobrarle algo que todavía no puede pagar.

   Y la separación se ACHICA con la distancia: al principio uno cada catorce
   metros, al final uno cada cinco. Es la única curva de dificultad que tiene el
   juego y no hace falta otra. */
const SUS_PAZ = 12;
const AGENDA = [];
function armaAgenda(){
  AGENDA.length = 0;
  const pocos = CFG.sustos === 'pocos';
  let d = SUS_PAZ + rr(2, 6);
  const usados = [];
  while (d < LARGO_TOTAL - 6){
    const u = d / LARGO_TOTAL;
    const sep = (14 - u*9) * (pocos ? 1.8 : 1);
    /* no repetir uno hasta que hayan pasado ocho: repetir el mismo susto lo mata */
    let s, intento = 0;
    do { s = SUSTOS[(rnd()*SUSTOS.length)|0]; intento++; }
    while (usados.indexOf(s.id) >= 0 && intento < 30);
    usados.push(s.id); if (usados.length > 8) usados.shift();
    AGENDA.push({ d, s, hecho: false });
    d += sep * rr(0.75, 1.35);
  }
  return AGENDA.length;
}

/* ══════════════ EL SUSTO QUE ESTÁ PASANDO ══════════════
   Lo que un susto hace, en orden: aparece algo, suena, la luz reacciona, y —lo
   único que toca al juego— SACUDE. La sacudida no mueve al jugador ni al bol
   directamente: se suma a la aceleración del bol, o sea que entra por la misma
   puerta que la inclinación de la mano. Un susto y una mano temblorosa son la
   misma cosa para la física, que es exactamente lo que el juego dice. */
const ACT = { s: null, t: 0, obj: null, sac: { x: 0, z: 0 }, fijo: false };
let SUSTOS_AGUANTADOS = 0;

/* ══════════════ LOS SPRITES DE LOS SUSTOS ══════════════
   Un susto se ve 0,4 segundos, a un metro, con una linterna temblando encima y
   el jugador mirando el bol. Un modelo de diez mil triángulos ahí no se
   distingue de un plano con un dibujo — pero SÍ se distingue un dibujo de otro,
   y por eso hay CUATRO caras y TRES siluetas en vez de una de cada una: lo que
   arruina un susto no es que sea plano, es reconocerlo. */
const texCaras = [], texSombras = [];

/* ── LAS SEIS CARAS SON FOTOS, Y ESA ES LA DIFERENCIA ──
   Las de abajo, dibujadas con curvas y degradados, están y funcionan: nunca
   fallan, pesan cero y salen del mismo código que todo lo demás. Pero no dan
   miedo, y el juego entero existe para dar miedo. Un óvalo color crema con dos
   agujeros negros se lee a emoji; lo que asusta de una cara es la piel — el
   poro, la humedad, el diente partido —, y eso no se dibuja con un `arc()`.
   Las seis están generadas (Rezona Lab, WUMdrRxs) y horneadas a WebP con alfa:
   cráneo, pálida gritando, la del pelo, la que sangra, el maniquí rajado y el
   ahogado. Dieciocho kilobytes cada una.
   El dibujo por código queda de RESPALDO y no es ceremonia: si el WebP no
   decodifica, un susto sin imagen es un susto que no existe. */
const CARAS_FOTO = ['cara_craneo', 'cara_palida', 'cara_pelo',
                    'cara_sangre', 'cara_maniqui', 'cara_ahogado'];
const fotoCaras = [];
function caraTex(v){
  const n = CARAS_FOTO[v % CARAS_FOTO.length];
  if (typeof AS === 'undefined' || !AS[n]) return armaCara(v % 4);
  if (!fotoCaras[v]){
    const t = new T.TextureLoader().load(AS[n]);
    /* ClampToEdge y no Repeat: una cara es una imagen sola, y con Repeat el
       más mínimo error de coordenada trae un pedazo del otro borde */
    t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
    t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
    fotoCaras[v] = t;
  }
  return fotoCaras[v];
}

/* la piel: un degradado radial, no un relleno. Una cara de un solo tono se lee
   a papel recortado; con el centro apenas más claro que el borde aparece el
   volumen del cráneo, que es todo lo que hace falta a esta distancia. */
function piel(g, cx, cy, r, claro, oscuro){
  const d = g.createRadialGradient(cx - r*0.22, cy - r*0.30, r*0.06, cx, cy, r*1.12);
  d.addColorStop(0, claro); d.addColorStop(0.62, claro); d.addColorStop(1, oscuro);
  return d;
}
function cuenca(g, cx, cy, rx, ry, gir){
  /* la cuenca no es un óvalo negro: es un óvalo negro con un halo oscuro
     alrededor. Sin el halo el ojo flota; con el halo hay hueso hundido. */
  const h = g.createRadialGradient(cx, cy, rx*0.5, cx, cy, rx*2.1);
  h.addColorStop(0, 'rgba(0,0,0,.95)'); h.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = h; g.beginPath(); g.ellipse(cx, cy, rx*2.1, ry*1.9, gir, 0, 7); g.fill();
  g.fillStyle = '#000'; g.beginPath(); g.ellipse(cx, cy, rx, ry, gir, 0, 7); g.fill();
}
function dientes(g, cx, y, n, w, h, col){
  g.fillStyle = col;
  for (let i = -n; i <= n; i++) g.fillRect(cx + i*w*1.35 - w/2, y, w, h);
}

function armaCara(v){
  if (texCaras[v]) return texCaras[v];
  texCaras[v] = lienzoTex(256, (g, n) => {
    g.clearRect(0, 0, n, n);
    const cx = n/2, cy = n/2;
    if (v === 0){
      /* el cráneo: pómulos marcados y mandíbula angosta */
      g.fillStyle = piel(g, cx, cy - n*0.03, n*0.33, '#d6ccb6', '#6f6858');
      g.beginPath(); g.ellipse(cx, cy - n*0.06, n*0.255, n*0.30, 0, 0, 7); g.fill();
      g.beginPath(); g.moveTo(cx - n*0.20, cy + n*0.05);
      g.quadraticCurveTo(cx, cy + n*0.44, cx + n*0.20, cy + n*0.05); g.fill();
      cuenca(g, cx - n*0.105, cy - n*0.055, n*0.062, n*0.080, 0.10);
      cuenca(g, cx + n*0.105, cy - n*0.055, n*0.062, n*0.080, -0.10);
      g.fillStyle = '#000';
      g.beginPath(); g.ellipse(cx, cy + n*0.045, n*0.028, n*0.042, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(cx, cy + n*0.20, n*0.062, n*0.115, 0, 0, 7); g.fill();
      dientes(g, cx, cy + n*0.115, 2, n*0.020, n*0.034, '#cfc6b4');
    } else if (v === 1){
      /* la cara pálida gritando: sin nariz, la boca se le va hasta el mentón */
      g.fillStyle = piel(g, cx, cy, n*0.34, '#efe7dc', '#8d8377');
      g.beginPath(); g.ellipse(cx, cy - n*0.02, n*0.26, n*0.345, 0, 0, 7); g.fill();
      cuenca(g, cx - n*0.098, cy - n*0.085, n*0.058, n*0.072, 0);
      cuenca(g, cx + n*0.098, cy - n*0.085, n*0.058, n*0.072, 0);
      const b = g.createLinearGradient(0, cy, 0, cy + n*0.34);
      b.addColorStop(0, '#1a0d0d'); b.addColorStop(1, '#000');
      g.fillStyle = b;
      g.beginPath(); g.ellipse(cx, cy + n*0.155, n*0.075, n*0.175, 0, 0, 7); g.fill();
      dientes(g, cx, cy + n*0.008, 2, n*0.023, n*0.038, '#e6ddcd');
      /* las venas: cuatro trazos finos, y son lo que la separa de una máscara */
      g.strokeStyle = 'rgba(70,30,40,.45)'; g.lineWidth = n*0.006;
      for (let i = 0; i < 4; i++){
        g.beginPath(); g.moveTo(cx + (i<2?-1:1)*n*0.14, cy - n*0.20 + i*n*0.03);
        g.quadraticCurveTo(cx + (i<2?-1:1)*n*0.20, cy - n*0.05, cx + (i<2?-1:1)*n*0.11, cy + n*0.10);
        g.stroke();
      }
    } else if (v === 2){
      /* la del pelo: el pelo tapa media cara, y lo que asusta es el ojo que sí
         se ve. Un rostro entero visible da menos miedo que medio rostro. */
      g.fillStyle = piel(g, cx, cy, n*0.32, '#ded2c4', '#7b7164');
      g.beginPath(); g.ellipse(cx, cy, n*0.235, n*0.315, 0, 0, 7); g.fill();
      cuenca(g, cx + n*0.085, cy - n*0.055, n*0.055, n*0.068, 0);
      g.fillStyle = '#000';
      g.beginPath(); g.ellipse(cx + n*0.02, cy + n*0.185, n*0.048, n*0.088, 0, 0, 7); g.fill();
      g.strokeStyle = 'rgba(12,10,12,.96)'; g.lineCap = 'round';
      for (let i = 0; i < 46; i++){
        const x0 = cx - n*0.24 + (i/46)*n*0.30;
        g.lineWidth = n*(0.008 + (i%3)*0.003);
        g.beginPath(); g.moveTo(x0, cy - n*0.36);
        g.quadraticCurveTo(x0 - n*0.05 + (i%5)*n*0.02, cy, x0 + n*0.02, cy + n*0.30);
        g.stroke();
      }
    } else {
      /* el que sangra: la sangre no es roja brillante, es casi negra. El rojo
         saturado sobre una linterna cálida se lee a pintura. */
      g.fillStyle = piel(g, cx, cy, n*0.33, '#cfc0ad', '#6a5f52');
      g.beginPath(); g.ellipse(cx, cy - n*0.01, n*0.25, n*0.33, 0, 0, 7); g.fill();
      cuenca(g, cx - n*0.100, cy - n*0.070, n*0.060, n*0.070, 0.06);
      cuenca(g, cx + n*0.100, cy - n*0.070, n*0.060, n*0.070, -0.06);
      g.fillStyle = 'rgba(46,8,10,.92)';
      for (const sx of [-1, 1]){
        g.beginPath(); g.moveTo(cx + sx*n*0.10, cy - n*0.03);
        g.lineTo(cx + sx*n*0.075, cy + n*0.26);
        g.lineTo(cx + sx*n*0.125, cy + n*0.24); g.fill();
      }
      g.fillStyle = '#0a0406';
      g.beginPath(); g.ellipse(cx, cy + n*0.17, n*0.085, n*0.105, 0, 0, 7); g.fill();
      dientes(g, cx, cy + n*0.085, 3, n*0.018, n*0.030, '#b8ac97');
    }
    grano(g, n, 0, 20);
  });
  texCaras[v].wrapS = texCaras[v].wrapT = T.ClampToEdgeWrapping;
  return texCaras[v];
}

/* ── LA SILUETA, Y POR QUÉ NECESITA UN BORDE ──
   La primera versión era un plano NEGRO PURO, con la idea de que se viera
   porque tapa. En un pasillo negro no tapa nada: medido en la captura, el susto
   se disparaba, sonaba, sacudía y en pantalla no había absolutamente nada —
   indistinguible de un susto que no se dibuja.
   La silueta lleva ahora un CONTORNO apenas más claro que el aire, como si algo
   detrás la recortara. Sobre pared iluminada sigue leyéndose por lo que tapa;
   sobre negro se lee por el borde. Las dos cosas a la vez, y ninguna la
   ilumina, que es lo que arruinaría una sombra. */
function armaSombra(v){
  if (texSombras[v]) return texSombras[v];
  /* el lienzo va 128 × 304, la misma proporción que el plano de 0,78 × 1,85 */
  texSombras[v] = lienzoTexWH(128, 304, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    /* el cuerpo se arma con un CONTORNO cerrado y no con círculos sueltos: una
       persona a contraluz es una silueta continua, y tres óvalos apilados se
       leen a tres óvalos apilados por más juntos que estén. */
    const S = (esc) => {
      g.beginPath();
      if (v === 0){          /* de pie, de frente, los brazos pegados */
        const b = [[0.50,0.045],[0.585,0.075],[0.60,0.135],[0.72,0.185],[0.76,0.36],
                   [0.735,0.56],[0.665,0.56],[0.655,0.35],[0.615,0.50],[0.60,0.70],
                   [0.575,0.985],[0.505,0.985],[0.50,0.72],[0.495,0.985],[0.425,0.985],
                   [0.40,0.70],[0.385,0.50],[0.345,0.35],[0.335,0.56],[0.265,0.56],
                   [0.24,0.36],[0.28,0.185],[0.40,0.135],[0.415,0.075]];
        cami(g, b, w, h, esc);
      } else if (v === 1){   /* larga y flaca, los brazos hasta las rodillas */
        const b = [[0.50,0.030],[0.565,0.058],[0.575,0.115],[0.68,0.155],[0.71,0.44],
                   [0.745,0.66],[0.685,0.675],[0.645,0.45],[0.605,0.46],[0.585,0.72],
                   [0.560,0.99],[0.508,0.99],[0.50,0.70],[0.492,0.99],[0.440,0.99],
                   [0.415,0.72],[0.395,0.46],[0.355,0.45],[0.315,0.675],[0.255,0.66],
                   [0.29,0.44],[0.32,0.155],[0.425,0.115],[0.435,0.058]];
        cami(g, b, w, h, esc);
      } else {               /* agachada, la cabeza entre las rodillas */
        const b = [[0.50,0.38],[0.63,0.40],[0.75,0.50],[0.80,0.68],[0.76,0.86],
                   [0.66,0.99],[0.34,0.99],[0.24,0.86],[0.20,0.68],[0.25,0.50],
                   [0.37,0.40]];
        cami(g, b, w, h, esc);
      }
    };
    /* el halo primero, el cuerpo encima */
    g.fillStyle = 'rgba(126,136,152,.40)'; S(1.055); g.fill();
    g.fillStyle = 'rgba(3,3,5,.985)';      S(1.000); g.fill();
  });
  texSombras[v].wrapS = texSombras[v].wrapT = T.ClampToEdgeWrapping;
  return texSombras[v];
}
/* cierra un contorno con curvas: con líneas rectas la silueta se ve poligonal y
   una persona no tiene aristas */
function cami(g, b, w, h, esc){
  const cx = 0.5;
  const P = b.map(p => [ (cx + (p[0]-cx)*esc)*w, (p[1]-0.5)*esc*h + h*0.5 ]);
  g.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i <= P.length; i++){
    const a = P[i % P.length], n = P[(i+1) % P.length];
    g.quadraticCurveTo(a[0], a[1], (a[0]+n[0])/2, (a[1]+n[1])/2);
  }
  g.closePath();
}

/* la araña no es de metal: `matMetal` la dejaba blanca y brillante bajo la
   linterna —medido en la captura, un bicho plateado sobre la tabla—, y un bicho
   que brilla se lee a juguete. Quitina: casi negra y apenas satinada. */
const matBicho = new T.MeshStandardMaterial({ color: 0x14100e, roughness: 0.52, metalness: 0.10 });
const matBulto = new T.MeshStandardMaterial({ color: 0x2b2723, roughness: 0.88, metalness: 0.0 });
/* los ojos van con `fog:false` y sin luz: son lo único visible con la linterna
   apagada, y con niebla se iban a negro justo en el susto que más los necesita.
   `depthTest:false` para que no queden enterrados en la pared de una esquina,
   que es el mismo defecto que ya costó una vuelta con las caras. */
const matOjo = new T.MeshBasicMaterial({ color: 0xe8d9a8, fog: false, depthTest: false });

/* ══════════ LOS SUSTOS QUE SON UN MODELO 3D ══════════
   Un plano con una foto funciona para una cara a cuarenta centímetros: la
   linterna casi no se mueve en 0,4 s y no hay con qué comparar. Pero un bulto
   que aparece a metro y medio en un pasillo con una luz que tiembla SE DELATA —
   no recibe la luz por un lado, no tiene canto, y al moverse la cabeza no
   cambia de forma. Para eso hacen falta modelos.

   Se cargan en DIFERIDO y con respaldo: un GLB que no decodifica no puede
   dejar un susto sin nada en pantalla, porque un susto invisible es idéntico a
   un susto que no se disparó — el mismo síntoma que ya costó dos vueltas acá.
   Mientras el modelo no está, el bulto se dibuja por código. */
const Z_MODELO = 1.7;
/* la capa en la que viven los sustos que son modelo: se dibuja en una segunda
   pasada con la profundidad borrada. La declara acá el que la usa. */
const CAPA_SUSTO = 3;
const MODELOS = {};                /* clave → Object3D listo para clonar */
const _cargador = { l: null, pedidos: {} };
function pideModelo(clave){
  if (MODELOS[clave] !== undefined) return MODELOS[clave];
  if (typeof AS === 'undefined' || !AS['mod_' + clave]) { MODELOS[clave] = null; return null; }
  if (_cargador.pedidos[clave]) return null;
  _cargador.pedidos[clave] = true;
  if (!_cargador.l) _cargador.l = new GLTFLoader();
  _cargador.l.load(AS['mod_' + clave], (g) => {
    const o = g.scene;
    /* ── SE NORMALIZA LA ALTURA, Y NO ES COSMÉTICO ──
       Los generadores devuelven la malla metida en una caja de lado 2, sin
       relación con metros. Puesta cruda, la misma cosa mide dos metros o veinte
       centímetros según qué tanda salió, y un susto que aparece del tamaño de
       una moneda no es un susto. Se mide la caja y se escala al alto que toca. */
    const caja = new T.Box3().setFromObject(o);
    const alto = Math.max(0.01, caja.max.y - caja.min.y);
    o.scale.setScalar(1 / alto);          /* queda de 1 m; cada susto lo reescala */
    o.position.y = -caja.min.y / alto;    /* apoyado en su propio cero */
    o.traverse(m => {
      if (!m.isMesh) return;
      m.castShadow = false; m.receiveShadow = false;
      /* niebla apagada: el bulto está a metro y medio y la niebla cierra a doce,
         así que no le quita casi nada — pero con la linterna APAGADA, que es
         cuando aparece la mitad de estos sustos, el modelo se iba a negro
         absoluto y desaparecía. */
      if (m.material){ m.material.fog = false; }
    });
    MODELOS[clave] = o;
  }, undefined, () => { MODELOS[clave] = null; });
  return null;
}

/* el respaldo por código: una figura encorvada. No pretende ser el modelo —
   pretende que el susto EXISTA mientras el modelo baja. */
function bultoCodigo(){
  /* ── Y ESTE RESPALDO SALIÓ COMO UNA MANCHA BEIGE TAPANDO LA PANTALLA ──
     Dos causas, y las dos de escala. Primera: la figura se arma con medidas de
     persona —1,59 m de alto— y después el susto la multiplica por `s.alto`,
     que también está en metros. O sea 1,59 × 1,85 = **2,94 metros**. El modelo
     que baja del GLB SÍ se normaliza a un metro antes de escalar; el respaldo
     no, y por eso los dos no eran comparables. Se normaliza acá, adentro, así
     que los dos caminos entregan lo mismo: una cosa de un metro.
     Segunda: puesta a 1,30 m del ojo, una figura de 1,85 m ocupa el cuadro
     entero de arriba abajo (a esa distancia entran ±0,63 m de alto). Eso lo
     arregla `Z_MODELO`, más abajo. */
  const raiz = new T.Group();
  const g = new T.Group(), m = matBulto;
  g.scale.setScalar(1 / 1.585);
  raiz.add(g);
  const torso = new T.Mesh(new T.SphereGeometry(0.30, 10, 8), m);
  torso.scale.set(1, 1.25, 0.78); torso.position.y = 1.02; g.add(torso);
  const cab = new T.Mesh(new T.SphereGeometry(0.145, 10, 8), m);
  cab.position.set(0, 1.44, 0.06); cab.scale.set(1, 1.1, 1.05); g.add(cab);
  for (const lado of [-1, 1]){
    const br = new T.Mesh(new T.CapsuleGeometry(0.052, 0.52, 4, 6), m);
    br.position.set(lado*0.28, 0.86, 0.05); br.rotation.z = lado*0.22; g.add(br);
    const pi = new T.Mesh(new T.CapsuleGeometry(0.070, 0.62, 4, 6), m);
    pi.position.set(lado*0.12, 0.36, 0); g.add(pi);
  }
  return raiz;
}

function armaObjeto(s){
  const g = new T.Group();
  /* ── Y ESTE ES EL ARREGLO QUE MÁS COSTÓ ENCONTRAR: `depthTest: false` ──
     Los sustos van en el marco de la cámara, a un metro y pico. El pasillo
     DOBLA, así que cada vez que hay una vuelta la pared de enfrente queda a
     ochenta centímetros — o sea DELANTE del susto. Medido en la captura: a los
     27 metros la cara estaba en pantalla (0,50 · 0,53), visible, escalada y con
     textura… y enterrada dentro de la pared. Un susto tapado por una pared no
     falla, no avisa, y se ve igual que uno que no se disparó, que es
     exactamente el mismo síntoma de la vez anterior con otra causa.
     Un screamer se dibuja ENCIMA de todo por definición: no es un objeto del
     mundo, es algo que te pasa en la cara. `renderOrder` lo pone después de las
     paredes y `depthTest:false` hace que la profundidad no lo entierre. */
  const cru = (m) => { m.material.depthTest = false; m.material.depthWrite = false;
                       m.renderOrder = 30; return m; };
  /* el reparto es `id * 7` y no `id`: con `id` las siete caras del catálogo
     salen en orden 0,1,2,3,4,5 y la sexta repite la primera justo cuando el
     jugador todavía se acuerda de ella. Multiplicando por un número primo, dos
     sustos consecutivos del catálogo nunca comparten imagen. */
  const v = (s.id * 7) % 6;
  if (s.fam === 'cara'){
    /* el plano va CUADRADO: la foto se horneó centrada en un cuadro cuadrado
       conservando su proporción, así que un plano de 0,52 × 0,68 la estiraría
       un 31 % a lo alto y una cara estirada deja de leerse a cara */
    g.add(cru(new T.Mesh(new T.PlaneGeometry(0.72, 0.72),
      new T.MeshBasicMaterial({ map: caraTex(v), transparent: true }))));
  } else if (s.fam === 'sombra'){
    const m = cru(new T.Mesh(new T.PlaneGeometry(0.78, 1.85),
      new T.MeshBasicMaterial({ map: armaSombra(s.id % 3), transparent: true,
                                opacity: 0.97 })));
    /* ── LA SILUETA SE PARA MÁS LEJOS QUE LA CARA, Y NO ES UN GUSTO ──
       Mide 1,85 m de alto porque es una persona. Puesta al metro y pico donde va
       una cara, tapa la pantalla ENTERA — el bol incluido —, y tapar el bol
       durante un segundo no es un susto, es quitarle al jugador lo único con lo
       que puede corregir. Setenta y cinco centímetros más atrás entra completa
       con pasillo a los costados: se lee que hay ALGUIEN parado ahí, que es lo
       que tiene que leerse. */
    m.position.z = -0.75;
    g.add(m);
  } else if (s.fam === 'modelo'){
    const mod = pideModelo(s.modelo);
    const o = mod ? mod.clone(true) : bultoCodigo();
    o.scale.multiplyScalar(s.alto || 1.8);
    /* ── UN MODELO SE PARA MÁS LEJOS QUE UNA CARA, Y LA CUENTA ES LA DEL MARCO ──
       Los sitios del catálogo están a 1,05-1,55 m porque están pensados para
       una cara de 70 cm. Una PERSONA de 1,85 m puesta ahí ocupa el cuadro
       entero: a 1,30 m entran ±0,63 m de alto y la figura mide casi tres veces
       eso. Medido en la captura, el bulto salía como una pared beige y no se
       veía ni el pasillo ni de qué tamaño era la cosa.
       Se empuja 1,7 m más atrás: a 3 m entran ±1,46 m de alto, así que una
       persona entra completa con pasillo alrededor — y ahí sí se lee que hay
       ALGUIEN PARADO, que es lo que tiene que leerse. */
    o.position.z = -Z_MODELO;
    o.traverse(m => m.layers.set(CAPA_SUSTO));
    /* el cero del modelo va al piso del pasillo, que respecto del ojo está 1,58
       m abajo. Sin esto la cosa aparece flotando a la altura de la cara, y algo
       que flota se lee a truco y no a alguien parado ahí. */
    o.position.y = -1.58;
    g.add(o);
    /* dos ojos que emiten luz propia: es lo único del modelo que se ve con la
       linterna apagada, y la mitad de estos sustos pasan con la luz apagada */
    for (const lado of [-1, 1]){
      const e = new T.Mesh(new T.SphereGeometry(0.021, 6, 5), matOjo);
      e.position.set(lado*0.055, (s.alto || 1.8) * 0.815 - 1.58, 0.10 - Z_MODELO);
      e.renderOrder = 31;
      e.layers.set(CAPA_SUSTO);
      g.add(e);
    }
  } else if (s.fam === 'bicho'){
    /* la araña: cuerpo en dos partes y patas QUEBRADAS. Una pata recta se lee a
       palito clavado; el codo es lo que la hace caminar aunque esté quieta. */
    const cab = new T.Mesh(new T.SphereGeometry(0.019, 8, 6), matBicho);
    cab.position.z = -0.030; cab.scale.set(1, 0.85, 1.1); g.add(cab);
    const abd = new T.Mesh(new T.SphereGeometry(0.032, 9, 7), matBicho);
    abd.position.z = 0.022; abd.scale.set(1, 0.82, 1.25); g.add(abd);
    for (let i = 0; i < 8; i++){
      const lado = i < 4 ? -1 : 1, k = (i % 4);
      const a = 0.55 + k*0.42;
      const muslo = new T.Mesh(new T.BoxGeometry(0.0055, 0.0055, 0.048), matBicho);
      muslo.position.set(lado*0.022, 0.010, -0.014 + k*0.016);
      muslo.rotation.set(-0.85, lado*a, 0); g.add(muslo);
      const pata = new T.Mesh(new T.BoxGeometry(0.0045, 0.0045, 0.054), matBicho);
      pata.position.set(lado*(0.041 + k*0.002), -0.008, -0.016 + k*0.018);
      pata.rotation.set(0.95, lado*a, 0); g.add(pata);
    }
    g.traverse(o => { if (o.isMesh) o.castShadow = false; });
  }
  return g;
}

/* ── DÓNDE SE PONE CADA SUSTO, Y LAS POSICIONES SALEN DEL ENCUADRE ──
   En el marco de la CÁMARA, así el susto está siempre donde el jugador mira y
   no depende de hacia dónde dobló el pasillo.

   ESTAS POSICIONES SE REESCRIBIERON DOS VECES Y LAS DOS POR LO MISMO: estaban
   puestas a ojo para un encuadre que después cambió.
     · Primera vez: escritas pensando en una pantalla ancha y el juego era
       VERTICAL. Con 66° verticales y 412×892 el campo horizontal da 33°, o sea
       ±0,30 m de ancho por metro: el susto de esquina caía en x = 1,155 de
       pantalla, FUERA DEL CUADRO. Y no fallaba nada — sonaba, sacudía y no se
       veía, que es indistinguible de un susto que no se disparó.
     · Segunda vez: el juego pasó a ser HORIZONTAL, y con eso el ancho se
       triplica y el alto se achica. Las posiciones vertiacles quedaban todas
       apiladas en la franja del medio.

   Así que ahora salen de la cuenta y no del ojo. Con 52° verticales, y tomando
   el aspecto más angosto que puede tocar —16:9, porque un teléfono más ancho
   sólo agrega margen—:
       ancho máximo a distancia d = 0,867 · d
       alto  máximo a distancia d = 0,488 · d
   y cada susto se queda por debajo del 80 % de ese máximo: pegado al borde, que
   es donde más asusta, pero adentro en cualquier teléfono. `sustosEnCuadro()`
   lo comprueba solo y es lo único que impide que esto vuelva a pasar. */
const DONDE = {
  frente:   [0, -0.02, -1.30], costadoI: [-0.62, -0.02, -1.05], costadoD: [0.62, -0.02, -1.05],
  abajo:    [0, -0.38, -1.05], techo:    [0, 0.40, -1.05],       esquina:  [0.70, -0.02, -1.20],
  atras:    [0, -0.02, 0.85],  cruza:    [-0.80, -0.22, -1.55],  puerta:   [0.72, -0.12, -1.35],
  pared:    [-0.72, -0.08, -1.30], caida: [0.55, -0.44, -1.25],  vidrio:   [-0.58, 0.30, -1.15],
  piso:     [0.28, -0.40, -1.05], tabla: [0.10, -0.22, -0.62],   enjambre: [0, -0.20, -1.45],
  bulto:    [-0.34, -0.14, -1.60], rincon: [0.86, -0.10, -1.50], asoma:    [-0.90, -0.06, -1.45],
  encima:   [0, 0.34, -1.20],  cuelga:   [0.30, 0.30, -1.35],
  oidoI:    [-0.5, 0, 0.2],     oidoD:   [0.5, 0, 0.2],          nombre:   [0, 0, -0.6],
  risa:     [0, 0, -0.9],       respira: [0, -0.1, 0.3],
  apagon:   [0, 0, -1], parpadeo: [0, 0, -1], fogonazo: [0, 0, -1], rojo: [0, 0, -1]
};

function disparaSusto(s){
  if (ACT.s) return;
  ACT.s = s; ACT.t = 0; ACT.fijo = false;
  const p = DONDE[s.donde] || DONDE.frente;
  if (['cara','sombra','bicho','modelo'].indexOf(s.fam) >= 0){
    const o = armaObjeto(s);
    o.position.set(p[0], p[1], p[2]);
    /* ── NADA DE `lookAt` EN UN HIJO DE LA CÁMARA ──
       `Object3D.lookAt` mira en coordenadas de MUNDO, así que `lookAt(0,y,0)`
       apunta al origen del pasillo y no a la cámara: medido, con la cámara a
       veintitrés metros del origen las caras salían de canto o de espaldas y NO
       SE VEÍA NINGUNA. Un plano hijo de la cámara ya mira al lente con su normal
       +Z; lo único que hace falta es girarlo hacia el origen LOCAL. */
    o.rotation.y = Math.atan2(-p[0], -p[2]);
    cam.add(o); ACT.obj = o;
  }
  /* ── CADA SUSTO LLEVA SU PROPIO GRITO, Y ES POR NÚMERO ──
     `s.id` elige la variante, así que el susto 17 suena SIEMPRE igual y nunca
     igual al 18. Con un grito al azar, dos sustos seguidos pueden salir con la
     misma voz y ahí se rompe la ilusión de que hay más de una cosa. */
  son(s.son, s.fuerza, s.id);
  /* ── LA SACUDIDA: UN IMPULSO CON DIRECCIÓN, NO UN TEMBLOR AL AZAR ──
     Va hacia donde apareció el susto, porque un respingo real es alejarse de la
     cosa. Y es un IMPULSO —entra una vez— y no una fuerza sostenida: si durara,
     el jugador no podría corregir y el susto sería una muerte y no un susto. */
  const dx = p[0], dz = p[2] + 0.6;
  const n = Math.hypot(dx, dz) || 1;
  /* ── Y LA FUERZA SALE DE CUÁNTO TIENE QUE CORRER EL BOL, NO DE LA INTUICIÓN ──
     Primer intento: 5,6. Medido, UN SOLO susto de fuerza 1 mandaba el bol de
     0,00 a 1,002 del borde — o sea que el primer susto del pasillo era la
     muerte, que es justo lo que este juego no puede ser. La cuenta: el impulso
     entra durante 0,10 s, así que Δv = F·0,10; y con el roce en 1,9 el bol
     recorre Δv/1,9 antes de frenarse. Para que un susto de fuerza 1 gaste un
     tercio de la tabla (0,10 m de 0,30):
         Δv = 0,10 · 1,9 = 0,19        F = 0,19 / 0,10 = 1,9
     Con eso hacen falta TRES sustos sin corregir para volcarlo, y uno solo se
     puede salvar. Un susto tiene que costar, no matar. */
  const F = s.fuerza * 1.9;
  ACT.sac.x = (dx/n) * F; ACT.sac.z = (dz/n) * F;
  /* la luz */
  if (s.luz === 'apaga') LUZ.apagar(s.dur * 0.8);
  else if (s.luz === 'parpadea') LUZ.parpadear(s.dur);
  else if (s.luz === 'fogonazo') fogonazo(0.9);
  else if (s.luz === 'rojo') LUZ.rojo(s.dur);
  if (s.fam === 'golpe') fogonazo(0.16 * s.fuerza);
}

function pasoSusto(dt){
  if (!ACT.s) return null;
  /* ── CONGELAR UN SUSTO NO ES UNA COMODIDAD, ES LA ÚNICA FORMA DE MIRARLO ──
     Una cara dura 0,42 s. Entre que la prueba la dispara y el navegador entrega
     la captura pasan varios cientos de milisegundos, así que la foto llegaba
     SIEMPRE después de que el susto terminara: se veía el pasillo vacío y eso
     es indistinguible de un susto que no se dibuja. Con `fijo` el susto se
     queda en su tamaño final hasta que se lo saque a mano. */
  if (ACT.fijo){
    if (ACT.obj){ ACT.obj.scale.setScalar(1.15); ACT.obj.visible = true; }
    return { x: 0, z: 0 };
  }
  ACT.t += dt;
  const s = ACT.s, u = ACT.t / s.dur;
  if (ACT.obj){
    /* se acerca de golpe y se va: la aceleración de entrada es lo que asusta,
       no el objeto */
    const k = u < 0.18 ? (u/0.18) : 1;
    ACT.obj.scale.setScalar(0.4 + k*0.75);
    ACT.obj.visible = u < 0.92;
  }
  const sac = { x: 0, z: 0 };
  if (ACT.t < 0.10){ sac.x = ACT.sac.x; sac.z = ACT.sac.z; }
  if (u >= 1){
    if (ACT.obj){ cam.remove(ACT.obj); ACT.obj = null; }
    ACT.s = null;
    if (!BOL.cayo && BOL.agua > 0.02) SUSTOS_AGUANTADOS++;
  }
  return sac;
}

/* ── LA LINTERNA, QUE TAMBIÉN ES UN PERSONAJE ── */
const LUZ = {
  base: 26, t: 0, modo: 'ok', hasta: 0,
  apagar(d){ this.modo = 'apagada'; this.hasta = this.t + d; },
  parpadear(d){ this.modo = 'parpadea'; this.hasta = this.t + d; },
  rojo(d){ this.modo = 'rojo'; this.hasta = this.t + d; },
  paso(dt){
    this.t += dt;
    if (this.modo !== 'ok' && this.t > this.hasta) this.modo = 'ok';
    if (this.modo === 'apagada'){ luz.intensity = 0.6; luz.color.setHex(0xffe9cf); }
    else if (this.modo === 'parpadea'){
      luz.intensity = (Math.sin(this.t*47) > 0.1 ? this.base : 1.2);
      luz.color.setHex(0xffe9cf);
    } else if (this.modo === 'rojo'){
      luz.intensity = this.base*0.6; luz.color.setHex(0xff5540);
    } else {
      /* aun «bien» la linterna respira: una luz perfectamente fija se lee a
         lámpara de estudio y no a linterna en la mano de alguien asustado */
      luz.intensity = this.base * (0.94 + Math.sin(this.t*2.3)*0.03 + Math.sin(this.t*7.1)*0.02);
      luz.color.setHex(0xffe9cf);
    }
  }
};
let _flashT = 0;
function fogonazo(v){ _flashT = Math.max(_flashT, v); }
function pasoFogonazo(dt){
  if (_flashT <= 0) return;
  _flashT = Math.max(0, _flashT - dt*4.5);
  $('flash').style.opacity = _flashT.toFixed(3);
}

/* ══════════════════════════ EL SONIDO ══════════════════════════
   Procedural, ni un archivo. En un juego de sustos el sonido hace más que la
   imagen —la mitad de los treinta y dos sustos no dibujan NADA— así que tiene
   que existir antes que cualquier asset generado.

   Y LA MEZCLA ESTÁ ESCALONADA A PROPÓSITO: la cama de fondo tiene que quedar
   MUY por debajo de un golpe, porque si compiten, el golpe deja de ser un
   acontecimiento y pasa a ser un matiz. Es la misma regla que en Eco. */
let AUD = null, MAESTRO = null, ANAL = null, RUIDO = null;
function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAESTRO = AUD.createGain(); MAESTRO.gain.value = 0.9; MAESTRO.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAESTRO.connect(ANAL);
  /* un segundo de ruido blanco, generado una vez y reusado por todo: cada golpe
     es el mismo ruido con otro filtro y otro sobre */
  const n = AUD.sampleRate;
  RUIDO = AUD.createBuffer(1, n, n);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  armaGritos();
  camaFondo();
}
function env(g, t0, a, dur, pico){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function ruido(t0, dur, f, q, pico, tipo){
  const s = AUD.createBufferSource(); s.buffer = RUIDO; s.loop = true;
  const b = AUD.createBiquadFilter(); b.type = tipo || 'bandpass';
  b.frequency.value = f; b.Q.value = q;
  const g = AUD.createGain();
  s.connect(b); b.connect(g); g.connect(MAESTRO);
  env(g, t0, Math.min(0.012, dur*0.2), dur, pico);
  s.start(t0); s.stop(t0 + dur + 0.05);
  return b;
}
function tono(t0, f0, f1, dur, pico, tipo){
  const o = AUD.createOscillator(); o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = AUD.createGain(); o.connect(g); g.connect(MAESTRO);
  env(g, t0, dur*0.12, dur, pico);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
/* ══════════════════════ TREINTA Y DOS GRITOS ══════════════════════
   El pedido fue «más de 30 gritos», y treinta y dos archivos de grito serían un
   mega y medio de descarga para sonidos de medio segundo. Un grito, en cambio,
   se puede DESCRIBIR: es una fuente con un contorno de altura, tres formantes
   que la filtran, un soplo de aire y un sobre. Cambiando esos números salen un
   hombre, una mujer, un chico, algo que no es humano, un chillido y un gorgoteo
   — y cada uno se puede pedir por número, que es lo que hace que el susto 17
   suene siempre igual y distinto del 18.

   LOS SEIS TIMBRES NO SON DECORACIÓN. Un grito repetido deja de asustar a la
   tercera vez, y treinta y dos sustos con el MISMO grito son un grito repetido
   treinta y dos veces. Lo que el jugador recuerda de un susto es el sonido.

   Y hay tres cosas que un grito necesita y que no son el tono:
     · JITTER. Una altura perfectamente lisa suena a sirena. La voz humana
       tiembla de forma irregular, y sin eso ningún filtro lo salva.
     · VIBRATO. El temblor periódico, que es lo que dice «hay unas cuerdas
       vocales acá» — y su ausencia lo que hace que el timbre 'bestia' no suene
       a persona.
     · CONTORNO QUE BAJA. Un grito que sube suena a alguien llamando; uno que
       baja suena a alguien al que le está pasando algo. */
const GRI_TIMBRE = [
  /* nombre,    f0,   caída, formantes,             vib Hz, vib prof, soplo, dur */
  ['hombre',    240, 0.42, [780, 1180, 2600],      5.4, 0.035, 0.16, 0.62],
  ['mujer',     460, 0.46, [980, 1900, 3100],      6.2, 0.045, 0.14, 0.58],
  ['chica',     700, 0.52, [1250, 2400, 3600],     7.4, 0.055, 0.12, 0.48],
  ['bestia',    118, 0.34, [420, 760, 1500],       3.1, 0.020, 0.30, 0.90],
  ['chillido', 1150, 0.62, [1900, 3400, 5200],     9.0, 0.070, 0.09, 0.34],
  ['gorgoteo',  165, 0.30, [520, 900, 1400],       2.4, 0.090, 0.34, 0.74]
];
/* las 32 variantes: el timbre se recorre y cada vuelta corre la altura y el
   largo un poco, así que dos gritos del mismo timbre tampoco son el mismo */
const GRITOS = [];
function armaGritos(){
  GRITOS.length = 0;
  for (let i = 0; i < 32; i++){
    const T0 = GRI_TIMBRE[i % GRI_TIMBRE.length];
    const v = Math.floor(i / GRI_TIMBRE.length);          /* 0..5, la vuelta */
    const kf = 1 + (v - 2.5) * 0.085;                     /* altura ±21 % */
    const kd = 1 + ((i * 7) % 5 - 2) * 0.09;              /* largo ±18 % */
    GRITOS.push({
      id: i, timbre: T0[0],
      f0: T0[1] * kf, caida: T0[2], form: T0[3].map(f => f * (1 + (kf-1)*0.6)),
      vibHz: T0[4] * (1 + ((i*3) % 4 - 1.5) * 0.10), vib: T0[5],
      soplo: T0[6], dur: T0[7] * kd,
      /* uno de cada cuatro se QUIEBRA: el grito se corta y vuelve. Es lo que
         hace un grito de verdad cuando se queda sin aire, y en un catálogo
         largo es la variante que más se nota. */
      quiebra: (i % 4) === 3
    });
  }
  return GRITOS.length;
}

/* una voz: fuente + tres formantes + soplo. Es la única función del archivo que
   arma una cadena de más de dos nodos, y es porque un grito no se puede hacer
   con menos. */
function grito(idx, k, t0){
  if (!AUD) return null;
  const G = GRITOS[((idx % GRITOS.length) + GRITOS.length) % GRITOS.length];
  const t = t0 == null ? AUD.currentTime : t0;
  const dur = G.dur;
  /* la fuente: diente de sierra, que trae los armónicos que los formantes
     necesitan para tallar una vocal. Con una senoidal no hay nada que filtrar. */
  const o = AUD.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(G.f0, t);
  /* el contorno: baja hasta `caida` del valor inicial, y si se quiebra pega un
     salto para arriba a mitad de camino antes de seguir bajando */
  if (G.quiebra){
    o.frequency.exponentialRampToValueAtTime(G.f0 * 0.62, t + dur*0.38);
    o.frequency.setValueAtTime(G.f0 * 1.06, t + dur*0.44);
    o.frequency.exponentialRampToValueAtTime(G.f0 * G.caida, t + dur);
  } else {
    o.frequency.exponentialRampToValueAtTime(G.f0 * G.caida, t + dur);
  }
  /* vibrato: un oscilador lento sobre la altura, en Hz absolutos */
  const lfo = AUD.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = G.vibHz;
  const lg = AUD.createGain(); lg.gain.value = G.f0 * G.vib;
  lfo.connect(lg); lg.connect(o.frequency);
  /* jitter: la irregularidad, que no es periódica y por eso va con ruido y no
     con otro oscilador */
  const jit = AUD.createBufferSource(); jit.buffer = RUIDO; jit.loop = true;
  const jf = AUD.createBiquadFilter(); jf.type = 'lowpass'; jf.frequency.value = 22;
  const jg = AUD.createGain(); jg.gain.value = G.f0 * 0.05;
  jit.connect(jf); jf.connect(jg); jg.connect(o.frequency);

  const salida = AUD.createGain();
  /* los tres formantes en PARALELO y no en cascada: en cascada cada uno se come
     lo que el anterior dejó pasar y a la tercera etapa no llega energía */
  const pesos = [1.0, 0.55, 0.28];
  G.form.forEach((f, i) => {
    const b = AUD.createBiquadFilter(); b.type = 'bandpass';
    b.frequency.setValueAtTime(f, t);
    b.frequency.exponentialRampToValueAtTime(f * (0.55 + G.caida*0.4), t + dur);
    b.Q.value = 5.5 - i*1.2;
    const g = AUD.createGain(); g.gain.value = pesos[i];
    o.connect(b); b.connect(g); g.connect(salida);
  });
  /* el soplo: el aire. Sin esto el grito suena a sintetizador, con esto suena a
     alguien que está usando los pulmones. */
  const nb = AUD.createBufferSource(); nb.buffer = RUIDO; nb.loop = true;
  const nf = AUD.createBiquadFilter(); nf.type = 'bandpass';
  nf.frequency.value = G.form[1]; nf.Q.value = 0.7;
  const ng = AUD.createGain(); ng.gain.value = G.soplo;
  nb.connect(nf); nf.connect(ng); ng.connect(salida);

  const fin = AUD.createGain();
  salida.connect(fin); fin.connect(MAESTRO);
  /* ataque de 18 ms: un grito EMPIEZA de golpe. Con 100 ms se lee a lamento. */
  const pico = 0.34 * (k == null ? 1 : k);
  fin.gain.setValueAtTime(0.0001, t);
  fin.gain.exponentialRampToValueAtTime(pico, t + 0.018);
  fin.gain.setValueAtTime(pico, t + dur*0.55);
  fin.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); lfo.start(t); jit.start(t); nb.start(t);
  const fin2 = t + dur + 0.06;
  o.stop(fin2); lfo.stop(fin2); jit.stop(fin2); nb.stop(fin2);
  return G;
}

function son(tipo, f, idx){
  if (!AUD) return;
  const t = AUD.currentTime, k = f == null ? 1 : f;
  if (tipo === 'grito'){
    grito(idx == null ? (Math.random()*GRITOS.length)|0 : idx, k, t);
  } else if (tipo === 'golpe'){
    ruido(t, 0.20, 140, 0.7, 0.42*k, 'lowpass');
    tono(t, 90, 42, 0.22, 0.30*k, 'sine');
  } else if (tipo === 'portazo'){
    ruido(t, 0.26, 190, 0.6, 0.46*k, 'lowpass');
    tono(t, 120, 38, 0.30, 0.32*k, 'triangle');
  } else if (tipo === 'metal'){
    for (let i = 0; i < 5; i++) tono(t + i*0.045, 1800 + Math.random()*1400, 700, 0.22, 0.11*k, 'square');
  } else if (tipo === 'vidrio'){
    for (let i = 0; i < 9; i++) tono(t + Math.random()*0.10, 2600 + Math.random()*3200, 1500, 0.20, 0.09*k, 'triangle');
    ruido(t, 0.24, 5200, 1.2, 0.18*k);
  } else if (tipo === 'chispa'){
    ruido(t, 0.09, 3400, 1.6, 0.30*k);
  } else if (tipo === 'zumbido'){
    tono(t, 118, 118, 0.75, 0.10*k, 'square');
  } else if (tipo === 'chirrido'){
    for (let i = 0; i < 7; i++) tono(t + i*0.055, 2900 + Math.random()*900, 2400, 0.05, 0.09*k, 'square');
  } else if (tipo === 'susurro' || tipo === 'respira'){
    /* un susurro no tiene tono: es ruido con la banda de la voz y un sobre
       lento. El tono lo pone quien escucha, que es el chiste. */
    const b = ruido(t, tipo === 'respira' ? 1.3 : 0.85, 780, 1.5, 0.20*k);
    if (b) b.frequency.linearRampToValueAtTime(1500, t + 0.7);
  } else if (tipo === 'risa'){
    /* la risa usa la misma voz que el grito, cortada en sílabas: si fuera otra
       cadena de nodos, la risa y el grito sonarían a dos criaturas distintas */
    for (let i = 0; i < 5; i++) grito((idx || 0) + i*7, k*0.42, t + i*0.155);
    for (let i = 0; i < 6; i++) tono(t + i*0.13, 300 + (i%2)*120, 200, 0.10, 0.15*k, 'sawtooth');
  } else if (tipo === 'paso'){
    ruido(t, 0.10, 420, 1.0, 0.18*k, 'lowpass');
  } else if (tipo === 'agua'){
    ruido(t, 0.20, 2200, 0.9, 0.16*k);
  } else if (tipo === 'clic'){
    tono(t, 640, 420, 0.06, 0.10*k, 'sine');
  }
}
/* la cama: un zumbido bajísimo, constante, que el jugador deja de oír a los diez
   segundos — y por eso cuando algo lo interrumpe, se siente */
function camaFondo(){
  const o = AUD.createOscillator(); o.type = 'sine'; o.frequency.value = 47;
  const o2 = AUD.createOscillator(); o2.type = 'sine'; o2.frequency.value = 70.5;
  const g = AUD.createGain(); g.gain.value = 0.030;
  o.connect(g); o2.connect(g); g.connect(MAESTRO);
  o.start(); o2.start();
  const r = ruido(AUD.currentTime, 100000, 240, 0.5, 0.012, 'lowpass');
}
function pico(){
  if (!ANAL) return 0;
  const a = new Uint8Array(ANAL.fftSize);
  ANAL.getByteTimeDomainData(a);
  let m = 0;
  for (const v of a) m = Math.max(m, Math.abs(v - 128) / 128);
  return +m.toFixed(4);
}

/* ══════════════════════════ LA PARTIDA ══════════════════════════ */
/* `meta` arranca en 120 —el largo que se le PIDE al generador— y `empieza()` la
   reescribe con el largo que de verdad salió. */
const JUEGO = { d: 0, vel: 1.05, t: 0, semilla: 1, meta: 120, vivo: false, causa: '' };
const META_PEDIDA = 120;
/* 1,05 m/s es un paso de alguien que lleva algo y no quiere volcarlo. Con 1,6
   —que fue el primer valor— el pasillo pasa volando, las esquinas llegan antes
   de que el bol se estabilice y todo el juego es corregir. */

function empieza(){
  JUEGO.semilla = (Date.now() ^ (Math.random()*1e9)) >>> 0;
  const info = armaCamino(JUEGO.semilla, META_PEDIDA);
  /* ── LA META SALE DEL PASILLO CONSTRUIDO ──
     Era la constante 120 y el pasillo puede salir más corto (el generador no se
     puede cruzar consigo mismo, así que a veces se acorrala). Con dos números
     distintos para la misma cosa, el jugador caminaba más allá de la puerta
     hasta un final que no existe. Uno solo, y no pueden discrepar. */
  JUEGO.meta = Math.round(LARGO_TOTAL);
  armaMapa();
  armaCatalogo();
  armaAgenda();
  reiniciaBol();
  armaTabla();
  JUEGO.d = 0; JUEGO.t = 0; JUEGO.vivo = true; JUEGO.causa = '';
  SUSTOS_AGUANTADOS = 0;
  MODO = 'juega';
  for (const p of document.querySelectorAll('.pan')) p.classList.remove('on');
  $('hud').classList.add('on');
  $('neg').classList.remove('on');
  aviso(TX('aEmpieza'));
  return info;
}

function termina(gano){
  JUEGO.vivo = false;
  MODO = 'fin';
  const m = Math.round(JUEGO.d);
  try {
    const r = +(localStorage.getItem('pulso_record') || 0);
    if (m > r) localStorage.setItem('pulso_record', String(m));
  } catch(e){}
  $('finTit').textContent = TX(gano ? 'finGano' : 'finPerdio');
  $('finSub').textContent = gano ? TX('finGanoS', m, SUSTOS_AGUANTADOS)
                                 : TX('finPerdioS', Math.max(0, Math.round(JUEGO.meta - JUEGO.d)));
  $('hud').classList.remove('on');
  $('fin').classList.add('on');
  if (!gano) son('golpe', 1);
}

let _avT = 0;
function aviso(txt, ms){
  $('av').textContent = txt;
  $('av').classList.add('on');
  _avT = (ms || 2200) / 1000;
}

function pasoJuego(dt){
  if (!JUEGO.vivo) return;
  JUEGO.t += dt;
  JUEGO.d += JUEGO.vel * dt;

  /* los sustos que toca disparar */
  for (const a of AGENDA){
    if (!a.hecho && JUEGO.d >= a.d){ a.hecho = true; disparaSusto(a.s); }
  }
  const sac = pasoSusto(dt);
  LUZ.paso(dt);

  /* ── EL PASO TAMBIÉN SACUDE, y es lo que hace que caminar cueste ──
     Sin esto el bol sólo se mueve cuando el jugador inclina, y quedarse quieto
     sería gratis. Cada pisada mete un golpecito vertical que se traduce en un
     empujón chico y aleatorio: es el ruido de fondo contra el que hay que
     mantener el pulso. */
  const fase = JUEGO.d * Math.PI / 0.72;
  const pisada = Math.sin(fase);
  const sacP = { x: Math.cos(fase*1.7) * 0.30, z: pisada * 0.22 };
  const total = sac ? { x: sac.x + sacP.x, z: sac.z + sacP.z } : sacP;
  pasoBol(dt, total);

  if (BOL.cayo && !JUEGO.causa){ JUEGO.causa = 'bol'; termina(false); return; }
  if (BOL.agua <= 0.02 && !JUEGO.causa){ JUEGO.causa = 'agua'; termina(false); return; }
  if (JUEGO.d >= JUEGO.meta){ termina(true); return; }

  /* el aviso de que se está yendo: sale del bol, no de un temporizador */
  const r = Math.hypot(BOL.x, BOL.z) / TABLA.r;
  if (r > 0.72 && _avT <= 0) aviso(TX(r > 0.88 ? 'aCasi' : 'aTiembla'), 900);
}

function ponCamara(){
  /* `puntoCamino` y no `enCamino`: la primera es la curva con las esquinas
     redondeadas y la segunda la quebrada exacta. El rumbo sale de la derivada
     de la curva, así que hay que caminar por la MISMA curva — con la quebrada,
     mirada y avance vuelven a discrepar en cada vuelta. */
  const p = puntoCamino(JUEGO.d);
  const yaw = rumboEn(JUEGO.d);
  /* el cabeceo del paso, chico: es una persona que camina despacio con las dos
     manos ocupadas, no alguien corriendo */
  const fase = JUEGO.d * Math.PI / 0.72;
  cam.position.set(p.x + Math.cos(fase)*0.018, 1.58 + Math.abs(Math.sin(fase))*0.016, p.z);
  cam.rotation.set(0, yaw, Math.cos(fase)*0.006);
}

function pintaHud(dt){
  $('dist').textContent = Math.round(JUEGO.d) + ' / ' + JUEGO.meta + ' m';
  const b = $('aguaB');
  b.style.width = (BOL.agua*100).toFixed(1) + '%';
  b.classList.toggle('poco', BOL.agua < 0.34);
  if (_avT > 0){ _avT -= dt; if (_avT <= 0) $('av').classList.remove('on'); }
}

/* ══════════════════════════ EL BUCLE ══════════════════════════ */
function bucle(){
  requestAnimationFrame(bucle);
  const ahora = performance.now();
  let dt = Math.min((ahora - ultimo)/1000, 0.25);   /* una pestaña dormida no simula un minuto de golpe */
  ultimo = ahora;

  if (MODO === 'juega' && !PAUSA){
    acum += dt;
    let n = 0;
    while (acum >= PASO && n < 8){ pasoJuego(PASO); acum -= PASO; n++; }
    ponCamara();
    ponTabla();
    pintaHud(dt);
  } else if (MODO === 'menu'){
    /* el pasillo sigue vivo detrás del menú, pero quieto */
    ponCamara();
  }
  pasoFogonazo(dt);
  if (GIRO.listo) calculaInclinacion();

  ren.info.autoReset = false; ren.info.reset();
  /* ══════ TRES PASADAS, Y EL ORDEN ES LO QUE SE MIDIÓ ══════
     Un plano se saca adelante de todo con `depthTest:false`. Un MODELO no:
     sin prueba de profundidad sus propias caras de atrás se dibujan encima de
     las de adelante y la cosa sale del revés; y CON la prueba puesta, la pared
     de una esquina —que está a un metro— lo entierra, que es el mismo defecto
     que ya costó una vuelta con las caras. Medido: se veían los dos ojos
     flotando y ni un pixel del cuerpo.
     La salida es la de cualquier primera persona: cada cosa en su capa y una
     pasada por capa, borrando la profundidad entre pasadas.

         1. el mundo          (capa 0)
         2. el susto modelo   (capa 3) — ninguna pared lo puede tapar
         3. la tabla y el bol (capa 2) — SIEMPRE al final

     Y la tercera pasada no es un detalle: con dos pasadas el modelo salía
     dibujado ENCIMA del bol —medido en la captura, la figura parada arriba del
     cuenco— porque el borrado de profundidad no distingue qué está más cerca.
     La tabla es lo más cercano que hay y por eso va última.

     TRAMPA DE three.js, y costó una medición: `autoClear = false` NO alcanza.
     Cuando `scene.background` es un Color, `WebGLBackground.render()` pone
     `forceClear = true` y limpia igual — el fondo no es un objeto de la escena,
     es una orden de borrado disfrazada. Hay que sacarlo para las pasadas 2 y 3. */
  ren.info.autoReset = false; ren.info.reset();
  const hayModelo = !!(ACT.obj && ACT.s && ACT.s.fam === 'modelo');
  const fondo = escena.background;
  cam.layers.disable(2); cam.layers.disable(CAPA_SUSTO);
  ren.render(escena, cam);
  escena.background = null;
  ren.autoClear = false;
  if (hayModelo){
    cam.layers.disable(0); cam.layers.enable(CAPA_SUSTO);
    ren.clearDepth(); ren.render(escena, cam);
    cam.layers.disable(CAPA_SUSTO);
  } else cam.layers.disable(0);
  cam.layers.enable(2);
  ren.clearDepth(); ren.render(escena, cam);
  ren.autoClear = true;
  escena.background = fondo;
  cam.layers.enable(0);
  DIB = ren.info.render.calls; TRI = ren.info.render.triangles;

  _cuadros++; _acumF += dt;
  if (_acumF >= 0.5){ fps = Math.round(_cuadros/_acumF); _cuadros = 0; _acumF = 0; }
}

/* ── LA CALIBRACIÓN, QUE ES LA PANTALLA MÁS IMPORTANTE DEL JUEGO ──
   Y el aro con el punto no es decoración: es la única forma de que el jugador
   vea que el sensor lo está escuchando ANTES de empezar. Si el punto no se
   mueve, el juego no va a funcionar y hay que enterarse acá y no a los treinta
   metros de pasillo. */
let _calRAF = 0;
function pantallaCalibrar(){
  pan('cal');
  $('cEstado').textContent = GIRO.hay ? TX('cGiro') : TX('cPide');
  const pt = $('calPt');
  const tic = () => {
    _calRAF = requestAnimationFrame(tic);
    if (GIRO.hay && !GIRO.listo){
      /* antes de calibrar se muestra el crudo contra la vertical, sólo para que
         se vea que se mueve */
      const v = new T.Vector3(0, 1, 0).applyQuaternion(GIRO.q);
      pt.style.transform = 'translate(' + (v.x*52).toFixed(1) + 'px,' + (v.z*52).toFixed(1) + 'px)';
      $('cEstado').textContent = TX('cGiro');
    } else if (GIRO.listo){
      const i = inclinacion();
      pt.style.transform = 'translate(' + (i.x*52).toFixed(1) + 'px,' + (i.z*52).toFixed(1) + 'px)';
    } else {
      const i = inclinacion();
      pt.style.transform = 'translate(' + (i.x*52).toFixed(1) + 'px,' + (i.z*52).toFixed(1) + 'px)';
      $('cEstado').textContent = TX('cSinGiro');
    }
  };
  cancelAnimationFrame(_calRAF); tic();
}

/* ══════════════════════════ LAS SONDAS ══════════════════════════
   Sin esto no se puede afirmar nada del juego, y en éste menos que en ninguno:
   todo lo que importa —si el bol se cae, cuánto derrama, si el susto sacude—
   pasa en fracciones de segundo y no se ve en una captura. */
window.__P = {
  estado: () => ({ modo: MODO, d: +JUEGO.d.toFixed(2), meta: JUEGO.meta,
                   vivo: JUEGO.vivo, causa: JUEGO.causa,
                   agua: +BOL.agua.toFixed(3), cayo: BOL.cayo,
                   bol: [+BOL.x.toFixed(4), +BOL.z.toFixed(4)],
                   borde: +(Math.hypot(BOL.x, BOL.z)/TABLA.r).toFixed(3),
                   ola: +Math.hypot(BOL.ox, BOL.oz).toFixed(4),
                   sustos: SUSTOS_AGUANTADOS, activo: ACT.s ? ACT.s.id : -1 }),
  costo: () => ({ fps, dib: DIB, tri: TRI, pix: CFG.pix, calidad: CFG.calidad,
                  tam: [W, H] }),
  mapa: () => ({ tramos: CAMINO.length, metros: +LARGO_TOTAL.toFixed(1),
                 agenda: AGENDA.length, catalogo: SUSTOS.length,
                 semilla: JUEGO.semilla }),
  /* el catálogo entero, para poder comprobar que son 32 y que ninguno repite
     familia+dónde */
  catalogo: () => SUSTOS.map(s => s.fam + ':' + s.donde),
  /* juega solo: mantiene la tabla derecha y camina. Es la prueba de que el
     pasillo SE PUEDE terminar sin sustos — si con la tabla perfectamente quieta
     el bol se cae, el juego es imposible y no es culpa del jugador. */
  juegaSolo: (n, corrige) => new Promise(res => {
    empieza();
    let i = 0;
    const paso = () => {
      if (!JUEGO.vivo || i++ > n){
        res(JSON.stringify({ vueltas: i, d: +JUEGO.d.toFixed(1), meta: JUEGO.meta,
                             causa: JUEGO.causa, agua: +BOL.agua.toFixed(3),
                             sustos: SUSTOS_AGUANTADOS, gano: JUEGO.d >= JUEGO.meta }));
        return;
      }
      /* ── DOS JUGADORES AUTOMÁTICOS, Y HACEN FALTA LOS DOS ──
         Con la tabla PERFECTAMENTE DERECHA el bol no vuelve solo: una tabla
         plana no tiene fuerza que lo devuelva al centro, así que cada susto lo
         deja donde lo dejó y a los nueve sustos se cae. Medido: perdió a los
         106,3 m de 120. Eso NO es un defecto del juego — es el juego: hay que
         inclinar para traerlo. Pero entonces el jugador quieto ya no sirve para
         responder «¿se puede terminar?», y por eso hay un segundo.
         El que corrige es un control proporcional-derivativo sobre la posición
         y la velocidad del bol: la parte derivativa es la que importa, porque
         con sólo la posición el bol pasa de largo y oscila hasta caerse — que
         es exactamente lo que le pasa a una persona que reacciona tarde. */
      if (corrige){
        const k = (v, vv) => Math.max(-0.55, Math.min(0.55, v*7.5 + vv*3.4));
        DEDO.ix = k(BOL.x, BOL.vx); DEDO.iz = k(BOL.z, BOL.vz);
      } else DEDO.ix = DEDO.iz = 0;
      requestAnimationFrame(paso);
    };
    paso();
  }),
  /* inclina la tabla a mano, para medir la física sin un sensor */
  incl: (x, z) => { DEDO.ix = x; DEDO.iz = z; return inclinacion(); },
  /* dispara un susto por id y devuelve lo que hizo */
  /* comprueba que los treinta y dos caen DENTRO del cuadro. Es la única forma
     de que no vuelva a pasar lo de la esquina en x = 1,155: un susto fuera de
     pantalla no falla, no avisa, y se ve igual que uno que no se disparó. */
  sustosEnCuadro: () => {
    const fuera = [], v = new T.Vector3();
    cam.updateMatrixWorld(true);
    for (const s of SUSTOS){
      if (['cara','sombra','bicho','modelo'].indexOf(s.fam) < 0) continue;
      /* `atras` está DETRÁS del lente a propósito: es un susto que no se ve y
         que sólo suena y sacude. Contarlo como «fuera de cuadro» sería exigirle
         a la comprobación que desapruebe justo lo que se buscaba. */
      if (s.donde === 'atras') continue;
      const p = DONDE[s.donde]; if (!p) { fuera.push(s.donde + ':sin sitio'); continue; }
      v.set(p[0], p[1], p[2]).applyMatrix4(cam.matrixWorld).project(cam);
      const x = (v.x+1)/2, y = (1-v.y)/2;
      if (x < 0.02 || x > 0.98 || y < 0.02 || y > 0.98 || v.z > 1)
        fuera.push(s.fam + ':' + s.donde + ' → ' + x.toFixed(2) + ',' + y.toFixed(2));
    }
    return JSON.stringify({ mira: SUSTOS.filter(s => ['cara','sombra','bicho','modelo'].indexOf(s.fam) >= 0).length,
                            fuera: fuera.length, cuales: fuera });
  },
  /* dispara un susto y lo DEJA quieto, para poder fotografiarlo */
  sustoFijo: (id) => { const s = SUSTOS[id % SUSTOS.length];
                   if (ACT.s){ if (ACT.obj) cam.remove(ACT.obj); ACT.obj = null; ACT.s = null; }
                   disparaSusto(s); ACT.fijo = true;
                   if (ACT.obj){ ACT.obj.scale.setScalar(1.15); ACT.obj.visible = true; }
                   return JSON.stringify({ id: s.id, fam: s.fam, donde: s.donde }); },
  sustoFuera: () => { if (ACT.obj) cam.remove(ACT.obj);
                      ACT.obj = null; ACT.s = null; ACT.fijo = false; return true; },
  susto: (id) => { const s = SUSTOS[id % SUSTOS.length];
                   if (ACT.s){ if (ACT.obj) cam.remove(ACT.obj); ACT.obj = null; ACT.s = null; }
                   disparaSusto(s);
                   return JSON.stringify({ id: s.id, fam: s.fam, donde: s.donde,
                                           sac: [+ACT.sac.x.toFixed(2), +ACT.sac.z.toFixed(2)] }); },
  /* dónde CAE en pantalla el susto que está activo, y si el material se ve.
     Un susto que se dispara y no se ve es indistinguible de uno que no se
     disparó, y las dos cosas se arreglan en sitios distintos. */
  dondeSusto: () => {
    if (!ACT.obj) return JSON.stringify({ hay: false, activo: ACT.s ? ACT.s.id : -1 });
    const v = new T.Vector3();
    ACT.obj.updateMatrixWorld(true);
    ACT.obj.getWorldPosition(v);
    const l = v.clone(); cam.updateMatrixWorld(true);
    cam.worldToLocal(l);
    v.project(cam);
    const m = ACT.obj.children[0];
    return JSON.stringify({ hay: true, id: ACT.s.id, fam: ACT.s.fam,
      local: [+l.x.toFixed(3), +l.y.toFixed(3), +l.z.toFixed(3)],
      pantalla: [+((v.x+1)/2).toFixed(3), +((1-v.y)/2).toFixed(3)], z: +v.z.toFixed(3),
      vis: ACT.obj.visible && m.visible, esc: +ACT.obj.scale.x.toFixed(2),
      op: m.material.opacity, tex: !!m.material.map,
      texTam: m.material.map ? m.material.map.image.width : 0 });
  },
  /* mide el costo de lo caro, apagándolo. `transmission` renderiza la ESCENA
     ENTERA a un destino aparte por cuadro, sin importar que el objeto sea un
     disco de cinco centímetros; y la sombra de la linterna es un segundo
     recorrido de toda la geometría. Las dos cosas se pagan por cuadro y ninguna
     se ve en `dib`/`tri`, así que hay que medirlas apagándolas. */
  perf: async (que) => {
    if (que === 'trans') matAgua.transmission = 0.55;
    if (que === 'sin_sombra') luz.castShadow = false;
    if (que === 'todo'){ matAgua.transmission = 0; luz.castShadow = true; }
    await new Promise(r => setTimeout(r, 1600));
    return JSON.stringify({ que, fps, dib: DIB, tri: TRI });
  },
  /* lee el búfer de verdad con `readPixels`. Un lienzo WebGL sin
     `preserveDrawingBuffer` sale en cero con `drawImage`, así que ésta es la
     única forma de saber si el pasillo está iluminado o si está negro. */
  brillo: () => {
    const gl = ren.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const p = new Uint8Array(w*h*4);
    ren.render(escena, cam);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, p);
    let s = 0, mx = 0, enc = 0;
    for (let i = 0; i < p.length; i += 4){
      const v = 0.30*p[i] + 0.59*p[i+1] + 0.11*p[i+2];
      s += v; if (v > mx) mx = v; if (v > 26) enc++;
    }
    const n = p.length/4;
    return JSON.stringify({ medio: +(s/n).toFixed(1), max: mx|0,
                            pctEncendido: +(100*enc/n).toFixed(1) });
  },
  /* mide los 32 gritos: dispara cada uno y lee el pico del analizador. Un
     catálogo de gritos que no se mide es un catálogo de gritos que puede tener
     la mitad en silencio y nadie se entera. */
  gritos: async () => {
    armaAudio();
    if (AUD && AUD.state === 'suspended') await AUD.resume();
    const out = [];
    for (let i = 0; i < GRITOS.length; i++){
      const G = grito(i, 1, AUD.currentTime + 0.01);
      await new Promise(r => setTimeout(r, 190));
      out.push({ id: i, timbre: G.timbre, f0: +G.f0.toFixed(0),
                 dur: +G.dur.toFixed(2), q: G.quiebra ? 1 : 0, pico: pico() });
      await new Promise(r => setTimeout(r, 40));
    }
    const p = out.map(o => o.pico);
    return JSON.stringify({ n: out.length, mudos: p.filter(v => v < 0.02).length,
      picoMin: Math.min(...p), picoMax: Math.max(...p),
      timbres: [...new Set(out.map(o => o.timbre))],
      f0s: [...new Set(out.map(o => o.f0))].length, quiebran: out.filter(o => o.q).length });
  },
  /* arma N pasillos con semillas distintas y mide los largos: es la única
     forma de saber si la prohibición de cruzarse deja el pasillo corto, porque
     con una sola semilla se ve el caso que tocó y nada más */
  mapas: (n) => {
    const L = [], V = [];
    for (let i = 0; i < (n || 40); i++){
      const r = armaCamino((i*2654435761 + 7) >>> 0, 120);
      L.push(r.metros); V.push(r.vueltas);
    }
    return JSON.stringify({ n: L.length, min: Math.min(...L), max: Math.max(...L),
      bajo120: L.filter(v => v < 120).length,
      vueltasMin: Math.min(...V), vueltasMax: Math.max(...V) });
  },
  /* ══════ LA PRUEBA DE QUE NO ESTÁ INVERTIDO ══════
     El reporte fue «cae la tabla y el bol sube, todo invertido». Lo que hay que
     comprobar no es el signo de un sensor —cada teléfono reporta lo suyo— sino
     una invariante que se puede escribir sin ambigüedad:

         EL BOL SE MUEVE HACIA EL LADO BAJO DE LA TABLA QUE SE DIBUJA.

     Así que se toma la tabla YA DIBUJADA, se le saca la normal de su propio
     cuaternión, se proyecta al plano y se compara con hacia dónde se movió el
     bol. Si el producto escalar es positivo, dibujo y física coinciden; si es
     negativo, están invertidos — y da igual de qué lado esté el error. */
  pruebaTabla: () => {
    const casos = [[0.30, 0], [-0.30, 0], [0, 0.30], [0, -0.30], [0.21, 0.21]];
    const out = [];
    const n = new T.Vector3();
    for (const [ix, iz] of casos){
      reiniciaBol();
      DEDO.ix = ix; DEDO.iz = iz;
      ponTabla();
      gTabla.updateMatrixWorld(true);
      /* la normal de la tabla dibujada, en el marco de la cámara */
      n.set(0, 1, 0).applyQuaternion(gTabla.quaternion);
      for (let i = 0; i < 60; i++) pasoBol(1/60, null);
      const dot = n.x*BOL.x + n.z*BOL.z;
      out.push({ inc: [ix, iz], normal: [+n.x.toFixed(3), +n.z.toFixed(3)],
                 bol: [+BOL.x.toFixed(3), +BOL.z.toFixed(3)],
                 dot: +dot.toFixed(4), ok: dot > 0 });
    }
    reiniciaBol(); DEDO.ix = DEDO.iz = 0;
    return JSON.stringify({ casos: out, todosOk: out.every(o => o.ok) });
  },
  /* ¿el jugador camina siempre por dentro del pasillo? Se recorre el largo
     entero cada cinco centímetros y se mide la distancia a la línea de centro
     del tramo más cercano. Más de medio ancho = está adentro de una pared. Una
     diagonal por dentro de un muro dura un segundo y en una foto no se ve. */
  paredes: () => {
    let peor = 0, fuera = 0, pasos = 0, dPeor = 0;
    for (let d = 0; d <= LARGO_TOTAL; d += 0.05){
      const p = puntoCamino(d);
      let mejor = 1e9;
      for (const t of CAMINO){
        const ax = t.x, az = t.z;
        const bx = t.x + DIRS[t.dir][0]*t.largo, bz = t.z + DIRS[t.dir][1]*t.largo;
        const vx = bx-ax, vz = bz-az, wx = p.x-ax, wz = p.z-az;
        const L2 = vx*vx + vz*vz;
        const u = Math.max(0, Math.min(1, (wx*vx + wz*vz)/L2));
        const dx = p.x - (ax + vx*u), dz = p.z - (az + vz*u);
        mejor = Math.min(mejor, Math.hypot(dx, dz));
      }
      pasos++;
      if (mejor > peor){ peor = mejor; dPeor = d; }
      if (mejor > ANCHO/2 - 0.05) fuera++;
    }
    return JSON.stringify({ pasos, fuera, peor: +peor.toFixed(3),
                            enMetro: +dPeor.toFixed(1), medioAncho: ANCHO/2 });
  },
  /* ¿avanza hacia donde mira? Se compara el rumbo con la dirección en la que de
     verdad se movió el punto. Un ángulo grande es caminar de costado. */
  deFrente: () => {
    let peor = 0, dPeor = 0; const h = 0.05;
    for (let d = h; d <= LARGO_TOTAL - h; d += 0.05){
      const p0 = puntoCamino(d - h), p1 = puntoCamino(d + h);
      const mov = Math.atan2(p1.x - p0.x, p1.z - p0.z);
      let dif = rumboEn(d) - mov;
      while (dif > Math.PI) dif -= Math.PI*2;
      while (dif < -Math.PI) dif += Math.PI*2;
      dif = Math.abs(dif);
      if (dif > peor){ peor = dif; dPeor = d; }
    }
    return JSON.stringify({ peorGrados: +(peor*180/Math.PI).toFixed(2), enMetro: +dPeor.toFixed(1) });
  },
  giro: () => ({ hay: GIRO.hay, listo: GIRO.listo, permiso: GIRO.permiso,
                 crudo: GIRO.crudo, inc: inclinacion() }),
  /* mete una orientación falsa, que es la única forma de probar el giroscopio
     en un contenedor sin sensor */
  giroFalso: (a, b, g) => { onOrientacion({ alpha: a, beta: b, gamma: g }); return GIRO.hay; },
  calibrar: () => { calibrar(); return { listo: GIRO.listo, inc: inclinacion() }; },
  pico: () => pico(),
  empieza: () => { empieza(); return MODO; },
  saltarA: (m) => { JUEGO.d = m; return +JUEGO.d.toFixed(1); },
  pausar: (v) => { PAUSA = !!v; return PAUSA; }
};

/* ══════════════════════════ ARRANQUE ══════════════════════════ */
aplicarCalidad();
pintaIdioma();
pintaMenu();
/* el pasillo se arma YA, aunque estemos en el menú: así el menú tiene algo
   detrás y el primer cuadro de la partida no llega con un tirón de carga */
armaCamino(12345, 120);
armaMapa();
armaCatalogo();
medir();
