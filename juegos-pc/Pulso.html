<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PULSO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e8e4dc;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
/* ══════════ EL CUADRO VA HORIZONTAL, Y SI EL TELÉFONO ESTÁ VERTICAL SE GIRA ══════════
   Este juego se lleva como una bandeja: las dos manos a los costados y el
   teléfono de costado. En vertical el campo horizontal es de 33° —medido— y a
   ese ancho un susto que aparece «al costado» cae fuera del cuadro y la tabla
   no entra entera.
   Así que el juego es horizontal siempre. Si la ventana está vertical, TODO
   —lienzo, HUD, velos y pantallas— se gira 90° adentro de `#caja` y el jugador
   da vuelta el teléfono. Es una sola transformación, así que nada puede quedar
   desalineado; y como un `transform` crea bloque contenedor, los `position:fixed`
   de adentro se resuelven contra la caja y no contra la ventana.
   Y OJO: girar el dibujo gira también los ejes que ve el jugador. `GIRO_VIS`
   lleva ese ángulo y lo leen el giroscopio y el arrastre del dedo; sin eso el
   juego quedaría bien dibujado y con los controles cruzados. */
#caja{position:fixed;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden}
#capa{position:fixed;inset:0;pointer-events:none}

/* ── EL VELO DEL SUSTO ──
   Va en CSS y no en el post del render a propósito: tiene que poder encenderse
   en el MISMO cuadro en que el screamer dispara, sin esperar a que el bucle de
   dibujo llegue. Un fogonazo que llega un cuadro tarde no asusta. */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#neg{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#neg.on{opacity:1}
#vineta{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 34%,rgba(0,0,0,.82) 100%)}

/* ── EL HUD ES CASI NADA ──
   Las dos manos están ocupadas sosteniendo la tabla. Un HUD con botones sería
   mentirle al jugador sobre lo que puede hacer. */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
#dist{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;
  text-align:center;font-size:13px;letter-spacing:.24em;opacity:.5}
#nivel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 34px);left:0;right:0;
  text-align:center;font-size:10px;letter-spacing:.3em;opacity:.32}

/* la barra de agua: lo único que se mira sin querer */
#agua{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:44%;height:5px;background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden}
#aguaB{height:100%;width:100%;background:#7fb4c9;transition:width .18s}
#aguaB.poco{background:#c96b5a}

#av{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:15px;
  letter-spacing:.2em;opacity:0;transition:opacity .3s;text-shadow:0 2px 14px #000}
#av.on{opacity:.95}

/* ── LAS PANTALLAS ── */
.pan{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:26px;background:#07070a;z-index:6}
.pan.on{display:flex}
.pan h1{font-size:clamp(34px,13vw,72px);letter-spacing:.3em;font-weight:800;
  text-indent:.3em;color:#efe9dd}
.pan p{font-size:13px;line-height:1.65;opacity:.62;text-align:center;max-width:30em}
.bt{pointer-events:auto;cursor:pointer;border:1px solid rgba(232,228,220,.28);
  background:rgba(255,255,255,.03);color:#e8e4dc;padding:13px 30px;border-radius:2px;
  font-size:13px;letter-spacing:.22em;transition:background .2s,border-color .2s}
.bt:active{background:rgba(255,255,255,.12)}
.bt.p{border-color:rgba(232,228,220,.6)}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chico{font-size:11px;opacity:.45;letter-spacing:.14em;text-align:center;line-height:1.7}

/* el menú tiene el pasillo detrás, así que el panel es translúcido */
#menu{background:rgba(5,5,8,.72);backdrop-filter:blur(2px)}
#menu h1{text-shadow:0 0 40px rgba(180,200,220,.22)}

#opc .op{display:flex;gap:8px;align-items:center;justify-content:space-between;
  width:min(420px,86vw);font-size:12px;letter-spacing:.14em;opacity:.85}
#opc .op .vals{display:flex;gap:6px}
#opc .op .bt{padding:7px 13px;font-size:11px;letter-spacing:.1em}
#opc .op .bt.on{background:rgba(232,228,220,.16);border-color:rgba(232,228,220,.55)}

#cal{gap:22px}
#calAro{width:132px;height:132px;border:2px solid rgba(232,228,220,.22);border-radius:50%;
  position:relative;display:grid;place-items:center}
#calPt{width:16px;height:16px;border-radius:50%;background:#7fb4c9;
  box-shadow:0 0 18px #7fb4c9;transition:transform .06s linear}
</style></head><body>
<div id="caja">
<canvas id="c"></canvas>
<div id="capa">
  <div id="vineta"></div>
  <div id="hud">
    <div id="dist">0 m</div>
    <div id="nivel"></div>
    <div id="agua"><div id="aguaB"></div></div>
    <div id="av"></div>
  </div>
</div>
<div id="flash"></div>
<div id="neg"></div>

<div class="pan on" id="idioma">
  <h1>PULSO</h1>
  <div class="fila">
    <button class="bt p" data-lang="es">ESPAÑOL</button>
    <button class="bt" data-lang="en">ENGLISH</button>
    <button class="bt" data-lang="pt">PORTUGUÊS</button>
  </div>
</div>

<div class="pan" id="menu">
  <h1>PULSO</h1>
  <p data-i18n="mSub"></p>
  <div class="fila">
    <button class="bt p" id="mJugar" data-i18n="mJugar"></button>
    <button class="bt" id="mOpc" data-i18n="mOpc"></button>
  </div>
  <div class="chico" id="mRecord"></div>
</div>

<div class="pan" id="opc">
  <h1 style="font-size:clamp(20px,7vw,34px)" data-i18n="oTit"></h1>
  <div class="op"><span data-i18n="oCalidad"></span><span class="vals" id="oCal"></span></div>
  <div class="op"><span data-i18n="oSens"></span><span class="vals" id="oSens"></span></div>
  <div class="op"><span data-i18n="oSustos"></span><span class="vals" id="oSus"></span></div>
  <div class="op"><span data-i18n="oIdioma"></span><span class="vals" id="oIdi"></span></div>
  <button class="bt" id="oVolver" data-i18n="oVolver"></button>
</div>

<div class="pan" id="cal">
  <h1 style="font-size:clamp(19px,6vw,30px)" data-i18n="cTit"></h1>
  <p data-i18n="cSub"></p>
  <div id="calAro"><div id="calPt"></div></div>
  <button class="bt p" id="cListo" data-i18n="cListo"></button>
  <div class="chico" id="cEstado"></div>
</div>

<div class="pan" id="fin">
  <h1 id="finTit" style="font-size:clamp(24px,9vw,48px)"></h1>
  <p id="finSub"></p>
  <div class="fila">
    <button class="bt p" id="fOtra" data-i18n="fOtra"></button>
    <button class="bt" id="fMenu" data-i18n="fMenu"></button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as T from 'three';
/* el cargador de GLB va aparte del núcleo de three y por eso necesita su propia
   entrada en el mapa de importaciones. Se usa para los sustos que son MODELO:
   una cosa que aparece de la nada y que tiene volumen de verdad — un plano con
   una foto se delata en cuanto la linterna se mueve, porque no proyecta ni
   recibe nada. */
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ══════════════════════════ LOS TEXTOS ══════════════════════════
   Nada de texto suelto en el código: todo sale de acá. La función se llama TX y
   no `t` — una global de una letra la pisa cualquier cosa, y cuando se pisa no
   falla el idioma, falla TODO, porque no queda un solo texto que no pase por
   ahí. Ya pasó en Z Force. */
const LANG = {
  es: {
    mSub: 'Llevás una tabla con un bol lleno de agua.\nEl pasillo hace el resto.',
    mJugar: 'EMPEZAR', mOpc: 'OPCIONES',
    mRecord: (m) => 'más lejos: ' + m + ' m',
    oTit: 'OPCIONES', oCalidad: 'CALIDAD', oSens: 'SENSIBILIDAD',
    oSustos: 'SUSTOS', oIdioma: 'IDIOMA', oVolver: 'VOLVER',
    oBaja: 'BAJA', oMedia: 'MEDIA', oAlta: 'ALTA',
    oSuave: 'SUAVE', oNormal: 'NORMAL', oDura: 'DURA',
    oPocos: 'POCOS', oTodos: 'TODOS',
    cTit: 'SOSTENÉ LA TABLA',
    cSub: 'Agarrá el teléfono como lo vas a llevar y no lo muevas.\nEsa posición es «derecho».',
    cListo: 'ASÍ ESTÁ BIEN',
    cGiro: 'giroscopio: listo', cSinGiro: 'sin giroscopio — se juega arrastrando el dedo',
    cPide: 'tocá para permitir el sensor',
    aEmpieza: 'no la dejes caer', aTiembla: 'se está yendo', aCasi: 'CASI',
    finGano: 'LLEGASTE', finPerdio: 'SE CAYÓ',
    finGanoS: (m, s) => m + ' metros · ' + s + ' sustos aguantados',
    finPerdioS: (m) => 'a ' + m + ' metros de la puerta',
    fOtra: 'DE NUEVO', fMenu: 'MENÚ'
  },
  en: {
    mSub: 'You are carrying a board with a bowl full of water.\nThe corridor does the rest.',
    mJugar: 'START', mOpc: 'OPTIONS',
    mRecord: (m) => 'furthest: ' + m + ' m',
    oTit: 'OPTIONS', oCalidad: 'QUALITY', oSens: 'SENSITIVITY',
    oSustos: 'SCARES', oIdioma: 'LANGUAGE', oVolver: 'BACK',
    oBaja: 'LOW', oMedia: 'MEDIUM', oAlta: 'HIGH',
    oSuave: 'GENTLE', oNormal: 'NORMAL', oDura: 'HARSH',
    oPocos: 'FEWER', oTodos: 'ALL',
    cTit: 'HOLD THE BOARD',
    cSub: 'Hold the phone the way you will carry it, and keep still.\nThat position becomes «level».',
    cListo: 'THAT IS RIGHT',
    cGiro: 'gyroscope: ready', cSinGiro: 'no gyroscope — drag your finger instead',
    cPide: 'tap to allow the sensor',
    aEmpieza: 'do not drop it', aTiembla: 'it is sliding', aCasi: 'ALMOST',
    finGano: 'YOU MADE IT', finPerdio: 'IT FELL',
    finGanoS: (m, s) => m + ' metres · ' + s + ' scares held',
    finPerdioS: (m) => m + ' metres from the door',
    fOtra: 'AGAIN', fMenu: 'MENU'
  },
  pt: {
    mSub: 'Você leva uma tábua com uma tigela cheia de água.\nO corredor faz o resto.',
    mJugar: 'COMEÇAR', mOpc: 'OPÇÕES',
    mRecord: (m) => 'mais longe: ' + m + ' m',
    oTit: 'OPÇÕES', oCalidad: 'QUALIDADE', oSens: 'SENSIBILIDADE',
    oSustos: 'SUSTOS', oIdioma: 'IDIOMA', oVolver: 'VOLTAR',
    oBaja: 'BAIXA', oMedia: 'MÉDIA', oAlta: 'ALTA',
    oSuave: 'SUAVE', oNormal: 'NORMAL', oDura: 'DURA',
    oPocos: 'POUCOS', oTodos: 'TODOS',
    cTit: 'SEGURE A TÁBUA',
    cSub: 'Segure o telefone como vai carregá-lo e não mexa.\nEssa posição vira «reto».',
    cListo: 'ASSIM ESTÁ BOM',
    cGiro: 'giroscópio: pronto', cSinGiro: 'sem giroscópio — jogue arrastando o dedo',
    cPide: 'toque para permitir o sensor',
    aEmpieza: 'não deixe cair', aTiembla: 'está escorregando', aCasi: 'QUASE',
    finGano: 'VOCÊ CHEGOU', finPerdio: 'CAIU',
    finGanoS: (m, s) => m + ' metros · ' + s + ' sustos aguentados',
    finPerdioS: (m) => 'a ' + m + ' metros da porta',
    fOtra: 'DE NOVO', fMenu: 'MENU'
  }
};
let IDIOMA = 'es';
const TX = (k, ...a) => {
  const v = (LANG[IDIOMA] && LANG[IDIOMA][k]) !== undefined ? LANG[IDIOMA][k] : LANG.es[k];
  return typeof v === 'function' ? v(...a) : (v === undefined ? k : v);
};
const $ = (id) => document.getElementById(id);

function pintaIdioma(){
  for (const el of document.querySelectorAll('[data-i18n]')){
    const t = TX(el.getAttribute('data-i18n'));
    el.textContent = t;
    if (String(t).indexOf('\n') >= 0) el.style.whiteSpace = 'pre-line';
  }
  /* los guards existen para el arranque —cuando estas funciones todavía no se
     declararon— y NO para saltear la llamada siempre. Cada una se asigna a
     `window` al final de su archivo. Es la lección que en RECREO dejó el filtro
     sin repintarse nunca. */
  if (window.pintaOpciones) window.pintaOpciones();
  if (window.pintaMenu) window.pintaMenu();
}

/* ══════════════════════ EL MOTOR Y LA CONFIGURACIÓN ══════════════════════ */
const CFG = {
  calidad: 'media',      /* baja · media · alta */
  sens: 'normal',        /* suave · normal · dura */
  sustos: 'todos',       /* pocos · todos */
  pix: 1.5               /* lo pisa aplicarCalidad() */
};
try {
  const g = localStorage.getItem('pulso_cfg');
  if (g) Object.assign(CFG, JSON.parse(g));
  IDIOMA = localStorage.getItem('pulso_idioma') || 'es';
} catch(e){}
const guardaCfg = () => { try {
  localStorage.setItem('pulso_cfg', JSON.stringify(CFG));
  localStorage.setItem('pulso_idioma', IDIOMA);
} catch(e){} };

let MODO = 'menu';         /* menu · juega · fin */
let PAUSA = false;

/* ── `GIRO_VIS` SE DECLARA ACÁ Y NO DONDE SE USA, Y ES A PROPÓSITO ──
   Es el ángulo con el que se está dibujando el cuadro. Lo escribe `encuadrar()`
   —dos pantallas más abajo— y lo lee la inclinación, que vive en e.js. Ponerlo
   «donde corresponde temáticamente», o sea al lado del giroscopio, lo dejaría
   declarado DESPUÉS de la primera llamada a `medir()`: todo esto es un solo
   módulo ES, y un `let` leído antes de su línea no devuelve undefined, TIRA — y
   se lleva el módulo entero. Es el noveno caso en este repo. */
let GIRO_VIS = 0;

const lienzo = $('c');
const ren = new T.WebGLRenderer({ canvas: lienzo, antialias: false, powerPreference: 'high-performance' });
ren.outputColorSpace = T.SRGBColorSpace;
/* ── ACES Y NO EL LINEAL POR OMISIÓN ──
   Este juego es una linterna en un pasillo negro: el rango entre lo que la
   linterna toca y lo que no es enorme, y con tono lineal lo iluminado se recorta
   a blanco plano. ACES lo dobla en vez de cortarlo, que es lo que hace que una
   pared iluminada de cerca siga teniendo textura. */
ren.toneMapping = T.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.15;
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;

const escena = new T.Scene();
escena.background = new T.Color(0x000000);
/* la niebla es negra y cierra a doce metros: es lo que hace que el pasillo no
   tenga fondo y que cada esquina sea una pared de nada */
escena.fog = new T.FogExp2(0x000000, 0.088);

/* ── 52° VERTICALES, Y EL NÚMERO CAMBIÓ AL PASAR A HORIZONTAL ──
   En vertical estaba en 66, que con 412×892 daba 33° horizontales. Horizontal,
   los mismos 66 verticales con 892×412 dan **116° horizontales**: un ojo de pez
   donde el pasillo se ve desde afuera y el susto que aparece a un metro queda
   del tamaño de una uña. Con 52 verticales quedan 96 horizontales, que es lo que
   usa un primera persona, y a un metro entran ±1,06 m de ancho contra ±0,49 de
   alto. Todas las posiciones de los sustos y de la tabla salen de esos dos
   números, así que están escritas en función de ellos y no a ojo. */
const cam = new T.PerspectiveCamera(52, 1, 0.05, 90);
escena.add(cam);

let W = 1, H = 1;
/* ── EL ENCUADRE: SIEMPRE HORIZONTAL, GIRADO SI HACE FALTA ──
   Con la ventana vertical el cuadro se arma horizontal —ancho = alto de la
   ventana— y se gira 90°. Con la ventana horizontal no se gira nada. Los dos
   caminos dan el mismo juego; lo único que cambia es si el jugador tiene que
   dar vuelta el teléfono.
   `GIRO_VIS` se escribe acá porque acá se decide, y lo leen el giroscopio y el
   dedo: girar el dibujo sin girar los ejes de entrada deja los controles
   cruzados, que es un defecto peor que no girar nada. */
const caja = $('caja');
function encuadrar(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const gira = vh > vw;
  W = gira ? vh : vw;
  H = gira ? vw : vh;
  caja.style.width = W + 'px';
  caja.style.height = H + 'px';
  caja.style.transform = 'translate(-50%,-50%) rotate(' + (gira ? 90 : 0) + 'deg)';
  GIRO_VIS = gira ? Math.PI/2 : 0;
}
function medir(){
  encuadrar();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ren.setPixelRatio(Math.min(dpr, CFG.pix));
  ren.setSize(W, H, false);
  cam.aspect = W / Math.max(1, H);
  cam.updateProjectionMatrix();
}
addEventListener('resize', () => setTimeout(medir, 60));
addEventListener('orientationchange', () => setTimeout(medir, 120));

function aplicarCalidad(){
  const c = CFG.calidad;
  CFG.pix = c === 'baja' ? 0.75 : c === 'media' ? 1.15 : 1.6;
  ren.shadowMap.enabled = c !== 'baja';
  medir();
}

/* ── EL RELOJ ──
   Paso fijo a 60 con interpolación en el dibujo. Acá no es un lujo: TODO el
   juego es una bola rodando sobre un plano inclinado, y una integración atada a
   los cuadros hace que el bol se caiga antes en un teléfono lento que en uno
   rápido. Eso no es rendimiento, es otro juego. */
const PASO = 1 / 60;
let acum = 0, ultimo = performance.now(), fps = 0, _cuadros = 0, _acumF = 0;
let DIB = 0, TRI = 0;
/* ══════════ ASSETS GENERADOS (Rezona Lab, proyecto WUMdrRxs) ══════════
   Seis caras y cuatro texturas, horneadas por herramientas/pulso/hornear.py.

/* ══════════════════════ MATERIALES Y TEXTURAS DIBUJADAS ══════════════════════
   Todo dibujado por código en lienzos chicos. En un pasillo iluminado por una
   sola linterna, la textura casi no se ve: lo que se ve es cómo cae la luz. Las
   fotos generadas entran después, y cuando entren PISAN a éstas — nunca al
   revés. */
function lienzoTex(n, f){
  const c = document.createElement('canvas');
  c.width = c.height = n;
  f(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.anisotropy = 4;
  t.colorSpace = T.SRGBColorSpace;
  return t;
}
/* ── UN LIENZO QUE NO ES CUADRADO, Y HACE FALTA ──
   Una textura cuadrada estirada sobre un plano de 0,78 × 1,85 estira cada texel
   2,37 veces a lo alto: medido en la captura, la silueta de una persona salía
   como tres salchichas negras apiladas. El dibujo tiene que hacerse en un
   lienzo con la MISMA proporción que el plano, y entonces un círculo es un
   círculo. */
function lienzoTexWH(w, h, f){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  f(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4; t.colorSpace = T.SRGBColorSpace;
  return t;
}
function grano(g, n, a, k){
  const d = g.getImageData(0, 0, n, n), p = d.data;
  for (let i = 0; i < p.length; i += 4){
    const v = (Math.random() - 0.5) * k;
    p[i] += v; p[i+1] += v; p[i+2] += v;
  }
  g.putImageData(d, 0, 0);
}

/* baldosas de hospital viejo: la reja es lo único que da escala y velocidad */
const texPiso = lienzoTex(256, (g, n) => {
  g.fillStyle = '#3a3733'; g.fillRect(0, 0, n, n);
  const p = n / 4;
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++){
    const v = 0.86 + Math.random() * 0.24;
    g.fillStyle = 'rgb(' + (58*v|0) + ',' + (55*v|0) + ',' + (50*v|0) + ')';
    g.fillRect(i*p + 1.5, j*p + 1.5, p - 3, p - 3);
  }
  grano(g, n, 0, 16);
});
texPiso.repeat.set(1, 1);

/* la pared: revoque manchado. Las manchas son lo único que hace que dos tramos
   del pasillo no se confundan entre sí */
const texPared = lienzoTex(256, (g, n) => {
  g.fillStyle = '#43403a'; g.fillRect(0, 0, n, n);
  for (let k = 0; k < 26; k++){
    const x = Math.random()*n, y = Math.random()*n, r = 10 + Math.random()*46;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(26,22,18,' + (0.05 + Math.random()*0.16).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(26,22,18,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  /* el zócalo: una línea horizontal es lo que dice «esto es una pared» */
  g.fillStyle = 'rgba(20,17,14,.5)'; g.fillRect(0, n - 26, n, 26);
  grano(g, n, 0, 13);
});

const texTecho = lienzoTex(128, (g, n) => {
  g.fillStyle = '#2a2825'; g.fillRect(0, 0, n, n);
  grano(g, n, 0, 10);
});

const texMadera = lienzoTex(256, (g, n) => {
  g.fillStyle = '#6b563d'; g.fillRect(0, 0, n, n);
  for (let k = 0; k < 60; k++){
    g.strokeStyle = 'rgba(48,36,24,' + (0.06 + Math.random()*0.20).toFixed(3) + ')';
    g.lineWidth = 0.6 + Math.random()*2.2;
    g.beginPath();
    const y = Math.random()*n;
    g.moveTo(0, y);
    g.bezierCurveTo(n*0.3, y + (Math.random()-0.5)*13, n*0.7, y + (Math.random()-0.5)*13, n, y);
    g.stroke();
  }
  grano(g, n, 0, 11);
});

/* ══════════ LAS TEXTURAS DE VERDAD, Y POR QUÉ EN ESPEJO ══════════
   Las de arriba están dibujadas por código y son el RESPALDO: si un WebP no
   decodifica, el pasillo sigue teniendo paredes. Las que se ven son fotos
   generadas (Rezona Lab, proyecto WUMdrRxs) — revoque descascarado de asilo,
   baldosas de hospital levantadas, plafones de techo con moho.
   Un pasillo dibujado con dos gradientes no da miedo por más luz que se le
   apague: el miedo de un pasillo está en el detalle que uno reconoce.

   LA COSTURA SE ARREGLA EN EL HORNEADO Y NO ACÁ. El primer intento fue
   `MirroredRepeatWrapping`: saca la costura, pero deja la pared con simetría
   espejo cada dos baldosas y sobre un muro de tres metros eso se ve — las
   manchas de humedad salían formando mariposas. `hornear.py` funde ahora la
   banda de un borde sobre el opuesto, así que la textura embaldosa de verdad y
   acá alcanza con repetición normal. */
function foto(dato, respaldo){
  if (typeof AS === 'undefined' || !dato) return respaldo;
  const t = new T.TextureLoader().load(dato);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
/* ── EL TAMAÑO DE LA BALDOSA Y EL TONO SE MIDIERON EN LA FOTO, NO A OJO ──
   Con las fotos recién puestas el pasillo salió BLANCO: la pared descascarada
   es casi papel y el revoque, iluminado de frente por una linterna a un metro,
   devolvía un muro liso y brillante donde no se distinguía una esquina de otra.
   Un pasillo de terror tiene que ser un charco de luz rodeado de nada; si se ve
   todo, no hay dónde esconder un susto.
   Dos correcciones, y las dos son multiplicaciones: el tono baja a dos tercios
   —el material tiñe la foto, así que esto es exposición y no repintar— y la
   repetición sube, porque la geometría trae la UV a 1,4 m por baldosa y a ese
   tamaño una escama de pintura mide veinte centímetros y se lee a mapa de
   Marte. Con `repeat` 0,95 la baldosa de la pared mide metro y medio: la escama
   queda del tamaño de una escama y el dibujo no se repite tres veces en el
   mismo muro. (1,7 fue el primer intento y se veía la repetición vertical.) */
const matPiso  = new T.MeshStandardMaterial({ map: foto(AS.tex_piso,  texPiso),  roughness: 0.88, metalness: 0.0, color: 0x63615c });
const matPared = new T.MeshStandardMaterial({ map: foto(AS.tex_pared, texPared), roughness: 0.96, metalness: 0.0, color: 0x504d47 });
const matTecho = new T.MeshStandardMaterial({ map: foto(AS.tex_techo, texTecho), roughness: 1.0,  metalness: 0.0, color: 0x4a4845 });
if (matPared.map) matPared.map.repeat.set(0.95, 0.95);
if (matPiso.map)  matPiso.map.repeat.set(1.15, 1.15);
if (matTecho.map) matTecho.map.repeat.set(1.3, 1.3);
/* la tabla estaba en un naranja de mueble nuevo y era LO MÁS CLARO DEL CUADRO:
   en un pasillo negro, el ojo se va a lo más claro, y lo más claro tiene que
   ser lo que aparece — no la tabla que uno lleva siempre encima */
const matMadera= new T.MeshStandardMaterial({ map: texMadera, roughness: 0.78, metalness: 0.0, color: 0x4c4032 });
const matMetal = new T.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.34, metalness: 0.85 });
/* el bol estaba en 0xdcd7cc y a treinta centímetros de la linterna se iba a
   254 de 255: un disco blanco quemado en el medio de la pantalla, sin forma. Un
   cuenco de loza vieja no es blanco de papel. */
const matCeram = new T.MeshStandardMaterial({ color: 0x8b867d, roughness: 0.46, metalness: 0.02 });
/* ── EL AGUA VA CON `MeshPhysicalMaterial` Y ES EL ÚNICO CASO ──
   Es lo que el jugador mira todo el juego: si no refleja la linterna, no se lee
   a agua sino a pintura celeste. `transmission` cuesta una pasada más, pero
   sobre un disco de cinco centímetros eso es nada. */
/* ── Y `transmission` SE FUE, PORQUE SE MIDIÓ LO QUE COSTABA ──
   Estaba puesto con la excusa de que «sobre un disco de cinco centímetros eso
   es nada». Es falso, y de la peor manera: `transmission` renderiza la ESCENA
   ENTERA a un destino aparte una vez por cuadro, y el tamaño del objeto no
   entra en la cuenta. Medido con la misma partida, apagándolo y volviéndolo a
   prender: **7 cuadros por segundo con transmisión y 13 sin ella**, o sea que
   la mitad del presupuesto del juego se iba en el reflejo de un disco de cinco
   centímetros. La pasada extra aparece en el contador: 18 llamadas de dibujo
   contra 10, y 596 triángulos contra 336 — las mismas paredes dibujadas dos
   veces. Es la clase de costo que hay que medir apagándolo, porque no se ve en
   ningún número hasta que se apaga.
   Lo que la reemplaza hace el trabajo que el agua tiene que hacer acá: una
   superficie MUY lisa y translúcida que devuelve el reflejo especular de la
   linterna. El reflejo es lo que dice «esto es agua»; la refracción de lo que
   hay detrás de un bol opaco no la ve nadie. */
const matAgua = new T.MeshStandardMaterial({
  color: 0x8ecbe0, roughness: 0.05, metalness: 0.12,
  transparent: true, opacity: 0.88
});

/* ══════════════════════════ EL PASILLO ══════════════════════════
   Un camino de TRAMOS RECTOS que doblan. No es un laberinto y no se puede
   perder el camino: el jugador no elige por dónde va, camina solo. Lo único que
   maneja es la tabla, y todo el mapa existe para dos cosas — que las esquinas
   tapen lo que viene (que es donde se esconden los sustos) y que el pasillo se
   sienta largo.

   Y LAS ESQUINAS SON EL DISEÑO, NO LA DECORACIÓN. Un pasillo recto muestra el
   susto a diez metros y deja de asustar; una esquina lo pone a un metro y sin
   aviso. Por eso el generador garantiza un mínimo de vueltas. */
const ANCHO = 2.4, ALTO = 2.9;
const CAMINO = [];        /* {x, z, dir, largo} — dir 0..3 = +Z, +X, -Z, -X */
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
let LARGO_TOTAL = 0;
let grupoMapa = null;

/* la semilla: el mismo número da el mismo pasillo. Sin esto no se puede
   comparar una corrida con otra ni volver a ver un defecto. */
let SEM = 1;
function rnd(){ SEM = (SEM * 1664525 + 1013904223) >>> 0; return SEM / 4294967296; }
const rr = (a, b) => a + rnd() * (b - a);

/* ── EL PASILLO NO SE PUEDE CRUZAR CONSIGO MISMO ──
   Y ésta era la causa de «el personaje atraviesa paredes». Los tramos se
   tiraban al azar doblando ±90° sin mirar por dónde ya había pasado: con tramos
   de 6 a 14 metros, cuatro vueltas del mismo lado vuelven al punto de partida y
   el generador construye el tramo nuevo ENCIMA del viejo. Donde eso pasa, las
   paredes de un tramo cruzan el otro de lado a lado, y el jugador —que camina
   por el centro del pasillo y no puede elegir— las atraviesa. No era el andar:
   era el mapa.
   Se lleva una grilla de ocupación de un metro con el ancho del pasillo. Un
   tramo que pisa una celda ya ocupada se rechaza y se prueban el otro lado y
   largos cada vez más cortos. Si nada entra, el pasillo termina ahí: un pasillo
   un poco más corto es infinitamente mejor que uno que se cruza. */
const OCU = new Set();
function bandaTramo(x, z, dir, desde, hasta){
  const dx = DIRS[dir][0], dz = DIRS[dir][1];
  const r = Math.ceil(ANCHO/2);
  const out = [];
  for (let q = desde; q <= hasta; q += 1){
    const cx = x + dx*q, cz = z + dz*q;
    /* un tramo ocupa una BANDA y no una línea: sin el ancho, dos tramos
       paralelos a un metro «no se cruzan» y en el mundo comparten la pared */
    for (let a = -r; a <= r; a++)
      out.push(Math.round(cx + (-dz)*a) + ',' + Math.round(cz + (dx)*a));
  }
  return out;
}
function marcaTramo(x, z, dir, largo){
  for (const c of bandaTramo(x, z, dir, -2, largo + 2)) OCU.add(c);
}
function cabeTramo(x, z, dir, largo){
  /* las celdas del arranque son las de la esquina y por definición las comparte
     con el tramo anterior, así que no cuentan como choque */
  const propias = new Set(bandaTramo(x, z, dir, -3, 3));
  for (const c of bandaTramo(x, z, dir, -2, largo + 2))
    if (OCU.has(c) && !propias.has(c)) return false;
  return true;
}

/* ── Y LA PROHIBICIÓN DE CRUZARSE HIZO EL PASILLO MÁS CORTO ──
   Medido apenas entró: `{tramos: 6, metros: 57}` contra los 120 pedidos. Es la
   consecuencia obvia y aun así no la vi hasta medirla — un camino que no puede
   pisar donde ya pisó se acorrala, y cuando ningún giro entra, el generador
   cortaba ahí. O sea que arreglar «atraviesa paredes» dejaba la mitad del
   pasillo sin construir, y como la meta era la constante 120, el jugador
   caminaba treinta metros más allá del final.
   Se arregla con dos cosas y las dos son necesarias:
     · SE REINTENTA EL CAMINO ENTERO. Un intento que se acorrala no se arregla
       desde adentro; con otra semilla el mismo generador sale. Doscientos
       intentos son un milisegundo y no hace falta ser más inteligente que eso.
     · LA META SALE DEL PASILLO QUE SE CONSTRUYÓ, no de una constante. Si algún
       día ningún intento llega, el juego será más corto pero terminará donde
       hay puerta — y no en el aire, treinta metros después. */
function armaCamino(semilla, metros){
  let mejor = null;
  for (let intento = 0; intento < 200; intento++){
    const r = intentaCamino((semilla + intento*2654435761) >>> 0, metros);
    if (!mejor || r.metros > mejor.metros){ mejor = r; mejor.tramos = CAMINO.slice(); }
    if (r.metros >= metros) return r;
  }
  /* ninguno llegó: se rearma el mejor */
  CAMINO.length = 0;
  for (const t of mejor.tramos) CAMINO.push(t);
  LARGO_TOTAL = mejor.metros;
  return { tramos: CAMINO.length, vueltas: mejor.vueltas, metros: mejor.metros };
}

function intentaCamino(semilla, metros){
  SEM = semilla >>> 0;
  CAMINO.length = 0;
  OCU.clear();
  let x = 0, z = 0, dir = 0, total = 0, vueltas = 0;
  /* el primer tramo es largo y recto A PROPÓSITO: los primeros diez segundos el
     jugador está aprendiendo a no volcar el bol, y meterle una esquina ahí es
     cobrarle un susto que todavía no puede pagar */
  let largo = 11;
  while (total < metros){
    CAMINO.push({ x, z, dir, largo });
    marcaTramo(x, z, dir, largo);
    x += DIRS[dir][0] * largo; z += DIRS[dir][1] * largo;
    total += largo;
    /* dobla a un lado o al otro, nunca 180: un pasillo que se dobla sobre sí
       mismo se cruza consigo mismo y se ve el mismo tramo dos veces */
    const primero = rnd() < 0.5 ? 1 : 3;
    let puesto = false;
    for (const giro of [primero, 4 - primero]){
      const d2 = (dir + giro) % 4;
      for (let L = Math.round(rr(7, 14)); L >= 5; L -= 2){
        if (cabeTramo(x, z, d2, L)){ dir = d2; largo = L; puesto = true; break; }
      }
      if (puesto) break;
    }
    if (!puesto) break;
    vueltas++;
  }
  LARGO_TOTAL = total;
  return { tramos: CAMINO.length, vueltas, metros: total };
}


/* dónde está el jugador a `d` metros de recorrido, y hacia dónde mira.
   Una sola función: la usan la cámara, el andar, los sustos y las sondas. Con
   dos cuentas, el susto aparecería en un sitio distinto del que se camina. */
function enCamino(d){
  let q = d;
  for (let i = 0; i < CAMINO.length; i++){
    const t = CAMINO[i];
    if (q <= t.largo || i === CAMINO.length - 1){
      const dx = DIRS[t.dir][0], dz = DIRS[t.dir][1];
      return { x: t.x + dx*q, z: t.z + dz*q, dx, dz, tramo: i,
               resta: t.largo - q, dir: t.dir };
    }
    q -= t.largo;
  }
  return { x: 0, z: 0, dx: 0, dz: 1, tramo: 0, resta: 0, dir: 0 };
}
/* ── LA ESQUINA SE DOBLA EN EL CAMINO Y NO SÓLO EN LA MIRADA ──
   Antes la POSICIÓN seguía la quebrada exacta —codo de 90° en el vértice— y sólo
   el RUMBO se suavizaba a lo largo de 1,7 m. O sea que durante casi dos metros
   el jugador miraba en diagonal mientras el cuerpo seguía yendo derecho por el
   tramo viejo: en pantalla eso es caminar de costado, y es la otra mitad de «no
   camina hacia adelante».
   Ahora la esquina es una curva: en la ventana de ±R metros alrededor del
   vértice se funden las dos rectas con un suavizado, y el pasillo tiene 1,2 m
   de medio ancho, así que la curva pasa holgada.
   Y EL RUMBO SALE DE LA DERIVADA DE ESA MISMA CURVA, no de una segunda cuenta:
   así «hacia dónde mira» y «hacia dónde avanza» son la misma cosa POR
   CONSTRUCCIÓN y no pueden volver a desincronizarse. */
const R_ESQ = 1.7;
function puntoCamino(d){
  const a = enCamino(d);
  const t = CAMINO[a.tramo];
  const adelante = a.resta < R_ESQ && a.tramo < CAMINO.length - 1;
  const atras = (t.largo - a.resta) < R_ESQ && a.tramo > 0;
  if (!adelante && !atras) return { x: a.x, z: a.z };
  let iA, iB, s;                 /* tramo previo, tramo siguiente, distancia al vértice */
  if (adelante){ iA = a.tramo; iB = a.tramo + 1; s = -a.resta; }
  else { iA = a.tramo - 1; iB = a.tramo; s = t.largo - a.resta; }
  const tA = CAMINO[iA], tB = CAMINO[iB];
  const vx = tA.x + DIRS[tA.dir][0]*tA.largo, vz = tA.z + DIRS[tA.dir][1]*tA.largo;
  const ax = DIRS[tA.dir][0], az = DIRS[tA.dir][1];
  const bx = DIRS[tB.dir][0], bz = DIRS[tB.dir][1];
  const u = Math.max(0, Math.min(1, (s + R_ESQ) / (2*R_ESQ)));
  const w = u*u*(3 - 2*u);
  return { x: vx + ax*s*(1-w) + bx*s*w, z: vz + az*s*(1-w) + bz*s*w };
}
function rumboEn(d){
  /* diferencia finita sobre la curva: seis centímetros alcanzan, y así no hay
     que derivar a mano un suavizado que se puede medir */
  const h = 0.06;
  const p0 = puntoCamino(Math.max(0, d - h)), p1 = puntoCamino(d + h);
  const dx = p1.x - p0.x, dz = p1.z - p0.z;
  if (Math.abs(dx) + Math.abs(dz) < 1e-9){
    const t = CAMINO[enCamino(d).tramo];
    return Math.atan2(DIRS[t.dir][0], DIRS[t.dir][1]);
  }
  return Math.atan2(dx, dz);
}

function fundir(piezas, mat){
  const gs = [];
  for (const p of piezas){
    const g = p.g.clone();
    if (p.u) { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++)
      uv.setXY(i, uv.getX(i)*p.u[0], uv.getY(i)*p.u[1]); uv.needsUpdate = true; }
    const m = new T.Matrix4();
    m.compose(new T.Vector3(p.p[0], p.p[1], p.p[2]),
              new T.Quaternion().setFromEuler(new T.Euler(...(p.r || [0,0,0]))),
              new T.Vector3(...(p.s || [1,1,1])));
    g.applyMatrix4(m);
    gs.push(g);
  }
  if (!gs.length) return null;
  const out = gs[0];
  return gs.length === 1 ? out : unir(gs);
}
/* unión a mano de geometrías no indexadas con los mismos atributos: es lo único
   que se necesita y evita bajar `BufferGeometryUtils` de un CDN */
function unir(gs){
  const claves = ['position', 'normal', 'uv'];
  let n = 0;
  for (const g of gs){ if (g.index) { const d = g.toNonIndexed(); g.dispose(); gs[gs.indexOf(g)] = d; } }
  for (const g of gs) n += g.attributes.position.count;
  const out = new T.BufferGeometry();
  for (const c of claves){
    const tam = gs[0].attributes[c].itemSize;
    const arr = new Float32Array(n * tam);
    let o = 0;
    for (const g of gs){ arr.set(g.attributes[c].array, o); o += g.attributes[c].array.length; }
    out.setAttribute(c, new T.BufferAttribute(arr, tam));
  }
  return out;
}

const geoPlano = new T.PlaneGeometry(1, 1);
const geoCaja = new T.BoxGeometry(1, 1, 1);
const geoCil = new T.CylinderGeometry(0.5, 0.5, 1, 12);

function armaMapa(){
  if (grupoMapa){ escena.remove(grupoMapa); grupoMapa = null; }
  const g = new T.Group();
  const piso = [], pared = [], techo = [], marco = [];

  for (const t of CAMINO){
    const dx = DIRS[t.dir][0], dz = DIRS[t.dir][1];
    const cx = t.x + dx*t.largo/2, cz = t.z + dz*t.largo/2;
    const ang = Math.atan2(dx, dz);
    /* el tramo se hace en su propio marco y se rota: así el mismo código sirve
       para los cuatro rumbos y no hay cuatro casos que se puedan desincronizar */
    const L = t.largo + ANCHO;           /* se pasa de largo para tapar la esquina */
    piso.push({ g: geoPlano, p:[cx, 0, cz], r:[-Math.PI/2, 0, ang],
                s:[ANCHO, L, 1], u:[ANCHO/1.2, L/1.2] });
    techo.push({ g: geoPlano, p:[cx, ALTO, cz], r:[Math.PI/2, 0, -ang],
                 s:[ANCHO, L, 1], u:[ANCHO/1.5, L/1.5] });
    for (const lado of [-1, 1]){
      const px = cx + (-dz)*lado*ANCHO/2, pz = cz + (dx)*lado*ANCHO/2;
      pared.push({ g: geoPlano, p:[px, ALTO/2, pz],
                   r:[0, ang + (lado > 0 ? Math.PI : 0) + Math.PI, 0],
                   s:[L, ALTO, 1], u:[L/1.4, ALTO/1.4] });
    }
  }
  /* la puerta del final: es lo único que se ve de lejos y es toda la meta */
  const f = enCamino(LARGO_TOTAL - 0.15);
  marco.push({ g: geoCaja, p:[f.x, 1.05, f.z], s:[1.1, 2.1, 0.12] });

  const pon = (arr, mat, sombra) => {
    const geo = fundir(arr, mat); if (!geo) return null;
    const m = new T.Mesh(geo, mat);
    m.castShadow = !!sombra; m.receiveShadow = true;
    g.add(m); return m;
  };
  pon(piso, matPiso, false);
  pon(pared, matPared, true);
  pon(techo, matTecho, false);
  pon(marco, matMadera, true);

  escena.add(g);
  grupoMapa = g;
}

/* ══════════════════════ EL GIROSCOPIO ══════════════════════
   Es el mecanismo entero del juego, así que hay cuatro cosas que hacer bien y
   ninguna es obvia.

   1. NO SE MIDE LA INCLINACIÓN ABSOLUTA, SE MIDE LA DESVIACIÓN CONTRA UNA
      POSICIÓN CALIBRADA. Nadie sostiene el teléfono horizontal como una bandeja
      de verdad: se sostiene a sesenta o setenta grados, que es donde se ve la
      pantalla. Si «derecho» fuera el plano horizontal, el bol estaría volcado
      desde el primer cuadro. El jugador dice cómo lo va a llevar y ESO pasa a
      ser el cero.

   2. NO SE SUAVIZA. Es lo contrario de todo lo que se hizo en los otros juegos
      de este repo: acá la señal de alta frecuencia —el respingo, el temblor de
      la mano cuando se asusta— ES EL JUEGO. Filtrarla es sacarle al juego su
      única razón de existir. Lo único que se filtra es la deriva lenta del
      sensor, y con una constante larguísima.

   3. LOS EULER DE `deviceorientation` SE DAN VUELTA CERCA DE LOS POLOS. Con el
      teléfono casi vertical —que es como se juega— `alpha` y `gamma` se pelean
      y `gamma` salta de 90 a -90. Por eso NO se restan ángulos: se arma el
      cuaternión de la orientación, se compone con el inverso del calibrado, y
      se lee la desviación de ESE. Un cuaternión no tiene polos.

   4. Y HAY QUE PEDIR PERMISO, en iOS, DENTRO de un gesto. Sin eso el evento no
      llega nunca y el juego se queda quieto sin decir por qué. */
const GIRO = {
  hay: false, listo: false, permiso: 'sin pedir',
  q: new T.Quaternion(),            /* orientación cruda */
  cal: new T.Quaternion(),          /* la posición «derecho» */
  calInv: new T.Quaternion(),
  incX: 0, incZ: 0,                 /* desviación en radianes: adelante-atrás y costado */
  crudo: { a: 0, b: 0, g: 0 },
  ultimo: 0
};
const _qE = new T.Quaternion(), _eE = new T.Euler(), _qZ = new T.Quaternion();
const _q90 = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), -Math.PI/2);

function qDeOrientacion(a, b, g, orient){
  /* la receta de la especificación: Z(alpha) · X(beta) · Y(gamma), y después el
     giro de la pantalla y los -90 grados que llevan del marco del dispositivo
     al marco del mundo */
  _eE.set(b * Math.PI/180, g * Math.PI/180, -a * Math.PI/180, 'YXZ');
  _qE.setFromEuler(_eE);
  _qE.multiply(_q90);
  _qZ.setFromAxisAngle(new T.Vector3(0, 0, 1), -(orient || 0) * Math.PI/180);
  _qE.multiply(_qZ);
  return _qE;
}

function onOrientacion(ev){
  if (ev.alpha === null && ev.beta === null && ev.gamma === null) return;
  GIRO.hay = true;
  GIRO.ultimo = performance.now();
  GIRO.crudo.a = ev.alpha || 0; GIRO.crudo.b = ev.beta || 0; GIRO.crudo.g = ev.gamma || 0;
  const orient = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  GIRO.q.copy(qDeOrientacion(GIRO.crudo.a, GIRO.crudo.b, GIRO.crudo.g, orient));
  if (!GIRO.listo) return;
  calculaInclinacion();
}

const _vArriba = new T.Vector3();
function calculaInclinacion(){
  /* la desviación contra el calibrado, EN CUATERNIÓN */
  _qE.copy(GIRO.calInv).multiply(GIRO.q);
  /* ══════ ACÁ ESTABA EL «TODO INVERTIDO», Y ERA EL EJE EQUIVOCADO ══════
     Tomaba el eje **Y** del marco desviado como la normal de la tabla. El eje Y
     de este cuaternión es EL BORDE DE ARRIBA DE LA PANTALLA, no la cara del
     teléfono: `qDeOrientacion` termina en el marco de una cámara —X a la
     derecha de la pantalla, Y arriba de la pantalla, Z saliendo hacia la cara—.
     La consecuencia se puede escribir: girando el teléfono en su propio plano
     (como un volante), la Y desviada se va a −X y el juego lee «la tabla se
     cayó para la izquierda» cuando el jugador no inclinó NADA; y en cambio
     inclinando de verdad hacia un lado —que es girar alrededor del eje de
     arriba de la pantalla— la Y no se mueve y el juego no lee nada.
     El teléfono se lleva COMO UNA BANDEJA, así que la normal de la tabla es la
     PANTALLA: el eje Z. Con la normal bien, «derecha» e «izquierda» salen de
     los ejes de la pantalla y las dos cosas coinciden con la mano.

     Y ESTO NO ES UN CAMBIO DE SIGNO: es cambiar qué eje se mide. Un cambio de
     signo habría arreglado un caso y roto el otro, que es lo que pasa cuando se
     invierten controles a ciegas. */
  _vArriba.set(0, 0, 1).applyQuaternion(_qE);
  const nx = _vArriba.x, ny = _vArriba.y;
  /* de los ejes de la PANTALLA a los ejes de la TABLA. La tabla vive en el
     marco de la cámara: +X a la derecha y +Z hacia el jugador, así que «el
     fondo de la tabla» es −Z y le corresponde el arriba de la pantalla. Y si el
     cuadro se dibuja girado, los dos ejes se giran con él — por eso pasa por
     `GIRO_VIS`, que es el ángulo con el que se está dibujando. */
  const c = Math.cos(GIRO_VIS), s2 = Math.sin(GIRO_VIS);
  const rx = nx*c + ny*s2;          /* componente en el «derecha» que ve el jugador */
  const ry = -nx*s2 + ny*c;         /* componente en el «arriba» que ve el jugador */
  GIRO.incX = rx;
  GIRO.incZ = -ry;
}

function calibrar(){
  GIRO.cal.copy(GIRO.q);
  GIRO.calInv.copy(GIRO.cal).invert();
  GIRO.listo = true;
  calculaInclinacion();
}

async function pedirGiro(){
  const D = window.DeviceOrientationEvent;
  if (!D){ GIRO.permiso = 'no existe'; return false; }
  try {
    if (typeof D.requestPermission === 'function'){
      /* iOS: tiene que ser DENTRO del gesto que lo pidió, si no lo rechaza sin
         mostrar el cartel */
      const r = await D.requestPermission();
      GIRO.permiso = r;
      if (r !== 'granted') return false;
    } else {
      GIRO.permiso = 'no hace falta';
    }
  } catch(e){ GIRO.permiso = 'error: ' + e.message; return false; }
  addEventListener('deviceorientation', onOrientacion, true);
  return true;
}

/* ── EL RESPALDO, QUE NO ES UN ADORNO ──
   En una notebook, o con el permiso negado, no hay giroscopio. Sin respaldo el
   juego es injugable y no se puede ni probar. Se arrastra el dedo y eso inclina
   la tabla; la sensación no es la misma —no hay respingo involuntario— pero el
   juego existe. */
const DEDO = { on: false, x: 0, y: 0, ix: 0, iz: 0 };
function arrastreInicio(e){
  if (GIRO.hay) return;
  const t = e.touches ? e.touches[0] : e;
  DEDO.on = true; DEDO.x = t.clientX; DEDO.y = t.clientY;
}
function arrastreMueve(e){
  if (!DEDO.on || GIRO.hay) return;
  const t = e.touches ? e.touches[0] : e;
  const k = 1 / Math.max(240, Math.min(W, H));
  /* ── EL DEDO TAMBIÉN SE GIRA CON EL CUADRO ──
     `clientX/clientY` vienen en coordenadas de la VENTANA, y el juego puede
     estar dibujado 90° girado adentro. Sin esta rotación, con el teléfono de
     costado arrastrar «a la derecha» —que para el jugador es a la derecha—
     mueve la tabla hacia adelante. Es el mismo cruce de ejes que tenía el
     giroscopio, en la otra entrada. */
  const c = Math.cos(GIRO_VIS), s2 = Math.sin(GIRO_VIS);
  const px = t.clientX - DEDO.x, py = t.clientY - DEDO.y;
  const rx = px*c + py*s2, ry = -px*s2 + py*c;
  DEDO.ix += rx * k * 1.6;
  DEDO.iz += ry * k * 1.6;
  DEDO.ix = Math.max(-0.9, Math.min(0.9, DEDO.ix));
  DEDO.iz = Math.max(-0.9, Math.min(0.9, DEDO.iz));
  DEDO.x = t.clientX; DEDO.y = t.clientY;
  e.preventDefault();
}
function arrastreFin(){ DEDO.on = false; }
addEventListener('touchstart', arrastreInicio, { passive: true });
addEventListener('touchmove', arrastreMueve, { passive: false });
addEventListener('touchend', arrastreFin, { passive: true });
addEventListener('mousedown', arrastreInicio);
addEventListener('mousemove', arrastreMueve);
addEventListener('mouseup', arrastreFin);

/* la inclinación que el juego consume, venga de donde venga.
   Devuelve LA NORMAL DE LA TABLA proyectada: (x, z) es hacia dónde se recuesta
   el «arriba» de la tabla. Todo lo que la usa —la física del bol y el dibujo de
   la tabla— tiene que leerla con ese significado y no como «pendiente». */
function inclinacion(){
  const s = CFG.sens === 'suave' ? 0.72 : CFG.sens === 'dura' ? 1.5 : 1.0;
  if (GIRO.hay && GIRO.listo) return { x: GIRO.incX * s, z: GIRO.incZ * s };
  /* el dedo: arrastrar a la derecha recuesta la tabla a la derecha, y arrastrar
     hacia abajo la recuesta hacia el jugador (+Z de la tabla) */
  return { x: DEDO.ix * s, z: DEDO.iz * s };
}

/* ══════════════════ LA TABLA, EL BOL Y EL AGUA ══════════════════
   Es la mitad del juego. Tres cuerpos encadenados y cada uno se pierde de una
   forma distinta:

     · el BOL se desliza sobre la tabla   → si llega al borde, se cae y perdés
     · el AGUA chapotea dentro del bol    → si se derrama toda, perdés
     · y la TABLA es lo único que manejás

   DOS CUERPOS Y NO UNO, y ahí está el diseño: si el bol estuviera clavado a la
   tabla, el juego sería «no inclines». Con el bol suelto, inclinar de más lo
   MANDA, y para frenarlo hay que inclinar al revés en el momento justo — o sea
   que se puede corregir un error, y corregir es lo que hace que haya destreza y
   no sólo castigo. */
const TABLA = { r: 0.30 };                 /* radio útil: más allá, el bol se cae */
const BOL = {
  x: 0, z: 0, vx: 0, vz: 0,                /* posición sobre la tabla, en metros */
  agua: 1,                                 /* 1 = lleno */
  ox: 0, oz: 0, ovx: 0, ovz: 0,            /* la ola de adentro */
  cayo: false, derramo: 0
};
/* g está bajo a propósito. Con 9,8 el bol cruza los treinta centímetros en
   medio segundo y no hay forma humana de corregir: se vuelve un juego de no
   respirar. Con 3,4 hay como un segundo y medio de margen, que es el tiempo que
   tarda una persona en darse cuenta de que se está yendo y reaccionar. */
const G_BOL = 3.4;
const ROCE_BOL = 1.9;
/* la ola: un resorte amortiguado dentro del bol. Su frecuencia está DEBAJO de
   la del bol a propósito, así que después de un susto el agua sigue moviéndose
   cuando el bol ya se frenó — y ese resto es el que te derrama encima. */
const OLA_W = 7.4, OLA_Z = 0.28, R_BOL = 0.075;

function pasoBol(dt, sacudida){
  const inc = inclinacion();
  /* ══════ FÍSICA DE VERDAD, Y EL SIGNO ESTABA AL REVÉS ══════
     Estaba en `ax = -inc.x * G`, o sea que el bol se iba en contra de donde se
     recuesta la tabla. Es exactamente al revés, y se comprueba con un plato:
     inclinar el plato con el lado derecho ABAJO deja su normal apuntando
     arriba-y-A LA DERECHA, y la bola rueda a la derecha. La bola va SIEMPRE
     hacia donde se recuesta la normal.
     Y la cuenta no es «la componente por g» sino la proyección de la gravedad
     sobre el plano, que es lo que de verdad acelera a un cuerpo apoyado:

         a = g − (g·n)·n        con g = (0, −G, 0) y n unitaria

     de donde las dos componentes horizontales quedan a = G·ny·(nx, nz). El
     factor `ny` es la parte que no está en ninguna aproximación de ángulo
     chico, y es la que hace que la cuenta se porte bien en todo el rango: con
     la tabla casi vertical, `ny` tiende a cero y la aceleración también, en vez
     de crecer sin límite como haría un seno mal usado. */
  const nx = inc.x, nz = inc.z;
  const ny = Math.sqrt(Math.max(0, 1 - nx*nx - nz*nz));
  let ax = G_BOL * ny * nx, az = G_BOL * ny * nz;
  if (sacudida){ ax += sacudida.x; az += sacudida.z; }
  BOL.vx += ax * dt; BOL.vz += az * dt;
  const f = Math.min(1, ROCE_BOL * dt);
  BOL.vx -= BOL.vx * f; BOL.vz -= BOL.vz * f;
  BOL.x += BOL.vx * dt; BOL.z += BOL.vz * dt;

  const d = Math.hypot(BOL.x, BOL.z);
  if (d > TABLA.r && !BOL.cayo){ BOL.cayo = true; }

  /* ── EL AGUA: LA OLA SIGUE A LA ACELERACIÓN DEL BOL, NO A LA INCLINACIÓN ──
     Si siguiera a la inclinación, inclinar despacio derramaría igual que un
     sacudón, y eso es falso: el agua se sale cuando algo CAMBIA de golpe. */
  const oax = -OLA_W*OLA_W*BOL.ox - 2*OLA_Z*OLA_W*BOL.ovx - ax*0.55;
  const oaz = -OLA_W*OLA_W*BOL.oz - 2*OLA_Z*OLA_W*BOL.ovz - az*0.55;
  BOL.ovx += oax * dt; BOL.ovz += oaz * dt;
  BOL.ox += BOL.ovx * dt; BOL.oz += BOL.ovz * dt;
  const o = Math.hypot(BOL.ox, BOL.oz);
  /* se derrama sólo lo que se pasa del borde del bol, y en proporción: así un
     roce cuesta una gota y un sacudón cuesta un chorro */
  if (o > R_BOL * 0.62){
    const exceso = o - R_BOL * 0.62;
    BOL.agua = Math.max(0, BOL.agua - exceso * 2.6 * dt * 60 * dt);
    BOL.derramo = Math.min(1, exceso / (R_BOL*0.5));
    /* y la ola se recorta al borde: sin esto crece sin techo y el bol se vacía
       de un cuadro al otro */
    const k = (R_BOL*0.62) / o;
    BOL.ox *= k; BOL.oz *= k;
  } else BOL.derramo = Math.max(0, BOL.derramo - dt*3);
  return BOL;
}

function reiniciaBol(){
  BOL.x = BOL.z = BOL.vx = BOL.vz = 0;
  BOL.ox = BOL.oz = BOL.ovx = BOL.ovz = 0;
  BOL.agua = 1; BOL.cayo = false; BOL.derramo = 0;
}

/* ── LO QUE SE VE: LA TABLA Y EL BOL EN LAS MANOS ── */
let gTabla = null, mBol = null, mAgua = null, gCae = null;
function armaTabla(){
  if (gTabla) return;
  const g = new T.Group();
  /* ── LA TABLA NO PROYECTA SOMBRA, Y NO ES UN AHORRO ──
     Está a setenta centímetros del lente y la linterna sale del lente: con
     `castShadow` puesto, la tabla le tapa el cono a TODO el pasillo — medido en
     la captura, el corredor entero quedaba negro y sólo se veía el bol. Una
     tabla que uno lleva en las manos no puede hacerle sombra a lo que uno mira. */
  const t = new T.Mesh(new T.BoxGeometry(0.62, 0.020, 0.42), matMadera);
  t.castShadow = false; t.receiveShadow = true;
  g.add(t);
  /* un listón en cada punta: es lo que hace que se lea a tabla y no a rectángulo
     flotando, y de paso dice dónde están los bordes que importan */
  for (const s of [-1, 1]){
    const l = new T.Mesh(new T.BoxGeometry(0.62, 0.026, 0.022), matMadera);
    l.position.set(0, 0.022, s*0.199);
    l.castShadow = false;
    g.add(l);
  }
  gTabla = g;
  cam.add(g);

  const b = new T.Group();
  const cuenco = new T.Mesh(new T.CylinderGeometry(R_BOL, R_BOL*0.76, 0.058, 20, 1, true), matCeram);
  cuenco.material = matCeram.clone(); cuenco.material.side = T.DoubleSide;
  const base = new T.Mesh(new T.CylinderGeometry(R_BOL*0.76, R_BOL*0.76, 0.006, 20), matCeram);
  base.position.y = -0.029;
  b.add(cuenco); b.add(base);
  b.castShadow = false;
  mAgua = new T.Mesh(new T.CircleGeometry(R_BOL*0.93, 24), matAgua);
  mAgua.rotation.x = -Math.PI/2;
  b.add(mAgua);
  mBol = b;
  gTabla.add(b);

  /* ── LA TABLA VIVE EN SU PROPIA CAPA, CON SU PROPIA LUZ ──
     La linterna sale del lente y la tabla está a sesenta y seis centímetros del
     lente: le entra el centro del haz de lleno. Medido con `brillo()`, el bol
     salía en 248 de 255 —un disco blanco sin forma— haya la pared que haya
     detrás, y bajarle el color al material no alcanza porque el problema no es
     el color, es que está adentro del foco.
     En three.js una luz sólo alcanza a los objetos que comparten capa con ella.
     La tabla, el bol y el agua pasan a la capa 2; la linterna se queda en la 0,
     así que deja de tocarlos; y la capa 2 tiene una luz propia, tenue y cálida,
     que es la que se merece algo que uno lleva en las manos. La cámara habilita
     las dos capas, si no la tabla no se dibujaría. */
  gTabla.traverse(o => o.layers.set(2));
  cam.layers.enable(2);
}

function ponTabla(){
  if (!gTabla) return;
  const inc = inclinacion();
  /* la tabla se dibuja INCLINADA lo que dice el sensor, y ésa es la única
     realimentación honesta: el jugador tiene que ver lo mismo que el bol siente */
  /* la tabla se levanta hasta que se vea ENTERA: a −0,40 y 0,62 el borde de
     abajo caía fuera del cuadro y sólo se veía el bol flotando. Medido a 66° de
     campo, a 0,70 m entran 0,91 m de alto, así que −0,30 deja la tabla en el
     tercio de abajo con los dos listones adentro. */
  /* ── Y LA TABLA SE MOVIÓ AL PASAR A HORIZONTAL ──
     Estaba en (0, −0,335, −0,66), medido para un cuadro vertical donde a 0,66 m
     entran ±0,43 m de alto. Horizontal entran ±0,32, así que el borde de abajo
     quedaba fuera del cuadro y sólo se veía el bol flotando. A −0,24 la tabla
     entera cae en el tercio de abajo con los dos listones adentro, y los 0,62 m
     de ancho ocupan poco más de la mitad del ancho visible. */
  gTabla.position.set(0, -0.205, -0.52);
  gTabla.rotation.set(Math.asin(Math.max(-1, Math.min(1, inc.z))) * 0.9,
                      0,
                      -Math.asin(Math.max(-1, Math.min(1, inc.x))) * 0.9);
  const y = 0.011 + 0.029;
  mBol.position.set(BOL.x, y, BOL.z);
  /* la ola: el disco de agua se inclina y baja con lo que queda */
  mAgua.position.y = -0.006 + BOL.agua * 0.036;
  mAgua.rotation.z = -BOL.ox * 5.5;
  mAgua.rotation.x = -Math.PI/2 + BOL.oz * 5.5;
  mAgua.scale.setScalar(0.55 + BOL.agua * 0.45);
  mBol.visible = !BOL.cayo;
}

/* ══════════════════════════ LA LUZ ══════════════════════════
   Una sola linterna que va en la cámara, y nada más. En un pasillo negro la luz
   ES el mapa: lo que la linterna no toca no existe, y por eso una esquina puede
   esconder cualquier cosa a un metro. */
/* ── 26 CANDELAS ERA UNA LINTERNA DE OBRA ──
   Con las paredes dibujadas por código no se notaba: un gris plano aguanta
   cualquier luz. Con la foto del revoque, 26 a un metro devolvía un muro blanco
   quemado de punta a punta y el pasillo dejaba de tener oscuridad, que es su
   único material. 12 deja el charco de luz a dos metros y el resto en negro. */
/* ── EL NÚMERO QUE MANDA NO ES LA INTENSIDAD, ES `decay` ──
   Con 26 y decay 1,25 la pared de un metro salía blanca quemada y a los seis
   metros no llegaba nada: 26/1^1,25 = 26 contra 26/6^1,25 = 2,8. Bajar la
   intensidad a 12 arregló lo quemado y dejó el pasillo NEGRO — medido con
   `brillo()`, 30,6 de brillo medio y 23 % de pantalla encendida en tres puntos
   distintos, o sea un charco de dos metros y después nada.
   Las dos cosas son el mismo defecto: un rango dinámico demasiado empinado. Con
   decay 0,90 la caída de uno a seis metros pasa de 9,3 veces a 5,1, así que
   entra el pasillo entero sin quemar lo de cerca. Y sí, físicamente una luz cae
   con el cuadrado; una linterna en un juego de terror tiene que MOSTRAR el
   pasillo, y ése es el trabajo. */
/* el ángulo subió de 0,66 a 0,88 rad al pasar el juego a horizontal: el campo
   pasó de 33° a 93° de ancho y un cono de 76° dejaba los dos tercios laterales
   del cuadro en negro. Una linterna no ilumina todo lo que se ve, pero tampoco
   una franja en el medio. */
const luz = new T.SpotLight(0xffe9cf, 22, 22, 0.88, 0.55, 0.90);
luz.position.set(0.05, -0.12, 0);
luz.target.position.set(0, -0.18, -1);
luz.castShadow = true;
luz.shadow.mapSize.set(1024, 1024);
luz.shadow.camera.near = 0.1; luz.shadow.camera.far = 16;
luz.shadow.bias = -0.0022; luz.shadow.normalBias = 0.028;
luz.layers.enable(3);      /* la linterna también ilumina a los sustos que son modelo */
cam.add(luz); cam.add(luz.target);
/* la luz de la capa 2: sólo la tabla, el bol y el agua. Va un poco a la
   izquierda y arriba para que el bol tenga un lado iluminado y otro en sombra —
   con la luz en el eje el bol queda plano y no se ve cuánto se está yendo. */
const luzTabla = new T.PointLight(0xffe3c4, 1.15, 2.4, 1.0);
luzTabla.position.set(-0.16, 0.10, -0.05);
luzTabla.layers.set(2);
cam.add(luzTabla);
/* un piso mínimo para que lo que está fuera del cono no sea negro absoluto: sin
   esto no se ve NADA a los costados y el pasillo deja de tener ancho */
const amb = new T.HemisphereLight(0x33383f, 0x14120f, 0.32);
amb.layers.enable(2);            /* el ambiente sí llega a la tabla */
amb.layers.enable(3);            /* y a los sustos que son modelo */
escena.add(amb);

/* ══════════════════════════ LOS SUSTOS ══════════════════════════
   Cuarenta y cuatro, y lo que los hace cuarenta y cuatro no son cuarenta y
   cuatro assets: son SIETE FAMILIAS combinadas con dónde y cuándo pasan. Un catálogo de treinta
   y dos assets distintos sería medio mega de descarga para cosas que se ven
   0,4 segundos; lo que el jugador recuerda no es la cara, es el susto.

   Y ACÁ ESTÁ LA REGLA QUE LOS ORDENA A TODOS: un susto tiene que producir un
   RESPINGO, no un problema. No te toca, no te frena, no te empuja. Lo único que
   hace es lograr que tu mano se mueva sola — y de eso se encarga el giroscopio.
   Un susto que además te empujara sería castigarte dos veces por lo mismo. */
