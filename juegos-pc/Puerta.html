<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PUERTA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07070b;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#f2eee6;user-select:none;-webkit-user-select:none;touch-action:none}

/* ══════════ EL MARCO ES VERTICAL Y NO SE GIRA ══════════
   Al revés de los juegos 3D de este repo, que se dibujan apaisados adentro de un
   teléfono vertical. Un minijuego de TikTok se juega EN LA APP, con el teléfono
   como uno lo tiene y un solo pulgar: girarlo sería pedirle al jugador que
   cambie de postura para algo que dura cuarenta segundos.
   El lienzo se dibuja con el ANCHO clavado en 720 y el alto según la forma de
   la pantalla —lo calcula `medir()`— así que el marco la llena entera y una
   moneda de 40 px mide lo mismo en un teléfono de 360 y en uno de 1440. */
#caja{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  overflow:hidden;background:#000;
  /* el color de acento lo pone cada juego (PIEL.ac). Los cinco comparten la
     estructura del menu y NO el color: cinco menus del mismo gris se leen a
     cinco pantallas de opciones de la misma aplicacion. */
  --ac:#f2eee6}
canvas{display:block;width:100%;height:100%}
/* ══════════ EL TELON DEL MENU ══════════
   En el menu el lienzo no dibuja nada, asi que sin esto el menu es un panel
   gris sobre negro — o sea la pantalla de opciones de cualquier cosa. Es el
   MISMO fondo generado que usa la partida, asi que el menu y el juego se ven
   del mismo sitio, y va en DOM y no en el lienzo porque no hay que redibujarlo
   sesenta veces por segundo para que quede quieto. */
#tela{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;
  transition:opacity .6s;z-index:1}
#tela.on{opacity:1}

/* ══════════ LO QUE VA EN DOM Y LO QUE VA EN EL LIENZO ══════════
   En el lienzo: el juego y las cinemáticas. En DOM: sólo el texto que hay que
   TRADUCIR y que tiene que quedar nítido en cualquier densidad de pantalla.
   Un texto dibujado en un lienzo de 720 se ve borroso en un teléfono de 1440, y
   el nombre del juego es justo lo que se mira primero. */
/* ── EL PANEL LLEVA VELO, Y NO ES UN GUSTO ──
   Sin fondo, el panel de final quedaba escrito ENCIMA de la partida: medido en
   la captura, «RÉCORD NUEVO» cruzado con la persona y con los dos botones del
   juego. Y un panel opaco tampoco sirve — la calle de atrás es la mitad de lo
   que hace que el menú se vea de este juego y no de una aplicación. Velo al
   82 %: se lee todo y el fondo sigue estando. */
.pan{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:2.8vh;padding:6vw;text-align:center;z-index:5;
  /* degrade y no opacidad pareja: arriba se deja ver el arte del telon y abajo se
     cierra, que es donde estan los botones y donde hay que leer */
  background:linear-gradient(180deg,rgba(7,7,11,.34) 0%,rgba(7,7,11,.74) 44%,
    rgba(7,7,11,.93) 100%)}
.pan.on{display:flex}
/* ── EL TAMAÑO DEL TÍTULO SALE DEL LARGO DEL NOMBRE ──
   Con 11vw clavado, «SEGUIDORES» —diez letras con un cuarto de em de espaciado
   entre cada una— medía mas que el marco y salía CORTADO por los dos lados,
   medido en la captura del menú. `--h1` lo calcula el arranque a partir de la
   cantidad de letras, así que el próximo nombre largo entra solo. */
.pan h1{font-size:clamp(26px,var(--h1,11vw),64px);letter-spacing:.26em;font-weight:800;
  text-indent:.26em;line-height:1;
  /* el resplandor del titulo sale del acento del juego, asi que el nombre se lee
     del color del juego sin tener que generar una imagen por titulo */
  text-shadow:0 0 30px var(--ac),0 4px 22px #000}
/* el emblema generado: es lo primero que se ve, y es lo que hace que el menu no
   empiece con una palabra escrita con la tipografia del sistema */
.em{width:clamp(90px,27vw,158px);height:auto;margin-bottom:-1.4vh;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.75))}
.em[hidden]{display:none}
/* el título del final es una frase y no el nombre del juego, así que con el
   tamaño del nombre se partía en dos líneas y se comía los botones */
#pFin h1{font-size:clamp(24px,7.5vw,42px);letter-spacing:.16em;text-indent:.16em}
.pan p{font-size:clamp(12px,3.4vw,17px);line-height:1.6;opacity:.62;max-width:24em}
.fila{display:flex;gap:2.6vw;flex-wrap:wrap;justify-content:center}
.bt{appearance:none;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.05);
  color:inherit;font:inherit;font-size:clamp(12px,3.5vw,16px);font-weight:700;
  letter-spacing:.16em;padding:1.5vh 5.5vw;border-radius:999px;cursor:pointer}
.bt.p{background:var(--ac);color:#0b0b10;border-color:var(--ac)}
.bt:disabled{opacity:.34}

/* el marcador: grande, arriba, y nada más. En un juego de cuarenta segundos no
   hay nada que consultar además del número. */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:4}
#hud.on{opacity:1}
#marca{position:absolute;top:2.4vh;left:0;right:0;text-align:center;
  font-size:clamp(30px,10vw,58px);font-weight:800;letter-spacing:.04em;
  text-shadow:0 3px 18px rgba(0,0,0,.75)}
#sub{position:absolute;top:calc(2.4vh + 11vw);left:0;right:0;text-align:center;
  font-size:clamp(10px,3vw,14px);letter-spacing:.28em;opacity:.55}
#reloj{position:absolute;left:12%;right:12%;bottom:3.2vh;height:6px;
  background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
#relojB{height:100%;width:100%;background:#f2eee6}
#relojB.poco{background:#e0553f}

/* el pie de la cinemática: el único texto de una cinemática, y va en DOM por lo
   mismo que el título — hay que poder traducirlo y tiene que leerse */
#cine{position:absolute;left:8%;right:8%;bottom:9vh;text-align:center;z-index:5;
  font-size:clamp(13px,3.8vw,19px);line-height:1.5;opacity:0;transition:opacity .5s;
  text-shadow:0 2px 16px #000;pointer-events:none}
#cine.on{opacity:.96}
#salta{position:absolute;right:4vw;top:3vh;z-index:6;font-size:11px;letter-spacing:.2em;
  opacity:0;transition:opacity .4s;pointer-events:none}
#salta.on{opacity:.4}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#velo{position:absolute;inset:0;background:#07070b;opacity:0;pointer-events:none;
  z-index:6;transition:opacity .45s}
#velo.on{opacity:1}
</style></head><body>
<div id="caja">
  <canvas id="c"></canvas>
  <div id="tela"></div>
  <div id="hud">
    <div id="marca">0</div>
    <div id="sub"></div>
    <div id="reloj"><div id="relojB"></div></div>
  </div>
  <div id="cine"></div>
  <div id="salta"></div>
  <div id="velo"></div>
  <div id="flash"></div>

  <div class="pan on" id="pIdioma">
    <img class="em" id="emI" alt="" hidden>
    <h1>PUERTA</h1>
    <div class="fila">
      <button class="bt p" data-lang="es">ESPAÑOL</button>
      <button class="bt" data-lang="en">ENGLISH</button>
      <button class="bt" data-lang="pt">PORTUGUÊS</button>
    </div>
  </div>

  <div class="pan" id="pMenu">
    <img class="em" id="emM" alt="" hidden>
    <h1>PUERTA</h1>
    <p data-i18n="sub"></p>
    <div class="fila">
      <button class="bt p" id="bJugar" data-i18n="jugar"></button>
      <button class="bt" id="bComo" data-i18n="como"></button>
    </div>
    <p id="mejor" style="opacity:.42;letter-spacing:.2em;font-size:12px"></p>
    <div class="fila" style="gap:1.8vw">
      <button class="bt" data-lang="es" style="padding:.9vh 3.4vw;font-size:11px">ES</button>
      <button class="bt" data-lang="en" style="padding:.9vh 3.4vw;font-size:11px">EN</button>
      <button class="bt" data-lang="pt" style="padding:.9vh 3.4vw;font-size:11px">PT</button>
    </div>
  </div>

  <div class="pan" id="pFin">
    <h1 id="finT"></h1>
    <p id="finP"></p>
    <div class="fila">
      <button class="bt p" id="bOtra" data-i18n="otra"></button>
      <button class="bt" id="bMenu" data-i18n="menu"></button>
    </div>
  </div>
</div>

<script type="module">
/* ══════════════════════ EL MARCO Y EL RELOJ ══════════════════════ */
const $ = (i) => document.getElementById(i);

/* ── EL ANCHO DE DISEÑO ES FIJO Y EL ALTO NO ──
   Todo lo que un juego escribe —una posición, un radio, un tamaño de letra—
   está en unidades de diseño con el ancho clavado en 720, así que una moneda de
   40 px mide lo mismo en un teléfono de 360 y en uno de 1440. Eso es lo que
   evita el defecto que aparece sólo en un tamaño de pantalla y que nadie puede
   reproducir.

   PERO EL ALTO NO PUEDE SER FIJO, y eso se vio en la primera captura: con
   720×1280 clavado —9:16, la relación de un teléfono de 2016— en un teléfono de
   hoy (412×892, o sea 0,46) el marco entraba por el ancho y quedaban DOS BANDAS
   NEGRAS arriba y abajo. Un minijuego que se abre adentro de TikTok tiene que
   ocupar la pantalla entera; una banda negra se lee a que el juego está roto.
   Así que el alto se calcula de la pantalla y los juegos lo leen: lo que se
   ancla abajo se escribe como `AL - algo`, no como un número. Se topa arriba y
   abajo para que una ventana de escritorio muy ancha o muy alta no deforme el
   diseño — ahí sí quedan bandas, y ahí sí corresponde. */
const AN = 720;
let AL = 1280;
const AL_MIN = 1100, AL_MAX = 1760;

const lienzo = $('c');
const g = lienzo.getContext('2d');
const caja = $('caja');
let ESC = 1, DPR = 1;

function medir(){
  const vw = window.innerWidth, vh = window.innerHeight;
  /* el alto de diseño sale de la forma de la pantalla, así que el marco la llena
     entera y no hay bandas */
  let e = vw / AN;
  AL = Math.round(vh / e);
  if (AL < AL_MIN){ AL = AL_MIN; e = vh / AL; }
  else if (AL > AL_MAX){ AL = AL_MAX; e = vh / AL; }
  const w = Math.round(AN * e), h = Math.round(AL * e);
  caja.style.width = w + 'px'; caja.style.height = h + 'px';
  /* ── EL PIXEL RATIO VA TOPADO EN 2, Y ESO ESTÁ MEDIDO EN OTRO JUEGO ──
     En Maicol se midió que dibujar al doble de la resolución de diseño costaba
     la mitad de los cuadros y no compraba ni un detalle, porque no hay más
     detalle que dar: los dibujos están hechos para 720 de ancho. Con 2 el texto
     y los bordes quedan finos y no se paga un tercer múltiplo. */
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(w * DPR);
  lienzo.height = Math.round(h * DPR);
  ESC = (w * DPR) / AN;
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.imageSmoothingEnabled = true;
}
addEventListener('resize', () => setTimeout(medir, 60));
addEventListener('orientationchange', () => setTimeout(medir, 120));

/* ── EL RELOJ: PASO FIJO DE 60 CON TOPE ──
   Un minijuego que se juega por reflejos NO PUEDE depender de los cuadros por
   segundo del aparato: si la moneda cae más rápido en un teléfono lento, es
   otro juego. La simulación va a 60 pasos fijos y el dibujo sale de donde
   quedó. Y el `dt` se topa en un cuarto de segundo, porque una pestaña que
   estuvo dormida no puede simular un minuto de golpe. */
const PASO = 1/60;
let _acum = 0, _ultimo = performance.now();
let MODO = 'idioma';      /* idioma · menu · como · cine · juega · fin */
let PAUSA = false, CONGELADO = false;
let fps = 0, _cuadros = 0, _acumF = 0;

/* la entrada: un solo verbo. Llega normalizada a las unidades de diseño, así
   que un juego nunca ve un píxel de pantalla. */
const TOQUE = { x: 0, y: 0, abajo: false, movido: false };
function aDiseno(ev){
  const r = lienzo.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: (t.clientX - r.left) / r.width * AN,
           y: (t.clientY - r.top) / r.height * AL };
}
function baja(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.abajo = true; TOQUE.movido = false;
  if (MODO === 'cine'){ cineSalta(); return; }
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function mueve(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.movido = true;
  if (MODO === 'juega' && TOQUE.abajo && JUEGO.mueve) JUEGO.mueve(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function sube(){
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(TOQUE.x, TOQUE.y);
  TOQUE.abajo = false;
}
addEventListener('touchstart', baja, { passive: false });
addEventListener('touchmove', mueve, { passive: false });
addEventListener('touchend', sube, { passive: true });
addEventListener('mousedown', baja);
addEventListener('mousemove', (e) => { if (TOQUE.abajo) mueve(e); });
addEventListener('mouseup', sube);
/* la barra espaciadora hace de toque EN EL MEDIO del marco: es lo que permite
   probarlo en una notebook sin fingir un táctil. Y va con las coordenadas de
   diseño y no con las del evento, porque un `keydown` no trae ninguna — con
   `clientX` en cero el toque caía en el borde izquierdo, que en un juego de
   tocar la mitad es una respuesta equivocada. */
function toqueMedio(){
  if (MODO === 'cine'){ cineSalta(); return; }
  TOQUE.x = AN/2; TOQUE.y = AL/2; TOQUE.abajo = true;
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(AN/2, AL/2);
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(AN/2, AL/2);
  TOQUE.abajo = false;
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') toqueMedio();
});

/* ══════════════════════════ PUERTA ══════════════════════════
   Sos el de la puerta del boliche. Llega gente de a uno y decidís SÍ o NO.

   LA IDEA ENTERA ES QUE LA REGLA NO SE DICE. Cada tanto cambia, y la única
   forma de saber cuál es ahora es equivocarse una vez. Eso es lo que hace que
   el juego sea de JUICIO y no de reflejos — que es el molde que de verdad
   funciona en TikTok: la mitad de los catorce que están en prueba ahí son de
   decidir, no de destreza, porque lo que se filma es la cara del que se dio
   cuenta tarde.

   Y HAY UNA REGLA DE JUSTICIA QUE NO SE PUEDE SALTEAR: el primer error después
   de un cambio de regla NO CUESTA VIDA. Un juego no puede cobrarte información
   que no tenías forma de tener; sin esa excepción, «la regla cambió» es una
   trampa y el jugador deja de jugar en la tercera partida. El error gratis ES
   el aviso de que cambió — y encima el cartel de arriba de la puerta titila,
   así que a las dos o tres veces el jugador descubre el aviso por su cuenta.
   Descubrir un aviso engancha; leerlo en un tutorial, no. */

/* ── LOS COLORES SON POCOS Y BIEN SEPARADOS ──
   Una de las seis reglas es «sólo los de tal color», así que los colores tienen
   que distinguirse de un vistazo en un teléfono chico y de noche. Cuatro muy
   distintos entre sí valen más que ocho parecidos: con ocho, la regla del color
   deja de ser deducible y pasa a ser adivinar. */
/* la piel del menú: el color de acento y qué imagen hace de telón. Los cinco
   juegos comparten la estructura del menú y no el color. */
const PIEL = { ac: '#e8b46a', tela: 'fondo' };

/* los sonidos generados que reemplazan a los osciladores. Si una muestra no
   decodificó, suena el sintetizado de siempre — un juego mudo por un
   decodificador es peor que un juego con bips. */
const SON_ALIAS = { bien: 'pase', mal: 'no' };

const ROPA = [
  { n: 'rojo',    c: '#c8412f' },
  { n: 'verde',   c: '#3f8f5c' },
  { n: 'azul',    c: '#3a63b8' },
  { n: 'amarillo',c: '#c9a227' }
];

/* las seis reglas. Cada una mira UN rasgo y nada más: una regla compuesta
   («con lentes y sin gorro») no se puede deducir de un error, y todo el juego
   se apoya en que un error alcance. */
const REGLAS = [
  { id: 'sinGorro',  ok: (p) => !p.gorro },
  { id: 'conLentes', ok: (p) => p.lentes },
  { id: 'sinBotella',ok: (p) => !p.botella },
  { id: 'conPase',   ok: (p) => p.pase },
  /* ── «CABEZA CUADRADA» SE FUE Y ENTRÓ «BUFANDA», Y ES POR EL SPRITE ──
     La regla vieja miraba la forma de la cabeza, y eso se podía dibujar cuando
     la persona era un montón de cajas. Con el cuerpo generado la cabeza es la
     que es: lo que se puede agregar encima son PRENDAS. Una bufanda al cuello
     se ve de un vistazo en un teléfono chico, que es la única condición que un
     rasgo tiene que cumplir acá. */
  { id: 'bufanda',   ok: (p) => p.bufanda },
  { id: 'color',     ok: (p, r) => p.ropa === r.color }
];

const P = {
  vidas: 3, aciertos: 0, regla: null, desdeCambio: 0, gratis: false,
  per: null, fase: 'entra', ft: 0, limite: 2.6, cartel: 0, aviso: 0, avisoT: 0
};

const JUEGO = {
  id: 'puerta', vivo: false, gano: false,
  marca: 0, resta: null,

  /* ══════════ LA CINEMÁTICA ══════════ */
  planos: [
    { dur: 3.2, pie: 'c1', dibuja: (g, u) => {
        fondoCalle(g, 0.35);
        /* la cola: siluetas que se van hacia el fondo, cada vez más chicas y más
           oscuras. Es lo único que hace que se lea «hay mucha gente» sin dibujar
           mucha gente. */
        for (let i = 0; i < 9; i++){
          const k = i/8;
          const x = 150 + k*520 + Math.sin(u*2 + i)*4;
          const s = 1 - k*0.62;
          siluetaCola(g, x, 900 - k*250, s, 0.30 + (1-k)*0.45);
        }
      } },
    { dur: 3.0, pie: 'c2', dibuja: (g, u) => {
        fondoCalle(g, 0.5);
        /* la lista: un papel que entra desde abajo */
        const y = 900 - suave(Math.min(1, u*1.6))*260;
        g.save(); g.translate(360, y); g.rotate(-0.06);
        caja2(-150, -100, 300, 200, 8, '#e8e2d2', 'rgba(0,0,0,.3)');
        for (let i = 0; i < 6; i++){
          g.fillStyle = 'rgba(30,28,26,.55)';
          g.fillRect(-118, -70 + i*26, 200 - (i%3)*44, 7);
        }
        g.restore();
      } },
    { dur: 2.8, pie: 'c3', dibuja: (g, u) => {
        fondoCalle(g, 0.5 + u*0.3);
        const y = 640;
        g.save(); g.translate(360, y); g.rotate(-0.06 + u*0.12);
        /* el papel se consume DESDE ABAJO: dibujar la llama encima de un papel
           entero se lee a papel con una llama al lado */
        const q = suave(u);
        caja2(-150, -100, 300, 200*(1 - q*0.92), 8, '#e8e2d2', null);
        for (let i = 0; i < 5; i++){
          const fx = -140 + Math.random()*280;
          const fy = -100 + 200*(1 - q*0.92) + Math.random()*40;
          disco(fx, fy, 6 + Math.random()*18, i % 2 ? 'rgba(228,120,40,.55)' : 'rgba(240,190,70,.5)');
        }
        g.restore();
        /* el humo */
        for (let i = 0; i < 12; i++)
          disco(360 + Math.sin(i*1.7 + u*3)*60, 560 - i*34 - u*90, 14 + i*3,
                'rgba(120,118,124,' + (0.16 - i*0.011).toFixed(3) + ')');
      } },
    { dur: 2.6, pie: 'c4', dibuja: (g, u) => {
        fondoCalle(g, 0.9);
        /* solo, de espaldas, delante de la puerta */
        puertaDibujo(g, 1);
        siluetaCola(g, 360, 1010, 1.5, 0.9);
      } }
  ],

  arranca(){
    P.vidas = 3; P.aciertos = 0; P.desdeCambio = 0; P.gratis = false;
    P.cartel = 0; P.aviso = 0; P.avisoT = 0;
    P.limite = 2.6;
    nuevaRegla();
    P.gratis = false;          /* la primera regla de la partida no da error gratis
                                  porque todavía no hubo ninguna: nada cambió */
    nuevaPersona();
    JUEGO.vivo = true; JUEGO.gano = false; JUEGO.marca = 0;
  },

  paso(dt){
    if (P.cartel > 0) P.cartel -= dt;
    if (P.avisoT > 0) P.avisoT -= dt;
    P.ft += dt;
    if (P.fase === 'entra'){
      if (P.ft >= 0.34){ P.fase = 'decide'; P.ft = 0; }
    } else if (P.fase === 'decide'){
      /* ── EL RELOJ NO ES DECORACIÓN: ES LA MITAD DEL JUEGO ──
         Sin límite, el jugador se queda mirando y deduce con calma, y entonces
         no hay minijuego. Con límite, tiene que decidir con lo que sabe. */
      JUEGO.resta = 1 - P.ft / P.limite;
      if (P.ft >= P.limite) resuelve(null);
    } else if (P.fase === 'sale'){
      if (P.ft >= 0.42) nuevaPersona();
    }
  },

  fondo(g){
    /* la foto generada de la entrada del boliche, con un velo encima: sin el
       velo compite con la puerta dibujada y con la persona, que son las dos
       cosas que hay que mirar. Y la vereda se vuelve a pintar a la altura de
       `SU()`, porque de ahí salen la persona, los botones y las vidas: si la
       línea del suelo de la foto y la del juego no coinciden, la persona
       aparece flotando. */
    if (dibCubre('fondo')){
      g.fillStyle = 'rgba(7,7,13,.44)'; g.fillRect(0, 0, AN, AL);
      g.fillStyle = 'rgba(8,8,14,.80)'; g.fillRect(0, SU(), AN, AL - SU());
      g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, SU()); g.lineTo(AN, SU()); g.stroke();
      grano(0, 0, AN, AL, 0.02, 40);
    } else fondoCalle(g, 1);
  },

  pinta(g){
    puertaDibujo(g, 1);
    if (P.per) dibujaPersona(g, P.per);
    botones(g);
    vidas(g);
    /* el cartel del cambio de regla: el aviso que el jugador descubre solo */
    if (P.cartel > 0){
      const k = Math.min(1, P.cartel/0.9);
      g.globalAlpha = k * (0.55 + 0.45*Math.abs(Math.sin(P.cartel*22)));
      /* el cartel va DEBAJO del letrero de la puerta y no arriba: arriba se
         encimaba con el marcador del HUD, que es DOM y vive en la franja de
         arriba — medido en la captura, «CAMBIÓ LA REGLA» salía cruzado con el
         número. */
      /* SU()−786 caía ADENTRO de la caja del letrero (que va de SU()−854 a
         SU()−758) y el texto salía cruzado con las tres flechas. Va arriba del
         letrero, y sigue lejos del marcador del HUD. */
      texto(TX('cambio'), 360, SU() - 882, 30, '#f0d060');
      g.globalAlpha = 1;
    }
    if (P.avisoT > 0){
      g.globalAlpha = Math.min(1, P.avisoT/0.7);
      texto(TX('gratis'), 360, SU() - 178, 24, '#8fd6a8');
      g.globalAlpha = 1;
    }
  },

  baja(x, y){
    if (P.fase !== 'decide') return;
    /* el verbo: la mitad izquierda es NO y la derecha es SÍ. Dos botones
       dibujados abajo dicen cuál es cuál, pero se puede tocar en cualquier
       parte de su mitad — en un juego de un segundo y medio, obligar a acertar
       un botón chico convierte un juego de juicio en uno de puntería. */
    resuelve(x > 360);
  },

  pintaTextos(){},

  /* ── EL JUGADOR AUTOMÁTICO ──
     Dos: uno que SABE la regla, que prueba que la partida se puede sostener y
     que el bucle no se traba; y uno que contesta al azar, que prueba que las
     vidas se gastan y que el juego se termina. Sin el segundo, un defecto en el
     final del juego no se descubre nunca. */
  juegaSolo(n, azar){
    /* `azar` en true contesta al azar: es lo que prueba que las vidas se gastan
       y que la partida TERMINA. Sin esa segunda corrida, un defecto en el final
       del juego no se descubre nunca — el jugador que sabe la regla no pierde. */
    JUEGO.arranca();
    let vueltas = 0, cambios = 0, reglaAnt = P.regla.id + (P.regla.color || '');
    while (JUEGO.vivo && vueltas < n){
      /* ── OCHO PASOS NO ALCANZABAN PARA LLEGAR A DECIDIR ──
         La persona tarda 0,34 s en entrar, o sea VEINTIÚN pasos de 1/60. Con
         ocho, `JUEGO.baja` salía por la guarda de fase y no hacía nada: medido,
         400 vueltas devolvían 133 aciertos y las tres vidas intactas, que
         parecía un juego fácil y era un jugador automático que no jugaba. */
      for (let i = 0; i < 60 && P.fase !== 'decide' && JUEGO.vivo; i++) JUEGO.paso(1/60);
      if (!JUEGO.vivo) break;
      const bien = P.regla.ok(P.per, P.regla);
      JUEGO.baja(azar ? (Math.random() < 0.5 ? 100 : 600) : (bien ? 600 : 100), 1100);
      const r = P.regla.id + (P.regla.color || '');
      if (r !== reglaAnt){ cambios++; reglaAnt = r; }
      for (let i = 0; i < 40 && P.fase === 'sale' && JUEGO.vivo; i++) JUEGO.paso(1/60);
      vueltas++;
    }
    return { vueltas, puntos: PUNTOS, aciertos: P.aciertos, vidas: P.vidas,
             cambios, vivo: JUEGO.vivo, limite: +P.limite.toFixed(2) };
  }
};

/* ══════════════════════ LAS REGLAS Y LA GENTE ══════════════════════ */
function nuevaRegla(){
  const ant = P.regla;
  let r;
  let intento = 0;
  do {
    r = Object.assign({}, REGLAS[(Math.random()*REGLAS.length)|0]);
    if (r.id === 'color') r.color = (Math.random()*ROPA.length)|0;
    intento++;
  } while (ant && r.id === ant.id && r.color === ant.color && intento < 20);
  P.regla = r;
  P.desdeCambio = 0;
  P.gratis = true;
  P.cartel = 1.6;
}

function nuevaPersona(){
  const p = {
    gorro: Math.random() < 0.45, lentes: Math.random() < 0.45,
    botella: Math.random() < 0.35, pase: Math.random() < 0.40,
    bufanda: Math.random() < 0.45,
    ropa: (Math.random()*ROPA.length)|0,
    piel: ['#c99a72','#9a6b47','#e0b48c','#7a5236'][(Math.random()*4)|0],
    alto: 0.94 + Math.random()*0.14
  };
  /* ── SE FUERZA QUE EL RASGO DE LA REGLA SE VEA REPARTIDO ──
     Con atributos puramente al azar puede tocar una racha de siete que cumplen,
     y entonces «SÍ» a todo funciona y el jugador no aprende nada. Una de cada
     dos personas, más o menos, tiene que ser la que hay que rechazar: eso es lo
     que convierte la regla en información. */
  if (Math.random() < 0.5) forzar(p, !P.regla.ok(p, P.regla));
  P.per = p;
  P.fase = 'entra'; P.ft = 0;
  JUEGO.resta = 1;
}
/* pone o saca el rasgo que la regla mira, para que la persona cumpla o no */
function forzar(p, aQuePase){
  const r = P.regla;
  if (r.id === 'sinGorro') p.gorro = !aQuePase;
  else if (r.id === 'conLentes') p.lentes = aQuePase;
  else if (r.id === 'sinBotella') p.botella = !aQuePase;
  else if (r.id === 'conPase') p.pase = aQuePase;
  else if (r.id === 'bufanda') p.bufanda = aQuePase;
  else if (r.id === 'color'){
    if (aQuePase) p.ropa = r.color;
    else if (p.ropa === r.color) p.ropa = (r.color + 1 + ((Math.random()*3)|0)) % ROPA.length;
  }
}

function resuelve(dejaEntrar){
  const debia = P.regla.ok(P.per, P.regla);
  const bien = dejaEntrar !== null && dejaEntrar === debia;
  P.per.entro = dejaEntrar === true;
  P.fase = 'sale'; P.ft = 0;
  JUEGO.resta = null;
  if (bien){
    P.aciertos++; PUNTOS = P.aciertos; JUEGO.marca = P.aciertos;
    P.desdeCambio++;
    son('bien');
    fogonazo(0.10);
    /* ── SE ACELERA, Y ES LO ÚNICO QUE HACE DE CURVA ──
       De 2,6 s a 1,15 s en veinte aciertos. Un minijuego no necesita niveles:
       necesita que la misma cosa se vuelva más difícil sin avisar. */
    P.limite = Math.max(1.15, 2.6 - P.aciertos*0.072);
    /* cada siete aciertos cambia la regla */
    if (P.desdeCambio >= 7) nuevaRegla();
  } else {
    son('mal');
    fogonazo(0.34);
    if (P.gratis){
      /* el error gratis: el primero después de un cambio no cuesta vida */
      P.gratis = false;
      P.avisoT = 1.5;
    } else {
      P.vidas--;
      if (P.vidas <= 0){ JUEGO.vivo = false; JUEGO.gano = P.aciertos >= 20; }
    }
  }
}

/* ══════════════════════ EL DIBUJO ══════════════════════
   TODO LO QUE VA ABAJO SE ANCLA AL PISO Y NO A UN NÚMERO. El alto de diseño
   depende de la forma de la pantalla —lo decide `medir()`— así que un `y = 1030`
   escrito a mano queda bien en un teléfono y mal en el de al lado. `SU()` es la
   línea de la vereda y de ahí salen la puerta, la persona, los botones y las
   vidas. */
const SU = () => AL - 250;
function fondoCalle(g, k){
  /* de noche, con la vereda mojada y el resplandor del cartel. El degradado va
     de arriba oscuro a abajo un poco menos: al revés se lee a día nublado. */
  const d = g.createLinearGradient(0, 0, 0, AL);
  d.addColorStop(0, '#0a0a12'); d.addColorStop(0.55, '#12121c'); d.addColorStop(1, '#191520');
  g.fillStyle = d; g.fillRect(0, 0, AN, AL);
  /* el resplandor de la puerta */
  const r = g.createRadialGradient(360, SU() - 330, 40, 360, SU() - 330, 520);
  r.addColorStop(0, 'rgba(226,150,60,' + (0.20*k).toFixed(3) + ')');
  r.addColorStop(1, 'rgba(226,150,60,0)');
  g.fillStyle = r; g.fillRect(0, 0, AN, AL);
  /* la vereda */
  g.fillStyle = '#0e0e16'; g.fillRect(0, SU(), AN, AL - SU());
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, SU()); g.lineTo(AN, SU()); g.stroke();
  grano(0, 0, AN, AL, 0.03, 70);
}

function puertaDibujo(g, k){
  const y0 = SU() - 700;
  /* ── EL VANO NO ES UN RECTÁNGULO NEGRO ──
     Con la foto generada detrás, un negro opaco de 340x730 en el medio se lee a
     agujero en la imagen: medido en la captura, tapaba la mitad del boliche.
     Ahora es un degradado que se abre hacia abajo —la luz que sale de adentro—
     así que el visitante queda parado EN un vano iluminado y el fondo se sigue
     viendo por arriba. */
  const d = g.createLinearGradient(0, y0, 0, SU());
  d.addColorStop(0, 'rgba(8,8,13,.94)');
  d.addColorStop(0.62, 'rgba(14,11,16,.86)');
  d.addColorStop(1, 'rgba(60,34,18,.70)');
  caja2(190, y0, 340, 700, 8, d, null);
  /* el resplandor del umbral: es lo que separa al visitante del fondo */
  const r = g.createRadialGradient(360, SU() - 90, 20, 360, SU() - 90, 300);
  r.addColorStop(0, 'rgba(232,180,106,.26)');
  r.addColorStop(1, 'rgba(232,180,106,0)');
  g.fillStyle = r; g.fillRect(190, y0, 340, 700);
  g.strokeStyle = 'rgba(232,180,120,.42)'; g.lineWidth = 7;
  g.strokeRect(190, y0, 340, 700);

  /* el cartel de arriba: es el que titila cuando cambia la regla, y es el aviso
     que el jugador descubre solo.
     LAS TRES BARRAS VAN DIBUJADAS Y NO ESCRITAS: el glifo que había ('◗') lo
     resuelve la tipografía del sistema, o sea que sale distinto en Android, en
     iPhone y en Windows — medido en la captura salían tres lunas. */
  const enc = P.cartel > 0 ? (0.4 + 0.6*Math.abs(Math.sin(P.cartel*22))) : 1;
  caja2(236, y0 - 118, 248, 88, 12, 'rgba(18,16,24,.90)', 'rgba(232,180,120,.34)');
  g.globalAlpha = 0.26 + 0.74*enc;
  for (let i = 0; i < 3; i++){
    const x = 286 + i*64;
    g.shadowColor = '#e8b46a'; g.shadowBlur = 18;
    caja2(x, y0 - 92, 36, 36, 18, '#e8b46a', null);
    g.shadowBlur = 0;
  }
  g.globalAlpha = 1;
}

/* la silueta de la cola: sólo contorno, sin cara. Una silueta con cara ya no es
   una silueta y deja de leerse a «uno más de la fila». */
function siluetaCola(g, x, y, s, a){
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = 'rgba(8,8,14,' + a.toFixed(3) + ')';
  g.beginPath(); g.arc(0, -150, 42, 0, 7); g.fill();
  caja2(-52, -108, 104, 150, 26, 'rgba(8,8,14,' + a.toFixed(3) + ')', null);
  g.restore();
}

/* ══════════════ LA PERSONA ══════════════
   El cuerpo es un sprite generado con Rezona (cuatro cuadros, la ropa BLANCA a
   propósito) y los RASGOS DE LAS REGLAS se siguen dibujando por código encima.

   Ese reparto no es una comodidad: las seis reglas necesitan que un rasgo esté
   o no esté, y una imagen generada no se puede pedir «con gorro y sin lentes»
   sesenta veces sin que cambie la persona entera. Así que la persona es una y
   los rasgos son cuatro cosas que se le ponen — y ahí el jugador puede deducir,
   porque lo único que cambia entre dos visitantes es exactamente lo que la
   regla mira.

   Y LA ROPA SE TIÑE, LA PIEL NO: el sprite se generó de blanco y `tenido()` lo
   pinta con la máscara de lo blanco, que la calculó el horneado. Un tinte sobre
   el sprite entero deja un tipo verde, no un tipo con remera verde.

   ── LA MEDIDA ES EL ALTO DE LA CABEZA, Y ES LA MEDIANA DE LOS CUATRO ──
   El horneado mide, cuadro por cuadro, la coronilla y el cuello (el punto más
   angosto del perfil de anchos). De ahí salen el centro y el alto de la cabeza,
   y todos los rasgos se ubican en proporción a ese alto: con desplazamientos en
   píxeles, el gorro le queda bien a un visitante alto y metido en la frente al
   bajo.
   El alto sale de la MEDIANA de los cuatro cuadros y sólo el centro se toma por
   cuadro: una cabeza no cambia de tamaño cuando alguien levanta los brazos, y
   en el cuadro del saludo la medición se ensucia. */
const ALTO_PJ = 430;

function medianaCab(){
  const o = IMG.gente;
  if (!o || !o.ok || !AS.img.gente.cab) return null;
  const ds = AS.img.gente.cab.map(c => c[2]).slice().sort((a, b) => a - b);
  return ds[ds.length >> 1];
}

function dibujaPersona(g, p){
  /* entra desde la izquierda y sale para el lado que le tocó: si los dos salen
     por el mismo lado, no se ve qué se decidió */
  let dx = 0, al = 1;
  if (P.fase === 'entra'){ const u = suave(Math.min(1, P.ft/0.34)); dx = -300*(1-u); }
  else if (P.fase === 'sale'){
    const u = suave(Math.min(1, P.ft/0.42));
    dx = (p.entro ? 60 : -420) * u;
    al = 1 - u*0.85;
  }
  const X = 360 + dx;
  const lienzo = tenido('gente', ROPA[p.ropa].c);
  const cabs = (typeof AS !== 'undefined' && AS.img.gente) ? AS.img.gente.cab : null;

  if (lienzo && cabs){
    /* el cuadro: llega con los brazos levantados —pidiendo entrar— y después se
       queda esperando con un balanceo de tres cuadros. Un personaje clavado en
       una pose mientras el reloj corre se lee a imagen y no a alguien esperando. */
    const i = P.fase === 'entra' ? 3
            : (P.fase === 'sale' ? (p.entro ? 3 : 0)
            : [0, 1, 2, 1][Math.floor(P.ft*3.4) % 4]);
    const alto = ALTO_PJ*p.alto;
    const o = IMG.gente, e = alto/o.h;
    g.save();
    g.globalAlpha = al;
    dibCuadro('gente', i, X, SU(), alto, false, lienzo);
    /* de la medición del horneado a coordenadas de pantalla */
    const c = cabs[i] || cabs[0];
    const d = medianaCab()*e;
    const hx = X + (c[0] - o.w/2)*e;
    const hy = SU() - alto + c[1]*e;
    rasgos(g, p, hx, hy, d, e);
    g.restore();
    return;
  }

  /* ── EL RESPALDO DIBUJADO POR CÓDIGO NO SE BORRA ──
     Un data URI se decodifica de forma asincrónica: sin esto, los primeros
     cuadros de la primera partida —o toda la partida si la imagen no
     decodifica— no tendrían a nadie en la puerta. */
  g.save();
  g.globalAlpha = al;
  g.translate(X, SU() - 330);
  g.scale(p.alto, p.alto);
  caja2(-104, -40, 208, 250, 34, ROPA[p.ropa].c, 'rgba(0,0,0,.28)');
  disco(0, -120, 78, p.piel);
  g.strokeStyle = 'rgba(0,0,0,.24)'; g.lineWidth = 3;
  g.beginPath(); g.arc(0, -120, 78, 0, 7); g.stroke();
  disco(-28, -134, 9, '#20202a'); disco(28, -134, 9, '#20202a');
  g.restore();
  rasgos(g, p, 360 + dx, SU() - 330 - 198*p.alto, 156*p.alto, p.alto);
}

/* los cuatro rasgos, todos en proporción al diámetro medido de la cabeza: con
   desplazamientos en píxeles, el gorro le queda bien a un visitante alto y
   metido en la frente al bajo */
function rasgos(g, p, hx, hy, d, e){
  /* los tres números de abajo salieron de mirar la captura y no de estimar: con
     los ojos en 0,46 del diámetro y radio 0,19 los lentes salían del tamaño de
     unas antiparras y apoyados en la frente */
  const oy = hy + d*0.50;
  if (p.lentes){
    /* y todavia mas chicos: en la captura los lentes tapaban de la ceja al
       pomulo, o sea antiparras. Un lente ocupa un cuarto del ancho de la cara. */
    const r = d*0.115, sx = d*0.165;
    g.strokeStyle = '#12121a'; g.lineWidth = Math.max(3, d*0.055);
    g.beginPath(); g.arc(hx - sx, oy, r, 0, 7); g.stroke();
    g.beginPath(); g.arc(hx + sx, oy, r, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(hx - sx + r, oy); g.lineTo(hx + sx - r, oy); g.stroke();
    g.fillStyle = 'rgba(180,215,240,.24)';
    g.beginPath(); g.arc(hx - sx, oy, r*0.9, 0, 7); g.fill();
    g.beginPath(); g.arc(hx + sx, oy, r*0.9, 0, 7); g.fill();
  }
  if (p.gorro){
    /* la visera va del lado de afuera y la copa tapa la coronilla: un gorro
       apoyado más arriba se lee a sombrero flotando */
    /* una gorra y no un casco: la copa va CHATA —de 0,03 a 0,26 del diámetro— y
       la visera sale de un lado. Con la copa alta se leía a casco de moto. */
    g.fillStyle = '#26262f';
    g.beginPath();
    g.moveTo(hx - d*0.50, hy + d*0.30);
    g.quadraticCurveTo(hx, hy - d*0.04, hx + d*0.50, hy + d*0.30);
    g.closePath(); g.fill();
    caja2(hx - d*0.54, hy + d*0.25, d*1.08, d*0.12, d*0.06, '#1c1c24', null);
    caja2(hx + d*0.32, hy + d*0.27, d*0.44, d*0.10, d*0.05, '#20202a', null);
  }
  if (p.bufanda){
    /* la bufanda es una banda al CUELLO: con 0,92 de diametro de ancho y 0,30 de
       alto, mas la punta colgando, en la captura se leia a torso rojo y tapaba
       la remera — que es justo el otro rasgo que hay que poder ver */
    /* la banda va en el CUELLO, que en el perfil medido es el punto angosto a
       0,72 del alto de la cabeza — en 0,97 caía sobre los hombros y se leía a
       babero, no a bufanda. Y mide 0,46 y no 0,64: más ancha que el cuello para
       que se vea envuelta, no tan ancha como la cabeza. */
    const y = hy + d*0.72;
    caja2(hx - d*0.23, y, d*0.46, d*0.22, d*0.10, '#c8412f', 'rgba(0,0,0,.25)');
    caja2(hx + d*0.04, y + d*0.18, d*0.15, d*0.50, d*0.07, '#b03a2a', null);
  }
  if (p.pase){
    const y = hy + d*1.34;
    g.strokeStyle = 'rgba(240,238,230,.75)'; g.lineWidth = Math.max(2, d*0.04);
    g.beginPath(); g.moveTo(hx - d*0.18, y); g.lineTo(hx - d*0.04, y + d*0.44); g.stroke();
    caja2(hx - d*0.22, y + d*0.42, d*0.38, d*0.28, d*0.04, '#f0eee6', 'rgba(0,0,0,.35)');
    g.fillStyle = 'rgba(40,40,48,.75)';
    g.fillRect(hx - d*0.17, y + d*0.50, d*0.27, d*0.035);
    g.fillRect(hx - d*0.17, y + d*0.58, d*0.19, d*0.035);
  }
  if (p.botella){
    /* pegada al cuerpo y a la altura de la mano: a 0,86 del diámetro quedaba
       flotando al costado y no se leía a «la trae en la mano» */
    const x = hx + d*0.62, y = hy + d*2.05;
    caja2(x, y, d*0.24, d*0.66, d*0.06, '#2f6f3f', 'rgba(0,0,0,.3)');
    g.fillStyle = '#2f6f3f'; g.fillRect(x + d*0.07, y - d*0.16, d*0.10, d*0.18);
    g.fillStyle = 'rgba(255,255,255,.18)';
    g.fillRect(x + d*0.04, y + d*0.10, d*0.06, d*0.42);
  }
}

function botones(g){
  const act = P.fase === 'decide';
  const y = AL - 184;
  g.globalAlpha = act ? 1 : 0.34;
  caja2(40, y, 300, 128, 22, 'rgba(200,65,47,.20)', 'rgba(200,65,47,.75)');
  texto(TX('no'), 190, y + 64, 42, '#e0785f');
  caja2(380, y, 300, 128, 22, 'rgba(63,143,92,.20)', 'rgba(63,143,92,.75)');
  texto(TX('si'), 530, y + 64, 42, '#7fd0a0');
  g.globalAlpha = 1;
}

function vidas(g){
  for (let i = 0; i < 3; i++)
    disco(300 + i*60, AL - 220, 16, i < P.vidas ? '#e0553f' : 'rgba(255,255,255,.13)');
}
/* ══════════════════════ LOS TRES IDIOMAS ══════════════════════
   La pantalla de idioma va ANTES del menú, que es la lección de los otros seis
   juegos de este repo: elegir el idioma adentro de un menú ya escrito en un
   idioma que no entendés no sirve de nada, porque para cuando lo encontrás ya
   leíste todo sin entenderlo.

   Y NO SE GUARDA NADA EN DISCO. `localStorage` TIRA en una ventana privada, y
   un minijuego que se abre desde un enlace se abre en ventanas raras todo el
   tiempo. El idioma sale de `navigator.language` y el jugador lo cambia con los
   tres botones chicos del menú. La única cosa que sí se intenta guardar es el
   récord, y va envuelta en `try` justamente porque puede tirar. */
let LANG = 'en';
const TXB = {
  es: { jugar:'JUGAR', como:'CÓMO SE JUEGA', otra:'OTRA VEZ', menu:'MENÚ',
        mejor:'MEJOR', salta:'TOCÁ PARA SALTEAR', pts:'PUNTOS',
        finBien:'¡BIEN!', finMal:'SE TERMINÓ', nuevoRec:'RÉCORD NUEVO' },
  en: { jugar:'PLAY', como:'HOW TO PLAY', otra:'AGAIN', menu:'MENU',
        mejor:'BEST', salta:'TAP TO SKIP', pts:'POINTS',
        finBien:'NICE!', finMal:'GAME OVER', nuevoRec:'NEW RECORD' },
  pt: { jugar:'JOGAR', como:'COMO JOGAR', otra:'DE NOVO', menu:'MENU',
        mejor:'MELHOR', salta:'TOQUE PARA PULAR', pts:'PONTOS',
        finBien:'BOA!', finMal:'ACABOU', nuevoRec:'NOVO RECORDE' }
};
/* ── LA TABLA DEL JUEGO SE FUSIONA CON LA DEL NÚCLEO, NO LA REEMPLAZA ──
   Cada juego trae sus propias frases y hereda las siete del núcleo. Si cada
   juego tuviera que repetir «JUGAR» y «MENÚ» en tres idiomas, serían veintiún
   cadenas duplicadas por juego y la primera que se corrija va a quedar
   corregida en uno solo. */
const TXT = {};
for (const l of ['es','en','pt']) TXT[l] = Object.assign({}, TXB[l], (JT[l] || {}));

function TX(k, ...a){
  let s = (TXT[LANG] && TXT[LANG][k]) != null ? TXT[LANG][k]
        : (TXT.es[k] != null ? TXT.es[k] : k);
  /* los patrones con hueco: `{0}` se reemplaza por el argumento. Una frase con
     un número adentro no se puede armar concatenando, porque el número no cae
     en el mismo lugar en los tres idiomas. */
  return String(s).replace(/\{(\d)\}/g, (_, i) => a[i] != null ? a[i] : '');
}

function pintaIdioma(){
  document.documentElement.lang = LANG;
  for (const e of document.querySelectorAll('[data-i18n]'))
    e.textContent = TX(e.dataset.i18n);
  for (const b of document.querySelectorAll('[data-lang]'))
    b.classList.toggle('p', b.dataset.lang === LANG);
  $('salta').textContent = TX('salta');
  if (window.pintaJuego) window.pintaJuego();
}

function ponIdioma(l){ LANG = l; pintaIdioma(); }

/* el idioma del aparato, y sólo si es uno de los tres */
(() => {
  const n = (navigator.language || 'en').slice(0,2).toLowerCase();
  if (n === 'es' || n === 'pt') LANG = n;
})();
/* ══════════════════════════ EL SONIDO ══════════════════════════
   Procedural y sin un solo archivo, y acá eso no es una limitación sino la
   respuesta correcta: un minijuego de TikTok se abre desde un enlace y tiene
   que estar jugable en el primer segundo. Medio mega de MP3 antes del primer
   cuadro es exactamente lo que hace que alguien se vaya.

   Y LA ESCALA ESTÁ ESCALONADA, que es la regla que ya se midió en Eco, en
   RECREO y en PULSO: la cama de fondo tiene que quedar MUY por debajo de un
   acierto, porque si compiten, el acierto deja de ser un acontecimiento y pasa
   a ser un matiz. Fondo 0,03 · toque 0,10 · acierto 0,18 · error 0,22 · final
   0,30. */
let AUD = null, MAESTRO = null, ANAL = null, RUIDO = null, CAMA = null;
let SILENCIO = false;

function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAESTRO = AUD.createGain(); MAESTRO.gain.value = 0.9;
  MAESTRO.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAESTRO.connect(ANAL);
  /* un segundo de ruido blanco generado una vez: cada golpe es el mismo ruido
     con otro filtro y otro sobre, así que no hay que generar nada más */
  const n = AUD.sampleRate;
  RUIDO = AUD.createBuffer(1, n, n);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
}

function env(gn, t0, at, dur, pico){
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t0 + at);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function tono(t0, f0, f1, dur, pico, tipo){
  if (!AUD) return;
  const o = AUD.createOscillator(); o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const gn = AUD.createGain(); o.connect(gn); gn.connect(MAESTRO);
  env(gn, t0, Math.min(0.02, dur*0.2), dur, pico);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function ruido(t0, dur, f, q, pico, tipo){
  if (!AUD) return null;
  const s = AUD.createBufferSource(); s.buffer = RUIDO; s.loop = true;
  const b = AUD.createBiquadFilter(); b.type = tipo || 'bandpass';
  b.frequency.value = f; b.Q.value = q;
  const gn = AUD.createGain();
  s.connect(b); b.connect(gn); gn.connect(MAESTRO);
  env(gn, t0, Math.min(0.01, dur*0.2), dur, pico);
  s.start(t0); s.stop(t0 + dur + 0.05);
  return b;
}

/* ── LA ESCALA PENTATÓNICA NO ES UN GUSTO ──
   Un acierto suena cien veces por partida. En cualquier otra escala, dos notas
   seguidas pueden sonar mal juntas y a los treinta segundos molesta; en
   pentatónica cualquier nota pega con cualquier otra. Es la misma decisión que
   en POMPOM, y ahí se notó al primer minuto de juego. */
const PENTA = [0, 2, 4, 7, 9];
function nota(i){ /* i = grado, sube por octavas */
  const o = Math.floor(i / 5), s = PENTA[((i % 5) + 5) % 5];
  return 220 * Math.pow(2, (s + 12*o) / 12);
}

let _racha = 0;
function son(tipo, k){
  if (!AUD || SILENCIO) return;
  const t = AUD.currentTime, v = k == null ? 1 : k;
  if (tipo === 'toque'){
    tono(t, 620, 460, 0.05, 0.10*v, 'sine');
  } else if (tipo === 'bien'){
    /* ── LA RACHA SUBE DE NOTA, Y ES LO QUE ENGANCHA ──
       Con una nota fija, veinte aciertos son el mismo sonido veinte veces. Con
       la escala subiendo, la racha SE ESCUCHA: el jugador oye que va bien antes
       de mirar el número, y perder la racha se siente porque el tono vuelve
       abajo. Es la mitad del enganche de un minijuego y cuesta dos líneas. */
    _racha = Math.min(_racha + 1, 14);
    tono(t, nota(_racha + 4), nota(_racha + 4)*1.5, 0.16, 0.18*v, 'triangle');
    tono(t + 0.03, nota(_racha + 9), nota(_racha + 9), 0.10, 0.07*v, 'sine');
  } else if (tipo === 'mal'){
    _racha = 0;
    tono(t, 190, 78, 0.30, 0.22*v, 'sawtooth');
    ruido(t, 0.16, 260, 0.8, 0.14*v, 'lowpass');
  } else if (tipo === 'gana'){
    _racha = 0;
    for (let i = 0; i < 5; i++)
      tono(t + i*0.085, nota(6 + i*2), nota(6 + i*2), 0.30, 0.30, 'triangle');
  } else if (tipo === 'pierde'){
    _racha = 0;
    for (let i = 0; i < 3; i++)
      tono(t + i*0.13, nota(8 - i*3), nota(8 - i*3)*0.98, 0.34, 0.24, 'sawtooth');
  } else if (tipo === 'raspa'){
    const b = ruido(t, 0.09, 2600, 0.6, 0.13*v);
    if (b) b.frequency.linearRampToValueAtTime(1400, t + 0.09);
  } else if (tipo === 'clic'){
    ruido(t, 0.035, 1800, 1.4, 0.12*v);
  }
}
function rachaCero(){ _racha = 0; }

/* la cama: dos senos muy graves y desafinados entre sí, que baten cada pocos
   segundos. Dos senos idénticos suenan a tono de prueba; desafinados suenan a
   instrumento, y es lo que ya se midió en POMPOM. */
function camaFondo(on){
  if (!AUD) return;
  if (on && !CAMA){
    const o = AUD.createOscillator(); o.type = 'sine'; o.frequency.value = 55;
    const o2 = AUD.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.4;
    const gn = AUD.createGain(); gn.gain.value = 0.030;
    o.connect(gn); o2.connect(gn); gn.connect(MAESTRO);
    o.start(); o2.start();
    CAMA = { o, o2, gn };
  } else if (!on && CAMA){
    CAMA.gn.gain.setTargetAtTime(0.0001, AUD.currentTime, 0.25);
    const c = CAMA; CAMA = null;
    setTimeout(() => { try { c.o.stop(); c.o2.stop(); } catch(e){} }, 900);
  }
}
function pico(){
  if (!ANAL) return 0;
  const a = new Uint8Array(ANAL.fftSize);
  ANAL.getByteTimeDomainData(a);
  let m = 0;
  for (const v of a) m = Math.max(m, Math.abs(v - 128) / 128);
  return +m.toFixed(4);
}
/* ══════════════════ LOS ASSETS GENERADOS ══════════════════
   Las imágenes y el sonido están generados con Rezona y horneados en base64
   dentro del archivo por `herramientas/tiktok/hornear.py`. Este módulo es lo
   único que los conoce: los juegos piden `IMG.pj` o `dibCuadro('pj', 2, …)` y
   no saben de dónde salió.

   ── Y NADA REEMPLAZA NADA HASTA QUE LLEGA ──
   Es la regla del repo y acá pesa más que en ningún otro juego: un data URI se
   decodifica de forma ASINCRÓNICA, así que un juego que naciera esperando la
   foto daría un cuadro —o veinte— en negro justo en el primer segundo, que es
   el único que un minijuego tiene para engancharte. Todo lo dibujado por código
   sigue en pie y la imagen lo PISA cuando está lista. Si una no decodifica,
   cuesta esa pieza y no la pantalla. */

const IMG = {}, SON = {};
let AS_LISTAS = 0, AS_PEDIDAS = 0, AS_FALLADAS = 0;

function cargaImg(){
  if (typeof AS === 'undefined' || !AS.img) return;
  for (const k in AS.img){
    const m = AS.img[k];
    const o = { ok: false, n: m.n || 1, w: m.w || 0, h: m.h || 0,
                im: new Image(), msk: null, cache: {} };
    IMG[k] = o; AS_PEDIDAS++;
    o.im.onload = () => {
      o.ok = true; AS_LISTAS++;
      if (!o.w){ o.w = o.im.width; o.h = o.im.height; }
    };
    o.im.onerror = () => { AS_FALLADAS++; };
    o.im.src = m.d;
    if (m.m){ o.msk = new Image(); o.msk.src = m.m; }
  }
}

/* el sonido necesita el contexto, así que se carga cuando el contexto existe —
   o sea con el primer toque. Ningún navegador deja sonar nada antes de un
   gesto, así que decodificar antes sería trabajo tirado. */
let _sonPedido = false;
function cargaSon(){
  if (_sonPedido || !AUD || typeof AS === 'undefined' || !AS.son) return;
  _sonPedido = true;
  for (const k in AS.son){
    const b = atob(AS.son[k]);
    const ab = new ArrayBuffer(b.length), v = new Uint8Array(ab);
    for (let i = 0; i < b.length; i++) v[i] = b.charCodeAt(i);
    AUD.decodeAudioData(ab, (buf) => {
      SON[k] = buf;
      /* ── Y SI EL TEMA QUE HACE FALTA ERA ESTE, ARRANCA AHORA ──
         `decodeAudioData` es asincronico, asi que el primer pedido de musica
         casi siempre llega ANTES de que el buffer exista: sin esto, el menu
         se quedaria con la cama de osciladores para siempre y el tema
         generado no sonaria nunca. */
      if (_musK === k) musQuiere(k);
    }, () => {});
  }
}

/* ══════════ LA MÚSICA ══════════
   Va con `BufferSource` en bucle y no con un `<audio loop>`: el loop de un
   `<audio>` vuelve al cero con un hueco de milisegundos y en un tema de nueve
   segundos eso se escucha en cada vuelta. Más la cola fundida sobre la cabeza,
   que la pone el horneado.

   Y SE CRUZAN, no se cortan: el menú y la partida son dos temas, y un corte en
   seco entre los dos se lee a error y no a que empezó el juego. */
const MUS_VOL = { menu: 0.30, mus: 0.26 };
let MUS = null;

function musPon(k){
  if (!AUD) return;
  if (MUS && MUS.k === k) return;
  if (MUS){
    const v = MUS; MUS = null;
    v.gn.gain.cancelScheduledValues(AUD.currentTime);
    v.gn.gain.setTargetAtTime(0.0001, AUD.currentTime, 0.28);
    setTimeout(() => { try { v.src.stop(); } catch(e){} }, 1200);
  }
  if (!k || !SON[k]) return;
  const src = AUD.createBufferSource();
  src.buffer = SON[k]; src.loop = true;
  const gn = AUD.createGain(); gn.gain.value = 0.0001;
  src.connect(gn); gn.connect(MAESTRO);
  src.start();
  gn.gain.setTargetAtTime(MUS_VOL[k] != null ? MUS_VOL[k] : 0.26, AUD.currentTime, 0.35);
  MUS = { k, src, gn };
}
/* ── QUE TEMA QUIERE EL JUEGO ──
   Un solo sitio decide si suena la muestra o la cama de osciladores, y se
   acuerda de lo que se le pidio para poder arrancarlo cuando el buffer llegue.
   Repartido en cinco llamadas, el dia que se agregue una pantalla va a quedar
   una sin musica y nadie se va a enterar hasta jugarla. */
let _musK = null;
function musQuiere(k){
  _musK = k;
  cargaSon();
  if (k && SON[k]){ camaFondo(false); musPon(k); return; }
  musPon(null);
  camaFondo(!!k);
}

/* la música se agacha mientras suena algo importante: si compiten, el
   acontecimiento deja de ser un acontecimiento y pasa a ser un matiz */
function musAgacha(k, seg){
  if (!MUS) return;
  const g0 = MUS_VOL[MUS.k] != null ? MUS_VOL[MUS.k] : 0.26;
  MUS.gn.gain.cancelScheduledValues(AUD.currentTime);
  MUS.gn.gain.setTargetAtTime(g0*k, AUD.currentTime, 0.05);
  MUS.gn.gain.setTargetAtTime(g0, AUD.currentTime + (seg || 0.5), 0.25);
}

/* ══════════ EL SONIDO: LA MUESTRA PRIMERO Y EL OSCILADOR DE RED ══════════
   `son()` sigue siendo el de siempre —está medido y funciona— y esto lo
   ENVUELVE: si el juego declaró un alias y la muestra decodificó, suena la
   muestra; si no, suena el sintetizado. Un juego mudo por un decodificador es
   peor que un juego con bips, y ya pasó una vez en este repo. */
const _sonProc = son;
son = function(tipo, k){
  if (!AUD || SILENCIO) return;
  const al = (typeof SON_ALIAS !== 'undefined' && SON_ALIAS) ? SON_ALIAS[tipo] : null;
  if (al && SON[al]){
    if (tipo === 'bien') _racha = Math.min(_racha + 1, 14);
    else if (tipo === 'mal' || tipo === 'gana' || tipo === 'pierde') _racha = 0;
    const src = AUD.createBufferSource();
    src.buffer = SON[al];
    const gn = AUD.createGain();
    gn.gain.value = (k == null ? 1 : k) * 0.85;
    src.connect(gn); gn.connect(MAESTRO);
    src.start();
    return;
  }
  _sonProc(tipo, k);
};

/* ══════════ DIBUJO ══════════ */

/* el fondo se dibuja por COVER y no estirado: la imagen viene 720x1280 y el
   alto de diseño se mueve entre 1100 y 1760 según la pantalla, así que
   estirándola la entrada del boliche sale aplastada en un teléfono largo */
function dibCubre(k){
  const o = IMG[k];
  if (!o || !o.ok) return false;
  const e = Math.max(AN/o.im.width, AL/o.im.height);
  const w = o.im.width*e, h = o.im.height*e;
  g.drawImage(o.im, (AN - w)/2, (AL - h)/2, w, h);
  return true;
}

/* un cuadro de una hoja de sprites, centrado en x y APOYADO en y (los pies),
   que es como se piensa un personaje. `esp` lo espeja. */
function dibCuadro(k, i, x, y, alto, esp, lienzo){
  const o = IMG[k];
  if (!o || !o.ok) return false;
  const src = lienzo || o.im;
  const e = alto / o.h, w = o.w*e;
  g.save();
  g.translate(x, y);
  if (esp) g.scale(-1, 1);
  g.drawImage(src, (i % o.n)*o.w, 0, o.w, o.h, -w/2, -alto, w, alto);
  g.restore();
  return true;
}

/* ── EL TEÑIDO: LA HOJA SE PINTA UNA VEZ Y SE GUARDA ──
   El personaje se generó con la ropa BLANCA para poder pintarla del color que
   la regla pida. Pintar por cuadro serían tres operaciones de lienzo sesenta
   veces por segundo para obtener siempre lo mismo: se hornea una hoja por
   color la primera vez que se pide y después son copias.

   `multiply` sobre blanco devuelve el color exacto y sobre el contorno oscuro
   lo deja oscuro, que es justo lo que tiene que pasar. Y donde la máscara es
   transparente no cambia nada, así que la piel y el pelo no se tocan. */
function tenido(k, color){
  const o = IMG[k];
  if (!o || !o.ok) return null;
  if (o.cache[color]) return o.cache[color];
  /* ── Y NO SE CACHEA UN TEÑIDO HECHO SIN LA MÁSCARA ──
     La máscara es una segunda imagen y decodifica DESPUÉS de la hoja. Sin esta
     guarda, el primer cuadro teñía con la hoja entera de máscara —o sea todo el
     sprite, piel incluida— y GUARDABA eso para siempre: medido en la captura,
     el visitante salía azul de la cara a las zapatillas.
     Mientras la máscara no esté, se devuelve la hoja cruda sin teñir y sin
     guardar nada: un visitante de blanco por dos cuadros es infinitamente mejor
     que uno pintado entero por el resto de la partida. */
  if (AS.img[k] && AS.img[k].m && !(o.msk && o.msk.complete)) return o.im;
  const c = document.createElement('canvas');
  c.width = o.im.width; c.height = o.im.height;
  const x = c.getContext('2d');
  x.drawImage(o.im, 0, 0);
  const t = document.createElement('canvas');
  t.width = c.width; t.height = c.height;
  const y = t.getContext('2d');
  /* la máscara es la de la ropa si la hay; si no, el sprite entero (que en ese
     caso se generó blanco a propósito, como la bola de MANCHA) */
  y.drawImage(o.msk && o.msk.complete ? o.msk : o.im, 0, 0);
  y.globalCompositeOperation = 'source-in';
  y.fillStyle = color; y.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'multiply';
  x.drawImage(t, 0, 0);
  o.cache[color] = c;
  return c;
}

/* una textura como patrón repetible, guardada. Se hornean embaldosadas de
   verdad (la banda del borde fundida sobre el opuesto), así que se repiten sin
   espejo y sin costura. */
function patron(k){
  const o = IMG[k];
  if (!o || !o.ok) return null;
  if (!o.pat) o.pat = g.createPattern(o.im, 'repeat');
  return o.pat;
}

/* un sello (la salpicadura, la bola) teñido y girado. El sello se horneó con el
   RGB en blanco puro, así que el color sale exacto y no multiplicado por lo que
   la generación hubiera puesto de gris. */
function dibSello(k, x, y, r, gi, color){
  const c = tenido(k, color);
  if (!c) return false;
  g.save();
  g.translate(x, y);
  if (gi) g.rotate(gi);
  g.drawImage(c, -r, -r, r*2, r*2);
  g.restore();
  return true;
}

function asEstado(){
  return { pedidas: AS_PEDIDAS, listas: AS_LISTAS, falladas: AS_FALLADAS,
           son: Object.keys(SON).length,
           mus: MUS ? MUS.k : null };
}
/* ══════════════════════ LA CINEMÁTICA ══════════════════════
   Cuatro o cinco planos de tres segundos, dibujados en el MISMO lienzo con la
   misma tinta que el juego. Nada de fotos: una imagen pegada arriba de un juego
   de dos colores se ve pegada arriba, y eso ya costó una vuelta en POMPOM.

   TRES REGLAS, Y LAS TRES SALEN DE HABERSE EQUIVOCADO ANTES:

   1. ES UNA FUNCIÓN DEL TIEMPO, NO UNA MÁQUINA DE ESTADOS. `cinePon(t)` recibe
      el segundo y dibuja. Por eso la prueba puede fotografiar el segundo 7,4
      sin esperar siete segundos, y por eso los defectos de encuadre se
      encuentran mirando un instante en vez de mirando el código.

   2. SE PUEDE SALTEAR, CON GRACIA DE MEDIO SEGUNDO. Una cinemática obligatoria
      se ve una vez; vista cinco veces es un peaje, y un minijuego se abre
      veinte veces. La gracia no es capricho: el mismo toque que apretó JUGAR
      llega a veces como un segundo evento y se la comería entera — es
      exactamente la guarda que hizo falta en BARRIO y en POMPOM.

   3. SÓLO LA PRIMERA VEZ. Después queda en su botón del menú. */
const CINE = { on: false, t: 0, dur: 0, plano: -1, gracia: 0, alTerminar: null };

function cineArranca(alTerminar){
  CINE.on = true; CINE.t = 0; CINE.plano = -1; CINE.gracia = 0.55;
  CINE.alTerminar = alTerminar || null;
  CINE.dur = JUEGO.planos.reduce((a, p) => a + p.dur, 0);
  MODO = 'cine';
  $('cine').classList.add('on');
  $('salta').classList.add('on');
  $('hud').classList.remove('on');
  for (const p of document.querySelectorAll('.pan')) p.classList.remove('on');
}
function cineSalta(){
  if (!CINE.on || CINE.gracia > 0) return;
  cineTermina();
}
function cineTermina(){
  CINE.on = false;
  $('cine').classList.remove('on');
  $('salta').classList.remove('on');
  const f = CINE.alTerminar; CINE.alTerminar = null;
  if (f) f();
}
/* qué plano cae en el segundo `t`, y cuánto lleva ese plano corrido */
function cineDonde(t){
  let acum = 0;
  for (let i = 0; i < JUEGO.planos.length; i++){
    const p = JUEGO.planos[i];
    if (t < acum + p.dur || i === JUEGO.planos.length - 1)
      return { i, p, u: Math.max(0, Math.min(1, (t - acum) / p.dur)) };
    acum += p.dur;
  }
  return { i: 0, p: JUEGO.planos[0], u: 0 };
}
function cinePon(t){
  const d = cineDonde(t);
  /* el pie se escribe SÓLO cuando cambia de plano: escribir en el DOM en cada
     cuadro obliga al navegador a recalcular el layout sesenta veces por segundo
     para poner el mismo texto */
  if (d.i !== CINE.plano){
    CINE.plano = d.i;
    $('cine').textContent = d.p.pie ? TX(d.p.pie) : '';
  }
  g.save();
  d.p.dibuja(g, d.u, t);
  g.restore();
  /* entra y sale de negro: un corte seco desde el menú se lee a error */
  const fEnt = Math.min(1, t / 0.5);
  const fSal = Math.min(1, Math.max(0, (CINE.dur - t) / 0.5));
  const k = 1 - Math.min(fEnt, fSal);
  if (k > 0.001){ g.fillStyle = 'rgba(7,7,11,' + k.toFixed(3) + ')'; g.fillRect(0, 0, AN, AL); }
}
function cinePaso(dt){
  if (CINE.gracia > 0) CINE.gracia -= dt;
  CINE.t += dt;
  if (CINE.t >= CINE.dur) cineTermina();
}

/* ── HERRAMIENTAS DE DIBUJO QUE LOS CINCO JUEGOS COMPARTEN ──
   No es una biblioteca por prolijidad: es que un redondeo o un degradado
   escritos cinco veces terminan siendo cinco cosas distintas, y entonces los
   cinco juegos dejan de verse de la misma familia. */
function caja2(x, y, w, h, r, relleno, borde){
  g.beginPath();
  const rr = Math.min(r, w/2, h/2);
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
  if (relleno){ g.fillStyle = relleno; g.fill(); }
  if (borde){ g.strokeStyle = borde; g.lineWidth = 3; g.stroke(); }
}
function texto(s, x, y, tam, col, peso, alin){
  g.fillStyle = col || '#f2eee6';
  g.font = (peso || 800) + ' ' + tam + 'px ui-sans-serif,system-ui,sans-serif';
  g.textAlign = alin || 'center';
  g.textBaseline = 'middle';
  g.fillText(s, x, y);
}
function disco(x, y, r, col){
  g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
/* el grano: lo mismo que en los juegos 3D del repo, un plano de un solo color
   se lee a plástico y con grano se lee a superficie */
function grano(x, y, w, h, k, n){
  g.save();
  for (let i = 0; i < (n || 90); i++){
    g.fillStyle = 'rgba(255,255,255,' + (Math.random()*k).toFixed(3) + ')';
    g.fillRect(x + Math.random()*w, y + Math.random()*h, 2, 2);
  }
  g.restore();
}
const suave = (u) => u*u*(3 - 2*u);
/* ══════════════════════ EL ARMADO Y EL BUCLE ══════════════════════
   Todo lo que sigue es del núcleo y ninguno de los cinco juegos lo toca. El
   contrato de un juego es corto a propósito:

       JT              las frases, por idioma
       JUEGO.planos    la cinemática: [{dur, pie, dibuja(g,u,t)}]
       JUEGO.arranca() poner el estado en cero
       JUEGO.paso(dt)  la simulación, en pasos de 1/60
       JUEGO.pinta(g)  el dibujo, en unidades de 720×1280
       JUEGO.baja/mueve/sube(x,y)   el verbo
       JUEGO.marca     el número que va arriba
       JUEGO.resta     0..1 para la barra de abajo, o null si no hay reloj
       JUEGO.vivo      cuando pasa a false, se termina

   Un juego que necesite algo más que eso probablemente no sea un minijuego. */

let PUNTOS = 0, MEJOR = 0;

/* ── EL RÉCORD SE INTENTA GUARDAR Y PUEDE FALLAR ──
   `localStorage` TIRA en una ventana privada, y esto se abre desde enlaces. Sin
   el `try` el juego no arranca en la mitad de los casos raros, que es peor que
   no tener récord. */
const CLAVE = 'tt_' + JUEGO.id;
try { MEJOR = parseInt(localStorage.getItem(CLAVE) || '0', 10) || 0; } catch(e){}
function guardaMejor(){
  try { localStorage.setItem(CLAVE, String(MEJOR)); } catch(e){}
}

function pintaJuego(){
  $('mejor').textContent = MEJOR > 0 ? TX('mejor') + ' · ' + MEJOR : '';
  if (JUEGO.pintaTextos) JUEGO.pintaTextos();
}
window.pintaJuego = pintaJuego;

function verPantalla(p){
  for (const e of document.querySelectorAll('.pan')) e.classList.remove('on');
  if (p) $(p).classList.add('on');
  $('hud').classList.toggle('on', p === null);
  /* el telón se enciende con cualquier panel y se apaga en partida: en partida
     el lienzo dibuja su propio fondo y dejarlo encendido serían dos fondos
     superpuestos */
  $('tela').classList.toggle('on', p !== null);
}

/* ── LA PIEL DEL JUEGO ──
   El color de acento, el telón del menú y el emblema. Los cinco comparten la
   estructura y no la piel: cinco menús del mismo gris con el mismo panel se
   leen a cinco pantallas de opciones de la misma aplicación, y eso es lo que
   hace que ninguno se recuerde. */
function pieles(){
  const pl = (typeof PIEL !== 'undefined') ? PIEL : {};
  /* el ancho que ocupa el título es, aproximadamente, letras x (0,6 + 0,26) em:
     de ahí sale el tamaño que lo deja adentro del marco con aire a los costados */
  const L = ($('pMenu').querySelector('h1').textContent || '').trim().length || 6;
  caja.style.setProperty('--h1', Math.min(11, 78/L).toFixed(2) + 'vw');
  if (pl.ac) caja.style.setProperty('--ac', pl.ac);
  if (typeof AS === 'undefined' || !AS.img) return;
  const f = AS.img[pl.tela || 'fondo'];
  if (f) $('tela').style.backgroundImage = 'url(' + f.d + ')';
  const e = AS.img.em;
  if (e) for (const id of ['emI','emM']){ const n = $(id); n.src = e.d; n.hidden = false; }
}

function alMenu(){
  MODO = 'menu';
  musQuiere('menu');
  verPantalla('pMenu');
  pintaJuego();
}

let _vistaCine = false;
function jugar(){
  armaAudio();
  cargaSon();
  if (AUD && AUD.state === 'suspended') AUD.resume();
  if (!_vistaCine){
    _vistaCine = true;
    cineArranca(empieza);
    return;
  }
  empieza();
}
function empieza(){
  /* el pie de la cinemática se apaga acá también: normalmente lo apaga
     `cineTermina`, pero la sonda que salta a un instante de la cinemática lo
     deja encendido y entonces la partida arranca con un subtítulo puesto */
  $('cine').classList.remove('on');
  $('salta').classList.remove('on');
  PUNTOS = 0;
  rachaCero();
  JUEGO.arranca();
  MODO = 'juega';
  verPantalla(null);
  musQuiere('mus');
  $('sub').textContent = TX('pts');
  pintaHud();
}
function termina(){
  MODO = 'fin';
  musQuiere('menu');
  const rec = PUNTOS > MEJOR;
  if (rec){ MEJOR = PUNTOS; guardaMejor(); }
  son(rec ? 'gana' : 'pierde');
  musAgacha(0.30, 1.4);
  $('finT').textContent = rec ? TX('nuevoRec') : (JUEGO.gano ? TX('finBien') : TX('finMal'));
  $('finP').textContent = PUNTOS + ' ' + TX('pts') + (MEJOR > 0 ? '  ·  ' + TX('mejor') + ' ' + MEJOR : '');
  verPantalla('pFin');
  pintaJuego();
}

function pintaHud(){
  $('marca').textContent = JUEGO.marca != null ? JUEGO.marca : PUNTOS;
  const r = JUEGO.resta;
  const rel = $('reloj');
  rel.style.display = r == null ? 'none' : 'block';
  if (r != null){
    const b = $('relojB');
    b.style.width = (Math.max(0, Math.min(1, r))*100).toFixed(1) + '%';
    b.classList.toggle('poco', r < 0.25);
  }
}

/* el fogonazo: va en CSS y no en el lienzo a propósito, porque tiene que poder
   encenderse en el mismo cuadro en que pasa algo sin esperar al dibujo */
let _flash = 0;
function fogonazo(v){ _flash = Math.max(_flash, v); }
function pasoFogonazo(dt){
  if (_flash <= 0) return;
  _flash = Math.max(0, _flash - dt*4.2);
  $('flash').style.opacity = _flash.toFixed(3);
}

function bucle(){
  requestAnimationFrame(bucle);
  const ahora = performance.now();
  let dt = Math.min((ahora - _ultimo)/1000, 0.25);
  _ultimo = ahora;

  if (!CONGELADO){
    if (MODO === 'cine'){
      cinePaso(dt);
    } else if (MODO === 'juega' && !PAUSA){
      _acum += dt;
      let n = 0;
      while (_acum >= PASO && n < 8){ JUEGO.paso(PASO); _acum -= PASO; n++; }
      if (n >= 8) _acum = 0;      /* si el aparato no llega, va en cámara lenta y no se cuelga */
      if (!JUEGO.vivo) termina();
    }
    pasoFogonazo(dt);
  }

  g.clearRect(0, 0, AN, AL);
  if (MODO === 'cine') cinePon(CINE.t);
  else if (JUEGO.fondo) JUEGO.fondo(g);
  if (MODO === 'juega' || MODO === 'fin') JUEGO.pinta(g);
  if (MODO === 'juega') pintaHud();

  _cuadros++; _acumF += dt;
  if (_acumF >= 0.5){ fps = Math.round(_cuadros/_acumF); _cuadros = 0; _acumF = 0; }
}

/* ══════════════════════ LOS BOTONES ══════════════════════ */
for (const b of document.querySelectorAll('[data-lang]'))
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    ponIdioma(b.dataset.lang);
    if (MODO === 'idioma') alMenu();
  });
$('bJugar').addEventListener('click', (e) => { e.stopPropagation(); jugar(); });
$('bComo').addEventListener('click', (e) => { e.stopPropagation(); cineArranca(alMenu); });
$('bOtra').addEventListener('click', (e) => { e.stopPropagation(); empieza(); });
$('bMenu').addEventListener('click', (e) => { e.stopPropagation(); alMenu(); });

/* ══════════════════════ SONDAS ══════════════════════
   Todo lo que el banco necesita, y nada que el juego use. Un juego que se
   prueba sólo mirando capturas se prueba mal: acá se puede jugar solo, saltar a
   un instante de la cinemática y leer el estado. */
/* el arnes de pruebas inyecta su propio `__errs` en el <head>, o sea ANTES de que
   este modulo se evalue: pisandolo con un array nuevo se perderian justamente los
   errores del arranque, que son los que importan */
window.__errs = window.__errs || [];
addEventListener('error', (e) => window.__errs.push(String(e.message)));
addEventListener('unhandledrejection', (e) => window.__errs.push('promesa: ' + e.reason));

window.__J = {
  id: JUEGO.id,
  estado: () => JSON.stringify({ modo: MODO, puntos: PUNTOS, mejor: MEJOR,
    marca: JUEGO.marca, resta: JUEGO.resta == null ? null : +JUEGO.resta.toFixed(3),
    vivo: !!JUEGO.vivo, fps, esc: +ESC.toFixed(3), lienzo: [lienzo.width, lienzo.height] }),
  lang: (l) => { ponIdioma(l); return LANG; },
  menu: () => { alMenu(); return MODO; },
  jugar: () => { jugar(); return MODO; },
  empieza: () => { empieza(); return MODO; },
  /* la cinemática en un instante exacto, CONGELADA. Sin congelar, entre que la
     sonda escribe el segundo y el navegador entrega la foto el bucle ya la
     corrió y la captura sale de otro instante — es el defecto que ya costó una
     vuelta en BARRIO y otra en PULSO. */
  /* Y APAGA EL FOGONAZO ANTES DE CONGELAR. `pasoFogonazo` corre dentro del
     `if (!CONGELADO)`, asi que congelando con el fogonazo a medio apagar el
     velo blanco de CSS QUEDA PUESTO para siempre: medido, una foto de la
     cinematica sacada justo despues de un golpe salia con un 6 % de blanco
     encima —el fondo pasaba de 28 a 43— y yo lo lei como que el plano estaba
     mal iluminado. El pixel del lienzo daba 28 en los dos casos. Una sonda que
     deja un velo encima no fotografia lo que le piden. */
  cine: (t) => { armaAudio(); CINE.on = true; MODO = 'cine'; CINE.gracia = 9e9;
                 _flash = 0; $('flash').style.opacity = '0';
                 CINE.dur = JUEGO.planos.reduce((a,p) => a+p.dur, 0);
                 CINE.t = Math.max(0, Math.min(CINE.dur - 0.01, t));
                 CONGELADO = true;
                 for (const p of document.querySelectorAll('.pan')) p.classList.remove('on');
                 $('cine').classList.add('on');
                 cinePon(CINE.t);
                 return JSON.stringify({ t: +CINE.t.toFixed(2), dur: +CINE.dur.toFixed(2),
                                         plano: CINE.plano, pie: $('cine').textContent }); },
  correr: () => { CONGELADO = false; return true; },
  /* toca en unidades de diseño, por el mismo camino que un dedo */
  toca: (x, y) => { if (JUEGO.baja) JUEGO.baja(x, y);
                    if (JUEGO.sube) JUEGO.sube(x, y);
                    return JSON.stringify({ puntos: PUNTOS, vivo: !!JUEGO.vivo }); },
  /* ── UN ARRASTRE OCUPA TIEMPO, Y ESO HUBO QUE MEDIRLO ──
     La primera version solo llamaba a `mueve` veinte veces seguidas, sin
     simular. Sirve para un juego que reacciona en el evento —RASPA borra la
     mugre ahi mismo— y NO SIRVE para uno cuyo movimiento vive en `paso`:
     medido en MANCHA, el dedo dejaba el destino puesto, la mancha no se movia
     ni un pixel y el arrastre devolvia 0 %. Y no fallaba: contestaba.
     Ahora cada muestra adelanta la simulacion, que es lo que pasa de verdad
     cuando un dedo cruza la pantalla en un tercio de segundo. */
  arrastra: (x0, y0, x1, y1, n, pasos) => {
    const N = n || 20, P = pasos == null ? 2 : pasos;
    if (JUEGO.baja) JUEGO.baja(x0, y0);
    for (let i = 1; i <= N; i++){
      if (JUEGO.mueve) JUEGO.mueve(x0 + (x1-x0)*i/N, y0 + (y1-y0)*i/N);
      for (let k = 0; k < P && JUEGO.vivo; k++) JUEGO.paso(PASO);
    }
    if (JUEGO.sube) JUEGO.sube(x1, y1);
    return JSON.stringify({ puntos: PUNTOS, vivo: !!JUEGO.vivo });
  },
  /* avanza la simulación sin dibujar: así una partida de cuarenta segundos se
     prueba en un instante y no en cuarenta segundos */
  avanza: (segs) => { const n = Math.round(segs*60);
                      for (let i = 0; i < n && JUEGO.vivo; i++) JUEGO.paso(PASO);
                      return JSON.stringify({ vivo: !!JUEGO.vivo, puntos: PUNTOS,
                                              resta: JUEGO.resta == null ? null : +JUEGO.resta.toFixed(3) }); },
  pico: () => pico(),
  assets: () => JSON.stringify(asEstado()),
  /* la caja de cada elemento visible del DOM, para poder comprobar que nada se
     solapa en una pantalla chica sin mirar una captura */
  cajas: () => {
    const out = {};
    for (const id of ['marca','sub','reloj','cine','finT','finP','mejor']){
      const e = $(id); if (!e) continue;
      const r = e.getBoundingClientRect();
      /* «visible» tiene que incluir que MIDA algo: un elemento adentro de un
         panel con `display:none` devuelve una caja de 0×0 y decía visible */
      const vis = r.width > 0 && r.height > 0 &&
                  getComputedStyle(e).display !== 'none' &&
                  +getComputedStyle(e.closest('.pan') || e).opacity !== 0;
      out[id] = { x: Math.round(r.left), y: Math.round(r.top),
                  w: Math.round(r.width), h: Math.round(r.height), vis };
    }
    return JSON.stringify(out);
  },
  /* el marcador se pone en cero antes de cada corrida: `arranca()` no lo toca
     —lo hace `empieza()`— asi que dos corridas seguidas informaban el puntaje
     de la anterior y el numero mentia sin que nada fallara */
  juegaSolo: (n, azar) => { PUNTOS = 0; rachaCero();
    return JSON.stringify(JUEGO.juegaSolo ? JUEGO.juegaSolo(n || 3000, azar) : 'sin auto'); }
};

/* ══════════════════════ ARRANQUE ══════════════════════ */
medir();
cargaImg();
pieles();
pintaIdioma();
pintaJuego();
bucle();
</script></body></html>
