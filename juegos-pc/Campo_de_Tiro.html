/* ===================== IK de dos huesos (hombro→codo→mano) sobre el rig del juego ===================== */
let bRArm=null,bRFore=null,bRHand=null,bLArm=null,bLFore=null,bLHand=null;
let bSp=null,bSp01=null,bSp02=null,bRSho=null,bLSho=null;
function tiroGrabBone(o){ const n=(o.name||'').toLowerCase().replace('mixamorig','');
  if(n==='rightarm')bRArm=o; else if(n==='rightforearm')bRFore=o; else if(n==='righthand')bRHand=o;
  else if(n==='leftarm')bLArm=o; else if(n==='leftforearm')bLFore=o; else if(n==='lefthand')bLHand=o;
  else if(n==='spine')bSp=o; else if(n==='spine01')bSp01=o; else if(n==='spine02')bSp02=o;
  else if(n==='rightshoulder')bRSho=o; else if(n==='leftshoulder')bLSho=o; }

/* ===================== MÁSCARA: la animación manda de la cintura para ABAJO =====================
   Los clips (idle/walk/run/jump/slide/wallrun/mantle/climb) mueven Hips y las piernas y nada más.
   De Spine para arriba manda el código: cada frame, DESPUÉS de bodyMixer.update() y ANTES de todo lo
   procedural, estos 15 huesos vuelven a su pose de BIND, y desde ahí se compone la postura de fusil
   (pitch repartido en la columna, bamboleo, IK de los dos brazos).
   ¿Cuál es la POSE BASE? Medido en este GLB: ni la pose de enlace (skeleton.boneInverses) ni la pose de
   reposo de los nodos sirven — con cualquiera de las dos el torso se dobla y la cabeza cae de 1,76 m a
   0,86 m (o sea, este rig no está modelado de pie en reposo). La que sí sirve es el PRIMER FOTOGRAMA DEL
   CLIP 'idle': un personaje de pie, derecho, mirando al frente. Se lee del propio AnimationClip, así que
   no depende de en qué momento corra el mixer.
   Se restauran quaternion, posición Y escala: el mixer pisa las tres. */
const MSK_NOMBRES=['spine','spine01','spine02','neck','head','head_end','headfront',
  'leftshoulder','leftarm','leftforearm','lefthand',
  'rightshoulder','rightarm','rightforearm','righthand'];
let mskBind=null, mskHips=null;
function mskCapturar(raiz,clips){  // raiz = el rig LOCAL del jugador (nunca mpBodySrc ni un avatar remoto)
  if(mskBind||!raiz)return 0;
  const porNom=new Map(), lst=[]; let hips=null;
  raiz.traverse(o=>{               // pre-orden: padres antes que hijos
    if(!o.isBone)return;
    const n=(o.name||'').toLowerCase().replace('mixamorig','');
    const enMask=MSK_NOMBRES.indexOf(n)>=0, esHips=(n==='hips');
    if(!enMask&&!esHips)return;
    if(!(o.quaternion.lengthSq()>0.9))return;   // pose inválida → afuera (si no, NaN silencioso más tarde)
    const r={h:o,q:o.quaternion.clone(),p:o.position.clone(),e:o.scale.clone()};
    porNom.set(o.name,r);
    if(enMask) lst.push(r); else hips=r;   // la cadera NO se restaura: es de las piernas
  });
  mskHips=hips;
  const cl=(clips||[]).filter(c=>/^idle$/i.test(c.name||''))[0];
  if(cl) for(const tr of cl.tracks){              // primer fotograma del idle = la pose base de fusil
    const i=(tr.name||'').lastIndexOf('.'); if(i<0)continue;
    const r=porNom.get(tr.name.slice(0,i)); if(!r)continue;
    const prop=tr.name.slice(i+1), v=tr.values;
    if(prop==='quaternion'&&v.length>=4){ const q=new THREE.Quaternion(v[0],v[1],v[2],v[3]); if(q.lengthSq()>0.9) r.q.copy(q); }
    else if(prop==='position'&&v.length>=3&&isFinite(v[0])) r.p.set(v[0],v[1],v[2]);
    else if(prop==='scale'&&v.length>=3&&v[0]>1e-4) r.e.set(v[0],v[1],v[2]);
  }
  if(lst.length) mskBind=lst;      // se esperan 15 (__tiro.est().mask lo dice)
  return lst.length;
}
function mskAplicar(){ if(!mskBind)return;
  for(let i=0;i<mskBind.length;i++){ const r=mskBind[i];
    r.h.quaternion.copy(r.q); r.h.position.copy(r.p); r.h.scale.copy(r.e); } }
/* TORSO EN ESPACIO MUNDO. De la cintura para arriba manda el código: para cada vértebra se COMPONE la
   orientación MUNDIAL deseada y recién ahí se convierte a local. La cadera sigue 100% animada (las piernas
   la necesitan y la deslizada tiene que bajar de verdad), pero el tronco sólo hereda la FRACCIÓN de su
   vuelco que uno elija.

   OJO CON EL ORDEN DE LA CADENA (medido en este GLB, NO es el que sugieren los nombres):
       Hips → Spine02 → Spine01 → Spine → neck → Head       ({Left,Right}Shoulder cuelgan de 'Spine')
   O sea 'Spine02' es la LUMBAR (hija de Hips) y 'Spine' es el PECHO. La versión anterior escribía
   spineLocal = inv(caderaAhora)·caderaBase·spineBase sobre 'Spine', cuyo padre es 'Spine01' y no 'Hips':
   la fórmula estaba en el marco equivocado además de topeada, así que no compensaba nada (corriendo
   quedaban 58° de vuelco de tronco y al deslizarse la cabeza se iba 0,20 m del otro lado del pecho).

   Fórmula, por vértebra i:
       qDev  = qCaderaAhora · inv(qCaderaBase)                      (desvío de la pelvis, marco del padre)
       qW[i] = qW(padreDeHips) · slerp(I,qDev,k[i]) · (qCaderaBase·qSpine02Base·…·qBase[i])
       local = inv(qW(padre real de i)) · qW[i]
   El marco del padre de Hips ya trae bodyRoot.rotation.y = faceYaw+π, así que encarar la mira sale gratis.
   k[] es ACUMULATIVO en mundo: el doblez de cada articulación es la diferencia (1−k₁),(k₁−k₂),(k₂−k₃).
   Con el pico medido de desvío de pelvis (64° corriendo) k=[0.40,0.22,0.10] reparte −38°/−12°/−8° y deja
   el pecho a 6° del mundo. Con k=0 el corte entero cae en una sola articulación (no hay huesos de cintura
   para repartirlo) y se pierde el bamboleo; con k>0.55 el pecho se lleva los hombros y el error de la mano
   izquierda se triplica. */
const TORSO_ORD=['spine02','spine01','spine'];   // lumbar → media → pecho (el orden REAL de la cadena)
const TORSO_K=[0.40,0.22,0.10];
let torsoR=null;
function torsoInit(){ if(torsoR||!mskBind)return;
  const f=n=>mskBind.filter(r=>(r.h.name||'').toLowerCase().replace('mixamorig','')===n)[0]||null;
  torsoR=TORSO_ORD.map(f); }
const _tU=new THREE.Quaternion(), _tV=new THREE.Vector3();
const _tP=new THREE.Quaternion(),_tD=new THREE.Quaternion(),_tC=new THREE.Quaternion(),
      _tK=new THREE.Quaternion(),_tW=new THREE.Quaternion(),_tI=new THREE.Quaternion();
function mskTorsoMundo(){
  torsoInit(); if(!torsoR||!torsoR[0]||!mskHips||!mskHips.h.parent)return;
  mskHips.h.parent.getWorldQuaternion(_tP);                                  // 'Armature': trae faceYaw
  _tD.copy(mskHips.h.quaternion).multiply(_tI.copy(mskHips.q).invert());     // desvío contra el reposo del CLIP
  _tC.copy(mskHips.q);                                                       // cadena base acumulada
  for(let i=0;i<3;i++){ const r=torsoR[i]; if(!r)continue;
    _tC.multiply(r.q);
    _tK.set(0,0,0,1).slerp(_tD,TORSO_K[i]);          // fracción del vuelco de pelvis que se deja pasar
    _tW.copy(_tP).multiply(_tK).multiply(_tC);       // ORIENTACIÓN MUNDIAL DESEADA de esta vértebra
    // getWorldQuaternion() hace updateWorldMatrix(true,false): recompone la matriz local del padre desde
    // el quaternion recién escrito, así que el hijo ya ve al padre corregido sin updateMatrixWorld(true).
    r.h.parent.getWorldQuaternion(_tI); _tI.invert();
    r.h.quaternion.copy(_tI).multiply(_tW);

       vértebra colgando de la cadera ANIMADA: su offset de bind se giraba con esos 130° de diferencia
       entre los dos espacios y Spine02 terminaba 6 cm POR DEBAJO de la cadera. Se recoloca con el
       mismo offset de bind pero girado por la cadera ERGUIDA; de ahí para arriba la cadena ya hereda
       bien, porque cada vértebra cuelga de una orientación que acabamos de fijar. */
    if(i===0){ _tU.copy(_tP).multiply(_tK).multiply(mskHips.q);       // cadera "erguida" (sin el vuelco de más) en mundo
      _tV.copy(r.p).applyQuaternion(_tU);              // offset de bind, en MUNDO
      r.h.position.copy(_tV.applyQuaternion(_tI)); } } // …y de vuelta al marco del padre
}
const _ikA=new THREE.Vector3(),_ikB=new THREE.Vector3(),_ikC=new THREE.Vector3(),_ikT=new THREE.Vector3(),
      _ikD=new THREE.Vector3(),_ikN=new THREE.Vector3(),_ikP=new THREE.Vector3(),_ikU=new THREE.Vector3(),
      _qa=new THREE.Quaternion(),_qb=new THREE.Quaternion(),_qc=new THREE.Quaternion(),_qd=new THREE.Quaternion();
// maxAng limita cuánto puede APARTARSE el hueso de la animación. Sin esto, en poses extremas (deslizada) el IK
// rotaba el brazo ~180° respecto al hombro y los vértices compartidos del deltoides se estiraban en láminas
// que cruzaban toda la pantalla. Limitar el ángulo = bajar el peso del slerp.
function _aimBone(bone,qWorldNuevo,w,maxAng){ bone.parent.getWorldQuaternion(_qc); _qc.invert(); _qd.copy(_qc).multiply(qWorldNuevo);
  if(maxAng){ const d=Math.min(1,Math.abs(bone.quaternion.dot(_qd))), ang=2*Math.acos(d);
    if(ang>maxAng) w=Math.min(w,maxAng/ang); }
  bone.quaternion.slerp(_qd,w); bone.updateMatrixWorld(true); }
let TIRO_IKMAX=1.65;
function ikTwoBone(up,low,end,target,pole,w){
  if(!up||!low||!end)return;

  //      grado de libertad que asienta el arma en las manos SIN mover el punto de impacto: 0° de desvío
  //      del caño por construcción.
  //   3) PIVOTE EN EL AGARRE, no en la raíz: GRIP_R queda invariante y no hace falta correa después.
  _gp2.copy(_gL).applyMatrix4(gunRoot.matrixWorld);
  if(!rcOn && _hL.distanceTo(_gp2)<0.020){
    _gA.subVectors(_gp2,_hR); _gB.subVectors(_hL,_hR);
    if(_gA.lengthSq()>1e-6 && _gB.lengthSq()>1e-6){ _gA.normalize(); _gB.normalize();

      if(ang>1e-4){ _ikN.crossVectors(_gA,_gB);
        if(_ikN.lengthSq()>1e-9){ _ikN.normalize();
          const rol=Math.max(-0.25,Math.min(0.25, ang*_ikN.dot(_cf)));
          if(Math.abs(rol)>1e-4){ _qa.setFromAxisAngle(_cf,rol);
            _gp.copy(GUN_GRIP_R).applyMatrix4(gunRoot.matrixWorld);
            gunRoot.position.sub(_gp).applyQuaternion(_qa).add(_gp);
            gunRoot.quaternion.premultiply(_qa); gunRoot.updateMatrixWorld(true); } } } } }
  // EJE DE LOS DEDOS. La caja de la empuñadura está en (0,−0.105,0.115) con rotation.x=+0.30, así que su eje
  // arriba→abajo en local es (0,−0.955,−0.296), o sea −0.955·_cu + 0.296·_cf en mundo. El vector viejo
  // MANOS: con el cuerpo procedural el puño se construyó CENTRADO en el hueso y con el agujero a lo largo
  // de su eje X local (ver cuMano). Así que orientar la mano es alinear ese eje con el eje del agarre: el mango
  // (inclinado 0,30 rad) para la derecha y el guardamanos (eje Z del arma) para la izquierda. Sin dedos
  // articulados no hay cierre, pero el arma queda ADENTRO del puño, que es lo que se ve.
  if(DBG.mun){
    _ejeR.set(0,Math.cos(0.30),Math.sin(0.30)).applyQuaternion(gunRoot.quaternion);
    _ejeL.set(0,0,1).applyQuaternion(gunRoot.quaternion);
    cuOrientarMano(bRHand,_ejeR,_cf,1);
    cuOrientarMano(bLHand,_ejeL,_cu,1);
  }
  // ---- fogonazo y efectos cortos ----
  if(flashT>0){ gunFlash.visible=gunFlash2.visible=true;
    const es=0.72+Math.random()*0.7; gunFlash.scale.setScalar(es); gunFlash2.scale.setScalar(es*0.8); gunFlash.rotation.z=Math.random()*3.14;
    gunLight.intensity=26; flashT-=dt; if(flashT<0)flashT=0; }
  else if(gunFlash.visible){ gunFlash.visible=gunFlash2.visible=false; gunLight.intensity=0; }
  for(const tr of tiroTracers){ if(tr.userData.v>0){ tr.material.opacity=Math.max(0,tr.userData.v/0.075)*0.9; tr.userData.v-=dt;
    if(tr.userData.v<=0){ tr.visible=false; tr.userData.v=0; } } }
  for(const sp of tiroSparks){ if(sp.userData.v>0){ sp.material.opacity=Math.max(0,sp.userData.v/0.16); sp.scale.multiplyScalar(1+dt*7); sp.userData.v-=dt;
    if(sp.userData.v<=0){ sp.visible=false; sp.userData.v=0; } } }
  if(_msgT>0){ _msgT-=dt; if(_msgT<=0){ const el=document.getElementById('tiroMsg'); if(el)el.style.opacity='0'; } }
}

function tickAim(dt){
  recBack+=(0-recBack)*Math.min(1,13*dt); recUp+=(0-recUp)*Math.min(1,11*dt);
  if(recCam>0.0001||Math.abs(recYaw)>0.0001){ camera.rotateX(-recCam); camera.rotateY(recYaw*0.6);
    recCam+=(0-recCam)*Math.min(1,9*dt); recYaw+=(0-recYaw)*Math.min(1,9*dt); }
  if(!enTiro()){ if(gunRoot)gunRoot.visible=false; return; }
  if(tiroRel>0){ tiroRel-=dt;
    const e=TIRO_RELOAD-tiroRel;
    if(gunRoot){ try{ rcEventos(e); }catch(err){} }
    RC.ch = kfRC(e,[[1.02,0],[1.10,1],[1.16,1],[1.22,0]]);   // tirar de la manija y soltarla
    if(tiroRel<=0){ tiroRel=0; RC.act=false; RC.ch=0; if(tiroAmmo<TIRO_MAG){ tiroAmmo=TIRO_MAG; tiroHUD(); } } }
  rcTick(dt);

function tickTiro(dt){
  // aceros caídos: se levantan solos
  for(const o of tiroTargets){ const u=o.userData; if(u.kind!=='steel')continue;
    if(u.down){ u.t+=dt; const a=Math.min(1,u.t/0.18); u.piv.rotation.x=1.45*(a*a*(3-2*a));
      if(u.t>3.0){ u.down=false; u.t=0; } }
    else if(u.piv.rotation.x>0.001){ u.piv.rotation.x*=Math.max(0,1-6*dt); if(u.piv.rotation.x<0.002)u.piv.rotation.x=0; } }

}

/* ===================== SONIDO del arma (síntesis WebAudio: cero descargas) ===================== */
let TCTX=null,_nb=null,_rev=null,_revG=null;
function tctx(){ if(TCTX!==null)return TCTX; try{ TCTX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ TCTX=false; } return TCTX; }
function nbuf(c){ if(_nb)return _nb; const n=(c.sampleRate*0.5)|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1); _nb=b; return b; }
function reverb(c){ if(_rev)return _revG; const n=(c.sampleRate*1.6)|0,b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++){ const e=Math.pow(1-i/n,2.6); d[i]=(Math.random()*2-1)*e*0.55; } }
  _rev=c.createConvolver(); _rev.buffer=b; _revG=c.createGain(); _revG.gain.value=0.42; _revG.connect(_rev); _rev.connect(c.destination); return _revG; }
function tiroSnd(k){ const c=tctx(); if(!c||!AUD.on)return; if(c.state==='suspended'){ try{c.resume();}catch(e){} }
  const t0=c.currentTime, out=c.destination, wet=reverb(c);
  const noise=(dur,f0,f1,vol,hp)=>{ const s=c.createBufferSource(); s.buffer=nbuf(c); const lp=c.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(f0,t0); lp.frequency.exponentialRampToValueAtTime(Math.max(80,f1),t0+dur);
    const h=c.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp||90; const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.004); g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    s.connect(h); h.connect(lp); lp.connect(g); g.connect(out); g.connect(wet); s.start(t0); s.stop(t0+dur+0.05); return g; };
  const tono=(f0,f1,dur,vol,tipo)=>{ const o=c.createOscillator(),g=c.createGain(); o.type=tipo||'sine';
    o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.006); g.gain.exponentialRampToValueAtTime(0.0006,t0+dur);
    o.connect(g); g.connect(out); g.connect(wet); o.start(t0); o.stop(t0+dur+0.02); };
  if(k==='shot'){ noise(0.26,6200,380,0.62,140); tono(165,44,0.15,0.42,'sine'); noise(0.05,9000,4000,0.22,2200); }
  else if(k==='ping'){ tono(1560,880,0.5,0.20,'triangle'); tono(2380,1500,0.34,0.11,'sine'); noise(0.06,7000,2000,0.10,900); }
  else if(k==='papel'){ noise(0.07,4200,700,0.16,300); }
  else if(k==='pared'){ noise(0.10,2600,300,0.20,180); tono(320,120,0.09,0.10,'square'); }
  else if(k==='dry'){ noise(0.035,5200,1400,0.16,700); }
  else if(k==='mag'){ noise(0.045,3200,700,0.20,300); }
  else if(k==='mag2'){ noise(0.05,3600,600,0.22,300); tono(240,120,0.05,0.10,'square'); }
  else if(k==='cerrojo'){ noise(0.055,5200,900,0.24,600); tono(420,150,0.07,0.14,'square'); noise(0.03,7000,2500,0.12,1500); }
}

/* ===================== controles del arma (móvil: botones · PC: mouse/teclado) =====================
   En PC el modelo de dos dedos no sirve para disparar: arrastrar para mirar y disparar serían el mismo gesto.
   Solución: si detecto teclado/mouse, WASD camina (escribe el mismo `joy` que el joystick) y el mouse mira con
   pointer lock, así el click izquierdo queda libre para el gatillo. En celular no cambia nada. */
// G2 · TOPE DE PITCH DEL CAMPO DE TIRO. Medido por captura: de -0.90 a +0.25 rad la malla está limpia;
// desde +0.28-0.30 las astillas de la mano izquierda se multiplican y a +0.60 la mano está destrozada.
// La causa es estructural (la pose que restaura mskAplicar tiene los brazos COLGANDO, así que el IK gasta
// 70-95° de desviación sólo en llegar a la posición de fusil, con pitch 0: no queda margen para el pitch)
// y no la arregla ninguna constante: se probó TIRO_IKMAX en 0.10…3.10 y la distancia del objetivo en
// 0.42/0.30/0.24, y toda configuración que hace que la mano LLEGUE rompe MÁS la malla.
// Además el agarre izquierdo (magwell) sólo se sostiene hasta +0.30 (palma a 12,5 mm; a +0.40 ya son 24).
// No cuesta juego: los blancos son papel a 10/25/45 m y acero a 15/29/34 m, todos en o bajo el horizonte.
// El tope es SÓLO del campo de tiro: el parkour sigue con 1.3 (necesita mirar cornisas).
const TIRO_PIT_MAX=1.30;   // rango completo: el tope de 0.25 era un parche por las púas del skinning
function pitMax(){ return (world==='tiro')?TIRO_PIT_MAX:1.3; }
// mundos donde SE JUEGA con el fusil: la galería y la isla. Antes alcanzaba con world==='tiro'.
function enTiro(){ return world==='tiro'||world==='alcatraz'; }
let _pc=false;
const TCL={w:false,a:false,s:false,d:false};
function tiroJoyTeclas(){ let x=(TCL.d?1:0)-(TCL.a?1:0), y=(TCL.s?1:0)-(TCL.w?1:0);
  const l=Math.hypot(x,y); if(l>1){ x/=l; y/=l; }
  joy.x=x; joy.y=y; if(knob) knob.style.transform='translate('+(x*38)+'px,'+(y*38)+'px)'; }
function tiroWire(){ if(_tiroWired)return; _tiroWired=true;
  try{ tiroBest=parseInt(localStorage.getItem('pf_tiro_best')||'0',10)||0; }catch(e){}
  const bf=document.getElementById('bFire'), br=document.getElementById('bReload');
  const down=e=>{ if(editHUD)return; e.preventDefault(); e.stopPropagation(); audioStart(); tiroFire=true; };
  const up=e=>{ tiroFire=false; };
  if(bf){ bf.addEventListener('pointerdown',down); bf.addEventListener('pointerup',up); bf.addEventListener('pointercancel',up); bf.addEventListener('pointerleave',up); }
  if(br){ br.addEventListener('pointerdown',e=>{ if(editHUD)return; e.preventDefault(); e.stopPropagation(); tiroReload(); }); }
  // APUNTAR: en el celular es un interruptor (no se puede mantener apretado y mirar a la vez);
  // en PC es el botón derecho del mouse, que es donde la mano ya lo busca.
  const ba=document.getElementById('bAds');
  if(ba){
    ba.addEventListener('pointerdown',e=>{ if(editHUD)return; e.preventDefault(); e.stopPropagation();

  addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.button!==0)return; if(!enTiro()||!gameplayActive())return; if(isBtn(e.target))return; audioStart(); tiroFire=true; },true);
  addEventListener('pointerup',e=>{ if(e.pointerType==='mouse')tiroFire=false; });
  addEventListener('blur',()=>{ tiroFire=false; });
  // teclado (PC): WASD camina en cualquier mundo, R recarga y espacio salta
  addEventListener('keydown',e=>{ if(e.ctrlKey||e.metaKey||e.altKey)return; _pc=true; if(!gameplayActive())return;

      else if(k==='shift'){ startSlide(); }

      else if((k==='shift')&&enTiro()){ adsQ=1; }

    e.preventDefault(); if(m)tiroJoyTeclas(); });
  addEventListener('keyup',e=>{ const k=(e.key||'').toLowerCase();
    if(k==='shift'){ adsQ=0; return; }
    if(k==='w'||k==='arrowup')TCL.w=false; else if(k==='s'||k==='arrowdown')TCL.s=false;
    else if(k==='a'||k==='arrowleft')TCL.a=false; else if(k==='d'||k==='arrowright')TCL.d=false; else return;
    tiroJoyTeclas(); });
  // mouse (PC): pointer lock para mirar → el click izquierdo queda libre para el gatillo
  const cv=renderer.domElement;

    if(!document.pointerLockElement && cv.requestPointerLock){ try{ cv.requestPointerLock(); }catch(e){} } });
  addEventListener('mousemove',e=>{ if(document.pointerLockElement!==cv)return;
    const lk=LOOK*sensMul*1.15*(1-0.45*adsW); player.yaw-=(e.movementX||0)*lk;
    player.pitch=Math.max(-0.9,Math.min(pitMax(),player.pitch-(e.movementY||0)*lk)); });
  addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse')_pc=true; },true);
}

/* ===================== CUERPO PROCEDURAL (sin GLB, sin skinning) =====================
   El modelo skinned se fue entero. Queda su ESQUELETO (24 huesos, mismos nombres y jerarquía) y sus
   ANIMACIONES de cadera+piernas, embebidas en CUERPO_DATOS: three bindea las pistas por NOMBRE DE NODO,
   así que el mismo AnimationMixer reproduce los mismos clips sobre un esqueleto hecho por código.

   Por qué: los tres bugs que no se pudieron cerrar en tres rondas eran de SKINNING o de huesos que no existen.
     · la piel se abría en púas desde +34° de pitch  → no hay piel: cada parte es una pieza rígida
     · la mano atravesaba el arma                     → el rig no tenía dedos; acá la mano se modela ENVOLVIENDO
     · la cabeza tapaba la lente                      → es una pieza más: no se dibuja y listo
   Además el juego pasa de bajar 1,26 MB a no bajar nada: las pistas pesan 101 KB y van adentro del HTML.

   Unidades: TODO el esqueleto vive en unidades de hueso del GLB (1 u = 0.010882 m) y el grupo raíz lleva esa
   escala. Así los valores de las pistas se aplican sin convertir nada — convertir era el bug de unidades que
   tuvo la cadera clavada al piso durante tres rondas. Las piezas se escriben en METROS y se multiplican por U. */
const CU_ESC=0.010882;              // 1 unidad de hueso → metros (Armature 0.01 · bodyScale 1.0882)
const U=1/CU_ESC;                   // metros → unidades de hueso
const CU_BRAZO=1.06;                // el brazo se alarga un 6%: con el rig original la mano de apoyo NO llegaba
                                    // al guardamanos (0,63 m de cadena contra 0,545 de alcance). Ahora elijo yo.
let cuCabezaG=null, cuPiezas=[], cuSoloTP=[];   // cuSoloTP: piezas que en 1ª persona sólo estorban (pecho, cuello, cabeza)
const CU_MAT={};
function cuMats(){
  if(CU_MAT.cuerpo)return;
  const M=(c,r,m)=>{ const t=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m||0}); t.userData._oc=[new THREE.Color(c)]; return t; };
  CU_MAT.cuerpo=M(0x87909a,0.66,0.06);   // maniquí gris claro
  CU_MAT.junta =M(0x5f686f,0.5,0.25);    // juntas más oscuras: definen el articulado y tapan las costuras
  CU_MAT.mano  =M(0x3f464b,0.55,0.15);   // "guantes"
  CU_MAT.manga =M(0x565e65,0.62,0.08);   // antebrazos: son los que se ven en 1ª persona; claros tapaban como una pared
  CU_MAT.cara  =M(0x828b93,0.7,0.04);
}
const cuCaja=(w,h,d)=>new THREE.BoxGeometry(w*U,h*U,d*U);
const cuCaps=(r,l)=>new THREE.CapsuleGeometry(r*U,Math.max(0.004,l-2*r)*U,4,10);
const cuEsf =(r)=>new THREE.SphereGeometry(r*U,12,9);
function cuPieza(padre,geo,x,y,z,mat,rx){
  const m=new THREE.Mesh(geo,mat||CU_MAT.cuerpo);
  m.position.set(x*U,y*U,z*U); if(rx)m.rotation.x=rx;
  m.castShadow=true; m.receiveShadow=true; m.frustumCulled=false;
  m.userData._oc=[m.material.color.clone()]; m.userData._om=[null];
  padre.add(m); cuPiezas.push(m); bodySkinMeshes.push(m); return m;
}
/* MANO QUE AGARRA. El puño se construye CENTRADO EN EL ORIGEN DEL HUESO: así, cuando el IK lleva la muñeca al
   punto de agarre, el arma queda literalmente DENTRO del puño. La ranura (palma ↔ dedos) corre en Z y el agujero
   del puño en X: el mango pasa por ahí. Sin dedos articulados no hay cierre real, pero sí hay envoltura real. */
function cuMano(hueso,lado){
  const g=new THREE.Group(); hueso.add(g);
  cuPieza(g,cuCaja(0.088,0.092,0.030), 0, 0, 0.036, CU_MAT.mano);          // palma
  cuPieza(g,cuCaja(0.086,0.078,0.028), 0, 0.006,-0.038, CU_MAT.mano);      // bloque de dedos (cierra la ranura)
  cuPieza(g,cuCaja(0.026,0.052,0.030), lado*0.046, 0.010, 0.004, CU_MAT.mano); // pulgar, cruzando la ranura
  cuPieza(g,cuCaja(0.080,0.030,0.086), 0,-0.052, 0.000, CU_MAT.mano);      // canto/base de la palma
  return g;
}
function cuLargo(h){                                   // largo del hueso = distancia a su primer hijo (metros)
  const c=h.children.filter(o=>o.isBone)[0];
  return c? c.position.length()*CU_ESC : 0.08;
}
function cuVestir(h){
  const n=(h.name||'').toLowerCase(), L=cuLargo(h);
  const cap=(r)=>cuPieza(h,cuCaps(r,L),0,L/2,0);   // devuelve la pieza (algunas se ocultan en 1ª persona)
  const jun=(r,y)=>cuPieza(h,cuEsf(r),0,y,0,CU_MAT.junta);
  if(n==='hips'){ cuPieza(h,cuCaja(0.30,0.19,0.23),0,0.04,0.005); jun(0.10,0); }
  else if(n==='spine02'){ cuPieza(h,cuCaja(0.29,L+0.02,0.21),0,L/2,0.005); }
  else if(n==='spine01'){ cuPieza(h,cuCaja(0.32,L+0.02,0.22),0,L/2,0.005); }
  else if(n==='spine'){   cuSoloTP.push(cuPieza(h,cuCaja(0.375,0.215,0.245),0,0.055,0.005));   // pecho
                          cuSoloTP.push(cuPieza(h,cuCaja(0.30,0.075,0.20),0,0.155,0.005)); }    // trapecio
  else if(n==='neck'){ cuSoloTP.push(cap(0.048)); }
  else if(n==='head'){ cuCabezaG=new THREE.Group(); h.add(cuCabezaG);
    cuPieza(cuCabezaG,cuCaja(0.175,0.215,0.205),0,0.085,0.004);
    cuPieza(cuCabezaG,cuCaja(0.150,0.075,0.020),0,0.090, 0.108,CU_MAT.cara);    // visor: da dirección a la cara (+Z = adelante en este rig)
    cuPieza(cuCabezaG,cuEsf(0.052),0,0.195,0.01,CU_MAT.junta); }
  else if(/shoulder$/.test(n)){ cap(0.055); jun(0.066,L); }
  else if(/(^|[^e])arm$/.test(n)){ cap(0.053); jun(0.056,L); }                   // brazo → codo
  else if(/forearm$/.test(n)){ cuPieza(h,cuCaps(0.042,L),0,L/2,0,CU_MAT.manga); jun(0.046,L); }                       // antebrazo → muñeca
  else if(/hand$/.test(n)){ cuMano(h, n[0]==='r'?1:-1); }
  else if(/upleg$/.test(n)){ cap(0.086); jun(0.092,L); }
  else if(/leg$/.test(n)){ cap(0.068); jun(0.072,L); }
  else if(/foot$/.test(n)){ cuPieza(h,cuCaja(0.105,L+0.03,0.085),0,(L+0.03)/2,-0.012); }
  else if(/toebase$/.test(n)){ cuPieza(h,cuCaja(0.10,0.055,0.075),0,0.025,-0.008); }
}
/* pistas → AnimationClip. Los nombres de track son '<Hueso>.quaternion' / '.position', que es como
   PropertyBinding los busca en el subárbol del mixer. */
function cuClips(){
  const out=[];
  for(const nm in CUERPO_DATOS.c){ const c=CUERPO_DATOS.c[nm], tk=[];
    /* EL CUERPO NO SE ANIMABA. Las pistas horneadas guardan la rotación en `r` y la traslación en
       `t` (cada una {t:[tiempos], v:[valores]}), y acá se buscaban `q` y `p`: NINGUNA de las dos
       existe, así que los cinco clips se construían con CERO pistas. El personaje era un maniquí
       clavado —ni idle, ni caminar, ni correr, ni deslizarse— y el mixer avanzaba en el vacío.
       Medido antes del arreglo: cadera 1.007 m y pies 0.122/0.130 IDÉNTICOS parado, corriendo y
       deslizándose. Se aceptan los dos nombres por si alguna vez se hornea con el otro. */
    for(const h in c.b){ const b=c.b[h];
      const R=b.r||b.q, T=b.t||b.p;
      if(R) tk.push(new THREE.QuaternionKeyframeTrack(h+'.quaternion', R.t, R.v));
      if(T) tk.push(new THREE.VectorKeyframeTrack(h+'.position', T.t, T.v)); }
    out.push(new THREE.AnimationClip(nm, c.d, tk)); }
  return out;
}
function cuEsqueleto(){
  const hs=CUERPO_DATOS.h, bs=[];
  for(let i=0;i<hs.length;i++){ const d=hs[i], b=new THREE.Bone(); b.name=d.n;
    b.position.set(d.t[0],d.t[1],d.t[2]); b.quaternion.set(d.q[0],d.q[1],d.q[2],d.q[3]);
    bs.push(b); if(d.p>=0) bs[d.p].add(b); }
  // el brazo se alarga acá (las pistas no tocan brazos, así que no rompe ninguna animación)
  for(const b of bs){ const n=b.name.toLowerCase();
    if(/forearm$|hand$/.test(n)) b.position.multiplyScalar(CU_BRAZO); }
  return bs;
}
function construirCuerpo(){
  if(bodyRoot)return;
  cuMats();
  const bs=cuEsqueleto();
  const inner=new THREE.Group(); inner.name='Armature';
  inner.scale.setScalar(CU_ESC); inner.add(bs[0]);

  let targetRoll=0;
  if(player.wallrun) targetRoll += player.wallrun*0.28;
  player.roll+=(targetRoll-player.roll)*Math.min(1,10*dt);
  // FOV kick por velocidad / wallrun / slide
  const targetFov=baseFov + Math.min(5,sp*0.4) + (player.wallrun?4:0) + (player.sliding?6:0);   // base 90: kicks suaves
  player.fov+=(targetFov-player.fov)*Math.min(1,6*dt); if(Math.abs(camera.fov-player.fov)>0.05){camera.fov=player.fov;camera.updateProjectionMatrix();}
  // ---- cámara FP: a la altura de la cabeza (bob vertical real del hueso) pero CENTRADA en el cuerpo ----
  // XZ estable (centro del cuerpo + un poco adelante) → quieto miras AL FRENTE, no al hombro; sólo la ALTURA viene del hueso de la cabeza
  if(bodyHead && !player.rolling){ bodyHead.getWorldPosition(_camAnchor);
    if(typeof tiroOjoY==='number' && isFinite(tiroOjoY)) _camAnchor.y=tiroOjoY; }   // ← la MISMA altura que usa el arma
  else { _camAnchor.set(player.pos.x, player.pos.y+EYE, player.pos.z); }         // roll/carga: altura estable → la vuelta de cámara queda limpia (no se traga el cuerpo)
  const fwH=_v.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  // al deslizarse: baja un poquito y queda un poco ADELANTE de la cabeza — suave
  const targetLow = 0;   // la cadera animada ya baja la cabeza sola; bajar la lente ademas la dejaba a la altura del hombro
  const targetBack = 0;
  player.camLow += (targetLow - player.camLow)*Math.min(1,12*dt);
  player.camBack += (targetBack - player.camBack)*Math.min(1,12*dt);
  const fwd = CAM_FWD - player.camBack;
  camera.position.set(_camAnchor.x + fwH.x*fwd, _camAnchor.y + CAM_UP - player.camLow, _camAnchor.z + fwH.z*fwd);
  // ---- LEAN: la cámara se inclina hacia adelante al correr/deslizar (se mueve con el cuerpo, no queda dura) ----
  const moveAmt=Math.min(1,sp/RUN);
  const targetLean = -0.17*moveAmt - (player.sliding?0.12:0);        // adelante (mirar un poco abajo) según velocidad
  aSldCam += ((player.sliding?1:0)-aSldCam)*Math.min(1,(player.sliding?16:6)*dt);
  leanPitch += (targetLean-leanPitch)*Math.min(1,5*dt);
  player.bob += dt*(7*moveAmt+0.001);                               // cadencia de pasos
  const targetRollB = Math.sin(player.bob)*0.03*moveAmt;             // balanceo suave al caminar/correr
  leanRoll += (targetRollB-leanRoll)*Math.min(1,8*dt);
  // VOLTERETA: la cámara da una vuelta completa hacia adelante (inmersión total del giro)
  let rollCam=0;
  // la VUELTA DE CÁMARA (giro completo) sólo en 1ª persona; en 3ª persona NO se cambia de vista: se ve el cuerpo dando la voltereta
  if(player.rolling && camView!=='tp'){ const t=Math.min(1,player.rollT/ROLL_DUR); rollCam = -2*Math.PI*(t*t*(3-2*t)); }
  // en 3ª persona NO inclinamos la cámara (nada de balanceo/lean/roll): si no, el mundo y el cuerpo se ven CHUECOS
  const _lp=(camView==='tp')?0:leanPitch, _lr=(camView==='tp')?0:(player.roll+leanRoll);
  // TEMBLOR del deslizamiento: dos senos rápidos y desfasados (23-33 Hz) con la amplitud atada a
  // la velocidad. Es lo que hace que en primera persona se sienta el raspón contra el piso.
  let shP=0, shY=0, shR=0;
  if(aSldCam>0.002){
    const k=aSldCam*Math.min(1, Math.hypot(player.vel.x,player.vel.z)/RUN)*(0.55+0.45*sldSac);
    shP=(Math.sin(sldFase*33.0)*0.0130 + Math.sin(sldFase*19.7)*0.0075)*k;
    shY=(Math.sin(sldFase*27.3+1.1)*0.0115)*k;
    shR=(Math.sin(sldFase*23.1+0.6)*0.0340 + Math.sin(sldFase*41.0)*0.0090)*k;
  }
  euler.set(player.pitch+_lp+rollCam+shP, player.yaw+shY, _lr+shR); camera.quaternion.setFromEuler(euler);
  // ---- TERCERA PERSONA: cámara DETRÁS a la altura de los hombros; mirás arriba/abajo APUNTANDO (nunca se mete bajo el cuerpo → nada de cintura deformada) ----
  const tpTarget=(camView==='tp')?1:0;   // la deslizada NO sale de 1ª persona (sólo el modo 'tp' manual)
  player.camTP += (tpTarget-player.camTP)*Math.min(1,9*dt);
  if(player.camTP>0.02){
    const cx=player.pos.x, cy=player.pos.y+1.55, cz=player.pos.z;        // pivote a la altura de los hombros
    const _yv=player.yaw+(window.__tpOff||0);                            // __tpOff permite orbitar la 3ª persona (revisión del agarre)
    const bx=-Math.sin(_yv), bz=-Math.cos(_yv);                          // adelante horizontal (la cámara va detrás)
    const want=TP_DIST*player.camTP;
    const maxB=camClipDist(cx,cy,cz,-bx,0,-bz,want+0.3);                 // anti-clip horizontal contra paredes
    const back=Math.min(want,Math.max(0.4,maxB-0.3));
    camera.position.set(cx-bx*back, cy, cz-bz*back);                     // SIEMPRE a la altura de los hombros (nunca por debajo)
    if(enTiro()){                                                        // ← 3ª persona SOBRE EL HOMBRO (ver 2j)
      const rx=Math.cos(_yv), rz=-Math.sin(_yv);                         // eje derecha de la cámara
      const maxL=camClipDist(camera.position.x,cy,camera.position.z, rx,0,rz, TP_LAT+0.25);
      const lat=Math.min(TP_LAT*player.camTP, Math.max(0, maxL-0.25));
      camera.position.x+=rx*lat; camera.position.z+=rz*lat; }
    euler.set(player.pitch+rollCam, _yv, 0); camera.quaternion.setFromEuler(euler);   // la mirada sube/baja con el pitch (cielo o piso), el cuerpo nunca se deforma
  }

  sun.position.set(player.pos.x-40,80,player.pos.z-50); sun.target.position.copy(player.pos); sun.target.updateMatrixWorld();
  tickAim(dt);   // gatillo, recarga y patada de cámara: con la cámara ya orientada de este frame
}

/* ===================== GRÁFICOS (presets de calidad) ===================== */
// densidad/cobertura del césped optimizadas: low≈62k, med≈127k, high≈290k (antes 694k). r=radio de tiles (cobertura), sp=separación de briznas
const QUAL={ low:{pr:1.0,shadow:0,adapt:false,scale:0.5,far:320}, med:{pr:1.5,shadow:1024,adapt:true,far:320}, high:{pr:2.0,shadow:2048,adapt:true,far:320} };
let quality='med';
function applyQuality(q){ quality=q; const Q=QUAL[q]||QUAL.med;
  prBase=Math.max(0.45, Math.min(devicePixelRatio, Q.pr, devicePixelRatio*(Q.scale||1)));   // BAJO = 50% de la resolución nativa
  prDyn=1; aplicarPR();
  camera.far=Q.far||1200; camera.updateProjectionMatrix();
  const wantShadow=Q.shadow>0;
  if(renderer.shadowMap.enabled!==wantShadow){ renderer.shadowMap.enabled=wantShadow; renderer.shadowMap.needsUpdate=true; }
  if(wantShadow){ if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } sun.shadow.mapSize.set(Q.shadow,Q.shadow); }
  eyeAdapt=Q.adapt;
  layout();
}

/* ===================== AUDIO (SFX + música ambiente por nivel) ===================== */
const SFX_BASE='https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@eabd0b0/assets/fp/sfx/';
const SND={ jump:'sfx_jump.mp3', jump_grass:'sfx_jump_grass.mp3', slide:'sfx_slide.mp3', slide_grass:'sfx_slide_grass.mp3', run:'sfx_run.mp3', run_grass:'sfx_run_grass.mp3', btn:'sfx_btn.mp3', wrong:'sfx_wrong.mp3', spawn:'sfx_spawn.mp3', menu:'sfx_menu.mp3', play:'sfx_play.mp3', amb1:'amb1.mp3', amb2:'amb2.mp3', amb3:'amb3.mp3', amb4:'amb4.mp3', amb5:'amb5.mp3' };
const AUD={ on:false, el:{}, amb:null, ambKey:null, run:null, runKey:null };
function aGet(k){ let a=AUD.el[k]; if(!a){ a=new Audio(SFX_BASE+SND[k]); a.preload='auto'; AUD.el[k]=a; } return a; }
function sfx(k,vol){ if(!AUD.on||!SND[k])return; try{ const a=aGet(k); a.volume=(vol==null?0.9:vol); a.currentTime=0; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }   // efecto puntual
function ambient(k){ if(!AUD.on||!SND[k]||AUD.ambKey===k)return; AUD.ambKey=k; try{ if(!AUD.amb){ AUD.amb=new Audio(); AUD.amb.loop=true; } AUD.amb.volume=0.3; AUD.amb.src=SFX_BASE+SND[k]; const p=AUD.amb.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }   // música del nivel (loop, cambia al cambiar de mundo)
function runLoop(on,grass){ if(!AUD.on)return; if(on){ const k=grass?'run_grass':'run'; if(AUD.runKey!==k){ if(AUD.run)AUD.run.pause(); AUD.run=aGet(k); AUD.run.loop=true; AUD.run.volume=0.22; AUD.runKey=k; const p=AUD.run.play(); if(p&&p.catch)p.catch(()=>{}); } } else if(AUD.run){ AUD.run.pause(); AUD.run=null; AUD.runKey=null; } }   // pasos en bucle mientras corrés (pasto / fuera del pasto)
function audioStart(){ AUD.on=true; }   // se habilita con el primer gesto del usuario (móvil)
const VOID_TRACKS=['amb3','amb4','amb5'];   // varias músicas para el VACÍO (rotan para dar variedad)
function voidMusic(){ let k; do{ k=VOID_TRACKS[Math.floor(Math.random()*VOID_TRACKS.length)]; }while(VOID_TRACKS.length>1 && k===AUD.ambKey); ambient(k); }

/* MENÚ: el personaje es el protagonista, como en COD Mobile. Queda de pie con el AK, con su
   animación de idle corriendo, y la cámara lo encuadra de tres cuartos con un movimiento muy
   lento. No es un render aparte: es el MISMO cuerpo y la MISMA arma del juego, posados. */
let menuPose=false, menuLuz=null, menuLuz2=null, menuFondo=null, menuPiso=null;
/* TELÓN DEL MENÚ. El campo de tiro es un galpón con carteles, siluetas y tablones: de fondo de
   pantalla de selección queda sucio. Se le pone un telón oscuro con un halo tibio detrás del
   personaje (como la pantalla de operador de COD Mobile) y un óvalo de sombra a los pies, para
   que quede plantado en el piso y no flotando. Los dos son SÓLO del menú: al entrar se apagan. */
function menuTelonTex(){ const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'); g.fillStyle='#05070a'; g.fillRect(0,0,256,256);
  const r=g.createRadialGradient(128,104,8, 128,104,150);
  r.addColorStop(0,'rgba(255,196,128,0.60)'); r.addColorStop(0.35,'rgba(120,96,80,0.26)');
  r.addColorStop(1,'rgba(5,7,10,0)'); g.fillStyle=r; g.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function menuSombraTex(){ const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,128,128);
  const r=g.createRadialGradient(64,64,2, 64,64,62);   // BLANCA: se usa como alphaMap (three lee el canal verde)
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.5,'rgba(255,255,255,0.42)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); return t; }
function menuEscenario(mostrar){
  if(mostrar&&!menuFondo){
    // OPACO y escribiendo profundidad: si no, el galpón se dibuja después y se lo come.
    menuFondo=new THREE.Mesh(new THREE.PlaneGeometry(16,9),
      new THREE.MeshBasicMaterial({map:menuTelonTex(),fog:false,toneMapped:false}));
    scene.add(menuFondo);
    menuPiso=new THREE.Mesh(new THREE.CircleGeometry(0.78,28),
      new THREE.MeshBasicMaterial({color:0x000000,alphaMap:menuSombraTex(),transparent:true,
        opacity:0.75,depthWrite:false,fog:false}));
    menuPiso.rotation.x=-Math.PI/2; menuPiso.renderOrder=2; scene.add(menuPiso); }
  if(menuFondo) menuFondo.visible=!!mostrar;
  if(menuPiso)  menuPiso.visible=!!mostrar;
}
function menuCam(dt){ menuT+=dt;
  menuPose=true;
  player.pos.set(0.0, 0, TIRO_GZ+5.2); player.vel.set(0,0,0); player.vy=0; player.onGround=true;
  player.sliding=false; player.crouch=false; player.h=STAND; player.eye=EYE;
  player.yaw = Math.PI*0.80 + Math.sin(menuT*0.16)*0.05;    // casi de perfil, con una respiración lenta
  player.faceYaw = player.yaw; player.pitch = 0.08;   // apenas arriba: parado derecho, no encorvado
  player.camTP = 1;                                          // así se le ve la cabeza (en 1ª persona se recorta)
  // tickBody es el que planta el cuerpo en player.pos y le pasa el mixer; sin esto el personaje
  // se quedaba en el punto de aparición y la cámara del menú encuadraba el galpón vacío.
  try{ tickBody(dt,'idle'); }catch(e){}
  try{ tiroPostura(dt); }catch(e){}                          // el arma y las manos, con el mismo código del juego
  equiparSiHace();                                           // el traje y el arma elegidos, ya con el cuerpo armado
  /* ENCUADRE DE HÉROE. Con los 90° de juego (lente muy angular) el personaje a 1,4 m salía deformado
     y entraba medio galpón atrás. Se pasa a 38° verticales y la cámara se va a 2,9 m: es el retrato
     que usa cualquier pantalla de operador. La posición se calcula desde el RUMBO DE BASE (no del yaw
     que respira), así el encuadre queda quieto y lo que se mueve es el personaje. */
  if(Math.abs(camera.fov-38)>0.01){ camera.fov=38; camera.updateProjectionMatrix(); }
  const yB=Math.PI*0.80;                                   // rumbo de base del personaje
  const fx=-Math.sin(yB), fz=-Math.cos(yB);                // su "adelante"
  const rx= Math.cos(yB), rz=-Math.sin(yB);                // su "derecha"
  /* La cámara se para a 46° del rumbo del personaje, no casi enfrente: de frente el fusil apunta
     A la lente y se ve de punta (medido: proyectaba el 1% de su largo). A 46° proyecta el 72% y
     se lee entero, cruzado sobre el pecho, que es lo que hace que la pose se entienda. */
  const A=0.95, dist=3.50, der=Math.sin(menuT*0.10)*0.05;
  const ox=fx*Math.cos(A+der)+rx*Math.sin(A+der), oz=fz*Math.cos(A+der)+rz*Math.sin(A+der);
  camera.position.set(player.pos.x+ox*dist, 1.10+Math.sin(menuT*0.07)*0.03, player.pos.z+oz*dist);
  camera.up.set(0,1,0); camera.lookAt(player.pos.x, 0.98, player.pos.z);
  // una luz sólo para el menú: en el galpón el personaje quedaba en penumbra
  if(!menuLuz){ menuLuz=new THREE.PointLight(0xffd9b0, 0, 7.5, 2.0); scene.add(menuLuz);
    menuLuz2=new THREE.PointLight(0x9fc4ff, 0, 6.0, 2.0); scene.add(menuLuz2); }
  menuLuz.position.set(player.pos.x-1.9, 2.30, player.pos.z+1.0); menuLuz.intensity=11.0;   // clave, de arriba y del lado de la cámara
  menuLuz2.position.set(player.pos.x+1.7, 1.55, player.pos.z-1.2); menuLuz2.intensity=5.5;  // contra: despega la silueta del telón
  // telón: 2,6 m detrás del personaje sobre la línea cámara→personaje, siempre de frente a la lente
  menuEscenario(true);
  if(menuFondo){ const dx=player.pos.x-camera.position.x, dz=player.pos.z-camera.position.z;
    const L=Math.hypot(dx,dz)||1;
    // 1,7 m detrás alcanza para tapar las divisorias y los blancos, y deja el halo justo detrás de la cabeza
    menuFondo.position.set(player.pos.x+dx/L*1.7, 1.10, player.pos.z+dz/L*1.7);
    menuFondo.lookAt(camera.position.x, 1.10, camera.position.z);
    menuPiso.position.set(player.pos.x, player.pos.y+0.02, player.pos.z); }
}

let paused=false;
// resolución dinámica: ventana de 1 s, zona muerta ancha y 3 s de calma después de cada cambio
let _drsAcc=0,_drsN=0,_drsEsp=0;
function drsTick(dt){
  if(!drsOn||menuMode||paused){ _drsAcc=0; _drsN=0; return; }
  if(_drsEsp>0){ _drsEsp-=dt; _drsAcc=0; _drsN=0; return; }
  _drsAcc+=dt; _drsN++;
  if(_drsN<60) return;
  const ms=_drsAcc/_drsN*1000; _drsAcc=0; _drsN=0;
  const antes=prDyn;
  if(ms>21 && prDyn>0.6) prDyn=Math.max(0.6, prDyn-0.10);        // < 47 fps sostenidos
  else if(ms<13.5 && prDyn<1) prDyn=Math.min(1, prDyn+0.05);
  if(prDyn!==antes){ aplicarPR(); _drsEsp=3; }
}
function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05);
  if(menuMode) menuCam(dt); else if(!paused) update(dt);   // pausa: el mundo se congela
  // el telón y las luces del menú se apagan por CUALQUIER salida (el botón, la consola, un atajo),
  // no sólo por el botón ENTRAR: si no, el galpón quedaba jugándose con un panel oscuro en el medio.
  if(!menuMode){ menuPose=false;
    if(menuFondo&&menuFondo.visible) menuEscenario(false);
    if(menuLuz&&menuLuz.intensity>0){ menuLuz.intensity=0; menuLuz2.intensity=0; } }
  if(scene.fog){ if(_lastWorld!==world){ _lastWorld=world; _worldFog=scene.fog.far; }   // captura la niebla base al entrar a cada mundo
    const wf=(quality==='low')?Math.min(_worldFog,camera.far):_worldFog; if(scene.fog.far!==wf)scene.fog.far=wf; }   // BAJO: niebla tapa justo en el corte del plano lejano; medio/alto restauran la base
  if(islaMode){ try{ alcTick(dt); }catch(e){} }   // el oleaje de la bahía
  try{ mpTick(dt); }catch(e){}   // multijugador (nunca rompe el single-player) — sigue latiendo aunque esté en pausa
  renderer.render(scene,camera);
  drsTick(dt); }

function mpNameTag(name){
  const W=256,H=120; const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const cx=cv.getContext('2d');
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,fog:false})); sp.position.y=2.34; sp.scale.set(2.0, 2.0*H/W, 1);
  let _name=String(name).slice(0,14);
  function draw(talking){ cx.clearRect(0,0,W,H); const ix=W/2, iy=24;
    cx.fillStyle=talking?'#43e07a':'#9aa6b2';   // cuerpo del parlante
    cx.beginPath(); cx.moveTo(ix-20,iy-7); cx.lineTo(ix-11,iy-7); cx.lineTo(ix-2,iy-15); cx.lineTo(ix-2,iy+15); cx.lineTo(ix-11,iy+7); cx.lineTo(ix-20,iy+7); cx.closePath(); cx.fill();
    if(talking){ cx.strokeStyle='#43e07a'; cx.lineWidth=3.4; cx.beginPath(); cx.arc(ix-1,iy,9,-0.75,0.75); cx.stroke(); cx.beginPath(); cx.arc(ix-1,iy,16,-0.8,0.8); cx.stroke(); }   // ondas verdes
    else { cx.strokeStyle='#ff5a5a'; cx.lineWidth=4.5; cx.beginPath(); cx.moveTo(ix+5,iy-10); cx.lineTo(ix+20,iy+10); cx.moveTo(ix+20,iy-10); cx.lineTo(ix+5,iy+10); cx.stroke(); }   // X roja (mute)
    const rx=10,ry=52,rw=W-20,rh=52,rr=14;   // pastilla del nombre
    cx.fillStyle='rgba(12,22,32,0.74)'; cx.beginPath(); cx.moveTo(rx+rr,ry); cx.arcTo(rx+rw,ry,rx+rw,ry+rh,rr); cx.arcTo(rx+rw,ry+rh,rx,ry+rh,rr); cx.arcTo(rx,ry+rh,rx,ry,rr); cx.arcTo(rx,ry,rx+rw,ry,rr); cx.closePath(); cx.fill();
    cx.fillStyle='#dff0ff'; cx.font='bold 32px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(_name, W/2, ry+rh/2+1); tex.needsUpdate=true; }
  draw(false);
  return { sprite:sp, setTalk:draw, setName(n){ _name=String(n).slice(0,14); draw(false); } };
}
// dale al remoto la MISMA skin (clon del personaje) y su propio mixer con los MISMOS clips
function mpRig(r){
  if(!mpBodySrc||!mpClips){   // provisional (cápsula) hasta que cargue el GLB
    const cap=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,1.0,6,12), new THREE.MeshStandardMaterial({color:r.color,roughness:0.55})); cap.position.y=0.85; cap.castShadow=true; r.avatar.add(cap); r.body=cap; r.rigged=false; return; }
  const cl=SkeletonUtils.clone(mpBodySrc);
  // el clon hereda la pose EN CURSO del jugador local (tronco compuesto, brazos con IK puestos en el
  // fusil). El mixer sólo pisa cadera y piernas, así que sin esto el remoto quedaba con el torso
  // congelado en la última postura de tiro del jugador de acá.
  if(mskBind) { const _pn=new Map(); mskBind.forEach(r=>_pn.set(r.h.name,r));
    cl.traverse(o=>{ if(!o.isBone)return; const r=_pn.get(o.name); if(!r)return;
      o.quaternion.copy(r.q); o.position.copy(r.p); o.scale.copy(r.e); }); }
  cl.visible=true;   // ¡OJO! si el jugador local tiene un personaje puesto, mpBodySrc está oculto y el clon hereda visible=false → remotos invisibles
  cl.traverse(o=>{ o.visible=true; if(o.isMesh){ o.castShadow=true; o.frustumCulled=false; const ms=(Array.isArray(o.material)?o.material:[o.material]).map(m=>m?m.clone():m); o.material=Array.isArray(o.material)?ms:ms[0]; ms.forEach(m=>{ if(m)m.side=THREE.DoubleSide; }); }   // materiales propios por avatar (la skin local no tiñe a los demás) + DoubleSide (cuerpo sólido)
    if(o.isBone && /^Hips$|pelvis|cadera/i.test(o.name)){ r.hips=o; r.hipsBind=o.position.clone(); } });
  r.avatar.add(cl); r.body=cl; r.sx=Math.abs(cl.scale.x);
  r.mixer=new THREE.AnimationMixer(cl); r.actions={};
  mpClips.forEach(c=>{ const a=r.mixer.clipAction(c); a.setLoop(THREE.LoopRepeat); a.clampWhenFinished=false; if(c.name==='roll')a.timeScale=ROLL_TIMESCALE; r.actions[c.name]=a; });
  r.cur=null;
  r.setAnim=(name)=>{ if(!r.actions[name]||r.cur===name)return; const nx=r.actions[name]; nx.reset(); if(name==='roll')nx.time=ROLL_ANIM_START; nx.enabled=true; nx.setEffectiveWeight(1); nx.play(); if(r.cur&&r.actions[r.cur])nx.crossFadeFrom(r.actions[r.cur],0.16,true); r.cur=name; };
  r.rigged=true; r.setAnim('idle');
}
// ponerle al remoto SU personaje de la tienda (o volver al Clásico si res=null)
function mpSwapBody(r,res){
  if(r.body){ r.avatar.remove(r.body); r.body=null; }
  r.mixer=null; r.actions={}; r.cur=null; r.hips=null; r.hipsBind=null;
  if(!res){ r.rigged=false; if(mpBodySrc&&mpClips) mpRig(r); return; }   // Clásico (mpRig reconstruye todo)
  r.avatar.add(res.node); r.body=res.node; r.sx=res.sx; r.hips=res.hips; r.hipsBind=res.hipsBind;
  r.mixer=new THREE.AnimationMixer(res.node);
  const clips=(window.__safeClips?window.__safeClips(mpClips):mpClips)||[];   // clips SEGUROS (solo rotación + cadera) → no estira rigs ajenos
  clips.forEach(c=>{ const a=r.mixer.clipAction(c); a.setLoop(THREE.LoopRepeat); a.clampWhenFinished=false; if(c.name==='roll')a.timeScale=ROLL_TIMESCALE; r.actions[c.name]=a; });
  r.rigged=true; r.setAnim(r.anim||'idle');
}

function mpBubble(r,text){ if(!r||!r.avatar||!text)return; text=String(text).slice(0,70);
  if(!r.bubble){ const W=512,H=200,cv=document.createElement('canvas'); cv.width=W; cv.height=H; const cx=cv.getContext('2d');
    const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,fog:false})); sp.position.y=2.95; sp.scale.set(2.7,2.7*H/W,1); sp.renderOrder=999; r.avatar.add(sp);
    r.bubble={sprite:sp,cv,cx,tex}; }
  const {cx,cv,tex,sprite}=r.bubble, W=cv.width, H=cv.height; cx.clearRect(0,0,W,H);
  cx.font='bold 34px sans-serif'; cx.textAlign='left'; cx.textBaseline='middle';
  const words=text.split(' '), lines=[]; let ln='';   // word-wrap a ~3 líneas
  for(const w of words){ const test=ln?ln+' '+w:w; if(cx.measureText(test).width>W-70 && ln){ lines.push(ln); ln=w; } else ln=test; if(lines.length>=3)break; }
  if(ln&&lines.length<3) lines.push(ln); if(!lines.length) lines.push(text);
  const lh=42, padY=22, bw=Math.min(W-20, Math.max(...lines.map(l=>cx.measureText(l).width))+56), bh=lines.length*lh+padY*2, bx=(W-bw)/2, by=10, rr=24;
  cx.fillStyle='rgba(245,250,255,0.96)'; cx.strokeStyle='rgba(90,150,220,0.6)'; cx.lineWidth=3;
  cx.beginPath(); cx.moveTo(bx+rr,by); cx.arcTo(bx+bw,by,bx+bw,by+bh,rr); cx.arcTo(bx+bw,by+bh,bx,by+bh,rr); cx.arcTo(bx,by+bh,bx,by,rr); cx.arcTo(bx,by,bx+bw,by,rr); cx.closePath(); cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(W/2-13,by+bh-2); cx.lineTo(W/2+13,by+bh-2); cx.lineTo(W/2,by+bh+24); cx.closePath(); cx.fill();   // colita de la burbuja
  cx.fillStyle='#12324a'; lines.forEach((l,i)=>{ cx.fillText(l, bx+28, by+padY+lh/2+i*lh); });
  tex.needsUpdate=true; sprite.visible=true;
  clearTimeout(r.bubbleT); r.bubbleT=setTimeout(()=>{ if(r.bubble)r.bubble.sprite.visible=false; }, 5500); }

const kbdEl=document.getElementById('kbd'); let kbBuilt=false, kbBuf='', kbTxt=null;
function buildKbd(){ if(kbBuilt||!kbdEl)return; kbBuilt=true;
  const field=document.createElement('div'); field.className='kbField'; kbTxt=document.createElement('div'); kbTxt.className='kbText'; kbTxt.dataset.ph=t('mp_chat'); field.appendChild(kbTxt); kbdEl.appendChild(field);
  const rows=document.createElement('div'); rows.id='kbRows'; kbdEl.appendChild(rows);
  let mode='abc', shift=false;
  const setTxt=()=>{ kbTxt.textContent=kbBuf; };
  const ins=ch=>{ if(kbBuf.length<160){ kbBuf+=ch; setTxt(); } if(shift && mode==='abc'){ shift=false; render(); } };
  const bs=()=>{ kbBuf=kbBuf.slice(0,-1); setTxt(); };
  const mk=(label,cls,fn)=>{ const k=document.createElement('div'); k.className='kbK'+(cls?' '+cls:''); k.textContent=label; k.addEventListener('pointerdown',ev=>{ ev.preventDefault(); fn(); }); return k; };
  const mkRow=(keys)=>{ const r=document.createElement('div'); r.className='kbRow'; keys.forEach(k=>r.appendChild(k)); rows.appendChild(r); };
  const ABC=['1234567890','qwertyuiop','asdfghjklñ'];   // últimas letras (zxcvbnm) van con ⇧ y ⌫
  const SYM=[ ['1','2','3','4','5','6','7','8','9','0'], ['@','#','$','%','&','*','-','+','(',')'], ['=','/',':',';',"'",'"','€','¿','¡'] ];
  function letters(s){ return [...s].map(ch=>{ const c=shift?ch.toUpperCase():ch; return mk(c,'',()=>ins(c)); }); }
  function render(){ rows.innerHTML='';
    if(mode==='abc'){
      mkRow(letters(ABC[0])); mkRow(letters(ABC[1])); mkRow(letters(ABC[2]));
      mkRow([ mk('⇧','fn'+(shift?' on':''),()=>{ shift=!shift; render(); }), ...letters('zxcvbnm'), mk('⌫','fn',bs) ]);
    } else {
      mkRow(SYM[0].map(ch=>mk(ch,'',()=>ins(ch))));
      mkRow(SYM[1].map(ch=>mk(ch,'',()=>ins(ch))));
      mkRow([ ...SYM[2].map(ch=>mk(ch,'',()=>ins(ch))), mk('⌫','fn',bs) ]);
    }
    mkRow([ mk(mode==='abc'?'?123':'ABC','fn',()=>{ mode=(mode==='abc'?'sym':'abc'); shift=false; render(); }),
      mk(',','',()=>ins(',')), mk('espacio','wide',()=>ins(' ')), mk('.','',()=>ins('.')),
      mk(t('send'),'send',()=>{ mpSendChatText(kbBuf); kbBuf=''; setTxt(); closeKbd(); }), mk('✕','close',()=>closeKbd()) ]);
  }
  render();
}
function openKbd(){ buildKbd(); kbBuf=''; if(kbTxt){ kbTxt.textContent=''; kbTxt.dataset.ph=t('mp_chat'); } kbdEl.classList.add('show'); }
function closeKbd(){ if(kbdEl)kbdEl.classList.remove('show'); }

function mpConnect(){
  if(typeof mqtt==='undefined'){ mpSetStatus('off','mp_nonet'); return; }
  mpSetStatus('connecting','mp_conn');
  let client; try{ client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{connectTimeout:8000,reconnectPeriod:5000,clean:true}); }
  catch(e){ mpSetStatus('off','mp_nonet'); return; }
  MP.client=client;
  client.on('connect',()=>{ MP.on=true; mpSetStatus('online','mp_online'); client.subscribe([MP.room+'/state',MP.room+'/chat',MP.room+'/action',MP.room+'/rtc'],{qos:0}); if(VOICE.stream) voiceSend(null,'ready'); });
  client.on('reconnect',()=>mpSetStatus('connecting','mp_conn'));
  client.on('close',()=>{ MP.on=false; mpSetStatus('off','mp_off'); });
  client.on('error',()=>{ MP.on=false; mpSetStatus('off','mp_err'); });
  client.on('message',(topic,buf)=>{ let d; try{ d=JSON.parse(buf.toString()); }catch(e){ return; } if(!d||d.id===MP.id)return;
    if(topic.slice(-6)==='/state'){ const r=mpRemote(d.id,d.name||'jugador'); r.name=d.name||r.name; r.world=d.world; r.anim=d.anim||'idle'; r.moving=!!d.isMoving; r.mir=!!d.mir; r.yaw=d.facingAngle||0;
      r.vSeed=d.vSeed||0; r.vFase=d.vFase||0; r.vBest=d.vBest||0; r.vDead=!!d.vDead; r.talking=!!d.talk;   // estado del vacío + ¿está hablando? (ícono de voz)
      r.ch=(typeof d.ch==='number'&&d.ch>=0)?d.ch:-1;   // qué personaje de la tienda tiene puesto
      boardUpdate(d.id, d.name, d.vBest);   // clasificación: mejor fase de cada jugador
      r.target.set(d.x||0,d.y||0,d.z||0); if(!r.init){ r.init=true; r.pos.copy(r.target); } r.last=performance.now();
      if(world==='void') updateVoidBoard(); }
    else if(topic.slice(-5)==='/chat'){ mpChatIn(d.name||'?', d.text||''); const r=MP.remotes.get(d.id); if(r) mpBubble(r, d.text||''); }   // panel de chat + burbuja sobre la cabeza
    else if(topic.slice(-7)==='/action'){ /* eventos discretos (emotes/hits): aplicar localmente */ if(d.type==='hit_player' && d.targetId===MP.id){ /* este juego no tiene daño */ } }
    else if(topic.slice(-4)==='/rtc'){ if(!d.to||d.to===MP.id) voiceSignal(d); }   // señalización del chat de voz (WebRTC)
  });
}
function mpPublishState(){ if(!MP.on||!MP.client)return; const now=performance.now(); if(now-MP.lastPub<100)return;
  const p=player, moving=Math.hypot(p.vel.x,p.vel.z)>0.6;
  const mir=(curAnim==='wallrun'&&p.wallrun>0)||(curAnim==='slide'&&p.slideRight);   // mismo espejo que el cuerpo local
  let myCh=-1; try{ if(window.__charId){ const v=+window.__charId(); if(v>=0)myCh=v; } }catch(e){}   // personaje equipado (la tienda expone __charId)
  const cur={x:+p.pos.x.toFixed(2),y:+p.pos.y.toFixed(2),z:+p.pos.z.toFixed(2),yaw:+p.yaw.toFixed(2),anim:curAnim||'idle',world,moving,mir,chId:myCh,
    vSeed:world==='void'?voidSeed:0, vFase:voidFase, vBest:voidBest, vDead:voidDead, talk:voiceTalking};
  const l=MP.last, hb=(now-(MP.lastFull||0)>2200);   // latido cada ~2.2s aunque no cambie nada → no se cae la conexión
  const ch=hb||(l.x===undefined)||Math.abs(cur.x-l.x)>0.03||Math.abs(cur.y-l.y)>0.03||Math.abs(cur.z-l.z)>0.03||Math.abs(cur.yaw-l.yaw)>0.05||cur.anim!==l.anim||cur.world!==l.world||cur.moving!==l.moving||cur.mir!==l.mir||cur.chId!==l.chId||cur.vSeed!==l.vSeed||cur.vFase!==l.vFase||cur.vBest!==l.vBest||cur.vDead!==l.vDead||cur.talk!==l.talk;
  if(!ch)return; MP.lastPub=now; MP.last=cur; if(hb)MP.lastFull=now;
  MP.client.publish(MP.room+'/state', JSON.stringify({id:MP.id,name:MP.name,x:cur.x,y:cur.y,z:cur.z,facingAngle:cur.yaw,anim:cur.anim,world:cur.world,isMoving:cur.moving,mir:cur.mir,ch:cur.chId,vSeed:cur.vSeed,vFase:cur.vFase,vBest:cur.vBest,vDead:cur.vDead,talk:cur.talk}),{qos:0}); }
function mpTick(dt){
  const now=performance.now();
  if(mpStatusEl && mpStatusEl.dataset.s==='online') mpStatusEl.textContent=t('mp_online')+' · '+(MP.remotes.size+1)+'👥';   // nº de jugadores conectados (vos + remotos)
  for(const [id,r] of MP.remotes){ if(now-r.last>6500){ scene.remove(r.avatar); MP.remotes.delete(id); voiceClose(id); continue; }   // timeout (con latido de 2.2s no se cae si sigue ahí)
    if(!r.rigged && mpBodySrc){ if(r.body)r.avatar.remove(r.body); mpRig(r); }                                       // al cargar el GLB, cambia la cápsula por la skin real
    if(r.rigged && r.ch!==r.chApplied){ const want=r.ch; r.chApplied=want;                                           // el remoto se cambió de personaje → ponerle SU skin de la tienda
      if(want<0) mpSwapBody(r,null);
      else if(window.__remoteChar) window.__remoteChar(want, res=>{ if(r.chApplied===want && MP.remotes.has(r.id)) mpSwapBody(r,res); }); }
    r.pos.lerp(r.target, Math.min(1,10*dt));                                                                        // interpolación (10Hz → 60fps suave)
    const same=(r.world===world); r.avatar.visible=same;                                                            // solo se ven los del MISMO mundo
    if(r.tag) r.tag.visible=showNames;                                                                               // nombre + ícono de voz sobre la cabeza
    if(r.tagSet && r.talking!==r._talkShown){ r.tagSet(r.talking); r._talkShown=r.talking; }                         // ícono verde (hablando) / X (callado)
    if(!same)continue;
    r.avatar.position.set(r.pos.x, r.pos.y, r.pos.z); r.avatar.rotation.y=r.yaw+Math.PI;
    if(r.rigged && r.mixer){ r.setAnim(r.anim||'idle'); r.mixer.update(dt);                                          // MISMA animación que está haciendo el otro
      if(r.body) r.body.scale.x = r.mir? -r.sx : r.sx;                                                               // espejo (slide/wallrun a la derecha)
      if(r.hips&&r.hipsBind){ r.hips.position.x=r.hipsBind.x; r.hips.position.z=r.hipsBind.z; } }                     // anula solo el root-motion horizontal; Y libre (sin apretar la cintura)
    else if(r.body){ r.bob+=dt*8*(r.moving?1:0); r.avatar.position.y += Math.abs(Math.sin(r.bob))*0.06; } }         // cápsula provisional
  try{ voiceSpatial(); }catch(e){}   // voz 3D: volumen y dirección según dónde está cada jugador
  mpPublishState();
}

/* ===================== CHAT DE VOZ (WebRTC P2P, señalización por MQTT, push-to-talk) ===================== */
const VOICE={ ok:(typeof RTCPeerConnection!=='undefined'), mic:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia), stream:null, peers:new Map(), inited:false };   // ok = puede ESCUCHAR (WebRTC); mic = puede HABLAR (getUserMedia)
const RTC_CFG={ iceServers:[ {urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'} ] };   // TURN público: sin esto, dos celulares con datos móviles casi nunca logran conectarse P2P
function voiceSend(to,type,data){ if(MP.on&&MP.client) MP.client.publish(MP.room+'/rtc', JSON.stringify({id:MP.id,to:to||null,type,data:data||null}),{qos:0}); }
// --- VOZ 3D POR CERCANÍA: solo escuchás a los que están CERCA y en TU nivel, y suenan desde donde están parados ---
const VDIST=28;   // distancia máxima (metros) a la que se escucha a un jugador
let VCTX=null;
function voiceCtx(){ if(VCTX)return VCTX;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null; VCTX=new AC(); }catch(e){ return null; }
  const res=()=>{ if(VCTX&&VCTX.state==='suspended')VCTX.resume().catch(()=>{}); };
  addEventListener('pointerdown',res); res(); return VCTX; }
function voiceSpatial(){
  if(!VCTX){   // sin WebAudio: al menos bajar el volumen por distancia en el elemento de audio
    for(const [id,pr] of VOICE.peers){ if(!pr.au)continue; const r=MP.remotes.get(id); const d=r?r.pos.distanceTo(player.pos):1e9;
      const ok=r&&r.world===world&&d<VDIST; try{ pr.au.volume=ok?Math.max(0,1-d/VDIST):0; }catch(e){} } return; }
  const t=VCTX.currentTime;
  try{ const L=VCTX.listener, fw=new THREE.Vector3(); camera.getWorldDirection(fw);   // el "oído" es tu cámara
    if(L.positionX){ L.positionX.setTargetAtTime(camera.position.x,t,0.05); L.positionY.setTargetAtTime(camera.position.y,t,0.05); L.positionZ.setTargetAtTime(camera.position.z,t,0.05);
      L.forwardX.setTargetAtTime(fw.x,t,0.05); L.forwardY.setTargetAtTime(fw.y,t,0.05); L.forwardZ.setTargetAtTime(fw.z,t,0.05);
      L.upX.setTargetAtTime(0,t,0.05); L.upY.setTargetAtTime(1,t,0.05); L.upZ.setTargetAtTime(0,t,0.05); }
    else { L.setPosition(camera.position.x,camera.position.y,camera.position.z); L.setOrientation(fw.x,fw.y,fw.z,0,1,0); } }catch(e){}
  for(const [id,pr] of VOICE.peers){ if(!pr.pan||!pr.gain)continue; const r=MP.remotes.get(id);
    const ok=r && r.world===world && r.pos.distanceTo(player.pos)<VDIST;   // otro nivel o lejos → silencio total
    pr.gain.gain.setTargetAtTime(ok?1:0,t,0.08);
    if(ok){ const py=r.pos.y+1.6;   // la voz sale de la cabeza del avatar
      if(pr.pan.positionX){ pr.pan.positionX.setTargetAtTime(r.pos.x,t,0.05); pr.pan.positionY.setTargetAtTime(py,t,0.05); pr.pan.positionZ.setTargetAtTime(r.pos.z,t,0.05); }
      else pr.pan.setPosition(r.pos.x,py,r.pos.z); } }
}
async function voiceInit(){ if(VOICE.inited||!VOICE.ok||!VOICE.mic) return VOICE.inited; VOICE.inited=true;
  // echoCancellation/noiseSuppression/autoGainControl en FALSE: si van en true, el celular entra en "modo llamada"
  // → cambia el audio al altavoz de la oreja y la música/sfx del juego se reproducen acelerados/agudos
  try{ VOICE.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
    VOICE.stream.getAudioTracks().forEach(tk=>tk.enabled=false);   // arranca MUTE (push-to-talk)
    // re-usar las conexiones que ya existen (de escuchar, o de una activación anterior): meter la pista nueva SIN cortar la llamada
    const tk=VOICE.stream.getAudioTracks()[0];
    for(const [id,pr] of VOICE.peers){ let neg=false;
      try{ const tr=pr.pc.getTransceivers().find(t=>t.sender&&!t.sender.track)||pr.pc.getTransceivers()[0];
        if(tr){ if(tr.direction==='recvonly'){ tr.direction='sendrecv'; neg=true; } tr.sender.replaceTrack(tk); }
        else { pr.pc.addTrack(tk,VOICE.stream); neg=true; }
      }catch(e){ neg=true; }
      if(neg){ if(MP.id<id) voiceOffer(id); else voiceSend(id,'ready'); } }   // cambiar de "solo escucha" a "hablar" necesita renegociar
    voiceSend(null,'ready'); return true;
  }catch(e){ VOICE.inited=false; mpChatIn('🎤','(sin permiso de micrófono)'); return false; }
}
function voicePeer(id){ let pr=VOICE.peers.get(id); if(pr)return pr;
  const pc=new RTCPeerConnection(RTC_CFG);
  if(VOICE.stream) VOICE.stream.getTracks().forEach(tk=>pc.addTrack(tk,VOICE.stream));
  else { try{ pc.addTransceiver('audio',{direction:'recvonly'}); }catch(e){} }   // SIN micrófono también podés ESCUCHAR a los que hablan
  const au=document.createElement('audio'); au.autoplay=true; au.playsInline=true; document.body.appendChild(au);
  pc.ontrack=e=>{ const st=e.streams[0]; au.srcObject=st;
    const cx=voiceCtx();
    if(cx){ try{ au.muted=true;   // el elemento sigue "reproduciendo" (iOS lo necesita) pero el SONIDO sale por el grafo 3D
        pr.pan=cx.createPanner(); pr.pan.panningModel='equalpower'; pr.pan.distanceModel='linear'; pr.pan.refDistance=1.5; pr.pan.maxDistance=VDIST; pr.pan.rolloffFactor=1;
        pr.gain=cx.createGain(); pr.gain.gain.value=0;   // arranca mudo hasta que voiceSpatial confirme que está cerca y en tu nivel
        cx.createMediaStreamSource(st).connect(pr.pan); pr.pan.connect(pr.gain); pr.gain.connect(cx.destination);
      }catch(e2){ au.muted=false; pr.pan=null; pr.gain=null; } }
    const p=au.play(); if(p&&p.catch)p.catch(()=>{   // si el navegador bloquea el autoplay, reintenta en el próximo toque
      const once=()=>{ au.play().catch(()=>{}); removeEventListener('pointerdown',once); }; addEventListener('pointerdown',once); }); };
  pc.onicecandidate=e=>{ if(e.candidate) voiceSend(id,'ice',e.candidate); };
  pc.onconnectionstatechange=()=>{ const s=pc.connectionState; if(s==='connected'){ const r=MP.remotes.get(id); mpChatIn('🔊','voz conectada'+(r?(' con '+(r.name||'')):'')); }
    else if(s==='failed'){ voiceClose(id); if(VOICE.stream) voiceSend(id,'ready'); }   // reintento automático si la conexión se cayó
    else if(s==='closed'){ voiceClose(id); } };
  pr={pc,au,pending:[]}; VOICE.peers.set(id,pr); return pr;
}
function voiceFlush(pr){ const q=pr.pending.splice(0); for(const c of q){ try{ pr.pc.addIceCandidate(c); }catch(e){} } }
async function voiceOffer(id){ const pr=voicePeer(id); if(!pr)return; if(pr.pc.signalingState!=='stable')return;   // ya hay una negociación en curso → no dupliques
  try{ const o=await pr.pc.createOffer(); await pr.pc.setLocalDescription(o); voiceSend(id,'offer',pr.pc.localDescription); }catch(e){} }
function voiceClose(id){ const pr=VOICE.peers.get(id); if(pr){ try{pr.pc.close();}catch(e){} try{ if(pr.pan)pr.pan.disconnect(); if(pr.gain)pr.gain.disconnect(); }catch(e){} if(pr.au){ pr.au.srcObject=null; pr.au.remove(); } VOICE.peers.delete(id); } }
async function voiceSignal(d){ if(!VOICE.ok)return;
  if(d.type==='ready'){ if(MP.id<d.id) voiceOffer(d.id); else voiceSend(d.id,'ready'); }   // el de id MENOR inicia (o renegocia si ya estaban conectados); AUNQUE no tengas micrófono, igual te conectás para ESCUCHAR
  else if(d.type==='offer'){ const pr=voicePeer(d.id); if(!pr)return; try{ await pr.pc.setRemoteDescription(d.data); voiceFlush(pr); const a=await pr.pc.createAnswer(); await pr.pc.setLocalDescription(a); voiceSend(d.id,'answer',pr.pc.localDescription); }catch(e){} }
  else if(d.type==='answer'){ const pr=VOICE.peers.get(d.id); if(pr) try{ await pr.pc.setRemoteDescription(d.data); voiceFlush(pr); }catch(e){} }
  else if(d.type==='ice'){ const pr=VOICE.peers.get(d.id); if(pr){ if(pr.pc.remoteDescription&&pr.pc.remoteDescription.type){ try{ await pr.pc.addIceCandidate(d.data); }catch(e){} } else pr.pending.push(d.data); } }
}
function voiceTalk(on){ voiceTalking=on; if(VOICE.stream) VOICE.stream.getAudioTracks().forEach(tk=>tk.enabled=on); }   // voiceTalking se transmite en el estado → ícono verde en los demás
let voiceActive=false;
async function voiceToggle(){ audioStart(); voiceCtx(); const bv=document.getElementById('bVoice');   // crear/despertar el audio 3D dentro del gesto del usuario
  if(!VOICE.ok||!VOICE.mic){ mpChatIn('🎤', (typeof isSecureContext!=='undefined'&&!isSecureContext)?'(la voz necesita conexión segura/HTTPS)':'(voz no soportada en este navegador)'); return; }
  if(!voiceActive){
    if(bv)bv.classList.add('on');                                       // feedback inmediato
    if(!VOICE.inited){ const ok=await voiceInit(); if(!ok){ if(bv)bv.classList.remove('on'); return; } }
    voiceActive=true; voiceTalk(true); voiceSend(null,'ready'); mpChatIn('🎤','micrófono ACTIVADO (tocá de nuevo para apagar)');   // re-anuncia por si ya hay gente
  } else {
    voiceActive=false; voiceTalk(false);
    // APAGADO DE VERDAD: deja de enviar y LIBERA el micrófono (se va el ícono de "grabando" del navegador) — seguís ESCUCHANDO a los demás
    try{ for(const pr of VOICE.peers.values()) pr.pc.getSenders().forEach(sn=>{ if(sn.track) sn.replaceTrack(null); }); }catch(e){}
    if(VOICE.stream){ try{ VOICE.stream.getTracks().forEach(tk=>tk.stop()); }catch(e){} VOICE.stream=null; }
    VOICE.inited=false;   // el próximo toque vuelve a pedir el micrófono
    if(bv)bv.classList.remove('on'); mpChatIn('🎤','micrófono apagado (seguís escuchando a los demás)');
  } }

const BOARD=new Map();   // id → {name,best}  (online + guardado en este dispositivo)
function boardLoad(){ try{ const j=JSON.parse(localStorage.getItem('pf_board')||'[]'); for(const e of j) if(e&&e.id) BOARD.set(e.id,{name:e.name||'jugador',best:e.best||0}); }catch(e){} }
function boardSave(){ try{ const arr=[...BOARD.entries()].map(([id,v])=>({id,name:v.name,best:v.best})).sort((a,b)=>b.best-a.best).slice(0,40); localStorage.setItem('pf_board',JSON.stringify(arr)); }catch(e){} }
function boardUpdate(id,name,best){ best=+best||0; if(best<1)return; const cur=BOARD.get(id), nb=Math.max(best,cur?cur.best:0); if(!cur||nb!==cur.best||name!==cur.name){ BOARD.set(id,{name:name||'jugador',best:nb}); boardSave(); refreshBoards(); } }
const bigBoardEl=document.getElementById('bigBoard');
function renderBoard(el){ if(!el)return; const rows=[{name:(MP.name||'vos')+' (vos)',best:voidUnlockedMax||0,me:true}];
  for(const [id,v] of BOARD){ if(id===MP.id)continue; rows.push({name:v.name,best:v.best,me:false}); }
  rows.sort((a,b)=>b.best-a.best);
  el.innerHTML = rows.slice(0,12).map((r,i)=>'<div class="bRow'+(r.me?' me':'')+'"><span>'+(i+1)+'. '+mpEsc(r.name)+'</span><b>'+t('fase')+' '+(r.best||0)+'</b></div>').join('') || '<div class="bRow"><span>—</span></div>'; }
// --- pestañas (cada una se abre aparte, no inline) ---

function refreshBoards(){ if(boardPanelEl&&boardPanelEl.classList.contains('show')) renderBoard(bigBoardEl); }
function openPause(){ if(!pauseEl||menuMode)return; paused=true; pauseEl.classList.add('show'); }
function closePause(){ if(pauseEl)pauseEl.classList.remove('show'); paused=false; }

function closeSettings(){ if(settingsPanelEl)settingsPanelEl.classList.remove('show'); }

// PRECARGA: en este juego lo único pesado es el personaje (el galpón es geometría y canvas)
function preloadAll(onp){
  const urls=[ EBASE+BODY_FILE ];
  for(const k in SND) urls.push(SFX_BASE+SND[k]);
  const total=urls.length+1; let done=0; const step=()=>{ done++; if(onp)onp(done,total); };
  const tasks=urls.map(u=> fetch(u).then(r=>r.blob()).then(step).catch(step) );

  tasks.push(whenReady(()=>!!bodyRoot));
  return Promise.all(tasks);
}

  window.__remoteChar=function(id,cb){ if(!(id>=0)||!CHARS[id]){ cb(null); return; }
    loadChar(id, gl=>{ try{ if(!gl){ cb(null); return; }
      const src=SkeletonUtils.clone(gl.scene);
      let b=skinnedBox(src), sz=b.getSize(new THREE.Vector3()); if(!(sz.y>0.01)){ b=new THREE.Box3().setFromObject(src); sz=b.getSize(new THREE.Vector3()); }
      const sc=STAND/(sz.y||1); src.scale.setScalar(sc);
      b=skinnedBox(src); const c=b.getCenter(new THREE.Vector3()); src.position.set(-c.x,-b.min.y,-c.z);
      let hp=null;
      src.traverse(o=>{ o.visible=true; if(o.isMesh){ o.castShadow=true; o.frustumCulled=false; const ms=(Array.isArray(o.material)?o.material:[o.material]); ms.forEach(m=>{ if(m)m.side=THREE.FrontSide; }); }
        if(o.isBone && /^Hips$|pelvis|cadera/i.test(o.name) && !hp) hp=o; });
      cb({node:src, hips:hp, hipsBind:hp?hp.position.clone():null, sx:Math.abs(src.scale.x)});
    }catch(e){ console.warn('remoteChar',e); cb(null); } }); };

  // los personajes cambian entre SU idle y SU caminar según te movés (vida real)
  if(typeof setAnim==='function'){ const _sa=setAnim; setAnim=function(name){ const ca=(typeof bodyRoot!=='undefined'&&bodyRoot)?bodyRoot._charAnim:null;
    if(ca){ const moving=/walk|run|jump|slide|wallrun|mantle|roll/.test(name||''); const want=moving?ca.walk:ca.idle;
      if(want&&ca.cur!==want){ want.reset(); want.enabled=true; want.setEffectiveWeight(1); want.play(); if(ca.cur)want.crossFadeFrom(ca.cur,0.18,true); ca.cur=want; } curAnim='__char'; return; }
    return _sa(name); }; }

  // re-equipar el personaje guardado cuando el cuerpo esté listo
  const iv=setInterval(()=>{ if(bodyRoot && mpClips){ clearInterval(iv); if(equipped>=0 && CHARS[equipped]) equipChar(equipped,true); } }, 250);
  setTimeout(()=>clearInterval(iv), 30000);

  // ---- BILLETES: los niveles son GRATIS/accesibles; ganás plata al COMPLETARLOS (ganarlos) ----
  const WIN$={city:5, crystal:10, dream:12, back:15, pool:20, space:30};   // premio por ganar cada nivel (progresivo)
  window.__winLevel=function(key){ const n=WIN$[key]||10; addBilletes(n);
    try{ if(typeof mpChatIn==='function') mpChatIn('💵', '+'+n+' billetes · '+key); }catch(e){} };
  // EL VACÍO: 2 billetes por cada FASE/nivel superado
  if(typeof checkUnlocks==='function'){ const _oc=checkUnlocks; checkUnlocks=function(){ const g=(typeof voidBest!=='undefined'&&typeof voidUnlockedMax!=='undefined')?Math.max(0,voidBest-voidUnlockedMax):0; if(g>0)addBilletes(2*g); _oc(); }; }
}catch(e){ console.error('tienda',e); } })();

</script>
