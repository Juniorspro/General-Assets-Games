<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#aebfcf" />
<title>Campo de Tiro</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<style>
  :root{ --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ height:100%; overflow:hidden; background:#aebfcf; font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; color:#eef3f8; overscroll-behavior:none; }
  #stage{ position:fixed; inset:0; }
  body.rot #stage{ width:100vh; height:100vw; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg); transform-origin:center; }
  #app{ position:absolute; inset:0; }
  #app canvas{ display:block; width:100%!important; height:100%!important; touch-action:none; }
  #cross{ position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px; z-index:6; border-radius:50%; background:rgba(255,255,255,.6); box-shadow:0 0 4px rgba(0,0,0,.6); pointer-events:none; }
  #joy{ position:fixed; left:26px; bottom:calc(28px + var(--safe-b)); z-index:20; width:128px; height:128px; border-radius:50%;
        background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.18); backdrop-filter:blur(6px); touch-action:none; }
  #joyKnob{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
            background:radial-gradient(circle at 38% 34%,#dff0ff,#5aa0ff); box-shadow:0 4px 16px rgba(0,0,0,.45); }
  .actBtn{ position:fixed; z-index:20; width:72px; height:72px; border-radius:50%; background:rgba(22,34,50,.62);
           border:2px solid rgba(255,255,255,.5); color:#fff; font-size:13px; font-weight:800; letter-spacing:.04em; backdrop-filter:blur(6px); cursor:pointer;
           box-shadow:0 4px 14px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; transition:transform .1s,background .15s; }
  .actBtn:active{ transform:scale(.92); background:rgba(90,160,255,.7); }
  #bJump  { right:26px;  bottom:calc(40px + var(--safe-b)); }
  #bSlide { right:110px; bottom:calc(66px + var(--safe-b)); width:62px; height:62px; }
  /* ===== CAMPO DE TIRO: gatillo + recarga + HUD de puntaje ===== */
  #bFire  { right:118px; bottom:calc(150px + var(--safe-b)); width:88px; height:88px; font-size:12px;
            background:rgba(58,26,26,.62); border-color:rgba(255,190,170,.55); }
  #bFire:active{ background:rgba(255,120,80,.72); }
  #bReload{ right:216px; bottom:calc(74px + var(--safe-b)); width:56px; height:56px; font-size:20px; }
  /* APUNTAR: un FPS necesita su propio botón de mira, no alcanza con gatillo y recarga */
  #bAds{ right:210px; bottom:calc(148px + var(--safe-b)); width:66px; height:66px; font-size:10px; letter-spacing:.02em; }
  #bAds.on{ background:rgba(224,118,31,.72); border-color:rgba(255,220,180,.9); }
  /* CRUCETA: una CRUZ blanca de cuatro brazos con hueco en el medio y punto al centro (el círculo
     de antes no marcaba el centro con precisión). Los cuatro brazos son cuatro degradados sobre el
     mismo pseudo-elemento, así no hacen falta cuatro divs. */
  #cross{ width:34px; height:34px; margin:-17px; background:transparent; border:0; border-radius:0;
          transition:opacity .12s linear; }
  #cross::before{ content:''; position:absolute; inset:0;
    background:
      linear-gradient(#fff,#fff) 50% 0    /2px 11px no-repeat,
      linear-gradient(#fff,#fff) 50% 100% /2px 11px no-repeat,
      linear-gradient(#fff,#fff) 0    50% /11px 2px no-repeat,
      linear-gradient(#fff,#fff) 100% 50% /11px 2px no-repeat;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.95)); }
  #cross::after{ content:''; position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px; border-radius:50%;
            background:#fff; box-shadow:0 0 3px rgba(0,0,0,.95); }
  /* apuntando manda el punto rojo de la réflex: dos cruces superpuestas es ruido */
  body.apuntando #cross{ opacity:0; }
  #tiroHUD{ position:fixed; right:calc(16px + var(--safe-t)); top:calc(106px + var(--safe-t)); z-index:11; pointer-events:none; text-align:right;
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.5); }
  #tiroHUD>div:nth-child(1){ font-size:27px; font-weight:800; letter-spacing:.03em; line-height:1; }
  #tiroHUD>div:nth-child(2){ font-size:11px; font-weight:600; letter-spacing:.08em; color:rgba(255,255,255,.72); margin-top:3px; }
  #tiroHUD>div:nth-child(3){ font-size:19px; font-weight:800; letter-spacing:.06em; margin-top:9px; color:#ffd9a0; }
  #tiroHUD>div:nth-child(3).low{ color:#ff8a6a; }
  #tiroMsg{ position:fixed; left:50%; top:57%; transform:translateX(-50%); z-index:11; pointer-events:none; color:#fff; opacity:0; transition:opacity .2s;
            font-family:'Segoe UI',system-ui,sans-serif; font-size:16px; font-weight:800; letter-spacing:.08em; text-shadow:0 2px 8px rgba(0,0,0,.85); }
  /* HUD moderno: arriba a la izquierda, sin fondo. Nombre del mundo + misión debajo. */
  #hudWrap{ position:fixed; left:calc(18px + var(--safe-t)); top:calc(14px + var(--safe-t)); z-index:10; pointer-events:none;
        font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif; text-shadow:0 1px 6px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4); }
  #hud{ color:#fff; font-weight:700; font-size:19px; letter-spacing:.06em; line-height:1.1; }
  #hudMission{ color:rgba(255,255,255,.82); font-weight:500; font-size:12.5px; letter-spacing:.05em; margin-top:3px; }
  #hudMission::before{ content:'◆ '; color:#7fd0ff; font-size:10px; }
  #loader{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
           background:#aebfcf; transition:opacity .5s; color:#0a3a63; font-size:13px; letter-spacing:.1em; }
  #loader.hide{ opacity:0; pointer-events:none; }
  /* ===== MENÚ DE INICIO (estética frutiger aero, fondo = mapa frutiger 144p difuminado) ===== */
  /* pantalla de NOMBRE (antes del menú) */
  #namePrompt{ position:absolute; inset:0; z-index:55; display:flex; align-items:center; justify-content:center; overflow:hidden;
    backdrop-filter:blur(18px) saturate(1.12) brightness(1.0); -webkit-backdrop-filter:blur(18px) saturate(1.12) brightness(1.0);
    background:radial-gradient(130% 100% at 50% 25%, rgba(180,225,255,.2), rgba(16,46,86,.6)); transition:opacity .4s; }
  #namePrompt.hide{ opacity:0; pointer-events:none; }
  #npPanel{ width:min(90%,400px); padding:24px 22px; border-radius:26px; text-align:center;
    background:linear-gradient(165deg, rgba(232,246,255,.86), rgba(186,218,250,.7)); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border:1.5px solid rgba(255,255,255,.72); box-shadow:0 24px 64px rgba(10,40,80,.55), inset 0 1px 0 rgba(255,255,255,.85); }
  #npPanel h1{ font-size:20px; font-weight:800; color:#0a3a63; margin-bottom:3px; }
  #npPanel .sub{ font-size:12px; color:#1f5a8c; opacity:.85; margin-bottom:14px; }
  #npName{ width:100%; box-sizing:border-box; padding:14px; border-radius:13px; font-size:16px; font-weight:700; color:#0a3a63; text-align:center; outline:none;
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(214,238,255,.62)); border:1.5px solid rgba(255,255,255,.75); box-shadow:inset 0 1px 3px rgba(40,90,140,.18); }
  #npName::placeholder{ color:#5a86ac; opacity:.7; }
  #npGo{ margin-top:16px; width:100%; padding:14px; border-radius:15px; font-size:16px; font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#5ad27a,#2aa64f); border:1.5px solid rgba(255,255,255,.7); box-shadow:0 10px 26px rgba(30,150,70,.5), inset 0 1px 0 rgba(255,255,255,.7); }
  #npGo:active{ transform:scale(.97); }
  #menu{ position:absolute; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; overflow:hidden;
         backdrop-filter:blur(16px) saturate(1.15) brightness(1.02); -webkit-backdrop-filter:blur(16px) saturate(1.15) brightness(1.02);
         background:radial-gradient(130% 100% at 50% 20%, rgba(180,225,255,.16), rgba(16,46,86,.52)); transition:opacity .45s; }
  #menu.hide{ opacity:0; pointer-events:none; }
  /* collage de mapas detrás del panel: varias tomas a la vez, en baja calidad y difuminadas */
  #menuBg{ position:absolute; inset:-7%; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:10px;
    filter:blur(11px) saturate(1.2) brightness(.9); opacity:.4; transform:scale(1.06); pointer-events:none;
    animation:bgDrift 38s ease-in-out infinite alternate; }
  .mShot{ position:relative; border-radius:20px; overflow:hidden; box-shadow:0 10px 34px rgba(0,0,0,.3), inset 0 0 40px rgba(255,255,255,.08); }
  .mShot::after{ content:attr(data-e); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:46px; opacity:.4; filter:saturate(1.1); }
  @keyframes bgDrift{ from{ transform:scale(1.06) translate(0,0); } to{ transform:scale(1.13) translate(-2%,-1.4%); } }
  /* panel compacto y nítido (vidrio frutiger aero) que agrupa todo en una tarjeta */
  #menuPanel{ position:relative; z-index:2; width:min(96%,680px); max-height:94%; overflow:auto; padding:14px 20px 14px; border-radius:24px; text-align:center;
    background:linear-gradient(165deg, rgba(232,246,255,.82), rgba(186,218,250,.66)); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border:1.5px solid rgba(255,255,255,.7); box-shadow:0 22px 60px rgba(10,40,80,.55), inset 0 1px 0 rgba(255,255,255,.85); }
  #menuPanel h1{ font-size:19px; font-weight:800; color:#0a3a63; margin-bottom:1px; text-shadow:0 1px 0 rgba(255,255,255,.6); }
  #menuPanel .sub{ font-size:11px; color:#1f5a8c; margin-bottom:9px; opacity:.85; }
  .mLabel{ font-size:10px; font-weight:800; letter-spacing:.1em; color:#15527f; text-align:center; margin:0 0 5px; opacity:.82; }
  /* tres grupos (vista/gráficos/idioma) en una sola banda → mucho menos alto */
  #mGroups{ display:flex; gap:8px; margin:11px 0 4px; }
  .mGrp{ flex:1; min-width:0; }
  .mCol{ display:flex; flex-direction:column; gap:6px; }
  .mRow{ display:flex; gap:8px; }
  .mOpt{ flex:1; padding:9px 5px; border-radius:11px; font-size:12px; font-weight:700; color:#0c4675; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:linear-gradient(180deg, rgba(255,255,255,.66), rgba(208,234,255,.3)); border:1.3px solid rgba(255,255,255,.62);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8); transition:transform .12s, box-shadow .2s, background .2s; }
  .mOpt.sel{ background:linear-gradient(180deg,#7fd0ff,#2f93e8); color:#fff; border-color:rgba(255,255,255,.85); box-shadow:0 5px 14px rgba(40,130,230,.5), inset 0 1px 0 rgba(255,255,255,.7); }
  .mOpt:active{ transform:scale(.95); }
  #mName{ width:100%; box-sizing:border-box; padding:11px 13px; border-radius:12px; font-size:14px; font-weight:700; color:#0a3a63; outline:none; text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(214,238,255,.62)); border:1.5px solid rgba(255,255,255,.72); box-shadow:inset 0 1px 3px rgba(40,90,140,.18); }
  #mName::placeholder{ color:#5a86ac; opacity:.7; }
  /* fila inferior: clasificación + jugar lado a lado (compacto) */
  #mBottom{ display:flex; gap:9px; align-items:stretch; margin-top:12px; }
  #mBottom #mBoardBtn{ flex:0 0 auto; width:auto; margin-top:0; padding:13px 14px; white-space:nowrap; }
  #mBottom #mPlay{ flex:1; width:auto; margin-top:0; padding:13px; }
  /* niveles: carrusel horizontal (deslizá para elegir) → ocupa poco espacio */
  #mLevels{ flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; gap:10px; padding:2px 2px 8px; }
  #mLevels .mOpt{ flex:0 0 auto; min-width:44%; scroll-snap-align:center; white-space:nowrap; }
  #mLevels::-webkit-scrollbar{ height:4px; } #mLevels::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.35); border-radius:2px; }
  #sSens{ flex:1; accent-color:#2ea3ff; height:26px; }
  #sSensV{ min-width:48px; text-align:right; font-weight:800; color:#0c4675; }
  .lvN{ display:inline-block; margin-left:5px; padding:1px 7px; border-radius:9px; font-size:10.5px; font-weight:800; background:rgba(10,40,70,.16); color:#0c4675; opacity:.55; vertical-align:1px; }
  .lvN.on{ opacity:1; background:#1d9e57; color:#eafff2; box-shadow:0 0 8px rgba(40,220,120,.45); }
  #menuPanel{ max-height:94%; overflow:auto; }
  #mPlay{ margin-top:22px; width:100%; padding:15px; border-radius:16px; font-size:16px; font-weight:800; letter-spacing:.05em; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#5ad27a,#2aa64f); border:1.5px solid rgba(255,255,255,.7); box-shadow:0 10px 26px rgba(30,150,70,.5), inset 0 1px 0 rgba(255,255,255,.7); transition:transform .12s; }
  #mPlay:active{ transform:scale(.96); }
  body.menu-open #joy, body.menu-open #bJump, body.menu-open #bSlide, body.menu-open #bFire, body.menu-open #bReload, body.menu-open #bAds, body.menu-open #tiroHUD, body.menu-open #tiroMsg, body.menu-open #hudWrap, body.menu-open #cross, body.menu-open #bChat, body.menu-open #bPack, body.menu-open #kbd, body.menu-open #bVoice, body.menu-open #btnMenu, body.menu-open #billHUD{ display:none !important; }
  /* ===== MULTIJUGADOR ===== */
  #mpStatus{ position:fixed; right:calc(12px + var(--safe-t)); top:calc(12px + var(--safe-t)); z-index:15; display:flex; align-items:center; gap:6px;
    background:rgba(14,22,30,.62); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:5px 10px; font-size:11px; font-weight:700; color:#cfe0ee; pointer-events:none; }
  #mpStatus::before{ content:''; width:9px; height:9px; border-radius:50%; background:#888; box-shadow:0 0 6px currentColor; }
  #mpStatus[data-s=online]{ color:#7af0a0; } #mpStatus[data-s=online]::before{ background:#43e07a; }
  #mpStatus[data-s=connecting]{ color:#ffd27a; } #mpStatus[data-s=connecting]::before{ background:#ffbf45; }
  #mpStatus[data-s=off]{ color:#ff9a9a; } #mpStatus[data-s=off]::before{ background:#e05a5a; }
  #mpChatLog{ position:fixed; left:12px; top:calc(50px + var(--safe-t)); z-index:14; width:min(56vw,300px); display:flex; flex-direction:column; gap:4px; pointer-events:none; }
  .mpMsg{ background:rgba(14,22,30,.6); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:5px 9px; font-size:12px; color:#e6f0fa; transition:opacity .6s; max-width:100%; word-wrap:break-word; }
  .mpMsg b{ color:#8fd0ff; }
  #vBoard{ position:fixed; left:calc(12px + var(--safe-t)); top:calc(96px + var(--safe-t)); z-index:14; width:min(50vw,240px); display:none; flex-direction:column; gap:3px;
    background:rgba(10,18,30,.55); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:8px 10px; backdrop-filter:blur(7px); pointer-events:none; font-family:'Segoe UI',system-ui,sans-serif; }
  #vBoard .vbTitle{ font-size:11.5px; font-weight:800; letter-spacing:.06em; color:#9fe0ff; text-transform:uppercase; margin-bottom:3px; }
  #vBoard .vbRow{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:#dceaf6; }
  #vBoard .vbRow b{ color:#7fe0c0; font-weight:700; }
  #vBoard .vbRow.me span{ color:#ffe9a0; font-weight:700; }
  #vTimer{ position:fixed; left:50%; top:calc(12px + var(--safe-t)); transform:translateX(-50%); z-index:16; display:none; pointer-events:none;
    font-family:'Segoe UI',system-ui,sans-serif; font-weight:800; font-size:15px; letter-spacing:.03em; padding:6px 14px; border-radius:20px;
    background:rgba(10,18,30,.6); border:1px solid rgba(255,255,255,.18); color:#bfe6ff; backdrop-filter:blur(7px); white-space:nowrap; }
  #vTimer[data-s=urgent]{ color:#fff; background:rgba(180,30,30,.7); border-color:#ff6a6a; animation:vpulse .7s infinite; }
  #vTimer[data-s=fail]{ color:#ffd0d0; background:rgba(120,20,20,.7); }
  #vTimer[data-s=got]{ color:#0a2a18; background:linear-gradient(180deg,#9fffd0,#39e0a0); border-color:#bfffe0; }
  @keyframes vpulse{ 0%,100%{ transform:translateX(-50%) scale(1); } 50%{ transform:translateX(-50%) scale(1.07); } }
  #bPack{ position:fixed; right:26px; bottom:calc(272px + var(--safe-b)); z-index:20; width:52px; height:52px; border-radius:50%; display:none;
    background:rgba(18,26,40,.62); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:24px; backdrop-filter:blur(7px); cursor:pointer; }
  #bPack:active{ transform:scale(.93); }
  #bVoice{ position:fixed; left:54px; bottom:calc(176px + var(--safe-b)); z-index:20; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(22,34,50,.6); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:23px; backdrop-filter:blur(7px); cursor:pointer; touch-action:none; user-select:none; }
  #bVoice.on{ background:linear-gradient(180deg,#8fe6a0,#2fb86a); border-color:#cffadb; box-shadow:0 0 16px rgba(60,220,120,.7); }
  #bVoice:active{ transform:scale(.92); }
  #vPack{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:30; display:none; width:min(88%,560px); max-height:82%; overflow-y:auto;
    background:rgba(10,16,26,.9); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:16px; backdrop-filter:blur(12px); font-family:'Segoe UI',system-ui,sans-serif; }
  #vPack.show{ display:block; }
  #vPack .vpTitle{ color:#cfe6ff; font-weight:800; font-size:15px; letter-spacing:.03em; margin-bottom:12px; }
  #vPack .vpGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; }
  #vPack .vpCard{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:13px; padding:9px 6px; text-align:center; cursor:pointer; transition:transform .1s; }
  #vPack .vpCard:active{ transform:scale(.94); }
  #vPack .vpCard.eq{ border-color:#7fe0c0; box-shadow:0 0 0 2px rgba(127,224,192,.5) inset; }
  #vPack .vpCard.lk{ opacity:.42; cursor:default; }
  #vPack .vpSw{ width:100%; height:38px; border-radius:8px; margin-bottom:6px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
  #vPack .vpN{ color:#eaf2fb; font-size:12.5px; font-weight:700; }
  #vPack .vpP{ color:#9fb6cc; font-size:11px; margin-top:2px; }
  /* botón para mostrar nombres de jugadores (izquierda, arriba del joystick) */
  #bNames{ position:fixed; left:54px; bottom:calc(176px + var(--safe-b)); z-index:20; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(22,34,50,.6); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:22px; backdrop-filter:blur(6px); cursor:pointer; }
  #bNames.on{ background:linear-gradient(180deg,#7fd0ff,#2f93e8); border-color:#cfeeff; box-shadow:0 0 14px rgba(80,180,255,.6); }
  #bNames:active{ transform:scale(.92); }
  /* TECLADO QWERTY frutiger aero (horizontal) DENTRO del juego (no usa el teclado del teléfono) */
  #kbd{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:none; flex-direction:column; gap:6px; padding:10px 12px calc(14px + var(--safe-b));
    background:linear-gradient(180deg, rgba(180,222,255,.34), rgba(120,180,235,.5)); backdrop-filter:blur(16px); border-top:1.5px solid rgba(255,255,255,.6); box-shadow:0 -10px 40px rgba(10,50,100,.4); }
  #kbd.show{ display:flex; }
  #kbd .kbField{ display:flex; gap:8px; align-items:center; margin-bottom:2px; }
  #kbd .kbText{ flex:1; min-height:34px; padding:7px 12px; border-radius:11px; font-size:16px; font-weight:600; color:#0a3a63; background:rgba(255,255,255,.82); border:1.5px solid rgba(255,255,255,.7); box-shadow:inset 0 1px 3px rgba(40,90,140,.18); white-space:nowrap; overflow:hidden; }
  #kbd .kbText:empty::before{ content:attr(data-ph); color:#5a86ac; opacity:.7; }
  #kbd .kbRow{ display:flex; gap:5px; justify-content:center; }
  #kbd .kbK{ flex:1; max-width:62px; min-width:0; height:42px; border-radius:10px; font-size:16px; font-weight:700; color:#0a3a63; cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(206,234,255,.66)); border:1.4px solid rgba(255,255,255,.8); box-shadow:0 2px 5px rgba(20,70,130,.22), inset 0 1px 0 rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; user-select:none; }
  #kbd .kbK:active{ transform:scale(.9); background:linear-gradient(180deg,#7fd0ff,#2f93e8); color:#fff; }
  #kbd .kbK.wide{ flex:1.6; max-width:none; }

/* 60 fps: la resolución no es fija. prBase la elige el preset de GRÁFICOS y prDyn la ajusta sola
   según lo que TARDA cada frame. En un juego de puntería importa más el ritmo que los píxeles:
   si el frame se pasa de 21 ms, baja la resolución interna antes de que se note el tirón. */
let prBase=Math.min(devicePixelRatio,2), prDyn=1, drsOn=true;
function aplicarPR(){ renderer.setPixelRatio(Math.max(0.45, prBase*prDyn)); }

function addBox(x,y,z,w,h,d,color,rough,noWall){   // (x,y,z)=centro

  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);

const GRASS_GZ=2000;          // el mundo de césped vive lejos en +Z para no chocar con la pista
const GBND={x:100, z0:GRASS_GZ-100, z1:GRASS_GZ+165};   // LÍMITES del mapa de césped (no salirse hacia la ciudad)
// elevaciones del terreno (mismas ondas que se replican en el shader del césped)
function terrainH(x,z){ const lz=z-GRASS_GZ;
  return Math.sin(x*0.035)*3.2 + Math.cos(lz*0.045)*3.2 + Math.sin((x*0.6+lz)*0.02)*5.0 + Math.cos((x-lz*0.7)*0.028)*2.2; }
// ===== CIELO (cúpula con degradé; estamos arriba en el cielo) =====
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x3f78c0)},bot:{value:new THREE.Color(0xd9eaf7)}},
  vertexShader:'varying float vh;void main(){vh=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying float vh;uniform vec3 top;uniform vec3 bot;void main(){gl_FragColor=vec4(mix(bot,top,clamp(vh*0.55+0.45,0.0,1.0)),1.0);}'});

// ===== helpers =====
function zoneTag(x,z,color){ const m=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.05,2.2),mat(color,0.6)); m.position.set(x,0.04,z); scene.add(m); }
function plat(x,top,z,w,d,col){ return addBox(x,top-0.2,z,w,0.4,d,col||0x76828f); }
// viga baja para deslizarse por debajo, sobre un techo a la altura 'top'
function slideBeam(x,z,top,col){ addBox(x,top+1.25,z,4.5,0.5,1.1,col||0x7a5566);
  addBox(x-1.8,top+0.6,z,0.5,1.6,1.1,col||0x7a5566,0.9,true); addBox(x+1.8,top+0.6,z,0.5,1.6,1.1,col||0x7a5566,0.9,true); }
// edificio: techo caminable a la altura 'top'; baja 36u hacia el cielo
// textura procedural de fachada (concreto claro + grilla de ventanas azules), como un edificio de oficinas
function makeFacadeTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#b8bcc1'; g.fillRect(0,0,256,256);                       // concreto claro
  const cols=4, rows=4, cw=256/cols, ch=256/rows, pad=7;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const wx=i*cw+pad, wy=j*ch+pad, ww=cw-pad*2, wh=ch-pad*2;
    g.fillStyle='#2b323a'; g.fillRect(wx-2,wy-2,ww+4,wh+4);             // marco
    const t=0.55+Math.random()*0.45, r=(38*t+24)|0, gg=(74*t+40)|0, b=(96*t+58)|0;
    g.fillStyle=`rgb(${r},${gg},${b})`; g.fillRect(wx,wy,ww,wh);        // vidrio azul
    g.fillStyle='rgba(255,255,255,0.07)'; g.beginPath(); g.moveTo(wx,wy+wh*0.45); g.lineTo(wx+ww*0.6,wy); g.lineTo(wx+ww,wy); g.lineTo(wx,wy+wh); g.closePath(); g.fill();   // reflejo
    if(Math.random()<0.14){ g.fillStyle='rgba(255,224,168,0.55)'; g.fillRect(wx+ww*0.55,wy+wh*0.18,ww*0.28,wh*0.45); }     // alguna luz cálida
  }
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.anisotropy=4; return tex; }
const _facadeBase=makeFacadeTex();
const ROOF_MAT=new THREE.MeshStandardMaterial({color:0xeef1f4,roughness:1,metalness:0});   // piso/techo BLANCO
const BBOT_MAT=new THREE.MeshStandardMaterial({color:0x2a2f36,roughness:1,metalness:0});
function bldg(x,top,z,w,d){
  const tex=_facadeBase.clone(); tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1,Math.round(w/3.6)), Math.max(4,Math.round(36/3.4)));            // ventanas de tamaño parejo
  const side=new THREE.MeshStandardMaterial({map:tex,roughness:1,metalness:0});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,36,d),[side,side,ROOF_MAT,BBOT_MAT,side,side]);   // costados con textura, tope blanco
  m.position.set(x,top-18,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  colliders.push({minx:x-w/2,maxx:x+w/2,miny:top-36,maxy:top,minz:z-d/2,maxz:z+d/2,mesh:m}); }

/* ===================== SISTEMAS DE NIVEL (botones, plataformas bloqueadas, puertas-quiz, checkpoints) ===================== */
// plataforma BLOQUEADA: invisible y sin colisión hasta desbloquear
function addLocked(x,top,z,w,d,col){ const c=plat(x,top,z,w,d,col||0x4aa0d0); c.locked=true; c.mesh.visible=false; return c; }
function unlock(c){ if(c){ c.locked=false; c.mesh.visible=true; } }
// botón: al acercarte se activa (se pone verde) y dispara onPress
const buttons=[];
function addButton(x,y,z,onPress){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.52,0.4,18), new THREE.MeshStandardMaterial({color:0xd23b3b,emissive:0x661414,emissiveIntensity:0.9,roughness:0.5}));
  m.position.set(x,y+0.2,z); m.castShadow=true; scene.add(m);
  buttons.push({m,x,y,z,on:false,onPress}); }
function tickButtons(){ for(const b of buttons){ if(b.on)continue;
  const dx=player.pos.x-b.x, dz=player.pos.z-b.z, dy=player.pos.y-b.y;
  if(dx*dx+dz*dz<1.7*1.7 && dy>-0.6 && dy<2.4){ b.on=true; b.m.material.color.set(0x3bd24f); b.m.material.emissive.set(0x12521e); sfx('btn'); if(b.onPress)b.onPress(); } } }
// cartel/numero 3D (canvas) que mira hacia -Z (hacia el jugador que avanza en +Z)
function textPanel(x,y,z,w,h){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=160; const cx=cv.getContext('2d');
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex,transparent:true,fog:false,side:THREE.DoubleSide}));
  m.position.set(x,y,z); m.rotation.y=Math.PI; scene.add(m);
  return { set(txt,col){ cx.clearRect(0,0,256,160); cx.fillStyle='rgba(16,24,34,0.82)'; cx.fillRect(0,0,256,160);
    cx.strokeStyle='rgba(255,255,255,0.25)'; cx.lineWidth=6; cx.strokeRect(3,3,250,154);
    cx.fillStyle=col||'#ffd24a'; cx.font='bold 92px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(txt,128,84); tex.needsUpdate=true; } };
}
// checkpoints: al pisar la zona de un edificio, reaparecés ahí (no desde el principio)
const checkpoints=[]; let lastSafe=new THREE.Vector3(0,2,4);
function checkpoint(x,z,w,d,sx,sy,sz){ checkpoints.push({minx:x-w/2,maxx:x+w/2,minz:z-d/2,maxz:z+d/2,pos:new THREE.Vector3(sx,sy,sz)}); }
// QUIZ de sumas (edificio 4): dos puertas, la respuesta correcta es piso sólido, la otra es un hueco
let quizL=null,quizR=null,quizPanelL=null,quizPanelR=null,quizPanelQ=null,quizWrong=null,quizArmed=false;
function setupQuiz(){ if(!quizPanelQ)return;
  const a=2+((Math.random()*8)|0), b=2+((Math.random()*8)|0), ans=a+b;
  let wrong=ans; while(wrong===ans){ wrong=ans+((Math.random()*7)|0)-3; if(wrong<1)wrong=ans+2; }
  const corrL=Math.random()<0.5;
  quizPanelQ.set(a+'+'+b+'=?','#ffffff');
  quizPanelL.set(String(corrL?ans:wrong)); quizPanelR.set(String(corrL?wrong:ans));
  unlock(quizL); unlock(quizR);              // ambas SÓLIDAS y visibles (no se sabe cuál es el hueco; la pared tapa el otro lado)
  quizWrong = corrL? quizR : quizL;          // la incorrecta es una TRAMPA: se abre el hueco al pisarla
  quizArmed = true;
}
// al pisar la plataforma incorrecta detrás de la pared, se abre el hueco y caés (sin poder agarrarte)
function tickQuiz(){ if(world!=='city'||!quizArmed||!quizWrong)return;
  if(player.pos.z>110){ quizArmed=false; return; }                                   // pasaste bien (a la unión)
  if((player.onGround||player.sliding) && player.pos.z>102.2 && player.pos.z<110){
    const onWrong=(player.pos.x<0 && quizWrong===quizL)||(player.pos.x>0 && quizWrong===quizR);
    if(onWrong){ quizWrong.locked=true; quizWrong.mesh.visible=false; quizArmed=false; player.climbing=false; sfx('wrong'); }   // HUECO → caída sin agarre
  }
}
// PORTAL final (edificio 6): anillo brillante; al tocarlo, nivel completo
let portalMesh=null, portalDone=false;
function buildPortal(x,y,z){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.2,12,30), new THREE.MeshStandardMaterial({color:0x6fd6ff,emissive:0x2598ff,emissiveIntensity:1.6,roughness:0.4,metalness:0.2}));
  ring.position.set(x,y,z); scene.add(ring);
  const disc=new THREE.Mesh(new THREE.CircleGeometry(1.4,30), new THREE.MeshBasicMaterial({color:0x9fefff,transparent:true,opacity:0.35,side:THREE.DoubleSide,fog:false}));
  disc.position.set(x,y,z); scene.add(disc);
  portalMesh={x,y,z,ring,disc}; }
function tickPortal(dt){ if(!portalMesh)return; portalMesh.ring.rotation.z+=dt*0.7;
  const dx=player.pos.x-portalMesh.x, dy=(player.pos.y+1)-portalMesh.y, dz=player.pos.z-portalMesh.z;
  if(!portalDone && dx*dx+dy*dy+dz*dz<1.9*1.9){ portalDone=true; enterTiro(); } }

/* ===================== CAMPO DE TIRO (mundo GRIS · galería larga; 1ª persona con brazos y arma EN LAS MANOS) =====================
   Vive en +Z lejos del resto (TIRO_GZ), igual que los demás mundos.
   El arma NO se cuelga del hueso de la mano: se coloca respecto a la CÁMARA (viewmodel) y las MANOS van a buscarla
   con IK de dos huesos sobre el MISMO rig del juego → ves TUS brazos, TU skin y TUS animaciones agarrando el fusil. */
const TIRO_GZ=16000;

/* ---- texturas de hormigón/blanco (canvas: cero descargas) ---- */
function tiroConcreteTex(base,ruido,lin){ const S=256,c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){ const v=(Math.random()*2-1)*ruido; const l=Math.max(0,Math.min(255,base_l(base)+v));
    g.fillStyle='rgba('+(l|0)+','+(l|0)+','+((l*1.01)|0)+',0.5)'; g.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*2.4,1+Math.random()*2.4); }
  for(let i=0;i<26;i++){ g.fillStyle='rgba(0,0,0,'+(0.02+Math.random()*0.05)+')'; const r=8+Math.random()*38;
    g.beginPath(); g.arc(Math.random()*S,Math.random()*S,r,0,6.283); g.fill(); }
  if(lin){ g.strokeStyle='rgba(0,0,0,.20)'; g.lineWidth=2; for(let i=0;i<=S;i+=64){ g.beginPath();g.moveTo(0,i);g.lineTo(S,i);g.stroke(); g.beginPath();g.moveTo(i,0);g.lineTo(i,S);g.stroke(); } }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t; }
function base_l(hex){ const n=parseInt(hex.slice(1),16); return ((n>>16&255)+(n>>8&255)+(n&255))/3; }
/* sombra de contacto pintada (el sol no entra al galpón: sin esto todo flota) */
let _txBlob=null;
function blobTex(){ if(_txBlob)return _txBlob; const S=128,c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2); gr.addColorStop(0,'rgba(0,0,0,.72)'); gr.addColorStop(0.55,'rgba(0,0,0,.30)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,S,S); const t=new THREE.CanvasTexture(c); return (_txBlob=t); }
function tiroBlob(x,z,r,padre){ const m=new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2),
    new THREE.MeshBasicMaterial({map:blobTex(),transparent:true,depthWrite:false,opacity:0.85}));
  m.rotation.x=-Math.PI/2; m.position.set(x,0.012,z+(padre?0:TIRO_GZ)); m.renderOrder=1; (padre||tiroGroup).add(m); return m; }
let _txPiso=null,_txPared=null;
function tiroMat(color,rough,metal,tex,rep){ const m=new THREE.MeshStandardMaterial({color:color,roughness:rough==null?0.92:rough,metalness:metal||0});
  if(tex){ m.map=tex.clone(); m.map.needsUpdate=true; if(rep)m.map.repeat.set(rep[0],rep[1]); } return m; }

/* ---- caja gris con colisión, dentro del grupo del nivel (z relativo a TIRO_GZ) ---- */
function addTiro(x,y,z,w,h,d,m,noWall,noCol){
  const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  me.position.set(x,y,z+TIRO_GZ); me.castShadow=true; me.receiveShadow=true; tiroGroup.add(me);
  if(!noCol) colliders.push({minx:x-w/2,maxx:x+w/2,miny:y-h/2,maxy:y+h/2,minz:z+TIRO_GZ-d/2,maxz:z+TIRO_GZ+d/2,mesh:me});
  if(!noWall) wallMeshes.push(me);
  tiroSolids.push(me); return me; }

/* ---- cartel con texto (canvas) ---- */
function tiroSign(txt,x,y,z,w,h,ry,col){ const S=256,c=document.createElement('canvas'); c.width=S; c.height=128; const g=c.getContext('2d');
  g.fillStyle='#20242a'; g.fillRect(0,0,S,128); g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=4; g.strokeRect(4,4,S-8,120);
  g.fillStyle=col||'#e8edf2'; g.font='bold 62px Segoe UI,system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,S/2,68);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const me=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({map:t,roughness:0.85,emissive:0x0a0c0e,emissiveIntensity:0.35}));
  me.position.set(x,y,z+TIRO_GZ); me.rotation.y=ry||0; tiroGroup.add(me); return me; }

/* ---- blanco de PAPEL (anillos concéntricos, puntaje por distancia al centro) ---- */
function tiroPaperTex(){ const S=512,c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  g.fillStyle='#e9e6de'; g.fillRect(0,0,S,S);
  for(let i=0;i<1400;i++){ g.fillStyle='rgba(0,0,0,'+(0.01+Math.random()*0.03)+')'; g.fillRect(Math.random()*S,Math.random()*S,2,2); }
  const R=S*0.46, ring=[0.85,0.66,0.48,0.33,0.20];
  g.strokeStyle='#1a1a1a'; g.lineWidth=3;
  for(const r of ring){ g.beginPath(); g.arc(S/2,S/2,R*r,0,6.283); g.stroke(); }
  g.fillStyle='#111'; g.beginPath(); g.arc(S/2,S/2,R*0.20,0,6.283); g.fill();          // negro central
  g.fillStyle='#c0392b'; g.beginPath(); g.arc(S/2,S/2,R*0.085,0,6.283); g.fill();       // rojo del 10
  g.strokeStyle='#1a1a1a'; g.lineWidth=2; g.beginPath(); g.arc(S/2,S/2,R,0,6.283); g.stroke();
  g.fillStyle='#1a1a1a'; g.font='bold 26px Segoe UI,sans-serif'; g.textAlign='center'; g.fillText('10',S/2,S*0.5+R*0.42);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
let _txPapel=null;
function addPaper(x,z,alto){
  const A=alto||1.62, W=1.18;
  const post=tiroMat(0x6c7278,0.6,0.35);
  addTiro(x-W/2-0.05,A*0.5,z,0.07,A+0.5,0.07,post,true);            // parantes
  addTiro(x+W/2+0.05,A*0.5,z,0.07,A+0.5,0.07,post,true);
  addTiro(x,0.06,z,W+0.4,0.12,0.34,tiroMat(0x4b5055,0.9),true);      // base
  addTiro(x,A,z+0.035,W+0.1,W+0.1,0.05,tiroMat(0x33383d,0.95),true,true);   // respaldo de cartón
  if(!_txPapel)_txPapel=tiroPaperTex();
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(W,W), new THREE.MeshStandardMaterial({map:_txPapel,roughness:0.88,metalness:0}));
  pl.position.set(x,A,z+TIRO_GZ+0.005); pl.rotation.y=Math.PI;   // el jugador viene de -Z y mira hacia +Z → la cara del papel mira a -Z
  pl.userData={kind:'paper', dist:z}; tiroGroup.add(pl); tiroTargets.push(pl); tiroBlob(x,z,0.95); return pl; }

/* ---- POPPER de acero (se cae al recibir el impacto y se levanta solo) ---- */
function addPopper(x,z,h,r,padre){
  const piv=new THREE.Group(); piv.position.set(x,0,z+(padre?0:TIRO_GZ)); (padre||tiroGroup).add(piv);
  const H=h||1.15, RR=r||0.20;
  const st=new THREE.Mesh(new THREE.BoxGeometry(0.055,H,0.055), tiroMat(0x5a6066,0.7,0.4)); st.position.y=H/2; piv.add(st);
  const pl=new THREE.Mesh(new THREE.CylinderGeometry(RR,RR,0.05,22), tiroMat(0xb9c0c7,0.32,0.9));
  pl.rotation.x=Math.PI/2; pl.position.y=H; piv.add(pl);
  const ar=new THREE.Mesh(new THREE.RingGeometry(RR*0.42,RR*0.60,20), new THREE.MeshStandardMaterial({color:0xc8452f,roughness:0.7,side:THREE.DoubleSide}));
  ar.position.set(0,H,-0.031); piv.add(ar);   // círculo naranja para verlo de lejos
  if(!padre){ const ba=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.1,0.34), tiroMat(0x44494e,0.9)); ba.position.y=0.05; piv.add(ba); tiroBlob(x,z,0.5); }
  else tiroBlob(0,0,0.5,padre);
  pl.userData={kind:'steel', piv:piv, down:false, t:0, r:RR};
  tiroTargets.push(pl); return pl; }

/* ---- pool de marcas de impacto (agujeros) y trazadoras ---- */
const tiroMarks=[]; let _markI=0;
function tiroMark(){ if(tiroMarks.length<48){ const m=new THREE.Mesh(new THREE.CircleGeometry(0.021,10), new THREE.MeshBasicMaterial({color:0x141414}));
    m.renderOrder=2; tiroMarks.push(m); return m; }
  const m=tiroMarks[_markI]; _markI=(_markI+1)%tiroMarks.length; return m; }
const tiroTracers=[];
function tiroTracer(){ for(const t of tiroTracers) if(t.userData.v<=0) return t;
  // G4: el cilindro tiene que vivir en +Z. lookAt() apunta el +Z del objeto al objetivo, así que con
  // translate(0,0,-0.5) la estela salía de la boca HACIA ATRÁS (un solo signo, un solo bug).
  const g=new THREE.CylinderGeometry(0.013,0.013,1,5,1,true); g.rotateX(Math.PI/2); g.translate(0,0,0.5);   // eje +Z (el de lookAt), origen en la boca
  const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:0xffe9a8,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.userData={v:0}; m.visible=false; scene.add(m); tiroTracers.push(m); return m; }
const tiroSparks=[];
function tiroSpark(){ for(const s of tiroSparks) if(s.userData.v<=0) return s;
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.055,7,5), new THREE.MeshBasicMaterial({color:0xffd58a,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.userData={v:0}; m.visible=false; scene.add(m); tiroSparks.push(m); return m; }

/* ---- RECORTES EN EL SHADER ----
   El juego ocultaba la cabeza con el near plane de la cámara (0,20). Medido en el rig: la mano derecha queda a
   0,196 m del ojo quieto y a 0,147 m al deslizarse → ese mismo near plane CORTABA LAS MANOS (y una malla cortada por
   el near plane se ve como una garra con púas). Bajar el near a 0,05 destapa las manos… y también la cara por dentro.
   Colapsar el hueso de la cabeza tampoco sirve: el cuerpo es UNA malla de 23.380 vértices con UN material, así que
   los vértices del cuello (pesados entre cuello y cabeza) se estiran en láminas por toda la pantalla.

/* ===================== ISLA DE ALCATRAZ (reconstrucción a escala real) =====================
   La galería de tiro es un pasillo cerrado de 32 × 86 m; esto es otra cosa: una isla de 500 × 250 m
   con 41 m de desnivel. Dos problemas nuevos, y cada uno tiene su solución acá abajo.

   1) EL TERRENO NO ES UNA CAJA. La colisión del juego es AABB pura, y con cajas no hay ladera que
      valga: o subís por escalones de 2 m o no subís. Así que la isla lleva su propio CAMPO DE
      ALTURAS: el trazado (línea de costa + las terrazas artificiales que le cortaron a la roca) se
      rasteriza UNA vez a una grilla de 2 m y después se muestrea con interpolación bilineal. El
      terreno queda suave, se camina, y los edificios siguen siendo AABB apoyados encima.
      Las laderas de verdad (los acantilados) se vuelven infranqueables por PENDIENTE, no por caja:
      si el destino de un paso tiene más de ~44° de inclinación y va para arriba, el paso no se da.

   2) SEISCIENTOS EDIFICIOS SON SEISCIENTAS LLAMADAS DE DIBUJO. Cada elemento del plano se convierte
      en geometría y se ACUMULA por material; al final se funden todas de una y la isla entera sale
      en un puñado de llamadas en vez de una por ladrillo. La colisión se calcula aparte, sobre los
      datos, así que fundir la geometría no le saca nada al juego.

   Coordenadas LOCALES de la isla: +X este (el muelle), −X oeste, +Z sur, −Z norte, Y sobre el mar.
   El grupo entero vive corrido a ALC_GZ en +Z, como los demás mundos. */
const ALC_GZ=24000;
const alcGroup=new THREE.Group(); alcGroup.visible=false; scene.add(alcGroup);
let alcBuilt=false, islaMode=false, alcSuelo=null, alcAgua=null;
const ALC_COL=[];                       // colisionadores propios de la isla
const ALC_X0=-260, ALC_X1=260, ALC_Z0=-135, ALC_Z1=135, ALC_CEL=2;   // caja del mapa y lado de celda
const ALC_NX=Math.round((ALC_X1-ALC_X0)/ALC_CEL)+1, ALC_NZ=Math.round((ALC_Z1-ALC_Z0)/ALC_CEL)+1;
let alcHM=null;                         // campo de alturas (Float32Array, ALC_NX × ALC_NZ)
const ALC_START=new THREE.Vector3(196,0,ALC_GZ+46);   // el muelle: ahí te deja la lancha

/* distancia CON SIGNO a un polígono: positiva adentro, negativa afuera (Íñigo Quílez, con el signo
   dado vuelta). Es lo que convierte "una lista de puntos de la costa" en un terreno. */
function alcSD(pts,x,z){ const n=pts.length; let d=1e18, s=1;
  for(let i=0,j=n-1;i<n;j=i++){
    const ax=pts[i][0], az=pts[i][1], bx=pts[j][0], bz=pts[j][1];
    const ex=bx-ax, ez=bz-az, wx=x-ax, wz=z-az;
    const t=Math.max(0,Math.min(1,(wx*ex+wz*ez)/(ex*ex+ez*ez||1e-9)));
    const cx=wx-ex*t, cz=wz-ez*t, q=cx*cx+cz*cz; if(q<d)d=q;
    const c1=(z>=az), c2=(z<bz), c3=(ex*wz>ez*wx);
    if((c1&&c2&&c3)||(!c1&&!c2&&!c3)) s=-s; }
  return -s*Math.sqrt(d); }

/* el trazado → la grilla de alturas. Cada terraza tira del terreno hacia SU cota con un talud suave
   de ancho `borde`; aplicadas de la más baja a la más alta, salen los escalones que le cortaron a la
   isla de verdad. Fuera de la costa el terreno se hunde: ahí está el agua. */
function alcRaster(T){
  alcHM=new Float32Array(ALC_NX*ALC_NZ);
  const cima=T.cima||41, ac=T.acantilado||0.95, ori=T.orilla, ter=T.terrazas||[];
  for(let j=0;j<ALC_NZ;j++){ const z=ALC_Z0+j*ALC_CEL;
    for(let i=0;i<ALC_NX;i++){ const x=ALC_X0+i*ALC_CEL;
      const d=alcSD(ori,x,z);
      let h = (d<=0) ? Math.max(-16, d*0.55-0.5) : Math.min(cima, Math.pow(d,0.86)*ac);
      for(let k=0;k<ter.length;k++){ const t=ter[k], b=Math.max(1.5,t.borde||9);
        const dt=alcSD(t.poly,x,z); let s=(dt+b)/(2*b);
        if(s<=0)continue; if(s>1)s=1; s=s*s*(3-2*s);
        h += (t.y-h)*s; }
      alcHM[j*ALC_NX+i]=h; } } }

function alcH(x,z){ if(!alcHM)return 0;
  let fx=(x-ALC_X0)/ALC_CEL, fz=(z-ALC_Z0)/ALC_CEL;
  if(fx<0)fx=0; else if(fx>ALC_NX-1.001)fx=ALC_NX-1.001;
  if(fz<0)fz=0; else if(fz>ALC_NZ-1.001)fz=ALC_NZ-1.001;
  const i=fx|0, j=fz|0, u=fx-i, v=fz-j, o=j*ALC_NX+i;
  const a=alcHM[o], b=alcHM[o+1], c=alcHM[o+ALC_NX], e=alcHM[o+ALC_NX+1];
  return (a+(b-a)*u)*(1-v)+(c+(e-c)*u)*v; }
function alcPend(x,z){ const e=1.4;
  const dx=(alcH(x+e,z)-alcH(x-e,z))/(2*e), dz=(alcH(x,z+e)-alcH(x,z-e))/(2*e);
  return Math.hypot(dx,dz); }

/* ---------------- materiales de la isla (canvas, cero descargas) ---------------- */
const ALC_M={};
function alcMats(){ if(ALC_M.hormigon)return ALC_M;
  const T=(base,ruido,lin)=>tiroConcreteTex(base,ruido,lin);
  const M=(c,r,m,tex,rep)=>{ const s=new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.92:r,metalness:m||0});
    if(tex){ s.map=tex.clone(); s.map.needsUpdate=true; s.map.wrapS=s.map.wrapT=THREE.RepeatWrapping; if(rep)s.map.repeat.set(rep[0],rep[1]); }
    s.envMapIntensity=0.35; return s; };
  const txH=T('#b9b4a8',16,false), txL=T('#8e5b46',18,true), txR=T('#6d6f72',26,false);
  ALC_M.hormigon     = M(0xc3bfb4,0.95,0,txH,[6,6]);
  ALC_M.hormigonSucio= M(0x9d9789,0.97,0,txH,[6,6]);
  ALC_M.blanco       = M(0xe6e3da,0.9,0,txH,[5,5]);
  ALC_M.blancoSucio  = M(0xcfcabd,0.95,0,txH,[5,5]);
  ALC_M.ladrillo     = M(0xa87458,0.95,0,txL,[7,7]);
  ALC_M.ladrilloRojo = M(0x93493a,0.95,0,txL,[7,7]);
  ALC_M.ventana      = M(0x1b2530,0.35,0.15);
  ALC_M.vidrio       = M(0x9fc4d8,0.14,0.25);
  ALC_M.techoRojo    = M(0x8d4b39,0.88);
  ALC_M.techoChapa   = M(0x7d858c,0.62,0.35);
  ALC_M.techoAlquitran=M(0x3a3d40,0.96);
  ALC_M.metal        = M(0x8a9198,0.5,0.55);
  ALC_M.oxido        = M(0x7a4a2c,0.9,0.2);
  ALC_M.madera       = M(0x8a6a45,0.92);
  ALC_M.maderaVieja  = M(0x6b5942,0.96);
  ALC_M.roca         = M(0x77726b,0.98,0,txR,[3,3]);
  ALC_M.tierra       = M(0x7d6b52,0.98);
  ALC_M.pasto        = M(0x6f7c48,0.97);
  ALC_M.arena        = M(0xb6a889,0.97);
  ALC_M.asfalto      = M(0x4a4b4d,0.94);
  ALC_M.rejilla      = M(0x5a6068,0.7,0.4);
  ALC_M.negro        = M(0x1a1c1f,0.9);
  ALC_M.faro         = M(0xf2efe6,0.85);
  ALC_M.agua        = M(0x2e5468,0.16,0.1);
  // el follaje lleva COLOR POR VÉRTICE: con una sola malla fundida para toda la isla es la única
  // forma de que no queden doscientos árboles exactamente del mismo verde
  ALC_M.follaje     = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.93,metalness:0,vertexColors:true});
  ALC_M.follaje.envMapIntensity=0.3;
  return ALC_M; }
function alcMat(n){ alcMats(); return ALC_M[n]||ALC_M.hormigon; }

/* ---------------- acumulador: geometría por material, se funde al final ---------------- */
const _alcB=new Map();
const _alcM4=new THREE.Matrix4(), _alcQ=new THREE.Quaternion(), _alcV=new THREE.Vector3(),
      _alcS=new THREE.Vector3(1,1,1), _alcEjeY=new THREE.Vector3(0,1,0);
/* variante con color por vértice: se usa para el follaje */
const _alcCol=new THREE.Color();
function alcAddC(matName, geo, x,y,z, ry, hex){
  if(geo.index) geo=geo.toNonIndexed();
  const n=geo.attributes.position.count, arr=new Float32Array(n*3);
  _alcCol.setHex(hex);
  for(let i=0;i<n;i++){ arr[i*3]=_alcCol.r; arr[i*3+1]=_alcCol.g; arr[i*3+2]=_alcCol.b; }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
  alcAdd(matName,geo,x,y,z,ry); }
function alcAdd(matName, geo, x,y,z, ry){
  // mergeGeometries exige que TODAS vengan igual: se pasa todo a no-indexado (y de paso las
  // normales del prisma quedan planas, que es como tiene que verse un techo a dos aguas).
  if(geo.index) geo=geo.toNonIndexed();
  _alcQ.setFromAxisAngle(_alcEjeY, ry||0);
  _alcV.set(x,y,z+ALC_GZ);
  geo.applyMatrix4(_alcM4.compose(_alcV,_alcQ,_alcS));
  let a=_alcB.get(matName); if(!a){ a=[]; _alcB.set(matName,a); } a.push(geo); }
/* BROADPHASE. Un solo bloque de celdas mete ~1.000 cajas de colisión; cuatro bloques más el resto
   de la isla pasan de 4.000, y el bucle de colisión corre TRES veces por frame (X, Y, Z). Se indexan
   una vez en una grilla de 16 m y cada paso mira sólo las nueve celdas de alrededor: de 4.000
   pruebas por eje se baja a unas 40. Sin esto, entrar al penal costaba más que dibujarlo. */
const ALC_REJ=new Map(); const ALC_REJC=16; let _alcSello=0;
function alcIndexar(){ ALC_REJ.clear();
  for(let n=0;n<ALC_COL.length;n++){ const c=ALC_COL[n];
    const i0=Math.floor(c.minx/ALC_REJC), i1=Math.floor(c.maxx/ALC_REJC);
    const j0=Math.floor((c.minz-ALC_GZ)/ALC_REJC), j1=Math.floor((c.maxz-ALC_GZ)/ALC_REJC);
    for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){ const k=i+'_'+j;
      let a=ALC_REJ.get(k); if(!a){ a=[]; ALC_REJ.set(k,a); } a.push(c); } } }
const _alcCand=[];
function alcLista(){ if(!islaMode) return colliders;
  _alcCand.length=0; _alcSello++;
  const i=Math.floor(player.pos.x/ALC_REJC), j=Math.floor((player.pos.z-ALC_GZ)/ALC_REJC);
  for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){ const l=ALC_REJ.get((i+a)+'_'+(j+b)); if(!l)continue;
    for(let k=0;k<l.length;k++){ const c=l[k]; if(c._s===_alcSello)continue; c._s=_alcSello; _alcCand.push(c); } }
  return _alcCand; }

/* colisión: la caja alineada que envuelve al bloque ya girado */
function alcCol(x,y,z,w,h,d,ry){
  const c=Math.abs(Math.cos(ry||0)), s=Math.abs(Math.sin(ry||0));
  const ew=(w*c+d*s)/2, ed=(w*s+d*c)/2;
  /* OJO con `mesh`: moveX/moveZ descartan el collider con `c.mesh===ground`, y `ground` vale null.
     Poniendo mesh:null la isla entera se saltaba la colisión. Se deja sin la propiedad. */
  const col={minx:x-ew,maxx:x+ew,miny:y-h/2,maxy:y+h/2,minz:z+ALC_GZ-ed,maxz:z+ALC_GZ+ed,_isla:true,locked:true};
  ALC_COL.push(col); return col; }

/* ---------------- primitivas del plano ---------------- */
function alcCaja(x,y,z,w,h,d,m,ry,sinCol){ alcAdd(m,new THREE.BoxGeometry(w,h,d),x,y,z,ry);
  if(!sinCol) alcCol(x,y,z,w,h,d,ry); }
function alcCil(x,y,z,r1,r2,h,seg,m,ry,sinCol){ alcAdd(m,new THREE.CylinderGeometry(r1,r2,h,Math.max(5,seg||10)),x,y,z,ry);
  if(!sinCol) alcCol(x,y,z,r1*2,h,r1*2,0); }
/* prisma triangular = techo a dos aguas. Se arma a mano: 6 vértices, 8 triángulos. */
function alcPrisma(x,y,z,w,h,d,m,ry,sinCol){
  const hw=w/2, hh=h/2, hd=d/2;
  const v=[-hw,-hh,-hd, hw,-hh,-hd, hw,-hh,hd, -hw,-hh,hd, 0,hh,-hd, 0,hh,hd];
  const f=[0,1,4, 1,2,5, 5,4,1, 2,3,5, 3,0,4, 4,5,3, 0,3,2, 2,1,0];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.setIndex(f); g.computeVertexNormals();
  const uv=[]; for(let i=0;i<6;i++) uv.push(v[i*3]/w+0.5, v[i*3+2]/d+0.5);
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  alcAdd(m,g,x,y,z,ry);
  if(!sinCol) alcCol(x,y+ -h/4,z,w,h/2,d,ry); }

/* PARED CON VENTANAS DE VERDAD. Las ventanas eran cajas oscuras PEGADAS sobre un muro macizo: de
   afuera pasaban, pero adentro el edificio quedaba en tinieblas y no se veía nada hacia afuera. Acá
   la ventana es un HUECO: la pared se arma por bandas (antepecho, dinteles, coronamiento) y por
   machones entre hueco y hueco, y en el hueco van los barrotes. Entra la luz, se ve la bahía desde
   la celda, y de paso el muro tiene el ritmo que le da una fachada de verdad. */
function alcParedVentanas(cx,cy,cz, largo,alto,esp, ry, m, V, puertas){
  const cs=Math.cos(ry), sn=Math.sin(ry);
  const caja=(off,yy,L,H)=>{ if(L<0.04||H<0.04)return;
    alcCaja(cx+off*cs, cy-alto/2+yy+H/2, cz-off*sn, L, H, esp, m, ry); };
  const cols=Math.max(1,V.cols|0), filas=Math.max(1,V.filas|0);
  const vw=Math.min(V.w||1.1, largo/cols*0.72), vh=V.h||1.8, y0=(V.y0==null?1.2:V.y0);
  const paso=(alto-y0-0.5)/filas, sep=largo/cols;
  const puer=(puertas||[]);
  // antepecho corrido, con los huecos de puerta descontados
  const bandas=[];
  bandas.push([0,y0]);
  for(let f=0;f<filas;f++){ const yb=y0+paso*f+vh; bandas.push([yb, Math.min(alto, y0+paso*(f+1))]); }
  if(y0+paso*filas<alto) bandas.push([y0+paso*filas, alto]);
  for(const [a,b] of bandas){ const H=b-a; if(H<0.04)continue;
    const cortes=puer.filter(q=>q.h>a+0.02).map(q=>[q.o-q.w/2,q.o+q.w/2, Math.min(b,q.h)]);
    if(!cortes.length){ caja(0,a,largo,H); continue; }
    cortes.sort((p1,p2)=>p1[0]-p2[0]); let u=-largo/2;
    for(const c of cortes){ caja((u+Math.max(u,c[0]))/2, a, Math.max(0,c[0]-u), H); 
      if(c[2]<b) caja((c[0]+c[1])/2, c[2], c[1]-c[0], b-c[2]);      // dintel sobre la puerta
      u=Math.max(u,c[1]); }
    caja((u+largo/2)/2, a, largo/2-u, H); }
  // machones entre ventanas + barrotes en el hueco
  for(let f=0;f<filas;f++){ const yb=y0+paso*f;
    for(let c=0;c<=cols;c++){
      const xa=-largo/2+sep*c, ca=(c===0)? -largo/2 : xa-vw/2, cb=(c===cols)? largo/2 : xa+vw/2;
      const a0=(c===0)? -largo/2 : (-largo/2+sep*(c-1)+vw/2), b0=ca;
      caja((a0+b0)/2, yb, b0-a0, vh); }
    for(let c=0;c<cols;c++){ const xc=-largo/2+sep*(c+0.5);
      for(let k=0;k<4;k++){ const bx=xc-vw/2+vw*(k+0.5)/4;
        alcAdd('rejilla',new THREE.BoxGeometry(0.055,vh,0.055),cx+bx*cs,cy-alto/2+yb+vh/2,cz-bx*sn,ry); } } } }

/* Un muro con un HUECO de puerta: en vez de una caja, dos jambas y un dintel. Sin esto los
   edificios que se pueden recorrer por dentro no tienen por dónde entrar. */
function alcParedHueca(cx,cy,cz, largo,alto,esp, ry, m, puertas){
  const ps=(puertas||[]).slice().sort((a,b)=>a.o-b.o);
  let u=-largo/2;
  const seg=(a,b)=>{ const L=b-a; if(L<0.05)return;
    const off=(a+b)/2, sn=Math.sin(ry), cs=Math.cos(ry);
    alcCaja(cx+off*cs, cy, cz-off*sn, L, alto, esp, m, ry); };
  for(const q of ps){ const a=q.o-q.w/2, b=q.o+q.w/2;
    seg(u,Math.max(u,a)); u=Math.max(u,b);
    // dintel sobre la puerta
    if(q.h<alto-0.1){ const off=q.o, sn=Math.sin(ry), cs=Math.cos(ry);
      alcCaja(cx+off*cs, cy+alto/2-(alto-q.h)/2, cz-off*sn, q.w, alto-q.h, esp, m, ry); } }
  seg(u,largo/2); }

/* edificio: muros + reja de ventanas + techo. Es el 80% de la isla.
   Con `hueco:true` deja de ser un bloque macizo y pasa a ser una CÁSCARA de cuatro paredes con
   piso: se puede entrar y recorrerlo por dentro, que es lo que hace falta en el penal. */
function alcEdificio(e){
  const p=e.p||[0,0,0], s=e.s||[10,6,10], ry=e.ry||0;
  const w=s[0], h=s[1], d=s[2], x=p[0], y=p[1], z=p[2];
  const m=e.m||'hormigon', mt=e.mTecho||'techoAlquitran';
  /* ENTRABLE POR DEFECTO. Si adentro cabe una persona, adentro se entra: nada de manzanas de cajas
     macizas con ventanas pintadas. Sólo quedan sólidos los volúmenes chicos (garitas, casillas,
     pilastras) y lo que se marque a mano con hueco:false. */
  const hueco = (e.hueco!=null) ? !!e.hueco : (w>=7 && d>=5 && h>=3.4);
  const V=e.ventanas, caras=(V&&V.caras)||'todas';
  if(hueco){
    const t=e.esp||0.45, cs=Math.cos(ry), sn=Math.sin(ry);
    let pu=(e.puertas&&e.puertas.length)?e.puertas:null;
    if(!pu){ pu=[{cara:'z+',o:0,w:2.3,h:2.8},{cara:'z-',o:0,w:2.3,h:2.8}];   // siempre hay por dónde entrar
      if(w>45) pu.push({cara:'z+',o:-w*0.32,w:2.3,h:2.8},{cara:'z-',o:w*0.32,w:2.3,h:2.8}); }
    const pared=(lx,lz,largo,ang,cara,conV)=>{
      const gx=x+lx*cs+lz*sn, gz=z-lx*sn+lz*cs, puertas=pu.filter(q=>q.cara===cara);
      if(conV && V && V.filas>0 && V.cols>0){
        const cols=(cara==='z+'||cara==='z-')? V.cols : Math.max(1,Math.round((V.cols||6)*d/Math.max(1,w)));
        alcParedVentanas(gx,y,gz,largo,h,t,ry+ang,m,{filas:V.filas,cols:cols,w:V.w,h:V.h,y0:V.y0},puertas);
      } else alcParedHueca(gx,y,gz,largo,h,t,ry+ang,m,puertas); };
    pared(0,-d/2+t/2, w, 0, 'z-', caras!=='cortas');
    pared(0, d/2-t/2, w, 0, 'z+', caras!=='cortas');
    pared(-w/2+t/2,0, d-2*t, Math.PI/2, 'x-', caras!=='largas');
    pared( w/2-t/2,0, d-2*t, Math.PI/2, 'x+', caras!=='largas');
    // el piso va POR DEBAJO del umbral, no por encima: si sobresale, la puerta queda con un escalón
    // de 40 cm y como el movimiento horizontal no sube escalones, el edificio no se puede entrar
    alcCaja(x,y-h/2-0.20,z,w,0.5,d,e.mPiso||'hormigon',ry);
    alcCimiento(x,z,w,d,ry,y-h/2,e.mCim||'hormigonSucio');
  }
  else alcCaja(x,y,z,w,h,d,m,ry,e.sinCol);
  // ventanas PEGADAS: sólo para los volúmenes macizos (en los huecos ya son agujeros de verdad)
  if(!hueco && V && V.filas>0 && V.cols>0){
    const vw=V.w||1.1, vh=V.h||1.8, y0=(V.y0==null?1.2:V.y0);
    const pisoH=(h-y0-0.6)/Math.max(1,V.filas);
    const cs=Math.cos(ry), sn=Math.sin(ry);
    const pon=(lx,ly,lz,ang)=>{ const gx=x+lx*cs+lz*sn, gz=z-lx*sn+lz*cs;
      alcAdd('ventana',new THREE.BoxGeometry(vw,vh,0.12),gx,y-h/2+ly,gz,ry+ang); };
    for(let f=0; f<V.filas; f++){ const ly=y0+pisoH*(f+0.5);
      if(caras!=='cortas'){ for(let c=0;c<V.cols;c++){ const lx=(c+0.5)/V.cols*w-w/2;
        pon(lx,ly, d/2+0.02, 0); pon(lx,ly, -d/2-0.02, 0); } }
      if(caras!=='largas'){ const n=Math.max(1,Math.round(V.cols*d/Math.max(1,w)));
        for(let c=0;c<n;c++){ const lz=(c+0.5)/n*d-d/2;
          pon(w/2+0.02,ly,lz,Math.PI/2); pon(-w/2-0.02,ly,lz,Math.PI/2); } } } }
  // techo
  const tp=e.techo||'plano';
  if(tp==='dos-aguas'||tp==='chapa') alcPrisma(x,y+h/2+Math.min(4.5,w*0.11),z,w+0.7,Math.min(9,w*0.22),d+0.7,tp==='chapa'?'techoChapa':mt,ry,true);
  else { alcCaja(x,y+h/2+0.2,z,w+0.6,0.4,d+0.6,mt,ry,true);      // losa
         alcCaja(x,y+h/2+0.62,z,w+0.6,0.45,0.35,mt,ry,true); } }  // pretil (sólo un borde: el que se ve)

/* CIMIENTO. La isla es un cerro aterrazado: cualquier cosa apoyada en una cota fija tiene una
   pata en el aire apenas el terreno baja. En vez de confiar en que el plano venga perfecto, se
   mide el terreno bajo las cuatro esquinas y, si hace falta, se rellena hasta el punto más bajo. */
function alcCimiento(x,z,w,d,ry,yBase,m){
  const cs=Math.cos(ry), sn=Math.sin(ry); let lo=1e9;
  for(const [lx,lz] of [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2],[0,0]]){
    const gx=x+lx*cs+lz*sn, gz=z-lx*sn+lz*cs; const h=alcH(gx,gz); if(h<lo)lo=h; }
  const caida=yBase-lo;
  if(caida>0.45) alcCaja(x, lo-0.6+ (caida+0.6)/2, z, w-0.3, caida+0.6, d-0.3, m, ry); }

/* muro que sigue una polilínea */
function alcMuro(e){ const pts=e.pts||[], h=e.h||3, es=e.e||0.45, m=e.m||'hormigon', y=e.y||0;
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
    const dx=b[0]-a[0], dz=b[1]-a[1], L=Math.hypot(dx,dz); if(L<0.05)continue;
    const ang=Math.atan2(dx,dz);   // eje del segmento sobre +Z local
    alcCaja((a[0]+b[0])/2, y+h/2, (a[1]+b[1])/2, es, h, L+es, m, ang, e.sinCol); } }
/* alambrado: postes + tela + concertina arriba */
function alcValla(e){ const pts=e.pts||[], h=e.h||2.6, m=e.m||'metal', y=e.y||0;
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
    const dx=b[0]-a[0], dz=b[1]-a[1], L=Math.hypot(dx,dz); if(L<0.05)continue;
    const ang=Math.atan2(dx,dz);
    alcAdd('rejilla',new THREE.BoxGeometry(0.05,h,L),(a[0]+b[0])/2,y+h/2,(a[1]+b[1])/2,ang);
    alcAdd('metal',new THREE.BoxGeometry(0.09,0.18,L),(a[0]+b[0])/2,y+h+0.12,(a[1]+b[1])/2,ang);
    const n=Math.max(1,Math.round(L/3));
    for(let k=0;k<=n;k++){ const t=k/n; alcAdd(m,new THREE.BoxGeometry(0.12,h+0.3,0.12),a[0]+dx*t,y+(h+0.3)/2,a[1]+dz*t,0); }
    alcCol((a[0]+b[0])/2, y+h/2, (a[1]+b[1])/2, 0.3, h, L, ang); } }
/* camino: cinta que se apoya en el terreno (sin colisión: es piso) */
function alcCamino(e){ const pts=e.pts||[], w=e.w||4, m=e.m||'asfalto';
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
    const dx=b[0]-a[0], dz=b[1]-a[1], L=Math.hypot(dx,dz); if(L<0.05)continue;
    const n=Math.max(1,Math.ceil(L/6)), ang=Math.atan2(dx,dz);
    for(let k=0;k<n;k++){ const t0=k/n, t1=(k+1)/n, xm=a[0]+dx*(t0+t1)/2, zm=a[1]+dz*(t0+t1)/2;
      alcAdd(m,new THREE.BoxGeometry(w,0.22,L/n+0.3),xm,alcH(xm,zm)+0.09,zm,ang); } } }
function alcEscalera(e){ const p=e.p||[0,0,0], n=Math.max(1,e.pasos||8), w=e.w||3, alto=e.alto||2, largo=e.largo||3, m=e.m||'hormigon', ry=e.ry||0;
  const ph=alto/n, pl=largo/n, cs=Math.cos(ry), sn=Math.sin(ry);
  for(let i=0;i<n;i++){ const lz=-largo/2+pl*(i+0.5), ly=ph*(i+0.5);
    alcCaja(p[0]+lz*sn, p[1]+ly-ph/2, p[2]+lz*cs, w, ph*(i+1)+0.02, pl, m, ry); } }
function alcPoste(e){ const p=e.p||[0,0,0], h=e.h||5.5;
  alcCil(p[0],p[1]+h/2,p[2],0.09,0.12,h,7,'metal',0,true);
  alcAdd('metal',new THREE.BoxGeometry(0.9,0.1,0.22),p[0],p[1]+h,p[2],0);
  alcAdd('vidrio',new THREE.BoxGeometry(0.42,0.16,0.2),p[0]+0.35,p[1]+h-0.08,p[2],0);
  alcCol(p[0],p[1]+h/2,p[2],0.4,h,0.4,0); }
/* ÁRBOL. Dos esferas sobre un palo no es un árbol: se ve el palo. Este lleva tronco CÓNICO,
   cuatro o cinco ramas que salen a distinta altura y en distinta dirección, y la copa hecha de
   racimos superpuestos de tamaños distintos, cada uno con su verde. Los eucaliptos de Alcatraz son
   altos y desgarbados; los cipreses, anchos y oscuros. El tipo se elige por la altura pedida.
   La semilla sale de la POSICIÓN, así que el mismo árbol siempre se dibuja igual (nada de random:
   dos llamadas seguidas tienen que dar lo mismo). */
const VERDES=[0x5c6b39,0x66753f,0x718049,0x4f5d33,0x7a8a52,0x5a6a3c];
function alcArbol(e){
  const p=e.p||[0,0,0], h=e.h||8, x=p[0], y=p[1], z=p[2];
  let sd=Math.abs(Math.sin(x*12.9898+z*78.233)*43758.5453); const rnd=()=>{ sd=(sd*1.618)%1; return sd; };
  const ancho=(h<7)?1.35:0.85;                       // bajito = ciprés ancho; alto = eucalipto flaco
  const rt=h*0.036;                                   // radio del tronco
  alcAdd('maderaVieja',new THREE.CylinderGeometry(rt*0.55,rt*1.35,h*0.62,6),x,y+h*0.31,z,0);
  alcCol(x,y+h*0.31,z,rt*2.4,h*0.62,rt*2.4,0);
  const nr=3+((sd*7)|0)%3;
  for(let i=0;i<nr;i++){                              // ramas
    const a=rnd()*6.283, lr=h*(0.13+rnd()*0.10), yy=y+h*(0.52+rnd()*0.24);
    const g=new THREE.CylinderGeometry(rt*0.20,rt*0.55,lr,5);
    g.translate(0,lr*0.5,0); g.rotateZ(0.75+rnd()*0.45); g.rotateY(a);
    alcAdd('maderaVieja',g,x,yy,z,0); }
  const nc=4+((sd*11)|0)%3;
  for(let i=0;i<nc;i++){                              // copa: racimos
    const a=rnd()*6.283, r=h*(0.06+rnd()*0.19)*ancho;
    const rr=h*(0.13+rnd()*0.13)*ancho;
    const yy=y+h*(0.62+rnd()*0.34);
    alcAddC('follaje',new THREE.SphereGeometry(rr,6,5),x+Math.cos(a)*r,yy,z+Math.sin(a)*r,0,
            VERDES[((sd*97)|0+i)%VERDES.length]); }
  alcAddC('follaje',new THREE.SphereGeometry(h*0.19*ancho,6,5),x,y+h*0.84,z,0,VERDES[((sd*31)|0)%VERDES.length]); }
/* ruina: el mismo bloque pero mordido arriba, sin techo */
function alcEscombro(e){ const p=e.p||[0,0,0], s=e.s||[4,3,4], ry=e.ry||0, m=e.m||'hormigonSucio';
  const n=Math.max(2,Math.round(s[0]/1.6));
  for(let i=0;i<n;i++){ const w=s[0]/n, lx=-s[0]/2+w*(i+0.5);
    const hh=s[1]*(0.55+0.45*Math.abs(Math.sin(i*2.399+p[0]*0.31)));
    const cs=Math.cos(ry), sn=Math.sin(ry);
    alcCaja(p[0]+lx*cs, p[1]-s[1]/2+hh/2, p[2]-lx*sn, w+0.02, hh, s[2], m, ry); } }
function alcCartel(e){ const p=e.p||[0,0,0], w=e.w||3, h=e.h||1.2;
  const S=256, c=document.createElement('canvas'); c.width=S; c.height=Math.round(S*h/Math.max(0.2,w));
  const g=c.getContext('2d'); g.fillStyle='#20242a'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle=e.col||'#e8edf2'; g.font='bold '+Math.round(c.height*0.42)+'px Segoe UI,system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText((e.txt||'').slice(0,26),S/2,c.height/2);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
  const me=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,toneMapped:false}));
  me.position.set(p[0],p[1],p[2]+ALC_GZ); me.rotation.y=e.ry||0; alcGroup.add(me); }

/* ===================== BLOQUE DE CELDAS =====================
   El corazón de Alcatraz. Medidas reales: la celda es de 5 × 9 pies y 7 de alto — 1,52 × 2,74 ×
   2,13 m — y los bloques B y C tienen TRES pisos de celdas espalda contra espalda, con la pasarela
   de hierro corriendo por delante de los pisos altos y el pasillo (Broadway) entre bloque y bloque.
   Se construye entero: el muro medianero, cada celda con sus tabiques, su reja con los barrotes, su
   camastro y su lavatorio, la pasarela con baranda y las escaleras en la punta.
   Una de cada cinco celdas queda ABIERTA (sin barrotes y sin colisión) para poder entrar. */
function alcBloque(e){
  const p=e.p||[0,0,0], ry=e.ry||0, m=e.m||'hormigon';
  const nc=Math.max(2,e.celdas||14), np=Math.max(1,e.pisos||3);
  const CW=e.ancho||1.52, CD=e.fondo||2.74, CH=e.alto||2.30;     // celda: ancho, fondo, alto libre
  const ESP=0.14, MED=0.45;                                       // tabique y muro medianero
  const largo=nc*CW, x=p[0], y=p[1], z=p[2];
  const cs=Math.cos(ry), sn=Math.sin(ry);
  const pon=(lx,ly,lz, w,h,d, mat, sinCol)=>alcCaja(x+lx*cs+lz*sn, y+ly, z-lx*sn+lz*cs, w,h,d, mat, ry, sinCol);
  const alto=np*(CH+0.30);
  pon(0, alto/2, 0, largo, alto, MED, m);                         // medianera
  for(let t=0;t<np;t++){ const y0=t*(CH+0.30);
    pon(0, y0+0.15, 0, largo, 0.30, CD*2+MED, m, true);           // losa del piso
    for(let lado=-1; lado<=1; lado+=2){ const zc=lado*(MED/2+CD/2);
      for(let i=0;i<nc;i++){ const xc=-largo/2+CW*(i+0.5);
        const abierta=((i+t*2+(lado>0?1:0))%5===0);
        pon(xc-CW/2, y0+0.30+CH/2, zc, ESP, CH, CD, m);            // tabiques
        if(i===nc-1) pon(xc+CW/2, y0+0.30+CH/2, zc, ESP, CH, CD, m);
        pon(xc, y0+0.42, zc-lado*0.05, CW-ESP, 0.24, 0.7, 'metal', true);        // camastro
        pon(xc+CW*0.30, y0+1.10, zc-lado*(CD/2-0.35), 0.34, 0.26, 0.28, 'blanco', true); // lavatorio
        if(!abierta){ const zf=zc+lado*(CD/2);
          for(let b=0;b<5;b++) pon(xc-CW/2+0.14+b*(CW-0.28)/4, y0+0.30+CH/2, zf, 0.05, CH, 0.05, 'rejilla');
          pon(xc, y0+0.34, zf, CW, 0.08, 0.09, 'rejilla', true);
          pon(xc, y0+0.30+CH-0.04, zf, CW, 0.08, 0.09, 'rejilla', true); } } } }
  // pasarelas de los pisos altos + baranda, y las escaleras en los dos extremos
  for(let t=1;t<np;t++){ const y0=t*(CH+0.30);
    for(let lado=-1; lado<=1; lado+=2){ const zp=lado*(MED/2+CD+0.62);
      pon(0, y0+0.10, zp, largo, 0.20, 1.25, 'rejilla');
      pon(0, y0+0.75, zp+lado*0.60, largo, 0.09, 0.09, 'metal', true);
      for(let i=0;i<=nc;i+=2) pon(-largo/2+i*CW, y0+0.50, zp+lado*0.60, 0.07, 0.85, 0.07, 'metal', true); } }
  for(let t=0;t<np-1;t++){ const y0=t*(CH+0.30);
    for(const sx of [-1,1]) for(let lado=-1; lado<=1; lado+=2){
      const px=sx*(largo/2+0.9), pz=lado*(MED/2+CD+0.62);
      const n=8, ph=(CH+0.30)/n;
      for(let k=0;k<n;k++) pon(px, y0+0.30+ph*(k+0.5)-ph/2, pz-lado*(0.55-k*1.1/n), 1.5, ph*(k+1), 1.1/n, m); } }
  return largo; }

/* ===================== PATIO DE RECREO =====================
   El muro es el personaje: 6 m de hormigón liso cerrando el sur del penal, con la garita arriba y
   las gradas escalonadas de un lado. Adentro no hay nada más que cemento, y eso es exactamente lo
   que hay que reproducir. */
function alcPatio(e){
  const p=e.p||[0,0,0], s=e.s||[60,6,44], ry=e.ry||0, m=e.m||'hormigonSucio';
  const w=s[0], h=s[1], d=s[2], x=p[0], y=p[1], z=p[2], t=e.esp||0.7;
  const cs=Math.cos(ry), sn=Math.sin(ry);
  const pon=(lx,ly,lz, ww,hh,dd, mat, ang, sinCol)=>alcCaja(x+lx*cs+lz*sn, y+ly, z-lx*sn+lz*cs, ww,hh,dd, mat, ry+(ang||0), sinCol);
  pon(0,-0.20,0, w, 0.5, d, 'hormigon', 0);                        // losa del patio (enrasada)
  alcCimiento(x,z,w,d,ry,y,'hormigonSucio');
  const pu=e.puerta||{o:-w*0.30, w:3.2};
  // tres lados cerrados y el cuarto (el que da al penal) con la reja de entrada
  pon(0, h/2,  d/2-t/2, w, h, t, m, 0);
  pon(-w/2+t/2, h/2, 0, t, h, d-2*t, m, Math.PI/2);
  pon( w/2-t/2, h/2, 0, t, h, d-2*t, m, Math.PI/2);
  { const a=pu.o-pu.w/2, b=pu.o+pu.w/2;
    if(a>-w/2) pon((-w/2+a)/2, h/2, -d/2+t/2, a+w/2, h, t, m, 0);
    if(b< w/2) pon((b+w/2)/2,  h/2, -d/2+t/2, w/2-b, h, t, m, 0);
    pon((a+b)/2, h-0.9, -d/2+t/2, pu.w, 1.8, t, m, 0);             // dintel de la reja
    for(let k=0;k<7;k++) pon(a+0.2+k*(pu.w-0.4)/6, (h-1.8)/2, -d/2+t/2, 0.06, h-1.8, 0.06, 'rejilla', 0); }
  // gradas de hormigón del lado oeste
  const ng=e.gradas||5, gw=Math.min(d*0.8, 16);
  for(let k=0;k<ng;k++) pon(-w/2+t+0.9+k*0.95, 0.28*(k+1)/2, 0, 0.95, 0.28*(k+1), gw, 'hormigon', 0);
  // pasarela del guardia arriba del muro + la garita en una esquina
  pon(0, h+0.12, d/2-t/2, w, 0.24, 1.4, 'rejilla', 0);
  pon(w/2-1.9, h+1.5, d/2-1.6, 2.6, 2.6, 2.6, 'metal', 0);
  pon(w/2-1.9, h+3.1, d/2-1.6, 3.2, 0.25, 3.2, 'techoChapa', 0, true); }

/* TORRE DE VIGILANCIA, y se SUBE. Una torre a la que no se puede subir es un poste con sombrero;
   en Alcatraz las torres son el mejor mirador de la isla, así que llevan su escalera de caracol
   alrededor del fuste y la garita vidriada arriba, con el piso abierto por donde se sale. */
function alcTorre(e){
  const p=e.p||[0,0,0], h=e.h||12, ry=e.ry||0, x=p[0], y=p[1], z=p[2];
  const R=1.15, CAB=3.4;                      // radio del fuste, lado de la garita
  for(const [ax,az] of [[-1,-1],[1,-1],[-1,1],[1,1]])
    alcCaja(x+ax*R, y+h/2, z+az*R, 0.26, h, 0.26, 'metal', ry);
  alcCaja(x, y+h*0.5, z, 2.1, 0.14, 2.1, 'rejilla', ry, true);
  // escalera de caracol: 4 tramos por vuelta, pegados al fuste
  // el peldano sube 0,30 m, NO 0,42: el limite de escalon del juego son 38 cm, y con 42 la escalera
  // quedaba linda y no se podia subir
  const PEL=0.30, n=Math.max(10, Math.round(h/PEL));
  for(let i=0;i<n;i++){ const a=ry+i*0.52, rr=R+0.78;
    alcCaja(x+Math.cos(a)*rr, y+PEL*(i+0.5), z+Math.sin(a)*rr, 1.25, 0.14, 0.85, 'rejilla', a); }
  // garita: piso, cuatro parantes, vidrio y techo
  alcCaja(x, y+h+0.12, z, CAB, 0.24, CAB, 'rejilla', ry);
  for(const [ax,az] of [[-1,-1],[1,-1],[-1,1],[1,1]])
    alcCaja(x+ax*(CAB/2-0.14), y+h+1.3, z+az*(CAB/2-0.14), 0.2, 2.2, 0.2, 'metal', ry);
  for(const [dx,dz,ang] of [[0,-1,0],[0,1,0],[-1,0,Math.PI/2],[1,0,Math.PI/2]])
    alcCaja(x+dx*(CAB/2-0.06), y+h+1.5, z+dz*(CAB/2-0.06), CAB-0.3, 1.5, 0.06, 'vidrio', ry+ang, true);
  alcCaja(x, y+h+2.6, z, CAB+0.7, 0.22, CAB+0.7, 'techoChapa', ry, true); }

/* la lancha del muelle: sin ella el muelle es un dedo de hormigón sin sentido */
function alcBarco(e){
  const p=e.p||[0,0,0], ry=e.ry||0, x=p[0], y=p[1], z=p[2], L=e.h||17;
  alcCaja(x, y+0.9, z, 5.0, 1.9, L, 'blancoSucio', ry);
  alcCaja(x, y+0.05, z, 4.4, 0.7, L-1.6, 'negro', ry, true);
  alcCaja(x, y+2.6, z-L*0.10, 3.6, 1.7, L*0.34, 'blanco', ry);
  alcCaja(x, y+3.55, z-L*0.10, 4.0, 0.2, L*0.36, 'techoChapa', ry, true);
  for(const c of [-1,1]) alcCaja(x+c*1.55, y+2.6, z-L*0.10-L*0.16, 0.6, 0.9, 0.06, 'vidrio', ry, true);
  alcCil(x, y+4.6, z-L*0.10, 0.07,0.07, 1.9, 5, 'metal', 0, true); }

/* LUZ INTERIOR. Adentro del penal el sol no entra más que por las ventanas altas y el techo queda
   negro. Un puñado de lámparas colgadas de las cerchas lo arregla: se cuelgan del grupo de la isla,
   así que se apagan solas al salir del mundo. Van contadas — cada luz puntual cuesta en el shader —
   y por eso hay un tope duro. */
let _alcNLuz=0;
function alcLuz(e){ if(_alcNLuz>=8)return; _alcNLuz++;
  const p=e.p||[0,0,0];
  const L=new THREE.PointLight(e.c||0xffe6bd, e.i||10, e.r||26, 2.0);
  L.position.set(p[0],p[1],p[2]+ALC_GZ); alcGroup.add(L);
  alcAdd('metal',new THREE.CylinderGeometry(0.30,0.42,0.20,8),p[0],p[1]+0.22,p[2],0);   // la pantalla
  alcAdd('metal',new THREE.BoxGeometry(0.05,0.9,0.05),p[0],p[1]+0.75,p[2],0); }

function alcElem(e){ if(!e||!e.t)return;
  switch(e.t){
    case 'edificio': alcEdificio(e); break;
    case 'caja':     { const p=e.p||[0,0,0], s=e.s||[2,2,2]; alcCaja(p[0],p[1],p[2],s[0],s[1],s[2],e.m||'hormigon',e.ry||0,e.sinCol); break; }
    case 'plano':    { const p=e.p||[0,0,0], s=e.s||[10,0.3,10]; alcCaja(p[0],p[1],p[2],s[0],Math.max(0.15,s[1]),s[2],e.m||'hormigon',e.ry||0,e.sinCol); break; }
    case 'cil':      { const p=e.p||[0,0,0]; alcCil(p[0],p[1],p[2],e.r1||1,(e.r2==null?e.r1:e.r2)||1,e.h||4,e.seg||10,e.m||'hormigon',e.ry||0,e.sinCol); break; }
    case 'prisma':   { const p=e.p||[0,0,0], s=e.s||[6,3,6]; alcPrisma(p[0],p[1],p[2],s[0],s[1],s[2],e.m||'techoChapa',e.ry||0,e.sinCol); break; }
    case 'muro':     alcMuro(e); break;
    case 'valla':    alcValla(e); break;
    case 'camino':   alcCamino(e); break;
    case 'escalera': alcEscalera(e); break;
    case 'poste':    alcPoste(e); break;
    case 'arbol':    alcArbol(e); break;
    case 'escombro': alcEscombro(e); break;
    case 'cartel':   alcCartel(e); break;
    case 'bloque':   alcBloque(e); break;
    case 'patio':    alcPatio(e); break;
    case 'torre':    alcTorre(e); break;
    case 'barco':    alcBarco(e); break;
    case 'luz':      alcLuz(e); break;
  } }

/* fundir: cada material sale en UNA malla */
function alcFundir(){ let n=0;
  for(const [name,geos] of _alcB){ if(!geos.length)continue;
    let g=null;
    try{ g=mergeGeometries(geos,false); }catch(err){ g=null; }
    if(g){ const me=new THREE.Mesh(g,alcMat(name)); me.castShadow=true; me.receiveShadow=true;
      me.frustumCulled=false; alcGroup.add(me); n++; }
    else for(const gg of geos){ const me=new THREE.Mesh(gg,alcMat(name)); me.castShadow=true; me.receiveShadow=true; alcGroup.add(me); n++; }
    for(const gg of geos) if(gg!==g) gg.dispose&&gg.dispose(); }
  _alcB.clear(); return n; }

/* ---------------- el suelo y el mar ---------------- */
function alcTerreno(){
  const W=ALC_X1-ALC_X0, D=ALC_Z1-ALC_Z0;
  const g=new THREE.PlaneGeometry(W,D,ALC_NX-1,ALC_NZ-1); g.rotateX(-Math.PI/2);
  const pos=g.attributes.position, col=new Float32Array(pos.count*3);
  const cRoca=new THREE.Color(0x6f6a62), cTierra=new THREE.Color(0x8a7757),
        cPasto=new THREE.Color(0x6d7a41), cPasto2=new THREE.Color(0x7d8250),
        cArena=new THREE.Color(0x9d9078);
  for(let j=0;j<ALC_NZ;j++) for(let i=0;i<ALC_NX;i++){
    const k=j*ALC_NX+i, h=alcHM[k]; pos.setY(k,h);
    const x=ALC_X0+i*ALC_CEL, z=ALC_Z0+j*ALC_CEL, pd=alcPend(x,z);
    /* La isla se lee por su piel: roca desnuda en los acantilados (que es casi toda la costa),
       pasto seco en las terrazas de arriba y tierra pisada en los caminos y el nivel del muelle. */
    let c;
    if(h<1.2) c=cArena;                       // la franja mojada al pie del rompeolas
    else if(pd>0.55) c=cRoca;                 // acantilado
    else if(h>26 && pd<0.22) c=cPasto;        // las terrazas altas, con jardín
    else if(h>12 && pd<0.30) c=cPasto2;
    else c=cTierra;
    // grano: con una trama regular se veía el damero de la grilla; se mezcla con dos senos
    // grano de decenas de metros, no por celda: a 2 m de celda cualquier frecuencia alta se
    // convierte en un damero que se ve desde el aire
    const v=0.90+0.16*(0.5+0.5*Math.sin(x*0.055+z*0.031)*Math.cos(x*0.021-z*0.048));
    col[k*3]=c.r*v; col[k*3+1]=c.g*v; col[k*3+2]=c.b*v; }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  alcSuelo=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.98,metalness:0}));
  alcSuelo.position.set((ALC_X0+ALC_X1)/2,0,(ALC_Z0+ALC_Z1)/2+ALC_GZ);
  alcSuelo.receiveShadow=true; alcSuelo.castShadow=false; alcSuelo.frustumCulled=false;
  alcGroup.add(alcSuelo);
  /* EL MAR. Un plano liso con un sol puntual encima da una mancha blanca enorme y nada más: parece
     un piso encerado, no agua. Lo que rompe la mancha es el RELIEVE, así que el plano lleva un mapa
     de normales de olas (dibujado en canvas, cero descargas) repetido 260 veces y desplazándose muy
     de a poco. Dos capas a distinta escala y a distinta velocidad: una hace la ondulación larga y la
     otra el picadito, y entre las dos el reflejo del sol se parte en centenares de destellos. */
  const ag=new THREE.PlaneGeometry(5000,5000,1,1); ag.rotateX(-Math.PI/2);
  const nm=alcOlasTex();
  const mAgua=new THREE.MeshStandardMaterial({color:0x2f5670,roughness:0.22,metalness:0.28,
    normalMap:nm, normalScale:new THREE.Vector2(0.55,0.55)});
  mAgua.normalMap.repeat.set(260,260); mAgua.envMapIntensity=0.9;
  alcAgua=new THREE.Mesh(ag,mAgua);
  alcAgua.position.set(0,0,ALC_GZ); alcAgua.receiveShadow=false; alcAgua.frustumCulled=false; alcGroup.add(alcAgua); }
let _txOlas=null;
function alcOlasTex(){ if(_txOlas)return _txOlas;
  const S=128, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  const im=g.createImageData(S,S), d=im.data;
  const alt=(x,y)=>{ let h=0;
    h+=Math.sin(x*0.196+Math.cos(y*0.098)*1.7)*0.5;
    h+=Math.sin((x*0.7+y*0.44)*0.196)*0.28;
    h+=Math.sin((x*0.31-y*0.83)*0.393)*0.16; return h; };
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const dx=(alt(x+1,y)-alt(x-1,y))*0.5, dy=(alt(x,y+1)-alt(x,y-1))*0.5;
    let nx=-dx, ny=-dy, nz=1, L=Math.hypot(nx,ny,nz); nx/=L; ny/=L; nz/=L;
    const o=(y*S+x)*4; d[o]=(nx*0.5+0.5)*255; d[o+1]=(ny*0.5+0.5)*255; d[o+2]=(nz*0.5+0.5)*255; d[o+3]=255; }
  g.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return (_txOlas=t); }
/* el mar se mueve: sólo se desplaza el mapa de normales, no hay vértices que animar */
let _alcT=0;
function alcTick(dt){ _alcT+=dt;
  if(alcAgua&&alcAgua.material.normalMap){ const o=alcAgua.material.normalMap.offset;
    o.set((_alcT*0.010)%1, (_alcT*0.0068)%1); } }

function buildAlc(){ if(alcBuilt)return; alcBuilt=true;
  alcMats();
  alcRaster(ALC_DATOS.terreno);
  alcTerreno();
  const els=ALC_DATOS.elementos||[];
  for(let i=0;i<els.length;i++){ try{ alcElem(els[i]); }catch(err){} }
  alcIndexar();
  const n=alcFundir();
  try{ console.log('Alcatraz:',els.length,'elementos →',n,'mallas,',ALC_COL.length,'colisiones'); }catch(e){} }

function enterAlc(){ if(world==='alcatraz')return; world='alcatraz'; grassMode=false; dreamMode=false; islaMode=true; discover('alcatraz');
  buildAlc(); tiroWire(); alcSol(true);
  // la isla mide 500 m de punta a punta: con el plano lejano de la galería (320 m) se cortaba al medio
  if(camera.far<900){ camera.far=900; camera.updateProjectionMatrix(); }
  alcGroup.visible=true; tiroGroup.visible=false;

const TIRO_MAG=30, TIRO_RPM=640, TIRO_RELOAD=1.55;
/* ===================== RECARGA: una secuencia, no un contador =====================
   Antes la recarga era `tiroRel=1.85` y una inclinación fija del arma: no pasaba nada, sólo
   había que esperar. Ahora es una secuencia con sus tiempos, y el cargador es un objeto que
   se cae de verdad:
     0.00  el arma gira hacia adentro y baja (posición de recarga)
     0.16  la izquierda suelta el guardamanos, aprieta el retén → el cargador CAE al piso
     0.30  la mano baja al cinturón y saca uno nuevo
     0.60  lo sube
     0.88  lo encastra: acá vuelve la munición (no al final) y el arma pega un golpecito
     1.06  tira de la manija de carga y la suelta
     1.20  vuelve a la posición de tiro

function kfRC(t,k){   // interpolación suave entre claves [tiempo, valor]
  if(t<=k[0][0]) return k[0][1];
  for(let i=1;i<k.length;i++){ if(t<=k[i][0]){ const a=k[i-1], b=k[i];
    const u=(t-a[0])/Math.max(1e-4,b[0]-a[0]); return a[1]+(b[1]-a[1])*(u*u*(3-2*u)); } }
  return k[k.length-1][1];
}
function rcMagMalla(){   // un cargador suelto (para el que cae y para el que trae la mano)
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.048,0.185,0.072).scale(GUN_ESC,GUN_ESC,GUN_ESC),
    tiroMat(0x101315,0.86,0.04));
