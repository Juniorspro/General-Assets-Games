<!DOCTYPE html>

<title>MAICOL</title>
<!--
  ===================== MAICOL =====================
  Siete niveles para rescatar a Maicolito.

  POR QUE LIENZO 2D Y NO WEBGL: es un juego de plataformas por casillas. Todo lo que se dibuja son
  rectangulos y recortes de sprites, o sea justo lo que un contexto 2D hace por hardware sin que uno
  tenga que escribir una sola linea de shader. WebGL aca no compra nada y cuesta mil lineas.

  LOS SPRITES SON DE VERDAD Y VIVEN ADENTRO DEL ARCHIVO. Se generaron con Higgsfield sobre fondo
  magenta, se recortaron por columnas, se les saco el fondo por distancia en RGB (no por igualdad:
  los bordes vienen con halo) y se empaquetaron en tiras con UNA sola escala para todos los cuadros
  —escalar cada pose a un alto comun hacia que el personaje cambiara de tamano segun la pose.

  EL CUADRO ES 16:9 SIEMPRE, y en un telefono vertical se GIRA 90 grados en vez de encogerse a una
  tirita, igual que en Eco. Adentro va todo, asi que hay una sola transformacion.
-->
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#0a0d14; color:#eef4fb;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; user-select:none; }
  canvas{ display:block; width:100%; height:100%; image-rendering:auto; }

  #caja{ position:fixed; left:50%; top:50%; overflow:hidden; background:#0a0d14; z-index:10;
    transform:translate(-50%,-50%); }

  /* ---------- pantallas ---------- */
  .pant{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:clamp(10px,1.7vw,20px); text-align:center; transition:opacity .35s ease; }
  .pant.ir{ opacity:0; pointer-events:none; }
  #idioma{ z-index:50; background:#1a1040; }
  #idioma::before{ content:''; position:absolute; inset:-40px;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 8px, rgba(0,0,0,0) 8px 16px),
               radial-gradient(ellipse at 50% 40%, #3a2280 0%, #1a1040 60%, #0d0824 100%);
    animation:damero 22s linear infinite; }
  /* ---------- EL MENU, DE 16 BITS ---------- */
  #menu{ z-index:40; background:#1a1040; overflow:hidden; image-rendering:pixelated; }
  #menu::before{ content:''; position:absolute; inset:-40px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.030) 0 8px, rgba(0,0,0,0) 8px 16px),
      repeating-linear-gradient(-45deg, rgba(120,90,255,.055) 0 8px, rgba(0,0,0,0) 8px 16px),
      radial-gradient(ellipse at 50% 34%, #3a2280 0%, #1a1040 58%, #0d0824 100%);
    animation:damero 22s linear infinite; }
  @keyframes damero{ to{ transform:translate(32px,32px); } }
  #menu::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.75) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 34% 76%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 62%, rgba(255,255,255,.60) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 30%, rgba(255,255,255,.35) 50%, transparent 51%);
    animation:titila 3.2s steps(2) infinite; }
  @keyframes titila{ 50%{ opacity:.35; } }
  #fin{ z-index:45; background:rgba(13,8,36,.94); display:none; }
  #fin.ver{ display:flex; }

  #tit{ position:relative; z-index:2;
    font-size:clamp(36px,8.6vw,88px); font-weight:900; letter-spacing:.16em; line-height:1;
    color:#ffd23f; -webkit-text-stroke:4px #1a1040; paint-order:stroke fill;
    text-shadow:4px 4px 0 #c4531f, 8px 8px 0 #7a2a12; }
  #sub{ position:relative; z-index:2;
    font-size:max(10px,calc(12px * var(--esc,1))); font-weight:800; letter-spacing:.28em;
    color:#a9c0ff; text-transform:uppercase; padding:0 20px; text-shadow:2px 2px 0 #1a1040; }
  .bt{ position:relative; z-index:2;
    padding:clamp(9px,1.3vw,15px) clamp(26px,4.4vw,56px); border-radius:0; cursor:pointer;
    font-size:max(12px,calc(14px * var(--esc,1))); font-weight:900; letter-spacing:.20em;
    color:#2a1206; background:#ffd23f; border:0;
    box-shadow: 0 0 0 4px #1a1040, 0 0 0 8px #ffeaa0, 0 8px 0 8px #1a1040;
    transition:transform .08s steps(1), box-shadow .08s steps(1); }
  .bt:active{ transform:translateY(6px); box-shadow:0 0 0 4px #1a1040, 0 0 0 8px #ffeaa0, 0 2px 0 8px #1a1040; }
  .bt2{ background:#3a2a86; color:#e6ecff;
    box-shadow: 0 0 0 4px #1a1040, 0 0 0 8px #7f6ae0, 0 8px 0 8px #1a1040; }
  .bt2:active{ transform:translateY(6px); box-shadow:0 0 0 4px #1a1040, 0 0 0 8px #7f6ae0, 0 2px 0 8px #1a1040; }
  #idBotones{ display:flex; gap:clamp(8px,1.4vw,18px); flex-wrap:wrap; justify-content:center; }
  #niveles{ position:relative; z-index:2; display:flex; gap:clamp(8px,1.3vw,16px); flex-wrap:wrap;
    justify-content:center; max-width:90%; padding:4px; }
  .niv{ width:max(36px,calc(44px * var(--esc,1))); height:max(36px,calc(44px * var(--esc,1)));
    border-radius:0; border:0; background:#241a5e; color:#a9c0ff;
    box-shadow:0 0 0 3px #1a1040, 0 0 0 6px #4a3aa0;
    font-size:max(13px,calc(17px * var(--esc,1))); font-weight:900; cursor:pointer;
    transition:transform .08s steps(1); }
  .niv:active{ transform:translateY(3px); }
  .niv.hecho{ background:#ffd23f; color:#2a1206; box-shadow:0 0 0 3px #1a1040, 0 0 0 6px #ffeaa0; }
  .niv.trabado{ background:#1d1546; color:#4b4383; cursor:default;
    box-shadow:0 0 0 3px #1a1040, 0 0 0 6px #2b2360; }
  #pie{ position:relative; z-index:2;
    font-size:max(9px,calc(10px * var(--esc,1))); letter-spacing:.20em; color:#6b7bb8;
    animation:parpadeo 1.6s steps(2) infinite; }
  @keyframes parpadeo{ 50%{ opacity:.45; } }
  #cambiaIdioma{ cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  #cuento{ position:relative; z-index:2;
    font-size:max(11px,calc(13px * var(--esc,1))); line-height:1.75; color:#e6ecff;
    max-width:min(560px,86%); background:#241a5e; padding:clamp(10px,1.5vw,18px) clamp(14px,2vw,24px);
    box-shadow:0 0 0 4px #1a1040, 0 0 0 8px #7f6ae0, 8px 8px 0 8px rgba(10,6,32,.55);
    text-align:left; }
  #cuento b{ color:#ffd23f; }
  #finTit{ font-size:clamp(22px,5vw,50px); font-weight:900; letter-spacing:.12em; color:#ffd23f;
    -webkit-text-stroke:3px #1a1040; paint-order:stroke fill;
    text-shadow:3px 3px 0 #c4531f, 6px 6px 0 #7a2a12; }
  #finSub{ font-size:max(11px,calc(13px * var(--esc,1))); color:#e6ecff; letter-spacing:.06em;
    background:#241a5e; padding:10px 18px;
    box-shadow:0 0 0 4px #1a1040, 0 0 0 8px #7f6ae0; }
  #finBotones{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; inset:0; z-index:20; pointer-events:none; display:none; }
  body.jugando #hud{ display:block; }
  #hudIzq{ position:absolute; left:calc(14px * var(--esc,1)); top:calc(12px * var(--esc,1));
    display:flex; flex-direction:column; gap:calc(5px * var(--esc,1)); }
  #vidas{ display:flex; gap:5px; font-size:max(15px,calc(19px * var(--esc,1))); line-height:1;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.8)); }
  #estrellas{ font-size:max(11px,calc(13px * var(--esc,1))); font-weight:900; color:#ffe28a;
    letter-spacing:.10em; text-shadow:0 2px 6px rgba(0,0,0,.9); }
  #nivelRot{ position:absolute; left:50%; top:calc(12px * var(--esc,1)); transform:translateX(-50%);
    font-size:max(10px,calc(12px * var(--esc,1))); font-weight:900; letter-spacing:.20em;
    color:rgba(220,232,246,.72); text-shadow:0 2px 6px rgba(0,0,0,.9); white-space:nowrap; }

  /* ---------- controles del telefono ---------- */
  .tb{ position:absolute; z-index:22; display:none; align-items:center; justify-content:center;
    border-radius:50%; border:2px solid rgba(255,255,255,.20); background:rgba(255,255,255,.09);
    color:#eef4fb; font-size:22px; font-weight:900; cursor:pointer; pointer-events:auto;
    backdrop-filter:blur(2px); }
  .tb:active{ background:rgba(255,255,255,.26); }
  body.movil.jugando .tb{ display:flex; }
  #bIzq{ left:18px; bottom:20px; width:74px; height:74px; }
  #bDer{ left:104px; bottom:20px; width:74px; height:74px; }
  #bSalto{ right:20px; bottom:22px; width:88px; height:88px; font-size:16px; letter-spacing:.06em; }
  #teclas{ position:absolute; left:calc(14px * var(--esc,1)); bottom:calc(14px * var(--esc,1));
    z-index:22; display:none; grid-template-columns:auto auto; gap:4px 9px; pointer-events:none; }
  body.pc.jugando #teclas{ display:grid; }
  #teclas i{ font-style:normal; font-size:max(8.5px,calc(9px * var(--esc,1))); font-weight:900;
    color:#0a0d14; background:rgba(238,244,251,.8); border-radius:4px; padding:2px 6px; text-align:center; }
  #teclas span{ font-size:max(9.5px,calc(10px * var(--esc,1))); font-weight:700; color:rgba(190,208,228,.6); }
  #bSon{ position:absolute; right:12px; top:10px; z-index:24; width:max(26px,calc(30px * var(--esc,1)));
    height:max(26px,calc(30px * var(--esc,1))); border-radius:50%; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05); color:rgba(220,232,244,.75); font-size:13px; cursor:pointer;
    pointer-events:auto; display:none; align-items:center; justify-content:center; padding:0; }
  body.jugando #bSon{ display:flex; }
  #bSon.mudo{ color:rgba(220,232,244,.28); }
  #cargando{ position:absolute; inset:0; z-index:60; display:flex; align-items:center;
    justify-content:center; background:#0a0d14; font-size:12px; letter-spacing:.3em; color:#5d708c; }
</style>

<script>
const NIVELES=[

["..................................................................","..................................................................","..................................................................","..................................................................",".....................................*.-----......................","....................................-----.........................","..................................*...............................",".............b...................---..............................","......................*............------............---..........","......................*...........................................","P............*..~.....sf.......r............f^..^...s.......D.....","########..######..##########..####################################","########..######..##########..####################################","########..######..##########..####################################","########..######..##########..####################################","########..######..##########..####################################"],
["....................................................................","....................................................................","....................................*................b..............","..................................*..*..............................","..................................------............................",".......................................*.*..........................",".......................................-----........................",".....................................s...*..........---.............","..................................-----.---........---..............",".......................b............................................","P................~......f........r.....r...s..fs..............D.....","########...######..########...######################################","########...######..########...######################################","########...######..########...######################################","########...######..########...######################################","########...######..########...######################################"],
["......................................................................","......................................................................","................................................*.....................","................................................b*....................","...............................................---...---*.............","..............b...............................-----....----...........","......................................................................","...............................................*.*....................",".............................................-----....---.............","....................b.................................................","P...............~...s..s.f^...~......s......r..f.*..r....*......D.....","########..######...###########...#######..############################","########..######...###########...#######..############################","########..######...###########...#######..############################","########..######...###########...#######..############################","########..######...###########...#######..############################"],
["........................................................................","........................................................................","...........................b......................b.....................","........................................................................","..........................................-----**...----................","............................................------..***.................","....................................................---.................",".............................................*.....s......*.............","...........................................------..---...---............","..................................................b.....................","P.............r..~...^^..sf.~..r..s.............fs.....r....*.....D.....","########...######..#########..#######..#################################","########...######..#########..#######..#################################","########...######..#########..#######..#################################","########...######..#########..#######..#################################","########...######..#########..#######..#################################"],
["..........................................................................","..........................................................................","...........................................................b..............","..........................................................................","..........................................*...............................","........................................*.................................","...........................*............---...............................","............................................................b.............","..........................---...........---...............................","............*................................*......b.*.....b.............","P....*..........^......s..f*..r..s....s......*..~..f.....~..s..s....D.....","########...#########...###########...###########...######..###############","########...#########...###########...###########...######..###############","########...#########...###########...###########...######..###############","########...#########...###########...###########...######..###############","########...#########...###########...###########...######..###############"],
["............................................................................","............................................................................","...................................................b....b.......*...........","................................................b...........................","..............................................................----..........","..............b...............................................---*..........","..............................................................----..........","...............................................................*.*..........","..............................................................----..........","...........*...*..............................b*........*...................","P.............s..~..*s...s.f..~.....^^....s.......sf.r..s...r..*......M.....","########...######..###########...##########...###########..#################","########...######..###########...##########...###########..#################","########...######..###########...##########...###########..#################","########...######..###########...##########...###########..#################","########...######..###########...##########...###########..#################"]
];
/* ===================== IDIOMAS =====================
   Arranca en INGLES y se elige antes de entrar. Nada de texto suelto en el codigo. */
const IDIOMAS=[['en','English'],['es','Español'],['pt','Português']];
let IDIOMA='en';
try{ const g=localStorage.getItem('maicol_idioma'); if(g&&IDIOMAS.some(i=>i[0]===g)) IDIOMA=g; }catch(e){}
const L={
 sub:{en:'seven levels to get his brother back', es:'siete niveles para recuperar a su hermano', pt:'sete níveis para recuperar o irmão'},
 cuento:{en:'They took <b>Maicolito</b> down into the old factory. Maicol went after him with nothing but a red hoodie and a good pair of legs. Seven levels stand between the two brothers.',

         pt:'Levaram o <b>Maicolito</b> para o fundo da velha fábrica. Maicol foi atrás com o que tinha: um moletom vermelho e boas pernas. Entre os dois irmãos há sete níveis.'},
 jugar:{en:'PLAY', es:'JUGAR', pt:'JOGAR'},

 m3:{en:'THE TREETOPS', es:'LAS COPAS', pt:'AS COPAS'},
 m4:{en:'THE CAVE', es:'LA CUEVA', pt:'A CAVERNA'},
 m5:{en:'THE CRYSTALS', es:'LOS CRISTALES', pt:'OS CRISTAIS'},
 m6:{en:'THE FACTORY', es:'LA FÁBRICA', pt:'A FÁBRICA'},
 m7:{en:'THE RESCUE', es:'EL RESCATE', pt:'O RESGATE'},
 ganaste:{en:'LEVEL CLEARED', es:'NIVEL SUPERADO', pt:'NÍVEL COMPLETO'},
 seguir:{en:'NEXT LEVEL', es:'SIGUIENTE NIVEL', pt:'PRÓXIMO NÍVEL'},
 repetir:{en:'RETRY', es:'REINTENTAR', pt:'TENTAR DE NOVO'},
 alMenu:{en:'MENU', es:'MENÚ', pt:'MENU'},
 perdiste:{en:'MAICOL FELL', es:'MAICOL SE CAYÓ', pt:'MAICOL CAIU'},
 perdisteS:{en:'try again, the level starts over', es:'probá de nuevo, el nivel vuelve a empezar', pt:'tente de novo, o nível recomeça'},
 rescate:{en:'YOU GOT HIM BACK', es:'LO RECUPERASTE', pt:'VOCÊ O RECUPEROU'},
 rescateS:{en:'Maicol and Maicolito walked out together. {e} stars.', es:'Maicol y Maicolito salieron juntos. {e} estrellas.', pt:'Maicol e Maicolito saíram juntos. {e} estrelas.'},
 sigueS:{en:'he was not here either · {e} stars', es:'acá tampoco estaba · {e} estrellas', pt:'aqui também não estava · {e} estrelas'},

 kSaltar:{en:'jump · hold to jump higher', es:'saltar · mantené para saltar más alto', pt:'pular · segure para pular mais alto'},
 kPausa:{en:'back to the menu', es:'volver al menú', pt:'voltar ao menu'},
 bSalto:{en:'JUMP', es:'SALTAR', pt:'PULAR'}
};
/* SE LLAMA TX Y NO t A PROPOSITO. Una funcion global de UNA letra es una bomba: cualquier
   script que comparta la pagina —o un eval con un `var t` adentro— la pisa, y cuando se pisa
   no falla el idioma, falla TODO, porque no queda un solo texto que no pase por aca.
   Paso de verdad en una prueba: un `var t` en un eval dejo el juego sin cargar nivel. */
function TX(k,v){ let s=(L[k]&&(L[k][IDIOMA]||L[k].en))||k;
  if(v) for(const p in v) s=s.split('{'+p+'}').join(v[p]); return s; }

/* ===================== EL CUADRO 16:9 ===================== */
const CAJA=document.getElementById('caja');
const lienzo=document.createElement('canvas'); CAJA.appendChild(lienzo);
const cx=lienzo.getContext('2d');
/* EL MUNDO SE DIBUJA A 1024x576 Y EL LIENZO LO ESCALA. Estaba en 1280x720, que es exactamente el
   alto del mapa (15 filas de 48), asi que la camara NO PODIA MOVERSE EN VERTICAL: el suelo quedaba
   clavado al borde de abajo y el personaje raspando el marco. Con 576 sobran 144 px de recorrido y
   la camara puede dejar la linea de caminar a dos tercios de altura. De paso todo se ve un 25% mas
   grande, que es lo que hacia falta: el personaje se leia chiquito. */
const ANCHO=1024, ALTO=576;
let girado=false, cajaW=16, cajaH=9, DPR=1;
function ajustarCuadro(){
  const W=innerWidth, H=innerHeight;
  girado = H>W;
  const dw=girado?H:W, dh=girado?W:H;
  let w=dw, h=Math.round(w*9/16);
  if(h>dh){ h=dh; w=Math.round(h*16/9); }
  cajaW=w; cajaH=h;
  CAJA.style.setProperty('--esc', Math.max(0.60, Math.min(1.15, h/720)).toFixed(3));
  CAJA.style.width=w+'px'; CAJA.style.height=h+'px';
  CAJA.style.transform='translate(-50%,-50%)'+(girado?' rotate(90deg)':'');
  DPR=Math.min(devicePixelRatio||1, 2);
  lienzo.width=Math.round(w*DPR); lienzo.height=Math.round(h*DPR);
  lienzo.style.width=w+'px'; lienzo.style.height=h+'px';
}
ajustarCuadro();
addEventListener('resize',ajustarCuadro);
addEventListener('orientationchange',()=>setTimeout(ajustarCuadro,120));

/* ===================== QUE APARATO ES ESTE ===================== */
function adivinar(){
  const grueso=!!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const tactil=(navigator.maxTouchPoints||0)>0 || 'ontouchstart' in window;
  return (tactil && grueso) ? 'movil' : 'pc';
}
let plataf=adivinar();
document.body.classList.add(plataf);
/* Chrome de Android dispara mousemove sintetico despues de cada toque: si se le cree, el primer
   toque apaga los botones y el juego queda sin controles */
let ultimoToque=-1e9;
addEventListener('touchstart',()=>{ ultimoToque=performance.now(); ponerPlat('movil'); },{passive:true});
addEventListener('touchend',()=>{ ultimoToque=performance.now(); },{passive:true});
addEventListener('mousemove',e=>{ if(performance.now()-ultimoToque<1200) return;
  if(!(e.movementX||e.movementY||e.clientX||e.clientY)) return; ponerPlat('pc'); });
addEventListener('keydown',()=>ponerPlat('pc'));
function ponerPlat(p){ if(p===plataf) return; plataf=p;
  document.body.classList.toggle('pc',p==='pc'); document.body.classList.toggle('movil',p==='movil');
  pintarTeclas(); }

/* ===================== EL SONIDO ===================== */
const AUD={ctx:null,on:true};
function audioIniciar(){
  if(AUD.ctx) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  let c; try{ c=new C(); }catch(e){ return; }
  AUD.ctx=c;
  const m=c.createGain(); m.gain.value=0.9; m.connect(c.destination); AUD.m=m;
  const n=c.sampleRate|0, rb=c.createBuffer(1,n,c.sampleRate), rd=rb.getChannelData(0);
  for(let i=0;i<n;i++) rd[i]=Math.random()*2-1;
  AUD.ruido=rb;
  try{ const an=c.createAnalyser(); an.fftSize=1024; m.connect(an); AUD.an=an;
       AUD.buf=new Float32Array(an.fftSize); }catch(e){}
}
function tono(f0,f1,dur,vol,tipo){
  const c=AUD.ctx; if(!c||!AUD.on) return;
  const t=c.currentTime, o=c.createOscillator(); o.type=tipo||'square';
  o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AUD.m); o.start(t); o.stop(t+dur+0.03);
}
function golpe(dur,f0,f1,vol,tipo){
  const c=AUD.ctx; if(!c||!AUD.on) return;
  const t=c.currentTime, s=c.createBufferSource(); s.buffer=AUD.ruido; s.loop=true;
  const b=c.createBiquadFilter(); b.type=tipo||'lowpass';
  b.frequency.setValueAtTime(f0,t); b.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+dur*0.1);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(b); b.connect(g); g.connect(AUD.m); s.start(t); s.stop(t+dur+0.03);
}
function son(k){
  if(!AUD.ctx||!AUD.on) return;
  if(AUD.ctx.state==='suspended'){ try{ AUD.ctx.resume(); }catch(e){} }
  try{
    if(k==='salto'){ tono(300,620,0.16,0.14,'square'); }
    else if(k==='pisa'){ tono(180,90,0.09,0.10,'triangle'); }
    else if(k==='pisotón'){ tono(520,180,0.14,0.17,'square'); golpe(0.12,1800,400,0.13,'bandpass'); }
    else if(k==='estrella'){ tono(880,0,0.09,0.13,'square'); setTimeout(()=>tono(1320,0,0.13,0.11,'square'),80); }
    else if(k==='dano'){ tono(240,70,0.34,0.19,'sawtooth'); golpe(0.30,900,120,0.16); }
    else if(k==='muerte'){ tono(400,60,0.7,0.20,'sawtooth'); }
    else if(k==='meta'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tono(f,0,0.30,0.15,'square'), i*105)); }
    else if(k==='final'){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tono(f,0,0.55,0.16,'square'), i*150)); }
  }catch(e){}
}

/* ===================== LOS NIVELES ===================== */
const TAM=48;                          // el lado de una casilla, en pixeles del mundo
/* LA HOJA DEL JUGADOR. Se declara aca y no repartido por el codigo: cuando cambia la cantidad de
   cuadros hay que tocar UN lugar. */
/* DIECISEIS CUADROS: ocho de caminar (el ciclo entero, contacto-bajo-pasada-alto por cada pierna),
   CUATRO de quieto que respiran, uno agachado al aterrizar, uno de golpe, uno de salto y uno de
   caida. A 24 por segundo el ciclo de ocho da tres pasos por segundo corriendo, que es lo que
   camina una persona.
   TODOS LOS CUADROS MIDEN LO MISMO. Esto parece obvio y no lo es: cada tanda de dibujos viene con
   su propia escala, y si se recorta cada pose por separado el muneco CAMBIA DE PORTE segun lo que
   este haciendo. Se midio el ancho de la cabeza -que es una parte rigida y no se mueve con la
   pose- en los cuadros de contacto y se escalo todo lo demas para que de igual: parado quedo 118
   px de atlas contra 112 del contacto, o sea 5,8% mas alto, que es lo que mide una persona parada
   contra la misma persona en el apoyo de una zancada. Antes la diferencia era del 24%. */
let NCUADROS=16;
let CUA={ corre:[0,1,2,3,4,5,6,7], quieto:[8,9,10,11], agachado:12, golpe:13, salto:14, caida:15 };
/* la respiracion va y VUELVE: 8 pasos sobre 4 dibujos a 3,5 por segundo son 2,3 segundos de ciclo,
   que es lo que tarda una respiracion tranquila. Un bucle 0-1-2-3-0 daria un tiron al reiniciar. */
const RESPIRA=[0,1,2,3,3,2,1,0], RESPIRA_FPS=3.5;
const TEMA=[0,0,0,1,1,2,2];            // que fondo lleva cada nivel
const FONDOS=['bosque','cueva','fabrica'];
const COLORES=[
  { pasto:'#6db33f', pastoOsc:'#4c8a2b', tierra:'#8a5a2b', tierraOsc:'#6b4420', borde:'#3d2a14' },
  { pasto:'#4a7d94', pastoOsc:'#33596b', tierra:'#2f4759', tierraOsc:'#223543', borde:'#16222c' },
  { pasto:'#8a6a3a', pastoOsc:'#6b5029', tierra:'#4a4038', tierraOsc:'#37302a', borde:'#211c18' }
];
let MAPA=[], MW=0, MH=0, nivel=0, tema=0;
function solido(i,j){ if(j<0||j>=MH) return false; if(i<0||i>=MW) return true;
  const c=MAPA[j][i]; return c==='#'||c==='-'; }
function pinche(i,j){ if(j<0||j>=MH||i<0||i>=MW) return false; return MAPA[j][i]==='^'; }

/* ===================== EL JUGADOR Y LOS BICHOS ===================== */
const jug={ x:0,y:0,vx:0,vy:0,an:32,al:62, piso:false, mira:1, fase:0, vidas:3,
            invul:0, muerto:0, coyote:0, pedido:0, salto:0,
            /* el ultimo lugar firme donde estuvo: caer a un pozo devuelve ACA y no al principio */
            segX:0, segY:0, segT:0,
            /* APLASTE Y ESTIRE. Es lo que separa un muneco que se traslada de un personaje que se
               mueve: al despegar se estira a lo alto, al aterrizar se aplasta a lo ancho, y vuelve
               con un muelle. No cuesta un solo sprite mas y se nota mas que cuatro cuadros extra. */
            esX:1, esY:1, esV:0, anim:0, quieto:0 };
let bichos=[], estrellas=[], meta=null, camX=0, camY=0, tomadas=0, totales=0, andando=0;
/* LO QUE LE FALTABA AL JUEGO PARA NO SER "correr a la derecha y saltar":
   - resortes, que rompen la altura fija del salto y abren caminos de arriba
   - plataformas moviles, que son el unico obstaculo que se mueve solo y obliga a esperar
   - banderas de control, que sacan el castigo de repetir medio nivel por un error */
let resortes=[], moviles=[], banderas=[];
let jugando=false, pausa=false, finMostrado=false;

function cargarNivel(n){
  nivel=n; tema=TEMA[n]||0;
  MAPA=NIVELES[n].map(f=>f.split(''));
  MH=MAPA.length; MW=MAPA[0].length;
  bichos=[]; estrellas=[]; meta=null; tomadas=0; totales=0;
  resortes=[]; moviles=[]; banderas=[];
  for(let j=0;j<MH;j++) for(let i=0;i<MW;i++){
    const c=MAPA[j][i], X=i*TAM, Y=j*TAM;
    if(c==='P'){ jug.x=X+TAM/2; jug.y=Y+TAM; MAPA[j][i]='.'; }
    else if(c==='D'||c==='M'){ meta={x:X+TAM/2, y:Y+TAM, tipo:c}; MAPA[j][i]='.'; }
    else if(c==='*'){ estrellas.push({x:X+TAM/2, y:Y+TAM/2, tomada:false, f:Math.random()*6.28}); totales++; MAPA[j][i]='.'; }
    else if(c==='s'){ bichos.push({t:'slime', x:X+TAM/2, y:Y+TAM, vx:52, an:38, al:32, f:0, vivo:true, x0:X, r:TAM*3}); MAPA[j][i]='.'; }
    else if(c==='r'){ resortes.push({x:X+TAM/2, y:Y+TAM, f:0, t:0}); MAPA[j][i]='.'; }
    else if(c==='f'){ banderas.push({x:X+TAM/2, y:Y+TAM, on:false, f:0}); MAPA[j][i]='.'; }
    else if(c==='~'||c==='|'){ moviles.push({x:X, y:Y, an:TAM*2.5, al:TAM*0.42,
        vert:(c==='|'), x0:X, y0:Y, d:1, r:TAM*2.6, v:62, ax:0, ay:0}); MAPA[j][i]='.'; }
    else if(c==='b'){ bichos.push({t:'bat', x:X+TAM/2, y:Y+TAM/2, y0:Y+TAM/2, vx:70, an:34, al:26, f:Math.random()*6.28, vivo:true, x0:X, r:TAM*3.2}); MAPA[j][i]='.'; }
  }
  jug.vx=0; jug.vy=0; jug.vidas=3; jug.invul=0; jug.muerto=0; jug.mira=1; jug.fase=0;
  jug.segX=jug.x; jug.segY=jug.y; jug.segT=0;
  camX=Math.max(0, jug.x-ANCHO/2); camY=0;
  finMostrado=false; jugando=true; pausa=false; andando=0;
  PART.length=0; sacT=0; sacX=0; sacY=0; cartelT=2.6;
  jug.esX=1; jug.esY=1; jug.esV=0; jug.anim=0; jug.quieto=0; jug.quieto=0; jug.quieto=0; jug.quieto=0;
  ponerAdornos(); ponerFondo();
  document.body.classList.add('jugando');
  pintarHUD();
  document.getElementById('nivelRot').textContent=TX('nivel',{n:nivel+1, m:TX('m'+(nivel+1))});
}

/* las colisiones son eje por eje contra la grilla: asi se DESLIZA por una pared en vez de trabarse */
function chocaCaja(x,y,an,al){
  const i0=Math.floor((x-an/2)/TAM), i1=Math.floor((x+an/2-0.01)/TAM);
  const j0=Math.floor((y-al)/TAM),   j1=Math.floor((y-0.01)/TAM);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++) if(solido(i,j)) return true;
  return false;
}
function tocaPinche(x,y,an,al){
  const i0=Math.floor((x-an/2+6)/TAM), i1=Math.floor((x+an/2-6)/TAM);
  const j0=Math.floor((y-al+6)/TAM),   j1=Math.floor((y-2)/TAM);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++) if(pinche(i,j)) return true;
  return false;
}

/* LAS MEDIDAS DEL SALTO MANDAN SOBRE EL DISENO DE LOS NIVELES, no al reves.
   Con SALTO=700 el apice subia 111 px, o sea 2,3 casillas: la plataforma mas baja que se puede
   poner arriba del piso esta a 3 casillas (144 px) y NO SE LLEGABA A NINGUNA. Con 820 el apice sube
   160 px (3,3 casillas) y el vuelo dura 0,78 s, o sea 219 px de largo: 4,5 casillas de hueco.
   v = raiz(2*g*h): para 144 px con g=2100 hacen falta 778, asi que 820 deja margen. */
const GRAV=2100, VEL=280, VEL_AIRE=1400, ACEL=2600, ROCE=2200, SALTO=820, SALTO_CORTO=360;
const tecla={};
addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  tecla[k]=true;
  if(k===' '||k==='w'||k==='arrowup') jug.pedido=0.14;
  if(k==='escape'&&jugando) alMenu();
});
addEventListener('keyup',e=>{ const k=(e.key||'').toLowerCase(); tecla[k]=false;
  if(k===' '||k==='w'||k==='arrowup') soltarSalto(); });
function soltarSalto(){ if(jug.vy<-SALTO_CORTO) jug.vy=-SALTO_CORTO; }
let tIzq=false, tDer=false;
const tocar=(id,ap,su)=>{ const el=document.getElementById(id); if(!el) return;
  el.addEventListener('touchstart',e=>{ e.preventDefault(); ap(); },{passive:false});
  el.addEventListener('touchend',e=>{ e.preventDefault(); if(su) su(); },{passive:false});
  el.addEventListener('mousedown',e=>{ ap(); });
  el.addEventListener('mouseup',e=>{ if(su) su(); });
  el.addEventListener('mouseleave',e=>{ if(su) su(); }); };
tocar('bIzq',()=>tIzq=true,()=>tIzq=false);
tocar('bDer',()=>tDer=true,()=>tDer=false);
tocar('bSalto',()=>{ jug.pedido=0.14; },()=>soltarSalto());

function pasoJugador(dt){
  if(jug.muerto>0){ jug.muerto-=dt; jug.vy+=GRAV*dt; jug.y+=jug.vy*dt;
    if(jug.muerto<=0) perder(); return; }
  let dir=0;
  if(tecla['a']||tecla['arrowleft']||tIzq) dir-=1;
  if(tecla['d']||tecla['arrowright']||tDer) dir+=1;
  if(dir) jug.mira=dir;
  /* aceleracion y roce, no velocidad puesta directo: con velocidad directa arranca y para en un
     cuadro y se siente a muneco */
  if(dir){ jug.vx += dir*ACEL*dt; if(Math.abs(jug.vx)>VEL) jug.vx=dir*VEL; }
  else { const s=Math.sign(jug.vx); jug.vx-=s*ROCE*dt; if(Math.sign(jug.vx)!==s) jug.vx=0; }
  /* SALTO CON LOS DOS MARGENES: coyote (podes saltar 0,10 s despues de salir del borde) y pedido
     guardado (apretar 0,14 s antes de tocar el piso vale). Los dos son invisibles y son la
     diferencia entre "salta cuando le digo" y "a veces no salta". */
  jug.coyote = jug.piso? 0.10 : Math.max(0,jug.coyote-dt);
  jug.pedido = Math.max(0,jug.pedido-dt);
  if(jug.pedido>0 && jug.coyote>0){ jug.vy=-SALTO; jug.piso=false; jug.coyote=0; jug.pedido=0;
    son('salto'); jug.esY=1.28; jug.esV=0; polvo(jug.x, jug.y, 7, 130); }
  jug.vy += GRAV*dt;
  if(jug.vy>1400) jug.vy=1400;
  /* eje X */
  let nx=jug.x+jug.vx*dt;
  if(chocaCaja(nx,jug.y,jug.an,jug.al)){
    while(!chocaCaja(jug.x+Math.sign(jug.vx),jug.y,jug.an,jug.al) && Math.abs(jug.x-nx)>1) jug.x+=Math.sign(jug.vx);
    jug.vx=0;
  } else jug.x=nx;
  /* eje Y */
  let ny=jug.y+jug.vy*dt;
  jug.piso=false;
  if(chocaCaja(jug.x,ny,jug.an,jug.al)){
    const s=Math.sign(jug.vy);
    while(!chocaCaja(jug.x,jug.y+s,jug.an,jug.al) && Math.abs(jug.y-ny)>1) jug.y+=s;
    if(jug.vy>0){
      const g=Math.min(1, jug.vy/900);
      jug.piso=true; if(andando>0.2) son('pisa');
      if(g>0.30){ jug.esY=1-0.34*g; jug.esV=0;
        polvo(jug.x, jug.y, Math.round(4+8*g), 90+120*g);
        if(g>0.75) sacudir(3.2*g); }
    }
    jug.vy=0;
  } else jug.y=ny;
  if(jug.x<jug.an/2) { jug.x=jug.an/2; jug.vx=0; }
  if(jug.x>MW*TAM-jug.an/2){ jug.x=MW*TAM-jug.an/2; jug.vx=0; }
  /* la fase de la animacion va por DISTANCIA y no por tiempo: asi la zancada no cambia de largo
     cuando cambia la velocidad */
  /* LA ANIMACION VA A 24 CUADROS POR SEGUNDO, que es a lo que se anima a mano, y el ritmo sube con
     la velocidad: parado no cicla, caminando cicla despacio, corriendo cicla rapido. Por distancia
     sola se ve mecanica a baja velocidad; solo por tiempo, patina. */
  if(jug.piso && Math.abs(jug.vx)>12){
    jug.anim += dt * 24 * (0.45 + 0.75*Math.min(1, Math.abs(jug.vx)/VEL));
    andando+=dt;
    if(Math.abs(jug.vx)>VEL*0.72 && Math.random()<dt*14) polvo(jug.x-jug.mira*12, jug.y, 1, 60);
  } else { andando=0; jug.anim += dt*24*0.30; }
  jug.quieto = (Math.abs(jug.vx)>12 || !jug.piso)? 0 : jug.quieto+dt;
  jug.quieto = (Math.abs(jug.vx)>12 || !jug.piso)? 0 : jug.quieto+dt;
  jug.quieto = (Math.abs(jug.vx)>12 || !jug.piso)? 0 : jug.quieto+dt;
  jug.quieto = (Math.abs(jug.vx)>12 || !jug.piso)? 0 : jug.quieto+dt;
  /* el muelle del aplaste: vuelve a 1 pasando de largo, que es lo que lo hace ver elastico */
  jug.esV += ((1-jug.esY)*190 - jug.esV*13)*dt;
  jug.esY += jug.esV*dt;
  jug.esX = 1 + (1-jug.esY)*0.65;
  if(jug.invul>0) jug.invul-=dt;
  /* caer del mapa o tocar pinches */
  /* SE GUARDA EL ULTIMO PISO FIRME. Caer a un pozo devolvia al arranque del nivel, y perder dos
     minutos de nivel por un salto es la forma mas rapida de que alguien cierre el juego. Ahora
     cuesta UNA vida y se vuelve a donde estabas parado. */
  jug.segT-=dt;
  if(jug.piso && jug.segT<=0 && !tocaPinche(jug.x,jug.y-4,jug.an,jug.al)){
    jug.segX=jug.x; jug.segY=jug.y; jug.segT=0.25;
  }
  if(jug.y>MH*TAM+120) caerAlPozo();
  else if(tocaPinche(jug.x,jug.y,jug.an,jug.al) && jug.invul<=0) dano();
}

function caerAlPozo(){
  if(jug.muerto>0) return;
  jug.vidas--; son('dano'); pintarHUD();
  if(jug.vidas<=0){ morir(); return; }
  jug.x=jug.segX||24; jug.y=jug.segY||(12*TAM+TAM);
  jug.vx=0; jug.vy=0; jug.invul=1.2; jug.piso=false;
  camX=Math.max(0, Math.min(MW*TAM-ANCHO, jug.x-ANCHO*0.42));
}
function dano(){
  if(jug.invul>0||jug.muerto>0) return;
  jug.vidas--; jug.invul=1.4; jug.vy=-380; jug.vx=-jug.mira*220;
  son('dano'); pintarHUD(); sacudir(5.5);
  chispas(jug.x, jug.y-jug.al/2, 16, 'rgba(255,120,110,');
  if(jug.vidas<=0) morir();
}
function morir(){ if(jug.muerto>0) return; jug.muerto=0.9; jug.vy=-520; jug.vidas=0; son('muerte'); pintarHUD(); }

function pasoMoviles(dt){
  for(const m of moviles){
    const antes = m.vert? m.y : m.x;
    if(m.vert){ m.y += m.d*m.v*dt; if(Math.abs(m.y-m.y0)>m.r){ m.y=m.y0+Math.sign(m.y-m.y0)*m.r; m.d=-m.d; } }
    else      { m.x += m.d*m.v*dt; if(Math.abs(m.x-m.x0)>m.r){ m.x=m.x0+Math.sign(m.x-m.x0)*m.r; m.d=-m.d; } }
    m.ax = m.vert? 0 : (m.x-antes);
    m.ay = m.vert? (m.y-antes) : 0;
  }
}
/* EL JUGADOR SE APOYA EN LAS MOVILES Y SE DEJA LLEVAR. Sin arrastrarlo con la plataforma, uno se
   queda quieto en el aire mientras la plataforma se va, que es el error clasico y se ve horrible. */
function pisarMoviles(dt){
  if(jug.muerto>0) return;
  for(const m of moviles){
    const dentroX = jug.x+jug.an/2 > m.x && jug.x-jug.an/2 < m.x+m.an;
    if(!dentroX) continue;
    const pies=jug.y, techo=m.y;
    if(jug.vy>=0 && pies >= techo-2 && pies <= techo + m.al + Math.max(10, Math.abs(jug.vy)*dt+4)){
      jug.y=techo; jug.vy=0; jug.piso=true; jug.coyote=0.10;
      jug.x+=m.ax; jug.y+=m.ay;
    }
  }
}
function pasoResortes(dt){
  for(const r of resortes){
    if(r.t>0) r.t-=dt;
    r.f = r.t>0? Math.max(0, r.t/0.30) : 0;
    if(jug.muerto>0) continue;
    if(Math.abs(jug.x-r.x)<TAM*0.62 && jug.vy>=0 &&
       jug.y >= r.y-TAM*0.55 && jug.y <= r.y+10){
      jug.y=r.y-TAM*0.5; jug.vy=-SALTO*1.62; jug.piso=false; jug.pedido=0;
      r.t=0.30; son('salto'); sacudir(2.0);
      jug.esY=1.42; jug.esV=0;
      polvo(r.x, r.y, 10, 170);
    }
  }
}
function pasoBanderas(){
  if(jug.muerto>0) return;
  for(const b of banderas){
    if(b.on) continue;
    if(Math.abs(jug.x-b.x)<TAM*0.7 && Math.abs(jug.y-b.y)<TAM*1.4){
      b.on=true; jug.segX=b.x; jug.segY=b.y; jug.segT=999;
      son('estrella'); chispas(b.x, b.y-TAM, 16, 'rgba(255,235,170,');
    }
  }
}
function pasoBichos(dt){
  for(const b of bichos){
    if(!b.vivo) continue;
    if(b.t==='slime'){
      b.f+=dt*6;
      let nx=b.x+b.vx*dt;
      /* dan la vuelta al borde de la plataforma o contra una pared: un bicho que se tira al vacio
         deja el nivel vacio a los diez segundos */
      const iAde=Math.floor((nx + Math.sign(b.vx)*b.an/2)/TAM), jPie=Math.floor(b.y/TAM);
      if(!solido(iAde,jPie) || solido(iAde,jPie-1) || Math.abs(nx-b.x0-TAM/2)>b.r) b.vx=-b.vx;
      else b.x=nx;
    } else {
      b.f+=dt*5;
      b.x+=b.vx*dt;
      if(Math.abs(b.x-b.x0-TAM/2)>b.r) b.vx=-b.vx;
      b.y=b.y0+Math.sin(b.f*0.7)*34;
    }
    if(jug.muerto>0) continue;
    /* choque con el jugador: si viene cayendo desde arriba lo pisa */
    const dx=Math.abs(jug.x-b.x), dy=Math.abs((jug.y-jug.al/2)-(b.y-b.al/2));
    if(dx < (jug.an+b.an)/2*0.8 && dy < (jug.al+b.al)/2*0.8){
      const pisa = jug.vy>60 && (jug.y-jug.al*0.4) < (b.y-b.al);
      if(pisa){ b.vivo=false; jug.vy=-560; jug.pedido=0; son('pisotón');
        chispas(b.x, b.y-b.al/2, 14, b.t==='slime'? 'rgba(196,164,222,' : 'rgba(120,150,230,');
        jug.esY=0.72; jug.esV=0; sacudir(2.4); }
      else if(jug.invul<=0) dano();
    }
  }
}
function pasoEstrellas(dt){
  for(const e of estrellas){
    if(e.tomada) continue;
    e.f+=dt*3;
    if(Math.abs(jug.x-e.x)<34 && Math.abs((jug.y-jug.al/2)-e.y)<40){
      e.tomada=true; tomadas++; son('estrella'); pintarHUD();
      chispas(e.x, e.y, 12, 'rgba(255,224,140,');
    }
  }
}
function pasoMeta(){
  if(!meta||finMostrado||jug.muerto>0) return;
  if(Math.abs(jug.x-meta.x)<40 && Math.abs(jug.y-meta.y)<70) ganar();
}

/* ===================== POLVO, CHISPAS Y SACUDONES =====================
   Nada de esto cambia una regla del juego y es la mitad de lo que hace que se sienta terminado.
   Un salto sin polvo al despegar se lee a personaje flotando; un enemigo que desaparece sin nada
   se lee a error. */
const PART=[];
function particula(x,y,vx,vy,vida,r,col,grav){
  if(PART.length>220) PART.shift();
  PART.push({x,y,vx,vy,t:0,vida,r,col,grav:grav==null?900:grav});
}
function polvo(x,y,n,fuerza){
  for(let k=0;k<n;k++){
    const a=Math.PI + (Math.random()-0.5)*2.2;
    particula(x+(Math.random()-0.5)*22, y-3,
      Math.cos(a)*fuerza*(0.4+Math.random()), -Math.abs(Math.sin(a))*fuerza*(0.3+Math.random()*0.5),
      0.28+Math.random()*0.28, 3+Math.random()*4, 'rgba(226,214,190,', 520);
  }
}
function chispas(x,y,n,col){
  for(let k=0;k<n;k++){
    const a=Math.random()*6.283, v=90+Math.random()*190;
    particula(x,y,Math.cos(a)*v,Math.sin(a)*v-60, 0.34+Math.random()*0.30, 2.5+Math.random()*3.5, col, 620);
  }
}
function pasoParticulas(dt){
  for(let k=PART.length-1;k>=0;k--){
    const P=PART[k]; P.t+=dt;
    if(P.t>=P.vida){ PART.splice(k,1); continue; }
    P.vy+=P.grav*dt; P.x+=P.vx*dt; P.y+=P.vy*dt; P.vx*=1-Math.min(1,1.6*dt);
  }
}
function dibujarParticulas(){
  for(const P of PART){
    const a=1-P.t/P.vida;
    cx.fillStyle=P.col+(a*0.85).toFixed(2)+')';
    const r=P.r*(0.35+a*0.65);
    cx.beginPath(); cx.arc(P.x-camX, P.y-camY, r, 0, 6.283); cx.fill();
  }
}
let sacX=0, sacY=0, sacT=0, sacF=0;
function sacudir(f){ sacT=Math.max(sacT,0.26); sacF=Math.max(sacF,f); }
function pasoSacudon(dt){
  if(sacT>0){ sacT-=dt;
    const k=Math.max(0,sacT/0.26)*sacF;
    sacX=(Math.random()-0.5)*k*2; sacY=(Math.random()-0.5)*k*2;
  } else { sacX=0; sacY=0; sacF=0; }
}
let cartelT=0;
function dibujarCartel(){
  if(cartelT<=0) return;
  const a=Math.min(1, (2.6-cartelT)/0.35) * Math.min(1, cartelT/0.5);
  cx.save(); cx.globalAlpha=Math.max(0,Math.min(1,a));
  cx.fillStyle='rgba(8,11,18,.72)';
  cx.fillRect(0, ALTO*0.36, ANCHO, ALTO*0.16);
  cx.fillStyle='#ffd76a'; cx.textAlign='center';
  cx.font='900 '+Math.round(ALTO*0.055)+'px Segoe UI, system-ui, sans-serif';
  cx.fillText(TX('nivel',{n:nivel+1, m:TX('m'+(nivel+1))}), ANCHO/2, ALTO*0.475);
  cx.restore(); cx.textAlign='left';
}

/* ===================== LO QUE ADORNA ===================== */
/* Un nivel con UNA foto atras y nada mas es un nivel de prueba. Lo que lo vuelve un lugar son tres
   capas que van a velocidades distintas: el fondo lejos casi quieto, una capa media, y COSAS
   APOYADAS EN EL PISO que pasan a la velocidad de la camara. Sin la tercera no hay profundidad,
   hay papel tapiz.
   Las hojas de adornos ya vienen escaladas al tamano que van a tener en el juego, asi que se
   dibujan a im.height y no hace falta una tabla de tamanos por objeto. */
const DECOS=['decobosque','decocueva','decofabrica'];
const HORIZONTE=ALTO*0.92;             // donde apoya la capa del medio
let adornos=[], arboles=[], pajaros=[], hojasV=[], motas=[];
const CAPAS={arb:1, paj:1, hoj:1, ado:1, sil:1, lej:1};   // interruptores para medir que cuesta cada capa

/* Un azar CLAVADO. La decoracion tiene que salir IGUAL cada vez que se entra al nivel: si cambia
   al morir, el nivel se lee a otro nivel y se pierde la referencia de por donde se iba. */
function azar(n){
  n=(n*1103515245+12345)&0x7fffffff; n^=n>>>13; n=(n*1274126177)&0x7fffffff;
  return (n^(n>>>16))/0x7fffffff;
}

function ponerAdornos(){
  adornos.length=0;
  const ocupado=[];
  if(meta) ocupado.push(meta);
  for(const r of resortes) ocupado.push(r);
  for(const f of banderas) ocupado.push(f);
  ocupado.push({x:jug.x, y:jug.y});
  for(let j=0;j<MH;j++) for(let i=0;i<MW;i++){
    if(!solido(i,j) || solido(i,j-1)) continue;        // solo la cara que da al aire
    if(pinche(i,j-1)) continue;
    if(azar(nivel*7919 + i*131 + j*17) > 0.30) continue;
    const x=i*TAM + TAM/2 + (azar(i*977+j*13)-0.5)*TAM*0.44, y=j*TAM;
    if(ocupado.some(o=>Math.abs(o.x-x)<40 && Math.abs(o.y-y)<52)) continue;
    if(adornos.some(a=>Math.abs(a.x-x)<38 && a.y===y)) continue;
    adornos.push({ x:x, y:y, k:Math.floor(azar(nivel*104729 + i*31 + j*7)*6)%6,
                   m: azar(i*613+j*29)<0.5? 1 : -1 });
  }
}

function ponerFondo(){
  arboles.length=0; pajaros.length=0; hojasV.length=0; motas.length=0;
  const largo=MW*TAM;
  if(tema===0){
    for(let n=0; n*288 < largo*0.6+ANCHO*2; n++)
      arboles.push({ x:n*288 + azar(n*4231+nivel)*104, e:0.46+azar(n*911)*0.26,
                     f:azar(n*577)*6.28, v:0.55+azar(n*233)*0.5 });
    for(let n=0;n<5;n++)
      pajaros.push({ x:azar(n*331+nivel*7)*ANCHO*1.6, y:ALTO*(0.10+azar(n*77)*0.34),
                     v:26+azar(n*191)*26, f:azar(n*53)*6.28, d: azar(n*401)<0.5? 1 : -1 });
  } else {
    /* la cueva respira motas que flotan, la fabrica escupe chispas que suben */
    for(let n=0;n<34;n++)
      motas.push({ x:azar(n*137+nivel)*ANCHO, y:azar(n*277)*ALTO,
                   v:(tema===1? 5+azar(n*61)*9 : 16+azar(n*61)*24),
                   r:(tema===1? 1.2+azar(n*97)*2.0 : 1.0+azar(n*97)*1.6), f:azar(n*43)*6.28 });
  }
}

function pasoFondo(dt){
  const t=performance.now()/1000;
  for(const p of pajaros){
    p.x += p.v*p.d*dt; p.f += dt*(6.5+p.v*0.06);
    p.y += Math.sin(t*0.9+p.f*0.1)*7*dt;
    if(p.d>0 && p.x > ANCHO+320) { p.x=-260; p.y=ALTO*(0.08+Math.random()*0.36); }
    if(p.d<0 && p.x < -320)      { p.x=ANCHO+260; p.y=ALTO*(0.08+Math.random()*0.36); }
  }
  /* las hojas SALEN DE LOS ARBOLES, no del borde de la pantalla: una hoja que aparece en el aire
     de la nada se ve a particula; una que se despega de una copa se ve a arbol */
  if(tema===0 && arboles.length && hojasV.length<20 && Math.random() < dt*2.4){
    /* caen DESDE ARRIBA DE LA PANTALLA, no desde la copa de los arboles del medio: esas copas
       quedan casi tapadas por el bloque de tierra y una hoja soltada ahi recorre 150 px y se va.
       Arrancando arriba cruza los 576 px enteros, que es lo que se ve. Se elige la x de un arbol
       para que parezca que se desprenden de las copas de arriba, que son las del fondo. */
    const a=arboles[Math.floor(Math.random()*arboles.length)];
    hojasV.push({ ax:a.x + (Math.random()-0.5)*230, y:-18-Math.random()*40,
                  k:Math.floor(Math.random()*4), g:Math.random()*6.28,
                  vy:26+Math.random()*30, vg:1.1+Math.random()*1.7, am:16+Math.random()*26 });
  }
  for(let n=hojasV.length-1;n>=0;n--){
    const h=hojasV[n];
    h.y += h.vy*dt; h.g += h.vg*dt;
    if(h.y > ALTO+22) hojasV.splice(n,1);
  }
  for(const m of motas){
    m.y -= m.v*dt; m.f += dt*1.7;
    if(m.y < -10){ m.y=ALTO+10; m.x=Math.random()*ANCHO; }
  }
}

/* EL ARBOL MENEADO, DIBUJADO DE ANTEMANO. Doce sesgos, una sola vez, y despues son copias
   derechas. El sesgo maximo corre la copa un 4% del alto, asi que la celda se ensancha eso de
   cada lado para que no se corte. */
let CACHE_ARB=null;
function cacheArbol(){
  const im=IMG.arbol; if(!im) return null;
  if(CACHE_ARB && CACHE_ARB.src===im) return CACHE_ARB;
  const N=12, K=0.040, m=Math.ceil(im.height*K)+2;
  const g=document.createElement('canvas');
  g.width=(im.width+m*2)*N; g.height=im.height;
  const q=g.getContext('2d');
  for(let n=0;n<N;n++){
    const k=Math.sin(n/N*6.28318)*K;
    q.save();
    q.translate(n*(im.width+m*2)+m+im.width/2, im.height);
    q.transform(1,0,k,1,0,0);
    q.drawImage(im, -im.width/2, -im.height);
    q.restore();
  }
  CACHE_ARB={ src:im, c:g, n:N, an:im.width+m*2, al:im.height };
  return CACHE_ARB;
}

/* LAS HOJAS VAN ADELANTE. Puestas en el fondo caian detras del bloque de tierra y no se veia
   ninguna: una hoja que cae tiene que cruzar la pantalla, no esconderse atras del piso. */
function dibujarHojas(){
  const hj=IMG.hoja; if(!hj || !CAPAS.hoj || tema!==0) return;
  const cw=hj.width/4;
  for(const h of hojasV){
    const X=h.ax - camX*0.55 + Math.sin(h.g)*h.am;
    if(X < -30 || X > ANCHO+30) continue;
    cx.save(); cx.translate(Math.round(X), Math.round(h.y));
    cx.rotate(h.g*0.9);
    cx.scale(Math.cos(h.g*1.3)<0? -1:1, 1);        // gira y muestra el enves
    cx.drawImage(hj, h.k*cw, 0, cw, hj.height, -cw/2, -hj.height/2, cw, hj.height);
    cx.restore();
  }
}

function dibujarAdornos(){
  const im=IMG[DECOS[tema]]; if(!im || !CAPAS.ado) return;
  for(const a of adornos){
    const X=a.x-camX;
    if(X < -70 || X > ANCHO+70) continue;
    dibujarSprite(im, a.k, 6, X, a.y-camY, im.height, a.m);
  }
}

/* ===================== DIBUJAR ===================== */
function dibujarFondo(){
  const im=IMG[FONDOS[tema]];
  const W=ANCHO, H=ALTO, t=performance.now()/1000;
  if(im && CAPAS.lej){
    /* la capa LEJOS: se mueve a un tercio de la camara y se repite */
    const esc=H/im.height, an=im.width*esc;
    let off=(-camX*0.30)%an; if(off>0) off-=an;
    for(let x=off; x<W; x+=an) cx.drawImage(im, x, 0, an, H);
  } else { cx.fillStyle='#16202e'; cx.fillRect(0,0,W,H); }
  cx.fillStyle='rgba(10,13,20,0.22)'; cx.fillRect(0,0,W,H);

  /* la capa DEL MEDIO, a 0,55: es la que da la profundidad. La de lejos sola no alcanza porque
     al no tener nada a media distancia el ojo no tiene con que comparar y el fondo se lee a
     telon pintado. */
  const base=HORIZONTE - camY*0.55;
  if(tema===0){
    const ca=cacheArbol();
    if(ca && CAPAS.arb){
      cx.globalAlpha=0.62;
      for(const a of arboles){
        const X=a.x - camX*0.55;
        if(X < -180 || X > W+180) continue;
        /* el meneo esta DIBUJADO DE ANTEMANO en doce posiciones. Un drawImage torcido lo resuelve
           el procesador pixel por pixel; uno derecho lo copia de una. Se elige el cuadro por la
           fase y sale una copia y nada mas. */
        const n=Math.floor((((t*a.v + a.f)/6.28318)%1+1)%1 * ca.n)%ca.n;
        cx.drawImage(ca.c, n*ca.an, 0, ca.an, ca.al,
                     Math.round(X - ca.an*a.e/2), Math.round(base - ca.al*a.e),
                     Math.round(ca.an*a.e), Math.round(ca.al*a.e));
      }
    }
    cx.globalAlpha=1;
    const paj=IMG.pajaro;
    if(paj && CAPAS.paj) for(const p of pajaros){
      const c=Math.floor(p.f)%3;
      cx.save(); cx.translate(Math.round(p.x), Math.round(p.y - camY*0.22));
      if(p.d<0) cx.scale(-1,1);
      cx.globalAlpha=0.85;
      const cw=paj.width/3;
      cx.drawImage(paj, c*cw, 0, cw, paj.height, -cw/2, -paj.height/2, cw, paj.height);
      cx.restore();
    }
    cx.globalAlpha=1;
  } else {
    /* la cueva y la fabrica no tienen arboles, pero SI tienen que tener capa del medio: se arma
       con los mismos adornos, oscurecidos, que es como se hace una silueta sin pedir dibujos nuevos */
    const im2=IMG[DECOS[tema]];
    if(im2 && CAPAS.sil){
      const cw=im2.width/6, sil=(tema===1? [2,4,2,5,4,2] : [0,1,4,2,1,0]), paso=228;
      cx.save(); cx.globalAlpha=(tema===1? 0.26 : 0.32);
      for(let n=0;n<26;n++){
        const X=n*paso + (n%3)*47 - ((camX*0.55)%(26*paso));
        const e=1.5+((n*7)%5)*0.35;
        const c=sil[n%6];
        if(X < -200 || X > W+200) continue;
        cx.drawImage(im2, c*cw, 0, cw, im2.height,
                     X-cw*e/2, base-im2.height*e, cw*e, im2.height*e);
      }
      cx.restore();
    }
    cx.save();
    for(const m of motas){
      const b=0.35+0.45*Math.abs(Math.sin(m.f));
      cx.fillStyle = tema===1? 'rgba(150,220,255,'+b.toFixed(2)+')'
                             : 'rgba(255,168,80,'+b.toFixed(2)+')';
      cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.284); cx.fill();
    }
    cx.restore();
  }
  cx.fillStyle='rgba(10,13,20,0.22)'; cx.fillRect(0,0,W,H);
}
function dibujarCasillas(){
  const C=COLORES[tema];
  const i0=Math.max(0,Math.floor(camX/TAM)-1), i1=Math.min(MW-1,Math.ceil((camX+ANCHO)/TAM)+1);
  const j0=Math.max(0,Math.floor(camY/TAM)-1), j1=Math.min(MH-1,Math.ceil((camY+ALTO)/TAM)+1);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const c=MAPA[j][i]; if(c==='.') continue;
    const X=Math.round(i*TAM-camX), Y=Math.round(j*TAM-camY);
    if(c==='#'||c==='-'){
      /* SE MIRA A LOS VECINOS. Dibujar cada casilla con su marco da una CUADRICULA visible, que es
         lo que hace que un nivel se lea a hoja cuadriculada y no a terreno. El contorno solo va en
         los lados que dan al aire. */
      const arr=!solido(i,j-1), izq=!solido(i-1,j), der=!solido(i+1,j), aba=!solido(i,j+1);
      cx.fillStyle=arr? C.pasto : C.tierra;
      cx.fillRect(X,Y,TAM,TAM);
      if(arr){
        cx.fillStyle=C.pastoOsc; cx.fillRect(X,Y+TAM*0.34,TAM,TAM*0.14);
        cx.fillStyle=C.tierra;   cx.fillRect(X,Y+TAM*0.48,TAM,TAM*0.52);
        /* el borde de arriba ondulado y con mechones: una linea recta se lee a plataforma de prueba */
        cx.fillStyle=C.pasto;
        for(let k=0;k<6;k++){ const w=TAM/6, h=4+((i*7+k*5)%5);
          cx.fillRect(X+k*w, Y-h, w+0.6, h+3); }
        cx.fillStyle='rgba(255,255,255,.10)'; cx.fillRect(X,Y-1,TAM,3);
      } else {
        cx.fillStyle=C.tierraOsc;
        cx.fillRect(X+5+((i*5+j*3)%10), Y+7+((i*3+j*7)%13), 10, 8);
        cx.fillRect(X+23+((i*11+j*5)%13), Y+25+((i*7+j*2)%11), 8, 7);
        cx.fillStyle='rgba(0,0,0,.10)'; cx.fillRect(X, Y, TAM, 4);
      }
      cx.fillStyle=C.borde;
      if(izq) cx.fillRect(X,Y,2,TAM);
      if(der) cx.fillRect(X+TAM-2,Y,2,TAM);
      if(aba) cx.fillRect(X,Y+TAM-2,TAM,2);
      if(arr) cx.fillRect(X,Y-1,TAM,1.5);
    } else if(c==='^'){
      cx.fillStyle='#c9d4e2';
      for(let k=0;k<3;k++){ const w=TAM/3, bx=X+k*w;
        cx.beginPath(); cx.moveTo(bx,Y+TAM); cx.lineTo(bx+w/2,Y+TAM*0.18); cx.lineTo(bx+w,Y+TAM); cx.closePath(); cx.fill(); }
      cx.fillStyle='#7c8ba0';
      for(let k=0;k<3;k++){ const w=TAM/3, bx=X+k*w;
        cx.beginPath(); cx.moveTo(bx+w/2,Y+TAM*0.18); cx.lineTo(bx+w,Y+TAM); cx.lineTo(bx+w*0.62,Y+TAM); cx.closePath(); cx.fill(); }
    }
  }
}
function dibujarSprite(im, cuadro, cuadros, x, y, alto, mira, esX, esY){
  if(!im){ cx.fillStyle='#e04b4b'; cx.fillRect(x-14,y-alto,28,alto); return; }
  const cw=im.width/cuadros, ch=im.height, esc=alto/ch, aw=cw*esc;
  cx.save();
  cx.translate(Math.round(x), Math.round(y));
  if(esX||esY) cx.scale(esX||1, esY||1);   // el aplaste escala desde los PIES, que es donde apoya
  if(mira<0) cx.scale(-1,1);
  cx.drawImage(im, cuadro*cw, 0, cw, ch, -aw/2, -alto, aw, alto);
  cx.restore();
}

function dibujar(){
  cx.setTransform(lienzo.width/ANCHO,0,0,lienzo.height/ALTO, sacX*lienzo.width/ANCHO, sacY*lienzo.height/ALTO);
  dibujarFondo();
  dibujarCasillas();
  dibujarAdornos();
  /* la meta */
  if(meta){
    const X=meta.x-camX, Y=meta.y-camY;
    if(meta.tipo==='M'){
      dibujarSprite(IMG.hermano, 0, 1, X, Y, 78, 1);
      cx.fillStyle='rgba(255,226,138,'+(0.25+0.15*Math.sin(performance.now()/260))+')';
      cx.beginPath(); cx.arc(X, Y-40, 56, 0, 6.284); cx.fill();
    } else {
      cx.fillStyle='#5a3a1c'; cx.fillRect(X-30, Y-84, 60, 84);
      cx.fillStyle='#7a5228'; cx.fillRect(X-24, Y-78, 48, 78);
      cx.fillStyle='#3a2410'; cx.fillRect(X-24, Y-78, 48, 6);
      cx.fillStyle='#ffd76a'; cx.beginPath(); cx.arc(X+14, Y-40, 5, 0, 6.284); cx.fill();
      cx.fillStyle='rgba(255,215,106,'+(0.16+0.10*Math.sin(performance.now()/300))+')';
      cx.beginPath(); cx.arc(X, Y-42, 52, 0, 6.284); cx.fill();
    }
  }
  /* las plataformas moviles: se dibujan como piedra con un borde metalico */
  {
    const C=COLORES[tema];
    for(const m of moviles){
      const X=Math.round(m.x-camX), Y=Math.round(m.y-camY);
      cx.fillStyle=C.tierra; cx.fillRect(X, Y, m.an, m.al);
      cx.fillStyle=C.pasto;  cx.fillRect(X, Y, m.an, 7);
      cx.fillStyle='rgba(0,0,0,.22)'; cx.fillRect(X, Y+m.al-4, m.an, 4);
      cx.fillStyle=C.borde;  cx.fillRect(X,Y,3,m.al); cx.fillRect(X+m.an-3,Y,3,m.al);
    }
  }
  /* los resortes */
  for(const r of resortes){
    const X=r.x-camX, Y=r.y-camY, apl=1-r.f*0.55;
    if(IMG.objetos) dibujarSprite(IMG.objetos, 1, 4, X, Y, 40*apl+8, 1, 1/Math.max(0.5,apl), 1);
    else { cx.fillStyle='#4aa3d8'; cx.fillRect(X-18, Y-22*apl, 36, 22*apl); }
  }
  /* las banderas de control */
  for(const b of banderas){
    b.f+=0.06;
    const X=b.x-camX, Y=b.y-camY;
    if(IMG.objetos) dibujarSprite(IMG.objetos, 0, 4, X, Y, b.on? 66 : 58, 1, 1, 1);
    else { cx.fillStyle=b.on?'#ff6b6b':'#7d8b9c'; cx.fillRect(X-4, Y-58, 8, 58); }
    if(b.on){
      cx.fillStyle='rgba(255,224,140,'+(0.14+0.09*Math.sin(b.f)).toFixed(2)+')';
      cx.beginPath(); cx.arc(X, Y-30, 40, 0, 6.283); cx.fill();
    }
  }
  /* las estrellas */
  for(const e of estrellas){
    if(e.tomada) continue;
    const X=e.x-camX, Y=e.y-camY+Math.sin(e.f)*5;
    cx.save(); cx.translate(X,Y); cx.rotate(Math.sin(e.f*0.6)*0.25);
    cx.fillStyle='#ffd76a'; cx.strokeStyle='#b8791d'; cx.lineWidth=2.4;
    cx.beginPath();
    for(let k=0;k<10;k++){ const r=k%2? 6.5:15, a=-Math.PI/2 + k*Math.PI/5;
      const px=Math.cos(a)*r, py=Math.sin(a)*r; k? cx.lineTo(px,py) : cx.moveTo(px,py); }
    cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
  }
  /* los bichos */
  for(const b of bichos){
    if(!b.vivo) continue;
    const X=b.x-camX, Y=b.y-camY;
    if(b.t==='slime') dibujarSprite(IMG.slime, (Math.floor(b.f)%2), 2, X, Y, 46, b.vx>0?1:-1);
    else dibujarSprite(IMG.bat, (Math.floor(b.f)%2), 2, X, Y+b.al/2, 40, b.vx>0?1:-1);
  }
  /* el jugador */
  const px=jug.x-camX, py=jug.y-camY;
  const parpadea = jug.invul>0 && (Math.floor(jug.invul*14)%2===0);
  if(!parpadea){
    let cuadro;
    if(jug.muerto>0) cuadro=CUA.golpe;
    else if(jug.invul>0.9) cuadro=CUA.golpe;
    else if(!jug.piso) cuadro = jug.vy<0? CUA.salto : CUA.caida;
    else if(jug.esY<0.90) cuadro = CUA.agachado;      // el cuadro de agacharse sale del aplaste
    else if(Math.abs(jug.vx)>12) cuadro = CUA.corre[Math.floor(jug.anim)%CUA.corre.length];
    else cuadro = CUA.quieto[RESPIRA[Math.floor(jug.quieto*RESPIRA_FPS)%RESPIRA.length]];
    dibujarSprite(IMG.maicol, cuadro, NCUADROS, px, py+1, 86, jug.mira, jug.esX, jug.esY);
  }
  dibujarHojas();
  dibujarParticulas();
  dibujarCartel();
}

/* ===================== EL BUCLE ===================== */
let ultimo=performance.now();
function paso(){
  requestAnimationFrame(paso);
  const ahora=performance.now();
  let dt=(ahora-ultimo)/1000; ultimo=ahora;
  if(dt>0.05) dt=0.05;                 // una pestana que vuelve no tiene que teletransportar a nadie
  if(jugando && !pausa){
    pasoFondo(dt);
    pasoMoviles(dt);
    pasoJugador(dt); pisarMoviles(dt); pasoResortes(dt); pasoBanderas();
    pasoBichos(dt); pasoEstrellas(dt); pasoMeta();
    pasoParticulas(dt); pasoSacudon(dt);
    if(cartelT>0) cartelT-=dt;
    /* la camara sigue con zona muerta: pegada al jugador marea */
    const metaX=Math.max(0, Math.min(MW*TAM-ANCHO, jug.x-ANCHO*0.42));
    camX += (metaX-camX)*Math.min(1, dt*7);
    const metaY=Math.max(0, Math.min(Math.max(0,MH*TAM-ALTO), jug.y-ALTO*0.62));
    camY += (metaY-camY)*Math.min(1, dt*5);
    dibujar();
  }
}
requestAnimationFrame(paso);

function pintarTeclas(){
  document.getElementById('teclas').innerHTML=[
    ['A D / ←→', TX('kMover')], ['Space / W', TX('kSaltar')], ['Esc', TX('kPausa')]
  ].map(([k,d])=>'<i>'+k+'</i><span>'+d+'</span>').join('');

function progreso(){ try{ return Math.max(0, Math.min(6, +(localStorage.getItem('maicol_nivel')||0))); }catch(e){ return 0; } }
function guardarProgreso(n){ try{ localStorage.setItem('maicol_nivel', String(n)); }catch(e){} }
function pintarNiveles(){
  const c=document.getElementById('niveles'); c.innerHTML='';
  const abierto=progreso();
  for(let k=0;k<NIVELES.length;k++){
    const b=document.createElement('button'); b.className='niv'+(k<abierto?' hecho':'')+(k>abierto?' trabado':'');
    b.textContent=k+1;
    if(k<=abierto){ const ir=()=>{ audioIniciar(); irANivel(k); };
      b.addEventListener('click',ir);
      b.addEventListener('touchstart',e=>{ e.preventDefault(); ir(); },{passive:false}); }
    c.appendChild(b);
  }
}
function irANivel(n){
  document.getElementById('menu').classList.add('ir');
  document.getElementById('fin').classList.remove('ver');
  setTimeout(()=>{ document.getElementById('menu').style.display='none'; }, 380);
  cargarNivel(n);
}
function alMenu(){
  jugando=false; document.body.classList.remove('jugando');
  document.getElementById('fin').classList.remove('ver');
  const m=document.getElementById('menu'); m.style.display=''; m.classList.remove('ir');
  pintarNiveles();
}
function mostrarFin(titulo, sub, botones){
  finMostrado=true; pausa=true;
  document.getElementById('finTit').textContent=titulo;
  document.getElementById('finSub').textContent=sub;
  const c=document.getElementById('finBotones'); c.innerHTML='';
  for(const [txt,fn,cls] of botones){
    const b=document.createElement('button'); b.className='bt '+(cls||''); b.textContent=txt;
    const ir=()=>{ document.getElementById('fin').classList.remove('ver'); pausa=false; fn(); };
    b.addEventListener('click',ir);
    b.addEventListener('touchstart',e=>{ e.preventDefault(); ir(); },{passive:false});
    c.appendChild(b);
  }
  document.getElementById('fin').classList.add('ver');
}
function ganar(){
  if(finMostrado) return;
  const ultimo = nivel>=NIVELES.length-1;
  son(ultimo?'final':'meta');
  if(nivel+1>progreso()) guardarProgreso(Math.min(NIVELES.length-1, nivel+1));
  if(ultimo) mostrarFin(TX('rescate'), TX('rescateS',{e:tomadas}), [[TX('alMenu'), alMenu, 'bt2']]);
  else mostrarFin(TX('ganaste'), TX('sigueS',{e:tomadas}),
        [[TX('seguir'), ()=>irANivel(nivel+1)], [TX('alMenu'), alMenu, 'bt2']]);
}
function perder(){
  if(finMostrado) return;
  mostrarFin(TX('perdiste'), TX('perdisteS'),
    [[TX('repetir'), ()=>irANivel(nivel)], [TX('alMenu'), alMenu, 'bt2']]);
}
