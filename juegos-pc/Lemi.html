     recorte con borde duro como todo lo demás. */
  fuegoMalla = new T.Group();
  for (let i = 0; i < 2; i++){
    const f = new T.Mesh(new T.ConeGeometry(0.42 - i*0.14, 1.25 - i*0.35, 5), matBrasa);
    f.position.y = 0.72 - i*0.12;
    fuegoMalla.add(f);
  }
  g.add(fuegoMalla);
  fuegoLuz = new T.PointLight(0xffa03c, 8, 26, 1.7);
  fuegoLuz.position.set(0, 1.1, 0);
  g.add(fuegoLuz);

  /* LOS TRES TRONCOS para sentarse, uno por lado y con un hueco para entrar.

     Y DE ACÁ SALEN LOS ASIENTOS, que antes eran otra lista. Los troncos estaban
     a radio 3,5 en los ángulos 0,50 · 2,59 · 4,69, y la gente se sentaba a radio
     3,4 en 5,55 · 3,62 · 4,58 · 0,28: cuatro personas en cuatro ángulos que no
     coinciden con ninguno de los tres troncos, o sea CUATRO PERSONAS SENTADAS EN
     EL AIRE al lado de los troncos. Dos listas que describen la misma cosa y que
     nadie mantiene juntas terminan así siempre. Ahora hay una sola: el tronco se
     construye y en el mismo paso deja anotado dónde se sienta uno encima, con la
     altura de SU tapa —no una constante— y mirando al fuego.

     SON CUATRO ASIENTOS EN TRES TRONCOS. El primero lleva dos, corridos sobre su
     propio eje: un tronco de 3,10 m tiene lugar de sobra para dos, y con un
     cuarto tronco no quedaría el hueco por donde se entra al círculo. */
  ASIENTOS.length = 0;
  const RT = 3.5, ALTO_T = 0.36 + 0.38;      /* eje del tronco + su radio: la tapa */
  for (let i = 0; i < 3; i++){
    const a = i/3*6.283 + 0.5;
    const t = new T.Mesh(new T.CylinderGeometry(0.36, 0.4, 3.1, 7), matCorteza);
    const px = Math.cos(a)*RT, pz = Math.sin(a)*RT;
    const suelo = H(c.x+px, c.z+pz);
    t.position.set(px, suelo - y + 0.36, pz);
    t.rotation.set(Math.PI/2, 0, -a);   /* acostado y de cara al fuego */
    t.castShadow = t.receiveShadow = true;
    g.add(t);
    /* el eje del tronco es perpendicular al radio: por ahí se corre el asiento */
    const ex = -Math.sin(a), ez = Math.cos(a);
    const corr = (i === 0) ? [-0.72, 0.72] : [0];
    for (const d of corr){
      const sx = c.x + px + ex*d, sz = c.z + pz + ez*d;
      ASIENTOS.push({ x: sx, z: sz, y: suelo + ALTO_T,
                      /* de cara al fuego, que está en el centro del campamento */
                      mira: Math.atan2(c.x - sx, c.z - sz) });
    }
  }

  /* LAS CARPAS, HUECAS DE VERDAD.
     Antes era un prisma cerrado: por fuera pasaba, pero no era una carpa sino un
     bulto. Ahora se arma con las tres piezas que tiene una carpa —EL PISO y LAS
     DOS AGUAS del techo— y se deja abierta en las dos puntas, así se entra, se
     ve el interior y la luz de la fogata se mete adentro. Las tres van a
     DoubleSide porque desde adentro se miran por el reverso. */
  /* UNA CARPA DE VERDAD NO ES UN TECHO A DOS AGUAS.
     La anterior eran tres rectángulos de lona: por fuera pasaba, pero era una
     tienda de campaña de dibujito. Una carpa iglú de las que uno lleva a acampar
     tiene ARCOS que la sostienen, la tela se CURVA entre arco y arco, tiene una
     PUERTA con el faldón enrollado a un costado, y encima va un SOBRETECHO que
     no la toca —de ahí la sombra que se le mete por debajo—.
     Todo eso se arma con dos piezas de revolución y nada más:
       · la tela: media cápsula, o sea una esfera achatada partida por el medio y
         estirada en el largo. Se hace con `SphereGeometry` cortada por phi, que
         ya trae la curvatura; deformar un plano a mano habría costado el triple
         de vértices para la misma silueta.
       · los arcos: un toro cortado a medio giro. */
  const C_ANCHO = 2.2, C_LARGO = 2.9, C_ALTO = 1.42;
  const geoTela = (() => {
    /* media esfera (phi 0..π sobre la vertical) escalada a la caja de la carpa */
    const g = new T.SphereGeometry(1, 14, 9, 0, Math.PI, 0, Math.PI/2);
    g.scale(C_LARGO/2, C_ALTO, C_ANCHO/2);
    g.rotateY(Math.PI/2);
    return g;
  })();
  const geoArco = (() => {
    const g = new T.TorusGeometry(1, 0.035, 4, 18, Math.PI);
    return g;
  })();
  const geoPiso = new T.PlaneGeometry(C_ANCHO*0.98, C_LARGO*0.98);
  const geoPuerta = new T.CircleGeometry(0.52, 12, 0, Math.PI);
  const geoRollo = new T.CylinderGeometry(0.09, 0.09, 0.62, 6);
  const geoEstaca = new T.CylinderGeometry(0.035, 0.02, 0.34, 4);
  const geoMochila = new T.BoxGeometry(0.42, 0.54, 0.30);

  /* la carpa sale FUNDIDA en tres mallas —tela, sobretecho y todo lo oscuro—
     en vez de las quince piezas sueltas que serían. Ver `fundir` en c.js. */
  function carpa(k){
    const gr = new T.Group();

    /* el sobretecho va 10 % más afuera y NO llega hasta el suelo: se corta a
       media altura. Una segunda cáscara pegada a la primera no se vería nunca;
       separada, entre las dos queda una franja de sombra, que es exactamente lo
       que hace que se lea como dos telas y no como una. */
    const tela = new T.Mesh(geoTela, matLonas[k % 3]);
    tela.castShadow = true; tela.receiveShadow = true;
    gr.add(tela);
    const sob = new T.Mesh(
      fundir([{ g: geoTela, p: [0, -0.16, 0], s: [1.10, 1.06, 1.10] },
              { g: geoRollo, p: [0.44, 0.34, C_LARGO/2 - 0.02], r: [0, 0, 0.12] }]),
      matSobre[k % 3]);
    sob.castShadow = true;
    gr.add(sob);

    /* TODO LO OSCURO EN UNA: el piso, los dos arcos cruzados como los de una
       iglú, la puerta, los cuatro vientos con sus estacas y la mochila.
       La PUERTA es lo que convierte un bulto en una carpa: un semicírculo
       oscuro hundido en la tela —el interior— con el faldón enrollado al lado.
       Va en la cara de +Z, o sea la que se orienta al fuego.
       La MOCHILA tirada al lado es lo que dice que alguien la está usando: una
       carpa sin nada alrededor se lee a carpa de catálogo. */
    const oscuras = [
      { g: geoPiso, p: [0, 0.02, 0], r: [-Math.PI/2, 0, 0] },
      { g: geoArco, p: [0, 0.01, 0], r: [0,  0.62, 0], s: [C_ANCHO/2*1.02, C_ALTO*1.02, 1] },
      { g: geoArco, p: [0, 0.01, 0], r: [0, -0.62, 0], s: [C_ANCHO/2*1.02, C_ALTO*1.02, 1] },
      { g: geoPuerta, p: [0, 0.02, C_LARGO/2 - 0.06], s: [1, 1.25, 1] },
      { g: geoMochila, p: [C_ANCHO/2 + 0.28, 0.27, C_LARGO/2 - 0.5], r: [0.28, 0.5, 0.14] }
    ];
    /* los vientos: de la cumbrera a cuatro estacas. Sin ellos la carpa flota */
    const _a = new T.Vector3(), _b = new T.Vector3(), _q = new T.Quaternion(), _e = new T.Euler();
    for (const sz of [-1, 1]) for (const sx of [-1, 1]){
      const ex = sx * (C_ANCHO/2 + 0.55), ez = sz * (C_LARGO/2 + 0.45);
      _a.set(sx*0.30, C_ALTO*0.86, sz*C_LARGO*0.30);
      _b.set(ex, 0.05, ez);
      const largo = _a.distanceTo(_b);
      _q.setFromUnitVectors(new T.Vector3(0,1,0), _b.clone().sub(_a).normalize());
      _e.setFromQuaternion(_q);
      oscuras.push({ g: new T.CylinderGeometry(0.014, 0.014, largo, 3),
                     p: [(_a.x+_b.x)/2, (_a.y+_b.y)/2, (_a.z+_b.z)/2],
                     r: [_e.x, _e.y, _e.z] });
      oscuras.push({ g: geoEstaca, p: [ex, 0.1, ez] });
    }
    const osc = new T.Mesh(fundir(oscuras), matNylon);
    osc.castShadow = true; osc.receiveShadow = true;
    gr.add(osc);
    return gr;
  }
  /* LAS TRES MIRAN AL FUEGO. Antes se orientaban con un `+Math.random()` y una
     quedaba de espaldas: la puerta daba al bosque y desde la fogata se veía el
     fondo de la carpa. Con la puerta en +Z, apuntar +Z al centro es girar
     `a + π`, y el desorden queda en un pelo de ángulo, que es lo que hace un
     campamento de verdad y no un desorden que tape la puerta. */
  CARPAS = [];
  for (let i = 0; i < 3; i++){
    const a = i/3*6.283 + 1.9, r = 8.2 + (i%2)*1.4;
    const px = Math.cos(a)*r, pz = Math.sin(a)*r;
    const k = carpa(i);
    k.position.set(px, H(c.x+px, c.z+pz) - y, pz);
    k.rotation.y = a + Math.PI + (Math.random()-0.5)*0.22;
    g.add(k);
    /* LA MALLA VIAJA CON LA POSICIÓN. La cinemática del armado necesita poder
       apagar y prender cada carpa, y con sólo las coordenadas no hay a qué
       agarrarse: habría que buscarla por posición entre los hijos del grupo,
       que es exactamente el tipo de búsqueda que se rompe el día que se agrega
       otra cosa en el mismo lugar. */
    CARPAS.push({ x: c.x + px, z: c.z + pz, malla: k });
  }

  g.position.set(c.x, y, c.z);
  escena.add(g); GRUPOS.push(g);

  /* ── LA CAMIONETA, estacionada ──
     Va en el HUECO ENTRE DOS CARPAS y no en un ángulo cualquiera: las tres
     carpas salen de `i/3·2π + 1,9`, o sea 1,90 · 3,99 · 6,09 rad, y 0,81 es el
     medio del hueco más grande. Puesta al azar podía quedar encima de una carpa
     o de sus vientos, que llegan a once metros y medio del centro.
     Y va DERECHA, sin seguir la pendiente: el campamento se eligió por ser lo
     más llano de la isla, así que inclinarla sería inventar un desnivel que no
     está. El morro mira para afuera, que es como estaciona cualquiera. */
  const aa = 0.81, ar = 12.6;
  const ax = c.x + Math.cos(aa)*ar, az = c.z + Math.sin(aa)*ar;
  const auto = armaAuto3D();
  auto.position.set(ax, H(ax, az), az);
  auto.rotation.y = Math.atan2(ax - c.x, az - c.z);
  escena.add(auto); GRUPOS.push(auto);
  AUTO = { g: auto, x: ax, z: az, y: H(ax, az), ry: auto.rotation.y };
}

/* ══════════════════════════ LA CUEVA ══════════════════════════
   Se elige ANTES de armar el terreno, porque el cuenco que la hunde vive dentro
   de `H()` y la malla del terreno se construye leyendo `H()`.

   VA EN UNA LADERA Y NO EN LO LLANO, y ésa es toda la diferencia entre una
   cueva y un pozo: lo que hace que se lea como una boca es que haya monte
   ENCIMA. Se busca la pendiente más marcada dentro de un anillo alrededor del
   campamento —lo bastante lejos para que llegar sea un viaje, lo bastante cerca
   para que el rastro de sangre no dé la vuelta a la isla—, y se orienta mirando
   hacia abajo de la ladera, que es por donde uno llega caminando. */
function eligeCueva(campo){
  let mejor = null, mejorP = -1e9;
  for (let a = 0; a < 6.283; a += 0.09){
    for (let r = 88; r <= 150; r += 4){
      const x = campo.x + Math.cos(a)*r, z = campo.z + Math.sin(a)*r;
      if (Math.hypot(x, z) > MITAD*0.80) continue;
      const h = H(x, z), pe = pendiente(x, z);
      if (h < PLAYA + 6) continue;                 /* ni en la playa ni en el mar */
      const p = pe*10 + h*0.05 - Math.abs(r - 115)*0.02;
      if (p > mejorP){ mejorP = p; mejor = { x, z, h, a }; }
    }
  }
  if (!mejor) return null;
  /* hacia dónde baja la ladera: la boca mira para allá */
  const e = 3.0;
  const gx = H(mejor.x + e, mejor.z) - H(mejor.x - e, mejor.z);
  const gz = H(mejor.x, mejor.z + e) - H(mejor.x, mejor.z - e);
  const baja = Math.atan2(-gx, -gz);              /* el sentido de bajada */
  /* el cerro va detrás de la boca, en el sentido contrario al que uno llega.
     Los números están elegidos para que en la boca las dos cosas casi se
     cancelen —a veinte metros del centro de una loma de radio cuarenta, el
     coseno elevado vale un cuarto, o sea +4,5 m contra los −5,2 del cuenco—
     así que el piso de la entrada queda a la altura del terreno de siempre y lo
     que crece es todo lo que hay alrededor y por encima. */
  const c = { x: mejor.x, z: mejor.z, r: 12.5, hondo: 5.4, mira: baja,
              mr: 40, malto: 18 };
  c.mx = mejor.x - Math.sin(baja)*20;
  c.mz = mejor.z - Math.cos(baja)*20;
  c.h = 0;              /* se rellena con H() ya excavada, más abajo */
  return c;
}

const texPiedra = lienzoTex(48, (g,n) => {
  moteado(g, n, '#9c9282', '#b8af9c', '#736a5b', 0.55);
  g.fillStyle = '#3f3a33';
  for (let i = 0; i < 16; i++){ const y=(Math.random()*n)|0; g.fillRect(0,y,n,1); }
  for (let i = 0; i < 10; i++){ const x=(Math.random()*n)|0; g.fillRect(x,0,1,n); }
});
const matPiedra = new T.MeshLambertMaterial({ map: texPiedra, flatShading: true });
/* EL FONDO DE LA CUEVA VA SIN LUZ Y EN NEGRO CASI PURO. Un fondo sombreado
   igual devuelve algo de la hemisférica y entonces se le ve el final: el agujero
   deja de ser un agujero y pasa a ser un nicho. En negro plano no tiene fondo. */
const matNegro = new T.MeshBasicMaterial({ color: 0x05070a });

function armaCueva(c){
  const g = new T.Group();
  /* LA BOCA: un arco de bloques de piedra hundido en la ladera, con el túnel
     detrás. Los bloques van en un semicírculo y con tamaños desparejos, porque
     un arco de piezas iguales se lee a puerta construida y no a roca partida. */
  const piezas = [];
  const N = 17, RA = 4.4;
  for (let i = 0; i < N; i++){
    const t = i/(N-1), an = Math.PI*t;
    const s = 0.85 + Math.random()*0.55;
    piezas.push({ g: new T.BoxGeometry(1.5*s, 1.35*s, 2.2),
                  p: [Math.cos(an)*RA, Math.sin(an)*RA*0.92, 0],
                  r: [(Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, -an + Math.PI/2] });
  }
  /* piedras sueltas al pie, que es lo que hay en la boca de una cueva */
  for (let i = 0; i < 9; i++){
    const s = 0.5 + Math.random()*0.9;
    piezas.push({ g: new T.IcosahedronGeometry(s, 0),
                  p: [(Math.random()-0.5)*8, 0.1 + Math.random()*0.3, 1.2 + Math.random()*2.2],
                  r: [Math.random()*3, Math.random()*3, Math.random()*3] });
  }
  const arco = new T.Mesh(fundir(piezas), matPiedra);
  arco.castShadow = true; arco.receiveShadow = true;
  g.add(arco);

  /* EL TÚNEL: un cilindro abierto metido en el cerro, tapado al fondo. Da la
     profundidad que el cuenco del terreno no puede dar —un mapa de alturas no
     tiene techo— y es lo que hace que desde afuera se vea que sigue. */
  /* EL NEGRO VA PEGADO A LA BOCA, Y ESO SALE DE UNA CUENTA DEL TERRENO.
     Estaba dieciocho metros adentro, con un túnel largo delante. Pero el cerro
     que se levanta detrás de la boca sube 2,8 m en los primeros tres metros y
     6,3 m en cinco —es una ladera, para eso se la puso—, así que el túnel y su
     fondo quedaban ENTERRADOS: en la captura no había agujero, había un montón
     de piedras oscuras sobre el pasto. Con el negro a metro y medio, delante de
     donde el suelo empieza a trepar, el arco se lee como lo que es. El túnel se
     queda corto, sólo para que el canto tenga espesor. */
  const tun = new T.Mesh(
    new T.CylinderGeometry(RA*0.84, RA*0.84, 6, 12, 1, true), matPiedra);
  tun.rotation.x = Math.PI/2;
  tun.position.set(0, RA*0.48, -2.6);
  tun.material.side = T.DoubleSide;
  g.add(tun);
  const fondo = new T.Mesh(new T.CircleGeometry(RA*0.84, 12), matNegro);
  fondo.position.set(0, RA*0.48, -5.2);
  g.add(fondo);

  g.position.set(c.x, H(c.x, c.z), c.z);
  g.rotation.y = c.mira;
  escena.add(g); GRUPOS.push(g);
  /* dónde se para uno cuando llega: cinco metros delante de la boca */
  c.frenteX = c.x + Math.sin(c.mira)*7.5;
  c.frenteZ = c.z + Math.cos(c.mira)*7.5;
}

/* mojón de piedras en la cima: se ve desde media isla */
function armaMojon(c){
  const g = new T.Group();
  for (let i = 0; i < 9; i++){
    const t = i/9;
    const m = new T.Mesh(new T.IcosahedronGeometry(0.85*(1-t*0.62), 0), matRoca);
    m.position.set((Math.random()-0.5)*0.3, t*3.4, (Math.random()-0.5)*0.3);
    m.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(c.x, c.h, c.z);
  escena.add(g); GRUPOS.push(g);
}

/* círculo de piedras paradas */
function armaCirculo(c){
  const g = new T.Group();
  for (let i = 0; i < 8; i++){
    const a = i/8*6.283, r = 6.5;
    const alto = 2.6 + Math.random()*2.2;
    const m = new T.Mesh(new T.BoxGeometry(1.1, alto, 0.7), matRoca);
    const px = Math.cos(a)*r, pz = Math.sin(a)*r;
    m.position.set(px, H(c.x+px, c.z+pz) - c.h + alto/2 - 0.2, pz);
    m.rotation.set((Math.random()-0.5)*0.14, a, (Math.random()-0.5)*0.12);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(c.x, c.h, c.z);
  escena.add(g); GRUPOS.push(g);
}

/* arco de piedra en la costa */
function armaArco(c){
  const g = new T.Group();
  const N = 11;
  for (let i = 0; i < N; i++){
    const t = i/(N-1), a = Math.PI*t;
    const m = new T.Mesh(new T.BoxGeometry(2.1, 1.9, 2.6), matRoca);
    m.position.set(Math.cos(a)*5.2, Math.sin(a)*5.6, 0);
    m.rotation.set((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, -a + Math.PI/2);
    m.scale.setScalar(0.85 + Math.random()*0.35);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(c.x, c.h - 0.4, c.z);
  g.rotation.y = Math.random()*3.14;
  escena.add(g); GRUPOS.push(g);
}

function eligeSitios(){
  /* EL CAMPAMENTO VA EN EL CENTRO DE LA ISLA. No se busca por toda la isla: se
     busca el punto más llano DENTRO de un radio corto del origen, así queda
     siempre en el medio —que es donde uno lo espera— pero sin que la fogata
     termine colgada de una ladera. */
  CAMPO = null;
  { let mejorP = -1e9;
    for (let r = 0; r <= 34; r += 2){
      for (let a = 0; a < 6.283; a += (r < 1 ? 7 : 0.24)){
        const x = Math.cos(a)*r, z = Math.sin(a)*r;
        const h = H(x, z), pe = pendiente(x, z);
        if (h < PLAYA + 1.0) continue;
        const pun = (1 - pe*5)*4 - r*0.035;
        if (pun > mejorP){ mejorP = pun; CAMPO = { x, z, h }; }
      }
    }
  }
  if (!CAMPO) CAMPO = { x: 0, z: 0, h: Math.max(H(0,0), PLAYA + 1.4) };
  const usados = [CAMPO];

  const cima = buscaSitio((h, pe) => pe < 0.5, h => h, usados, 130);
  const circ = buscaSitio((h, pe) => h > PLAYA + 3 && h < 30 && pe < 0.18,
                          (h, pe) => (1 - pe*4)*2 + h*0.05, usados, 120);
  const arco = buscaSitio((h, pe) => h > PLAYA - 0.5 && h < PLAYA + 2.2 && pe < 0.3,
                          (h, pe, x, z) => Math.hypot(x, z)/MITAD*3 - pe, usados, 120);
  SITIOS = [{ t:'campamento', c: CAMPO }];
  if (cima) SITIOS.push({ t:'mojón', c: cima });
  if (circ) SITIOS.push({ t:'círculo', c: circ });
  if (arco) SITIOS.push({ t:'arco', c: arco });
  /* EL CLARO DEL CAMPAMENTO CRECE DE 13 A 17 METROS, y no es por gusto: la
     camioneta está a 12,6 del centro y mide 4,3 de largo, así que con el claro
     viejo los árboles brotaban PEGADOS a ella —en la captura de frente había un
     tronco justo delante del capó, tapando lo único que había que mirar—. Con
     17 quedan cuatro metros de aire alrededor del auto. */
  CLAROS = SITIOS.map(s2 => ({ x: s2.c.x, z: s2.c.z, r: s2.t === 'campamento' ? 17 : 9 }));
}
function armaSitios(){
  fuegoLuz = null; fuegoMalla = null;
  if (CUEVA) armaCueva(CUEVA);
  for (const s2 of SITIOS){
    if (s2.t === 'campamento') armaCampamento(s2.c);
    else if (s2.t === 'mojón') armaMojon(s2.c);
    else if (s2.t === 'círculo') armaCirculo(s2.c);
    else if (s2.t === 'arco') armaArco(s2.c);
  }
}

/* ══════════════════════════ LAS NUBES ══════════════════════════
   Cúmulos gordos: racimos de icosaedros de una sola subdivisión, planos, en
   blanco casi puro. Con flatShading y el hemisférico, la panza les queda
   azulada sola y arriba les pega el sol. Nada de billboards ni de alfa: son
   volumen de verdad, y por eso se pixelan bien en los bordes. */
let nubes = null, matNube = null;
function armaNubes(){
  if (nubes){ escena.remove(nubes); nubes.geometry.dispose(); }
  const trozos = [];
  const RACIMOS = 54;
  for (let i = 0; i < RACIMOS; i++){
    /* LEJOS Y ALTAS. Con el radio mínimo en 60 había cúmulos a la altura de las
       copas y encima de la cabeza: se veían como globos estirados en vez de
       nubes. Un cúmulo se lee como cúmulo cuando está lejos y arriba. */
    const a = Math.random()*6.283, d = 190 + Math.random()*430;
    const cx = Math.cos(a)*d, cz = Math.sin(a)*d;
    const cy = 105 + Math.random()*95;
    const esc = 7 + Math.random()*11;
    const n = 9 + ((Math.random()*9)|0);
    for (let k = 0; k < n; k++){
      /* la panza plana y la coronilla redonda: los trozos de abajo se achatan */
      const t = Math.random();
      const alto = (Math.random()-0.25);
      trozos.push({
        x: cx + (Math.random()-0.5)*esc*2.7,
        y: cy + alto*esc*0.62,
        z: cz + (Math.random()-0.5)*esc*2.7,
        sx: esc*(0.52+Math.random()*0.58),
        sy: esc*(0.30+Math.random()*0.26)*(alto > 0 ? 1.15 : 0.72),
        sz: esc*(0.52+Math.random()*0.58),
        /* SOLO giro en Y: con rotación libre el icosaedro achatado se acuesta y
           la nube pasa a ser una cápsula tumbada. El eje chato tiene que quedar
           vertical siempre. */
        rx: 0, ry: Math.random()*6.283, rz: 0
      });
    }
  }
  const g = new T.IcosahedronGeometry(1, 1);
  /* con emisivo la panza de la nube no se va a gris: un cúmulo real rebota
     tanta luz adentro que nunca se ve oscuro desde abajo */
  const m = new T.MeshLambertMaterial({ color: 0xffffff, emissive: 0xcfe6ff,
    emissiveIntensity: 0.55, flatShading: true, fog: false });
  const im = new T.InstancedMesh(g, m, trozos.length);
  const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler();
  trozos.forEach((o, i) => {
    e.set(o.rx, o.ry, o.rz); q.setFromEuler(e);
    m4.compose(new T.Vector3(o.x,o.y,o.z), q, new T.Vector3(o.sx,o.sy,o.sz));
    im.setMatrixAt(i, m4);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = false; im.receiveShadow = false;
  im.frustumCulled = false;
  nubes = im; escena.add(im);
  matNube = m;
}

/* ══════════════════════════ EL PIXELADO ══════════════════════════
   La escena entera va a un render target chico con filtro NEAREST, y este
   material lo estira a pantalla completa haciendo de paso el grado de color.
   Trabaja sobre valores YA en sRGB —el render target los codifica al
   escribir— así que saturación y brillo se comportan como uno espera de esas
   dos palabras, y no como una curva rara en espacio lineal. */
let rt = null;
const postMat = new T.ShaderMaterial({
  uniforms: {
    tex:  { value: null },
    sat:  { value: CFG.sat },
    bri:  { value: CFG.bri },
    con:  { value: CFG.con },
    pos:  { value: CFG.pos },
    vig:  { value: 0.46 },
    rojo: { value: 0.0 }
  },
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tex; uniform float sat, bri, con, pos, vig, rojo; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tex, vUv).rgb;
      c *= bri;
      c = (c - 0.5) * con + 0.5;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, sat);
      /* LA VIÑETA VA ANTES DE LAS BANDAS. Puesta después quedaba como un
         degradado suave encima de una imagen escalonada, y se notaba que era un
         filtro pegado. Cortada en los mismos niveles de color, el oscurecimiento
         de las esquinas avanza a saltos igual que el resto del cuadro. */
      vec2 d = vUv - 0.5;
      float r2 = dot(d, d);
      c *= 1.0 - r2 * vig - r2 * r2 * vig * 1.35;
      /* LA VIÑETA ROJA DE ESTAR ROTO VA ACÁ ADENTRO Y NO EN UNA CAPA DE CSS, y
         por eso sale pixelada. Todo esto se dibuja en el destino de render
         chico y recién después se estira con NEAREST: cualquier cosa que entre
         antes del posterizado sale con los mismos escalones y los mismos
         píxeles gordos que el resto del juego. La primera versión era un
         un box-shadow de CSS encima del lienzo, o sea un degradado suave y
         continuo pegado sobre una imagen escalonada — se leía como el filtro de
         daño de otro juego puesto arriba de éste. */
      if (rojo > 0.001){
        float m = smoothstep(0.10, 0.62, r2) * rojo;
        c = mix(c, vec3(0.46, 0.03, 0.02), m * 0.80);
        c *= 1.0 - m * 0.30;
      }
      if (pos > 1.5){ c = floor(c * pos + 0.5) / pos; }   /* bandas de color */
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`,
  depthTest: false, depthWrite: false
});
const postEsc = new T.Scene();
const postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let W = 1, H2 = 1, GIRADO = false;
CFG.girar = true;

/* ══════ COORDENADAS DEL ESCENARIO ══════
   Con el escenario girado, un dedo que cruza la pantalla de izquierda a derecha
   se mueve en VERTICAL en coordenadas de ventana. Si los controles leen
   `clientX/clientY` a secas, mirar y caminar quedan cruzados y espejados.
   Todo lo que toca el dedo pasa por acá.

   El escenario se coloca con `rotate(90deg) translateY(-100%)` y origen arriba
   a la izquierda, así que un punto local (x,y) cae en la ventana en
   (altoEscenario - y, x). Invirtiéndolo: x = clientY, y = anchoVentana - clientX. */
function pt(e){
  if (!GIRADO) return { x: e.clientX, y: e.clientY };
  return { x: e.clientY, y: window.innerWidth - e.clientX };
}
/* el rectángulo de un elemento, también en coordenadas del escenario. Un giro
   de 90° deja el rectángulo alineado a los ejes, así que la conversión es exacta */
function rectEsc(el){
  const r = el.getBoundingClientRect();
  if (!GIRADO) return { x: r.left, y: r.top, w: r.width, h: r.height };
  return { x: r.top, y: window.innerWidth - r.right, w: r.height, h: r.width };
}

function medir(){
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  /* se gira sólo si hace falta: aparato en vertical y la opción encendida */
  GIRADO = !!CFG.girar && vh > vw;
  document.body.classList.toggle('girado', GIRADO);
  W = GIRADO ? vh : vw;
  H2 = GIRADO ? vw : vh;
  const esc = document.getElementById('escenario');
  esc.style.width = W + 'px'; esc.style.height = H2 + 'px';
  /* EL ALTO DEL ESCENARIO, PUBLICADO COMO VARIABLE, y hace falta porque con el
     escenario GIRADO las unidades `vh` del CSS miden el eje equivocado: `vh` es
     el alto de la VENTANA, y con el teléfono en vertical eso son los 892 px del
     lado largo mientras que el alto del cuadro jugable son los 412 del corto.
     Medido: un `max-height:20vh` daba 178 px —el 20 % de 892— y el logo del menú
     empujaba el pie fuera del marco. Todo lo que se mida en proporción al alto
     del cuadro tiene que usar `--eh`, no `vh`. */
  esc.style.setProperty('--eh', H2 + 'px');
  esc.style.setProperty('--ew', W + 'px');
  ren.setSize(W, H2, false);
  cam.aspect = W / H2; cam.updateProjectionMatrix();
  const w = Math.max(1, Math.ceil(W / CFG.pix)), h = Math.max(1, Math.ceil(H2 / CFG.pix));
  if (rt) rt.dispose();
  rt = new T.WebGLRenderTarget(w, h, {
    minFilter: T.NearestFilter, magFilter: T.NearestFilter,
    depthBuffer: true, stencilBuffer: false,
    colorSpace: T.SRGBColorSpace       /* codifica al escribir: ver comentario de arriba */
  });
  postMat.uniforms.tex.value = rt.texture;
}

/* ══════════════════════════ CÁMARA Y CONTROLES ══════════════════════════ */
const JUG = { x: 0, z: 0, y: 0, vy: 0, aire: false, yaw: 0, pitch: -0.06, vuela: false, agacha: false };
const OJO = 1.72, VEL = 6.4, CORRE = 12.8, GRAV = 22, SALTO = 8.2;
let corre = false;
/* estado del CABECEO: fase del paso, amplitudes suavizadas y el golpe al caer */
const AND = { fase: 0, v: 0, ojo: OJO, roll: 0, dip: 0, lado: 0, fov: 66, golpe: 0 };
function saltar(){
  if (JUG.vuela || JUG.aire || PAUSA) return;
  JUG.vy = SALTO * (JUG.agacha ? 0.72 : 1); JUG.aire = true;
}
function ponAgacha(v){
  JUG.agacha = !!v;
  const b = document.getElementById('acAgacha');
  if (b) b.classList.toggle('on', JUG.agacha);
}
const teclas = {};
const movV = { x: 0, y: 0 };

/* dónde empezar: un punto de la isla que esté sobre la playa y no empinado */
/* BARRIDO EN REJILLA, NO SORTEO. Antes tiraba 900 puntos al azar y si ninguno
   servía te dejaba en el origen —que puede estar bajo el agua—. Ahora recorre
   una rejilla y se queda con el MEJOR candidato, así siempre hay respuesta y
   además es la misma para la misma isla. */
function ubicaInicio(){
  let mejor = null, mejorP = -1e9;
  for (let gx = -0.72; gx <= 0.72; gx += 0.045){
    for (let gz = -0.72; gz <= 0.72; gz += 0.045){
      const x = gx*MITAD, z = gz*MITAD;
      const h = H(x, z);
      if (h < PLAYA + 0.4) continue;
      const s = pendiente(x, z);
      if (s > 0.36) continue;
      /* se premia lo llano y una altura de mirador, y se castiga el borde */
      const p = (1 - s*2) * 3 + (1 - Math.abs(h - 13)/22) * 2.4 - Math.hypot(gx, gz);
      if (p > mejorP){ mejorP = p; mejor = { x, z, h }; }
    }
  }
  if (!mejor){
    /* isla toda sumergida (puede pasar con una semilla mala): se sube el punto */
    mejor = { x: 0, z: 0, h: Math.max(H(0,0), PLAYA + 1.2) };
  }
  JUG.x = mejor.x; JUG.z = mejor.z; JUG.y = mejor.h;
  JUG.vy = 0; JUG.aire = false; JUG.vuela = false;
  JUG.yaw = Math.atan2(mejor.x, mejor.z);   /* mismo signo que arriba */
}

let jd = null;

function joyMueve(e){
  const r = rectEsc($('joy')), q = pt(e);
  let dx = (q.x - (r.x + r.w/2)) / (r.w/2);
  let dy = (q.y - (r.y + r.h/2)) / (r.h/2);
  const d = Math.hypot(dx, dy);
  if (d > 1){ dx /= d; dy /= d; }
  movV.x = dx; movV.y = dy;
  /* la palanca a fondo ya no fuerza correr: para eso está el botón, y así se
     puede caminar despacio sin que se dispare sola */
  joyDibuja();
}

/* ══════════════════════════ FÍSICA ══════════════════════════ */
function fisica(dt){
  let mx = movV.x, my = movV.y;
  if (teclas.KeyW) my -= 1; if (teclas.KeyS) my += 1;
  if (teclas.KeyA) mx -= 1; if (teclas.KeyD) mx += 1;
  if (teclas.ArrowLeft) JUG.yaw += 2.1*dt; if (teclas.ArrowRight) JUG.yaw -= 2.1*dt;
  if (teclas.ArrowUp) JUG.pitch = cl(JUG.pitch + 1.6*dt, -1.35, 1.35);
  if (teclas.ArrowDown) JUG.pitch = cl(JUG.pitch - 1.6*dt, -1.35, 1.35);
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  /* agachado se anda a la mitad y no se puede correr, que es lo que hace que
     agacharse sea una decisión y no un botón de adorno */
  /* CON LA PIERNA ROTA CAMBIAN LAS DOS VELOCIDADES, no una. Bajando sólo la de
     correr, caminar seguiría siendo normal y lo único que se notaría es que el
     botón de correr dejó de hacer algo. Y el tope de correr queda POR DEBAJO de
     la embestida del camello (7,4), que es lo que hace que la huida sea una
     huida y no un trámite. */
  const spBase = JUG.agacha ? VEL*0.42
               : ROTO.on ? (corre ? 6.4 : 4.6)
               : (corre ? CORRE : VEL);
  const sp = spBase * (JUG.vuela ? 2.6 : 1) * factorRoto();
  AND.v = Math.hypot(vxAnt, vzAnt);
  const sy = Math.sin(JUG.yaw), cy = Math.cos(JUG.yaw);
  const vx = (-sy * -my + cy * mx) * sp;
  const vz = (-cy * -my - sy * mx) * sp;
  vxAnt = vx; vzAnt = vz; ladoAnt = mx;

  JUG.x = cl(JUG.x + vx*dt, -MITAD+3, MITAD-3);
  JUG.z = cl(JUG.z + vz*dt, -MITAD+3, MITAD-3);

  /* ADENTRO DE LA CUEVA MANDA EL PASILLO Y NO EL MAPA DE ALTURAS. Se recorta
     DESPUÉS de mover y no antes: recortando antes, el jugador se mueve y recién
     al cuadro siguiente se lo devuelve adentro, o sea que se lo ve salir. */
  recortaCueva();

  const suelo = ENCUEVA ? JUG.y : Math.max(H(JUG.x, JUG.z), MAR - 0.6);
  if (JUG.vuela){
    if (teclas.Space) JUG.y += sp*0.6*dt;
    if (teclas.ShiftLeft) JUG.y -= sp*0.6*dt;
    JUG.y = Math.max(JUG.y, suelo + 0.5);
  } else {
    if (JUG.aire){
      JUG.vy -= GRAV*dt; JUG.y += JUG.vy*dt;
      if (JUG.y <= suelo){
        /* EL GOLPE AL CAER: cuanto más fuerte, más se hunde la cámara. Es medio
           segundo de nada y es lo que hace que un salto se sienta con peso. */
        AND.golpe = Math.min(0.42, Math.max(0, -JUG.vy) * 0.032);
        JUG.y = suelo; JUG.vy = 0; JUG.aire = false;
      }
    } else {
      /* el ojo persigue al suelo en vez de pegarse: sin esto cada escalón del
         terreno es un tirón vertical */
      JUG.y = lerp(JUG.y, suelo, Math.min(1, dt*11));
      if (Math.abs(suelo - JUG.y) > 3) JUG.y = suelo;
    }
  }
  ponCam(dt);
}
let vxAnt = 0, vzAnt = 0, ladoAnt = 0;

/* ══════════════════════════ EL CABECEO ══════════════════════════
   Lo que separa una cámara que flota de una que camina. Cuatro cosas a la vez,
   todas atadas a la MISMA fase del paso para que no se peleen:

     · sube y baja dos veces por zancada (el apoyo de cada pie);
     · se corre de lado una vez por zancada, en contrafase;
     · se INCLINA sobre su eje —el roll— que es lo que de verdad se lee como
       caminar, y además se ladea al andar de costado;
     · abre el campo de visión al correr y lo cierra al frenar.

   Las amplitudes se persiguen con lerp en vez de saltar: si el cabeceo aparece
   de golpe al empezar a andar, se nota como un tirón. */
function ponCam(dt){
  const rapido = cl(AND.v / CORRE, 0, 1);
  const andando = cl(AND.v / VEL, 0, 1);
  const enSuelo = !JUG.aire && !JUG.vuela;

  /* la fase avanza con la velocidad: los pasos se aceleran solos al correr */
  const faseAnt = AND.fase;
  if (enSuelo) AND.fase += dt * (2.7 + AND.v * 0.62);
  else AND.fase += dt * 1.2;

  /* LA PISADA VA ATADA A LA FASE DEL PASO Y NO A UN TEMPORIZADOR. Un reloj
     aparte se desincroniza del cabeceo en cuanto cambia la velocidad, y ahí el
     sonido deja de caer donde cae el pie. Hay DOS apoyos por vuelta —uno por
     pierna— así que suena cada vez que la fase cruza un múltiplo de π. Es la
     misma corrección que en Maicol convirtió veinticuatro pisadas por segundo
     superpuestas —o sea ruido blanco— en un trote.
     Y sólo si se está moviendo de verdad: parado, la fase igual avanza. */
  if (enSuelo && AND.v > 0.6 && MODO === 'juego' && !PAUSA){
    if (Math.floor(AND.fase / Math.PI) !== Math.floor(faseAnt / Math.PI))
      son2('paso', 0.55 + cl(AND.v / CORRE, 0, 1) * 0.45);
  }

  /* EL BALANCEO EMPIEZA AL CAMINAR, no al correr. La amplitud arranca en un
     valor propio en cuanto te movés y el correr sólo la agranda; antes crecía
     desde cero con la velocidad y a paso normal casi no se veía. */
  const amp = enSuelo ? cl(andando * 1.35, 0, 1) : 0;
  const base = amp > 0.02 ? 0.052 : 0;
  let arriba = Math.abs(Math.sin(AND.fase)) * (base + rapido*0.052) * amp;
  let costado = Math.cos(AND.fase) * (0.042 + rapido*0.042) * amp;
  /* LA COJERA VA A LA MITAD DE LA FRECUENCIA DEL PASO, y ahí está todo: el
     balanceo normal sube y baja una vez por PISADA, así que las dos piernas se
     ven iguales. A la mitad, un paso apoya y el otro se hunde — que es lo que
     hace una renguera. Con el mismo ritmo sólo se lee «tiembla más». */
  if (ROTO.on){
    const c = Math.sin(AND.fase*0.5);
    arriba -= Math.max(0, c) * 0.085 * amp;
    costado += c * 0.055 * amp;
  }

  /* BALANCEO QUIETO: la respiración. Con la cámara clavada del todo el mundo
     parece una foto; con esto respira sin marear. */
  const quieto = cl(1 - andando*1.6, 0, 1) * (enSuelo ? 1 : 0);
  const resp = Math.sin(RELOJ.value * 1.05) * 0.020 * quieto;
  const respLado = Math.sin(RELOJ.value * 0.58 + 1.2) * 0.014 * quieto;
  const respRoll = Math.sin(RELOJ.value * 0.47 + 2.1) * 0.0075 * quieto;

  /* el ojo: altura de pie o agachado, persiguiendo para que no salte */
  const objOjo = OJO * (JUG.agacha ? 0.74 : 1);   /* menos hondo que antes */
  AND.ojo = lerp(AND.ojo, objOjo, Math.min(1, dt*9));
  AND.golpe = lerp(AND.golpe, 0, Math.min(1, dt*6));
  AND.lado = lerp(AND.lado, ladoAnt, Math.min(1, dt*7));

  /* roll: el vaivén del paso más la inclinación al andar de costado */
  const objRoll = Math.cos(AND.fase) * (0.020 + rapido*0.022) * amp
                - AND.lado * 0.062 + respRoll;
  AND.roll = lerp(AND.roll, objRoll, Math.min(1, dt*10));

  /* el campo de visión se abre al correr: la sensación de velocidad sale de acá */
  const objFov = 66 + rapido*9 - (JUG.agacha ? 3 : 0);
  AND.fov = lerp(AND.fov, objFov, Math.min(1, dt*3.4));
  if (Math.abs(cam.fov - AND.fov) > 0.02){ cam.fov = AND.fov; cam.updateProjectionMatrix(); }

  const sy = Math.sin(JUG.yaw), cy = Math.cos(JUG.yaw);
  cam.position.set(
    JUG.x + cy * (costado + respLado),
    JUG.y + AND.ojo + arriba + resp - AND.golpe,
    JUG.z - sy * (costado + respLado)
  );
  cam.rotation.order = 'YXZ';
  cam.rotation.y = JUG.yaw;
  /* un pelo de cabeceo vertical en cada apoyo, y el hundimiento del aterrizaje */
  cam.rotation.x = JUG.pitch + Math.sin(AND.fase*2) * 0.006 * amp - AND.golpe*0.55;
  cam.rotation.z = AND.roll;
  /* EL DESPLOME. Se cae al piso y se levanta, y la cámara lo hace ENTERA: baja
     hasta cuarenta centímetros del suelo y se tuerce. Con sólo quitarle el
     control al jugador no se entendería qué pasó. */
  if (ROTO.on && ROTO.cae > 0){
    const u = 1 - ROTO.cae/1.35;                 /* 0 recién caído, 1 de pie */
    const hondo = Math.sin(Math.min(1, u*1.25) * Math.PI);
    cam.position.y -= hondo * (AND.ojo - 0.42);
    cam.rotation.z += hondo * 0.55;
    cam.rotation.x -= hondo * 0.30;
  }
}

/* ══════════════════════════ EL DÍA Y LA NOCHE ══════════════════════════
   Ciclo completo en tres minutos. La fase va de 0 a 1: 0 es medianoche, 0,25 el
   amanecer, 0,5 el mediodía y 0,75 el atardecer. De ahí sale TODO —altura del
   sol, color de la luz, cielo, niebla, estrellas y la luna—, así nunca se
   desincroniza una cosa de la otra. */
const luna = new T.DirectionalLight(0xbcd4ff, 0);
escena.add(luna); escena.add(luna.target);

/* las estrellas: un puñado de puntos en la esfera del cielo que sólo se ven de
   noche. Van sin niebla y sin profundidad para que no las tape nada. */
const estrellas = (() => {
  const N = 900, pos = new Float32Array(N*3), tam = new Float32Array(N);
  for (let i = 0; i < N; i++){
    const u = Math.random()*6.283, v = Math.random()*0.85 + 0.06;
    const r = 820, sy = Math.sin(v*Math.PI/2), rr = Math.cos(v*Math.PI/2);
    pos[i*3] = Math.cos(u)*rr*r; pos[i*3+1] = sy*r; pos[i*3+2] = Math.sin(u)*rr*r;
    tam[i] = 1.6 + Math.random()*3.4;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('tam', new T.BufferAttribute(tam, 1));
  const m = new T.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: { alfa: { value: 0 } },
    vertexShader: `attribute float tam; varying float vT;
      void main(){ vT = tam;
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = tam; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float alfa; varying float vT;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float f = smoothstep(0.5, 0.06, length(d));
        gl_FragColor = vec4(vec3(1.0, 0.98, 0.92), f * alfa * (0.45 + vT*0.14));
      }`
  });
  const pts = new T.Points(g, m);
  pts.frustumCulled = false;
  escena.add(pts);
  return pts;
})();

const _dir = new T.Vector3(), _foco = new T.Vector3();
/* LA NOCHE SE CLAVA Y NO VUELVE A AMANECER.
   Después de la escena de la llave el juego deja de ser «un día en la isla» y
   pasa a ser una huida: si el reloj siguiera corriendo, a los pocos minutos
   saldría el sol y la persecución quedaría a plena luz con el camello trotando
   por el pasto verde, que es exactamente lo contrario de lo que la escena
   acaba de plantar. Así que a partir de ahí la hora se PROGRAMA: se lleva a
   medianoche cerrada y se queda. No se congela de golpe —eso se ve como un
   corte— sino que baja hasta el valor fijo en unos segundos. */
let NOCHE_FIJA = false;
const NOCHE_HORA = 0.965;        /* casi medianoche: la luna alta y nada de sol */
function clavaNoche(){ NOCHE_FIJA = true; }
function ponSol(dt){
  if (NOCHE_FIJA){
    /* el camino más corto hasta el valor fijo, para no cruzar el mediodía */
    let d = NOCHE_HORA - CFG.sol;
    if (d >  0.5) d -= 1;
    if (d < -0.5) d += 1;
    if (Math.abs(d) > 0.0008) CFG.sol = (CFG.sol + d * Math.min(1, (dt||0) * 0.55) + 1) % 1;
    else CFG.sol = NOCHE_HORA;
  }
  else if (dt && !PAUSA) CFG.sol = (CFG.sol + dt / CICLO) % 1;
  const f = CFG.sol;
  const ang = (f - 0.25) * 6.283185;
  const alt = Math.sin(ang), az = Math.cos(ang);
  const dia = cl(alt / 0.22, 0, 1);            /* 0 de noche, 1 con el sol alto */
  const filo = 1 - Math.abs(cl(alt / 0.30, -1, 1));   /* 1 justo en el horizonte */

  _foco.set(JUG.x, 0, JUG.z);
  /* EL SOL. Bajo el horizonte se apaga, y la luna toma el relevo con su propia
     dirección: si se dejara el mismo foco, de noche las sombras seguirían
     saliendo del suelo hacia arriba. */
  _dir.set(az*0.86, Math.max(0.05, alt), -0.40).normalize();
  sol.position.copy(_dir).multiplyScalar(230).add(_foco);
  sol.target.position.copy(_foco); sol.target.updateMatrixWorld();
  sol.visible = alt > -0.02;
  sol.intensity = 2.55 * dia;
  /* dorado cuando roza el horizonte, blanco cuando está alto */
  sol.color.setHSL(0.09 + dia*0.045, 0.62 - dia*0.5, 0.52 + dia*0.14);
  sol.castShadow = CFG.sombras && alt > 0.06;

  /* LA LUNA: fría, floja y sin sombra, para que la noche se vea y no ciegue */
  _dir.set(-az*0.86, Math.max(0.05, -alt), 0.40).normalize();
  luna.position.copy(_dir).multiplyScalar(230).add(_foco);
  luna.target.position.copy(_foco); luna.target.updateMatrixWorld();
  luna.visible = alt < 0.02;
  luna.intensity = 0.42 * cl(-alt / 0.25, 0, 1);

  /* el relleno viaja opuesto al sol y sube con el día */
  relleno.position.set(-az*0.7, 0.55, 0.34).normalize().multiplyScalar(200).add(_foco);
  relleno.target.position.copy(_foco); relleno.target.updateMatrixWorld();
  relleno.intensity = 0.12 + dia*0.62;
  relleno.color.setHSL(0.58, 0.42, 0.62);

  /* el rebote: de noche baja mucho pero no a cero, o no se vería nada */
  ambiente.intensity = 0.20 + dia*1.32;
  ambiente.color.setHSL(0.60 - dia*0.04, 0.50, 0.22 + dia*0.36);
  ambiente.groundColor.setHSL(0.28, 0.35, 0.07 + dia*0.24);

  const c = cieloMat.uniforms;
  c.sol.value.copy(_dir.set(az*0.86, alt, -0.40).normalize());
  /* de azul noche a azul día, con el naranja del horizonte metido por `filo` */
  c.arriba.value.setHSL(0.62 - dia*0.035, 0.55 + dia*0.15, 0.045 + dia*0.44);
  c.medio.value.setHSL(0.60 - dia*0.035, 0.50 + dia*0.17, 0.09 + dia*0.53);
  c.abajo.value.setHSL(0.60 - filo*0.53, 0.40 + filo*0.50, 0.12 + dia*0.66);
  c.calor.value.setHSL(0.07, 0.90, 0.20 + dia*0.42);
  escena.fog.color.copy(c.medio.value).lerp(c.abajo.value, 0.55);
  /* de noche se ve MENOS lejos: sin esto la isla nocturna es una silueta plana */
  escena.fog.near = 120 + dia*110; escena.fog.far = 300 + dia*340;

  /* las nubes se apagan con el sol: con el emisivo fijo quedaban celestes y
     luminosas a medianoche, flotando sobre un mundo negro */
  if (matNube){
    matNube.emissiveIntensity = 0.10 + dia*0.50;
    matNube.color.setHSL(0.60, 0.16 + (1-dia)*0.20, 0.16 + dia*0.80);
  }
  estrellas.material.uniforms.alfa.value = cl(-alt*2.6, 0, 1);
  estrellas.position.copy(cam.position);

  HORA = f * 24;
}
let HORA = 10;

/* ══════════════════════════ PANTALLA COMPLETA Y ORIENTACIÓN ══════════════
   Las dos cosas sólo se conceden DENTRO DE UN GESTO del usuario: por eso hay un
   botón al terminar de cargar y no se intenta solo al abrir, que es la forma
   segura de que el navegador lo rechace en silencio.

   El bloqueo de orientación no existe en iOS y en escritorio suele fallar. No
   importa: el giro por CSS del escenario cubre igual el caso, y por eso se
   intenta bloquear pero nunca se depende de que salga bien. */
function enPantallaCompleta(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
async function pantallaCompleta(){
  const el = document.documentElement;
  try {
    if (!enPantallaCompleta()){
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  } catch(e){ /* puede negarse; no es motivo para no jugar */ }
  try {
    if (screen.orientation && screen.orientation.lock)
      await screen.orientation.lock('landscape');
  } catch(e){ /* iOS no lo tiene: queda el giro por CSS */ }
  setTimeout(medir, 280);
}
async function salirPantallaCompleta(){
  try {
    if (document.exitFullscreen) await document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch(e){}
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  setTimeout(medir, 280);
}
/* al salir con la tecla de escape hay que volver a medir: cambia la ventana */
for (const ev of ['fullscreenchange','webkitfullscreenchange','orientationchange'])
  addEventListener(ev, () => setTimeout(medir, 300));

/* ══════════════════════════ LA CÁMARA DE CINE DEL MENÚ ══════════════════
   Mientras el menú está abierto la isla sigue viva detrás, filmada con un campo
   de visión de 30° en vez de los 66 de juego. El teleobjetivo aplasta la
   perspectiva —las copas se apilan unas sobre otras y el fondo se acerca—, y
   junto con un movimiento MUY lento eso es lo que da el aire de grúa de cine.
   Va rotando entre los sitios de la isla, unos segundos en cada uno. */
let MODO = 'menu';
/* declarados ACÁ ARRIBA y no «donde corresponde temáticamente»: es la séptima
   vez en este proyecto que un `const` leído antes de su línea no rompe una
   función sino el módulo entero. */
const _qRoll = new T.Quaternion(), _ejeZ = new T.Vector3(0, 0, 1);
const CINE = {
  i: 0, t: 0, ang: 0, alto: 0,
  arranca(){
    this.i = 0; this.t = 0; this.ang = Math.random()*6.283; this.pon();
  },
  pon(){
    const s2 = (SITIOS && SITIOS.length) ? SITIOS[this.i % SITIOS.length]
             : { c: { x: 0, z: 0, h: 10 } };
    this.obj = s2.c;
    /* EL ENCUADRE SALE DE UNA CUENTA, NO DEL GUSTO.
       Con la altura anterior —11 a 24 m sobre un radio de 34 a 56— la cámara
       cabeceaba entre 20° y 30° hacia abajo, y como el teleobjetivo abre 30° en
       vertical, o sea 15° para arriba del eje, el borde de ARRIBA del cuadro
       caía por debajo del horizonte: no entraba un solo píxel de cielo y el
       menú era una alfombra verde. Un fondo de portada necesita las tres
       franjas —cielo, isla, primer plano—, y para eso el horizonte tiene que
       caer alrededor de un cuarto del alto.
       Si el horizonte va a la fracción f desde arriba, el cabeceo vale
       `mediaAbertura*(1 - 2f)`; con f = 0,26 y media abertura 15° son 6,6°, o
       sea alto = radio * tan(6,6°) = radio * 0,116 POR ENCIMA DEL PUNTO AL QUE
       MIRA, que no es lo mismo que por encima del suelo. */
    this.rad = 48 + Math.random()*26;
    this.alto = this.rad * (0.10 + Math.random()*0.055);
    this.vel = (Math.random() < 0.5 ? -1 : 1) * (0.035 + Math.random()*0.030);
  },
  paso(dt){
    /* el bucle arranca antes de que nadie haya elegido sitio: si `obj` no está,
       se elige acá y no se tira todo abajo cuadro a cuadro */
    if (!this.obj) this.pon();
    this.t += dt;
    if (this.t > 11){ this.t = 0; this.i++; this.pon(); }
    this.ang += this.vel * dt;
    const o = this.obj;
    const x = o.x + Math.cos(this.ang)*this.rad;
    const z = o.z + Math.sin(this.ang)*this.rad;
    /* la altura que pide el encuadre, y el terreno sólo como PISO: si el suelo
       de este lado de la órbita es más alto que el sitio, la cámara sube lo
       justo para no enterrarse, y ahí sí se pierde un poco de cielo. Sumar la
       altura ENCIMA del terreno —como estaba— hacía que el cabeceo dependiera
       de por dónde pasara la órbita, o sea que el encuadre cambiaba solo. */
    const mira = o.h + 5.5;
    const y = Math.max(mira + this.alto, H(x, z) + 4.5, MAR + 5);
    cam.position.set(x, y, z);
    cam.lookAt(o.x, mira, o.z);
    /* LA DERIVA VA COMO CUATERNIÓN LOCAL Y NO COMO `rotation.z`, Y ESA ES LA
       DIFERENCIA ENTRE UN HORIZONTE DERECHO Y UNO TORCIDO.
       `lookAt` deja la cámara sin inclinación —medido: 0,00°—. Pero escribir
       `cam.rotation.z` recompone la rotación ENTERA desde el Euler, y el orden
       del Euler acá es el de fábrica, `XYZ`, o sea R = Rx·Ry·Rz: el cabeceo se
       aplica alrededor del eje X DEL MUNDO después del giro, y eso ladea el
       horizonte tanto más cuanto más grande sea el giro. Medido en el mismo
       cuadro: `lookAt` 0,00° y la línea siguiente 29,81°. Y como la cámara del
       menú ORBITA, el giro barre la vuelta entera y la inclinación va y viene
       —17° en un instante, 30° en otro—: eso es lo que se ve como que la
       cinemática está dada vuelta.
       El juego no lo sufría porque `ponCam` pone `rotation.order='YXZ'`, que es
       el orden correcto para una cámara de girar-y-cabecear; pero el menú corre
       antes de que `ponCam` haya existido siquiera una vez.
       Multiplicando por la derecha se gira alrededor del eje Z DE LA CÁMARA, o
       sea sobre su propio eje óptico: no puede tocar hacia dónde mira, y no
       depende de ningún orden de Euler. */
    _qRoll.setFromAxisAngle(_ejeZ, Math.sin(this.t*0.19) * 0.012);
    cam.quaternion.multiply(_qRoll);
    if (cam.fov !== 30){ cam.fov = 30; cam.updateProjectionMatrix(); }
    AND.fov = 30;
  }
};
function entraJuego(){
  MODO = 'juego';
  $('menu').classList.remove('on');
  $('hud').classList.add('on');
  /* SE EMPIEZA A SIETE METROS DEL FUEGO Y NO A DIECISIETE. La cinemática deja
     al jugador en plena noche, y en la primera captura nocturna la fogata era
     un puntito al fondo: sin un punto de referencia encendido, el primer cuadro
     de la partida es una pantalla negra con estrellas. A siete metros el fuego
     ocupa el centro del cuadro y ahí se entiende dónde está uno parado. */
  JUG.x = CAMPO.x + 5; JUG.z = CAMPO.z + 5; JUG.y = H(JUG.x, JUG.z);
  JUG.vy = 0; JUG.aire = false; JUG.vuela = false; JUG.agacha = false;
  JUG.yaw = Math.atan2(JUG.x - CAMPO.x, JUG.z - CAMPO.z);
  JUG.pitch = -0.05;
  AND.ojo = OJO; AND.fase = 0; AND.golpe = 0; AND.fov = 66;
  cam.fov = 66; cam.updateProjectionMatrix();
  cam.rotation.z = 0;
}
function vuelveMenu(){
  MODO = 'menu';
  pausa(false);
  $('hud').classList.remove('on');
  $('menu').classList.add('on');
  CINE.arranca();
}

/* ══════════════════════════ MENÚ DE PAUSA ══════════════════════════
   Tres botones y nada más: reanudar, reiniciar y volver a la portada. Los
   deslizadores de imagen se fueron porque los valores quedaron fijos. */
let PAUSA = false;
function pausa(v){
  if (MODO === 'cine') return;    /* no hay nada que pausar mientras se mira */
  PAUSA = v;
  document.getElementById('pausa').classList.toggle('on', v);
  if (v && document.pointerLockElement) document.exitPointerLock();
  if (v){
    const t = Math.floor(RELOJ.value);
    document.getElementById('pSub').textContent =
      TXF('pSub', Math.floor(t/60), String(t%60).padStart(2,'0'));
  }
}
function armaPanel(){
  $('bPanel').onclick = () => pausa(!PAUSA);
  $('pSeguir').onclick = () => pausa(false);
  $('pReinicia').onclick = () => { pausa(false); resembrar(); };
  $('pMenu').onclick = () => vuelveMenu();
  /* JUGAR abre la CINEMÁTICA, no el juego: el juego arranca cuando ella
     termina, que es lo que se pidió. Y se puede saltear en cualquier momento
     —una apertura obligatoria vista por segunda vez es un peaje—. */
  $('mJugar').onclick = async () => { await pantallaCompleta(); INTRO.arranca(); };
  $('cSaltar').onclick = () => INTRO.termina();
  $('mOtra').onclick = async () => { await resembrar(); vuelveMenu(); };
  $('bFull').onclick = () => {
    if (enPantallaCompleta()) salirPantallaCompleta(); else pantallaCompleta();
  };
  /* los tres de acción: el de correr y el de agacharse quedan fijados mientras
     se los mantenga, que es como se espera de un botón de acción */
  const sostener = (id, abajo, arriba) => {
    const e = $(id);
    e.addEventListener('pointerdown', ev => { ev.preventDefault(); modoPC(false); abajo(); });
    for (const k of ['pointerup','pointercancel','pointerleave'])
      e.addEventListener(k, () => arriba && arriba());
  };
  sostener('acSalta', () => saltar());
  sostener('acAgacha', () => ponAgacha(true), () => ponAgacha(false));
  $('acCorre').addEventListener('pointerdown', ev => { ev.preventDefault(); modoPC(false);
    corre = !corre; $('acCorre').classList.toggle('on', corre); });
  /* USAR: un solo botón para todo lo que se pueda hacer cerca. Con un botón por
     tipo de cosa, la pantalla se llenaría de botones apagados. */
  sostener('acUsar', () => MIS.usa());
  /* el minijuego se juega con un botón grande o con la barra espaciadora */
  $('miBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); MINI.golpe(); });
}


/* ══════════════════════════ LEMI Y LOS OTROS TRES ══════════════════════════
   Cuatro personajes de dibujito, con esqueleto propio armado a mano.

   POR QUÉ UN RIG PROPIO Y NO UN MODELO IMPORTADO: en este juego TODO es
   procedural y no hay un solo archivo de malla; meter un GLB rompería lo único
   que hace que «Otra isla» sea un botón. Y con un rig propio una animación es
   una FUNCIÓN DEL TIEMPO A DIEZ ROTACIONES: escribir la curva sale más corto
   que describirla, mezclar dos es evaluarlas y promediarlas, y no hay que
   retargetear nada. Es lo mismo que se hizo con el profesor de RECREO.

   EL ESQUELETO ES UNA JERARQUÍA DE PIVOTES, no de mallas. Cada articulación es
   un Object3D vacío puesto DONDE ESTÁ LA ARTICULACIÓN, y la malla del hueso
   cuelga de él corrida media longitud hacia abajo. Así girar el pivote gira el
   hueso alrededor de su punta de arriba —que es lo que hace un codo— en vez de
   alrededor de su centro, que es lo que pasa si uno rota la caja directamente. */

const PIEL = 0xe8b48a;
const geoCaja = new T.BoxGeometry(1, 1, 1);
geoCaja.userData.compartida = true;   /* la usan los 40 huesos de los 4 y el camello */
const matOjo = new T.MeshBasicMaterial({ color: 0x14181e });
const matPiel = new T.MeshLambertMaterial({ color: PIEL, flatShading: true });

/* los cuatro, con su ropa. Lemi va primero y es de rojo, el mismo rojo de la
   camioneta: es SU auto y es SU historia, y que las dos cosas compartan el
   color es lo que hace que se lea sin decirlo. */
const AMIGOS = [
  { n: 'Lemi', ropa: 0xd8483a, pelo: 0x2d1c12, pant: 0x2f4a6b, alt: 1.00 },
  { n: 'Sofi', ropa: 0x46b07a, pelo: 0x6b3a1c, pant: 0x394254, alt: 0.96 },
  { n: 'Tato', ropa: 0xe0b33c, pelo: 0x161616, pant: 0x4a3b2c, alt: 1.06 },
  { n: 'Vera', ropa: 0x8f6bd0, pelo: 0xc8a03c, pant: 0x2f4a6b, alt: 0.93 }
];

/* un hueso: pivote + caja colgando hacia abajo desde el pivote */
function hueso(padre, x, y, z, ancho, largo, fondo, mat){
  const piv = new T.Object3D();
  piv.position.set(x, y, z);
  padre.add(piv);
  const m = new T.Mesh(geoCaja, mat);
  m.scale.set(ancho, largo, fondo);
  m.position.y = -largo/2;
  m.castShadow = true;
  piv.add(m);
  piv.userData.largo = largo;
  return piv;
}

function armaPersona(d){
  const g = new T.Group();
  const e = d.alt;
  const mRopa = new T.MeshLambertMaterial({ color: d.ropa, flatShading: true });
  const mPant = new T.MeshLambertMaterial({ color: d.pant, flatShading: true });
  const mPelo = new T.MeshLambertMaterial({ color: d.pelo, flatShading: true });

  /* la cadera es la raíz de todo: subiéndola o bajándola se agacha el
     personaje entero sin tocar una sola articulación más */
  const cadera = new T.Object3D();
  cadera.position.y = 0.92*e;
  g.add(cadera);

  const torso = new T.Object3D();
  cadera.add(torso);
  const mTorso = new T.Mesh(geoCaja, mRopa);
  mTorso.scale.set(0.46*e, 0.56*e, 0.26*e);
  mTorso.position.y = 0.28*e;
  mTorso.castShadow = true;
  torso.add(mTorso);

  /* el cuello y la cabeza cuelgan del torso, así que mirar para un lado no
     mueve el cuerpo y agachar el cuerpo sí mueve la cabeza */
  const cuello = new T.Object3D();
  cuello.position.y = 0.56*e;
  torso.add(cuello);
  const cabeza = new T.Mesh(geoCaja, matPiel);
  cabeza.scale.set(0.34*e, 0.36*e, 0.32*e);
  cabeza.position.y = 0.18*e;
  cabeza.castShadow = true;
  cuello.add(cabeza);
  const pelo = new T.Mesh(geoCaja, mPelo);
  pelo.scale.set(0.37*e, 0.14*e, 0.35*e);
  pelo.position.y = 0.33*e;
  cuello.add(pelo);
  /* LOS OJOS VAN SIN LUZ (`MeshBasic`). Es lo único del personaje que tiene que
     verse igual de día que de noche junto al fuego: dos cajitas sombreadas se
     apagan con el resto de la cara y ahí el muñeco deja de mirar. */
  for (const sx of [-1, 1]){
    const o = new T.Mesh(geoCaja, matOjo);
    o.scale.set(0.055*e, 0.075*e, 0.02*e);
    o.position.set(sx*0.085*e, 0.20*e, 0.165*e);
    cuello.add(o);
  }

  /* brazos y piernas. El antebrazo cuelga del codo y la pantorrilla de la
     rodilla, así que doblar el codo no despega la mano del brazo. */
  const br = {}, pi = {};
  for (const [k, sx] of [['i', -1], ['d', 1]]){
    const hombro = hueso(torso, sx*0.29*e, 0.50*e, 0, 0.13*e, 0.30*e, 0.14*e, mRopa);
    const codo   = hueso(hombro, 0, -0.30*e, 0, 0.115*e, 0.28*e, 0.125*e, matPiel);
    br[k] = { hombro, codo };
    const musl = hueso(cadera, sx*0.13*e, 0, 0, 0.16*e, 0.42*e, 0.17*e, mPant);
    const rod  = hueso(musl, 0, -0.42*e, 0, 0.14*e, 0.40*e, 0.15*e, mPant);
    /* el pie: una caja adelante del tobillo, que es lo que impide que la
       pierna termine en punta */
    const pie = new T.Mesh(geoCaja, matOjo);
    pie.scale.set(0.16*e, 0.09*e, 0.26*e);
    pie.position.set(0, -0.42*e, 0.05*e);
    pie.castShadow = true;
    rod.add(pie);
    pi[k] = { musl, rod };
  }

  /* EL TRONCO QUE LLEVA EN LA MANO.
     Cuelga del ANTEBRAZO DERECHO y no de la escena: así lo lleva la mano por
     construcción y no hay dos animaciones que puedan desincronizarse —si la
     posición del leño se calculara aparte, en el cuadro en que el brazo se
     mueve el leño iría un cuadro atrasado y se vería despegado de la mano—.
     Es la misma regla que la carta pegada a la pinza en RezUno.
     Nace apagado: sólo se enciende en la escena de la fogata. */
  const leno = new T.Mesh(new T.CylinderGeometry(0.075*e, 0.09*e, 0.86*e, 6), matCorteza);
  leno.position.set(0, -0.30*e, 0.10*e);
  leno.rotation.set(Math.PI/2, 0, 0.22);
  leno.castShadow = true;
  leno.visible = false;
  br.d.codo.add(leno);

  g.userData = { d, e, cadera, torso, cuello, br, pi, leno, fase: Math.random()*6.28 };
  return g;
}

/* ── LAS POSES ──
   Cada una deja el esqueleto en un estado; `t` es el reloj. Se escriben como
   ángulos absolutos y no como deltas porque acá el reposo es CERO: el rig es
   propio y nació con los brazos colgando, así que no hay pose de bind que
   respetar —que es lo que en RECREO obligó a componer deltas sobre el reposo
   de Meshy—. */
function poseQuieto(p, t){
  const u = p.userData, f = t*1.5 + u.fase;
  /* EL CAMBIO DE PESO, que es lo que hace que estar parado no sea estar
     congelado. Nadie se queda con el peso repartido en las dos piernas: se
     apoya en una, se cansa y cambia. Va a 0,21 Hz —una vuelta cada cinco
     segundos— porque más rápido se lee a que se está meciendo. Medido, sin esto
     la pose entera movía 1,5 cm y con esto llega a los seis. */
  const w = Math.sin(t*0.42 + u.fase);
  u.cadera.position.y = 0.92*u.e + Math.sin(f)*0.012 - Math.abs(w)*0.014*u.e;
  u.cadera.rotation.z = w*0.045;
  u.torso.rotation.set(Math.sin(f)*0.02, -w*0.05, -w*0.03);
  u.cuello.rotation.set(Math.sin(f*0.7)*0.05, Math.sin(f*0.31)*0.22 + w*0.04, 0);
  for (const [k, sx] of [['i',-1],['d',1]]){
    /* el brazo del lado cargado cuelga más pegado al cuerpo */
    const carga = (sx > 0 ? w : -w);
    u.br[k].hombro.rotation.set(Math.sin(f + (sx>0?0:1))*0.05, 0, sx*(0.09 + carga*0.045));
    u.br[k].codo.rotation.set(-0.22 - Math.max(0, carga)*0.10, 0, 0);
    /* la pierna descargada se dobla y se abre un poco */
    u.pi[k].musl.rotation.set(Math.max(0, -carga)*0.10, 0, sx*(0.02 + Math.max(0, -carga)*0.07));
    u.pi[k].rod.rotation.set(0.04 + Math.max(0, -carga)*0.16, 0, 0);
  }
}
/* EL RITMO SALE DE LA VELOCIDAD Y DE LA ZANCADA, no de una constante.
   Estaba en `t*(2,4 + v*1,2)*2` con `v` valiendo 0,55 o 0,7 —un número que no
   era la velocidad de nada— así que el ciclo iba a un ritmo y el cuerpo a otro,
   y los pies patinaban. Es el mismo defecto que en RECREO tenía a Baldi
   arrastrando los pies a 2,7 metros por paso. Un ciclo son DOS pasos, así que
   `ω = π·v/zancada`: si mañana caminan más rápido, las piernas lo siguen solas.
   `vel` está en metros por segundo. */
const ZANCADA = 0.72;                 /* largo de UN paso, en metros, a escala 1 */
function poseCamina(p, t, vel){
  const u = p.userData;
  const v = Math.max(0.15, vel || 1.4);
  const f = t * Math.PI * v / (ZANCADA * u.e) + u.fase;
  const a = cl(0.26 + v*0.20, 0.20, 0.62);
  const sf = Math.sin(f), cf = Math.cos(f);
  /* el rebote va al DOBLE del ciclo: hay dos apoyos por vuelta, no uno */
  u.cadera.position.y = 0.92*u.e + Math.abs(sf)*0.030*u.e;
  /* BASCULACIÓN DE LA PELVIS: la cadera cae del lado de la pierna que está en
     el aire. Es lo que separa a alguien que camina de un muñeco que abre y
     cierra las piernas — y no cuesta un hueso más, es una rotación de la raíz. */
  u.cadera.rotation.z = sf * 0.055;
  /* el tronco gira al REVÉS que la pelvis, que es lo que hace que los brazos y
     las piernas se crucen en vez de ir en bloque */
  u.torso.rotation.set(0.09 + v*0.03, -sf*0.085, 0);
  /* la cabeza compensa el rebote: la vista de alguien que camina no sube y baja
     tanto como su cadera */
  u.cuello.rotation.set(-0.05 - Math.abs(sf)*0.035, sf*0.05, -sf*0.05);
  for (const [k, sg] of [['i',1],['d',-1]]){
    const s = sf * sg, c2 = cf * sg;
    u.br[k].hombro.rotation.set(-s*a*0.85, 0, (k==='i'?-1:1)*0.08);
    u.br[k].codo.rotation.set(-0.35 - Math.max(0, s)*0.4, 0, 0);
    u.pi[k].musl.rotation.set(s*a, 0, 0);
    /* la rodilla SÓLO se dobla hacia atrás y sólo en la pierna que va atrás:
       una rodilla que se dobla para adelante es lo que hace que un muñeco
       camine como un títere. Y se dobla MÁS a mitad del vuelo —que es cuando
       hay que levantar el pie del piso— y no en el apoyo. */
    const vuelo = Math.max(0, -s);
    u.pi[k].rod.rotation.set(vuelo*a*1.25 + Math.max(0, -c2)*a*0.55, 0, 0);
  }
}
/* agachado poniendo leña: la cadera baja, las rodillas se abren y los brazos
   van adelante y abajo, con una mano que sube y baja acomodando el tronco */
function poseLena(p, t, trabaja){
  const u = p.userData, f = t*2.2 + u.fase;
  const w = trabaja ? 1 : 0;
  u.cadera.position.y = 0.92*u.e - 0.34*u.e;
  u.torso.rotation.set(0.52, 0, 0);
  /* EL CABECEO, y hay una razón por la que el giro que ya estaba no servía: la
     cabeza cuelga del cuello SOBRE SU PROPIO EJE, así que girar el cuello en Y
     no la mueve ni un milímetro —medido, recorrido cero—. Lo que mueve una
     cabeza es asentir, que es la X. Y encima es lo que hace alguien que está
     acomodando leña: mira lo que tiene entre las manos. */
  u.cuello.rotation.set(0.28 + Math.sin(f*0.9)*0.07*w, Math.sin(f*0.5)*0.1, 0);
  for (const [k, sx] of [['i',-1],['d',1]]){
    const s = Math.sin(f + (k==='d'?0:0.9)) * w;
    u.br[k].hombro.rotation.set(-1.15 - s*0.30, 0, sx*0.26);
    u.br[k].codo.rotation.set(-0.85 + s*0.45, 0, 0);
    u.pi[k].musl.rotation.set(-1.30, 0, sx*0.22);
    u.pi[k].rod.rotation.set(1.65, 0, 0);
  }
}
/* sentado en un tronco, mirando el fuego */
/* SENTADO, Y LAS PIERNAS SALEN DE LA GEOMETRÍA Y NO DEL TANTEO.
   Estaba con el muslo a −1,42 y la rodilla a +1,05: la suma da −0,37, o sea la
   pantorrilla inclinada 21° HACIA ADELANTE, que es alguien resbalándose del
   tronco. Sentarse es una sola cosa: el muslo horizontal y la pantorrilla a
   plomo. El muslo cuelga hacia −Y en reposo, así que horizontal es −π/2; y la
   rodilla tiene que devolver exactamente lo mismo para que la pantorrilla
   vuelva a la vertical. De ahí los dos números, y por eso están escritos como
   la cuenta y no como el resultado: si mañana cambia la pose de reposo del rig,
   esto sigue siendo cierto.

   Y LA CADERA VA A LA ALTURA DE LA TAPA DEL TRONCO. La pone quien lo sienta,
   con `y` del asiento; acá sólo se la baja lo que mide el muslo, que es lo que
   se hunde al doblar la pierna. */
const SENT_MUSLO = -Math.PI/2, SENT_RODILLA = Math.PI/2;
function poseSentado(p, t){
  const u = p.userData, f = t*1.15 + u.fase;
  /* apoyado: la cadera queda donde la dejó quien lo sentó, sólo respira */
  u.cadera.position.y = 0.42*u.e + Math.sin(f)*0.008;
  u.torso.rotation.set(0.14 + Math.sin(f)*0.03, Math.sin(f*0.4)*0.06, 0);
  u.cuello.rotation.set(-0.06, Math.sin(f*0.33)*0.16, 0);
  for (const [k, sx] of [['i',-1],['d',1]]){
    /* los brazos apoyados en las rodillas, que es como se sienta alguien
       alrededor de un fuego: el hombro adelante y el codo bien cerrado */
    u.br[k].hombro.rotation.set(-0.55 + Math.sin(f + (k==='d'?0:1.4))*0.045, 0, sx*0.22);
    u.br[k].codo.rotation.set(-1.15, 0, 0);
    /* muslo horizontal, pantorrilla a plomo, y las rodillas apenas abiertas */
    u.pi[k].musl.rotation.set(SENT_MUSLO + Math.sin(f*0.5 + sx)*0.02, 0, sx*0.13);
    u.pi[k].rod.rotation.set(SENT_RODILLA, 0, 0);
  }
}
/* PARADO Y EN GUARDIA: es la pose del que oyó algo. Los brazos caen pero
   separados del cuerpo, el peso atrás, la cabeza adelantada. Lo que la hace
   leer como alerta y no como estar parado es el CUELLO estirado hacia adelante
   y los hombros subidos: nadie escucha algo raro con los hombros sueltos. */
function poseAlerta(p, t, k){
  const u = p.userData, f = t*1.2 + u.fase;
  /* LA RESPIRACIÓN SE ACELERA Y SE ACORTA. Medido, con `k` en 1 esta pose no
     movía NADA: todos los términos vivos estaban multiplicados por `(1-k)`, así
     que al terminar de darse vuelta el personaje quedaba de estatua. Alguien
     que acaba de oír algo no se queda quieto: respira más rápido y más corto, y
     sigue barriendo con la cabeza. Es lo contrario de la calma, y la quietud
     absoluta se lee a calma —o a que el juego se colgó—. */
  const fr = t*(1.2 + k*1.5) + u.fase;
  u.cadera.position.y = 0.92*u.e + Math.sin(fr)*(0.008 - k*0.003);
  u.torso.rotation.set(0.10 + k*0.06 + Math.sin(fr)*0.012, 0, Math.sin(fr*0.31)*0.010);
  /* la cabeza no deja de buscar: lento y corto cuando ya está tenso */
  u.cuello.rotation.set(-0.16 - k*0.10 + Math.sin(fr*1.7)*0.02*k,
                        Math.sin(f*0.6)*0.10*(1-k) + Math.sin(t*0.75)*0.30*k, 0);
  for (const [kk, sx] of [['i',-1],['d',1]]){
    /* los hombros suben con la tensión y tiemblan un pelo */
    u.br[kk].hombro.rotation.set(-0.12 - k*0.10 + Math.sin(fr + (sx>0?0:0.8))*0.022,
                                 0, sx*(0.16 + k*0.10));
    u.br[kk].codo.rotation.set(-0.42 - k*0.22 - Math.max(0, Math.sin(fr*0.9))*0.05*k, 0, 0);
    u.pi[kk].musl.rotation.set(-0.05, 0, sx*0.05);
    u.pi[kk].rod.rotation.set(0.10, 0, 0);
  }
}
/* un salto de sorpresa: se echa para atrás y sube los brazos. Es la pose del
   final de la cinemática, cuando aparece lo que aparece. */
function poseSusto(p, t, k){
  const u = p.userData;
  u.cadera.position.y = 0.92*u.e - 0.30*u.e + k*0.10;
  u.torso.rotation.set(0.14 - k*0.42, 0, 0);
  u.cuello.rotation.set(-0.06 - k*0.30, 0, 0);
  for (const [kk, sx] of [['i',-1],['d',1]]){
    u.br[kk].hombro.rotation.set(-0.42 - k*1.9, 0, sx*(0.30 + k*0.35));
    u.br[kk].codo.rotation.set(-0.95 - k*0.5, 0, 0);
    u.pi[kk].musl.rotation.set(-1.42, 0, sx*0.10);
    u.pi[kk].rod.rotation.set(1.05, 0, 0);
  }
}

/* ══════════════════════════ EL CAMELLO ══════════════════════════
   La cosa de la que va la historia. Se arma con el mismo criterio que la gente
   —pivotes y cajas— pero con las proporciones al revés: patas larguísimas,
   cuello largo, cuerpo corto y la joroba, que es lo único que hace que a la
   distancia y en silueta se lea CAMELLO y no caballo.

   VA EN ARENA OSCURA Y NO EN PARDO CASI NEGRO. La primera versión era 0x4a3524
   con el argumento de que una silueta negra da más miedo; medido, la escena de
   noche lo dejaba INVISIBLE —el gancho de proyección decía que estaba en cuadro
   y ocupando el 22 % del alto, y en la captura no había nada que ver—, porque
   de noche el fondo también es negro y una silueta necesita algo detrás que sea
   más claro que ella. En arena oscura se recorta contra el pasto de día y
   contra la maleza de noche, y es además el color que tiene un camello.
   LOS OJOS SON GRANDES A PROPÓSITO: van sin luz, así que son lo único suyo que
   no depende de la hora, y a veinte metros con el juego dibujando a media
   resolución unos ojos «de tamaño real» no llegan ni a un píxel. */
const matPelo   = new T.MeshLambertMaterial({ color: 0x8a6a44, flatShading: true });
const matOjoMal = new T.MeshBasicMaterial({ color: 0xff7a2a });

/* ── LA CARA ──
   Dibujada por código a 32 píxeles, como todo lo demás de este juego. Una foto
   de una cara real pegada sobre un animal de cajas planas se ve exactamente
   como lo que es: una foto pegada encima. Lo que da miedo acá no es el detalle
   sino la GEOMETRÍA de la cara, que se lee igual a cuatro píxeles: dos ojos
   demasiado juntos y demasiado arriba, pupilas chiquitas en mucho blanco —lo
   que hace que algo se vea desquiciado y no dormido— y una fila de dientes
   demasiado larga para el hocico.
   VA EN UNA SOLA CARA DEL CUBO DE LA CABEZA. Con el mismo mapa en las seis, el
   bicho tendría cara en la nuca. */
const texCara = lienzoTex(32, (g,n) => {
  moteado(g, n, '#8a6a44', '#a3835c', '#5e472c', 0.5);
  /* las cuencas: dos manchas oscuras hundidas, que es lo que hace que los ojos
     se lean como metidos adentro de la cabeza */
  g.fillStyle = '#2a1d12';
  g.fillRect(4, 7, 9, 8); g.fillRect(19, 7, 9, 8);
  /* el blanco del ojo, mucho, y la pupila chiquita y arriba */
  g.fillStyle = '#f4ecd8';
  g.fillRect(5, 8, 7, 6); g.fillRect(20, 8, 7, 6);
  g.fillStyle = '#c85a10';
  g.fillRect(7, 9, 3, 3); g.fillRect(22, 9, 3, 3);
  g.fillStyle = '#120c08';
  g.fillRect(8, 10, 1, 2); g.fillRect(23, 10, 1, 2);
  /* la boca: una raja negra de oreja a oreja con los dientes encima */
  g.fillStyle = '#1a0f0a';
  g.fillRect(3, 21, 26, 7);
  g.fillStyle = '#e8dcb0';
  for (let x = 4; x < 29; x += 3) g.fillRect(x, 21, 2, 3);
  for (let x = 5; x < 29; x += 3) g.fillRect(x, 25, 2, 3);
  /* los dos agujeros de la nariz y unas cicatrices */
  g.fillStyle = '#3a2616';
  g.fillRect(12, 17, 3, 2); g.fillRect(18, 17, 3, 2);
  g.fillStyle = '#6b4f33';
  g.fillRect(2, 4, 12, 1); g.fillRect(24, 16, 6, 1);
});
const matCara = new T.MeshLambertMaterial({ map: texCara, flatShading: true });

function armaCamello(){
  const g = new T.Group();
  const cuerpo = new T.Object3D();
  cuerpo.position.y = 2.05;
  g.add(cuerpo);

  const tronco = new T.Mesh(geoCaja, matPelo);
  tronco.scale.set(0.86, 0.92, 2.30);
  tronco.castShadow = true;
  cuerpo.add(tronco);
  /* LA JOROBA: sin ella son cuatro palos y una caja. Va bien atrás y bien alta */
  const jor = new T.Mesh(new T.SphereGeometry(0.62, 8, 6), matPelo);
  jor.scale.set(1, 0.86, 1.15);
  jor.position.set(0, 0.62, -0.18);
  jor.castShadow = true;
  cuerpo.add(jor);

  /* el cuello sale de ADELANTE ARRIBA y se inclina hacia adelante; la cabeza
     va en su punta con el hocico saliendo hacia +Z */
  const cuello = new T.Object3D();
  cuello.position.set(0, 0.34, 1.05);
  cuerpo.add(cuello);
  const mCue = new T.Mesh(geoCaja, matPelo);
  mCue.scale.set(0.38, 1.24, 0.42);
  mCue.position.y = 0.62;
  mCue.castShadow = true;
  cuello.add(mCue);
  const cabeza = new T.Object3D();
  cabeza.position.y = 1.24;
  cuello.add(cabeza);
  /* la cabeza lleva SEIS materiales, uno por cara del cubo: la cara creepy va
     en +Z —el frente, o sea por donde mira— y el pelo en las otras cinco.
     `BoxGeometry` ya viene con seis grupos, uno por cara, en el orden
     +X −X +Y −Y +Z −Z: alcanza con pasarle un arreglo de materiales. */
  const mCab = new T.Mesh(geoCaja,
    [matPelo, matPelo, matPelo, matPelo, matCara, matPelo]);
  mCab.scale.set(0.36, 0.36, 0.52);
  mCab.position.z = 0.10;
  mCab.castShadow = true;
  cabeza.add(mCab);
  const hocico = new T.Mesh(geoCaja, matPelo);
  hocico.scale.set(0.26, 0.22, 0.34);
  hocico.position.set(0, -0.07, 0.44);
  cabeza.add(hocico);
  for (const sx of [-1, 1]){
    const o = new T.Mesh(geoCaja, matOjoMal);
    o.scale.set(0.135, 0.125, 0.05);
    o.position.set(sx*0.13, 0.06, 0.29);
    cabeza.add(o);
    const or = new T.Mesh(geoCaja, matPelo);
    or.scale.set(0.10, 0.14, 0.07);
    or.position.set(sx*0.17, 0.22, -0.02);
    cabeza.add(or);
  }

  /* las cuatro patas, largas y en dos tramos */
  const pat = [];
  for (const sx of [-1, 1]) for (const sz of [1, -1]){
    const alto = new T.Object3D();
    alto.position.set(sx*0.34, -0.30, sz*0.78);
    cuerpo.add(alto);
    const m1 = new T.Mesh(geoCaja, matPelo);
    m1.scale.set(0.20, 0.92, 0.22); m1.position.y = -0.46; m1.castShadow = true;
    alto.add(m1);
    const bajo = new T.Object3D();
    bajo.position.y = -0.92;
    alto.add(bajo);
    const m2 = new T.Mesh(geoCaja, matPelo);
    m2.scale.set(0.17, 0.80, 0.19); m2.position.y = -0.40; m2.castShadow = true;
    bajo.add(m2);
    const pe = new T.Mesh(geoCaja, matPelo);
    pe.scale.set(0.24, 0.14, 0.30); pe.position.set(0, -0.82, 0.04);
    bajo.add(pe);
    pat.push({ alto, bajo, sz });
  }
  const cola = new T.Mesh(geoCaja, matPelo);
  cola.scale.set(0.09, 0.52, 0.09);
  cola.position.set(0, 0.10, -1.18);
  cola.rotation.x = -0.5;
  cuerpo.add(cola);

  g.userData = { cuerpo, cuello, cabeza, pat, fase: 0 };
  return g;
}
/* camina: las patas cruzadas y el cuello balanceándose, que es lo que hace un
   camello de verdad. `v` es la velocidad y de ahí sale el ritmo, así que si
   corre las patas se aceleran solas y no patina. */
function animaCamello(c, t, v){
  const u = c.userData;
  u.fase += v * 0.62;
  const f = u.fase;
  u.cuerpo.position.y = 2.05 + Math.abs(Math.sin(f*2))*0.055;
  u.cuello.rotation.x = 0.30 + Math.sin(f)*0.09;
  u.cabeza.rotation.x = -0.22 + Math.sin(f*2)*0.05;
  /* MIRAR A ALGUIEN ES UNA EXCEPCIÓN Y VA ACÁ, no en quien la pide. El ciclo
     de caminata escribe estas dos rotaciones TODOS los cuadros, así que una
     pose puesta desde afuera se borraba sola en el cuadro siguiente: la
     cinemática de la llave dejaba al camello mirando al horizonte con la cara
     —que es la textura que hay que ver— apuntando por encima del jugador.
     Rotar la cabeza en +X inclina su +Z hacia abajo, que es lo que hace falta
     para bajar la vista hasta alguien que está a los pies. */
  if (u.miraCuello != null) u.cuello.rotation.x = u.miraCuello;
  if (u.miraCabeza != null) u.cabeza.rotation.x = u.miraCabeza;
  u.pat.forEach((p, i) => {
    const s = Math.sin(f + (i%2 ? Math.PI : 0) + (p.sz > 0 ? 0 : 0.5));
    p.alto.rotation.x = s*0.52;
    p.bajo.rotation.x = Math.max(0, -s)*0.72;
  });
}

/* ── EL CAMELLO EN LA ISLA ──
   Después de la intro se queda dando vueltas por la isla. De día ronda lejos;
   DE NOCHE VIENE. Si te alcanza no hay pantalla de derrota —este juego no
   tiene uno— sino un sobresalto y aparecés de vuelta en el campamento, que es
   la regla que ya usa Eco con su cosa: el castigo es el susto y el camino de
   vuelta, no perder la partida. */
let CAM3 = null;
const BICHO = { x: 0, z: 0, ry: 0, v: 0, modo: 'ronda', tx: 0, tz: 0, t: 0, golpe: 0,
                /* `caza` lo saca del horario: después de la escena de la llave
                   ya no importa si es de día, te sigue igual. Hasta entonces
                   sólo sale de noche. */
                caza: false };
const RONDA = 2.2, ACECHA = 3.6, EMBISTE = 7.4;   /* correr son 12,8: se le gana */
/* CUÁNTO MIDE DE ALTO, sumado de la propia jerarquía y no estimado: cuerpo
   2,05 + cuello 0,34 + cabeza 1,24 + media cabeza 0,18 + oreja 0,09. Lo usa la
   cinemática de la llave para saber cuánto tiene que levantar la vista. */
const ALTO_CAMELLO = 3.90;

function ponCamello(){
  if (!CAM3){ CAM3 = armaCamello(); escena.add(CAM3); }
  /* arranca lejos del campamento: aparecer al lado del fuego el primer
     segundo de juego no es tensión, es una emboscada */
  const a = Math.random()*6.283, r = 120 + Math.random()*70;
  BICHO.x = CAMPO.x + Math.cos(a)*r;
  BICHO.z = CAMPO.z + Math.sin(a)*r;
  BICHO.modo = 'ronda'; BICHO.t = 0; BICHO.golpe = 0; BICHO.caza = false;
  nuevoDestino();
  CAM3.visible = true;
}
function nuevoDestino(){
  /* DE NOCHE LA MITAD DE LAS VECES APUNTA HACIA EL JUGADOR, y sin eso el
     camello es decorado: la isla mide 660 m de lado y él ronda a 2,2 m/s con
     destinos al azar, así que la probabilidad de que entre solo en los 95 m que
     necesita para olerte es baja y quedarse en un rincón era una partida
     ganada. Es la misma corrección que costó una vuelta con la cosa de Eco.
     No va DIRECTO: se le apunta a un punto a media distancia, así se acerca en
     etapas y sigue leyéndose como que anda dando vueltas y no como un misil. */
  const noche = CFG.sol > 0.80 || CFG.sol < 0.20;
  if (noche && Math.random() < 0.5){
    const dx = JUG.x - BICHO.x, dz = JUG.z - BICHO.z;
    const d = Math.hypot(dx, dz) || 1;
    const paso = Math.min(d, 55 + Math.random()*45);
    BICHO.tx = cl(BICHO.x + dx/d*paso, -MITAD*0.9, MITAD*0.9);
    BICHO.tz = cl(BICHO.z + dz/d*paso, -MITAD*0.9, MITAD*0.9);
    return;
  }
  const a = Math.random()*6.283, r = 30 + Math.random()*70;
  BICHO.tx = cl(BICHO.x + Math.cos(a)*r, -MITAD*0.9, MITAD*0.9);
  BICHO.tz = cl(BICHO.z + Math.sin(a)*r, -MITAD*0.9, MITAD*0.9);
}
function pasoCamello(dt){
  if (!CAM3 || !CAM3.visible) return;
  BICHO.t += dt;
  const dxj = JUG.x - BICHO.x, dzj = JUG.z - BICHO.z;
  const dj = Math.hypot(dxj, dzj);
  /* LA NOCHE ES LO QUE LO CAMBIA. `CFG.sol` es la fase del día: 0 medianoche,
     0,5 mediodía. Entre 0,80 y 0,20 —o sea de noche— sale a buscar. */
  const noche = CFG.sol > 0.80 || CFG.sol < 0.20;
  /* durante la cinemática de la llave se queda plantado donde lo puso ella */
  if (BICHO.modo === 'quieto'){ CAM3.position.set(BICHO.x, pisoDe(BICHO.x, BICHO.z), BICHO.z);
    CAM3.rotation.y = BICHO.ry; animaCamello(CAM3, RELOJ.value, 0.02); return; }
  if (BICHO.golpe > 0){
    BICHO.golpe -= dt;
    if (BICHO.golpe <= 0){ BICHO.modo = 'ronda'; nuevoDestino(); }
  } else if ((noche || BICHO.caza) && dj < (BICHO.caza ? 400 : 95)){
    BICHO.modo = dj < 26 ? 'embiste' : 'acecha';
    BICHO.tx = JUG.x; BICHO.tz = JUG.z;
  } else {
    if (BICHO.modo !== 'ronda'){ BICHO.modo = 'ronda'; nuevoDestino(); }
    if (Math.hypot(BICHO.tx-BICHO.x, BICHO.tz-BICHO.z) < 6) nuevoDestino();
  }

  const vel = BICHO.golpe > 0 ? 0
            : BICHO.modo === 'embiste' ? EMBISTE
            : BICHO.modo === 'acecha'  ? ACECHA : RONDA;
  const dx = BICHO.tx - BICHO.x, dz = BICHO.tz - BICHO.z;
  const d = Math.hypot(dx, dz) || 1;
  if (vel > 0){
    BICHO.x += dx/d * vel * dt;
    BICHO.z += dz/d * vel * dt;
    /* EL RUMBO SE PERSIGUE POR LA VUELTA CORTA. Sin normalizar la diferencia a
       [-π,π], cruzar de 179° a -179° le hace dar media vuelta sobre sí mismo. */
    const obj = Math.atan2(dx, dz);
    let da = obj - BICHO.ry;
    while (da >  Math.PI) da -= 6.283185;
    while (da < -Math.PI) da += 6.283185;
    BICHO.ry += da * Math.min(1, dt*2.6);
  }
  BICHO.v = vel;
  CAM3.position.set(BICHO.x, pisoDe(BICHO.x, BICHO.z), BICHO.z);
  CAM3.rotation.y = BICHO.ry;
  animaCamello(CAM3, RELOJ.value, vel * dt * 26);

  /* te alcanzó */
  if (MODO === 'juego' && !PAUSA && BICHO.golpe <= 0 && dj < 2.6){
    BICHO.golpe = 7.5;
    JUG.x = CAMPO.x + 3.4; JUG.z = CAMPO.z + 3.4; JUG.y = H(JUG.x, JUG.z);
    JUG.vy = 0; AND.golpe = 1.0;
    /* Y SE VA LEJOS, que si no el castigo se repite solo. Al jugador se lo
       manda al campamento; si al camello se lo deja donde estaba y el encuentro
       fue CERCA del campamento, cuando se le pasa el aturdimiento lo tiene otra
       vez a dos metros y vuelve a embestir sin que uno haya podido hacer nada.
       Es la misma regla que la cosa de Eco: te agarra, te suelta y se aleja. */
    const aa = Math.random()*6.283, rr = 90 + Math.random()*50;
    BICHO.x = CAMPO.x + Math.cos(aa)*rr;
    BICHO.z = CAMPO.z + Math.sin(aa)*rr;
    nuevoDestino();
    aviso(TX('aAlcanzo'));
  }
}

/* ══════════════════════════ LA CINEMÁTICA DE APERTURA ══════════════════════
   Tres escenas y el juego. Es una FUNCIÓN DEL TIEMPO, no una máquina de
   estados: `INTRO.pon(t)` recibe el segundo y deja la cámara, la gente, el
   auto y la hora del día. Por eso el banco puede fotografiar el segundo 21,4
   directo con `__V.cine(21.4)` sin esperar veintiún segundos —que es como se
   encontró todo lo que hubo que corregir acá adentro—.

   SE PUEDE SALTEAR EN CUALQUIER MOMENTO. Una cinemática obligatoria que se ve
