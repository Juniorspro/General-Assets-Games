<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#57b6ef">
<title>LEMI · la isla del camello</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1420;touch-action:none;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#eaf4ff;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{display:block}

/* ── EL ESCENARIO ──
   Todo el juego vive acá adentro. Con el teléfono en vertical se gira 90° y se
   le intercambian el ancho y el alto, así se juega apaisado sin pedirle a nadie
   que dé vuelta el aparato. La pantalla de carga queda AFUERA a propósito: se
   muestra antes de girar nada y hay que poder leerla como venga el teléfono. */
#escenario{position:fixed;left:0;top:0;width:100%;height:100%;
  transform-origin:top left;overflow:hidden}
body.girado #escenario{transform:rotate(90deg) translateY(-100%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── CARGA ── */
#carga{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 15%,#1d4a72 0%,#0d2338 55%,#081420 100%);
  transition:opacity .6s ease}
#carga.ido{opacity:0;pointer-events:none}
#carga .caja{text-align:center;width:min(360px,84vw)}
#carga h1{font-size:clamp(26px,7vw,40px);font-weight:200;letter-spacing:-.02em;
  background:linear-gradient(160deg,#fff 30%,#8fe3a0);-webkit-background-clip:text;
  background-clip:text;color:transparent}
#carga p{margin-top:8px;font-size:12.5px;color:rgba(234,244,255,.55);min-height:1.4em}
#carga .barra{margin-top:18px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#carga .barra i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#7ee3a0,#57b6ef);transition:width .25s}
#carga .pista{margin-top:12px;font-size:11.5px;color:rgba(234,244,255,.42);line-height:1.5}

/* ── IDIOMA ──
   VA ANTES DEL MENU Y NO ADENTRO. Elegir idioma dentro de un menu ya escrito en
   un idioma que no entendes no sirve: para cuando lo encontras ya leiste todo
   lo demas sin entenderlo. Los tres botones dicen el idioma EN SU PROPIO
   IDIOMA, que es lo unico que se lee igual sin saber cual esta puesto. */
/* VA AFUERA DE `#escenario` Y SIN GIRAR, igual que la pantalla de carga que
   viene justo antes. Probé meterla adentro para que girara con el menú y no se
   ve: `#escenario` lleva un `transform`, y un `transform` crea contexto de
   apilado, así que el z-index 95 de adentro NO le gana al 90 de `#carga`, que
   está afuera — la pantalla de idioma quedaba tapada por la barra de carga. Y
   de paso queda coherente: las dos pantallas previas se leen con el teléfono
   como uno lo agarra, y recién el menú pide darlo vuelta. */
#idioma{position:fixed;inset:0;z-index:95;display:none;place-items:center;
  background:radial-gradient(120% 90% at 50% 15%,#1d4a72 0%,#0d2338 55%,#081420 100%)}
#idioma.on{display:grid}
#idioma .caja{text-align:center;width:min(320px,80vw)}
#idioma h1{font-size:clamp(24px,6.5vw,36px);font-weight:200;letter-spacing:-.02em;
  background:linear-gradient(160deg,#fff 30%,#8fe3a0);-webkit-background-clip:text;
  background-clip:text;color:transparent;margin-bottom:4px}
#idioma .sub{font:600 10.5px/1.7 ui-monospace,monospace;letter-spacing:.22em;
  color:rgba(234,244,255,.42);text-transform:uppercase;margin-bottom:22px}
#idioma button{display:block;width:100%;margin-top:10px;padding:14px 18px;
  border-radius:99px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#eaf4ff;font:600 15px/1 system-ui,sans-serif;
  cursor:pointer;transition:transform .12s ease,background .2s ease}
#idioma button:active{transform:scale(.97)}
#idioma button.sel{background:linear-gradient(135deg,#7ee3a0,#57b6ef);color:#04121a;border:none}

/* ── LA VIÑETA ROJA ──
   Se pinta con `box-shadow` hacia adentro y no con un degradado radial de
   fondo: un `radial-gradient` a pantalla completa es una capa más que el
   navegador compone en cada cuadro, y esto es una sombra que ya sabe dibujar.
   Y VA PIXELADA: el juego entero se dibuja a un tercio de resolución, así que
   una viñeta suave sería lo ÚNICO nítido del cuadro y se leería como que está
   pegada encima. Los escalones salen de repetir la sombra en anillos. */
/* la viñeta roja de estar roto vive en el shader del post (uniforme `rojo`), no
   acá: hecha con box-shadow salía suave y continua encima de una imagen
   escalonada, o sea pegada arriba del juego. Se pidió PIXELADA. */

/* ── HUD ── */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#fps{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top,0px));
  font:600 10.5px/1.6 ui-monospace,Menlo,monospace;color:rgba(234,244,255,.5);
  text-shadow:0 1px 4px rgba(0,0,0,.8);letter-spacing:.04em}
#teclas{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding:10px 13px;border-radius:12px;background:rgba(8,18,28,.5);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font:600 11px/1.85 ui-monospace,Menlo,monospace;color:rgba(234,244,255,.62);display:none}
body.pc #teclas{display:block}
#teclas b{color:#eaf4ff}
/* ── arriba a la derecha, sólo lo que NO se usa jugando ── */
#botones{position:absolute;right:max(10px,2.5vw);top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;gap:7px;pointer-events:auto}
.bt{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(8,18,28,.42);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);font:800 15px/1 system-ui,sans-serif;opacity:.8}
.bt:active{transform:translateY(1px);filter:brightness(1.3)}

/* ── ACCIONES, abajo a la derecha y debajo del pulgar ──
   El botón de correr estaba arriba, del lado opuesto a la mano que juega: para
   apretarlo había que soltar la palanca. Todo lo que se usa en movimiento baja
   acá, en racimo, con el salto grande porque es el que más se aprieta. */
#acciones{position:absolute;right:max(16px,4vw);bottom:max(18px,5vh);
  display:grid;grid-template-columns:auto auto;gap:11px;align-items:end;
  justify-items:center;pointer-events:auto}
.ac{border-radius:50%;display:grid;place-items:center;color:#eaf4ff;
  background:rgba(10,20,30,.42);border:1.6px solid rgba(255,255,255,.22);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font:800 11px/1 system-ui,sans-serif;letter-spacing:.06em;
  text-shadow:0 1px 4px rgba(0,0,0,.7);transition:transform .12s,background .2s,border-color .2s}
.ac:active{transform:scale(.9);filter:brightness(1.35)}
.ac.on{background:rgba(126,227,160,.3);border-color:rgba(126,227,160,.75);color:#eafff2}
.ac .ico{font-size:20px;line-height:1;margin-bottom:1px}
#acSalta{width:min(88px,19vw);aspect-ratio:1;grid-column:2;grid-row:1/3;
  background:rgba(126,227,160,.20);border-color:rgba(126,227,160,.5)}
#acSalta .ico{font-size:27px}
#acCorre{width:min(58px,13vw);aspect-ratio:1;grid-column:1;grid-row:1}
#acAgacha{width:min(58px,13vw);aspect-ratio:1;grid-column:1;grid-row:2}
body.pc #acciones{display:none}

/* ── MENÚ DE INICIO ──
   El fondo NO es una imagen: es la isla de verdad, filmada con un campo de
   visión de treinta grados. Con el teleobjetivo se aplasta la perspectiva, las
   copas se apilan unas sobre otras y el movimiento lento de la cámara se lee
   como una grúa de cine en vez de como un paseo. */
#menu{position:absolute;inset:0;z-index:44;display:none;place-items:center;
  background:linear-gradient(180deg,rgba(4,10,16,.30) 0%,rgba(4,10,16,.06) 38%,rgba(4,10,16,.72) 100%)}
#menu.on{display:grid}
#menu .mCaja{text-align:center;width:min(360px,84%)}
#menu .mEmb{position:relative;display:grid;place-items:center;margin-bottom:6px}
/* EL LOGO ES EL TÍTULO, no un emblema detrás de un título. Antes había una
   imagen al 78 % de opacidad y encima, superpuesta, la palabra escrita con la
   tipografía del sistema; eso significaba que el nombre del juego cambiaba de
   forma según el aparato —Roboto en Android, San Francisco en iPhone, Segoe en
   Windows— y que las dos cosas competían por el mismo espacio. Ahora el logo
   viene con la palabra adentro, va OPACO y ocupa el ancho que le corresponde a
   un título. Va en PNG con alfa: en JPG el fondo se ve como un cuadrado más
   claro flotando sobre el bosque por más que se lo mezcle.
   Y VA MEDIDO EN ALTO ADEMÁS DE EN ANCHO (`max-height` en vh): el menú tiene
   siete cosas apiladas y en un teléfono corto el título se come el aire de
   todas las demás. */
#menu .mEmb img{width:min(230px,58%);max-height:calc(var(--eh,100vh) * 0.155);object-fit:contain;
  filter:saturate(1.15) drop-shadow(0 6px 26px rgba(0,0,0,.6))}
/* EL NOMBRE VA DEBAJO DEL EMBLEMA Y NO ENCIMA. Antes iba superpuesto en
   absoluto sobre la imagen, y ahí las dos cosas se pelean el mismo espacio: la
   palabra le cae encima al dibujo y el dibujo le ensucia la palabra. Apilados,
   el solapamiento es imposible por construcción. */
#menu .mTit{font-weight:800;letter-spacing:.22em;text-indent:.22em;
  font-size:clamp(30px, calc(var(--eh,100vh) * 0.105), 54px);line-height:1;
  background:linear-gradient(168deg,#f4fff6 18%,#8fe3a0 52%,#f0c869);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,.75))}
#menu .mSub{font:600 10.5px/1.7 ui-monospace,monospace;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(234,244,255,.5);
  margin-bottom:min(24px, calc(var(--eh,100vh) * 0.028))}
#menu .mBtn{display:block;width:100%;border-radius:99px;
  padding:min(15px, calc(var(--eh,100vh) * 0.020)) 15px;
  margin-top:min(10px, calc(var(--eh,100vh) * 0.013));
  font-size:15px;font-weight:700;border:1px solid rgba(255,255,255,.17);
  color:rgba(234,244,255,.9);background:rgba(255,255,255,.06);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .16s}
#menu .mBtn:active{transform:scale(.97)}
#menu .mBtn.pri{background:linear-gradient(135deg,#7ee3a0,#57b6ef);color:#04121a;border:none;
  box-shadow:0 10px 30px rgba(87,182,239,.26)}
/* LAS MEDIDAS DEL MENÚ VAN TOPADAS EN vh ADEMÁS DE EN PÍXELES, y eso salió de
   una captura: con el escenario girado, un teléfono en vertical deja un marco
   de 412 píxeles de ALTO, y con las medidas fijas los siete elementos sumaban
   450 — el texto de la historia y el pie quedaban cortados por el borde de
   abajo. Con los topes, lo que se achica primero es el aire y no el texto. */
#menu .mHist{margin-top:min(18px, calc(var(--eh,100vh) * 0.022));
  font-size:clamp(10.5px, calc(var(--eh,100vh) * 0.029), 12.5px);
  line-height:1.5;color:rgba(234,244,255,.60);text-wrap:balance}
#menu .mPie{margin-top:min(10px, calc(var(--eh,100vh) * 0.013));font-size:10.5px;
  color:rgba(234,244,255,.34);line-height:1.4}

/* ── MENÚ DE PAUSA ── */
#pausa{position:absolute;inset:0;z-index:45;display:none;place-items:center;
  background:rgba(6,12,20,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#pausa.on{display:grid}
#pausa .caja{width:min(300px,80%);text-align:center}
#pausa h2{font-size:23px;font-weight:200;letter-spacing:.02em;margin-bottom:4px}
#pausa .sub{font:600 9.5px/1.6 ui-monospace,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(234,244,255,.34);margin-bottom:20px}
#pausa button{display:block;width:100%;padding:14px;border-radius:14px;margin-top:9px;
  font-size:14.5px;font-weight:600;border:1px solid rgba(255,255,255,.15);
  color:rgba(234,244,255,.9);background:rgba(255,255,255,.05)}
#pausa button:active{transform:scale(.98)}
#pausa button.pri{background:linear-gradient(135deg,#7ee3a0,#57b6ef);color:#04121a;border:none}
/* ── LAS MISIONES DEL DÍA ──
   El panel va ARRIBA A LA IZQUIERDA y no en el medio: es un renglón que hay que
   poder mirar de reojo mientras se camina, no un cartel que se lee y se cierra.
   Y el borde de color a la izquierda es lo que hace que se distinga del reloj y
   de los fps, que viven en la misma esquina. */
#obj{position:absolute;left:12px;top:calc(30px + env(safe-area-inset-top,0px));
  max-width:min(300px,62%);padding:8px 12px 9px 11px;border-radius:9px;
  background:rgba(8,18,28,.55);border-left:3px solid #7ee3a0;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  opacity:0;transition:opacity .4s;pointer-events:none}
#obj.on{opacity:1}
#obj .n{font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.20em;
  color:rgba(126,227,160,.85);text-transform:uppercase}
#obj .t{font-size:13.5px;font-weight:650;line-height:1.32;margin-top:1px}
#obj .s{font-size:11px;line-height:1.4;color:rgba(234,244,255,.55);margin-top:2px}
#obj.hecho{border-left-color:#f0c869}
#obj.hecho .n{color:rgba(240,200,105,.9)}

/* la pista de acción: aparece sola cuando hay algo cerca */
#pista{position:absolute;left:50%;bottom:calc(18% + 10px);transform:translateX(-50%);
  padding:8px 15px;border-radius:99px;background:rgba(8,18,28,.66);
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);font:600 12.5px system-ui,sans-serif;
  letter-spacing:.03em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#pista.on{opacity:1}
#pista b{color:#7ee3a0}
/* el botón de usar entra en el racimo de acciones, arriba del salto */
#acUsar{width:min(58px,13vw);aspect-ratio:1;grid-column:1;grid-row:3;
  background:rgba(240,200,105,.18);border-color:rgba(240,200,105,.55)}
#acUsar.apagado{opacity:.28;pointer-events:none}

/* ── EL MINIJUEGO DEL INFLADOR ──
   Una barra, una línea que la recorre y un bloque verde. Va en DOM y no en el
   lienzo 3D a propósito: es una interfaz, tiene que verse nítida a cualquier
   densidad de pantalla y no le sirve de nada estar dentro del mundo. */
#mini{position:absolute;inset:0;z-index:47;display:none;place-items:center;
  background:rgba(6,12,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#mini.on{display:grid}
#mini .caja{width:min(430px,86%);text-align:center;pointer-events:auto}
#mini .tit{font-size:15px;font-weight:700;letter-spacing:.02em}
#mini .cnt{font:700 11px/1.6 ui-monospace,monospace;letter-spacing:.18em;
  color:rgba(126,227,160,.9);margin-top:3px}
#mini .barra{position:relative;height:52px;margin:16px 0 6px;border-radius:10px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);overflow:hidden}
#mini .cubo{position:absolute;top:6px;bottom:6px;border-radius:5px;
  background:linear-gradient(180deg,#8ff0a8,#4cc472);box-shadow:0 0 14px rgba(126,227,160,.5)}
#mini .linea{position:absolute;top:-1px;bottom:-1px;width:4px;border-radius:2px;
  background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9)}
#mini .aviso{height:1.5em;font-size:12.5px;font-weight:600;
  color:rgba(234,244,255,.75);margin-top:4px}
#mini .btn{display:block;width:100%;margin-top:12px;padding:16px;border-radius:99px;
  font-size:15px;font-weight:700;border:none;color:#04121a;
  background:linear-gradient(135deg,#7ee3a0,#57b6ef)}
#mini .btn:active{transform:scale(.97)}
#mini .pie{margin-top:9px;font-size:11px;color:rgba(234,244,255,.42)}

/* ── LA CINEMÁTICA DE APERTURA ──
   Dos barras negras, un renglón de texto abajo y un botón de saltear. Las
   barras no son un adorno: son lo que le dice al jugador «esto no se juega, se
   mira», y sin ellas los primeros segundos se leen como que el juego se trabó.
   Y CRECEN desde cero en medio segundo, porque apareciendo de golpe se leen a
   error de dibujo. */
#cine{position:absolute;inset:0;z-index:46;display:none;pointer-events:none}
#cine.on{display:block}
#cine .barra{position:absolute;left:0;right:0;height:0;background:#05080c;
  transition:height .5s ease}
#cine.abre .barra{height:11%}
#cine .barra.ar{top:0} #cine .barra.ab{bottom:0}
/* EL TEXTO VIVE DENTRO DE LA BARRA DE ABAJO y no encima de la imagen: sobre el
   pasto saturado de este juego un renglón blanco se pierde, y ponerle una caja
   propia sería una tercera franja. Adentro de la barra ya hay negro. */
#cine .txt{position:absolute;left:6%;right:6%;bottom:0;height:11%;
  display:grid;place-items:center;text-align:center;
  font-size:clamp(13px,2.6vw,19px);line-height:1.45;font-weight:500;
  color:#eaf4ff;text-shadow:0 2px 10px rgba(0,0,0,.9);
  opacity:0;transition:opacity .45s}
#cine .txt.ver{opacity:1}
#cine .saltar{position:absolute;right:max(12px,3vw);
  bottom:calc(11% + 12px);pointer-events:auto;
  padding:9px 16px;border-radius:99px;font:600 12px/1 system-ui,sans-serif;
  letter-spacing:.12em;color:rgba(234,244,255,.72);
  background:rgba(8,18,28,.55);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cine .saltar:active{transform:scale(.95)}
/* el fundido a negro entre escena y escena, y el de entrada al juego */
#cine .velo{position:absolute;inset:0;background:#05080c;opacity:0;
  transition:opacity .55s}
#cine .velo.ver{opacity:1}

#joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);width:min(148px,32vw);
  aspect-ratio:1;pointer-events:auto;opacity:.9;display:none}
body:not(.pc) #joy{display:block}
#joy canvas{width:100%;height:100%;display:block}

</style>
</head>
<body>

<div id="carga"><div class="caja">
  <h1>LEMI</h1>
  <p id="cTxt" data-i18n="cargando">Seeding the island…</p>
  <div class="barra"><i id="cBar"></i></div>
  <div class="pista" id="cPista"></div>
</div></div>

<div id="idioma"><div class="caja">
  <h1>LEMI</h1>
  <div class="sub">language · idioma · idioma</div>
  <button data-lang="en">English</button>
  <button data-lang="es">Español</button>
  <button data-lang="pt">Português</button>
</div></div>

<div id="escenario">
<div id="hud">
  <div id="fps"></div>
  <div id="botones">
    <button class="bt" id="bFull" title="Pantalla completa">⛶</button>
    <button class="bt" id="bPanel" title="Pausa">☰</button>
  </div>
  <div id="acciones">
    <button class="ac" id="acCorre"><span class="ico">»</span><i data-i18n="bCorrer">RUN</i></button>
    <button class="ac" id="acAgacha"><span class="ico">⌄</span><i data-i18n="bAgachar">CROUCH</i></button>
    <button class="ac" id="acSalta"><span class="ico">⌃</span><i data-i18n="bSaltar">JUMP</i></button>
    <button class="ac apagado" id="acUsar"><span class="ico">✋</span><i data-i18n="bUsar">USE</i></button>
  </div>
  <div id="obj"><div class="n"></div><div class="t"></div><div class="s"></div></div>
  <div id="pista"></div>
  <div id="teclas">
    <b>W A S D</b> moverse · <b>ratón</b> mirar<br>
    <b>Shift</b> correr · <b>Ctrl</b> agacharse<br>
    <b>Espacio</b> saltar · <b>E</b> usar · <b>Esc</b> pausa
  </div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
</div>

let IDIOMA = 'en';
try { const g = localStorage.getItem('lemi.idioma');
      if (g && TXT[g]) IDIOMA = g; } catch(e){}

/* devuelve el texto de la clave. Si en un idioma falta, cae al inglés y no a
   `undefined`: un hueco tiene que verse como una frase en otro idioma, no como
   un cartel vacío. */
function TX(clave){
  const d = TXT[IDIOMA];
  const v = (d && d[clave] !== undefined) ? d[clave] : TXT.en[clave];
  return v === undefined ? clave : v;
}
/* y ésta es para las que llevan números adentro: `TX` devuelve la función y
   `TXF` la llama, así quien la usa no tiene que saber cuál de las dos es. */
function TXF(clave, ...args){
  const v = TX(clave);
  return typeof v === 'function' ? v(...args) : v;
}

/* ── repinta TODO el texto de la página ──
   Un barrido por `data-i18n` más los pocos sitios que llevan HTML adentro. Va
   una sola función y no un `if` por elemento: el próximo cartel que se agregue
   se traduce solo con ponerle el atributo, que es lo contrario de lo que pasa
   cuando cada sitio se acuerda de traducirse por su cuenta. */
function pintaIdioma(){
  for (const e of document.querySelectorAll('[data-i18n]'))
    e.textContent = TX(e.getAttribute('data-i18n'));
  const h = document.getElementById('mHist');
  if (h) h.textContent = TX('mHist');
  const mp = document.getElementById('miPie');
  if (mp) mp.innerHTML = TXF('miAyuda', document.body.classList.contains('pc'));
  const tc = document.getElementById('teclas');
  if (tc) tc.innerHTML =
      '<b>W A S D</b> ' + TX('kMover') + ' · <b>' + (IDIOMA === 'en' ? 'mouse' : IDIOMA === 'pt' ? 'mouse' : 'ratón') + '</b> ' +
      (IDIOMA === 'en' ? 'look' : IDIOMA === 'pt' ? 'olhar' : 'mirar') + '<br>' +
      '<b>Shift</b> ' + TX('kCorrer') + ' · <b>Ctrl</b> ' + TX('kAgachar') + '<br>' +
      '<b>' + (IDIOMA === 'en' ? 'Space' : IDIOMA === 'pt' ? 'Espaço' : 'Espacio') + '</b> ' + TX('kSaltar') +
      ' · <b>E</b> ' + TX('kUsar') + ' · <b>Esc</b> ' + (IDIOMA === 'en' ? 'pause' : IDIOMA === 'pt' ? 'pausa' : 'pausa');
  document.title = 'LEMI · ' + TX('mSub');
  /* y lo que el juego ya está mostrando ahora mismo: los objetivos, el cartel
     de lo que hay cerca y el pie del menú. Sin esto, cambiar de idioma en medio
     de una partida deja el panel de misión en el idioma anterior hasta que
     cambie de misión sola. */
  if (window.repintaJuego) window.repintaJuego();
}
function ponIdioma(v){
  if (!TXT[v]) return;
  IDIOMA = v;
  try { localStorage.setItem('lemi.idioma', v); } catch(e){}
  for (const b of document.querySelectorAll('#idioma button'))
    b.classList.toggle('sel', b.getAttribute('data-lang') === v);
  pintaIdioma();
}

/* ══════════════════════════════════════════════════════════════════════════
   VERGEL · una isla con el look pedido: pixelado, saturado, luz ambiental
   suave, cúmulos gordos y vegetación que se sostiene de cerca.

   Todo es procedural. No hay un solo archivo de textura ni de modelo: las
   hojas, la corteza, el pasto y las nubes se arman con ruido y geometría al
   abrir. Eso lo hace instantáneo y hace que «otra isla» sea un botón.

   EL PIXELADO no es un filtro encima. La escena se dibuja de verdad a una
   fracción de la resolución, en un render target con filtro NEAREST, y recién
   ese cuadro chico se agranda a pantalla completa. Por eso los bordes de las
   sombras y de las hojas quedan escalonados como corresponde, en vez de un
   mosaico borroso pegado sobre una imagen nítida.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';

const $ = id => document.getElementById(id);
const cl = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;

/* ───────────────────────── ajustes vivos ───────────────────────── */
const CFG = {
  /* AJUSTE FIJO: brillo y saturación al tope, contraste 1.10 y nueve niveles de
     color. Con nueve escalones por canal el degradado del cielo se corta en
     bandas anchas y todo el cuadro se empasta como un póster: es lo que da el
     aire de consola vieja.

     EL PÍXEL PASA DE 2 A 3, que es lo que se pidió. En un marco de 892×412 eso
     lleva el destino de render de 446×206 a 298×138 —la mitad de los píxeles—,
     y a ojo la diferencia es que los troncos y las copas dejan de tener bordes
     casi limpios y pasan a escalonarse de verdad. Comparados los tres al lado:
     en 2 todavía se lee a «3D con poco filtro», en 4 el bosque del fondo se
     empieza a empastar y las copas dejan de contarse. En 3 se ve el escalón y
     todavía se distingue qué es cada cosa, que es lo que tiene que pasar en un
     juego donde hay que encontrar ramas entre los árboles. */
  pix: 3, sat: 2.2, bri: 1.6, con: 1.10, pos: 9,
  nubes: true, sombras: true, viento: true,
  /* fase del día: 0 medianoche · .25 amanecer · .5 mediodía · .75 atardecer */
  sol: 0.42, girar: true
};
/* el ciclo completo, día y noche, en tres minutos */
const CICLO = 180;

/* ══════════════════════════ RUIDO ══════════════════════════
   Value noise con hash entero: determinista, sin dependencias, y con la
   semilla se puede volver a sembrar la misma isla. */
let SEM = (Math.random()*1e9)|0;
/* OJO CON LA ARITMÉTICA. La versión obvia de este hash multiplica por
   constantes de 64 bits, y en JavaScript eso pasa de MAX_SAFE_INTEGER: el
   número pierde los bits bajos —justo los que dan el azar— y el hash devuelve
   casi siempre lo mismo. El resultado era un terreno degenerado, con la isla
   partida en pedazos flotando y el jugador apareciendo bajo el agua.
   Con Math.imul la multiplicación es de 32 bits exactos y el ruido se porta. */
function hash2(x, y, s){
  let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ Math.imul(s|0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
const suave = t => t*t*(3-2*t);
function ruido(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x-xi, yf = y-yi;
  const u = suave(xf), v = suave(yf);
  return lerp(lerp(hash2(xi,yi,s), hash2(xi+1,yi,s), u),
              lerp(hash2(xi,yi+1,s), hash2(xi+1,yi+1,s), u), v);
}
function fbm(x, y, oct, s){
  let a = 0.5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++){
    sum += a * ruido(x*f, y*f, s + i*97);
    norm += a; a *= 0.5; f *= 2;
  }
  return sum / norm;
}

/* ══════════════════════════ EL TERRENO ══════════════════════════
   Una isla: fbm por encima, y una máscara radial que la hunde en el agua
   en los bordes. La máscara no es un círculo limpio —se le suma ruido— así
   la costa entra y sale y aparecen bahías. */
/* ISLA GRANDE: 660 metros de lado. Con 190 se cruzaba caminando en menos de un
   minuto y no quedaba nada por descubrir. */
const MITAD = 330;         /* medio lado del mundo, en metros */
const MAR = 0;              /* nivel del agua */
let PLAYA = 1.6;            /* hasta acá es arena */

function alturaCruda(x, z){
  const s = SEM;
  const cont = fbm(x*0.0042, z*0.0042, 4, s) * 30;         /* colinas grandes */
  const det  = fbm(x*0.021,  z*0.021,  4, s+311) * 5.2;    /* rugosidad */
  const mont = Math.pow(fbm(x*0.0026, z*0.0026, 3, s+733), 2.4) * 34;
  return cont + det + mont;
}
function mascaraIsla(x, z){
  const d = Math.hypot(x, z) / MITAD;
  /* el borde de la isla ondula: sin esto es una moneda */
  const on = (fbm(x*0.0075, z*0.0075, 3, SEM+55) - 0.5) * 0.42;
  const t = cl((0.86 - d + on) / 0.38, 0, 1);
  return t*t*(3-2*t);
}
/* ══ LA CUEVA, EXCAVADA EN LA PROPIA FUNCIÓN DE ALTURA ══
   La boca de la cueva NO es una malla apoyada contra una loma: es un hueco de
   verdad hundido en el terreno. Y tiene que estar ACÁ ADENTRO, en `H()`, porque
   `H()` es la única fuente de la altura del suelo: la malla del terreno, las
   colisiones del jugador, dónde se planta cada árbol y dónde camina el camello
   salen todas de ella. Excavando la malla por un lado y el suelo por otro, uno
   caminaría por el aire sobre la boca o chocaría contra un hueco visible.

   El hueco es un CUENCO de coseno elevado —suave en el borde, hondo en el
   centro— que se recuesta contra la ladera. El coseno elevado y no una campana
   gaussiana porque tiene borde finito: fuera del radio vale exactamente cero y
   no hay que preguntarse a partir de dónde se puede despreciar.
   `CUEVA` se elige ANTES de armar el terreno; mientras sea null esto no cuesta
   más que una comparación. */
let CUEVA = null;
function H(x, z){
  const m = mascaraIsla(x, z);
  let h = alturaCruda(x, z) * m - (1 - m) * 9 - 3.2;
  if (CUEVA){
    /* PRIMERO EL CERRO Y DESPUÉS LA BOCA, en ese orden.
       Una boca de cueva necesita monte ENCIMA; sin eso es un pozo en un prado,
       que es exactamente como se veía cuando esto era sólo el cuenco: en la
       captura, un montículo de piedra apoyado sobre el pasto.
       El terreno de esta isla es suave y no siempre hay una ladera donde haga
       falta, así que la ladera se LEVANTA: una loma de coseno elevado centrada
       veinte metros DETRÁS de la boca. Al llegar caminando de frente, lo que se
       ve es un cerro con un agujero negro en el pie.
       Va multiplicada por la máscara de la isla: sin eso, una cueva cerca de la
       costa levantaría una montaña saliendo del mar. */
    const dm = Math.hypot(x - CUEVA.mx, z - CUEVA.mz);
    if (dm < CUEVA.mr){
      const t = 0.5 + 0.5*Math.cos(Math.PI * dm / CUEVA.mr);
      h += CUEVA.malto * t * t * m;
    }
    const d = Math.hypot(x - CUEVA.x, z - CUEVA.z);
    if (d < CUEVA.r){
      const t = 0.5 + 0.5*Math.cos(Math.PI * d / CUEVA.r);
      h -= CUEVA.hondo * t * t;
    }
  }
  return h;
}
/* normal por diferencias finitas: la usan la cámara y el sembrado */
function pendiente(x, z){
  const e = 1.4;
  const gx = H(x+e, z) - H(x-e, z), gz = H(x, z+e) - H(x, z-e);
  return Math.hypot(gx, gz) / (2*e);
}

/* ══════════════════════════ PALETA ══════════════════════════
   Colores saturados a propósito: el grado de color de después los levanta
   todavía más, pero si la base ya es apagada no hay filtro que la salve. */
const PAL = {
  arena:   new T.Color('#efdcae'),
  arena2:  new T.Color('#e0c78e'),
  pasto:   new T.Color('#63c33f'),
  pasto2:  new T.Color('#4aa32e'),
  pastoSec:new T.Color('#8fd24a'),
  roca:    new T.Color('#8b8478'),
  roca2:   new T.Color('#6e685e'),
  tierra:  new T.Color('#7a5a38'),
  agua:    new T.Color('#2aa8d8'),
  aguaHon: new T.Color('#116a9e')
};

/* ══════════════════════════ ESCENA ══════════════════════════ */
const lienzo = document.createElement('canvas');
document.getElementById('escenario').appendChild(lienzo);
const ren = new T.WebGLRenderer({ canvas: lienzo, antialias: false, powerPreference: 'high-performance' });
ren.setPixelRatio(1);                       /* el pixelado manda: nada de DPR */
ren.outputColorSpace = T.SRGBColorSpace;
ren.toneMapping = T.NoToneMapping;          /* el grado de color lo hago yo */
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;

const escena = new T.Scene();
const cam = new T.PerspectiveCamera(66, 1, 0.1, 2200);
escena.fog = new T.Fog(0x9fd0ef, 230, 640);

/* ── el cielo: una esfera con degradé vertical, nada de textura ── */
const cieloMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: {
    arriba: { value: new T.Color('#2f7fd6') },
    medio:  { value: new T.Color('#79c4f2') },
    abajo:  { value: new T.Color('#cfe9f7') },
    sol:    { value: new T.Vector3(0,1,0) },
    calor:  { value: new T.Color('#ffe9b0') }
  },
  vertexShader: `varying vec3 vD;
    void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 arriba, medio, abajo, calor; uniform vec3 sol; varying vec3 vD;
    void main(){
      float h = clamp(vD.y*0.5+0.5, 0.0, 1.0);
      vec3 c = mix(abajo, medio, smoothstep(0.42, 0.60, h));
      c = mix(c, arriba, smoothstep(0.58, 0.95, h));
      /* halo alrededor del sol: da la sensación de aire caliente sin costar nada */
      float d = max(0.0, dot(normalize(vD), normalize(sol)));
      c += calor * pow(d, 8.0) * 0.55 + calor * pow(d, 2.0) * 0.10;
      gl_FragColor = vec4(c, 1.0);
    }`
});
const cielo = new T.Mesh(new T.SphereGeometry(1400, 24, 16), cieloMat);
escena.add(cielo);

/* ── luces ── */
const sol = new T.DirectionalLight(0xfff2d0, 2.35);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
sol.shadow.camera.near = 1; sol.shadow.camera.far = 460;
const SOMBRA_R = 78;
sol.shadow.camera.left = -SOMBRA_R; sol.shadow.camera.right = SOMBRA_R;
sol.shadow.camera.top = SOMBRA_R; sol.shadow.camera.bottom = -SOMBRA_R;
sol.shadow.bias = -0.0004;
/* NORMAL BIAS CHICO. Con 0.42 los troncos salían NEGROS: el desplazamiento a lo
   largo de la normal es más grueso que el propio cilindro, así que cada tronco
   se auto-sombreaba entero. Las copas y los arbustos zafaban por ser bultos
   grandes, y por eso parecía un problema de color y no de sombra. */
sol.shadow.normalBias = 0.045;
escena.add(sol); escena.add(sol.target);

/* EL AMBIENTE ES LA MITAD DEL LOOK. Un hemisférico fuerte —cielo arriba,
   rebote del pasto abajo— es lo que hace que las sombras no sean pozos negros
   y que todo se vea bañado en luz de mediodía. */
const ambiente = new T.HemisphereLight(0xa8dcff, 0x76b84a, 1.30);
escena.add(ambiente);
/* RELLENO. Una segunda direccional, fría, floja y sin sombra, apuntando desde
   el lado contrario al sol. En la realidad eso lo hace el cielo rebotando en el
   suelo; sin ella la cara en sombra de cada árbol y de cada carpa es un plano
   liso del mismo color, y el bosque se ve recortado en cartulina. */
const relleno = new T.DirectionalLight(0xbcd8ff, 0);
escena.add(relleno); escena.add(relleno.target);

/* ══════════════════════════ TEXTURAS PROCEDURALES ══════════════════════════
   Chiquitas y con filtro NEAREST: a esta resolución de render, una textura
   grande y suave se pierde. El grano tiene que ser del tamaño del píxel. */
function lienzoTex(n, pinta){
  const c = document.createElement('canvas'); c.width = c.height = n;
  pinta(c.getContext('2d'), n);
  const t = new T.CanvasTexture(c);
  t.magFilter = T.NearestFilter; t.minFilter = T.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = T.SRGBColorSpace;
  t.generateMipmaps = true;
  return t;
}
/* moteado genérico: la base de casi todo */
const moteado = (g, n, base, luz, osc, densidad) => {
  g.fillStyle = base; g.fillRect(0,0,n,n);
  for (let i = 0; i < n*n*densidad; i++){
    const x = (Math.random()*n)|0, y = (Math.random()*n)|0;
    g.fillStyle = Math.random() < 0.5 ? luz : osc;
    g.fillRect(x, y, 1, 1);
  }
};
const texPasto = lienzoTex(64, (g,n) => {
  moteado(g, n, '#5cbb39', '#7fd94e', '#3f8f27', 0.55);
  for (let i = 0; i < 90; i++){                      /* matas más claras */
    const x=(Math.random()*n)|0, y=(Math.random()*n)|0;
    g.fillStyle='#8ee158'; g.fillRect(x,y,1,2);
  }
});
const texArena = lienzoTex(64, (g,n) => moteado(g,n,'#e9d3a0','#f7e9c6','#d3b57e',0.4));
const texRoca  = lienzoTex(64, (g,n) => {
  moteado(g,n,'#867f73','#a49c8d','#5f594f',0.5);
  g.fillStyle='#6d675c';
  for(let i=0;i<12;i++){ const y=(Math.random()*n)|0; g.fillRect(0,y,n,1); }
});
/* CORTEZA CLARA. La primera versión era #6b4a2c y los troncos se veían NEGROS:
   medido en un caso aislado, un cilindro con esa textura daba (59,43,23) —ya de
   por sí oscuro—, y encima el tronco vive bajo la sombra de su propia copa. La
   cara lateral de un cilindro además recibe poco sol cuando el sol está alto,
   porque su normal es horizontal. Con una base clara el tronco se lee incluso
   en sombra, que es como se ve un árbol de verdad a plena luz. */
const texCorteza = lienzoTex(32, (g,n) => {
  g.fillStyle='#a87a4c'; g.fillRect(0,0,n,n);
  for(let x=0;x<n;x++) for(let y=0;y<n;y++){
    const v=Math.random();
    if(v<0.24){ g.fillStyle='#8a6038'; g.fillRect(x,y,1,1); }
    else if(v<0.40){ g.fillStyle='#c69a67'; g.fillRect(x,y,1,1); }
  }
  /* vetas verticales: es lo que hace que se lea como corteza y no como barro */
  for(let i=0;i<10;i++){ const x=(Math.random()*n)|0;
    g.fillStyle='#7d5730'; g.fillRect(x,0,1,n); }
});
/* GRANO NEUTRO, no verde. Esta textura MULTIPLICA al color de la instancia: si
   además es verde oscuro, se multiplican dos oscuros y el bosque entero sale
   casi negro, que es justo lo que pasaba. Centrada en blanco sólo aporta
   textura y deja que el tono lo decida cada árbol. */
const texHoja = lienzoTex(32, (g,n) => moteado(g,n,'#e6e6e6','#ffffff','#bdbdbd',0.6));

/* LA MATA DE PASTO: silueta con alfa, para las cruces.
   Va a 48 píxeles y no a 32, y no es por lujo: la mata se dibuja de un metro de
   alto y a dos pasos ocupa buena parte de la pantalla, así que a 32 cada brizna
   medía un píxel y medio de ancho y el borde escalonado se leía a error y no a
   estilo. Tres cosas que la vuelven pasto y no un peine:
     · ONCE briznas y no siete, con alturas de la mitad al total: un mechón de
       verdad tiene hojas nuevas cortas y hojas viejas largas;
     · CURVA, no inclinación recta. La hoja se dobla con el cuadrado de la
       altura, así que sale vertical del suelo y cae en la punta;
     · una de cada cinco va SECA y una de cada seis lleva ESPIGA. Un pasto de un
       solo verde es una alfombra; lo que lo hace pasto es que no todas las
       hojas estén igual de vivas. */
function texBrizna(){
  const N = 48;
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const g = c.getContext('2d');
  g.clearRect(0,0,N,N);
  const briznas = 11;
  for (let i = 0; i < briznas; i++){
    const bx = 2 + i*(N-6)/briznas + ((Math.random()*3)|0);
    const alto = Math.round(N*(0.45 + Math.random()*0.53));
    const curva = (Math.random()-0.5) * 11;
    const seca = Math.random() < 0.20;
    const espiga = Math.random() < 0.17;
    let px = bx, py = 0;
    for (let y = 0; y < alto; y++){
      const t = y/alto;
      const w = Math.max(1, Math.round(2.6*(1-t*0.8)));
      px = Math.round(bx + curva*t*t);
      py = N-1-y;
      /* la punta más clara que la base: es como le pega la luz a un mechón.
         LA BASE ARRANCA EN 0,74 Y NO EN 0,52, y eso salió de mirar una captura:
         con la base oscura, las briznas contra un suelo verde clarísimo —este
         juego satura al tope— se leían como PALITOS SECOS clavados en el pasto
         en vez de como pasto. Una brizna tiene que ser más clara que la tierra,
         no más oscura. */
      const lum = 0.74 + t*0.34;
      const col = seca
        ? 'rgb('+Math.round(168*lum+46)+','+Math.round(152*lum+38)+','+Math.round(66*lum+18)+')'
        : 'rgb('+Math.round(96*lum+22)+','+Math.round(206*lum+34)+','+Math.round(62*lum+16)+')';
      g.fillStyle = col;
      g.fillRect(px, py, w, 1);
    }
    if (espiga){
      g.fillStyle = seca ? '#d8c47a' : '#b9e07a';
      for (let k = 0; k < 5; k++) g.fillRect(px - (k&1), py - k, 2, 1);
    }
  }
  const t = new T.CanvasTexture(c);
  t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter;
  t.colorSpace = T.SRGBColorSpace; t.generateMipmaps = false;
  return t;
}
const texPastoAlfa = texBrizna();

/* LA FLOR: cuatro pétalos y un centro, en un cuadrito con alfa. Es lo más
   barato que existe —una sola malla instanciada para toda la isla— y es lo que
   saca al prado de ser una sola mancha verde. El color va POR INSTANCIA, así
   que con una textura blanca salen amarillas, blancas y violetas. */
const texFlor = (() => {
  const N = 16;
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const g = c.getContext('2d');
  g.clearRect(0,0,N,N);
  g.fillStyle = '#ffffff';
  /* los cuatro pétalos, como una cruz de bloques */
  g.fillRect(6, 2, 4, 5); g.fillRect(6, 9, 4, 5);
  g.fillRect(2, 6, 5, 4); g.fillRect(9, 6, 5, 4);
  g.fillStyle = '#f2f2f2';
  g.fillRect(6, 6, 4, 4);
  g.fillStyle = '#8a7a2a';                       /* el centro, siempre oscuro */
  g.fillRect(7, 7, 2, 2);
  const t = new T.CanvasTexture(c);
  t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter;
  t.colorSpace = T.SRGBColorSpace; t.generateMipmaps = false;
  return t;
})();

/* ══════════════════════════ MALLA DEL TERRENO ══════════════════════════
   Plano subdividido, desplazado por H(), con color por vértice y flatShading.
   Las caras planas son parte del look: con normales suavizadas el terreno se
   vuelve un globo de goma y se pierde el aire de maqueta. */
/* la malla acompaña al tamaño: 300 cuadros para 660 m son 2,2 m por cuadro,
   parecido al detalle de antes y sin dispararse en vértices */
const SEG = 300;
let terreno = null, agua = null;
function armaTerreno(){
  if (terreno){ escena.remove(terreno); terreno.geometry.dispose(); }
  const g = new T.PlaneGeometry(MITAD*2, MITAD*2, SEG, SEG);
  g.rotateX(-Math.PI/2);
  const p = g.attributes.position, n = p.count;
  const col = new Float32Array(n*3);
  const c = new T.Color();
  for (let i = 0; i < n; i++){
    const x = p.getX(i), z = p.getZ(i);
    const h = H(x, z);
    p.setY(i, h);
    /* la mezcla de color por altura y pendiente: arena abajo, pasto en lo
       llano, roca donde empina, y una variación de ruido para que no queden
       franjas planas de un solo verde */
    const s = pendiente(x, z);
    const v = fbm(x*0.03, z*0.03, 2, SEM+9);
    if (h < PLAYA){
      c.copy(PAL.arena).lerp(PAL.arena2, v);
    } else {
      c.copy(PAL.pasto).lerp(PAL.pasto2, v);
      c.lerp(PAL.pastoSec, cl((h-8)/26, 0, 1) * 0.5);
      c.lerp(PAL.arena, cl((PLAYA + 2.2 - h)/2.2, 0, 1));   /* borde de playa */
    }
    c.lerp(PAL.roca, cl((s - 0.42)/0.5, 0, 1));
    c.lerp(PAL.roca2, cl((s - 0.85)/0.5, 0, 1) * 0.7);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new T.MeshLambertMaterial({ vertexColors: true, flatShading: true, map: texPasto });
  /* la textura se usa sólo como grano fino: el color lo pone el vértice */
  m.map.repeat.set(90, 90);
  m.onBeforeCompile = sh => {
    /* SE REEMPLAZA EL TROZO ENTERO, no se le agrega algo detrás: el nombre de la
       variable que declara `map_fragment` cambió entre versiones de three
       (`texelColor` antes, `sampledDiffuseColor` ahora) y apoyarse en él rompe
       el shader sin decir por qué. Acá se muestrea a mano y no se depende de
       ningún nombre interno. */
    sh.fragmentShader = sh.fragmentShader.replace(
      '#include <map_fragment>',
      `#ifdef USE_MAP
         /* el mapa aporta MOTEADO, no color: se centra en 1.0 y se atenúa, así
            el color sigue viniendo del vértice y la textura sólo da el grano */
         vec4 mota = texture2D(map, vMapUv);
         diffuseColor.rgb *= mix(vec3(1.0), mota.rgb * 1.9, 0.30);
       #endif`);
  };
  terreno = new T.Mesh(g, m);
  terreno.receiveShadow = true;
  escena.add(terreno);
}

/* ── el agua: plano con olas por vértice, dos azules y algo de transparencia ── */
function armaAgua(){
  if (agua){ escena.remove(agua); agua.geometry.dispose(); }
  const g = new T.PlaneGeometry(MITAD*2.9, MITAD*2.9, 60, 60);
  g.rotateX(-Math.PI/2);
  const col = new Float32Array(g.attributes.position.count*3);
  const c = new T.Color();
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const prof = cl((MAR - H(p.getX(i), p.getZ(i))) / 12, 0, 1);
    c.copy(PAL.agua).lerp(PAL.aguaHon, prof);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  const m = new T.MeshLambertMaterial({ vertexColors: true, flatShading: true,
    transparent: true, opacity: 0.86 });
  agua = new T.Mesh(g, m);
  agua.position.y = MAR;
  agua.receiveShadow = false;
  escena.add(agua);
  agua.userData.base = g.attributes.position.array.slice();
}

/* ══════════════════════════ VEGETACIÓN ══════════════════════════
   Tres especies de árbol, arbustos, rocas y matas de pasto. Todo va por
   InstancedMesh: un solo draw call por pieza, así entran miles sin que el
   teléfono se caiga. */
/* NADA DE `vertexColors` ACÁ. El color va POR INSTANCIA, y para eso three usa
   `instanceColor`, que es otra cosa: con `vertexColors:true` el shader además
   espera un atributo `color` en la geometría, y como las copas y los conos no
   lo tienen, leía basura y TODA la vegetación salía negra. Con `setColorAt` y
   sin `vertexColors` three define `USE_INSTANCING_COLOR` solo y multiplica bien. */
const matCorteza = new T.MeshLambertMaterial({ map: texCorteza, flatShading: true });
const matHoja    = new T.MeshLambertMaterial({ map: texHoja, flatShading: true });
const matRoca    = new T.MeshLambertMaterial({ map: texRoca, flatShading: true });

/* copa: un icosaedro achatado y deformado, para que no sean bolas perfectas.
   `chato` decide la silueta: 0,78 es la copa redonda de siempre y 0,34 es la
   copa de sombrilla de las acacias. */
function geoCopa(r, semilla, chato){
  const g = new T.IcosahedronGeometry(r, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const k = 0.82 + hash2((x*31)|0, (z*37)|0, semilla) * 0.42;
    p.setXYZ(i, x*k, y*k*(chato || 0.78), z*k);
  }
  g.computeVertexNormals();
  return g;
}
/* LA SOMBRILLA de la acacia: la copa chata, pero además CORTADA POR ABAJO.
   Una copa achatada a secas sigue siendo una lenteja y desde el suelo se le ve
   la panza redonda; lo que hace la silueta de acacia es que la base sea PLANA,
   como si el ramaje se abriera de golpe a una altura. Se aplasta contra un
   plano en vez de escalar, así los vértices de arriba no se mueven. */
function geoSombrilla(r, semilla){
  const g = geoCopa(r, semilla, 0.40);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const y = p.getY(i);
    if (y < -r*0.06) p.setY(i, -r*0.06 + (y + r*0.06)*0.18);
  }
  g.computeVertexNormals();
  return g;
}
/* fronda de palmera: una tira que se abre y cae, hecha con un plano curvado */
function geoFronda(largo, ancho){
  const seg = 7;
  const g = new T.PlaneGeometry(ancho, largo, 1, seg);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const y = p.getY(i);
    /* SE ACOTA A [0,1] Y NO ES POR PROLIJIDAD. `PlaneGeometry` arma la última
       fila como `seg * (largo/seg) - largo/2`, y eso en coma flotante da un
       pelo MENOS que -largo/2: `t` salía en -1.3e-16, y `Math.pow(negativo,
       2.1)` es NaN. Los dos vértices de la punta de cada fronda quedaban en
       NaN, la palmera se dibujaba rota y la consola tiraba «Computed radius is
       NaN» sin decir de qué. */
    const t = cl((y + largo/2) / largo, 0, 1);     /* 0 en la base, 1 en la punta */
    p.setZ(i, -Math.pow(t, 2.1) * largo * 0.42);   /* la caída */
    p.setX(i, p.getX(i) * (0.35 + Math.sin(t*Math.PI) * 0.95));
  }
  g.rotateX(-Math.PI/2);
  g.translate(0, 0, largo/2);
  g.computeVertexNormals();
  return g;
}

const GRUPOS = [];   /* para poder borrar todo al resembrar */
/* claros: alrededor del campamento y de cada sitio no crece nada, para que se
   llegue caminando y no haya que abrirse paso entre árboles */
let CLAROS = [];
function enClaro(x, z){
  for (const c of CLAROS) if (Math.hypot(x-c.x, z-c.z) < c.r) return true;
  return false;
}
function instanciar(geo, mat, lista, sombra){
  if (!lista.length) return null;
  const im = new T.InstancedMesh(geo, mat, lista.length);
  im.castShadow = !!sombra; im.receiveShadow = true;
  const m = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler();
  const blanco = new T.Color(1,1,1);
  lista.forEach((o, i) => {
    e.set(o.rx||0, o.ry||0, o.rz||0);
    q.setFromEuler(e);
    m.compose(new T.Vector3(o.x, o.y, o.z), q, new T.Vector3(o.sx||o.s||1, o.sy||o.s||1, o.sz||o.s||1));
    im.setMatrixAt(i, m);
    im.setColorAt(i, o.c || blanco);      /* crea `instanceColor` la primera vez */
  });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.computeBoundingSphere();
  escena.add(im); GRUPOS.push(im);
  return im;
}

/* variación de verde por instancia: sin esto el bosque es de plástico */
function verde(t){
  /* claridad alta a propósito: el material es Lambert y la cara en sombra ya
     baja sola. Si la base es oscura, el lado sombreado se va a negro. */
  return new T.Color().setHSL(0.255 + (Math.random()-0.5)*0.05,
                              0.62 + Math.random()*0.20,
                              0.46 + t*0.17 + Math.random()*0.08);
}

let pastoMesh = null, matPasto = null, floresMesh = null, matFlor = null;
const RELOJ = { value: 0 };

/* SOLTAR UN OBJETO Y TODO LO QUE CUELGA DE ÉL.
   Antes acá decía `g.geometry.dispose()` a secas, y en `GRUPOS` no hay sólo
   mallas: el campamento, el mojón, el círculo y el arco se guardan como Group,
   y un Group NO TIENE `geometry`. O sea que la primera vuelta de este bucle
   tiraba un TypeError, y como está adentro de un `forEach` dentro de una
   función async, el error se llevaba puesto el sembrado ENTERO sin decir nada:
   `window.__errs` quedaba vacío porque una promesa rechazada no dispara el
   evento `error` de la ventana.
   El efecto era que «Otra isla» devolvía una isla SIN UN SOLO ÁRBOL. Medido:
   96 llamadas de dibujo y 747k triángulos antes de tocar el botón, 23 y 282k
   después. Los materiales NO se sueltan: son compartidos y viven todo el juego.
   Verificado que la prueba detecta el defecto: con la línea vieja puesta, las
   cuentas después de resembrar son 23/282k; con ésta, 97/762k. */
function soltar(obj){
  /* LAS GEOMETRÍAS MARCADAS COMO COMPARTIDAS NO SE SUELTAN. Los cuatro
     personajes de la cinemática están hechos con la MISMA caja unitaria —una
     sola geometría para los cuarenta huesos—, así que soltar al primero dejaba
     sin geometría a los otros tres y al camello. Una geometría liberada no
     avisa: deja de dibujarse y ya. */
  obj.traverse(o => { if (o.geometry && !o.geometry.userData.compartida) o.geometry.dispose(); });
  escena.remove(obj);
}
function sembrar(prog){
  /* limpiar lo anterior */
  GRUPOS.forEach(soltar);
  GRUPOS.length = 0;
  if (pastoMesh){ escena.remove(pastoMesh); pastoMesh.geometry.dispose(); pastoMesh = null; }
  if (floresMesh){ escena.remove(floresMesh); floresMesh.geometry.dispose(); floresMesh = null; }

  const troncos=[], copas=[], somb=[], conos=[], frondas=[], cocos=[],
        arbustos=[], rocas=[], matas=[], flores=[], troncosCaidos=[];
  const geoTronco = new T.CylinderGeometry(0.34, 0.52, 1, 6, 1);
  geoTronco.translate(0, 0.5, 0);
  const geoCono = new T.ConeGeometry(1, 1, 7);
  geoCono.translate(0, 0.5, 0);
  const geoCopa1 = geoCopa(1, 11);
  const geoSomb = geoSombrilla(1, 23);
  const geoArb = geoCopa(1, 77);
  const geoRoca = new T.IcosahedronGeometry(1, 0);
  const geoFr = geoFronda(3.4, 0.85);
  const geoCoco = new T.IcosahedronGeometry(0.22, 0);
  const geoCaido = new T.CylinderGeometry(0.30, 0.38, 1, 6, 1);
  /* la flor: la misma cruz de dos planos que el pasto, así se ve de cualquier
     lado sin ser un cartel que gira */
  const geoFlor = (() => {
    const a = new T.PlaneGeometry(0.30, 0.30); a.translate(0, 0.15, 0);
    const b = a.clone(); b.rotateY(Math.PI/2);
    return mezclar([a, b]);
  })();

  /* un candidato cada tantos metros, aceptado según altura, pendiente y ruido:
     así los árboles se agrupan en bosques en vez de quedar sueltos y parejos */
  const N = 62000;
  for (let i = 0; i < N; i++){
    const x = (Math.random()*2-1)*MITAD*0.97;
    const z = (Math.random()*2-1)*MITAD*0.97;
    const h = H(x, z);
    if (h < PLAYA - 0.4 || h > 46) continue;
    if (enClaro(x, z)) continue;
    const s = pendiente(x, z);
    if (s > 0.62) continue;

    const bosque = fbm(x*0.011, z*0.011, 3, SEM+404);
    const playa = h < PLAYA + 2.4;
    const r = Math.random();

    if (playa){
      /* la costa es de palmeras, y con menos densidad */
      if (r < 0.030){
        const alto = 5.2 + Math.random()*4.2;
        const incl = (Math.random()-0.5)*0.30;
        troncos.push({ x, y:h, z, s:1, sx:0.62, sy:alto, sz:0.62,
                       rx:incl, rz:(Math.random()-0.5)*0.30, c:new T.Color(0.95,0.9,0.85) });
        const n = 7 + ((Math.random()*3)|0);
        const cy = h + alto*0.97, cx = x + Math.sin(incl)*alto*0.5;
        for (let k = 0; k < n; k++){
          frondas.push({ x:cx, y:cy, z, ry: (k/n)*6.283 + Math.random()*0.3,
                         rx: -0.30 - Math.random()*0.34, s: 0.85 + Math.random()*0.4,
                         c: verde(0.55) });
        }
        for (let k = 0; k < 3; k++)
          cocos.push({ x:cx + Math.cos(k*2.1)*0.42, y:cy-0.35, z: z + Math.sin(k*2.1)*0.42,
                       s:1, c:new T.Color('#7a5a2a') });
      } else if (r < 0.055){
        arbustos.push({ x, y:h, z, s: 0.5 + Math.random()*0.5, ry: Math.random()*6.28, c: verde(0.4) });
      }
    } else {
      const dens = 0.020 + bosque*0.085;
      if (r < dens){
        if (bosque > 0.58 && h > 16 && Math.random() < 0.6){
          /* CONÍFERAS ARRIBA, y ahora de CINCO pisos y no de tres. Con tres, los
             conos son gordos y separados y el árbol se lee a pila de sombreros;
             con cinco pisos delgados y superpuestos la silueta se cierra y queda
             el perfil dentado que tiene un pino visto de lejos, que es donde se
             lo ve. Cuestan lo mismo: son instancias de la misma malla. */
          const alto = 5.0 + Math.random()*6.4;
          troncos.push({ x, y:h, z, sx:0.5, sy:alto*0.42, sz:0.5, c:new T.Color(0.9,0.85,0.8) });
          const c = verde(0.18);
          const NP = 5;
          for (let k = 0; k < NP; k++){
            const t = k/NP;
            conos.push({ x, y: h + alto*(0.24 + t*0.60), z,
                         sx: (2.35-t*1.55)*(0.82+Math.random()*0.22),
                         sy: alto*0.30, sz: (2.35-t*1.55)*(0.82+Math.random()*0.22),
                         ry: Math.random()*6.28,
                         c: c.clone().offsetHSL(0, 0, (Math.random()-0.5)*0.05) });
          }
        } else if (Math.random() < 0.24){
          /* LA ACACIA: tronco alto y limpio con la copa abierta en sombrilla.
             Es la que le da variedad a la silueta del bosque —y la que le da
             sentido al bicho que anda por acá—: entre bolas y conos, una copa
             plana y ancha se reconoce desde el otro lado de la isla. */
          const alto = 5.6 + Math.random()*4.0;
          const anc = 2.6 + Math.random()*2.0;
          troncos.push({ x, y:h, z, sx:0.50, sy:alto, sz:0.50,
                         rz:(Math.random()-0.5)*0.16, c:new T.Color(1,0.94,0.86) });
          const c = verde(0.40);
          for (let k = 0; k < 2; k++){
            const a = Math.random()*6.283, rr = Math.random()*anc*0.20;
            somb.push({ x: x + Math.cos(a)*rr, y: h + alto - k*0.42,
                        z: z + Math.sin(a)*rr,
                        sx: anc*(0.85 + Math.random()*0.35), sy: anc*(0.8+Math.random()*0.4),
                        sz: anc*(0.85 + Math.random()*0.35),
                        ry: Math.random()*6.28,
                        c: c.clone().offsetHSL(0, 0, (Math.random()-0.5)*0.06) });
          }
        } else {
          /* frondoso: tronco y tres o cuatro copas superpuestas.
             EL RANGO DE TAMAÑOS SE ABRE, que es lo que faltaba: un bosque donde
             todos los árboles miden casi lo mismo se lee a plantación. Ahora hay
             arbolitos de tres metros y ejemplares de once. */
          const gigante = Math.random() < 0.11;
          const alto = gigante ? 8.5 + Math.random()*3.2 : 3.0 + Math.random()*4.2;
          const anc = (gigante ? 2.8 : 1.4) + Math.random()*1.6;
          troncos.push({ x, y:h, z, sx:0.62*(gigante?1.35:1), sy:alto, sz:0.62*(gigante?1.35:1),
                         rz:(Math.random()-0.5)*0.12, c:new T.Color(1,0.96,0.92) });
          const c = verde(0.32);
          const nb = (gigante ? 5 : 3) + ((Math.random()*2)|0);
          for (let k = 0; k < nb; k++){
            const a = Math.random()*6.283, rr = Math.random()*anc*0.5;
            copas.push({ x: x + Math.cos(a)*rr, y: h + alto + Math.random()*anc*0.42,
                         z: z + Math.sin(a)*rr, s: anc*(0.62 + Math.random()*0.5),
                         ry: Math.random()*6.28,
                         c: c.clone().offsetHSL(0, 0, (Math.random()-0.5)*0.07) });
          }
        }
      } else if (r < dens + 0.055){
        arbustos.push({ x, y: h, z, s: 0.55 + Math.random()*0.75,
                        ry: Math.random()*6.28, c: verde(0.26) });
      } else if (r < dens + 0.070){
        const g = 0.55 + Math.random()*0.35;
        rocas.push({ x, y: h + 0.1, z, s: 0.5 + Math.random()*1.5,
                     rx: Math.random()*3, ry: Math.random()*6.28, rz: Math.random()*3,
                     c: new T.Color(g, g*0.98, g*0.92) });
      } else if (r < dens + 0.0745 && bosque > 0.45){
        /* UN TRONCO CAÍDO cada tanto: es lo más barato que hay para que un
           bosque deje de ser un campo de postes verticales. Acostado y medio
           hundido, con la punta rota más gruesa que la fina. */
        troncosCaidos.push({ x, y: h + 0.28, z, sx: 1, sy: 2.4 + Math.random()*3.0, sz: 1,
                             rx: Math.PI/2 + (Math.random()-0.5)*0.16,
                             ry: Math.random()*6.28, rz: (Math.random()-0.5)*0.2,
                             c: new T.Color(0.86, 0.84, 0.80) });
      }
    }
    /* EL PASTO SE ESPESA de 0,30 a 0,44 y le crece un pelo de altura. Con la
       densidad vieja, mirando el suelo de frente se veían las matas SUELTAS,
       cada una con su aire alrededor, y eso se lee a matorral y no a prado. */
    if (r < 0.44 && h > PLAYA - 0.2 && s < 0.5)
      matas.push({ x, y: h, z, ry: Math.random()*6.28, s: 0.75 + Math.random()*1.05 });
    /* las flores van SÓLO donde hay pasto y son pocas: una flor cada tantas
       matas es un prado florecido; una por mata es un cantero */
    if (r > 0.44 && r < 0.468 && h > PLAYA + 0.4 && h < 34 && s < 0.34)
      flores.push({ x, y: h, z, ry: Math.random()*6.28, s: 0.7 + Math.random()*0.7 });
  }
  prog && prog(0.55, 'Plantando ' + (troncos.length) + ' árboles…');

  instanciar(geoTronco, matCorteza, troncos, true);
  instanciar(geoCopa1, matHoja, copas, true);
  instanciar(geoSomb, matHoja, somb, true);
  instanciar(geoCono, matHoja, conos, true);
  instanciar(geoFr, matHoja, frondas, true);
  instanciar(geoCoco, matCorteza, cocos, true);
  instanciar(geoArb, matHoja, arbustos, true);
  instanciar(geoRoca, matRoca, rocas, true);
  instanciar(geoCaido, matCorteza, troncosCaidos, true);

  /* ── el pasto: cruces de dos planos con alfa recortada ──
     alphaTest y no transparencia: sin orden que resolver, se puede meter
     mucho y encima queda el borde duro que combina con el pixelado. */
  matPasto = new T.MeshLambertMaterial({
    map: texPastoAlfa, alphaTest: 0.5, side: T.DoubleSide, flatShading: true
  });
  matPasto.onBeforeCompile = sh => {
    sh.uniforms.reloj = RELOJ;
    sh.uniforms.viento = VIENTO;
    sh.vertexShader = 'uniform float reloj; uniform float viento;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       /* el vaivén crece con la altura del vértice: la base queda clavada */
       float alt = max(0.0, position.y);
       vec3 wp = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
       transformed.x += sin(reloj*1.7 + wp.x*0.32 + wp.z*0.21) * alt * 0.20 * viento;
       transformed.z += cos(reloj*1.35 + wp.z*0.28) * alt * 0.13 * viento;`);
  };
  const gp = new T.PlaneGeometry(0.9, 0.9);
  gp.translate(0, 0.45, 0);
  const gp2 = gp.clone(); gp2.rotateY(Math.PI/2);
  const cruz = mezclar([gp, gp2]);
  pastoMesh = new T.InstancedMesh(cruz, matPasto, matas.length);
  pastoMesh.castShadow = false; pastoMesh.receiveShadow = true;
  const m4 = new T.Matrix4(), qq = new T.Quaternion(), ee = new T.Euler();
  const cMata = new T.Color();
  matas.forEach((o, i) => {
    ee.set(0, o.ry, 0); qq.setFromEuler(ee);
    m4.compose(new T.Vector3(o.x, o.y, o.z), qq, new T.Vector3(o.s, o.s*(0.8+Math.random()*0.6), o.s));
    pastoMesh.setMatrixAt(i, m4);
    /* EL COLOR POR MATA ES LO QUE MÁS SE NOTA Y ES LO QUE NO ESTABA. Todas las
       matas salían del mismo verde de la textura, así que el prado era UNA
       mancha lisa por más briznas que tuviera la silueta. Con el tono y la
       claridad movidos por mata, el suelo se llena de parches como un pasto de
       verdad; y una de cada nueve tira a amarillo, que son los manchones secos.
       Se mantiene CLARO a propósito: el material es Lambert y multiplica, así
       que un color de base oscuro deja la cara en sombra en negro. */
    const seca = Math.random() < 0.11;
    cMata.setHSL(seca ? 0.13 + Math.random()*0.03 : 0.255 + (Math.random()-0.5)*0.055,
                 seca ? 0.52 : 0.55 + Math.random()*0.22,
                 0.60 + Math.random()*0.26);
    pastoMesh.setColorAt(i, cMata);
  });
  pastoMesh.instanceMatrix.needsUpdate = true;
  if (pastoMesh.instanceColor) pastoMesh.instanceColor.needsUpdate = true;
  escena.add(pastoMesh);

  /* ── las flores ──
     Mismo material y mismo viento que el pasto: si tuvieran su propio shader se
     quedarían quietas mientras el pasto se mueve, y eso se ve. */
  floresMesh = null;
  if (flores.length){
    matFlor = new T.MeshLambertMaterial({
      map: texFlor, alphaTest: 0.5, side: T.DoubleSide, flatShading: true
    });
    matFlor.onBeforeCompile = matPasto.onBeforeCompile;
    floresMesh = new T.InstancedMesh(geoFlor, matFlor, flores.length);
    floresMesh.castShadow = false; floresMesh.receiveShadow = true;
    const cf = new T.Color();
    /* cuatro colores de flor y no un arcoíris: un prado con flores de todos los
       colores se lee a caramelos. Amarillo, blanco, violeta y rojo pálido. */
    const PALFLOR = [[0.14,0.85,0.68],[0.10,0.10,0.94],[0.78,0.42,0.72],[0.98,0.55,0.70]];
    flores.forEach((o, i) => {
      ee.set(0, o.ry, 0); qq.setFromEuler(ee);
      m4.compose(new T.Vector3(o.x, o.y, o.z), qq, new T.Vector3(o.s, o.s, o.s));
      floresMesh.setMatrixAt(i, m4);
      const p = PALFLOR[(Math.random()*PALFLOR.length)|0];
      cf.setHSL(p[0], p[1], p[2]);
      floresMesh.setColorAt(i, cf);
    });
    floresMesh.instanceMatrix.needsUpdate = true;
    if (floresMesh.instanceColor) floresMesh.instanceColor.needsUpdate = true;
    escena.add(floresMesh);
  }

  return { arboles: troncos.length + somb.length, matas: matas.length, flores: flores.length };
}

/* mezcla de geometrías sin depender de BufferGeometryUtils: sólo necesito
   unir dos planos idénticos en atributos, y así el HTML no importa nada más */
function mezclar(gs){
  let nv = 0, ni = 0;
  gs.forEach(g => { nv += g.attributes.position.count; ni += g.index ? g.index.count : 0; });
  const pos = new Float32Array(nv*3), nor = new Float32Array(nv*3), uv = new Float32Array(nv*2);
  const idx = new Uint16Array(ni);
  let vo = 0, io = 0;
  gs.forEach(g => {
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    pos.set(p.array, vo*3); nor.set(n.array, vo*3); uv.set(u.array, vo*2);
    const gi = g.index.array;
    for (let i = 0; i < gi.length; i++) idx[io+i] = gi[i] + vo;
    vo += p.count; io += gi.length;
  });
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('normal', new T.BufferAttribute(nor, 3));
  g.setAttribute('uv', new T.BufferAttribute(uv, 2));
  g.setIndex(new T.BufferAttribute(idx, 1));
  return g;
}
const VIENTO = { value: 1 };

/* ── FUNDIR PIEZAS EN UNA SOLA MALLA ──
   Una carpa son quince piezas y un auto son cuarenta. Sueltas, cada una es una
   llamada de dibujo, y con las sombras encendidas se pagan DOS veces: la carpa
   nueva sola había subido el cuadro de 70 a 96 llamadas. Fundidas por material,
   una carpa cuesta tres y el auto cuatro, midan lo que midan.
   Cada pieza se transforma ANTES de fundirse, así que las posiciones quedan
   horneadas en los vértices y no hace falta ni un solo Group.
   El índice va en Uint32 y no en Uint16 como `mezclar`: dos planos entran en
   65.535 vértices, un auto entero no necesariamente, y el desborde no avisa —
   dibuja triángulos que apuntan a cualquier lado. */
const _mFund = new T.Matrix4(), _eFund = new T.Euler(), _qFund = new T.Quaternion(),
      _vFund = new T.Vector3(), _v3Fund = new T.Vector3(), _nFund = new T.Matrix3();
function fundir(piezas){
  let nv = 0, ni = 0;
  const prep = piezas.map(z => {
    const g = z.g.index ? z.g : z.g.toNonIndexed();
    nv += g.attributes.position.count;
    ni += g.index ? g.index.count : g.attributes.position.count;
    return g;
  });
  const pos = new Float32Array(nv*3), nor = new Float32Array(nv*3), uv = new Float32Array(nv*2);
  const idx = new Uint32Array(ni);
  let vo = 0, io = 0;
  piezas.forEach((z, k) => {
    const g = prep[k];
    const p = z.p || [0,0,0], r = z.r || [0,0,0], s = z.s || [1,1,1];
    _eFund.set(r[0], r[1], r[2]); _qFund.setFromEuler(_eFund);
    _mFund.compose(_vFund.set(p[0], p[1], p[2]), _qFund, _v3Fund.set(s[0], s[1], s[2]));
    _nFund.getNormalMatrix(_mFund);
    const ap = g.attributes.position, an = g.attributes.normal, au = g.attributes.uv;
    for (let i = 0; i < ap.count; i++){
      _vFund.fromBufferAttribute(ap, i).applyMatrix4(_mFund);
      pos[(vo+i)*3] = _vFund.x; pos[(vo+i)*3+1] = _vFund.y; pos[(vo+i)*3+2] = _vFund.z;
      if (an){ _vFund.fromBufferAttribute(an, i).applyMatrix3(_nFund).normalize();
        nor[(vo+i)*3] = _vFund.x; nor[(vo+i)*3+1] = _vFund.y; nor[(vo+i)*3+2] = _vFund.z; }
      if (au){ uv[(vo+i)*2] = au.getX(i); uv[(vo+i)*2+1] = au.getY(i); }
    }
    if (g.index){ const gi = g.index.array;
      for (let i = 0; i < gi.length; i++) idx[io+i] = gi[i] + vo;
      io += gi.length;
    } else { for (let i = 0; i < ap.count; i++) idx[io+i] = vo + i; io += ap.count; }
    vo += ap.count;
  });
  const out = new T.BufferGeometry();
  out.setAttribute('position', new T.BufferAttribute(pos, 3));
  out.setAttribute('normal', new T.BufferAttribute(nor, 3));
  out.setAttribute('uv', new T.BufferAttribute(uv, 2));
  out.setIndex(new T.BufferAttribute(idx, 1));
  return out;
}

/* ══════════════════════════ LOS SITIOS ══════════════════════════
   Una isla grande sin nada adentro es un campo vacío. Se buscan cuatro lugares
   con sentido —terreno llano para el campamento, la cima para el mojón, un
   claro alto para las piedras y la costa para el arco— y se los construye a
   mano, uno por uno, porque un sitio que se ve de lejos es lo que hace que uno
   camine hacia algún lado en vez de dar vueltas. */
let CAMPO = null, SITIOS = [], fuegoLuz = null, fuegoMalla = null;
let CARPAS = [], AUTO = null;   /* dónde quedaron, para la cinemática y el auto */
/* dónde se sienta cada uno: lo llena `armaCampamento()` con la tapa de los
   troncos que construye, y lo lee la cinemática. Una sola lista para las dos
   cosas, que es lo que impide que la gente quede sentada al lado del tronco. */
const ASIENTOS = [];
/* cuánto se multiplica la fogata. En partida vale 1; la cinemática la sube,
   porque en la escena de noche es la ÚNICA luz y tiene que alcanzar a algo que
   está a siete metros. Va como variable y no como valor puesto a mano en el
   bucle, para que el latido y el parpadeo sigan siendo los mismos. */
let FUEGO_K = 1;
/* y si hay fuego o no. Nace prendido —en partida siempre lo está— y sólo la
   cinemática del armado lo apaga, mientras todavía están poniendo la leña. */
let FUEGO_ON = true;

/* busca el mejor punto según lo que se le pida, evitando los ya elegidos */
function buscaSitio(test, puntaje, lejosDe, minDist){
  let mejor = null, mejorP = -1e9;
  for (let gx = -0.86; gx <= 0.86; gx += 0.028){
    for (let gz = -0.86; gz <= 0.86; gz += 0.028){
      const x = gx*MITAD, z = gz*MITAD, h = H(x, z), pe = pendiente(x, z);
      if (!test(h, pe, x, z)) continue;
      let ok = true;
      for (const o of (lejosDe || []))
        if (Math.hypot(x-o.x, z-o.z) < (minDist || 90)){ ok = false; break; }
      if (!ok) continue;
      const p = puntaje(h, pe, x, z);
      if (p > mejorP){ mejorP = p; mejor = { x, z, h }; }
    }
  }
  return mejor;
}

/* LA LONA ES TELA Y NO CARTÓN, y eso son dos cosas dibujadas y no una:
   la TRAMA —hilos cruzados, un píxel de cada dos— y unas COSTURAS más marcadas
   cada ocho. Con el moteado solo, la carpa se leía a cartulina moteada; lo que
   dice «tela» es el cruce regular, que a 32 píxeles y con el pixelado del juego
   encima se lee como el tejido. */
const texLona = lienzoTex(32, (g,n) => {
  moteado(g, n, '#c9a878', '#e0c497', '#a98a5e', 0.30);
  g.globalAlpha = 0.30; g.fillStyle = '#8f7248';
  for (let i = 0; i < n; i += 2) g.fillRect(0, i, n, 1);
  for (let i = 1; i < n; i += 2) g.fillRect(i, 0, 1, n);
  g.globalAlpha = 0.55;
  for (let i = 0; i < n; i += 8){ g.fillRect(0, i, n, 1); g.fillRect(i, 0, 1, n); }
  g.globalAlpha = 1;
});
const matLona = new T.MeshLambertMaterial({ map: texLona, flatShading: true, side: T.DoubleSide });
const matBrasa = new T.MeshBasicMaterial({ color: 0xff9a3c });
/* las tres carpas son de tres colores. Un campamento con tres carpas idénticas
   se lee a copia y pega; además el jugador necesita poder decir «la mía es la
   azul», que es lo que convierte tres bultos en tres lugares. */
const LONAS = [0xd8552f, 0x3f7fbe, 0xe0b33c];
const matLonas = LONAS.map(c => new T.MeshLambertMaterial({
  map: texLona, color: c, flatShading: true, side: T.DoubleSide }));
/* el sobretecho va un pelo más oscuro que su carpa: es otra tela, encima */
const matSobre = LONAS.map(c => new T.MeshLambertMaterial({
  map: texLona, color: new T.Color(c).multiplyScalar(0.72), flatShading: true, side: T.DoubleSide }));
const matNylon = new T.MeshLambertMaterial({ color: 0x2b3038, flatShading: true });

/* ══════════════════════════ EL AUTO ══════════════════════════
   Uno solo y bien hecho, que es lo que se pidió. Es la camioneta en la que
   llegaron, y por eso está estacionada al borde del campamento con el morro
   hacia afuera —nadie estaciona de frente al fuego— y es la misma que se ve
   llegar en la cinemática.

   LAS TEXTURAS SON PIXEL ART DE VERDAD: lienzos de 32 y 48 píxeles dibujados a
   mano con `fillRect`, filtro NEAREST y sin mipmaps, igual que la corteza y el
   pasto. Una foto acá se vería pegada encima: en un mundo donde TODO son
   bloques de color plano, lo único que puede leerse como chapa es una chapa
   dibujada al mismo tamaño de píxel. */
const texChapa = lienzoTex(32, (g,n) => {
  moteado(g, n, '#d8483a', '#ef6a53', '#a82f26', 0.30);
  /* la franja de reflejo: una chapa curva devuelve el cielo en una banda
     horizontal, y es lo único que separa «pintado» de «cartón» */
  g.globalAlpha = 0.55; g.fillStyle = '#ff9f8c';
  g.fillRect(0, (n*0.30)|0, n, 2);
  g.globalAlpha = 0.35; g.fillStyle = '#7d1f18';
  g.fillRect(0, (n*0.72)|0, n, 3);
  /* las juntas de las chapas, cada ocho píxeles */
  g.globalAlpha = 0.5; g.fillStyle = '#8e2820';
  for (let i = 0; i < n; i += 8) g.fillRect(i, 0, 1, n);
  g.globalAlpha = 1;
});
const texVidrio = lienzoTex(32, (g,n) => {
  moteado(g, n, '#2c4356', '#3a5972', '#1d2c3a', 0.35);
  /* dos rayas en diagonal: el reflejo del cielo sobre un vidrio inclinado */
  g.globalAlpha = 0.42; g.fillStyle = '#b9dcf2';
  for (let k = 0; k < 2; k++){
    const off = k*13 + 4;
    for (let i = 0; i < n; i++) g.fillRect((i+off)%n, i, 3, 1);
  }
  g.globalAlpha = 1;
});
/* LA GOMA VA EN GRIS OSCURO Y NO EN NEGRO. Con #1b1b1e la rueda salía como un
   recorte negro plano: el negro absoluto no tiene sombreado que mostrar, así
   que la pieza pierde el volumen y se lee a hueco. */
const texRueda = lienzoTex(32, (g,n) => {
  g.fillStyle = '#33333a'; g.fillRect(0,0,n,n);
  /* el dibujo del taco: bloques alternados, que es lo que se ve de una goma */
  g.fillStyle = '#22222a';
  for (let y = 0; y < n; y += 4)
    for (let x = (y/4 % 2) ? 0 : 2; x < n; x += 4) g.fillRect(x, y, 2, 3);
  g.fillStyle = '#4a4a55';
  for (let x = 0; x < n; x += 8) g.fillRect(x, 0, 1, n);
});
const texRejilla = lienzoTex(32, (g,n) => {
  g.fillStyle = '#3a3a40'; g.fillRect(0,0,n,n);
  g.fillStyle = '#191a1d';
  for (let y = 2; y < n; y += 4) g.fillRect(0, y, n, 2);
  g.fillStyle = '#6b6b74';
  for (let y = 1; y < n; y += 4) g.fillRect(0, y, n, 1);
});
const matChapa   = new T.MeshLambertMaterial({ map: texChapa, flatShading: true });
const matVidrio  = new T.MeshLambertMaterial({ map: texVidrio, flatShading: true });
const matRueda   = new T.MeshLambertMaterial({ map: texRueda, flatShading: true });
const matRejilla = new T.MeshLambertMaterial({ map: texRejilla, flatShading: true });
/* EL CROMO VA EN GRIS CÁLIDO Y NO EN GRIS AZULADO. Este juego satura al tope
   en el post-proceso, así que cualquier gris con un pelo de azul sale CIAN: en
   la captura las cuatro llantas eran celestes. Con el gris tirando a arena, la
   misma saturación lo deja en un metal cálido, que es lo que parece una llanta. */
const matCromo   = new T.MeshLambertMaterial({ color: 0xc6bfb2, flatShading: true });
/* LOS FAROS NO SON LÁMPARAS ENCENDIDAS: SON VIDRIO.
   Con `MeshBasic` el material ignora la luz, así que de noche los dos faros de
   una camioneta ESTACIONADA salían como dos rectángulos amarillo puro flotando
   en la oscuridad —medido mirando la primera captura nocturna del juego—. Un
   auto parado tiene las luces apagadas: lo que se ve de su óptica es el reflejo.
   Con Lambert y un emisivo bajo, de día se leen como cristal claro y de noche se
   apagan con todo lo demás, dejando apenas el brillo que tiene un vidrio.
   Los haces de verdad son los dos `SpotLight`, que se encienden por código. */
const matFaro    = new T.MeshLambertMaterial({ color: 0xf6ecc4, emissive: 0x3a3218 });
const matStop    = new T.MeshLambertMaterial({ color: 0xc23528, emissive: 0x2c0d0a });

/* Devuelve un Group con la camioneta armada y el morro hacia +Z, para que
   orientarla sea decir hacia dónde apunta. Sale en CINCO mallas fundidas
   —chapa, vidrio, goma, cromo y luces— y no en las cuarenta piezas que la
   componen: con las sombras encendidas cada pieza suelta se paga dos veces. */
function armaAuto3D(){
  const gr = new T.Group();
  const L = 4.30, A = 1.92, LARGO_CAB = 2.05;

  const caja = (x,y,z, sx,sy,sz, rx,ry,rz) =>
    ({ g: new T.BoxGeometry(sx, sy, sz), p: [x,y,z], r: [rx||0, ry||0, rz||0] });

  /* ── la carrocería ──
     El cuerpo va en DOS bloques y no en uno: el bajo, que llega hasta la
     cintura, y la cabina más angosta y corta encima. Un solo prisma del alto
     total se lee a ladrillo; el escalón entre los dos es lo que da la silueta
     de camioneta. Y el capó va aparte, más bajo que la cabina, porque si el
     frente y el techo están a la misma altura no hay camioneta sino furgón. */
  const chapa = [
    caja(0, 0.86, 0,          A,        0.80, L),            /* el cuerpo bajo  */
    caja(0, 1.44, -0.30,      A*0.90,   0.62, LARGO_CAB),    /* la cabina       */
    caja(0, 1.20, L/2 - 0.62, A*0.96,   0.30, 1.24),         /* el capó         */
    caja(0, 1.80, -0.30,      A*0.86,   0.10, LARGO_CAB*0.96), /* el techo      */
    /* los guardabarros: cuatro arcos apenas salidos. Sin ellos las ruedas
       parecen pegadas al costado en vez de metidas en la carrocería. */
    caja( A/2-0.03, 0.74,  L/2-1.05, 0.16, 0.62, 1.36),
    caja(-A/2+0.03, 0.74,  L/2-1.05, 0.16, 0.62, 1.36),
    caja( A/2-0.03, 0.74, -L/2+1.05, 0.16, 0.62, 1.36),
    caja(-A/2+0.03, 0.74, -L/2+1.05, 0.16, 0.62, 1.36),
    /* el estribo de cada lado */
    caja( A/2-0.02, 0.44, 0, 0.14, 0.12, L*0.52),
    caja(-A/2+0.02, 0.44, 0, 0.14, 0.12, L*0.52)
  ];
  /* ── el vidrio ──
     Parabrisas INCLINADO —un vidrio vertical se lee a colectivo—, luneta y las
     dos ventanillas de cada lado con el parante en el medio. */
  const vidrio = [
    caja(0, 1.50,  L/2 - 1.30, A*0.84, 0.66, 0.10,  -0.42),         /* parabrisas */
    caja(0, 1.50, -L/2 + 0.62, A*0.84, 0.56, 0.10,   0.30),         /* luneta     */
    caja( A*0.455, 1.50, -0.02, 0.08, 0.50, 0.82),
    caja(-A*0.455, 1.50, -0.02, 0.08, 0.50, 0.82),
    caja( A*0.455, 1.50, -1.00, 0.08, 0.50, 0.70),
    caja(-A*0.455, 1.50, -1.00, 0.08, 0.50, 0.70)
  ];
  /* ── goma: las cuatro ruedas y la de auxilio atrás ── */
  const rue = new T.CylinderGeometry(0.44, 0.44, 0.34, 9);
  const goma = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    goma.push({ g: rue, p: [sx*(A/2 - 0.04), 0.44, sz*(L/2 - 1.05)], r: [0, 0, Math.PI/2] });
  goma.push({ g: rue, p: [0, 1.00, -L/2 - 0.20], r: [Math.PI/2, 0, 0] });   /* auxilio */
  /* los paragolpes y la parrilla del techo, que son lo que dice «esto vino
     cargado desde lejos» */
  const oscuro = [
    { g: new T.BoxGeometry(A*1.02, 0.26, 0.24), p: [0, 0.62,  L/2 + 0.06] },
    { g: new T.BoxGeometry(A*1.02, 0.26, 0.24), p: [0, 0.62, -L/2 - 0.06] },
    { g: new T.BoxGeometry(A*0.90, 0.06, 1.90), p: [0, 1.88, -0.30] },
    { g: new T.BoxGeometry(0.06, 0.14, 1.90),   p: [ A*0.42, 1.94, -0.30] },
    { g: new T.BoxGeometry(0.06, 0.14, 1.90),   p: [-A*0.42, 1.94, -0.30] },
    /* el equipaje atado arriba: dos bultos de distinto tamaño, que es como se
       ata equipaje de verdad */
    { g: new T.BoxGeometry(0.78, 0.42, 1.05), p: [-0.28, 2.12, -0.10], r: [0, 0.09, 0] },
    { g: new T.BoxGeometry(0.60, 0.30, 0.72), p: [ 0.42, 2.06, -0.85], r: [0, -0.14, 0] },
    /* los espejos */
    { g: new T.BoxGeometry(0.09, 0.16, 0.22), p: [ A*0.56, 1.52, L/2 - 1.34] },
    { g: new T.BoxGeometry(0.09, 0.16, 0.22), p: [-A*0.56, 1.52, L/2 - 1.34] },
    { g: new T.CylinderGeometry(0.05, 0.05, 0.34, 5), p: [-0.62, 0.50, -L/2 - 0.16], r: [Math.PI/2, 0, 0] }
  ];
  /* LA PARRILLA lleva su propia textura de listones y no el cromo liso: de
     frente, un bloque de un solo gris entre los dos faros se leía a agujero
     oscuro. Los listones son lo que dice «acá entra aire». */
  const rejilla = [
    { g: new T.BoxGeometry(A*0.72, 0.30, 0.08), p: [0, 1.10, L/2 + 0.02] }
  ];
  /* LAS LLANTAS. Una rueda de goma sola es un disco NEGRO, y en un mundo tan
     claro como éste eso no se lee a rueda sino a agujero en la carrocería
     —medido mirando la captura de costado: dos manchas negras planas—. Lo que
     convierte el disco en rueda es el centro claro, así que cada rueda lleva su
     llanta apenas salida del flanco de afuera. */
  const cromo = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    cromo.push({ g: new T.CylinderGeometry(0.23, 0.23, 0.06, 8),
                 p: [sx*(A/2 + 0.14), 0.44, sz*(L/2 - 1.05)], r: [0, 0, Math.PI/2] });
  const luces = [
    { g: new T.BoxGeometry(0.36, 0.20, 0.06), p: [ A*0.32, 1.14, L/2 + 0.05] },
    { g: new T.BoxGeometry(0.36, 0.20, 0.06), p: [-A*0.32, 1.14, L/2 + 0.05] }
  ];
  const stops = [
    { g: new T.BoxGeometry(0.26, 0.30, 0.06), p: [ A*0.36, 1.02, -L/2 - 0.05] },
    { g: new T.BoxGeometry(0.26, 0.30, 0.06), p: [-A*0.36, 1.02, -L/2 - 0.05] }
  ];

  const poner = (piezas, mat, sombra) => {
    const m = new T.Mesh(fundir(piezas), mat);
    m.castShadow = !!sombra; m.receiveShadow = true;
    gr.add(m); return m;
  };
  poner(chapa, matChapa, true);
  poner(vidrio, matVidrio, true);
  poner(goma, matRueda, true);
  poner(oscuro, matNylon, true);
  poner(rejilla, matRejilla, true);
  poner(cromo, matCromo, true);
  poner(luces, matFaro, false);
  poner(stops, matStop, false);

  /* los dos haces de los faros, apagados mientras está estacionado. Existen
     para la cinemática: un auto que llega de noche sin luces no llega, aparece. */
  gr.userData.faros = [];
  for (const sx of [-1, 1]){
    const f = new T.SpotLight(0xfff0c0, 0, 46, 0.42, 0.55, 1.4);
    f.position.set(sx*A*0.32, 1.14, L/2);
    f.target.position.set(sx*A*0.32, 0.2, L/2 + 12);
    gr.add(f); gr.add(f.target);
    gr.userData.faros.push(f);
  }
  gr.userData.largo = L;
  return gr;
}

function armaCampamento(c){
  const g = new T.Group();
  const y = c.h;

  /* el círculo de piedras */
  for (let i = 0; i < 11; i++){
    const a = i/11*6.283, r = 1.65;
    const px = Math.cos(a)*r, pz = Math.sin(a)*r;
    const m = new T.Mesh(new T.IcosahedronGeometry(0.26 + Math.random()*0.16, 0), matRoca);
    m.position.set(px, H(c.x+px, c.z+pz) - y + 0.1, pz);
    m.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  /* la leña cruzada */
  for (let i = 0; i < 5; i++){
    const a = i/5*6.283;
    const l = new T.Mesh(new T.CylinderGeometry(0.09, 0.12, 1.5, 5), matCorteza);
    l.position.set(Math.cos(a)*0.35, 0.42, Math.sin(a)*0.35);
    l.rotation.set(Math.cos(a)*0.95, a, Math.sin(a)*0.95);
    l.castShadow = true;
    g.add(l);
  }
  /* la llama: dos conos que laten. Sin transparencia, para que el pixelado la
