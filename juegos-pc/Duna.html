    ag = 0.42; tk = 0; br = 1.0; ln = 0.10;
  } else if (R.suelo) {    // apoyado: cuanto mas rapido, mas agachado y mas adelante
    /* LOS BRAZOS VAN ABIERTOS Y NO PEGADOS AL CUERPO. Con `br` en 0,2 las dos
       manos quedan POR DEBAJO del hombro y la silueta se lee CORRIENDO —es lo
       que salio en la captura—: lo que dice "va sobre una tabla" es un brazo
       adelante y otro atras, casi horizontales, que es como se equilibra
       cualquiera sobre algo que se desliza.
       Y EL AGACHE BAJO DE 0,70 A 0,32. Con 0,46 por velocidad el cuerpo medido
       quedaba en 1,64 m de alto contra una tabla de 2,08: la tabla medida 1,27
       veces el rider, y en la captura lo que se leia era una tabla enorme con
       un bulto encima. La tabla se acorto y el cuerpo se enderezo: 1,76 contra
       1,72, o sea uno a uno, que es la proporcion de una tabla de verdad. */
    ag = 0.16 + 0.32 * vn; tk = 0; br = 0.54 + 0.30 * vn; ln = 0.16 + 0.34 * vn;
  } else if (gira > 0.25) {// girando: encogido
    ag = 0.86; tk = 1; br = 0.05; ln = 0.30;
  } else {                 // en el aire y derecho: estirado, que es lo que dice "estoy volando"
    ag = 0.06; tk = 0; br = 0.85; ln = 0.05;
  }
  if (!R.vivo) { ag = 0.95; tk = 0.6; br = 1.0; }

  const k = 1 - Math.pow(0.00002, dt);          // ~90 ms
  POSE.ag = mezcla(POSE.ag, ag + R.sacude * 0.55, k);
  POSE.tk = mezcla(POSE.tk, tk, k);
  POSE.br = mezcla(POSE.br, br, k);
  POSE.ln = mezcla(POSE.ln, ln, k);
  /* el aplaste es el aterrizaje, y va CON EL ANCLA EN LOS PIES: escalando
     desde el centro el cuerpo se hunde en la arena la mitad de lo que se
     aplasta, y entonces el golpe se lee a que atraveso el suelo */
  POSE.sq = mezcla(POSE.sq, R.sacude, 1 - Math.pow(0.0008, dt));

  bufandaPaso(dt, x, y, ang);
  arenaPaso(dt, x, y, ang);
  estelaPaso(dt, x, y);
}

/* ── LA BUFANDA ───────────────────────────────────────────────────────────
   Verlet: cada punto se acuerda de donde estaba, y de esa diferencia sale su
   velocidad. No hay que escribir "la bufanda va hacia atras" en ningun lado
   —va hacia atras porque el cuello se le escapa— y por eso al frenar se
   adelanta sola, al girar se enrosca y al caer flota. Eso es lo que ninguna
   animacion dibujada da.
   VA EN COORDENADAS DE MUNDO Y NO DEL CUERPO: pegada al cuerpo giraria con
   el, o sea que en una voltereta la bufanda daria la vuelta rigida al lado
   de la cabeza en vez de quedarse atras, que es lo que hace una tela.     */
function bufandaPaso(dt, x, y, ang) {
  if (!BUF.length) riderVisReinicia();
  const c = Math.cos(ang), s = Math.sin(ang);
  const nx = x + (-0.05 * c - 1.38 * s), ny = y + (-0.05 * s + 1.38 * c);
  BUF[0].x = nx; BUF[0].y = ny; BUF[0].px = nx; BUF[0].py = ny;

  /* EL AMORTIGUAMIENTO ES EL VIENTO, y tenia que ser mucho mas fuerte. En
     verlet, la resistencia del aire y la amortiguacion son la MISMA cosa: la
     velocidad es la diferencia con el cuadro anterior, asi que frenarla es
     exactamente frenarla contra el aire quieto. Con 0,986 por paso cada punto
     se llevaba puesta la velocidad del cuello y viajaba CON el, o sea que la
     tela quedaba flotando al lado de la cabeza en vez de quedarse atras:
     medido, 1,53 m de bufanda ocupaban 0,42 m — un ovillo, invisible a
     treinta pixeles. Con 0,88 el punto casi no avanza solo y lo unico que lo
     mueve es la cuerda tirando: la bufanda se va atras y se estira.
     PERO CON 0,88 SE PASO PARA EL OTRO LADO: medido en la captura, una RECTA
     perfecta saliendo del cuello —una antena, no una tela—. A veinte metros
     por segundo una bufanda VA tensa, eso es cierto; lo que le faltaba es la
     ondulacion. Con 0,94 por paso la punta conserva algo de vida propia y la
     turbulencia no se apaga entre cuadro y cuadro.                        */
  const dt2 = dt * dt, amort = Math.pow(0.024, dt);
  const wy = -R.vy * 0.30;
  for (let i = 1; i < BUF.length; i++) {
    const p = BUF[i], f = i / (BUF.length - 1);
    const vx = (p.x - p.px) * amort, vy = (p.y - p.py) * amort;
    p.px = p.x; p.py = p.y;
    /* la turbulencia AFLOJA hacia la punta: con el mismo temblor en los diez
       puntos la bufanda ondula rigida como un cable, y lo que la hace tela es
       que la punta se sacude mas que la raiz */
    const ax = Math.sin(TIEMPO * 5.1 + i * 2.3) * 44 * f;
    const ay = -13 + wy * (0.3 + 0.7 * f) + Math.cos(TIEMPO * 7.3 + i * 1.7) * 62 * f;
    p.x += vx + ax * dt2; p.y += vy + ay * dt2;
  }
  for (let it = 0; it < 3; it++) {
    for (let i = 1; i < BUF.length; i++) {
      const a = BUF[i - 1], b = BUF[i];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d < 1e-5) { dx = -0.1; dy = 0; d = 0.1; }
      const f = (d - BUF_SEG) / d;
      b.x -= dx * f; b.y -= dy * f;                 // solo se mueve el hijo: el cuello manda
    }
    /* Y UNA CADENA SIN RIGIDEZ SE OVILLA. Las restricciones de distancia
       conservan el largo de cada tramo y no dicen NADA del angulo entre dos,
       asi que una tela puede doblarse sobre si misma y quedar hecha un bollo
       sin violar ninguna. Empujar cada punto hacia el medio de sus dos
       vecinos es lo que la endereza, y es lo unico que separa una bufanda de
       un collar de cuentas. Va DENTRO del lazo para que la distancia lo
       corrija despues, si no la tela se acorta.
       Y ES 0,05 Y NO 0,22: con 0,22 aplicado tres veces por cuadro la cadena
       queda PERFECTAMENTE recta, que es el defecto opuesto y se ve igual de
       mal. Lo que hace falta es lo justo para que no se oville, no para que
       no se doble — una tela se dobla, ahi esta la gracia.                */
    for (let i = 1; i < BUF.length - 1; i++) {
      const a = BUF[i - 1], b = BUF[i], c = BUF[i + 1];
      b.x += ((a.x + c.x) * 0.5 - b.x) * 0.05;
      b.y += ((a.y + c.y) * 0.5 - b.y) * 0.05;
    }
  }
  /* Y ARRASTRA POR LA ARENA. Cuesta una comparacion por punto y es lo que
     hace que bajar pegado a una duna se sienta pegado a la duna. */
  /* Y EL CHOQUE NO PUEDE MOVER LA POSICION SOLA. En verlet la velocidad ES la
     diferencia con el cuadro anterior, asi que subir un punto sin subir
     tambien su `py` le REGALA velocidad hacia arriba igual a lo que penetro
     — y a sesenta cuadros por segundo eso se acumula. Medido en la primera
     captura: la bufanda se enroscaba POR ENCIMA DE LA CABEZA en vez de ir
     atras, y se leia a antena. Es el defecto clasico de una colision verlet.
     Subiendo los dos, el punto se apoya con velocidad vertical cero. */
  for (let i = 1; i < BUF.length; i++) {
    const p = BUF[i], py = terrY(p.x);
    if (hayPiso(p.x) && p.y < py + 0.06) {
      p.y = py + 0.06; p.py = p.y;
      p.px += (p.x - p.px) * 0.35;          // y roza: la arena frena la tela
    }
  }
}

/* ── LA ARENA ─────────────────────────────────────────────────────────────
   Sale de la COLA de la tabla y no de su centro, que es de donde sale de
   verdad, y va hacia atras con la mitad de la velocidad del rider: emitida
   quieta se ve como una nube que el rider deja atras, y lo que tiene que
   verse es una estela que lo persigue.                                    */
let ARE_ac = 0, ARE_golpe = 0;
function arenaSuelta(x, y, ang, n, fuerza) {
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = 0; i < n && ARE.length < ARE_MAX; i++) {
    const o = -0.55 - Math.random() * 0.55;
    const a = Math.random() * 2.2 + 0.6;
    ARE.push({
      x: x + o * c, y: y + o * s + 0.05,
      vx: -R.vx * (0.10 + Math.random() * 0.26) - Math.cos(a) * fuerza * 1.4,
      vy: Math.sin(a) * fuerza * 2.6 + Math.random() * 1.4,
      t: 0, T: 0.42 + Math.random() * 0.55, r: 0.055 + Math.random() * 0.11,
    });
  }
}
function arenaPaso(dt, x, y, ang) {
  if (R.vivo && (R.suelo || R.cuerda) && R.polvo > 0.12) {
    ARE_ac += R.polvo * 78 * dt;
    const n = Math.floor(ARE_ac); ARE_ac -= n;
    if (n > 0) arenaSuelta(x, y, ang, n, 0.35 + R.polvo * 0.75);
  } else ARE_ac = 0;
  if (R.sacude > 0.30 && !ARE_golpe) { ARE_golpe = 1; arenaSuelta(x, y, ang, 16, 1.5); }
  if (R.sacude < 0.12) ARE_golpe = 0;

  for (let i = ARE.length - 1; i >= 0; i--) {
    const p = ARE[i];
    p.t += dt;
    if (p.t >= p.T) { ARE.splice(i, 1); continue; }
    p.vy -= 11 * dt; p.vx *= Math.pow(0.30, dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    const py = terrY(p.x);
    if (hayPiso(p.x) && p.y < py) { p.y = py; p.vy = 0; p.vx *= Math.pow(0.02, dt); }
  }
}

/* ── LA ESTELA ────────────────────────────────────────────────────────────
   Un surco que se apaga. No es adorno: es lo unico que dice cuanto se
   recorrio en el ultimo segundo, y en un juego que corre a treinta metros
   por segundo sobre un fondo que se repite, eso es lo que da velocidad.  */
function estelaPaso(dt, x, y) {
  EST_T -= dt;
  if (EST_T <= 0 && R.vivo && (R.suelo || R.cuerda)) {
    EST_T = EST_DT;
    EST.push({ x, y });
    if (EST.length > EST_MAX) EST.shift();
  }
  while (EST.length && EST[0].x < CAM.x - 6) EST.shift();
}

/* ── EL DIBUJO ────────────────────────────────────────────────────────────
   Todo en metros y en el marco del cuerpo: se traslada al punto de apoyo, se
   gira, se escala a pixeles, y de ahi en mas el cuerpo se escribe con las
   medidas de una persona. Sin esto habria que meter senos y cosenos en cada
   articulacion, que es como se termina con un codo que sale del hombro.  */
function _hueso(ax, ay, bx, by, w) {
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.lineWidth = w; ctx.stroke();
}

function pintaEstela() {
  if (EST.length < 2) return;
  ctx.strokeStyle = rgb(mezclaC(PAL.su, PAL.si, 0.30), 1);
  ctx.lineWidth = Math.max(1.5, 0.16 * ESC);
  ctx.lineCap = 'round';
  const n = EST.length;
  for (let i = 1; i < n; i++) {
    ctx.globalAlpha = (i / n) * 0.55;
    ctx.beginPath();
    ctx.moveTo(sx(EST[i - 1].x), sy(EST[i - 1].y));
    ctx.lineTo(sx(EST[i].x), sy(EST[i].y));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function pintaArena() {
  if (!ARE.length) return;
  /* del color de una SOMBRA sobre la arena y no de un blanco: el suelo ya es
     lo mas claro del cuadro, asi que una nube clara sobre arena clara no
     existe. Es la inversion del estilo aplicada tambien al polvo. */
  const c = mezclaC(PAL.su, PAL.si, 0.34);
  for (let i = 0; i < ARE.length; i++) {
    const p = ARE[i], v = 1 - p.t / p.T;
    ctx.globalAlpha = v * v * 0.60;
    ctx.fillStyle = rgb(c, 1);
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), Math.max(0.8, p.r * ESC * (0.5 + v)), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function pintaRider(x, y, ang) {
  const ag = POSE.ag, tk = POSE.tk, br = POSE.br, ln = POSE.ln, sq = POSE.sq;
  const col = rgb(PAL.si, 1);

  /* la bufanda va PRIMERO y en coordenadas de mundo: esta detras del cuerpo
     y encima puede quedar bajo la tabla al arrastrarse por la arena */
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(sx(BUF[0].x), sy(BUF[0].y));
  for (let i = 1; i < BUF.length - 1; i++) {
    const p = BUF[i], q = BUF[i + 1];
    ctx.quadraticCurveTo(sx(p.x), sy(p.y), sx((p.x + q.x) / 2), sy((p.y + q.y) / 2));
  }
  ctx.lineWidth = Math.max(1.6, 0.135 * ESC);
  ctx.stroke();

  ctx.save();
  ctx.translate(sx(x), sy(y));
  ctx.rotate(-ang);                                  // la y de pantalla va al reves
  ctx.scale(ESC * RIDER_ESC, -ESC * RIDER_ESC);      // de aca en mas: metros, y hacia arriba
  ctx.scale(1 + sq * 0.20, 1 - sq * 0.26);           // aplaste anclado en los pies

  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  /* LA TABLA. Va con las puntas levantadas y no como una raya: una raya
     recta bajo una duna curva se despega en las dos puntas y se lee a error
     de dibujo, y ademas es la silueta que dice "esto es una tabla".
     MIDE 1,76 Y NO 2,08, y el numero sale de una proporcion medida: el cuerpo
     con el agache de crucero llega a 1,72 m de alto, asi que una tabla de 2,08
     media 1,21 veces el rider — en la captura se leia una tabla enorme con
     alguien encima y no alguien sobre una tabla. Una tabla de verdad mide como
     el que la usa.                                                        */
  ctx.beginPath();
  ctx.moveTo(-0.86, 0.10); ctx.quadraticCurveTo(-0.46, -0.06, 0, -0.06);
  ctx.quadraticCurveTo(0.52, -0.06, 0.90, 0.13);
  ctx.lineWidth = 0.135; ctx.stroke();

  /* LAS PIERNAS SON UNA POSTURA DE TABLA Y NO UNA ZANCADA, y la diferencia es
     de tres centimetros: con las dos rodillas en la misma x —los dos por
     delante de los dos pies— el cuerpo se lee CORRIENDO, que es exactamente
     lo que salio en la primera captura. Cada rodilla va sobre SU pie y lo que
     las abre es la cadera baja y atras: eso es una postura de tabla vista de
     costado, y se reconoce por la A que forman las piernas.               */
  const PIE_A = -0.42, PIE_D = 0.40;
  const cadY = 0.80 - 0.32 * ag - 0.16 * tk, cadX = -0.10 - 0.12 * ln - 0.06 * ag;
  const rodY = 0.46 - 0.17 * ag - 0.12 * tk;
  const rodA = PIE_A + 0.20 + 0.10 * ag, rodD = PIE_D - 0.05 + 0.12 * ag;
  _hueso(PIE_A, 0.02, rodA, rodY, 0.115);
  _hueso(rodA, rodY, cadX - 0.03, cadY, 0.125);
  _hueso(PIE_D, 0.02, rodD, rodY - 0.02, 0.115);
  _hueso(rodD, rodY - 0.02, cadX + 0.05, cadY, 0.125);

  // el tronco: se inclina hacia adelante con la velocidad y se enrosca al girar
  const homY = cadY + 0.56 - 0.10 * tk, homX = cadX + 0.20 + 0.26 * ln + 0.14 * tk;
  _hueso(cadX, cadY, homX, homY, 0.19);

  /* LOS BRAZOS. Uno adelante y otro ATRAS, y el de atras tiene que LLEGAR
     atras: con la mano trasera a 0,42 m del hombro lo que se dibujaba era un
     muñon, y en la captura el unico brazo que se leia era el delantero — o sea
     una sola linea saliendo del torso, que es la silueta de alguien corriendo.
     Lo que dice "equilibrio sobre algo que se desliza" es la CRUZ: dos manos
     lejos del cuerpo y a los dos lados.                                    */
  const maY = homY + (-0.30 + 0.46 * br) - 0.20 * tk;
  const maX = homX + (0.22 + 0.42 * br) + 0.18 * tk;
  const coX = homX + 0.16 - 0.02 * br, coY = homY - 0.24 + 0.12 * br;
  _hueso(homX, homY, coX, coY, 0.085);
  _hueso(coX, coY, maX, maY, 0.085);
  const bx = homX - 0.44 - 0.30 * br, by = homY - 0.26 + 0.30 * br;
  const cbX = homX - 0.24, cbY = homY - 0.24 + 0.06 * br;
  _hueso(homX, homY, cbX, cbY, 0.085);
  _hueso(cbX, cbY, bx, by, 0.085);

  /* LA CABEZA, CON CUELLO. Medido con la pose de crucero, el centro del disco
     caia a 0,264 m del hombro y entre el radio de la cabeza y el medio grosor
     del torso ya habia 0,280: se pisaban, y lo que se veia era un bulto sin
     cuello — una sola mancha de hombro-a-craneo. Va mas arriba, un poco mas
     chica, y con un cuello dibujado: sin el cuello la cabeza queda flotando,
     que es peor que pegada.                                               */
  const cueX = homX + 0.06 + 0.03 * ln, cueY = homY + 0.15;
  _hueso(homX, homY, cueX, cueY, 0.105);
  const cabX = homX + 0.11 + 0.06 * ln, cabY = homY + 0.36;
  ctx.beginPath(); ctx.arc(cabX, cabY, 0.165, 0, 6.2832); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cabX - 0.18, cabY + 0.05);
  ctx.quadraticCurveTo(cabX - 0.32, cabY - 0.10, cabX - 0.19, cabY - 0.21);
  ctx.lineTo(cabX - 0.02, cabY - 0.13);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════════════
   EL AUDIO, PROCEDURAL
   ──────────────────────────────────────────────────────────────────────────
   Ni un archivo, y aca eso no es una limitacion sino lo correcto: lo que
   suena es VIENTO Y ARENA, o sea ruido filtrado, y un clip grabado de eso
   pesa cientos de kilobytes y encima se corta cada vez que da la vuelta —y
   ese corte se escucha mas que el viento—. Un ruido generado no tiene vuelta
   que dar.

   TODO CUELGA DE UN MAESTRO CON ANALIZADOR, que es lo unico que permite
   decir "suena" con un numero en vez de "no tiro excepcion".

   Y LA CAMA SIGUE A LA VELOCIDAD. El viento no es ambiente: es el unico
   sitio del juego donde la velocidad —que es lo que el jugador administra—
   se escucha. A ocho metros por segundo es un susurro y a treinta y ocho una
   racha.                                                                  */

let AC = null, MAE = null, ANA = null, RUIDO = null;
let CAMA = null, CAMA_G = null, CAMA_F = null;
let PAD = [], PAD_G = null;
let SON_ON = true;

const VOL = { maestro: 0.62, cama: 0.30, pad: 0.16 };

function audioArranca() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  MAE = AC.createGain(); MAE.gain.value = SON_ON ? VOL.maestro : 0;
  ANA = AC.createAnalyser(); ANA.fftSize = 2048;
  MAE.connect(ANA); ANA.connect(AC.destination);

  /* UN SEGUNDO DE RUIDO, GENERADO UNA VEZ. Cada golpe lo vuelve a leer con
     otro filtro y otra envolvente: hacer un buffer nuevo por sonido son
     44.100 numeros al azar por cada moneda. */
  RUIDO = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // la cama: ruido rosa-ish por un pasabajos que se abre con la velocidad
  CAMA = AC.createBufferSource(); CAMA.buffer = RUIDO; CAMA.loop = true;
  CAMA_F = AC.createBiquadFilter(); CAMA_F.type = 'lowpass';
  CAMA_F.frequency.value = 420; CAMA_F.Q.value = 0.7;
  CAMA_G = AC.createGain(); CAMA_G.gain.value = 0;
  CAMA.connect(CAMA_F); CAMA_F.connect(CAMA_G); CAMA_G.connect(MAE);
  CAMA.start();

  /* EL PAD SE TRANSPORTA CON LA HORA DEL DIA. Tres senos doblados y
     desafinados unas milesimas: dos senos identicos suenan a tono de prueba
     y dos que baten cada varios segundos suenan a instrumento. Y que la
     tonica siga a la paleta es lo que hace que amanecer se ESCUCHE. */
  PAD_G = AC.createGain(); PAD_G.gain.value = 0; PAD_G.connect(MAE);
  const filtro = AC.createBiquadFilter();
  filtro.type = 'lowpass'; filtro.frequency.value = 900; filtro.Q.value = 0.4;
  filtro.connect(PAD_G);
  PAD = [];
  for (let i = 0; i < 6; i++) {
    const o = AC.createOscillator(); o.type = 'sine';
    const g = AC.createGain(); g.gain.value = 0.30 / 6;
    o.connect(g); g.connect(filtro); o.start();
    PAD.push(o);
  }
  padAfina(0);
}

/* pentatonica menor: la escala en la que cualquier nota suena bien con
   cualquier otra, que en una cama que no para nunca es la diferencia entre
   musica y dolor de cabeza */
const PAD_SEMI = [0, 7, 12, 15, 19, 24];
function padAfina(h) {
  if (!PAD.length) return;
  const raiz = 55 * Math.pow(2, ((Math.round(h * 8) % 8) * 2) / 12);   // ocho tonicas, una por paleta
  for (let i = 0; i < PAD.length; i++) {
    const f = raiz * Math.pow(2, PAD_SEMI[i] / 12) * (i % 2 ? 1.0023 : 1);
    PAD[i].frequency.setTargetAtTime(f, AC.currentTime, 1.4);
  }
}

function audioPaso(dt, enJuego) {
  if (!AC) return;
  const t = AC.currentTime;
  const v = enJuego && R.vivo ? clamp((R.s - 6) / 26, 0, 1) : 0;
  CAMA_G.gain.setTargetAtTime(v * VOL.cama, t, 0.25);
  CAMA_F.frequency.setTargetAtTime(320 + v * 1500, t, 0.30);
  PAD_G.gain.setTargetAtTime(VOL.pad * (enJuego ? 0.75 : 1), t, 0.8);
  padAfina(HORA);
}

function audioMudo(v) {
  SON_ON = !v;
  if (MAE) MAE.gain.setTargetAtTime(SON_ON ? VOL.maestro : 0, AC.currentTime, 0.05);
}

/* ── LOS GOLPES ───────────────────────────────────────────────────────────
   Uno solo dispara ruido filtrado y otro un oscilador; la unica regla dura
   es la MEZCLA: la cama abajo de todo, un truco por encima, y el choque
   arriba de todos —es el unico momento en que el juego habla mas fuerte que
   el jugador—. Sin esa escala, terminar una voltereta suena igual que
   juntar una moneda y ninguna de las dos cosas significa nada.           */
function _env(g, t, a, d, pico) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function _ruido(t, dur, tipo, f0, f1, pico, q) {
  const s = AC.createBufferSource(); s.buffer = RUIDO;
  s.playbackRate.value = 0.85 + Math.random() * 0.3;
  const f = AC.createBiquadFilter(); f.type = tipo;
  f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  f.Q.value = q || 1;
  const g = AC.createGain();
  s.connect(f); f.connect(g); g.connect(MAE);
  _env(g, t, 0.008, dur, pico);
  s.start(t); s.stop(t + dur + 0.08);
}
function _tono(t, dur, f0, f1, pico, tipo) {
  const o = AC.createOscillator(); o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain();
  o.connect(g); g.connect(MAE);
  _env(g, t, 0.01, dur, pico);
  o.start(t); o.stop(t + dur + 0.08);
}

function son(k) {
  if (!AC || !SON_ON) return;
  const t = AC.currentTime;
  switch (k) {
    // el despegue: un raspado corto que SUBE, que es lo que hace la tabla
    case 'salta':  _ruido(t, 0.16, 'bandpass', 700, 2600, 0.30, 1.6); break;
    // el aterrizaje: golpe grave de arena, que BAJA
    case 'cae':    _ruido(t, 0.26, 'lowpass', 1400, 180, 0.42, 0.9); break;
    case 'flip':   _tono(t, 0.30, 480, 900, 0.20, 'triangle');
                   _tono(t + 0.06, 0.34, 720, 1350, 0.16, 'sine'); break;
    /* EL RASPADO DE LA CUERDA ERA EL SONIDO MAS FLOJO DEL JUEGO, y no le
       corresponde: medido, 0,0105 de rms contra 0,0067 del fondo —o sea 1,5
       veces— cuando saltar, que pasa cincuenta veces mas seguido, daba 1,8.
       Un pasabanda con Q 7 es tan angosto que casi no deja pasar energia.  */
    case 'grind':  _ruido(t, 0.42, 'bandpass', 1800, 2400, 0.34, 3.5); break;
    case 'moneda': _tono(t, 0.13, 1180, 1180, 0.20, 'sine');
                   _tono(t + 0.055, 0.20, 1760, 1760, 0.17, 'sine'); break;
    case 'truco':  _tono(t, 0.22, 880, 1320, 0.18, 'triangle'); break;
    case 'choque': _ruido(t, 0.55, 'lowpass', 900, 90, 0.62, 0.8);
                   _tono(t, 0.42, 180, 55, 0.34, 'sawtooth'); break;
    case 'ui':     _tono(t, 0.09, 660, 660, 0.16, 'square'); break;
    case 'obj':    _tono(t, 0.16, 880, 880, 0.20, 'sine');
                   _tono(t + 0.09, 0.26, 1320, 1320, 0.18, 'sine');
                   _tono(t + 0.20, 0.34, 1760, 1760, 0.16, 'sine'); break;
  }
}

/* el pico y el rms de lo que SALE, no de lo que se pidio: es la unica prueba
   de que un sonido sono, y la unica forma de comprobar la mezcla */
function audioNivel() {
  if (!ANA) return { pico: 0, rms: 0 };
  const n = ANA.fftSize, d = new Float32Array(n);
  ANA.getFloatTimeDomainData(d);
  let p = 0, s = 0;
  for (let i = 0; i < n; i++) { const v = Math.abs(d[i]); if (v > p) p = v; s += d[i] * d[i]; }
  return { pico: +p.toFixed(4), rms: +Math.sqrt(s / n).toFixed(4) };
}

/* ══════════════════════════════════════════════════════════════════════════
   HUD, PANELES, IDIOMA Y OBJETIVOS
   ──────────────────────────────────────────────────────────────────────────
   LOS OBJETIVOS SON EL JUEGO LARGO. Sin ellos esto es un contador de metros
   que sube: una partida de tres minutos se juega dos veces y se cierra. Con
   tres metas a la vista, cada corrida termina con algo a medio hacer, y eso
   es lo que hace que la siguiente arranque sola.

   TRES A LA VEZ Y NO SEIS, y no es por espacio: seis metas se leen como una
   lista de tareas y ninguna se persigue. Tres se recuerdan.

   Y SUBEN DE ESCALON, no se terminan. Cada objetivo tiene seis metas cada vez
   mas grandes; al cumplir una, ese objetivo se va al fondo de la cola y entra
   otro. Asi la lista nunca queda vacia y la dificultad la pone el jugador.  */

const $ = s => document.getElementById(s);
const D_CLAVE = 'duna_v1';

const GUARDA = { idi: '', cal: 1, rec: 0, mon: 0, niv: {}, ac: { grinds: 0 } };
function guardaLee() {
  try {
    const s = JSON.parse(localStorage.getItem(D_CLAVE) || '{}');
    if (s && typeof s === 'object') {
      if (s.idi) GUARDA.idi = s.idi;
      if (typeof s.cal === 'number') GUARDA.cal = clamp(s.cal | 0, 0, 2);
      GUARDA.rec = s.rec | 0; GUARDA.mon = s.mon | 0;
      GUARDA.niv = s.niv || {}; GUARDA.ac = s.ac || { grinds: 0 };
    }
  } catch (e) { /* ventana privada: se juega igual, no se guarda */ }
  OBJS.forEach(o => { if (typeof GUARDA.niv[o.id] !== 'number') GUARDA.niv[o.id] = 0; });
  if (typeof GUARDA.ac.grinds !== 'number') GUARDA.ac.grinds = 0;
}
function guardaEscribe() {
  try { localStorage.setItem(D_CLAVE, JSON.stringify(GUARDA)); } catch (e) {}
}

/* ── LOS TRES ACTIVOS ─────────────────────────────────────────────────────
   Los tres de nivel mas bajo. Con eso, el que acaba de completarse se va
   solo al fondo sin ninguna lista aparte que mantener, y un objetivo agotado
   (nivel 6) nunca vuelve a salir. */
function objActivos() {
  return OBJS
    .map((o, i) => ({ o, i, n: GUARDA.niv[o.id] }))
    .filter(a => a.n < a.o.m.length)
    .sort((a, b) => (a.n - b.n) || (a.i - b.i))
    .slice(0, 3)
    .map(a => a.o);
}
function objMeta(o) { return o.m[Math.min(GUARDA.niv[o.id], o.m.length - 1)]; }
function objValor(o) {
  const v = R[o.c] || 0;
  return o.acum ? GUARDA.ac.grinds + v : v;
}
function objTexto(o) { return T(o.k, objMeta(o)); }

let OBJ_HECHOS = [];       // los completados en ESTA corrida, para la pantalla del final
function objPaso() {
  if (PANT !== 'juego') return;
  const act = objActivos();
  for (let i = 0; i < act.length; i++) {
    const o = act[i];
    if (objValor(o) >= objMeta(o)) {
      GUARDA.niv[o.id]++;
      OBJ_HECHOS.push(T(o.k, o.m[GUARDA.niv[o.id] - 1]));
      guardaEscribe();
      son('obj');
      avisa(T('ok'), OBJ_HECHOS[OBJ_HECHOS.length - 1]);
    }
  }
}

/* ── EL HUD ───────────────────────────────────────────────────────────────
   Se escribe SOLO CUANDO CAMBIA. Escribir en el DOM cada cuadro obliga al
   navegador a recalcular la maqueta sesenta veces por segundo para poner el
   mismo texto, y con el marco girado eso se paga entero.                  */
const HUD = { pts: -1, mon: -1, truco: '', pista: null };
function hudPaso() {
  const m = Math.floor(R.dist);
  if (m !== HUD.pts) { HUD.pts = m; $('pts').textContent = m; }
  if (R.mons !== HUD.mon) { HUD.mon = R.mons; $('monN').textContent = R.mons; }

  const t = R.ultTrucoT > 0 ? R.ultTruco : '';
  if (t !== HUD.truco) {
    HUD.truco = t;
    const e = $('truco');
    if (t) {
      const p = t.split('\n');
      e.innerHTML = p.length > 1 ? p[1] + '<b>' + p[0] + '</b>' : p[0];
      e.classList.add('on');
    } else e.classList.remove('on');
  }
  const pi = PANT === 'juego' && SALTOS === 0 && R.dist < 120;
  if (pi !== HUD.pista) { HUD.pista = pi; $('pista').classList.toggle('on', pi); }
}
/* el aviso reusa el cartel del truco: es el mismo sitio, el mismo tamano y la
   misma vida corta. Un segundo cartel para decir "objetivo hecho" seria otro
   elemento que puede solaparse con este, y se solapan siempre. */
function avisa(a, b) {
  R.ultTruco = a + '\n' + b; R.ultTrucoT = 2.2; HUD.truco = null;
}

/* ── LOS PANELES ──────────────────────────────────────────────────────────
   Uno solo encendido, y el estado vive en UNA variable. Con una bandera por
   panel, dos pueden quedar prendidos a la vez y eso no falla: se ve. */
let PANT = 'idioma';
const PANELES = { idioma: 'pIdioma', menu: 'pMenu', pausa: 'pPausa', fin: 'pFin', juego: null };
function verPantalla(p) {
  PANT = p;
  for (const k in PANELES) if (PANELES[k]) $(PANELES[k]).classList.toggle('on', k === p);
  document.body.classList.toggle('jugando', p === 'juego');
  if (p === 'menu') pintaMenu();
}

function pintaIdioma() {
  $('iSub').textContent = T('idi');
  const c = $('iBotones'); c.innerHTML = '';
  [['es', 'CASTELLANO'], ['en', 'ENGLISH'], ['pt', 'PORTUGUÊS']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.className = 'b s'; b.textContent = n;
    b.onclick = () => { IDIOMA = k; GUARDA.idi = k; guardaEscribe(); pintaTodo(); verPantalla('menu'); son('ui'); };
    c.appendChild(b);
  });
}

function pintaObjs(cont, lista) {
  cont.innerHTML = '';
  lista.forEach(o => {
    const d = document.createElement('div');
    const hecho = typeof o === 'string';
    d.className = 'ob' + (hecho ? ' ok' : '');
    const txt = hecho ? o : objTexto(o);
    const val = hecho ? '' : Math.min(objValor(o), objMeta(o)) + '/' + objMeta(o);
    d.innerHTML = '<u></u><span>' + txt + '</span>' + (val ? '<s>' + val + '</s>' : '');
    cont.appendChild(d);
  });
}

function pintaMenu() {
  $('mSub').textContent = T('msub');
  $('mJugar').textContent = T('jugar');
  $('mTitObj').textContent = T('obj');
  $('mTitCal').textContent = T('cal');
  $('mTitIdi').textContent = T('idio');
  $('mPie').textContent = T('pie');
  $('mRec').textContent = T('rec', GUARDA.rec);
  $('mMon').textContent = T('mon', GUARDA.mon);
  pintaObjs($('obj'), objActivos());

  const cal = $('mCal'); cal.innerHTML = '';
  ['baja', 'media', 'alta'].forEach((n, i) => {
    const b = document.createElement('button');
    b.className = 'ch' + (CAL === i ? ' sel' : ''); b.textContent = T(n);
    /* SE APLICA EN CALIENTE. Un ajuste que pide recargar la pagina no se
       prueba: el jugador lo toca una vez, no ve nada y no vuelve. */
    b.onclick = () => { CAL = i; GUARDA.cal = i; guardaEscribe(); ajustaMarco(); pintaMenu(); son('ui'); };
    cal.appendChild(b);
  });
  const idi = $('mIdi'); idi.innerHTML = '';
  [['es', 'ES'], ['en', 'EN'], ['pt', 'PT']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.className = 'ch' + (IDIOMA === k ? ' sel' : ''); b.textContent = n;
    b.onclick = () => { IDIOMA = k; GUARDA.idi = k; guardaEscribe(); pintaTodo(); son('ui'); };
    idi.appendChild(b);
  });
}

function pintaPausa() {
  $('paTit').textContent = T('pausa');
  $('paSeguir').textContent = T('seguir');
  $('paMenu').textContent = T('menu');
  $('paPie').textContent = T('papie');
}

function pintaFin(nuevo) {
  $('fTit').textContent = nuevo ? T('nuevo') : T('fin');
  $('fSub').textContent = T('finS', Math.floor(R.dist));
  $('fDatos').textContent = T('fdatos', Math.floor(R.dist), R.mons, R.trucos);
  $('fOtra').textContent = T('otra');
  $('fMenu').textContent = T('menu');
  pintaObjs($('objF'), OBJ_HECHOS.length ? OBJ_HECHOS : objActivos());
}

/* un solo sitio repinta TODO: con una llamada por panel, cambiar de idioma en
   la pausa deja el menu en el idioma anterior hasta la proxima vez que se
   arme. Es el defecto que costo 107 claves en Z Force. */
function pintaTodo() {
  $('sub').textContent = T('sub');
  $('pista').textContent = T('pista');
  pintaIdioma(); pintaMenu(); pintaPausa();
  if (PANT === 'fin') pintaFin(false);
  HUD.truco = null; HUD.pts = -1; HUD.mon = -1;
}

/* ══════════════════════════════════════════════════════════════════════════
   LA ENTRADA Y EL BUCLE
   ══════════════════════════════════════════════════════════════════════════ */

/* ── UN SOLO BOTON, Y ES LA PANTALLA ENTERA ───────────────────────────────
   No hay joystick ni zona sensible: se toca donde sea. Pedir punteria sobre
   un boton chico con el pulgar en un juego que corre a treinta metros por
   segundo es cobrar por el aparato y no por el juego.
   Y EL TECLADO ENTRA POR EL MISMO SITIO que el dedo, que es `pulsa()`: con
   dos caminos, el dia que se toque uno el otro se queda atras.            */
let DEDOS = 0;
function entradaAbajo(e) {
  if (PANT !== 'juego') return;
  /* el boton de pausa vive DENTRO de la pantalla que salta: sin esta linea,
     tocarlo pausa y salta en el mismo gesto, y el jugador vuelve de la pausa
     en el aire sin haber apretado nada */
  if (e && e.target && e.target.closest && e.target.closest('#bPausa')) return;
  DEDOS++;
  if (DEDOS === 1) pulsa(true);
  if (e && e.cancelable) e.preventDefault();
}
function entradaArriba() {
  DEDOS = Math.max(0, DEDOS - 1);
  if (DEDOS === 0) pulsa(false);
}
addEventListener('pointerdown', entradaAbajo, { passive: false });
addEventListener('pointerup', entradaArriba);
addEventListener('pointercancel', entradaArriba);
/* si el dedo se levanta afuera de la ventana el `pointerup` no llega nunca y
   el rider se queda girando para siempre: es el mismo defecto que en RECREO
   dejaba al jugador caminando contra una pared */
addEventListener('blur', () => { DEDOS = 0; pulsa(false); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { entradaAbajo(e); }
  else if (e.code === 'Escape' || e.code === 'KeyP') { if (PANT === 'juego') pausa(true); else if (PANT === 'pausa') pausa(false); }
});
addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') entradaArriba();
});
addEventListener('resize', ajustaMarco);
/* el primer gesto despierta el audio: ningun navegador deja sonar nada antes
   de uno, y en captura sobre el documento no hay que acordarse en cada boton */
addEventListener('pointerdown', audioArranca, { capture: true });
addEventListener('keydown', audioArranca, { capture: true });

/* ── LA PARTIDA ───────────────────────────────────────────────────────────
   `demo` es la del menu: el mismo mundo, la misma fisica y el mismo boton,
   apretado por el auto-jugador. Un menu con el juego quieto detras tira a la
   basura lo unico que este juego tiene para mostrar.                      */
let DEMO = false;
/* Y SE PUEDE APAGAR LA RESURRECCION, que no es un detalle de sonda: mientras
   el demo revive solo, una corrida del auto-jugador NO PUEDE informar una
   muerte —`R.vivo` vuelve a true en el mismo paso y `R.muerte` se borra— asi
   que la medicion daba "25 de 25 vivos" pase lo que pase. Un numero que no
   puede salir mal no mide nada.                                          */
let DEMO_REVIVE = true;
const PREV = { x: 0, y: 0, ang: 0 };

function nuevaPartida(demo) {
  DEMO = !!demo;
  terrReinicia((Math.random() * 1e9) | 0);
  riderReinicia();
  camReinicia();
  riderVisReinicia();
  botReinicia(false);
  /* CADA PARTIDA ARRANCA EN UN MOMENTO SORTEADO DEL DIA: empezando siempre al
     alba, una corrida de cuatrocientos metros —que es la primera de
     cualquiera— veria siempre lo mismo y las otras siete paletas no
     existirian para nadie. */
  HORA0 = Math.random();
  HORA = HORA0;
  OBJ_HECHOS = [];
  DEDOS = 0; pulsa(false);
  PREV.x = R.x; PREV.y = R.y; PREV.ang = R.ang;
  HUD.pts = -1; HUD.mon = -1; HUD.truco = null; HUD.pista = null;
}

function empieza() {
  nuevaPartida(false);
  verPantalla('juego');
  audioArranca();
}
function pausa(v) {
  if (v && PANT === 'juego') verPantalla('pausa');
  else if (!v && PANT === 'pausa') verPantalla('juego');
}
function alMenu() {
  nuevaPartida(true);
  verPantalla('menu');
}
function termina() {
  const m = Math.floor(R.dist);
  const nuevo = m > GUARDA.rec;
  if (nuevo) GUARDA.rec = m;
  GUARDA.mon += R.mons;
  GUARDA.ac.grinds += R.grinds;
  guardaEscribe();
  pintaFin(nuevo);
  verPantalla('fin');
}

/* ── EL RELOJ: PASO FIJO CON INTERPOLACION ────────────────────────────────
   Un telefono a 30 y una notebook a 144 tienen que jugar EL MISMO juego: con
   el paso variable, la velocidad de crucero, el alcance del salto y la
   tolerancia del aterrizaje salen distintos en cada aparato, y eso no es una
   diferencia de rendimiento sino otro juego. Lo que rellena entre paso y
   paso es la interpolacion, no mas simulacion.                            */
let ACU = 0, ULT = 0, HORA0 = 0;

function unPaso(dt) {
  if (!R.vivo) return;
  PREV.x = R.x; PREV.y = R.y; PREV.ang = R.ang;
  if (DEMO) pulsa(botPiensa(dt));
  riderPaso(dt);
  HORA = HORA0 + R.dist / CICLO_M;
  if (!DEMO) objPaso();
  if (!R.vivo && !DEMO) termina();
  if (!R.vivo && DEMO && DEMO_REVIVE) nuevaPartida(true);   // el menu no se queda mirando un cadaver
}

function cuadro(ms) {
  requestAnimationFrame(cuadro);
  const t = ms / 1000;
  let dt = ULT ? t - ULT : 0; ULT = t;
  if (dt > DT_TOPE) dt = DT_TOPE;
  TIEMPO += dt;

  const corre = PANT === 'juego' || PANT === 'menu';
  if (corre) {
    ACU += dt;
    let n = 0;
    while (ACU >= PASO && n < PASOS_TOPE) { unPaso(PASO); ACU -= PASO; n++; }
    if (n === PASOS_TOPE) ACU = 0;   // el aparato no llega: va en camara lenta, no se cuelga
  }

  /* la posicion que se DIBUJA sale de mezclar los dos ultimos pasos, y el
     angulo por el camino corto: con `mezcla` a secas, cruzar de +179 a -179
     hace girar el cuerpo una vuelta entera en un cuadro */
  const a = corre ? clamp(ACU / PASO, 0, 1) : 1;
  const ix = mezcla(PREV.x, R.x, a), iy = mezcla(PREV.y, R.y, a);
  const iang = PREV.ang - angDif(PREV.ang, R.ang) * a;

  paletaEn(HORA);
  camPaso(dt);
  riderVis(dt, ix, iy, iang);
  audioPaso(dt, PANT === 'juego');
  if (PANT === 'juego' || PANT === 'pausa') hudPaso();

  pinta(ix, iy, iang);
}

/* ── EL ORDEN DEL DIBUJO ──────────────────────────────────────────────────
   De lejos a cerca, y el rider ANTES que las monedas: una moneda que se pasa
   por delante de la silueta se lee como que se junto, y las que quedan
   detras se leen como que faltan. El sacudon se aplica una sola vez a todo,
   asi que nada puede quedar desalineado con nada.                         */
function pinta(x, y, ang) {
  ctx.save();
  if (CAM.sac > 0.01) {
    ctx.translate(Math.sin(CAM.sacF) * CAM.sac * 7, Math.cos(CAM.sacF * 1.37) * CAM.sac * 5);
  }
  pintaFondo(HORA);
  pintaTerreno();
  pintaDeco();
  pintaCuerdas();
  pintaEstela();
  pintaArena();
  pintaRider(x, y, ang);
  pintaMonedas(TIEMPO);
  ctx.restore();
}

/* ── EL CARTEL DEL NOMBRE ─────────────────────────────────────────────────
   NO REEMPLAZA NADA HASTA QUE LLEGA. La palabra escrita con la tipografia del
   sistema ya funciona: el cartel la pisa recien cuando la imagen DECODIFICO.
   Puesto al reves —clase primero, imagen despues— un base64 roto esconde el
   `.nm` y muestra un `.cart` vacio, o sea que el menu se queda literalmente
   SIN nombre. Un asset que falla tiene que costar el asset, no la pantalla. */
function cartelPone() {
  if (typeof UI_CARTEL !== 'string' || !UI_CARTEL) return;
  const im = new Image();
  im.onload = () => {
    document.documentElement.style.setProperty('--cartel', 'url(' + UI_CARTEL + ')');
    document.body.classList.add('cartel');
  };
  im.src = UI_CARTEL;
}

/* ── EL ARRANQUE ──────────────────────────────────────────────────────────
   El idioma se pregunta ANTES del menu: elegirlo dentro de un menu ya escrito
   en un idioma que no se entiende no sirve, porque para cuando se lo
   encuentra ya se leyo todo lo demas sin entenderlo.                      */
guardaLee();
CAL = GUARDA.cal;
IDIOMA = GUARDA.idi || (navigator.language || 'en').slice(0, 2);
if (!LANG[IDIOMA]) IDIOMA = 'en';
ajustaMarco();
nuevaPartida(true);
pintaTodo();
cartelPone();
verPantalla(GUARDA.idi ? 'menu' : 'idioma');

$('mJugar').onclick = () => { son('ui'); empieza(); };
$('bPausa').onclick = e => { e.stopPropagation(); son('ui'); pausa(true); };
$('paSeguir').onclick = () => { son('ui'); pausa(false); };
$('paMenu').onclick = () => { son('ui'); alMenu(); };
$('fOtra').onclick = () => { son('ui'); empieza(); };
$('fMenu').onclick = () => { son('ui'); alMenu(); };

requestAnimationFrame(cuadro);

/* ══════════════════════════════════════════════════════════════════════════
   LAS SONDAS
   ──────────────────────────────────────────────────────────────────────────
   Una afirmacion sin numero no vale. Esto es lo que permite decir "el mundo
   se puede recorrer" con veinticinco semillas en vez de con una captura, y
   —lo mas importante— lo que permite que una prueba DETECTE un defecto y no
   solo apruebe el arreglo.                                                */
window.__errs = [];
addEventListener('error', e => window.__errs.push('' + (e.message || e)));
addEventListener('unhandledrejection', e => window.__errs.push('promesa: ' + e.reason));

window.__D = {
  est: () => ({
    pant: PANT, idi: IDIOMA, cal: CAL, hora: +HORA.toFixed(3), pal: PAL.n,
    x: +R.x.toFixed(1), y: +R.y.toFixed(2), s: +R.s.toFixed(2),
    suelo: R.suelo, cuerda: !!R.cuerda, vivo: R.vivo, muerte: R.muerte,
    ang: +R.ang.toFixed(3), giro: +R.giro.toFixed(2),
    dist: Math.floor(R.dist), mons: R.mons, flips: R.flips, grinds: R.grinds,
    trucos: R.trucos, comboMax: R.comboMax, saltoMax: +R.saltoMax.toFixed(1),
    demo: DEMO, marco: [ANCHO, ALTO], esc: +ESC.toFixed(2), pxr: +PXR.toFixed(2),
    lienzo: [lienzo.width, lienzo.height],
    bufanda: BUF.length, arena: ARE.length, estela: EST.length,
    rec: GUARDA.rec, monTot: GUARDA.mon, niv: Object.assign({}, GUARDA.niv),
  }),
  /* jugar de verdad: el bot aprieta el MISMO boton que el dedo y pasa por el
     mismo `unPaso`, asi que terminar una partida aca prueba el juego que se
     juega y no una simulacion parecida */
  /* EL MODO PASA TAL CUAL Y NO CONVERTIDO A BOOLEANO. Con `!!modo` el control
     al azar llegaba como `true`, o sea como el bot torpe: medido, las dos
     filas daban 6.649 y 6.664 metros —la misma cifra— y eso se lee a que el
     juego no pide nada cuando lo que pasaba es que se estaba corriendo dos
     veces el mismo bot. Un control que no es un control aprueba cualquier
     cosa. */
  juega: (seg, modo) => {
    const g = DEMO; DEMO = true; DEMO_REVIVE = false; botReinicia(modo);
    const n = Math.round((seg || 60) / PASO);
    let i = 0;
    /* Y ADEMAS AVANZA LO VISUAL. `unPaso` mueve la fisica y nada mas: la
       bufanda, la arena y la estela viven en `cuadro`, o sea al ritmo del
       DIBUJO. Un bot que solo integra la fisica los deja congelados en su
       pose de reposo, y entonces `bufanda()` despues de `juega()` mide una
       bufanda que nunca vivio — medido, cuarenta muestras dieron curva 0,000
       y largo 1,53 clavado, que es la cadena en reposo. Aca el paso fijo y el
       cuadro van al mismo ritmo, asi que avanzarlos juntos es fiel. */
    /* Y LA CAMARA TAMBIEN, que es lo que hace que una foto sacada despues de
       un bot muestre el sitio donde el rider esta. `camPaso` vive en `cuadro`,
       asi que sin esto la camara se queda donde estaba en el ultimo dibujo
       mientras el rider avanza quinientos metros: medido en la captura, el
       terreno se veia bien y el rider NO ESTABA EN EL CUADRO. Es la misma
       trampa que ya costo una vuelta en RECREO y otra en HUESOS. */
    for (; i < n && R.vivo; i++) {
      unPaso(PASO); TIEMPO += PASO;
      riderVis(PASO, R.x, R.y, R.ang); camPaso(PASO);
    }
    const r = { dist: Math.floor(R.dist), seg: +(i * PASO).toFixed(1),
                s: +(R.dist / Math.max(i * PASO, 0.01)).toFixed(1),
                muerte: R.muerte, vivo: R.vivo, mons: R.mons, flips: R.flips,
                grinds: R.grinds, trucos: R.trucos, saltos: SALTOS };
    DEMO = g; DEMO_REVIVE = true; return r;
  },
  nueva: sem => {
    terrReinicia(sem === undefined ? (Math.random() * 1e9) | 0 : sem);
    riderReinicia(); camReinicia(); riderVisReinicia(); botReinicia(false);
    HORA0 = 0; HORA = 0; OBJ_HECHOS = [];
    PREV.x = R.x; PREV.y = R.y; PREV.ang = R.ang;
    return TERR_SEM;
  },
  /* AUDITAR EL MUNDO NO ES MIRARLO: se recorre el terreno metro a metro y se
     comprueba que ningun hueco sea mas ancho de lo que un salto cruza, que
     ninguna moneda quede enterrada y que ninguna cuerda quede fuera de
     alcance. Un mapa generado y no comprobado es un mapa roto que todavia no
     se sabe. */
  audita: (sem, metros) => {
    terrReinicia(sem); riderReinicia();
    const hasta = metros || 4000;
    terrGenera(hasta + 400);
    let peorHueco = 0, monMal = 0, cuMal = 0;
    for (const h of HUECOS) if (h.b - h.a > peorHueco) peorHueco = h.b - h.a;
    for (const m of MONEDAS) if (hayPiso(m.x) && m.y < terrY(m.x) + 0.4) monMal++;
    for (const c of CUERDAS) if (c.y0 - terrY(c.x0) > 7 || c.y0 - terrY(c.x0) < 1.2) cuMal++;
    return { sem: TERR_SEM, pc: PC.length, huecos: HUECOS.length,
             peorHueco: +peorHueco.toFixed(1), cuerdas: CUERDAS.length, cuMal,
             monedas: MONEDAS.length, monMal, deco: DECO.length };
  },
  hora: h => { HORA0 = h - R.dist / CICLO_M; HORA = h; paletaEn(HORA); return PAL.n; },
  pantalla: p => { verPantalla(p); return PANT; },
  idioma: k => { IDIOMA = k; pintaTodo(); return T('jugar'); },
  calidad: i => { CAL = i; ajustaMarco(); pintaMenu(); return [ANCHO, ALTO, +PXR.toFixed(2)]; },
  toca: v => { if (v) entradaAbajo(null); else entradaArriba(); return APRETADO; },
  empieza: () => { empieza(); return PANT; },
  mata: () => { R.vivo = false; R.muerte = 'sonda'; if (!DEMO) termina(); return PANT; },
  nivel: (id, n) => { GUARDA.niv[id] = n; guardaEscribe(); pintaMenu();
                      return objActivos().map(o => o.id); },
  objs: () => objActivos().map(o => ({ id: o.id, meta: objMeta(o),
        val: +objValor(o).toFixed(1), txt: objTexto(o) })),
  audio: () => audioNivel(),
  /* disparar un sonido SUELTO es la unica forma de medir la escala de la
     mezcla: leyendo el nivel en el medio de una partida se miden tres cosas
     encimadas y no se sabe cual es cual. */
  son: k => { son(k); return k; },
  /* la bufanda no se puede juzgar en una captura de treinta pixeles: lo que
     dice si va atras o se enrosca es donde caen sus diez puntos respecto del
     cuello, en metros */
  /* Y EL LARGO SOLO NO ALCANZA: una antena mide igual que una tela. Lo que
     las separa es CUANTO SE APARTA de la recta cuello-punta, en fracciones de
     su propio largo. Un palo da 0; medido, una bufanda que ondula da entre
     0,05 y 0,25. Sin este numero la primera version paso la prueba del largo
     con una recta perfecta. */
  bufanda: () => {
    const n = BUF[0], u = BUF[BUF.length - 1];
    const L = Math.hypot(u.x - n.x, u.y - n.y);
    let cur = 0;
    if (L > 1e-3) for (let i = 1; i < BUF.length - 1; i++)
      cur = Math.max(cur, Math.abs((u.x - n.x) * (n.y - BUF[i].y) - (n.x - BUF[i].x) * (u.y - n.y)) / L);
    return { ang: +R.ang.toFixed(2), vx: +R.vx.toFixed(1), vy: +R.vy.toFixed(1),
             pts: BUF.map(p => [+(p.x - n.x).toFixed(2), +(p.y - n.y).toFixed(2)]),
             largo: +L.toFixed(2), curva: +(cur / Math.max(L, 1e-3)).toFixed(3) };
  },
  pose: () => ({ ag: +POSE.ag.toFixed(2), tk: +POSE.tk.toFixed(2),
                 br: +POSE.br.toFixed(2), ln: +POSE.ln.toFixed(2), sq: +POSE.sq.toFixed(2) }),
  mudo: v => { audioMudo(v); return SON_ON; },
  /* PARA MEDIR SOLAPAMIENTOS HAY QUE USAR offsetLeft/offsetTop Y NO
     getBoundingClientRect: el marco esta GIRADO noventa grados, y el
     rectangulo que devuelve el navegador esta alineado a los ejes de la
     pantalla, o sea que denuncia choques que no existen. Ya costo una vuelta
     en ECO y otra en HUESOS. */
  cajas: () => {
    const ids = ['pts', 'sub', 'mon', 'truco', 'pista', 'bPausa'];
    const v = [];
    for (const id of ids) {
      const e = $(id); if (!e) continue;
      const cs = getComputedStyle(e);
      if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < 0.05) continue;
      if (!e.offsetWidth || !e.offsetHeight) continue;
      v.push({ id, x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight });
    }
    const ch = [];
    for (let i = 0; i < v.length; i++) for (let j = i + 1; j < v.length; j++) {
      const a = v[i], b = v[j];
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h)
        ch.push(a.id + '×' + b.id);
    }
    const fuera = v.filter(c => c.x < -1 || c.y < -1 || c.x + c.w > ANCHO + 1 || c.y + c.h > ALTO + 1)
                   .map(c => c.id);
    return { n: v.length, choques: ch, fuera, marco: [ANCHO, ALTO], cajas: v };
  },
  /* que un panel ENTRE en el cuadro es una propiedad del panel, no del texto:
     con tres idiomas y seis metas de largo variable, el que no entra es
     siempre el que nadie miro */
  panel: id => {
    const p = $(id), c = p.querySelector('.caja');
    return { on: p.classList.contains('on'), alto: c.offsetHeight, marco: ALTO,
             entra: c.offsetHeight <= ALTO, sobra: ALTO - c.offsetHeight };
  },
  /* el brillo se lee del BUFFER y no de una captura: es lo unico que dice si
     una paleta de verdad ilumina la pantalla */
  brillo: () => {
    const d = ctx.getImageData(0, 0, lienzo.width, lienzo.height).data;
    let s = 0, n = 0;
    for (let i = 0; i < d.length; i += 4 * 37) { s += (d[i] + d[i + 1] + d[i + 2]) / 3; n++; }
    return +(s / n).toFixed(1);
  },
  costo: () => {
    const t0 = performance.now();
    for (let i = 0; i < 20; i++) pinta(R.x, R.y, R.ang);
    return { msCuadro: +((performance.now() - t0) / 20).toFixed(3) };
  },
};
</script></body></html>
