<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DUNA</title>
<style>
/* ── EL MARCO VA APAISADO ADENTRO DE UN TELEFONO VERTICAL ─────────────────
   Este juego corre hacia la derecha, asi que necesita ancho: en un 412x892
   un 16:9 sin girar mide 412x232, o sea el 11% de la pantalla. Las dos
   salidas malas son encogerlo y pedirle al jugador que gire el aparato —una
   pantalla que no hace nada—. Se gira el MARCO 90 grados y adentro va TODO:
   lienzo, HUD y paneles, una sola transformacion, nada que desalinear.
   En una pantalla que ya es apaisada no se gira nada.                     */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07080c;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#eae4d8;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#marco{position:absolute;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden;
  background:#07080c}
#lienzo{display:block;width:100%;height:100%}

/* ── LA INTERFAZ ──────────────────────────────────────────────────────────
   Todo el texto sale de `--mh`, que es el LADO CORTO del marco: el marco va
   girado, asi que `vh` aca es el lado LARGO y cualquier medida en vh sale
   dos veces mas grande en un telefono. Ya costo una vuelta en HUESOS.     */
#hud{position:absolute;inset:0;pointer-events:none}
/* EL MARCADOR VA CON MARGEN A LOS DOS LADOS, Y NO ES ESTETICA. Con
   `left:0;right:0` la CAJA mide el ancho entero aunque el texto vaya centrado,
   asi que se pisa con el contador de monedas —que vive a la derecha— y con el
   boton de pausa, que vive a la izquierda: medido, `pts×mon` y `pts×bPausa`.
   No se ve, pero el dedo que va a la pausa toca el marcador. Es exactamente el
   mismo defecto que ya costo una vuelta en CRUCE. El margen sale de donde
   terminan los dos: la pausa llega a .038+.082 y las monedas empiezan a .045
   del canto derecho, asi que .14 los despeja a los dos con aire.          */
#pts{position:absolute;left:calc(var(--mh,412px)*.14);right:calc(var(--mh,412px)*.14);
  top:calc(var(--mh,412px)*.045);text-align:center;
  font:800 clamp(20px,calc(var(--mh,412px)*.086),40px)/1 monospace;letter-spacing:.06em;
  color:#fff;opacity:.94;text-shadow:0 2px 10px rgba(0,0,0,.35)}
#sub{position:absolute;left:0;right:0;top:calc(var(--mh,412px)*.135);text-align:center;
  font:600 clamp(9px,calc(var(--mh,412px)*.030),13px)/1 monospace;letter-spacing:.22em;
  color:#fff;opacity:.50}
#mon{position:absolute;right:calc(var(--mh,412px)*.045);top:calc(var(--mh,412px)*.045);
  font:700 clamp(11px,calc(var(--mh,412px)*.036),16px)/1 monospace;letter-spacing:.10em;
  color:#ffd98a;opacity:.92;display:flex;align-items:center;gap:6px}
#mon i{display:block;width:.75em;height:.75em;border-radius:50%;background:#ffd98a;
  box-shadow:0 0 8px rgba(255,217,138,.6);font-style:normal}
/* Y LOS TRES SE APAGAN FUERA DE LA PARTIDA. El marcador estaba siempre puesto,
   asi que la PRIMERA pantalla del juego —la de elegir idioma— salia con un
   «0 metros» y un contador de monedas en cero encima del cartel del nombre:
   un marcador que cuenta una partida que todavia no empezo no informa nada, y
   encima le compite al titulo. `#bPausa` ya lo hacia bien; a estos tres nadie
   se los habia mirado porque `cajas()` mide el HUD contra si mismo y no
   contra los paneles. Y EL AVISO DE TRUCO ES EL PEOR DE LOS CINCO: se queda
   con su `.on` puesto del ultimo truco, asi que la pantalla de final salia
   con «hace un salto de 14 metros / HECHO» cruzado por encima de los metros
   recorridos y del renglon de monedas —dos textos en el mismo sitio—. */
#pts,#sub,#mon,#truco,#pista{display:none}
body.jugando #pts,body.jugando #sub,
body.jugando #truco,body.jugando #pista{display:block}
body.jugando #mon{display:flex}
/* el aviso de truco: entra y se va, y es lo unico que le dice al jugador que
   lo que hizo tiene nombre. Sin esto un backflip es "salte y no me cai". */
#truco{position:absolute;left:0;right:0;top:calc(var(--mh,412px)*.30);text-align:center;
  font:800 clamp(13px,calc(var(--mh,412px)*.048),22px)/1.25 monospace;letter-spacing:.16em;
  color:#fff;opacity:0;transform:translateY(10px);transition:opacity .18s,transform .18s;
  text-shadow:0 2px 14px rgba(0,0,0,.45)}
#truco.on{opacity:1;transform:translateY(0)}
#truco b{display:block;font-size:.62em;letter-spacing:.30em;opacity:.72;font-weight:600;
  margin-top:.35em}

/* ── LOS PANELES ──────────────────────────────────────────────────────────
   El velo es un DEGRADADO y no una opacidad pareja: cerrado arriba y abajo,
   donde van el titulo y los botones, y abierto en el medio, que es donde el
   juego tiene algo para mostrar. Detras corre la partida de demostracion. */
.panel{position:absolute;inset:0;display:none;place-items:center;z-index:5;
  background:linear-gradient(180deg,rgba(8,9,14,.93) 0%,rgba(8,9,14,.40) 38%,
    rgba(8,9,14,.40) 62%,rgba(8,9,14,.94) 100%)}
.panel.on{display:grid}
/* EL RITMO VERTICAL VA EN --mh Y APRETADO. Medido, con el hueco en 0,026 la
   caja del menu media 414 px en un marco de 412 y 401 en uno de 360: el
   titulo salia cortado por arriba y la linea del record pegada al borde de
   abajo. Y no alcanza con achicar el hueco, porque casi todo lo demas —los
   botones, las tres filas de objetivos— esta en px fijos y en un marco chico
   eso es lo que manda: hubo que apretar las nueve medidas a la vez.       */
/* Y ENSANCHAR LA CAJA NO SIRVE, medido: con 470, 540 y 600 px de ancho el
   panel mide 369 px LOS TRES, hasta el pixel. Lo que lo hace alto no es texto
   que se parte en renglones —ninguna fila envuelve— sino el relleno de las
   tres filas de objetivos y los cinco huecos. Un cambio que no mide mejor no
   se deja puesto por parecer razonable.                                  */
.caja{width:min(80%,470px);text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:calc(var(--mh,412px)*.014)}
h1{font:800 clamp(22px,calc(var(--mh,412px)*.092),44px)/1 monospace;letter-spacing:.34em;
  color:#f4ead8;text-shadow:0 3px 0 rgba(0,0,0,.30),0 0 34px rgba(255,190,120,.22)}
/* `:not(.nm)` Y NO `h1 span` A SECAS. Esta regla se escribio para el
   SUBTITULO, y el nombre del juego tambien es un span: medido, `DUNA` salia a
   10,712 px —exactamente el mismo cuerpo que su propio subtitulo— sobre un h1
   que dice 37,904. O sea que lo mas grande del menu era lo mas chico, y no
   fallaba nada: se leia como un rotulo. */
h1 .nm{display:block}
h1 span:not(.nm){display:block;font:600 clamp(8px,calc(var(--mh,412px)*.026),12px)/1.6 monospace;
  letter-spacing:.26em;color:#c9bda8;opacity:.72;margin-top:calc(var(--mh,412px)*.012);
  text-shadow:none}
/* EL ANCHO DEL TITULO NO PUEDE DEPENDER DEL SUBTITULO. Un `h1` dentro de una
   columna flex centrada se encoge hasta su contenido, y su contenido mas
   ancho es el subtitulo: medido, el cartel quedaba en 314 px sobre una caja
   de 540 porque esa es la longitud de «bajá la duna · un dedo · sin final».
   O sea que el tamano del nombre del juego cambiaba con el idioma.       */
.tit{width:100%}
.tit .cart{display:none}
body.cartel .tit .nm{display:none}
body.cartel .tit .cart{display:block;width:100%;
  height:clamp(26px,calc(var(--mh,412px)*.130),62px);
  background:var(--cartel) center/contain no-repeat;
  filter:drop-shadow(0 3px 12px rgba(0,0,0,.45))}
.b{padding:9px 30px;min-width:210px;border:0;border-radius:999px;
  background:linear-gradient(180deg,#f6ecd8,#dcc9a6);
  font:700 13px/1 monospace;letter-spacing:.20em;color:#2a2013;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.22)}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.b.s{background:rgba(255,255,255,.10);color:#e9e0cd;box-shadow:none;
  border:1px solid rgba(255,255,255,.20);min-width:150px;padding:9px 22px;font-size:11px}
.fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fila.jt{gap:10px;align-items:center}
.b.ch{min-width:0;padding:9px 18px;font-size:.86em}
.fila.tres{width:100%;flex-wrap:nowrap}
.ch{padding:6px 0;min-width:0;flex:1 1 0;border:1px solid rgba(255,255,255,.18);
  border-radius:8px;background:rgba(255,255,255,.05);
  font:600 10px/1 monospace;letter-spacing:.10em;color:#cdc4b2;cursor:pointer}
.ch.sel{border-color:rgba(255,214,150,.75);color:#ffe9c4;background:rgba(255,200,130,.14)}
.tit2{font:700 11px/1 monospace;letter-spacing:.22em;color:#a99e8a;opacity:.8}
/* el relleno de las filas y los huecos son lo unico que se aprieta: el
   cuerpo de letra no, que es lo que no se puede achicar sin perder
   legibilidad. */
.gr{display:flex;flex-direction:column;gap:3px;align-items:center;width:100%}
.pies{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.pie{font:500 10px/1.45 monospace;color:#9b9280;max-width:360px}
.pie.rec{font:600 10px/1.5 monospace;letter-spacing:.09em;color:#d8b877;
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ── LOS OBJETIVOS ────────────────────────────────────────────────────────
   Tres a la vez y en una lista, como en Alto: son lo que convierte "corri
   otra vez" en "me falta uno". El tildado va en el propio renglon, porque un
   contador aparte obliga a mirar dos sitios.                              */
#obj{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:0}
.ob{display:flex;align-items:center;gap:9px;text-align:left;
  font:500 10px/1.35 monospace;color:#b7ad99;padding:4px 11px;border-radius:9px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.ob u{flex:0 0 auto;width:14px;height:14px;border-radius:4px;text-decoration:none;
  border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;
  font-size:9px;color:#0d1018}
.ob.ok{color:#e7dcc4}
.ob.ok u{background:#ffd98a;border-color:#ffd98a}
.ob.ok u::after{content:'✓'}
.ob s{margin-left:auto;text-decoration:none;opacity:.6;font-size:9px;letter-spacing:.08em}

/* ── LAS DOS ZONAS ────────────────────────────────────────────────────────
   Media pantalla cada una, y son DIV DEL DOM a proposito: el marco esta
   girado noventa grados, asi que averiguar de que lado cayo el dedo con
   cuentas sobre el puntero obliga a invertir la rotacion a mano —y este repo
   ya se equivoco con eso dos veces—. Con dos divs, la cuenta la hace el
   navegador.
   Van DEBAJO de los paneles (z 5) y del boton de pausa (z 3): con la pausa
   por debajo, tocarla saltaria y pausaria en el mismo gesto y el jugador
   volveria de la pausa en el aire sin haber apretado nada.
   Y NO SE VEN. Un rectangulo tenue partiendo la pantalla al medio se lee a
   error de dibujo; lo que ensena donde tocar es el tutorial, que dura lo que
   dura y despues se va.                                                   */
.zona{position:absolute;top:0;bottom:0;width:50%;z-index:1;background:transparent}
body:not(.jugando) .zona{display:none}
/* LOS NOMBRES SON DE TRABAJO Y NO DE SITIO: `zTurbo` esta a la izquierda y
   `zSalto` a la derecha, y el dia que se vuelvan a dar vuelta lo que se
   mueve es UNA linea de CSS. Con `zIzq`/`zDer` el codigo diria un sitio y
   haria otra cosa, que es la forma mas rapida de invertir la mitad de los
   controles y ninguna de las otras. */
#zTurbo{left:0}
#zSalto{right:0}
/* saltear el tutorial: chiquito, abajo a la derecha, donde no hay nada */
#tSalt{position:absolute;right:calc(var(--mh,412px)*.04);bottom:calc(var(--mh,412px)*.04);
  z-index:3;display:none;padding:6px 14px;border-radius:999px;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);
  font:600 clamp(8px,calc(var(--mh,412px)*.026),12px)/1 monospace;letter-spacing:.16em;
  color:#e9e0cd;opacity:.7;cursor:pointer;pointer-events:auto}
body.tuto #tSalt{display:block}

/* ── EL BOTON DE PAUSA ────────────────────────────────────────────────────
   Es lo unico tactil que hay ademas del juego entero: se toca en cualquier
   lado para saltar, asi que la pausa tiene que estar donde el pulgar NO va
   —arriba a la izquierda— y ser chica.                                    */
#bPausa{position:absolute;left:calc(var(--mh,412px)*.038);top:calc(var(--mh,412px)*.038);
  width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.20);
  border:1px solid rgba(255,255,255,.18);display:none;place-items:center;z-index:3;
  font:700 15px/1 monospace;color:#fff;opacity:.55;pointer-events:auto;cursor:pointer}
body.jugando #bPausa{display:grid}
/* la pista del primer toque: se va sola en cuanto se salta una vez */
#pista{position:absolute;left:0;right:0;bottom:calc(var(--mh,412px)*.10);text-align:center;
  font:600 clamp(9px,calc(var(--mh,412px)*.030),13px)/1.5 monospace;letter-spacing:.16em;
  color:#fff;opacity:0;transition:opacity .4s}
#pista.on{opacity:.62}
/* CON EL TUTORIAL PUESTO LA PISTA SOBRA, y encima se pisan: las dos caen en
   la misma franja de abajo y el renglon del tutorial la tapa a medias
   —fotografiado, «DERECHA SALTA · IZQUIERDA EMPUJA» asomando por debajo de
   «TOCÁ A LA DERECHA PARA SALTAR»—. La pista es el respaldo para el que
   salteo el tutorial, asi que mientras el tutorial habla, se calla.
   `cajas()` no lo puede ver: el renglon del tutorial se dibuja en el lienzo
   y la pista es DOM. */
body.tuto #pista{display:none}
</style></head><body>
<div id="marco">
  <canvas id="lienzo"></canvas>
  <div class="zona" id="zTurbo"></div>
  <div class="zona" id="zSalto"></div>
  <div id="hud">
    <div id="pts">0</div>
    <div id="sub"></div>
    <div id="mon"><i></i><span id="monN">0</span></div>
    <div id="truco"></div>
    <div id="pista"></div>
  </div>
  <div class="bt" id="bPausa">‖</div>
  <button id="tSalt"></button>

  <div class="panel on" id="pIdioma"><div class="caja">
    <h1 class="tit"><i class="cart"></i><span class="nm">DUNA</span><span id="iSub">elegí tu idioma</span></h1>
    <div class="fila" id="iBotones"></div>
  </div></div>

  <div class="panel" id="pMenu"><div class="caja">
    <h1 class="tit"><i class="cart"></i><span class="nm">DUNA</span><span id="mSub"></span></h1>
    <!-- LOS DOS EN UNA FILA, y no es por ahorrar: son HERMANOS —los dos
         arrancan una corrida, uno con el tutorial puesto— asi que apilados
         el segundo se lee a nota al pie. Y apilados el menu media 433 en un
         marco de 412: la fila devuelve 37 px, que son los 21 que faltaban
         mas aire. La jerarquia la sigue diciendo el tamano. -->
    <div class="fila jt"><button class="b" id="mJugar"></button>
    <button class="b s ch" id="mTuto"></button></div>
    <div class="gr"><div class="tit2" id="mTitObj"></div><div id="obj"></div></div>
    <div class="gr"><div class="tit2" id="mTitCal"></div><div class="fila tres" id="mCal"></div></div>
    <div class="gr"><div class="tit2" id="mTitIdi"></div><div class="fila tres" id="mIdi"></div></div>
    <div class="pies"><div class="pie" id="mPie"></div>
    <div class="pie rec"><span id="mRec"></span><span id="mMon"></span></div></div>
  </div></div>

  <div class="panel" id="pPausa"><div class="caja">
    <h1 id="paTit"></h1>
    <button class="b" id="paSeguir"></button>
    <button class="b s" id="paTerm"></button>
    <button class="b s" id="paMenu"></button>
    <div class="pie" id="paPie"></div>
  </div></div>

  <div class="panel" id="pFin"><div class="caja">
    <h1><b id="fTit"></b><span id="fSub"></span></h1>
    <div class="pie" id="fDatos"></div>
    <div class="gr"><div id="objF"></div></div>
    <button class="b" id="fOtra"></button>
    <button class="b s" id="fMenu"></button>
  </div></div>
</div>

/* ══════════════════════════════════════════════════════════════════════════
   DUNA · sandboard de dos zonas, sin final
   ──────────────────────────────────────────────────────────────────────────
   LA PANTALLA SE PARTE AL MEDIO Y CADA MITAD ES UNA MANO. No hay botones
   dibujados que haya que acertar: la zona ES la pantalla, asi que el pulgar
   cae donde caiga y siempre esta encima de algo.
     IZQUIERDA · tocar repetido            → empuja, hasta un TOPE
     DERECHA   · un toque en el suelo      → salta
                 sostener en el aire       → voltereta hacia atras
                 sostener sobre una cuerda → se cuelga y se desliza
   De ahi cuelga el resto del diseno: no hay nada que apuntar, asi que la
   dificultad esta en el TIEMPO —cuando saltar, cuando soltar, cuando gastar
   velocidad— y no en la punteria, que es lo unico que un dedo sobre una
   pantalla no puede dar con precision.

   Y NO SE PIERDE: LA BAJADA NO TERMINA. Caerse cuesta lo unico que este
   juego tiene para cobrar —la velocidad— y no la partida. Una pantalla de
   derrota cada cuarenta segundos convierte un paseo por una duna en una
   sucesion de menus; sin ella, el error se paga en los cuatro o cinco
   segundos que cuesta volver a agarrar ritmo, que es un castigo que se
   siente y no interrumpe. La corrida la termina el jugador desde la pausa.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── EL RELOJ ─────────────────────────────────────────────────────────────
   Paso fijo con interpolacion: un telefono a 30 y una notebook a 144 tienen
   que jugar EL MISMO juego. Con paso variable la velocidad, el alcance del
   salto y la ventana del aterrizaje salen distintos, y eso no es una
   diferencia de rendimiento: es otro juego.                               */
const PASO = 1 / 60;
const DT_TOPE = 0.25;      // una pestana dormida no simula cuarenta pasos de golpe
const PASOS_TOPE = 8;      // si el aparato no llega, va en camara lenta y no se cuelga

/* ── EL MUNDO ─────────────────────────────────────────────────────────────
   Las unidades son METROS y la vista mide 46 de ancho. Un rider de 1,8 m
   ocupa entonces el 3,9% del ancho del cuadro, que es la escala de Alto: el
   personaje es chico y lo que se mira es el paisaje.                      */
const VISTA_ANCHO = 52;
/* DONDE VA EL RIDER EN EL CUADRO NO ES ESTETICA: ES CUANTO AVISO TIENE. A la
   izquierda del 30% del ancho ve 36 m por delante, y a 30 m/s eso son 1,2 s
   para decidir un salto. Y la camara SE ADELANTA CON LA VELOCIDAD, porque si
   no la dificultad crece sola: yendo mas rapido el mismo hueco llega antes.
   El bot torpe —el que mide cuanto dura una partida— saca su horizonte de
   estos dos numeros y no de una constante propia: con dos, mover la camara
   deja al validador midiendo un juego que ya no existe.                   */
const RIDER_X = 0.30;       // fraccion del ancho del cuadro
const CAM_ADEL = 0.34;      // segundos de adelanto: a 30 m/s son 10 m mas de aviso
const G = 30.0;             // gravedad
/* EL ROCE Y EL AIRE NO SE ELIGEN, SALEN DE LA VELOCIDAD QUE SE QUIERE. En
   una ladera de pendiente `CAIDA` el equilibrio es
     G·sinθ = μ·G·cosθ + AIRE·v²,
   asi que con μ=0,045 y AIRE=0,008 la velocidad de crucero en llano queda en
   20 m/s —unos 72 km/h, que es la sensacion del genero— y en una duna
   empinada sube sola. Escribiendo la velocidad a mano y el roce aparte, las
   dos se separan el dia que se toque la pendiente.                        */
const ROCE = 0.045;         // rozamiento de la tabla contra la arena (μ)
const AIRE = 0.008;         // roce del aire, va con el cuadrado
const V_MIN = 8.5;          // por debajo de esto el juego empuja: clavarse no es un final
const V_MAX = 38.0;
/* EL SALTO SALE DE CUANTO DURA UNA VOLTERETA, y no al reves. Con impulso
   `S` el vuelo llano dura `2S/G`; una vuelta a `GIRO_V` tarda `2π/GIRO_V`.
   Con S=12,6 el vuelo daba 0,84 s contra 0,85 de una vuelta: JUSTO no
   entraba, y medido el auto-jugador cerraba cero volteretas en 25 semillas.
   Con S=16,5 el vuelo llano da 1,10 s y una vuelta 0,73: entra una comoda
   desde cualquier lado y las dobles piden una rampa, que es el reparto que
   este genero tiene.                                                      */
const SALTO = 16.5;         // impulso vertical, FIJO — lo que varia es la rampa
const COYOTE = 0.11;        // se puede saltar un pestaneo despues de haberse ido del borde
const BUFFER = 0.15;        // un salto apretado un pestaneo antes de tocar vale igual
const GIRO_V = 8.6;         // rad/s de la voltereta: una vuelta en 0,73 s
const GIRO_TOL = 0.62;      // cuanto se puede errar el angulo al aterrizar
const TAU = Math.PI * 2;
/* ENDEREZARSE CUESTA TIEMPO, Y ESO ES LO QUE HACE QUE LA VOLTERETA SIGA
   SIENDO UNA APUESTA. Al soltar el dedo el cuerpo vuelve a la vuelta entera
   mas cercana a nueve radianes por segundo de ganancia, topado en `GIRO_V`:
   medio giro son 0,35 s de correccion y el vuelo llano dura 1,10, asi que
   soltar tarde o saltar despacio te deja llegando torcido igual.        */
const GIRO_ENDEREZA = 9.0;
const RIDER_ALTO = 1.85;

/* ── EL EMPUJE, Y SU TOPE ─────────────────────────────────────────────────
   Cada toque de la mano derecha suma velocidad SOBRE LA TANGENTE, que es
   donde vive la rapidez cuando el cuerpo esta apoyado: empujar con el pie
   contra la arena. En el aire no hace nada, y eso no es una omision — un
   empujon en el aire alargaria el vuelo a voluntad y el aterrizaje, que es
   la unica regla del juego, dejaria de ser una apuesta.

   EL TOPE ES EL LIMITE PEDIDO Y ESTA POR DEBAJO DE `V_MAX`: masheando no se
   llega a la velocidad que un aterrizaje bien clavado paga, asi que empujar
   no reemplaza jugar bien, lo adelanta. Y EL ENFRIAMIENTO EXISTE PORQUE UN
   DEDO NO ES UN RELOJ: sin el, un toque por cuadro son sesenta empujones por
   segundo y el tope se alcanza en un cuadro. A 0,085 s el ritmo util son
   once toques por segundo, que es lo que una mano da.
   Y SE GASTA SOLO, sin ningun temporizador: el roce del aire va con el
   CUADRADO de la velocidad, asi que a 33 m/s frena 2,7 veces mas que a 20 y
   la velocidad vuelve sola a crucero en un par de segundos. */
/* UN TOQUE NO ES UNA VOLTERETA, Y SIN ESTO LO ERA. El giro arrancaba en el
   primer cuadro del apriete: medido, sostener CUATRO pasos —67 ms, mas corto
   que un toque humano, que dura entre 60 y 120— ya deja el cuerpo 33 grados
   torcido contra una tolerancia de 36 y te tumba. O sea que la PRIMERA
   instruccion del tutorial —«toca para saltar»— te hacia caer.
   Nunca se habia notado porque hasta la vuelta 155 el salto era el UNICO
   boton y tocar y mantener eran el mismo gesto. Con la espera puesta, tocar
   es saltar y mantener es girar, que es lo que el juego dice que son.
   Y entra en el vuelo: 0,14 + 0,73 de vuelta son 0,87 contra 1,10 de aire. */
const GIRO_ESPERA = 0.14;
const TURBO_IMP = 1.70;     // lo que suma un toque, en m/s
const TURBO_TOPE = 33.0;    // el limite: por encima de crucero (20) y debajo de V_MAX (38)
const TURBO_CD = 0.085;     // un dedo no aprieta mas rapido que esto

/* ── LA CAIDA NO ES UNA MUERTE ────────────────────────────────────────────
   Un tumbo: el cuerpo se va al piso, pierde toda la velocidad y tarda en
   levantarse. Ese segundo largo mas los cuatro que cuesta volver a crucero
   es el castigo entero, y es mas caro de lo que parece en un juego donde la
   distancia sale de la velocidad. */
const TUMBO_T = 1.15;       // cuanto tarda en levantarse
const TUMBO_V = 4.5;        // con cuanta velocidad queda

/* ── LA PENDIENTE MEDIA ───────────────────────────────────────────────────
   El mundo BAJA con x: es una ladera infinita, como en Alto. Ese numero es
   el que hace que no haga falta un boton de acelerar — la gravedad empuja
   sola y el jugador solo administra saltos.                               */
const CAIDA = 0.175;

/* ── EL AZAR TIENE SEMILLA ────────────────────────────────────────────────
   Con `Math.random` la duna de los cuatrocientos metros seria otra en cada
   partida y no habria forma de auditar el terreno ni de que el auto-jugador
   pruebe lo mismo dos veces.                                              */
function azarDe(s) {

/* ── LOS TRAMOS ───────────────────────────────────────────────────────────

   el metro mil se vuelve otro juego de un cuadro al otro.                 */
function terrTramo() {

     jugador bueno recien esta entrando en calor: medido, el bot honesto llega
     a 11,7 km y la segunda mitad de esa partida era identica a la primera. Un
     juego que deja de apretar no se termina de dificultad, se termina de
     aburrimiento. */
  const dif = clamp(d / 6000, 0, 1);

    else if (r < 0.92) tipo = 'duna';

       esta mas alto de lo que se ve no es dificultad, es una trampa. */
    const ent = 22 + a() * 18;

       Con 2,9-4,2 y la ventana de agarre de +-1,5 m, la banda util va de 1,4
       a 5,7 y el apice mediano cae justo adentro. */
    const alt = 2.9 + a() * 1.3;
    CUERDAS.push({ x0: k0.x + 2, y0: k0.y + alt, x1: q.x - 3, y1: q.y + alt * 0.86, usada: false });
    const w2 = 30 + a() * 26;
    PC.push({ x: ancho(w2), y: q.y - w2 * CAIDA - 1 });
  }
}

/* las monedas van en ARCO y no en fila recta sobre el suelo: puestas en el
   piso se juntan sin hacer nada, y en arco marcan el vuelo que hay que
   hacer — o sea que ademas de pagar, ENSENAN donde esta el salto */
/* Y NO SE RESUELVEN AHORA: SE ANOTAN. El arco se ancla en la altura de UN
   punto de control y se estira `r` metros a los dos lados; pero entre dos
   puntos la curva de Hermite se pasa para arriba, asi que las monedas de las
   puntas —donde el seno vale cero— quedaban a `cy+1,3` sobre un terreno que
   ahi arriba estaba mas alto. Medido con la auditoria sobre veinticinco
   semillas: 367 monedas ENTERRADAS, o sea imposibles de juntar, y eso no
   falla ni avisa — se ve como monedas que no aparecen.
   No se puede arreglar preguntandole al terreno en este momento, porque el
   tramo de la derecha todavia no se empujo y `terrY` a esa x extrapola. Se
   anotan y se resuelven cuando el mundo paso de largo, que es exactamente lo
   que `terrGenera` ya sabe hacer.                                        */
function monedasArco(cx, cy, r, a, alto) {
  if (a() > 0.62) return;
  const n = 4 + ((a() * 4) | 0), h = (alto || 1) * (2.2 + a() * 2.4);
  MON_PEND.push({ cx, cy, r, n, h, hasta: cx + r * 0.5 + 8 });
}
function monedasResuelve(hasta) {
  while (MON_PEND.length && MON_PEND[0].hasta < hasta) {
    const q = MON_PEND.shift();
    for (let i = 0; i < q.n; i++) {
      const t = q.n === 1 ? 0.5 : i / (q.n - 1);
      const x = q.cx - q.r * 0.5 + q.r * t;
      /* el piso de cada moneda es EL TERRENO BAJO ELLA y no el del ancla: asi
         una moneda no puede quedar enterrada por construccion. Y sobre un
         hueco manda el ancla, que es lo que dibuja el arco del salto. */
      const suelo = hayPiso(x) ? terrY(x) : q.cy;
      /* el arco arranca casi al ras: las de las puntas se juntan pasando y las
         del medio piden volar. Todo el arco a cinco metros de altura seria una
         fila que no se junta nunca sin saltar a proposito, y entonces las
         monedas dejarian de ensenar donde esta el salto. */
      MONEDAS.push({ x, y: Math.max(q.cy, suelo) + 1.3 + q.h * Math.sin(Math.PI * t), ida: false });
    }
  }
}
/* 0 arbol · 1 roca · 2 arbusto · 3 poste · 4 cactus */
function decoEn(x, a) {
  const r = a();
  const t = r < 0.34 ? 0 : r < 0.58 ? 1 : r < 0.78 ? 2 : r < 0.90 ? 4 : 3;
  DECO.push({ x, t, e: 0.7 + a() * 0.75, f: a() * 6.283 });
}

/* ── LA EVALUACION ────────────────────────────────────────────────────────
   Hermite entre los dos puntos de control que rodean a x, con las tangentes
   sacadas por diferencias centradas —o sea Catmull-Rom no uniforme—. La
   derivada se devuelve ANALITICA y no por diferencia finita: la tangente es
   lo que orienta la tabla y lo que decide si un aterrizaje vale, asi que un
   error numerico ahi se siente como que el rider tiembla.                 */
function _seg(x) {
  if (_pcI < 1) _pcI = 1;
  while (_pcI < PC.length - 2 && PC[_pcI + 1].x < x) _pcI++;
  while (_pcI > 1 && PC[_pcI].x > x) _pcI--;
  return _pcI;
}
function terrY(x) {
  const i = _seg(x), p0 = PC[i - 1], p1 = PC[i], p2 = PC[i + 1], p3 = PC[Math.min(i + 2, PC.length - 1)];
  const h = p2.x - p1.x, t = clamp((x - p1.x) / h, 0, 1), t2 = t * t, t3 = t2 * t;
  const m1 = (p2.y - p0.y) / (p2.x - p0.x), m2 = (p3.y - p1.y) / (p3.x - p1.x || 1);
  return (2 * t3 - 3 * t2 + 1) * p1.y + (t3 - 2 * t2 + t) * h * m1
       + (-2 * t3 + 3 * t2) * p2.y + (t3 - t2) * h * m2;
}
function terrPend(x) {
  const i = _seg(x), p0 = PC[i - 1], p1 = PC[i], p2 = PC[i + 1], p3 = PC[Math.min(i + 2, PC.length - 1)];
  const h = p2.x - p1.x, t = clamp((x - p1.x) / h, 0, 1), t2 = t * t;
  const m1 = (p2.y - p0.y) / (p2.x - p0.x), m2 = (p3.y - p1.y) / (p3.x - p1.x || 1);
  return ((6 * t2 - 6 * t) * p1.y + (3 * t2 - 4 * t + 1) * h * m1
        + (-6 * t2 + 6 * t) * p2.y + (3 * t2 - 2 * t) * h * m2) / h;
}
/* la busqueda del hueco es lineal sobre los pocos que quedan cerca, no sobre
   la lista entera: se podan los que quedaron atras en cada paso */
function hayPiso(x) {
  for (let i = 0; i < HUECOS.length; i++) {
    const h = HUECOS[i];
    if (x > h.a && x < h.b) return false;
    if (h.a > x + 200) break;
  }
  return true;
}
function huecoEn(x) {
  for (let i = 0; i < HUECOS.length; i++) {
    const h = HUECOS[i];
    if (x > h.a - 1 && x < h.b + 1) return h;
    if (h.a > x + 200) break;
  }
  return null;
}
/* se genera hacia adelante y se poda hacia atras: sin la poda, una partida
   de seis mil metros deja veinte mil puntos de control vivos y las listas de
   monedas y adornos crecen sin techo */
let SIM = false;   // durante un rollout no se genera, no se poda y no se junta

/* GENERAR Y PODAR SON DOS COSAS Y NO UNA, y confundirlas costo la vuelta.
   El auto-jugador tiene que generar MUY por delante —sus rollouts vuelan
   doscientos pasos— y con una sola funcion eso se escribia terrAvanza(x+260),
   que ademas PODABA hasta (x+260)-140, o sea que borraba el mundo CIENTO
   VEINTE METROS POR DELANTE del rider: las monedas, las cuerdas y los huecos
   desaparecian antes de que llegara, y peor, se le sacaban puntos de control
   al terreno que estaba pisando. No falla ni avisa: se ve como que el juego
   no tiene monedas y como aterrizajes que se caen sin motivo.             */
function terrGenera(hasta) {
  if (SIM) return;
  while (TERR_X < hasta) terrTramo();
  /* el margen es un tramo entero: `terrY` necesita un punto de control DE CADA
     LADO del sitio que se le pregunta, y el ultimo empujado todavia no lo
     tiene */
  monedasResuelve(TERR_X - 90);
}
function terrAvanza(x) {
  if (SIM) return;
  terrGenera(x + 320);
  const lim = x - 140;
  while (PC.length > 6 && PC[3].x < lim) { PC.shift(); _pcI = Math.max(1, _pcI - 1); }
  while (HUECOS.length && HUECOS[0].b < lim) HUECOS.shift();
  while (CUERDAS.length && CUERDAS[0].x1 < lim) CUERDAS.shift();
  while (MONEDAS.length && MONEDAS[0].x < lim) MONEDAS.shift();
  while (DECO.length && DECO[0].x < lim) DECO.shift();
}
/* ══════════════════════════════════════════════════════════════════════════
   LA FISICA DEL RIDER
   ──────────────────────────────────────────────────────────────────────────
   TAMPOCO TOCA EL DOM NI EL LIENZO: entra en node junto con el terreno, asi
   que el auto-jugador puede correr cien partidas en un segundo sin abrir un
   navegador. Es la unica forma de saber si el mapa se puede recorrer.

   EL RIDER TIENE TRES ESTADOS Y UNO SOLO SE PARECE A UN JUEGO DE PLATAFORMA:
     · SUELO   — la velocidad vive SOBRE LA TANGENTE, no en x e y por
                 separado. Con componentes sueltas, bajar una duna empinada
                 haria que el cuerpo se despegara en cada cambio de pendiente.
     · AIRE    — parabola, y el dedo gira el cuerpo.
     · CUERDA  — pegado a un segmento, con su propia pendiente.
   ══════════════════════════════════════════════════════════════════════════ */

const R = {
  x: 0, y: 0, vx: 0, vy: 0, s: 0,      // `s` es la rapidez sobre la tangente
  suelo: true, ang: 0, rot: 0, giro: 0,
  /* DECLARADO ACA Y NO CREADO AL VUELO: `_EST` sale de `Object.keys(R)`, asi
     que un campo que nace en medio de un cuadro no lo guarda ni lo restaura
     el rollout — y entonces el bot planifica volteretas sobre un estado de
     giro que no es el suyo. */
  girAp: 0,
  cuerda: null, cu: 0,
  vivo: true, muerte: '',
  /* `caido` es lo que reemplaza a la muerte: cuanto le falta para levantarse.
     Mientras corre, el dedo no hace nada y el cuerpo se arrastra hasta parar. */
  caido: 0, caidas: 0,
  // el empuje de la mano de empujar
  turboCd: 0, turbo: 0, empujes: 0,
  // los cuadros de gracia
  coyote: 0, buffer: 0,
  // lo que la partida cuenta
  dist: 0, mons: 0, flips: 0, grinds: 0, trucos: 0,
  combo: 0, comboMax: 0, comboT: 0, saltoMax: 0,
  // el vuelo en curso
  vueloX: 0, vueloY: 0, aire: 0,
  // lo que se le muestra al jugador
  ultTruco: '', ultTrucoT: 0, sacude: 0, polvo: 0,
};
let APRETADO = false, SALTOS = 0;
const COMBO_VENT = 2.6;   // segundos para encadenar

function riderReinicia() {
  R.x = 0; R.y = terrY(0); R.s = 13; R.vx = 13; R.vy = 0;
  R.suelo = true; R.ang = Math.atan(terrPend(0)); R.rot = 0; R.giro = 0;
  R.cuerda = null; R.cu = 0; R.vivo = true; R.muerte = '';
  R.caido = 0; R.caidas = 0; R.turboCd = 0; R.turbo = 0; R.empujes = 0;
  R.coyote = 0; R.buffer = 0;
  R.dist = 0; R.mons = 0; R.flips = 0; R.grinds = 0; R.trucos = 0;
  R.combo = 0; R.comboMax = 0; R.comboT = 0; R.saltoMax = 0;
  R.vueloX = 0; R.vueloY = 0; R.aire = 0;
  R.ultTruco = ''; R.ultTrucoT = 0; R.sacude = 0; R.polvo = 0;
  SALTOS = 0;
}

/* el angulo mas corto entre dos rumbos: sin esto, cruzar de +179 a -179 grados
   se lee como media vuelta y un aterrizaje perfecto cuenta como caida */
function angDif(a, b) {
  let d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
/* Y EL RESORTE VA POR EL CAMINO CORTO, que no es lo mismo que interpolar los
   dos numeros. Con `mezcla(6.27, -0.20, k)` —los dos son casi el mismo rumbo,
   uno escrito como 2pi— el cuerpo daba UNA VUELTA ENTERA hacia atras apoyado
   en el suelo, en ocho cuadros. Medido: las once muertes por angulo que le
   quedaban al bot honesto en ocho minutos eran todas eso — aterrizaba bien,
   giraba solo, y se caia al hueco siguiente con el cuerpo a media vuelta. */
function angHacia(a, b, k) { return a - angDif(a, b) * k; }

function truco(k, n) {
  if (SIM) return;
  R.combo++; R.comboT = COMBO_VENT; R.trucos++;
  if (R.combo > R.comboMax) R.comboMax = R.combo;
  R.ultTruco = R.combo > 1 ? T('combo', R.combo) + '\n' + k : k;
  R.ultTrucoT = 1.5;
  if (typeof son === 'function') son(n || 'truco');
}

function riderPaso(dt) {
  if (!R.vivo) return;

  R.comboT -= dt;
  if (R.comboT <= 0) R.combo = 0;
  R.ultTrucoT -= dt;
  R.sacude *= Math.pow(0.0016, dt);
  if (R.buffer > 0) R.buffer -= dt;
  if (R.coyote > 0) R.coyote -= dt;
  if (R.turboCd > 0) R.turboCd -= dt;
  if (R.turbo > 0) R.turbo = Math.max(0, R.turbo - dt * 1.8);

  /* ── EL TUMBO ───────────────────────────────────────────────────────────
     El cuerpo se arrastra hasta parar y despues se levanta. NO SE ARRASTRA
     DENTRO DE UN HUECO: la caida ya lo dejo del lado de enfrente, y dejarlo
     resbalar hasta el borde siguiente lo tiraria otra vez sin que el jugador
     haya podido hacer nada — un castigo que se encadena solo no es un
     castigo, es un cuelgue. */
  if (R.caido > 0) {
    R.caido -= dt;
    R.buffer = 0; R.turbo = 0;
    R.s = Math.max(0, R.s - 14 * dt);
    const m = terrPend(R.x), k = 1 / Math.sqrt(1 + m * m);
    const nx = R.x + R.s * k * dt;
    if (hayPiso(nx)) R.x = nx; else R.s = 0;
    R.y = terrY(R.x); R.suelo = true;
    R.ang = angHacia(R.ang, Math.atan(m), 1 - Math.pow(0.0000001, dt));
    R.vx = R.s * k; R.vy = R.s * m * k;
    R.polvo = clamp(R.s / 26, 0, 1);
    R.dist = Math.max(R.dist, R.x);
    terrAvanza(R.x); juntaMonedas();
    if (R.caido <= 0) { R.caido = 0; R.s = V_MIN; }   // se levanta y vuelve a empujar
    return;
  }

  if (R.cuerda) { pasoCuerda(dt); return; }
  if (R.suelo) pasoSuelo(dt); else pasoAire(dt);

  R.dist = Math.max(R.dist, R.x);
  terrAvanza(R.x);
  juntaMonedas();
  buscaCuerda();
}

/* ── SUELO ────────────────────────────────────────────────────────────────
   La rapidez vive sobre la tangente y de ahi salen vx y vy: asi el cuerpo no
   se despega en cada cambio de pendiente y la tabla siempre esta apoyada. */
function pasoSuelo(dt) {
  const m = terrPend(R.x), k = 1 / Math.sqrt(1 + m * m);
  const cos = k, sin = m * k;                     // seno con signo: negativo bajando
  R.s += (-G * sin - ROCE * G * cos - AIRE * R.s * Math.abs(R.s)) * dt;
  if (R.s < V_MIN) R.s = mezcla(R.s, V_MIN, 1 - Math.pow(0.08, dt));
  if (R.s > V_MAX) R.s = V_MAX;

  R.x += R.s * k * dt;
  R.y = terrY(R.x);
  R.vx = R.s * k; R.vy = R.s * m * k;
  /* el cuerpo sigue la tangente con un resorte y no de un salto: copiandola
     exacto, un cambio de pendiente rota el rider en un cuadro y se lee a
     tiron. Y es rapido —28— porque un rider apoyado NO puede quedar torcido */
  R.ang = angHacia(R.ang, Math.atan(m), 1 - Math.pow(0.0000001, dt));
  R.giro = 0; R.rot = 0; R.girAp = 0;
  R.polvo = clamp((R.s - 9) / 18, 0, 1);
  R.coyote = COYOTE;

  if (!hayPiso(R.x)) { R.suelo = false; R.vueloX = R.x; R.vueloY = R.y; R.aire = 0; return; }
  if (R.buffer > 0) { salta(); }
}

function salta() {
  R.buffer = 0; R.coyote = 0; R.suelo = false;
  R.vy = R.s * terrPend(R.x) / Math.sqrt(1 + terrPend(R.x) ** 2) + SALTO;
  R.vueloX = R.x; R.vueloY = R.y; R.aire = 0;
  SALTOS++;
  if (typeof son === 'function') son('salta');
}

/* ── AIRE ─────────────────────────────────────────────────────────────────
   El dedo gira el cuerpo hacia atras. La voltereta NO es un boton aparte y
   no puede serlo: hay uno solo, y lo que lo distingue de saltar es que el
   salto es el FLANCO y el giro es el SOSTENIDO.                           */
function pasoAire(dt) {
  R.vy -= G * dt;
  R.vx -= AIRE * R.vx * Math.abs(R.vx) * dt;
  R.x += R.vx * dt; R.y += R.vy * dt;
  R.aire += dt;
  R.polvo = 0;

  /* LA INERCIA DEL GIRO ES DE CINCUENTA MILISEGUNDOS Y NO DE CIENTO SETENTA,
     y el numero salio de una medicion. Con la cola larga, soltar el dedo
     dejaba el cuerpo girando 1,6 rad de mas: medido, el auto-jugador cerraba
     CERO volteretas en 25 semillas porque ninguna duracion de apriete daba un
     angulo dentro de la tolerancia. Y no es un problema del bot: un jugador
     tendria que anticipar la misma cola. Con τ=0,05 el arranque y el frenado
     casi se cancelan y "soltar cuando cerraste la vuelta" pasa a ser cierto. */
  /* la espera cuenta EN EL AIRE: este renglon solo corre en la rama de vuelo,
     asi que sostener el dedo en el suelo no adelanta nada */
  R.girAp = APRETADO ? R.girAp + dt : 0;
  const gira = APRETADO && R.girAp > GIRO_ESPERA;

  /* ── SOLTAR ES ENDEREZARSE, Y ESTO ES LO QUE SACA EL TUMBO FANTASMA ────
     Antes, soltar el dedo dejaba el giro CONGELADO donde estaba, y como el
     aterrizaje compara el angulo contra la tangente, cualquier apriete de
     entre 0,20 y 0,73 s terminaba en un tumbo que el jugador no habia
     pedido: medido antes de esto, sostener 12, 14, 16, 18, 20, 24, 30, 40 y
     60 pasos daba UNA CAIDA Y CERO VOLTERETAS en los nueve casos. O sea que
     habia medio segundo de apriete —justo el que hace cualquiera que mira su
     propio salto antes de soltar— donde perder era obligatorio. Reportado
     textual: «no me caigo y aun asi sigue diciendo que me cai».

     Lo que se arregla no es la tolerancia sino QUE SIGNIFICA SOLTAR: soltar
     es abortar. El cuerpo vuelve a la vuelta entera MAS CERCANA —a cero si
     no llego a media vuelta, y a la vuelta completa si la paso— con una
     ganancia proporcional topada en `GIRO_V`.

     Y NO REGALA LA VOLTERETA, que es lo que habria que pagar por esto:
     enderezarse CUESTA TIEMPO y el tiempo es aire. Media vuelta de
     correccion son 0,35 s sobre 1,10 de vuelo llano, asi que soltar tarde o
     saltar despacio —donde el vuelo es mas corto— sigue terminando en el
     piso torcido. La apuesta pasa de «clavar el instante» a «tener aire»,
     que es exactamente lo que hace el genero. */
  let objRot = GIRO_V;
  if (!gira) {
    const meta = Math.round(R.giro / TAU) * TAU;
    objRot = clamp((meta - R.giro) * GIRO_ENDEREZA, -GIRO_V, GIRO_V);
  }
  R.rot = mezcla(R.rot, objRot, 1 - Math.pow(1e-9, dt));
  R.ang += R.rot * dt; R.giro += R.rot * dt;
  /* y se clava al llegar: sin el corte, la ganancia deja un resto que nunca
     baja de cero y `giro` no vuelve a ser un numero de vueltas exacto */
  if (!gira) {
    const meta = Math.round(R.giro / TAU) * TAU, d = meta - R.giro;
    if (Math.abs(d) < 0.015) { R.ang += d; R.giro = meta; R.rot = 0; }
  }

  const py = terrY(R.x);
  if (R.y <= py) {
    if (!hayPiso(R.x)) { const h = huecoEn(R.x); if (h && R.y < h.y0 - 2.5) return cae('hueco'); return; }
    aterriza(py);
  }
  if (R.y < terrY(R.x) - 60) cae('hueco');
}

/* ── EL ATERRIZAJE ES LA UNICA COSA QUE SE PUEDE HACER MAL ────────────────
   Y por eso es donde vive toda la dificultad del juego. Lo que se compara no
   es la altura ni la velocidad: es el ANGULO del cuerpo contra la tangente
   del terreno. Derecho, se gana velocidad; de cabeza, se cae.
   LA TOLERANCIA ES GENEROSA a proposito (0,62 rad = 36 grados): lo que tiene
   que costar es cerrar la vuelta a tiempo, no clavar el grado.            */
function aterriza(py) {
  const m = terrPend(R.x), at = Math.atan(m), d = Math.abs(angDif(R.ang, at));
  const vueltas = Math.round(Math.abs(R.giro) / (Math.PI * 2));
  R.saltoMax = Math.max(R.saltoMax, R.x - R.vueloX);

  if (d > GIRO_TOL) return cae('angulo');

  R.y = py; R.suelo = true;
  /* y se normaliza al aterrizar: sin esto `ang` crece sin techo vuelta tras
     vuelta y termina perdiendo precision donde se compara con la tangente */
  R.ang = angDif(R.ang, 0);
  /* la rapidez que queda es la PROYECCION sobre la tangente: cayendo de una
     duna alta, la componente vertical se convierte en velocidad, que es
     exactamente lo que hace que un salto bien aterrizado se sienta rapido */
  const k = 1 / Math.sqrt(1 + m * m);
  R.s = Math.max(V_MIN, (R.vx + R.vy * m) * k);
  if (vueltas > 0) {
    R.flips += vueltas;
    R.s = Math.min(V_MAX, R.s + 1.9 + 1.5 * vueltas);
    truco(T('t' + Math.min(4, vueltas)), 'flip');
  } else if (R.x - R.vueloX > 15) {
    R.s = Math.min(V_MAX, R.s + 1.0);
    truco(T('salto'), 'flip');
  } else if (d > GIRO_TOL * 0.72) {
    R.ultTruco = T('casi'); R.ultTrucoT = 1.1;
  }
  R.giro = 0; R.rot = 0; R.girAp = 0; R.aire = 0;
  R.sacude = Math.min(1, Math.abs(R.vy) / 22);
  if (typeof son === 'function') son('cae');
}

/* ── CAERSE CUESTA LA VELOCIDAD, NO LA BAJADA ─────────────────────────────
   Esto era `muere()` y terminaba la partida. Lo que cobra ahora es lo unico
   que este juego administra: el cuerpo queda en el piso un segundo largo y
   se levanta a paso de hombre, o sea que un error vale los cuatro o cinco
   segundos que cuesta volver a crucero. En una bajada que no termina, ese
   tiempo ES el puntaje.

   Y SE SALE POR EL BORDE DE ENFRENTE DEL HUECO y no por el de atras: el
   salto ya se erro, y devolverlo al borde de entrada lo dejaria mirando el
   mismo hueco con la velocidad en cero — o sea sin forma de cruzarlo nunca.
   `R.dist` es un maximo, asi que el hueco no se cobra dos veces.        */
function cae(por) {
  if (R.caido > 0 || !R.vivo) return;
  R.muerte = por; R.caido = TUMBO_T;
  R.combo = 0; R.comboT = 0;
  R.cuerda = null; R.giro = 0; R.rot = 0; R.girAp = 0; R.buffer = 0; R.coyote = 0;
  const h = huecoEn(R.x);
  if (h) R.x = h.b + 1.6;
  R.y = terrY(R.x); R.suelo = true; R.ang = Math.atan(terrPend(R.x));
  R.s = TUMBO_V; R.vx = 0; R.vy = 0; R.turbo = 0; R.turboCd = 0;
  if (SIM) return;                 // en un rollout no se cuenta ni suena
  R.caidas++; R.sacude = 1;
  R.ultTruco = T('tumbo'); R.ultTrucoT = 1.4;
  if (typeof son === 'function') son('choque');
}

/* ── LA CUERDA ────────────────────────────────────────────────────────────
   Se agarra sola si el dedo esta apretado y el cuerpo pasa cerca: pedir un
   segundo gesto sobre un solo boton no se puede, y pedir punteria fina sobre
   una linea de dos pixeles tampoco. Lo que decide es el TIEMPO —estar
   apretando justo al cruzarla— que es lo mismo que decide todo lo demas. */
function buscaCuerda() {
  if (R.cuerda || !APRETADO || R.suelo) return;
  for (let i = 0; i < CUERDAS.length; i++) {
    const c = CUERDAS[i];
    if (R.x < c.x0 || R.x > c.x1) continue;
    const t = (R.x - c.x0) / (c.x1 - c.x0), cy = mezcla(c.y0, c.y1, t);
    if (Math.abs(R.y - cy) < 1.5 && R.vy < 4) {
      /* Y PIDE EL CUERPO DERECHO, IGUAL QUE EL PISO. Sin esto, el sostenido
         que gira y el sostenido que engancha son el mismo gesto en el mismo
         instante: medido, el bot se colgaba A MITAD DE VOLTERETA, salia de la
         cuerda con el giro a medio acumular y se mataba dos segundos despues
         por un angulo que nunca habia elegido. Aparte, nadie se cuelga de
         cabeza. */
      if (Math.abs(angDif(R.ang, Math.atan((c.y1 - c.y0) / (c.x1 - c.x0)))) > GIRO_TOL) continue;
      R.cuerda = c; R.cu = t; R.y = cy;
      /* el cuerpo queda alineado con la cuerda, asi que la vuelta a medias que
         traia NO se cobra: dejar `giro` puesto hace que el aterrizaje de dos
         segundos despues cuente vueltas que no se hicieron */
      R.giro = 0; R.rot = 0; R.girAp = 0;
      R.s = Math.max(R.s, Math.hypot(R.vx, R.vy));
      if (!c.usada && !SIM) { c.usada = true; R.grinds++; truco(T('grind'), 'grind'); }
      if (typeof son === 'function') son('grind');
      return;
    }
  }
}
function pasoCuerda(dt) {
  const c = R.cuerda, dx = c.x1 - c.x0, dy = c.y1 - c.y0;
  const L = Math.hypot(dx, dy), m = dy / dx, k = dx / L;
  R.s += (-G * (dy / L) - 0.010 * G * (dx / L)) * dt;   // la cuerda casi no roza
  R.s = clamp(R.s, V_MIN, V_MAX);
  R.x += R.s * k * dt;
  R.cu = (R.x - c.x0) / dx;
  R.y = mezcla(c.y0, c.y1, R.cu);
  R.vx = R.s * k; R.vy = R.s * m * k;
  R.ang = angHacia(R.ang, Math.atan(m), 1 - Math.pow(0.0000001, dt));
  R.polvo = 0;
  R.dist = Math.max(R.dist, R.x);
  terrAvanza(R.x); juntaMonedas();
  /* se suelta al llegar al final O al soltar el dedo: sin lo segundo, la
     cuerda seria una cinta transportadora y no una decision */
  if (R.cu >= 1 || !APRETADO) {
    R.cuerda = null; R.suelo = false; R.vueloX = R.x; R.vueloY = R.y; R.aire = 0;
    R.giro = 0; R.rot = 0; R.girAp = 0;   // sale alineado con la cuerda: el giro arranca de cero
  }
}

/* el radio es generoso —1,5 m contra un rider de 1,85— porque lo que tiene
   que costar es pasar por el arco, no rozar el pixel */
function juntaMonedas() {
  if (SIM) return;
  for (let i = 0; i < MONEDAS.length; i++) {
    const c = MONEDAS[i];
    if (c.ida) continue;
    if (c.x > R.x + 3) break;
    if (Math.abs(c.x - R.x) < 1.5 && Math.abs(c.y - (R.y + 0.9)) < 1.7) {
      c.ida = true; R.mons++;
      if (typeof son === 'function') son('mon');
    }
  }
}

/* ── LA ENTRADA ES UN FLANCO Y UN SOSTENIDO, Y PASA POR UN SOLO SITIO ─────
   Con la logica del boton repartida en el manejador del dedo, del teclado y
   del auto-jugador, el dia que se agregue un gesto dos de los tres se quedan
   sin el — y el que se olvida es siempre el que nadie prueba. Paso en RECREO
   con el salto del avion, que con teclado no existia.                     */
function pulsa(v) {
  if (v && !APRETADO && R.caido <= 0) {
    if (R.suelo || R.coyote > 0) { R.buffer = BUFFER; if (R.suelo) salta(); }
    else R.buffer = BUFFER;
  }
  APRETADO = v;
}

/* ── LA MANO DERECHA: UN TOQUE, UN EMPUJON ────────────────────────────────
   Y NO ES UN SOSTENIDO. Con el dedo apoyado la velocidad subiria sola hasta
   el tope y quedarse ahi seria gratis; con toques sueltos hay que gastar la
   mano, y sobre todo hay que decidir CUANDO —empujar entrando a una duna no
   es lo mismo que empujar antes de un hueco—.
   SOLO CON EL CUERPO APOYADO: `R.s` es la rapidez sobre la tangente, o sea
   que en el aire ni siquiera existe. Empujar volando alargaria el vuelo a
   voluntad y el aterrizaje dejaria de ser una apuesta.
   Devuelve si el empujon SUMO velocidad, que no es lo mismo que si se acepto
   el toque: en el tope el toque vale —la barra avisa— y no suma nada.   */
function turbo() {
  if (!R.vivo || R.caido > 0 || R.turboCd > 0) return false;
  if (!R.suelo && !R.cuerda) return false;
  R.turboCd = TURBO_CD;
  R.turbo = 1;
  if (R.s >= TURBO_TOPE) return false;
  R.s = Math.min(R.s + TURBO_IMP, TURBO_TOPE);
  R.empujes++;
  if (!SIM && typeof son === 'function') son('empuja');
  return true;
}

/* ══════════════════════════════════════════════════════════════════════════
   EL AUTO-JUGADOR
   ──────────────────────────────────────────────────────────────────────────
   Existe por tres razones y ninguna es la comodidad: AUDITA el terreno —un
   mapa generado y no jugado es un mapa roto que todavia no se sabe—, corre
   DETRAS DEL MENU para que la portada muestre el juego, y es el control
   contra el que se mide si hay una decision adentro. El que aprieta al azar
   tiene que sacar mucho menos; si empatan, el juego no pide nada.

   Y APRIETA EL MISMO BOTON QUE EL DEDO: entra por `pulsa()`. Escribiendo el
   estado del rider directo estaria jugando OTRO juego, y que lo termine no
   probaria nada del que se juega.
   ══════════════════════════════════════════════════════════════════════════ */
/* SE GUARDA EL ESTADO ENTERO Y NO UNOS CAMPOS ELEGIDOS. Con una lista corta
   el rollout dejaba `flips`, `saltoMax` y `mons` contaminados —el marcador
   subia por partidas imaginarias— y eso no falla: informa numeros de mas. */
const _EST = Object.keys(R).filter(k => k !== 'cuerda');
function _guarda() { const o = { _cu: R.cuerda, _ap: APRETADO }; for (const k of _EST) o[k] = R[k]; return o; }
function _pone(o) { R.cuerda = o._cu; APRETADO = o._ap; for (const k of _EST) R[k] = o[k]; }

/* simula `n` pasos con el dedo puesto en `ap` (o siguiendo un plan) y
   devuelve si sobrevivio y cuanto avanzo. NO genera terreno: hay que haberlo
   generado antes, o el rollout consumiria numeros del azar y el mundo de
   verdad saldria distinto. Es el defecto silencioso de cualquier rollout
   sobre un mundo procedural.                                              */
function _rollout(n, ap, hastaElFinal, emp) {
  const g = _guarda(); SIM = true;
  /* EL CORTE ES "TOCO EL SUELO DESPUES DE HABER VOLADO", no "esta en el
     suelo". Con la segunda version, un rollout lanzado DESDE el suelo —que es
     el que mira si viene un hueco— cortaba en el tercer cuadro y devolvia
     `vivo:true` mirando cinco centimetros por delante: el bot no veia un solo
     hueco. Medido, seis de veinticinco muertes eran eso. */
  let vivo = true, i = 0, volo = !R.suelo, colgo = false;
  for (; i < n; i++) {
    pulsa(typeof ap === 'function' ? ap(i * PASO) : ap);
    if (emp) turbo();
    riderPaso(PASO);
    /* LO QUE CORTA UN ROLLOUT AHORA ES EL TUMBO Y NO LA MUERTE, porque ya no
       hay muerte: sin esta linea el bot no ve un solo error y toda la
       validacion del terreno aprueba cualquier cosa. */
    if (R.caido > 0) { vivo = false; break; }
    if (R.cuerda) colgo = true;
    if (!R.suelo) volo = true;
    else if (volo && i > 2 && !hastaElFinal) break;
  }
  const dx = R.x - g.x, sue = R.suelo, sal = R.s;
  SIM = false; _pone(g);
  return { vivo, dx, pasos: i, suelo: sue, s: sal, cuerda: colgo };
}

/* TRES BOTS Y NO UNO, y cada uno contesta una pregunta distinta.
   El honesto vuela doscientos pasos y prueba veinticinco duraciones por
   vuelo: es infinitamente mejor que una persona, asi que si el se muere es
   que el mapa puso algo imposible —eso es lo que valida el generador— pero
   que llegue al tope no dice nada sobre cuanto dura una partida de verdad.
   El TORPE mira lo que entra en la pantalla (65 pasos ≈ 32 m, que es lo que
   el encuadre muestra por delante), reacciona cada 0,12 s y prueba UNA
   duracion por vuelta en vez de cinco. Ese es el que mide los minutos.
   Y EL TERCERO APRIETA AL AZAR, que es el unico control honesto que hay: los
   otros dos SIMULAN EL FUTURO —vuelan doscientos pasos antes de decidir— asi
   que aunque uno mire menos lejos que el otro, los dos son mejores que
   cualquier persona. Que el torpe llegue al tope no prueba que el juego sea
   facil; lo unico que prueba que hay una decision adentro es que el que no
   decide nada saque mucho menos. Sostiene el boton tandas de duracion al azar
   y no lo toca cuadro por cuadro: apretar y soltar a sesenta hercios es un
   promedio, no un jugador, y encima no llegaria a completar una sola vuelta. */
/* Y LOS TRES APRIETAN LAS DOS ZONAS, no una. Desde que una mitad empuja, un
   bot que solo salta esta jugando OTRO juego: mediria un mundo donde la
   velocidad no se administra, o sea justo la decision que se agrego. Es la
   misma regla que ya vale para el salto — el bot entra por `pulsa()` y por
   `turbo()`, las mismas dos funciones que el dedo.                        */
const BOT = { plan: null, planT: 0, cd: 0, torpe: false, azar: false, react: 0, ap: false,
              emp: false, empT: 0 };
function botReinicia(modo) {
  BOT.plan = null; BOT.planT = 0; BOT.cd = 0; BOT.react = 0; BOT.ap = false;
  BOT.emp = false; BOT.empT = 0;
  BOT.azar = modo === 'azar';
  BOT.torpe = !BOT.azar && !!modo;
}

/* ── CUANDO EMPUJAR ───────────────────────────────────────────────────────
   El honesto NO empuja siempre, y esa es la decision: mas velocidad es mas
   alcance de salto y menos tiempo para reaccionar, asi que empujar contra un
   hueco ancho es bueno y empujar contra una cresta con un hueco corto detras
   te manda de cabeza. Se decide con el MISMO rollout que decide el salto, con
   `emp` puesto: si volar cien pasos empujando sobrevive, se empuja.
   Y SE PREGUNTA CADA 0,2 s Y NO POR CUADRO: un rollout de cien pasos por
   cuadro son seis mil pasos de fisica por segundo de mas, y la respuesta no
   cambia en dieciseis milesimas.
   El torpe empuja a su cadencia de reaccion sin mirar nada —que es lo que
   hace alguien que quiere ir rapido— y el del azar, al azar.              */
function botEmpuja(dt) {
  if (!R.vivo || R.caido > 0) return false;
  if (BOT.azar) return Math.random() < 0.30;
  if (BOT.torpe) return true;
  BOT.empT -= dt;
  if (BOT.empT > 0) return BOT.emp;
  BOT.empT = 0.20;
  if (R.s >= TURBO_TOPE - 0.05) { BOT.emp = false; return false; }
  const r = _rollout(110, false, true, true);
  BOT.emp = r.vivo;
  return BOT.emp;
}

/* EL PLAN SE DECIDE AL DESPEGAR Y NO EN CADA CUADRO: cuantas vueltas entran
   en el vuelo es una propiedad del vuelo entero, no del instante. Decidido
   cuadro a cuadro, el bot suelta y vuelve a apretar y las vueltas no cierran
   nunca — que es exactamente lo que le pasa a alguien que duda.           */
function botPiensa(dt) {
  if (!R.vivo) return false;
  if (BOT.azar) {
    terrGenera(R.x + 420);
    BOT.react -= dt;
    if (BOT.react <= 0) { BOT.react = 0.12 + Math.random() * 0.55; BOT.ap = Math.random() < 0.38; }
    return BOT.ap;
  }
  terrGenera(R.x + 420);   // GENERA, no poda: podar contra este numero borraria el mundo de adelante          // el rollout necesita el mundo ya generado
  if (R.cuerda) { BOT.plan = null; return true; }   // colgado: no soltar hasta el final

  if (!R.suelo) {
    if (BOT.plan === null) {
      /* de mas vueltas a menos: se queda con la mayor que sobreviva */
      /* TRES DURACIONES POR VUELTA Y NO UNA. El angulo que se acumula no es
         `GIRO_V·dur` exacto —hay arranque y hay cola— asi que la formula da
         una estimacion y el rollout es el que decide. Probando una sola, un
         error de cinco centesimas tira la vuelta entera. */
      const VAR = BOT.torpe ? [0] : [0, -0.055, 0.055, -0.11, 0.11];
      for (let k = BOT.torpe ? 2 : 4; k >= 0 && BOT.plan === null; k--) {
        /* + LA ESPERA: sin sumarla la estimacion queda 0,14 s corta y las
           variantes (±0,11) no la alcanzan — el bot cerraria CERO vueltas */
        const d0 = k === 0 ? 0 : GIRO_ESPERA + (k * Math.PI * 2) / GIRO_V;
        for (const e of VAR) {
          const dur = Math.max(0, d0 + e);
          const r = _rollout(200, t => t < dur);
          if (r.vivo && r.suelo) { BOT.plan = dur; break; }
        }
      }
      if (BOT.plan === null) BOT.plan = 0;
      BOT.planT = 0;
    }
    /* SE COMPARA Y DESPUES SE SUMA, no al reves. El rollout aprieta en
       i*PASO con i desde CERO; sumando primero, la linea real evaluaba el
       cuadro de la decision como t=dt y apretaba UN PASO MENOS. Un paso son
       0,14 rad y la tolerancia son 0,62: medido, cuatro de las cinco muertes
       que le quedaban al bot eran esa unica diferencia — el rollout aprobaba
       una duracion que la realidad no ejecutaba. Un plan validado por una
       simulacion que no aprieta en los mismos cuadros no esta validado. */
    const ap = BOT.planT < BOT.plan;
    BOT.planT += dt;
    return ap;
  }

  BOT.plan = null;
  /* EN EL SUELO SE SALTA LO MAS TARDE POSIBLE QUE TODAVIA FUNCIONE, que es
     lo que hace un humano: si esperando un cuadro mas se sigue vivo, se
     espera. Con "salto apenas veo el hueco" el despegue sale temprano y se
     cae del otro lado — el mismo defecto que en DASH costo los huecos. */
  BOT.cd -= dt;
  if (BOT.cd > 0) return false;
  /* el torpe no piensa todos los cuadros: 0,12 s es un tiempo de reaccion */
  if (BOT.torpe) { BOT.react -= dt; if (BOT.react > 0) return false; BOT.react = 0.12; }
  /* Y ESTE NO CORTA AL ATERRIZAR. El corte de arriba responde "sobrevivo a
     ESTE aterrizaje", que es la pregunta del que ya esta en el aire; el que
     esta en el suelo pregunta otra cosa —"viene algo"— y con el corte puesto
     su horizonte terminaba en la primera duna que lo despegara: medido,
     cuatro de veinticinco muertes eran un hueco que quedaba justo detras de
     una cresta. */
  /* el horizonte del torpe es LO QUE LA CAMARA MUESTRA, en pasos: lo que ve
     por delante dividido por lo que avanza en un paso */
  const hor = BOT.torpe
    ? Math.round((VISTA_ANCHO * (1 - RIDER_X) + CAM_ADEL * R.s) / Math.max(R.s * PASO, 0.01))
    : 150;
  const sinSaltar = _rollout(Math.min(hor, 150), false, true);
  if (!sinSaltar.vivo) {
    const saltando = _rollout(200, t => t < 0.05, true);
    if (saltando.vivo) { BOT.cd = 0.14; return true; }
    return false;                  // no hay salto que salve: se cae, y esta bien que se sepa
  }
  /* LA CUERDA HAY QUE IR A BUSCARLA, y esta rama no es para que el bot luzca:
     es lo unico que COMPRUEBA que una cuerda se puede alcanzar. Un mecanismo
     que el generador siembra y que ninguna prueba engancha es un mecanismo que
     nadie sabe si existe. Va antes que la del truco porque colgarse tambien
     paga y encima cruza el tramo entero. */
  for (let i = 0; i < CUERDAS.length; i++) {
    const c = CUERDAS[i];
    if (c.usada || c.x0 < R.x + 4) continue;
    if (c.x0 > R.x + 90) break;
    const r = _rollout(200, t => t < 0.05, true);
    if (r.cuerda && r.vivo) { BOT.cd = 0.14; return true; }
    break;                         // solo se mira la proxima: la de mas alla ya se vera
  }

  /* SOBREVIVIR NO ALCANZA: un bot que solo esquiva huecos se ve como una
     bola rodando, y el menu lo muestra. Cada tanto prueba si saltando entra
     una voltereta —o sea si el vuelo dura mas que una vuelta— y si entra y
     sobrevive, salta. Eso es lo que hace un jugador: saltar por gusto. */
  BOT.cd = 0.30;
  const pr = _rollout(200, t => t < 0.05);
  if (!pr.vivo || pr.pasos * PASO < (Math.PI * 2) / GIRO_V + GIRO_ESPERA) return false;
  return true;
}
/* ══════════════════════════════════════════════════════════════════════════
   EL LIENZO, EL MARCO Y LA CAMARA
   ══════════════════════════════════════════════════════════════════════════ */
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d', { alpha: false });
const marco = document.getElementById('marco');
let ANCHO = 0, ALTO = 0, ESC = 1, VISTA_ALTO = 0, PXR = 1;

/* ── EL MARCO SE GIRA, NO SE ENCOGE ───────────────────────────────────────
   Y la relacion no es 16:9 fija: se toma el lado largo contra el corto de la
   pantalla que haya, topada en 2,2. Con una relacion clavada, un telefono muy
   alargado deja dos franjas negras y uno cuadrado recorta el juego.       */
function ajustaMarco() {
  const W = window.innerWidth, H = window.innerHeight;
  const largo = Math.max(W, H), corto = Math.min(W, H);
  const rel = clamp(largo / corto, 1.35, 2.30);
  const girar = H > W;
  const mw = girar ? corto * rel : W, mh = girar ? corto : H;
  const a = Math.min(girar ? H : W, mw), b = a / rel;
  marco.style.width = a + 'px'; marco.style.height = b + 'px';
  marco.style.transform = 'translate(-50%,-50%)' + (girar ? ' rotate(90deg)' : '');
  document.documentElement.style.setProperty('--mh', b + 'px');
  document.documentElement.style.setProperty('--mw', a + 'px');

  /* LA RESOLUCION SE TOPA EN 2. Un teléfono de densidad 3 pide 2,25 veces mas
     pixeles que uno de 2 para dibujar siluetas planas sin un solo detalle
     fino: es relleno regalado. Ya costo la mitad de los cuadros en MAICOL. */
  PXR = Math.min(window.devicePixelRatio || 1, 2) * CAL_PX[CAL];
  ANCHO = Math.round(a); ALTO = Math.round(b);
  lienzo.width = Math.round(ANCHO * PXR); lienzo.height = Math.round(ALTO * PXR);
  ctx.setTransform(PXR, 0, 0, PXR, 0, 0);
  ESC = ANCHO / VISTA_ANCHO;
  VISTA_ALTO = ALTO / ESC;
}

/* ── LA CAMARA ────────────────────────────────────────────────────────────
   Guarda el borde de ABAJO A LA IZQUIERDA de lo que se ve, en metros. Asi la
   proyeccion es una resta y una multiplicacion, y no hay que acordarse de
   ningun centro.
   EL EJE VERTICAL SE SUAVIZA MUCHO MAS QUE EL HORIZONTAL (0,42 s contra
   0,10): la ladera baja sin parar, asi que una camara que copie la altura
   deja el mundo quieto y al rider clavado; con retraso, subir una duna se ve
   como subir. Lo horizontal, en cambio, tiene que ser firme o el aviso que
   da el adelanto se convierte en un vaiven.                               */
const CAM_ALTO_F = 0.42;    // el rider al 42% desde abajo: hay mas cielo que suelo
const CAM = { x: 0, y: 0, sac: 0, sacF: 0 };
function camReinicia() {
  CAM.x = R.x - VISTA_ANCHO * RIDER_X;
  CAM.y = Math.min(R.y - VISTA_ALTO * CAM_ALTO_F, camAbajo() - VISTA_ALTO * 0.07);
  CAM.sac = 0; CAM.sacF = 0;
}
/* ── Y BAJA CUANDO EL SUELO SE CAE, que no es un capricho de encuadre ─────
   Con la altura atada SOLO al rider, una ladera empinada hace que el suelo se
   vaya por el borde de abajo del cuadro: medido, a partir de una pendiente de
   0,33 el ultimo tercio de la pantalla queda sin suelo dibujado y por el
   agujero se ve la cadena de montanas —o sea que abajo a la derecha aparece
   cielo—. Y antes que feo es injusto: el jugador deja de ver donde va a caer.
   Se muestrea el terreno por delante y la camara baja lo necesario para que
   el punto mas bajo entre en el cuadro, con el rider subiendo en la pantalla.
   El tope del 78% existe porque si no, un vuelo alto sobre un valle profundo
   se lleva al rider fuera del cuadro por arriba.                          */
function camAbajo() {
  let bajo = R.y;
  for (let i = 1; i <= 5; i++) {
    const px = R.x + VISTA_ANCHO * (1 - RIDER_X) * (i / 5);
    if (hayPiso(px)) { const y = terrY(px); if (y < bajo) bajo = y; }
  }
  return bajo;
}
function camPaso(dt) {
  const ox = R.x - VISTA_ANCHO * RIDER_X + CAM_ADEL * R.s;
  let oy = Math.min(R.y - VISTA_ALTO * CAM_ALTO_F, camAbajo() - VISTA_ALTO * 0.07);
  oy = Math.max(oy, R.y - VISTA_ALTO * 0.78);
  CAM.x = mezcla(CAM.x, ox, 1 - Math.pow(0.0001, dt));
  CAM.y = mezcla(CAM.y, oy, 1 - Math.pow(0.10, dt));
  /* el sacudon del aterrizaje: un impulso que decae, no un seno que dura */
  CAM.sac = Math.max(CAM.sac, R.sacude);
  CAM.sac *= Math.pow(0.0009, dt);
  CAM.sacF += dt * 46;
}
const sx = x => (x - CAM.x) * ESC;
const sy = y => ALTO - (y - CAM.y) * ESC;
/* ══════════════════════════════════════════════════════════════════════════
   EL CIELO Y EL FONDO
   ──────────────────────────────────────────────────────────────────────────
   TODO ES SILUETA Y UN SOLO COLOR POR CAPA. Lo que hace que este estilo se
   lea no son los detalles: es que cada plano sea UNA mancha plana y que los
   planos se distingan solo por el valor. Una montana con textura, con luz o
   con dos tonos deja de ser un plano y pasa a ser un dibujo.

   Y LAS CAPAS SE REPITEN POR MODULO. Sin eso, seis mil metros de partida
   piden una lista de cientos de crestas; con modulo sobre un periodo mas
   ancho que la pantalla la costura no cae nunca adentro del cuadro.      */

/* el perfil de una cadena: tres senos de periodos que no son multiplos entre
   si. Con uno solo la cordillera es una ondulacion y se lee a fondo de
   pantalla; con tres nunca se repite igual dentro de una vista.          */
const MONT = [
  { par: 0.10, per: 190, alt: 0.30, base: 0.30, k: 0.82 },
  { par: 0.20, per: 128, alt: 0.22, base: 0.21, k: 0.62 },
  { par: 0.34, per: 82,  alt: 0.15, base: 0.13, k: 0.42 },
];
function montY(m, x) {
  const u = x / m.per;
  return m.base + m.alt * (0.55 * Math.sin(u * 6.2832)
    + 0.30 * Math.sin(u * 2.618 * 6.2832 + 1.7)
    + 0.15 * Math.sin(u * 5.236 * 6.2832 + 4.1));
}

/* las estrellas viven en una reja fija con un desvio por celda: asi son
   siempre las mismas —una constelacion que se reconoce— y no hace falta
   guardar una lista */
function pintaEstrellas(al) {
  if (al < 0.02) return;
  ctx.fillStyle = 'rgba(255,255,255,' + (al * 0.9).toFixed(3) + ')';
  const off = CAM.x * 0.02;
  for (let i = 0; i < 90; i++) {
    const a = azarFijo(i * 3 + 1), b = azarFijo(i * 3 + 2), c = azarFijo(i * 3 + 3);
    let px = ((a * 1400 - off) % 1400 + 1400) % 1400 - 200;
    if (px < -8 || px > ANCHO + 8) continue;
    const py = b * ALTO * 0.55;
    const r = 0.5 + c * 1.1;
    ctx.globalAlpha = al * (0.35 + c * 0.65);
    ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
/* un azar determinista por indice: la misma constelacion en cada partida y
   en cada aparato, sin guardar nada */
function azarFijo(i) { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }

/* ── EL ASTRO ─────────────────────────────────────────────────────────────
   Uno solo, recorriendo el cielo con la hora, y `PAL.luna` decide si lleva
   el mordisco. Dos astros a la vez —sol y luna— obligan a decidir cual se
   ve en cada momento y a cruzarlos; con uno, la hora ya lo dice todo.
   EL HALO VA ANTES QUE EL DISCO y es de radio ocho veces mayor: es lo unico
   que tine el cielo alrededor del sol, y es la mitad de la iluminacion. */
function pintaAstro(h) {
  const u = ((h % 1) + 1) % 1;
  const ax = ANCHO * (0.10 + 0.80 * u);
  const ay = ALTO * (0.62 - 0.50 * Math.sin(u * Math.PI));
  const r = ALTO * 0.055;
  const g = ctx.createRadialGradient(ax, ay, r * 0.4, ax, ay, r * 8.5);
  g.addColorStop(0, rgb(PAL.ha, 0.50));
  g.addColorStop(0.35, rgb(PAL.ha, 0.16));
  g.addColorStop(1, rgb(PAL.ha, 0));
  ctx.fillStyle = g;
  ctx.fillRect(ax - r * 8.5, ay - r * 8.5, r * 17, r * 17);
  ctx.fillStyle = rgb(PAL.as);
  ctx.beginPath(); ctx.arc(ax, ay, r, 0, 6.2832); ctx.fill();
  if (PAL.luna > 0.02) {
    /* el mordisco se pinta con el color del CIELO de esa altura y no con
       negro: con negro la luna queda con un agujero en vez de una fase */
    ctx.globalAlpha = PAL.luna;
    ctx.fillStyle = rgb(mezclaC(PAL.ca, PAL.cb, clamp(ay / ALTO, 0, 1)));
    ctx.beginPath(); ctx.arc(ax + r * 0.52, ay - r * 0.24, r * 0.92, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  return { x: ax, y: ay, r };
}
const _mc = [0, 0, 0];
function mezclaC(a, b, t) { _m3(_mc, a, b, t); return _mc; }

/* las nubes son bandas horizontales con los cantos redondeados: en silueta
   una nube no tiene volumen, tiene CONTORNO, y lo que la hace nube es que
   sea mas ancha que alta y que tenga tres o cuatro bultos */
/* ── LAS NUBES ────────────────────────────────────────────────────────────
   CUATRO CIRCULOS SEPARADOS NO SON UNA NUBE: son cuatro circulos, y peor, en
   un solo path `arc` une el final de uno con el principio del siguiente con
   una RECTA — o sea que lo que se dibujaba era una pesa. Medido en la
   captura: dos discos unidos por una barra horizontal, tres veces en el
   cielo. Lo que hace una nube es la UNION de bultos que se pisan: base de
   fondo plano y cinco jorobas encima separadas menos que su radio, cada una
   en su propio subcamino para que el relleno tome la union y no las cuerdas.
   Y el fondo plano no es un detalle: una nube redonda flota como un globo. */
function pintaNubes(al) {
  if (al < 0.02) return;
  ctx.globalAlpha = al;
  for (let i = 0; i < 7; i++) {
    const a = azarFijo(100 + i * 5), b = azarFijo(101 + i * 5), c = azarFijo(102 + i * 5);
    const par = 0.05 + b * 0.05;
    const px = ((a * 1700 - CAM.x * par) % 1700 + 1700) % 1700 - 300;
    if (px < -320 || px > ANCHO + 60) continue;
    const py = ALTO * (0.07 + b * 0.26), w = ALTO * (0.22 + c * 0.34), hh = w * 0.19;
    ctx.fillStyle = rgb(PAL.cb, 0.14 + c * 0.09);
    ctx.beginPath();
    ctx.moveTo(px + w, py);
    ctx.ellipse(px + w * 0.5, py - hh * 0.35, w * 0.5, hh * 0.62, 0, 0, 6.2832);
    for (let k = 0; k < 5; k++) {
      const t = 0.14 + (k / 4) * 0.72;
      const r = hh * (0.72 + 0.55 * Math.sin(t * 3.4 + i * 2.1));
      const cx = px + w * t, cy = py - hh * (0.30 + 0.62 * Math.sin(t * Math.PI));
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, 6.2832);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function pintaFondo(h) {
  const g = ctx.createLinearGradient(0, 0, 0, ALTO);
  g.addColorStop(0, rgb(PAL.ca));
  g.addColorStop(0.62, rgb(PAL.cb));
  g.addColorStop(1, rgb(mezclaC(PAL.cb, PAL.su, 0.32)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, ANCHO, ALTO);

  pintaEstrellas(PAL.es);
  pintaAstro(h);
  pintaNubes(1 - PAL.es * 0.7);

  /* LAS TRES CADENAS. El horizonte de cada una se ancla al terreno con su
     propio parallax vertical: sin eso, bajando una ladera de seiscientos
     metros las montanas se quedan arriba y el mundo se parte en dos. */
  const base = sy(terrY(CAM.x + VISTA_ANCHO * RIDER_X));
  for (let i = 0; i < MONT.length; i++) {
    const m = MONT[i];
    const yb = ALTO - (ALTO - base) * (0.20 + m.par * 1.4) - ALTO * m.base;
    ctx.fillStyle = capaColor(m.k);
    ctx.beginPath();
    ctx.moveTo(-2, ALTO + 2);
    const paso = 7;
    for (let px = -2; px <= ANCHO + paso; px += paso) {
      const wx = CAM.x + px / ESC;
      ctx.lineTo(px, yb - ALTO * (montY(m, wx * m.par * 5) - m.base));
    }
    ctx.lineTo(ANCHO + 2, ALTO + 2); ctx.closePath(); ctx.fill();
  }
}
/* ══════════════════════════════════════════════════════════════════════════
   EL TERRENO DIBUJADO, LOS HUECOS, LAS CUERDAS Y LAS MONEDAS
   ──────────────────────────────────────────────────────────────────────────
   EL SUELO ES LO CLARO Y LO QUE HAY ENCIMA ES LO OSCURO, al reves de lo que
   uno escribiria. Es la inversion que define el estilo: la duna devuelve la
   luz del cielo y todo lo que se apoya en ella —el rider, un cactus, un
   poste— se recorta en negro. Con el suelo oscuro y los props claros la
   misma escena se lee a nocturno generico.                                */

/* el canto: dos o tres pixeles de la silueta sobre el borde del terreno. Es
   lo unico que separa la duna de la cadena de montanas que tiene detras, y
   es lo que le da el filo de arte vectorial — sin el, el borde es el
   antialias del relleno y la duna parece dibujada con aerografo.         */
/* Y NO ES TINTA NEGRA. Con el canto en silueta pura y dos pixeles y medio, la
   tabla del rider —que es de ese mismo color y mide dos pixeles— desaparece
   dentro de la linea del suelo: medido en la captura, el rider se leia
   corriendo sin tabla. Un tono intermedio separa igual la duna de la cadena
   de atras y deja que lo que se APOYA en ella se siga viendo. */
const CANTO = 1.7;
const CANTO_K = 0.62;   // cuanto se mezcla el suelo hacia la silueta

function pintaTerreno() {
  const paso = 3;                       // en pixeles de pantalla
  const x0 = CAM.x - 2 / ESC, x1 = CAM.x + VISTA_ANCHO + 4 / ESC;
  const g = ctx.createLinearGradient(0, sy(terrY(CAM.x + VISTA_ANCHO * 0.5)), 0, ALTO);
  g.addColorStop(0, rgb(PAL.su));
  g.addColorStop(1, rgb(mezclaC(PAL.su, PAL.si, 0.30)));

  /* SE DIBUJA POR TRAMOS CON PISO. Un solo path que baje al fondo dentro del
     hueco deja el vacio pintado del color de la arena; partido, el hueco es
     literalmente un sitio donde no se dibuja nada y se ve el cielo.      */
  let ini = null;
  const cierra = (a, b) => {
    ctx.beginPath();
    ctx.moveTo(sx(a), ALTO + 3);
    for (let x = a; x <= b; x += paso / ESC) ctx.lineTo(sx(x), sy(terrY(x)));
    ctx.lineTo(sx(b), sy(terrY(b)));
    ctx.lineTo(sx(b), ALTO + 3);
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    /* el canto va como trazo sobre el mismo borde, no como un segundo path:
       recalculandolo se separa medio pixel del relleno y aparece una linea
       de cielo entre los dos */
    ctx.beginPath();
    for (let x = a; x <= b; x += paso / ESC) ctx.lineTo(sx(x), sy(terrY(x)));
    ctx.lineTo(sx(b), sy(terrY(b)));
    ctx.strokeStyle = rgb(mezclaC(PAL.su, PAL.si, CANTO_K)); ctx.lineWidth = CANTO; ctx.lineJoin = 'round';
    ctx.lineCap = 'round'; ctx.stroke();
  };
  for (let x = x0; x <= x1; x += paso / ESC) {
    const hay = hayPiso(x);
    if (hay && ini === null) ini = x;
    else if (!hay && ini !== null) { cierra(ini, x - paso / ESC); ini = null; }
  }
  if (ini !== null) cierra(ini, x1);

  /* las paredes del hueco: dos trazos verticales que se pierden hacia abajo.
     Sin ellas el hueco es un recorte y no se lee su profundidad. */
  ctx.strokeStyle = rgb(mezclaC(PAL.su, PAL.si, 0.80)); ctx.lineWidth = CANTO + 0.6;
  for (let i = 0; i < HUECOS.length; i++) {
    const h = HUECOS[i];
    if (h.b < x0 || h.a > x1) continue;
    for (const bx of [h.a, h.b]) {
      ctx.beginPath();
      ctx.moveTo(sx(bx), sy(terrY(bx)));
      ctx.lineTo(sx(bx), sy(terrY(bx)) + ALTO * 0.30);
      ctx.stroke();
    }
  }
}

/* ── LOS ADORNOS ──────────────────────────────────────────────────────────
   Cinco siluetas y ninguna con detalle interior: a la distancia a la que se
   ven, lo unico que llega es el contorno. Y se plantan SOBRE la curva, con
   la escala de su propia entrada, porque cinco copias del mismo tamano se
   leen a copia y pega.                                                    */
function pintaDeco() {
  const x0 = CAM.x - 6, x1 = CAM.x + VISTA_ANCHO + 6;
  ctx.fillStyle = rgb(PAL.si);
  for (let i = 0; i < DECO.length; i++) {
    const d = DECO[i];
    if (d.x < x0) continue; if (d.x > x1) break;
    const px = sx(d.x), py = sy(terrY(d.x)), e = d.e * ESC;
    ctx.save(); ctx.translate(px, py);
    if (d.t === 0) {                                  // arbol seco
      ctx.fillRect(-0.14 * e, -2.6 * e, 0.28 * e, 2.6 * e);
      for (let k = 0; k < 3; k++) {
        const a = -0.9 - k * 0.5 + Math.sin(d.f + k) * 0.3, L = (0.9 - k * 0.18) * e;
        ctx.save(); ctx.translate(0, -(1.5 + k * 0.45) * e); ctx.rotate(a);
        ctx.fillRect(0, -0.09 * e, L, 0.18 * e); ctx.restore();
        ctx.save(); ctx.translate(0, -(1.7 + k * 0.45) * e); ctx.rotate(Math.PI - a);
        ctx.fillRect(0, -0.09 * e, L * 0.8, 0.18 * e); ctx.restore();
      }
    } else if (d.t === 1) {                           // roca
      ctx.beginPath();
      ctx.moveTo(-0.9 * e, 0); ctx.lineTo(-0.5 * e, -0.72 * e);
      ctx.lineTo(0.05 * e, -0.92 * e); ctx.lineTo(0.62 * e, -0.55 * e);
      ctx.lineTo(0.95 * e, 0); ctx.closePath(); ctx.fill();
    } else if (d.t === 2) {                           // arbusto
      for (let k = 0; k < 4; k++) {
        const a = -0.55 - k * 0.32, L = (0.75 - k * 0.09) * e;
        ctx.save(); ctx.rotate(a + Math.sin(d.f + k * 2) * 0.16);
        ctx.fillRect(-0.06 * e, -L, 0.12 * e, L); ctx.restore();
        ctx.save(); ctx.rotate(-(a + Math.sin(d.f + k) * 0.16));
        ctx.fillRect(-0.06 * e, -L * 0.9, 0.12 * e, L * 0.9); ctx.restore();
      }
    } else if (d.t === 4) {                           // cactus
      ctx.fillRect(-0.20 * e, -2.1 * e, 0.40 * e, 2.1 * e);
      ctx.fillRect(-0.78 * e, -1.55 * e, 0.60 * e, 0.34 * e);
      ctx.fillRect(-0.78 * e, -1.55 * e, 0.34 * e, 0.90 * e);
      ctx.fillRect(0.18 * e, -1.20 * e, 0.62 * e, 0.32 * e);
      ctx.fillRect(0.48 * e, -1.85 * e, 0.32 * e, 0.95 * e);
    } else {                                          // poste con banderin
      ctx.fillRect(-0.08 * e, -2.8 * e, 0.16 * e, 2.8 * e);
      ctx.beginPath(); ctx.moveTo(0.06 * e, -2.75 * e);
      ctx.lineTo(0.95 * e, -2.45 * e); ctx.lineTo(0.06 * e, -2.15 * e);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

/* ── LAS CUERDAS ──────────────────────────────────────────────────────────
   Dos postes y una linea de banderines. Los banderines no son adorno: son lo
   que la hace VISIBLE contra el cielo desde lejos —una linea de dos pixeles
   a treinta metros no existe— y son el aviso de que ahi hay algo que hacer. */
function pintaCuerdas() {
  const x0 = CAM.x - 6, x1 = CAM.x + VISTA_ANCHO + 6;
  for (let i = 0; i < CUERDAS.length; i++) {
    const c = CUERDAS[i];
    if (c.x1 < x0) continue; if (c.x0 > x1) break;
    const ax = sx(c.x0), ay = sy(c.y0), bx = sx(c.x1), by = sy(c.y1);
    ctx.strokeStyle = rgb(PAL.si); ctx.lineWidth = CANTO * 0.8;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, sy(terrY(c.x0))); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, sy(terrY(c.x1))); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    ctx.lineWidth = c.usada ? CANTO * 0.7 : CANTO * 1.1; ctx.stroke();
    const n = Math.max(3, Math.round((c.x1 - c.x0) / 2.6));
    const lado = ESC * 0.42;
    for (let k = 0; k < n; k++) {
      const t = (k + 0.5) / n, px = mezcla(ax, bx, t), py = mezcla(ay, by, t);
      ctx.globalAlpha = c.usada ? 0.34 : 0.92;
      ctx.fillStyle = k % 2 ? rgb(PAL.si) : rgb(PAL.as);
      ctx.beginPath(); ctx.moveTo(px - lado * 0.5, py); ctx.lineTo(px + lado * 0.5, py);
      ctx.lineTo(px, py + lado * 1.25); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ── LAS MONEDAS ──────────────────────────────────────────────────────────
   Un disco y su halo, y NADA MAS. Con un dibujo adentro dejan de leerse a
   distancia y compiten con el rider, que es lo unico que hay que mirar.  */
function pintaMonedas(t) {
  const x0 = CAM.x - 3, x1 = CAM.x + VISTA_ANCHO + 3;
  for (let i = 0; i < MONEDAS.length; i++) {
    const c = MONEDAS[i];
    if (c.ida) continue;
    if (c.x < x0) continue; if (c.x > x1) break;
    const px = sx(c.x), py = sy(c.y), r = ESC * 0.34;
    /* el guino: el disco se angosta con un coseno. Es la unica animacion de
       una moneda y es lo que la separa de un punto pintado. */
    const w = Math.abs(Math.cos(t * 2.4 + c.x * 0.4));
    ctx.fillStyle = rgb(PAL.ha, 0.22);
    ctx.beginPath(); ctx.arc(px, py, r * 2.1, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.ellipse(px, py, r * (0.24 + 0.76 * w), r, 0, 0, 6.2832); ctx.fill();
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   EL RIDER DIBUJADO
   ──────────────────────────────────────────────────────────────────────────
   Es lo que el pedido nombra —"animaciones tan buenas"— y no se consigue con
   mas cuadros: se consigue con TRES cosas, y ninguna es un sprite.

     1. UNA POSE QUE SALE DEL ESTADO, no de un reloj. Agachado, encogido,
        brazos abiertos y inclinacion son cuatro numeros que persiguen su
