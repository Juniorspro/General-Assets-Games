<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c100d">
<title>Bosque · Primera Persona</title>
<style>
  :root{
    --bg:#0c100d;
    --panel:rgba(16,21,18,0.93);
    --panel-edge:rgba(120,150,120,0.18);
    --ink:#e7ece7;
    --ink-dim:#9aa79c;
    --sage:#8fc28a;
    --sage-deep:#4f7a4c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  }
  #game{position:fixed;inset:0;}
  canvas{display:block;}

  /* ---- Loader ---- */
  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:#0c100d;
    transition:opacity .6s ease;
  }
  #loader.gone{opacity:0;pointer-events:none;}
  .spinner{
    width:42px;height:42px;border-radius:50%;
    border:3px solid rgba(143,194,138,0.18);border-top-color:var(--sage);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader p{color:var(--ink-dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;}

  /* ---- Look layer (touch drag to look) ---- */
  #look{position:fixed;inset:0;z-index:5;}

  /* ---- Joystick ---- */
  #joy{
    position:fixed;left:max(22px,env(safe-area-inset-left));
    bottom:max(28px,env(safe-area-inset-bottom));
    width:132px;height:132px;border-radius:50%;z-index:20;
    background:radial-gradient(circle at 50% 50%, rgba(20,26,22,0.32), rgba(12,16,13,0.5));
    border:1.5px solid rgba(143,194,138,0.22);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    touch-action:none;
  }
  #knob{
    position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 32%, rgba(180,210,176,0.9), rgba(79,122,76,0.85));
    border:1px solid rgba(231,236,231,0.4);
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    transition:transform .04s linear;
  }
  #joy .ring{
    position:absolute;inset:14px;border-radius:50%;
    border:1px dashed rgba(143,194,138,0.16);
  }

  /* ---- Gear button ---- */
  .iconbtn{
    position:fixed;z-index:30;width:46px;height:46px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--panel-edge);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:var(--ink);cursor:pointer;
  }
  #gear{right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));}
  #doorbtn{
    position:fixed;right:max(20px,env(safe-area-inset-right));
    bottom:max(46px,env(safe-area-inset-bottom));z-index:22;display:none;
    align-items:center;justify-content:center;min-width:104px;height:58px;padding:0 18px;
    border-radius:16px;font-size:15px;font-weight:700;color:#0c100d;
    background:linear-gradient(180deg, rgba(184,214,180,0.96), rgba(116,170,112,0.96));
    border:1px solid rgba(231,236,231,0.5);box-shadow:0 6px 18px rgba(0,0,0,0.42);
  }
  #doorbtn:active{transform:scale(0.95);}
  .iconbtn:active{transform:scale(0.94);}
  .iconbtn svg{width:24px;height:24px;}

  /* ---- Hint ---- */
  #hint{
    position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:25;
    text-align:center;color:var(--ink);font-size:13px;line-height:1.7;
    background:rgba(12,16,13,0.55);padding:12px 18px;border-radius:14px;
    border:1px solid var(--panel-edge);backdrop-filter:blur(4px);
    transition:opacity .8s ease;pointer-events:none;max-width:80vw;
  }
  #hint b{color:var(--sage);font-weight:600;}
  #hint.gone{opacity:0;}

  /* ---- Settings panel ---- */
  #panel{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:flex-end;justify-content:center;
    background:rgba(6,9,7,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  #panel.open{display:flex;}
  .sheet{
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--panel-edge);
    border-bottom:none;border-radius:22px 22px 0 0;
    padding:22px 22px calc(26px + env(safe-area-inset-bottom)) 22px;
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
    animation:rise .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-grip{width:42px;height:4px;border-radius:4px;background:rgba(143,194,138,0.3);margin:0 auto 16px;}
  .sheet h1{
    font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--sage);margin-bottom:4px;
  }
  .sheet .sub{font-size:12px;color:var(--ink-dim);margin-bottom:20px;}
  .group{margin-bottom:20px;}
  .group-title{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
    margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(143,194,138,0.1);
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;}
  .row label{font-size:14px;color:var(--ink);}
  .val{font-size:12px;color:var(--sage);min-width:42px;text-align:right;font-variant-numeric:tabular-nums;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;
    background:rgba(143,194,138,0.18);outline:none;max-width:200px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--sage);border:2px solid #1a221b;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:var(--sage);
    border:2px solid #1a221b;cursor:pointer;
  }

  .seg{display:flex;gap:6px;}
  .seg button{
    flex:1;padding:8px 6px;font-size:13px;border-radius:10px;cursor:pointer;
    background:rgba(143,194,138,0.08);border:1px solid transparent;color:var(--ink-dim);
  }
  .seg button.active{background:rgba(143,194,138,0.18);border-color:var(--sage-deep);color:var(--ink);}

  .toggle{position:relative;width:46px;height:26px;border-radius:26px;background:rgba(143,194,138,0.16);cursor:pointer;transition:background .2s;}
  .toggle.on{background:var(--sage-deep);}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#e7ece7;transition:transform .2s;}
  .toggle.on::after{transform:translateX(20px);}

  .actions{display:flex;gap:10px;margin-top:6px;}
  .actions button{
    flex:1;padding:13px;font-size:14px;font-weight:600;border-radius:12px;cursor:pointer;
    background:rgba(143,194,138,0.1);border:1px solid var(--panel-edge);color:var(--ink);
  }
  .actions button.primary{background:var(--sage-deep);border-color:var(--sage);color:#0c100d;}
  .actions button:active{transform:scale(0.97);}

  /* crosshair */
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;z-index:15;
    border-radius:50%;background:rgba(231,236,231,0.55);box-shadow:0 0 4px rgba(0,0,0,0.6);display:none;pointer-events:none;}
  .vignette{position:fixed;inset:0;z-index:10;pointer-events:none;
    box-shadow:inset 0 0 200px rgba(0,0,0,0.55);}

  /* ---- Forced-landscape: rotate the entire page 90° (menu + HUD + canvas) ---- */
  body.force-ls{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);overflow:hidden;}

  /* ---- Detección de plataforma: sin UI táctil en PC ---- */
  body.platform-pc #joy,
  body.platform-pc #doorbtn{ display:none !important; }
  /* Prompt de teclado para la puerta (solo PC) */
  #doorkey{
    position:fixed;left:50%;bottom:max(46px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:22;display:none;
    padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600;
    color:var(--ink);background:rgba(12,16,13,0.7);
    border:1px solid var(--panel-edge);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap;
    text-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  #doorkey kbd{
    display:inline-block;background:var(--sage);color:#0c100d;border-radius:5px;
    padding:1px 7px;margin-right:4px;font-family:inherit;font-size:12px;font-weight:800;
    box-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  body.platform-pc #doorkey.show{ display:block; }

</style>
</head>
<body>
<div id="game"></div>
<div id="look"></div>
<div class="vignette"></div>
<div id="cross"></div>

<div id="joy"><div class="ring"></div><div id="knob"></div></div>
<button id="doorbtn">Abrir puerta</button>
<div id="doorkey"><kbd>E</kbd><span id="doorkeytxt">Abrir puerta</span></div>

<button id="gear" class="iconbtn" aria-label="Ajustes">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<div id="hint">Arrastrá la pantalla para <b>mirar</b><br>Usá el joystick para <b>caminar</b></div>

<!-- Settings -->
<div id="panel">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <h1 data-i18n="set_title">Ajustes</h1>
    <p class="sub" data-i18n="set_sub">Configurá el rendimiento y la atmósfera del bosque.</p>

    <div class="group">
      <div class="group-title" data-i18n="set_quality">Calidad gráfica</div>
      <div class="seg" id="seg-quality">
        <button data-q="baja" data-i18n="set_q_low">Baja</button>
        <button data-q="media" data-i18n="set_q_med">Media</button>
        <button data-q="alta" data-i18n="set_q_high">Alta</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title" data-i18n="set_ambient">Ambiente</div>
      <div class="seg" id="seg-mood">
        <button data-m="nublado" data-i18n="set_m_cloudy">Nublado</button>
        <button data-m="niebla" data-i18n="set_m_fog">Niebla densa</button>
        <button data-m="atardecer" data-i18n="set_m_sunset">Atardecer</button>
        <button data-m="luna" data-i18n="set_m_moon">Luna llena</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title" data-i18n="set_camera">Cámara</div>
      <div class="row">
        <label data-i18n="set_fov">Campo de visión</label>
        <input type="range" id="fov" min="60" max="95" step="1">
        <span class="val" id="fov-v"></span>
      </div>
      <div class="row">
        <label data-i18n="set_sens">Sensibilidad</label>
        <input type="range" id="sens" min="0.4" max="2.2" step="0.05">
        <span class="val" id="sens-v"></span>
      </div>
    </div>

    <div class="group">
      <div class="group-title" data-i18n="set_move">Movimiento</div>
      <div class="row">
        <label data-i18n="set_speed">Velocidad</label>
        <input type="range" id="speed" min="0.5" max="2.2" step="0.05">
        <span class="val" id="speed-v"></span>
      </div>
      <div class="row">
        <label data-i18n="set_bob">Balanceo al caminar</label>
        <div class="toggle on" id="t-bob"></div>
      </div>
    </div>

    <div class="group">
      <div class="group-title" data-i18n="set_visual">Visual</div>
      <div class="row">
        <label data-i18n="set_fog">Distancia de visión</label>
        <input type="range" id="fog" min="0.55" max="1.9" step="0.05">
        <span class="val" id="fog-v"></span>
      </div>
      <div class="row">
        <label data-i18n="set_shadows">Sombras</label>
        <div class="toggle on" id="t-shadow"></div>
      </div>
      <div class="row">
        <label data-i18n="set_cross">Punto de mira</label>
        <div class="toggle" id="t-cross"></div>
      </div>
      <div class="row">
        <label data-i18n="set_sound">Sonido</label>
        <div class="toggle on" id="t-sound"></div>
      </div>
    </div>

    <div class="actions">
      <button id="btn-respawn" data-i18n="set_respawn">Volver al inicio</button>
      <button id="btn-full" data-i18n="set_full">Pantalla completa</button>
    </div>
    <div class="actions" style="margin-top:10px;">
      <button class="primary" id="btn-close" data-i18n="set_close">Seguir explorando</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   CONFIG
============================================================ */
var QUALITY = {
  baja:  { pr:1.0, shadowSize:512,  trees:220, bushes:240, clouds:8,  fogMul:1.25, shadowRadius:32 },
  media: { pr:1.5, shadowSize:1024, trees:420, bushes:520, clouds:14, fogMul:1.0,  shadowRadius:40 },
  alta:  { pr:2.0, shadowSize:2048, trees:650, bushes:850, clouds:22, fogMul:0.82, shadowRadius:48 }
};

var MOODS = {
  nublado:   { top:0x848b92, bottom:0xc1c6cb, fog:0xbac0c5, fogD:0.0125, hemiSky:0xbfc5cb, hemiGround:0x35442a, hemiI:0.92, dir:0xe2e6e9, dirI:0.5,  dirPos:[60,130,40], cloud:0xcdd2d7 },
  niebla:    { top:0xb4b9bd, bottom:0xd7dadd, fog:0xcdd1d4, fogD:0.032,  hemiSky:0xd0d4d8, hemiGround:0x3a4630, hemiI:1.0,  dir:0xeceef0, dirI:0.3,  dirPos:[40,120,60], cloud:0xdfe2e5 },
  atardecer: { top:0x4a3b52, bottom:0xd99a63, fog:0xc8966a, fogD:0.018,  hemiSky:0xe0a878, hemiGround:0x2e2a20, hemiI:0.8,  dir:0xffb877, dirI:0.75, dirPos:[-90,55,30], cloud:0xc7956b },
  luna:      { top:0x070b18, bottom:0x182640, fog:0x0c1426, fogD:0.011,  hemiSky:0x44588a, hemiGround:0x0e1118, hemiI:0.75, dir:0xc2d0f0, dirI:1.0,  dirPos:[60,120,-120], cloud:0x222c44 }
};

var MAX_TREES = QUALITY.alta.trees;
var MAX_BUSHES = QUALITY.alta.bushes;
var MAX_CLOUDS = QUALITY.alta.clouds;
var GROUND = 420, BOUND = 196, CLEAR_R = 9, FOREST_R = 188;
var EYE = 1.7, BASE_SPEED = 5.4, PLAYER_R = 0.7;

/* runtime settings */
var S = {
  quality:'media', mood:'nublado',
  fov:75, sens:1.0, speed:1.0,
  fog:1.0, shadows:true, bob:true, cross:false, sound:true
};

/* ============================================================
   STATE
============================================================ */
var scene, camera, renderer, clock;
var hemi, dir, skyMat, fogColor;
var trunkMesh, coneMeshes = [], bushMesh = null, cloudGroup, clouds = [];
var WALLS = [];        // collision AABBs (world coords): {x0,x1,z0,z1,y0,y1,door?}
var DOORS = [];        // openable doors
var floorY = 0;        // walkable surface height under the player
var nearDoor = null;   // nearest openable door within reach
var treeCols = [];
var player = new THREE.Vector3(0, 0, 16);
var yaw = 0, pitch = -0.03;
var joy = {x:0, y:0};
var moving = false, bobT = 0;
var uiOpen = false;
// Detección de plataforma según spec: MÓVIL solo si táctil Y puntero grueso
function detectPlatform(){
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var touch  = (navigator.maxTouchPoints || 0) > 0;
  return (touch && coarse) ? 'mobile' : 'pc';
}
var platform = detectPlatform();
var isTouch = (platform === 'mobile');   // compat con código existente
function applyPlatformClass(){
  document.body.classList.toggle('platform-pc', platform === 'pc');
  document.body.classList.toggle('platform-mobile', platform === 'mobile');
}
function setPlatform(p){
  if (p === platform) return;
  platform = p; isTouch = (p === 'mobile');
  applyPlatformClass();
  if (typeof applyForceLS === 'function') applyForceLS(p === 'mobile'); // horizontal forzado solo en móvil
  if (typeof hApplyLang === 'function') hApplyLang();      // repinta textos (hint, etc.)
  if (typeof updateDoorBtn === 'function') updateDoorBtn(); // repinta prompt de puerta
}
applyPlatformClass();
window.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'touch') setPlatform('mobile');
  else if (e.pointerType === 'mouse' || e.pointerType === 'pen') setPlatform('pc');
}, { passive: true });
window.addEventListener('pointermove', function(e){
  if (e.pointerType === 'mouse') setPlatform('pc');
}, { passive: true });
window.addEventListener('keydown', function(){ setPlatform('pc'); });

/* ============================================================
   PROCEDURAL TEXTURES
============================================================ */
function makeGrassTexture(){
  var c = document.createElement('canvas'); c.width = c.height = 512;
  var x = c.getContext('2d');
  x.fillStyle = '#21471f'; x.fillRect(0,0,512,512);
  // large soft mottling
  for(var i=0;i<55;i++){
    var gx=Math.random()*512, gy=Math.random()*512, r=40+Math.random()*120;
    var g=x.createRadialGradient(gx,gy,0,gx,gy,r);
    var dark = Math.random()<0.5;
    if(dark){ g.addColorStop(0,'rgba(20,46,16,0.5)'); }
    else { g.addColorStop(0,'rgba(58,98,42,0.45)'); }
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(gx,gy,r,0,7); x.fill();
  }
  // fine blades / speckles
  for(var j=0;j<7000;j++){
    var bx=Math.random()*512, by=Math.random()*512;
    var h=28+Math.random()*55;
    var s=18+Math.random()*22;
    var lum=Math.random();
    var col;
    if(lum<0.12) col='rgba(10,24,8,0.55)';
    else if(lum>0.9) col='rgba(96,134,64,0.5)';
    else col='hsl('+(95+Math.random()*25)+','+s+'%,'+(14+Math.random()*16)+'%)';
    x.strokeStyle=col; x.lineWidth=1;
    x.beginPath(); x.moveTo(bx,by); x.lineTo(bx+(Math.random()-0.5)*2, by-2-Math.random()*3); x.stroke();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(GROUND/9, GROUND/9);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

/* ============================================================
   SCENE BUILD
============================================================ */
function buildScene(){
  scene = new THREE.Scene();
  fogColor = new THREE.Color(MOODS[S.mood].fog);
  scene.fog = new THREE.FogExp2(fogColor.getHex(), MOODS[S.mood].fogD);

  camera = new THREE.PerspectiveCamera(S.fov, window.innerWidth/window.innerHeight, 0.1, 800);
  camera.rotation.order = 'YXZ';

  // lights
  var m = MOODS[S.mood];
  hemi = new THREE.HemisphereLight(m.hemiSky, m.hemiGround, m.hemiI);
  hemi.position.set(0,100,0);
  scene.add(hemi);
  scene.add(new THREE.AmbientLight(0x2c3038, 0.34)); // soft fill so interiors aren't pitch black

  dir = new THREE.DirectionalLight(m.dir, m.dirI);
  dir.position.set(m.dirPos[0], m.dirPos[1], m.dirPos[2]);
  dir.castShadow = true;
  dir.shadow.mapSize.set(QUALITY[S.quality].shadowSize, QUALITY[S.quality].shadowSize);
  var sr = QUALITY[S.quality].shadowRadius;
  dir.shadow.camera.left = -sr; dir.shadow.camera.right = sr;
  dir.shadow.camera.top = sr; dir.shadow.camera.bottom = -sr;
  dir.shadow.camera.near = 1; dir.shadow.camera.far = 320;
  dir.shadow.bias = -0.0006;
  dir.shadow.radius = 4;
  scene.add(dir);

    fragmentShader:'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*0.55+0.5, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.9)), 1.0); }'
  });
  var sky = new THREE.Mesh(skyGeo, skyMat);

  // ground

/* ---- Pine trees via instancing (4 draw calls total) ---- */
function buildForest(){
  var trunkGeo = new THREE.CylinderGeometry(0.32, 0.5, 5, 6); trunkGeo.translate(0,2.5,0);
  var c1 = new THREE.ConeGeometry(2.5, 4.6, 8); c1.translate(0,4.8,0);
  var c2 = new THREE.ConeGeometry(1.85, 4.0, 8); c2.translate(0,7.2,0);
  var c3 = new THREE.ConeGeometry(1.1, 3.6, 8);  c3.translate(0,9.4,0);

  var trunkMat = new THREE.MeshLambertMaterial({ color:0x3a2c1f });
  var foliMat  = new THREE.MeshLambertMaterial({ color:0xffffff });

  trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, MAX_TREES);
  trunkMesh.castShadow = true;
  scene.add(trunkMesh);

  var geos = [c1,c2,c3];
  coneMeshes = [];
  for(var k=0;k<3;k++){
    var im = new THREE.InstancedMesh(geos[k], foliMat, MAX_TREES);
    im.castShadow = true;
    scene.add(im);
    coneMeshes.push(im);
  }

  var mat = new THREE.Matrix4();
  var q = new THREE.Quaternion();
  var pos = new THREE.Vector3();
  var scl = new THREE.Vector3();
  var col = new THREE.Color();
  treeCols = [];

  for(var i=0;i<MAX_TREES;i++){
    var ang, d, px, pz, tries=0;
    do {
      ang = Math.random()*Math.PI*2;
      d = Math.sqrt(Math.random()*(FOREST_R*FOREST_R - CLEAR_R*CLEAR_R) + CLEAR_R*CLEAR_R);
      px = Math.cos(ang)*d; pz = Math.sin(ang)*d;
      tries++;
    } while(blocked(px, pz) && tries < 12);
    var s = 0.5 + Math.pow(Math.random(), 1.7) * 1.7;
    var wob = 0.82 + Math.random()*0.34;
    pos.set(px, 0, pz);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*Math.PI*2);
    scl.set(s*wob, s*(0.9+Math.random()*0.28), s*wob);
    mat.compose(pos, q, scl);

    trunkMesh.setMatrixAt(i, mat);
    for(var c=0;c<3;c++) coneMeshes[c].setMatrixAt(i, mat);

    col.setHSL(0.27 + Math.random()*0.06, 0.42 + Math.random()*0.22, 0.11 + Math.random()*0.07);
    for(var cc=0;cc<3;cc++) coneMeshes[cc].setColorAt(i, col);

    treeCols.push({ x:px, z:pz, r:0.5*s*wob });
  }

  trunkMesh.instanceMatrix.needsUpdate = true;
  for(var z=0;z<3;z++){
    coneMeshes[z].instanceMatrix.needsUpdate = true;
    if(coneMeshes[z].instanceColor) coneMeshes[z].instanceColor.needsUpdate = true;
  }
}

/* ---- merge non-indexed buffer geometries (position + normal) ---- */
function mergeGeoms(list){
  var posParts = [], normParts = [], i, j;
  for(i=0;i<list.length;i++){
    var g = list[i].index ? list[i].toNonIndexed() : list[i];
    posParts.push(g.attributes.position.array);
    normParts.push(g.attributes.normal.array);
  }
  function cat(parts){
    var len=0; for(j=0;j<parts.length;j++) len+=parts[j].length;
    var out=new Float32Array(len), o=0;
    for(j=0;j<parts.length;j++){ out.set(parts[j], o); o+=parts[j].length; }
    return out;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(cat(posParts), 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(cat(normParts), 3));
  return geo;
}

/* ---- Bushes: one instanced low-poly shrub, sizes from sapling to thicket ---- */
function buildBushes(){
  var b1 = new THREE.IcosahedronGeometry(1.0, 0);
  var b2 = new THREE.IcosahedronGeometry(0.72, 0); b2.translate(0.62, 0.15, 0.3);
  var b3 = new THREE.IcosahedronGeometry(0.66, 0); b3.translate(-0.55, 0.1, -0.4);
  var bushGeo = mergeGeoms([b1, b2, b3]);
  bushGeo.scale(1, 0.72, 1);
  bushGeo.translate(0, 0.5, 0);
  bushGeo.computeVertexNormals();

  var bushMat = new THREE.MeshLambertMaterial({ color:0xffffff });
  bushMesh = new THREE.InstancedMesh(bushGeo, bushMat, MAX_BUSHES);
  bushMesh.castShadow = false;
  bushMesh.receiveShadow = false;
  scene.add(bushMesh);

  var mat = new THREE.Matrix4();
  var q = new THREE.Quaternion();
  var pos = new THREE.Vector3();
  var scl = new THREE.Vector3();
  var col = new THREE.Color();
  var up = new THREE.Vector3(0,1,0);

  for(var i=0;i<MAX_BUSHES;i++){
    var ang, d, px, pz, tries=0;
    do {
      ang = Math.random()*Math.PI*2;
      d = 3 + Math.sqrt(Math.random()) * (FOREST_R - 3);
      px = Math.cos(ang)*d; pz = Math.sin(ang)*d;
      tries++;
    } while(blocked(px, pz) && tries < 12);
    var s = 0.35 + Math.pow(Math.random(), 1.4) * 1.95;   // tiny shrubs .. big bushes
    pos.set(px, 0, pz);
    q.setFromAxisAngle(up, Math.random()*Math.PI*2);
    scl.set(s*(0.85+Math.random()*0.45), s*(0.6+Math.random()*0.5), s*(0.85+Math.random()*0.45));
    mat.compose(pos, q, scl);
    bushMesh.setMatrixAt(i, mat);
    col.setHSL(0.26 + Math.random()*0.08, 0.45 + Math.random()*0.25, 0.13 + Math.random()*0.1);
    bushMesh.setColorAt(i, col);
  }
  bushMesh.instanceMatrix.needsUpdate = true;
  if(bushMesh.instanceColor) bushMesh.instanceColor.needsUpdate = true;
}

/* ---- Lumpy cumulus clouds ---- */
function buildClouds(){
  cloudGroup = new THREE.Group();
  clouds = [];
  var baseCol = MOODS[S.mood].cloud;
  for(var i=0;i<MAX_CLOUDS;i++){
    var g = new THREE.Group();
    var puffs = 5 + Math.floor(Math.random()*5);
    for(var p=0;p<puffs;p++){
      var r = 8 + Math.random()*11;
      var shade = (Math.random()<0.4) ? 0.86 : 1.0;
      var cm = new THREE.MeshLambertMaterial({ color:new THREE.Color(baseCol).multiplyScalar(shade), fog:false });
      var m = new THREE.Mesh(new THREE.SphereGeometry(r, 9, 7), cm);
      m.position.set((Math.random()-0.5)*32, (Math.random()-0.5)*7, (Math.random()-0.5)*20);
      m.scale.y = 0.55;
      g.add(m);
    }
    var ca = Math.random()*Math.PI*2;
    var cd = 150 + Math.random()*200;
    g.position.set(Math.cos(ca)*cd, 60 + Math.random()*55, Math.sin(ca)*cd);
    var gs = 1.4 + Math.random()*1.4;
    g.scale.setScalar(gs);
    g.userData.spd = 1.5 + Math.random()*2.5;
    cloudGroup.add(g);
    clouds.push(g);
  }
  scene.add(cloudGroup);
}

/* keep trees & bushes out of the building / courtyard */

/* ---- sakura garden: cherry-blossom path + giant glowing tree ("bloom" via additive glow) + falling petals ---- */

  var lgr=lg.createRadialGradient(24,24,1,24,24,22); lgr.addColorStop(0,'rgba(255,238,247,1)'); lgr.addColorStop(0.62,'rgba(255,198,224,0.95)'); lgr.addColorStop(1,'rgba(255,190,220,0)');

  var uTrunk=new THREE.CylinderGeometry(0.5,1.0,1,7), uBranch=new THREE.CylinderGeometry(0.45,0.9,1,5);
  var leafGeo=new THREE.PlaneGeometry(0.55,0.72), uBody=new THREE.SphereGeometry(1,10,8), uStr=new THREE.CylinderGeometry(1,1,1,4);
  var UP=new THREE.Vector3(0,1,0);
  var trunkM=[], branchM=[], leafM=[], bodyM=[], strM=[];
  function glowS(x,y,z,sc,col,op){ var s=new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:col, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, fog:false })); s.scale.set(sc,sc,1); s.position.set(x,y,z); scene.add(s); }
  function addTrunk(x,z,rBot,h){ trunkM.push({p:new THREE.Vector3(x,h/2,z), q:new THREE.Quaternion(), s:new THREE.Vector3(rBot,h,rBot)}); WALLS.push({x0:x-rBot*1.2,x1:x+rBot*1.2,z0:z-rBot*1.2,z1:z+rBot*1.2,y0:0,y1:h}); }
  function branch(x0,y0,z0,az,el,len,rad){
    var d=new THREE.Vector3(Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)).normalize();
    var q=new THREE.Quaternion().setFromUnitVectors(UP,d);

    return { x:x0+d.x*len, y:y0+d.y*len, z:z0+d.z*len };

    for(var i=0;i<n;i++){

      var lx=cx+rr*Math.sin(v)*Math.cos(u), ly=cy+rr*0.82*Math.cos(v), lz=cz+rr*Math.sin(v)*Math.sin(u);

  // MANY cherry trees, both sides of the grove, with big size variety

function collideWalls(nx, nz, fy){
  var feet = fy + 0.1, head = fy + EYE;
  for(var i=0;i<WALLS.length;i++){
    var w = WALLS[i];
    if(w.door && w.door.open) continue;
    if(head < w.y0 || feet > w.y1) continue;
    var cx = Math.max(w.x0, Math.min(nx, w.x1));
    var cz = Math.max(w.z0, Math.min(nz, w.z1));
    var dx = nx - cx, dz = nz - cz, d2 = dx*dx + dz*dz;
    if(d2 < PLAYER_R*PLAYER_R){
      if(d2 > 1e-6){ var d=Math.sqrt(d2); nx = cx + dx/d*PLAYER_R; nz = cz + dz/d*PLAYER_R; }
      else {
        var pl=nx-w.x0, pr=w.x1-nx, pb=nz-w.z0, pt=w.z1-nz, m=Math.min(pl,pr,pb,pt);
        if(m===pl) nx=w.x0-PLAYER_R; else if(m===pr) nx=w.x1+PLAYER_R; else if(m===pb) nz=w.z0-PLAYER_R; else nz=w.z1+PLAYER_R;
      }
    }
  }
  return [nx, nz];
}

var IX0=-31.7, IX1=31.7, IZ0=-11.7, IZ1=11.7, GF=1.6, SF=6.0, MID=3.8;
function floorCandidates(lx, lz){
  var a=[0];
  if(lx>-6.5 && lx<6.5 && lz>19 && lz<21.7){ var t=(21.6-lz)/2.6; t=Math.max(0,Math.min(1,t)); a.push(t*GF); }              // entrance steps

  if((lx>IX0&&lx<IX1&&lz>IZ0&&lz<IZ1) || (lx>-11&&lx<11&&lz>=IZ1&&lz<15.6)) a.push(GF);                                       // interior + vestibule GF
  if(lx>-3.8 && lx<-0.3 && lz>-10.5 && lz<-4.9){ var s=(-5-lz)/5.5; s=Math.max(0,Math.min(1,s)); a.push(GF+s*(MID-GF)); }    // flight A (rises toward -z)
  if(lx>0.3 && lx<3.8 && lz>-10.5 && lz<-4.9){ var s2=(lz+10.5)/5.5; s2=Math.max(0,Math.min(1,s2)); a.push(MID+s2*(SF-MID)); } // flight B (rises toward +z)
  if(lx>-3.8 && lx<3.8 && lz>-11.5 && lz<-10.5) a.push(MID);                                                                  // mid-landing
  if(lz>IZ0 && lz<IZ1 && lx>-4 && lx<IX1){                                                                                     // 2F: corridor + right side (gym is double-height)
    var isStairVoid = (lx<4 && lz<-5);

}

/* ============================================================
   APPLY SETTINGS
============================================================ */
function applyQuality(){
  var p = QUALITY[S.quality];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, p.pr, 2));
  // tree density via instance count
  trunkMesh.count = p.trees;
  for(var i=0;i<3;i++) coneMeshes[i].count = p.trees;
  if(bushMesh) bushMesh.count = p.bushes;
  // cloud count via visibility
  for(var c=0;c<clouds.length;c++) clouds[c].visible = (c < p.clouds);
  // shadows
  dir.shadow.mapSize.set(p.shadowSize, p.shadowSize);
  if(dir.shadow.map){ dir.shadow.map.dispose(); dir.shadow.map = null; }
  var sr = p.shadowRadius;
  dir.shadow.camera.left=-sr; dir.shadow.camera.right=sr; dir.shadow.camera.top=sr; dir.shadow.camera.bottom=-sr;
  dir.shadow.camera.updateProjectionMatrix();
  applyFog();
}

function applyFog(){
  var m = MOODS[S.mood];
  scene.fog.density = (m.fogD * QUALITY[S.quality].fogMul) / S.fog;
}

function applyShadowsToggle(){
  renderer.shadowMap.enabled = S.shadows;
  scene.traverse(function(o){ if(o.material){ o.material.needsUpdate = true; } });
}

function applyMood(){
  var m = MOODS[S.mood];
  fogColor.setHex(m.fog);
  scene.fog.color.setHex(m.fog);
  applyFog();
  skyMat.uniforms.top.value.setHex(m.top);
  skyMat.uniforms.bottom.value.setHex(m.bottom);
  hemi.color.setHex(m.hemiSky); hemi.groundColor.setHex(m.hemiGround); hemi.intensity = m.hemiI;
  dir.color.setHex(m.dir); dir.intensity = m.dirI;
  dir.position.set(m.dirPos[0], m.dirPos[1], m.dirPos[2]);
  // recolor clouds
  for(var i=0;i<clouds.length;i++){
    clouds[i].children.forEach(function(puff){
      var shade = (puff.material.color.r > new THREE.Color(m.cloud).r*0.93) ? 1.0 : 0.86;
      puff.material.color.copy(new THREE.Color(m.cloud)).multiplyScalar(shade);
    });
  }
  if(typeof moon!=='undefined' && moon) moon.visible = (S.mood==='luna');
}

/* ============================================================
   MOVEMENT & CAMERA
============================================================ */
function resolveCollision(nx, nz){
  var active = QUALITY[S.quality].trees;
  for(var i=0;i<active;i++){
    var t = treeCols[i];
    var dx = nx - t.x, dz = nz - t.z;
    var d2 = dx*dx + dz*dz;
    var rr = t.r + PLAYER_R;
    if(d2 < rr*rr){
      var d = Math.sqrt(d2) || 0.0001;
      nx = t.x + dx/d*rr;
      nz = t.z + dz/d*rr;
    }
  }
  return [nx, nz];
}

function updateMovement(dt){
  if(typeof HORROR!=='undefined' && HORROR && HORROR.paused){ moving=false; return; }
  var fwd = -joy.y, str = joy.x;
  var len = Math.hypot(fwd, str);
  if(len > 1){ fwd/=len; str/=len; }
  if(len > 0.02){
    var sinY = Math.sin(yaw), cosY = Math.cos(yaw);
    var dx = (-sinY)*fwd + (cosY)*str;
    var dz = (-cosY)*fwd + (-sinY)*str;
    var sp = BASE_SPEED * S.speed * dt;
    var nx = player.x + dx*sp;
    var nz = player.z + dz*sp;
    var px=player.x, pz=player.z;
    var r = resolveCollision(nx, nz);
    r = collideWalls(r[0], r[1], floorY);
    player.x = Math.max(-BOUND, Math.min(BOUND, r[0]));
    player.z = Math.max(-BOUND, Math.min(BOUND, r[1]));
    moving = true;
    _stepAcc += Math.hypot(player.x-px, player.z-pz);
    if(_stepAcc>=1.75){ _stepAcc=0; if(typeof AUDIO!=='undefined') AUDIO.step(); }
  } else {
    moving = false;
  }
  // vertical: follow the surface under the player (steps / stairs / storeys)
  var ty = floorYAt(player.x, player.z + 50, floorY);
  floorY += (ty - floorY) * Math.min(1, dt*12);
}

function applyCamera(dt){
  if(S.bob && moving){ bobT += dt*9; } else { bobT *= 0.9; }
  var bob = S.bob ? Math.sin(bobT)*0.06*(moving?1:0) : 0;
  camera.position.set(player.x, floorY + EYE + bob, player.z);
  camera.rotation.y = yaw;

var AUDIO = (function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx=null, master=null, music=null, sfx=null, tens=null, verb=null;
  var started=false, bellT=null, cricketT=null, lastTens=-1, en=true;

  function impulse(sec,decay){
    var n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(var c=0;c<2;c++){ var d=b.getChannelData(c); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); }

    if(ctx || !AC) return ctx;

    master=ctx.createGain(); master.gain.value=en?0.9:0.0; master.connect(ctx.destination);
    verb=ctx.createConvolver(); verb.buffer=impulse(3.4,2.4);
    var vg=ctx.createGain(); vg.gain.value=0.55; verb.connect(vg); vg.connect(master);
    music=ctx.createGain(); music.gain.value=0.0001; music.connect(master); music.connect(verb);
    sfx=ctx.createGain();   sfx.gain.value=0.9; sfx.connect(master);
    var sv=ctx.createGain(); sv.gain.value=0.3; sfx.connect(sv); sv.connect(verb);   // light reverb send on SFX

  // ---- background music: dark slow drone + breathing + sparse bells + wind + low tension pulse ----
  function startMusic(){
    if(!ensure()) return; resume(); if(started) return; started=true;
    music.gain.setValueAtTime(0.0001,t());
    music.gain.linearRampToValueAtTime(0.15, t()+5);
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.6; lp.connect(music);
    var lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=0.045; lg.gain.value=190; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    var fr=[55, 65.4, 82.4, 110];                 // A1, C2, E2, A2 — A-minor drone
    for(var i=0;i<fr.length;i++){
      var o=ctx.createOscillator(); o.type=i%2?'sine':'triangle'; o.frequency.value=fr[i];
      var g=ctx.createGain(); g.gain.value=0.0001; o.connect(g); g.connect(lp); o.start();
      g.gain.linearRampToValueAtTime(0.13/(1+i*0.5), t()+7);
      var br=ctx.createOscillator(), bg=ctx.createGain(); br.frequency.value=0.03+i*0.012; bg.gain.value=0.04; br.connect(bg); bg.connect(g.gain); br.start();
    }

    var wn=ctx.createBufferSource(); wn.buffer=impulse(4,0.0); wn.loop=true;
    var wf=ctx.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=500; wf.Q.value=0.5;
    var wg=ctx.createGain(); wg.gain.value=0.06; wn.connect(wf); wf.connect(wg); wg.connect(music);
    var wl=ctx.createOscillator(), wlg=ctx.createGain(); wl.frequency.value=0.07; wlg.gain.value=320; wl.connect(wlg); wlg.connect(wf.frequency); wl.start();
    wn.start();
    // rain hiss: brighter filtered noise, gentle, with a slow tremolo — pairs with the visual rain
    var rn=ctx.createBufferSource(); rn.buffer=impulse(4,0.0); rn.loop=true;
    var rf=ctx.createBiquadFilter(); rf.type='highpass'; rf.frequency.value=1400; rf.Q.value=0.4;
    var rlp=ctx.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=7000;
    var rg2=ctx.createGain(); rg2.gain.value=0.05; rn.connect(rf); rf.connect(rlp); rlp.connect(rg2); rg2.connect(music);
    var rtl=ctx.createOscillator(), rtg=ctx.createGain(); rtl.frequency.value=0.3; rtg.gain.value=0.015; rtl.connect(rtg); rtg.connect(rg2.gain); rtl.start();
    rn.start();

    var hb=ctx.createOscillator(); hb.type='sine'; hb.frequency.value=46;
    var hg=ctx.createGain(); hg.gain.value=0.5; hb.connect(hg); hg.connect(tens); hb.start();

    var f=base*Math.pow(2, sc[(Math.random()*sc.length)|0]/12);

  function scheduleCrickets(){ if(!ctx||!started) return; cricketT=setTimeout(function(){ cricket(); scheduleCrickets(); }, 700+Math.random()*1900); }
  function cricket(){           // short high trill — night insects

    var f=3700+Math.random()*1500;
    var o=ctx.createOscillator(), bp=ctx.createBiquadFilter(), g=ctx.createGain();

    g.gain.exponentialRampToValueAtTime(vol||0.2, a+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, a+dur);

    var g=ctx.createGain(); n.connect(f); f.connect(g); g.connect(sfx);
    var a=t(); g.gain.setValueAtTime(0.0001,a);
    g.gain.exponentialRampToValueAtTime(vol||0.2, a+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a+dur);
    n.start(a); n.stop(a+dur+0.02); return f;
  }

  function step(){ noise(0.12, 0.16, 'lowpass', 180+Math.random()*60, 0.8); }
  function pickup(){ tone(660,0.18,'sine',0.16,0.005); setTimeout(function(){ tone(990,0.4,'sine',0.14,0.01); },70); }
  function door(open){
    var f=noise(0.55, 0.12, 'bandpass', open?300:240, 6);
    if(f){ var a=t(); f.frequency.setValueAtTime(open?260:360,a); f.frequency.linearRampToValueAtTime(open?620:200,a+0.5); }
    tone(open?70:60,0.4,'sine',0.12,0.01);
  }
  function spellGood(){ [0,4,7,12].forEach(function(s,i){ setTimeout(function(){ tone(440*Math.pow(2,s/12),1.4,'sine',0.12,0.02); }, i*90); }); }
  function spellBad(){
    var o1=tone(110,0.6,'sawtooth',0.16,0.005), o2=tone(116,0.6,'sawtooth',0.14,0.005);
    if(o1){ var a=t(); o1.frequency.setValueAtTime(140,a); o1.frequency.exponentialRampToValueAtTime(60,a+0.55); }
    if(o2){ var b=t(); o2.frequency.setValueAtTime(146,b); o2.frequency.exponentialRampToValueAtTime(62,b+0.55); }
  }
  function seal(){ tone(98,2.4,'sine',0.18,0.01); tone(147,2.0,'triangle',0.1,0.02); tone(196,1.6,'sine',0.07,0.02); }
  function appear(){
    var f=noise(0.7,0.16,'lowpass',300,1.2);
    if(f){ var a=t(); f.frequency.setValueAtTime(600,a); f.frequency.exponentialRampToValueAtTime(90,a+0.65); }

  }
  function lose(){
    var o=tone(180,1.2,'sawtooth',0.2,0.005);

})();

// --- Joystick ---
(function(){
  var base = document.getElementById('joy');
  var knob = document.getElementById('knob');
  var active = false, id = null, cx = 0, cy = 0, maxT = 0;

  function rect(){
    var r = base.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    maxT = r.width/2 - 27;
  }
  function down(e){
    if(uiOpen) return;
    rect();
    active = true; id = e.pointerId;
    base.setPointerCapture(id);
    move(e); e.preventDefault();
  }
  function move(e){
    if(!active || e.pointerId !== id) return;
    var rdx = e.clientX - cx, rdy = e.clientY - cy;
    var rm = remapXY(rdx, rdy), ox = rm[0], oy = rm[1];
    var d = Math.hypot(ox, oy);
    if(d > maxT){ ox = ox/d*maxT; oy = oy/d*maxT; }
    knob.style.transform = 'translate(calc(-50% + '+ox+'px), calc(-50% + '+oy+'px))';
    joy.x = ox/maxT; joy.y = oy/maxT;
    e.preventDefault();
  }
  function up(e){
    if(e.pointerId !== id) return;
    active = false; id = null;
    knob.style.transform = 'translate(-50%,-50%)';
    joy.x = 0; joy.y = 0;
  }
  base.addEventListener('pointerdown', down);
  base.addEventListener('pointermove', move);
  base.addEventListener('pointerup', up);
  base.addEventListener('pointercancel', up);
})();

// --- Look --- (ambos métodos registrados, activos según la plataforma vigente)
(function(){
  var look = document.getElementById('look');

  // MÓVIL: arrastrar para mirar
  var id = null, lx = 0, ly = 0;
  look.addEventListener('pointerdown', function(e){
    if(platform !== 'mobile' || e.pointerType === 'mouse' || uiOpen) return;
    id = e.pointerId; lx = e.clientX; ly = e.clientY;
    look.setPointerCapture(id);
    hideHint();
  });
  look.addEventListener('pointermove', function(e){
    if(platform !== 'mobile' || e.pointerId !== id || uiOpen) return;
    var rdx = e.clientX - lx, rdy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    var rm = remapXY(rdx, rdy);
    yaw -= rm[0] * 0.005 * S.sens;
    pitch -= rm[1] * 0.005 * S.sens;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  });
  function end(e){ if(e.pointerId === id) id = null; }
  look.addEventListener('pointerup', end);
  look.addEventListener('pointercancel', end);

  // PC: pointer lock + mouse look
  look.addEventListener('click', function(){
    if(platform !== 'pc' || uiOpen) return;
    (renderer.domElement.requestPointerLock || function(){})();
    document.body.requestPointerLock && document.body.requestPointerLock();
    hideHint();
  });
  document.addEventListener('mousemove', function(e){
    if(platform !== 'pc') return;
    if(document.pointerLockElement && !uiOpen){
      var rm = remapXY(e.movementX, e.movementY);
      yaw -= rm[0] * 0.0022 * S.sens;
      pitch -= rm[1] * 0.0022 * S.sens;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
    }
  });

  // PC: teclado WASD / flechas (en móvil no se generan estos eventos)
  var keys = {};
  window.addEventListener('keydown', function(e){ keys[e.code]=true; updateKeys(); });
  window.addEventListener('keyup', function(e){ keys[e.code]=false; updateKeys(); });
  function updateKeys(){
    if(platform !== 'pc') return;
    var x=0,y=0;
    if(keys.KeyW||keys.ArrowUp) y-=1;
    if(keys.KeyS||keys.ArrowDown) y+=1;
    if(keys.KeyA||keys.ArrowLeft) x-=1;
    if(keys.KeyD||keys.ArrowRight) x+=1;
    joy.x=x; joy.y=y;
  }
})();

var _spellKind=null, _spellPage=0;
function hShuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function hOpenSpell(kind){ _spellKind=kind; _spellPage=0; HORROR.paused=true; document.getElementById('spell').style.display='flex'; hSpellRender(); }
function hSpellRender(){
  var k=_spellKind, c=SPELLS[k], pages=[T('sp_'+k+'_0'),T('sp_'+k+'_1'),T('sp_'+k+'_2')];
  var title=document.getElementById('spellTitle'), body=document.getElementById('spellBody'), btn=document.getElementById('spellNext'), ch=document.getElementById('spellChoices');
  title.innerHTML=c.icon+' '+T('sp_word')+' · '+T('spn_'+k);
  if(_spellPage < pages.length){
    body.textContent=pages[_spellPage];
    btn.style.display='inline-block';
    btn.textContent = (_spellPage < pages.length-1) ? T('sp_read') : T('sp_find');
    ch.style.display='none'; ch.innerHTML='';
  } else {
    body.textContent=T('sp_prompt');
    btn.style.display='none'; ch.style.display='flex'; ch.innerHTML='';
    var opts=hShuffle([c.incantation].concat(c.decoys));
    for(var i=0;i<opts.length;i++){ (function(w){ var b=document.createElement('button'); b.textContent='«'+w+'»'; b.addEventListener('click',function(e){e.preventDefault(); hSpellChoose(w);}); ch.appendChild(b); })(opts[i]); }
  }
}
function hSpellNext(){ _spellPage++; hSpellRender(); }
function hSpellChoose(word){
  var c=SPELLS[_spellKind];
  if(word===c.incantation){
    HORROR.sealParts++; hUpdateSeal();
    document.getElementById('spell').style.display='none'; HORROR.paused=false;
    if(typeof AUDIO!=='undefined'){ AUDIO.spellGood(); AUDIO.seal(); }
    hToast(T('t_seal_broke')+' ('+HORROR.sealParts+'/5)');
    hSetMission(c.m+1); _spellKind=null;
  } else {
    if(typeof AUDIO!=='undefined') AUDIO.spellBad();
    hToast(T('t_wrong'));
    hWakeNear(3.8);                 // a wrong incantation wakes the shadow (it'll be hunting when you close the grimoire)
    _spellPage=3; hSpellRender();
  }
}

function hWake(spd){
  if(!monster) return;
  monster.state='hunting'; monster.speed=spd; monster.temp=false;   // wrong-code chase: persists until correct code
  // spawn in the central corridor, at the end farthest from the player (open space it can navigate)
  var sx=0, sz=(player.z < -47) ? -39.2 : -54.2;
  monster.x=sx; monster.z=sz; monster.y=floorY; monster.group.position.set(sx,floorY,sz); monster.group.visible=true;
}
function hWakeNear(spd){                                              // periodic appearance: surfaces near the player, then fades
  if(!monster) return;
  var ang=Math.random()*Math.PI*2, dist=18+Math.random()*8;
  var c=collideWalls(player.x+Math.cos(ang)*dist, player.z+Math.sin(ang)*dist, floorY);
  monster.x=c[0]; monster.z=c[1]; monster.y=floorY;
  monster.state='hunting'; monster.speed=spd; monster.temp=true; monster.huntT=16+Math.random()*8;
  monster.group.position.set(monster.x, monster.y, monster.z); monster.group.visible=true;
  hToast(T('t_near')); if(typeof AUDIO!=='undefined') AUDIO.appear();
}

function hInteract(){
  if(!nearInter || HORROR.paused || HORROR.over) return;
  var it=nearInter; if(typeof AUDIO!=='undefined') AUDIO.pickup();
  if(it.kind==='flashlight'){
    it.taken=true; it.mesh.visible=false; it.halo.visible=false; flashOn=true;
    hToast(T('t_flash')); hSetMission(2);
  } else if(it.kind==='seal'){
    it.taken=true; it.mesh.visible=false; it.halo.visible=false;
    HORROR.sealsTaken++;
    hToast(T('itn_amulet')+' '+HORROR.sealsTaken+'/4'); hRefreshBanner();
    if(HORROR.sealsTaken>=4){ hToast(T('t_seal_done')); hOpenSpell('seal'); }
  } else if(FETCH[it.kind]){
    var c=FETCH[it.kind];
    it.taken=true; it.mesh.visible=false; it.halo.visible=false;

    if(HORROR[c.ctr]>=c.n){ hToast(T('t_cast_now')); hOpenSpell(it.kind); }
  } else if(it.kind==='panel'){
    hOpenKeypad();
  }
}

function hDarken(){
  var dimChecked=false;
  scene.traverse(function(o){
    if(o.isDirectionalLight) o.intensity *= 0.12;
    else if(o.isHemisphereLight) o.intensity *= 0.16;
    else if(o.isAmbientLight) o.intensity *= 0.40;
    else if(o.isPointLight) o.intensity *= 0.50;
    else if(o.isMesh && o.material && o.material.isMeshBasicMaterial && !o.material._hdim){
      o.material._hdim=true; var c=o.material.color;
      if(c && c.r>0.95 && c.g>0.9 && c.b>0.74 && c.b<0.88){ c.multiplyScalar(0.30); }
    }
  });
  if(scene.fog){ scene.fog = new THREE.FogExp2(0x06070b, 0.030); }
  if(skyMat && skyMat.uniforms){ try{ for(var k in skyMat.uniforms){ if(skyMat.uniforms[k] && skyMat.uniforms[k].value && skyMat.uniforms[k].value.isColor) skyMat.uniforms[k].value.multiplyScalar(0.12); } }catch(e){} }
  flashlight = new THREE.SpotLight(0xfff0d2, 2.6, 30, Math.PI*0.20, 0.45, 1.1);
  flashlight.castShadow=false; flashlight.visible=false;
  scene.add(flashlight); scene.add(flashlight.target);
}

function hGoLandscape(){

function updateHorror(dt){
  if(!HORROR.started) return;
  HORROR.t += dt;
  if(flashlight){
    flashlight.position.copy(camera.position);
    _hfwd.set(0,0,-1).applyQuaternion(camera.quaternion);
    flashlight.target.position.copy(camera.position).addScaledVector(_hfwd,6);
    flashlight.target.updateMatrixWorld(); flashlight.visible=flashOn; flashlight.intensity=2.6;
  }
  if(HORROR.over) return;

  // float/spin pickups + nearest detection
  nearInter=null; var best=2.5*2.5;
  for(var i=0;i<interactables.length;i++){ var it=interactables[i]; if(it.taken) continue;
    if(it.kind!=='panel'){ it.mesh.rotation.y += dt*1.4; it.mesh.position.y = it.y + Math.sin(HORROR.t*2+i)*0.12; it.halo.position.y = it.mesh.position.y; }
    if(it.kind==='flashlight' && HORROR.m!==1) continue;
    if(it.kind==='seal' && HORROR.m!==2) continue;
    if(FETCH[it.kind] && HORROR.m!==FETCH[it.kind].m) continue;
    var dx=player.x-it.x, dz=player.z-it.z, q=dx*dx+dz*dz;
    if(q<best && Math.abs(floorY-it.floor)<1.6){ best=q; nearInter=it; }
  }
  hUpdateActBtn();

  // monster — periodic appearances while dormant (once you hold the flashlight), plus the wrong-code chase
  var safe = inSafe(player.x, player.z);                 // cherry grove is a safe haven
  if(safe && !_wasSafe) hToast(T('t_safe_in'));
  else if(!safe && _wasSafe && flashOn && !HORROR.over) hToast(T('t_safe_out'));
  _wasSafe = safe;
  if(safe && monster && monster.state==='hunting'){ hRecede(); }
  if(monster && monster.state==='dormant' && flashOn && !HORROR.paused && !HORROR.over && !safe){
    HORROR.spawnT -= dt;
    if(HORROR.spawnT<=0) hWakeNear(3.4);
  }
  if(monster && monster.state==='hunting' && !safe){
    monster.group.visible=true;
    var mdx=player.x-monster.x, mdz=player.z-monster.z, md=Math.hypot(mdx,mdz)||0.001;
    if(monster.temp){ monster.huntT-=dt; if(monster.huntT<=0 || md>36){ hRecede(); } }
    var sp=monster.speed;
    if(flashOn){ _htoM.set(monster.x-camera.position.x,0,monster.z-camera.position.z); _htoM.y=0; _htoM.normalize(); _hfwd.set(0,0,-1).applyQuaternion(camera.quaternion); _hfwd.y=0; _hfwd.normalize(); if(_hfwd.dot(_htoM)>0.55 && md<16){ sp=-0.8; } }
    var nmx = monster.x + (mdx/md)*sp*dt, nmz = monster.z + (mdz/md)*sp*dt;
    var mc = collideWalls(nmx, nmz, monster.y);     // can't pass through walls (slides along them)
    monster.x = mc[0]; monster.z = mc[1];
    monster.y += (floorY - monster.y)*Math.min(1,dt*3);
    monster.group.position.set(monster.x, monster.y, monster.z);
    monster.group.rotation.y = Math.atan2(mdx, mdz);
    var _t2=Math.max(0, 1 - md/16); hVignette(_t2); if(typeof AUDIO!=='undefined') AUDIO.tension(_t2);
    if(flashlight && flashOn && md<9){ flashlight.intensity = 1.4 + Math.random()*1.3; }
    if(md<1.5 && Math.abs(floorY-monster.y)<2.4){ hDie(); }
  }

  // final mission: reach the main door / exit
  if(HORROR.m===7){ if(player.z>-36.5 && Math.abs(player.x)<5.5){ hWin(); } }
}

function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);

  updateMovement(dt);
  applyCamera(dt);

  // keep sky centered on player (infinite sky)
  var sky = scene.getObjectByName('sky');
  if(sky) sky.position.copy(camera.position);
  if(moon && moon.visible) moon.position.set(camera.position.x+60, camera.position.y+120, camera.position.z-120);

  // shadow frustum follows player
  dir.position.set(player.x + MOODS[S.mood].dirPos[0]*0.4, MOODS[S.mood].dirPos[1], player.z + MOODS[S.mood].dirPos[2]*0.4);
  dir.target.position.set(player.x, 0, player.z);
  dir.target.updateMatrixWorld();

  // drift clouds
  for(var i=0;i<clouds.length;i++){
    if(!clouds[i].visible) continue;
    clouds[i].position.x += clouds[i].userData.spd * dt;
    if(clouds[i].position.x > 380) clouds[i].position.x = -380;
  }

  // falling sakura petals
  if(petals){ var pa=petals.geometry.attributes.position, arr=pa.array, ps=petals.userData.spd, et=clock.elapsedTime;
    for(var pi=0; pi<ps.length; pi++){ var k=pi*3; arr[k+1]-=ps[pi]*dt; arr[k]+=Math.sin(et*0.8+pi)*0.006;
      if(arr[k+1]<0.15){ arr[k+1]=15+Math.random()*5; arr[k]=(Math.random()*2-1)*30; arr[k+2]=8+Math.random()*76; } }
    pa.needsUpdate=true;
  }

  // light rain — falls outside; over a building it stops at the roof (never indoors)
  if(rain){ var rrp=rain.geometry.attributes.position, rarr=rrp.array, rsp=rain.userData.spd, rpx=player.x, rpz=player.z;
    rain.position.set(rpx, 0, rpz);
    for(var rri=0; rri<rsp.length; rri++){ var rrk=rri*3; rarr[rrk+1]-=rsp[rri]*dt;
      var rfloor=rainFloor(rpx+rarr[rrk], rpz+rarr[rrk+2]);
      if(rarr[rrk+1] < rfloor-0.5){ rarr[rrk+1]=18+Math.random()*4; rarr[rrk]=(Math.random()*2-1)*24; rarr[rrk+2]=(Math.random()*2-1)*24; } }
    rrp.needsUpdate=true;
  }

  // doors: swing animation + nearest-in-reach detection
  for(var di=0; di<DOORS.length; di++){ var dd=DOORS[di]; var tg=dd.open?dd.opened:dd.closed; dd.cur += (tg-dd.cur)*Math.min(1,dt*8); dd.pivot.rotation.y=dd.cur; }
  nearDoor=null; var bestDoor=4.6*4.6;
  for(var dk=0; dk<DOORS.length; dk++){ var dx2=DOORS[dk]; if(Math.abs(floorY-dx2.by)>3.2) continue; var ax=player.x-dx2.wx, az=player.z-dx2.wz, qq=ax*ax+az*az; if(qq<bestDoor){ bestDoor=qq; nearDoor=dx2; } }
  updateDoorBtn();

  if(typeof updateHorror==='function') updateHorror(dt);

  renderer.render(scene, camera);
}

function onResize(){
  var w = window.innerWidth, h = window.innerHeight;
  if(FORCE_LS){ var _t=w; w=h; h=_t; }                 // render at swapped (landscape) size when rotated
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUALITY[S.quality].pr, 2));
}

/* ============================================================
   INIT
============================================================ */
function init(){
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = S.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('game').appendChild(renderer.domElement);

  clock = new THREE.Clock();
  buildScene();
  wireUI();
  initHorror();
  window.addEventListener('resize', onResize);
  applyForceLS(platform === 'mobile');                 // rotar a horizontal solo en móvil; en PC nunca
  window.addEventListener('pointerdown', _audioUnlock);   // mobile autoplay: start audio on first gesture
  window.addEventListener('touchstart', _audioUnlock);
  window.addEventListener('keydown', _audioUnlock);

  // hide loader
  requestAnimationFrame(function(){
    var l = document.getElementById('loader');
    if(l) l.classList.add('gone');
    setTimeout(function(){ if(l) l.remove(); }, 700);
  });

  // auto-hide hint
  setTimeout(hideHint, 5500);

  animate();
}

window.addEventListener('load', init);
})();
</script>

<div id="loader">
  <div class="spinner"></div>
  <p>Cargando bosque…</p>
</div>
</body>
