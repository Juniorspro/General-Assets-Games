<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>TONO</title>
<style>
/* ── TODO SE MIDE CONTRA EL ANCHO DEL MARCO, NO CONTRA vw ──
   En una pantalla apaisada el juego vive en una columna con proporción de
   teléfono, y ahí `vw` es el ancho de la VENTANA: el título se saldría de la
   columna. `--mw` es el ancho de lo que de verdad se ve. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e9e6f2;
  user-select:none;-webkit-user-select:none}
#marco{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,calc(100vh * 9 / 16));height:100vh;max-height:100vh;
  --mw:min(100vw,calc(100vh * 9 / 16));background:#000;overflow:hidden}
#lz{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ── LA FRANJA DE ARRIBA ── */
#hudTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:calc(var(--mw)*.02);
  padding:calc(var(--mw)*.035) calc(var(--mw)*.045);pointer-events:none;z-index:3;
  transition:opacity .28s}
/* ── LA FRANJA SE APARTA MIENTRAS SE TOCA ──
   El panel llega hasta el borde de arriba, así que la fila de botones se
   superpone con las notas más agudas justo cuando se las está tocando. */
body.tocando #hudTop{opacity:.14}
#hudTop>*{pointer-events:auto}
.chip{font-size:calc(var(--mw)*.032);letter-spacing:.10em;font-weight:700;
  padding:calc(var(--mw)*.022) calc(var(--mw)*.038);border-radius:999px;
  border:1px solid rgba(200,190,235,.22);background:rgba(12,10,20,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#cfc7e6;cursor:pointer}
#tInst{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  border-color:transparent;background:transparent;color:#8f88a8;letter-spacing:.14em}

/* ── EL HUD DE REPETÍ ── */
/* ── EL HUD DE REPETÍ VA ARRIBA, CON EL RESTO ──
   Abajo viven las notas graves, y ahí es donde el dedo tiene que poder caer sin
   nada encima. Todo lo que se lee se agrupa en la franja de arriba. */
#hudJue{position:absolute;left:0;right:0;top:calc(var(--mw)*.155);padding:0 calc(var(--mw)*.05);
  display:none;flex-direction:column;align-items:center;gap:calc(var(--mw)*.018);
  pointer-events:none;z-index:3;text-align:center;transition:opacity .22s}
/* ── MIENTRAS SUENA UNA NOTA, NADA MÁS COMPITE ──
   El panel llega hasta arriba de todo, así que una nota aguda cae justo detrás
   del rótulo: medido, la del escalón 22 se dibujaba en y 74 y el cartel ocupa de
   60 a 130. Lo que hay que mirar en ese segundo es la luz, no el texto. */
body.sonando #hudJue{opacity:.14}
body.sonando #hudTop{opacity:.10}
body.jugando #hudJue{display:flex}
#jFase{font-size:calc(var(--mw)*.058);font-weight:800;letter-spacing:.16em;color:#efeaff;
  text-shadow:0 0 calc(var(--mw)*.06) rgba(150,120,255,.55)}
#jRonda{font-size:calc(var(--mw)*.030);letter-spacing:.20em;color:#8f88a8}
#jPuntos{display:flex;gap:calc(var(--mw)*.016);flex-wrap:wrap;justify-content:center;max-width:100%}
.pt{width:calc(var(--mw)*.020);height:calc(var(--mw)*.020);border-radius:999px;
  background:rgba(200,190,235,.20)}
.pt.ok{background:#b79cff;box-shadow:0 0 calc(var(--mw)*.03) rgba(160,120,255,.9)}

/* ── LOS PANELES ── */
.pan{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(var(--mw)*.028);
  padding:calc(var(--mw)*.075);z-index:5;text-align:center;
  background:radial-gradient(120% 80% at 50% 42%,rgba(28,20,52,.92) 0%,rgba(0,0,0,.97) 72%)}
.pan.on{display:flex}
h1{font-size:calc(var(--mw)*.20);font-weight:800;letter-spacing:.20em;line-height:1;
  color:#f2eeff;text-shadow:0 0 calc(var(--mw)*.10) rgba(150,110,255,.55)}
.sub{font-size:calc(var(--mw)*.033);letter-spacing:.22em;color:#8d85a6;margin-bottom:calc(var(--mw)*.03)}
.tit{font-size:calc(var(--mw)*.062);font-weight:800;letter-spacing:.14em;color:#efeaff}
.bt{width:100%;max-width:calc(var(--mw)*.78);padding:calc(var(--mw)*.042) calc(var(--mw)*.05);
  font-size:calc(var(--mw)*.046);font-weight:800;letter-spacing:.14em;color:#efeaff;
  border-radius:calc(var(--mw)*.035);cursor:pointer;
  border:1px solid rgba(180,150,255,.34);background:linear-gradient(180deg,rgba(60,42,110,.55),rgba(22,16,40,.55))}
.bt.sec{font-size:calc(var(--mw)*.036);padding:calc(var(--mw)*.032) calc(var(--mw)*.05);
  border-color:rgba(200,190,235,.18);background:rgba(14,11,24,.6);color:#b8b0cf}
.pie{font-size:calc(var(--mw)*.026);line-height:1.5;color:#6f6889;max-width:calc(var(--mw)*.84)}
.cred{font-size:calc(var(--mw)*.021);color:#4e4a63;max-width:calc(var(--mw)*.86);line-height:1.5}

/* ── UNA FILA DE AJUSTES: EL RÓTULO AL COSTADO ──
   Debajo, siete filas no entran en el alto de un teléfono; al costado sobra
   ancho y no sobra alto. */
.fila{width:100%;max-width:calc(var(--mw)*.86);display:flex;align-items:center;
  gap:calc(var(--mw)*.03);margin:calc(var(--mw)*.008) 0}
.rot{flex:0 0 calc(var(--mw)*.26);text-align:left;font-size:calc(var(--mw)*.030);
  letter-spacing:.13em;color:#7f7899}
.ops{flex:1;display:flex;gap:calc(var(--mw)*.014);flex-wrap:wrap;justify-content:flex-end}
.op{padding:calc(var(--mw)*.020) calc(var(--mw)*.030);border-radius:calc(var(--mw)*.024);
  font-size:calc(var(--mw)*.029);font-weight:700;letter-spacing:.07em;cursor:pointer;
  border:1px solid rgba(200,190,235,.16);background:rgba(14,11,24,.7);color:#9a93b4}
.op.sel{border-color:rgba(180,150,255,.72);color:#f2eeff;background:rgba(72,48,132,.62)}

/* ── EL SELECTOR DE INSTRUMENTO ── */
#pInstr{justify-content:flex-start;padding-top:calc(var(--mw)*.05)}
#pestanas{display:flex;gap:calc(var(--mw)*.012);flex-wrap:wrap;justify-content:center;
  max-width:100%;margin-bottom:calc(var(--mw)*.02)}
#lista{width:100%;max-width:calc(var(--mw)*.9);flex:1;overflow-y:auto;
  display:flex;flex-direction:column;gap:calc(var(--mw)*.016);padding:calc(var(--mw)*.01) 0}
.ins{width:100%;padding:calc(var(--mw)*.034) calc(var(--mw)*.045);text-align:left;
  font-size:calc(var(--mw)*.038);font-weight:700;letter-spacing:.06em;cursor:pointer;
  border-radius:calc(var(--mw)*.028);border:1px solid rgba(200,190,235,.14);
  background:rgba(14,11,24,.7);color:#b8b0cf;display:flex;justify-content:space-between;align-items:center}
.ins.sel{border-color:rgba(180,150,255,.72);color:#f2eeff;background:rgba(72,48,132,.55)}
.ins small{font-size:calc(var(--mw)*.024);letter-spacing:.14em;color:#6f6889}
#pFin .num{font-size:calc(var(--mw)*.26);font-weight:800;line-height:1;color:#f2eeff;
  text-shadow:0 0 calc(var(--mw)*.10) rgba(150,110,255,.55)}
.aviso{position:absolute;left:50%;bottom:calc(var(--mw)*.10);transform:translateX(-50%);
  font-size:calc(var(--mw)*.028);letter-spacing:.12em;color:#8d85a6;z-index:4;
  opacity:0;transition:opacity .35s;pointer-events:none;text-align:center;width:86%}
.aviso.on{opacity:1}
</style>
</head>
<body>
<div id="marco">
  <canvas id="lz"></canvas>

  <div id="hudTop">
    <button class="chip" id="bVolver">‹</button>
    <div class="chip" id="tInst">—</div>
    <button class="chip" id="bCfg">···</button>
  </div>

  <div id="hudJue">
    <div id="jPuntos"></div>
    <div id="jFase">—</div>
    <div id="jRonda">—</div>
  </div>

  <div class="aviso" id="avPanel">—</div>

  <div class="pan on" id="pIdioma">
    <h1>TONO</h1>
    <div class="sub" id="iSub">A BLACK PANEL. TOUCH IT.</div>
    <button class="bt" data-lang="es">CASTELLANO</button>
    <button class="bt" data-lang="en">ENGLISH</button>
    <button class="bt" data-lang="pt">PORTUGUÊS</button>
  </div>

  <div class="pan" id="pMenu">
    <h1>TONO</h1>
    <div class="sub" id="mSub">—</div>
    <button class="bt" id="bLibre">—</button>
    <button class="bt" id="bJuego">—</button>
    <button class="bt sec" id="bAjustes">—</button>
    <div class="pie" id="mPie">—</div>
    <div class="cred" id="mCred">—</div>
  </div>

  <div class="pan" id="pAjustes">
    <div class="tit" id="aTit">—</div>
    <div class="fila"><div class="rot" id="aSon">—</div><div class="ops" id="oSon"></div></div>
    <div class="fila"><div class="rot" id="aEsc">—</div><div class="ops" id="oEsc"></div></div>
    <div class="fila"><div class="rot" id="aTono">—</div><div class="ops" id="oTono"></div></div>
    <div class="fila"><div class="rot" id="aOct">—</div><div class="ops" id="oOct"></div></div>
    <div class="fila"><div class="rot" id="aIdi">—</div><div class="ops" id="oIdi"></div></div>
    <button class="bt sec" id="bVerInstr">—</button>
    <button class="bt" id="bCerrarCfg">—</button>
  </div>

  <div class="pan" id="pInstr">
    <div class="tit" id="nTit">—</div>
    <div id="pestanas"></div>
    <div id="lista"></div>
    <button class="bt" id="bCerrarInstr">—</button>
  </div>

  <div class="pan" id="pFin">
    <div class="sub" id="fTit">—</div>
    <div class="num" id="fNum">0</div>
    <div class="sub" id="fRec">—</div>
    <button class="bt" id="bOtra">—</button>
    <button class="bt sec" id="bAlMenu">—</button>
  </div>
</div>

   altura del sonido, y mientras el dedo sigue apoyado se puede subir y bajar
   para que la nota suba y baje con él.

   ── LAS NOTAS CAEN EN UNA ESCALA, Y ESO ES UNA DECISION ──
   Con la altura mapeada a frecuencia CONTINUA, cualquier acorde de dos dedos
   suena desafinado y no hay forma de repetir una melodía: el juego de repetir
   dejaría de existir. Cayendo en una escala, cualquier nota suena bien con
   cualquier otra —que es lo que hace una pentatónica— y al deslizar el dedo la
   nota GLISA de un grado al siguiente, así que subir y bajar se sigue sintiendo
   continuo. La escala se elige, y una de las siete es la cromática, que es el
   modo sin red. */

const NOTA_NOM = ['DO', 'DO#', 'RE', 'MI♭', 'MI', 'FA', 'FA#', 'SOL', 'SOL#', 'LA', 'SI♭', 'SI'];

/* ══════════ AZAR CON SEMILLA ══════════ */
let SEM = 1;
function sem(s){ SEM = (s >>> 0) || 1; }
function az(){ SEM ^= SEM << 13; SEM ^= SEM >>> 17; SEM ^= SEM << 5; return ((SEM >>> 0) % 100000)/100000; }
function azi(a, b){ return Math.floor(a + az()*(b - a + 1)); }
function cl(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, k){ return a + (b - a)*k; }

/* ══════════════════ c.js ══════════════════ */
/* ══════════════════════ EL SONIDO ══════════════════════
   Treinta y dos instrumentos de muestras de verdad, tres muestras cada uno, y
   el tono sale de la velocidad de reproducción. Todo lo demás cuelga de eso.

   ── LO QUE HACE QUE «MANTENER Y SUBIR» SEA POSIBLE ──
   Una nota no es un disparo: es una voz que queda viva mientras el dedo esté
   apoyado, con su `playbackRate` empujado hacia el tono nuevo con una constante
   de tiempo. Por eso el motor no tiene `tocar(nota)` sino tres verbos —abrir,
   mover, soltar— y el que sabe dónde está el dedo es el juego, no el motor. */

const INSTRS = typeof SON_B !== 'undefined' ? SON_B : [];
const POR_ID = {};
for (const i of INSTRS) POR_ID[i.id] = i;

let AC = null, MAE = null, SECO = null, ENVIO = null, REVE = null, ANA = null;
let SON_ON = true, MAX_VOCES = 12;
const BUF = {};                 /* id|nota -> AudioBuffer ya decodificado */
const CARGA = {};               /* id -> promesa, para no decodificar dos veces */
const VOCES = [];

function audioListo(){ return !!AC && AC.state === 'running'; }

/* ── EL CONTEXTO DESPIERTA CON EL PRIMER GESTO ──
   Ningún navegador deja sonar nada antes de uno de verdad, y el primero de este
   juego es el botón de idioma. */
function audioDespierta(){
  if (AC){ if (AC.state === 'suspended') AC.resume(); return AC; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); }
  catch (e){ AC = null; return null; }
  MAE = AC.createGain(); MAE.gain.value = SON_ON ? 0.85 : 0;
  ANA = AC.createAnalyser(); ANA.fftSize = 2048;
  MAE.connect(ANA); MAE.connect(AC.destination);
  SECO = AC.createGain(); SECO.gain.value = 0.86; SECO.connect(MAE);
  /* ── LA REVERB ES LO QUE CONVIERTE UN PANEL EN UN LUGAR ──
     La respuesta al impulso se genera: ruido que decae. Un archivo de reverb
     pesaría más que los treinta y dos instrumentos juntos. */
  REVE = AC.createConvolver();
  const seg = 1.9, n = Math.floor(AC.sampleRate*seg);
  const ir = AC.createBuffer(2, n, AC.sampleRate);
  for (let c = 0; c < 2; c++){
    const d = ir.getChannelData(c);
    for (let i = 0; i < n; i++){
      const t = i/n;
      d[i] = (Math.random()*2 - 1)*Math.pow(1 - t, 2.6)*(i < 220 ? i/220 : 1);
    }
  }
  REVE.buffer = ir;
  ENVIO = AC.createGain(); ENVIO.gain.value = 0.30;
  ENVIO.connect(REVE); REVE.connect(MAE);
  return AC;
}

function b64buf(s){
  const b = atob(s), a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a.buffer;
}

/* Decodifica las tres muestras de un instrumento. En diferido y una sola vez:
   decodificar los noventa y seis MP3 al arrancar son varios segundos de hilo
   para noventa y tres muestras que esa partida no va a usar. */
function cargaInstr(id){
  if (CARGA[id]) return CARGA[id];
  const I = POR_ID[id];
  if (!I || !AC) return Promise.resolve(false);
  CARGA[id] = Promise.all(I.m.map(m => {
    /* `decodeAudioData` VACÍA el buffer que recibe, así que va una copia: sin
       ella un segundo intento encuentra cero bytes */
    const ab = b64buf(m.d).slice(0);
    return AC.decodeAudioData(ab)
      .then(b => { BUF[id + '|' + m.n] = b; return true; })
      .catch(() => false);
  })).then(r => r.some(Boolean));
  return CARGA[id];
}

/* la muestra más cercana: con muestras cada doce semitonos, lo más que hay que
   estirar son seis, que es donde el estiramiento todavía no se escucha */
function muestraDe(I, midi){
  let mej = I.m[0], d = 1e9;
  for (const m of I.m){ const k = Math.abs(m.n - midi); if (k < d){ d = k; mej = m; } }
  return mej;
}

/* ── LA VOZ ──
   Una muestra, un filtro y una ganancia. El filtro es lo que hace que el eje
   horizontal signifique algo: a la izquierda la nota suena tapada y suave, a la
   derecha abierta y fuerte, que es la segunda dimensión del panel. */
function abre(id, midi, vol, brillo){
  if (!AC || !SON_ON) return null;
  const I = POR_ID[id]; if (!I) return null;
  const m = muestraDe(I, midi), b = BUF[id + '|' + m.n];
  const t = AC.currentTime;
  const g = AC.createGain();
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.7;
  f.frequency.value = filtroDe(brillo);
  /* ── CADA FUENTE TIENE SU PROPIA GANANCIA ──
     No es un lujo: es lo que deja cruzar una muestra con la siguiente cuando el
     dedo se va lejos de la que arrancó. */
  const gs = AC.createGain(); gs.gain.value = 1;
  let src, tipo;
  if (b){
    src = fuente(b, m, midi);
    tipo = 'muestra';
  } else {
    /* ── Y SI UNA MUESTRA NO DECODIFICA, SUENA IGUAL ──
       Un juego mudo por un decodificador es peor que uno con osciladores. */
    src = AC.createOscillator(); src.type = I.sost ? 'sawtooth' : 'triangle';
    src.frequency.value = 440*Math.pow(2, (midi - 69)/12);
    tipo = 'sinte';
  }
  src.connect(gs); gs.connect(f); f.connect(g);
  g.connect(SECO); g.connect(ENVIO);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(volDe(vol), t + 0.008);
  src.start(t);
  const v = { src, gs, g, f, id, midi, base: m.n, tipo, sost: !!I.sost || tipo === 'sinte',
              t0: t, viva: true, viejas: [] };
  VOCES.push(v);
  /* con más de doce voces vivas el maestro recorta y todo suena a distorsión */
  while (VOCES.length > MAX_VOCES){ const vieja = VOCES.shift(); apaga(vieja, 0.05); }
  return v;
}
function fuente(b, m, midi){
  const src = AC.createBufferSource(); src.buffer = b;
  if (m.lp){ src.loop = true; src.loopStart = m.lp[0]; src.loopEnd = m.lp[1]; }
  src.playbackRate.value = Math.pow(2, (midi - m.n)/12);
  return src;
}
function volDe(v){ return 0.16 + 0.52*cl(v === undefined ? 0.7 : v, 0, 1); }
function filtroDe(b){ return 420*Math.pow(38, cl(b === undefined ? 0.75 : b, 0, 1)); }

/* ── EL GLISADO ──
   La nota nueva no se dispara: la que está sonando se EMPUJA hacia ella. Con un
   salto seco, deslizar el dedo se escucha a escalera; con la constante de tiempo
   en 22 ms, la nota llega en menos de un décimo de segundo y el camino se oye. */
/* ── DOS OCTAVAS DE DESLIZAMIENTO SOBRE UNA SOLA MUESTRA SUENAN A ARDILLA ──
   Medido: arrastrando el dedo de abajo arriba, la muestra de DO3 terminaba
   estirada 21 semitonos, o sea a más del triple de velocidad. Las muestras están
   cada doce semitonos: pasados SIETE se cruza a la de al lado, y el cruce se
   hace con las dos ganancias en cuarenta y cinco milisegundos para que no haya
   un click. Sólo en los sostenidos: los suyos son bucles, así que la muestra
   nueva entra por el medio y no vuelve a atacar. Un piano estirado no se nota,
   porque para cuando el dedo llegó lejos su nota ya decayó. */
function cambiaMuestra(v, midi){
  const I = POR_ID[v.id]; if (!I || !I.sost) return false;
  const m = muestraDe(I, midi);
  if (m.n === v.base || Math.abs(midi - v.base) <= 7) return false;
  const b = BUF[v.id + '|' + m.n]; if (!b || !m.lp) return false;
  const t = AC.currentTime, X = 0.045;
  const src = fuente(b, m, midi);
  const gs = AC.createGain(); gs.gain.setValueAtTime(0, t);
  gs.gain.linearRampToValueAtTime(1, t + X);
  src.connect(gs); gs.connect(v.f);
  try { src.start(t, m.lp[0]); } catch (e){ try { src.start(t); } catch (x){ return false; } }
  const vs = v.src, vg = v.gs;
  vg.gain.setValueAtTime(vg.gain.value, t);
  vg.gain.linearRampToValueAtTime(0, t + X);
  try { vs.stop(t + X + 0.03); } catch (e) {}
  v.src = src; v.gs = gs; v.base = m.n;
  return true;
}

function mueve(v, midi, vol, brillo){
  if (!v || !v.viva || !AC) return;
  const t = AC.currentTime;
  v.midi = midi;
  if (v.tipo === 'muestra') cambiaMuestra(v, midi);
  const p = v.tipo === 'muestra' ? Math.pow(2, (midi - v.base)/12) : 0;
  if (v.tipo === 'muestra') v.src.playbackRate.setTargetAtTime(p, t, 0.022);
  else v.src.frequency.setTargetAtTime(440*Math.pow(2, (midi - 69)/12), t, 0.022);
  v.g.gain.setTargetAtTime(volDe(vol), t, 0.030);
  v.f.frequency.setTargetAtTime(filtroDe(brillo), t, 0.030);
}

function apaga(v, rel){
  if (!v || !v.viva || !AC) return;
  v.viva = false;
  const t = AC.currentTime, r = rel || (v.sost ? 0.14 : 0.42);
  try {
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(v.g.gain.value, t);
    v.g.gain.exponentialRampToValueAtTime(0.0008, t + r);
    v.src.stop(t + r + 0.02);
  } catch (e) {}
  const i = VOCES.indexOf(v); if (i >= 0) VOCES.splice(i, 1);
}
function apagaTodo(){ for (const v of VOCES.slice()) apaga(v, 0.06); }

/* una nota suelta, para el modo de repetir y para la vista previa: se abre y se
   cierra sola, así quien la dispara no tiene que acordarse de soltarla */
function pico(id, midi, dur, vol){
  const v = abre(id, midi, vol === undefined ? 0.72 : vol, 0.8);
  if (v) setTimeout(() => apaga(v), Math.max(60, (dur || 0.42)*1000));
  return v;
}
function sonidoOn(v){ SON_ON = !!v; if (!SON_ON) apagaTodo(); if (MAE) MAE.gain.value = SON_ON ? 0.85 : 0; return SON_ON; }

/* ══════════════════ d.js ══════════════════ */
/* ══════════════════════ EL PANEL Y EL JUEGO ══════════════════════
   Acá vive todo lo que decide QUÉ suena: dónde cae cada altura de la pantalla,
   qué le pasa a un dedo que se queda apoyado y se mueve, y el modo REPETÍ.

   ── NO TOCA NI EL DOM NI EL LIENZO, Y ESO NO ES PROLIJIDAD ──
   Si la lógica del panel viviera adentro del dibujo, no habría forma de
   auditarla sin un navegador. Así, la secuencia de REPETÍ y el mapa de alturas
   se pueden correr en node y comprobar que ninguna nota se sale del panel. */

/* ══════════ LO QUE SE GUARDA ══════════ */
function guarda(k, v){ try { localStorage.setItem('tono_' + k, String(v)); } catch (e) {} }
function lee(k, d){
  try { const v = localStorage.getItem('tono_' + k); return v === null ? d : v; }
  catch (e){ return d; }
}
function leeN(k, d){ const v = parseFloat(lee(k, NaN)); return isFinite(v) ? v : d; }

/* ══════════ LOS AJUSTES DEL PANEL ══════════ */
const PAN = {
  esc: 0,                    /* índice en ESCALAS */
  tono: 0,                   /* 0..11, cuánto se corre la tónica */
  oct: OCTAVAS,              /* cuántas octavas abarca el panel */
  inst: INSTRS.length ? INSTRS[0].id : 'acoustic_grand_piano'
};

function escAct(){ return ESCALAS[cl(PAN.esc, 0, ESCALAS.length - 1)]; }
function instAct(){ return POR_ID[PAN.inst] || INSTRS[0] || { base: 48, sost: 0 }; }

/* ── CUÁNTOS ESCALONES TIENE EL PANEL ──
   Los grados de la escala por las octavas, MÁS UNO: la tónica de arriba es la
   que cierra el alcance. Sin ese uno, el panel termina en el grado anterior y
   deslizar hasta el borde no llega nunca a la octava. */
function nGrados(){ return escAct().g.length*PAN.oct + 1; }

function midiDeIdx(i){
  const E = escAct(), L = E.g.length;
  const n = nGrados();
  i = cl(Math.round(i), 0, n - 1);
  const o = Math.floor(i/L), d = i - o*L;
  return instAct().base + PAN.tono + o*12 + E.g[d];
}

/* la altura del dedo, de 0 abajo a 1 arriba, cae en el escalón más cercano */
function idxDeAlt(a){ return Math.round(cl(a, 0, 1)*(nGrados() - 1)); }
function altDeIdx(i){ const n = nGrados(); return n > 1 ? cl(i, 0, n - 1)/(n - 1) : 0.5; }

/* el nombre de la nota, para la línea guía */
function nombreDeIdx(i){ const m = midiDeIdx(i); return NOTA_NOM[((m % 12) + 12) % 12]; }

/* ── EL COLOR SALE DE LA ALTURA ──
   Sobre negro, un arcoíris entero pasa por verdes que se ensucian. De cian a
   magenta pasando por azul y violeta es frío-a-caliente sin salir de la familia
   que un panel negro aguanta. */
function matizDe(a){ return 195 + cl(a, 0, 1)*145; }

/* el eje horizontal es la segunda dimensión: a la izquierda tapado y suave, a
   la derecha abierto y fuerte */
function volDeX(x){ return 0.30 + 0.70*cl(x, 0, 1); }
function briDeX(x){ return 0.20 + 0.80*cl(x, 0, 1); }

/* ══════════ LOS DEDOS ══════════ */
const DEDOS = {};              /* id de puntero -> dedo vivo */
const ONDAS = [];              /* aros que se abren y se apagan */

function onda(nx, na, idx, k){
  ONDAS.push({ nx, na, idx, t: 0, vida: 0.90, k: k === undefined ? 1 : k });
  while (ONDAS.length > 48) ONDAS.shift();
}

function dedoAbajo(id, nx, na){
  const i = idxDeAlt(na);
  const vol = volDeX(nx), bri = briDeX(nx);
  const v = abre(PAN.inst, midiDeIdx(i), vol, bri);
  DEDOS[id] = { nx, na, idx: i, v, vol, bri, t: 0, hist: [{ nx, na, t: 0 }] };
  onda(nx, altDeIdx(i), i, 1);
  juegoToque(i);
  return DEDOS[id];
}

/* ── MOVER NO VUELVE A DISPARAR LA NOTA, LA EMPUJA ──
   Ésa es toda la mecánica: el dedo sigue apoyado, la voz sigue viva, y lo único
   que cambia es hacia dónde apunta. Y por lo mismo, deslizar NO cuenta como una
   nota nueva en REPETÍ: si contara, corregir sería perder. */
function dedoMueve(id, nx, na){
  const d = DEDOS[id]; if (!d) return;
  d.nx = nx; d.na = na;
  d.vol = volDeX(nx); d.bri = briDeX(nx);
  /* el rastro es DÓNDE ESTUVO EL DEDO, o sea un hecho del panel y no del dibujo:
     por eso vive acá y se puede auditar sin abrir un navegador */
  d.hist.push({ nx, na, t: 0 });
  while (d.hist.length > 26) d.hist.shift();
  const i = idxDeAlt(na);
  if (i !== d.idx){ d.idx = i; onda(nx, altDeIdx(i), i, 0.62); }
  mueve(d.v, midiDeIdx(i), d.vol, d.bri);
}

function dedoArriba(id){
  const d = DEDOS[id]; if (!d) return;
  apaga(d.v);
  delete DEDOS[id];
}

function dedosSoltar(){ for (const k of Object.keys(DEDOS)) dedoArriba(k); }
function nDedos(){ return Object.keys(DEDOS).length; }

function panelPaso(dt){
  for (const k in DEDOS){
    const d = DEDOS[k];
    d.t += dt;
    for (let i = d.hist.length - 1; i >= 0; i--){
      d.hist[i].t += dt;
      if (d.hist[i].t > 0.40 && i < d.hist.length - 1) d.hist.splice(i, 1);
    }
  }
  for (let i = ONDAS.length - 1; i >= 0; i--){
    const o = ONDAS[i]; o.t += dt;
    if (o.t >= o.vida) ONDAS.splice(i, 1);
  }
}

/* ══════════════════════ REPETÍ ══════════════════════
   Suena una secuencia de notas y hay que repetirla tocando el panel a la misma
   altura. Cada ronda agrega una.

   ── LA ESCALA ES LA DIFICULTAD, Y NO HACE FALTA UNA PERILLA MÁS ──
   Con la pentatónica el panel tiene once escalones de ochenta píxeles; con la
   cromática tiene veinticinco de treinta y cinco. La misma secuencia se vuelve
   mucho más difícil sin cambiar una sola regla. */
const JU_ANTES = 0.65, JU_ON = 0.40, JU_HUECO = 0.18, JU_TRAS = 0.60;

const JU = { on: false, fase: 'espera', ronda: 0, sec: [], paso: 0, i: -1, t: 0,
             rec: 0, luz: -1, luzT: 0 };

function juegoArranca(){
  sem((Date.now() & 0x7fffffff) || 1);
  JU.on = true; JU.ronda = 0; JU.sec = []; JU.paso = 0; JU.rec = leeN('rec', 0);
  JU.luz = -1; JU.luzT = 0;
  rondaNueva();
}
function juegoCorta(){ JU.on = false; JU.fase = 'espera'; }

function rondaNueva(){
  JU.ronda++;
  const n = nGrados();
  let x = azi(0, n - 1), g = 0;
  /* dos veces la misma nota seguida no se distingue de una sola sostenida */
  while (JU.sec.length && x === JU.sec[JU.sec.length - 1] && g++ < 24) x = azi(0, n - 1);
  JU.sec.push(x);
  JU.paso = 0; JU.i = -1; JU.t = -JU_ANTES; JU.fase = 'muestra';
}

function juegoPaso(dt){
  if (!JU.on) return;
  JU.t += dt;
  if (JU.luzT > 0){ JU.luzT -= dt; if (JU.luzT <= 0) JU.luz = -1; }
  if (JU.fase === 'muestra'){
    const per = JU_ON + JU_HUECO;
    while (JU.i < JU.sec.length - 1 && JU.t >= (JU.i + 1)*per){
      JU.i++;
      const idx = JU.sec[JU.i];
      pico(PAN.inst, midiDeIdx(idx), JU_ON, 0.78);
      onda(0.5, altDeIdx(idx), idx, 1);
      JU.luz = idx; JU.luzT = JU_ON;
    }
    if (JU.i >= JU.sec.length - 1 && JU.t >= JU.sec.length*per){
      JU.fase = 'turno'; JU.paso = 0;
    }
  } else if (JU.fase === 'bien'){
    if (JU.t >= JU_TRAS) rondaNueva();
  }
}

/* devuelve true si el toque contó y era el correcto */
function juegoToque(idx){
  if (!JU.on || JU.fase !== 'turno') return false;
  if (idx === JU.sec[JU.paso]){
    JU.paso++;
    if (JU.paso >= JU.sec.length){
      if (JU.ronda > JU.rec){ JU.rec = JU.ronda; guarda('rec', JU.rec); }
      JU.fase = 'bien'; JU.t = 0;
      /* la tónica dos octavas arriba, floja: dice «esa era» sin taparla */
      pico(PAN.inst, midiDeIdx(nGrados() - 1) + 12, 0.5, 0.30);
    }
    return true;
  }
  JU.fase = 'fin'; JU.t = 0;
  /* una segunda menor abajo de todo: eso no se puede leer como otra cosa */
  pico(PAN.inst, midiDeIdx(0) - 5, 0.9, 0.85);
  pico(PAN.inst, midiDeIdx(0) - 4, 0.9, 0.85);
  return false;
}

/* ══════════════════ e.js ══════════════════ */
/* ══════════════════════ EL DIBUJO ══════════════════════
   Un panel negro con lo mínimo encima: las líneas de la escala, un aro por cada
   escalón que se cruza, y el dedo.

   ── SE BORRA ENTERO EN CADA CUADRO, Y ES UNA DECISIÓN ──
   Lo bonito sería pintar negro al 30 % encima del cuadro anterior: el rastro
   sale gratis. Pero entonces lo que se ve depende de lo que pasó antes, así que
   una captura deja de ser una medición. El rastro sale de la lista de aros y
   del recorrido guardado del dedo, que son datos y se pueden auditar. */

let LZ = null, CX = null, ANC = 0, ALT = 0, PXR = 1;

function lienzoPon(c){
  LZ = c; CX = c.getContext('2d', { alpha: false });
  lienzoMide();
}
function lienzoMide(){
  if (!LZ) return;
  const r = LZ.getBoundingClientRect();
  /* topado en 2: las líneas guía son de un píxel y a densidad 1 salen gruesas,
     pero por encima de 2 se rellena el doble para no ver un solo píxel más */
  PXR = Math.min(2, window.devicePixelRatio || 1);
  ANC = Math.max(1, Math.round(r.width));
  ALT = Math.max(1, Math.round(r.height));
  LZ.width = Math.round(ANC*PXR); LZ.height = Math.round(ALT*PXR);
  if (CX) CX.setTransform(PXR, 0, 0, PXR, 0, 0);
}

function yDeAlt(a){ return (1 - cl(a, 0, 1))*ALT; }
function col(a, l, o){ return 'hsla(' + matizDe(a).toFixed(0) + ',92%,' + l + '%,' + o + ')'; }

/* ── LAS LÍNEAS SE ENCIENDEN DONDE ESTÁ EL DEDO ──
   Todas visibles siempre es una grilla, y una grilla no es un panel negro. Al
   6 % se adivinan; cerca del dedo suben, así que la escala aparece justo cuando
   hace falta y desaparece cuando no. */
function pintaGuias(){
  const n = nGrados(), L = escAct().g.length;
  const fs = Math.max(9, Math.round(ALT*0.0145));
  CX.font = '600 ' + fs + 'px system-ui,sans-serif';
  CX.textBaseline = 'middle';
  for (let i = 0; i < n; i++){
    const a = altDeIdx(i), y = Math.round(yDeAlt(a)) + 0.5;
    const oct = (i % L) === 0;
    let k = oct ? 0.155 : 0.070;
    for (const id in DEDOS){
      const d = DEDOS[id];
      k = Math.max(k, 0.60*Math.max(0, 1 - Math.abs(i - d.idx)/3.2));
    }
    if (JU.on && JU.luz === i) k = Math.max(k, 0.85*cl(JU.luzT/JU_ON, 0, 1));
    if (JU.on && JU.fase === 'turno' && JU.paso < JU.sec.length) k = Math.max(k, oct ? 0.16 : 0.075);
    CX.strokeStyle = col(a, oct ? 74 : 64, k);
    CX.lineWidth = oct ? 1.4 : 1;
    CX.beginPath(); CX.moveTo(0, y); CX.lineTo(ANC, y); CX.stroke();
    if (oct){
      /* ── LA PRIMERA Y LA ÚLTIMA LÍNEA CAEN EN EL BORDE ──
         Con la línea de base centrada, la mitad del nombre queda fuera de la
         pantalla: la de arriba cuelga hacia abajo y la de abajo se apoya. */
      CX.textBaseline = i === n - 1 ? 'top' : i === 0 ? 'bottom' : 'middle';
      CX.fillStyle = col(a, 74, Math.min(0.92, k + 0.12));
      CX.fillText(nombreDeIdx(i), 10, y + (i === n - 1 ? 3 : i === 0 ? -3 : 0));
    }
  }
}

function pintaOndas(){
  CX.globalCompositeOperation = 'lighter';
  const r0 = Math.min(ANC, ALT)*0.44;
  for (const o of ONDAS){
    const u = cl(o.t/o.vida, 0, 1);
    const r = 10 + r0*Math.sqrt(u)*o.k;          /* crece rápido y frena, como una onda */
    const op = (1 - u)*(1 - u)*0.80*o.k;
    if (op < 0.004) continue;
    CX.strokeStyle = col(o.na, 70, op);
    CX.lineWidth = Math.max(0.6, 4.6*(1 - u)*o.k);
    CX.beginPath(); CX.arc(o.nx*ANC, yDeAlt(o.na), r, 0, 6.2832); CX.stroke();
  }
  CX.globalCompositeOperation = 'source-over';
}

function pintaDedo(d){
  const x = d.nx*ANC, y = yDeAlt(altDeIdx(d.idx)), a = altDeIdx(d.idx);
  CX.globalCompositeOperation = 'lighter';

  /* ── LA BARRA ES LO QUE HACE LEGIBLE LA ALTURA ──
      Un punto dice dónde está el dedo; la barra dice en qué nota cayó, que es
      lo que el jugador tiene que poder ver de reojo. */
  const g = CX.createLinearGradient(0, 0, ANC, 0);
  const cerca = col(a, 74, 0.50), lejos = col(a, 74, 0);
  g.addColorStop(0, lejos);
  g.addColorStop(cl(d.nx - 0.42, 0.001, 0.999), lejos);
  g.addColorStop(cl(d.nx, 0.002, 0.998), cerca);
  g.addColorStop(cl(d.nx + 0.42, 0.003, 1), lejos);
  g.addColorStop(1, lejos);
  CX.fillStyle = g;
  CX.fillRect(0, y - 1.5, ANC, 3);

  /* el rastro: por dónde vino el dedo */
  if (d.hist.length > 1){
    for (let i = 1; i < d.hist.length; i++){
      const p = d.hist[i - 1], q = d.hist[i];
      const op = 0.30*(1 - cl(q.t/0.40, 0, 1));
      if (op < 0.006) continue;
      CX.strokeStyle = col(q.na, 68, op);
      CX.lineWidth = 1 + 4.5*(1 - cl(q.t/0.40, 0, 1));
      CX.lineCap = 'round';
      CX.beginPath();
      CX.moveTo(p.nx*ANC, yDeAlt(p.na)); CX.lineTo(q.nx*ANC, yDeAlt(q.na));
      CX.stroke();
    }
  }

  /* el disco, con halo: el radio sale del volumen, que es el eje horizontal */
  const R = Math.min(ANC, ALT)*(0.070 + 0.060*d.vol);
  const rg = CX.createRadialGradient(x, y, 0, x, y, R);
  rg.addColorStop(0, col(a, 96, 1));
  rg.addColorStop(0.16, col(a, 80, 0.78));
  rg.addColorStop(0.42, col(a, 66, 0.30));
  rg.addColorStop(1, col(a, 60, 0));
  CX.fillStyle = rg;
  CX.beginPath(); CX.arc(x, y, R, 0, 6.2832); CX.fill();

  CX.globalCompositeOperation = 'source-over';
}

/* ── LA NOTA QUE EL JUEGO ESTÁ TOCANDO TIENE QUE VERSE, NO ADIVINARSE ──
   En REPETÍ no hay dedo, así que sin esto lo único que queda del sonido es un
   aro que se abre: hay que MIRAR a qué altura nació. El disco es el mismo que
   deja un dedo, o sea que el jugador ve exactamente lo que tiene que repetir. */
function pintaLuz(){
  if (!JU.on || JU.luz < 0 || JU.luzT <= 0) return;
  const a = altDeIdx(JU.luz), x = ANC*0.5, y = yDeAlt(a);
  const k = cl(JU.luzT/JU_ON, 0, 1);
  CX.globalCompositeOperation = 'lighter';
  const R = Math.min(ANC, ALT)*0.115*(0.55 + 0.45*k);
  const rg = CX.createRadialGradient(x, y, 0, x, y, R);
  rg.addColorStop(0, col(a, 96, k));
  rg.addColorStop(0.18, col(a, 82, 0.72*k));
  rg.addColorStop(0.46, col(a, 68, 0.26*k));
  rg.addColorStop(1, col(a, 60, 0));
  CX.fillStyle = rg;
  CX.beginPath(); CX.arc(x, y, R, 0, 6.2832); CX.fill();
  CX.fillStyle = col(a, 78, 0.34*k);
  CX.fillRect(0, y - 1.5, ANC, 3);
  CX.globalCompositeOperation = 'source-over';
}

function pinta(){
  if (!CX) return;
  CX.fillStyle = '#000';
  CX.fillRect(0, 0, ANC, ALT);
  pintaGuias();
  pintaOndas();
  pintaLuz();
  for (const id in DEDOS) pintaDedo(DEDOS[id]);
}

/* ══════════════════ f.js ══════════════════ */
/* ══════════════════════ EL JUEGO ARMADO ══════════════════════
   Entrada, reloj, pantallas e idioma. Nada de esto decide qué suena: eso vive
   en d.js. Acá se junta el dedo con el panel y el panel con la pantalla. */

const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

let LANG = 'en', PANT = 'idioma', CARGANDO = false;
function TT(k){ return (TXT[LANG] || TXT.en)[k] || (TXT.es[k] || k); }
function LI(){ return LANG === 'es' ? 0 : LANG === 'en' ? 1 : 2; }

/* ══════════ PANTALLAS ══════════ */
const PANS = { idioma: '#pIdioma', menu: '#pMenu', ajustes: '#pAjustes',
               instr: '#pInstr', fin: '#pFin' };

function verPantalla(p){
  PANT = p;
  for (const k in PANS) $(PANS[k]).classList.toggle('on', k === p);
  const enJuego = (p === 'panel');
  $('#hudTop').style.display = enJuego ? 'flex' : 'none';
  document.body.classList.toggle('jugando', enJuego && JU.on);
  if (!enJuego){ dedosSoltar(); }
}

let AVT = 0;
function avisa(t, seg){
  const e = $('#avPanel');
  if (!t){ e.classList.remove('on'); AVT = 0; return; }
  e.textContent = t; e.classList.add('on'); AVT = seg === undefined ? 2.2 : seg;
}

/* ══════════ IDIOMA ══════════ */
function ponIdioma(l){
  LANG = (l === 'es' || l === 'en' || l === 'pt') ? l : 'en';
  guarda('lang', LANG);
  document.documentElement.lang = LANG;
  pintaIdioma();
}
function pintaIdioma(){
  $('#iSub').textContent = TT('sub');
  $('#mSub').textContent = TT('sub');
  $('#bLibre').textContent = TT('libre');
  $('#bJuego').textContent = TT('juego');
  $('#bAjustes').textContent = TT('ajustes');
  $('#mPie').textContent = TT('pie') + ' ' + TT('pie2');
  $('#mCred').textContent = TT('credito');
  $('#aTit').textContent = TT('ajustes');
  $('#aSon').textContent = TT('sonido');
  $('#aEsc').textContent = TT('escala');
  $('#aTono').textContent = TT('tono');
  $('#aOct').textContent = TT('octavas');
  $('#aIdi').textContent = TT('idioma');
  $('#bVerInstr').textContent = TT('ver');
  $('#bCerrarCfg').textContent = TT('volver');
  $('#nTit').textContent = TT('instrumento');
  $('#bCerrarInstr').textContent = TT('volver');

function pintaTInst(){

  $('#tInst').textContent = I.nom ? I.nom[LI()] : PAN.inst;
}

/* ══════════ AJUSTES ══════════
   ── LO QUE SE GUARDA PASA POR UNA SOLA PUERTA ──
   Con el `setItem` adentro de cada manejador, el ajuste se guarda sólo por ese
   camino y cambiar el mismo valor desde otro lado no sobrevive a una recarga.
   Ya costó una vuelta en CUBOS. */
function ponEsc(i){ PAN.esc = ((i % ESCALAS.length) + ESCALAS.length) % ESCALAS.length; guarda('esc', PAN.esc); pintaAjustes(); }
function ponTono(i){ PAN.tono = ((i % 12) + 12) % 12; guarda('tono', PAN.tono); pintaAjustes(); }
function ponOct(n){ PAN.oct = cl(n, 1, 3); guarda('oct', PAN.oct); pintaAjustes(); }
function ponSon(v){ sonidoOn(v); guarda('son', v ? 1 : 0); pintaAjustes(); }
function ponInst(id){
  if (!POR_ID[id]) return;
  dedosSoltar();
  PAN.inst = id; guarda('inst', id);
  pintaTInst(); pintaInstr();
  cargaInstr(id).then(() => { if (PANT === 'instr') pico(id, midiDeIdx(Math.floor(nGrados()/2)), 0.6, 0.7); });
}

function chip(txt, sel, fn){
  const b = document.createElement('button');
  b.className = 'op' + (sel ? ' sel' : ''); b.textContent = txt;
  b.addEventListener('click', fn);
  return b;
}
function paso(el, txt, menos, mas){
  el.innerHTML = '';
  el.appendChild(chip('‹', false, menos));
  const m = document.createElement('div');
  m.className = 'op sel'; m.style.minWidth = '38%'; m.textContent = txt;
  el.appendChild(m);
  el.appendChild(chip('›', false, mas));
}
function pintaAjustes(){
  const s = $('#oSon'); s.innerHTML = '';
  s.appendChild(chip('ON', SON_ON, () => ponSon(true)));
  s.appendChild(chip('OFF', !SON_ON, () => ponSon(false)));
  paso($('#oEsc'), escAct().n[LI()], () => ponEsc(PAN.esc - 1), () => ponEsc(PAN.esc + 1));
  paso($('#oTono'), NOTA_NOM[PAN.tono], () => ponTono(PAN.tono - 1), () => ponTono(PAN.tono + 1));
  const o = $('#oOct'); o.innerHTML = '';
  for (const n of [1, 2, 3]) o.appendChild(chip(String(n), PAN.oct === n, () => ponOct(n)));
  const i = $('#oIdi'); i.innerHTML = '';
  for (const l of ['es', 'en', 'pt']) i.appendChild(chip(l.toUpperCase(), LANG === l, () => ponIdioma(l)));
}

/* ══════════ EL SELECTOR DE INSTRUMENTO ══════════ */
let FAM = 0;
function pintaInstr(){
  const p = $('#pestanas'); p.innerHTML = '';
  FAMS.forEach((f, k) => p.appendChild(chip(f[1][LI()], FAM === k, () => { FAM = k; pintaInstr(); })));
  const l = $('#lista'); l.innerHTML = '';
  const fam = FAMS[FAM][0];
  for (const I of INSTRS){
    if (I.fam !== fam) continue;
    const b = document.createElement('button');
    b.className = 'ins' + (I.id === PAN.inst ? ' sel' : '');
    const n = document.createElement('span'); n.textContent = I.nom[LI()];
    const s = document.createElement('small'); s.textContent = I.sost ? '~' : '·';
    b.appendChild(n); b.appendChild(s);
    b.addEventListener('click', () => ponInst(I.id));
    l.appendChild(b);
  }
}

/* ══════════ EL HUD DE REPETÍ ══════════ */
function pintaJuego(){
  if (!JU.on) return;
  const f = JU.fase;
  $('#jFase').textContent = f === 'muestra' ? TT('escuchá') : f === 'turno' ? TT('repetí')
                          : f === 'bien' ? TT('listo') : f === 'fin' ? TT('mal') : '';
  $('#jRonda').textContent = TT('ronda') + ' ' + JU.ronda + ' · ' + TT('notas') + ' ' + JU.sec.length;
  const p = $('#jPuntos'); p.innerHTML = '';
  for (let i = 0; i < JU.sec.length; i++){
    const d = document.createElement('div');
    d.className = 'pt' + ((f === 'turno' && i < JU.paso) || f === 'bien' ? ' ok' : '');
    p.appendChild(d);
  }
}

/* ══════════ ENTRAR A JUGAR ══════════ */
function entra(conJuego){
  const ac = audioDespierta();
  verPantalla('panel');
  /* un panel que no suena no es este juego: hay que decirlo, no dejar que el
     jugador crea que no le está tocando bien */
  if (!ac){ avisa(TT('sinSon'), 6); }
  FASE_ANT = ''; PASO_ANT = -1;
  if (conJuego){ juegoArranca(); document.body.classList.add('jugando'); pintaJuego(); }
  else { juegoCorta(); document.body.classList.remove('jugando'); }
  const listo = !ac || !!BUF[PAN.inst + '|' + instAct().m[0].n];
  if (!listo){
    CARGANDO = true; avisa(TT('cargando'), 30);
    cargaInstr(PAN.inst).then(() => { CARGANDO = false; avisa(conJuego ? '' : TT('toca'), 2.0); });
  } else avisa(conJuego ? '' : TT('toca'), 2.0);
}
function alMenu(){
  juegoCorta(); document.body.classList.remove('jugando');
  apagaTodo(); avisa('');
  verPantalla('menu');
}

/* ══════════ EL DEDO ══════════ */
const LZE = $('#lz');
const ACTIVOS = {};
function coord(e){
  const r = LZE.getBoundingClientRect();
  return { nx: cl((e.clientX - r.left)/Math.max(1, r.width), 0, 1),
           na: cl(1 - (e.clientY - r.top)/Math.max(1, r.height), 0, 1) };
}
LZE.addEventListener('pointerdown', e => {
  if (PANT !== 'panel') return;
  e.preventDefault();
  audioDespierta();
  try { LZE.setPointerCapture(e.pointerId); } catch (x) {}
  const c = coord(e);
  ACTIVOS[e.pointerId] = 1;
  dedoAbajo(e.pointerId, c.nx, c.na);
  if (JU.on) pintaJuego();
  if (AVT > 0) avisa('');
});
/* ── EL SEGUIMIENTO CUELGA DE LA VENTANA Y NO DEL LIENZO ──
   `setPointerCapture` puede fallar, y un dedo que sale del lienzo —a la franja
   de arriba, por ejemplo— deja de mandar eventos al elemento: la nota se queda
   sonando para siempre. */
window.addEventListener('pointermove', e => {
  if (!ACTIVOS[e.pointerId]) return;
  const c = coord(e);
  dedoMueve(e.pointerId, c.nx, c.na);
}, { passive: true });
function suelta(e){
  if (!ACTIVOS[e.pointerId]) return;
  delete ACTIVOS[e.pointerId];
  dedoArriba(e.pointerId);
}
window.addEventListener('pointerup', suelta);
window.addEventListener('pointercancel', suelta);
LZE.addEventListener('contextmenu', e => e.preventDefault());
/* irse de la pestaña con un dedo apoyado dejaba la nota sonando */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ for (const k in ACTIVOS) delete ACTIVOS[k]; dedosSoltar(); apagaTodo(); }
});

/* ══════════ BOTONES ══════════ */
$$('#pIdioma [data-lang]').forEach(b => b.addEventListener('click', () => {
  audioDespierta(); ponIdioma(b.getAttribute('data-lang')); verPantalla('menu');
}));
$('#bLibre').addEventListener('click', () => entra(false));
$('#bJuego').addEventListener('click', () => entra(true));
$('#bAjustes').addEventListener('click', () => verPantalla('ajustes'));
$('#bCerrarCfg').addEventListener('click', () => verPantalla('menu'));
$('#bVerInstr').addEventListener('click', () => { verPantalla('instr'); pintaInstr(); });
$('#bCerrarInstr').addEventListener('click', () => verPantalla('ajustes'));
$('#bVolver').addEventListener('click', alMenu);
$('#bCfg').addEventListener('click', () => { dedosSoltar(); verPantalla('ajustes'); });
$('#bOtra').addEventListener('click', () => entra(true));
$('#bAlMenu').addEventListener('click', alMenu);

/* ══════════ EL RELOJ ══════════
   Paso fijo: el ritmo con el que REPETÍ toca la secuencia no puede depender de
   cuántos cuadros dé el aparato. */
const PASO = 1/60;
let ACUM = 0, ULT = 0, FASE_ANT = '', PASO_ANT = -1, TOCANDO = false, SONANDO = false;
/* ── CONGELAR ES QUE NADA AVANCE, PERO SE SIGA DIBUJANDO ──
   Sin esto, una sonda planta un instante y el cuadro siguiente lo devuelve a su
   sitio: la foto sale de otro momento. Ya costó una vuelta en tres juegos. */
let CONG = false;
function bucle(t){
  requestAnimationFrame(bucle);
  const dt = ULT ? Math.min(0.25, (t - ULT)/1000) : 0;
  ULT = t;
  ACUM += dt;
  let n = 0;
  while (ACUM >= PASO && n++ < 8){
    ACUM -= PASO;
    if (CONG) continue;
    panelPaso(PASO);
    juegoPaso(PASO);
    if (AVT > 0){ AVT -= PASO; if (AVT <= 0) avisa(''); }
  }
  if (JU.on && JU.fase !== FASE_ANT){
    FASE_ANT = JU.fase;
    pintaJuego();
    if (JU.fase === 'fin'){
      $('#fNum').textContent = String(JU.ronda);
      $('#fRec').textContent = TT('mejor') + ' ' + JU.rec;
      dedosSoltar();
      setTimeout(() => { if (JU.fase === 'fin') verPantalla('fin'); }, 900);
    }
  }
  /* repintar los puntitos en cada cuadro es reconstruir DOM sesenta veces por
     segundo para escribir lo mismo: sólo cuando el paso cambió */
  if (JU.on && JU.fase === 'turno' && JU.paso !== PASO_ANT){ PASO_ANT = JU.paso; pintaJuego(); }
  const td = nDedos() > 0;
  if (td !== TOCANDO){ TOCANDO = td; document.body.classList.toggle('tocando', td); }
  const sn = JU.on && JU.luzT > 0;
  if (sn !== SONANDO){ SONANDO = sn; document.body.classList.toggle('sonando', sn); }
  if (PANT === 'panel') pinta();
}

/* ══════════ ARRANQUE ══════════ */
function arranca(){
  lienzoPon(LZE);
  window.addEventListener('resize', lienzoMide);
  window.addEventListener('orientationchange', () => setTimeout(lienzoMide, 120));
  PAN.esc  = cl(Math.round(leeN('esc', 0)), 0, ESCALAS.length - 1);
  PAN.tono = cl(Math.round(leeN('tono', 0)), 0, 11);
  PAN.oct  = cl(Math.round(leeN('oct', OCTAVAS)), 1, 3);
  const gi = lee('inst', PAN.inst);
  if (POR_ID[gi]) PAN.inst = gi;
  SON_ON = leeN('son', 1) !== 0;
  const li = lee('lang', null);
  ponIdioma(li || ((navigator.language || 'en').slice(0, 2)));
  if (li) verPantalla('menu');
  requestAnimationFrame(bucle);
}
arranca();

/* ══════════════════════ SONDAS ══════════════════════
   Una afirmación sin número no vale. Todo lo que se pueda comprobar entra por
   acá, y por el MISMO camino que usa el dedo: los toques se despachan como
   PointerEvent de verdad sobre el lienzo, no llamando a `dedoAbajo`. */
window.__errs = [];
window.addEventListener('error', e => window.__errs.push(String(e.message || e)));
window.addEventListener('unhandledrejection', e => window.__errs.push('rej: ' + String(e.reason)));

const esp = ms => new Promise(r => setTimeout(r, ms));
function rectPx(nx, na){
  const r = LZE.getBoundingClientRect();
  return { x: r.left + nx*r.width, y: r.top + (1 - na)*r.height };
}
function pev(tipo, id, nx, na){
  const p = rectPx(nx, na);
  LZE.dispatchEvent(new PointerEvent(tipo, { pointerId: id, pointerType: 'touch',
    isPrimary: true, clientX: p.x, clientY: p.y, bubbles: true, cancelable: true }));
  if (tipo !== 'pointerdown'){
    window.dispatchEvent(new PointerEvent(tipo, { pointerId: id, pointerType: 'touch',
      clientX: p.x, clientY: p.y, bubbles: true }));
  }
}

window.__T = {
  estado(){
    return { pant: PANT, lang: LANG, inst: PAN.inst, esc: escAct().id, tono: PAN.tono,
             oct: PAN.oct, grados: nGrados(), son: SON_ON, dedos: nDedos(),
             ondas: ONDAS.length, voces: VOCES.length, cargando: CARGANDO,
             ju: { on: JU.on, fase: JU.fase, ronda: JU.ronda, sec: JU.sec.slice(),
                   paso: JU.paso, rec: JU.rec } };
  },
  marco(){
    const m = document.getElementById('marco').getBoundingClientRect();
    const l = LZE.getBoundingClientRect();
    return { marco: [Math.round(m.width), Math.round(m.height)],
             lienzo: [Math.round(l.width), Math.round(l.height)],
             buffer: [LZ.width, LZ.height], pxr: PXR, ven: [innerWidth, innerHeight] };
  },
  /* ── EL MAPA DE ALTURAS, AUDITADO ──
     Que ninguna nota se salga del panel y que subir el dedo suba SIEMPRE la
     nota es una propiedad del mapa, no del dibujo: se comprueba sin navegador. */
  audita(){
    const g = PAN.esc, t = PAN.tono, o = PAN.oct, malos = [];
    let tot = 0;
    for (let e = 0; e < ESCALAS.length; e++){
      for (let oc = 1; oc <= 3; oc++){
        PAN.esc = e; PAN.oct = oc;
        const n = nGrados(); let ant = -1e9;
        for (let i = 0; i < n; i++){
          const m = midiDeIdx(i); tot++;
          if (!isFinite(m) || m < 12 || m > 108) malos.push([ESCALAS[e].id, oc, i, m, 'rango']);
          else if (m <= ant) malos.push([ESCALAS[e].id, oc, i, m, 'no sube']);
          ant = m;
        }
        /* el borde de arriba tiene que ser la octava exacta */
        if (midiDeIdx(n - 1) - midiDeIdx(0) !== 12*oc) malos.push([ESCALAS[e].id, oc, 'alcance']);
        /* y la altura del dedo tiene que devolver el mismo escalón */
        for (let i = 0; i < n; i++) if (idxDeAlt(altDeIdx(i)) !== i) malos.push([ESCALAS[e].id, oc, i, 'ida y vuelta']);
      }
    }
    PAN.esc = g; PAN.oct = o; PAN.tono = t;
    return { probados: tot, malos: malos.slice(0, 12), n: malos.length };
  },
  mapa(){
    const n = nGrados(), a = [];
    for (let i = 0; i < n; i++) a.push([i, +altDeIdx(i).toFixed(4), midiDeIdx(i), nombreDeIdx(i)]);
    return a;
  },
  /* ── EL DIBUJO Y EL TOQUE TIENEN QUE CAER EN EL MISMO SITIO ──
     Si la línea se pinta a una altura y el dedo dispara otra nota ahí, el
     jugador no puede confiar en lo que ve. */
  alinea(){
    const n = nGrados(), r = LZE.getBoundingClientRect(), mal = [];
    for (let i = 0; i < n; i++){
      const y = yDeAlt(altDeIdx(i));                 /* donde se dibuja la línea */
      const na = 1 - y/Math.max(1, r.height);        /* la altura de un dedo puesto ahí */
      if (idxDeAlt(na) !== i) mal.push([i, +y.toFixed(1), idxDeAlt(na)]);
    }
    return { n, mal, ok: mal.length === 0 };
  },
  ir(p){ verPantalla(p); return PANT; },
  lang(l){ ponIdioma(l); return LANG; },
  cfg(k, v){
    if (k === 'esc') ponEsc(v); else if (k === 'tono') ponTono(v);
    else if (k === 'oct') ponOct(v); else if (k === 'son') ponSon(!!v);
    else if (k === 'inst') ponInst(v);
    return this.estado();
  },
  entra(j){ entra(!!j); return PANT; },
  /* ── EL DEDO DE VERDAD ── */
  toca(nx, na, id){ pev('pointerdown', id || 1, nx, na); return this.dedos(); },
  arrastra(nx, na, id){ pev('pointermove', id || 1, nx, na); return this.dedos(); },
  suelta(id){ pev('pointerup', id || 1, 0.5, 0.5); return this.dedos(); },
  dedos(){
    const a = [];
    for (const k in DEDOS){ const d = DEDOS[k];
      a.push({ id: k, nx: +d.nx.toFixed(3), na: +d.na.toFixed(3), idx: d.idx,
               midi: midiDeIdx(d.idx), nota: nombreDeIdx(d.idx), vol: +d.vol.toFixed(3),
               bri: +d.bri.toFixed(3), tipo: d.v ? d.v.tipo : 'sin voz',
               rate: d.v && d.v.src && d.v.src.playbackRate ? +d.v.src.playbackRate.value.toFixed(4) : null,
               hist: d.hist.length });
    }
    return a;
  },
  /* un deslizamiento entero, y lo que importa es que NO abra voces nuevas */
  async desliza(a, b, n, ms){
    n = n || 12; ms = ms || 220;
    /* ── EL PROBE TIENE QUE MIRAR SU PROPIO DEDO ──
       Con otro dedo ya apoyado, `dedos()[0]` es el de ANTES: el deslizamiento
       daba «un escalón» y parecía que la nota no seguía a la mano. */
    const mio = () => this.dedos().filter(d => d.id === '9')[0];
    pev('pointerdown', 9, 0.5, a);
    const v0 = VOCES.length, ini = mio();
    const vis = [];
    for (let i = 1; i <= n; i++){
      await esp(ms/n);
      pev('pointermove', 9, 0.5, a + (b - a)*i/n);
      const d = mio(); if (d) vis.push(d.idx);
    }
    const fin = mio(), vf = VOCES.length;
    pev('pointerup', 9, 0.5, b);
    return { desde: ini, hasta: fin, vocesAlEmpezar: v0, vocesAlLlegar: vf,
             escalones: vis.filter((x, i) => i === 0 || x !== vis[i-1]).length };
  },
  /* ══════════ AUDIO ══════════ */
  audio(){
    return { ac: AC ? AC.state : 'no', sr: AC ? AC.sampleRate : 0, son: SON_ON,
             voces: VOCES.length, mae: MAE ? +MAE.gain.value.toFixed(3) : null,
             cargados: Object.keys(BUF).length };
  },
  async carga(id){
    audioDespierta();
    const t = performance.now();
    const ok = await cargaInstr(id || PAN.inst);
    const I = POR_ID[id || PAN.inst];
    return { id: id || PAN.inst, ok, ms: Math.round(performance.now() - t),
             muestras: I ? I.m.filter(m => !!BUF[I.id + '|' + m.n]).length : 0,
             lp: I ? I.m.map(m => m.lp ? 1 : 0) : [] };
  },
  async cargaTodos(){
    audioDespierta();
    let ok = 0, mal = [];
    for (const I of INSTRS){
      const r = await cargaInstr(I.id);
      const n = I.m.filter(m => !!BUF[I.id + '|' + m.n]).length;
      if (r && n === I.m.length) ok++; else mal.push([I.id, n]);
    }
    return { instrumentos: INSTRS.length, ok, mal, buffers: Object.keys(BUF).length };
  },
  /* nivel medido en el maestro, que es lo único que prueba que sonó */
  async nivel(ms){
    if (!ANA) return null;
    const n = ANA.fftSize, d = new Float32Array(n);
    let pico = 0, s = 0, c = 0, t = performance.now();
    while (performance.now() - t < (ms || 700)){
      ANA.getFloatTimeDomainData(d);
      for (let i = 0; i < n; i++){ const v = Math.abs(d[i]); if (v > pico) pico = v; s += d[i]*d[i]; c++; }
      await esp(16);
    }
    return { pico: +pico.toFixed(4), rms: +Math.sqrt(s/Math.max(1, c)).toFixed(4) };
  },
  son(id, midi, dur){ audioDespierta(); const v = pico(id || PAN.inst, midi === undefined ? 60 : midi, dur || 0.5); return v ? v.tipo : 'nada'; },
  /* ══════════ DIBUJO ══════════ */
  pinta(){ pinta(); return true; },
  brillo(){
    pinta();
    const d = CX.getImageData(0, 0, LZ.width, LZ.height).data;
    const F = 5, fr = new Array(F).fill(0), fc = new Array(F).fill(0);
    let s = 0, mx = 0, on = 0, n = 0;
    for (let y = 0; y < LZ.height; y += 2) for (let x = 0; x < LZ.width; x += 2){
      const i = (y*LZ.width + x)*4;
      const l = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      s += l; n++; if (l > mx) mx = l; if (l > 8) on++;
      const f = Math.min(F - 1, Math.floor(y/LZ.height*F)); fr[f] += l; fc[f]++;
    }
    return { medio: +(s/n).toFixed(2), max: Math.round(mx), pctOn: +(100*on/n).toFixed(2),
             franjas: fr.map((v, i) => +(v/Math.max(1, fc[i])).toFixed(2)) };
  },
  /* ══════════ EL HUD ══════════ */
  solapes(){
    const ids = ['bVolver', 'tInst', 'bCfg', 'jPuntos', 'jFase', 'jRonda', 'avPanel'];
    const c = [];
    const v = ids.map(i => document.getElementById(i)).filter(e => {
      if (!e) return false;
      const r = e.getBoundingClientRect();
      const s = getComputedStyle(e);
      return r.width > 1 && r.height > 1 && s.display !== 'none' && s.visibility !== 'hidden' && +s.opacity > 0.05;
    });
    for (let i = 0; i < v.length; i++) for (let j = i + 1; j < v.length; j++){
      const a = v[i].getBoundingClientRect(), b = v[j].getBoundingClientRect();
      if (a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom)
        c.push(v[i].id + '×' + v[j].id);
    }
    return { n: v.length, choques: c };
  },
  panel(sel){
    const p = document.querySelector(sel);
    if (!p) return null;
    const pr = p.getBoundingClientRect();
    const hs = Array.prototype.slice.call(p.children).filter(e => {
      const r = e.getBoundingClientRect(); return r.height > 1 && getComputedStyle(e).display !== 'none';
    });
    const cajas = hs.map(e => { const r = e.getBoundingClientRect(); return [e.id || e.className, Math.round(r.top), Math.round(r.bottom)]; });
    const c = [];
    for (let i = 0; i < hs.length; i++) for (let j = i + 1; j < hs.length; j++){
      const a = hs[i].getBoundingClientRect(), b = hs[j].getBoundingClientRect();
      if (a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5) c.push(i + '×' + j);
    }
    const alto = hs.length ? hs[hs.length-1].getBoundingClientRect().bottom - hs[0].getBoundingClientRect().top : 0;
    return { visible: getComputedStyle(p).display !== 'none', n: hs.length,
             alto: Math.round(alto), marco: Math.round(pr.height),
             entra: alto <= pr.height, choques: c, cajas };
  },
  textos(){
    const o = {};
    for (const i of ['iSub','mSub','bLibre','bJuego','bAjustes','mPie','mCred','aTit','aSon',
                     'aEsc','aTono','aOct','aIdi','bVerInstr','bCerrarCfg','nTit','fTit',
                     'bOtra','bAlMenu','tInst','jFase','jRonda']){
      const e = document.getElementById(i); if (e) o[i] = e.textContent;
    }
    return o;
  },
  instrs(){ return INSTRS.map(I => [I.id, I.fam, I.base, I.sost, I.nom[LI()], I.m.map(m => m.n)]); },
  /* ══════════ REPETÍ, JUGADO SOLO ══════════
     Toca la secuencia bien, por el mismo camino que un dedo, y devuelve hasta
     dónde llegó. Un modo de juego que nadie terminó de punta a punta es un modo
     roto que todavía no se sabe. */
  congela(v){ CONG = !!v; return CONG; },
  /* ── UN INSTRUMENTO QUE SUENA LA MITAD QUE OTRO ES UN DEFECTO ──
     Las noventa y seis muestras se hornearon a la misma energía media; esto
     comprueba que eso llega al juego y no se pierde en el camino. */
  async niveles(ids){
    audioDespierta();
    const r = [];
    for (const id of (ids || INSTRS.map(I => I.id))){
      await cargaInstr(id);
      apagaTodo(); await esp(120);
      const v = abre(id, POR_ID[id].base + 12, 0.8, 0.85);
      const n = await this.nivel(520);
      apaga(v, 0.05); await esp(160);
      r.push([id, n.pico, n.rms, v ? v.tipo : 'nada']);
    }
    const rms = r.map(x => x[2]);
    return { n: r.length, min: Math.min.apply(null, rms), max: Math.max.apply(null, rms),
             media: +(rms.reduce((a, b) => a + b, 0)/rms.length).toFixed(4), filas: r };
  },
  /* espera a que la secuencia esté sonando una nota y CONGELA, para poder
     fotografiar ese instante y no el de tres cuadros después */
  async esperaLuz(ms){
    const t = performance.now();
    while (performance.now() - t < (ms || 4000)){
      if (JU.on && JU.luz >= 0 && JU.luzT > 0.30){
        CONG = true; pinta();
        return { luz: JU.luz, luzT: +JU.luzT.toFixed(3), alt: +altDeIdx(JU.luz).toFixed(3),
                 y: Math.round(yDeAlt(altDeIdx(JU.luz))), fase: JU.fase, congelado: CONG };
      }
      await esp(8);
    }
    return null;
  },
  async jugaSolo(rondas, malAdrede){
    entra(true);
    await esp(60);
    let g = 0;
    while (JU.on && JU.fase !== 'fin' && JU.ronda <= (rondas || 6) && g++ < 4000){
      if (JU.fase === 'turno'){
        const i = JU.sec[JU.paso];
        const mal = malAdrede && JU.ronda === malAdrede;
        const idx = mal ? (i + 1) % nGrados() : i;
        pev('pointerdown', 20, 0.5, altDeIdx(idx));
        await esp(45);
        pev('pointerup', 20, 0.5, altDeIdx(idx));
        await esp(55);
      } else await esp(40);
    }
    return { ronda: JU.ronda, fase: JU.fase, sec: JU.sec.length, rec: JU.rec, vueltas: g };
  }
};
