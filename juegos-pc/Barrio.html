      if (z < z0 || z > z0 + LOTE) continue;
      const dentro = (x > x0 + VEREDA && x < x0 + LOTE - VEREDA &&
                      z > z0 + VEREDA && z < z0 + LOTE - VEREDA);
      return dentro ? 0.162 : 0.15;
    }
    break;
  }
  return 0;
}

/* ── EL CHOQUE ──
   Todas las cajas están alineadas a los ejes —el barrio es un damero, así que
   no hay una sola pared en diagonal— y por eso alcanza con un círculo contra un
   rectángulo. Lo que sí hace falta es no probar las MIL cajas en cada cuadro:
   se indexan por cuadra y sólo se prueban las de las cuadras de al lado.
   Y SE RESUELVE EJE POR EJE, que es lo que hace que uno se DESLICE por la pared
   en vez de quedarse clavado: empujando por el eje de menor penetración, entrar
   en diagonal a un cerco te deja caminando a lo largo del cerco. */
const REJILLA = new Map();
function claveCelda(x, z){
  return ((Math.floor((x + MITAD) / PASO)) * 97 + Math.floor((z + MITAD) / PASO));
}
function indexaColisiones(){
  for (const c of COLIS){
    const i0 = Math.floor((c.x0 + MITAD) / PASO), i1 = Math.floor((c.x1 + MITAD) / PASO);
    const j0 = Math.floor((c.z0 + MITAD) / PASO), j1 = Math.floor((c.z1 + MITAD) / PASO);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++){
      const k = i * 97 + j;
      if (!REJILLA.has(k)) REJILLA.set(k, []);
      REJILLA.get(k).push(c);
    }
  }
}
const RADIO = 0.42;
function corrige(){
  const i = Math.floor((JUG.x + MITAD) / PASO), j = Math.floor((JUG.z + MITAD) / PASO);
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++){
    const lista = REJILLA.get((i+di) * 97 + (j+dj));
    if (!lista) continue;
    for (const c of lista){
      const px = cl(JUG.x, c.x0, c.x1), pz = cl(JUG.z, c.z0, c.z1);
      const dx = JUG.x - px, dz = JUG.z - pz;
      const d2 = dx*dx + dz*dz;
      if (d2 > RADIO*RADIO) continue;
      if (d2 > 1e-8){
        const d = Math.sqrt(d2);
        JUG.x = px + dx/d*RADIO; JUG.z = pz + dz/d*RADIO;
      } else {
        /* adentro de la caja: se sale por el lado más cerca, que es lo único
           que no lo teletransporta al otro extremo del barrio */
        const iz = JUG.x - c.x0, de = c.x1 - JUG.x, ar = JUG.z - c.z0, ab = c.z1 - JUG.z;
        const m = Math.min(iz, de, ar, ab);
        if (m === iz) JUG.x = c.x0 - RADIO; else if (m === de) JUG.x = c.x1 + RADIO;
        else if (m === ar) JUG.z = c.z0 - RADIO; else JUG.z = c.z1 + RADIO;
      }
    }
  }
  JUG.x = cl(JUG.x, -MITAD + 1.2, MITAD - 1.2);
  JUG.z = cl(JUG.z, -MITAD + 1.2, MITAD - 1.2);
}

/* ── ENTRADAS ── */
const teclas = {};
let corre = false;
let linterna = null;
addEventListener('keydown', e => {
  teclas[e.code] = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') corre = true;
  if (e.code === 'KeyF') ponLinterna(!CFG.linterna);
  if (e.code === 'Escape' && MODO === 'juego') pausa(!PAUSA);
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => {
  teclas[e.code] = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') corre = false;
});

/* ── PC O TELÉFONO ──
   Y NO SE ADIVINA DE UNA VEZ Y PARA SIEMPRE. Chrome de Android dispara un
   `mousemove` sintético después de cada toque, así que detectando «hay ratón»
   a la primera, un teléfono pasa a modo PC y se queda sin joystick. Un
   `mousemove` sólo cuenta si movió de verdad Y si no viene pegado a un toque.
   Ya costó una vuelta en Eco. */
let esPC = !matchMedia('(pointer:coarse)').matches;
let ultimoToque = 0, mx = 0, my = 0;
function modoPC(v){
  esPC = v;
  document.body.classList.toggle('pc', v);
}
modoPC(esPC);
addEventListener('mousemove', e => {
  if (performance.now() - ultimoToque < 1200) return;
  if (Math.abs(e.movementX) + Math.abs(e.movementY) < 1) return;
  if (!esPC) modoPC(true);
  if (MODO === 'juego' && !PAUSA && document.pointerLockElement){
    JUG.yaw -= e.movementX * 0.0022;
    JUG.pitch = cl(JUG.pitch - e.movementY * 0.0022, -1.15, 1.05);
  }
});
ren.domElement.addEventListener('click', () => {
  if (MODO === 'juego' && !PAUSA && esPC && !document.pointerLockElement)
    ren.domElement.requestPointerLock();
});

/* el joystick, a la izquierda; mirar, arrastrando en cualquier otro lado */
const movV = { x: 0, y: 0 };
let joyId = -1, mirId = -1, mirX = 0, mirY = 0, joyBruto = 0;
const jc = $('joy').querySelector('canvas'), jg = jc.getContext('2d');
/* CON EL CUADRO GIRADO, `getBoundingClientRect` DEVUELVE LA CAJA ALINEADA A LOS
   EJES, que para un joystick redondo es el cuadrado equivocado. Hay que
   deshacer la rotación a mano: es la misma corrección que costó una vuelta en
   Eco. */
function aCuadro(px, py){
  if (!GIRADO) return [px, py];
  return [(py - innerHeight/2) + W/2, H2/2 - (px - innerWidth/2)];
}
function dCuadro(dx, dy){ return GIRADO ? [dy, -dx] : [dx, dy]; }
function joyRect(){
  const e = $('joy');
  return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight };
}
addEventListener('touchstart', ev => {
  ultimoToque = performance.now();
  if (esPC) modoPC(false);
  for (const t of ev.changedTouches){
    const [lx, ly] = aCuadro(t.clientX, t.clientY);
    const r = joyRect();
    if (joyId < 0 && lx >= r.x - 26 && lx <= r.x + r.w + 26 && ly >= r.y - 26 && ly <= r.y + r.h + 26){
      joyId = t.identifier; movJoy(lx, ly);
    } else if (mirId < 0){ mirId = t.identifier; mirX = t.clientX; mirY = t.clientY; }
  }
}, { passive: true });
addEventListener('touchmove', ev => {
  for (const t of ev.changedTouches){
    if (t.identifier === joyId){ const [lx, ly] = aCuadro(t.clientX, t.clientY); movJoy(lx, ly); }
    else if (t.identifier === mirId){
      const [dx, dy] = dCuadro(t.clientX - mirX, t.clientY - mirY);
      mirX = t.clientX; mirY = t.clientY;
      JUG.yaw -= dx * 0.0052;
      JUG.pitch = cl(JUG.pitch - dy * 0.0052, -1.15, 1.05);
    }
  }
}, { passive: true });
const suelta = ev => {
  for (const t of ev.changedTouches){
    if (t.identifier === joyId){ joyId = -1; movV.x = movV.y = 0; joyBruto = 0; }
    if (t.identifier === mirId) mirId = -1;
  }
};
addEventListener('touchend', suelta, { passive: true });
addEventListener('touchcancel', suelta, { passive: true });
function movJoy(lx, ly){
  const r = joyRect();
  const cx = r.x + r.w/2, cy = r.y + r.h/2, R = r.w * 0.40;
  let dx = (lx - cx) / R, dy = (ly - cy) / R;
  /* SE GUARDA LA DESVIACIÓN EN BRUTO ANTES DE RECORTARLA. El umbral de correr
     mira ese número: con la desviación ya recortada, llevar el pulgar al borde
     —que es lo que hace cualquiera para caminar normal— dejaría al jugador
     corriendo siempre. Correr es empujar MÁS ALLÁ del aro. */
  joyBruto = Math.hypot(dx, dy);
  if (joyBruto > 1){ dx /= joyBruto; dy /= joyBruto; }
  movV.x = dx; movV.y = dy;
}
function joyDibuja(){
  const n = 300, c = n/2, R = n/2 - 12;
  jg.clearRect(0, 0, n, n);
  jg.strokeStyle = 'rgba(160,200,240,.42)'; jg.lineWidth = 3;
  jg.beginPath(); jg.arc(c, c, R, 0, 6.283); jg.stroke();
  jg.fillStyle = 'rgba(150,195,240,.20)';
  jg.beginPath(); jg.arc(c + movV.x*R*0.55, c + movV.y*R*0.55, 40, 0, 6.283); jg.fill();
  jg.strokeStyle = 'rgba(200,226,250,.72)'; jg.lineWidth = 2.4;
  jg.beginPath(); jg.arc(c + movV.x*R*0.55, c + movV.y*R*0.55, 40, 0, 6.283); jg.stroke();
}

/* ── LA LINTERNA ──
   Un `SpotLight` colgado de la cámara. Y cuelga de la CÁMARA y no de la escena
   porque si no habría que copiarle la posición y el rumbo todos los cuadros, y
   ahí siempre queda un cuadro de atraso: la luz apuntaría a donde uno miraba
   hace dieciséis milisegundos, que se ve como que el haz «persigue» la vista. */
function ponLinterna(v){
  CFG.linterna = v;
  if (!linterna){
    linterna = new T.SpotLight(0xffeccd, 0, 34, 0.42, 0.55, 1.4);
    linterna.position.set(0.18, -0.12, 0);
    linterna.target.position.set(0, 0, -1);
    cam.add(linterna); cam.add(linterna.target);
    escena.add(cam);
  }
  linterna.intensity = v ? 34 : 0;
  $('acLinterna').classList.toggle('on', v);
  aviso(TX(v ? 'aLinternaOn' : 'aLinternaOff'));
  son('clic', 0.7);
}

/* ── LA FÍSICA ──
   Con aceleración y roce, y el roce se aplica SÓLO a la componente de costado
   mientras se pide movimiento. Sumando la aceleración al vector y topando la
   velocidad total, doblar FRENA —la velocidad vieja y la nueva se recortan
   juntas— y el tope real queda por debajo del ajuste. Es la corrección que en
   Eco convirtió el movimiento en el de un tirador. */
const ACEL = 42, ROCE = 11;
function fisica(dt){
  const ade = { x: -Math.sin(JUG.yaw), z: -Math.cos(JUG.yaw) };
  const der = { x: -ade.z, z: ade.x };
  let mx2 = 0, mz2 = 0;
  if (teclas.KeyW) mz2 += 1; if (teclas.KeyS) mz2 -= 1;
  if (teclas.KeyD) mx2 += 1; if (teclas.KeyA) mx2 -= 1;
  if (!esPC){ mx2 += movV.x; mz2 -= movV.y; }
  const m = Math.hypot(mx2, mz2);
  if (m > 1){ mx2 /= m; mz2 /= m; }
  const pide = m > 0.06;
  const rapido = corre || joyBruto > 1.32;
  const tope = (rapido ? CORRE : VEL) * (esPC ? 1 : Math.min(1, Math.max(m, 0.34)));

  const dx = ade.x*mz2 + der.x*mx2, dz = ade.z*mz2 + der.z*mx2;
  const dl = Math.hypot(dx, dz) || 1;
  const ux = dx/dl, uz = dz/dl;
  if (pide){
    const proy = JUG.vx*ux + JUG.vz*uz;
    const falta = tope - proy;
    if (falta > 0){
      const a = Math.min(ACEL*dt, falta);
      JUG.vx += ux*a; JUG.vz += uz*a;
    }
    /* el roce, sólo de costado: es lo que deja que doblar no frene */
    const lx = -uz, lz = ux;
    const lat = JUG.vx*lx + JUG.vz*lz;
    const f = lat * Math.min(1, ROCE*dt);
    JUG.vx -= lx*f; JUG.vz -= lz*f;
  } else {
    const f = Math.min(1, ROCE*dt);
    JUG.vx -= JUG.vx*f; JUG.vz -= JUG.vz*f;
  }
  JUG.x += JUG.vx*dt; JUG.z += JUG.vz*dt;
  corrige();
  JUG.y = alturaSuelo(JUG.x, JUG.z);
  AND.v = Math.hypot(JUG.vx, JUG.vz);
  AND.lado = (JUG.vx*der.x + JUG.vz*der.z) / (CORRE);
}

/* ── LA CÁMARA ──
   El cabeceo va atado a la DISTANCIA recorrida y no al tiempo, así que la
   pisada cae siempre en el mismo punto del paso por más que uno acelere o
   frene. Es la corrección que en Maicol convirtió veinticuatro pisadas por
   segundo superpuestas —o sea ruido blanco— en un trote. */
function ponCam(dt){
  const rapido = cl(AND.v / CORRE, 0, 1);
  const andando = cl(AND.v / VEL, 0, 1);
  const faseAnt = AND.fase;
  AND.fase += (AND.v * dt) / 0.82;          /* 0,82 m por medio paso */
  if (AND.v > 0.5 && MODO === 'juego' && !PAUSA){
    if (Math.floor(AND.fase / Math.PI) !== Math.floor(faseAnt / Math.PI))
      son('paso', 0.42 + rapido*0.4);
  }
  const amp = cl(andando * 1.3, 0, 1);
  const arriba = Math.abs(Math.sin(AND.fase)) * (0.030 + rapido*0.040) * amp;
  const costado = Math.cos(AND.fase) * (0.026 + rapido*0.030) * amp;
  const quieto = cl(1 - andando*1.7, 0, 1);
  const resp = Math.sin(RELOJ.value*1.15) * 0.017 * quieto;

  AND.ojo = lerp(AND.ojo, OJO, Math.min(1, dt*9));
  const objRoll = Math.cos(AND.fase) * (0.014 + rapido*0.016) * amp - AND.lado*0.05;
  AND.roll = lerp(AND.roll, objRoll, Math.min(1, dt*10));
  const objFov = 70 + rapido*7;
  AND.fov = lerp(AND.fov, objFov, Math.min(1, dt*3.2));
  if (Math.abs(cam.fov - AND.fov) > 0.02){ cam.fov = AND.fov; cam.updateProjectionMatrix(); }

  const sy = Math.sin(JUG.yaw), cy = Math.cos(JUG.yaw);
  cam.position.set(JUG.x + cy*costado, JUG.y + AND.ojo + arriba + resp, JUG.z - sy*costado);
  cam.rotation.set(JUG.pitch + Math.sin(AND.fase*2)*0.004*amp, JUG.yaw, AND.roll);
}

/* ── EL AVISO DE UNA LÍNEA ── */
let _avisoT = null;
function aviso(txt, ms){
  const e = $('aviso');
  e.textContent = txt; e.classList.add('on');
  clearTimeout(_avisoT);
  _avisoT = setTimeout(() => e.classList.remove('on'), ms || 1700);
}

/* ── EN QUÉ ESQUINA ESTÁS ──
   El barrio es un damero de calles con nombre, así que la única información de
   posición que sirve es la de siempre: en qué cruce estás. Y sale de los
   mismos `EJES` que construyeron el barrio, no de una tabla aparte que habría
   que mantener sincronizada. */
let _calleAnt = '';
function ponCalle(){
  let mi = 0, mj = 0, dmi = 1e9, dmj = 1e9;
  for (let i = 0; i < EJES.length; i++){
    const a = Math.abs(JUG.x - EJES[i]); if (a < dmi){ dmi = a; mi = i; }
    const b = Math.abs(JUG.z - EJES[i]); if (b < dmj){ dmj = b; mj = i; }
  }
  const t = TXF('calle', TX('ns')[mi], TX('ew')[mj]);
  if (t !== _calleAnt){ _calleAnt = t; $('calle').textContent = t; }
}

/* ══════════════════════════ EL SONIDO ══════════════════════════
   Todo procedural, ni un archivo. Y acá eso no es una limitación asumida sino
   la respuesta correcta: lo que suena en este juego es LLUVIA, o sea ruido
   filtrado — un clip de lluvia grabado pesa cientos de kilobytes y encima se
   corta cada vez que da la vuelta, y ese corte se escucha más que la lluvia.
   Un ruido generado no tiene vuelta que dar.

   EL RUIDO SE GENERA UNA SOLA VEZ y lo comparten todos: es un buffer de dos
   segundos, y crear uno nuevo por cada pisada serían cuarenta buffers por
   minuto a la basura. */
let AUD = null, MAESTRO = null, ANAL = null, RUIDO = null;
const CAMA = { lluvia: null, gLluvia: null, cerca: null, gCerca: null };
function audioIniciar(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAESTRO = AUD.createGain(); MAESTRO.gain.value = 0.9;
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 2048;
  MAESTRO.connect(ANAL); ANAL.connect(AUD.destination);

  const n = AUD.sampleRate * 2;
  RUIDO = AUD.createBuffer(1, n, AUD.sampleRate);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;

  /* ── LA CAMA DE LLUVIA VA EN DOS CAPAS ──
     Una ancha y grave, que es el agua cayendo sobre todo el barrio, y otra
     aguda y más corta, que es el agua golpeando cerca. Con una sola capa la
     lluvia suena a estática de radio; lo que la hace lluvia es que haya un
     fondo continuo y encima unos golpes finos. */
  const cap = (tipo, frec, q, gan) => {
    const s = AUD.createBufferSource(); s.buffer = RUIDO; s.loop = true;
    const f = AUD.createBiquadFilter(); f.type = tipo; f.frequency.value = frec; f.Q.value = q;
    const g = AUD.createGain(); g.gain.value = gan;
    s.connect(f); f.connect(g); g.connect(MAESTRO); s.start();
    return { s, g };
  };
  const a = cap('lowpass', 1150, 0.7, 0.13);
  const b = cap('bandpass', 4200, 0.55, 0.055);
  CAMA.lluvia = a.s; CAMA.gLluvia = a.g;
  CAMA.cerca = b.s; CAMA.gCerca = b.g;
}
function son(tipo, vol){
  if (!AUD || AUD.state !== 'running') return;
  const t = AUD.currentTime, v = vol === undefined ? 1 : vol;
  const g = AUD.createGain(); g.connect(MAESTRO);
  if (tipo === 'paso'){
    /* UNA PISADA EN EL AGUA SON DOS COSAS: el golpe del zapato y la salpicadura
       que le sigue. Con sólo el golpe suena a piso seco. */
    const s = AUD.createBufferSource(); s.buffer = RUIDO;
    s.playbackRate.value = 1.6 + Math.random()*0.5;
    const f = AUD.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 900 + Math.random()*500; f.Q.value = 1.1;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.24*v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
    s.start(t); s.stop(t + 0.2);
    const s2 = AUD.createBufferSource(); s2.buffer = RUIDO;
    const f2 = AUD.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = 3200;
    const g2 = AUD.createGain(); g2.connect(MAESTRO);
    s2.connect(f2); f2.connect(g2);
    g2.gain.setValueAtTime(0, t + 0.02);
    g2.gain.linearRampToValueAtTime(0.10*v, t + 0.035);
    g2.gain.exponentialRampToValueAtTime(0.0008, t + 0.26);
    s2.start(t + 0.02); s2.stop(t + 0.3);
    return;
  }
  if (tipo === 'trueno'){
    /* EL TRUENO BAJA Y NO SUBE, y dura. Un ruido corto con un pasabajos es un
       portazo; lo que lo vuelve trueno es la cola de tres segundos y que el
       filtro se vaya cerrando — que es lo que hace el aire con la distancia. */
    const s = AUD.createBufferSource(); s.buffer = RUIDO; s.loop = true;
    s.playbackRate.value = 0.32;
    const f = AUD.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(420, t);
    f.frequency.exponentialRampToValueAtTime(70, t + 3.1);
    f.Q.value = 0.9;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.0008, t);
    g.gain.linearRampToValueAtTime(0.42*v, t + 0.14);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 3.4);
    s.start(t); s.stop(t + 3.5);
    const o = AUD.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(46, t); o.frequency.exponentialRampToValueAtTime(24, t + 2.4);
    const go = AUD.createGain(); go.connect(MAESTRO); o.connect(go);
    go.gain.setValueAtTime(0.0008, t);
    go.gain.linearRampToValueAtTime(0.22*v, t + 0.10);
    go.gain.exponentialRampToValueAtTime(0.0008, t + 2.6);
    o.start(t); o.stop(t + 2.7);
    return;
  }
  if (tipo === 'clic'){
    const o = AUD.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(760, t); o.frequency.exponentialRampToValueAtTime(300, t + 0.05);
    o.connect(g);
    g.gain.setValueAtTime(0.10*v, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.09);
    o.start(t); o.stop(t + 0.1);
    return;
  }
}
/* la lluvia se agacha en el menú y en la pausa: no se apaga —seguiría
   lloviendo— pero deja de ser lo más fuerte de la pantalla */
function camaVol(k){
  if (!CAMA.gLluvia) return;
  const t = AUD.currentTime;
  CAMA.gLluvia.gain.setTargetAtTime(0.13*k, t, 0.35);
  CAMA.gCerca.gain.setTargetAtTime(0.055*k, t, 0.35);
}

/* ══════════════════════════ CALIDAD, MENÚ Y PAUSA ══════════════════════════ */
function ponCalidad(q){
  const c = CALIDADES[q]; if (!c) return CALIDAD;
  CALIDAD = q;
  CFG.pix = c.pix; CFG.gotas = c.gotas; CFG.sombras = c.sombras;
  CFG.charcos = c.charcos; CFG.grano = c.grano;
  postMat.uniforms.grano.value = c.grano;
  ren.shadowMap.enabled = c.sombras;
  if (LUCES.length){
    /* LA SOMBRA SE PRENDE Y SE APAGA EN LA LUZ, no sólo en el renderer: dejando
       `castShadow` puesto con el mapa apagado, three.js sigue reservando la
       pasada. Y el mapa VIEJO hay que soltarlo a mano — no lo recrea porque
       cambie `mapSize`, se queda con el de antes. */
    LUCES[0].castShadow = c.sombras;
    if (LUCES[0].shadow.map && !c.sombras){ LUCES[0].shadow.map.dispose(); LUCES[0].shadow.map = null; }
  }
  if (charcoMesh) charcoMesh.visible = c.charcos;
  if (LLUVIA.malla) LLUVIA.malla.geometry.instanceCount = Math.min(c.gotas, LLUVIA.total || c.gotas);
  medir();
  try { localStorage.setItem('barrio_cal', q); } catch(e){}
  pintaAjustes();
  return CALIDAD;
}
function pintaAjustes(){
  for (const b of document.querySelectorAll('#mCal .chip'))
    b.classList.toggle('sel', b.dataset.cal === CALIDAD);
  for (const b of document.querySelectorAll('#mIdi .chip'))
    b.classList.toggle('sel', b.dataset.lang === IDIOMA);
}

async function pantallaCompleta(){
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch(e){}
}
function pausa(v){
  PAUSA = v;
  $('pausa').classList.toggle('on', v);
  if (v && document.pointerLockElement) document.exitPointerLock();
  camaVol(v ? 0.35 : 1);
  if (v){
    const t = Math.floor(RELOJ.value - T0JUEGO);
    $('pSub').textContent = TXF('pSub', Math.floor(t/60), String(t%60).padStart(2,'0'));
  }
}
let T0JUEGO = 0;
function entraJuego(){
  MODO = 'juego';
  $('menu').classList.remove('on');
  $('hud').classList.add('on');
  T0JUEGO = RELOJ.value;
  /* SE EMPIEZA EN UNA ESQUINA Y MIRANDO POR LA CALLE LARGA. Soltado en el medio
     de una cuadra, el primer cuadro es una cerca a dos metros; desde la esquina
     lo que se ve son doscientos metros de faroles perdiéndose en la niebla, que
     es la imagen que este barrio tiene para dar. */
  JUG.x = EJES[0]; JUG.z = EJES[0];
  JUG.y = alturaSuelo(JUG.x, JUG.z);
  JUG.vx = JUG.vz = 0;
  JUG.yaw = Math.PI;              /* mirando hacia +Z, o sea calle adentro */
  JUG.pitch = -0.02;
  AND.ojo = OJO; AND.fase = 0; AND.fov = 70;
  cam.fov = 70; cam.updateProjectionMatrix();
  camaVol(1);
  aviso(TXF('calle', TX('ns')[0], TX('ew')[0]), 2600);
}
function vuelveMenu(){
  MODO = 'menu';
  pausa(false);
  $('hud').classList.remove('on');
  $('menu').classList.add('on');
  ponLinterna(false);
  camaVol(0.5);
  CINE.arranca();
}

/* ── LA CÁMARA DEL MENÚ ──
   No es una foto de fondo: es el barrio de verdad, filmado bajando por una
   calle a paso de hombre. Un menú con una imagen detrás y un juego que se ve
   distinto es lo que hace que la portada se lea a promesa incumplida — y acá
   además es gratis, porque la escena ya está construida. */
const CINE = {
  t: 0, x: 0, z: 0, ang: 0,
  arranca(){
    this.t = 0;
    const i = azi(0, CUADRAS), j = azi(0, CUADRAS);
    this.x = EJES[i]; this.z = EJES[j];
    this.ang = Math.floor(az()*4) * (Math.PI/2);
  },
  paso(dt){
    this.t += dt;
    const av = this.t * 2.2;
    const dx = -Math.sin(this.ang), dz = -Math.cos(this.ang);
    const x = this.x + dx*av, z = this.z + dz*av;
    if (Math.abs(x) > MITAD - 8 || Math.abs(z) > MITAD - 8 || this.t > 26) this.arranca();
    cam.position.set(x, 1.72 + Math.sin(this.t*0.9)*0.05, z);
    /* mira un poco de costado y un pelín arriba: por la calle recta se ve la
       fuga de los faroles, y arriba están los cables — que es lo que dice de
       qué barrio se trata */
    cam.rotation.set(0.045, this.ang + Math.sin(this.t*0.23)*0.30, Math.sin(this.t*0.17)*0.012);
    JUG.x = x; JUG.z = z;     /* los faroles y la lluvia siguen a la cámara */
  }
};

/* ══════════════════════════ EL BUCLE ══════════════════════════ */
let ultimo = performance.now(), fps = 0, cuadros = 0, acum = 0, DIB = 0, TRI = 0;
let CONGELADO = false;
/* CONGELADO frena la SIMULACIÓN y deja el dibujo. Sin esto no se puede
   fotografiar un instante: entre el paso que pone la escena y la captura el
   navegador sigue corriendo su propio bucle, y la foto sale de dos segundos
   después. Ya pasó cuatro veces en este repo. */

/* ── APAGAR LAS CUADRAS QUE LA NIEBLA YA SE COMIÓ ──
   Veinticinco cuadras dibujadas siempre son doscientas llamadas para mostrar
   niebla. El recorte por frustum tira las que están detrás, pero no las que
   están adelante y lejos: eso lo tiene que decidir el juego, porque el motor no
   sabe que a ciento sesenta metros no queda un solo píxel visible. Es una
   distancia y una comparación por cuadra y por cuadro — veinticinco cuentas. */
const VISTA = 168;
function pasoCuadras(){
  for (const g of GRUPOS){
    const dx = g.userData.cx - JUG.x, dz = g.userData.cz - JUG.z;
    g.visible = (dx*dx + dz*dz) < VISTA*VISTA;
  }
}

function bucle(){
  requestAnimationFrame(bucle);
  const ahora = performance.now();
  let dt = Math.min((ahora - ultimo)/1000, 0.08);
  ultimo = ahora;
  if (CONGELADO) dt = 0;
  RELOJ.value += dt;

  if (MODO === 'menu') CINE.paso(dt);
  else if (!PAUSA){ fisica(dt); ponCam(dt); }

  pasoCuadras();
  pasoFaroles();
  pasoHalos();
  pasoRayo(dt);
  pasoLluvia();
  pasoSalpicaduras(dt);
  if (cielo) cielo.position.set(cam.position.x, 0, cam.position.z);
  if (MODO === 'juego' && !PAUSA) ponCalle();
  if (!esPC) joyDibuja();
  postMat.uniforms.t.value = RELOJ.value;

  /* el reloj de la pantalla: son las tres de la mañana y corre lento, que es
     lo que hace una noche que no termina */
  if (MODO === 'juego'){
    const m = Math.floor(RELOJ.value * 0.5) % 60;
    $('reloj').textContent = '03:' + String(m).padStart(2, '0');
  }

  /* `ren.info.render` SE PONE A CERO AL EMPEZAR CADA `render()`, así que
     leyéndolo después del último se ven las llamadas de la pasada de color —una
     sola— y no las del cuadro. Con `autoReset` apagado se acumulan las dos
     pasadas más la de sombra, y se pone a cero a mano. Es la misma trampa que
     ya costó una medición en Z Force. */
  ren.info.autoReset = false;
  ren.info.reset();
  ren.setRenderTarget(rt);
  ren.render(escena, cam);
  ren.setRenderTarget(null);
  ren.render(postEsc, postCam);

  cuadros++; acum += dt;
  if (acum >= 0.5){
    fps = Math.round(cuadros/acum); cuadros = 0; acum = 0;
    DIB = ren.info.render.calls; TRI = ren.info.render.triangles;
  }
}

/* ══════════════════════════ EL ARRANQUE ══════════════════════════ */
const PASOS = [
  ['cCalles',  () => { armaCalles(); }],
  ['cVeredas', () => { armaCielo(); }],
  ['cCasas',   null],       /* las veinticinco cuadras van de a poco: ver abajo */
  ['cCercas',  null],
  ['cLuces',   () => { armaFaroles(); armaCharcos(); armaAutos(); }],
  ['cLluvia',  () => { armaLluvia(); armaSalpicaduras(); indexaColisiones(); }]
];
function paso(p, txt){
  $('cBar').style.width = (p*100).toFixed(1) + '%';
  $('cTxt').textContent = txt;
  /* DOS CUADROS Y NO UNO. Con un solo `requestAnimationFrame` el navegador
     agenda el repintado pero todavía no lo hizo, así que la barra de carga se
     queda clavada mientras el hilo construye la cuadra siguiente: se ve como
     que el juego se colgó. Con dos, el cuadro anterior ya está en pantalla. */
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}

let TOTALES = { casas: 0, faroles: 0 };
async function construir(){
  medir();
  await paso(0.05, TX('cCalles'));
  armaCalles(); armaCielo();
  await paso(0.14, TX('cVeredas'));
  /* LAS CUADRAS SE CONSTRUYEN DE A UNA Y CON UN RESPIRO CADA CINCO. Las
     veinticinco de un tirón son casi un segundo de hilo bloqueado: la barra no
     se mueve, el navegador no repinta y en un teléfono aparece el aviso de
     página que no responde. */
  for (let i = 0; i < CUADRAS; i++){
    for (let j = 0; j < CUADRAS; j++) TOTALES.casas += armaCuadra(i, j).casas;
    await paso(0.14 + 0.55*(i+1)/CUADRAS,
               TX(i < 3 ? 'cCasas' : 'cCercas'));
  }
  await paso(0.74, TX('cLuces'));
  armaFaroles(); armaCharcos(); armaAutos();
  TOTALES.faroles = FAROLES.length;
  await paso(0.90, TX('cLluvia'));
  armaLluvia(); armaSalpicaduras(); indexaColisiones();
  await paso(1.0, TX('cListo'));
}

async function arranca(){
  /* el idioma guardado, y si no el del navegador; y si tampoco, inglés */
  let g = null;
  try { g = localStorage.getItem('barrio.idioma'); } catch(e){}
  if (!g){ const n = (navigator.language || 'en').slice(0,2); if (TXT[n]) g = n; }
  ponIdioma(g || 'en');
  try { const c = localStorage.getItem('barrio_cal'); if (c && CALIDADES[c]) CALIDAD = c; } catch(e){}

  /* la pantalla de idioma se muestra ENSEGUIDA y el barrio se construye
     mientras tanto: son segundos que no dependen de qué idioma se elija */
  $('idioma').classList.add('on');
  let elegido = false;
  for (const b of document.querySelectorAll('#idioma button')){
    b.onclick = () => {
      ponIdioma(b.getAttribute('data-lang'));
      $('idioma').classList.remove('on');
      elegido = true;
      audioIniciar();          /* el primer gesto: ningún navegador deja sonar antes */
      if (AUD && AUD.state === 'suspended') AUD.resume();
    };
  }
  $('cPista').textContent = TX('pistas')[Math.floor(Math.random()*TX('pistas').length)];

  armaPanel();
  await construir();

  /* el gancho de repintado se cuelga ANTES de esperar al idioma. Puesto
     después, en el instante en que se elige todavía no existe y el pie del menú
     se queda en el idioma anterior para siempre — ya pasó en LEMI. */
  window.repintaJuego = () => {
    $('mPie').textContent = TXF('mPie', TOTALES.casas, TOTALES.faroles, LADO);
    _calleAnt = ''; if (MODO === 'juego') ponCalle();
  };
  window.repintaJuego();

  CINE.arranca();
  bucle();
  await new Promise(r => { const v = () => elegido ? r() : setTimeout(v, 120); v(); });
  $('menu').classList.add('on');
  $('carga').classList.add('ido');
  setTimeout(() => $('carga').style.display = 'none', 700);
  ponCalidad(CALIDAD);

  /* ══════════════════════ LAS SONDAS ══════════════════════
     Todo lo que el banco necesita para medir el juego sin mirarlo. */
  window.__V = {
    CFG, JUG, escena, ren, T, cam, EJES, LADO,
    idioma: (v) => { if (v) ponIdioma(v); return IDIOMA; },
    calidad: (v) => { if (v) ponCalidad(v); return CALIDAD; },
    modo: () => MODO,
    entrar: () => { const b = $('mJugar'); if (b) b.click(); return MODO; },
    pausar: (v) => { pausa(!!v); return PAUSA; },
    helar: (v) => { CONGELADO = !!v; return CONGELADO; },
    pix: (n) => { if (n){ CFG.pix = n; medir(); } return { pix: CFG.pix, rt: rt ? [rt.width, rt.height] : null }; },
    movil: () => { modoPC(false); return document.body.className; },
    pc: () => { modoPC(true); return document.body.className; },
    poner: (x, z, yaw, pitch) => {
      JUG.x = x; JUG.z = z; JUG.y = alturaSuelo(x, z);
      JUG.vx = JUG.vz = 0;
      if (yaw !== undefined) JUG.yaw = yaw;
      if (pitch !== undefined) JUG.pitch = pitch;
      ponCam(0);
      return { x: +JUG.x.toFixed(2), z: +JUG.z.toFixed(2), y: +JUG.y.toFixed(3) };
    },
    /* camina de verdad N cuadros, pasando por la física y por el choque: es la
       única forma honesta de probar que se puede recorrer el barrio */
    anda: (n, correr, giro) => new Promise(res => {
      let i = 0, pasos = 0, dentroCasa = 0;
      const x0 = JUG.x, z0 = JUG.z, t0 = RELOJ.value;
      const un = () => {
        teclas.KeyW = true; corre = !!correr;
        if (giro) JUG.yaw += giro;
        if (enCasa(JUG.x, JUG.z)) dentroCasa++;
        pasos++;
        if (++i < n) requestAnimationFrame(un);
        else { teclas.KeyW = false; corre = false;
               res(JSON.stringify({ cuadros: pasos, dentroCasa,
                 metros: +Math.hypot(JUG.x-x0, JUG.z-z0).toFixed(1),
                 seg: +(RELOJ.value-t0).toFixed(1),
                 x:+JUG.x.toFixed(1), z:+JUG.z.toFixed(1),
                 y:+JUG.y.toFixed(3), suelo: +alturaSuelo(JUG.x, JUG.z).toFixed(3) })); }
      };
      requestAnimationFrame(un);
    }),
    /* cuánto le está costando el cuadro y con qué */
    est: () => ({ fps, pix: CFG.pix, calidad: CALIDAD,
                  rt: rt ? [rt.width, rt.height] : null, escenario: [W, H2], girado: GIRADO,
                  dib: DIB, tri: TRI,
                  cuadrasVisibles: GRUPOS.filter(g => g.visible).length,
                  casas: TOTALES.casas, faroles: TOTALES.faroles,
                  gotas: LLUVIA.malla ? LLUVIA.malla.geometry.instanceCount : 0,
                  x:+JUG.x.toFixed(1), z:+JUG.z.toFixed(1) }),
    /* los faroles con luz de verdad, y a qué distancia están: es lo único que
       prueba que las seis luces se mudan a las seis más cercanas */
    luces: () => LUCES.map(l => ({
      i: +l.intensity.toFixed(1),
      d: +Math.hypot(l.position.x - JUG.x, l.position.z - JUG.z).toFixed(1),
      sombra: l.castShadow })),
    /* el brillo del cuadro, leído del buffer. Un lienzo WebGL sin
       `preserveDrawingBuffer` sale en cero con `drawImage`, así que hay que
       pedirle los píxeles al contexto. */
    /* SE LEE DEL DESTINO DE RENDER Y NO DE LA PANTALLA. Un lienzo WebGL sin
       `preserveDrawingBuffer` no conserva el cuadro después de dibujarlo, así
       que una lectura hecha desde afuera del bucle —que es como llama el
       banco— devuelve CEROS: medido, `medio 0` con el barrio entero en
       pantalla. Y prender `preserveDrawingBuffer` para poder medir es pagar
       una copia por cuadro en el juego de verdad. El destino de render es un
       framebuffer propio y sus píxeles siguen ahí. */
    brillo: () => {
      const w = rt.width, h = rt.height;
      const px = new Uint8Array(w*h*4);
      ren.readRenderTargetPixels(rt, 0, 0, w, h, px);
      let s = 0, mx2 = 0, enc = 0;
      const fr = [0,0,0,0,0], cnt = [0,0,0,0,0];
      for (let i = 0; i < w*h; i++){
        const v = (px[i*4]*0.299 + px[i*4+1]*0.587 + px[i*4+2]*0.114);
        s += v; if (v > mx2) mx2 = v; if (v > 26) enc++;
        const f = Math.min(4, Math.floor((Math.floor(i/w)) / (h/5)));
        fr[f] += v; cnt[f]++;
      }
      return { medio: +(s/(w*h)).toFixed(1), max: mx2,
               pctEncendido: +(enc/(w*h)*100).toFixed(1),
               franjas: fr.map((v,k) => +(v/cnt[k]).toFixed(1)), tam: [w, h] };
    },
    rayo: () => { RAYO.prox = 0; RAYO.t = 0; return 'ok'; },
    verRayo: () => ({ t: +RAYO.t.toFixed(2), luz: +rayoLuz.intensity.toFixed(2),
                      velo: +($('rayo').style.opacity || 0) }),
    linterna: (v) => { ponLinterna(!!v); return CFG.linterna; },
    audio: () => ({ ctx: AUD ? AUD.state : null, lluvia: CAMA.gLluvia ? +CAMA.gLluvia.gain.value.toFixed(4) : null }),
    /* el nivel que sale por el maestro: es lo ÚNICO que prueba que algo sonó —
       que una llamada no tire excepción no quiere decir que haya sonido */
    oir: (ms) => new Promise(res => {
      if (!ANAL) return res('sin audio');
      const buf = new Float32Array(ANAL.fftSize);
      let pico = 0, sum = 0, n = 0;
      const t0 = performance.now();
      const un = () => {
        ANAL.getFloatTimeDomainData(buf);
        for (let i = 0; i < buf.length; i++){ const a = Math.abs(buf[i]); if (a > pico) pico = a; sum += buf[i]*buf[i]; n++; }
        if (performance.now() - t0 < (ms || 900)) requestAnimationFrame(un);
        else res(JSON.stringify({ pico: +pico.toFixed(4), rms: +Math.sqrt(sum/n).toFixed(4) }));
      };
      un();
    }),
    son: (t, v) => { son(t, v); return t; },
    /* ¿el jugador quedó adentro de una casa? Es la prueba del choque, y no se
       puede hacer mirando una captura: entrar en una pared se ve como estar
       adentro de un cuarto oscuro, que de noche es casi lo mismo que la niebla */
    enCasa: (x, z) => enCasa(x === undefined ? JUG.x : x, z === undefined ? JUG.z : z),
    /* recorre el barrio entero por una calle y cuenta cuántas veces se metió
       dentro de algo: mil metros de damero en una sola corrida */
    nan: () => {
      const malas = [];
      const v = { 'JUG.x':JUG.x, 'JUG.z':JUG.z, 'JUG.y':JUG.y, 'yaw':JUG.yaw, 'pitch':JUG.pitch,
                  'cam.x':cam.position.x, 'cam.y':cam.position.y, 'cam.z':cam.position.z,
                  'fov':cam.fov, 'AND.v':AND.v };
      for (const k of Object.keys(v)) if (!Number.isFinite(v[k])) malas.push(k);
      return malas;
    },
    /* dónde caen en la pantalla los elementos del HUD, para poder afirmar que
       no se pisan sin mirar una foto. Con el cuadro girado hay que medir con
       `offsetLeft/offsetTop`, que son coordenadas de la caja:
       `getBoundingClientRect` devuelve la caja alineada a los ejes y da falsos
       positivos. */
    hud: () => {
      const ids = ['reloj','calle','botones','acciones','teclas','joy'];
      const r = [];
      for (const id of ids){
        const e = $(id); if (!e || getComputedStyle(e).display === 'none') continue;
        r.push([id, e.offsetLeft, e.offsetTop, e.offsetWidth, e.offsetHeight]);
      }
      const ch = [];
      for (let i = 0; i < r.length; i++) for (let j = i+1; j < r.length; j++){
        const a = r[i], b = r[j];
        if (a[1] < b[1]+b[3] && b[1] < a[1]+a[3] && a[2] < b[2]+b[4] && b[2] < a[2]+a[4])
          ch.push(a[0]+'|'+b[0]);
      }
      return { cajas: r, choques: ch };
    }
  };
}

/* ¿el punto cae dentro de alguna casa? Se usa para probar el choque y va contra
   la MISMA lista que construyó las casas, no contra una copia. */
function enCasa(x, z){
  for (const c of CASAS){
    const co = Math.cos(-c.rot), si = Math.sin(-c.rot);
    const dx = x - c.x, dz = z - c.z;
    const lx = dx*co + dz*si, lz = -dx*si + dz*co;
    if (Math.abs(lx) < c.w/2 - 0.05 && Math.abs(lz) < c.d/2 - 0.05) return true;
  }
  return false;
}

function armaPanel(){
  $('bPanel').onclick = () => pausa(!PAUSA);
  $('pSeguir').onclick = () => pausa(false);
  $('pMenu').onclick = () => vuelveMenu();
  $('mJugar').onclick = async () => {
    audioIniciar();
    if (AUD && AUD.state === 'suspended') AUD.resume();
    await pantallaCompleta();
    entraJuego();
  };
  $('bFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen(); else pantallaCompleta();
  };
  $('acCorre').ontouchstart = () => { corre = true; $('acCorre').classList.add('on'); };
  $('acCorre').ontouchend = () => { corre = false; $('acCorre').classList.remove('on'); };
  $('acLinterna').onclick = () => ponLinterna(!CFG.linterna);
  for (const b of document.querySelectorAll('#mCal .chip'))
    b.onclick = () => ponCalidad(b.dataset.cal);
  for (const b of document.querySelectorAll('#mIdi .chip'))
    b.onclick = () => { ponIdioma(b.dataset.lang); pintaAjustes(); };
  /* un toque en cualquier lado destraba el audio: ningún navegador deja sonar
     sin un gesto, y el gesto de la pantalla de idioma se pierde si alguien
     entra directo con el teclado */
  addEventListener('pointerdown', () => {
    audioIniciar();
    if (AUD && AUD.state === 'suspended') AUD.resume();
  }, { once: false });
}

window.__errs = [];
addEventListener('error', e => window.__errs.push(String(e.message || e)));
addEventListener('unhandledrejection', e => window.__errs.push('promesa: ' + String(e.reason)));
arranca();
</script>
