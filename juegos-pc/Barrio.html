<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070c">
<title>BARRIO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;color:#dce6f2;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── EL CUADRO ──
   El juego se dibuja apaisado y el teléfono se agarra vertical, así que el
   escenario ENTERO —lienzo, HUD, menú— vive dentro de un solo elemento que se
   gira noventa grados. Es lo mismo que hacen LEMI y Eco, y por la misma razón:
   con una sola transformación no hay forma de que el HUD quede desalineado del
   mundo, y girar el lienzo solo dejaría los botones donde estaban. */
#escenario{position:fixed;left:0;top:0;width:100%;height:100%;
  transform-origin:top left;overflow:hidden}
body.girado #escenario{transform:rotate(90deg) translateY(-100%)}

/* ── CARGA ── */
#carga{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(140% 100% at 50% 18%, #101a2a 0%, #080d16 55%, #04060a 100%);
  transition:opacity .6s ease}
#carga.ido{opacity:0;pointer-events:none}
#carga .caja{text-align:center;width:min(340px,84vw)}
#carga h1{font:200 clamp(30px,9vw,46px)/1 system-ui,sans-serif;letter-spacing:.30em;
  text-indent:.30em;color:#cfe0f2;text-shadow:0 0 30px rgba(150,190,255,.35)}
#carga .sub{margin-top:6px;font:600 10px/1.7 ui-monospace,monospace;letter-spacing:.26em;
  color:rgba(190,214,240,.45);text-transform:uppercase}
#carga p{margin-top:16px;font-size:12.5px;color:rgba(200,220,245,.55);min-height:1.4em}
#carga .barra{margin:14px auto 0;width:76%;height:3px;background:rgba(255,255,255,.10);
  overflow:hidden;border-radius:99px}
#carga .barra i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#4d7fb8,#9dc4ec);transition:width .25s}
#carga .pista{margin-top:14px;font-size:11.5px;color:rgba(200,220,245,.38);line-height:1.5}

/* ── IDIOMA ──
   Antes del menú y no adentro: elegir idioma dentro de un menú ya escrito en un
   idioma que no se entiende no sirve de nada, porque para cuando uno encuentra
   el selector ya leyó todo lo demás sin entenderlo. */
#idioma{position:fixed;inset:0;z-index:95;display:none;place-items:center;
  background:radial-gradient(140% 100% at 50% 18%, #101a2a 0%, #080d16 55%, #04060a 100%)}
#idioma.on{display:grid}
#idioma .caja{text-align:center;width:min(320px,80vw)}
#idioma h1{font:200 clamp(26px,7vw,38px)/1 system-ui,sans-serif;letter-spacing:.30em;
  text-indent:.30em;color:#cfe0f2;margin-bottom:6px}
#idioma .sub{font:600 10px/1.7 ui-monospace,monospace;letter-spacing:.24em;
  color:rgba(190,214,240,.42);text-transform:uppercase;margin-bottom:22px}
#idioma button{display:block;width:100%;margin-top:10px;padding:14px 18px;
  border-radius:12px;border:1px solid rgba(160,195,235,.22);
  background:rgba(140,180,230,.07);color:#dce6f2;font:600 15px/1 system-ui,sans-serif;
  transition:transform .12s ease,background .2s ease}
#idioma button:active{transform:scale(.97)}
#idioma button.sel{background:linear-gradient(135deg,#5b8ec4,#8fb9e4);color:#06111c;border-color:transparent}

/* ── HUD ──
   `visibility` ADEMÁS DE `opacity`: un `backdrop-filter` se compone contra lo
   que hay DETRÁS del elemento y no contra su propio píxel, así que en un padre
   con opacidad cero el navegador lo dibuja igual y quedan barras claras
   flotando. Con `visibility:hidden` no se compone. */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .45s ease, visibility 0s linear .45s}
#hud.on{opacity:1;visibility:visible;transition:opacity .45s ease, visibility 0s}
#hud > *{pointer-events:none}

#reloj{position:absolute;left:max(14px,3.4vw);top:max(12px,3vh);
  font:700 13px/1 ui-monospace,monospace;letter-spacing:.16em;
  color:rgba(214,232,252,.72);text-shadow:0 1px 8px rgba(0,0,0,.95)}
#calle{position:absolute;left:max(14px,3.4vw);top:calc(max(12px,3vh) + 20px);
  font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.20em;
  color:rgba(150,185,225,.55);text-shadow:0 1px 8px rgba(0,0,0,.95);
  text-transform:uppercase}

#botones{position:absolute;right:max(12px,3vw);top:max(10px,2.6vh);display:flex;gap:8px;
  pointer-events:auto}
.bt{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:15px;color:rgba(220,236,252,.80);
  background:rgba(12,20,32,.45);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bt:active{transform:scale(.92)}

/* el joystick, sólo en teléfono */
#joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);width:min(146px,32vw);
  aspect-ratio:1;pointer-events:auto;opacity:.85;display:none}
body:not(.pc) #joy{display:block}
#joy canvas{width:100%;height:100%;display:block}

#acciones{position:absolute;right:max(16px,4vw);bottom:max(18px,5vh);
  display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:auto}
body.pc #acciones{display:none}
.ac{width:min(62px,14vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  color:#dbe8f6;font:800 9px/1.25 system-ui,sans-serif;letter-spacing:.06em;text-align:center;
  background:rgba(12,22,36,.42);border:1.4px solid rgba(255,255,255,.18);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  text-shadow:0 1px 4px rgba(0,0,0,.9);transition:transform .12s,filter .2s}
.ac:active{transform:scale(.9);filter:brightness(1.4)}
.ac.on{filter:brightness(1.4);background:rgba(120,180,240,.26);border-color:rgba(150,200,250,.6)}
#acCorre{width:min(74px,16vw)}

#teclas{position:absolute;left:max(14px,3.4vw);bottom:max(14px,4vh);
  font:500 11px/1.75 ui-monospace,monospace;color:rgba(196,218,242,.50);
  text-shadow:0 1px 8px rgba(0,0,0,.95);display:none}
body.pc #teclas{display:block}
#teclas b{color:rgba(226,240,255,.86)}

/* el aviso de una línea, arriba en el medio */
#aviso{position:absolute;left:50%;top:12%;transform:translateX(-50%);
  padding:8px 15px;border-radius:99px;white-space:nowrap;
  font:700 11.5px/1 system-ui,sans-serif;letter-spacing:.09em;
  color:#e6f0fb;background:rgba(10,18,30,.62);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .35s}
#aviso.on{opacity:1}

/* ── MENÚ ──
   El fondo NO es una imagen: es el barrio de verdad, filmado con la cámara
   paseando entre las casas. Un menú con una foto detrás y un juego que se ve
   distinto es lo que hace que la portada se lea a promesa incumplida. */
#menu{position:absolute;inset:0;z-index:44;display:none;place-items:center;
  background:linear-gradient(180deg,rgba(3,6,12,.55) 0%,rgba(3,6,12,.12) 40%,rgba(3,6,12,.86) 100%)}
#menu.on{display:grid}
#menu .mCaja{text-align:center;width:min(370px,86%)}
#menu .mTit{font:200 clamp(30px,calc(var(--eh,100vh)*0.115),56px)/1 system-ui,sans-serif;
  letter-spacing:.32em;text-indent:.32em;color:#dcecff;
  text-shadow:0 0 34px rgba(140,190,255,.45), 0 3px 0 rgba(0,0,0,.6)}
#menu .mSub{margin-top:5px;font:600 10.5px/1.7 ui-monospace,monospace;letter-spacing:.26em;
  color:rgba(180,208,238,.55);text-transform:uppercase}
/* ── LA CINEMÁTICA ──
   El negro va como un velo de CSS y no como un uniforme del shader porque
   tiene que tapar TAMBIÉN lo que no pasa por el post: en el último cuadro de
   la escena se enciende el HUD y el menú, y un fundido que sólo oscurece el
   lienzo dejaría los botones apareciendo sobre negro. */
#cineNeg{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
  z-index:55;display:none}
#cineNeg.on{display:block}
#cineSalta{position:absolute;left:0;right:0;bottom:18px;text-align:center;z-index:56;
  font-size:11px;letter-spacing:.18em;color:#c9d4e2;opacity:0;pointer-events:none;
  text-shadow:0 1px 3px #000;transition:opacity .5s;display:none}
#cineSalta.on{display:block;animation:cs 9s ease forwards}
@keyframes cs{0%{opacity:0}14%{opacity:.62}62%{opacity:.62}100%{opacity:0}}
#menu .mBtn{display:block;width:100%;margin-top:16px;padding:15px 18px;border-radius:13px;
  border:1px solid rgba(160,200,240,.24);background:rgba(140,180,230,.09);
  color:#e2eefc;font:700 15px/1 system-ui,sans-serif;letter-spacing:.08em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .12s ease,background .2s ease}
#menu .mBtn.pri{background:linear-gradient(135deg,#5b8ec4,#8fb9e4);color:#06111c;border-color:transparent}
#menu .mBtn:active{transform:scale(.975)}
/* las dos filas de ajustes: idioma y gráficos */
#menu .mFila{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px}
#menu .mRot{font:700 9px/1 ui-monospace,monospace;letter-spacing:.18em;
  color:rgba(170,200,232,.45);margin-right:3px}
#menu .chip{padding:7px 11px;border-radius:9px;font:700 10.5px/1 ui-monospace,monospace;
  letter-spacing:.10em;color:rgba(214,232,252,.68);
  border:1px solid rgba(160,200,240,.20);background:rgba(140,180,230,.06)}
#menu .chip.sel{background:rgba(150,200,250,.28);color:#f0f7ff;border-color:rgba(170,210,250,.55)}
#menu .mPie{margin-top:15px;font:500 10.5px/1.7 ui-monospace,monospace;
  color:rgba(170,200,232,.38);letter-spacing:.06em}
#menu .mHist{margin-top:13px;font-size:12px;line-height:1.65;color:rgba(206,226,248,.62)}

/* ── PAUSA ── */
#pausa{position:absolute;inset:0;z-index:46;display:none;place-items:center;
  background:rgba(4,8,14,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#pausa.on{display:grid}
#pausa .pCaja{text-align:center;width:min(300px,80%)}
#pausa h2{font:200 30px/1 system-ui,sans-serif;letter-spacing:.26em;text-indent:.26em;color:#dcecff}
#pausa .pSub{margin-top:5px;font:600 10px/1.7 ui-monospace,monospace;letter-spacing:.2em;
  color:rgba(180,208,238,.5)}
#pausa button{display:block;width:100%;margin-top:11px;padding:13px 18px;border-radius:12px;
  border:1px solid rgba(160,200,240,.22);background:rgba(140,180,230,.08);
  color:#e2eefc;font:700 14px/1 system-ui,sans-serif;letter-spacing:.07em}
#pausa button:active{transform:scale(.975)}

/* el fogonazo del relámpago: va en el DOM y no en el shader a propósito —
   entra DESPUÉS del pixelado, o sea que es luz en el ojo y no luz en la
   escena, que es exactamente lo que es un relámpago mirado de reojo */
#rayo{position:absolute;inset:0;z-index:40;pointer-events:none;background:#cfe2ff;opacity:0}
</style>
</head>
<body>

<div id="carga"><div class="caja">
  <h1>BARRIO</h1>
  <div class="sub" data-i18n="sub">five by five blocks · 3 am</div>
  <p id="cTxt" data-i18n="cargando">Paving the streets…</p>
  <div class="barra"><i id="cBar"></i></div>
  <div class="pista" id="cPista"></div>
</div></div>

<div id="idioma"><div class="caja">
  <h1>BARRIO</h1>
  <div class="sub">language · idioma · idioma</div>
  <button data-lang="en">English</button>
  <button data-lang="es">Español</button>
  <button data-lang="pt">Português</button>
</div></div>

<div id="escenario">
<div id="hud">
  <div id="reloj">03:00</div>
  <div id="calle"></div>
  <div id="botones">
    <button class="bt" id="bFull" title="Pantalla completa">⛶</button>
    <button class="bt" id="bPanel" title="Pausa">☰</button>
  </div>
  <div id="acciones">
    <button class="ac" id="acCorre" data-i18n="bCorrer">RUN</button>

    <b>W A S D</b> <span data-i18n="kMover">move</span> · <b>mouse</b> <span data-i18n="kMirar">look</span><br>
    <b>Shift</b> <span data-i18n="kCorrer">run</span> · <b>F</b> <span data-i18n="kLinterna">flashlight</span><br>
    <b>Esc</b> <span data-i18n="kPausa">pause</span>
  </div>
  <div id="joy"><canvas width="300" height="300"></canvas></div>
</div>

<div id="rayo"></div>
<div id="cineNeg"></div>
<div id="cineSalta" data-i18n="cSalta">tap to skip</div>

<div id="menu">
  <div class="mCaja">
    <div class="mTit">BARRIO</div>
    <div class="mSub" data-i18n="mSub">five by five blocks · 3 am</div>
    <button class="mBtn pri" id="mJugar" data-i18n="mJugar">▶ Walk</button>
    <button class="mBtn" id="mCine" data-i18n="mCine">Watch the opening</button>
    <div class="mFila" id="mIdi">
      <span class="mRot" data-i18n="mIdioma">LANGUAGE</span>
      <button class="chip" data-lang="en">EN</button>
      <button class="chip" data-lang="es">ES</button>
      <button class="chip" data-lang="pt">PT</button>
    </div>
    <div class="mFila" id="mCal">
      <span class="mRot" data-i18n="mGraf">GRAPHICS</span>
      <button class="chip" data-cal="baja" data-i18n="gBaja">LOW</button>
      <button class="chip" data-cal="media" data-i18n="gMedia">MED</button>
      <button class="chip" data-cal="alta" data-i18n="gAlta">HIGH</button>
    </div>
    <div class="mHist" id="mHist"></div>
    <div class="mPie" id="mPie"></div>
  </div>
</div>

<div id="pausa">
  <div class="pCaja">
    <h2 data-i18n="pTit">PAUSED</h2>
    <div class="pSub" id="pSub"></div>
    <button id="pSeguir" data-i18n="pSeguir">Resume</button>
    <button id="pMenu" data-i18n="pMenu">Main menu</button>
  </div>
</div>
</div>

<script type="module">
import * as T from 'three';

/* ══════════════════════════ LOS TRES IDIOMAS ══════════════════════════
   Ni un texto suelto en el código: todo sale de esta tabla. La razón no es
   prolijidad — es que en Z Force costó 107 claves descubrir que el juego estaba
   «traducido» y el jugador leía el menú en inglés y todo lo demás en castellano.
   Y LAS COSAS QUE SE ARMAN UNA SOLA VEZ GUARDAN LA CLAVE Y NO EL TEXTO: con el
   texto ya resuelto adentro, cambiar de idioma en medio de la partida deja el
   cartel viejo hasta que la cosa cambie sola. */
const TXT = {
  en: {
    sub:'five by five blocks · 3 am',
    cargando:'Paving the streets…',
    cCalles:'Paving the streets…', cVeredas:'Pouring the sidewalks…',
    cCasas:'Building the houses…', cCercas:'Putting up the fences…',
    cLuces:'Wiring the streetlights…', cLluvia:'Bringing the rain…',
    cListo:'Ready',
    mSub:'five by five blocks · 3 am', mJugar:'▶ Walk',
    mCine:'Watch the opening', cSalta:'tap to skip',
    mIdioma:'LANGUAGE', mGraf:'GRAPHICS', gBaja:'LOW', gMedia:'MED', gAlta:'HIGH',
    mHist:'Three in the morning and it will not stop raining. '+
          'Twenty-five blocks, every window dark, and the streetlights buzzing. '+
          'Nobody is out. Walk.',
    mPie:(c,l,p) => c+' houses · '+l+' streetlights · '+p+' m across',
    pTit:'PAUSED', pSeguir:'Resume', pMenu:'Main menu',
    pSub:(m,s) => 'walking for '+m+':'+s,
    bCorrer:'RUN', bLinterna:'LIGHT',
    kMover:'move', kMirar:'look', kCorrer:'run', kLinterna:'flashlight', kPausa:'pause',
    aLinternaOn:'FLASHLIGHT ON', aLinternaOff:'FLASHLIGHT OFF',
    aTrueno:'THUNDER', aEmpapado:'SOAKED THROUGH',
    calle:(a,b) => a+' & '+b,
    /* los nombres de las calles: las que van al norte son avenidas numeradas y
       las que van al este llevan nombre de árbol, que es como está armado
       cualquier barrio de damero */
    ns:['1st','2nd','3rd','4th','5th','6th'],
    ew:['Oak','Maple','Cedar','Birch','Willow','Ash'],
    pistas:['The streetlights are the only thing awake.',
            'Rain hides the sound of your own steps.',
            'Every block looks the same until you look up.',
            'The wires hum when the wind picks up.',
            'Some windows are still lit. Not many.']
  },
  es: {
    sub:'cinco por cinco cuadras · 3 de la mañana',
    cargando:'Asfaltando las calles…',
    cCalles:'Asfaltando las calles…', cVeredas:'Colando las veredas…',
    cCasas:'Levantando las casas…', cCercas:'Poniendo las cercas…',
    cLuces:'Cableando los faroles…', cLluvia:'Trayendo la lluvia…',
    cListo:'Listo',
    mSub:'cinco por cinco cuadras · 3 de la mañana', mJugar:'▶ Caminar',
    mCine:'Ver la cinemática', cSalta:'tocá para saltear',
    mIdioma:'IDIOMA', mGraf:'GRÁFICOS', gBaja:'BAJA', gMedia:'MEDIA', gAlta:'ALTA',
    mHist:'Las tres de la mañana y no para de llover. '+
          'Veinticinco cuadras, todas las ventanas apagadas y los faroles zumbando. '+
          'No hay nadie afuera. Caminá.',
    mPie:(c,l,p) => c+' casas · '+l+' faroles · '+p+' m de lado',
    pTit:'EN PAUSA', pSeguir:'Seguir', pMenu:'Volver al inicio',
    pSub:(m,s) => 'caminando hace '+m+':'+s,
    bCorrer:'CORRER', bLinterna:'LUZ',
    kMover:'moverse', kMirar:'mirar', kCorrer:'correr', kLinterna:'linterna', kPausa:'pausa',
    aLinternaOn:'LINTERNA ENCENDIDA', aLinternaOff:'LINTERNA APAGADA',
    aTrueno:'TRUENO', aEmpapado:'EMPAPADO',
    calle:(a,b) => a+' y '+b,
    ns:['1ª','2ª','3ª','4ª','5ª','6ª'],

    cargando:'Asfaltando as ruas…',
    cCalles:'Asfaltando as ruas…', cVeredas:'Concretando as calçadas…',

    mPie:(c,l,p) => c+' casas · '+l+' postes · '+p+' m de lado',
    pTit:'PAUSADO', pSeguir:'Continuar', pMenu:'Voltar ao início',
    pSub:(m,s) => 'caminhando há '+m+':'+s,
    bCorrer:'CORRER', bLinterna:'LUZ',
    kMover:'mover', kMirar:'olhar', kCorrer:'correr', kLinterna:'lanterna', kPausa:'pausa',
    aLinternaOn:'LANTERNA LIGADA', aLinternaOff:'LANTERNA DESLIGADA',
    aTrueno:'TROVÃO', aEmpapado:'ENCHARCADO',
    calle:(a,b) => a+' e '+b,
    ns:['1ª','2ª','3ª','4ª','5ª','6ª'],
    ew:['Carvalho','Bordo','Cedro','Bétula','Salgueiro','Freixo'],
    pistas:['Os postes são a única coisa acordada.',
            'A chuva abafa o som dos seus próprios passos.',
            'Todos os quarteirões são iguais até você olhar para cima.',
            'Os fios zumbem quando o vento aperta.',
            'Algumas janelas ainda estão acesas. Poucas.']
  }
};

let IDIOMA = 'en';
/* SE LLAMA `TX` Y NO `t`. Una función global de una letra es una bomba: la pisa
   cualquier cosa que comparta la página, y cuando se pisa no falla el idioma —
   falla TODO, porque no queda un solo texto que no pase por acá. Ya pasó de

function TX(k){ const d = TXT[IDIOMA] || TXT.en; return (d[k] !== undefined ? d[k] : (TXT.en[k] !== undefined ? TXT.en[k] : k)); }
function TXF(k, ...a){ const v = TX(k); return typeof v === 'function' ? v(...a) : v; }

function pintaIdioma(){
  for (const e of document.querySelectorAll('[data-i18n]')){
    const v = TX(e.getAttribute('data-i18n'));
    if (typeof v === 'string') e.textContent = v;
  }
  const h = document.getElementById('mHist');
  if (h) h.textContent = TX('mHist');
  document.title = 'BARRIO · ' + TX('mSub');
  /* y lo que ya se está mostrando ahora mismo */
  if (window.repintaJuego) window.repintaJuego();
}
function ponIdioma(v){
  if (!TXT[v]) return;
  IDIOMA = v;
  try { localStorage.setItem('barrio.idioma', v); } catch(e){}
  for (const b of document.querySelectorAll('#idioma button'))
    b.classList.toggle('sel', b.getAttribute('data-lang') === v);
  pintaIdioma();
  /* LAS FICHAS DEL MENÚ SE MARCAN ACÁ y no desde el gancho de repintado: ése se
     cuelga al final del arranque —después de construir el barrio, que son
     segundos— mientras que la pantalla de idioma se toca en el primero. */
  if (typeof pintaAjustes === 'function') pintaAjustes();
}

/* ══════════════════════════ AJUSTES Y CÁMARA ══════════════════════════ */
const CFG = {
  /* ── EL PIXELADO ──
     La escena NO se dibuja en la pantalla: se dibuja en un destino de render
     más chico y ese destino se estira con NEAREST. Eso no es un filtro puesto
     encima — es la razón por la que esto corre en un teléfono, porque lo que
     siempre paga en un juego de noche con faroles es el RELLENO de píxeles.
     VA EN 1,7 Y NO EN 2,4: se pidió «pixelación SUAVE». En un marco de 892×412
     el 1,7 deja el destino en 525×242, o sea que el escalón se ve —los cables,
     las rejas y la lluvia salen con el borde escalonado, que es lo que da el
     aire— pero un número de casa a veinte metros se sigue distinguiendo. En 2,4
     los postes y los cables se empastan contra el cielo.
     Y ES DECIMAL A PROPÓSITO: `medir()` divide y redondea, así que el ajuste no
     tiene por qué ser entero — con enteros no hay nada entre «casi limpio» y
     «empastado». */
  pix: 1.7,
  /* el color: de noche y bajo la lluvia lo que hay es poco contraste y mucho
     azul, así que la saturación va BAJA y el tinte se pone a mano */
  sat: 0.86, bri: 1.30, con: 1.15,
  /* CUÁNTOS ESCALONES DE COLOR. Acá también «suave»: 26 bandas por canal se ven
     como una imagen de consola vieja y no como un póster de cuatro colores. Con
     9 —que es lo que usa LEMI— un cielo nocturno, que es un degradado de arriba
     abajo, sale a rayas horizontales bien marcadas. */
  pos: 26,
  grano: 0.055,
  niebla: 0.0165,
  gotas: 2600, sombras: true, charcos: true,
  linterna: false
};
/* ── LAS TRES CALIDADES ──
   Cambian lo que CUESTA y no lo que el barrio es: las mismas veinticinco
   cuadras, las mismas casas y los mismos faroles en las tres. Lo que se mueve
   es cuántos píxeles hay que rellenar, cuántas gotas se dibujan, cuántos
   faroles tienen luz de verdad y si hay sombras. */
const CALIDADES = {
  baja:  { pix: 2.4, gotas: 1100, sombras: false, charcos: false, luces: 4, grano: 0.045 },
  media: { pix: 1.7, gotas: 2600, sombras: true,  charcos: true,  luces: 6, grano: 0.055 },
  alta:  { pix: 1.25, gotas: 4200, sombras: true, charcos: true,  luces: 8, grano: 0.062 }
};
let CALIDAD = 'media';

const $ = (id) => document.getElementById(id);
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const ren = new T.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
ren.setPixelRatio(1);            /* el pixelado lo hace el destino de render */
ren.shadowMap.enabled = true;
ren.shadowMap.type = T.PCFSoftShadowMap;
ren.outputColorSpace = T.SRGBColorSpace;
$('escenario').appendChild(ren.domElement);

const escena = new T.Scene();
/* LA NIEBLA ES EXPONENCIAL Y NO LINEAL, y es media atmósfera del juego. Con
   lluvia y de noche, lo que hay a cuarenta metros se ve peor que lo que hay a
   veinte por una curva que no es una recta; y de paso resuelve el problema de
   que un damero de cinco por cinco tiene calles de doscientos setenta metros
   que se verían enteras hasta el horizonte. */
escena.fog = new T.FogExp2(0x0a1018, CFG.niebla);

const cam = new T.PerspectiveCamera(70, 2, 0.1, 420);
cam.rotation.order = 'YXZ';

/* ── EL DESTINO DE RENDER Y LA PASADA DE COLOR ──
   Todo se dibuja acá adentro y recién después se estira. La corrección de
   gamma va A MANO: three.js aplica `outputColorSpace` SÓLO cuando dibuja en el
   buffer de pantalla, así que con un `WebGLRenderTarget` la imagen llega en
   LINEAL — y sin convertirla, la noche sale casi negra con un tinte verdoso.
   Es la misma trampa que ya costó una medición en RECREO. */
let rt = null;
/* EL SEGUNDO DESTINO ES SÓLO PARA LA CABEZA DE LA CINEMÁTICA, y existe por una
   razón concreta: el plano de la cara pide el fondo DESENFOCADO y la cara
   NÍTIDA. Dibujando todo junto no hay forma de separarlos sin un mapa de
   profundidad; con dos pasadas —el mundo en `rt` y la cabeza sola en `rtH`— la
   composición es una línea de shader. Y la cabeza va al MISMO tamaño reducido,
   porque a resolución completa sería lo único sin pixelar de la pantalla. */
let rtH = null;
const postMat = new T.ShaderMaterial({
  uniforms: {
    tex:  { value: null },
    sat:  { value: CFG.sat }, bri: { value: CFG.bri }, con: { value: CFG.con },
    pos:  { value: CFG.pos }, vig: { value: 0.62 }, grano: { value: CFG.grano },
    t:    { value: 0 },
    /* el agua en el lente: no es una gota dibujada sino una ondulación muy
       suave del muestreo, que es lo que hace un vidrio mojado */
    agua: { value: 0.55 },
    /* ── LO QUE SÓLO EXISTE EN LA CINEMÁTICA ──
       `dof` es el desenfoque del fondo, `cara` dice si hay que componer encima
       la pasada de la cabeza, `abe` es la aberración cromática del lente y
       `asp` es la proporción del cuadro — sin ella el bokeh sale ovalado,
       porque un desplazamiento en UV mide distinto en X que en Y.
       LOS TRES ARRANCAN EN CERO Y EL JUEGO NO PAGA NADA: el `if` de abajo deja
       una sola muestra por píxel mientras no haya cinemática. */
    texH: { value: null },
    dof:  { value: 0 }, cara: { value: 0 }, abe: { value: 0 }, asp: { value: 2 }
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tex, texH;
    uniform float sat, bri, con, pos, vig, grano, t, agua, dof, cara, abe, asp;
    varying vec2 vUv;
    float ruido(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    /* ── EL DESENFOQUE DEL FONDO ──
       Trece muestras en espiral de ángulo áureo. La espiral no es coquetería:
       con un anillo regular de doce puntos el desenfoque de un farol sale como
       doce copias del farol en círculo, que es exactamente lo que se ve cuando
       un desenfoque está mal muestreado. Repartidas por raíz del índice, la
       densidad queda pareja en el disco.
       Y VA CON EL MUESTREO NEAREST DEL DESTINO, que es lo correcto acá: este
       juego se dibuja a 1/1,7 y se estira con NEAREST, así que un desenfoque
       suave por interpolación sería lo ÚNICO liso del cuadro y se leería como
       un elemento pegado encima. */
    vec3 borrosa(vec2 uv, float r){
      vec3 s = texture2D(tex, uv).rgb;
      for (int i = 0; i < 12; i++){
        float a = float(i) * 2.39996323;
        float d = sqrt((float(i) + 0.5) / 12.0) * r;
        s += texture2D(tex, uv + vec2(cos(a) / asp, sin(a)) * d).rgb;
      }
      return s / 13.0;
    }
    void main(){
      vec2 uv = vUv;
      /* EL AGUA EN EL LENTE VA ANTES DE MUESTREAR, o sea que deforma la imagen
         en vez de pintarse encima. Dos senos lentos de frecuencias que no son
         múltiplos entre sí: así el ciclo no se repite nunca igual y no se lee
         como una animación. La amplitud es de menos de un píxel del destino de
         render — más que eso ya no es un vidrio mojado, es estar borracho. */
      float on = sin(uv.y*38.0 + t*1.7) * sin(uv.x*23.0 - t*1.1);
      uv += vec2(on, on*0.6) * 0.0016 * agua;
      vec2 dd = uv - 0.5;
      float ka = abe * dot(dd, dd);
      vec3 c;
      if (dof > 0.002) c = borrosa(uv, dof * 0.017);
      else if (ka > 0.0) {
        /* LA ABERRACIÓN VA SÓLO DONDE HAY ALGO NÍTIDO. Un fondo ya desenfocado
           no puede mostrar franjas de color en un borde que no tiene: hacerlo
           igual cuesta veintiséis muestras más para no cambiar un píxel. */
        c = texture2D(tex, uv).rgb;
        c.r = texture2D(tex, uv + dd * ka).r;
        c.b = texture2D(tex, uv - dd * ka).b;
      } else c = texture2D(tex, uv).rgb;
      /* LA CABEZA SE COMPONE ANTES DE LA GAMMA. Los dos destinos guardan color
         LINEAL, así que mezclarlos después de convertir a sRGB daría un borde
         más claro de lo que corresponde alrededor de la silueta. */
      if (cara > 0.5){
        vec4 h = texture2D(texH, uv);
        if (h.a > 0.0){
          float hr = texture2D(texH, uv + dd * ka).r;
          float hb = texture2D(texH, uv - dd * ka).b;
          c = mix(c, vec3(hr, h.g, hb), h.a);
        }
      }
      c = pow(max(c, 0.0), vec3(1.0/2.2));          /* lineal -> sRGB */
      c *= bri;
      c = (c - 0.5) * con + 0.5;
      float g = dot(c, vec3(0.299, 0.587, 0.114));
      c = mix(vec3(g), c, sat);
      /* EL TINTE DE LA NOCHE VA EN LAS SOMBRAS Y NO EN TODO EL CUADRO. Tiñendo
         parejo, los faroles —que son lo único cálido que hay— salen azules
         también, y ahí se pierde el único contraste de color del juego. */
      c += vec3(-0.010, 0.004, 0.030) * (1.0 - g);
      float r2 = dot(vUv - 0.5, vUv - 0.5);
      c *= 1.0 - smoothstep(0.06, 0.72, r2) * vig;
      /* el grano va anclado a la PANTALLA y no al mundo: es ruido de sensor de
         una cámara mala, no polvo pegado a las paredes */
      c += (ruido(floor(vUv * 620.0) + floor(t*11.0)) - 0.5) * grano;
      if (pos > 1.5) c = floor(c * pos + 0.5) / pos;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`,
  depthTest: false, depthWrite: false
});
const postEsc = new T.Scene();
const postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
{
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]), 3));
  g.setAttribute('uv', new T.BufferAttribute(new Float32Array([0,0, 2,0, 0,2]), 2));
  postEsc.add(new T.Mesh(g, postMat));
}

/* ── EL MARCO ──
   El juego se dibuja apaisado. En un teléfono vertical eso son dos opciones: o
   se encoge a una franja del once por ciento de la pantalla, o se GIRA. Se
   gira, y se gira el escenario entero para que el HUD acompañe. */
let W = 0, H2 = 0, GIRADO = false;
function medir(){
  const w = window.innerWidth, h = window.innerHeight;
  GIRADO = h > w;
  W = GIRADO ? h : w; H2 = GIRADO ? w : h;
  document.body.classList.toggle('girado', GIRADO);
  const e = $('escenario');
  e.style.width = W + 'px'; e.style.height = H2 + 'px';
  document.documentElement.style.setProperty('--eh', H2 + 'px');
  cam.aspect = W / H2; cam.updateProjectionMatrix();
  ren.setSize(W, H2, false);
  const rw = Math.max(64, Math.round(W / CFG.pix)), rh = Math.max(64, Math.round(H2 / CFG.pix));
  if (rt) rt.dispose();
  rt = new T.WebGLRenderTarget(rw, rh, {
    minFilter: T.NearestFilter, magFilter: T.NearestFilter,
    depthBuffer: true, colorSpace: T.LinearSRGBColorSpace
  });
  postMat.uniforms.tex.value = rt.texture;
  if (rtH) rtH.dispose();
  rtH = new T.WebGLRenderTarget(rw, rh, {
    minFilter: T.NearestFilter, magFilter: T.NearestFilter,
    depthBuffer: true, colorSpace: T.LinearSRGBColorSpace
  });
  postMat.uniforms.texH.value = rtH.texture;
  postMat.uniforms.asp.value = W / H2;
}
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(medir, 220); });

const RELOJ = { value: 0 };
let MODO = 'menu';         /* menu · cine · juego */
let PAUSA = false;

/* ══════════════════════════ LAS TEXTURAS ══════════════════════════
   Todas dibujadas por código en lienzos chicos y con filtro NEAREST. Y eso NO
   es una limitación asumida: este juego se dibuja a un tercio de resolución y
   se estira sin suavizar, así que una foto de 1024 píxeles sería lo único
   nítido de la pantalla y se leería como pegada encima. Un lienzo de 64 con
   filtro duro tiene píxeles del mismo tamaño que el resto del cuadro.

   Y VAN OSCURAS. Es de noche: una textura pensada para el día, iluminada por un
   farol naranja, sale marrón. El color base de cada superficie está elegido con
   la luz que le va a tocar, no en abstracto. */
/* ── CUÁNTOS METROS CUBRE CADA TEXTURA ──
   Es la única constante que hace falta para que el barrio tenga escala. Sin
   ella una pared de ladrillo sale con hiladas de veintidós centímetros y la
   casa se lee a casa de muñecas — ya pasó en RECREO con los lockers.
   LOS NÚMEROS ESTÁN CONTADOS SOBRE LA IMAGEN GENERADA: trece hiladas de
   ladrillo son un metro, diez tablas de revestimiento son dos metros cinco. Y
   valen también para las dibujadas por código, que se pintan para llenar el
   mismo cuadrado.
   DE ACÁ EN MÁS, LAS UV DE LA GEOMETRÍA SE ESCRIBEN EN METROS y el factor `u`
   de cada pieza las convierte a repeticiones dividiendo por esto. Con un
   divisor distinto por pieza —que es como estaba— cambiar una textura obliga a
   encontrar los once sitios donde se la usa. */
const METROS = { asfalto: 2.40, vereda: 1.30, pasto: 1.60, madera: 1.30,
                 ladrillo: 1.00, tabla: 2.05, teja: 1.30, piquete: 1.24 };

function lienzoTex(n, f, repx, repy){
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  f(g, n);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.magFilter = T.NearestFilter;
  t.minFilter = T.LinearMipmapLinearFilter;
  t.anisotropy = 4;
  t.repeat.set(repx || 1, repy || repx || 1);
  t.colorSpace = T.SRGBColorSpace;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function pinta(g, x, y, w, h, col){ g.fillStyle = col; g.fillRect(x, y, w, h); }
/* un gris con ruido: la base de casi todo lo que hay acá */
function granulado(g, n, base, amp){
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
    const v = base + (Math.random() - 0.5) * amp;
    g.fillStyle = 'rgb(' + (v|0) + ',' + (v|0) + ',' + ((v * 1.04)|0) + ')';
    g.fillRect(x, y, 1, 1);
  }
}

/* EL ASFALTO. Tres cosas: el granulado del árido, unas manchas más claras donde
   el paso de los autos lo puliό, y GRIETAS. Las grietas son lo que hace que una
   calle no se lea como una alfombra gris — y van finas y con quiebres, porque
   una grieta recta se lee a línea pintada. */
const texAsfalto = lienzoTex(64, (g, n) => {
  granulado(g, n, 38, 26);
  for (let k = 0; k < 26; k++){
    const x = Math.random()*n, y = Math.random()*n, r = rnd(2, 6);
    g.fillStyle = 'rgba(120,124,132,' + rnd(0.04, 0.11).toFixed(3) + ')';
    g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  g.strokeStyle = 'rgba(12,13,16,0.85)'; g.lineWidth = 1;
  for (let k = 0; k < 3; k++){
    let x = Math.random()*n, y = Math.random()*n;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 7; s++){ x += rnd(-9, 9); y += rnd(-9, 9); g.lineTo(x, y); }
    g.stroke();
  }
}, 1, 1);

/* LA VEREDA: losas de concreto con junta. La junta va DIBUJADA y no insinuada
   con ruido, porque es lo único que le da escala — sin ella una vereda es una
   franja gris y no se sabe si mide un metro o diez. */
const texVereda = lienzoTex(64, (g, n) => {
  granulado(g, n, 96, 16);
  g.fillStyle = 'rgba(30,32,38,0.75)';
  g.fillRect(0, 0, n, 2); g.fillRect(0, 0, 2, n);
  g.fillStyle = 'rgba(210,214,222,0.10)';
  g.fillRect(0, 2, n, 1); g.fillRect(2, 0, 1, n);
  for (let k = 0; k < 40; k++){
    g.fillStyle = 'rgba(60,64,72,' + rnd(0.05, 0.14).toFixed(3) + ')';
    g.fillRect(Math.random()*n|0, Math.random()*n|0, rnd(1,3)|0, rnd(1,3)|0);
  }
});

/* EL PASTO. De noche es casi negro con un verde muy apagado; lo que se ve son
   las briznas más claras contra el fondo oscuro, así que lo que hay que dibujar
   son ESAS y no el verde de fondo. */
const texPasto = lienzoTex(64, (g, n) => {
  pinta(g, 0, 0, n, n, '#141d13');
  for (let k = 0; k < 900; k++){
    const x = Math.random()*n, y = Math.random()*n, h = rnd(1.5, 4);
    g.strokeStyle = 'rgba(' + (34 + Math.random()*40 | 0) + ',' +
                    (56 + Math.random()*54 | 0) + ',' + (30 + Math.random()*26 | 0) + ',0.85)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-1, 1), y - h); g.stroke();
  }
});

/* LADRILLO. Las hiladas van TRABADAS —cada fila corrida media pieza— que es lo
   que distingue una pared de una cuadrícula. */
const texLadrillo = lienzoTex(64, (g, n) => {
  pinta(g, 0, 0, n, n, '#221a18');
  const h = 8, w = 16;
  for (let fy = 0; fy < n / h; fy++){
    const off = (fy % 2) * (w / 2);
    for (let fx = -1; fx < n / w + 1; fx++){
      const x = fx * w + off + 1, y = fy * h + 1;
      const v = rnd(0.72, 1.12);
      g.fillStyle = 'rgb(' + (78*v|0) + ',' + (46*v|0) + ',' + (40*v|0) + ')';
      g.fillRect(x, y, w - 2, h - 2);
    }
  }
});

/* EL REVESTIMIENTO DE TABLAS, que es de lo que están hechas casi todas las
   casas de un barrio así. Se tiñe por casa con el color del material, así que
   el lienzo va en gris: lo que aporta es la SOMBRA DEL SOLAPE entre tablas. */
const texTabla = lienzoTex(64, (g, n) => {
  granulado(g, n, 150, 10);
  for (let y = 0; y < n; y += 8){
    g.fillStyle = 'rgba(0,0,0,0.30)'; g.fillRect(0, y, n, 1);
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, y + 1, n, 1);
  }
});

/* LA TEJA. Escamas superpuestas, con la fila corrida media pieza igual que el
   ladrillo y con la sombra debajo de cada una. */
const texTeja = lienzoTex(64, (g, n) => {
  pinta(g, 0, 0, n, n, '#1b1d22');
  const h = 8, w = 12;
  for (let fy = 0; fy < n / h + 1; fy++){
    const off = (fy % 2) * (w / 2);
    for (let fx = -1; fx < n / w + 1; fx++){
      const x = fx * w + off, y = fy * h;
      const v = rnd(0.78, 1.16);
      g.fillStyle = 'rgb(' + (52*v|0) + ',' + (55*v|0) + ',' + (62*v|0) + ')';
      g.fillRect(x + 1, y + 1, w - 2, h - 3);
      g.fillStyle = 'rgba(0,0,0,0.45)';
      g.fillRect(x + 1, y + h - 2, w - 2, 1);
    }
  }
});

/* LA MADERA DE LA CERCA: tablas verticales con la veta a lo largo */
const texMadera = lienzoTex(32, (g, n) => {
  granulado(g, n, 104, 14);
  for (let k = 0; k < 60; k++){
    g.fillStyle = 'rgba(48,38,28,' + rnd(0.10, 0.28).toFixed(3) + ')';
    g.fillRect(Math.random()*n|0, 0, 1, n);
  }
  for (let x = 0; x < n; x += 8){
    g.fillStyle = 'rgba(0,0,0,0.42)'; g.fillRect(x, 0, 1, n);
  }
});

/* ── LA CERCA DE PIQUETES ──
   VA COMO UNA TEXTURA CON ALFA Y NO COMO SETENTA Y CINCO CAJAS, y la cuenta es
   la que decide: un cerco de frente mide doce metros y lleva unos setenta y
   cinco piquetes; por doscientas treinta y cuatro casas son diecisiete mil
   cajas —doscientos mil triángulos— para algo que de noche y a quince metros es
   una silueta con rayas.
   Lo que hace que una cerca se lea a piquetes NO es el volumen de cada tabla:
   son los HUECOS entre ellas. Un plano recortado con alfa los da exactos, y los
   postes y los dos travesaños —que sí son cajas— ponen el volumen donde se ve,
   que es al lado de uno.
   Y VA CON `alphaTest` Y NO CON TRANSPARENCIA: un material transparente no
   escribe profundidad, así que dos cercas cruzadas se dibujan en el orden
   equivocado y una tapa a la otra. `alphaTest` descarta el píxel ANTES de la
   mezcla y entonces sí escribe profundidad. */
const texPiquete = (() => {
  const w = 64, h = 64;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  /* ocho piquetes con su hueco: el ancho de la tabla y el del hueco salen de
     una cerca de verdad —once centímetros de tabla y cuatro y medio de aire— */
  const paso = 8, tabla = 6;
  for (let x = 0; x < w; x += paso){
    const v = 0.80 + Math.random()*0.35;
    g.fillStyle = 'rgb(' + (150*v|0) + ',' + (132*v|0) + ',' + (108*v|0) + ')';
    /* la punta va en pico: una tabla cortada a escuadra se lee a tapia */
    g.beginPath();
    g.moveTo(x, h); g.lineTo(x, 9); g.lineTo(x + tabla/2, 2);
    g.lineTo(x + tabla, 9); g.lineTo(x + tabla, h); g.closePath(); g.fill();
    /* la veta y el canto oscuro de un lado: es lo que le da espesor sin
       gastar un solo triángulo */
    g.fillStyle = 'rgba(60,46,32,0.42)'; g.fillRect(x + tabla - 1, 2, 1, h - 2);
    for (let k = 0; k < 5; k++){
      g.fillStyle = 'rgba(70,56,38,' + (0.10 + Math.random()*0.20).toFixed(3) + ')';
      g.fillRect(x + (Math.random()*tabla|0), Math.random()*h|0, 1, 3 + Math.random()*10|0);
    }
  }
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.magFilter = T.NearestFilter; t.minFilter = T.LinearMipmapLinearFilter;
  t.anisotropy = 4;
  t.colorSpace = T.SRGBColorSpace;
  return t;
})();

/* LA REJA DE ALAMBRE, y va CON CANAL ALFA. Es la única textura del juego que
   no es opaca, y por eso es la única que da problemas: un material transparente
   no escribe profundidad, así que dos rejas cruzadas se dibujan en el orden
   equivocado. Va con `alphaTest`, que descarta el píxel antes de la mezcla y
   entonces SÍ escribe profundidad — más barato y sin orden que mantener. */
const texReja = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 32, 32);
  g.strokeStyle = 'rgba(150,158,170,0.95)'; g.lineWidth = 1.6;
  for (let k = -32; k < 32; k += 8){
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + 32, 32); g.stroke();
    g.beginPath(); g.moveTo(k + 32, 0); g.lineTo(k, 32); g.stroke();
  }
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.magFilter = T.NearestFilter; t.minFilter = T.LinearMipmapLinearFilter;
  t.colorSpace = T.SRGBColorSpace;
  return t;
})();

/* ── LOS MATERIALES ──
   Casi todo va en Lambert: no hay sol, hay faroles, y un difuso puro con luces
   puntuales es exactamente lo que hace falta. Las excepciones están anotadas. */
const matAsfalto = new T.MeshPhongMaterial({
  map: texAsfalto, color: 0x5c626e,
  /* EL ASFALTO ES LO ÚNICO CON BRILLO ESPECULAR, y es la mitad de la lluvia.
     Una calle mojada no es una calle más oscura: es una calle que REFLEJA los
     faroles en una raya larga. Con Lambert eso no existe, así que acá sí va
     Phong — un solo material con especular en toda la escena. */
  specular: 0x8fa6c4, shininess: 62, reflectivity: 0.6
});
/* LA VEREDA VA MÁS CLARA QUE EL ASFALTO A PROPÓSITO. De noche, lo único que
   separa la calle de la vereda es el escalón de quince centímetros, y un
   escalón no se ve si las dos caras tienen el mismo tono. */
const matVereda  = new T.MeshLambertMaterial({ map: texVereda, color: 0x7d838d });
const matPasto   = new T.MeshLambertMaterial({ map: texPasto, color: 0x8a9b7e });
const matReja    = new T.MeshLambertMaterial({ map: texReja, color: 0x99a3b2,
                                               transparent: true, alphaTest: 0.42,
                                               side: T.DoubleSide });
/* ── LOS CUATRO MATERIALES CON COLOR POR VÉRTICE ──
   Son los mismos de arriba con `vertexColors` puesto. Existen porque las casas
   se funden por cuadra: sin color por vértice, las seis casas de una cuadra
   tendrían que compartir el color del material —o sea que serían la misma casa
   seis veces— y la única salida sería un material por casa, que es justo lo que
   la fusión estaba tratando de evitar. three.js multiplica
   `map × vertexColor × material.color`, así que el tinte por casa sale gratis y
   el `color` de acá queda como el tono general de la superficie. */
const matPared    = new T.MeshLambertMaterial({ map: texTabla, vertexColors: true, color: 0xb6b6b6 });
const matLadrilloV= new T.MeshLambertMaterial({ map: texLadrillo, vertexColors: true, color: 0x9a8c86 });
const matTechoV   = new T.MeshLambertMaterial({ map: texTeja, vertexColors: true, color: 0xacb3bd });
const matMaderaV  = new T.MeshLambertMaterial({ map: texMadera, vertexColors: true, color: 0x8e8474 });
const matPiquete = new T.MeshLambertMaterial({ map: texPiquete, vertexColors: true,
                                               color: 0xb8b8b8,
                                               transparent: true, alphaTest: 0.5,
                                               side: T.DoubleSide });
const matPoste   = new T.MeshLambertMaterial({ color: 0x30353d });
const matCable   = new T.MeshLambertMaterial({ color: 0x14171c });
/* ── LA CARPINTERÍA BLANCA ──
   La fascia, los marcos, los alféizares, las columnas y la baranda del porche.
   Va aparte y CLARA a propósito: de noche, una casa entera del mismo tono es
   una silueta, y lo único que le devuelve la forma son los bordes claros. Es la
   pieza más chica de todas y la que más se ve. */
/* ── TRES MALLAS MENOS POR CUADRA ──
   La carpintería oscura y la blanca son el mismo material con otro color, y lo
   mismo pasa con las ventanas encendidas, los televisores y la chapita del
   número, y con los troncos y las copas. Separados eran seis mallas por cuadra
   —o sea seis llamadas de dibujo por cuadra visible, y hay quince a la vez—
   para pintar cosas que sólo se distinguen por el tono. Con color por vértice
   son tres. Es exactamente el mismo argumento que hizo que las seis casas de
   una cuadra compartan un material. */
const matCarp    = new T.MeshLambertMaterial({ vertexColors: true, color: 0xffffff });
const matEmisivo = new T.MeshBasicMaterial({ vertexColors: true, color: 0xffffff });
const matVerde   = new T.MeshLambertMaterial({ vertexColors: true, color: 0xffffff, flatShading: true });
const C_MARCO = 0x2a2e35, C_BLANCO = 0xd6d2c8;
const C_VENT = 0xffcf8a, C_TV = 0x9fd8ff, C_NUM = 0x6b6250;
const C_TRONCO = 0x4a4038, C_COPA = 0x2c3f2a;
/* la chapita del número, con luz propia y muy floja: no ilumina nada, sólo se
   ve — que es lo que hace un número de casa a las tres de la mañana */
/* EL VIDRIO APAGADO NO PUEDE SER NEGRO PURO. Un negro absoluto no tiene
   sombreado que mostrar, así que la ventana deja de leerse como un hueco con
   vidrio y se lee como un agujero recortado en la pared. Va gris muy oscuro con
   un pelín de brillo. */
const matVidrio  = new T.MeshPhongMaterial({ color: 0x0d1218, specular: 0x334455, shininess: 90 });
/* la ventana encendida: emisiva, o sea que se ve aunque no le llegue una sola
   luz — que es lo que hace una ventana encendida */
/* la puerta lleva color por vértice: cada casa tiene la suya y todas se funden
   en la misma malla */
const matPuertaV = new T.MeshLambertMaterial({ vertexColors: true, color: 0xffffff });
const matFarol   = new T.MeshBasicMaterial({ color: 0xffe6b4 });
/* ── EL REFLEJO EN EL ASFALTO MOJADO ──
   LLEVA UN DEGRADADO Y NO UN COLOR PLANO, y es el mismo defecto que tenía el
   halo: un plano aditivo de color parejo tiene BORDE, así que el reflejo del
   farol sobre la calle salía como un rectángulo de cartulina naranja tirado en
   el piso — se ve en la primera captura. Con una textura radial que se apaga
   hacia afuera, el reflejo se funde con el asfalto. */
const texCharco = (() => {
  const n = 64, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(n/2, n/2, 0, n/2, n/2, n/2);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.35, 'rgba(255,255,255,0.42)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, n, n);
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  return t;
})();

/* NOTA SOBRE LO QUE NO ESTÁ ACÁ: los materiales de la lluvia y del halo NO son
   materiales de three.js sino dos `ShaderMaterial` escritos a mano, y viven en
   `f.js` y en `e.js`, al lado de la geometría que los usa. Los dos hacen lo
   mismo que no puede hacer un material de biblioteca: calcular algo POR PÍXEL o
   POR INSTANCIA en vez de por objeto — la caída de cuatro mil gotas y el
   degradado radial de noventa y seis halos.
   Y el color del auto tampoco está acá: se arma en `f.js` con `vertexColors`
   porque cada auto tiene el suyo y todos se funden en una malla. */
const matCharco  = new T.MeshBasicMaterial({ map: texCharco, color: 0xffc07a,
                                             transparent: true, opacity: 0.20,
                                             blending: T.AdditiveBlending,
                                             depthWrite: false, fog: false });
const matSalpica = new T.MeshBasicMaterial({ color: 0x9fc0e0, transparent: true,
                                             opacity: 0.13, depthWrite: false, side: T.DoubleSide });
const matCielo   = new T.MeshBasicMaterial({ color: 0x0c141f, side: T.BackSide, fog: false });
const matAutoV   = new T.MeshPhongMaterial({ color: 0x0f151c, specular: 0x445566, shininess: 80 });
const matAutoL   = new T.MeshBasicMaterial({ color: 0x60181a });

/* ══════════════════════ LAS TEXTURAS GENERADAS ══════════════════════
   Entran DESPUÉS y encima de las dibujadas por código. El orden importa: un
   data URI se decodifica de forma asincrónica, así que un material que naciera
   esperando la foto daría veinte cuadros con un mapa nulo —o sea gris plano— y
   si una imagen no decodifica ese material se queda sin nada. Naciendo con el
   lienzo, que ya funciona, no hay estado roto posible.

   Y VAN EN `MirroredRepeatWrapping`. Al modelo se le pidieron texturas «sin
   costura» y ninguna imagen generada lo es de verdad; coserlas a mano ensucia
   justo el centro, que es lo que más se mira. Con el espejo, la copia de al
   lado va dada vuelta: los dos bordes que se tocan son EL MISMO BORDE y la
   costura no puede existir. Lo que se paga es que el patrón queda simétrico
   cada dos repeticiones, y en manchas eso no se ve. */
const TEX_DESTINO = [
  ['asfalto',  () => matAsfalto],
  ['vereda',   () => matVereda],
  ['pasto',    () => matPasto],
  ['madera',   () => matMaderaV],
  ['ladrillo', () => matLadrilloV],
  ['tabla',    () => matPared],
  ['teja',     () => matTechoV]
];
const TEXGEN = { puestas: 0, pedidas: 0 };
function cargaTexturas(){
  if (typeof TEX_B64 === 'undefined') return;
  for (const [nom, dst] of TEX_DESTINO){
    const b64 = TEX_B64[nom];
    if (!b64) continue;
    TEXGEN.pedidas++;
    const im = new Image();
    im.onload = () => {
      const t = new T.Texture(im);
      t.wrapS = t.wrapT = T.MirroredRepeatWrapping;
      t.magFilter = T.LinearFilter;
      t.minFilter = T.LinearMipmapLinearFilter;
      t.anisotropy = 4;
      t.colorSpace = T.SRGBColorSpace;
      const m = dst();
      /* LA REPETICIÓN SE COPIA DE LA QUE HABÍA. El asfalto no toma su escala de
         las UV sino de `repeat` —es un plano de doscientos metros con UV de 0 a
         1— así que reemplazar el mapa sin copiarla deja la calle con UN texel
         estirado sobre el barrio entero. */
      if (m.map) t.repeat.copy(m.map.repeat);
      t.needsUpdate = true;
      m.map = t;
      m.needsUpdate = true;
      TEXGEN.puestas++;
    };
    im.onerror = () => {};
    im.src = 'data:image/webp;base64,' + b64;
  }
}

/* ══════════════════════════ FUNDIR PIEZAS ══════════════════════════
   Una casa son veinte piezas y una cuadra son ocho casas. Sueltas, cada pieza
   es una llamada de dibujo, y con sombras se paga DOS veces porque la pasada de
   sombra vuelve a recorrer la escena entera. Fundidas por material, una cuadra
   cuesta ocho llamadas midan lo que midan sus doscientas piezas.

   Y FUNDE TAMBIÉN EL COLOR, EN LOS VÉRTICES. Ésa es la parte que hace que la
   fusión no cueste variedad: sin color por vértice, todas las casas de la
   cuadra tendrían que compartir el color del material —o sea que serían la
   misma casa repetida ocho veces— y la única salida sería un material por casa,
   que es exactamente lo que se estaba tratando de evitar. three.js multiplica
   `map × vertexColor × material.color`, así que el tinte por casa sale gratis.

   EL ÍNDICE VA EN Uint32 y no en Uint16: una cuadra pasa cómodo los 65.535
   vértices, y el desborde no avisa — dibuja triángulos que apuntan a cualquier
   lado. */
const _mF = new T.Matrix4(), _eF = new T.Euler(), _qF = new T.Quaternion(),
      _vF = new T.Vector3(), _sF = new T.Vector3(), _nF = new T.Matrix3(),
      _cF = new T.Color();
function fundir(piezas){
  if (!piezas.length) return null;
  let nv = 0, ni = 0;
  const prep = piezas.map(z => {
    const g = z.g;
    nv += g.attributes.position.count;
    ni += g.index ? g.index.count : g.attributes.position.count;
    return g;
  });
  const pos = new Float32Array(nv*3), nor = new Float32Array(nv*3),
        uv = new Float32Array(nv*2), col = new Float32Array(nv*3);
  const idx = new Uint32Array(ni);
  let vo = 0, io = 0;
  piezas.forEach((z, k) => {
    const g = prep[k];
    const p = z.p || [0,0,0], r = z.r || [0,0,0], s = z.s || [1,1,1];
    _eF.set(r[0], r[1], r[2]); _qF.setFromEuler(_eF);
    _mF.compose(_vF.set(p[0], p[1], p[2]), _qF, _sF.set(s[0], s[1], s[2]));
    _nF.getNormalMatrix(_mF);
    _cF.set(z.c === undefined ? 0xffffff : z.c);
    const ap = g.attributes.position, an = g.attributes.normal, au = g.attributes.uv;
    for (let i = 0; i < ap.count; i++){
      _vF.fromBufferAttribute(ap, i).applyMatrix4(_mF);
      pos[(vo+i)*3] = _vF.x; pos[(vo+i)*3+1] = _vF.y; pos[(vo+i)*3+2] = _vF.z;
      if (an){ _vF.fromBufferAttribute(an, i).applyMatrix3(_nF).normalize();
        nor[(vo+i)*3] = _vF.x; nor[(vo+i)*3+1] = _vF.y; nor[(vo+i)*3+2] = _vF.z; }
      if (au){ uv[(vo+i)*2] = au.getX(i) * (z.u ? z.u[0] : 1);
               uv[(vo+i)*2+1] = au.getY(i) * (z.u ? z.u[1] : 1); }
      /* SI LA PIEZA YA TRAE COLOR POR VÉRTICE, SE MULTIPLICA en vez de
         pisarse: el cono del halo trae su degradado horneado y sin esto la
         fusión lo reemplazaría por un color plano, o sea que volvería a ser una
         pirámide sólida. */
      const ac = g.attributes.color;
      if (ac){
        col[(vo+i)*3] = _cF.r * ac.getX(i);
        col[(vo+i)*3+1] = _cF.g * ac.getY(i);
        col[(vo+i)*3+2] = _cF.b * ac.getZ(i);
      } else {
        col[(vo+i)*3] = _cF.r; col[(vo+i)*3+1] = _cF.g; col[(vo+i)*3+2] = _cF.b;
      }
    }
    if (g.index){ const gi = g.index.array;
      for (let i = 0; i < gi.length; i++) idx[io+i] = gi[i] + vo;
      io += gi.length;
    } else { for (let i = 0; i < ap.count; i++) idx[io+i] = vo + i; io += ap.count; }
    vo += ap.count;
  });
  const out = new T.BufferGeometry();
  out.setAttribute('position', new T.BufferAttribute(pos, 3));
  out.setAttribute('normal', new T.BufferAttribute(nor, 3));
  out.setAttribute('uv', new T.BufferAttribute(uv, 2));
  out.setAttribute('color', new T.BufferAttribute(col, 3));
  out.setIndex(new T.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

/* ══════════════════════════ LA MEDIDA DEL BARRIO ══════════════════════════
   Cinco por cinco cuadras. Todo lo demás sale de tres números y por eso el
   barrio se puede agrandar cambiando uno solo: si las medidas estuvieran
   escritas cuadra por cuadra, mover una calle sería mover cien cosas. */
const CUADRAS = 5;
const LOTE = 44;        /* lo que mide una cuadra por dentro */
const CALLE = 9;        /* de cordón a cordón */
const VEREDA = 2.6;
const PASO = LOTE + CALLE;                 /* 53 m de eje a eje */
const LADO = CUADRAS * PASO + CALLE;       /* 274 m de punta a punta */
const MITAD = LADO / 2;
/* los ejes de las seis calles en cada sentido */
const EJES = [];
for (let i = 0; i <= CUADRAS; i++) EJES.push(-MITAD + CALLE/2 + i * PASO);

/* semilla fija: el barrio tiene que ser el MISMO en cada partida y en cada
   teléfono, porque si no «la casa de la esquina» deja de querer decir algo */
let SEM = 20260830;
function az(){ SEM = (SEM * 1664525 + 1013904223) % 4294967296; return SEM / 4294967296; }
const azr = (a, b) => a + az() * (b - a);
const azi = (a, b) => Math.floor(azr(a, b + 1));

const GRUPOS = [];      /* las veinticinco cuadras, para prenderlas y apagarlas */
const CASAS = [];       /* {x,z,w,d,rot} para el choque */
const FAROLES = [];     /* {x,z,y} */

/* ── EL TECHO A DOS AGUAS ──
   Un prisma triangular escrito a mano: ocho triángulos. Con una caja aplastada
   el techo se lee a tapa, y con una pirámide de cuatro lados se lee a torre —
   lo que hace que una casa parezca una casa es el gablete. */
function geoGablete(w, d, h){
  const x = w/2, z = d/2;
  const v = [
    -x,0,-z,  x,0,-z,  x,0,z,  -x,0,z,        /* base */
    0,h,-z,   0,h,z                            /* la cumbrera */
  ];
  const f = [ 0,1,4,  1,2,5,  1,5,4,  2,3,5,  3,0,4,  3,4,5,  0,3,2,  0,2,1 ];
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(new Float32Array(v), 3));
  g.setIndex(f);
  g.computeVertexNormals();
  /* SIN UV UNA TEXTURA NO FALLA NI AVISA: WebGL le pasa (0,0) al atributo que
     falta y el techo entero sale pintado con UN SOLO texel, o sea de un color
     plano. Ya costó una vuelta con el túnel de LEMI. Se proyectan sobre el
     plano XZ, que para un techo es lo correcto. */
  const p = g.attributes.position, uv = new Float32Array(p.count*2);
  for (let i = 0; i < p.count; i++){
    uv[i*2] = (p.getX(i) + x) / 2.2;
    uv[i*2+1] = (p.getZ(i) + z + p.getY(i)) / 2.2;
  }
  g.setAttribute('uv', new T.BufferAttribute(uv, 2));
  return g;
}

/* ── LA PIRÁMIDE DEL TECHO A CUATRO AGUAS ──
   Base de dos por dos en y=0 y punta en y=1, así que escalándola por
   `[ancho/2, alto, fondo/2]` queda del tamaño que se pida. Escrita a mano y no
   con un `ConeGeometry` de cuatro lados porque ése nace centrado en su altura y
   girado cuarenta y cinco grados: acomodarlo son dos correcciones que hay que
   acordarse cada vez que se lo use. */
function geoPiramide(){
  const v = [-1,0,-1,  1,0,-1,  1,0,1,  -1,0,1,  0,1,0];
  const f = [0,1,4, 1,2,4, 2,3,4, 3,0,4, 0,3,2, 0,2,1];
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(new Float32Array(v), 3));
  g.setIndex(f);
  g.computeVertexNormals();
  const p = g.attributes.position, uv = new Float32Array(p.count*2);
  for (let i = 0; i < p.count; i++){
    uv[i*2] = (p.getX(i) + 1) * 0.5;
    uv[i*2+1] = (p.getZ(i) + 1 + p.getY(i)*1.4) * 0.5;
  }
  g.setAttribute('uv', new T.BufferAttribute(uv, 2));
  return g;
}

const geoCaja = new T.BoxGeometry(1, 1, 1);
const geoPlano = new T.PlaneGeometry(1, 1);
const geoCil = new T.CylinderGeometry(0.5, 0.5, 1, 8);

/* los colores de las casas: apagados y con poca saturación, porque de noche y
   bajo un farol naranja cualquier color vivo se va a marrón o a lila */
const COLORES_CASA = [0x9aa0a6, 0xb0a89a, 0x8e9aa4, 0xa89c92, 0x94a09a,
                      0xa9a2ae, 0x9c9184, 0x87919c];
const COLORES_TECHO = [0x6a7079, 0x5e6b74, 0x74697a, 0x6b6a5e];
const COLORES_CERCA = [0x7a6d5a, 0x6e6f68, 0x86745e, 0x5f6a64];

const COLORES_PUERTA = [0x5a3b2a, 0x2f4638, 0x3a3f52, 0x6a2d2a, 0x4a4340];

/* ══════════════════════════ UNA CASA ══════════════════════════
   Se arma MIRANDO A −Z y se la rota al colocarla. Escribirla cuatro veces —una
   por cada lado de la cuadra— es la forma más rápida de que tres de los cuatro
   lados terminen con la puerta contra el patio de atrás.

   Y ESTÁ HECHA DE LO QUE SE MIRA. La primera versión era una caja, un techo a
   dos aguas y dos ventanas: de lejos pasaba, y de cerca —que es donde uno
   camina— era una caja. Lo que hace que una casa se lea a casa no es el volumen
   grande sino los BORDES: el alero que sobresale y tira su sombra, la fascia
   blanca debajo, el zócalo de ladrillo que la apoya en el suelo, el alféizar de
   cada ventana, la canaleta y su bajada. Son piezas de diez centímetros y son
   las únicas que se ven a tres metros. */
function armaCasa(P, ancho, fondo){
  const pisos = az() < 0.36 ? 2 : 1;
  const hPiso = 3.05;
  const h = pisos * hPiso;
  const cCasa = COLORES_CASA[azi(0, COLORES_CASA.length-1)];
  const cTecho = COLORES_TECHO[azi(0, COLORES_TECHO.length-1)];
  const cPuerta = COLORES_PUERTA[azi(0, COLORES_PUERTA.length-1)];
  const w = ancho, d = fondo;
  const base = 0.55;                 /* el zócalo, o sea a qué altura está el piso */
  const ALERO = 0.55;

  /* EL ZÓCALO DE LADRILLO. Sin él la casa nace del pasto, y una casa que nace
     del pasto se lee a caja apoyada encima. */
  P.ladrillo.push({ g: geoCaja, p:[0, base/2, 0], s:[w+0.22, base, d+0.22], u:[(w+0.22)/METROS.ladrillo, base/METROS.ladrillo] });
  /* los muros */
  P.pared.push({ g: geoCaja, p:[0, base + h/2, 0], s:[w, h, d], c: cCasa, u:[w/METROS.tabla, h/METROS.tabla] });

  /* ── EL TECHO ──
     Tres formas y las tres con ALERO: el vuelo del techo por fuera de la pared
     es lo que hace la sombra horizontal debajo del borde, y esa sombra es el
     rasgo que más dice «casa» de todos. Un techo al ras se lee a maqueta. */
  const yT = base + h;
  const tipo = az();
  const hT = pisos === 2 ? azr(1.9, 2.4) : azr(2.2, 2.9);
  if (tipo < 0.42){          /* dos aguas con el gablete al frente */
    P.techo.push({ g: geoGablete(w + ALERO*2, d + ALERO*2, hT), p:[0, yT, 0], c: cTecho, u:[1/METROS.teja, 1/METROS.teja] });
    /* el frontón: el triángulo de pared que queda bajo el gablete, y va del
       color de la casa y no del techo */
    P.pared.push({ g: geoGablete(w, 0.16, hT*0.94), p:[0, yT, 0], c: cCasa, u:[1/METROS.tabla, 1/METROS.tabla] });
  } else if (tipo < 0.74){   /* dos aguas con la cumbrera a lo largo */
    P.techo.push({ g: geoGablete(d + ALERO*2, w + ALERO*2, hT), p:[0, yT, 0], r:[0, Math.PI/2, 0], c: cTecho, u:[1/METROS.teja, 1/METROS.teja] });
    P.pared.push({ g: geoGablete(d, 0.16, hT*0.94), p:[0, yT, 0], r:[0, Math.PI/2, 0], c: cCasa, u:[1/METROS.tabla, 1/METROS.tabla] });
  } else {                   /* a cuatro aguas */
    P.techo.push({ g: geoPiramide(), p:[0, yT, 0],
                   s:[(w + ALERO*2)/2, hT, (d + ALERO*2)/2], c: cTecho,
                   u:[(w + ALERO*2)/METROS.teja, (d + ALERO*2)/METROS.teja] });
  }
  /* LA FASCIA: la tabla blanca que cierra el canto del alero. Es lo que separa
     el techo de la pared cuando los dos están en penumbra. */
  for (const sz of [-1, 1])
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[0, yT + 0.07, sz*(d/2 + ALERO)], s:[w + ALERO*2, 0.17, 0.09] });
  for (const sx of [-1, 1])
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[sx*(w/2 + ALERO), yT + 0.07, 0], s:[0.09, 0.17, d + ALERO*2] });
  /* LA CANALETA Y SU BAJADA. Una casa con lluvia y sin canaleta es una casa a
     la que no le llueve nunca. */
  P.carp.push({ c: C_MARCO,  g: geoCaja, p:[0, yT - 0.06, -(d/2 + ALERO - 0.05)], s:[w + ALERO*1.6, 0.11, 0.13] });
  const bx = (az() < 0.5 ? -1 : 1) * (w/2 + ALERO - 0.16);
  P.carp.push({ c: C_MARCO,  g: geoCaja, p:[bx, base + h/2, -(d/2 + 0.10)], s:[0.10, h, 0.10] });

  /* ── LA PUERTA, EL PORCHE Y LOS ESCALONES ──
     Y LOS ESCALONES NO SON UN DETALLE: el piso de la casa está a cincuenta y
     cinco centímetros del pasto por el zócalo, así que sin escalones la puerta
     queda flotando y el porche es una repisa. */
  const px = azr(-w*0.18, w*0.18);
  const anchoP = Math.min(w*0.62, 4.6);
  const fondoP = 2.0;
  const zP = -(d/2 + fondoP/2);
  P.vereda.push({ g: geoCaja, p:[px, base/2 + 0.03, zP], s:[anchoP, base + 0.06, fondoP], u:[anchoP/METROS.vereda, fondoP/METROS.vereda] });
  for (let k = 0; k < 3; k++)
    P.vereda.push({ g: geoCaja, p:[px, base*(k+0.5)/3, -(d/2 + fondoP + 0.16*(3-k) - 0.08)],
                    s:[1.55, base*(k+1)/3, 0.34], u:[1.55/METROS.vereda, 0.34/METROS.vereda] });
  /* el techito del porche y sus columnas */
  const yPor = base + 2.42;
  P.techo.push({ g: geoCaja, p:[px, yPor, zP - 0.12], s:[anchoP + 0.5, 0.16, fondoP + 0.5], c: cTecho, u:[anchoP/METROS.teja, fondoP/METROS.teja] });
  P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[px, yPor - 0.13, zP - 0.12 - (fondoP + 0.5)/2], s:[anchoP + 0.5, 0.14, 0.08] });
  for (const sx of [-1, 1]){
    const cxp = px + sx*(anchoP/2 - 0.16);
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[cxp, base + 1.2, zP - fondoP/2 + 0.18], s:[0.15, 2.4, 0.15] });
    /* la baranda: dos travesaños y el pasamanos */
    if (az() < 0.7){
      P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[cxp, base + 0.92, zP], s:[0.09, 0.07, fondoP - 0.1] });
      P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[cxp, base + 0.50, zP], s:[0.07, 0.06, fondoP - 0.1] });
    }
  }
  P.puerta.push({ g: geoCaja, p:[px, base + 1.08, -(d/2 + 0.07)], s:[1.0, 2.16, 0.12], c: cPuerta });
  P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[px, base + 1.08, -(d/2 + 0.10)], s:[1.20, 2.36, 0.07] });
  /* el picaporte y el número, que son lo más chico que hay y lo que dice que
     acá vive alguien */
  P.carp.push({ c: C_MARCO,  g: geoCaja, p:[px + 0.36, base + 1.02, -(d/2 + 0.15)], s:[0.09, 0.09, 0.09] });
  P.emisivo.push({ c: C_NUM,  g: geoCaja, p:[px + anchoP/2 - 0.30, base + 1.95, -(d/2 + 0.13)], s:[0.30, 0.14, 0.05] });

  /* ── EL GARAJE ──
     Una de cada tres. Y cuando lo hay, la entrada de auto va a parar acá: una
     entrada que muere contra una pared lisa es una entrada que no lleva a
     ningún lado. */
  const garaje = az() < 0.34 && w > 10.2;
  const gx = px > 0 ? -(w/2 - 1.9) : (w/2 - 1.9);
  if (garaje){
    P.puerta.push({ g: geoCaja, p:[gx, base + 1.15, -(d/2 + 0.06)], s:[3.3, 2.30, 0.12], c: 0x8b8b8b });
    for (let k = 0; k < 5; k++)
      P.carp.push({ c: C_MARCO,  g: geoCaja, p:[gx, base + 0.14 + k*0.46, -(d/2 + 0.13)], s:[3.34, 0.05, 0.04] });
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[gx, base + 1.15, -(d/2 + 0.16)], s:[3.55, 2.52, 0.08] });
  }

  /* ── LAS VENTANAS ──
     Cada una lleva marco, cruceros, alféizar y a veces postigos. El alféizar es
     la pieza que más se nota: es lo único que sobresale de la pared y por eso
     es lo único que atrapa la luz de un farol de costado. */
  const ponVentana = (x, y, z, aw, ah, eje) => {
    const encendida = az() < 0.15;
    const tele = encendida && az() < 0.28;
    const n = eje === 'x';
    const S = (bx2, by, bz) => n ? [bz, by, bx2] : [bx2, by, bz];
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[x, y, z], s: S(aw + 0.20, ah + 0.20, 0.11) });
    const cap = encendida ? P.emisivo : P.vidrio;
    const cLuz = tele ? C_TV : C_VENT;
    cap.push({ g: geoCaja, p:[x + (n ? 0.04 : 0), y, z - (n ? 0 : 0.04)], s: S(aw, ah, 0.08), c: cLuz });
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[x + (n ? 0.06 : 0), y, z - (n ? 0 : 0.06)], s: S(0.06, ah, 0.05) });
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[x + (n ? 0.06 : 0), y, z - (n ? 0 : 0.06)], s: S(aw, 0.06, 0.05) });
    /* el alféizar, que sobresale */
    P.carp.push({ c: C_BLANCO,  g: geoCaja, p:[x + (n ? 0.06 : 0), y - ah/2 - 0.12, z - (n ? 0 : 0.06)], s: S(aw + 0.34, 0.09, 0.20) });
    if (az() < 0.42) for (const sg of [-1, 1])
      P.madera.push({ g: geoCaja, p: n ? [x + 0.03, y, z + sg*(aw/2 + 0.20)] : [x + sg*(aw/2 + 0.20), y, z - 0.03],
                      s: S(0.34, ah + 0.10, 0.06), c: cCasa, u:[0.34/METROS.tabla, (ah+0.1)/METROS.tabla] });
  };
  const yv = base + 1.55;
  const zf = -(d/2 + 0.02);
  if (!garaje || gx > 0) ponVentana(-w*0.30, yv, zf, 1.25, 1.45, 'z');
  if (!garaje || gx < 0) ponVentana( w*0.30, yv, zf, 1.25, 1.45, 'z');
  if (pisos === 2){
    ponVentana(-w*0.29, yv + hPiso, zf, 1.05, 1.20, 'z');
    ponVentana( w*0.29, yv + hPiso, zf, 1.05, 1.20, 'z');
    if (az() < 0.5) ponVentana(0, yv + hPiso, zf, 0.95, 1.10, 'z');
  }
  for (const sx of [-1, 1]) if (az() < 0.8){
    ponVentana(sx*(w/2 + 0.02), yv, azr(-d*0.26, d*0.20), 1.05, 1.25, 'x');
    if (pisos === 2 && az() < 0.7)
      ponVentana(sx*(w/2 + 0.02), yv + hPiso, azr(-d*0.26, d*0.20), 0.95, 1.10, 'x');
  }

  /* la chimenea, con su capucha */
  if (az() < 0.5){
    const chx = azr(-w*0.28, w*0.28), chz = azr(-d*0.16, d*0.24);
    P.ladrillo.push({ g: geoCaja, p:[chx, yT + hT*0.55, chz], s:[0.78, hT*1.5, 0.72], u:[0.78/METROS.ladrillo, hT*1.5/METROS.ladrillo] });
    P.carp.push({ c: C_MARCO,  g: geoCaja, p:[chx, yT + hT*1.32, chz], s:[0.94, 0.10, 0.88] });
  }
  /* el aire acondicionado o los tachos, contra el costado */
  if (az() < 0.55){
    const sx = az() < 0.5 ? -1 : 1;
    P.carp.push({ c: C_MARCO,  g: geoCaja, p:[sx*(w/2 + 0.42), 0.32, azr(-d*0.2, d*0.2)], s:[0.72, 0.64, 0.72] });
  }
  return { h: base + h + hT, w, d, px, gx: garaje ? gx : null, anchoP, fondoP };
}

/* ══════════════════════════ UN LOTE ══════════════════════════
   La casa, el jardín, la entrada de auto, la vereda de acceso y las cercas, en
   un marco LOCAL: `u` corre a lo largo de la calle y `v` entra en la cuadra.
   Todo lo del lote se escribe una sola vez en ese marco y se lo lleva al mundo
   con la base del lado que toque, así que las cuatro orientaciones salen del
   mismo código. Escribirlo cuatro veces —que es lo que hacía la versión
   anterior con dos— es la forma más rápida de que tres de los cuatro lados
   terminen con la puerta contra el patio. */
const JARDIN = 5.4;
const COLIS = [];
/* los cuatro lados de una cuadra: `u` a lo largo, `v` hacia adentro, y cuánto
   hay que girar la casa para que mire a la calle */
const LADOS = [
  { ux: 1, uz: 0, vx: 0, vz: 1, rot: 0 },              /* norte: mira a −Z */
  { ux:-1, uz: 0, vx: 0, vz:-1, rot: Math.PI },        /* sur */
  { ux: 0, uz:-1, vx: 1, vz: 0, rot: Math.PI/2 },      /* oeste: mira a −X */
  { ux: 0, uz: 1, vx:-1, vz: 0, rot:-Math.PI/2 }       /* este */
];

function armaLote(P, L, ox, oz, anchoLote, fondoLote, conVecinoIzq){
  const mundo = (u, v) => [ox + L.ux*u + L.vx*v, oz + L.uz*u + L.vz*v];
  /* una caja del marco local al mundo: `au` es su medida a lo largo y `av` la
     que entra, y girar noventa grados las intercambia */
  const caja = (cap, u, v, y, au, ah, av, c, uu) => {
    const [x, z] = mundo(u, v);
    cap.push({ g: geoCaja, p:[x, y, z], r:[0, L.rot, 0], s:[au, ah, av], c, u: uu });
    return [x, z];
  };
  const colis = (u, v, au, av) => {
    const [x, z] = mundo(u, v);
    const ex = Math.abs(L.ux)*au/2 + Math.abs(L.vx)*av/2;
    const ez = Math.abs(L.uz)*au/2 + Math.abs(L.vz)*av/2;
    COLIS.push({ x0: x - ex, x1: x + ex, z0: z - ez, z1: z + ez });
  };

  const a = azr(9.8, 12.2), d = azr(7.6, 9.6);
  const vCasa = JARDIN + d/2;
  const [cx, cz] = mundo(0, vCasa);

  const sub = { pared:[], techo:[], ladrillo:[], vidrio:[], emisivo:[],
                carp:[], puerta:[], madera:[], vereda:[], verde:[] };
  const info = armaCasa(sub, a, d);
  const co = Math.cos(L.rot), si = Math.sin(L.rot);
  for (const cap of Object.keys(sub)) for (const z of sub[cap]){
    const p = z.p || [0,0,0];
    z.p = [cx + p[0]*co + p[2]*si, p[1], cz - p[0]*si + p[2]*co];
    z.r = [(z.r||[0,0,0])[0], (z.r||[0,0,0])[1] + L.rot, (z.r||[0,0,0])[2]];
    P[cap].push(z);
  }
  CASAS.push({ x: cx, z: cz, w: a, d, rot: L.rot });
  colis(0, vCasa, a + 0.4, d + 0.4);
  /* y el porche, que sobresale y en el que uno se choca igual */
  colis(info.px, JARDIN - info.fondoP/2, info.anchoP + 0.3, info.fondoP + 0.3);

  /* ── LA VEREDA DE ACCESO ──
     De la puerta del cerco a los escalones del porche. Es la pieza que CONECTA
     la casa con la calle: sin ella el cerco tiene una puerta que da al pasto y
     el porche unos escalones que bajan a la nada. */
  caja(P.vereda, info.px, JARDIN/2, 0.155, 1.30, 0.02, JARDIN + 0.6, undefined, [1.30/METROS.vereda, (JARDIN+0.6)/METROS.vereda]);

  /* ── LA ENTRADA DE AUTO ──
     Va del cordón al garaje si lo hay, y si no al costado de la casa. Una
     entrada que muere contra una pared lisa no lleva a ningún lado. */
  const du = info.gx !== null ? info.gx : (info.px > 0 ? -(a/2 + 1.7) : (a/2 + 1.7));
  const largoD = info.gx !== null ? (JARDIN + 0.6) : (JARDIN + 2.6);
  caja(P.vereda, du, largoD/2 - 0.3, 0.152, 3.2, 0.02, largoD, undefined, [3.2/METROS.vereda, largoD/METROS.vereda]);

  /* ── LAS CERCAS ──
     Postes cada dos metros y medio, dos travesaños y un paño de piquetes
     recortado con alfa. La puerta del frente cae EXACTAMENTE sobre la vereda de
     acceso: un portón corrido de la vereda es lo que hace que un barrio se vea
     generado. */
  const cCerca = COLORES_CERCA[azi(0, COLORES_CERCA.length-1)];
  const hC = 1.12;
  const tramo = (u0, u1, v0, v1) => {
    const du2 = u1 - u0, dv = v1 - v0;
    const largo = Math.hypot(du2, dv);
    if (largo < 0.4) return;
    const um = (u0+u1)/2, vm = (v0+v1)/2;
    const alo = Math.abs(du2) > Math.abs(dv);      /* corre a lo largo o hacia adentro */
    const [x, z] = mundo(um, vm);
    const rr = L.rot + (alo ? 0 : Math.PI/2);
    /* el paño: un plano con la textura de piquetes */
    P.piquete.push({ g: geoPlano, p:[x, 0.15 + hC*0.46, z], r:[0, rr, 0],
                     s:[largo, hC*0.92, 1], c: cCerca, u:[largo/METROS.piquete, 1] });
    /* los travesaños, por detrás */
    for (const yy of [0.15 + hC*0.24, 0.15 + hC*0.72])
      P.madera.push({ g: geoCaja, p:[x, yy, z], r:[0, rr, 0],
                      s:[largo, 0.075, 0.055], c: cCerca, u:[largo/METROS.madera, 1] });
    /* los postes, cada 2,5 m y siempre uno en cada punta */
    const n = Math.max(1, Math.round(largo / 2.5));
    for (let k = 0; k <= n; k++){
      const t = k/n;
      const [px2, pz2] = mundo(u0 + du2*t, v0 + dv*t);
      P.madera.push({ g: geoCaja, p:[px2, 0.15 + hC*0.55, pz2], r:[0, rr, 0],
                      s:[0.115, hC*1.10, 0.115], c: cCerca, u:[0.115/METROS.madera, hC*1.1/METROS.madera] });
      P.carp.push({ c: C_MARCO,  g: geoCaja, p:[px2, 0.15 + hC*1.10, pz2], r:[0, rr, 0], s:[0.155, 0.06, 0.155] });
    }
    const ex = Math.abs(mundo(u1,v1)[0] - mundo(u0,v0)[0])/2 + 0.16;
    const ez = Math.abs(mundo(u1,v1)[1] - mundo(u0,v0)[1])/2 + 0.16;
    COLIS.push({ x0: x - ex, x1: x + ex, z0: z - ez, z1: z + ez });
  };
  const mu = anchoLote/2 - 0.10;
  const vF = 0.42, vFondo = fondoLote - 0.5;
  /* frente, con el hueco de la puerta centrado en la vereda de acceso */
  tramo(-mu, info.px - 0.75, vF, vF);
  tramo(info.px + 0.75, mu, vF, vF);
  /* los dos postes del portón, más altos: es lo que hace que se lea a entrada */
  for (const sg of [-1, 1]){
    const [gx2, gz2] = mundo(info.px + sg*0.75, vF);
    P.madera.push({ g: geoCaja, p:[gx2, 0.15 + hC*0.72, gz2], r:[0, L.rot, 0],
                    s:[0.15, hC*1.44, 0.15], c: cCerca, u:[0.15/METROS.madera, hC*1.44/METROS.madera] });
    P.carp.push({ c: C_MARCO,  g: geoCaja, p:[gx2, 0.15 + hC*1.46, gz2], r:[0, L.rot, 0], s:[0.20, 0.07, 0.20] });
  }
  /* medianera: SÓLO la de un lado, porque la del otro la pone el vecino. Con
     las dos, cada límite entre lotes queda con dos cercas superpuestas — y eso
     no se ve como una cerca más gruesa, se ve como un parpadeo entre dos planos
     que pelean el mismo píxel. */
  if (conVecinoIzq) tramo(-mu, -mu, vF, vFondo);
  /* y el fondo del lote */
  tramo(-mu, mu, vFondo, vFondo);

  /* el buzón, al lado del portón y sobre la vereda */
  const [bx2, bz2] = mundo(info.px - 1.55, 0.05);
  P.madera.push({ g: geoCil, p:[bx2, 0.15 + 0.55, bz2], s:[0.085, 1.1, 0.085], c: 0x6a6055 });
  P.carp.push({ c: C_MARCO,  g: geoCaja, p:[bx2, 0.15 + 1.24, bz2], r:[0, L.rot, 0], s:[0.42, 0.22, 0.26] });

  /* un árbol o un arbusto en el jardín */
  if (az() < 0.55){
    const [tx, tz] = mundo(info.px + (az() < 0.5 ? -1 : 1) * azr(2.6, mu - 0.6), azr(1.6, JARDIN - 1.2));
    const th = azr(4.4, 7.2);
    P.verde.push({ c: C_TRONCO,  g: geoCil, p:[tx, 0.15 + th*0.30, tz], s:[0.34, th*0.60, 0.34] });
    P.verde.push({ c: C_COPA,  g: new T.ConeGeometry(azr(1.8, 2.7), th*0.78, 7), p:[tx, 0.15 + th*0.74, tz] });
    COLIS.push({ x0: tx - 0.38, x1: tx + 0.38, z0: tz - 0.38, z1: tz + 0.38 });
  }
  for (let k = 0; k < 2; k++) if (az() < 0.6){
    const [ax, azz] = mundo(azr(-mu + 0.6, mu - 0.6), azr(0.9, JARDIN - 0.8));
    P.verde.push({ c: C_COPA,  g: new T.SphereGeometry(azr(0.42, 0.72), 6, 4), p:[ax, 0.15 + 0.42, azz] });
  }
}

/* ══════════════════════════ UNA CUADRA ══════════════════════════
   `lados` dice cuáles de los cuatro lados llevan casas. Las veinticinco de
   adentro llevan norte y sur —tres y tres— y las del BORDE llevan sólo el lado
   que mira a la calle.

   POR QUÉ HAY CUADRAS DE BORDE: sin ellas, parado en la calle exterior y
   mirando hacia afuera no hay NADA — el barrio termina en un plano de asfalto y
   niebla, y eso se lee a maqueta recortada. Con una vuelta de casas más y una
   línea de árboles detrás, el barrio se cierra: para donde uno mire hay
   vecindario, que es exactamente lo que se pidió. Y no cuestan lo que
   parecería, porque sólo se ven de un lado y el apagado por distancia se las
   come apenas uno se mete dos cuadras adentro. */
function ejeDe(i){ return -MITAD + CALLE/2 + i * PASO; }

function armaCuadra(bi, bj, lados){
  const x0 = ejeDe(bi) + CALLE/2, z0 = ejeDe(bj) + CALLE/2;
  const x1 = x0 + LOTE, z1 = z0 + LOTE;
  const cx = (x0 + x1)/2, cz = (z0 + z1)/2;
  const P = { pared:[], techo:[], ladrillo:[], vidrio:[], emisivo:[],
              carp:[], puerta:[], madera:[], piquete:[], vereda:[],
              pasto:[], verde:[] };

  const vy = 0.15;
  const li = LOTE - VEREDA*2;
  /* LA VEREDA VA SÓLO DONDE HAY CALLE. En una cuadra de borde, tres de sus
     cuatro lados dan al campo: poner vereda ahí sería una vereda que no lleva a
     ningún lado y que encima delata que la cuadra está cortada. */
  const conCalle = [ bj >= 0 && bj <= CUADRAS, bj >= -1 && bj < CUADRAS,
                     bi >= 0 && bi <= CUADRAS, bi >= -1 && bi < CUADRAS ];
  if (conCalle[0]) P.vereda.push({ g: geoCaja, p:[cx, vy/2, z0 + VEREDA/2], s:[LOTE, vy, VEREDA], u:[LOTE/METROS.vereda, VEREDA/METROS.vereda] });
  if (conCalle[1]) P.vereda.push({ g: geoCaja, p:[cx, vy/2, z1 - VEREDA/2], s:[LOTE, vy, VEREDA], u:[LOTE/METROS.vereda, VEREDA/METROS.vereda] });
  if (conCalle[2]) P.vereda.push({ g: geoCaja, p:[x0 + VEREDA/2, vy/2, cz], s:[VEREDA, vy, LOTE - VEREDA*2], u:[VEREDA/METROS.vereda, (LOTE-VEREDA*2)/METROS.vereda] });
  if (conCalle[3]) P.vereda.push({ g: geoCaja, p:[x1 - VEREDA/2, vy/2, cz], s:[VEREDA, vy, LOTE - VEREDA*2], u:[VEREDA/METROS.vereda, (LOTE-VEREDA*2)/METROS.vereda] });
  /* el césped, apenas por encima: dos planos a la misma altura pelean por el
     mismo píxel y parpadean */
  P.pasto.push({ g: geoPlano, p:[cx, vy + 0.012, cz], r:[-Math.PI/2, 0, 0], s:[li, li, 1], u:[li/METROS.pasto, li/METROS.pasto] });

  const anchoLote = li / 3, fondoLote = li / 2;
  for (const s of lados){
    const L = LADOS[s];
    for (let k = 0; k < 3; k++){
      const t = anchoLote * (k + 0.5) - li/2;
      let ox, oz;
      if (s === 0){ ox = cx + t; oz = z0 + VEREDA; }
      else if (s === 1){ ox = cx - t; oz = z1 - VEREDA; }
      else if (s === 2){ ox = x0 + VEREDA; oz = cz - t; }
      else { ox = x1 - VEREDA; oz = cz + t; }
      armaLote(P, L, ox, oz, anchoLote, fondoLote, k > 0);
    }
  }

  const g = new T.Group();
  const pon = (piezas, mat, sombra) => {
    const geo = fundir(piezas);
    if (!geo) return;
    const m = new T.Mesh(geo, mat);
    m.castShadow = !!sombra; m.receiveShadow = true;
    g.add(m);
  };
  pon(P.vereda, matVereda, false);
  pon(P.pasto, matPasto, false);
  pon(P.pared, matPared, true);
  pon(P.ladrillo, matLadrilloV, true);
  pon(P.techo, matTechoV, true);
  pon(P.carp, matCarp, true);
  pon(P.puerta, matPuertaV, false);
  pon(P.vidrio, matVidrio, false);
  pon(P.emisivo, matEmisivo, false);
  pon(P.madera, matMaderaV, true);
  pon(P.piquete, matPiquete, true);
  pon(P.verde, matVerde, true);
  g.userData.cx = cx; g.userData.cz = cz;
  escena.add(g);
  GRUPOS.push(g);
  return { casas: lados.length * 3 };
}

/* ══════════════════════════ LO QUE HAY DETRÁS DEL BORDE ══════════════════════════
   Una franja de árboles y matorral pegada a la última fila de casas. No es
   decoración: es lo que TAPA el final del mundo. Con la niebla sola, mirando
   hacia afuera desde la calle exterior se ve el plano de asfalto perdiéndose en
   gris — y un plano que se pierde en gris se lee a que ahí se acabó el juego.
   Con los árboles, lo que hay detrás del barrio es más barrio que no se ve. */
function armaArboleda(){
  const tronco = [], copa = [];
  const borde = MITAD + LOTE;
  for (let k = 0; k < 900; k++){
    const lado = azi(0, 3);
    let x, z;
    const t = azr(-borde - 6, borde + 6), p2 = azr(1.5, 26);
    if (lado === 0){ x = t; z = -borde - p2; }
    else if (lado === 1){ x = t; z = borde + p2; }
    else if (lado === 2){ x = -borde - p2; z = t; }
    else { x = borde + p2; z = t; }
    const h = azr(5.5, 11.5);
    tronco.push({ g: geoCil, p:[x, h*0.28, z], s:[0.36, h*0.56, 0.36], c: C_TRONCO });
    copa.push({ g: new T.ConeGeometry(azr(2.0, 3.4), h*0.82, 6), p:[x, h*0.72, z], c: C_COPA });
  }
  const m1 = new T.Mesh(fundir(tronco.concat(copa)), matVerde);
  m1.receiveShadow = true;
  escena.add(m1);
  ARBOLEDA.push(m1);
}
const ARBOLEDA = [];

/* ══════════════════════════ LAS CALLES ══════════════════════════
   El asfalto es UN plano que cubre los doscientos setenta y cuatro metros, y
   encima van las veredas de cada cuadra. Al revés —una losa de asfalto por
   calle— serían sesenta piezas para dibujar una superficie continua, con una
   costura visible en cada cruce.

   LAS LÍNEAS VAN CORTADAS Y NO CORRIDAS. Una raya continua en el medio de una
   calle de barrio no existe: lo que hay son rayas de dos metros cada seis, y
   ese ritmo es lo que da velocidad al caminar. */
let sueloMesh = null, lineasMesh = null;
function armaCalles(){
  /* EL PLANO SE PASA DEL BARRIO POR DOS CUADRAS. Las cuadras de borde viven
