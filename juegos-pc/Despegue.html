<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DESPEGUE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#06070d;color:#eef2ff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
/* ══════════ VERTICAL NATIVO ══════════
   Un cohete sube, asi que el marco es el telefono tal como se agarra: no hay
   marco girado ni pantalla de «gira el celular». En una pantalla apaisada el
   juego ocupa una columna centrada de proporcion de telefono: el mundo es una
   columna y a los costados no hay nada que mostrar. */
#envase{position:fixed;inset:0;display:grid;place-items:center;background:#06070d}
#marco{position:relative;width:min(100%,calc(100vh*0.5625));height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%}

/* ══════════ EL DESTELLO Y LA VIÑETA ══════════ */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:8;
  background:radial-gradient(ellipse at 50% 50%,transparent 30%,var(--fc,#fff) 110%)}
#vin{position:absolute;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(2,4,10,.55) 120%)}

/* ══════════ EL HUD ══════════ */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
body.jugando #hud{opacity:1}
#alt{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));
  font:800 clamp(22px,calc(var(--mw,412px)*0.075),40px)/1 system-ui,sans-serif;letter-spacing:.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
#altU{font-size:.5em;opacity:.7;margin-left:4px}
#vel{position:absolute;left:14px;top:calc(56px + env(safe-area-inset-top));
  font:700 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:rgba(220,232,255,.72);
  text-shadow:0 1px 6px rgba(0,0,0,.8)}
#tiempo{position:absolute;left:14px;top:calc(74px + env(safe-area-inset-top));
  font:700 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:#ffd447;
  text-shadow:0 1px 6px rgba(0,0,0,.8);display:none}
#tiempo.hay{display:block}
/* el combustible: una barra vertical a la derecha, porque el combustible se
   gasta hacia abajo y una barra horizontal no dice para donde */
#comb{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));width:14px;height:34vh;
  border-radius:99px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);overflow:hidden}
#combI{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:99px;
  background:linear-gradient(180deg,#ffd447,#ff7a2a)}
#combL{position:absolute;right:34px;top:calc(12px + env(safe-area-inset-top));
  font:700 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:rgba(220,232,255,.72);
  writing-mode:vertical-rl;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#mon{position:absolute;right:14px;top:calc(34vh + 22px + env(safe-area-inset-top));
  font:800 13px/1 system-ui;color:#ffd447;text-shadow:0 1px 6px rgba(0,0,0,.8)}
/* el rotulo de la capa: aparece al entrar y se va */
#capa{position:absolute;left:50%;top:24%;transform:translateX(-50%);text-align:center;width:90%;
  font:800 clamp(14px,calc(var(--mw,412px)*0.05),24px)/1.2 system-ui,sans-serif;letter-spacing:.18em;
  color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.85);opacity:0;transition:opacity .35s}
#capa.on{opacity:1}
#capa small{display:block;font:700 10px/1.6 ui-monospace,monospace;letter-spacing:.2em;opacity:.7}
/* el aviso grande del centro: la cuenta regresiva y el «MAXIMO» */
#grande{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font:900 clamp(48px,calc(var(--mw,412px)*0.2),110px)/1 system-ui,sans-serif;color:#fff;
  text-shadow:0 4px 24px rgba(0,0,0,.8);opacity:0;transition:opacity .15s}
#grande.on{opacity:1}
/* la rafaga: el unico boton de la partida. Grande y abajo a la derecha, donde
   esta el pulgar. */
#bRaf{position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));
  width:86px;height:86px;border-radius:50%;pointer-events:auto;
  border:2px solid rgba(255,255,255,.28);background:radial-gradient(circle at 40% 35%,#ff9a4a,#c8331e 70%);
  color:#fff;font:800 11px/1.1 system-ui;letter-spacing:.08em;box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:none}
body.jugando #bRaf.hay{display:block}
#bRaf.vacio{filter:grayscale(1) brightness(.6)}
#bRaf b{display:block;font-size:20px;margin-top:3px}
#ayuda{position:absolute;left:60px;right:106px;bottom:calc(30px + env(safe-area-inset-bottom));
  font:700 clamp(8px,calc(var(--mw,412px)*0.026),10.5px)/1.5 system-ui;letter-spacing:.08em;color:rgba(255,255,255,.62);
  text-shadow:0 1px 6px rgba(0,0,0,.8);text-align:center}
#bPausa{position:absolute;left:14px;bottom:calc(22px + env(safe-area-inset-bottom));width:40px;height:40px;
  border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,22,.55);color:#eef2ff;
  font:700 14px/1 system-ui;pointer-events:auto;display:none}
body.jugando #bPausa{display:block}

/* ══════════ LAS PANTALLAS ══════════ */
.pan{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:14px;overflow:hidden;
  visibility:hidden;opacity:0;transition:opacity .2s ease,visibility .2s}
.pan.on{visibility:visible;opacity:1}
.pan::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,7,13,.92),rgba(6,7,13,.80) 14%,rgba(6,7,13,.30) 27%,rgba(6,7,13,.14) 34%,rgba(6,7,13,.14) 50%,rgba(6,7,13,.86) 60%,rgba(6,7,13,.96))}
/* el menu deja ver el cohete girando en el medio: el velo se abre ahi */
.caja{position:relative;text-align:center;width:min(440px,94%);max-height:100%;overflow:auto;padding:4px 2px}
.caja::-webkit-scrollbar{display:none}
/* el tamano sale del ANCHO DEL MARCO (`--mw`, en px, lo escribe `medir`) y no de
   la ventana: en una pantalla apaisada el marco es una columna angosta y `vw`
   es el ancho de toda la ventana */
h1{font:900 clamp(22px,calc(var(--mw,412px)*0.112),54px)/1 system-ui,sans-serif;letter-spacing:.16em;text-indent:.16em;
  background:linear-gradient(180deg,#fff6e6 0%,#ffb05c 48%,#ff5a2a 68%,#ffd9a8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 16px rgba(255,120,40,.35))}
h1::after{content:'';display:block;width:70px;height:2px;margin:10px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,#ffb05c,transparent)}
.sub{font:700 9.5px/1.7 ui-monospace,monospace;letter-spacing:.24em;color:rgba(255,220,190,.55);
  text-transform:uppercase;margin:8px 0 12px}
.tx{font-size:12.5px;line-height:1.6;color:rgba(235,240,255,.82);margin-bottom:12px;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.bt{display:block;width:100%;margin-top:8px;padding:13px 16px;border-radius:14px;
  border:1px solid rgba(255,176,92,.26);background:rgba(12,14,24,.74);color:#eef2ff;
  font:800 14px/1 system-ui,sans-serif;letter-spacing:.08em;transition:transform .1s}
.bt:active{transform:scale(.97)}
.bt.p{background:linear-gradient(135deg,#ffb05c,#ff5a2a);color:#2a1004;border-color:transparent}
.bt.sel{background:linear-gradient(135deg,#ffb05c,#ff5a2a);color:#2a1004;border-color:transparent}
.bt[disabled]{opacity:.4}
.fila{display:flex;gap:6px;margin-top:8px}
.fila .bt{margin-top:0;padding:11px 6px;font-size:12px}
.pie{margin-top:12px;font-size:10.5px;line-height:1.6;color:rgba(225,232,250,.6);text-shadow:0 1px 4px rgba(0,0,0,.9)}
.saldo{font:800 15px/1 system-ui;color:#ffd447;margin:6px 0 4px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
/* el espacio del medio del menu, donde se ve el cohete: no es un hueco, es el
   sitio del personaje */
.hueco{height:26vh}
.hueco.chico{height:12vh}

/* ── EL TALLER: UNA FICHA POR MEJORA ──
   Nombre, que hace, el nivel en puntos y el boton con el precio. Todo eso junto
   es lo que hace que una mejora se pueda ELEGIR. */
.mej{display:flex;align-items:center;gap:10px;margin-top:7px;padding:10px 10px 10px 12px;border-radius:14px;
  border:1px solid rgba(255,176,92,.18);background:rgba(12,16,28,.82);text-align:left}
.mej .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:rgba(255,176,92,.12);flex:0 0 auto}
.mej .cu{flex:1;min-width:0}
.mej .n{font:800 13px/1.2 system-ui;letter-spacing:.04em}
.mej .d{font:600 10px/1.4 system-ui;color:rgba(220,232,255,.62);margin-top:2px}
.mej .pt{display:flex;gap:3px;margin-top:5px}
.mej .pt i{width:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.mej .pt i.on{background:linear-gradient(90deg,#ffb05c,#ff5a2a)}
.mej .bt{width:auto;margin:0;padding:10px 12px;font-size:12px;min-width:84px;flex:0 0 auto}
.mej .bt.eq{background:rgba(45,226,168,.16);border-color:rgba(45,226,168,.45);color:#8ef0c4}
/* los estilos: una grilla de fichas con la muestra de la pintura */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.est{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid rgba(255,255,255,.14);overflow:hidden;
  background:#111;display:grid;place-items:end center;padding:5px;font:700 8.5px/1.1 system-ui;letter-spacing:.04em;
  text-shadow:0 1px 4px rgba(0,0,0,.9)}
.est canvas{position:absolute;inset:0;width:100%;height:100%}
.est span{position:relative;z-index:1;background:rgba(0,0,0,.45);padding:2px 5px;border-radius:6px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est.sel{border:2px solid #ffb05c;box-shadow:0 0 14px rgba(255,176,92,.45)}
.est.bloq canvas{filter:grayscale(1) brightness(.45)}
.est .cand{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:1;font-size:18px}
.tabs{display:flex;gap:6px;margin-top:6px}
.tabs .bt{margin:0;padding:10px 6px;font-size:12px}

/* la pantalla de resultado */
.res{font:900 clamp(30px,calc(var(--mw,412px)*0.12),64px)/1 system-ui;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.8);margin:6px 0 2px}
.res small{font-size:.45em;opacity:.7}
.resL{font:700 10px/1.6 ui-monospace,monospace;letter-spacing:.2em;color:rgba(255,220,190,.6)}
.nuevo{display:inline-block;margin:6px 4px 0;padding:6px 10px;border-radius:99px;font:800 10px/1 system-ui;letter-spacing:.1em;
  background:rgba(45,226,168,.16);border:1px solid rgba(45,226,168,.45);color:#8ef0c4}

#carga{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#06070d;transition:opacity .3s}
#carga.ido{opacity:0;pointer-events:none}
.barc{width:min(240px,60%);height:4px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;margin:16px auto 0}
.barc i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb05c,#ff5a2a);transition:width .3s}
</style>
</head>
<body>

<div id="carga"><div class="caja"><h1>DESPEGUE</h1><div class="sub" id="cSub">CARGANDO</div>
  <div class="barc"><i id="cBarra"></i></div></div></div>

<div id="envase"><div id="marco">
  <canvas id="cv"></canvas>
  <div id="vin"></div>
  <div id="flash"></div>

  <div id="hud">
    <div id="alt">0<span id="altU">m</span></div>
    <div id="vel"></div>
    <div id="tiempo"></div>
    <div id="comb"><i id="combI"></i></div>
    <div id="combL"></div>
    <div id="mon"></div>
    <div id="capa"><span id="capaN"></span><small id="capaS"></small></div>
    <div id="grande"></div>
    <button id="bRaf"><span id="rafN"></span><b id="rafC"></b></button>
    <div id="ayuda"></div>
    <button id="bPausa">॥</button>
  </div>

  <div class="pan" id="pIdioma"><div class="caja">
    <h1>DESPEGUE</h1><div class="sub">IDIOMA · LANGUAGE</div>
    <button class="bt" data-lang="es">Castellano</button>
    <button class="bt" data-lang="en">English</button>
    <button class="bt" data-lang="pt">Português</button>
  </div></div>

  <div class="pan" id="pMenu"><div class="caja">
    <h1>DESPEGUE</h1><div class="sub" id="mSub"></div>
    <div class="hueco"></div>
    <div class="saldo" id="mSaldo"></div>
    <button class="bt p" id="bLanzar"></button>
    <div class="fila"><button class="bt" id="bTaller"></button><button class="bt" id="bEstilos"></button></div>
    <button class="bt" id="bAjustes"></button>
    <div class="pie" id="mPie"></div>
  </div></div>

  <div class="pan" id="pTaller"><div class="caja">
    <h1 id="tTit"></h1><div class="sub" id="tSub"></div>
    <div class="saldo" id="tSaldo"></div>
    <div class="tabs"><button class="bt" id="tabMej"></button><button class="bt" id="tabRaf"></button></div>
    <div id="lMej"></div>
    <button class="bt" id="tVolver"></button>
  </div></div>

  <div class="pan" id="pEstilos"><div class="caja">
    <h1 id="eTit"></h1><div class="sub" id="eSub"></div>
    <div class="hueco chico"></div>
    <div class="saldo" id="eSaldo"></div>
    <div class="grid" id="gEst"></div>
    <button class="bt" id="eVolver"></button>
  </div></div>

  <div class="pan" id="pAjustes"><div class="caja">
    <h1 id="aTit"></h1><div class="sub" id="aSub"></div>
    <div class="pie" id="aMusL"></div>
    <input type="range" id="aMus" min="0" max="100" value="60" style="width:100%">
    <div class="pie" id="aFxL"></div>
    <input type="range" id="aFx" min="0" max="100" value="80" style="width:100%">
    <div class="fila" id="aIdi"></div>
    <div class="fila" id="aCal"></div>
    <button class="bt" id="aBorrar"></button>
    <button class="bt" id="aVolver"></button>
  </div></div>

  <div class="pan" id="pPausa"><div class="caja">
    <h1 id="pTit"></h1><div class="sub" id="pSub"></div>
    <button class="bt p" id="bSigo"></button>
    <button class="bt" id="bAbandona"></button>
  </div></div>

  <div class="pan" id="pFin"><div class="caja">
    <div class="resL" id="fL"></div>
    <div class="res" id="fAlt"></div>
    <div class="sub" id="fCapa"></div>
    <div class="hueco chico"></div>
    <div class="tx" id="fTx"></div>
    <div id="fNuevo"></div>
    <button class="bt p" id="fOtra"></button>
    <button class="bt" id="fTaller"></button>
    <button class="bt" id="fMenu"></button>
  </div></div>
</div></div>

<script type="module">
import * as T from 'three';

/* ══════════════════════ LAS TABLAS ══════════════════════
   DESPEGUE es un juego de lanzar un cohete: se aprieta para empujar, se arrastra
   para esquivar, y cada lanzamiento paga monedas con las que se mejora el cohete
   para llegar mas alto la proxima vez. Todo lo que el juego ES vive en estas
   tablas: las quince capas, las siete mejoras, las siete rafagas, los
   veinticuatro estilos y los tres idiomas. El codigo de abajo solo las lee. */

/* ══════════ LAS CAPAS ══════════
   ── EN METROS Y DESPUES EN KILOMETROS, Y CADA UNA ES UN LUGAR ──
   La altura de cada capa es real: las copas de los arboles a 60 m, los aviones a
   3 km, la estratosfera a 18, la linea de Karman a 100 km, la estacion espacial
   a 400, la Luna a 384.000 km y Marte a 78 millones. Que sean numeros de verdad
   es lo que hace que el marcador de altura diga algo. Cada capa trae su cielo
   —de arriba y de abajo, se funden por altura— y que hay en ella. */
const CAPAS = [
  { h: 0,       nom: { es: 'La plataforma',        en: 'The launch pad',       pt: 'A plataforma' },          arr: 0x3f8fd8, aba: 0x9ed3ff, cosas: ['pajaro'] },
  { h: 60,      nom: { es: 'Las copas de los árboles', en: 'The treetops',     pt: 'As copas das árvores' },  arr: 0x3a86d2, aba: 0x8fc8f7, cosas: ['pajaro', 'globo'] },
  { h: 800,     nom: { es: 'Las nubes bajas',      en: 'The low clouds',       pt: 'As nuvens baixas' },      arr: 0x2f78c8, aba: 0x7fbcf2, cosas: ['nube', 'pajaro', 'globo'] },
  { h: 3000,    nom: { es: 'La ruta de los aviones', en: 'The airliner lanes', pt: 'A rota dos aviões' },     arr: 0x2568b8, aba: 0x6cadea, cosas: ['nube', 'avion'] },
  { h: 9000,    nom: { es: 'Los cirros',           en: 'The cirrus',           pt: 'Os cirros' },             arr: 0x1a4f9a, aba: 0x5a98d8, cosas: ['cirro', 'avion', 'jet'] },
  { h: 18000,   nom: { es: 'La estratósfera',      en: 'The stratosphere',     pt: 'A estratosfera' },        arr: 0x0f3474, aba: 0x3f74b8, cosas: ['jet', 'globoAlto'] },
  { h: 35000,   nom: { es: 'Los globos de gran altura', en: 'The high-altitude balloons', pt: 'Os balões de grande altitude' }, arr: 0x081e4c, aba: 0x2a5090, cosas: ['globoAlto'] },
  { h: 55000,   nom: { es: 'La mesósfera',         en: 'The mesosphere',       pt: 'A mesosfera' },           arr: 0x040f2c, aba: 0x1a3468, cosas: ['meteoro'] },
  { h: 100000,  nom: { es: 'La línea de Kármán',   en: 'The Kármán line',      pt: 'A linha de Kármán' },     arr: 0x02061a, aba: 0x0c1e46, cosas: ['meteoro', 'chatarra'] },
  { h: 400000,  nom: { es: 'La órbita baja',       en: 'Low orbit',            pt: 'A órbita baixa' },        arr: 0x010310, aba: 0x06102a, cosas: ['satelite', 'chatarra', 'estacion'] },
  { h: 2e6,     nom: { es: 'Los satélites',        en: 'The satellites',       pt: 'Os satélites' },          arr: 0x01020c, aba: 0x040b1e, cosas: ['satelite', 'chatarra'] },
  { h: 3.6e7,   nom: { es: 'La órbita geoestacionaria', en: 'Geostationary orbit', pt: 'A órbita geoestacionária' }, arr: 0x010209, aba: 0x030816, cosas: ['satelite'] },
  { h: 3.84e8,  nom: { es: 'La Luna',              en: 'The Moon',             pt: 'A Lua' },                 arr: 0x000106, aba: 0x020612, cosas: ['asteroide', 'luna'] },
  { h: 7.8e10,  nom: { es: 'Marte',                en: 'Mars',                 pt: 'Marte' },                 arr: 0x020104, aba: 0x0a0408, cosas: ['asteroide', 'marte'] },
  { h: 3e11,    nom: { es: 'El espacio profundo',  en: 'Deep space',           pt: 'O espaço profundo' },     arr: 0x000000, aba: 0x020204, cosas: ['asteroide'] }
];
/* el final del juego: pasar la ultima capa. Mas alla no hay nada que ver. */
const H_FIN = 6e11;

/* ══════════ LAS SIETE MEJORAS ══════════
   ── CADA UNA MUEVE UN NUMERO DE LA FISICA Y NADA MAS ──
   El motor es el empuje, el tanque son kilos de combustible, el fuselaje quita
   masa seca y resistencia, el propelente es el impulso especifico (cuantos
   segundos dura cada kilo), las aletas son la velocidad de giro, el escudo son
   golpes que se aguantan y el iman es el radio de recogida. `c0` es el precio
   del primer nivel y cada nivel cuesta `PRECIO_K` veces mas: asi la decima
   mejora cuesta cincuenta veces la primera, que es lo que hace que la
   progresion dure y no se compre todo en tres lanzamientos. */
const PRECIO_K = 1.50;
const MEJORAS = [
  { id: 'motor',   ic: '🔥', c0: 120, nom: { es: 'Motor', en: 'Engine', pt: 'Motor' },
    des: { es: 'Más empuje: sube más rápido', en: 'More thrust: climbs faster', pt: 'Mais empuxo: sobe mais rápido' } },
  { id: 'tanque',  ic: '🛢', c0: 100, nom: { es: 'Tanque', en: 'Tank', pt: 'Tanque' },
    des: { es: 'Más combustible: empuja más tiempo', en: 'More fuel: burns longer', pt: 'Mais combustível: empurra por mais tempo' } },
  { id: 'fuselaje', ic: '🧊', c0: 150, nom: { es: 'Fuselaje', en: 'Hull', pt: 'Fuselagem' },
    des: { es: 'Más liviano y afilado: menos aire en contra', en: 'Lighter and sharper: less drag', pt: 'Mais leve e afiado: menos ar contra' } },

/* ── LA ALTURA SE ESCRIBE EN LA UNIDAD QUE CORRESPONDE ──
   Metros hasta mil, kilometros con un decimal hasta un millon, y despues
   millones de kilometros. «78.000.000.000 m» no se lee; «78 M km» si. */
function fmtAlt(m){
  if (m < 1000) return { n: Math.round(m).toString(), u: 'm' };
  if (m < 1e6) return { n: (m/1000).toFixed(m < 1e4 ? 2 : 1), u: 'km' };
  if (m < 1e9) return { n: Math.round(m/1000).toLocaleString('de-DE'), u: 'km' };
  return { n: (m/1e9).toFixed(m < 1e10 ? 2 : 1), u: 'M km' };
}
function fmtVel(v){
  const a = Math.abs(v);
  if (a < 1000) return Math.round(a) + ' m/s';
  return (a/1000).toFixed(1) + ' km/s';
}

/* ══════════ EL AZAR CON SEMILLA ══════════
   Los obstaculos de un lanzamiento salen de una semilla: asi el auto-jugador y
   la partida de verdad ven el mismo cielo, y una prueba repetida da lo mismo. */
let _sem = 1;
function sem(n){ _sem = (n | 0) || 1; }
function az(){ _sem = (_sem*1664525 + 1013904223) >>> 0; return _sem/4294967296; }
function azr(a, b){ return a + az()*(b - a); }
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, k) => a + (b - a)*k;

const CALIDADES = { baja: { esc: 0.60, part: 60, nubes: 18 }, media: { esc: 0.85, part: 160, nubes: 40 },
                    alta: { esc: 1.00, part: 300, nubes: 70 } };

/* ══════════════════════ EL AUDIO, PROCEDURAL ══════════════════════
   ── POR QUE NO HAY UN SOLO ARCHIVO ──
   Lo que suena en este juego es un MOTOR, y un motor es ruido filtrado: un clip
   grabado pesa cientos de KB, se corta en cada vuelta del bucle y —lo que
   importa— no sabe cuanto empuje hay. El ruido generado se abre y se cierra con
   el empuje, cuadro a cuadro, y eso es lo que hace que apretar SE OIGA. Lo
   demas son osciladores cortos: monedas, golpes, la campanita de cada capa, la
   cuenta regresiva. La musica es una cama de acordes que respira, porque un
   tema con ritmo compite con el motor y aca el motor es el protagonista. */
let AUD = null, MAE = null, GMUS = null, GFX = null, RUI = null, ANAL = null;
let VOL_MUS = 0.60, VOL_FX = 0.80;
/* el motor vive todo el tiempo y se le mueve la ganancia: arrancarlo y pararlo
   en cada cuadro daria clicks */
const MOT = { src: null, filt: null, gan: null, on: false, nivel: 0 };
const CAMA = { on: false, oscs: [], gan: null, filt: null, t0: 0, raiz: 110 };

function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAE = AUD.createGain(); MAE.gain.value = 0.9; MAE.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAE.connect(ANAL);
  GMUS = AUD.createGain(); GMUS.gain.value = VOL_MUS; GMUS.connect(MAE);
  GFX = AUD.createGain(); GFX.gain.value = VOL_FX; GFX.connect(MAE);
  const n = Math.floor(AUD.sampleRate*1.0);
  RUI = AUD.createBuffer(1, n, AUD.sampleRate);
  const d = RUI.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  /* el motor: ruido en bucle → pasabajos → ganancia. El pasabajos se abre con
     el empuje, asi que a plena potencia el motor es grave y ancho y al soltar
     se queda un silbido fino */
  MOT.src = AUD.createBufferSource(); MOT.src.buffer = RUI; MOT.src.loop = true;
  MOT.filt = AUD.createBiquadFilter(); MOT.filt.type = 'lowpass'; MOT.filt.frequency.value = 120; MOT.filt.Q.value = 0.8;
  MOT.gan = AUD.createGain(); MOT.gan.gain.value = 0;
  MOT.src.connect(MOT.filt); MOT.filt.connect(MOT.gan); MOT.gan.connect(GFX);
  MOT.src.start(); MOT.on = true;
}
function despiertaAudio(){ armaAudio(); if (AUD && AUD.state === 'suspended') AUD.resume(); }
function ponVol(mus, fx){
  VOL_MUS = mus; VOL_FX = fx;
  if (GMUS) GMUS.gain.setTargetAtTime(mus, AUD.currentTime, 0.05);
  if (GFX) GFX.gain.setTargetAtTime(fx, AUD.currentTime, 0.05);
}

/* ── EL MOTOR SIGUE AL EMPUJE, CUADRO A CUADRO ──
   `k` es la fraccion de empuje (0 a 1) y `aire` cuanta atmosfera hay (1 abajo,
   0 en el espacio): en el vacio el motor no se oye, asi que se apaga con la
   altura aunque siga empujando. Es fisica y de paso es lo que hace que salir de
   la atmosfera se SIENTA. */
function motorPaso(k, aire, dt){
  if (!MOT.on) return;
  const obj = k*aire*0.55;
  MOT.nivel += (obj - MOT.nivel)*Math.min(1, dt*9);
  MOT.gan.gain.value = MOT.nivel;
  MOT.filt.frequency.value = 90 + k*aire*520 + Math.random()*40*k;
}

/* ── LOS EFECTOS CORTOS ── */
function tono(f0, f1, dur, tipo, vol, dest){
  if (!AUD) return;
  const t = AUD.currentTime, o = AUD.createOscillator(), g = AUD.createGain();
  o.type = tipo || 'square';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || GFX); o.start(t); o.stop(t + dur + 0.02);
}
function ruido(dur, f0, f1, vol, q){
  if (!AUD) return;
  const t = AUD.currentTime, s = AUD.createBufferSource(), f = AUD.createBiquadFilter(), g = AUD.createGain();
  s.buffer = RUI; f.type = 'bandpass'; f.Q.value = q || 0.9;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(GFX); s.start(t); s.stop(t + dur + 0.02);
}
function son(k){
  if (!AUD) return;
  switch (k){
    case 'moneda':  tono(1320, 1980, 0.12, 'sine', 0.22); tono(1980, 2640, 0.10, 'sine', 0.12); break;
    case 'golpe':   ruido(0.25, 400, 80, 0.5, 0.6); tono(180, 60, 0.22, 'sawtooth', 0.3); break;
    case 'explota': ruido(0.9, 900, 40, 0.9, 0.5); ruido(1.4, 220, 30, 0.7, 0.4); tono(120, 30, 0.8, 'sawtooth', 0.35); break;
    case 'rafaga':  ruido(0.6, 300, 2400, 0.55, 0.7); tono(220, 880, 0.35, 'sawtooth', 0.18); break;
    case 'capa':    tono(880, 880, 0.35, 'sine', 0.16); setTimeout(() => tono(1320, 1320, 0.45, 'sine', 0.16), 120); break;
    case 'cuenta':  tono(660, 660, 0.12, 'square', 0.16); break;
    case 'ya':      tono(880, 1320, 0.30, 'square', 0.22); ruido(1.2, 120, 900, 0.7, 0.5); break;
    case 'maximo':  tono(660, 990, 0.25, 'sine', 0.18); setTimeout(() => tono(990, 1320, 0.4, 'sine', 0.18), 160); break;
    case 'record':  [0, 120, 240, 360].forEach((d, i) => setTimeout(() => tono(660*Math.pow(1.25, i), 660*Math.pow(1.25, i), 0.3, 'sine', 0.2), d)); break;
    case 'compra':  tono(520, 1040, 0.16, 'sine', 0.2); setTimeout(() => tono(1040, 1560, 0.18, 'sine', 0.16), 90); break;
    case 'no':      tono(220, 160, 0.2, 'square', 0.16); break;
    case 'toque':   tono(900, 700, 0.06, 'sine', 0.12); break;
    case 'planea':  tono(440, 220, 0.6, 'sine', 0.12); break;
  }
}

/* ── LA CAMA: CUATRO SENOS DESAFINADOS QUE RESPIRAN ──
   Dos senos identicos suenan a prueba de audio; dos desafinados un par de
   milesimas baten cada pocos segundos y suenan a instrumento. Un pasabajos que
   se abre y se cierra a 0,06 Hz es lo que la hace respirar en vez de zumbar.
   En el espacio la raiz sube una quinta: mismo tema, otro lugar. */
function camaArranca(){
  if (!AUD || CAMA.on) return;
  CAMA.on = true; CAMA.t0 = AUD.currentTime;
  CAMA.gan = AUD.createGain(); CAMA.gan.gain.value = 0;
  CAMA.filt = AUD.createBiquadFilter(); CAMA.filt.type = 'lowpass'; CAMA.filt.frequency.value = 500; CAMA.filt.Q.value = 0.6;
  CAMA.gan.connect(CAMA.filt); CAMA.filt.connect(GMUS);
  const rel = [1, 1.0023, 1.5, 1.4977, 2, 2.0031, 2.25, 2.2461];
  CAMA.oscs = rel.map((r, i) => {
    const o = AUD.createOscillator(), g = AUD.createGain();
    o.type = i < 4 ? 'sine' : 'triangle'; o.frequency.value = CAMA.raiz*r;
    g.gain.value = i < 2 ? 0.16 : (i < 4 ? 0.10 : 0.05);
    o.connect(g); g.connect(CAMA.gan); o.start(); return { o, g, r };
  });
  CAMA.gan.gain.setTargetAtTime(0.9, AUD.currentTime, 1.2);
}
function camaPaso(hFrac){
  if (!CAMA.on) return;
  const t = AUD.currentTime - CAMA.t0;
  CAMA.filt.frequency.value = 380 + 320*(0.5 + 0.5*Math.sin(t*0.38)) + 300*hFrac;
  /* la raiz sube con la altura: 110 Hz abajo, 165 (una quinta) en el espacio */
  const raiz = 110*Math.pow(1.5, cl(hFrac, 0, 1));
  CAMA.raiz += (raiz - CAMA.raiz)*0.02;
  for (const c of CAMA.oscs) c.o.frequency.value = CAMA.raiz*c.r;
}
function camaAgacha(v){ if (CAMA.on) CAMA.gan.gain.setTargetAtTime(v, AUD.currentTime, 0.4); }

/* la medicion: es lo unico que prueba que sono */
function nivelAudio(){
  if (!ANAL) return { pico: 0, rms: 0 };
  const d = new Float32Array(ANAL.fftSize); ANAL.getFloatTimeDomainData(d);
  let p = 0, s = 0; for (let i = 0; i < d.length; i++){ const a = Math.abs(d[i]); if (a > p) p = a; s += d[i]*d[i]; }
  return { pico: +p.toFixed(4), rms: +Math.sqrt(s/d.length).toFixed(4) };
}

/* ══════════════════════ LA SIMULACION ══════════════════════
   ── SIN DOM Y SIN three: ESTE ARCHIVO CORRE EN NODE ──
   Todo lo que decide el juego —la fisica, las monedas, el progreso, el
   auto-jugador— vive aca y no toca la pantalla. Asi se puede correr mil
   lanzamientos en un segundo en node para saber si la economia cierra ANTES de
   dibujar nada: un juego de mejoras cuya progresion no se midio es un juego que
   se termina en tres lanzamientos o que no se termina nunca.

   ── LA FISICA ES DE VERDAD, EN UNIDADES DEL SI ──
   Masa = casco + combustible, empuje en newtons, impulso especifico en
   segundos, gravedad que cae con la altura y una atmosfera exponencial. Que sea
   real no es purismo: es lo que hace que las quince capas caigan donde caen. */
const R_T = 6371e3, G0 = 9.81, RHO0 = 1.225, H_ESC = 8500;
const gravedad = (h) => G0*Math.pow(R_T/(R_T + h), 2);
const densidad = (h) => RHO0*Math.exp(-h/H_ESC);
const aireEn = (h) => Math.exp(-h/12000);

/* ══════════ EL PROGRESO ══════════ */
const PROG = { monedas: 0, niv: {}, raf: {}, rafEq: null, estilos: ['clasico'], estilo: 'clasico',
               record: 0, capaMax: 0, lanz: 0, vistas: {} };
for (const M of MEJORAS) PROG.niv[M.id] = 0;
for (const R of RAFAGAS) PROG.raf[R.id] = 0;
const CLAVE_SAVE = 'despegue_v1';
function guardaProg(){
  try { localStorage.setItem(CLAVE_SAVE, JSON.stringify({ ...PROG, lang: LANG, cal: CALIDAD, vm: VOL_MUS, vf: VOL_FX })); } catch(e){}
}
function cargaProg(){
  try {
    const s = localStorage.getItem(CLAVE_SAVE); if (!s) return false;
    const o = JSON.parse(s);
    for (const k of ['monedas', 'rafEq', 'estilos', 'estilo', 'record', 'capaMax', 'lanz', 'vistas']) if (o[k] != null) PROG[k] = o[k];
    if (o.niv) for (const M of MEJORAS) PROG.niv[M.id] = o.niv[M.id] | 0;
    if (o.raf) for (const R of RAFAGAS) PROG.raf[R.id] = o.raf[R.id] | 0;
    if (o.lang) LANG = o.lang; if (o.cal && CALIDADES[o.cal]) CALIDAD = o.cal;
    if (o.vm != null) VOL_MUS = o.vm; if (o.vf != null) VOL_FX = o.vf;
    return true;
  } catch(e){ return false; }
}
function borraProg(){
  PROG.monedas = 0; PROG.rafEq = null; PROG.estilos = ['clasico']; PROG.estilo = 'clasico';
  PROG.record = 0; PROG.capaMax = 0; PROG.lanz = 0; PROG.vistas = {};
  for (const M of MEJORAS) PROG.niv[M.id] = 0;
  for (const R of RAFAGAS) PROG.raf[R.id] = 0;
  guardaProg();
}

/* ══════════ DE LOS NIVELES A LOS NUMEROS ══════════
   ── CADA MEJORA MUEVE UN NUMERO Y NADA MAS ──
   Los numeros de base son los de un cohete chico de verdad: 21 kN de empuje,
   1.400 kg de casco, 130 kg de combustible, Isp 185 s. Con eso el primer
   lanzamiento pasa las copas de los arboles y no mucho mas, que es lo que tiene
   que hacer un primer lanzamiento. El tanque crece geometrico y el casco baja
   lineal: la relacion de masas es lo que decide adonde se llega, y por eso
   mejorar tanque y fuselaje a la vez vale mas que la suma. */
function parametros(niv){
  niv = niv || PROG.niv;
  const n = (k) => niv[k] | 0;
  return {
    empuje: 21000*Math.pow(1.20, n('motor')),
    comb: 130*Math.pow(1.34, n('tanque')),
    casco: 1400*Math.pow(0.89, n('fuselaje')),
    cdA: 1.10*Math.pow(0.88, n('fuselaje')),
    isp: 185 + 32*n('propelente'),
    giro: 3.0 + 0.55*n('aletas'),
    escudo: n('escudo'),
    iman: 0.55 + 0.22*n('iman')
  };
}

/* ══════════ EL ESTADO DE UN LANZAMIENTO ══════════ */
let RUN = null;
const ANCHO = 5.0;            /* medio ancho del carril, en unidades de pantalla */
const DT = 1/60;

/* ── LA ESCALA VISUAL: METROS POR UNIDAD ──
   El cohete tiene que medir lo mismo en pantalla a 50 m y a 50.000 km, asi que
   lo que cambia es cuantos metros vale una unidad. Abajo, 5 m por unidad (la
   torre se ve entera); despues crece con la altura. Los obstaculos viven en
   unidades de pantalla y su radio de choque se escala con esto, asi la
   dificultad de esquivar no depende de la altura. */
const mpu = (h) => Math.max(5, h/25);

/* ── EL TIEMPO SE ESTIRA CON LA ALTURA ──
   Ir a la Luna de verdad son tres dias y subir en balistica a 30 km son dos
   minutos mirando un marcador. El juego no puede durar eso, asi que el reloj de
   la simulacion corre `mult` veces mas rapido cuanto mas alto: 1 en la
   plataforma, 2 a 8 km, 13 en la linea de Karman, y de ahi en adelante crece
   con la altura. Abajo de los 100 km la fisica entera corre acelerada —es la
   misma fisica, fast-forward—. Arriba, solo la DISTANCIA se multiplica: la
   gravedad, el combustible y la rafaga van en tiempo real. Es una decision de
   juego y esta escrita como tal: con la fisica real, pasar la velocidad de
   escape lleva de la orbita al infinito en un cuadro y las capas de la Luna y
   Marte no existirian. El exponente 0,95 —y no 1— es lo que evita el
   acantilado: con `mult = h/K` la altura crece como `exp(v·t/K)` y entre un
   lanzamiento a la Luna y el siguiente el cohete se pasaba Marte entero
   (medido en node: de 2,6·10^8 a 6·10^11 en un lanzamiento). Con 0,95 crece
   como una potencia veinte de `v·t` y las cinco capas del espacio se recorren
   de a una: 1.000 m/s dan los satelites, 2.000 la geoestacionaria, 3.000 la
   Luna, 5.000 Marte, 6.000 el espacio profundo. */
const H_ESPACIO = 1e5, T_COSTA = 14;
/* `K_TIEMPO` se declara abajo de la funcion que lo usa: `const` en zona muerta tira,
   pero la funcion recien se llama en `paso`, cuando ya existe. */
function multTiempo(h){ return 1 + Math.pow(h/K_TIEMPO, 0.95); }
const K_TIEMPO = 10000;

function arrancaRun(semilla){
  const P = parametros();
  const R = RAFAGAS.find(r => r.id === PROG.rafEq);
  const rn = R ? PROG.raf[R.id] : 0;
  RUN = {
    fase: 'cuenta', tc: 0,          /* cuenta regresiva: 3,2 s */
    h: 0, v: 0, x: 0, vx: 0, comb: P.comb, t: 0, tk: 0, P,
    golpes: 0, escudo: P.escudo, hmax: 0, capa: 0, capaVista: -1,
    monedas: 0, monLevantadas: 0,
    raf: R || null, rafN: rn, cargas: R ? rafagaCargas(R, rn) : 0, boostT: 0, boostMult: 1, boostK: 0,
    obs: [], mon: [], sig: 40, semilla: semilla | 0, apretado: false, dir: 0, empujeK: 0,
    sinComb: false, planea: false, fin: null, eventos: [], dano: 0, sacude: 0, humo: 0
  };
  sem(RUN.semilla || 1);
  return RUN;
}

/* ══════════ LO QUE HAY EN EL CIELO ══════════
   ── SE SIEMBRA POR DELANTE, EN UNIDADES DE PANTALLA ──
   Cada `paso` de altura (en unidades) se decide si entra un obstaculo o una
   moneda, con la densidad de la capa. Los obstaculos se sacan de `cosas` de la
   capa actual, asi que a 3 km hay aviones y a 400 km satelites. Un obstaculo
   tiene `x` (−5..5), `u` (su altura en unidades sobre la del cohete cuando se
   sembro, convertida a metros con la mpu de ese momento), radio y deriva. */
const COSAS = {
  pajaro:   { r: 0.55, vx: 1.2, dano: 1 }, globo:    { r: 0.9,  vx: 0.2, dano: 1 }, nube: { r: 1.6, vx: 0.3, dano: 0 },
  avion:    { r: 1.1,  vx: 2.2, dano: 1 }, cirro:    { r: 2.0,  vx: 0.4, dano: 0 }, jet: { r: 0.9, vx: 3.0, dano: 1 },
  globoAlto:{ r: 1.2,  vx: 0.3, dano: 1 }, meteoro:  { r: 0.6,  vx: 1.8, dano: 1 }, chatarra: { r: 0.7, vx: 0.9, dano: 1 },
  satelite: { r: 1.0,  vx: 0.6, dano: 1 }, estacion: { r: 2.4,  vx: 0.2, dano: 1 }, asteroide: { r: 1.3, vx: 0.8, dano: 1 },
  luna:     { r: 0,    vx: 0,   dano: 0 }, marte:    { r: 0,    vx: 0,   dano: 0 }
};
function capaDe(h){ let c = 0; for (let i = 0; i < CAPAS.length; i++) if (h >= CAPAS[i].h) c = i; return c; }
function siembra(){
  const R = RUN, m = mpu(R.h);
  /* siembra hasta 40 unidades por delante del cohete */
  while (R.sig < R.h/m + 40){
    const hm = R.sig*m;                 /* altura en metros de esta fila */
    const c = capaDe(hm), C = CAPAS[c];
    const cosas = C.cosas.filter(k => COSAS[k].r > 0);
    /* densidad: sube con la capa, baja en las primeras */
    const dens = c === 0 ? 0.10 : Math.min(0.55, 0.22 + c*0.03);
    if (cosas.length && az() < dens){
      const k = cosas[Math.floor(az()*cosas.length)], D = COSAS[k];
      R.obs.push({ k, hm, x: azr(-ANCHO + 1, ANCHO - 1), vx: (az() < 0.5 ? -1 : 1)*D.vx*azr(0.5, 1), r: D.r, dano: D.dano, vivo: true, fase: az()*6.28 });
    }
    if (az() < 0.42){
      const n = 1 + Math.floor(az()*3), x0 = azr(-ANCHO + 1.2, ANCHO - 1.2);
      for (let i = 0; i < n; i++) R.mon.push({ hm: hm + i*1.6*m, x: x0, vivo: true, val: 1 + Math.floor(c/3) });
    }
    R.sig += azr(3.5, 6.5);
  }
  /* lo que quedo abajo se tira: la lista no crece sin fin */
  const piso = R.h - 12*m;
  if (R.obs.length > 60) R.obs = R.obs.filter(o => o.hm > piso - 40*m);
  if (R.mon.length > 90) R.mon = R.mon.filter(o => o.hm > piso - 40*m);
}

/* ══════════ UN PASO DE FISICA ══════════ */
function paso(apretado, dir){
  const R = RUN; if (!R || R.fase === 'fin') return;
  R.tk++; R.apretado = !!apretado; R.dir = cl(dir || 0, -1, 1);
  R.hPrev = R.h; R.xPrev = R.x;   /* para que el dibujo interpole entre pasos */
  if (R.fase === 'cuenta'){
    R.tc += DT;
    /* el motor se enciende en el ultimo segundo: humo y temblor antes de soltar */
    R.empujeK = R.tc > 2.2 ? Math.min(1, (R.tc - 2.2)/1.0) : 0;
    if (R.tc >= 3.2){ R.fase = 'vuelo'; R.empujeK = 1; R.eventos.push('ya'); }
    return;
  }
  const P = R.P, mt = multTiempo(R.h), espacio = R.h >= H_ESPACIO;
  const dt = espacio ? DT : DT*mt, dth = DT*mt;
  const aire = densidad(R.h), g = gravedad(R.h);
  /* el empuje: apretado y con combustible. El primer segundo de vuelo empuja
     siempre, porque un cohete que no despega si no apretas a tiempo es un
     cohete que confunde */
  const quiere = R.apretado || R.t < 1.0;
  let emp = 0;
  if (quiere && R.comb > 0){
    emp = P.empuje*R.boostMult;
    const mdot = P.empuje/(P.isp*G0);
    R.comb = Math.max(0, R.comb - mdot*dt);
    R.empujeK += (1 - R.empujeK)*Math.min(1, DT*8);
  } else {
    R.empujeK += (0 - R.empujeK)*Math.min(1, DT*6);
  }
  if (R.comb <= 0 && !R.sinComb){ R.sinComb = true; R.eventos.push('sinComb'); }
  const masa = P.casco + R.comb;
  const arrastre = 0.5*aire*R.v*Math.abs(R.v)*P.cdA;
  const a = (emp - arrastre)/masa - g;
  R.v += a*dt;
  R.h += R.v*dth;
  R.t += dt;
  if (R.comb <= 0 && R.boostT <= 0){ R.tCosta = (R.tCosta || 0) + DT; }
  if (R.boostT > 0){ R.boostT -= dt; if (R.boostT <= 0){ R.boostT = 0; R.boostMult = 1; } }
  R.boostK = Math.max(0, R.boostK - DT*1.6);
  R.sacude = Math.max(0, R.sacude - DT*3);
  /* de costado: en unidades de pantalla, con las aletas como aceleracion */
  const vxObj = R.dir*P.giro;
  R.vx += (vxObj - R.vx)*Math.min(1, DT*(2.5 + P.giro*0.4));
  R.x = cl(R.x + R.vx*DT, -ANCHO + 0.5, ANCHO - 0.5);
  if (R.h > R.hmax) R.hmax = R.h;
  /* la capa */
  const c = capaDe(R.h);
  if (c !== R.capa){ R.capa = c; if (c > R.capaVista){ R.capaVista = c; R.eventos.push('capa'); } }
  /* la siembra y los choques */
  siembra();
  const m = mpu(R.h);
  for (const o of R.obs){
    if (!o.vivo) continue;
    o.x += o.vx*DT*0.35;
    if (o.x > ANCHO + 2) o.x = -ANCHO - 2; else if (o.x < -ANCHO - 2) o.x = ANCHO + 2;
    const dy = (o.hm - R.h)/m, dx = o.x - R.x;
    if (Math.abs(dy) < o.r + 0.6 && Math.abs(dx) < o.r + 0.45 && (dx*dx + dy*dy) < (o.r + 0.5)*(o.r + 0.5)){
      o.vivo = false;
      if (o.dano){
        R.golpes++; R.sacude = 1; R.eventos.push('golpe');
        if (R.golpes > R.escudo){ R.fin = 'explota'; R.eventos.push('explota'); terminaRun(); return; }
        /* un golpe frena: pierde un quinto de la velocidad */
        R.v *= 0.8;
      } else { R.eventos.push('nube'); }
    }
  }
  for (const o of R.mon){
    if (!o.vivo) continue;
    const dy = (o.hm - R.h)/m, dx = o.x - R.x;
    const d2 = dx*dx + dy*dy, ri = P.iman;
    if (d2 < ri*ri*4 && d2 > 0.01){
      /* el iman tira de la moneda: se mueve en unidades hacia el cohete */
      const d = Math.sqrt(d2), k = Math.min(1, DT*(6/ (d + 0.2)));
      o.x -= dx*k; o.hm -= dy*k*m;
    }
    if (d2 < 0.5*0.5 || (Math.abs(dy) < 0.5 && Math.abs(dx) < 0.5)){
      o.vivo = false; R.monedas += o.val; R.monLevantadas++; R.eventos.push('moneda');
    }
  }
  /* el final: el apice despues de gastar todo, el piso, o el fin del mapa */
  if (R.h >= H_FIN){ R.fin = 'fin'; terminaRun(); return; }
  /* ── EL CIERRE DEL VUELO ──
     Abajo: el apice, cuando la velocidad se da vuelta sin combustible. Arriba:
     ademas hay un presupuesto de costa de `T_COSTA` segundos reales —en el
     espacio la velocidad casi no baja y sin tope el vuelo no termina nunca—.
     Se deja ver la caida o el freno un segundo y medio y se cierra. */
  const costaFin = espacio && R.comb <= 0 && R.boostT <= 0 && R.tCosta > T_COSTA;
  if ((R.v < 0 || costaFin) && R.h > 0 && R.comb <= 0 && R.boostT <= 0){
    if (!R.planea){ R.planea = true; R.eventos.push('maximo'); R.tPlanea = 0; if (costaFin) R.v = Math.min(R.v, 0); }
    R.tPlanea += DT;
    if (R.tPlanea > 1.6){ R.fin = 'apice'; terminaRun(); return; }
  }
  if (R.h < 0 && R.t > 2){ R.h = 0; R.fin = 'piso'; terminaRun(); }
}

/* ══════════ LA RAFAGA ══════════ */
function rafaga(){
  const R = RUN; if (!R || R.fase !== 'vuelo' || !R.raf || R.cargas <= 0) return 'no';
  if (R.h < R.raf.hMin) return 'min';
  if (R.boostT > 0) return 'ya';
  const val = rafagaValor(R.raf, R.rafN);
  if (R.raf.tipo === 'dv') R.v += val;
  else { R.boostMult = val; R.boostT = R.raf.dur; }
  R.cargas--; R.boostK = 1; R.eventos.push('rafaga');
  return 'ok';
}

/* ══════════ EL CIERRE: MONEDAS, DESBLOQUEOS, RECORD ══════════
   ── LAS MONEDAS SALEN DE LA ALTURA, Y LA CURVA ES LA ECONOMIA ──
   Hasta la linea de Karman, `1,5·h^0,62`: 100 m dan 26, 1 km 108, 10 km 450,
   100 km 1.880. Arriba de los 100 km la altura crece exponencialmente con la
   velocidad, asi que las monedas pasan a crecer con el LOGARITMO: 400 km dan
   4.400, la Luna 17.000, Marte 26.000. Sin ese quiebre, un lanzamiento a la
   Luna pagaba doscientas mil monedas y se compraba el juego entero de una: la
   curva se medio en node (`simulaProgreso`) y este es el numero que la deja en
   unos sesenta lanzamientos. */
function monedasPor(hmax){
  hmax = Math.max(0, hmax);
  if (hmax < 1e5) return Math.floor(Math.pow(hmax, 0.62)*1.5);
  return Math.floor(1880*(1 + 2.2*Math.log10(hmax/1e5)));
}
function terminaRun(){
  const R = RUN; if (R.fase === 'fin') return;
  R.fase = 'fin';
  R.ganado = monedasPor(R.hmax) + R.monedas*8;
  if (R.fin === 'explota') R.ganado = Math.floor(R.ganado*0.6);
  PROG.monedas += R.ganado; PROG.lanz++;
  R.nuevoRec = R.hmax > PROG.record;
  if (R.nuevoRec) PROG.record = R.hmax;
  const c = capaDe(R.hmax);
  R.capaFin = c;
  R.nuevos = [];
  if (c > PROG.capaMax){
    PROG.capaMax = c;
  }
  /* los estilos por capa se desbloquean por la capa MAXIMA alcanzada alguna vez */
  for (const E of ESTILOS){
    if (E.desb.capa != null && PROG.capaMax >= E.desb.capa && !PROG.estilos.includes(E.id)){ PROG.estilos.push(E.id); R.nuevos.push(E.id); }
  }
  guardaProg();
}

/* ══════════ EL TALLER ══════════ */
function compraMejora(id){
  const n = PROG.niv[id] | 0; if (n >= NIVEL_TOPE) return 'tope';
  const p = precioMejora(id, n); if (PROG.monedas < p) return 'falta';
  PROG.monedas -= p; PROG.niv[id] = n + 1; guardaProg(); return 'ok';
}
function compraRafaga(id){
  const R = RAFAGAS.find(r => r.id === id); if (PROG.capaMax < R.capa) return 'bloq';
  const n = PROG.raf[id] | 0; if (n >= RAF_TOPE) return 'tope';
  const p = precioRafaga(id, n); if (PROG.monedas < p) return 'falta';
  PROG.monedas -= p; PROG.raf[id] = n + 1; if (!PROG.rafEq) PROG.rafEq = id; guardaProg(); return 'ok';
}
function equipaRafaga(id){ if ((PROG.raf[id] | 0) > 0){ PROG.rafEq = id; guardaProg(); return 'ok'; } return 'no'; }
function compraEstilo(id){
  const E = ESTILOS.find(e => e.id === id); if (PROG.estilos.includes(id)) return 'ya';
  if (E.desb.capa != null) return PROG.capaMax >= E.desb.capa ? (PROG.estilos.push(id), guardaProg(), 'ok') : 'bloq';
  if (PROG.monedas < E.desb.monedas) return 'falta';
  PROG.monedas -= E.desb.monedas; PROG.estilos.push(id); guardaProg(); return 'ok';
}
function eligeEstilo(id){ if (PROG.estilos.includes(id)){ PROG.estilo = id; guardaProg(); return 'ok'; } return 'no'; }

/* ══════════ EL AUTO-JUGADOR ══════════
   ── APRIETA SIEMPRE Y ESQUIVA LO QUE VIENE ──
   Mira los obstaculos de las proximas doce unidades y se corre hacia el hueco
   mas ancho. Es lo que hace un jugador normal, y es lo que valida que un
   lanzamiento SE PUEDA sobrevivir: si el bot honesto explota en la mitad de los
   intentos, el cielo esta demasiado lleno. */
function botDecide(){
  const R = RUN, m = mpu(R.h);
  let dir = 0, cerca = null, dmin = 1e9;
  for (const o of R.obs){
    if (!o.vivo || !o.dano) continue;
    const dy = (o.hm - R.h)/m;
    if (dy < -1 || dy > 12) continue;
    /* donde va a estar cuando lleguemos */
    const tLlega = dy/Math.max(1, R.v/m*DT*60);
    const xf = o.x + o.vx*0.35*tLlega;
    const dx = xf - R.x;
    if (Math.abs(dx) < o.r + 1.1 && dy < dmin){ dmin = dy; cerca = { dx, r: o.r, xf }; }
  }
  if (cerca){
    /* al lado que tenga mas lugar */
    const izq = cerca.xf - cerca.r, der = cerca.xf + cerca.r;
    dir = (izq + ANCHO) > (ANCHO - der) ? -1 : 1;
    if (R.x < -ANCHO + 1.2) dir = 1; if (R.x > ANCHO - 1.2) dir = -1;
  } else {
    /* sin peligro, va por la moneda mas cercana */
    let mm = null, dm = 1e9;
    for (const o of R.mon){ if (!o.vivo) continue; const dy = (o.hm - R.h)/m; if (dy < 0 || dy > 10) continue; if (dy < dm){ dm = dy; mm = o; } }
    if (mm) dir = cl((mm.x - R.x)*1.5, -1, 1);
    else dir = cl(-R.x*0.5, -1, 1);
  }
  /* la rafaga: en cuanto se puede, arriba de la altura minima */
  if (R.raf && R.cargas > 0 && R.h >= R.raf.hMin && R.boostT <= 0 && R.t > 2) rafaga();
  return { apretado: true, dir };
}
/* juega un lanzamiento entero sin dibujar: devuelve el resumen */
function juegaSolo(semilla, maxPasos){
  arrancaRun(semilla == null ? Math.floor(Math.random()*1e9) : semilla);
  const R = RUN; let n = 0; maxPasos = maxPasos || 200000;
  while (R.fase !== 'fin' && n < maxPasos){
    const d = R.fase === 'vuelo' ? botDecide() : { apretado: true, dir: 0 };
    paso(d.apretado, d.dir); n++;
  }
  if (R.fase !== 'fin'){ R.fin = 'reloj'; terminaRun(); }
  return { hmax: Math.round(R.hmax), capa: capaDe(R.hmax), fin: R.fin, golpes: R.golpes, monedas: R.monedas,
           ganado: R.ganado, t: +R.t.toFixed(1), pasos: n, comb: Math.round(R.comb) };
}
/* ── LA PROGRESION SIMULADA ──
   Un jugador codicioso: lanza, compra lo mas barato que pueda (dando prioridad
   al motor y al tanque, que son lo que sube), y vuelve a lanzar. Cuenta
   cuantos lanzamientos hacen falta para cada capa: eso ES la curva del juego. */
function simulaProgreso(maxLanz, verbose){
  const copia = JSON.parse(JSON.stringify(PROG));
  borraProgSinGuardar();
  const hitos = {}, filas = [];
  const prio = ['tanque', 'motor', 'fuselaje', 'propelente', 'escudo', 'aletas', 'iman'];
  for (let i = 0; i < (maxLanz || 120); i++){
    const r = juegaSolo(1000 + i);
    for (let c = 0; c <= r.capa; c++) if (hitos[c] == null) hitos[c] = i + 1;
    if (verbose) filas.push({ lanz: i + 1, hmax: r.hmax, capa: r.capa, fin: r.fin, ganado: r.ganado, saldo: PROG.monedas, niv: Object.values(PROG.niv).join('') });
    if (r.capa >= 13) break;
    /* compra: lo mas barato entre las que mas suben, hasta quedarse sin plata */
    let compro = true;
    while (compro){
      compro = false;
      let mejor = null, pm = 1e12;
      for (const id of prio){
        const n = PROG.niv[id] | 0; if (n >= NIVEL_TOPE) continue;
        /* peso: el tanque y el motor valen mas por moneda */
        const peso = id === 'tanque' ? 0.7 : id === 'motor' ? 0.8 : id === 'fuselaje' ? 0.85 : id === 'propelente' ? 0.9 : 1.6;
        const p = precioMejora(id, n)*peso;
        if (p < pm && precioMejora(id, n) <= PROG.monedas){ pm = p; mejor = id; }
      }
      if (mejor){ compraMejora(mejor); compro = true; }
      /* rafaga: la mas alta desbloqueada se compra y se sube mientras sobre el doble */
      for (const Rf of RAFAGAS){
        const nr = PROG.raf[Rf.id] | 0;
        if (PROG.capaMax >= Rf.capa && nr < RAF_TOPE && PROG.monedas >= precioRafaga(Rf.id, nr)*1.5){ compraRafaga(Rf.id); equipaRafaga(Rf.id); compro = true; }
      }
    }
  }
  const res = { hitos, lanz: PROG.lanz, niv: { ...PROG.niv }, raf: { ...PROG.raf }, filas };
  Object.assign(PROG, copia);
  return res;
}
function borraProgSinGuardar(){
  PROG.monedas = 0; PROG.rafEq = null; PROG.estilos = ['clasico']; PROG.estilo = 'clasico';
  PROG.record = 0; PROG.capaMax = 0; PROG.lanz = 0;
  for (const M of MEJORAS) PROG.niv[M.id] = 0;
  for (const R of RAFAGAS) PROG.raf[R.id] = 0;
}

/* ══════════════════════ EL DIBUJO ══════════════════════
   ── EL COHETE NO SE MUEVE: SE MUEVE EL MUNDO ──
   El cohete vive siempre en el origen y la camara lo mira desde el frente
   (por −Z, sin inclinar), a un 35 % del alto del cuadro. Todo lo demas se
   coloca en `(o.hm − h)/mpu(h)`: la escala en metros por unidad crece con la
   altura, asi que el cohete mide lo mismo a 50 m y a 50.000 km y lo que cambia
   es cuanto mundo pasa por segundo. La plataforma y el suelo se van para abajo
   en los primeros segundos y no vuelven hasta el proximo lanzamiento. */
const cv = document.getElementById('cv');
const render = new T.WebGLRenderer({ canvas: cv, antialias: false, alpha: false, powerPreference: 'high-performance' });
render.outputColorSpace = T.SRGBColorSpace;
render.toneMapping = T.ACESFilmicToneMapping; render.toneMappingExposure = 1.05;
const escena = new T.Scene();
const cam = new T.PerspectiveCamera(58, 0.46, 0.1, 400);
/* la camara se pone por la CUENTA: hay que ver ±6 unidades de ancho en z = 0 */
let CAM_D = 22, CAM_Y = 3.6;
const HUD_PX = { w: 412, h: 892 };
function medir(){
  const w = cv.clientWidth || 412, h = cv.clientHeight || 892;
  HUD_PX.w = w; HUD_PX.h = h;
  document.documentElement.style.setProperty('--mw', w + 'px');
  const esc = CALIDADES[CALIDAD].esc;
  render.setPixelRatio(Math.min(devicePixelRatio || 1, 2)*esc);
  render.setSize(w, h, false);
  cam.aspect = w/h; cam.updateProjectionMatrix();
  const tanV = Math.tan(cam.fov*Math.PI/360);
  CAM_D = 5.9/(cam.aspect*tanV);
  /* el cohete al 35 % del alto: el centro de la vista queda 0,3 del semialto por arriba */
  CAM_Y = CAM_D*tanV*0.30;
  cam.position.set(0, CAM_Y, CAM_D); cam.lookAt(0, CAM_Y, 0);
  ponCielo();
}
addEventListener('resize', medir);

/* ══════════ LAS LUCES ══════════ */
const luzSol = new T.DirectionalLight(0xfff2e0, 2.2); luzSol.position.set(4, 8, 6); escena.add(luzSol);
const luzHemi = new T.HemisphereLight(0xbfdcff, 0x5a4a3a, 0.9); escena.add(luzHemi);
const luzLlama = new T.PointLight(0xff9a3a, 0, 14, 1.6); luzLlama.position.set(0, -1.6, 0.6);
/* ── EL MUNDO CERCANO VA EN UN GRUPO QUE SE PUEDE CORRER ──
   En el menu el cohete tiene que quedar en el hueco del velo, arriba del cuadro.
   Bajar la camara no sirve: queda DEBAJO del suelo y lo que se ve es la cara de
   abajo del pasto (medido: los dos quintos de arriba del cuadro en negro). Se
   corre el mundo hacia arriba y la camara no se toca. */
const mundo = new T.Group(); escena.add(mundo); mundo.add(luzLlama);

/* ══════════ FUNDIR PIEZAS EN UNA MALLA ══════════
   Un obstaculo creible son cuatro o cinco piezas, y veinte obstaculos sueltos
   son cien llamadas de dibujo. Se funden con su color en los vertices y cada
   clase de obstaculo es UNA malla instanciada. */
function fundir(piezas){
  const pos = [], nor = [], col = [];
  const c = new T.Color(), m = new T.Matrix4(), nm = new T.Matrix3();
  for (const p of piezas){
    let g = p.g.index ? p.g.toNonIndexed() : p.g;
    m.compose(new T.Vector3(...(p.p || [0, 0, 0])), new T.Quaternion().setFromEuler(new T.Euler(...(p.r || [0, 0, 0]))), new T.Vector3(...(p.s || [1, 1, 1])));
    nm.getNormalMatrix(m);
    const P = g.attributes.position, N = g.attributes.normal;
    c.set(p.c);
    const v = new T.Vector3();
    for (let i = 0; i < P.count; i++){
      v.fromBufferAttribute(P, i).applyMatrix4(m); pos.push(v.x, v.y, v.z);
      v.fromBufferAttribute(N, i).applyMatrix3(nm).normalize(); nor.push(v.x, v.y, v.z);
      col.push(c.r, c.g, c.b);
    }
  }
  const G = new T.BufferGeometry();
  G.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  G.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
  G.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  return G;
}
const matVert = new T.MeshLambertMaterial({ vertexColors: true });
const matVertBrillo = new T.MeshLambertMaterial({ vertexColors: true, emissive: 0x222222 });

/* ══════════ EL CIELO ══════════
   Un plano pegado detras de todo con un degradado de dos colores —el de arriba y
   el de abajo de la capa, fundidos por la altura entre una capa y la siguiente—
   y estrellas que aparecen a partir de los 20 km. Sin niebla: arriba no hay
   aire y abajo el degradado ya hace el trabajo. */
const cieloMat = new T.ShaderMaterial({
  uniforms: { uArr: { value: new T.Color(0x3f8fd8) }, uAba: { value: new T.Color(0x9ed3ff) }, uEst: { value: 0 }, uT: { value: 0 } },
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
  fragmentShader: `
    uniform vec3 uArr, uAba; uniform float uEst, uT; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
    void main(){
      vec3 c = mix(uAba, uArr, smoothstep(0.0, 1.0, vUv.y));
      /* estrellas: una reja de celdas, un punto por celda, con brillo al azar */
      vec2 g = vUv*vec2(60.0, 130.0);
      vec2 id = floor(g), f = fract(g) - 0.5;
      float h = hash(id);
      float d = length(f - (vec2(hash(id + 1.3), hash(id + 7.1)) - 0.5)*0.8);
      float est = smoothstep(0.08, 0.0, d)*step(0.82, h)*(0.6 + 0.4*sin(uT*2.0 + h*40.0));
      c += vec3(est)*uEst;
      gl_FragColor = vec4(c, 1.0);
    }`
});
const cielo = new T.Mesh(new T.PlaneGeometry(2, 2), cieloMat); cielo.frustumCulled = false; cielo.renderOrder = -10; escena.add(cielo);
const _cA = new T.Color(), _cB = new T.Color();
function ponCielo(h){
  h = h == null ? (RUN ? RUN.h : 0) : h;
  const c = capaDe(h), C = CAPAS[c], S = CAPAS[Math.min(CAPAS.length - 1, c + 1)];
  /* la fraccion se toma en escala logaritmica: las capas van de a decadas */
  const k = S === C ? 0 : cl(Math.log(Math.max(1, h)/Math.max(1, C.h))/Math.log(Math.max(2, S.h)/Math.max(1, C.h)), 0, 1);
  cieloMat.uniforms.uArr.value.set(C.arr).lerp(_cA.set(S.arr), k);
  cieloMat.uniforms.uAba.value.set(C.aba).lerp(_cB.set(S.aba), k);
  cieloMat.uniforms.uEst.value = cl((h - 15000)/60000, 0, 1);
  /* la luz baja con el aire: en el espacio el sol es duro y el hemisferio se apaga */
  const aire = aireEn(h);
  luzHemi.intensity = 0.25 + 0.65*aire; luzSol.intensity = 2.2 + 0.8*(1 - aire);
}

/* ══════════ LA PLATAFORMA Y LA TORRE ══════════ */
const suelo = new T.Group(); mundo.add(suelo);
{
  const G = fundir([
    { g: new T.CylinderGeometry(70, 70, 0.3, 48), c: '#4a5a3a', p: [0, -1.55, 0] },
    { g: new T.CylinderGeometry(9, 9, 0.3, 24), c: '#55663f', p: [0, -1.35, 0] },
    { g: new T.CylinderGeometry(2.4, 2.6, 0.35, 16), c: '#7a7f88', p: [0, -1.05, 0] },
    { g: new T.BoxGeometry(0.5, 0.5, 0.5), c: '#3a3f48', p: [1.1, -0.9, 1.1] }, { g: new T.BoxGeometry(0.5, 0.5, 0.5), c: '#3a3f48', p: [-1.1, -0.9, 1.1] },
    { g: new T.BoxGeometry(0.5, 0.5, 0.5), c: '#3a3f48', p: [1.1, -0.9, -1.1] }, { g: new T.BoxGeometry(0.5, 0.5, 0.5), c: '#3a3f48', p: [-1.1, -0.9, -1.1] },
    /* la torre */
    { g: new T.BoxGeometry(0.6, 6.0, 0.6), c: '#c8342a', p: [-2.4, 1.8, -0.7] },
    { g: new T.BoxGeometry(0.14, 6.0, 0.14), c: '#e8e8e8', p: [-1.95, 1.8, -0.3] },
    { g: new T.BoxGeometry(0.14, 6.0, 0.14), c: '#e8e8e8', p: [-2.85, 1.8, -0.3] },
    { g: new T.BoxGeometry(1.4, 0.14, 1.4), c: '#e8e8e8', p: [-2.4, 4.9, -0.7] },
    { g: new T.BoxGeometry(0.18, 1.6, 0.18), c: '#ffd447', p: [-2.4, 5.7, -0.7] },
    { g: new T.SphereGeometry(0.18, 8, 6), c: '#ff3a1a', p: [-2.4, 6.55, -0.7] }
  ]);
  const m = new T.Mesh(G, matVert); suelo.add(m);
  /* arboles: conos a los costados, que es lo que hace que los primeros 60 m
     se lean como subir */
  const arb = [];
  for (let i = 0; i < 26; i++){
    const x = (i % 2 ? 1 : -1)*(4.5 + (i*0.73) % 5.5), z = -3 - (i*1.31) % 7;
    const hh = 1.4 + (i*0.37) % 1.8;
    arb.push({ g: new T.ConeGeometry(0.6 + (i*0.17) % 0.5, hh, 7), c: i % 3 ? '#2e6b3a' : '#3a8a48', p: [x, -1.2 + hh/2, z] });
    arb.push({ g: new T.CylinderGeometry(0.1, 0.12, 0.5, 5), c: '#5a3a22', p: [x, -1.3, z] });
  }
  suelo.add(new T.Mesh(fundir(arb), matVert));
  /* los brazos que sueltan el cohete: dos, y se abren al encender */
  suelo.brazos = [];
  for (const s of [-1, 1]){
    const b = new T.Group(); b.position.set(-2.1, 0.9 + s*0.6, -0.4);
    const bm = new T.Mesh(new T.BoxGeometry(1.7, 0.16, 0.16), new T.MeshLambertMaterial({ color: 0xe8e8e8 }));
    bm.position.x = 0.85; b.add(bm);
    const pin = new T.Mesh(new T.BoxGeometry(0.16, 0.5, 0.5), new T.MeshLambertMaterial({ color: 0xc8342a })); pin.position.x = 1.7; b.add(pin);
    suelo.add(b); suelo.brazos.push(b);
  }
}

/* ══════════ EL COHETE ══════════
   ── UN ESTILO ES UNA TEXTURA DIBUJADA POR CODIGO ──
   El fuselaje lleva un lienzo de 128×384: el color base, el patron encima y
   las bandas. Los veinticuatro estilos salen de la misma funcion con otros
   numeros. Y las mejoras SE VEN: el tanque alarga el cuerpo, las aletas crecen,
   el motor suma toberas, el escudo pone una burbuja, el iman dos aros. */
function pintaEstilo(E, c2, w, h){
  c2.fillStyle = E.base; c2.fillRect(0, 0, w, h);
  const f = E.franja;
  c2.fillStyle = f;
  const patron = E.patron;
  if (patron === 'bandas'){ for (let y = h*0.18; y < h*0.9; y += h*0.22) c2.fillRect(0, y, w, h*0.06); }
  if (patron === 'damero'){ const n = 6, s = w/n; for (let i = 0; i < n; i++) for (let j = 0; j < h/s; j++) if ((i + j) % 2) c2.fillRect(i*s, j*s, s, s); }
  if (patron === 'rayas'){ for (let i = 0; i < 14; i++){ c2.beginPath(); c2.moveTo(0, i*h/7 - 20); c2.lineTo(w, i*h/7 + 20); c2.lineTo(w, i*h/7 + 20 + h/18); c2.lineTo(0, i*h/7 - 20 + h/18); c2.fill(); } }
  if (patron === 'llamas'){
    for (let k = 0; k < 2; k++){
      c2.fillStyle = k ? E.punta : f;
      for (let x = -10; x < w + 10; x += 14){
        c2.beginPath(); c2.moveTo(x, h); c2.quadraticCurveTo(x + 4, h*0.7 - k*20, x + 7, h*0.55 - k*40 - (x*7 % 30)); c2.quadraticCurveTo(x + 10, h*0.7 - k*20, x + 14, h); c2.fill();
      }
    }
  }
  if (patron === 'puntos'){ for (let i = 0; i < 40; i++){ c2.beginPath(); c2.arc(((i*37) % w), ((i*91) % h), 5 + (i % 3)*3, 0, 6.29); c2.fill(); } }
  if (patron === 'camo'){ const cs = [f, E.punta, E.aleta]; for (let i = 0; i < 26; i++){ c2.fillStyle = cs[i % 3]; c2.beginPath(); c2.ellipse((i*53) % w, (i*71) % h, 14 + (i % 4)*6, 9 + (i % 3)*5, i, 0, 6.29); c2.fill(); } }
  if (patron === 'zigzag'){ c2.lineWidth = 6; c2.strokeStyle = f; for (let y = 20; y < h; y += 44){ c2.beginPath(); for (let x = 0; x <= w; x += 16) c2.lineTo(x, y + ((x/16) % 2 ? 10 : -10)); c2.stroke(); } }
  if (patron === 'grietas'){ c2.lineWidth = 3; c2.strokeStyle = f; for (let i = 0; i < 14; i++){ c2.beginPath(); let x = (i*41) % w, y = (i*67) % h; c2.moveTo(x, y); for (let k = 0; k < 6; k++){ x += ((i + k)*13 % 21) - 10; y += 8 + (k*i) % 16; c2.lineTo(x, y); } c2.stroke(); } }
  if (patron === 'estrellas'){ c2.fillStyle = '#ffffff'; for (let i = 0; i < 60; i++){ const r = 0.6 + (i % 4)*0.5; c2.beginPath(); c2.arc((i*47) % w, (i*83) % h, r, 0, 6.29); c2.fill(); } c2.fillStyle = f; for (let i = 0; i < 6; i++){ c2.beginPath(); c2.ellipse((i*61) % w, (i*97) % h, 22, 10, i*0.7, 0, 6.29); c2.globalAlpha = 0.35; c2.fill(); c2.globalAlpha = 1; } }
  if (patron === 'arcoiris'){ const cs = ['#ff3a3a', '#ff9a2a', '#ffd447', '#3ad35a', '#3a8fff', '#8a4aff']; cs.forEach((cc, i) => { c2.fillStyle = cc; c2.fillRect(0, h*0.3 + i*h*0.055, w, h*0.055); }); }
  /* la banda de la cintura y la ventanilla, en todos */

  /* el cohete: en x, inclinado hacia donde va, temblando al encender */
  const inclina = R ? -R.vx*0.06 : 0;
  const tiembla = R && R.fase === 'cuenta' ? R.empujeK*0.03 : (R && R.sacude ? R.sacude*0.06 : 0);
  cohete.position.set(x + (Math.random() - 0.5)*tiembla, (Math.random() - 0.5)*tiembla, 0);
  cohete.rotation.z = inclina;
  if (!R || R.fase === 'menu'){
    /* en el menu gira despacio sobre la plataforma */
    EFE.giro += dt*0.5; cohete.rotation.y = EFE.giro; cohete.position.x = 0;
  } else cohete.rotation.y += dt*0.3;
  if (cohete.aros) cohete.aros.forEach((a, i) => { a.rotation.z += dt*(i ? -1.5 : 1.2); });
  if (cohete.escudo){ const gk = R ? R.sacude : 0; cohete.escudo.material.opacity = 0.05 + 0.02*(PROG.niv.escudo | 0) + gk*0.4; }
  /* la llama sigue al empuje, con parpadeo */
  const k = R ? R.empujeK*(R.comb > 0 || R.fase === 'cuenta' ? 1 : 0) : 0;
  const boost = R ? R.boostK : 0;
  const colR = R && R.raf && R.boostK > 0.05 ? new T.Color(R.raf.col) : null;
  for (const L of cohete.llamas || []){
    const fl = 0.85 + Math.random()*0.3;
    const s = k*(1 + boost*0.8)*fl;
    L.g.scale.set(1 + boost*0.4, s, 1 + boost*0.4); L.g.visible = s > 0.02;
    if (colR) L.ext.material.color.copy(colR); else L.ext.material.color.setHex(0xff7a2a);
  }
  luzLlama.intensity = k*(2.2 + boost*2)*(0.9 + Math.random()*0.2);
  luzLlama.position.set(x, -cohete.largo/2 - 0.8, 0.6);
  /* el humo: solo con aire. En el vacio no hay humo, hay llama */
  const aire = aireEn(h);
  if (R && k > 0.1 && aire > 0.02){
    EFE.humoAcum += dt*(R.fase === 'cuenta' ? 90 : 40)*aire*k;
    const enPad = R.fase === 'cuenta' || h < 12;
    while (EFE.humoAcum > 1){
      EFE.humoAcum--;
      const ang = Math.random()*6.28, sp = enPad ? 3 + Math.random()*3 : 0.6;
      const g = 0.55 + Math.random()*0.35;
      particula({ x: x + (Math.random() - 0.5)*0.3, y: enPad ? -cohete.largo/2 - 0.9 : -cohete.largo/2 - 1.2, z: -0.2 + Math.random()*0.4,
        vx: enPad ? Math.cos(ang)*sp : (Math.random() - 0.5)*0.8, vy: enPad ? 0.2 + Math.random()*0.5 : -(R.v/m)*0.6 - 2, g: enPad ? 0 : 0,
        dur: enPad ? 1.6 + Math.random() : 0.5 + Math.random()*0.5, s: enPad ? 1.2 : 0.7, a: 0.55, c: [g, g*0.98, g*0.95] });
    }
  }
  /* el sacudon de la camara: por golpe y por rafaga */
  const sac = R ? R.sacude*0.35 + R.boostK*0.12 : 0;
  /* ── EN EL MENU LA CAMARA BAJA Y MIRA HACIA ABAJO ──
     El cohete tiene que quedar en el hueco del velo, arriba del cuadro. Correrlo
     hacia arriba o bajar la camara deja el lente DEBAJO del suelo, y lo que se ve
     es la cara de abajo del pasto (medido: los dos quintos de arriba del cuadro
     en negro). La camara se queda justo por encima del suelo y mira unos grados
     hacia abajo: el cohete cae al 37 % del alto, en el hueco, y el pasto llena el resto. */
  const menu = (!R || PANTALLA !== '') && !(R && R.fase === 'fin');
  const yObj = menu ? -1.0 : CAM_Y, mObj = menu ? -3.4 : CAM_Y;
  EFE.camY = EFE.camY == null ? yObj : EFE.camY + (yObj - EFE.camY)*Math.min(1, dt*4);
  EFE.miraY = EFE.miraY == null ? mObj : EFE.miraY + (mObj - EFE.miraY)*Math.min(1, dt*4);
  cam.position.set((Math.random() - 0.5)*sac, EFE.camY + (Math.random() - 0.5)*sac, CAM_D);
  cam.lookAt(0, EFE.miraY, 0);
  /* los obstaculos */
  for (const kk in COSAS_M) COSAS_M[kk].count = 0;
  if (R){
    for (const o of R.obs){
      if (!o.vivo) continue;
      const im = COSAS_M[o.k]; if (!im || im.count >= OBJ_N) continue;
      const dy = (o.hm - h)/m; if (dy < -16 || dy > 30) continue;
      const bob = Math.sin(EFE.t*1.5 + o.fase)*0.15;
      const rz = o.k === 'meteoro' ? -0.7 : (o.k === 'asteroide' || o.k === 'chatarra' ? EFE.t*0.4 + o.fase : 0);
      const ry = o.k === 'satelite' || o.k === 'estacion' ? EFE.t*0.2 + o.fase : (o.vx < 0 ? Math.PI : 0);
      _q.setFromEuler(new T.Euler(0, ry, rz));
      const sc = o.r/(COSAS[o.k].r) ;
      _m4.compose(_v3.set(o.x, dy + bob, -0.5), _q, _s3.set(sc, sc, sc));
      im.setMatrixAt(im.count++, _m4);
    }
    monedasM.count = 0;
    for (const o of R.mon){
      if (!o.vivo || monedasM.count >= 90) continue;
      const dy = (o.hm - h)/m; if (dy < -16 || dy > 30) continue;
      _q.setFromEuler(new T.Euler(0, EFE.t*2.5 + o.hm*0.01, 0));
      _m4.compose(_v3.set(o.x, dy, 0), _q, _s3.set(1, 1, 1)); monedasM.setMatrixAt(monedasM.count++, _m4);
    }
  } else monedasM.count = 0;
  for (const kk in COSAS_M) COSAS_M[kk].instanceMatrix.needsUpdate = true;
  monedasM.instanceMatrix.needsUpdate = true;
  /* la Tierra */
  /* ── LA TIERRA: EL RADIO SE TOPA Y EL BORDE SUBE ──
     A escala real la esfera mide miles de unidades y el plano lejano la corta;
     ademas el suelo esta siempre a 25 unidades, asi que la Tierra no entraria
     nunca en el cuadro. El radio visible se topa en 300 y el borde sube de −25 a
     −6 entre los 25 y los 400 km: primero es un horizonte curvo, despues una
     bola que se achica hasta ser un punto pasada la geoestacionaria. */
  tierra.visible = h > 25000;
  if (tierra.visible){
    const rT = Math.min(300, R_T/m), arriba = -25 + 19*cl((h - 25000)/375000, 0, 1);
    tierra.scale.setScalar(rT); tierra.position.set(0, arriba - rT, -rT*0.15 - 4); tierra.rotation.y = EFE.t*0.01;
  }
  /* la Luna y Marte, a su altura */
  for (const [obj, hh, xx] of [[luna, 3.84e8, 3.2], [marte, 7.8e10, -3.0], [solLejos, 3e11, 3.5]]){
    const dy = (hh - h)/m; obj.visible = dy > -20 && dy < 40; if (obj.visible){ obj.position.set(xx, dy, -6); obj.rotation.y = EFE.t*0.05; }
  }
  /* el anillo de la rafaga */
  if (R && R.boostK > 0){ anillo.visible = true; anillo.position.set(x, -cohete.largo/2 - 0.4, 0.3); const s = 1 + (1 - R.boostK)*6; anillo.scale.set(s, s, 1); anillo.material.opacity = R.boostK*0.8; if (R.raf) anillo.material.color.set(R.raf.col); }
  else anillo.visible = false;
  partesPaso(dt);
  render.render(escena, cam);
}

/* ══════════ LOS ESTILOS ══════════
   ── LA FICHA ES UN COHETE, NO UNA MUESTRA DE TELA ──
   La textura sola en un cuadrado es un pedazo de pared con una ventanilla. Se
   recorta con la silueta del cohete —cuerpo, nariz y aletas— y la textura se
   pinta adentro: asi la ficha dice como va a quedar el cohete y no de que color
   es la pintura. */
function pintaFicha(E, x, w, h){
  x.fillStyle = '#0d1220'; x.fillRect(0, 0, w, h);
  const tex = document.createElement('canvas'); tex.width = 64; tex.height = 192; pintaEstilo(E, tex.getContext('2d'), 64, 192);
  const cx = w/2, r = w*0.17, top = h*0.12, base = h*0.86;
  x.save(); x.beginPath(); x.rect(cx - r, top + h*0.2, 2*r, base - top - h*0.2); x.clip();
  x.drawImage(tex, cx - r, top + h*0.2, 2*r, base - top - h*0.2); x.restore();
  x.fillStyle = E.punta; x.beginPath(); x.moveTo(cx - r, top + h*0.2); x.quadraticCurveTo(cx - r*0.6, top, cx, top); x.quadraticCurveTo(cx + r*0.6, top, cx + r, top + h*0.2); x.fill();
  x.fillStyle = E.aleta;
  x.beginPath(); x.moveTo(cx - r, base - h*0.22); x.lineTo(cx - r*2.1, base); x.lineTo(cx - r, base); x.fill();
  x.beginPath(); x.moveTo(cx + r, base - h*0.22); x.lineTo(cx + r*2.1, base); x.lineTo(cx + r, base); x.fill();
  x.fillStyle = '#3a3f48'; x.fillRect(cx - r*0.55, base, r*1.1, h*0.05);
  const g = x.createLinearGradient(0, base + h*0.05, 0, h); g.addColorStop(0, 'rgba(255,200,80,.9)'); g.addColorStop(1, 'rgba(255,90,30,0)');
  x.fillStyle = g; x.beginPath(); x.moveTo(cx - r*0.45, base + h*0.05); x.lineTo(cx, h); x.lineTo(cx + r*0.45, base + h*0.05); x.fill();
  /* un brillo de costado, que es lo que hace que se lea a cilindro */
  const b = x.createLinearGradient(cx - r, 0, cx + r, 0); b.addColorStop(0, 'rgba(0,0,0,.35)'); b.addColorStop(0.35, 'rgba(255,255,255,.18)'); b.addColorStop(1, 'rgba(0,0,0,.4)');
  x.save(); x.beginPath(); x.rect(cx - r, top, 2*r, base - top); x.clip(); x.fillStyle = b; x.fillRect(cx - r, top, 2*r, base - top); x.restore();
}
function pintaEstilos(){
  $('eSaldo').textContent = '● ' + fmtMon(PROG.monedas);
