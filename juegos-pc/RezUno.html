const dorsoIzqD=[], dorsoDerD=[];    // el resto de su abanico: solo dorso, una llamada cada una
/* ===== QUIENES SE DIBUJAN ENFRENTE Y DE QUE LADO =====
   Con bots son dos, a izquierda y derecha. En multijugador es UNO, y va CENTRADO: dejandolo en su
   costado la mesa queda con un lado ocupado y el otro vacio, y eso se lee a que falta alguien y no a
   un mano a mano. La lista de dorsos viaja en la misma tupla y no se deduce del signo del lado, que
   con el rival centrado —lado 0— no tiene signo. */
function RIVALES(){
  return N_JUG===2? [[dorsoIzq, dorsoIzqD, J_IZQ, 0]]
                  : [[dorsoIzq, dorsoIzqD, J_IZQ, -1], [dorsoDer, dorsoDerD, J_DER, 1]];
}
const pilaMallas=[];                 // las tres ultimas de la pila
let mazoMalla=null, selMalla=null;
const botones={};                    // tirar / dejar / los cuatro colores
const grupo=new THREE.Group(); escena.add(grupo);
/* ===================== TUS CARTAS GIRAN CON VOS =====================
   Al asomarse a un lado, la camara ORBITA alrededor del centro de la mesa. Tu abanico esta a nueve
   unidades de ese centro, asi que orbitando doce grados se corre casi dos unidades de costado y se
   sale del cuadro: medido, con dos grados de giro ya asomaba fuera de pantalla.

   Y la solucion no es girar menos: es que tus cartas son TUYAS. Cuando alguien sentado a una mesa
   gira la cabeza para mirar de reojo, sus propias cartas no se quedan atras — se mueven con el.
   El abanico y los dos botones viven en un grupo que gira lo mismo que la camara alrededor del mismo
   pivote, asi que su sitio EN LA PANTALLA no cambia mientras la mesa si rota. Lo que se mueve es el
   punto de vista sobre la mesa, que es lo que se pidio. */
const manoGrupo=new THREE.Group();
manoGrupo.position.set(0, 0, CAM_MIRA[1]);
escena.add(manoGrupo);
function manoGrupoAlDia(){ manoGrupo.rotation.y = camGiro; }

/* EL SITIO DE CADA COSA, EN UNIDADES DEL MUNDO. Estan juntos a proposito: son las quince medidas que
   definen la mesa y tenerlas desparramadas es como se termina con un abanico que se sale del cuadro. */
/* LA MESA ES LARGA Y ANGOSTA, Y ESO SALIO DE MEDIR EL ENCUADRE, NO DE DECORAR.
   Con una mesa casi cuadrada —9,2 de ancho por 13,8 de fondo— barri 200 combinaciones de campo,
   altura y distancia de camara y la MEJOR usaba el 34% del alto de la pantalla: en un marco 9:16 eso
   deja el tercio de arriba y el sexto de abajo vacios, y no hay camara que lo arregle porque el
   problema es la forma de lo que se mira. Estirada a 21 de fondo por 9 de ancho —una proporcion de
   2,3 contra el 1,78 de la pantalla— el mismo barrido encuentra encuadres que llenan el alto. */
const MESA={
  manoZ:8.4, manoY:1.02, manoArco:0.16, manoAncho:7.2, manoTilt:-0.78,
  mazoX:-2.9, pilaX:2.9, centroZ:-0.6,
  rivalZ:-9.6, rivalX:2.95, rivalFanY:1.55, rivalTilt:-0.55,
  selY:2.4, selZ:3.4, botY:3.4, botZ:1.4
};

/* ===================== LAS CARTAS FLOTAN =====================
   Pedido: *"las cartas flotando tambien"*. Y no es solo estetica: los abanicos de los rivales estaban
   APOYADOS en la mesa y casi acostados (rx -1,30, o sea 74 grados), asi que desde una camara que mira
   desde arriba se veian como una franja de cantos. Levantados y parados a 31 grados, el dorso queda
   de frente a la camara y ademas el abanico crece hacia arriba, que es justo donde hay pantalla libre
   y donde ahora esta la cabeza del rival.
   El vaiven es lento y chico —siete centesimas— y va DESFASADO carta por carta: con todas en fase el
   abanico entero sube y baja como un bloque, que se lee a error de camara y no a cartas flotando. */
function flota(t, i, k){ return Math.sin((t||0)*1.25 + i*0.42)*(k==null? 0.07 : k); }
/* el sitio de una carta del abanico de un rival. ES UNA FUNCION Y NO ESTA ADENTRO DE armarMesa a
   proposito: la mano del rival tiene que poder preguntar donde esta la carta que va a agarrar, y si
   la cuenta viviera adentro del bucle que dibuja, la mano y la carta serian dos cuentas distintas
   —o sea que la mano agarraria al lado de la carta. */
function sitioRival(i, q, lado, t){
  const paso=Math.min(0.42, 3.2/Math.max(1,q));
  const f=q<=1? 0 : (i/(q-1))*2-1;
  return { x: lado*MESA.rivalX + (i-(q-1)/2)*paso,
           y: MESA.rivalFanY + flota(t, i+lado*3) + i*0.012,
           z: MESA.rivalZ + i*0.03,
           rx: MESA.rivalTilt, ry:0, rz:-f*0.13 };
}

/* el abanico: un arco, no una fila. Con las cartas en linea el jugador ve una pared de cantos; con el
   arco cada una gira un poco y se ve su cara. El paso se aprieta cuando hay muchas para que el
   abanico entero entre en el ancho util — sin eso una mano de catorce se sale por los dos lados. */
function manoGeo(n){
  const paso=n<=1? 0 : Math.min(CARTA_W*0.80, (MESA.manoAncho-CARTA_W)/(n-1));
  return { paso, x0:-(paso*(n-1))/2 };
}
function sitioMano(i, n){
  const g=manoGeo(n);
  const x=g.x0+i*g.paso;
  const f=n<=1? 0 : (i/(n-1))*2-1;                  // -1 .. 1 de punta a punta
  /* EL ARCO LEVANTA 0,12 Y NO 0,30. Con 0,30 la carta del medio quedaba casi un tercio mas cerca de
     la camara que la de la punta, y en perspectiva eso se ve como si fuera de otro tamaño: en la
     captura el +2 del medio parecia el doble que el 1 de la izquierda. El arco esta para que cada
     carta muestre su cara, no para escalonarlas. */
  /* LAS CARTAS DE LA MANO SE PARAN, NO SE ACUESTAN. Tumbadas 58 grados sobre la mesa, la cara se ve
     tan escorzada que el numero pierde la mitad de su alto y el abanico ocupa una banda finita en la
     parte de abajo. Paradas a 45 se leen enteras y ademas el abanico crece hacia arriba, que es
     justo donde sobraba pantalla. Se levantan del piso lo que hace falta para que el borde de abajo
     no atraviese la mesa: media carta por el coseno de la inclinacion. */
  /* EL ABANICO SE SUPERPONE SIEMPRE PARA EL MISMO LADO, y esto no es estetico: es lo que hace que se
     pueda apuntar. Antes la profundidad venia del arco —las cartas del medio quedaban MAS LEJOS que
     las de las puntas— asi que las de afuera tapaban a las de adentro y el centro de una carta del
     medio podia estar debajo de su vecina. Medido: de 25 partidas jugadas apuntando al centro de la
     carta, 9 se trababan porque el rayo agarraba otra. Con la profundidad creciendo con el indice,
     cada carta tapa a la anterior y a ninguna otra, o sea que TODAS tienen una franja visible a la
     izquierda — igual que un abanico de cartas en la mano. */
  /* Y EL ARCO EN ALTURA SE FUE, QUE ES LA SEGUNDA MITAD DEL MISMO DEFECTO. Con las cartas inclinadas
     45 grados, subir una carta 0,04 la acerca a la camara 0,028 — o sea que el arco METIA una
     profundidad propia, del mismo tamaño que el escalon del solape. Medido: la carta 5 apuntada en su
     franja visible seguia devolviendo la 4 en las dos semillas probadas. Sin arco de altura la
     profundidad la decide UNICAMENTE el indice, y el escalon sube a 0,05 para que sea inconfundible.
     El abanico se sigue viendo abanico porque el giro de cada carta no se toca. */
  return { x, y:MESA.manoY, z:MESA.manoZ - CAM_MIRA[1] + i*0.05,
           rz:-f*MESA.manoArco, rx:MESA.manoTilt };
}

/* EL PUNTO AL QUE SE APUNTA ES EL MEDIO DE LA FRANJA VISIBLE, NO EL CENTRO DE LA CARTA. Con solape,
   el centro de una carta puede estar debajo de la siguiente; lo que el jugador ve —y por lo tanto
   donde apunta— es la tira que asoma a la izquierda, y su ancho sale de la geometria: el ancho de la
   carta menos el paso del abanico. La ultima no tiene a nadie encima, asi que se apunta a su centro. */
const _pv=new THREE.Vector3();
function puntoMano(malla, i, n){
  const g=manoGeo(n);
  const tapado = (i<n-1)? Math.max(0, CARTA_W-g.paso) : 0;
  /* SE PASA POR LA MATRIZ DE LA PROPIA CARTA Y NO SE RECONSTRUYE A MANO. La carta esta girada en dos
     ejes; escribir "x + dx por el coseno del giro" es adivinar en que orden three.js compone los
     angulos, y adivinarlo mal manda el punto a otra carta — medido, fallaba en una de siete. */
  malla.updateMatrixWorld(true);
  return malla.localToWorld(_pv.set(-tapado/2, 0, 0));
}
function malla(lista, k, padre){
  while(lista.length<=k){ const m=nuevaCarta(); m.visible=false; (padre||grupo).add(m); lista.push(m); }
  return lista[k];
}
/* la misma reserva, pero de cartas que solo muestran el dorso: una llamada de dibujo cada una */
function mallaDorso(lista, k, padre){
  while(lista.length<=k){ const m=nuevaCartaDorso(); m.visible=false; (padre||grupo).add(m); lista.push(m); }
  return lista[k];
}
function sobra(lista, n){ for(let k=n;k<lista.length;k++) lista[k].visible=false; }
/* el movimiento es un lerp hacia el sitio destino. No hace falta nada mas elaborado: una carta que se
   tira es un objeto yendo de A a B, y con el lerp la animacion sale gratis y no hay que mantener una
   lista de tweens que se puede desincronizar del estado */
function irA(m, p, k){
  const a=k==null? 0.22 : k;
  m.position.x += (p.x-m.position.x)*a;
  m.position.y += (p.y-m.position.y)*a;
  m.position.z += (p.z-m.position.z)*a;
  m.rotation.x += ((p.rx||0)-m.rotation.x)*a;
  m.rotation.y += ((p.ry||0)-m.rotation.y)*a;
  m.rotation.z += ((p.rz||0)-m.rotation.z)*a;
}
function poner(m, p){
  m.position.set(p.x,p.y,p.z); m.rotation.set(p.rx||0, p.ry||0, p.rz||0);
}

/* ---------- los botones flotantes ---------- */
/* SON PLACAS EN EL MUNDO Y NO HTML ENCIMA. Con HTML habria dos sistemas de coordenadas y dos caminos
   de apuntado; con placas, el boton se pellizca por el MISMO rayo que una carta. Un camino, una
   prueba. */
const _geoBot=new THREE.PlaneGeometry(1,1);
function texBoton(s, activo, fuerte){
  const W=384,H=140;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  g.clearRect(0,0,W,H);
  rr(g,4,4,W-8,H-8,16);
  g.fillStyle = activo? (fuerte? '#1b1d22' : '#ffffff') : '#eceef1';
  g.fill();
  g.lineWidth=3; g.strokeStyle = activo? (fuerte? '#1b1d22' : '#b9bec6') : '#dfe2e6'; g.stroke();
  g.font='700 46px "Segoe UI",system-ui,sans-serif';
  g.fillStyle = activo? (fuerte? '#f7f8f9' : '#1b1d22') : '#adb3bc';
  g.textAlign='center'; g.textBaseline='middle';
  /* el espaciado se dibuja letra por letra: canvas 2D no tiene letter-spacing en todos lados */
  const esp=5; let tot=0; for(const ch of s) tot+=g.measureText(ch).width+esp; tot-=esp;
  let x=W/2-tot/2;
  for(const ch of s){ g.fillText(ch, x+g.measureText(ch).width/2, H/2); x+=g.measureText(ch).width+esp; }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
function nuevoBoton(tipo, i, w, h){
  const m=new THREE.Mesh(_geoBot, new THREE.MeshBasicMaterial({transparent:true, depthTest:false}));
  m.scale.set(w,h,1); m.renderOrder=5; m.visible=false;
  m.userData={tipo, i, activo:true};
  /* NO SE METE EN PICK ACA. armarMesa() vacia la lista en cada cuadro —porque las cartas de la mano
     cambian de numero y de sitio— asi que un objeto anotado una sola vez al crearse desaparece de la
     lista en el primer cuadro. Costo una prueba: pellizcar TIRAR devolvia "no hay tirar". Los
     botones se anotan cuando se los hace visibles, junto con todo lo demas. */
  manoGrupo.add(m);
  return m;
}
botones.tirar=nuevoBoton('tirar',0, 2.55, 0.93);
botones.dejar=nuevoBoton('dejar',0, 2.55, 0.93);
botones.color=[0,1,2,3].map(k=>{
  const m=new THREE.Mesh(_geoBot, new THREE.MeshBasicMaterial({color:COLORES[k], depthTest:false}));
  m.scale.set(2.15,1.25,1); m.renderOrder=5; m.visible=false;
  m.userData={tipo:'color', i:k, activo:true};
  manoGrupo.add(m); return m;
});
let _texBot={};
function ponerTexBoton(m, clave, s, activo, fuerte){
  const k=clave+'|'+s+'|'+(activo?1:0)+'|'+(fuerte?1:0);
  if(m.userData.k===k) return;
  m.userData.k=k;
  if(_texBot[k]) { m.material.map=_texBot[k]; }
  else { _texBot[k]=texBoton(s,activo,fuerte); m.material.map=_texBot[k]; }
  m.material.needsUpdate=true;
}

/* ---------- el aro de la mano, en 3D ---------- */
/* VA PEGADO A LA CAMARA Y NO EN LA MESA. Es el cursor: tiene que estar donde el jugador ve su mano,
   no donde el rayo choca — si se pusiera en el punto de impacto, saltaria de una carta a otra y por
   el aire desapareceria. Colgado de la camara a distancia fija, se mueve como un cursor. */
const aroG=new THREE.Group(); camara.add(aroG); escena.add(camara);
/* EL ARO SE ACHICA A LA MITAD AHORA QUE SE VE LA MANO. Antes era el UNICO indicio de donde estabas
   apuntando, asi que tenia que ser grande; con los cinco dedos dibujados, lo que hace falta es una
   marca fina en el punto exacto de la pinza — un aro gordo encima de la mano la tapa. */
const aroMalla=new THREE.Mesh(new THREE.RingGeometry(0.86,1,40),
  new THREE.MeshBasicMaterial({color:0x2a2d34, transparent:true, opacity:0.9, depthTest:false}));
aroMalla.renderOrder=20; aroG.add(aroMalla);
const aroPunto=new THREE.Mesh(new THREE.CircleGeometry(0.16,16),
  new THREE.MeshBasicMaterial({color:0x1b1d22, transparent:true, depthTest:false}));
aroPunto.renderOrder=21; aroG.add(aroPunto);
let ARO_R=0;
const ARO_Z=-3.55;                // apenas delante de la mano, para que no quede tapado
function pintarAro(){
  const ver = MANO.on && ARO_R>0.02;
  aroMalla.visible=aroPunto.visible=ver;
  if(!MANO.on) { ARO_R+=(0-ARO_R)*0.2; return; }
  const obj = MANO.hay? (MANO.pinza? 0.075 : 0.135) : 0;
  ARO_R += (obj-ARO_R)*0.28;
  if(!ver) return;
  /* del punto de pantalla al plano a ARO_Z: la altura visible a esa distancia sale del fov */
  const h=2*Math.tan(camara.fov*Math.PI/360)*Math.abs(ARO_Z);
  const w=h*camara.aspect;
  aroG.position.set((MANO.x-0.5)*w, -(MANO.y-0.5)*h, ARO_Z);
  aroMalla.scale.setScalar(ARO_R);
  aroPunto.scale.setScalar(ARO_R*0.9);
  const z=pickEn(MANO.x, MANO.y);
  const col=(z && z.userData.activo)? 0xc47b00 : 0x1b1d22;
  aroMalla.material.color.setHex(col); aroPunto.material.color.setHex(col);
  aroMalla.material.opacity=aroPunto.material.opacity = MANO.hay? 1 : 0.35;
}

/* =========================================================================================
   ARMAR LA MESA CADA CUADRO
   Se recorre el estado y se le dice a cada objeto DONDE tiene que estar. Los objetos se acercan solos
   con el lerp, asi que no hay animaciones que mantener ni que puedan quedar fuera de sincronia con
   las cartas de verdad.
   ========================================================================================= */
let _primera=true;
function armarMesa(){
  PICK.length=0;
  manoGrupoAlDia();
  const m=G.manos[J_VOS], n=m.length;
  const tuTurno=(G.fase==='juego' && G.turno===J_VOS);

  /* tu mano */
  for(let i=0;i<n;i++){
    const c=m[i], ma=malla(cartasMallas,i,manoGrupo);
    ma.visible=true; ponerCara(ma,c);
    const ok=pega(c,G.color,G.valor);
    ponerApagado(ma, tuTurno && !ok);
    ma.userData.tipo='carta'; ma.userData.i=i; ma.userData.activo=tuTurno;
    if(i!==G.sel) PICK.push(ma);
    if(i===G.sel){
      /* la agarrada se levanta HACIA la camara y se endereza: es la unica que hay que poder leer
         entera mientras se decide */
      const p={ x:0, y:MESA.selY, z:MESA.selZ - CAM_MIRA[1], rx:-0.62, ry:0, rz:0 };
      irA(ma, p, 0.26);
      /* Y NO ENTRA AL RAYO. Ponerla con activo:false no alcanzaba y costo una prueba: la carta
         levantada queda MAS CERCA de la camara que los botones, asi que el rayo la tocaba primero,
         veia que tiene tipo, y devolvia una carta desactivada — o sea que pellizcar TIRAR no hacia
         nada. Una carta que ya esta agarrada no es un blanco: no va a la lista y punto. */
      ma.userData.activo=false;
    } else {
      const p=sitioMano(i,n);
      /* TU ABANICO FLOTA MENOS QUE EL DE ELLOS, y no por gusto: sobre tus cartas se APUNTA. Cuatro
         centesimas sobre una carta de 2,58 de alto es un vaiven que se ve y que no mueve el blanco
         —medido, las 30 partidas apuntando con el rayo siguen sin un solo fallo de punteria—. */
      p.y += flota(G.t, i, 0.04);
      if(_primera) poner(ma,p); else irA(ma,p, tuTurno?0.24:0.18);
    }
  }
  sobra(cartasMallas, n);

  /* los rivales: dorsos en abanico, mirando a la mesa */
  for(const [lista, dlista, j, lado] of RIVALES()){
    /* DURANTE EL TUTORIAL NO SE DIBUJAN. No es por despejar porque si: el cartel del tutorial ocupa
       exactamente esa franja de la pantalla, y ninguno de los seis pasos habla de los rivales. */
    if(TUT.on){ sobra(lista, 0); sobra(dlista, 0); continue; }
    const q=G.manos[j].length;
    const B=G.bot, R=RIV[j];
    const dsobra={};
    const hayGarraAqui = !!(R && R.hayGarra && B.j===j);
    /* cuanto lleva de la fase de llevar la carta a la pila: 0 mientras la agarra, 1 al soltarla */
    const llev=(B.j===j && B.fase==='lleva')? Math.min(1, B.t/BOT_LLEVA) : 0;
    for(let i=0;i<q;i++){
      /* LA QUE EL RIVAL ESTA AGARRANDO CUELGA DE SU MANO, y su sitio ES el punto de la pinza de esa
         mano —el medio entre pulgar e indice— calculado de los mismos veintiun puntos que se dibujan.
         Con un sitio propio, la mano y la carta serian dos animaciones que hay que mantener juntas, y
         se separarian en el primer cuadro que una de las dos se atrase. */
      const esGarra = !!(R && R.hayGarra && B.j===j && B.idx===i);
      if(esGarra){
        const ma=malla(lista,i); ma.visible=true; ponerApagado(ma,false); ma.userData.tipo=null;
        /* Y SE DA VUELTA AL LLEVARLA. Mientras la elige se ve el dorso —el rival no te muestra su
           mano— y al ir hacia la pila se acuesta y muestra la cara, que es cuando ya la jugo. */
        ponerCara(ma, llev>0.35? G.manos[j][i] : null);
        /* LA CARTA CUELGA POR DEBAJO DE LA PINZA, no centrada en ella. Centrada, la mano queda
           dibujada encima de la mitad de la carta y se lee a mano TAPANDO una carta, no a mano
           sosteniendola; y colgando media carta justo, los dedos quedan en el borde de arriba, que es
           de donde se agarra una carta de un abanico. La misma distancia la usa la mano para elegir a
           donde ir, asi que al engancharse la carta no se mueve ni un milimetro. */
        /* Y SE ACUESTA RECIEN AL FINAL. Acostandola desde el principio del viaje, una carta plana
           vista desde una camara que mira de arriba queda debajo de la mano y no se ve: se pidio VER
           como la seleccionan, asi que la cara mira a la camara casi todo el trayecto y solo se
           acuesta en el ultimo tercio, cuando ya esta llegando a la pila. */
        const ac=Math.max(0, (llev-0.62)/0.38);
        const p={ x:R.garra.x, y:R.garra.y-RIV_CUELGA_Y, z:R.garra.z+RIV_CUELGA_Z,
                  rx:MESA.rivalTilt + (-Math.PI/2-MESA.rivalTilt)*ac, ry:0, rz:0 };
        irA(ma, p, 0.55);
        for(let k=0;k<lista.length;k++) if(k!==i) lista[k].visible=false;
        dsobra[i]=true;
        continue;
      }
      const ma=mallaDorso(dlista,i);
      ma.visible=true;
      const p=sitioRival(i, q, lado, G.t);
      if(_primera) poner(ma,p); else irA(ma,p,0.18);
    }
    /* la carta agarrada sale de la lista de dorsos y entra en la de caras: se apagan las dos sobras */
    for(let k=0;k<dlista.length;k++) if(k>=q || dsobra[k]) dlista[k].visible=false;
    if(!hayGarraAqui) sobra(lista,0);
  }
  /* el rival que no existe en el mano a mano se apaga entero */
  if(N_JUG===2){ sobra(dorsoDer,0); sobra(dorsoDerD,0); }

  /* el mazo: una pila de dorsos, y la de arriba es la que se pellizca */
  const puedeRobar = tuTurno && !G.robo && G.sel<0 && !G.colorPide;
  if(!mazoMalla){ mazoMalla=nuevaCartaDorso(); grupo.add(mazoMalla);
                  mazoMalla.rotation.x=-Math.PI/2; mazoMalla.rotation.z=Math.PI; }
  mazoMalla.visible=true;
  mazoMalla.position.set(MESA.mazoX, 0.30+flota(G.t, 7, 0.05), MESA.centroZ);
  mazoMalla.rotation.set(-Math.PI/2, 0, 0);
  mazoMalla.userData.tipo='mazo'; mazoMalla.userData.i=0; mazoMalla.userData.activo=puedeRobar;
  PICK.push(mazoMalla);

  /* la pila: las tres ultimas, apenas giradas, para que se lea a monton */
  const ult=G.pila.slice(-3);
  for(let k=0;k<3;k++){
    const ma=malla(pilaMallas,k);
    const c=ult[k];
    if(!c){ ma.visible=false; continue; }
    ma.visible=true; ponerCara(ma,c); ponerApagado(ma,false);
    ma.userData.tipo=null;
    const p={ x:MESA.pilaX, y:0.24+k*0.05+flota(G.t, 11, 0.05), z:MESA.centroZ,
              rx:-Math.PI/2, ry:0, rz:((k*53)%23-11)*Math.PI/180 };
    if(_primera) poner(ma,p); else irA(ma,p,0.3);
  }

  /* los botones */
  const hayBot = G.sel>=0 && !G.colorPide && G.fase==='juego';
  const c=G.sel>=0? m[G.sel] : null;
  const ok=c? pega(c,G.color,G.valor) : false;
  botones.tirar.visible=hayBot; botones.dejar.visible=hayBot;
  if(hayBot){
    PICK.push(botones.tirar, botones.dejar);
    ponerTexBoton(botones.tirar,'t',TX('tirar'), ok, true);
    ponerTexBoton(botones.dejar,'d',TX('dejar'), true, false);
    botones.tirar.userData.activo=ok;
    botones.tirar.position.set(-1.42, MESA.botY, MESA.botZ - CAM_MIRA[1]);
    botones.dejar.position.set( 1.42, MESA.botY, MESA.botZ - CAM_MIRA[1]);
    for(const b of [botones.tirar,botones.dejar]) b.rotation.set(-0.62,0,0);
  }
  const hayCol = G.colorPide && G.fase==='juego';
  for(let k=0;k<4;k++){
    const b=botones.color[k]; b.visible=hayCol;
    if(hayCol){ PICK.push(b);
                b.position.set((k%2? 1.20:-1.20), MESA.botY+0.75-Math.floor(k/2)*1.42, MESA.botZ - CAM_MIRA[1]);
                b.rotation.set(-0.62,0,0); }
  }
  _primera=false;
}

/* ===================== EL SONIDO =====================
   Procedural y sin un solo archivo: seis ruidos cortos que son todos la misma familia —un tono que
   sube o baja con un sobre rapido—. Grabarlos serian seis descargas para seis sonidos de diez lineas. */
const AUD={ ctx:null, m:null, on:false, an:null };
function audioIniciar(){
  if(AUD.ctx){ if(AUD.ctx.state==='suspended') AUD.ctx.resume(); audioDecodificar(); return; }
  try{
    AUD.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AUD.m=AUD.ctx.createGain(); AUD.m.gain.value=0.5;
    /* EL ANALIZADOR CUELGA DEL MAESTRO, y no es un adorno de depuracion: es lo unico que prueba que
       algo SONO. Sin el, "el audio anda" quiere decir "la llamada no tiro excepcion". */
    AUD.an=AUD.ctx.createAnalyser(); AUD.an.fftSize=2048;
    AUD.m.connect(AUD.an); AUD.m.connect(AUD.ctx.destination);
    AUD.on=true;
    audioDecodificar();
  }catch(e){ AUD.on=false; }
}
function tono(f, dur, vol, tipo, f2){
  if(!AUD.ctx||!AUD.on) return;
  const c=AUD.ctx, t=c.currentTime;
  const o=c.createOscillator(); o.type=tipo||'sine';
  o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(40,f2), t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AUD.m); o.start(t); o.stop(t+dur+0.02);
}
function roce(dur, vol, f0, f1){
  if(!AUD.ctx||!AUD.on) return;
  const c=AUD.ctx, t=c.currentTime, n=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
  bp.frequency.setValueAtTime(f0,t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1||f0), t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(AUD.m); s.start(t); s.stop(t+dur+0.02);
}
/* LOS TRES QUE SE AGACHAN LA MUSICA. Son los unicos momentos en que el juego tiene algo que decir
   mas fuerte que el fondo; agachar en cada carta tirada seria un fondo que late toda la partida. */
const SON_GRANDE={ gana:[0.30,2.4], pierde:[0.30,2.0], uno:[0.45,1.1] };
function son(k){
  if(!AUD.on) return;
  /* PRIMERO LA MUESTRA GRABADA, Y SI NO ESTA EL SINTETIZADO. El orden importa: si el clip no
     decodifico —navegador viejo, MP3 que no le gusta— el juego tiene que seguir sonando. */
  if(sonMuestra(k)){
    const g=SON_GRANDE[k]; if(g) musicaAgachar(g[0], g[1]);
    return;
  }
  try{
    if(k==='agarra') tono(760,0.07,0.10,'sine',900);
    else if(k==='deja') tono(520,0.08,0.08,'sine',400);
    else if(k==='tira'){ roce(0.16,0.35,900,300); tono(300,0.09,0.09,'triangle',210); }
    else if(k==='roba') roce(0.14,0.28,700,1500);
    else if(k==='mal') tono(180,0.20,0.11,'sawtooth',110);
    else if(k==='salta') tono(880,0.13,0.10,'square',520);
    else if(k==='gira'){ tono(520,0.10,0.08,'square',880); setTimeout(()=>tono(880,0.10,0.08,'square',520),95); }
    else if(k==='mas'){ tono(240,0.16,0.12,'sawtooth',150); roce(0.18,0.25,500,180); }
    else if(k==='uno'){ [740,988].forEach((f,i)=>setTimeout(()=>tono(f,0.14,0.11,'square'),i*90)); }
    else if(k==='gana'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tono(f,0.22,0.12,'square'),i*95)); }
    else if(k==='pierde'){ [392,330,262].forEach((f,i)=>setTimeout(()=>tono(f,0.26,0.11,'triangle'),i*130)); }
  }catch(e){}
}
/* =========================================================================================
   LAS MANOS EN 3D — EL CONSTRUCTOR

   Pedido de esta vuelta: *"mejora la mano a una mas humanoide y aplicale una optimizacion igual a la
   de baldi"*. La anterior tenia la forma correcta pero un solo grosor para todo, y una mano con
   veintiun bolitas del mismo tamano no se lee a mano: se lee a COLLAR DE CUENTAS. Lo que hace que se
   lea a mano son tres cosas, y ninguna es agregar poligonos.

   1. CADA ARTICULACION TIENE SU RADIO. La muneca es lo mas gordo, los nudillos siguen, y cada dedo
      AFINA hacia la punta. Eso solo ya cambia la lectura, y es una tabla de veintiun numeros.
   2. EL HUESO TOMA EL PROMEDIO DE SUS DOS PUNTAS, no el minimo. Con el minimo el cilindro queda mas
      fino que las dos esferas que une y cada juntura se marca — que es exactamente el collar.
   3. LA PALMA VA EN UNA BASE ORTONORMAL. La version anterior componia la matriz con el ancho y el
      largo de la palma tal cual, y esos dos vectores NO son perpendiculares en una mano de verdad:
      componer con ellos no rota el elipsoide, lo CIZALLA. Se ortonormaliza —normal por producto
      cruzado, y el ancho recalculado contra ella— y recien ahi es un elipsoide apoyado en la palma.

   Y LA OPTIMIZACION, QUE ES LA MISMA DE RECREO: las esferas bajan a 6x5 segmentos y los cilindros a
   6 lados. Un nudillo ocupa unos pocos pixeles en un telefono; la diferencia entre 8x6 y 6x5 no
   existe en pantalla y son miles de triangulos por cuadro. Todo sigue en TRES llamadas de dibujo
   —articulaciones, huesos y palmas— haya una mano o haya cinco.
   ========================================================================================= */
const MANO_HUESOS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                   [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
/* EL RADIO DE CADA ARTICULACION, EN FRACCION DEL LARGO DE LA PALMA (muneca -> nudillo del medio).
   Va relativo y no en unidades del mundo a proposito: asi la MISMA tabla sirve para tu mano —que
   cambia de tamano segun cuanto la acerques a la camara— y para las de los rivales, que son fijas.
   Los numeros salen de una mano adulta: la palma mide 9,5 cm y la muneca 1,75 cm de radio. */
const MANO_RADIO=(()=>{
  const r=new Float32Array(21), P=0.095;
  r[0]=0.0175/P;                                                   // muneca
  const pul=[0.0150,0.0125,0.0110,0.0098];                         // pulgar
  for(let k=0;k<4;k++) r[1+k]=pul[k]/P;
  const base=[0.0135,0.0135,0.0128,0.0118];                        // indice, medio, anular, menique
  for(let d=0;d<4;d++){ const i0=5+d*4;
    r[i0]=base[d]/P; r[i0+1]=base[d]*0.86/P; r[i0+2]=base[d]*0.74/P; r[i0+3]=base[d]*0.66/P; }
  return r;
})();
const MANOS_MAX=6;                       // la tuya, dos por rival, y la de VERDAD del rival humano
/* CUATRO HUESOS DE MAS, Y SON LOS ANTEBRAZOS DE LOS RIVALES. Entran por la misma malla instanciada
   que los huesos de los dedos —mismo cilindro, mismo material— asi que agregar un antebrazo a cada
   mano no cuesta NI UNA llamada de dibujo mas. Sin ellos las manos de los rivales flotan sueltas
   sobre la mesa y se leen a guantes, no a las manos de alguien. */
const M_ART=21*MANOS_MAX, M_HUE=MANO_HUESOS.length*MANOS_MAX+4, M_PAL=MANOS_MAX;
const matPiel=new THREE.MeshLambertMaterial({color:0xffffff});
const artMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,6,5), matPiel, M_ART);
const hueMalla=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,6,1,true), matPiel, M_HUE);
const palMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6), matPiel, M_PAL);
for(const m of [artMalla, hueMalla, palMalla]){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled=false; m.castShadow=true; m.receiveShadow=false;
  m.count=0; escena.add(m);
}
const _hm=new THREE.Matrix4(), _hq=new THREE.Quaternion(), _hv=new THREE.Vector3(),
      _hd=new THREE.Vector3(), _hs=new THREE.Vector3(), _hup=new THREE.Vector3(0,1,0),
      _hx=new THREE.Vector3(), _hy=new THREE.Vector3(), _hn=new THREE.Vector3(),
      _hmat=new THREE.Matrix4();
let _nArt=0, _nHue=0, _nPal=0;
function manosLimpiar(){ _nArt=0; _nHue=0; _nPal=0; }
function ponerArt(p, r){
  if(_nArt>=M_ART) return;
  _hm.makeScale(r,r,r); _hm.setPosition(p.x,p.y,p.z);
  artMalla.setMatrixAt(_nArt++, _hm);
}
function ponerHueso(a, b, r){
  if(_nHue>=M_HUE) return;
  _hd.subVectors(b,a);
  const L=_hd.length(); if(L<1e-5) return;
  _hq.setFromUnitVectors(_hup, _hd.normalize());
  _hs.set(r, L, r);
  _hv.addVectors(a,b).multiplyScalar(0.5);
  _hm.compose(_hv, _hq, _hs);
  hueMalla.setMatrixAt(_nHue++, _hm);
}
/* LA PALMA, Y NO ES UN ADORNO. Con huesos y articulaciones sueltos la mano se lee a ESQUELETO —se
   vio en la primera captura: cinco varillas con pelotitas en las junturas—. Lo que la vuelve una mano
   es el volumen que las une: un elipsoide apoyado en el plano de la palma. */
function ponerPalma(P, esc){
  if(_nPal>=M_PAL) return;
  const p0=P[0], p5=P[5], p17=P[17];
  _hv.copy(p5).add(p17).multiplyScalar(0.5);
  _hy.subVectors(_hv, p0);
  const largo=_hy.length(); if(largo<1e-5) return;
  _hy.multiplyScalar(1/largo);
  /* LA BASE SE ORTONORMALIZA. El ancho de la palma y su largo no son perpendiculares; componer la
     matriz con los dos tal cual no rota el elipsoide, lo cizalla — y una palma cizallada se ve como
     un error de render, no como una mano. La normal sale del producto cruzado y el ancho se recalcula
     contra ella, asi los tres ejes son perpendiculares por construccion. */
  _hn.crossVectors(_hd.subVectors(p5,p0), _hx.subVectors(p17,p0)).normalize();
  _hx.crossVectors(_hy, _hn).normalize();
  const ancho=p5.distanceTo(p17);
  _hmat.makeBasis(_hx, _hy, _hn);
  _hq.setFromRotationMatrix(_hmat);
  _hv.copy(p0).addScaledVector(_hy, largo*0.52);
  _hm.compose(_hv, _hq, _hs.set(ancho*0.60, largo*0.62, MANO_RADIO[0]*esc*1.05));
  palMalla.setMatrixAt(_nPal++, _hm);
}
/* EL DIBUJANTE, UNO SOLO PARA TODAS LAS MANOS DEL JUEGO. Que la tuya y las de los rivales pasen por
   aca no es ahorro de lineas: es lo que garantiza que se vean de la misma familia. Si fueran dos
   dibujantes, mejorar una dejaria la otra atras — que es justo lo que se reporto esta vuelta. */
function dibujarMano(P, esc){
  for(let i=0;i<21;i++) ponerArt(P[i], MANO_RADIO[i]*esc);
  for(const [a,b] of MANO_HUESOS)
    ponerHueso(P[a], P[b], (MANO_RADIO[a]+MANO_RADIO[b])*0.5*1.02*esc);
  ponerPalma(P, esc);
}
function manosSubir(){
  artMalla.count=_nArt; hueMalla.count=_nHue; palMalla.count=_nPal;
  artMalla.instanceMatrix.needsUpdate=true;
  hueMalla.instanceMatrix.needsUpdate=true;
  palMalla.instanceMatrix.needsUpdate=true;
}

/* =========================================================================================
   LA TUYA: RECONSTRUIDA SOBRE SU PROPIO RAYO DE PANTALLA

   MediaPipe da tambien `worldLandmarks` en metros y parece lo obvio: anclar la mano en la muneca y
   escalar. Pero el juego APUNTA con el punto de pantalla —el rayo sale de ahi— y una mano colocada
   por su geometria metrica NO cae donde estan esos puntos: verias la pinza en un lugar y agarrarias
   una carta en otro. Aca cada punto se pone SOBRE SU RAYO, a una profundidad que sale de su z
   relativa, y el dibujo y el apuntado son la misma cosa *por construccion*.
   ========================================================================================= */
const MANO_Z=-3.6, MANO_PROF=1.5;
const _pmundo=[]; for(let k=0;k<21;k++) _pmundo.push(new THREE.Vector3());
let _escMano=0;
function manoTuya(){
  if(!MANO.on || !MANO.hay || !MANO.hayPts) return false;
  /* LA MATRIZ DE LA CAMARA SE PONE AL DIA ACA. three.js la recalcula al DIBUJAR, asi que colocar la
     mano antes de dibujar la deja en la posicion del cuadro anterior — y desde que la camara orbita
     con la cabeza, eso es un desfase visible. Es la misma leccion que costo una prueba en pickEn:
     nunca dar por sentado que alguien actualizo el arbol. */
  camara.updateMatrixWorld(true);
  const z0=MANO.pts[2];
  const tanV=Math.tan(camara.fov*Math.PI/360);
  for(let k=0;k<21;k++){
    const fx=MANO.pts[k*3], fy=MANO.pts[k*3+1], fz=MANO.pts[k*3+2]-z0;
    const prof=MANO_Z - fz*MANO_PROF;
    /* CADA PUNTO SOBRE SU RAYO: se toma la fraccion de pantalla y se la lleva al plano de SU
       profundidad, no a un plano comun. Con un plano comun la mano quedaria plana como una calcomania
       y ademas la punta del dedo no caeria donde apunta el rayo. */
    const hz=2*tanV*Math.abs(prof), wz=hz*camara.aspect;
    _pmundo[k].set((fx-0.5)*wz, -(fy-0.5)*hz, prof).applyMatrix4(camara.matrixWorld);
  }
  /* LA ESCALA SALE DE LA PROPIA MANO Y SE SUAVIZA EN EL TIEMPO. Sale de la palma reconstruida, y esa
     reconstruccion usa la z — la coordenada mas ruidosa que da MediaPipe — asi que hereda todo su
     ruido. Sin suavizar, la mano quieta LATIA de grosor varias veces por segundo, y eso a ojo se lee
     como "tiembla" aunque la posicion en pantalla este perfectamente quieta. Con 0,14 por cuadro la
     mano puede acercarse a la camara todo lo rapido que quiera, pero su tamano no cambia en dos. */
  const cruda=Math.max(0.05, _pmundo[0].distanceTo(_pmundo[9]));
  _escMano = _escMano>0? _escMano + (cruda-_escMano)*0.14 : cruda;
  dibujarMano(_pmundo, _escMano);
  return true;
}

function manosPintar(dt){
  manosLimpiar();
  manoTuya();
  rivalesPintar(dt);
  manosSubir();
}
/* =========================================================================================
   LOS DOS RIVALES: CABEZA, MANOS ENFRENTADAS, Y AGARRAR LA CARTA A LA VISTA

   Pedido: *"que los bots esten enfrentados sus manos tambien, agregales una cabeza que se mueven
   animado, las cartas flotando tambien y ver como con sus manos seleccionan las cartas"*.

   Antes un rival era un abanico de dorsos apoyado en la mesa y dos manos de pose fija al costado.
   Jugaba TELETRANSPORTANDO la carta a la pila: en un cuadro estaba en su mano y en el siguiente
   arriba del monton. Se veia que algo habia pasado, no QUIEN lo habia hecho.

   TRES COSAS, Y LAS TRES SON LA MISMA:

   1. LA MANO SE CONSTRUYE EN SU PROPIO MARCO Y DESPUES SE COLOCA. La version anterior calculaba cada
      punto directo en coordenadas de mundo con senos y cosenos metidos en el bucle, asi que girar la
      mano un poco era reescribir la formula. Aca hay una POSE local —muneca en el origen, dedos hacia
      +Z, palma hacia abajo— con un parametro de cierre, y una matriz que la lleva a donde va. Girar,
      inclinar o cerrar la mano son tres numeros, no tres formulas.
   2. LA MANO SE MUEVE AL SITIO DE LA CARTA QUE EL BOT ELIGIO, Y LA CARTA VA COLGADA DE ELLA. No es
      una animacion pegada al lado: el sitio de la carta agarrada ES el punto de la pinza de esa mano,
      calculado de los mismos veintiun puntos que se dibujan. Si la mano se mueve, la carta se mueve;
      no pueden separarse.
   3. LA CABEZA MIRA LO QUE EL RIVAL ESTA HACIENDO. Piensa -> mira su abanico. Agarra y lleva -> mira
      la pila. Si no es su turno -> mira la mesa, y cada tanto te mira a vos. Una cabeza que se mueve
      al azar se lee a adorno; una que mira lo que pasa se lee a alguien jugando.

   Y TODO SIGUE INSTANCIADO. Las manos de los rivales entran por las MISMAS tres mallas que la tuya
   (dibujarMano), y la cabeza son cuatro instanciadas mas —craneo, cuello, torso y ojos— o sea cuatro
   llamadas de dibujo para los dos rivales enteros, no cuatro por rival.
   ========================================================================================= */

/* ---------- la pose de una mano, en su propio marco ----------
   Marco local: muneca en el origen, dedos hacia +Z, palma hacia -Y (o sea el dorso mirando arriba,
   que es como se ve una mano apoyada desde el otro lado de la mesa). Las medidas son fracciones del
   largo de la palma, igual que los radios: asi la pose no depende de cuan grande sea la mano. */
const RIV_DEDOS=[
  /* el pulgar sale del costado y hacia adelante; los otros cuatro salen de la linea de nudillos */
  { base:[ 0.30,-0.03, 0.12], dir:[ 0.62,-0.10, 0.78], lar:[0.26,0.20,0.17], pulgar:true },
  { base:[ 0.23, 0.00, 0.56], dir:[ 0.05, 0.00, 1.00], lar:[0.30,0.20,0.15] },
  { base:[ 0.07, 0.00, 0.61], dir:[ 0.01, 0.00, 1.00], lar:[0.33,0.22,0.16] },
  { base:[-0.09, 0.00, 0.59], dir:[-0.04, 0.00, 1.00], lar:[0.30,0.20,0.15] },
  { base:[-0.24, 0.00, 0.53], dir:[-0.12, 0.00, 1.00], lar:[0.24,0.17,0.13] },
];
/* cuanto se dobla cada falange al cerrar. Los tres angulos van creciendo y despues aflojan: es como
   se cierra un dedo de verdad — el nudillo poco, la falange del medio mucho, la punta un poco menos.
   Con los tres iguales el dedo se enrosca como una manguera. */
const RIV_CURVA=[0.50, 1.00, 0.85];
const _rp=[]; for(let k=0;k<21;k++) _rp.push(new THREE.Vector3());
const _pr2=[]; for(let k=0;k<21;k++) _pr2.push(new THREE.Vector3());
const _rd=new THREE.Vector3(), _rmat=new THREE.Matrix4(), _reu=new THREE.Euler(),
      _rsc=new THREE.Vector3();
function _rotX(v,a){ const c=Math.cos(a), s=Math.sin(a);
                     const y=v.y*c-v.z*s, z=v.y*s+v.z*c; v.y=y; v.z=z; }
function _rotY(v,a){ const c=Math.cos(a), s=Math.sin(a);
                     const x=v.x*c+v.z*s, z=-v.x*s+v.z*c; v.x=x; v.z=z; }
/* arma los 21 puntos en el marco local y los lleva al mundo con una sola matriz */
function poseMano(cierre, mano, tam, pos, yaw, pitch, roll){
  const esp=mano<0? -1 : 1;                 // la izquierda es la derecha espejada en x
  _rp[0].set(0,0,0);
  for(let d=0; d<5; d++){
    const D=RIV_DEDOS[d], i0=1+d*4;
    _rp[i0].set(D.base[0]*esp, D.base[1], D.base[2]);
    _rd.set(D.dir[0]*esp, D.dir[1], D.dir[2]).normalize();
    for(let k=0;k<3;k++){
      /* EL PULGAR NO SE CIERRA COMO LOS DEMAS: se OPONE, o sea que cruza la palma. Doblarlo con el
         mismo giro que un dedo lo mete dentro de la mano y desaparece — y sin pulgar visible una
         mano que agarra no se lee a mano que agarra. */
      if(D.pulgar){ _rotY(_rd, -esp*cierre*0.42); _rotX(_rd, cierre*0.30); }
      else _rotX(_rd, cierre*RIV_CURVA[k]);
      _rp[i0+k+1].copy(_rp[i0+k]).addScaledVector(_rd, D.lar[k]);
    }
  }
  _reu.set(pitch||0, yaw||0, roll||0, 'YXZ');
  _rmat.makeRotationFromEuler(_reu);
  _rmat.scale(_rsc.set(tam,tam,tam));
  _rmat.setPosition(pos.x, pos.y, pos.z);
  for(let k=0;k<21;k++) _rp[k].applyMatrix4(_rmat);
  return _rp;
}

/* =========================================================================================
   LAS CABEZAS VUELVEN, Y LOS BOTS SON MONITORES

   Pedido: *"puedes agregar otra vez las cabezas, al menos para el jugador; los bots son computadoras
   asi que les pondras monitores como cabeza"*. Asi que hay dos clases de rival y se ven distintas de
   una ojeada, que es lo que hace que la mesa se lea sola: si enfrente hay un monitor sabes que es la
   maquina, y si hay una cabeza sabes que del otro lado hay alguien.

   SEIS MALLAS INSTANCIADAS PARA LOS DOS RIVALES, no seis por rival. Y los ojos van en UNA sola malla
   con color por instancia: en la cabeza humana son dos puntos oscuros y en el monitor son dos pixeles
   encendidos sobre la pantalla apagada. Dos materiales habrian sido dos llamadas de dibujo para pintar
   cuatro puntitos.
   ========================================================================================= */
const matOjo=new THREE.MeshBasicMaterial({color:0xffffff});
const matPanel=new THREE.MeshLambertMaterial({color:0x24262b});
const cabMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,9), matPiel, 2);
const monMalla=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), matPiel, 2);
const panMalla=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), matPanel, 2);
const cueMalla=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,8,1), matPiel, 2);
const torMalla=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,0.70,1,12,1), matPiel, 2);
const ojoMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,7,5), matOjo, 4);
for(const m of [cabMalla, monMalla, panMalla, cueMalla, torMalla, ojoMalla]){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled=false; m.castShadow=true; m.receiveShadow=false;
  m.count=0; escena.add(m);
}
ojoMalla.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(4*3), 3);
ojoMalla.instanceColor.setUsage(THREE.DynamicDrawUsage);
const COL_OJO=new THREE.Color(0x22252b), COL_PIXEL=new THREE.Color(0x8fe3b0);
const RIV_CAB_R=1.15;                     // radio del craneo humano
/* cuanto cuelga la carta por debajo y por detras de la pinza que la sostiene: media carta por el
   coseno de su inclinacion, o sea su borde de arriba */
const RIV_CUELGA_Y=CARTA_H*0.5*Math.cos(MESA.rivalTilt)-0.08, RIV_CUELGA_Z=0.40;
const RIV={};                             // estado visible de cada rival, por jugador
function rivalNuevo(lado, fase){
  return { lado, desf:fase, alc:0, cierre:0,
           garra:new THREE.Vector3(), hayGarra:false };
}
const _rv=new THREE.Vector3(), _rv2=new THREE.Vector3(), _rq=new THREE.Quaternion(),
      _rq2=new THREE.Quaternion(),
      _rs=new THREE.Vector3(), _rm=new THREE.Matrix4();

/* donde se sienta cada rival: el abanico flota adelante y la persona esta detras */
function rivalSitio(lado){
  return { x: lado*MESA.rivalX, z: MESA.rivalZ };
}
/* ---------- el bucle de los rivales ---------- */
let _rivT=0;
function rivalesPintar(dt){
  cabMalla.count=0; monMalla.count=0; panMalla.count=0;
  cueMalla.count=0; torMalla.count=0; ojoMalla.count=0;
  /* EN EL TUTORIAL NO HAY RIVALES, igual que sus cartas: el cartel del tutorial ocupa esa franja de
     la pantalla y ninguno de los seis pasos habla de ellos. */
  if(TUT.on || G.fase!=='juego') return;
  _rivT+=dt;
  let iCab=0, iOjo=0, iCabH=0, iCabM=0;
  for(const [,, j, lado] of RIVALES()){
    if(!RIV[j]) RIV[j]=rivalNuevo(lado, j*1.7);
    const R=RIV[j];
    const q=G.manos[j].length;
    R.hayGarra=false;
    if(!q) continue;
    /* `desf` es el desfase de las animaciones de ESTE rival. Sin el, las dos parejas de manos se
       balancean exactamente al mismo tiempo, y dos personas sincronizadas se leen a una animacion
       repetida —que es justo lo que son— en vez de a dos personas. */
    const S=rivalSitio(lado), f=R.desf, t=_rivT;

    /* ===== que esta haciendo, y por lo tanto a donde mira y cuanto estira la mano ===== */
    const B=G.bot;
    const suyo = (B && B.j===j);
    const agarrando = suyo && (B.fase==='agarra' || B.fase==='lleva');
    const objAlc = agarrando? 1 : 0;
    R.alc += (objAlc-R.alc)*Math.min(1, dt*6.5);
    /* el cierre de la mano va DETRAS del alcance: primero llega, despues agarra. Al reves la mano
       llegaria con el puno ya cerrado, que es como agarra un robot y no una persona. */
    const objCie = (suyo && B.fase==='lleva')? 1 : 0;
    R.cierre += (objCie-R.cierre)*Math.min(1, dt*9.0);

    /* ===== las dos manos ===== */
    /* EL TAMANO SALE DE LA CARTA. Una mano al lado de un abanico tiene que medir mas o menos lo que
       mide una carta y media, o se lee a juguete — con 1,05 en una captura anterior eran cuatro
       astillas blancas al costado del abanico. */
    const tam=CARTA_W*1.15;
    const fanY=MESA.rivalFanY;
    /* LAS DOS MANOS SOSTIENEN EL ABANICO POR ABAJO, no lo flanquean. Flanqueandolo —a 0,62 del ancho
       del abanico a cada lado— la mano de afuera del rival de la derecha caia en x 1,02 de pantalla:
       fuera del cuadro. Y ademas es como NO se sostiene un abanico: se lo agarra por la parte de
       abajo, con las dos manos juntas, que es lo que ademas las deja bien adentro del encuadre. */
    /* SE DECLARA ACA Y NO DONDE SE USA: la lectura de abajo elige si se dibujan las manos posadas, y
       un `const` leido antes de su linea tira ReferenceError y se lleva puesto el modulo entero. Es
       la sexta vez en este proyecto. */
    const _real = MP.jugando && MP.manoRival && (performance.now()-MP.manoRivalT)<600;
    /* CON LA MANO DE VERDAD EN PANTALLA, LAS DOS POSADAS NO SE DIBUJAN. Dibujando las tres, el rival
       tiene TRES manos: dos sosteniendo el abanico y una moviendose. Y no es que sobre una — es que
       las posadas existen justamente para ocupar el lugar de las de verdad mientras no las hay. */
    for(const s of (_real? [] : [-1,1])){
      /* la mano de adentro —la que da al centro de la mesa— es la que agarra */
      /* la mano que agarra es la que da al centro de la mesa; con el rival centrado no hay centro al
         que dar, asi que agarra la derecha, que es la que queda del lado de la pila */
      const agarra = lado? (s===-lado) : (s===1);
      /* Y VAN ADELANTE DEL ABANICO, NO DEBAJO. Debajo —a 1,15 por abajo del centro del abanico y
         casi en su mismo plano— lo unico que asomaba eran las puntas de los dedos por debajo de las
         cartas: se pedia VER las manos y se veian diez unas. Adelante, apoyadas sobre la mesa, se ven
         enteras contra el blanco y ademas quedan en el camino hacia la pila, que es a donde tienen
         que ir a llevar la carta. */
      const rep={ x:S.x + s*1.30, y:0.85+Math.sin(t*1.1+f+s)*0.045,
                  z:S.z + 2.35 };
      let px=rep.x, py=rep.y, pz=rep.z, yaw=-s*0.34, pitch=0.34;
      if(agarra && R.alc>0.002){
        const d=rivalDestino(j, B);
        const a=R.alc;
        px+= (d.x-px)*a; py+= (d.y-py)*a; pz+= (d.z-pz)*a;
        yaw += (0-yaw)*a; pitch += (0.55-pitch)*a;
      }
      _rv.set(px,py,pz);
      const P=poseMano(agarra? Math.max(0.42, R.cierre*0.92) : 0.42, s===-1? -1 : 1,
                       tam, _rv, yaw, pitch, -s*0.18);
      /* LA PINZA DE LA MANO QUE AGARRA ES DONDE VA LA CARTA, y sale de los mismos puntos que se
         dibujan: el medio entre la punta del pulgar y la del indice. Si la carta usara un numero
         aparte, la mano y la carta podrian estar en dos lugares distintos — que es exactamente el
         defecto que se reporto de RECREO con el rompecabezas. */
      /* LA CARTA NO SE ENGANCHA HASTA QUE LA MANO LLEGO. Enganchandola apenas la mano arranca —con
         el umbral en 0,02— la carta salia volando del abanico HACIA la mano, o sea al reves de lo que
         pasa: primero la mano va a la carta y despues las dos vuelven juntas. Con el umbral en 0,55
         la carta se queda quieta en el abanico mientras el brazo viaja. */
      if(agarra){ R.garra.copy(P[4]).add(P[8]).multiplyScalar(0.5); R.hayGarra=R.alc>0.55; }
      const escM=P[0].distanceTo(P[9]);
      dibujarMano(P, escM);
      /* EL ANTEBRAZO, Y TERMINA JUSTO ANTES DEL ABANICO. Llevandolo hasta el hombro —que esta dos
         unidades detras de las cartas— el cilindro ATRAVIESA el abanico por el medio: medido, a la
         altura de las cartas pasaria por y 1,93 con el abanico ocupando de 0,45 a 2,65. Cortandolo
         en el borde de abajo del abanico, el brazo se mete detras de las cartas y el resto se lee
         solo, que es lo que pasa cuando alguien tiene las manos apoyadas delante de sus cartas. */
      _rv2.set(S.x + s*1.55, 0.62, S.z + 0.75);
      ponerHueso(P[0], _rv2, escM*0.34);
    }

    /* ===== Y SI DEL OTRO LADO HAY UNA PERSONA, SU MANO DE VERDAD =====
       No es una pose ni una animacion: son los veintiun puntos que MediaPipe midio en SU telefono,
       puestos en un plano sobre su lado de la mesa. Va ESPEJADA en x porque estan enfrentados: su
       derecha es tu izquierda, y sin el espejo la mano se moveria al reves de como el la mueve. */
    /* DONDE VA LA MUNECA Y CUANTO MIDE LA MANO SON DOS NUMEROS DISTINTOS, y mezclarlos fue el primer
       intento: un solo factor mapeaba el cuadro entero de SU camara a unidades de mesa, y de ahi
       salia tambien el tamano de la mano. Medido, la mano ocupaba el 7,3% del ancho de la pantalla
       contra el 29,2% del abanico —o sea la cuarta parte de sus propias cartas— y encima caia
       justo sobre el abanico: invisible. El recorrido de la muneca tiene que ser CHICO (mover la mano
       de punta a punta de su camara no puede barrer media mesa) y la mano tiene que ser GRANDE.
       Con dos factores separados, cada cosa se ajusta por su cuenta. */
    if(_real){
      const R2=MP.manoRival;
      const ANCHO=4.6, ALTO=3.3, PROF=2.2, FORMA=13.6, BASE=1.05;
      const nx0=R2[0], ny0=R2[1], z0=R2[2];
      /* 0,58 y no 0,5: una mano que entra en cuadro se apoya en la mitad de abajo, asi que con el
         centro en 0,5 la mano en reposo queda flotando por encima de la mesa. */
      const cx=S.x + (0.5-nx0)*ANCHO, cy=BASE + (0.58-ny0)*ALTO, cz=S.z + 2.30;
      for(let k=0;k<21;k++){
        _pr2[k].set(cx + (nx0-R2[k*3])*FORMA,
                    cy + (ny0-R2[k*3+1])*FORMA,
                    cz - (R2[k*3+2]-z0)*PROF);
      }
      dibujarMano(_pr2, _pr2[0].distanceTo(_pr2[9]));
      /* Y LA CARTA LA LLEVA SU MANO DE VERDAD, no la de mentira. Es la misma regla que la tuya: el
         medio entre la punta del pulgar y la del indice. Si la carta siguiera a la mano posada, el
         rival estaria pellizcando en un sitio y la carta saldria de otro. */
      R.garra.copy(_pr2[4]).add(_pr2[8]).multiplyScalar(0.5);
      R.hayGarra = R.alc>0.55;
    }

    /* ===== LA CABEZA: MONITOR SI ES UN BOT, CRANEO SI DEL OTRO LADO HAY ALGUIEN ===== */
    /* el borde de arriba del abanico esta a media carta por el coseno de su inclinacion; la cabeza va
       a esa altura mas su propio radio y un respiro, o queda medio craneo detras de las cartas */
    const cabY=fanY+CARTA_H*0.5*Math.cos(MESA.rivalTilt)+RIV_CAB_R*1.06+0.30, cabZ=S.z-1.95;
    const resp=Math.sin(t*1.35+f)*0.055;
    const humano=MP.jugando;
    /* a donde mira: su abanico si esta pensando, la pila si esta jugando, y si no la mesa, con un
       vistazo hacia vos cada tanto. Una cabeza que se mueve al azar se lee a adorno; una que mira lo
       que esta pasando se lee a alguien jugando — y un monitor que se orienta se lee a que te sigue. */
    R.mirarte=(R.mirarte||0)+dt;
    let mira;
    if(suyo && B.fase==='piensa') mira=_rv2.set(S.x, fanY, S.z+0.4);
    else if(agarrando) mira=_rv2.set(MESA.pilaX, 0.5, MESA.centroZ);
    else if((R.mirarte%9.5)<2.1) mira=_rv2.set(0, 1.4, MESA.manoZ);
    else mira=_rv2.set(0, 0.3, MESA.centroZ);
    _rv.set(mira.x-S.x, mira.y-cabY, mira.z-cabZ);
    const gyO=Math.atan2(_rv.x, _rv.z), gxO=-Math.atan2(_rv.y, Math.hypot(_rv.x,_rv.z));
    const kk=Math.min(1, dt*3.4);
    R.gy=(R.gy||0)+(gyO-(R.gy||0))*kk; R.gx=(R.gx||0)+(gxO-(R.gx||0))*kk;
    /* EL BALANCEO SE SUMA AL RESULTADO Y NO AL OBJETIVO: sumado al objetivo pasaria por el suavizado
       y quedaria casi borrado. Y el monitor se balancea LA MITAD: un aparato apoyado no respira. */
    const bal=humano? 1 : 0.4;
    const gy=R.gy+(Math.sin(t*0.53+f)*0.085+Math.sin(t*0.31+f*2)*0.05)*bal;
    const gx=R.gx+Math.sin(t*0.44+f)*0.045*bal;
    _reu.set(gx, gy, Math.sin(t*0.37+f)*0.05*bal, 'YXZ');
    _rq.setFromEuler(_reu);
    const yCab=cabY+resp*bal;

    if(humano){
      _rv.set(S.x, yCab, cabZ);
      _rm.compose(_rv, _rq, _rs.set(RIV_CAB_R*0.97, RIV_CAB_R*1.06, RIV_CAB_R*0.94));
      cabMalla.setMatrixAt(iCab, _rm);
    } else {
      /* EL MONITOR ES CAJA Y PANTALLA, DOS PIEZAS. Con una sola caja oscura se lee a ladrillo; lo que
         lo vuelve un monitor es el marco claro alrededor de un panel apagado, que es exactamente lo
         que uno ve de un monitor de frente. El panel va un pelo adelante para que no pelee en z. */
      _rv.set(S.x, yCab, cabZ);
      _rm.compose(_rv, _rq, _rs.set(2.05, 1.52, 0.34));
      monMalla.setMatrixAt(iCab, _rm);
      _rv.set(0, 0.03, 0.55).applyMatrix4(_rm);
      _rm.compose(_rv, _rq, _rs.set(1.74, 1.16, 0.10));
      panMalla.setMatrixAt(iCab, _rm);
    }
    /* el cuello (o el pie del monitor) y el torso NO giran con la cabeza: si giraran, mirar de reojo
       giraria el cuerpo entero y se leeria a torreta */
    _rv.set(S.x, yCab-(humano? RIV_CAB_R*0.92 : 0.95)+resp*0.5, cabZ);
    _rm.compose(_rv, _rq.identity(), _rs.set(humano?0.30:0.22, humano?0.52:0.46, humano?0.30:0.22));
    cueMalla.setMatrixAt(iCab, _rm);
    /* LOS HOMBROS TIENEN QUE SER MAS ANCHOS QUE EL ABANICO O NO SE VEN: el torso vive dos unidades
       detras de las cartas, y el abanico mide 2,12 de medio ancho. Con 2,45 asoman ocho decimas por
       cada lado; con 2,9 los dos rivales se tocarian en el medio de la mesa. */
    _rv.set(S.x, cabY-RIV_CAB_R*1.62-0.70+resp*0.3, cabZ+0.10);
    _rm.compose(_rv, _rq.identity(), _rs.set(2.45, 1.45, 0.95));
    torMalla.setMatrixAt(iCab, _rm);

    /* LOS OJOS SALEN DE LA MATRIZ DE LA CABEZA. Componiendolos aparte con su propio giro habria dos
       animaciones que mantener sincronizadas; multiplicando por la de la cabeza estan en la cara por
       construccion. Y parpadea: es un seno y un umbral, y es lo unico que separa "una cabeza que
       rota" de "alguien mirandote" — en el monitor el mismo gesto se lee a la pantalla refrescando. */
    (humano? cabMalla : monMalla).getMatrixAt(iCab, _rm);
    const parp=Math.max(0, 1-Math.abs(Math.sin(t*0.41+f*3))*22);
    for(const ex of (humano? [-0.38, 0.38] : [-0.30, 0.30])){
      _rv.set(ex, humano? 0.16 : 0.10, humano? 0.90 : 0.62).applyMatrix4(_rm);
      _rm.decompose(_rv2, _rq2, _rs);
      const eh=(humano? 0.145 : 0.10)*(1-parp*0.92);
      _rm.compose(_rv, _rq2, _rs.set(humano?0.155:0.16, eh, humano?0.10:0.05));
      ojoMalla.setMatrixAt(iOjo, _rm);
      ojoMalla.setColorAt(iOjo, humano? COL_OJO : COL_PIXEL);
      iOjo++;
      (humano? cabMalla : monMalla).getMatrixAt(iCab, _rm);
    }
    if(humano) iCabH++; else iCabM++;
    iCab++;
  }
  cabMalla.count=iCabH? iCab : 0; monMalla.count=iCabM? iCab : 0;
  panMalla.count=monMalla.count; cueMalla.count=iCab; torMalla.count=iCab; ojoMalla.count=iOjo;
  for(const m of [cabMalla, monMalla, panMalla, cueMalla, torMalla, ojoMalla]) m.instanceMatrix.needsUpdate=true;
  if(ojoMalla.instanceColor) ojoMalla.instanceColor.needsUpdate=true;
}
/* a donde va la mano que agarra: primero a la carta elegida dentro de su abanico, despues a la pila */
const _rdest={x:0,y:0,z:0};
function rivalDestino(j, B){
  const lado=RIV[j].lado, q=G.manos[j].length;
  const p=sitioRival(Math.max(0,Math.min(q-1, B.idx||0)), q, lado, 0);
  /* LA PINZA VA AL BORDE DE ARRIBA DE LA CARTA, NO A SU CENTRO — que es de donde se agarra una carta
     de un abanico. Y ademas es lo que hace que la cuenta cierre: la carta se dibuja colgando esa
     misma distancia por debajo de la pinza, asi que con la mano en su sitio la carta queda
     exactamente donde ya estaba y no da un salto al engancharse. */
  _rdest.x=p.x; _rdest.y=p.y+RIV_CUELGA_Y; _rdest.z=p.z-RIV_CUELGA_Z;
  if(B.fase==='lleva'){
    /* SE INTERPOLA POR EL PROGRESO DE LA FASE Y NO POR UN LERP SUELTO. Con un lerp la mano llegaria
       tarde o temprano segun los cuadros que hubo, y la carta se baja en un instante FIJO: la mano
       tiene que estar ahi justo en ese instante, no cerca. */
    const u=Math.min(1, B.t/BOT_LLEVA);
    const s=u*u*(3-2*u);                                   // suave a la entrada y a la salida
    _rdest.x += (MESA.pilaX-_rdest.x)*s;
    _rdest.y += (1.15-_rdest.y)*s + Math.sin(s*Math.PI)*0.55;   // levanta al pasar por el medio
    _rdest.z += (MESA.centroZ-_rdest.z)*s;
  }
  return _rdest;
}
/* =========================================================================================
   MULTIJUGADOR 1 CONTRA 1, SIN SERVIDOR

   Pedido: *"agrega un modo multijugador que al tocar jugar podés elegir entre multijugador y con
   bots, 1vs1 nomás"*, con un relevo MQTT publico y sin backend.

   TRANSPORTE: `mqtt.min.js` desde unpkg y `wss://broker.emqx.io:8084/mqtt`. Todos los temas llevan el
   prefijo `rezuno_v1_` para que dos juegos distintos no se pisen en un broker que es de todo el
   mundo. Tres temas por sala: `/state` (presencia), `/action` (las jugadas) y `/chat`.

   ===== POR QUE ESTE JUEGO NO NECESITA UN SERVIDOR NI UN ANFITRION, Y ESO NO ES SUERTE =====
   Un juego de accion con dos jugadores moviendose a la vez necesita a alguien que decida quien tiene
   razon. Un juego de cartas POR TURNOS no: en cada instante hay exactamente UN jugador que puede
   hacer algo, asi que no hay dos verdades que reconciliar. Los dos clientes corren la MISMA partida y
   se mandan solo las jugadas.

   Y el mazo tampoco necesita servidor, porque el mazo es una SEMILLA. `repartir(semilla)` es
   determinista: con el mismo numero, los dos clientes barajan identico y reparten identico. Lo unico
   que viaja al empezar son dos datos —la semilla y quien arranca— y no ciento ocho cartas.

   ===== QUIEN REPARTE SE DECIDE COMPARANDO LOS DOS ID, SIN NEGOCIAR =====
   Hace falta que UNO tire la semilla, o los dos tirarian una distinta. Elegirlo con mensajes seria un
   protocolo con sus carreras y sus empates; comparando los dos identificadores al azar —gana el menor
   como texto— los dos clientes llegan a la MISMA conclusion por su cuenta y sin mandar nada. La regla
   es total y simetrica, asi que no hay empate posible ni orden de llegada que la cambie.

   ===== LAS DOS SILLAS SE ESPEJAN =====
   Cada jugador es siempre J_VOS en su propia pantalla. Como la mesa tiene dos sillas, el que no
   reparte simplemente INTERCAMBIA las dos manos y el turno: 0 pasa a ser 1 y 1 pasa a ser 0. Es una
   involucion, asi que no hay tabla de traduccion que mantener ni forma de que se desincronice.

   ===== Y LA JUGADA VIAJA COMO CARTA, NO COMO INDICE =====
   El indice no sirve: cada uno ORDENA su propia mano por color y valor —lo hace desde la primera
   vuelta, porque buscar en un abanico desordenado es leer nueve cartas de a una— asi que la carta
   numero 3 de uno no es la numero 3 del otro. Mandando `{color, valor}` el receptor la busca en la
   mano del rival y la saca. Robar y pasar no llevan nada: los dos sacan del mismo mazo, en el mismo
   orden, porque las jugadas llegan en el mismo orden.
   ========================================================================================= */
const MP_NS='rezuno_v1_';
const MP_BROKER='wss://broker.emqx.io:8084/mqtt';
const MP_CADUCA=5000;          // sin noticias del rival por mas de esto, se lo da por ido
const MP_LATIDO=100;           // cada cuanto se publica el estado propio, como pide el pedido

const MP={ on:false, cli:null, estado:'no', sala:'', reparte:false, jugando:false,
           id:'', nom:'', rivalId:'', rivalNom:'', visto:0, ultLatido:0, chat:[], errores:0,
           /* lo ultimo que se publico, para no publicar lo mismo otra vez */
           ultEstado:'',
           /* ===== LA RONDA Y LA HUELLA: COMO SE DETECTA QUE LAS DOS PARTIDAS SE SEPARARON =====
              qos 0 no garantiza entrega, y hay UN mensaje cuya perdida no se puede reparar sola: el
              reparto. Si se pierde, uno arranca una partida nueva y el otro sigue en la vieja, los dos
              creen que le toca al otro y la mesa se queda muerta para siempre — medido, paso en la
              prueba de tres partidas seguidas.
              Se arregla con dos numeros en el latido. `ronda` sube en cada reparto: el que reparte ve
              que el otro se quedo en la ronda anterior y REPITE el reparto. Y `huella` es el tamano de
              la pila y del mazo: si discrepan un segundo entero, algo se perdio en el medio y la unica
              reparacion honesta es repartir de nuevo — mucho mejor que seguir jugando dos partidas
              distintas sin que nadie se entere. */
           ronda:0, semilla:0, rondaRival:-1, huellaRival:'', desdeMal:0,
           /* ===== LA MANO DEL OTRO, TAL CUAL LA MUEVE =====
              Pedido: *"cuando juegues 1vs1 con otra persona vos podras ver exactamente como mueve sus
              manos"*. Y "exactamente" quiere decir los VEINTIUN PUNTOS, no una pose que se parezca:
              lo que viaja es lo mismo que MediaPipe midio del otro lado, redondeado a tres decimales.
              63 numeros a 8 por segundo son unos tres kilobytes por segundo, que en un relevo publico
              es despreciable y es lo unico que hace que se le vean los dedos moverse de verdad. */
           manoRival:null, manoRivalT:0 };
const MP_MANO_HZ=8;

/* un identificador estable y al azar por pestana. No hace falta que sea unico en el universo: solo
   que dos jugadores de la misma sala no lo compartan. */
function mpNuevoId(){
  const a='abcdefghijkmnpqrstuvwxyz23456789';
  let r=''; for(let k=0;k<10;k++) r+=a[Math.floor(Math.random()*a.length)];
  return r;
}
function mpNuevaSala(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r=''; for(let k=0;k<4;k++) r+=a[Math.floor(Math.random()*a.length)];
  return r;
}
function mpTema(q){ return MP_NS+MP.sala+'/'+q; }

/* ---------- conectar ---------- */
function mpConectar(sala, nombre){
  if(typeof mqtt==='undefined'){ mpEstado('sinlib'); return false; }
  mpCortar();
  MP.sala=(sala||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8) || mpNuevaSala();
  MP.id=MP.id||mpNuevoId();
  MP.nom=(nombre||'').slice(0,12) || ('P-'+MP.id.slice(0,3).toUpperCase());
  MP.rivalId=''; MP.rivalNom=''; MP.visto=0; MP.reparte=false; MP.jugando=false; MP.chat.length=0;
  mpEstado('conectando');
  try{
    MP.cli=mqtt.connect(MP_BROKER, { keepalive:30, reconnectPeriod:2500, connectTimeout:8000,
                                     clientId:'rez_'+MP.id+'_'+Date.now() });
  }catch(e){ mpEstado('error'); return false; }
  MP.cli.on('connect', ()=>{
    mpEstado('online');
    MP.cli.subscribe([mpTema('state'), mpTema('action'), mpTema('chat')], {qos:0});
    MP.on=true;
    mpPublicar('state', { tipo:'hola', id:MP.id, name:MP.nom });
  });
  MP.cli.on('close',   ()=>{ if(MP.estado!=='no') mpEstado('offline'); });
  MP.cli.on('error',   ()=>{ MP.errores++; mpEstado('error'); });
  MP.cli.on('offline', ()=>{ if(MP.estado!=='no') mpEstado('offline'); });
  MP.cli.on('message', (tema, cuerpo)=>{
    let d=null;
    try{ d=JSON.parse(cuerpo.toString()); }catch(e){ return; }
    /* LA REGLA DEL PEDIDO, Y ES LA QUE EVITA APLICAR TODO DOS VECES: lo propio ya se aplico al
       hacerlo, asi que el eco se descarta. */
    if(!d || d.id===MP.id) return;
    const q=tema.slice(tema.lastIndexOf('/')+1);
    if(q==='state')  mpDeEstado(d);
    else if(q==='action') mpDeAccion(d);
    else if(q==='chat')   mpDeChat(d);
  });
  return true;
}
function mpCortar(){
  if(MP.cli){ try{ MP.cli.end(true); }catch(e){} MP.cli=null; }
  MP.on=false; MP.jugando=false; MP.rivalId=''; mpEstado('no');
}
function mpPublicar(q, d){
  if(!MP.cli || !MP.on) return false;
  try{ MP.cli.publish(mpTema(q), JSON.stringify(d), {qos:0}); return true; }catch(e){ return false; }
}
function mpEstado(e){ MP.estado=e; if(typeof pintarMP==='function') pintarMP(); }

/* ---------- presencia ---------- */
function mpDeEstado(d){
  if(!d.id) return;
  const nuevo = (d.id!==MP.rivalId);
  MP.rivalId=d.id; MP.rivalNom=d.name||'?'; MP.visto=performance.now();
  if(nuevo){
    /* SE CONTESTA EL SALUDO. El que ya estaba en la sala no se entera de que llego alguien si el que
       llega no habla, y el que llega no se entera del que estaba si el que estaba no contesta. */
    mpPublicar('state', { tipo:'hola', id:MP.id, name:MP.nom });
    /* gana el menor como texto: los dos llegan a la misma conclusion sin mandarse nada */
    MP.reparte = MP.id < MP.rivalId;
    if(typeof mpListos==='function') mpListos();
  }
  if(d.cartas!=null) MP.rivalCartas=d.cartas;
  if(d.ronda!=null) MP.rondaRival=d.ronda;
  if(d.huella!=null) MP.huellaRival=d.huella;
  mpVigilar();
}
/* ===== EL VIGILANTE DE SINCRONIA, Y SOLO EL QUE REPARTE PUEDE REPARAR =====
   Los dos detectan el problema, pero si los dos repartieran habria dos semillas nuevas y el remedio
   seria el mismo mal. El que reparte es el unico que puede tirar una semilla, y ya esta elegido sin
   negociar. */
function mpVigilar(){
  if(!MP.on || !MP.rivalId || !MP.reparte) return;
  const t=performance.now();
  /* 1. el rival se quedo en una ronda anterior: no le llego el reparto */
  if(MP.jugando && MP.rondaRival>=0 && MP.rondaRival<MP.ronda){
    if(t-MP.desdeMal>1000){ MP.desdeMal=t; MP.errores++;
      mpPublicar('action', { tipo:'reparto', id:MP.id, semilla:MP.semilla, ronda:MP.ronda }); }
    return;
  }
  /* 2. misma ronda pero distinta mesa: se perdio una jugada en el medio */
  if(MP.jugando && MP.rondaRival===MP.ronda && MP.huellaRival && MP.huellaRival!==mpHuella()){
    if(!MP._malDesde) MP._malDesde=t;
    else if(t-MP._malDesde>1000){ MP._malDesde=0; MP.errores++;
      if(typeof mpDesync==='function') mpDesync();
      mpRepartirYo(); }
    return;
  }
  MP._malDesde=0;
}
/* la mesa en dos numeros: no hace falta mas para saber que las dos partidas dejaron de ser la misma */
function mpHuella(){ return G.pila.length+'|'+G.mazo.length; }
/* se llama desde el bucle: publica el latido y cobra la caducidad */
function mpTick(t){
  if(!MP.on) return;
  if(t-MP.ultLatido>=MP_LATIDO){
    MP.ultLatido=t;
    const e=MP.jugando? (G.manos[J_IZQ].length+'|'+G.turno+'|'+mpHuella()+'|'+MP.ronda) : 'sala';
    /* ===== SOLO SI CAMBIO, PERO CON UN PISO DE UNA VEZ POR SEGUNDO =====
     "Publicar solo cuando algo cambia" es correcto para el ESTADO y catastrofico para la PRESENCIA, y
     son dos trabajos distintos que viajan en el mismo mensaje. Con la regla a secas, un jugador que se
     queda pensando su turno no cambia nada y por lo tanto deja de hablar: a los cinco segundos el otro
     lo da por ido y le corta la partida. Medido — la partida moria sola antes de la primera jugada,
     porque entre el reparto y el primer movimiento no cambia nada.
     Cambios: hasta diez veces por segundo. Silencio: una vez por segundo, que alcanza de sobra para
     una caducidad de cinco y sigue siendo tráfico despreciable. */
    if(e!==MP.ultEstado || t-(MP._salaT||0)>1000){
      MP.ultEstado=e; MP._salaT=t;
      mpPublicar('state', { tipo:'vivo', id:MP.id, name:MP.nom,
                            cartas:MP.jugando? G.manos[J_VOS].length : 0,
                            ronda:MP.ronda, huella:MP.jugando? mpHuella() : '' });
    }
  }
  /* la mano propia al aire, a su propio ritmo y solo si hay algo que mandar */
  if(t-(MP._manoT||0) >= 1000/MP_MANO_HZ){
    MP._manoT=t;
    if(MANO.hayPts && MANO.hay){
      const a=new Array(63);
      for(let k=0;k<63;k++) a[k]=Math.round(MANO.pts[k]*1000)/1000;
      mpPublicar('action', { tipo:'mano', id:MP.id, p:a });
      MP._manoIba=true;
    } else if(MP._manoIba){
      /* UN AVISO DE QUE SE FUE, Y UNO SOLO. Sin el, la ultima mano medida se quedaria colgada en la
         mesa del otro para siempre; mandandolo en cada vuelta seria un mensaje por nada diez veces
         por segundo mientras nadie levanta la mano. */
      MP._manoIba=false;
      mpPublicar('action', { tipo:'mano', id:MP.id, p:null });
    }
  }
  if(MP.rivalId && t-MP.visto>MP_CADUCA){
    MP.rivalId=''; MP.rivalNom='';
    MP.manoRival=null;
    if(MP.jugando){ MP.jugando=false; G.fase='menu'; if(typeof mpSeFue==='function') mpSeFue(); }
    else if(typeof mpListos==='function') mpListos();
  }
}

/* ---------- las jugadas ---------- */
function mpDeAccion(d){
  if(d.tipo==='reparto'){
    /* REPETIDO NO SE VUELVE A APLICAR. El que reparte insiste hasta que el otro llega a su ronda, asi
       que el mismo mensaje puede llegar varias veces; aplicarlo de nuevo reiniciaria una partida que
       ya esta bien encaminada. */
    if(d.ronda!=null && d.ronda===MP.ronda && MP.jugando) return;
    MP.ronda=(d.ronda!=null)? d.ronda : MP.ronda+1;
    mpEmpezar(d.semilla, false);
    return;
  }
  if(d.tipo==='mano'){
    /* SIN PARTIDA TAMBIEN SE ACEPTA: en la sala, ver moverse la mano del otro es la forma mas rapida
       de saber que del otro lado hay alguien de verdad y que su camara anda. */
    MP.manoRival = (d.p && d.p.length===63)? d.p : null;
    MP.manoRivalT = performance.now();
    return;
  }
  if(!MP.jugando) return;
  if(d.tipo==='tira'){
    const m=G.manos[J_IZQ];
    let i=-1;
    for(let k=0;k<m.length;k++) if(m[k].color===d.carta.color && m[k].valor===d.carta.valor){ i=k; break; }
    /* SI LA CARTA NO ESTA, NO SE INVENTA. Perder un mensaje es posible con qos 0; lo que no se puede
       hacer es sacar otra carta cualquiera y seguir como si nada, porque a partir de ahi las dos
       partidas son distintas y nadie se entera. */
    if(i<0){ MP.errores++; return; }
    jugarCarta(J_IZQ, i, d.color);
  } else if(d.tipo==='roba'){
    const c=robarDelMazo(); if(c) G.manos[J_IZQ].push(c);
    son('roba');
    if(d.pasa){ G.turno=siguiente(J_IZQ); G.robo=false; }
  } else if(d.tipo==='pasa'){
    G.turno=siguiente(J_IZQ); G.robo=false;
  }
}
/* lo que el jugador local hizo, al aire. Se llama DESPUES de aplicarlo, no antes: si se publicara
   primero y la jugada resultara invalida, el rival veria una jugada que aca no paso. */
function mpTiro(carta, color){ mpPublicar('action', { tipo:'tira', id:MP.id, carta:{color:carta.color, valor:carta.valor}, color:(color==null? null : color) }); }
function mpRobo(pasa){ mpPublicar('action', { tipo:'roba', id:MP.id, pasa:!!pasa }); }
function mpPaso(){ mpPublicar('action', { tipo:'pasa', id:MP.id }); }

/* ---------- empezar ---------- */
function mpEmpezar(semilla, soyYo){
  ponerJugadores(2);
  repartir(semilla);
  /* EL QUE NO REPARTE INTERCAMBIA LAS DOS SILLAS. Con dos sillas el intercambio es su propio inverso,
     asi que no hay tabla que mantener: cada uno es J_VOS en su pantalla y el otro es J_IZQ. */
  if(!MP.reparte){
    const t=G.manos[0]; G.manos[0]=G.manos[1]; G.manos[1]=t;
    G.turno = (G.turno===J_VOS)? J_IZQ : J_VOS;
    ordenarMano(J_VOS);
  }
  MP.jugando=true; MP.ultEstado='';
  G.fase='juego';
  if(typeof mpArranco==='function') mpArranco();
}
/* lo llama el que reparte cuando hay dos en la sala */
function mpRepartirYo(){
  if(!MP.reparte || !MP.rivalId) return false;
  const s=(Date.now()&0x7fffffff)||1;
  MP.ronda++; MP.semilla=s; MP.desdeMal=performance.now(); MP._malDesde=0;
  mpPublicar('action', { tipo:'reparto', id:MP.id, semilla:s, ronda:MP.ronda });

}
