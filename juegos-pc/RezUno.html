<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RezUno</title>
<style>
/* ===================== EL MARCO =====================
   Todo el juego vive dentro de un rectangulo 9:16 centrado. Es la misma decision que en RECREO y por
   el mismo motivo: el reparto de cartas, el abanico de la mano y los dos botones estan pensados para
   una pantalla alta, y estirarlos a un monitor apaisado deja las cartas del tamaño de un sello con
   dos metros de vacio a los costados. En una pantalla ancha se ve el marco con bandas negras, que es
   lo que hace cualquier juego vertical. */
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
/* ===================== BLANCO, NO NEGRO =====================
   La primera version era una mesa oscura con cartas brillando encima, y estaba mal por un motivo que
   no es de gusto: en un juego cuya regla ENTERA es "del mismo color", el fondo compite con lo unico
   que hay que mirar. Sobre blanco los cuatro colores se leen por lo que son —rojo, amarillo, verde,
   azul— y sobre negro se leen todos como "claro". Ademas una mesa de cartas es blanca. */
html,body{ height:100%; background:#e9eaec; overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color:#1b1d22; user-select:none; -webkit-user-select:none; }
#todo{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#marco{ position:relative; width:min(100vw, calc(100vh * 9 / 16));
        height:min(100vh, calc(100vw * 16 / 9)); overflow:hidden; background:#f4f5f6; }
#lienzo{ position:absolute; inset:0; width:100%; height:100%; display:block; }

/* ===================== LAS PANTALLAS =====================
   Idioma, menu y final son DOM y no lienzo, y eso es a proposito: son texto que hay que poder
   traducir, seleccionar con el lector de pantalla y que se vea nitido en cualquier densidad. El
   juego es lienzo porque son cartas moviendose. */
.pan{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:clamp(14px,3.4vh,30px); padding:6vh 8%; background:#f7f8f9;
      z-index:20; text-align:center; }
.pan.ver{ display:flex; }

/* EL TITULO SE DIBUJA CON TIPOGRAFIA Y NO CON UNA IMAGEN. Se pidio un menu "muy minimalista": una
   palabra bien espaciada ES el diseño minimalista, y encima queda nitida en cualquier pantalla, pesa
   cero bytes y se puede recolorear. Una imagen generada seria mas pesada y menos nitida. */
#logo{ font-size:clamp(38px,11vw,74px); font-weight:200; letter-spacing:.16em;
       line-height:1; margin-left:.16em; }
#logo b{ font-weight:700; letter-spacing:.10em; }
#logoSub{ font-size:clamp(10px,2.7vw,14px); letter-spacing:.42em; color:#8d929b;
          margin-left:.42em; margin-top:-2px; }

.bot{ display:block; width:min(320px,82%); padding:clamp(13px,2.4vh,18px) 10px;
      border:1px solid #c9ccd2; background:transparent; color:#1b1d22; cursor:pointer;
      font-size:clamp(14px,3.6vw,18px); font-weight:600; letter-spacing:.13em;
      font-family:inherit; transition:background .15s,border-color .15s; }
.bot:active{ background:#e3e5e8; }
.bot.lleno{ background:#1b1d22; color:#f7f8f9; border-color:#1b1d22; }
.bot.lleno:active{ background:#41454e; }
/* UN BOTON APAGADO TIENE QUE DECIR POR QUE. Un boton gris sin explicacion se lee a juego roto; la
   linea de abajo dice "primero el tutorial" y entonces se lee a orden. */
.bot[disabled]{ opacity:.32; cursor:default; pointer-events:none; }
.pie{ font-size:clamp(11px,2.9vw,13px); color:#6b7079; line-height:1.55; max-width:30em; }
.pie b{ color:#1b1d22; font-weight:600; }

#idBotones{ display:flex; flex-direction:column; gap:12px; align-items:center; width:100%; }

/* la linea de estado de la camara: permanente y con el motivo, no un cartel de dos segundos */
#camAviso{ font-size:clamp(10px,2.7vw,12px); letter-spacing:.10em; color:#6b7079; min-height:1.2em; }
#camAviso.bien{ color:#2e8b4f; }
#camAviso.mal{ color:#c0392b; }

/* EL VIDEO NO VA CON display:none. Un video que el compositor considera que no se dibuja puede dejar
   de entregar cuadros, y sin cuadros no hay deteccion. Queda de 2 px y transparente. */
#camVid{ position:fixed; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none; }

/* el HUD del juego: solo dos cosas, y las dos son texto */
#hud{ position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
      display:none; justify-content:space-between; align-items:flex-start; z-index:10;
      pointer-events:none; font-size:clamp(10px,2.7vw,12px); letter-spacing:.14em; color:#6b7079; }
body.jugando #hud{ display:flex; }
#salir{ pointer-events:auto; cursor:pointer; border:1px solid #c9ccd2; background:#ffffffcc;
        color:#6b7079; padding:6px 11px; font:inherit; letter-spacing:.14em; }

/* el cartel del tutorial: abajo, ancho, con fondo propio para que se lea sobre las cartas */
/* EL CARTEL VA ARRIBA Y NO ABAJO, y esto salio de una captura: abajo tapaba justo el abanico de la
   mano, o sea la parte de la pantalla que el propio cartel te esta pidiendo que mires. Arriba cae en
   la franja de los dos rivales, que durante el tutorial no se dibujan porque ningun paso habla de
   ellos — el hueco existe precisamente porque se lo hace existir. */
/* LOS ROTULOS SE PEGAN AL BORDE Y ADELGAZAN, y el motivo es que ahora hay ALGUIEN ahi. Desde que
   cada rival tiene cabeza, el craneo proyecta entre el 21% y el 36% del ancho: con el rotulo
   arrancando en el 7% y midiendo el 19%, el nombre le caia encima a la cara. Medido en la captura.
   Pegados al 2,5% y con menos espaciado ocupan hasta el 17% y no se tocan. */
#rivales{ position:absolute; left:0; right:0; top:8%; display:none; z-index:8;
          justify-content:space-between; padding:0 2.5%; pointer-events:none; }
body.jugando #rivales{ display:flex; }
body.guia #rivales{ display:none; }
.riv{ display:flex; flex-direction:column; align-items:center; gap:3px; }
.rn{ font-size:clamp(8px,2.1vw,10px); letter-spacing:.12em; color:#9aa0a9; }
.rc{ font-size:clamp(15px,4.2vw,20px); font-weight:600; color:#1b1d22; }
.rc.uno{ color:#c47b00; }
.riv.juega .rn{ color:#1b1d22; }
.riv.juega::after{ content:''; width:26px; height:2px; background:#1b1d22; margin-top:3px; }

/* A 60% Y NO A 57%: medido en la captura, el rotulo caia justo encima de la carta agarrada, que
   proyecta alrededor del 50% del alto. Y con una carta en la mano el 'TU TURNO' sobra —los dos
   botones ya dicen que hacer— asi que se esconde y queda solo la linea de ayuda. */
#turno{ position:absolute; left:0; right:0; top:60%; display:none; z-index:8;
        flex-direction:column; align-items:center; gap:4px; pointer-events:none; text-align:center; }
body.jugando #turno{ display:flex; }
body.guia #turno{ display:none; }
#turnoT{ font-size:clamp(12px,3.4vw,16px); font-weight:700; letter-spacing:.24em; color:#1b1d22; }
/* CON UNA CARTA EN LA MANO EL ROTULO SE VA ENTERO. Medido en la captura: la carta levantada proyecta
   entre el 47% y el 62% del alto, o sea justo encima del rotulo — y ademas sobra, porque los dos
   botones que acaban de aparecer SON la instruccion. Cuando lo que se pide es el color, el rotulo
   vuelve pero mas arriba, encima de los cuatro cuadros. */
body.eligiendo #turno{ display:none; }
/* a 30% y no a 38%: medido en la captura, los cuatro cuadros de color empiezan en el 34% del
   alto y el rotulo les caia encima */
body.pidecolor #turno{ display:flex; top:30%; }
body.pidecolor #turnoA{ display:none; }
#turnoT.rival{ color:#9aa0a9; }
#turnoA{ font-size:clamp(10px,2.8vw,12px); color:#9aa0a9; letter-spacing:.06em; }

#guia{ position:absolute; left:12px; right:12px; top:13%;
       background:#ffffffee; border:1px solid #d3d6db; padding:13px 15px; z-index:12;
       display:none; font-size:clamp(12px,3.3vw,15px); line-height:1.5;
       box-shadow:0 8px 26px #0000001f; }
body.guia #guia{ display:block; }
#guia .n{ font-size:10px; letter-spacing:.22em; color:#8d929b; display:block; margin-bottom:5px; }
#guia b{ color:#c47b00; font-weight:700; }
</style>

function TX(k, p){
  let s=(LANG[IDIOMA] && LANG[IDIOMA][k]) || (LANG.en[k]!=null? LANG.en[k] : k);
  if(p) for(const q in p) s=s.split('{'+q+'}').join(p[q]);
  return s;
}

/* ===================== EL MAZO =====================

   EL COLOR 4 ES "SIN COLOR". Guardar los comodines con un color inventado obligaria a preguntar por
   el valor en todos lados; con un color propio, "es comodin" es `c.color===4` y punto. */

   tiene contraste suficiente para un numero que hay que leer de reojo */

const NOMBRE_COL=['R','Y','G','B'];
const SALTA=10, GIRA=11, MAS2=12, COMODIN=13, MAS4=14;
function mazoNuevo(){
  const m=[];
  for(let c=0;c<4;c++){
    m.push({color:c, valor:0});
    for(let v=1;v<=9;v++){ m.push({color:c,valor:v}); m.push({color:c,valor:v}); }
    for(const a of [SALTA,GIRA,MAS2]){ m.push({color:c,valor:a}); m.push({color:c,valor:a}); }
  }
  for(let k=0;k<4;k++){ m.push({color:4,valor:COMODIN}); m.push({color:4,valor:MAS4}); }
  return m;
}
/* LA MEZCLA ES FISHER-YATES Y CON SEMILLA PROPIA. Con Math.random no se puede reproducir una partida,
   y una partida que no se puede reproducir no se puede depurar: cuando el jugador diga "me paso algo
   raro" no hay forma de volver a ese reparto. La semilla se guarda con la partida. */
let SEM=1;
function azar(){ SEM=(SEM*1664525+1013904223)&0x7fffffff; return SEM/0x7fffffff; }
function mezclar(m){
  for(let i=m.length-1;i>0;i--){ const j=Math.floor(azar()*(i+1)); const t=m[i]; m[i]=m[j]; m[j]=t; }
  return m;
}
/* LA REGLA, EN UNA SOLA FUNCION. La usan el jugador, los dos rivales, el boton apagado y el tutorial:
   si fueran dos cuentas distintas, el boton diria una cosa y el juego haria otra — que es el defecto
   mas dificil de encontrar que puede tener un juego de cartas. */
function pega(carta, colorMesa, valorMesa){
  if(!carta) return false;
  if(carta.color===4) return true;                 // los comodines siempre
  if(carta.color===colorMesa) return true;
  return carta.valor===valorMesa;
}
/* =========================================================================================
   EL MUNDO 3D

   Pedido: *"pero 3D hermano 3D en un ambiente 3D blanco no negro"*. La version anterior dibujaba las
   cartas con un contexto 2D. Ahora la mesa es una escena de three.js y cada carta es un objeto con
   grosor, sombra y perspectiva.

   POR QUE BLANCO Y NO SOLO "NO NEGRO": este juego tiene UNA regla y es "del mismo color". Sobre un
   fondo oscuro los cuatro colores se acercan entre si —todos leen como "claro contra oscuro"— y sobre
   blanco se leen por lo que son. Ademas una mesa de cartas es blanca. El fondo no es decoracion:
   es lo que hace legible la unica decision del juego.

   TRES DECISIONES DE ESCENA, LAS TRES CON UN MOTIVO CONCRETO:

   1. LA CAMARA ES ORTOGRAFICA-ISH: perspectiva angosta (fov 30) y lejos. Con un fov ancho la carta
      del borde del abanico se deforma tanto que su numero deja de leerse, y en un juego donde hay que
      comparar numeros y colores eso es un impuesto en cada turno. Un fov angosto desde lejos da
      volumen y sombra sin deformar.
   2. LA SOMBRA ES DE CONTACTO Y CHICA. Sin sombra las cartas flotan sobre la mesa y la escena se lee
      a calcomanias; con una sombra larga y dura se lee a escenario de teatro. Una direccional casi
      cenital con mapa chico da el apoyo y nada mas.
   3. EL FONDO NO ES UN COLOR PLANO SINO UNA SALA. Un color plano detras de una mesa blanca hace que
      la mesa no se distinga del vacio: no hay horizonte y todo flota. Dos planos —piso y pared— con
      dos blancos apenas distintos alcanzan para que haya un "adentro".
   ========================================================================================= */

/* EL DPR TIENE TECHO. Dibujar al doble de la resolucion de diseño duplica los pixeles a rellenar y
   lo unico que se gana es remuestrear hacia arriba cartas que no tienen mas detalle que dar — y con
   la camara encendida ese presupuesto hace falta para el detector de manos. */

   ve de canto y su numero se pierde. Con 30 desde 20 unidades la perspectiva se nota en el grosor y
   en la sombra, que es donde tiene que notarse. */
/* CAMPO 44, A 16 DE ALTO Y 21 DE FONDO, MIRANDO A z=-0,5. Los cuatro numeros salieron de un barrido
   de 200 combinaciones midiendo el rectangulo que ocupan TODAS las piezas proyectadas: este es el que
   mete la mesa entera adentro del cuadro usando el 97% del ancho. */
const CAM_MIRA=[0.0, -0.5];              // a que altura y profundidad apunta
const CAM_POS=new THREE.Vector3(0, 16, 21);
const camara=new THREE.PerspectiveCamera(44, 9/16, 0.5, 90);
camara.position.copy(CAM_POS);
camara.lookAt(0, CAM_MIRA[0], CAM_MIRA[1]);

/* ===================== MIRAR A LOS LADOS GIRANDO LA CABEZA =====================
   Pedido: *"pon que el jugador pueda mirar a los lados con solo girar su cabeza"*.

   Y SE ORBITA ALREDEDOR DE LA MESA, NO SE GIRA LA CAMARA EN EL SITIO. Girar en el sitio es lo que
   suena a "mirar a los lados", pero acá no se puede: el campo HORIZONTAL de este encuadre son 26
   grados, asi que con 13 de giro las cartas se van del cuadro — y el juego entero consiste en
   apuntarles. Orbitando, la mesa se queda donde esta y lo que cambia es el ANGULO desde el que se la
   ve: se asoma uno a los costados, se ve el canto de las cartas, se ven los rivales de otro perfil.
   Es lo que hace alguien sentado a una mesa que se mueve para ver mejor, y no rompe el juego.
   EL LIMITE SON 20 GRADOS, y llego a ser 14 por un defecto de MEDICION y no del juego: el barrido
   decia que el abanico se salia del cuadro a partir de los tres grados, y lo que se salia era una
   caja imaginaria — se estaba midiendo la caja alineada a los ejes de una carta inclinada, que crece
   al rotar la vista, y ademas sin poner al dia la matriz del grupo. Con las dos cosas arregladas, el
   abanico cae EXACTAMENTE en la misma fraccion de pantalla de 2 a 16 grados de giro. El limite lo
   pone ahora lo que se quiere ver, no lo que se rompe. */
const CAM_ORBITA=0.349;                  // 20 grados en radianes
let camGiro=0;
function camaraGiro(objetivo, dt){
  const lim=Math.max(-CAM_ORBITA, Math.min(CAM_ORBITA, objetivo||0));
  /* el suavizado va aparte del de la cara: aquel limpia el ruido del modelo, este le da inercia al
     movimiento de la vista para que no se sienta pegada a la cabeza */
  camGiro += (lim-camGiro)*Math.min(1, (dt||0.016)*3.2);
  const co=Math.cos(camGiro), si=Math.sin(camGiro);
  const x=CAM_POS.x, z=CAM_POS.z - CAM_MIRA[1];
  camara.position.set(x*co + z*si, CAM_POS.y, -x*si + z*co + CAM_MIRA[1]);
  camara.lookAt(0, CAM_MIRA[0], CAM_MIRA[1]);
}

/* =========================================================================================
   LA CARA DE UNA CARTA, PINTADA EN UN LIENZO Y CACHEADA

   Las caras se dibujan por codigo —no hay un solo archivo de imagen en el juego— y se guardan por
   clave. SE CACHEAN Y NO SE GENERAN TODAS: hay 54 caras distintas y en pantalla nunca hay mas de
   veinte, asi que generarlas todas al arrancar seria subir a la GPU el triple de textura que se usa.
   ========================================================================================= */
/* los cuatro colores y los cinco valores de accion viven en b.js: son DATOS DEL JUEGO y no del
   dibujo. Repetirlos aca costo un SyntaxError que tira la pagina entera antes de la primera linea. */
const TEX_W=192, TEX_H=288;
const _texCache={};
function simbolo(v){
  if(v===SALTA) return '⊘';
  if(v===GIRA)  return '⇄';
  if(v===MAS2)  return '+2';
  if(v===MAS4)  return '+4';
  if(v===COMODIN) return '★';
  return String(v);
}
function rr(g,x,y,w,h,r){
  const k=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+k,y); g.lineTo(x+w-k,y); g.quadraticCurveTo(x+w,y,x+w,y+k);
  g.lineTo(x+w,y+h-k); g.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
  g.lineTo(x+k,y+h); g.quadraticCurveTo(x,y+h,x,y+h-k);
  g.lineTo(x,y+k); g.quadraticCurveTo(x,y,x+k,y); g.closePath();
}
function texCara(c){
  const k=(c.color===4? 'W':c.color)+':'+c.valor;
  if(_texCache[k]) return _texCache[k];
  const cv=document.createElement('canvas'); cv.width=TEX_W; cv.height=TEX_H;
  const g=cv.getContext('2d');
  const W=TEX_W, H=TEX_H;
  g.fillStyle='#f7f8f9'; g.fillRect(0,0,W,H);
  const m=W*0.055;
  rr(g, m, m, W-2*m, H-2*m, W*0.075);
  g.fillStyle = c.color<4? COLORES[c.color] : '#26282e'; g.fill();
  if(c.color===4){
    const cx=W/2, cy=H/2, r=W*0.30;
    for(let q=0;q<4;q++){
      g.beginPath(); g.moveTo(cx,cy);
      g.arc(cx,cy,r,(q*90-135)*Math.PI/180,((q+1)*90-135)*Math.PI/180);
      g.closePath(); g.fillStyle=COLORES[q]; g.fill();
    }
    if(c.valor===MAS4){
      g.font='800 '+(W*0.24)+'px "Segoe UI",system-ui,sans-serif';
      g.fillStyle='#f7f8f9'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText('+4', cx, cy+H*0.29);
    }
  } else {
    /* el ovalo blanco inclinado es lo que hace que se lea a carta de este juego y no a ficha */
    g.save(); g.translate(W/2,H/2); g.rotate(-Math.PI/8);
    g.beginPath(); g.ellipse(0,0,W*0.38,H*0.29,0,0,Math.PI*2);
    g.fillStyle='#f7f8f9'; g.fill(); g.restore();
    const sim=simbolo(c.valor);
    g.font='800 '+(W*(sim.length>1?0.40:0.56))+'px "Segoe UI",system-ui,sans-serif';
    g.fillStyle=COL_OSC[c.color]; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(sim, W/2, H/2);
  }
  /* EL SIMBOLO VA TAMBIEN EN DOS ESQUINAS. En el abanico las cartas se tapan entre si y lo unico que
     asoma es la esquina de arriba: sin ese numero chico, media mano es ilegible. */
  const sim=simbolo(c.valor);
  g.font='700 '+(W*0.155)+'px "Segoe UI",system-ui,sans-serif';
  g.fillStyle='#f7f8f9'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(sim, W*0.17, H*0.115);
  g.save(); g.translate(W*0.83, H*0.885); g.rotate(Math.PI);
  g.fillText(sim, 0, 0); g.restore();
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  _texCache[k]=t;
  return t;
}
let _texDorso=null;
function texDorso(){
  if(_texDorso) return _texDorso;
  const cv=document.createElement('canvas'); cv.width=TEX_W; cv.height=TEX_H;
  const g=cv.getContext('2d'); const W=TEX_W,H=TEX_H;
  g.fillStyle='#f7f8f9'; g.fillRect(0,0,W,H);
  const m=W*0.055;
  /* EL DORSO ES CLARO Y NO NEGRO. En la primera captura en 3D los dos abanicos de los rivales y el
     mazo eran tres bloques oscuros sobre una mesa blanca: lo mas pesado del cuadro pasaba a ser lo
     que menos importa. Un gris apenas mas oscuro que la mesa, con el borde marcado, dice "hay cartas
     ahi" sin robarle el ojo a los colores, que son la unica informacion del juego. */
  rr(g,m,m,W-2*m,H-2*m,W*0.075); g.fillStyle='#dcdfe4'; g.fill();
  g.lineWidth=W*0.022; g.strokeStyle='#b7bcc4'; g.stroke();
  g.save(); g.translate(W/2,H/2); g.rotate(-Math.PI/8);
  g.beginPath(); g.ellipse(0,0,W*0.34,H*0.26,0,0,Math.PI*2);
  g.fillStyle='#cbcfd6'; g.fill(); g.restore();
  g.font='200 '+(W*0.28)+'px "Segoe UI",system-ui,sans-serif';
  g.fillStyle='#7b818b'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('Rez', W/2, H/2);
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  _texDorso=t; return t;
}

/* =========================================================================================
   UNA CARTA ES UNA CAJA FINA CON SEIS MATERIALES

   El canto tiene que existir: una carta sin grosor vista de costado desaparece, y en un abanico
   inclinado eso pasa todo el tiempo. Cuatro decimas de milimetro a escala de la carta alcanza.
   Los seis indices de una BoxGeometry son +X, -X, +Y, -Y, +Z (frente) y -Z (dorso).
   ========================================================================================= */
/* LA CARTA MIDE 1,72 Y NO 2,00, Y NO ES UN GUSTO. El abanico entero tiene que entrar en el ancho del
   cuadro —medido, 7,4 unidades es el maximo que entra con este encuadre— asi que el paso entre carta
   y carta esta fijado por la pantalla y no por la carta. Con cartas de 2,00 el solape era del 55% y
   de siete cartas se leian cuatro; con 1,72 el solape baja al 44% y asoman las siete. La proporcion
   sigue siendo 2:3, que es la de una carta de verdad. */
const CARTA_W=1.72, CARTA_H=2.58, CARTA_D=0.042;
const _geoCarta=new THREE.BoxGeometry(CARTA_W, CARTA_H, CARTA_D);
/* TRES GRUPOS Y NO SEIS, Y ESO ES LA MITAD DE LAS LLAMADAS DE DIBUJO. Una BoxGeometry trae un grupo
   por cara, o sea seis llamadas por carta: con veinticinco cartas en pantalla son 150 llamadas para
   dibujar veinticinco rectangulos. Los cuatro cantos y el dorso comparten material —el dorso no se ve
   NUNCA, porque "boca abajo" en este juego es ponerle el dorso a la cara de arriba, no dar vuelta la
   carta— asi que quedan tres grupos: cantos, cara y dorso. Medido: de 142 llamadas a 82. */
_geoCarta.clearGroups();
_geoCarta.addGroup(0, 24, 0);      // +X, -X, +Y, -Y: los cuatro cantos
_geoCarta.addGroup(24, 6, 1);      // +Z: la cara
_geoCarta.addGroup(30, 6, 0);      // -Z: el dorso, con el material del canto
const _matCanto=new THREE.MeshLambertMaterial({color:0xf2f3f4});
function nuevaCarta(){
  const mats=[_matCanto, new THREE.MeshLambertMaterial({color:0xffffff})];
  const m=new THREE.Mesh(_geoCarta, mats);
  m.castShadow=true; m.receiveShadow=false;
  m.userData={};
  return m;
}
/* CON carta EN null LA CARA DE ADELANTE LLEVA EL DORSO, NO NADA. Esto era un defecto y se vio en la
   primera captura en 3D: las cartas de los rivales y el mazo salian como rectangulos BLANCOS. La
   razon es que "boca abajo" en esta escena no significa girar la carta —estan apoyadas en la mesa y
   lo que se ve es su cara de arriba— sino PONERLE EL DORSO A LA CARA QUE SE VE. Dejar el mapa en
   null deja el material blanco, que sobre una mesa blanca es un rectangulo invisible. */
function ponerCara(malla, carta){
  const m=malla.material[1];
  const t=carta? texCara(carta) : texDorso();
  if(m.map!==t){ m.map=t; m.needsUpdate=true; }
}
/* apagar una carta que no se puede jugar: se BAJA el color, no se pone transparente. Transparente
   obliga a ordenar por profundidad y en un abanico que se superpone eso se ve peor que el problema */
function ponerApagado(malla, apagado){
  const c=apagado? 0x9aa0aa : 0xffffff;
  if(malla.material[1].color.getHex()!==c) malla.material[1].color.setHex(c);
}
/* =========================================================================================
   LA MANO

   Este juego necesita DOS cosas de la camara y nada mas: donde esta la mano en la pantalla, y si el
   pulgar y el indice se estan tocando. Todo lo demas —cuantos dedos, que gesto, la mano en 3D— es
   trabajo que no se usa, asi que no se hace: se pide UNA mano y se leen cuatro puntos.

   TRES COSAS QUE HAY QUE HACER BIEN Y NO SON OBVIAS, las tres aprendidas en RECREO:

   1. LA MEDICION NO VA EN EL BUCLE DE DIBUJO. detectForVideo() tarda entre 8 y 20 ms en un telefono,
      y con 16,6 ms de presupuesto para 60 fps cada cuadro pagaria la medicion entera. La maneja
      requestVideoFrameCallback del propio <video>, que dispara una vez por cuadro de CAMARA y no de
      render. Entre medicion y medicion la posicion se interpola.

   2. LA CAMARA SE PIDE ANTES QUE EL MODELO. El detector son dos descargas de un CDN mas un modelo de
      7,8 MB, o sea varios segundos: pidiendolos primero, cuando por fin se llama a getUserMedia el
      gesto del jugador ya expiro y Safari lo rechaza SIN mostrar el cartelito. La camara va en la
      primera linea y la descarga despues.

   3. EL ESPEJO SE LEE DEL TRACK Y NO SE SUPONE. Con la camara frontal la imagen va espejada y con la
      trasera no; si se espeja al reves, mover la mano a la derecha mueve el aro a la izquierda y no
      hay forma de apuntar a una carta. Aca se usa la FRONTAL, que es la que mira a alguien sentado
      jugando a las cartas, pero igual se lee del track.
   ========================================================================================= */
const MANO={ on:false, estado:'no', det:null, vid:null, hay:false, error:'', delegado:'',
             x:0.5, y:0.5, pinza:false, pinzaNueva:false, crudo:0, hz:0, medidas:0,
             espejo:true, msDet:0, cdn:null, listaEn:0,
             /* LOS 21 PUNTOS FILTRADOS, para poder DIBUJAR la mano y no solo apuntar con ella. Se
                guardan en un arreglo plano de 63 numeros y no en 21 objetos: los objetos habria que
                crearlos de nuevo en cada medicion —2.520 objetos por segundo a la basura— y el
                arreglo se escribe encima. */
             pts:new Float32Array(63), hayPts:false, usa:'',
             /* el destino crudo de la ultima medicion: 63 coordenadas mas el punto del aro, y su
                velocidad, que es con lo que se predice entre medicion y medicion */
             obj:new Float32Array(65), vel:new Float32Array(65), hayObj:false };
/* cual camara se prefiere. Se guarda, porque es una eleccion del jugador y no del aparato. */
let CAM_PREF='environment';
try{ const g=localStorage.getItem('rezuno_cam'); if(g==='user'||g==='environment') CAM_PREF=g; }catch(e){}
/* LA CARA, Y SOLO PARA MOVER LA VISTA. Pedido: "agrega reconocimiento facial o sea solamente para el
   movimiento y pon que el jugador pueda mirar a los lados con solo girar su cabeza". No se lee ningun
   gesto de la cara: se lee UN numero, el giro horizontal, y se usa para mover la camara. */
const CARA={ on:false, det:null, hay:false, giro:0, crudo:0, medidas:0, msDet:0, error:'' };

const MANO_URL='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MANO_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
/* DOS CDN. El detector es una descarga de un tercero: si ese tercero no contesta, el juego se queda
   sin manos y no hay nada que el jugador pueda hacer. */
const MANO_CDN=[{ js:MANO_URL, wasm:MANO_WASM },
                { js:'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
                  wasm:'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm' }];
const MANO_MODELO='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
/* 256x192 y no 480x360: son 2,8 veces menos pixeles para la misma mano, y la mano ocupa medio cuadro */
const MANO_ENT_W=256, MANO_ENT_H=192;
/* ===================== EL DETECTOR MIDE MENOS Y LA MANO SE DIBUJA IGUAL =====================
   Pedido: *"aplicale una optimizacion igual a la de baldi"*. La de RECREO son DOS cosas y solo una
   estaba puesta aca.

   La que ya estaba: la medicion cuelga de `requestVideoFrameCallback` del propio <video>, o sea que
   dispara una vez por cuadro de CAMARA y no por cuadro de RENDER. Sin eso, `detectForVideo()` —que
   tarda entre 8 y 20 ms en un telefono— se paga dentro de los 16,6 ms de presupuesto de cada cuadro.

   La que faltaba, y es la que importa: EL TECHO DE MEDICIONES Y LA INTERPOLACION. Con el techo en 45
   se medía en cada cuadro que entregara la camara, y en un telefono eso es todo el trabajo que hay.
   Baja a 24 en aparatos de puntero grueso —o sea telefonos y tabletas— y entre medicion y medicion
   los 21 puntos SE INTERPOLAN en cada cuadro de dibujo. La verdad se calcula pocas veces y el dibujo
   rellena: es el mismo criterio con el que RECREO simula a 60 pasos fijos y dibuja a 120.

   VEINTICUATRO EN TODOS LADOS Y NO SOLO EN TELEFONO. La primera version partia el techo con
   `pointer:coarse` —24 en telefono, 45 en PC— y esa rama no se puede comprobar: el navegador del
   banco dice `coarse` tambien cuando se lo corre como escritorio, asi que la mitad del codigo
   quedaba sin medir. Con la interpolacion puesta, 24 medidas por segundo dibujan igual de suave que
   45 en cualquier aparato, asi que la rama no compraba nada y costaba una rama sin probar. */
const MANO_HZ=24;
/* HASTA DONDE SE PREDICE ENTRE MEDICION Y MEDICION. A 24 Hz hay 42 ms entre medidas; con el tope en
   45 ms la prediccion cubre el hueco entero y ni un milisegundo mas. Extrapolar mas lejos que el
   proximo dato no es interpolar: es inventar. */
const PRED_MAX=0.045;
/* LA PREDICCION ESTA ATADA A LA VELOCIDAD, Y ESTO ES LA LECCION DE RECREO. Extrapolando siempre, con
   la mano QUIETA la diferencia entre dos medidas no es movimiento: es el ruido del detector. O sea
   que el codigo tomaria el ruido y lo multiplicaria antes de dibujarlo. Por debajo de PRED_V0 no se
   predice nada y por encima de PRED_V1 se predice entero. */
const PRED_V0=0.15, PRED_V1=0.55;   // fracciones de pantalla por segundo
/* Y ADEMAS SE TOPA CUANTO PUEDE CORRERSE, no solo cuanto tiempo. Sin el tope, una sola medicion
   rara —el detector salta la mano de un lado al otro en un cuadro— da una velocidad enorme y la
   prediccion la multiplica: medido con un salto sintetico de 0,58 en un cuadro, el punto se iba a
   2,39 de pantalla, o sea a metro y medio fuera del cuadro. Con el tope, un salto raro cuesta unos
   pixeles de mas y nada mas. Y se escala LA MANO ENTERA con el mismo factor, no cada punto por su
   cuenta: escalando por punto, la mano se deformaria justo cuando se mueve rapido. */
const PRED_MAXD=0.05;               // lo mas que puede adelantarse el punto que apunta
/* se apaga desde los ganchos para poder medir el ANTES y el DESPUES en la misma corrida: una mejora
   contada contra el recuerdo de como andaba no es una medicion */
let PRED_ON=true;
const MANO_CADUCA=280;        // sin medicion nueva por mas de esto, la mano se fue
/* ===================== LA CARA VA A 12 Hz Y NO A 45 =====================
   Son DOS modelos corriendo sobre el mismo video, asi que el costo se suma: medir las dos cosas al
   mismo ritmo seria mas del doble de trabajo por cuadro de camara. Y no hace falta — una cabeza que
   gira tarda medio segundo en ir de un lado al otro, o sea que a 12 Hz se la mide seis veces en el
   camino, y encima el giro entra por un suavizado. La mano SI necesita ritmo: es lo que apunta. */
const CARA_HZ=12;
const CARA_MODELO='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const CARA_CADUCA=900;

function d3(a,b){ const x=a.x-b.x, y=a.y-b.y, z=(a.z||0)-(b.z||0); return Math.hypot(x,y,z); }

/* ===================== EL PELLIZCO =====================
   Distancia pulgar-indice DIVIDIDA POR EL TAMAÑO DE LA PALMA, y esa division es todo el asunto: la
   mano puede estar a 20 cm de la camara o a un metro, asi que ninguna distancia en fracciones de
   cuadro sirve por si sola. La palma (muñeca -> nudillo del medio) es invariante a la distancia y al
   tamaño de la mano de quien juega.
   Medido en RECREO con manos sinteticas: un pellizco da 0,06 y un puño 0,88 — catorce veces de
   margen, asi que el umbral en 0,45 no esta apretado ni de casualidad. */
const PINZA_CIERRA=0.42, PINZA_ABRE=0.58;
function leerPinza(lm){
  const palma=d3(lm[0], lm[9]) || 1e-6;
  return d3(lm[4], lm[8]) / palma;
}

/* ===================== EL FILTRO =====================
   Un filtro de constante fija no puede ganar: si suaviza poco pasa el temblor del detector, y si
   suaviza mucho el aro llega tarde. Las dos cosas no pasan al mismo tiempo, asi que la constante
   tiene que depender de la velocidad. Esto es un 1-euro: con la mano quieta baja el corte —donde lo
   unico que se mueve es ruido— y lo abre cuando la mano se mueve.
   LA ZONA MUERTA SOBRE LA DERIVADA es lo que evita que el propio ruido abra el filtro: sin ella, la
   mano quieta "se mueve" unos puntos por cuadro y el filtro lo interpreta como movimiento real. */
const OE={ fcMin:0.9, beta:38.0, fcD:2.4, dz:0.0012 };
function oeAlfa(fc, dt){ const tau=1/(2*Math.PI*fc); return 1/(1+tau/dt); }
const F={ x:{v:0,d:0,ini:false}, y:{v:0,d:0,ini:false} };
/* UN FILTRO POR COORDENADA DE CADA PUNTO. Son 63 estados y parece mucho, pero es lo mismo que se le
   hace al punto del aro: sin filtrar, los veintiun puntos vibran cada uno por su cuenta y la mano
   dibujada hierve. Se crean UNA vez y se escriben encima. */
const FP=[]; for(let k=0;k<63;k++) FP.push({v:0,d:0,ini:false});
function fpReset(){ for(const q of FP) q.ini=false; F.x.ini=false; F.y.ini=false; }
function oePaso(S, x, dt){
  if(!S.ini){ S.v=x; S.d=0; S.ini=true; return x; }
  let d=(x-S.v)/dt;
  const a=Math.abs(d);
  d = a<OE.dz/dt? 0 : d*(1 - (OE.dz/dt)/a);
  const ad=oeAlfa(OE.fcD, dt);
  S.d = S.d + ad*(d-S.d);
  const fc=OE.fcMin + OE.beta*Math.abs(S.d);
  const al=oeAlfa(fc, dt);
  S.v = S.v + al*(x-S.v);
  return S.v;
}

function manoFallo(cual){
  MANO.estado='no'; MANO.error=cual; MANO.on=false;
  if(typeof pintarCam==='function') pintarCam();
}

async function manosIniciar(){
  if(MANO.estado==='lista'||MANO.estado==='carga') return MANO.on;
  MANO.estado='carga'; MANO.error='';
  if(typeof pintarCam==='function') pintarCam();
  /* SIN HTTPS navigator.mediaDevices NO EXISTE, asi que no hay permiso que negar: el navegador ni
     pregunta. Es la causa mas facil de confundir con un error del juego. */
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ manoFallo('insegura'); return false; }
  /* ===================== LA TRASERA POR OMISION =====================
     Pedido: *"quiero ver la mano we, como el de baldi, camara trasera"*. Y es la eleccion correcta
     para lo que hace este juego: con la trasera se sostiene el telefono y se mete la mano POR DETRAS,
     asi que la mano entra en la escena por donde entraria de verdad y no hay que apuntarse a uno
     mismo. Con la frontal hay que dejar el telefono apoyado y jugar de lejos.

     SE PIDE LA TRASERA Y SE ACEPTA LA QUE HAYA. `exact` fallaria en cualquier notebook —no tienen
     camara trasera— y dejaria el juego sin manos por pedir algo que no existe. Se pide como
     PREFERENCIA, y si el aparato solo tiene una, esa se usa. Despues se lee del track cual toco. */
  let flujo=null;
  const pedirCam=async (modo)=>navigator.mediaDevices.getUserMedia({
      video:{ facingMode:modo, width:{ideal:640}, height:{ideal:480} }, audio:false });
  try{
    flujo=await pedirCam(CAM_PREF);
  }catch(e){
    /* si la preferida no esta, se prueba la otra antes de darse por vencido */
    try{ flujo=await pedirCam(CAM_PREF==='environment'? 'user':'environment'); }
    catch(e2){
      manoFallo((e2 && (e2.name==='NotFoundError'||e2.name==='OverconstrainedError'))? 'camara' : 'permiso');
      return false;
    }
  }
  const v=document.getElementById('camVid');
  v.srcObject=flujo; MANO.vid=v;
  try{ await v.play(); }catch(e){}
  /* la entrada se achica en el propio track: menos pixeles que subir a la GPU en cada medicion */
  try{ const tr=flujo.getVideoTracks()[0];
       await tr.applyConstraints({ width:{ideal:MANO_ENT_W}, height:{ideal:MANO_ENT_H} });
       const s=tr.getSettings? tr.getSettings() : {};
       const cp=tr.getCapabilities? tr.getCapabilities() : {};
       /* EL ESPEJO SE LEE DEL TRACK Y NO SE SUPONE. Con la frontal la imagen va espejada y con la
          trasera no; si se espeja al reves, mover la mano a la derecha mueve la mano del juego a la
          izquierda y no hay forma de apuntar a una carta.

          Y NO ALCANZA CON MIRAR QUE CAMARA SE PIDIO, que es lo que hacia antes. Medido en el banco:
          `getSettings()` de una camara de notebook NO TRAE la clave `facingMode` —la lista
          `getCapabilities()`, pero el valor no esta—, asi que `s.facingMode || CAM_PREF` devolvia
          'environment' de puro respaldo y dejaba SIN espejo una camara que apunta al jugador. En un
          aparato asi, mover la mano a la derecha movia la mano del juego a la izquierda.

          La regla correcta es asimetrica: una camara que no dice para donde mira NO es la trasera.
          Un telefono informa su facingMode; una webcam callada es de las que te apuntan a la cara.
          Asi que solo un track que diga 'environment' apaga el espejo, y el silencio se lee frontal
          —que es tambien lo que dice la linea de estado, para que el cartel y el espejo no puedan
          contradecirse. */
       let fm = s.facingMode || '';
       if(!fm && Array.isArray(cp.facingMode) && cp.facingMode.length===1) fm=cp.facingMode[0];
       MANO.usa = fm || 'user';
       MANO.espejo = (MANO.usa!=='environment');
  }catch(e){ MANO.usa='user'; MANO.espejo=true; }

  let vision=null;
  for(const cdn of MANO_CDN){
    try{ vision=await import(/* @vite-ignore */ cdn.js); MANO.cdn=cdn; break; }catch(e){}
  }
  if(!vision){ manoFallo('cdn'); return false; }
  let _fs=null;
  try{
    const fs=await vision.FilesetResolver.forVisionTasks(MANO.cdn.wasm); _fs=fs;
    /* GPU primero y CPU de respaldo: en telefonos viejos el delegado de GPU tira al crear la tarea, y
       un detector a 15 fps en CPU sigue siendo jugable. */
    for(const del of ['GPU','CPU']){
      try{
        MANO.det=await vision.HandLandmarker.createFromOptions(fs,{
          baseOptions:{ modelAssetPath:MANO_MODELO, delegate:del },
          runningMode:'VIDEO', numHands:1,
          minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 });
        MANO.delegado=del; break;
      }catch(e){}
    }
  }catch(e){}
  if(!MANO.det){ manoFallo('modelo'); return false; }
  MANO.estado='lista'; MANO.on=true; MANO.listaEn=performance.now();
  if(typeof pintarCam==='function') pintarCam();
  manosLazo();
  /* LA CARA SE PIDE DESPUES Y SIN BLOQUEAR. Es otro modelo de varios megas: esperarlo antes de dejar
     jugar seria hacer esperar por algo que solo mueve la vista. Si no llega, el juego se juega igual
     con la camara quieta — que es exactamente lo que pasaba antes de que existiera. */
  /* ===================== LA CARA SOLO SIRVE CON LA FRONTAL =====================
     Y esto no es un detalle de implementacion: con la camara trasera tu cara esta del OTRO lado del
     telefono. Girar la cabeza no puede mover la vista porque no hay nada que mirar. En vez de dejar
     un detector corriendo que no va a encontrar nada nunca —gastando la mitad del presupuesto de la
     camara para eso— ni siquiera se pide el modelo, y la linea de estado lo dice.
     El jugador elige: TRASERA para meter la mano por detras como en RECREO, o FRONTAL para que
     ademas se pueda mirar a los lados girando la cabeza. Las dos cosas no caben en una camara. */
  if(MANO.usa!=='environment') caraIniciar(vision, _fs);
  return true;
}
async function caraIniciar(vision, fs){
  if(!vision || !fs || CARA.det) return;
  for(const del of ['GPU','CPU']){
    try{
      CARA.det=await vision.FaceLandmarker.createFromOptions(fs,{
        baseOptions:{ modelAssetPath:CARA_MODELO, delegate:del },
        runningMode:'VIDEO', numFaces:1,
        /* la matriz de transformacion es lo unico que se pide: de ahi sale el giro de la cabeza sin
           tener que deducirlo de la geometria de la cara */
        outputFacialTransformationMatrixes:true, outputFaceBlendshapes:false });
      break;
    }catch(e){ CARA.error=String(e && e.message || e).slice(0,60); }
  }
  CARA.on=!!CARA.det;
}

let _ultMed=0, _ultVista=0, _pinzaCruda=false, _ultCara=0, _tMed=0;
/* EL GIRO DE LA CABEZA SALE DE LA MATRIZ Y NO DE LOS PUNTOS. Deducirlo de "donde cae la nariz entre
   los dos ojos" funciona hasta que la persona se inclina o se acerca; la matriz que devuelve el
   modelo ya trae la rotacion resuelta. El elemento [8] de una matriz columna-mayor es el seno del
   giro alrededor del eje vertical. */
function caraMedir(t){
  if(!CARA.det || !MANO.vid || MANO.vid.readyState<2) return;
  if(t-_ultCara < 1000/CARA_HZ) return;
  const a=performance.now();
  let r=null;
  try{ r=CARA.det.detectForVideo(MANO.vid, t); }catch(e){ return; }
  CARA.msDet=CARA.msDet*0.85+(performance.now()-a)*0.15;
  _ultCara=t; CARA.medidas++;
  const m=r && r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
  if(!m || !m.data){ return; }
  const d=m.data;
  let g=Math.asin(Math.max(-1, Math.min(1, d[8])));
  if(MANO.espejo) g=-g;
  CARA.crudo=g;
  /* suavizado exponencial: la cabeza se mueve despacio y el ruido del modelo no, asi que aca alcanza
     con una constante fija — no hace falta el 1-euro que si necesita la mano */
  CARA.giro += (g-CARA.giro)*0.25;
  CARA.hay=true; CARA.visto=t;
}
function manosMedir(t){
  if(!MANO.det || !MANO.vid || MANO.vid.readyState<2) return;
  if(t-_ultMed < 1000/MANO_HZ) return;
  const a=performance.now();
  let r=null;
  try{ r=MANO.det.detectForVideo(MANO.vid, t); }catch(e){ return; }
  MANO.msDet = MANO.msDet*0.85 + (performance.now()-a)*0.15;
  _ultMed=t; MANO.medidas++;
  const lms=(r && r.landmarks) || [];
  if(!lms.length) return;
  manosInyectar(lms[0], t);
}
/* SE SEPARA DE LA MEDICION PARA PODER PROBARLA. Con manosInyectar() suelta, una mano de mentira entra
   por el mismo camino que la de verdad: el filtro, el umbral del pellizco y el flanco se prueban sin
   camara y sin persona. */
function manosInyectar(lm, t){
  const ex = MANO.espejo? (v)=>1-v : (v)=>v;
  /* EL PUNTO DEL ARO ES EL MEDIO ENTRE EL PULGAR Y EL INDICE, y no la punta del indice: es donde el
     jugador VE que se cierra la pinza, asi que es donde tiene que estar el aro. Con la punta del
     indice, al cerrar la pinza el aro se corre un centimetro justo en el momento de elegir. */
  /* ESTO SOLO GUARDA EL DESTINO; el filtro corre aparte, en cada cuadro de dibujo. Antes las dos
     cosas pasaban aca, o sea que la mano dibujada se movia SOLO cuando habia medicion: bajando el
     detector a 24 Hz la mano se habria movido a 24 pasos por segundo y se veria a tirones. */
  /* LA VELOCIDAD SALE DE DOS MEDICIONES, no de dos cuadros de dibujo: entre cuadros no hay dato
     nuevo, asi que dividir por el tiempo de cuadro daria una velocidad inventada. */
  const dtM=(t-_tMed)/1000;
  const nueva=MANO.hayObj && dtM>0.004 && dtM<0.25;
  const px=ex((lm[4].x+lm[8].x)/2), py=(lm[4].y+lm[8].y)/2;
  /* LA VELOCIDAD TAMBIEN SE SUAVIZA. Una velocidad sacada de dos medidas seguidas trae el ruido de
     las dos, y ese ruido entra multiplicado por el tiempo de prediccion. */
  if(nueva){ MANO.vel[63]+=((px-MANO.obj[63])/dtM-MANO.vel[63])*0.55;
             MANO.vel[64]+=((py-MANO.obj[64])/dtM-MANO.vel[64])*0.55; }
  else { MANO.vel[63]=0; MANO.vel[64]=0; }
  MANO.obj[63]=px; MANO.obj[64]=py;
  /* LOS 21 PUNTOS, CON EL MISMO ESPEJO QUE EL ARO. Que compartan destino y filtro no es ahorro de
     lineas: es lo que garantiza que la mano DIBUJADA y el punto que APUNTA no puedan separarse. Si
     fueran dos caminos, el jugador veria su pinza en un lugar y agarraria una carta en otro — que es
     exactamente el defecto que se reporto en RECREO con el rompecabezas. */
  for(let k=0;k<21;k++){
    const q=lm[k], b=k*3;
    const ax=ex(q.x), ay=q.y, az=q.z||0;
    if(nueva){ MANO.vel[b]+=((ax-MANO.obj[b])/dtM-MANO.vel[b])*0.55;
               MANO.vel[b+1]+=((ay-MANO.obj[b+1])/dtM-MANO.vel[b+1])*0.55;
               MANO.vel[b+2]+=((az-MANO.obj[b+2])/dtM-MANO.vel[b+2])*0.55; }
    else { MANO.vel[b]=MANO.vel[b+1]=MANO.vel[b+2]=0; }
    MANO.obj[b]=ax; MANO.obj[b+1]=ay; MANO.obj[b+2]=az;
  }
  MANO.hayObj=true; _tMed=t;
  manosFiltrar(t);
  MANO.hayPts=true;
  /* EL PELLIZCO SE LEE DE LOS PUNTOS CRUDOS Y AL RITMO DE LA MEDICION, no del filtro ni del dibujo.
     Un flanco es un instante: interpolarlo lo correria unos milisegundos y, peor, podria producir dos
     cruces del umbral donde la camara vio uno solo. */
  MANO.crudo=leerPinza(lm);
  /* HISTERESIS Y NO UN UMBRAL SOLO. Con un umbral unico, una pinza que queda justo en el borde
     parpadea entre abierta y cerrada varias veces por segundo, y cada parpadeo es un "click": el
     jugador tira una carta que no quiso. Cierra en 0,42 y abre recien en 0,58. */
  const antes=_pinzaCruda;
  if(_pinzaCruda){ if(MANO.crudo>PINZA_ABRE) _pinzaCruda=false; }
  else { if(MANO.crudo<PINZA_CIERRA) _pinzaCruda=true; }
  MANO.pinza=_pinzaCruda;
  /* VALE EL FLANCO, NO EL ESTADO. Una pinza sostenida medio segundo son treinta cuadros: si cada
     cuadro contara, una sola pinza recorreria todos los botones. Solo cuenta el cuadro en el que
     aparece. */
  if(_pinzaCruda && !antes) MANO.pinzaNueva=true;
  MANO.hay=true; MANO.visto=t;
}
/* ===================== EL FILTRO CORRE EN CADA CUADRO DE DIBUJO =====================
   Se lo llama desde el bucle, no desde la medicion. Entre dos mediciones no hay dato nuevo, asi que
   lo que hace es ACERCARSE al ultimo destino: a 24 mediciones y 60 cuadros, cada punto da dos pasos y
   medio de mas hacia donde la camara lo vio por ultima vez. Eso es la interpolacion.
   El reloj es UNO SOLO (`_ultVista`) y lo comparten la medicion y el dibujo: cuando la medicion ya
   filtro en este instante, el paso del dibujo recibe dt cero y no hace nada — no hay forma de que el
   filtro avance dos veces por el mismo tiempo. */
function manosFiltrar(t){
  if(!MANO.hayObj) return;
  const ahora = t==null? performance.now() : t;
  /* CUANTO HACE QUE NO HAY DATO, y hasta ahi se predice */
  const ad=Math.max(0, Math.min(PRED_MAX, (ahora-_tMed)/1000));
  /* LA GANANCIA SALE DE LA VELOCIDAD DEL PUNTO QUE APUNTA, UNA SOLA PARA TODA LA MANO. Calculandola
     por coordenada, un dedo quieto dentro de una mano que se mueve dejaria de predecir y la mano se
     desarmaria en el aire. La mano se mueve o no se mueve; es una sola cosa. */
  const vel=Math.hypot(MANO.vel[63], MANO.vel[64]);
  const g=Math.max(0, Math.min(1, (vel-PRED_V0)/(PRED_V1-PRED_V0)));
  let k=PRED_ON? ad*g : 0;
  const d=vel*k;
  if(d>PRED_MAXD) k*=PRED_MAXD/d;
  const dt=Math.min(0.2, (ahora-_ultVista)/1000);
  /* UN RELOJ QUE VA PARA ATRAS SE VUELVE A ANCLAR, NO SE IGNORA. Con `if(dt<=0) return` a secas, un
     instante anterior al ultimo deja el filtro CONGELADO hasta que el reloj lo alcance — y eso paso
     de verdad: los ganchos de prueba inyectan con marcas de tiempo sinteticas, asi que despues de una
     prueba que dejo el reloj adelantado, la siguiente pasaba setenta cuadros sin filtrar nada y
     reportaba 792 ms de retardo donde hay 6. Reanclando se pierde UNA muestra y listo. */
  if(dt<=0){ _ultVista=ahora; return; }
  _ultVista=ahora;
  MANO.x=oePaso(F.x, MANO.obj[63]+MANO.vel[63]*k, dt);
  MANO.y=oePaso(F.y, MANO.obj[64]+MANO.vel[64]*k, dt);
  for(let i=0;i<63;i++) MANO.pts[i]=oePaso(FP[i], MANO.obj[i]+MANO.vel[i]*k, dt);
}
function manosLazo(){
  const v=MANO.vid; if(!v) return;
  const paso=()=>{
    const t=performance.now();
    manosMedir(t);
    caraMedir(t);
    if(t-(MANO.visto||0)>MANO_CADUCA){ MANO.hay=false; MANO.pinza=false; _pinzaCruda=false;
                                       MANO.hayPts=false; MANO.hayObj=false; }
    if(t-(CARA.visto||0)>CARA_CADUCA){ CARA.hay=false; CARA.giro+=(0-CARA.giro)*0.06; }
    if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
    else setTimeout(paso, 1000/MANO_HZ);
  };
  if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
  else setTimeout(paso, 1000/MANO_HZ);
}
/* lo consume el juego una vez y se apaga: asi un pellizco no puede contarse dos veces */
function tomarPinza(){ const p=MANO.pinzaNueva; MANO.pinzaNueva=false; return p; }
/* =========================================================================================
   LA PARTIDA

   Tres jugadores: vos (0) y dos rivales (1 y 2). TRES Y NO DOS, y el motivo es una carta: con dos
   jugadores el "gira" es identico al "salta" —le devuelve el turno al que la tiro— asi que una de
   las cuatro cartas de accion dejaria de significar algo. Con tres, girar cambia a quien le toca.

   TODO EL ESTADO EN UN OBJETO. Sin esto, "reiniciar" es acordarse de poner a mano quince variables y
   la que se olvide se arrastra a la partida siguiente — que es como se ven los defectos que solo
   aparecen en la segunda partida.
   ========================================================================================= */
const J_VOS=0, J_IZQ=1, J_DER=2;
const G={ manos:[[],[],[]], mazo:[], pila:[], color:0, valor:0, turno:0, giro:1,
          fase:'menu', gana:-1, robo:false, sel:-1, colorPide:false, aviso:'', avisoT:0,
          mov:[], t:0, semilla:1, tutorial:false, botT:0, uno:[false,false,false],
          /* el turno de un rival deja de ser un instante y pasa a ser una secuencia visible:
             piensa -> agarra la carta de su abanico -> la lleva a la pila. Ver mas abajo. */
          bot:{ j:-1, fase:'', t:0, idx:-1 } };

/* las animaciones son una lista de cosas que viajan de un punto a otro y despues se olvidan. No hace
   falta nada mas elaborado: una carta que se tira es un rectangulo yendo de A a B en medio segundo */
function volar(carta, x0,y0,x1,y1, seg, boca){
  G.mov.push({ c:carta, x0,y0,x1,y1, t:0, dur:seg||0.42, boca:!!boca });
}
function movTick(dt){
  for(let i=G.mov.length-1;i>=0;i--){
    const m=G.mov[i]; m.t+=dt;
    if(m.t>=m.dur) G.mov.splice(i,1);
  }
}
function movHay(){ return G.mov.length>0; }

function robarDelMazo(){
  if(!G.mazo.length){
    /* SE REBARAJA LA PILA MENOS LA DE ARRIBA. Sin esto, en una partida larga el mazo se vacia y el
       juego se queda esperando una carta que no existe — y eso no se ve probando dos minutos. */
    if(G.pila.length<2) return null;
    const arriba=G.pila.pop();
    G.mazo=mezclar(G.pila.splice(0, G.pila.length));
    G.pila=[arriba];
  }
  return G.mazo.pop() || null;
}

function repartir(semilla){
  SEM=semilla|0 || 1; G.semilla=SEM;
  G.mazo=mezclar(mazoNuevo());
  G.manos=[[],[],[]];
  for(let k=0;k<7;k++) for(let j=0;j<3;j++) G.manos[j].push(G.mazo.pop());
  /* LA PRIMERA DE LA PILA NO PUEDE SER UNA CARTA DE ACCION. Si sale un +4 antes de que nadie jugara,
     el juego arranca preguntandole un color a alguien que todavia no entendio que esta pasando. */
  let p=null;
  while(G.mazo.length){ const c=G.mazo.pop(); if(c.valor<=9){ p=c; break; } G.mazo.unshift(c); }
  G.pila=[p]; G.color=p.color; G.valor=p.valor;
  G.turno=J_VOS; G.giro=1; G.gana=-1; G.robo=false; G.sel=-1; G.colorPide=false;
  G.mov.length=0; G.uno=[false,false,false]; G.botT=0;
  ordenarMano(J_VOS);
}
/* LA MANO SE ORDENA POR COLOR Y DESPUES POR VALOR. No es cosmetica: el juego entero es buscar una
   carta del color de la pila, y en un abanico desordenado eso es leer nueve cartas de a una. */
function ordenarMano(j){ G.manos[j].sort((a,b)=> (a.color-b.color) || (a.valor-b.valor)); }

function puedeJugar(j){ return G.manos[j].some(c=>pega(c,G.color,G.valor)); }
function siguiente(desde){ return (desde + G.giro + 3) % 3; }

/* aplica el efecto de la carta y devuelve a quien le toca despues */
function efecto(c, quien){
  let sig=siguiente(quien);
  if(c.valor===SALTA){ sig=siguiente(sig); son('salta'); }
  else if(c.valor===GIRA){ G.giro=-G.giro; sig=siguiente(quien); son('gira'); }
  else if(c.valor===MAS2){
    for(let k=0;k<2;k++){ const d=robarDelMazo(); if(d) G.manos[sig].push(d); }
    if(sig===J_VOS) ordenarMano(J_VOS);
    sig=siguiente(sig); son('mas');
  } else if(c.valor===MAS4){
    for(let k=0;k<4;k++){ const d=robarDelMazo(); if(d) G.manos[sig].push(d); }
    if(sig===J_VOS) ordenarMano(J_VOS);
    sig=siguiente(sig); son('mas');
  }
  return sig;
}

function jugarCarta(j, idx, colorElegido){
  const c=G.manos[j][idx];
  if(!c) return false;
  G.manos[j].splice(idx,1);
  G.pila.push(c);
  G.color = (c.color===4)? (colorElegido==null? 0 : colorElegido) : c.color;
  G.valor = c.valor;
  son('tira');
  if(G.manos[j].length===1){ G.uno[j]=true; son('uno'); }
  if(!G.manos[j].length){ G.gana=j; G.fase='fin'; son(j===J_VOS?'gana':'pierde'); return true; }
  G.turno=efecto(c, j);
  G.robo=false;
  return true;
}

/* ===================== LOS DOS RIVALES =====================
   No es una inteligencia y no tiene que serlo: es un jugador de mesa razonable. Prefiere sacarse de
   encima las cartas de accion —que es lo que hace cualquiera— y guarda los comodines para cuando no
   le queda nada del color, que es el unico momento en que valen. Sin esa segunda regla tiraria el +4
   en el primer turno y despues se quedaria trabado con seis cartas de un color que no sale mas. */
function botElegir(j){
  const m=G.manos[j];
  const vale=[];
  for(let i=0;i<m.length;i++) if(pega(m[i],G.color,G.valor)) vale.push(i);
  if(!vale.length) return -1;
  const sinCom=vale.filter(i=>m[i].color!==4);
  const lista=sinCom.length? sinCom : vale;
  let mejor=lista[0], punt=-1;
  for(const i of lista){
    const c=m[i];
    let p=0;
    if(c.valor===MAS2) p=6; else if(c.valor===SALTA) p=5; else if(c.valor===GIRA) p=4;
    else if(c.valor===MAS4) p=3; else if(c.valor===COMODIN) p=2; else p=1;
    /* con dos cartas iguales de utilidad, la del color del que MAS tiene: asi se queda con una mano
       de un solo color, que es lo que hace que despues pueda encadenar */
    if(c.color<4) p += 0.1*m.filter(q=>q.color===c.color).length;
    if(p>punt){ punt=p; mejor=i; }
  }
  return mejor;
}
function botColor(j){
  const c=[0,0,0,0];
  for(const q of G.manos[j]) if(q.color<4) c[q.color]++;
  let k=0; for(let i=1;i<4;i++) if(c[i]>c[k]) k=i;
  return k;
}
/* ===================== EL TURNO DE UN RIVAL, EN TRES TIEMPOS =====================
   Pedido: *"ver como con sus manos seleccionan las cartas"*. Antes esto era UNA linea: elegir el
   indice y llamar a jugarCarta(). O sea que la carta se TELETRANSPORTABA de su abanico a la pila en
   el mismo cuadro. Se veia que algo habia pasado, no quien lo habia hecho.

   Ahora el turno pasa por tres fases y la mano del rival las sigue: mientras PIENSA mira su abanico;
   al AGARRAR la mano viaja hasta la carta elegida y se cierra; al LLEVAR la carta va colgada de la
   pinza hasta la pila. La carta se baja de verdad —jugarCarta— recien al final de la tercera.

   Y LA ELECCION SE HACE AL EMPEZAR A AGARRAR, NO AL BAJAR. Si se eligiera al final, la mano habria
   estado viajando hacia una carta que todavia no estaba decidida: iria a cualquier lado y despues se
   bajaria otra. El indice se fija cuando la mano arranca, y es el mismo que se juega. */
const BOT_PIENSA=0.45, BOT_AGARRA=0.34, BOT_LLEVA=0.42;
function botReset(){ G.bot.j=-1; G.bot.fase=''; G.bot.t=0; G.bot.idx=-1; }
function botTick(dt){
  const B=G.bot;
  if(B.j!==G.turno){ B.j=G.turno; B.fase='piensa'; B.t=0; B.idx=-1; }
  B.t+=dt;
  const j=B.j;
  if(B.fase==='piensa'){
    if(B.t<BOT_PIENSA) return;
    let i=botElegir(j);
    if(i<0){
      const d=robarDelMazo();
      if(d){ G.manos[j].push(d); son('roba'); }
      i=botElegir(j);
      /* NO PUEDE JUGAR: pasa, y la mano nunca sale de su reposo. Esto tiene que quedar aca y no
         dentro de la fase de agarrar, o el rival estiraria la mano hacia una carta que no existe. */
      if(i<0){ G.turno=siguiente(j); G.robo=false; botReset(); return; }
    }
    B.idx=i; B.fase='agarra'; B.t=0;
    return;
  }
  if(B.fase==='agarra'){
    if(B.t<BOT_AGARRA) return;
    B.fase='lleva'; B.t=0; son('agarra');
    return;
  }
  if(B.fase==='lleva'){
    if(B.t<BOT_LLEVA) return;
    /* el indice puede haber quedado fuera de rango si algo cambio la mano en el medio; no puede
       pasar hoy, pero un indice viejo aplicado a una mano nueva baja OTRA carta y eso no se ve */
    const i=Math.min(B.idx, G.manos[j].length-1);
    if(i<0){ botReset(); return; }
    const c=G.manos[j][i];
    botReset();
    jugarCarta(j, i, c.color===4? botColor(j) : null);
  }
}

/* ===================== EL TURNO DEL JUGADOR =====================
   Dos pellizcos: uno agarra la carta y otro elige. Y el de TIRAR no hace nada si la carta no pega —
   pero el boton ya se veia apagado antes de intentarlo, asi que no hay forma de que el jugador
   descubra la regla equivocandose a ciegas. */
function seleccionar(i){
  if(G.fase!=='juego' || G.turno!==J_VOS || G.colorPide) return false;
  if(i<0 || i>=G.manos[J_VOS].length) return false;
  G.sel=i; son('agarra'); return true;
}
function soltar(){ if(G.sel<0) return false; G.sel=-1; son('deja'); return true; }
function tirarSel(){
  if(G.sel<0) return false;
  const c=G.manos[J_VOS][G.sel];
  if(!pega(c,G.color,G.valor)){ son('mal'); return false; }
  if(c.color===4){ G.colorPide=true; return true; }   // primero el color, despues baja
  jugarCarta(J_VOS, G.sel, null); G.sel=-1;
  return true;
}
function elegirColor(k){
  if(!G.colorPide || G.sel<0) return false;
  jugarCarta(J_VOS, G.sel, k);
  G.sel=-1; G.colorPide=false;
  return true;
}
function robarJugador(){
  if(G.fase!=='juego' || G.turno!==J_VOS || G.sel>=0 || G.colorPide) return false;
  if(G.robo) return false;                       // una sola por turno
  const d=robarDelMazo(); if(!d) return false;
  G.manos[J_VOS].push(d); ordenarMano(J_VOS);
  son('roba'); G.robo=true;
  avisar(TX('robaste'));
  /* SI LA QUE ROBASTE TAMPOCO PEGA, EL TURNO PASA SOLO. Dejarlo trabado con un boton de "pasar" que
     no hace nada mas es un boton de mas para aprender. */
  if(!puedeJugar(J_VOS)){ G.turno=siguiente(J_VOS); G.robo=false; }
  return true;
}
function avisar(t){ G.aviso=t; G.avisoT=1.6; }

/* el reloj de la partida: los rivales piensan medio segundo, que es lo que tarda alguien en mirar su
   mano — sin esa pausa las tres jugadas pasan en el mismo cuadro y no se ve nada */
function partidaTick(dt){
  G.t+=dt;
  if(G.avisoT>0) G.avisoT-=dt;
  movTick(dt);
  if(G.fase!=='juego'){ botReset(); return; }
  if(G.turno===J_VOS){ botReset(); return; }
  if(movHay()) return;
  botTick(dt);
}
/* =========================================================================================
   LA MESA EN 3D: DONDE VA CADA COSA, Y COMO SE APUNTA

   APUNTAR EN 3D ES UN RAYO, Y ESO NO ES UN DETALLE TECNICO. La mano vive en la camara web —dos
   dimensiones, normalizadas— y las cartas viven en el mundo. El puente es tirar un rayo desde el
   punto de la pantalla donde esta el aro y ver que toca. Comparar en el mundo obligaria al jugador a
   acertar una profundidad, y eso es exactamente lo que se pidio evitar en RECREO: la mano no puede ir
   mas lejos.

   Y LO QUE SE PUEDE PELLIZCAR ES LO QUE SE DIBUJA, POR CONSTRUCCION: no hay una tabla de rectangulos
   en otro lado. Cada objeto lleva su `userData.tipo`, y el rayo devuelve el objeto. Si el dibujo y el
   area sensible fueran dos cuentas distintas, el jugador pellizcaria una carta y el juego agarraria
   la de al lado — el defecto que en RECREO costo una vuelta entera encontrar.
   ========================================================================================= */
const PICK=[];                       // todo lo que el rayo puede tocar
const rayo=new THREE.Raycaster();
const _ndc=new THREE.Vector2();
function pickEn(fx, fy){
  /* LAS MATRICES SE PONEN AL DIA ACA, Y NO SE DA POR SENTADO QUE ALGUIEN LAS ACTUALIZO.
     three.js recalcula las matrices de mundo cuando DIBUJA, asi que un rayo tirado antes de dibujar
     usa las posiciones del cuadro anterior. En el juego eso queda tapado —se dibuja todos los
     cuadros— pero es una dependencia de ORDEN invisible, y una prueba que apunta sin dibujar la
     destapa: medido, apuntar a la carta 2 devolvia la 3 porque la 3 seguia donde estaba en la mano
     anterior. Un rayo tiene que mirar donde estan las cosas AHORA. */
  escena.updateMatrixWorld(true);
  /* fx,fy en fraccion de pantalla (0..1). A coordenadas normalizadas de dispositivo. */
  _ndc.set(fx*2-1, -(fy*2-1));
  rayo.setFromCamera(_ndc, camara);
  const hits=rayo.intersectObjects(PICK, false);
  for(const h of hits){
    const u=h.object.userData;
    if(u && u.tipo) return h.object;
  }
  return null;
}

/* ---------- las piezas de la mesa ---------- */
const cartasMallas=[];               // las de tu mano
const dorsoIzq=[], dorsoDer=[];      // las de los rivales
const pilaMallas=[];                 // las tres ultimas de la pila
let mazoMalla=null, selMalla=null;
const botones={};                    // tirar / dejar / los cuatro colores
const grupo=new THREE.Group(); escena.add(grupo);
/* ===================== TUS CARTAS GIRAN CON VOS =====================
   Al asomarse a un lado, la camara ORBITA alrededor del centro de la mesa. Tu abanico esta a nueve
   unidades de ese centro, asi que orbitando doce grados se corre casi dos unidades de costado y se
   sale del cuadro: medido, con dos grados de giro ya asomaba fuera de pantalla.

   Y la solucion no es girar menos: es que tus cartas son TUYAS. Cuando alguien sentado a una mesa
   gira la cabeza para mirar de reojo, sus propias cartas no se quedan atras — se mueven con el.
   El abanico y los dos botones viven en un grupo que gira lo mismo que la camara alrededor del mismo
   pivote, asi que su sitio EN LA PANTALLA no cambia mientras la mesa si rota. Lo que se mueve es el
   punto de vista sobre la mesa, que es lo que se pidio. */
const manoGrupo=new THREE.Group();
manoGrupo.position.set(0, 0, CAM_MIRA[1]);
escena.add(manoGrupo);
function manoGrupoAlDia(){ manoGrupo.rotation.y = camGiro; }

/* EL SITIO DE CADA COSA, EN UNIDADES DEL MUNDO. Estan juntos a proposito: son las quince medidas que
   definen la mesa y tenerlas desparramadas es como se termina con un abanico que se sale del cuadro. */
/* LA MESA ES LARGA Y ANGOSTA, Y ESO SALIO DE MEDIR EL ENCUADRE, NO DE DECORAR.
   Con una mesa casi cuadrada —9,2 de ancho por 13,8 de fondo— barri 200 combinaciones de campo,
   altura y distancia de camara y la MEJOR usaba el 34% del alto de la pantalla: en un marco 9:16 eso
   deja el tercio de arriba y el sexto de abajo vacios, y no hay camara que lo arregle porque el
   problema es la forma de lo que se mira. Estirada a 21 de fondo por 9 de ancho —una proporcion de
   2,3 contra el 1,78 de la pantalla— el mismo barrido encuentra encuadres que llenan el alto. */
const MESA={
  manoZ:8.4, manoY:1.02, manoArco:0.16, manoAncho:7.2, manoTilt:-0.78,
  mazoX:-2.9, pilaX:2.9, centroZ:-0.6,
  rivalZ:-9.6, rivalX:2.95, rivalFanY:1.55, rivalTilt:-0.55,
  selY:2.4, selZ:3.4, botY:3.4, botZ:1.4
};

/* ===================== LAS CARTAS FLOTAN =====================
   Pedido: *"las cartas flotando tambien"*. Y no es solo estetica: los abanicos de los rivales estaban
   APOYADOS en la mesa y casi acostados (rx -1,30, o sea 74 grados), asi que desde una camara que mira
   desde arriba se veian como una franja de cantos. Levantados y parados a 31 grados, el dorso queda
   de frente a la camara y ademas el abanico crece hacia arriba, que es justo donde hay pantalla libre
   y donde ahora esta la cabeza del rival.
   El vaiven es lento y chico —siete centesimas— y va DESFASADO carta por carta: con todas en fase el
   abanico entero sube y baja como un bloque, que se lee a error de camara y no a cartas flotando. */
function flota(t, i, k){ return Math.sin((t||0)*1.25 + i*0.42)*(k==null? 0.07 : k); }
/* el sitio de una carta del abanico de un rival. ES UNA FUNCION Y NO ESTA ADENTRO DE armarMesa a
   proposito: la mano del rival tiene que poder preguntar donde esta la carta que va a agarrar, y si
   la cuenta viviera adentro del bucle que dibuja, la mano y la carta serian dos cuentas distintas
   —o sea que la mano agarraria al lado de la carta. */
function sitioRival(i, q, lado, t){
  const paso=Math.min(0.42, 3.2/Math.max(1,q));
  const f=q<=1? 0 : (i/(q-1))*2-1;
  return { x: lado*MESA.rivalX + (i-(q-1)/2)*paso,
           y: MESA.rivalFanY + flota(t, i+lado*3) + i*0.012,
           z: MESA.rivalZ + i*0.03,
           rx: MESA.rivalTilt, ry:0, rz:-f*0.13 };
}

/* el abanico: un arco, no una fila. Con las cartas en linea el jugador ve una pared de cantos; con el
   arco cada una gira un poco y se ve su cara. El paso se aprieta cuando hay muchas para que el
   abanico entero entre en el ancho util — sin eso una mano de catorce se sale por los dos lados. */
function manoGeo(n){
  const paso=n<=1? 0 : Math.min(CARTA_W*0.80, (MESA.manoAncho-CARTA_W)/(n-1));
  return { paso, x0:-(paso*(n-1))/2 };
}
function sitioMano(i, n){
  const g=manoGeo(n);
  const x=g.x0+i*g.paso;
  const f=n<=1? 0 : (i/(n-1))*2-1;                  // -1 .. 1 de punta a punta
  /* EL ARCO LEVANTA 0,12 Y NO 0,30. Con 0,30 la carta del medio quedaba casi un tercio mas cerca de
     la camara que la de la punta, y en perspectiva eso se ve como si fuera de otro tamaño: en la
     captura el +2 del medio parecia el doble que el 1 de la izquierda. El arco esta para que cada
     carta muestre su cara, no para escalonarlas. */
  /* LAS CARTAS DE LA MANO SE PARAN, NO SE ACUESTAN. Tumbadas 58 grados sobre la mesa, la cara se ve
     tan escorzada que el numero pierde la mitad de su alto y el abanico ocupa una banda finita en la
     parte de abajo. Paradas a 45 se leen enteras y ademas el abanico crece hacia arriba, que es
     justo donde sobraba pantalla. Se levantan del piso lo que hace falta para que el borde de abajo
     no atraviese la mesa: media carta por el coseno de la inclinacion. */
  /* EL ABANICO SE SUPERPONE SIEMPRE PARA EL MISMO LADO, y esto no es estetico: es lo que hace que se
     pueda apuntar. Antes la profundidad venia del arco —las cartas del medio quedaban MAS LEJOS que
     las de las puntas— asi que las de afuera tapaban a las de adentro y el centro de una carta del
     medio podia estar debajo de su vecina. Medido: de 25 partidas jugadas apuntando al centro de la
     carta, 9 se trababan porque el rayo agarraba otra. Con la profundidad creciendo con el indice,
     cada carta tapa a la anterior y a ninguna otra, o sea que TODAS tienen una franja visible a la
     izquierda — igual que un abanico de cartas en la mano. */
  /* Y EL ARCO EN ALTURA SE FUE, QUE ES LA SEGUNDA MITAD DEL MISMO DEFECTO. Con las cartas inclinadas
     45 grados, subir una carta 0,04 la acerca a la camara 0,028 — o sea que el arco METIA una
     profundidad propia, del mismo tamaño que el escalon del solape. Medido: la carta 5 apuntada en su
     franja visible seguia devolviendo la 4 en las dos semillas probadas. Sin arco de altura la
     profundidad la decide UNICAMENTE el indice, y el escalon sube a 0,05 para que sea inconfundible.
     El abanico se sigue viendo abanico porque el giro de cada carta no se toca. */
  return { x, y:MESA.manoY, z:MESA.manoZ - CAM_MIRA[1] + i*0.05,
           rz:-f*MESA.manoArco, rx:MESA.manoTilt };
}

/* EL PUNTO AL QUE SE APUNTA ES EL MEDIO DE LA FRANJA VISIBLE, NO EL CENTRO DE LA CARTA. Con solape,
   el centro de una carta puede estar debajo de la siguiente; lo que el jugador ve —y por lo tanto
   donde apunta— es la tira que asoma a la izquierda, y su ancho sale de la geometria: el ancho de la
   carta menos el paso del abanico. La ultima no tiene a nadie encima, asi que se apunta a su centro. */
const _pv=new THREE.Vector3();
function puntoMano(malla, i, n){
  const g=manoGeo(n);
  const tapado = (i<n-1)? Math.max(0, CARTA_W-g.paso) : 0;
  /* SE PASA POR LA MATRIZ DE LA PROPIA CARTA Y NO SE RECONSTRUYE A MANO. La carta esta girada en dos
     ejes; escribir "x + dx por el coseno del giro" es adivinar en que orden three.js compone los
     angulos, y adivinarlo mal manda el punto a otra carta — medido, fallaba en una de siete. */
  malla.updateMatrixWorld(true);
  return malla.localToWorld(_pv.set(-tapado/2, 0, 0));
}
function malla(lista, k, padre){
  while(lista.length<=k){ const m=nuevaCarta(); m.visible=false; (padre||grupo).add(m); lista.push(m); }
  return lista[k];
}
function sobra(lista, n){ for(let k=n;k<lista.length;k++) lista[k].visible=false; }
/* el movimiento es un lerp hacia el sitio destino. No hace falta nada mas elaborado: una carta que se
   tira es un objeto yendo de A a B, y con el lerp la animacion sale gratis y no hay que mantener una
   lista de tweens que se puede desincronizar del estado */
function irA(m, p, k){
  const a=k==null? 0.22 : k;
  m.position.x += (p.x-m.position.x)*a;
  m.position.y += (p.y-m.position.y)*a;
  m.position.z += (p.z-m.position.z)*a;
  m.rotation.x += ((p.rx||0)-m.rotation.x)*a;
  m.rotation.y += ((p.ry||0)-m.rotation.y)*a;
  m.rotation.z += ((p.rz||0)-m.rotation.z)*a;
}
function poner(m, p){
  m.position.set(p.x,p.y,p.z); m.rotation.set(p.rx||0, p.ry||0, p.rz||0);
}

/* ---------- los botones flotantes ---------- */
/* SON PLACAS EN EL MUNDO Y NO HTML ENCIMA. Con HTML habria dos sistemas de coordenadas y dos caminos
   de apuntado; con placas, el boton se pellizca por el MISMO rayo que una carta. Un camino, una
   prueba. */
const _geoBot=new THREE.PlaneGeometry(1,1);
function texBoton(s, activo, fuerte){
  const W=384,H=140;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  g.clearRect(0,0,W,H);
  rr(g,4,4,W-8,H-8,16);
  g.fillStyle = activo? (fuerte? '#1b1d22' : '#ffffff') : '#eceef1';
  g.fill();
  g.lineWidth=3; g.strokeStyle = activo? (fuerte? '#1b1d22' : '#b9bec6') : '#dfe2e6'; g.stroke();
  g.font='700 46px "Segoe UI",system-ui,sans-serif';
  g.fillStyle = activo? (fuerte? '#f7f8f9' : '#1b1d22') : '#adb3bc';
  g.textAlign='center'; g.textBaseline='middle';
  /* el espaciado se dibuja letra por letra: canvas 2D no tiene letter-spacing en todos lados */
  const esp=5; let tot=0; for(const ch of s) tot+=g.measureText(ch).width+esp; tot-=esp;
  let x=W/2-tot/2;
  for(const ch of s){ g.fillText(ch, x+g.measureText(ch).width/2, H/2); x+=g.measureText(ch).width+esp; }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
function nuevoBoton(tipo, i, w, h){
  const m=new THREE.Mesh(_geoBot, new THREE.MeshBasicMaterial({transparent:true, depthTest:false}));
  m.scale.set(w,h,1); m.renderOrder=5; m.visible=false;
  m.userData={tipo, i, activo:true};
  /* NO SE METE EN PICK ACA. armarMesa() vacia la lista en cada cuadro —porque las cartas de la mano
     cambian de numero y de sitio— asi que un objeto anotado una sola vez al crearse desaparece de la
     lista en el primer cuadro. Costo una prueba: pellizcar TIRAR devolvia "no hay tirar". Los
     botones se anotan cuando se los hace visibles, junto con todo lo demas. */
  manoGrupo.add(m);
  return m;
}
botones.tirar=nuevoBoton('tirar',0, 2.55, 0.93);
botones.dejar=nuevoBoton('dejar',0, 2.55, 0.93);
botones.color=[0,1,2,3].map(k=>{
  const m=new THREE.Mesh(_geoBot, new THREE.MeshBasicMaterial({color:COLORES[k], depthTest:false}));
  m.scale.set(2.15,1.25,1); m.renderOrder=5; m.visible=false;
  m.userData={tipo:'color', i:k, activo:true};
  manoGrupo.add(m); return m;
});
let _texBot={};
function ponerTexBoton(m, clave, s, activo, fuerte){
  const k=clave+'|'+s+'|'+(activo?1:0)+'|'+(fuerte?1:0);
  if(m.userData.k===k) return;
  m.userData.k=k;
  if(_texBot[k]) { m.material.map=_texBot[k]; }
  else { _texBot[k]=texBoton(s,activo,fuerte); m.material.map=_texBot[k]; }
  m.material.needsUpdate=true;
}

/* ---------- el aro de la mano, en 3D ---------- */
/* VA PEGADO A LA CAMARA Y NO EN LA MESA. Es el cursor: tiene que estar donde el jugador ve su mano,
   no donde el rayo choca — si se pusiera en el punto de impacto, saltaria de una carta a otra y por
   el aire desapareceria. Colgado de la camara a distancia fija, se mueve como un cursor. */
const aroG=new THREE.Group(); camara.add(aroG); escena.add(camara);
/* EL ARO SE ACHICA A LA MITAD AHORA QUE SE VE LA MANO. Antes era el UNICO indicio de donde estabas
   apuntando, asi que tenia que ser grande; con los cinco dedos dibujados, lo que hace falta es una
   marca fina en el punto exacto de la pinza — un aro gordo encima de la mano la tapa. */
const aroMalla=new THREE.Mesh(new THREE.RingGeometry(0.86,1,40),
  new THREE.MeshBasicMaterial({color:0x2a2d34, transparent:true, opacity:0.9, depthTest:false}));
aroMalla.renderOrder=20; aroG.add(aroMalla);
const aroPunto=new THREE.Mesh(new THREE.CircleGeometry(0.16,16),
  new THREE.MeshBasicMaterial({color:0x1b1d22, transparent:true, depthTest:false}));
aroPunto.renderOrder=21; aroG.add(aroPunto);
let ARO_R=0;
const ARO_Z=-3.55;                // apenas delante de la mano, para que no quede tapado
function pintarAro(){
  const ver = MANO.on && ARO_R>0.02;
  aroMalla.visible=aroPunto.visible=ver;
  if(!MANO.on) { ARO_R+=(0-ARO_R)*0.2; return; }
  const obj = MANO.hay? (MANO.pinza? 0.075 : 0.135) : 0;
  ARO_R += (obj-ARO_R)*0.28;
  if(!ver) return;
  /* del punto de pantalla al plano a ARO_Z: la altura visible a esa distancia sale del fov */
  const h=2*Math.tan(camara.fov*Math.PI/360)*Math.abs(ARO_Z);
  const w=h*camara.aspect;
  aroG.position.set((MANO.x-0.5)*w, -(MANO.y-0.5)*h, ARO_Z);
  aroMalla.scale.setScalar(ARO_R);
  aroPunto.scale.setScalar(ARO_R*0.9);
  const z=pickEn(MANO.x, MANO.y);
  const col=(z && z.userData.activo)? 0xc47b00 : 0x1b1d22;
  aroMalla.material.color.setHex(col); aroPunto.material.color.setHex(col);
  aroMalla.material.opacity=aroPunto.material.opacity = MANO.hay? 1 : 0.35;
}

/* =========================================================================================
   ARMAR LA MESA CADA CUADRO
   Se recorre el estado y se le dice a cada objeto DONDE tiene que estar. Los objetos se acercan solos
   con el lerp, asi que no hay animaciones que mantener ni que puedan quedar fuera de sincronia con
   las cartas de verdad.
   ========================================================================================= */
let _primera=true;
function armarMesa(){
  PICK.length=0;
  manoGrupoAlDia();
  const m=G.manos[J_VOS], n=m.length;
  const tuTurno=(G.fase==='juego' && G.turno===J_VOS);

  /* tu mano */
  for(let i=0;i<n;i++){
    const c=m[i], ma=malla(cartasMallas,i,manoGrupo);
    ma.visible=true; ponerCara(ma,c);
    const ok=pega(c,G.color,G.valor);
    ponerApagado(ma, tuTurno && !ok);
    ma.userData.tipo='carta'; ma.userData.i=i; ma.userData.activo=tuTurno;
    if(i!==G.sel) PICK.push(ma);
    if(i===G.sel){
      /* la agarrada se levanta HACIA la camara y se endereza: es la unica que hay que poder leer
         entera mientras se decide */
      const p={ x:0, y:MESA.selY, z:MESA.selZ - CAM_MIRA[1], rx:-0.62, ry:0, rz:0 };
      irA(ma, p, 0.26);
      /* Y NO ENTRA AL RAYO. Ponerla con activo:false no alcanzaba y costo una prueba: la carta
         levantada queda MAS CERCA de la camara que los botones, asi que el rayo la tocaba primero,
         veia que tiene tipo, y devolvia una carta desactivada — o sea que pellizcar TIRAR no hacia
         nada. Una carta que ya esta agarrada no es un blanco: no va a la lista y punto. */
      ma.userData.activo=false;
    } else {
      const p=sitioMano(i,n);
      /* TU ABANICO FLOTA MENOS QUE EL DE ELLOS, y no por gusto: sobre tus cartas se APUNTA. Cuatro
         centesimas sobre una carta de 2,58 de alto es un vaiven que se ve y que no mueve el blanco
         —medido, las 30 partidas apuntando con el rayo siguen sin un solo fallo de punteria—. */
      p.y += flota(G.t, i, 0.04);
      if(_primera) poner(ma,p); else irA(ma,p, tuTurno?0.24:0.18);
    }
  }
  sobra(cartasMallas, n);

  /* los rivales: dorsos en abanico, mirando a la mesa */
  for(const [lista, j, lado] of [[dorsoIzq,J_IZQ,-1],[dorsoDer,J_DER,1]]){
    /* DURANTE EL TUTORIAL NO SE DIBUJAN. No es por despejar porque si: el cartel del tutorial ocupa
       exactamente esa franja de la pantalla, y ninguno de los seis pasos habla de los rivales. */
    if(TUT.on){ sobra(lista, 0); continue; }
    const q=G.manos[j].length;
    const B=G.bot, R=RIV[j];
    /* cuanto lleva de la fase de llevar la carta a la pila: 0 mientras la agarra, 1 al soltarla */
    const llev=(B.j===j && B.fase==='lleva')? Math.min(1, B.t/BOT_LLEVA) : 0;
    for(let i=0;i<q;i++){
      const ma=malla(lista,i); ma.visible=true;
      ponerApagado(ma,false);
      ma.userData.tipo=null;
      /* LA QUE EL RIVAL ESTA AGARRANDO CUELGA DE SU MANO, y su sitio ES el punto de la pinza de esa
         mano —el medio entre pulgar e indice— calculado de los mismos veintiun puntos que se dibujan.
         Con un sitio propio, la mano y la carta serian dos animaciones que hay que mantener juntas, y
         se separarian en el primer cuadro que una de las dos se atrase. */
      if(R && R.hayGarra && B.j===j && B.idx===i){
        /* Y SE DA VUELTA AL LLEVARLA. Mientras la elige se ve el dorso —el rival no te muestra su
           mano— y al ir hacia la pila se acuesta y muestra la cara, que es cuando ya la jugo. */
        ponerCara(ma, llev>0.35? G.manos[j][i] : null);
        /* LA CARTA CUELGA POR DEBAJO DE LA PINZA, no centrada en ella. Centrada, la mano queda
           dibujada encima de la mitad de la carta y se lee a mano TAPANDO una carta, no a mano
           sosteniendola; y colgando media carta justo, los dedos quedan en el borde de arriba, que es
           de donde se agarra una carta de un abanico. La misma distancia la usa la mano para elegir a
           donde ir, asi que al engancharse la carta no se mueve ni un milimetro. */
        /* Y SE ACUESTA RECIEN AL FINAL. Acostandola desde el principio del viaje, una carta plana
           vista desde una camara que mira de arriba queda debajo de la mano y no se ve: se pidio VER
           como la seleccionan, asi que la cara mira a la camara casi todo el trayecto y solo se
           acuesta en el ultimo tercio, cuando ya esta llegando a la pila. */
        const ac=Math.max(0, (llev-0.62)/0.38);
        const p={ x:R.garra.x, y:R.garra.y-RIV_CUELGA_Y, z:R.garra.z+RIV_CUELGA_Z,
                  rx:MESA.rivalTilt + (-Math.PI/2-MESA.rivalTilt)*ac, ry:0, rz:0 };
        irA(ma, p, 0.55);
        continue;
      }
      ponerCara(ma,null);
      const p=sitioRival(i, q, lado, G.t);
      if(_primera) poner(ma,p); else irA(ma,p,0.18);
    }
    sobra(lista,q);
  }

  /* el mazo: una pila de dorsos, y la de arriba es la que se pellizca */
  const puedeRobar = tuTurno && !G.robo && G.sel<0 && !G.colorPide;
  if(!mazoMalla){ mazoMalla=nuevaCarta(); grupo.add(mazoMalla);
                  mazoMalla.rotation.x=-Math.PI/2; mazoMalla.rotation.z=Math.PI; }
  mazoMalla.visible=true; ponerCara(mazoMalla,null); ponerApagado(mazoMalla,false);
  mazoMalla.position.set(MESA.mazoX, 0.30+flota(G.t, 7, 0.05), MESA.centroZ);
  mazoMalla.rotation.set(-Math.PI/2, 0, 0);
  mazoMalla.userData.tipo='mazo'; mazoMalla.userData.i=0; mazoMalla.userData.activo=puedeRobar;
  PICK.push(mazoMalla);

  /* la pila: las tres ultimas, apenas giradas, para que se lea a monton */
  const ult=G.pila.slice(-3);
  for(let k=0;k<3;k++){
    const ma=malla(pilaMallas,k);
    const c=ult[k];
    if(!c){ ma.visible=false; continue; }
    ma.visible=true; ponerCara(ma,c); ponerApagado(ma,false);
    ma.userData.tipo=null;
    const p={ x:MESA.pilaX, y:0.24+k*0.05+flota(G.t, 11, 0.05), z:MESA.centroZ,
              rx:-Math.PI/2, ry:0, rz:((k*53)%23-11)*Math.PI/180 };
    if(_primera) poner(ma,p); else irA(ma,p,0.3);
  }

  /* los botones */
  const hayBot = G.sel>=0 && !G.colorPide && G.fase==='juego';
  const c=G.sel>=0? m[G.sel] : null;
  const ok=c? pega(c,G.color,G.valor) : false;
  botones.tirar.visible=hayBot; botones.dejar.visible=hayBot;
  if(hayBot){
    PICK.push(botones.tirar, botones.dejar);
    ponerTexBoton(botones.tirar,'t',TX('tirar'), ok, true);
    ponerTexBoton(botones.dejar,'d',TX('dejar'), true, false);
    botones.tirar.userData.activo=ok;
    botones.tirar.position.set(-1.42, MESA.botY, MESA.botZ - CAM_MIRA[1]);
    botones.dejar.position.set( 1.42, MESA.botY, MESA.botZ - CAM_MIRA[1]);
    for(const b of [botones.tirar,botones.dejar]) b.rotation.set(-0.62,0,0);
  }
  const hayCol = G.colorPide && G.fase==='juego';
  for(let k=0;k<4;k++){
    const b=botones.color[k]; b.visible=hayCol;
    if(hayCol){ PICK.push(b);
                b.position.set((k%2? 1.20:-1.20), MESA.botY+0.75-Math.floor(k/2)*1.42, MESA.botZ - CAM_MIRA[1]);
                b.rotation.set(-0.62,0,0); }
  }
  _primera=false;
}

/* ===================== EL SONIDO =====================
   Procedural y sin un solo archivo: seis ruidos cortos que son todos la misma familia —un tono que
