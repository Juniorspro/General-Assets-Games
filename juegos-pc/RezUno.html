   sube o baja con un sobre rapido—. Grabarlos serian seis descargas para seis sonidos de diez lineas. */
const AUD={ ctx:null, m:null, on:false };
function audioIniciar(){
  if(AUD.ctx){ if(AUD.ctx.state==='suspended') AUD.ctx.resume(); return; }
  try{
    AUD.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AUD.m=AUD.ctx.createGain(); AUD.m.gain.value=0.5; AUD.m.connect(AUD.ctx.destination);
    AUD.on=true;
  }catch(e){ AUD.on=false; }
}
function tono(f, dur, vol, tipo, f2){
  if(!AUD.ctx||!AUD.on) return;
  const c=AUD.ctx, t=c.currentTime;
  const o=c.createOscillator(); o.type=tipo||'sine';
  o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(40,f2), t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AUD.m); o.start(t); o.stop(t+dur+0.02);
}
function roce(dur, vol, f0, f1){
  if(!AUD.ctx||!AUD.on) return;
  const c=AUD.ctx, t=c.currentTime, n=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
  bp.frequency.setValueAtTime(f0,t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1||f0), t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(AUD.m); s.start(t); s.stop(t+dur+0.02);
}
function son(k){
  if(!AUD.on) return;
  try{
    if(k==='agarra') tono(760,0.07,0.10,'sine',900);
    else if(k==='deja') tono(520,0.08,0.08,'sine',400);
    else if(k==='tira'){ roce(0.16,0.35,900,300); tono(300,0.09,0.09,'triangle',210); }
    else if(k==='roba') roce(0.14,0.28,700,1500);
    else if(k==='mal') tono(180,0.20,0.11,'sawtooth',110);
    else if(k==='salta') tono(880,0.13,0.10,'square',520);
    else if(k==='gira'){ tono(520,0.10,0.08,'square',880); setTimeout(()=>tono(880,0.10,0.08,'square',520),95); }
    else if(k==='mas'){ tono(240,0.16,0.12,'sawtooth',150); roce(0.18,0.25,500,180); }
    else if(k==='uno'){ [740,988].forEach((f,i)=>setTimeout(()=>tono(f,0.14,0.11,'square'),i*90)); }
    else if(k==='gana'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tono(f,0.22,0.12,'square'),i*95)); }
    else if(k==='pierde'){ [392,330,262].forEach((f,i)=>setTimeout(()=>tono(f,0.26,0.11,'triangle'),i*130)); }
  }catch(e){}
}
/* =========================================================================================
   LAS MANOS EN 3D — EL CONSTRUCTOR

   Pedido de esta vuelta: *"mejora la mano a una mas humanoide y aplicale una optimizacion igual a la
   de baldi"*. La anterior tenia la forma correcta pero un solo grosor para todo, y una mano con
   veintiun bolitas del mismo tamano no se lee a mano: se lee a COLLAR DE CUENTAS. Lo que hace que se
   lea a mano son tres cosas, y ninguna es agregar poligonos.

   1. CADA ARTICULACION TIENE SU RADIO. La muneca es lo mas gordo, los nudillos siguen, y cada dedo
      AFINA hacia la punta. Eso solo ya cambia la lectura, y es una tabla de veintiun numeros.
   2. EL HUESO TOMA EL PROMEDIO DE SUS DOS PUNTAS, no el minimo. Con el minimo el cilindro queda mas
      fino que las dos esferas que une y cada juntura se marca — que es exactamente el collar.
   3. LA PALMA VA EN UNA BASE ORTONORMAL. La version anterior componia la matriz con el ancho y el
      largo de la palma tal cual, y esos dos vectores NO son perpendiculares en una mano de verdad:
      componer con ellos no rota el elipsoide, lo CIZALLA. Se ortonormaliza —normal por producto
      cruzado, y el ancho recalculado contra ella— y recien ahi es un elipsoide apoyado en la palma.

   Y LA OPTIMIZACION, QUE ES LA MISMA DE RECREO: las esferas bajan a 6x5 segmentos y los cilindros a
   6 lados. Un nudillo ocupa unos pocos pixeles en un telefono; la diferencia entre 8x6 y 6x5 no
   existe en pantalla y son miles de triangulos por cuadro. Todo sigue en TRES llamadas de dibujo
   —articulaciones, huesos y palmas— haya una mano o haya cinco.
   ========================================================================================= */
const MANO_HUESOS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                   [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
/* EL RADIO DE CADA ARTICULACION, EN FRACCION DEL LARGO DE LA PALMA (muneca -> nudillo del medio).
   Va relativo y no en unidades del mundo a proposito: asi la MISMA tabla sirve para tu mano —que
   cambia de tamano segun cuanto la acerques a la camara— y para las de los rivales, que son fijas.
   Los numeros salen de una mano adulta: la palma mide 9,5 cm y la muneca 1,75 cm de radio. */
const MANO_RADIO=(()=>{
  const r=new Float32Array(21), P=0.095;
  r[0]=0.0175/P;                                                   // muneca
  const pul=[0.0150,0.0125,0.0110,0.0098];                         // pulgar
  for(let k=0;k<4;k++) r[1+k]=pul[k]/P;
  const base=[0.0135,0.0135,0.0128,0.0118];                        // indice, medio, anular, menique
  for(let d=0;d<4;d++){ const i0=5+d*4;
    r[i0]=base[d]/P; r[i0+1]=base[d]*0.86/P; r[i0+2]=base[d]*0.74/P; r[i0+3]=base[d]*0.66/P; }
  return r;
})();
const MANOS_MAX=5;                       // la tuya mas dos por cada rival
/* CUATRO HUESOS DE MAS, Y SON LOS ANTEBRAZOS DE LOS RIVALES. Entran por la misma malla instanciada
   que los huesos de los dedos —mismo cilindro, mismo material— asi que agregar un antebrazo a cada
   mano no cuesta NI UNA llamada de dibujo mas. Sin ellos las manos de los rivales flotan sueltas
   sobre la mesa y se leen a guantes, no a las manos de alguien. */
const M_ART=21*MANOS_MAX, M_HUE=MANO_HUESOS.length*MANOS_MAX+4, M_PAL=MANOS_MAX;
const matPiel=new THREE.MeshLambertMaterial({color:0xffffff});
const artMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,6,5), matPiel, M_ART);
const hueMalla=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,6,1,true), matPiel, M_HUE);
const palMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6), matPiel, M_PAL);
for(const m of [artMalla, hueMalla, palMalla]){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled=false; m.castShadow=true; m.receiveShadow=false;
  m.count=0; escena.add(m);
}
const _hm=new THREE.Matrix4(), _hq=new THREE.Quaternion(), _hv=new THREE.Vector3(),
      _hd=new THREE.Vector3(), _hs=new THREE.Vector3(), _hup=new THREE.Vector3(0,1,0),
      _hx=new THREE.Vector3(), _hy=new THREE.Vector3(), _hn=new THREE.Vector3(),
      _hmat=new THREE.Matrix4();
let _nArt=0, _nHue=0, _nPal=0;
function manosLimpiar(){ _nArt=0; _nHue=0; _nPal=0; }
function ponerArt(p, r){
  if(_nArt>=M_ART) return;
  _hm.makeScale(r,r,r); _hm.setPosition(p.x,p.y,p.z);
  artMalla.setMatrixAt(_nArt++, _hm);
}
function ponerHueso(a, b, r){
  if(_nHue>=M_HUE) return;
  _hd.subVectors(b,a);
  const L=_hd.length(); if(L<1e-5) return;
  _hq.setFromUnitVectors(_hup, _hd.normalize());
  _hs.set(r, L, r);
  _hv.addVectors(a,b).multiplyScalar(0.5);
  _hm.compose(_hv, _hq, _hs);
  hueMalla.setMatrixAt(_nHue++, _hm);
}
/* LA PALMA, Y NO ES UN ADORNO. Con huesos y articulaciones sueltos la mano se lee a ESQUELETO —se
   vio en la primera captura: cinco varillas con pelotitas en las junturas—. Lo que la vuelve una mano
   es el volumen que las une: un elipsoide apoyado en el plano de la palma. */
function ponerPalma(P, esc){
  if(_nPal>=M_PAL) return;
  const p0=P[0], p5=P[5], p17=P[17];
  _hv.copy(p5).add(p17).multiplyScalar(0.5);
  _hy.subVectors(_hv, p0);
  const largo=_hy.length(); if(largo<1e-5) return;
  _hy.multiplyScalar(1/largo);
  /* LA BASE SE ORTONORMALIZA. El ancho de la palma y su largo no son perpendiculares; componer la
     matriz con los dos tal cual no rota el elipsoide, lo cizalla — y una palma cizallada se ve como
     un error de render, no como una mano. La normal sale del producto cruzado y el ancho se recalcula
     contra ella, asi los tres ejes son perpendiculares por construccion. */
  _hn.crossVectors(_hd.subVectors(p5,p0), _hx.subVectors(p17,p0)).normalize();
  _hx.crossVectors(_hy, _hn).normalize();
  const ancho=p5.distanceTo(p17);
  _hmat.makeBasis(_hx, _hy, _hn);
  _hq.setFromRotationMatrix(_hmat);
  _hv.copy(p0).addScaledVector(_hy, largo*0.52);
  _hm.compose(_hv, _hq, _hs.set(ancho*0.60, largo*0.62, MANO_RADIO[0]*esc*1.05));
  palMalla.setMatrixAt(_nPal++, _hm);
}
/* EL DIBUJANTE, UNO SOLO PARA TODAS LAS MANOS DEL JUEGO. Que la tuya y las de los rivales pasen por
   aca no es ahorro de lineas: es lo que garantiza que se vean de la misma familia. Si fueran dos
   dibujantes, mejorar una dejaria la otra atras — que es justo lo que se reporto esta vuelta. */
function dibujarMano(P, esc){
  for(let i=0;i<21;i++) ponerArt(P[i], MANO_RADIO[i]*esc);
  for(const [a,b] of MANO_HUESOS)
    ponerHueso(P[a], P[b], (MANO_RADIO[a]+MANO_RADIO[b])*0.5*1.02*esc);
  ponerPalma(P, esc);
}
function manosSubir(){
  artMalla.count=_nArt; hueMalla.count=_nHue; palMalla.count=_nPal;
  artMalla.instanceMatrix.needsUpdate=true;
  hueMalla.instanceMatrix.needsUpdate=true;
  palMalla.instanceMatrix.needsUpdate=true;
}

/* =========================================================================================
   LA TUYA: RECONSTRUIDA SOBRE SU PROPIO RAYO DE PANTALLA

   MediaPipe da tambien `worldLandmarks` en metros y parece lo obvio: anclar la mano en la muneca y
   escalar. Pero el juego APUNTA con el punto de pantalla —el rayo sale de ahi— y una mano colocada
   por su geometria metrica NO cae donde estan esos puntos: verias la pinza en un lugar y agarrarias
   una carta en otro. Aca cada punto se pone SOBRE SU RAYO, a una profundidad que sale de su z
   relativa, y el dibujo y el apuntado son la misma cosa *por construccion*.
   ========================================================================================= */
const MANO_Z=-3.6, MANO_PROF=1.5;
const _pmundo=[]; for(let k=0;k<21;k++) _pmundo.push(new THREE.Vector3());
let _escMano=0;
function manoTuya(){
  if(!MANO.on || !MANO.hay || !MANO.hayPts) return false;
  /* LA MATRIZ DE LA CAMARA SE PONE AL DIA ACA. three.js la recalcula al DIBUJAR, asi que colocar la
     mano antes de dibujar la deja en la posicion del cuadro anterior — y desde que la camara orbita
     con la cabeza, eso es un desfase visible. Es la misma leccion que costo una prueba en pickEn:
     nunca dar por sentado que alguien actualizo el arbol. */
  camara.updateMatrixWorld(true);
  const z0=MANO.pts[2];
  const tanV=Math.tan(camara.fov*Math.PI/360);
  for(let k=0;k<21;k++){
    const fx=MANO.pts[k*3], fy=MANO.pts[k*3+1], fz=MANO.pts[k*3+2]-z0;
    const prof=MANO_Z - fz*MANO_PROF;
    /* CADA PUNTO SOBRE SU RAYO: se toma la fraccion de pantalla y se la lleva al plano de SU
       profundidad, no a un plano comun. Con un plano comun la mano quedaria plana como una calcomania
       y ademas la punta del dedo no caeria donde apunta el rayo. */
    const hz=2*tanV*Math.abs(prof), wz=hz*camara.aspect;
    _pmundo[k].set((fx-0.5)*wz, -(fy-0.5)*hz, prof).applyMatrix4(camara.matrixWorld);
  }
  /* LA ESCALA SALE DE LA PROPIA MANO Y SE SUAVIZA EN EL TIEMPO. Sale de la palma reconstruida, y esa
     reconstruccion usa la z — la coordenada mas ruidosa que da MediaPipe — asi que hereda todo su
     ruido. Sin suavizar, la mano quieta LATIA de grosor varias veces por segundo, y eso a ojo se lee
     como "tiembla" aunque la posicion en pantalla este perfectamente quieta. Con 0,14 por cuadro la
     mano puede acercarse a la camara todo lo rapido que quiera, pero su tamano no cambia en dos. */
  const cruda=Math.max(0.05, _pmundo[0].distanceTo(_pmundo[9]));
  _escMano = _escMano>0? _escMano + (cruda-_escMano)*0.14 : cruda;
  dibujarMano(_pmundo, _escMano);
  return true;
}

function manosPintar(dt){
  manosLimpiar();
  manoTuya();
  rivalesPintar(dt);
  manosSubir();
}
/* =========================================================================================
   LOS DOS RIVALES: CABEZA, MANOS ENFRENTADAS, Y AGARRAR LA CARTA A LA VISTA

   Pedido: *"que los bots esten enfrentados sus manos tambien, agregales una cabeza que se mueven
   animado, las cartas flotando tambien y ver como con sus manos seleccionan las cartas"*.

   Antes un rival era un abanico de dorsos apoyado en la mesa y dos manos de pose fija al costado.
   Jugaba TELETRANSPORTANDO la carta a la pila: en un cuadro estaba en su mano y en el siguiente
   arriba del monton. Se veia que algo habia pasado, no QUIEN lo habia hecho.

   TRES COSAS, Y LAS TRES SON LA MISMA:

   1. LA MANO SE CONSTRUYE EN SU PROPIO MARCO Y DESPUES SE COLOCA. La version anterior calculaba cada
      punto directo en coordenadas de mundo con senos y cosenos metidos en el bucle, asi que girar la
      mano un poco era reescribir la formula. Aca hay una POSE local —muneca en el origen, dedos hacia
      +Z, palma hacia abajo— con un parametro de cierre, y una matriz que la lleva a donde va. Girar,
      inclinar o cerrar la mano son tres numeros, no tres formulas.
   2. LA MANO SE MUEVE AL SITIO DE LA CARTA QUE EL BOT ELIGIO, Y LA CARTA VA COLGADA DE ELLA. No es
      una animacion pegada al lado: el sitio de la carta agarrada ES el punto de la pinza de esa mano,
      calculado de los mismos veintiun puntos que se dibujan. Si la mano se mueve, la carta se mueve;
      no pueden separarse.
   3. LA CABEZA MIRA LO QUE EL RIVAL ESTA HACIENDO. Piensa -> mira su abanico. Agarra y lleva -> mira
      la pila. Si no es su turno -> mira la mesa, y cada tanto te mira a vos. Una cabeza que se mueve
      al azar se lee a adorno; una que mira lo que pasa se lee a alguien jugando.

   Y TODO SIGUE INSTANCIADO. Las manos de los rivales entran por las MISMAS tres mallas que la tuya
   (dibujarMano), y la cabeza son cuatro instanciadas mas —craneo, cuello, torso y ojos— o sea cuatro
   llamadas de dibujo para los dos rivales enteros, no cuatro por rival.
   ========================================================================================= */

/* ---------- la pose de una mano, en su propio marco ----------
   Marco local: muneca en el origen, dedos hacia +Z, palma hacia -Y (o sea el dorso mirando arriba,
   que es como se ve una mano apoyada desde el otro lado de la mesa). Las medidas son fracciones del
   largo de la palma, igual que los radios: asi la pose no depende de cuan grande sea la mano. */
const RIV_DEDOS=[
  /* el pulgar sale del costado y hacia adelante; los otros cuatro salen de la linea de nudillos */
  { base:[ 0.30,-0.03, 0.12], dir:[ 0.62,-0.10, 0.78], lar:[0.26,0.20,0.17], pulgar:true },
  { base:[ 0.23, 0.00, 0.56], dir:[ 0.05, 0.00, 1.00], lar:[0.30,0.20,0.15] },
  { base:[ 0.07, 0.00, 0.61], dir:[ 0.01, 0.00, 1.00], lar:[0.33,0.22,0.16] },
  { base:[-0.09, 0.00, 0.59], dir:[-0.04, 0.00, 1.00], lar:[0.30,0.20,0.15] },
  { base:[-0.24, 0.00, 0.53], dir:[-0.12, 0.00, 1.00], lar:[0.24,0.17,0.13] },
];
/* cuanto se dobla cada falange al cerrar. Los tres angulos van creciendo y despues aflojan: es como
   se cierra un dedo de verdad — el nudillo poco, la falange del medio mucho, la punta un poco menos.
   Con los tres iguales el dedo se enrosca como una manguera. */
const RIV_CURVA=[0.50, 1.00, 0.85];
const _rp=[]; for(let k=0;k<21;k++) _rp.push(new THREE.Vector3());
const _rd=new THREE.Vector3(), _rmat=new THREE.Matrix4(), _reu=new THREE.Euler(),
      _rsc=new THREE.Vector3();
function _rotX(v,a){ const c=Math.cos(a), s=Math.sin(a);
                     const y=v.y*c-v.z*s, z=v.y*s+v.z*c; v.y=y; v.z=z; }
function _rotY(v,a){ const c=Math.cos(a), s=Math.sin(a);
                     const x=v.x*c+v.z*s, z=-v.x*s+v.z*c; v.x=x; v.z=z; }
/* arma los 21 puntos en el marco local y los lleva al mundo con una sola matriz */
function poseMano(cierre, mano, tam, pos, yaw, pitch, roll){
  const esp=mano<0? -1 : 1;                 // la izquierda es la derecha espejada en x
  _rp[0].set(0,0,0);
  for(let d=0; d<5; d++){
    const D=RIV_DEDOS[d], i0=1+d*4;
    _rp[i0].set(D.base[0]*esp, D.base[1], D.base[2]);
    _rd.set(D.dir[0]*esp, D.dir[1], D.dir[2]).normalize();
    for(let k=0;k<3;k++){
      /* EL PULGAR NO SE CIERRA COMO LOS DEMAS: se OPONE, o sea que cruza la palma. Doblarlo con el
         mismo giro que un dedo lo mete dentro de la mano y desaparece — y sin pulgar visible una
         mano que agarra no se lee a mano que agarra. */
      if(D.pulgar){ _rotY(_rd, -esp*cierre*0.42); _rotX(_rd, cierre*0.30); }
      else _rotX(_rd, cierre*RIV_CURVA[k]);
      _rp[i0+k+1].copy(_rp[i0+k]).addScaledVector(_rd, D.lar[k]);
    }
  }
  _reu.set(pitch||0, yaw||0, roll||0, 'YXZ');
  _rmat.makeRotationFromEuler(_reu);
  _rmat.scale(_rsc.set(tam,tam,tam));
  _rmat.setPosition(pos.x, pos.y, pos.z);
  for(let k=0;k<21;k++) _rp[k].applyMatrix4(_rmat);
  return _rp;
}

/* ---------- la cabeza, el cuello, el torso y los ojos ----------
   CUATRO MALLAS INSTANCIADAS PARA LOS DOS RIVALES, no cuatro por rival. Y los ojos usan LA MISMA
   matriz que el craneo con un desplazamiento local, asi que siguen la cabeza gratis: no hay dos
   animaciones que puedan desincronizarse. */
const matOjo=new THREE.MeshBasicMaterial({color:0x22252b});
const cabMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,9), matPiel, 2);
const cueMalla=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,8,1), matPiel, 2);
/* EL TORSO VA ANCHO ARRIBA Y ANGOSTO ABAJO, y estaba al reves. Con (0,60 arriba, 1 abajo) la parte
   que asoma por encima del abanico era la MAS ANGOSTA —1,32 de medio ancho contra las 2,12 que mide
   el abanico— asi que quedaba tapada entera y la cabeza salia flotando sola como un globo. Los
   hombros son lo mas ancho de un torso visto de frente; el que se afina es el de abajo. */
const torMalla=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,0.70,1,12,1), matPiel, 2);
const ojoMalla=new THREE.InstancedMesh(new THREE.SphereGeometry(1,7,5), matOjo, 4);
for(const m of [cabMalla, cueMalla, torMalla, ojoMalla]){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled=false; m.castShadow=true; m.receiveShadow=false;
  m.count=0; escena.add(m);
}
/* LAS MEDIDAS DE UN RIVAL, Y NO SALEN DE UNA PERSONA DE VERDAD.
   A escala humana la carta de este juego mediria 5,6 cm, o sea que una cabeza de 22 cm seria 2,6
   VECES el alto de una carta y taparia media mesa. La escena no esta a escala humana y forzarla lo
   unico que consigue es que no entre en el cuadro. Lo que si se respeta son las PROPORCIONES entre
   las partes —craneo, cuello, hombros— que es lo que hace que se lea a persona. */
const RIV_CAB_R=1.15;                     // radio del craneo
/* cuanto cuelga la carta por debajo y por detras de la pinza que la sostiene: media carta por el
   coseno de su inclinacion, o sea su borde de arriba */
const RIV_CUELGA_Y=CARTA_H*0.5*Math.cos(MESA.rivalTilt)-0.08, RIV_CUELGA_Z=0.40;
const RIV={};                             // estado visible de cada rival, por jugador
function rivalNuevo(lado, fase){
  return { lado, desf:fase, gy:0, gx:0, gyObj:0, gxObj:0, alc:0, cierre:0,
           garra:new THREE.Vector3(), hayGarra:false, parp:0, mirarte:0 };
}
const _rv=new THREE.Vector3(), _rv2=new THREE.Vector3(), _rq=new THREE.Quaternion(),
      _rs=new THREE.Vector3(), _rm=new THREE.Matrix4();

/* donde se sienta cada rival: el abanico flota adelante y la persona esta detras */
function rivalSitio(lado){
  return { x: lado*MESA.rivalX, z: MESA.rivalZ };
}
/* ---------- el bucle de los rivales ---------- */
let _rivT=0;
function rivalesPintar(dt){
  cabMalla.count=0; cueMalla.count=0; torMalla.count=0; ojoMalla.count=0;
  /* EN EL TUTORIAL NO HAY RIVALES, igual que sus cartas: el cartel del tutorial ocupa esa franja de
     la pantalla y ninguno de los seis pasos habla de ellos. */
  if(TUT.on || G.fase!=='juego') return;
  _rivT+=dt;
  let iCab=0, iOjo=0;
  for(const [j, lado] of [[J_IZQ,-1],[J_DER,1]]){
    if(!RIV[j]) RIV[j]=rivalNuevo(lado, j*1.7);
    const R=RIV[j];
    const q=G.manos[j].length;
    R.hayGarra=false;
    if(!q) continue;
    /* `desf` es el desfase de las animaciones de ESTE rival. Sin el, los dos respiran, se balancean y
       parpadean exactamente al mismo tiempo, y dos personas sincronizadas se leen a una animacion
       repetida —que es justo lo que son— en vez de a dos personas. */
    const S=rivalSitio(lado), f=R.desf, t=_rivT;

    /* ===== que esta haciendo, y por lo tanto a donde mira y cuanto estira la mano ===== */
    const B=G.bot;
    const suyo = (B && B.j===j);
    const agarrando = suyo && (B.fase==='agarra' || B.fase==='lleva');
    const objAlc = agarrando? 1 : 0;
    R.alc += (objAlc-R.alc)*Math.min(1, dt*6.5);
    /* el cierre de la mano va DETRAS del alcance: primero llega, despues agarra. Al reves la mano
       llegaria con el puno ya cerrado, que es como agarra un robot y no una persona. */
    const objCie = (suyo && B.fase==='lleva')? 1 : 0;
    R.cierre += (objCie-R.cierre)*Math.min(1, dt*9.0);

    /* ===== las dos manos ===== */
    /* EL TAMANO SALE DE LA CARTA. Una mano al lado de un abanico tiene que medir mas o menos lo que
       mide una carta y media, o se lee a juguete — con 1,05 en una captura anterior eran cuatro
       astillas blancas al costado del abanico. */
    const tam=CARTA_W*1.15;
    const fanY=MESA.rivalFanY;
    /* LAS DOS MANOS SOSTIENEN EL ABANICO POR ABAJO, no lo flanquean. Flanqueandolo —a 0,62 del ancho
       del abanico a cada lado— la mano de afuera del rival de la derecha caia en x 1,02 de pantalla:
       fuera del cuadro. Y ademas es como NO se sostiene un abanico: se lo agarra por la parte de
       abajo, con las dos manos juntas, que es lo que ademas las deja bien adentro del encuadre. */
    for(const s of [-1,1]){
      /* la mano de adentro —la que da al centro de la mesa— es la que agarra */
      const agarra = (s===-lado);
      /* Y VAN ADELANTE DEL ABANICO, NO DEBAJO. Debajo —a 1,15 por abajo del centro del abanico y
         casi en su mismo plano— lo unico que asomaba eran las puntas de los dedos por debajo de las
         cartas: se pedia VER las manos y se veian diez unas. Adelante, apoyadas sobre la mesa, se ven
         enteras contra el blanco y ademas quedan en el camino hacia la pila, que es a donde tienen
         que ir a llevar la carta. */
      const rep={ x:S.x + s*1.30, y:0.85+Math.sin(t*1.1+f+s)*0.045,
                  z:S.z + 2.35 };
      let px=rep.x, py=rep.y, pz=rep.z, yaw=-s*0.34, pitch=0.34;
      if(agarra && R.alc>0.002){
        const d=rivalDestino(j, B);
        const a=R.alc;
        px+= (d.x-px)*a; py+= (d.y-py)*a; pz+= (d.z-pz)*a;
        yaw += (0-yaw)*a; pitch += (0.55-pitch)*a;
      }
      _rv.set(px,py,pz);
      const P=poseMano(agarra? Math.max(0.42, R.cierre*0.92) : 0.42, s===-1? -1 : 1,
                       tam, _rv, yaw, pitch, -s*0.18);
      /* LA PINZA DE LA MANO QUE AGARRA ES DONDE VA LA CARTA, y sale de los mismos puntos que se
         dibujan: el medio entre la punta del pulgar y la del indice. Si la carta usara un numero
         aparte, la mano y la carta podrian estar en dos lugares distintos — que es exactamente el
         defecto que se reporto de RECREO con el rompecabezas. */
      /* LA CARTA NO SE ENGANCHA HASTA QUE LA MANO LLEGO. Enganchandola apenas la mano arranca —con
         el umbral en 0,02— la carta salia volando del abanico HACIA la mano, o sea al reves de lo que
         pasa: primero la mano va a la carta y despues las dos vuelven juntas. Con el umbral en 0,55
         la carta se queda quieta en el abanico mientras el brazo viaja. */
      if(agarra){ R.garra.copy(P[4]).add(P[8]).multiplyScalar(0.5); R.hayGarra=R.alc>0.55; }
      const escM=P[0].distanceTo(P[9]);
      dibujarMano(P, escM);
      /* EL ANTEBRAZO, Y TERMINA JUSTO ANTES DEL ABANICO. Llevandolo hasta el hombro —que esta dos
         unidades detras de las cartas— el cilindro ATRAVIESA el abanico por el medio: medido, a la
         altura de las cartas pasaria por y 1,93 con el abanico ocupando de 0,45 a 2,65. Cortandolo
         en el borde de abajo del abanico, el brazo se mete detras de las cartas y el resto se lee
         solo, que es lo que pasa cuando alguien tiene las manos apoyadas delante de sus cartas. */
      _rv2.set(S.x + s*1.55, 0.62, S.z + 0.75);
      ponerHueso(P[0], _rv2, escM*0.34);
    }

    /* ===== la cabeza ===== */
    /* LA CABEZA TIENE QUE QUEDAR ENTERA POR ENCIMA DEL ABANICO. Con el centro a 1,62 sobre el
       abanico, medio craneo quedaba detras de las cartas y en pantalla se veia media pelota asomando.
       El borde de arriba del abanico esta a 1,10 sobre su centro —media carta por el coseno de la
       inclinacion— asi que el centro de la cabeza va a esa altura mas su propio radio y un respiro. */
    const cabY=fanY+CARTA_H*0.5*Math.cos(MESA.rivalTilt)+RIV_CAB_R*1.06+0.30, cabZ=S.z-1.95;
    /* a donde mira: su abanico si esta pensando, la pila si esta jugando, y si no la mesa —con un
       vistazo hacia vos cada tanto, que es lo que hace que no parezca un maniqui */
    R.mirarte += dt;
    let mira;
    if(suyo && B.fase==='piensa') mira=_rv2.set(S.x, fanY, S.z+0.4);
    else if(agarrando) mira=_rv2.set(MESA.pilaX, 0.5, MESA.centroZ);
    else if((R.mirarte%9.5) < 2.1) mira=_rv2.set(0, 1.4, MESA.manoZ);      // te mira a vos
    else mira=_rv2.set(0, 0.3, MESA.centroZ);
    _rv.set(mira.x-S.x, mira.y-cabY, mira.z-cabZ);
    R.gyObj=Math.atan2(_rv.x, _rv.z);
    R.gxObj=-Math.atan2(_rv.y, Math.hypot(_rv.x,_rv.z));
    /* EL BALANCEO NO SE SUMA AL OBJETIVO SINO AL RESULTADO. Sumado al objetivo pasaria por el
       suavizado y quedaria casi borrado; sumado despues se ve, y ademas no compite con el giro. */
    const k=Math.min(1, dt*3.4);
    R.gy += (R.gyObj-R.gy)*k; R.gx += (R.gxObj-R.gx)*k;
    const balY=Math.sin(t*0.53+f)*0.085 + Math.sin(t*0.31+f*2)*0.05;
    const balX=Math.sin(t*0.44+f)*0.045;
    const resp=Math.sin(t*1.35+f)*0.055;                   // respira
    const gy=R.gy+balY, gx=R.gx+balX;

    _reu.set(gx, gy, Math.sin(t*0.37+f)*0.05, 'YXZ');
    _rq.setFromEuler(_reu);
    _rv.set(S.x, cabY+resp, cabZ);
    _rm.compose(_rv, _rq, _rs.set(RIV_CAB_R*0.97, RIV_CAB_R*1.06, RIV_CAB_R*0.94));
    cabMalla.setMatrixAt(iCab, _rm);
    /* el cuello y el torso NO giran con la cabeza: si giraran, girar para mirar seria girar el
       cuerpo entero y se leeria a torreta */
    _rv.set(S.x, cabY-RIV_CAB_R*0.92+resp*0.5, cabZ);
    _rm.compose(_rv, _rq.identity(), _rs.set(0.30, 0.52, 0.30));
    cueMalla.setMatrixAt(iCab, _rm);
    /* LOS HOMBROS TIENEN QUE SER MAS ANCHOS QUE EL ABANICO, o no se ven. El torso vive DETRAS de las
       cartas —a casi dos unidades— asi que con medio ancho de 1,30 contra las 2,12 que mide el
       abanico quedaba tapado entero, y en pantalla la cabeza salia flotando sola como un globo. Con
       2,20 los hombros asoman ocho decimas por cada lado del abanico y la cabeza se apoya en algo.
       No mas: los dos rivales estan a 3,25 del centro y con 2,9 se tocarian en el medio de la mesa. */
    _rv.set(S.x, cabY-RIV_CAB_R*1.62-0.70+resp*0.3, cabZ+0.10);
    _rm.compose(_rv, _rq.identity(), _rs.set(2.45, 1.45, 0.95));
    torMalla.setMatrixAt(iCab, _rm);
    /* LOS OJOS SALEN DE LA MATRIZ DEL CRANEO. Componiendolos aparte con su propio giro habria dos
       animaciones que mantener sincronizadas; multiplicando por la del craneo, los ojos estan en la
       cara por construccion y no hay nada que sincronizar. */
    cabMalla.getMatrixAt(iCab, _rm);
    /* PARPADEA. Es lo mas barato que existe —un seno y un umbral— y es lo unico que separa "una
       cabeza que rota" de "alguien mirandote". */
    const parp=Math.max(0, 1-Math.abs(Math.sin(t*0.41+f*3))*22);
    for(const ex of [-0.38, 0.38]){
      _rv.set(ex, 0.16, 0.90).applyMatrix4(_rm);
      _rm.decompose(_rv2, _rq, _rs);
      const eh=0.145*(1-parp*0.92);
      _rm.compose(_rv, _rq, _rs.set(0.155, eh, 0.10));
      ojoMalla.setMatrixAt(iOjo++, _rm);
      cabMalla.getMatrixAt(iCab, _rm);
    }
    iCab++;
  }
  cabMalla.count=iCab; cueMalla.count=iCab; torMalla.count=iCab; ojoMalla.count=iOjo;
  for(const m of [cabMalla, cueMalla, torMalla, ojoMalla]) m.instanceMatrix.needsUpdate=true;
}
/* a donde va la mano que agarra: primero a la carta elegida dentro de su abanico, despues a la pila */
const _rdest={x:0,y:0,z:0};
function rivalDestino(j, B){
  const lado=RIV[j].lado, q=G.manos[j].length;
  const p=sitioRival(Math.max(0,Math.min(q-1, B.idx||0)), q, lado, 0);
  /* LA PINZA VA AL BORDE DE ARRIBA DE LA CARTA, NO A SU CENTRO — que es de donde se agarra una carta
     de un abanico. Y ademas es lo que hace que la cuenta cierre: la carta se dibuja colgando esa
     misma distancia por debajo de la pinza, asi que con la mano en su sitio la carta queda
     exactamente donde ya estaba y no da un salto al engancharse. */
  _rdest.x=p.x; _rdest.y=p.y+RIV_CUELGA_Y; _rdest.z=p.z-RIV_CUELGA_Z;
  if(B.fase==='lleva'){
    /* SE INTERPOLA POR EL PROGRESO DE LA FASE Y NO POR UN LERP SUELTO. Con un lerp la mano llegaria
       tarde o temprano segun los cuadros que hubo, y la carta se baja en un instante FIJO: la mano
       tiene que estar ahi justo en ese instante, no cerca. */
    const u=Math.min(1, B.t/BOT_LLEVA);
    const s=u*u*(3-2*u);                                   // suave a la entrada y a la salida
    _rdest.x += (MESA.pilaX-_rdest.x)*s;
    _rdest.y += (1.15-_rdest.y)*s + Math.sin(s*Math.PI)*0.55;   // levanta al pasar por el medio
    _rdest.z += (MESA.centroZ-_rdest.z)*s;
  }
  return _rdest;
}
/* =========================================================================================
   EL TUTORIAL

   Se pidio obligatorio ("debes tocar play tutorial si o si al inicio") y "super bien explicado". Las
   dos cosas se resuelven igual: CADA PASO ESPERA A QUE HAGAS LA COSA. No se puede saltear, no se
   puede pasar sin haber entendido, y no hay un boton de "siguiente" que se pueda apretar sin leer.
   Es la misma forma que funciono en ECO, y por el mismo motivo: un tutorial que avanza solo se lee
   como un cartel, y un cartel se saltea.

   Y LOS SEIS PASOS NO SON SEIS PANTALLAS DE TEXTO: son seis cosas distintas que hacer.
     1  levantar la mano       → aprende que la camara lo ve
     2  pellizcar              → aprende el unico gesto del juego
     3  pellizcar una carta    → aprende a elegir
     4  pellizcar TIRAR        → aprende que hace la primera opcion
     5  una carta que NO pega  → aprende la regla, VIENDO el boton apagado
     6  pellizcar el mazo      → aprende que hacer cuando no le sirve ninguna
   El paso 5 es el que importa y es el unico que no se puede explicar con palabras: la regla del juego
   se aprende viendo que TIRAR esta apagado con esa carta y encendido con la otra.
   ========================================================================================= */
const TUT={ on:false, paso:0, t:0, hecho:false };
try{ TUT.hecho = localStorage.getItem('rezuno_tut')==='1'; }catch(e){}

const guiaEl=document.getElementById('guia'),
      guiaN=document.getElementById('guiaN'), guiaT=document.getElementById('guiaT');
function guia(n, t){
  guiaN.textContent=n||''; guiaT.innerHTML=t||'';
  document.body.classList.toggle('guia', !!t);
}

/* LA MANO DEL TUTORIAL ESTA ARMADA A MANO, carta por carta, y no repartida al azar: el paso 5 NECESITA
   una carta que no pegue con nada, y con un reparto aleatorio ese paso a veces no existe. Un tutorial
   que a veces no puede enseñar lo que tiene que enseñar no es un tutorial. */
function tutorialEmpezar(){
  repartir(7);
  G.fase='juego'; G.turno=J_VOS;
  /* pila: un 5 rojo. mano: un 5 azul (pega por numero), un 9 verde (no pega en nada) y relleno */
  G.pila=[{color:0,valor:5}]; G.color=0; G.valor=5;
  G.manos[J_VOS]=[{color:3,valor:5},{color:2,valor:9},{color:1,valor:2},{color:3,valor:7}];
  G.manos[J_IZQ]=G.mazo.splice(0,5);
  G.manos[J_DER]=G.mazo.splice(0,5);
  G.sel=-1; G.colorPide=false; G.robo=false; G.mov.length=0;
  TUT.on=true; TUT.paso=0; TUT.t=0;
  tutPintar();
}
function tutPintar(){
  const k=TUT.paso;
  if(k>6){ guia('',''); return; }
  guia(TX('t'+k+'n'), TX('t'+k));
}
/* CUAL CARTA BRILLA EN CADA PASO. Devuelve el indice de la mano que el tutorial quiere que agarres, o
   -1. El brillo lo dibuja pintarTut() y el paso lo comprueba tutTick(): los dos leen de aca, asi que
   no puede brillar una y esperarse otra. */
function tutObjetivo(){
  if(!TUT.on) return -1;
  if(TUT.paso===2 || TUT.paso===3) return 0;      // el 5 azul, que pega por numero
  if(TUT.paso===4) return 1;                      // el 9 verde, que no pega en nada
  return -1;
}
function tutTick(dt){
  if(!TUT.on) return;
  TUT.t+=dt;
  const k=TUT.paso;
  if(k===0){ if(MANO.hay || !MANO.on) pasoSig(); }
  else if(k===1){ if(MANO.pinza || !MANO.on) pasoSig(); }
  else if(k===2){ if(G.sel===0) pasoSig(); }
  else if(k===3){ if(G.sel<0 && G.pila.length>1) pasoSig(); }      // la tiro de verdad
  else if(k===4){ if(G.sel<0 && TUT.t>0.2 && !tutEsperaDeja) pasoSig(); }
  else if(k===5){ if(G.robo) pasoSig(); }
  else if(k===6){ if(TUT.t>2.6) tutorialFin(); }
}
let tutEsperaDeja=false;
function pasoSig(){
  TUT.paso++; TUT.t=0;
  /* el paso 4 arranca poniendole la carta que no pega en la mano, por si la tiro en el 3 */
  if(TUT.paso===4){
    tutEsperaDeja=true;
    if(!G.manos[J_VOS].some(c=>!pega(c,G.color,G.valor)))
      G.manos[J_VOS].unshift({color:(G.color+2)%4, valor:9});
  }
  if(TUT.paso===5){
    tutEsperaDeja=false;
    /* para el paso del mazo hace falta que NINGUNA carta pegue: si le queda una jugable, "pellizca el
       mazo" es una instruccion que contradice al propio juego */
    G.manos[J_VOS]=G.manos[J_VOS].filter(c=>!pega(c,G.color,G.valor));
    if(!G.manos[J_VOS].length) G.manos[J_VOS].push({color:(G.color+2)%4, valor:9});
    G.robo=false;
  }
  tutPintar();
}
function tutorialFin(){
  TUT.on=false; TUT.hecho=true;
  try{ localStorage.setItem('rezuno_tut','1'); }catch(e){}
  guia('','');
  G.fase='menu';
  verPantalla('menu'); pintarMenu();
}
/* EL SEGUIMIENTO DEL PASO 4 ES UNA BANDERA Y NO UN CONTADOR DE TIEMPO. Al pellizcar DEJAR, soltar()
   pone G.sel en -1, que es lo mismo que pasa al TIRAR: sin la bandera los dos casos se ven iguales y
   el paso avanzaria tirando la carta que se supone que no se puede tirar. */
function tutDejo(){ if(TUT.on && TUT.paso===4) tutEsperaDeja=false; }

/* ===================== EL BRILLO DEL TUTORIAL, EN 3D =====================
   Antes era un rectangulo dibujado alrededor de la carta. En 3D la carta esta girada y en
   perspectiva, asi que un rectangulo de pantalla ya no la sigue. Es un ARO que se pone DEBAJO de la
   carta, sobre la mesa: se ve desde cualquier angulo, no tapa la cara —que es lo que hay que leer— y
   con el pulso late sin competir con la carta. */
const tutAro=new THREE.Mesh(new THREE.RingGeometry(1.25,1.55,44),
  new THREE.MeshBasicMaterial({color:0xc47b00, transparent:true, depthWrite:false}));
tutAro.rotation.x=-Math.PI/2; tutAro.visible=false; tutAro.renderOrder=3;
/* VA DENTRO DEL GRUPO QUE GIRA CON EL JUGADOR, porque casi siempre marca una carta de SU mano: en el
   mundo se quedaria donde estaba la carta y no donde esta. Para el paso del mazo —que si es de la
   mesa— se le deshace el giro. */
manoGrupo.add(tutAro);
const _tv=new THREE.Vector3();
function pintarTut(){
  if(!TUT.on){ tutAro.visible=false; return; }
  const obj=tutObjetivo();
  let dest=null;
  if(obj>=0 && G.sel<0 && obj<G.manos[J_VOS].length){
    const g=manoGeo(G.manos[J_VOS].length);
    dest=1; tutAro.position.set(g.x0+obj*g.paso, 0.012, MESA.manoZ - CAM_MIRA[1] - 0.35);
  } else if(TUT.paso===5){
    dest=1;
    _tv.set(MESA.mazoX, 0.012, MESA.centroZ);
    manoGrupo.updateMatrixWorld(true);
    manoGrupo.worldToLocal(_tv);
    tutAro.position.copy(_tv);
  }
  if(!dest){ tutAro.visible=false; return; }
  tutAro.visible=true;
  const p=0.5+0.5*Math.sin(G.t*5.2);
  tutAro.material.opacity=0.35+0.45*p;
  tutAro.scale.setScalar(0.92+0.10*p);
}
/* VA ARRIBA DE TODO Y NO "donde corresponde tematicamente". Un let leido antes de su linea no rompe
   una funcion: rompe el modulo entero, y en este proyecto eso ya tiro el juego abajo cuatro veces.
   La regla es declarar antes del primer uso, y el primer uso de esto esta en el bucle. */
let CONGELADO=false;
/* ===================== LAS PANTALLAS ===================== */
const PANTALLAS=['pIdioma','pMenu','pFin'];
let pant='idioma';
function verPantalla(p){
  pant=p;
  for(const id of PANTALLAS) document.getElementById(id).classList.remove('ver');
  const m={ idioma:'pIdioma', menu:'pMenu', fin:'pFin' };
  if(m[p]) document.getElementById(m[p]).classList.add('ver');
  document.body.classList.toggle('jugando', p==='juego');
  if(p!=='juego') guia('','');
}
function pintarIdioma(){
  document.documentElement.lang=IDIOMA;
  document.getElementById('bTut').textContent=TX('tutorial');
  document.getElementById('bJugar').textContent=TX('jugar');
  document.getElementById('bIdioma').textContent=TX('idioma');
  document.getElementById('bCam').textContent=TX(CAM_PREF==='environment'? 'camTrasera':'camFrontal');
  document.getElementById('bOtra').textContent=TX('otra');
  document.getElementById('bMenu').textContent=TX('menu');
  pintarMenu(); pintarCam();
}
/* EL BOTON DE JUGAR ESTA BLOQUEADO HASTA QUE EL TUTORIAL ESTE HECHO, y el pie dice por que. Se pidio
   asi con todas las letras. Un boton apagado sin explicacion se lee a juego roto; con la linea de
   abajo se lee a orden. */
function pintarMenu(){
  const bj=document.getElementById('bJugar');
  bj.disabled=!TUT.hecho;
  bj.classList.toggle('lleno', TUT.hecho);
  document.getElementById('bTut').classList.toggle('lleno', !TUT.hecho);
  /* el pie dice como se sostiene el telefono con la camara elegida; si falta el tutorial, eso manda */
  document.getElementById('mPie').innerHTML = TUT.hecho
    ? (TX('menuPie')+' '+TX(CAM_PREF==='environment'? 'camPieT':'camPieF'))
    : TX('menuBloq');
}
const camAviso=document.getElementById('camAviso');
const CAM_MOTIVO={ permiso:'camErrPermiso', camara:'camErrCamara', cdn:'camErrCdn',
                   modelo:'camErrCdn', insegura:'camErrInsegura' };
/* EL MOTIVO SE ESCRIBE Y SE QUEDA. Un juego que se maneja con la camara y no la pide se ve roto, y
   sin decir por que no hay nada que el jugador pueda hacer al respecto. */
function pintarCam(){
  const bc=document.getElementById('bCam');
  if(bc) bc.textContent=TX(CAM_PREF==='environment'? 'camTrasera':'camFrontal');
  if(!camAviso) return;
  camAviso.classList.remove('bien','mal');
  /* EL AVISO DICE QUE HACER CON LA MANO, Y ESO CAMBIA CON LA CAMARA. Con la trasera la mano va DETRAS
     del telefono y con la frontal delante: es la unica instruccion que el jugador necesita y depende
     de cual camara toco, no de cual se pidio. */
  const tras = (MANO.usa||CAM_PREF)==='environment';
  if(MANO.estado==='carga'){ camAviso.textContent=TX('camPide'); return; }
  if(MANO.estado==='lista'){ camAviso.textContent=TX(tras?'camOkT':'camOkF');
                             camAviso.classList.add('bien'); return; }
  if(MANO.error){ camAviso.textContent=TX(CAM_MOTIVO[MANO.error]||'camNo'); camAviso.classList.add('mal'); return; }
  camAviso.textContent=TX('camNo');
}
/* CAMBIAR DE CAMARA REARRANCA EL DETECTOR ENTERO, y no es pereza: el flujo de video, el espejo y el
   detector de caras dependen de cual es, asi que media docena de cosas tendrian que reconciliarse en
   caliente. Se sueltan las pistas, se pone el estado en cero y se vuelve a pedir. */
/* Y NO SE PUEDE TOCAR DOS VECES MIENTRAS ARRANCA. Medido: tocandolo de nuevo con el detector a
   medio abrir quedan DOS manosIniciar() en vuelo, y la que termina segunda pisa el espejo y el
   cartel de la primera — o sea que el juego queda diciendo una camara y espejando la otra. */
let _camOcupado=false;
document.getElementById('bCam').onclick=async()=>{
  if(_camOcupado) return;
  _camOcupado=true;
  CAM_PREF = (CAM_PREF==='environment')? 'user' : 'environment';
  try{ localStorage.setItem('rezuno_cam', CAM_PREF); }catch(e){}
  if(MANO.vid && MANO.vid.srcObject){
    for(const t of MANO.vid.srcObject.getTracks()) try{ t.stop(); }catch(e){}
    MANO.vid.srcObject=null;
  }
  if(MANO.det){ try{ MANO.det.close(); }catch(e){} MANO.det=null; }
  if(CARA.det){ try{ CARA.det.close(); }catch(e){} CARA.det=null; CARA.on=false; CARA.hay=false; }
  MANO.on=false; MANO.hay=false; MANO.hayPts=false; MANO.estado='no'; MANO.error=''; MANO.usa='';
  pintarIdioma();
  try{ await manosIniciar(); } finally{ _camOcupado=false; }
  pintarCam(); pintarMenu();
};
(function(){
  const c=document.getElementById('idBotones');
  for(const [cod,nom] of IDIOMAS){
    const b=document.createElement('button'); b.className='bot'; b.textContent=nom;
    /* el idioma es el primer toque de la sesion, asi que es donde se enciende el audio: ningun
       navegador deja sonar nada sin un gesto */
    b.onclick=()=>{ audioIniciar(); IDIOMA=cod;
      try{ localStorage.setItem('rezuno_idioma',cod); }catch(e){}
      pintarIdioma(); verPantalla('menu'); };
    c.appendChild(b);
  }
})();
document.getElementById('bIdioma').onclick=()=>verPantalla('idioma');

/* LA CAMARA SE PIDE AL EMPEZAR, no en un ajuste. En RECREO el permiso colgaba de un boton chico que
   ya aparecia elegido, asi que nadie lo tocaba y el juego parecia no usar la camara. Aca cuelga de
   los dos botones que todos tocan, y si falla se juega tocando la pantalla. */
async function arrancar(esTutorial){
  audioIniciar();
  if(!MANO.on && MANO.estado!=='carga'){ await manosIniciar(); pintarCam(); }
  if(esTutorial){ verPantalla('juego'); tutorialEmpezar(); }
  else { TUT.on=false; guia('',''); repartir((Date.now()&0x7fffffff)||1);
         G.fase='juego'; verPantalla('juego'); }
}
document.getElementById('bTut').onclick=()=>arrancar(true);
document.getElementById('bJugar').onclick=()=>arrancar(false);
document.getElementById('salir').onclick=()=>{ G.fase='menu'; TUT.on=false; guia('','');
                                              verPantalla('menu'); pintarMenu(); };
document.getElementById('bOtra').onclick=()=>arrancar(false);
document.getElementById('bMenu').onclick=()=>{ verPantalla('menu'); pintarMenu(); };

/* ===================== LO QUE HACE UN PELLIZCO =====================
   UN SOLO SITIO PARA LOS DOS CAMINOS. El pellizco de la camara y el toque del dedo terminan los dos
   aca, con las mismas coordenadas de diseño. Si fueran dos funciones, el respaldo tactil se
   desincronizaria del juego de verdad en cuanto se agregue una zona nueva — y el respaldo es
   justamente lo que nadie prueba. */
function activar(fx, fy){
  if(G.fase!=='juego') return false;
  const o=pickEn(fx, fy);
  if(!o) return false;
  const u=o.userData;
  if(!u.activo) return false;
  if(u.tipo==='carta') return seleccionar(u.i);
  if(u.tipo==='tirar') return tirarSel();
  if(u.tipo==='dejar'){ const r=soltar(); tutDejo(); return r; }
  if(u.tipo==='color') return elegirColor(u.i);
  if(u.tipo==='mazo')  return robarJugador();
  return false;
}
/* EL RESPALDO TACTIL NO ES UN EXTRA: sin camara —permiso negado, sin camara, http— el juego seria
   imposible de jugar, y eso no es degradar, es romperse. */
lienzo.addEventListener('pointerdown', e=>{
  /* a fraccion de pantalla, que es la MISMA unidad en la que llega la mano: asi el toque y el
     pellizco entran por la misma funcion y no pueden desincronizarse */
  const r=marco.getBoundingClientRect();
  activar((e.clientX-r.left)/Math.max(1,r.width), (e.clientY-r.top)/Math.max(1,r.height));
}, {passive:true});

/* ===================== EL BUCLE =====================
   Un solo reloj y un solo dibujo. El pellizco se consume ACA y no dentro del dibujo: leerlo mientras
   se pinta significaria que el orden en que se dibujan las zonas decide cual gana, y ese es el tipo
   de defecto que aparece recien cuando se agrega un boton nuevo seis meses despues. */
let ultimo=performance.now();
function bucle(){
  requestAnimationFrame(bucle);
  const ahora=performance.now();
  const dt=Math.min(0.25, (ahora-ultimo)/1000); ultimo=ahora;
  if(G.fase==='juego'){
    /* LA CAMARA SE MUEVE ANTES DE TODO LO DEMAS. El rayo del pellizco sale de la camara, asi que si
       se moviera despues, el pellizco de este cuadro se resolveria con la camara del anterior. */
    /* la ganancia 1,2 hace que unos diecisiete grados de cabeza lleguen al tope de veinte de vista:
       girar la cabeza mas que eso para mirar una pantalla que esta al frente no lo hace nadie */
    /* EL FILTRO DE LA MANO CORRE ACA, EN CADA CUADRO. La camara mide 24 veces por segundo en un
       telefono y el juego dibuja 60: entre medicion y medicion los 21 puntos se siguen acercando al
       ultimo destino, asi que la mano se mueve a 60 aunque se la mida a 24. Y va ANTES de consumir el
       pellizco, porque el punto al que se apunta tiene que ser el de este cuadro y no el anterior. */
    manosFiltrar();
    camaraGiro(CARA.hay? CARA.giro*1.2 : 0, dt);
    if(tomarPinza()) activar(MANO.x, MANO.y);
    /* CONGELADO detiene la PARTIDA pero no el dibujo. Es para las pruebas: para fotografiar el
       instante exacto en que una mano esta agarrando una carta hay que poder parar el reloj de la
       partida y dejar que las animaciones —que son lerps hacia un destino— terminen de asentarse.
       Sin esto la foto sale del cuadro siguiente al que se pidio, o sea de otro momento. */
    if(!CONGELADO){ partidaTick(dt); tutTick(dt); }
    /* LAS MANOS SE CALCULAN ANTES DE ARMAR LA MESA, y el orden importa. La carta que un rival esta
       agarrando se coloca en el punto de la pinza de su mano; si la mesa se armara primero, esa carta
       usaria la pinza del cuadro ANTERIOR y quedaria un cuadro atras de la mano que la sostiene.
       Un cuadro de desfase a 60 son 17 ms, pero la mano viaja medio metro en medio segundo: la carta
       se veria despegada del pulgar justo en el momento en que hay que mirarla. */
    manosPintar(dt);
    armarMesa();
    pintarTut();
    pintarAro();
    render.render(escena, camara);
  }
  /* LA PANTALLA DE FINAL SE MIRA AFUERA DEL `if`, Y ESE ERA UN DEFECTO DE VERDAD. Estaba adentro, o
     sea que solo se enteraba en el mismo cuadro en que la partida terminaba. Con el pellizco eso
     siempre pasa —el pellizco se consume dentro del bucle—, pero el RESPALDO TACTIL entra por
     pointerdown, que corre fuera: ganando de un toque, `fase` quedaba en 'fin' y en el cuadro
     siguiente el `if` de arriba ya era falso, asi que nadie mostraba nada. El juego se quedaba
     congelado en la ultima imagen. Encontrado fotografiando el final, no leyendo. */
  if(G.fase==='fin' && pant!=='fin'){
    const gano=G.gana===J_VOS;
    document.getElementById('finT').textContent = gano? TX('ganaste')
      : TX('perdiste',{n:TX(G.gana===J_IZQ?'bot1':'bot2')});
    document.getElementById('finS').textContent = gano? TX('ganasteS') : TX('perdisteS');
    verPantalla('fin');
  }
  pintarHud();
}

/* ===================== LOS ROTULOS =====================
   SE ESCRIBEN SOLO CUANDO CAMBIAN. Escribir en el DOM cada cuadro obliga al navegador a recalcular el
   layout sesenta veces por segundo para poner el mismo texto: es trabajo tirado y ademas se mezcla con
   las lecturas de tamaño del render. Se guarda lo ultimo escrito y se compara. */
const _hud={};
function ponerTexto(el, t){ if(!el) return; if(_hud[el.id]===t) return; _hud[el.id]=t; el.textContent=t; }
function ponerClase(el, c, si){ if(!el) return; const k=el.id+'|'+c;
  if(_hud[k]===si) return; _hud[k]=si; el.classList.toggle(c, si); }
function pintarHud(){
  const mk=document.getElementById('marcador');
  ponerTexto(mk, (G.fase==='juego' && TUT.on)? 'TUTORIAL' : '');
  if(G.fase!=='juego') return;
  const rivs=[[J_IZQ,'bot1',1],[J_DER,'bot2',2]];
  for(const [j,clave,k] of rivs){
    const n=G.manos[j].length;
    ponerTexto(document.getElementById('rivN'+k), TX(clave));
    ponerTexto(document.getElementById('rivC'+k), n===1? TX('unaCarta') : TX('cartas',{n}));
    ponerClase(document.getElementById('rivC'+k), 'uno', n===1);
    const cont=document.getElementById('rivN'+k).parentNode;
    cont.classList.toggle('juega', G.turno===j);
  }
  document.body.classList.toggle('eligiendo', G.sel>=0 || G.colorPide);
  document.body.classList.toggle('pidecolor', G.colorPide);
  const t=document.getElementById('turnoT'), a=document.getElementById('turnoA');
  const mio=G.turno===J_VOS;
  ponerTexto(t, G.colorPide? TX('color')
                : (mio? TX('tuTurno') : TX('turnoDe',{n:TX(G.turno===J_IZQ?'bot1':'bot2')})));
  ponerClase(t, 'rival', !mio);
  /* LA LINEA DE AYUDA DICE QUE HACER AHORA Y NO COMO SE JUEGA. Cambia con el estado: agarrar, elegir
     entre los dos botones, o elegir color. Un texto fijo se deja de leer al segundo turno. */
  let ay='';
  if(G.avisoT>0) ay=G.aviso;
  else if(mio && G.colorPide) ay=TX('ayudaColor');
  else if(mio && G.sel>=0) ay=TX('ayudaTirar');
  else if(mio) ay=TX('ayudaMano');
  ponerTexto(a, ay);
}
pintarIdioma(); verPantalla('idioma');
bucle();
/* =========================================================================================
   LOS GANCHOS DE PRUEBA

   Nada de esto lo usa el juego. Estan para poder AFIRMAR cosas con numeros en vez de mirar una
   captura: que las 108 cartas estan, que una partida entera termina, que el boton apagado y la regla
   son la misma cuenta, que un pellizco de mentira cae en la zona que se ve, y que el tutorial se
   puede completar de punta a punta sin camara.
   ========================================================================================= */
window.__rez={
  estado:()=>({ pant, fase:G.fase, turno:G.turno, gana:G.gana, color:G.color, valor:G.valor,
                manos:G.manos.map(m=>m.length), mazo:G.mazo.length, pila:G.pila.length,
                sel:G.sel, colorPide:G.colorPide, robo:G.robo, giro:G.giro,
                tut:{ on:TUT.on, paso:TUT.paso, hecho:TUT.hecho } }),
  idioma:(c)=>{ IDIOMA=c; pintarIdioma(); return IDIOMA; },
  pantalla:(p)=>{ verPantalla(p); return pant; },
  /* ---- el mazo ---- */
  mazoVer:()=>{
    const m=mazoNuevo();
    const cuenta={};
    for(const c of m){ const k=(c.color===4?'W':NOMBRE_COL[c.color])+':'+c.valor;
                       cuenta[k]=(cuenta[k]||0)+1; }
    return { total:m.length, ceros:m.filter(c=>c.valor===0).length,
             comodines:m.filter(c=>c.color===4).length,
             mas4:m.filter(c=>c.valor===MAS4).length,
             porColor:[0,1,2,3].map(k=>m.filter(c=>c.color===k).length), cuenta };
  },
  /* ---- la regla, aislada ---- */
  pega:(c, col, val)=>pega(c, col, val),
  /* ---- una partida ---- */
  repartir:(s)=>{ repartir(s||1); G.fase='juego'; verPantalla('juego'); return window.__rez.estado(); },
  /* pone una mano y una pila a mano, para poder fotografiar y probar un caso concreto —el comodin,
     la ultima carta— sin tener que buscar una semilla que lo produzca */
  poner:(mano, colorMesa, valorMesa)=>{
    if(mano) G.manos[J_VOS]=mano.map(c=>({color:c.color, valor:c.valor}));
    if(colorMesa!=null) G.color=colorMesa;
    if(valorMesa!=null) G.valor=valorMesa;
    /* la pila TAMBIEN, o el gancho mentiria: en el juego de verdad el color activo y la carta de
       arriba salen los dos de jugarCarta() y no pueden discrepar */
    if(colorMesa!=null && valorMesa!=null && colorMesa<4) G.pila.push({color:colorMesa, valor:valorMesa});
    G.sel=-1; G.colorPide=false; G.turno=J_VOS; G.fase='juego';
    return window.__rez.estado();
  },
  mano:(j)=>G.manos[j||0].map(c=>({color:c.color, valor:c.valor,
                                   pega:pega(c,G.color,G.valor)})),
  /* JUEGA LA PARTIDA ENTERA SOLA, y el jugador automatico usa EL MISMO CAMINO que una persona:
     seleccionar() y tirarSel(), no jugarCarta() directo. Llamando a la funcion de adentro no se
     probaria nada de lo que puede estar mal, que es justamente si el boton apagado deja pasar. */
  jugarSolo:(tope)=>{
    const log=[]; let n=0, ilegales=0;
    while(G.fase==='juego' && n++<(tope||6000)){
      if(G.turno!==J_VOS){ partidaTick(1/60); continue; }
      if(G.colorPide){ elegirColor(botColor(J_VOS)); continue; }
      const i=botElegir(J_VOS);
      if(i<0){
        if(!G.robo){ robarJugador(); }
        else { G.turno=siguiente(J_VOS); G.robo=false; }
        continue;
      }
      seleccionar(i);
      const antes=G.pila.length;
      const c=G.manos[J_VOS][i];
      const deberia=pega(c,G.color,G.valor);
      tirarSel();
      if(G.colorPide){ elegirColor(botColor(J_VOS)); }
      const bajo=G.pila.length>antes;
      /* LA COMPROBACION QUE IMPORTA: nunca puede bajar una carta que la regla dice que no pega */
      if(bajo && !deberia) ilegales++;
      if(!bajo && G.sel>=0) soltar();
    }
    return { vueltas:n, fase:G.fase, gana:G.gana, ilegales,
             manos:G.manos.map(m=>m.length), log };
  },
  /* ---- LO QUE SE VE Y LO QUE SE PELLIZCA SON EL MISMO OBJETO ----
     En 3D no hay rectangulos: hay objetos, y el rayo devuelve el objeto. Estos ganchos PROYECTAN el
     centro de cada objeto a la pantalla y despues tiran el rayo por ahi, o sea que recorren el
     camino entero —mundo, camara, proyeccion, rayo— y no un atajo. Si la camara mirara a otro lado,
     esta prueba fallaria, que es exactamente lo que tiene que hacer. */
  zonas:()=>{ armarMesa();
    /* EL ARBOL ENTERO, NO SOLO EL OBJETO. updateMatrixWorld() sobre un hijo NO actualiza a su padre,
       y desde que el abanico vive en un grupo que gira con el jugador, actualizar solo la carta la
       proyecta con la matriz VIEJA del grupo. Es el mismo defecto que ya habia costado una prueba en
       el rayo, con otro disfraz: medir sin poner el arbol al dia. */
    escena.updateMatrixWorld(true); camara.updateMatrixWorld(true);
    const v=new THREE.Vector3();
    return PICK.map(o=>{ o.updateMatrixWorld(true);
      v.setFromMatrixPosition(o.matrixWorld).project(camara);
      return { t:o.userData.tipo, i:o.userData.i, activo:!!o.userData.activo,
               px:+((v.x*0.5+0.5)).toFixed(3), py:+((-v.y*0.5+0.5)).toFixed(3) }; }); },
  pantallaDe:(tipo,i)=>{
    /* SE DEJA ASENTAR LA ANIMACION ANTES DE PROYECTAR. Las cartas se acercan a su sitio con un lerp,
       asi que en el cuadro siguiente a repartir todavia estan a mitad de camino: apuntar ahi es
       apuntar a donde la carta ESTUVO. Una persona espera a que se acomoden; la prueba tambien. */
    /* SESENTA Y NO DIECISEIS. Con 16 pasadas el lerp queda al 1,5% del camino, y cuando la mano
       cambia de tamaño una carta se mueve tres unidades: ese 1,5% son 0,046, o sea DEL MISMO TAMAÑO
       que el escalon de 0,05 que decide cual carta esta delante. Medido: apuntar a la carta 3 daba
       la 4 en la primera jugada de algunas partidas y no en otras — la diferencia era de donde venia
       la carta. Con 60 pasadas el residuo es 4 diezmillonesimas. */
    for(let k=0;k<60;k++) armarMesa();
    camara.updateMatrixWorld(true);
    const o=PICK.filter(q=>q.userData.tipo===tipo && (i==null||q.userData.i===i)).pop();
    if(!o) return null;
    o.updateMatrixWorld(true);
    /* PARA UNA CARTA SE APUNTA A SU FRANJA VISIBLE Y NO A SU CENTRO, que es donde apunta una persona:
       con el abanico superpuesto el centro de una carta esta debajo de la siguiente. El punto sale de
       la misma geometria que dibuja el abanico, no de un numero puesto a mano. */
    const v=new THREE.Vector3();
    if(tipo==='carta') v.copy(puntoMano(o, o.userData.i, G.manos[J_VOS].length));
    else v.setFromMatrixPosition(o.matrixWorld);
    v.project(camara);
    return { x:v.x*0.5+0.5, y:-v.y*0.5+0.5, activo:!!o.userData.activo };
  },
  zonaEn:(fx,fy)=>{ armarMesa(); const o=pickEn(fx,fy);
                    return o? {t:o.userData.tipo,i:o.userData.i,activo:!!o.userData.activo} : null; },
  /* pellizca EN LA PANTALLA, sobre el centro proyectado del objeto: el mismo camino que la camara */
  pellizcarZona:(tipo, i)=>{
    const p=window.__rez.pantallaDe(tipo,i);
    if(!p) return 'no hay '+tipo;
    const o=pickEn(p.x,p.y);
    return { hizo:activar(p.x,p.y), apunta:o? o.userData.tipo+':'+o.userData.i : null,
             pantalla:[+p.x.toFixed(3),+p.y.toFixed(3)], activo:p.activo };
  },
  /* ---- la mano de mentira: entra por el mismo camino que la de verdad ---- */
  /* UNA MANO DE MENTIRA CON LOS VEINTIUN PUNTOS EN SU SITIO. La primera version ponia todos los
     puntos encima del mismo lugar salvo cuatro, y servia para probar el pellizco —que solo mira
     esos cuatro— pero al dibujarla en 3D salia un palito: no se podia juzgar nada de la mano. Esta
     tiene la muñeca, la palma y los cinco dedos con sus falanges, con las proporciones de una mano
     abierta de verdad. */
  manoFalsa:(cx, cy, pinza, esc)=>{
    const S=esc==null? 1 : esc;
    const lm=new Array(21);
    const P=(x,y,z)=>({x:cx+x*S, y:cy+y*S, z:(z||0)*S});
    /* ===== LAS FALANGES MIDEN LO QUE MIDEN EN UNA MANO =====
       La primera version daba a los tres tramos de cada dedo el MISMO largo, y corto: 0,30 del largo
       de la palma cada uno. Con los radios nuevos —que salen de una mano adulta— eso deja cada tramo
       midiendo dos veces su propio grosor, y un cilindro de relacion 2 entre dos esferas se ve como
       una CUENTA, no como una falange. O sea que la mano de mentira se veia a collar aunque la de
       verdad no, y una prueba que no representa lo que se mira no sirve para mirarlo.
       Ahora los tres tramos van 0,45 · 0,27 · 0,18 de la palma, que es la proporcion de un dedo de
       verdad: el de la base es el largo y la punta es la corta. */
    const PL=0.115;                                         // el largo de la palma, en el marco
    lm[0]=P(0, PL, 0);                                      // muñeca
    /* los cuatro nudillos con su arco: el del medio es el mas alto, el menique el mas bajo */
    const nud=[[-0.052,0.012],[-0.018,-0.005],[0.016,-0.001],[0.048,0.018]];
    /* el largo de cada dedo en unidades de palma; el menique es notablemente mas corto */
    const largo=[[0.44,0.26,0.17],[0.48,0.29,0.18],[0.45,0.27,0.17],[0.34,0.21,0.15]];
    for(let d=0; d<4; d++){
      const b=5+d*4, ang=(-0.16+d*0.11);
      let x=nud[d][0], y=nud[d][1];
      lm[b]=P(x, y, -0.01);
      for(let k=0;k<3;k++){
        const t=largo[d][k]*PL;
        x+=Math.sin(ang)*t; y-=Math.cos(ang)*t;
        lm[b+k+1]=P(x, y, -0.012*(k+1));
      }
    }
    /* el pulgar sale hacia el costado y hacia adelante, que es lo que lo distingue de los otros */
    {
      let x=-0.048, y=0.082;
      lm[1]=P(x, y, 0.004);
      const dx=-0.66, dy=-0.75, lg=[0.42,0.28,0.22];
      for(let k=0;k<3;k++){
        x+=dx*lg[k]*PL; y+=dy*lg[k]*PL;
        lm[2+k]=P(x, y, 0.006*(k+1));
      }
    }
    if(pinza){
      /* pellizcar es llevar la punta del pulgar a la punta del indice: se mueven LAS DOS puntas al
         punto medio, que es lo que hace una mano */
      const mx=(lm[4].x+lm[8].x)/2, my=(lm[4].y+lm[8].y)/2, mz=(lm[4].z+lm[8].z)/2;
      lm[4]={x:mx-0.004*S, y:my, z:mz}; lm[8]={x:mx+0.004*S, y:my, z:mz};
      lm[3]={x:(lm[2].x+lm[4].x)/2, y:(lm[2].y+lm[4].y)/2, z:(lm[2].z+lm[4].z)/2};
      lm[7]={x:(lm[6].x+lm[8].x)/2, y:(lm[6].y+lm[8].y)/2, z:(lm[6].z+lm[8].z)/2};
    }
    return lm;
  },
  /* EL ESPEJO ES UN PARAMETRO Y NO UNA CONSTANTE, desde que la camara puede ser la trasera. Por
     omision va SIN espejo, que es el caso de la trasera —la de por omision del juego—; pasando true
     se prueba el camino de la frontal por el mismo gancho. */
  manoInyectar:(cx, cy, pinza, t, esp)=>{
    MANO.on=true; MANO.espejo=!!esp;
    manosInyectar(window.__rez.manoFalsa(cx,cy,pinza), t==null? performance.now() : t);
    return { x:+MANO.x.toFixed(3), y:+MANO.y.toFixed(3), crudo:+MANO.crudo.toFixed(3),
             pinza:MANO.pinza, nueva:MANO.pinzaNueva };
  },
  /* EL RETARDO EN REGIMEN: se mueve la mano de mentira a velocidad constante y se mide cuanto atras
     va el aro cuando ya se estabilizo. Es el numero que decide si apuntar a una carta se siente
     pegado o pastoso. Se devuelve en fraccion de pantalla y en milisegundos. */
  manoRampa:(vel, cuadros)=>{
    fpReset();
    const v=vel==null? 0.5 : vel;          // fracciones de pantalla por segundo
    const dt=16, n=cuadros||90;
    let t=performance.now(), x=0.2;
    /* SE CALIBRA EL DESVIO ANTES DE MEDIR EL RETARDO. El punto que apunta es el medio entre el pulgar
       y el indice, y en una mano abierta ese medio NO cae en el centro de la mano: esta corrido unos
       centesimos. Sin calibrar, ese corrimiento constante se sumaba al retardo y el gancho reportaba
       193 ms de atraso donde hay 6 — o sea que la prueba media la forma de la mano y no el filtro. */
    for(let k=0;k<70;k++){ t+=dt; window.__rez.manoInyectar(x,0.5,false,t); }
    const off=MANO.x-x;
    for(let k=0;k<n;k++){ t+=dt; x+=v*dt/1000; window.__rez.manoInyectar(x,0.5,false,t); }
    const err=Math.abs((x+off)-MANO.x);
    return { vel:v, cuadros:n, real:+(x+off).toFixed(4), aro:+MANO.x.toFixed(4),
             desvio:+off.toFixed(4),
             retardoFrac:+err.toFixed(4), retardoMs:+(err/v*1000).toFixed(1) };
  },
  /* ===== LA INTERPOLACION: LA MANO SE MUEVE ENTRE MEDICION Y MEDICION =====
     Es LA prueba de la optimizacion. Se inyecta UNA sola medicion nueva —o sea, se simula que la
     camara entrego un cuadro y despues se calla— y se corren n cuadros de dibujo sin ninguna
     medicion mas. Si el punto se queda quieto, bajar el detector a 24 Hz dejaria la mano moviendose
     a tirones; si sigue acercandose al destino, la mano va a 60 aunque se la mida a 24. */
  /* ===== LA INTERPOLACION: LA MANO SE MUEVE ENTRE MEDICION Y MEDICION =====
     Es LA prueba de la optimizacion, y se hace en REGIMEN y no con un salto: se mueve la mano de
     mentira a velocidad constante, se la MIDE cada 42 ms —los 24 Hz del detector— y se DIBUJA cada
     16,7 —los 60 del juego—. Despues se mira, cuadro de dibujo por cuadro de dibujo, cuantos movieron
     el punto y cuanto lo movieron.
     Sin interpolacion solo pueden moverse los cuadros que caen justo despues de una medicion, o sea
     24 de cada 60: el 40%, y a saltos de dos cuadros y medio. Con interpolacion se mueven todos y el
     paso es parejo. `pasoMax/pasoMedio` es el numero que lo dice: 1 es perfectamente parejo. */
  manoInterp:(vel, pred)=>{
    const antes=PRED_ON;
    if(pred!=null) PRED_ON=!!pred;
    fpReset();
    const v=vel==null? 0.6 : vel;
    const PM=1000/24, PD=1000/60;
    let t=performance.now(), x=0.2, tMed=t;
    let ant=null, mueven=0, n=0, sum=0, mx=0;
    for(let k=0;k<180;k++){
      t+=PD;
      while(tMed+PM<=t){ tMed+=PM; x+=v*PM/1000; window.__rez.manoInyectar(x,0.5,false,tMed); }
      manosFiltrar(t);
      if(k>90){
        if(ant!==null){ const d=Math.abs(MANO.x-ant); if(d>1e-6) mueven++; sum+=d; mx=Math.max(mx,d); n++; }
        ant=MANO.x;
      }
    }
    PRED_ON=antes;
    const medio=sum/Math.max(1,n);
    return { vel:v, prediccion:(pred==null? antes : !!pred), cuadros:n, mueven,
             pctMueven:+(mueven/Math.max(1,n)).toFixed(3),
             pasoMedio:+medio.toFixed(5), pasoMax:+mx.toFixed(5),
             desparejo:+(mx/Math.max(1e-9,medio)).toFixed(2) };
  },
  hz:()=>({ mano:MANO_HZ, cara:CARA_HZ, grueso:(()=>{ try{
              return window.matchMedia('(pointer:coarse)').matches; }catch(e){ return null; } })() }),
  /* EL TEMBLOR: mano quieta con ruido, y cuanto de ese ruido llega al aro. Es la otra mitad de la
     pelea: un filtro que no atenua deja el aro vibrando encima de las cartas. */
  manoTemblor:(ruido, cuadros)=>{
    fpReset();
    const r=ruido==null? 0.006 : ruido, n=cuadros||240;
    let t=performance.now(), S=12345;
    const az=()=>{ S=(S*1103515245+12345)&0x7fffffff; return S/0x7fffffff*2-1; };
    /* EL RUIDO SE MIDE ALREDEDOR DE LA MEDIA MEDIDA Y NO ALREDEDOR DE 0,5. El punto que apunta esta
       corrido respecto del centro de la mano —el medio entre pulgar e indice no es el centro— asi que
       restarle 0,5 mete ese corrimiento constante adentro de la desviacion: el gancho reportaba que
       el filtro AMPLIFICABA el temblor veinticinco veces cuando lo atenua tres. Se recogen las dos
       series y se calcula su desviacion sobre su propia media. */
    const ent=[], sal=[];
    for(let k=0;k<n;k++){
      t+=16; const x=0.5+az()*r;
      window.__rez.manoInyectar(x,0.5,false,t);
      if(k>60){ ent.push(x); sal.push(MANO.x); }
    }
    const desv=(A)=>{ const m=A.reduce((a,b)=>a+b,0)/A.length;
                      return Math.sqrt(A.reduce((a,b)=>a+(b-m)*(b-m),0)/A.length); };
    const de=desv(ent), ds=desv(sal);
    return { ruido:r, cuadros:n, entra:+de.toFixed(5), sale:+ds.toFixed(5),
             atenua:+(de/Math.max(1e-9,ds)).toFixed(2) };
  },
  /* ---- LA CARA: SOLO MUEVE LA VISTA ---- */
  caraVer:()=>({ on:CARA.on, hay:CARA.hay, giro:+CARA.giro.toFixed(4), crudo:+CARA.crudo.toFixed(4),
                 medidas:CARA.medidas, ms:+CARA.msDet.toFixed(2), error:CARA.error,
                 camGiro:+camGiro.toFixed(4), grados:+(camGiro*180/Math.PI).toFixed(1),
                 cam:[+camara.position.x.toFixed(2), +camara.position.z.toFixed(2)] }),
  /* se inyecta un giro de cabeza y se deja que la vista lo siga, para poder medir hasta donde llega
     y comprobar que la mesa no se sale del cuadro en los extremos */
  caraInyectar:(giro, cuadros)=>{
    CARA.on=true; CARA.hay=true; CARA.crudo=giro; CARA.giro=giro;
    for(let k=0;k<(cuadros||120);k++) camaraGiro(giro*1.6, 1/60);
    armarMesa();
    return { pedido:giro, camGiro:+camGiro.toFixed(4), grados:+(camGiro*180/Math.PI).toFixed(1),
             encuadre:window.__rez.extremos(true) };
  },
  /* donde cae en pantalla cada blanco, uno por uno: para poder ver CUAL se sale del cuadro al girar
     en vez de deducirlo del rectangulo que los envuelve a todos */
  puntos:()=>{ armarMesa(); escena.updateMatrixWorld(true);
    const v=new THREE.Vector3();
    return PICK.map(o=>{ o.updateMatrixWorld(true);
      v.setFromMatrixPosition(o.matrixWorld).project(camara);
      return [o.userData.tipo+':'+o.userData.i, +(v.x*0.5+0.5).toFixed(3)]; }); },
  caraSoltar:()=>{ CARA.hay=false; CARA.giro=0;
                   for(let k=0;k<160;k++) camaraGiro(0,1/60); return window.__rez.caraVer(); },
  /* ---- LAS MANOS DIBUJADAS ---- */
  manos3D:()=>(manosPintar(1/60), { articulaciones:artMalla.count, huesos:hueMalla.count,
                 palmas:palMalla.count, tope:[M_ART, M_HUE, M_PAL],
                 tuya:!!(MANO.on&&MANO.hay&&MANO.hayPts),
                 cabezas:cabMalla.count, ojos:ojoMalla.count,
                 alcance:[J_IZQ,J_DER].map(j=>RIV[j]? +RIV[j].alc.toFixed(2) : 0),
                 cierre:[J_IZQ,J_DER].map(j=>RIV[j]? +RIV[j].cierre.toFixed(2) : 0) }),
  /* proyecta la punta del indice dibujada y la compara con el punto que APUNTA: si se separan, el
     jugador ve su pinza en un lugar y agarra en otro */
  manoCoincide:()=>{
    if(!MANO.hayPts) return null;
    manosPintar(1/60); camara.updateMatrixWorld(true);
    const h=2*Math.tan(camara.fov*Math.PI/360)*Math.abs(MANO_Z), w=h*camara.aspect;
    const z0=MANO.pts[2];
    const pun=(k)=>{ const fz=MANO.pts[k*3+2]-z0, prof=MANO_Z-fz*MANO_PROF;
      const hz=2*Math.tan(camara.fov*Math.PI/360)*Math.abs(prof), wz=hz*camara.aspect;
      return new THREE.Vector3((MANO.pts[k*3]-0.5)*wz, -(MANO.pts[k*3+1]-0.5)*hz, prof)
        .applyMatrix4(camara.matrixWorld).project(camara); };
    const a=pun(4), b=pun(8);
    const px=((a.x+b.x)/2)*0.5+0.5, py=-((a.y+b.y)/2)*0.5+0.5;
    return { dibujo:[+px.toFixed(4), +py.toFixed(4)], apunta:[+MANO.x.toFixed(4), +MANO.y.toFixed(4)],
             separacion:+Math.hypot(px-MANO.x, py-MANO.y).toFixed(5) };
  },
  /* ===== LOS RIVALES, EN COORDENADAS DE PANTALLA =====
     Un rival "se ve bien" no es una opinion: es que la cabeza este ENTERA dentro del cuadro, que no
     quede tapada por su propio abanico, y que las dos manos entren. Las tres cosas son numeros. */
  rivales:()=>{
    manosPintar(1/60); armarMesa();
    escena.updateMatrixWorld(true); camara.updateMatrixWorld(true);
    const v=new THREE.Vector3();
    const pr=(x,y,z)=>{ v.set(x,y,z).project(camara);
                        return [ +(v.x*0.5+0.5).toFixed(3), +(-v.y*0.5+0.5).toFixed(3) ]; };
    const out=[];
    for(const [j,lado] of [[J_IZQ,-1],[J_DER,1]]){
      const R=RIV[j]; if(!R) continue;
      const m=new THREE.Matrix4(), p=new THREE.Vector3(), q=new THREE.Quaternion(), e=new THREE.Vector3();
      cabMalla.getMatrixAt(0+(lado>0?1:0), m); m.decompose(p,q,e);
      const q2=G.manos[j].length;
      /* la caja del abanico: la primera y la ultima carta, arriba y abajo */
      const caj={x:[9,-9], y:[9,-9]};
      for(const i of [0, q2-1]){
        const st=sitioRival(i,q2,lado,G.t);
        for(const dy of [-CARTA_H/2, CARTA_H/2]) for(const dx of [-CARTA_W/2, CARTA_W/2]){
          const w=pr(st.x+dx, st.y+dy*Math.cos(st.rx), st.z-dy*Math.sin(st.rx));
          caj.x[0]=Math.min(caj.x[0],w[0]); caj.x[1]=Math.max(caj.x[1],w[0]);
          caj.y[0]=Math.min(caj.y[0],w[1]); caj.y[1]=Math.max(caj.y[1],w[1]);
        }
      }
      const arriba=pr(p.x, p.y+e.y, p.z), abajo=pr(p.x, p.y-e.y, p.z);
      const izq=pr(p.x-e.x, p.y, p.z), der=pr(p.x+e.x, p.y, p.z);
      /* las manos: la muñeca y la punta del indice de cada una, sacadas de los puntos dibujados */
      out.push({ j, cabeza:{ centro:pr(p.x,p.y,p.z), arriba, abajo, izq, der,
                             entra: arriba[1]>0.02 && abajo[1]<0.98 && izq[0]>0.02 && der[0]<0.98,
                             sobreAbanico: abajo[1] < caj.y[0] },
                 abanico:{ x:[+caj.x[0].toFixed(3), +caj.x[1].toFixed(3)],
                           y:[+caj.y[0].toFixed(3), +caj.y[1].toFixed(3)],
                           entra: caj.x[0]>0.01 && caj.x[1]<0.99 },
                 garra:pr(R.garra.x,R.garra.y,R.garra.z), alc:+R.alc.toFixed(3),
                 gy:+R.gy.toFixed(3), gx:+R.gx.toFixed(3) });
    }
    return out;
  },
  /* juega hasta que un rival este en la fase que se pide, y devuelve cuantas vueltas tardo: asi se
     puede fotografiar el instante exacto en que una mano esta agarrando una carta */
  hastaBot:(fase, tope)=>{
    let n=0;
    while(n++<(tope||3000)){
      if(G.turno!==J_VOS && G.bot.fase===fase && G.bot.j>=0) return { vueltas:n, bot:{...G.bot} };
      if(G.turno===J_VOS){
        if(G.colorPide){ elegirColor(botColor(J_VOS)); continue; }
        const i=botElegir(J_VOS);
        if(i<0){ if(!G.robo) robarJugador(); else { G.turno=siguiente(J_VOS); G.robo=false; } continue; }
        seleccionar(i); tirarSel(); if(G.colorPide) elegirColor(botColor(J_VOS));
        if(G.sel>=0) soltar();
        continue;
      }
      partidaTick(1/60);
    }
    return { vueltas:n, bot:{...G.bot}, fallo:true };
  },
  botVer:()=>({...G.bot}),
  pausa:(b)=>{ CONGELADO=!!b; return CONGELADO; },
  manoVer:()=>({ on:MANO.on, estado:MANO.estado, error:MANO.error, hay:MANO.hay,
                 x:+MANO.x.toFixed(3), y:+MANO.y.toFixed(3), pinza:MANO.pinza,
                 crudo:+MANO.crudo.toFixed(3), medidas:MANO.medidas, delegado:MANO.delegado,
                 espejo:MANO.espejo, usa:MANO.usa, pref:CAM_PREF, ms:+MANO.msDet.toFixed(2) }),
  /* EL FLANCO: una pinza sostenida tiene que valer UNA vez. Se empujan n cuadros seguidos con la
     pinza cerrada y se cuentan los flancos. */
  flancoProbar:(n)=>{
    let t=performance.now(), f=0;
    window.__rez.manoInyectar(0.5,0.5,false,t);
    for(let k=0;k<(n||10);k++){ t+=16; window.__rez.manoInyectar(0.5,0.5,true,t); if(tomarPinza()) f++; }
    return { cuadros:n||10, flancos:f };
  },
  /* la histeresis: se barre la distancia cruda de abierta a cerrada y al reves, y se anota donde
     cambia. Con un umbral solo, los dos cambios caerian en el mismo valor y no habria histeresis. */
  histProbar:()=>{
    const r={cierra:null, abre:null};
    let t=performance.now();
    window.__rez.manoInyectar(0.5,0.5,false,t);
    for(let d=0.09; d>0.0; d-=0.002){
      t+=16; const lm=window.__rez.manoFalsa(0.5,0.5,false);
      lm[4]={x:0.5-d/2,y:0.5,z:0}; lm[8]={x:0.5+d/2,y:0.5,z:0};
      manosInyectar(lm,t);
      if(MANO.pinza && r.cierra==null) r.cierra=+MANO.crudo.toFixed(3);
    }
    for(let d=0.0; d<0.12; d+=0.002){
      t+=16; const lm=window.__rez.manoFalsa(0.5,0.5,false);
      lm[4]={x:0.5-d/2,y:0.5,z:0}; lm[8]={x:0.5+d/2,y:0.5,z:0};
      manosInyectar(lm,t);
      if(!MANO.pinza && r.abre==null && r.cierra!=null) r.abre=+MANO.crudo.toFixed(3);
    }
    return r;
  },
  /* ---- el tutorial jugado solo ---- */
  tutJugar:(tope)=>{
    tutorialEmpezar();
    const log=[]; let n=0, ult=-1;
    MANO.on=false;                      // sin camara: los pasos 0 y 1 se dan por vistos
    while(TUT.on && n++<(tope||4000)){
      if(TUT.paso!==ult){ ult=TUT.paso; log.push('paso'+TUT.paso); }
      if(TUT.paso===2) window.__rez.pellizcarZona('carta',0);
      else if(TUT.paso===3) window.__rez.pellizcarZona('tirar');
      else if(TUT.paso===4){
        const o=tutObjetivo();
        if(G.sel<0 && o>=0) window.__rez.pellizcarZona('carta',o);
        else if(G.sel>=0) window.__rez.pellizcarZona('dejar');
      }
      else if(TUT.paso===5) window.__rez.pellizcarZona('mazo');
      partidaTick(1/60); tutTick(1/60);
    }
    return { vueltas:n, paso:TUT.paso, on:TUT.on, hecho:TUT.hecho, pant, log };
  },
  /* arranca el tutorial y lo deja en el paso que se pida, para poder fotografiar cada uno */
  /* deja correr el reloj de la partida sin dibujar: los rivales piensan y las cartas vuelan */
  correr:(seg)=>{ const n=Math.round((seg||1)*60); for(let k=0;k<n;k++) partidaTick(1/60);
                  return window.__rez.estado(); },
  /* JUEGA UNA PARTIDA ENTERA SOLO POR ZONAS, que es literalmente el camino del jugador: buscar la
     zona en el mismo sitio donde se dibuja, pellizcar el centro y ver que pasa. Es la prueba que
     cubre lo unico que no cubre jugarSolo(): que el boton apagado y la regla sean la misma cuenta. */
  porZonas:(sem, tope)=>{
    repartir(sem||1); G.fase='juego';
    let n=0, colores=0, ilegales=0; const fallos=[];
    while(G.fase==='juego' && n++<(tope||9000)){
      if(G.turno!==J_VOS){ partidaTick(1/60); continue; }
      if(G.colorPide){ window.__rez.pellizcarZona('color',1); colores++; continue; }
      if(G.sel>=0){
        const c=G.manos[J_VOS][G.sel], deberia=pega(c,G.color,G.valor), antes=G.pila.length;
        const r=window.__rez.pellizcarZona('tirar');
        if(G.pila.length>antes && !deberia) ilegales++;
        if(G.sel>=0 && !G.colorPide) window.__rez.pellizcarZona('dejar');
        continue;
      }
      const m=G.manos[J_VOS];
      let i=-1; for(let k=0;k<m.length;k++) if(pega(m[k],G.color,G.valor)){ i=k; break; }
      if(i<0){
        const q=window.__rez.pellizcarZona('mazo');
        if(!q || !q.hizo){ G.turno=siguiente(J_VOS); G.robo=false; }
        continue;
      }
      const r=window.__rez.pellizcarZona('carta',i);
      /* SI EL RAYO NO AGARRA LA CARTA QUE SE APUNTO, SE ANOTA. Es el unico modo de fallo que importa
         aca: significa que lo que se ve y lo que se pellizca no coinciden. */
      if(!r || !r.hizo || G.sel!==i){
        const det={n, i, mano:m.length, apunta:r&&r.apunta, sel:G.sel, p:r&&r.pantalla, ptos:[]};
        const selG=G.sel; G.sel=-1;
        for(let k=0;k<m.length;k++){ const q=window.__rez.pantallaDe('carta',k);
          det.ptos.push(q? [k, +q.x.toFixed(3), +q.y.toFixed(3),
                            (o=>o?o.userData.tipo+':'+o.userData.i:'x')(pickEn(q.x,q.y))] : [k,'null']); }
        G.sel=selG;
        det.z=PICK.filter(o=>o.userData.tipo==='carta')
                  .map(o=>[o.userData.i, +o.position.x.toFixed(3), +o.position.z.toFixed(3)]);
        fallos.push(det);
        if(fallos.length>60) break; }
    }
    return { vueltas:n, fase:G.fase, gana:G.gana, colores, ilegales, manos:G.manos.map(x=>x.length),
             fallos:fallos.length, ejemplos:fallos.slice(0,4) };
  },
  tutIr:(paso)=>{
    tutorialEmpezar();
    let n=0;
    while(TUT.paso<(paso||0) && n++<3000){
      if(TUT.paso===0||TUT.paso===1){ MANO.on=false; }
      else if(TUT.paso===2) window.__rez.pellizcarZona('carta',0);
      else if(TUT.paso===3) window.__rez.pellizcarZona('tirar');
      else if(TUT.paso===4){ const o=tutObjetivo();
        if(G.sel<0 && o>=0) window.__rez.pellizcarZona('carta',o); else window.__rez.pellizcarZona('dejar'); }
      else if(TUT.paso===5) window.__rez.pellizcarZona('mazo');
      partidaTick(1/60); tutTick(1/60);
    }
    return window.__rez.tutVer();
  },
  tutVer:()=>({ on:TUT.on, paso:TUT.paso, hecho:TUT.hecho, objetivo:tutObjetivo(),
                guia:(document.getElementById('guiaT')||{}).textContent||'' }),
  /* ---- el audio: lo unico que prueba que sono es medirlo ---- */
  audio:()=>({ hay:!!AUD.ctx, on:AUD.on, estado:AUD.ctx? AUD.ctx.state : 'no' }),
  son:(k)=>{ son(k); return true; },
  /* ---- costo ---- */
  costo:(n)=>{
    const v=n||300, t=[];
    for(let k=0;k<v;k++){ const a=performance.now();
      armarMesa(); pintarTut(); pintarAro(); render.render(escena,camara);
      t.push(performance.now()-a); }
    t.sort((x,y)=>x-y);
    const inf=render.info;
    return { cuadros:v, media:+(t.reduce((s,x)=>s+x,0)/v).toFixed(3),
             p50:+t[Math.floor(v*0.5)].toFixed(3), p90:+t[Math.floor(v*0.9)].toFixed(3),
             max:+t[v-1].toFixed(3), pick:PICK.length,
             llamadas:inf.render.calls, tris:inf.render.triangles,
             texturas:inf.memory.textures, geometrias:inf.memory.geometries };
  },
  /* EL ENCUADRE SE MIDE, NO SE ESTIMA. Devuelve el rectangulo que ocupan TODAS las piezas de la mesa
     proyectadas a la pantalla, en fraccion de 0 a 1. Si algo se sale, aca da menos que 0 o mas que 1
     — y eso en una captura chica no se ve, porque lo que se sale simplemente no esta. */
  /* CON `mios` SOLO SE MIDE LO QUE EL JUGADOR TIENE QUE PODER ALCANZAR: su abanico, el mazo y los
     botones. Los abanicos de los rivales quedan afuera de la cuenta a proposito — al asomarse a un
     lado es NATURAL que el rival del otro lado se salga del cuadro, y exigir que entre todo con la
     vista girada obliga a alejar la camara casi un 50%, o sea a dejar las cartas del tamaño de un
     sello para poder ver dos abanicos que ni se tocan. */
  extremos:(mios)=>{
    armarMesa();
    /* EL ARBOL ENTERO, NO SOLO EL OBJETO. updateMatrixWorld() sobre un hijo NO actualiza a su padre,
       y desde que el abanico vive en un grupo que gira con el jugador, actualizar solo la carta la
       proyecta con la matriz VIEJA del grupo. Es el mismo defecto que ya habia costado una prueba en
       el rayo, con otro disfraz: medir sin poner el arbol al dia. */
    escena.updateMatrixWorld(true); camara.updateMatrixWorld(true);
    const v=new THREE.Vector3();
    let x0=9,y0=9,x1=-9,y1=-9;
    const lista = mios? PICK.filter(o=>o.userData.tipo).concat([mazoMalla]).filter(Boolean)
                      : PICK.concat([mazoMalla]).filter(Boolean);
    for(const o of lista){
      o.updateMatrixWorld(true);
      /* SE PROYECTAN LAS OCHO ESQUINAS DEL OBJETO EN SU PROPIO ESPACIO, NO SU CAJA DE MUNDO.
         Box3.setFromObject devuelve la caja ALINEADA A LOS EJES: para una carta inclinada y girada
         esa caja es bastante mas grande que la carta, y crece cuando la vista rota — asi que el
         barrido decia que el abanico se salia del cuadro cuando lo que se salia era una caja
         imaginaria. Medido despues: con doce grados de giro las siete cartas caen EXACTAMENTE en la
         misma fraccion de pantalla que sin girar. */
      const g=o.geometry; if(!g) continue;
      if(!g.boundingBox) g.computeBoundingBox();
      const caja=g.boundingBox;
      for(let i=0;i<8;i++){
        v.set(i&1?caja.max.x:caja.min.x, i&2?caja.max.y:caja.min.y, i&4?caja.max.z:caja.min.z)
         .applyMatrix4(o.matrixWorld).project(camara);
        const px=v.x*0.5+0.5, py=-v.y*0.5+0.5;
        if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
      }
    }
    return { x:[+x0.toFixed(3),+x1.toFixed(3)], y:[+y0.toFixed(3),+y1.toFixed(3)],
             entra:(x0>=0.01&&x1<=0.99&&y0>=0.01&&y1<=0.99),
             ancho:+(x1-x0).toFixed(3), alto:+(y1-y0).toFixed(3) };
  },
  /* mueve la camara en vivo para poder buscar el encuadre midiendo en vez de recompilando */
  encuadre:(o)=>{
    if(o){
      if(o.fov!=null){ camara.fov=o.fov; camara.updateProjectionMatrix(); }
      if(o.y!=null) camara.position.y=o.y;
      if(o.z!=null) camara.position.z=o.z;
      if(o.miraY!=null || o.miraZ!=null){ CAM_MIRA[0]=o.miraY!=null?o.miraY:CAM_MIRA[0];
                                          CAM_MIRA[1]=o.miraZ!=null?o.miraZ:CAM_MIRA[1]; }
      camara.lookAt(0, CAM_MIRA[0], CAM_MIRA[1]);
    }
    return { pos:[+camara.position.y.toFixed(2), +camara.position.z.toFixed(2)],
             fov:camara.fov, mira:CAM_MIRA.slice() };
  },
  escenaVer:()=>{ armarMesa(); render.render(escena,camara);
    let mallas=0; escena.traverse(o=>{ if(o.isMesh) mallas++; });
    return { mallas, pick:PICK.length, llamadas:render.info.render.calls,
             tris:render.info.render.triangles,
             camara:[+camara.position.x.toFixed(1),+camara.position.y.toFixed(1),+camara.position.z.toFixed(1)],
             fov:camara.fov, sombra:render.shadowMap.enabled,
             fondo:'#'+escena.background.getHexString() }; },
  medidas:()=>({ lienzo:[lienzo.width,lienzo.height], marco:[marco.clientWidth, marco.clientHeight],
                 dpr:render.getPixelRatio(), aspecto:+camara.aspect.toFixed(3) })
};
</script>
