  luzCielo.color.copy(CIELO);
  luzCielo.intensity=0.55+0.55*Math.max(0.0, SOL.y);
}
const _vw=new THREE.Vector3();

/* ---------------------------------------------------------- el salto a mano
   Cada hueso lleva sus cuatro cuaterniones. Los angulos estan en grados y en
   el eje que corresponde: la pierna se dobla en X, el brazo se abre en Z. */
function clipDeSalto(){
  const T=[0.0, 0.16, 0.42, 0.72];
  const q=(gx,gy,gz)=>{
    const e=new THREE.Euler(gx*Math.PI/180, gy*Math.PI/180, gz*Math.PI/180, 'XYZ');
    return new THREE.Quaternion().setFromEuler(e);
  };
  /* [neutro, impulso, en el aire, cayendo] */
  const POSES={
    'mixamorig:Spine':      [q(0,0,0), q(-14,0,0), q(-8,0,0),  q(10,0,0)],
    'mixamorig:Spine1':     [q(0,0,0), q(-8,0,0),  q(-5,0,0),  q(6,0,0)],
    'mixamorig:LeftUpLeg':  [q(0,0,0), q(28,0,0),  q(-52,0,0), q(16,0,0)],
    'mixamorig:RightUpLeg': [q(0,0,0), q(28,0,0),  q(-46,0,0), q(20,0,0)],
    'mixamorig:LeftLeg':    [q(0,0,0), q(-55,0,0), q(78,0,0),  q(-30,0,0)],
    'mixamorig:RightLeg':   [q(0,0,0), q(-55,0,0), q(70,0,0),  q(-34,0,0)],
    'mixamorig:LeftFoot':   [q(0,0,0), q(24,0,0),  q(-26,0,0), q(14,0,0)],
    'mixamorig:RightFoot':  [q(0,0,0), q(24,0,0),  q(-22,0,0), q(16,0,0)],
    /* los brazos suben al impulso: es lo que se ve desde adentro */
    'mixamorig:LeftArm':    [q(0,0,0), q(-38,0,14), q(-62,0,22), q(-18,0,8)],
    'mixamorig:RightArm':   [q(0,0,0), q(-38,0,-14),q(-62,0,-22),q(-18,0,-8)],
    'mixamorig:LeftForeArm':[q(0,0,0), q(-20,0,0), q(-34,0,0), q(-10,0,0)],
    'mixamorig:RightForeArm':[q(0,0,0),q(-20,0,0), q(-34,0,0), q(-10,0,0)]
  };
  const pistas=[];
  for(const [hueso, poses] of Object.entries(POSES)){
    const vals=[];
    for(const p of poses) vals.push(p.x,p.y,p.z,p.w);
    pistas.push(new THREE.QuaternionKeyframeTrack(hueso+'.quaternion', T, vals));
  }
  return new THREE.AnimationClip('Salto', T[T.length-1], pistas);
}

/* ------------------------------------------------------------------ cargar */
async function cargarPersonaje(){
  let GLTFLoader;
  try{ ({GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js')); }
  catch(e){ console.warn('sin GLTFLoader:', e); return; }
  const gltf=await new Promise((ok,mal)=>
    new GLTFLoader().load(PJ_URL, ok, undefined, mal)).catch(e=>{
      console.warn('no se pudo cargar el personaje:', e); return null; });
  if(!gltf) return;

  const raiz=gltf.scene;
  /* Se mide y se escala para que la cabeza quede a la altura de los ojos.
     El modelo puede venir en centimetros o con otra estatura; medirlo es mas
     confiable que confiar en un numero. */
  raiz.traverse(o=>{ if(o.isBone) PJ3.huesos[o.name]=o; });
  /* La escala se saca del HUESO DE LA CABEZA, no de la caja del modelo. Lo que
     tiene que coincidir con la altura de los ojos es la cabeza; si se usa la
     caja, la coronilla queda a 1.66 y los ojos quedan hundidos en el pecho, que
     es exactamente lo que pasaba: se veia una silueta tapando media pantalla. */
  raiz.updateMatrixWorld(true);
  const cab=PJ3.huesos['mixamorig:Head'];
  let k=1;
  if(cab){ cab.getWorldPosition(_vw); k=PJ.altoOjo/Math.max(_vw.y,0.001); }
  else {
    const caja=new THREE.Box3().setFromObject(raiz);
    k=(PJ.altoOjo+0.14)/Math.max(caja.max.y-caja.min.y,0.001);
  }
  raiz.scale.setScalar(k);
  raiz.updateMatrixWorld(true);
  const caja2=new THREE.Box3().setFromObject(raiz);
  PJ3.alto=caja2.max.y-caja2.min.y;

  raiz.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=false;
      o.castShadow=false; o.receiveShadow=false;
      /* el material que trae el glb es MeshStandard y no conoce nuestra
         niebla ni nuestro sol; se le empareja el tono a mano para que el
         cuerpo no se vea de otro mundo que el resto */
      if(o.material){ o.material.envMapIntensity=0.6; o.material.roughness=0.85; }
    }
    if(o.isBone) PJ3.huesos[o.name]=o;
  });

  const mez=new THREE.AnimationMixer(raiz);
  const buscar=n=>gltf.animations.find(a=>a.name===n);
  for(const n of ['Idle','Walk','Run']){
    const c=buscar(n); if(!c) continue;
    const a=mez.clipAction(c); a.play(); a.setEffectiveWeight(n==='Idle'?1:0);
    PJ3.acc[n]=a;
  }
  const salto=mez.clipAction(clipDeSalto());
  salto.setLoop(THREE.LoopOnce, 1); salto.clampWhenFinished=true;
  salto.setEffectiveWeight(0);
  PJ3.acc.Salto=salto;

  escena.add(raiz);
  PJ3.raiz=raiz; PJ3.mezcla=mez; PJ3.listo=true;
  /* la cabeza no se dibuja: la camara esta adentro */
  PJ3.cabeza=PJ3.huesos['mixamorig:Head']||null;
}

/* ------------------------------------------------------------ cada cuadro */
const CAMINA=3.35, CORRE=6.2;
function moverPersonaje(dt){
  if(!PJ3.listo) return;
  const R=PJ3.raiz;
  R.visible=PJ3.activo;
  if(!PJ3.activo) return;

  /* Plantado en el jugador. El modelo mira a +Z de fabrica y nuestro adelante
     es (-sin yaw, -cos yaw), asi que hay que darle media vuelta. */
  /* Corrido un poco hacia atras: la camara esta donde estaba la cabeza, y sin
     este retroceso el cuello y el pecho cruzan el plano cercano y se ve el
     cuerpo por dentro. Catorce centimetros alcanzan. */
  const fx=-Math.sin(PJ.yaw), fz=-Math.cos(PJ.yaw);
  R.position.set(PJ.x-fx*0.15, PJ.y, PJ.z-fz*0.15);
  R.rotation.y=PJ.yaw+Math.PI;

  /* mezcla por velocidad: quieto, caminando, corriendo. Los pesos se cruzan
     de a poco para que no haya saltos entre una animacion y la otra */
  const v=PJ.rapidez;
  let wI=0, wW=0, wR=0;
  if(v<0.15) wI=1;
  else if(v<CAMINA){ const t=Math.min(1,(v-0.15)/(CAMINA-0.15)); wI=1-t; wW=t; }
  else { const t=Math.min(1,(v-CAMINA)/(CORRE-CAMINA)); wW=1-t; wR=t; }
  const suave=(a,w)=>{ if(!a) return;
    a.setEffectiveWeight(a.getEffectiveWeight()+(w-a.getEffectiveWeight())*Math.min(1,dt*10)); };
  suave(PJ3.acc.Idle, wI); suave(PJ3.acc.Walk, wW); suave(PJ3.acc.Run, wR);
  /* El paso se acelera con la velocidad. Sin esto los pies patinan: la
     animacion avanza a ritmo fijo mientras el cuerpo se mueve a otro. */
  if(PJ3.acc.Walk) PJ3.acc.Walk.timeScale=Math.max(0.45, v/CAMINA*1.05);
  if(PJ3.acc.Run)  PJ3.acc.Run.timeScale =Math.max(0.65, v/CORRE*1.10);

  PJ3.mezcla.update(dt);

  /* La cabeza SE ACHICA DESPUES del mixer: si se hiciera antes, la animacion
     le vuelve a escribir la escala y se ve el interior del craneo. */
  if(PJ3.cabeza) PJ3.cabeza.scale.setScalar(0.001);
}
function saltoPersonaje(){
  if(!PJ3.listo || !PJ3.acc.Salto) return;
  const a=PJ3.acc.Salto;
  a.reset(); a.setEffectiveWeight(1); a.fadeIn(0.06); a.play();
}
function caidaPersonaje(){
  if(!PJ3.listo || !PJ3.acc.Salto) return;
  PJ3.acc.Salto.fadeOut(0.18);
}

/* ============================================================================
   POST · la cadena larga

   La escena entera se dibuja en LINEAL sobre un buffer de media precision y
   despues pasa por una cadena de etapas. El orden importa: todo lo que imita a
   la ESCENA (rayos, exposicion, bloom) va antes del mapeo de tono, y todo lo
   que imita a la LENTE y al SENSOR (aberracion, distorsion, suciedad, grano)
   va despues, porque asi es el orden fisico real.

   ETAPAS
     1  extraccion de brillo con rodilla suave
     2  bloom en cinco escalas, cada una borrosa en cruz
     3  reconstruccion del bloom subiendo escalas (mas ancho y sin bandas)
     4  rayos crepusculares por marcha radial desde el sol
     5  luminancia logaritmica a 64x64
     6  reduccion a 8x8 y a 1x1
     7  adaptacion temporal del ojo (ping-pong de un texel)
     8  desenfoque de movimiento direccional por giro de camara
     9  el grado final, con todo lo de sensor y lente
============================================================================ */
const escPost=new THREE.Scene(), camPost=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const mallaPost=new THREE.Mesh(new THREE.PlaneGeometry(2,2)); escPost.add(mallaPost);
const VQ='varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }';
const rtLin=(w,h,ms)=>new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.LinearFilter,
  magFilter:THREE.LinearFilter, type:THREE.HalfFloatType, colorSpace:THREE.NoColorSpace,
  samples:ms||0, depthBuffer:true, stencilBuffer:false});
const rtEsc=rtLin(2,2, MOVIL?0:4);
const rtBr=rtLin(2,2);
/* cinco escalas de bloom: cada una es la mitad de la anterior */
const NB=MOVIL?4:5;
const rtBloomA=[], rtBloomB=[];
for(let i=0;i<NB;i++){ rtBloomA.push(rtLin(2,2)); rtBloomB.push(rtLin(2,2)); }
const rtRayos=rtLin(2,2);
const rtMov=rtLin(2,2);
const rtL0=rtLin(64,64), rtL1=rtLin(8,8), rtL2=rtLin(1,1);
const rtExp=[rtLin(1,1), rtLin(1,1)];
let expPing=0;

const mkMat=(frag,uni)=>new THREE.ShaderMaterial({vertexShader:VQ, fragmentShader:frag, uniforms:uni});

/* 1 · brillo con rodilla suave --------------------------------------------- */
const matBrillo=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D t; uniform float uU,uS,uExp;
  void main(){
    vec3 c=texture2D(t,vUv).rgb*uExp;
    float l=dot(c,vec3(0.2126,0.7152,0.0722));
    /* rodilla suave en vez de un corte: un umbral duro deja el bloom con un
       borde que parpadea cuando algo cruza el umbral */
    float k=clamp((l-uU+uS)/max(2.0*uS,1e-4),0.0,1.0);
    k=k*k*(l>0.0?1.0:0.0);
    gl_FragColor=vec4(c*k*min(l,12.0)/max(l,1e-4),1.0);
  }`,{t:{value:null},uU:{value:1.35},uS:{value:0.50},uExp:{value:1.0}});

/* 2 · borron separable ------------------------------------------------------ */
const matBorron=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D t; uniform vec2 uD;
  void main(){ vec3 s=texture2D(t,vUv).rgb*0.227027;
    s+=texture2D(t,vUv+uD*1.3846).rgb*0.316216; s+=texture2D(t,vUv-uD*1.3846).rgb*0.316216;
    s+=texture2D(t,vUv+uD*3.2308).rgb*0.070270; s+=texture2D(t,vUv-uD*3.2308).rgb*0.070270;
    gl_FragColor=vec4(s,1.0); }`,{t:{value:null},uD:{value:new THREE.Vector2()}});

/* 3 · subir escala sumando --------------------------------------------------- */
const matSubir=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D t,tGrande; uniform float uK;
  void main(){ gl_FragColor=vec4(texture2D(t,vUv).rgb+texture2D(tGrande,vUv).rgb*uK,1.0); }`,
  {t:{value:null},tGrande:{value:null},uK:{value:0.55}});

/* 4 · rayos crepusculares ---------------------------------------------------- */
const matRayos=mkMat(`
  precision highp float; varying vec2 vUv;
  uniform sampler2D t; uniform vec2 uSol; uniform float uPeso,uDecai,uDens,uVisible;
  void main(){
    /* Marcha radial desde el sol en pantalla: se acumula el brillo que hay en
       el camino y se lo derrama. Es como se hacen los rayos de sol desde que
       existen los shaders, y sigue siendo lo mejor por lo que cuesta. */
    vec2 d=(vUv-uSol)*uDens/24.0;
    vec2 uv=vUv;
    vec3 acc=vec3(0.0);
    float ilum=1.0;
    for(int i=0;i<24;i++){
      uv-=d;
      vec3 s=texture2D(t,clamp(uv,0.0,1.0)).rgb;
      acc+=s*ilum;
      ilum*=uDecai;
    }
    gl_FragColor=vec4(acc*(uPeso/24.0)*uVisible,1.0);
  }`,{t:{value:null},uSol:{value:new THREE.Vector2(0.5,0.5)},uPeso:{value:2.4},
     uDecai:{value:0.955},uDens:{value:1.0},uVisible:{value:0.0}});

/* 5-6 · luminancia y reduccion ---------------------------------------------- */
const matLum=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D t; uniform vec2 uPx;
  void main(){
    vec3 c=texture2D(t,vUv).rgb+texture2D(t,vUv+uPx).rgb
          +texture2D(t,vUv-uPx).rgb+texture2D(t,vUv+vec2(uPx.x,-uPx.y)).rgb;
    float l=dot(c*0.25,vec3(0.2126,0.7152,0.0722));
    gl_FragColor=vec4(vec3(log(max(l,1e-4))),1.0);   // en log: la media es geometrica
  }`,{t:{value:null},uPx:{value:new THREE.Vector2()}});
const matReduce=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D t; uniform vec2 uPx;
  void main(){
    float s=0.0;
    for(int j=0;j<8;j++) for(int i=0;i<8;i++)
      s+=texture2D(t, vUv+(vec2(float(i),float(j))-3.5)*uPx).r;
    gl_FragColor=vec4(vec3(s/64.0),1.0);
  }`,{t:{value:null},uPx:{value:new THREE.Vector2()}});

/* 7 · adaptacion del ojo ----------------------------------------------------- */
const matAdapta=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D tNuevo,tViejo;
  uniform float uDt,uSube,uBaja;
  void main(){
    float objetivo=exp(texture2D(tNuevo,vec2(0.5)).r);
    float ant=texture2D(tViejo,vec2(0.5)).r;
    if(ant<=0.0) ant=objetivo;
    /* El ojo se adapta MAS RAPIDO a la luz que a la oscuridad; darle la misma
       velocidad a las dos se nota falso enseguida. */
    float k=objetivo>ant? uSube : uBaja;
    float v=ant+(objetivo-ant)*(1.0-exp(-uDt*k));
    gl_FragColor=vec4(vec3(v),1.0);
  }`,{tNuevo:{value:null},tViejo:{value:null},uDt:{value:0.016},
     uSube:{value:2.2},uBaja:{value:0.9}});

/* 8 · desenfoque de movimiento ---------------------------------------------- */
const matMov=mkMat(`
  precision highp float; varying vec2 vUv; uniform sampler2D t;
  uniform vec2 uVel; uniform float uFuerza;
  void main(){
    /* La velocidad viene del GIRO DE LA CAMARA, no de un buffer de velocidades:
       en primera persona el 90% del movimiento en pantalla es girar la cabeza,
       y esto lo captura entero por una fraccion del costo. */
    vec2 v=uVel*uFuerza;
    float l=length(v);
    if(l<0.0004){ gl_FragColor=texture2D(t,vUv); return; }
    vec3 s=vec3(0.0); float w=0.0;
    for(int i=0;i<9;i++){
      float f=(float(i)/8.0-0.5);
      float pe=1.0-abs(f)*1.2;
      s+=texture2D(t, clamp(vUv+v*f,0.0,1.0)).rgb*pe; w+=pe;
    }
    gl_FragColor=vec4(s/w,1.0);
  }`,{t:{value:null},uVel:{value:new THREE.Vector2()},uFuerza:{value:1.0}});

/* 9 · el grado final --------------------------------------------------------- */
const matGrado=mkMat(`
  precision highp float; varying vec2 vUv;
  uniform sampler2D tEsc,tBloom,tRayos,tExp; uniform vec2 uPx,uSol;
  uniform float uBloom,uExpM,uCon,uSat,uVin,uNit,uRayos,uT;
  uniform float uAber,uBarril,uGrano,uHalo,uSucio,uAnam,uDest,uAdapta;
  uniform vec3 uBalance,uLevanta,uGanancia,uTinteSombra,uTinteLuz;

  vec3 aces(vec3 x){
    /* ajuste de Narkowicz a la curva RRT+ODT de ACES */
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
  }

function pasoJugador(paso){

  if(teclas['d']||teclas['arrowright']) mx+=1;

  let x=PJ.x, z=PJ.z;

  const cx=palanca.activa?palanca.ox:m*0.155, cy=palanca.activa?palanca.oy:CAJA.h-m*0.155;
  gm.globalAlpha=palanca.activa?0.55:0.26; gm.lineWidth=2.5; gm.strokeStyle='#dcfae6';
  gm.beginPath(); gm.arc(cx,cy,R,0,6.2832); gm.stroke();
  gm.globalAlpha=palanca.activa?0.62:0.30; gm.fillStyle='#eafff2';
  gm.beginPath(); gm.arc(cx+palanca.x*R*0.55,cy+palanca.y*R*0.55,R*0.42,0,6.2832); gm.fill();
  boton(bA,'SALTO',pulsA,'#b6ffce'); boton(bB,'CORRER',pulsB,'#9fe8cf');
  gm.globalAlpha=0.38; gm.strokeStyle='#eafff2'; gm.lineWidth=1.5;
  const mx=CAJA.w/2,my=CAJA.h/2,s=m*0.010;
  gm.beginPath(); gm.moveTo(mx-s,my); gm.lineTo(mx-s*0.35,my);
  gm.moveTo(mx+s*0.35,my); gm.lineTo(mx+s,my);
  gm.moveTo(mx,my-s); gm.lineTo(mx,my-s*0.35);
  gm.moveTo(mx,my+s*0.35); gm.lineTo(mx,my+s); gm.stroke();
  gm.globalAlpha=1;
}
/* El dedo llega en coordenadas de pantalla; si la imagen está acostada hay que
   deshacer el giro a mano, porque el rectángulo que informa el navegador es el
   envolvente y miente. */
function aUI(ev){
  let dx=ev.clientX-innerWidth/2, dy=ev.clientY-innerHeight/2;
  if(ROT){ const t=dx; dx=dy; dy=-t; }
  return [dx+CAJA.w/2, dy+CAJA.h/2];
}
const lienzo=renderer.domElement, punteros=new Map();
const dentro=(b,x,y)=>Math.hypot(x-b.x,y-b.y)<b.r*1.3;
lienzo.addEventListener('pointerdown', ev=>{
  ev.preventDefault(); initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  esconderAyuda();
  const [x,y]=aUI(ev);
  if(dentro(bA,x,y)){ pulsA=0.14; saltar(); punteros.set(ev.pointerId,{r:'A'}); return; }
  if(dentro(bB,x,y)){ pulsB=0.14; correr=!correr;
    document.getElementById('bCorrer').classList.toggle('on',correr);
    punteros.set(ev.pointerId,{r:'B'}); return; }
  if(x<CAJA.w*0.44 && !palanca.activa){
    palanca.activa=true; palanca.ox=x; palanca.oy=y; palanca.x=0; palanca.y=0;
    punteros.set(ev.pointerId,{r:'palanca'});
  } else { mirada.activa=true; mirada.x=x; mirada.y=y; punteros.set(ev.pointerId,{r:'mirada'}); }
  try{ lienzo.setPointerCapture(ev.pointerId); }catch(e){}
},{passive:false});
lienzo.addEventListener('pointermove', ev=>{
  const r=punteros.get(ev.pointerId); if(!r) return;
  ev.preventDefault();
  const [x,y]=aUI(ev);
  if(r.r==='palanca'){ const R=Math.min(CAJA.w,CAJA.h)*0.115;
    palanca.x=clamp((x-palanca.ox)/R,-1,1); palanca.y=clamp((y-palanca.oy)/R,-1,1);
  } else if(r.r==='mirada'){
    PJ.yaw-=(x-mirada.x)*0.0042;
    PJ.cabeceo=clamp(PJ.cabeceo-(y-mirada.y)*0.0036,-1.35,1.25);
    mirada.x=x; mirada.y=y;
  }
},{passive:false});
function soltar(ev){
  const r=punteros.get(ev.pointerId); punteros.delete(ev.pointerId);
  if(!r) return;
  if(r.r==='palanca'){ palanca.activa=false; palanca.x=0; palanca.y=0; }
  if(r.r==='mirada') mirada.activa=false;
}
lienzo.addEventListener('pointerup',soltar);
lienzo.addEventListener('pointercancel',soltar);
lienzo.addEventListener('lostpointercapture',soltar);
for(const e of ['touchstart','touchmove','touchend'])
  lienzo.addEventListener(e, ev=>ev.preventDefault(), {passive:false});
lienzo.addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); teclas[k]=true; initAudio();
  if(k===' '){ e.preventDefault(); saltar(); }
  if(k==='r'){ correr=!correr; document.getElementById('bCorrer').classList.toggle('on',correr); } });
addEventListener('keyup', e=>{ teclas[e.key.toLowerCase()]=false; });

let T=0, ultimo=performance.now(), fps=0, cuadros=0, fpsT=0;
const NIVELES=[{p:[0.62,0.55,0.6], d:0.45, b:false},
               {p:[0.82,0.78,0.8], d:0.75, b:true},
               {p:[1.0,1.0,1.0],   d:1.0,  b:true}];
let nivel=MOVIL?1:2, autoNivel=true, nivelT=0;
const DIST0=[];
function aplicarNivel(){
  const n=NIVELES[nivel];
  for(let i=0;i<CAMPOS.length;i++) CAMPOS[i].mat.uniforms.uDist.value=DIST0[i]*n.p[i];
  PASTO_U.uDens.value=Math.min(parseFloat($('sDens').value), n.d);
  postBloom=n.b;
}
function ponerSol(a){
  const el=lerp(0.05,1.30,a);
  SOL.set(Math.cos(el)*0.55, Math.sin(el), -Math.cos(el)*0.84).normalize();
  const calor=Math.max(0,1-a*1.35);
  SOLC.setRGB(1, 0.97-calor*0.22, 0.92-calor*0.48);
  CIELO.setHSL(0.58, lerp(0.55,0.62,a), lerp(0.30,0.52,a));
  HORIZ.setHSL(lerp(0.10,0.55,Math.min(1,a*1.5)), lerp(0.55,0.30,a), lerp(0.55,0.82,a));
  ponerLucesPersonaje();
  for(const m of MATS){
    if(m.uniforms.luz) m.uniforms.luz.value.copy(SOL);
    if(m.uniforms.uSolC) m.uniforms.uSolC.value.copy(SOLC);
    if(m.uniforms.uCielo) m.uniforms.uCielo.value.copy(CIELO);
    if(m.uniforms.uCenit) m.uniforms.uCenit.value.copy(CIELO);
    if(m.uniforms.uHoriz) m.uniforms.uHoriz.value.copy(HORIZ);
  }
}
function ponerNiebla(d){ nieblaD=0.0004+d*0.0090;
  for(const m of MATS) if(m.uniforms.uFogD) m.uniforms.uFogD.value=nieblaD; }
function acomodar(){
  acomodarCaja(); renderer.setSize(CAJA.w,CAJA.h,false);
  camara.aspect=CAJA.w/CAJA.h; camara.updateProjectionMatrix();
  acomodarPost(CAJA.w,CAJA.h); acomodarMandos();
}
addEventListener('resize',acomodar);
addEventListener('orientationchange',()=>setTimeout(acomodar,120));
function bucle(ahora){
  requestAnimationFrame(bucle);
  let dt=(ahora-ultimo)/1000; ultimo=ahora;
  if(dt>0.08) dt=0.08;
  T+=dt; cuadros++; fpsT+=dt;
  if(fpsT>0.5){ fps=Math.round(cuadros/fpsT); cuadros=0; fpsT=0;
    if(autoNivel){ nivelT+=0.5;
      if(nivelT>2.0){
        if(fps<28&&nivel>0){ nivel--; aplicarNivel(); nivelT=-2; }
        else if(fps>54&&nivel<NIVELES.length-1){ nivel++; aplicarNivel(); nivelT=-2; }
        else nivelT=0; } } }
  giroVel=(PJ.yaw-yawAnt)/Math.max(dt,1e-3); yawAnt=PJ.yaw;
  moverJugador(dt);
  pulsA=Math.max(0,pulsA-dt); pulsB=Math.max(0,pulsB-dt);
  seguirPasto(PJ.x,PJ.z);
  recentrarPisadas(PJ.x,PJ.z);
  levantarPasto(dt);
  moverPersonaje(dt);
  PASTO_U.uT.value=T;
  PASTO_U.uJug.value.set(PJ.x,PJ.y,PJ.z);
  PASTO_U.uOjo.value.copy(camara.position);
  matSuelo.uniforms.uOjo.value.copy(camara.position);
  matEdificio.uniforms.uOjo.value.copy(camara.position);
  matEdificio.uniforms.uT.value=T;
  matSuelo.uniforms.uT.value=T;
  for(let i=0;i<RUEDAS.length;i++) RUEDAS[i].rotation.z-=dt*(0.85+i*0.13);
  cieloMat.uniforms.uT.value=T;
  cielo.position.copy(camara.position);
  suelo.position.set(PJ.x,0,PJ.z);
  renderer.setRenderTarget(rtEsc);
  renderer.render(escena,camara);
  pintarPost(dt);
  cabeceoAnt=PJ.cabeceo;
  dibujarMandos();
  const st=document.getElementById('stats');
  if(st) st.textContent=fps+' fps · '+(BRIZNAS/1000).toFixed(0)+' mil briznas · calidad '+(nivel+1)+'/3';
}
function esconderAyuda(){ const a=document.getElementById('ayuda');
  if(a&&a.style.opacity!=='0') a.style.opacity='0'; }
const $=(id)=>document.getElementById(id);
const BRIZNAS=CAMPOS.reduce((s,c)=>s+c.briznas,0);
$('bPanel').onclick=()=>{ $('panel').classList.toggle('show'); $('bPanel').classList.toggle('on'); };
$('bCorrer').onclick=()=>{ correr=!correr; $('bCorrer').classList.toggle('on',correr); };
function slider(id,vid,fn){ const s=$(id), v=$(vid);
  const ap=()=>{ const x=parseFloat(s.value); v.textContent=x.toFixed(2); fn(x); };
  s.addEventListener('input',ap); ap(); }
slider('sDens','vDens', x=>PASTO_U.uDens.value=Math.min(x,NIVELES[nivel].d));
slider('sAlto','vAlto', x=>PASTO_U.uAltoK.value=x);
slider('sViento','vViento', x=>PASTO_U.uViento.value=x);
slider('sArco','vArco', x=>PASTO_U.uArco.value=x);
slider('sSol','vSol', x=>ponerSol(x));
slider('sExp','vExp', x=>matGrado.uniforms.uExpM.value=x);
slider('sSat','vSat', x=>matGrado.uniforms.uSat.value=x);
slider('sNit','vNit', x=>matGrado.uniforms.uNit.value=x);
slider('sNiebla','vNiebla', x=>ponerNiebla(x));
acomodar();
for(let i=0;i<CAMPOS.length;i++) DIST0[i]=CAMPOS[i].mat.uniforms.uDist.value;
aplicarNivel();
ponerSol(0.55); ponerNiebla(0.22);
seguirPasto(PJ.x,PJ.z); ponerCamara(0.016);
requestAnimationFrame(bucle);
setTimeout(esconderAyuda, 11000);
/* El cuerpo se baja en segundo plano: son dos megas y el campo tiene que
   andar desde el primer cuadro. Si no llega, no pasa nada — se juega igual. */
cargarPersonaje();
window.__dbg={
  get fps(){ return fps; },
  get edificios(){ return {choques:CHOQUES.length, huellas:HUELLAS.length,
    ruedas:RUEDAS.length, triangulos:mallaEdificios.geometry.attributes.position.count/3}; },
  get jugador(){ return {x:+PJ.x.toFixed(2), z:+PJ.z.toFixed(2), y:+PJ.y.toFixed(2),
    yaw:+PJ.yaw.toFixed(2), vel:+PJ.rapidez.toFixed(2)}; },
  get campos(){ return CAMPOS.map(c=>({N:c.N, celda:c.celda, briznas:c.briznas,
    dist:c.mat.uniforms.uDist.value})); },
  get briznas(){ return BRIZNAS; },
  get pantalla(){ return {ROT, caja:[CAJA.w,CAJA.h], rt:[rtEsc.width,rtEsc.height]}; },
  poner(x,z){ PJ.x=x; PJ.z=z; PJ.vx=PJ.vz=0; seguirPasto(x,z); ponerCamara(0.016); },
  mirar(y,c){ if(y!==undefined) PJ.yaw=y; if(c!==undefined) PJ.cabeceo=c; ponerCamara(0.016); },
  ojo(h){ PJ.altoOjo=h; ponerCamara(0.016); },
  palanca(x,y){ palanca.activa=(x||y)!==0; palanca.x=x||0; palanca.y=y||0; },
  aparta(r){ PASTO_U.uRJug.value=r; },
  pasto(v){ for(const c of CAMPOS) c.malla.visible=v!==false; },
  pisar(x,z,f,r){ pisar(x,z,f===undefined?0.95:f, r===undefined?0.34:r); },
  get pj(){ return {listo:PJ3.listo, alto:+PJ3.alto.toFixed(2), activo:PJ3.activo,
    acciones:Object.keys(PJ3.acc), huesos:Object.keys(PJ3.huesos).length,
    pesos:Object.fromEntries(Object.entries(PJ3.acc).map(([k,a])=>[k,+a.getEffectiveWeight().toFixed(2)]))}; },
  cuerpo(v){ PJ3.activo=v!==false; },
  saltar(){ saltar(); },
  calidad(n){ autoNivel=(n===undefined); if(n!==undefined){ nivel=n; aplicarNivel(); } return nivel; },
  get piezas(){ let n=0,t=0; escena.traverse(o=>{ if(o.isMesh&&o.visible){ n++;
    const g=o.geometry, ic=g.instanceCount||1;
    t+=(g.index? g.index.count/3 : g.attributes.position.count/3)*ic; } });
    return {mallas:n, tri:Math.round(t)}; }
};
