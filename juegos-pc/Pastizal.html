<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PASTIZAL</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
    background:#0a1410;color:#e8f2ea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* El juego es apaisado. Si el teléfono está parado —o tiene el giro trabado,
     que es lo normal— se acuesta TODO noventa grados en vez de pedir pantalla
     completa: la imagen ocupa el largo del teléfono y se juega de costado. */
  #rot{position:fixed;left:50%;top:50%;transform-origin:50% 50%;
    transform:translate(-50%,-50%);background:#0a1410;touch-action:none;overflow:hidden}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #mandos{position:absolute;inset:0;z-index:9;pointer-events:none;touch-action:none}
  #err{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#8e2b20;color:#fff;
    font:11px/1.5 ui-monospace,monospace;padding:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:10}
  .fila{position:absolute;left:10px;top:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:auto}
  .btn{cursor:pointer;font:700 10px/1 ui-monospace,monospace;letter-spacing:2px;
    padding:11px 12px;border-radius:7px;border:1px solid rgba(170,215,180,.32);
    color:#e9f8ec;background:rgba(10,26,18,.60);backdrop-filter:blur(6px);white-space:nowrap}
  .btn:active{background:rgba(40,100,60,.85)}
  .btn.on{border-color:#8fe8a4;color:#dcffe4;background:rgba(24,80,46,.85)}
  #panel{position:absolute;right:10px;top:10px;z-index:11;width:min(58%,236px);
    padding:11px 12px;border-radius:10px;pointer-events:auto;
    border:1px solid rgba(170,215,180,.22);background:rgba(8,18,13,.86);backdrop-filter:blur(8px);
    display:none;flex-direction:column;gap:8px;max-height:calc(100% - 20px);overflow:auto}
  #panel.show{display:flex}
  #panel h3{font-size:9.5px;letter-spacing:3px;color:#9fd8ae;font-weight:700}
  .ctl{display:flex;flex-direction:column;gap:2px}
  .ctl label{font-size:9px;letter-spacing:1.3px;color:#aacab4;display:flex;justify-content:space-between}
  .ctl label b{color:#dcf6e2;font-weight:700}
  input[type=range]{-webkit-appearance:none;width:100%;height:19px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:#2c4636}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6px;
    border-radius:50%;background:#8fe8a4;border:none}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:#2c4636}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:#8fe8a4}
  #stats{position:absolute;left:10px;bottom:8px;z-index:11;
    font:9.5px/1.6 ui-monospace,monospace;color:#8bb098;letter-spacing:1px;pointer-events:none}
  #ayuda{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:12;
    font:9.5px/1.6 ui-monospace,monospace;color:#94bda2;letter-spacing:1.5px;
    text-align:center;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<div id="err"></div>
<div id="rot">
  <div id="stage"></div>
  <canvas id="mandos"></canvas>
  <div id="ayuda">pulgar izquierdo: caminar · derecho: mirar</div>
  <div id="stats"></div>
  <div id="hud"><div class="fila">
    <button class="btn" id="bPanel">AJUSTES</button>
    <button class="btn" id="bCorrer">CORRER</button>
  </div></div>
  <div id="panel">
    <h3>PASTO</h3>
    <div class="ctl"><label>DENSIDAD <b id="vDens">1.00</b></label>
      <input type="range" id="sDens" min="0.1" max="1" step="0.02" value="1"></div>
    <div class="ctl"><label>ALTURA <b id="vAlto">1.00</b></label>
      <input type="range" id="sAlto" min="0.4" max="2" step="0.02" value="1"></div>
    <div class="ctl"><label>VIENTO <b id="vViento">0.55</b></label>
      <input type="range" id="sViento" min="0" max="1.4" step="0.02" value="0.55"></div>
    <div class="ctl"><label>ARQUEO <b id="vArco">0.72</b></label>
      <input type="range" id="sArco" min="0" max="1.2" step="0.02" value="0.72"></div>
    <h3>IMAGEN</h3>
    <div class="ctl"><label>SOL <b id="vSol">0.55</b></label>
      <input type="range" id="sSol" min="0.06" max="1" step="0.01" value="0.55"></div>
    <div class="ctl"><label>EXPOSICIÓN <b id="vExp">1.00</b></label>
      <input type="range" id="sExp" min="0.4" max="2" step="0.02" value="1"></div>
    <div class="ctl"><label>COLOR <b id="vSat">1.18</b></label>
      <input type="range" id="sSat" min="0.6" max="1.6" step="0.02" value="1.18"></div>
    <div class="ctl"><label>NITIDEZ <b id="vNit">0.35</b></label>
      <input type="range" id="sNit" min="0" max="1.5" step="0.05" value="0.35"></div>
    <div class="ctl"><label>NEBLINA <b id="vNiebla">0.22</b></label>
      <input type="range" id="sNiebla" min="0" max="1.6" step="0.02" value="0.22"></div>
  </div>
</div>
<script>
window.addEventListener('error',e=>{const b=document.getElementById('err'); if(!b) return;
  b.style.display='block'; b.textContent+=(e.message||e.error)+'\n'+(e.filename||'')+':'+(e.lineno||'')+'\n';});
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================================
   PASTIZAL · todo procedural, cero archivos

   No hay una sola textura ni un solo modelo descargado: el suelo es un plano
   verde y el pasto son BRIZNAS DE GEOMETRÍA, no tarjetas con una foto pegada.
   Cada brizna es una cinta de unos pocos vértices que nace ancha, se afina
   hasta la punta y se arquea; su alto, su giro, su curva, su tono y su fase de
   viento salen de un hash de la celda donde le tocó caer.

   Son doscientas mil briznas y ninguna se mueve nunca desde JavaScript. Cada
   una tiene un índice fijo en una grilla y el shader calcula qué celda del
   mundo le toca según dónde está parado el jugador:

       celda = uBase + mod(indice - uBase, N)

   Cuando el jugador cruza una celda, uBase cambia en uno y las briznas de una
   sola columna reaparecen del otro lado. Todo el trabajo por cuadro es escribir
   dos floats en un uniform.

   Lo que hace que parezca pasto y no un cepillo:
   · cada brizna se ARQUEA con su propia curva, y el arco decide también hacia
     dónde mira su normal;
   · la normal ABOMBA a lo ancho, como una cinta acanalada, así devuelve una
     franja de brillo en vez de prenderse entera de golpe;
   · a contraluz la hoja se PRENDE, que es lo que hace una de verdad;
   · el viento sopla en RÁFAGAS que se ven cruzar el campo, no parejo;
   · y hay manchones de altura y de tono en grande, porque ningún pastizal es
     de un solo verde.
============================================================================ */
const MOVIL=matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const FOV0=62, BORDE=900;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

const rotEl=document.getElementById('rot'), stage=document.getElementById('stage');
let ROT=false, CAJA={w:1,h:1};
function acomodarCaja(){
  const vw=innerWidth, vh=innerHeight;
  ROT = vh > vw*1.02;
  CAJA.w = ROT? vh : vw; CAJA.h = ROT? vw : vh;
  rotEl.style.width=CAJA.w+'px'; rotEl.style.height=CAJA.h+'px';
  rotEl.style.transform='translate(-50%,-50%) rotate('+(ROT?90:0)+'deg)';
}
acomodarCaja();
const renderer=new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, MOVIL?1.6:2));
renderer.setSize(CAJA.w, CAJA.h, false);
/* Todo se dibuja en LINEAL sobre un buffer; el tono, el color y el paso a sRGB
   los hace el pase de post, una sola vez y para todos. */
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
stage.appendChild(renderer.domElement);
const escena=new THREE.Scene();
const camara=new THREE.PerspectiveCamera(FOV0, CAJA.w/CAJA.h, 0.03, 2200);
camara.rotation.order='YXZ';

const SOL=new THREE.Vector3();
const CIELO=new THREE.Color(0x6fb6e8), HORIZ=new THREE.Color(0xc8dfe6), SOLC=new THREE.Color(1,0.97,0.9);
const MATS=[];
let nieblaD=0.011;

/* --------------------------------------------------------------- el ruido
   Un solo hash y un valor interpolado alcanzan para los manchones: no hace
   falta traer una textura para eso. */
const RUIDO_GLSL=`
  float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
  float ruido(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ return ruido(p)*0.55+ruido(p*2.07+11.3)*0.28+ruido(p*4.13+5.7)*0.17; }`;
const NIEBLA_GLSL=`
  vec3 conNiebla(vec3 col, vec3 W, vec3 ojo, vec3 luz, vec3 hor, vec3 solc, float k){
    vec3 dv=W-ojo; float d=length(dv); dv/=max(d,1e-4);
    float f=1.0-exp(-k*d);
    vec3 n=mix(hor, solc, pow(max(dot(dv,luz),0.0), 6.0)*0.55);
    return mix(col, n, clamp(f,0.0,1.0));
  }`;
/* ============================================================================
   EL CIELO Y EL SUELO
   Los dos procedurales: el cielo es un degradado con el disco del sol y su
   halo; el suelo, un plano verde con manchones de tono. Como el pasto lo tapa
   casi entero, el suelo sólo tiene que dar el color de fondo correcto para que
   los huecos no canten.
============================================================================ */
const cieloMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ luz:{value:SOL.clone()}, uCenit:{value:CIELO.clone()},
             uHoriz:{value:HORIZ.clone()}, uSolC:{value:SOLC.clone()}, uT:{value:0} },
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    precision highp float;
    varying vec3 vD; uniform vec3 luz,uCenit,uHoriz,uSolC; uniform float uT;
    ${RUIDO_GLSL}
    void main(){
      vec3 d=normalize(vD);
      float h=clamp(d.y,-1.0,1.0);
      /* el degradado real del cielo no es lineal: se abre rápido cerca del
         horizonte y se aplana arriba */
      vec3 col=mix(uHoriz, uCenit, pow(clamp(h,0.0,1.0), 0.42));
      col=mix(col, uHoriz*0.86, clamp(-h*3.0,0.0,1.0));       // por debajo
      float ds=max(dot(d, luz), 0.0);
      col+=uSolC*pow(ds, 5.0)*0.22;                            // halo ancho
      col+=uSolC*pow(ds, 1400.0)*16.0;                         // el disco
      /* nubes finas: dos capas de ruido estiradas y desplazadas, sólo arriba */
      if(h>0.02){
        vec2 p=d.xz/max(h,0.02);
        float n=fbm(p*0.30+vec2(uT*0.004,uT*0.0025));
        float n2=fbm(p*0.75-vec2(uT*0.007,0.0));
        float nub=smoothstep(0.52,0.86,n*0.72+n2*0.28)*smoothstep(0.03,0.30,h);
        col=mix(col, mix(vec3(0.92,0.95,0.99), uSolC*1.15, pow(ds,3.0)*0.5), nub*0.80);
      }
      gl_FragColor=vec4(col,1.0);
    }`
});
MATS.push(cieloMat);
const cielo=new THREE.Mesh(new THREE.SphereGeometry(1500,40,26), cieloMat);
cielo.frustumCulled=false; escena.add(cielo);

const matSuelo=new THREE.ShaderMaterial({
  uniforms:{ luz:{value:SOL.clone()}, uOjo:{value:new THREE.Vector3()},
    uSolC:{value:SOLC.clone()}, uCielo:{value:CIELO.clone()}, uHoriz:{value:HORIZ.clone()},
    uFogD:{value:nieblaD} },
  /* el plano sigue al jugador, así que la posición del mundo hay que sacarla de
     la matriz del objeto y no del atributo, o los manchones viajarían con uno */
  vertexShader:`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0);
    vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`
    precision highp float;
    varying vec3 vW; uniform vec3 luz,uOjo,uSolC,uCielo,uHoriz; uniform float uFogD;
    ${RUIDO_GLSL}
    ${NIEBLA_GLSL}
    void main(){
      /* el mismo campo de manchones que decide la altura del pasto, para que el
         suelo y las briznas cuenten la misma historia */
      float m=fbm(vW.xz*0.035);
      float g=fbm(vW.xz*0.21+31.7);
      vec3 col=mix(vec3(0.028,0.058,0.020), vec3(0.062,0.108,0.032), m);
      col=mix(col, vec3(0.078,0.082,0.036), smoothstep(0.62,0.92,g)*0.35);
      col*=0.82+0.36*ruido(vW.xz*1.7);
      float lamb=0.30+0.70*max(luz.y,0.0);
      col*=lamb*uSolC*1.35 + uCielo*0.22;
      gl_FragColor=vec4(conNiebla(col, vW, uOjo, luz, uHoriz, uSolC, uFogD),1.0);
    }`
});
MATS.push(matSuelo);
const suelo=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000,1,1).rotateX(-Math.PI/2), matSuelo);
suelo.frustumCulled=false; escena.add(suelo);

/* ============================================================================
   LAS BRIZNAS
   Una cinta de S tramos: dos vértices por tramo y uno solo en la punta. Nace
   ancha, se afina y se arquea. Todo lo demás —dónde cae, cuánto mide, hacia
   dónde mira, cuánto se dobla— sale de un hash de su celda, adentro del shader.
============================================================================ */
const PASTO_U={
  uT:{value:0}, uViento:{value:0.55}, uArco:{value:0.55}, uAltoK:{value:1.0},
  uDens:{value:1.0}, uJug:{value:new THREE.Vector3()}, uRJug:{value:1.15},
  uOjo:{value:new THREE.Vector3()}, luz:{value:SOL.clone()},
  uSolC:{value:SOLC.clone()}, uCielo:{value:CIELO.clone()}, uHoriz:{value:HORIZ.clone()},
  uFogD:{value:nieblaD}
};
const CAMPOS=[];
function crearCampo(o){
  const N=o.N, S=o.segs;
  /* la cinta: (-1,v) y (1,v) por tramo, y (0,1) de punta */
  const pos=[], idx=[];
  for(let k=0;k<S;k++){ const v=k/S; pos.push(-1,v,0, 1,v,0); }
  pos.push(0,1,0);
  for(let k=0;k<S-1;k++){ const a=k*2; idx.push(a,a+1,a+3, a,a+3,a+2); }
  idx.push((S-1)*2, (S-1)*2+1, S*2);
  const geo=new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  const ii=new Float32Array(N*N*2);
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const k=(j*N+i)*2; ii[k]=i; ii[k+1]=j; }
  geo.setAttribute('iIdx', new THREE.InstancedBufferAttribute(ii,2));
  geo.instanceCount=N*N;
  geo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),1e5);
  const mat=new THREE.ShaderMaterial({
    side:THREE.DoubleSide,
    uniforms:Object.assign({ uBase:{value:new THREE.Vector2()}, uN:{value:N},
      uCelda:{value:o.celda}, uAncho:{value:o.ancho}, uDist:{value:o.dist},
      uCerca:{value:o.cerca||0}, uSem:{value:o.sem||0},
      uAltoMin:{value:o.altoMin}, uAltoMax:{value:o.altoMax} }, PASTO_U),
    vertexShader:`
      precision highp float;
      attribute vec2 iIdx;
      uniform vec2 uBase; uniform float uN,uCelda,uAncho,uDist,uCerca,uSem;
      uniform float uAltoMin,uAltoMax,uT,uViento,uArco,uAltoK,uDens,uRJug;
      uniform vec3 uJug,uOjo;
      varying vec3 vW,vNor; varying float vV,vTono,vSeco,vLejos;
      ${RUIDO_GLSL}
      void main(){
        /* la celda del mundo que le toca a esta brizna */
        vec2 g=uBase+mod(iIdx-uBase, vec2(uN));
        vec2 s=g+vec2(uSem);
        float r1=h21(s), r2=h21(s+vec2(17.3,5.1)), r3=h21(s+vec2(3.7,29.9));
        float r4=h21(s+vec2(41.1,13.7)), r5=h21(s+vec2(7.9,53.3)), r6=h21(s+vec2(63.1,2.9));
        vec2 P=(g+0.5)*uCelda+(vec2(r1,r2)-0.5)*uCelda*0.98;

        /* manchones: el pastizal es más alto y más verde en unos lados */
        float mancha=fbm(P*0.035);
        float claro=smoothstep(0.10,0.34,fbm(P*0.011+7.3));   // algún pelado
        float alto=(uAltoMin+r3*(uAltoMax-uAltoMin))*uAltoK*(0.55+mancha*0.95);
        float vive=step(r5, uDens*claro);
        alto*=vive;

        float dcam=length(P-uOjo.xz);
        alto*=1.0-smoothstep(uDist*0.80, uDist, dcam);
        if(uCerca>0.0) alto*=smoothstep(uCerca*0.5, uCerca, dcam);
        vLejos=dcam;

        float v=position.y, lado=position.x;
        /* el perfil: ancha en la base, fina en la punta */
        float w=uAncho*(1.0-pow(v,1.4))*(0.72+r4*0.56)*0.5;
        /* el arco propio de la brizna, y encima el viento en ráfagas */
        float raf=max(0.05, 0.48+0.36*sin(P.x*0.13+P.y*0.10-uT*0.65)
                                +0.20*sin(P.x*0.041-P.y*0.063-uT*0.33));
        float osc=sin(uT*1.9+P.x*0.7+P.y*0.55+r4*6.283)+0.42*sin(uT*3.7+P.x*1.5-P.y*1.1);
        float dob=(uArco*(0.35+r6*1.6) + uViento*raf*osc*0.60)*v*v;

        float a=r4*6.2831853;
        vec2 dir=vec2(cos(a), sin(a));            // hacia dónde se vuelca
        vec2 late=vec2(-dir.y, dir.x);            // el ancho es perpendicular
        /* la línea central de la cinta, ya arqueada */
        vec3 eje=vec3(dir.x*dob*alto, (v-dob*dob*0.32)*alto, dir.y*dob*alto);
        vec3 loc=eje+vec3(late.x,0.0,late.y)*lado*w*alto;

        /* el jugador la aparta al pasar: ésta es la colisión que se ve */
        vec3 W=vec3(P.x,0.0,P.y)+loc;
        vec2 dj=W.xz-uJug.xz; float dd=length(dj);
        float emp=1.0-smoothstep(uRJug*0.25, uRJug, dd);
        loc.xz+=(dj/max(dd,0.0015))*emp*v*alto*0.9;
        loc.y-=emp*v*alto*0.55;
        W=vec3(P.x,0.0,P.y)+loc; vW=W;

        /* La normal: perpendicular a la tangente de la cinta, y ABOMBADA a lo
           ancho como una hoja acanalada. Sin eso la brizna se prende entera de
           golpe y el pastizal titila. */
        float dv=2.0*dob*v;                        // derivada del arco
        vec3 tan=normalize(vec3(dir.x*dv, 1.0-dob*dob*0.64*v, dir.y*dv));
        vec3 lat3=vec3(late.x,0.0,late.y);
        vec3 nor=normalize(cross(lat3, tan));
        vNor=normalize(nor + lat3*lado*0.55);
        vV=v; vTono=0.80+r2*0.40; vSeco=smoothstep(0.72,1.0,r6);
        gl_Position=projectionMatrix*viewMatrix*vec4(W,1.0);
      }`,
    fragmentShader:`
      precision highp float;
      uniform vec3 luz,uOjo,uSolC,uCielo,uHoriz; uniform float uFogD;
      varying vec3 vW,vNor; varying float vV,vTono,vSeco,vLejos;
      ${NIEBLA_GLSL}
      void main(){
        vec3 N=normalize(vNor);
        vec3 E=normalize(uOjo-vW);
        if(dot(N,E)<0.0) N=-N;                     // la cinta se ve de los dos lados
        /* el color de una brizna: base fría y oscura, punta clara y dorada */
        vec3 col=mix(vec3(0.030,0.082,0.020), vec3(0.190,0.430,0.070), pow(vV,0.80));
        col=mix(col, vec3(0.360,0.320,0.095), vSeco*0.50);
        col*=vTono;
        float ndl=max(dot(N,luz),0.0);
        float lamb=0.26+0.80*ndl;
        /* translucidez: a contraluz la hoja se prende */
        float atras=pow(max(dot(-E,luz),0.0),2.4)*0.85*vV;
        /* brillo: la hoja es una cinta y devuelve una franja, no un punto */
        vec3 H=normalize(E+luz);
        float esp=pow(max(dot(N,H),0.0), 34.0)*0.55*vV;

  for(const m of MATS) if(m.uniforms.uFogD) m.uniforms.uFogD.value=nieblaD; }
function acomodar(){
  acomodarCaja(); renderer.setSize(CAJA.w,CAJA.h,false);
  camara.aspect=CAJA.w/CAJA.h; camara.updateProjectionMatrix();
  acomodarPost(CAJA.w,CAJA.h); acomodarMandos();
}
addEventListener('resize',acomodar);
addEventListener('orientationchange',()=>setTimeout(acomodar,120));
function bucle(ahora){
  requestAnimationFrame(bucle);
  let dt=(ahora-ultimo)/1000; ultimo=ahora;
  if(dt>0.08) dt=0.08;
  T+=dt; cuadros++; fpsT+=dt;
  if(fpsT>0.5){ fps=Math.round(cuadros/fpsT); cuadros=0; fpsT=0;
    if(autoNivel){ nivelT+=0.5;
      if(nivelT>2.0){
        if(fps<28&&nivel>0){ nivel--; aplicarNivel(); nivelT=-2; }
        else if(fps>54&&nivel<NIVELES.length-1){ nivel++; aplicarNivel(); nivelT=-2; }
        else nivelT=0; } } }
  giroVel=(PJ.yaw-yawAnt)/Math.max(dt,1e-3); yawAnt=PJ.yaw;
  moverJugador(dt);
  pulsA=Math.max(0,pulsA-dt); pulsB=Math.max(0,pulsB-dt);
  seguirPasto(PJ.x,PJ.z);
  PASTO_U.uT.value=T;
  PASTO_U.uJug.value.set(PJ.x,PJ.y,PJ.z);
  PASTO_U.uOjo.value.copy(camara.position);
  matSuelo.uniforms.uOjo.value.copy(camara.position);
  cieloMat.uniforms.uT.value=T;
  cielo.position.copy(camara.position);
  suelo.position.set(PJ.x,0,PJ.z);
  renderer.setRenderTarget(rtEsc);
  renderer.render(escena,camara);
  pintarPost();
  dibujarMandos();
  const st=document.getElementById('stats');
  if(st) st.textContent=fps+' fps · '+(BRIZNAS/1000).toFixed(0)+' mil briznas · calidad '+(nivel+1)+'/3';
}
function esconderAyuda(){ const a=document.getElementById('ayuda');
  if(a&&a.style.opacity!=='0') a.style.opacity='0'; }
const $=(id)=>document.getElementById(id);
const BRIZNAS=CAMPOS.reduce((s,c)=>s+c.briznas,0);
$('bPanel').onclick=()=>{ $('panel').classList.toggle('show'); $('bPanel').classList.toggle('on'); };
$('bCorrer').onclick=()=>{ correr=!correr; $('bCorrer').classList.toggle('on',correr); };
function slider(id,vid,fn){ const s=$(id), v=$(vid);
  const ap=()=>{ const x=parseFloat(s.value); v.textContent=x.toFixed(2); fn(x); };
  s.addEventListener('input',ap); ap(); }
slider('sDens','vDens', x=>PASTO_U.uDens.value=Math.min(x,NIVELES[nivel].d));
slider('sAlto','vAlto', x=>PASTO_U.uAltoK.value=x);
slider('sViento','vViento', x=>PASTO_U.uViento.value=x);
slider('sArco','vArco', x=>PASTO_U.uArco.value=x);
slider('sSol','vSol', x=>ponerSol(x));
slider('sExp','vExp', x=>matGrado.uniforms.uExp.value=x);
slider('sSat','vSat', x=>matGrado.uniforms.uSat.value=x);
slider('sNit','vNit', x=>matGrado.uniforms.uNit.value=x);
slider('sNiebla','vNiebla', x=>ponerNiebla(x));
acomodar();
for(let i=0;i<CAMPOS.length;i++) DIST0[i]=CAMPOS[i].mat.uniforms.uDist.value;
aplicarNivel();
ponerSol(0.55); ponerNiebla(0.22);
seguirPasto(PJ.x,PJ.z); ponerCamara(0.016);
requestAnimationFrame(bucle);
setTimeout(esconderAyuda, 11000);
window.__dbg={
  get fps(){ return fps; },
  get jugador(){ return {x:+PJ.x.toFixed(2), z:+PJ.z.toFixed(2), y:+PJ.y.toFixed(2),
    yaw:+PJ.yaw.toFixed(2), vel:+PJ.rapidez.toFixed(2)}; },
  get campos(){ return CAMPOS.map(c=>({N:c.N, celda:c.celda, briznas:c.briznas,
    dist:c.mat.uniforms.uDist.value})); },
  get briznas(){ return BRIZNAS; },
  get pantalla(){ return {ROT, caja:[CAJA.w,CAJA.h], rt:[rtEsc.width,rtEsc.height]}; },
  poner(x,z){ PJ.x=x; PJ.z=z; PJ.vx=PJ.vz=0; seguirPasto(x,z); ponerCamara(0.016); },
  mirar(y,c){ if(y!==undefined) PJ.yaw=y; if(c!==undefined) PJ.cabeceo=c; ponerCamara(0.016); },
  ojo(h){ PJ.altoOjo=h; ponerCamara(0.016); },
  palanca(x,y){ palanca.activa=(x||y)!==0; palanca.x=x||0; palanca.y=y||0; },
  aparta(r){ PASTO_U.uRJug.value=r; },
  calidad(n){ autoNivel=(n===undefined); if(n!==undefined){ nivel=n; aplicarNivel(); } return nivel; },
  get piezas(){ let n=0,t=0; escena.traverse(o=>{ if(o.isMesh&&o.visible){ n++;
    const g=o.geometry, ic=g.instanceCount||1;
    t+=(g.index? g.index.count/3 : g.attributes.position.count/3)*ic; } });
    return {mallas:n, tri:Math.round(t)}; }
};

</script>
