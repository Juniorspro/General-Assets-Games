<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

/* ============================================================================
   PASTIZAL · todo procedural, cero archivos

   No hay una sola textura ni un solo modelo descargado: el suelo es un plano
   verde y el pasto son BRIZNAS DE GEOMETRÍA, no tarjetas con una foto pegada.
   Cada brizna es una cinta de unos pocos vértices que nace ancha, se afina
   hasta la punta y se arquea; su alto, su giro, su curva, su tono y su fase de
   viento salen de un hash de la celda donde le tocó caer.

   Son doscientas mil briznas y ninguna se mueve nunca desde JavaScript. Cada
   una tiene un índice fijo en una grilla y el shader calcula qué celda del
   mundo le toca según dónde está parado el jugador:

       celda = uBase + mod(indice - uBase, N)

   Cuando el jugador cruza una celda, uBase cambia en uno y las briznas de una
   sola columna reaparecen del otro lado. Todo el trabajo por cuadro es escribir
   dos floats en un uniform.

   Lo que hace que parezca pasto y no un cepillo:
   · cada brizna se ARQUEA con su propia curva, y el arco decide también hacia
     dónde mira su normal;
   · la normal ABOMBA a lo ancho, como una cinta acanalada, así devuelve una
     franja de brillo en vez de prenderse entera de golpe;
   · a contraluz la hoja se PRENDE, que es lo que hace una de verdad;
   · el viento sopla en RÁFAGAS que se ven cruzar el campo, no parejo;
   · y hay manchones de altura y de tono en grande, porque ningún pastizal es
     de un solo verde.
============================================================================ */
const MOVIL=matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const FOV0=62, BORDE=900;
const CIELO_URL='https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@4528dad985/mundo/cielo/cielo360.jpg';
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

const rotEl=document.getElementById('rot'), stage=document.getElementById('stage');
let ROT=false, CAJA={w:1,h:1};
function acomodarCaja(){
  const vw=innerWidth, vh=innerHeight;
  ROT = vh > vw*1.02;
  CAJA.w = ROT? vh : vw; CAJA.h = ROT? vw : vh;
  rotEl.style.width=CAJA.w+'px'; rotEl.style.height=CAJA.h+'px';
  rotEl.style.transform='translate(-50%,-50%) rotate('+(ROT?90:0)+'deg)';
}
acomodarCaja();
const renderer=new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, MOVIL?1.6:2));
renderer.setSize(CAJA.w, CAJA.h, false);
/* Todo se dibuja en LINEAL sobre un buffer; el tono, el color y el paso a sRGB
   los hace el pase de post, una sola vez y para todos. */
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
stage.appendChild(renderer.domElement);
const escena=new THREE.Scene();
const camara=new THREE.PerspectiveCamera(FOV0, CAJA.w/CAJA.h, 0.03, 2200);
camara.rotation.order='YXZ';

const SOL=new THREE.Vector3();
const CIELO=new THREE.Color(0x6fb6e8), HORIZ=new THREE.Color(0xc8dfe6), SOLC=new THREE.Color(1,0.97,0.9);
/* los dos extremos del horizonte, ya en lineal (el constructor de tres numeros
   no convierte): el naranja del sol rasante y el celeste palido del mediodia */
const H_BAJO=new THREE.Color(0.95,0.55,0.30), H_ALTO=new THREE.Color(0.62,0.74,0.90);
const MATS=[];
let nieblaD=0.011;

/* --------------------------------------------------------------- el ruido
   Un solo hash y un valor interpolado alcanzan para los manchones: no hace
   falta traer una textura para eso. */
const RUIDO_GLSL=`
  float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
  float ruido(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ return ruido(p)*0.55+ruido(p*2.07+11.3)*0.28+ruido(p*4.13+5.7)*0.17; }`;
const NIEBLA_GLSL=`
  vec3 conNiebla(vec3 col, vec3 W, vec3 ojo, vec3 luz, vec3 hor, vec3 solc, float k){
    vec3 dv=W-ojo; float d=length(dv); dv/=max(d,1e-4);
    float f=1.0-exp(-k*d);
    /* el aire se dora mirando a contraluz, pero en un cono ESTRECHO: con
       potencia 6 al 55% medio pastizal se volvia crema en cuanto el sol
       bajaba y entraba en el encuadre */
    vec3 n=mix(hor, solc, pow(max(dot(dv,luz),0.0), 11.0)*0.38);
    return mix(col, n, clamp(f,0.0,1.0));
  }`;
/* ------------------------------------------------------------- las huellas
   Donde hay un edificio no puede haber pasto. Cada construccion deja uno o
   varios circulos y el shader de las briznas las mata adentro, con un borde
   suave: un corte limpio se ve peor que no hacer nada. El suelo, en el mismo
   sitio, se pela y se pone tierra pisada. Van como uniforme compartido porque
   los miran tres materiales distintos. */
/* ------------------------------------------------------------- las pisadas
   Por donde caminaste el pasto queda acostado, y se levanta solo al rato.
   Se lleva en una textura de un canal que cubre una ventana de 140 m alrededor
   del jugador: cuando uno se aleja del centro, el buffer se corre en texeles
   enteros —no se borra— asi la huella queda anclada al mundo y no al jugador.
   Es lo unico que puede guardar un rastro largo: un arreglo de uniformes se
   queda corto a los pocos metros. */
const PIS_N=256, PIS_LADO=140, PIS_ESC=PIS_N/PIS_LADO;
const pisBuf=new Uint8Array(PIS_N*PIS_N);
const pisTex=new THREE.DataTexture(pisBuf, PIS_N, PIS_N, THREE.RedFormat);
pisTex.minFilter=THREE.LinearFilter; pisTex.magFilter=THREE.LinearFilter;
pisTex.wrapS=THREE.ClampToEdgeWrapping; pisTex.wrapT=THREE.ClampToEdgeWrapping;
pisTex.needsUpdate=true;
const PIS_U={ uPis:{value:pisTex}, uPisCen:{value:new THREE.Vector2()},
              uPisEsc:{value:PIS_ESC}, uPisN:{value:PIS_N} };
const PIS_GLSL=`
  uniform sampler2D uPis; uniform vec2 uPisCen; uniform float uPisEsc, uPisN;
  float pisadoEn(vec2 P){
    vec2 t=((P-uPisCen)*uPisEsc+uPisN*0.5)/uPisN;
    if(t.x<0.0||t.x>1.0||t.y<0.0||t.y>1.0) return 0.0;
    return texture2D(uPis, t).r;
  }`;
function recentrarPisadas(x,z){
  const m=PIS_LADO*0.26;
  const dx=x-PIS_U.uPisCen.value.x, dz=z-PIS_U.uPisCen.value.y;
  if(Math.abs(dx)<m && Math.abs(dz)<m) return;
  const tx=Math.round(dx*PIS_ESC), tz=Math.round(dz*PIS_ESC);
  const copia=pisBuf.slice();
  pisBuf.fill(0);
  for(let j=0;j<PIS_N;j++){
    const sj=j+tz; if(sj<0||sj>=PIS_N) continue;
    const fd=j*PIS_N, fo=sj*PIS_N;
    for(let i=0;i<PIS_N;i++){
      const si=i+tx; if(si<0||si>=PIS_N) continue;
      pisBuf[fd+i]=copia[fo+si];
    }
  }
  PIS_U.uPisCen.value.x+=tx/PIS_ESC; PIS_U.uPisCen.value.y+=tz/PIS_ESC;
  pisTex.needsUpdate=true;
}
function pisar(x,z,fuerza,radio){
  const cx=(x-PIS_U.uPisCen.value.x)*PIS_ESC+PIS_N*0.5;
  const cz=(z-PIS_U.uPisCen.value.y)*PIS_ESC+PIS_N*0.5;
  const r=Math.max(1.1, radio*PIS_ESC);
  const i0=Math.max(0,Math.floor(cx-r)), i1=Math.min(PIS_N-1,Math.ceil(cx+r));
  const j0=Math.max(0,Math.floor(cz-r)), j1=Math.min(PIS_N-1,Math.ceil(cz+r));
  for(let j=j0;j<=j1;j++){
    const dz2=(j-cz)*(j-cz), fila=j*PIS_N;
    for(let i=i0;i<=i1;i++){
      const d2=((i-cx)*(i-cx)+dz2)/(r*r);
      if(d2>1) continue;
      const v=(255*fuerza*(1-d2*d2))|0;
      if(v>pisBuf[fila+i]) pisBuf[fila+i]=v;
    }
  }
  pisTex.needsUpdate=true;
}
/* el pasto se levanta solo: un roce lento y parejo sobre todo el buffer */
let pisT=0;
function levantarPasto(dt){
  pisT+=dt;
  if(pisT<0.14) return;
  pisT=0;
  for(let k=0;k<pisBuf.length;k++){
    const v=pisBuf[k];
    if(v) pisBuf[k]= v>2 ? (v*0.982)|0 : 0;
  }
  pisTex.needsUpdate=true;
}


/* ============================================================================
   INTERIORES
   Adentro de una casa la luz no es la de afuera bajada de volumen: es OTRA
   luz. El sol directo no entra salvo por donde hay un hueco, y por ese hueco
   entra un chorro que dibuja un rectangulo nitido en el piso y en la pared de
   enfrente. El resto de lo que se ve es rebote: el cielo que entra difuso por
   las aberturas y lo que rebota de las paredes.

   Aca se resuelve con dos cosas, las dos exactas y baratas:

   · UNA CAJA por interior. Si el punto esta adentro, el sol y el cielo se
     cortan; queda el rebote calido, que es lo que se ve de verdad.
   · UN TEST DE VISIBILIDAD POR ABERTURA. Desde el punto se tira el rayo hacia
     el sol y se pregunta si cruza el rectangulo de alguna ventana o puerta. Si
     lo cruza, ese punto ve el sol y se prende. Eso da el paño de luz en el
     piso, movido segun la hora, sin ningun mapa de sombras.
============================================================================ */
const INT_MAX=4, VENT_MAX=10;
const INTERIORES=[], VENTANAS=[];
const INT_U={
  uInt:{value:Array.from({length:INT_MAX},()=>new THREE.Vector4(0,0,-1,-1))},
  uIntRA:{value:Array.from({length:INT_MAX},()=>new THREE.Vector2(0,0))},
  uIntN:{value:0},
  uVent:{value:Array.from({length:VENT_MAX},()=>new THREE.Vector4(0,0,0,0))},
  uVentHW:{value:Array.from({length:VENT_MAX},()=>new THREE.Vector2(0,0))},
  uVentN:{value:0}
};
function volcarInteriores(){
  const n=Math.min(INT_MAX, INTERIORES.length);
  for(let i=0;i<n;i++){
    const c=INTERIORES[i];
    INT_U.uInt.value[i].set(c.x, c.z, c.hx, c.hz);
    INT_U.uIntRA.value[i].set(c.rot, c.alto);
  }
  INT_U.uIntN.value=n;
  const m=Math.min(VENT_MAX, VENTANAS.length);
  for(let i=0;i<m;i++){
    const v=VENTANAS[i];
    INT_U.uVent.value[i].set(v.x, v.y, v.z, v.rot);
    INT_U.uVentHW.value[i].set(v.hw, v.hh);
  }
  INT_U.uVentN.value=m;
}
const INT_GLSL=`
  uniform vec4 uInt[${INT_MAX}]; uniform vec2 uIntRA[${INT_MAX}]; uniform int uIntN;
  uniform vec4 uVent[${VENT_MAX}]; uniform vec2 uVentHW[${VENT_MAX}]; uniform int uVentN;

  /* 1 adentro, 0 afuera.
     La caja terminaba 3,4 cm ANTES de la cara interna del muro, asi que la
     pared, la puerta y el vidrio VISTOS DESDE EL CUARTO quedaban fuera del
     volumen y se iluminaban como exterior con la normal dada vuelta: negro
     puro (medido, 1 de 255). El arreglo no es agrandar la caja y listo —eso
     meteria adentro tambien la cara de AFUERA del muro y la casa se veria mal
     por fuera—. La regla correcta es geometrica: una superficie es interior si
     esta en la cascara del edificio Y SU NORMAL MIRA AL CENTRO DEL CUARTO. El
     piso y el cielorraso, con normal vertical, entran siempre. */
  float dentroCasa(vec3 W, vec3 N){
    float d=0.0;
    for(int i=0;i<${INT_MAX};i++){
      if(i>=uIntN) break;
      float a=-uIntRA[i].x, c=cos(a), s=sin(a);
      vec2 q=W.xz-uInt[i].xy;
      vec2 l=vec2(q.x*c-q.y*s, q.x*s+q.y*c);
      vec2 e=uInt[i].zw+vec2(0.46);        // hasta pasar el espesor del muro
      float dentro=min(e.x-abs(l.x), e.y-abs(l.y));
      float techo=1.0-smoothstep(uIntRA[i].y+0.05, uIntRA[i].y+0.45, W.y);
      vec2 haciaC=normalize(uInt[i].xy-W.xz+vec2(1e-4));
      float mira=clamp(dot(N.xz, haciaC)*3.5 + abs(N.y)*2.5, 0.0, 1.0);
      d=max(d, clamp(dentro/0.55,0.0,1.0)*techo*mira*step(-0.05,W.y));
    }
    return d;
  }

  /* Cuanto sol le llega a este punto a traves de las aberturas. Se tira el rayo
     al sol y se busca si cruza el rectangulo de alguna: eso es exactamente lo
     que hace una sombra, sin mapa de sombras y sin marchar nada. */
  float solPorVentana(vec3 W, vec3 sol){
    if(sol.y<=0.02) return 0.0;
    float total=0.0;
    for(int i=0;i<${VENT_MAX};i++){
      if(i>=uVentN) break;
      vec3 c=uVent[i].xyz;
      float rot=uVent[i].w;
      vec3 nor=vec3(-sin(rot), 0.0, cos(rot));     // normal del muro
      float dn=dot(nor, sol);
      if(abs(dn)<1e-3) continue;
      float t=dot(nor, c-W)/dn;                    // hasta el plano del muro
      if(t<=0.0) continue;
      vec3 P=W+sol*t;
      vec3 d=P-c;
      float a=d.x*cos(rot)+d.z*sin(rot);           // a lo largo del muro
      float b=d.y;                                 // altura
      vec2 hw=uVentHW[i];
      /* borde suave: una abertura real no da un filo perfecto, el marco tiene
         espesor y el sol tiene medio grado de tamaño */
      float fx=1.0-smoothstep(hw.x*0.78, hw.x, abs(a));
      float fy=1.0-smoothstep(hw.y*0.78, hw.y, abs(b));
      total=max(total, fx*fy);
    }
    return total;
  }
  /* Luz difusa del cielo entrando por las aberturas: cae con la distancia a la
     abertura mas cercana. Es lo que ilumina el resto del cuarto. */
  float cieloPorVentana(vec3 W){
    float mejor=0.0;
    for(int i=0;i<${VENT_MAX};i++){
      if(i>=uVentN) break;
      float d=length(W-uVent[i].xyz);
      mejor=max(mejor, 1.0-smoothstep(0.6, 6.5, d));
    }
    return mejor;
  }`;

/* ============================================================================
   LA OCLUSION AMBIENTAL, A MANO Y SIN PANTALLA
   Un SSAO cuesta un pase entero, muestrea la profundidad veinte veces por pixel
   y se equivoca en todo lo que no esta en pantalla. Aca no hace falta: las
   unicas esquinas que importan ya estan descriptas en datos que el shader tiene
   —la huella dice donde esta el bulto y hasta que altura llega; el interior
   dice donde estan sus cuatro paredes y su techo—. Con eso salen las tres
   cosas que de verdad se ven y que sin ellas dejan todo pegoteado: el rincon
   contra el piso, la franja bajo el alero y el encuentro pared-techo de
   adentro. Cuesta dos bucles cortos y ni un byte de textura.
   Se necesita HUELLA_GLSL y INT_GLSL antes.
============================================================================ */
const AO_GLSL=`
  float aoEdificio(vec3 W, vec3 N){
    float vert=1.0-abs(N.y);                      // cuanto de PARED tiene la cara
    /* contra el piso, una pared ve la mitad del cielo que ve a dos metros */
    float ao=mix(1.0-0.45*vert, 1.0, smoothstep(0.0, 1.10, W.y));
    for(int i=0;i<20;i++){
      if(i>=uHueN) break;
      /* pegado al contorno del bulto Y a la altura de su alero: ahi el techo
         que vuela le tapa el cielo a la pared, y esa franja oscura es lo que
         hace que un alero se lea como alero */
      float d=abs(length(W.xz-uHue[i].xy)-uHue[i].z);
      float h=uHue[i].w;
      float cerca=1.0-smoothstep(0.0, 2.0, d);
      float alero=smoothstep(h-2.4, h-0.35, W.y)*(1.0-smoothstep(h-0.30, h+0.5, W.y));
      ao=min(ao, 1.0-cerca*alero*0.50*vert);
    }
    return ao;
  }
  float aoInterior(vec3 W){
    float ao=1.0;
    for(int i=0;i<${INT_MAX};i++){
      if(i>=uIntN) break;
      float a=-uIntRA[i].x, c=cos(a), s=sin(a);
      vec2 q=W.xz-uInt[i].xy;
      vec2 l=vec2(q.x*c-q.y*s, q.x*s+q.y*c);
      vec2 e=uInt[i].zw;
      float dx=e.x-abs(l.x), dz=e.y-abs(l.y);
      if(dx<-0.5||dz<-0.5) continue;
      float alt=uIntRA[i].y;
      /* Las cuatro contribuciones por separado, no la menor de todas: una
         ESQUINA tapa mas que una pared sola, y si se toma solo la distancia
         mas corta los rincones salen igual de claros que el medio de un muro. */
      /* las distancias van en METROS de cuarto: con noventa centimetros el
         rincon se apagaba antes de que el ojo lo viera y el cuarto seguia
         pareciendo un cubo pintado. Un metro y medio a dos es lo que ocupa de
         verdad la penumbra de una esquina. */
      float k=(1.0-smoothstep(0.0,2.10,max(min(dx,dz),0.0)))*0.42
             +(1.0-smoothstep(0.0,1.30,max(W.y,0.0)))*0.34
             +(1.0-smoothstep(0.0,1.30,max(alt-W.y,0.0)))*0.30
             +(1.0-smoothstep(0.0,1.70,max(dx,0.0)))*(1.0-smoothstep(0.0,1.70,max(dz,0.0)))*0.30;
      ao=min(ao, 1.0-clamp(k,0.0,0.78));
    }
    return ao;
  }`;

/* la curva del cauce, declarada temprano porque la consultan el pasto y el
   suelo, que se crean antes que el rio */
const RIO_X=-34.0, RIO_A=13.0, RIO_K=0.0165, RIO_ANCHO=7.6, RIO_ORILLA=4.2;
const RIO_HONDO=0.55;
const RIO_GLSL=`
  float rioCentro(float z){ return ${RIO_X.toFixed(2)} + ${RIO_A.toFixed(2)}*sin(z*${RIO_K}); }
  float distRio(vec2 P){
    float cx=rioCentro(P.y);
    float dz=${(RIO_A*RIO_K).toFixed(5)}*cos(P.y*${RIO_K});
    return abs(P.x-cx)/sqrt(1.0+dz*dz);
  }
  float fueraDelRio(vec2 P){
    return smoothstep(${RIO_ANCHO.toFixed(2)}, ${(RIO_ANCHO+RIO_ORILLA).toFixed(2)}, distRio(P));
  }`;

const HUELLA_MAX=20;
const HUELLAS=[];
const HUELLA_U={
  uHue:{value:Array.from({length:HUELLA_MAX},()=>new THREE.Vector4(0,0,-1,0))},
  uHueN:{value:0}
};
function volcarHuellas(){
  const a=HUELLA_U.uHue.value, n=Math.min(HUELLA_MAX,HUELLAS.length);
  for(let i=0;i<n;i++) a[i].set(HUELLAS[i].x, HUELLAS[i].z, HUELLAS[i].r, HUELLAS[i].alto||4.0);
  HUELLA_U.uHueN.value=n;
}
const HUELLA_GLSL=`
  uniform vec4 uHue[20]; uniform int uHueN;
  /* distancia al edificio mas cercano; negativa quiere decir adentro */
  float distEdificio(vec2 P){
    float d=1e9;
    for(int i=0;i<20;i++){
      if(i>=uHueN) break;
      d=min(d, length(P-uHue[i].xy)-uHue[i].z);
    }
    return d;
  }
  /* LA SOMBRA, sin mapa de sombras.
     El suelo es un plano en y=0 y cada edificio es un bulto de altura conocida,
     asi que la sombra sale por geometria: se corre la huella en el sentido
     contrario al sol una distancia alto/tan(elevacion) y se la estira en esa
     misma direccion. Para un bulto redondo sobre un plano es EXACTA, cuesta
     unas lineas, y —a diferencia de un shadow map— la reciben tambien las
     briznas, que son cientos de miles y se dibujan por instancia. */
  float sombraSol(vec2 P, vec3 luz){
    float el=max(luz.y, 0.06);
    vec2 dir=normalize(luz.xz+vec2(1e-5));
    float som=0.0;
    for(int i=0;i<20;i++){
      if(i>=uHueN) break;
      float largo=uHue[i].w/el;
      vec2 c=uHue[i].xy - dir*largo*0.5;
      vec2 q=P-c;
      vec2 l=vec2(dot(q,dir), dot(q,vec2(-dir.y,dir.x)));
      float a=uHue[i].z+largo*0.5, b=uHue[i].z;
      float d=length(vec2(l.x/a, l.y/b));
      /* cuanto mas larga la sombra, mas difuso el borde: con sol rasante una
         sombra no tiene filo */
      float suave=mix(0.12, 0.60, clamp(largo/26.0,0.0,1.0));
      som=max(som, 1.0-smoothstep(1.0-suave, 1.0+suave*0.6, d));
    }
    return som*smoothstep(0.02,0.20,luz.y);
  }`;

/* ============================================================================
   EL MAPA DE SOMBRAS
   La elipse analitica de arriba es exacta para un bulto redondo sobre un plano
   y cuesta cuatro lineas, pero no sabe nada de lo que no sea eso: la casa no se
   sombrea a si misma, el galpon no cae en la sombra de la casa, el alero no
   marca el suelo y el jugador no tiene sombra. Todo eso lo tira un mapa de
   profundidad, y es lo que mas separa esta escena de una foto.

   Tres decisiones que hacen que ande y no cueste una fortuna:

   1) EL RECORTE SIGUE AL JUGADOR Y SE AJUSTA A LOS TEXELES. Noventa metros de
      semiancho sobre 2048 texeles dan menos de nueve centimetros por texel, que
      alcanza para el filo de una canaleta. Pero si el recorte se corre una
      fraccion de texel por cuadro, cada borde de sombra se recalcula contra
      otra celda y la sombra HIERVE al caminar —es el defecto que mas canta de
      todos—. Por eso el centro se lleva siempre al texel entero mas cercano.

   2) EL PASTO NO PROYECTA. Son doscientas cincuenta mil briznas por cuadro y no
      entran en ningun presupuesto; ademas una brizna de dos milimetros no tira
      una sombra que se vea. Proyectan los edificios, las barrancas, las ruedas
      de los molinos y el personaje, y nada mas.

   3) EL MAPA MANDA DONDE LLEGA, Y LA ELIPSE DONDE NO. Si se sumaran las dos,
      cada edificio tiraria DOS sombras encimadas y se veria el doble borde. El
      muestreo devuelve tambien cuanto se le puede creer —cero fuera del
      recorte— y con eso se mezcla, asi que a mas de noventa metros la elipse
      sigue siendo lo unico que hay y la transicion no se ve.
============================================================================ */
const SOM_N=MOVIL?1024:2048;
const SOM_R=90;                       // semiancho del recorte, en metros
const SOM_CERCA=-260, SOM_LEJOS=260;  // con el sol rasante el recorte se estira mucho
const SOM_HAY=renderer.capabilities.isWebGL2;
const texProf=new THREE.DepthTexture(SOM_N,SOM_N);
texProf.type=THREE.UnsignedIntType;
texProf.minFilter=THREE.NearestFilter; texProf.magFilter=THREE.NearestFilter;
const rtSombra=new THREE.WebGLRenderTarget(SOM_N,SOM_N,{
  minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter,
  depthTexture:texProf, stencilBuffer:false });
const camSombra=new THREE.OrthographicCamera(-SOM_R,SOM_R,SOM_R,-SOM_R,SOM_CERCA,SOM_LEJOS);
/* el 'arriba' de la camara del sol va en Z y no en Y: mirando casi desde el
   cenit —el sol llega a 74 grados— el eje Y queda casi paralelo a la vista y el
   encuadre se vuelve inestable */
camSombra.up.set(0,0,1);
/* MeshDepthMaterial y no un shader propio: es el unico que ya sabe deformar por
   esqueleto, y el personaje es un SkinnedMesh de 51 huesos */
const matProf=new THREE.MeshDepthMaterial({side:THREE.DoubleSide});
const NO_PROYECTA=[];                 // el cielo, el suelo, el agua y el pasto
const SOM_U={ uSomTex:{value:texProf}, uSomMat:{value:new THREE.Matrix4()},
              uSomPx:{value:1/SOM_N}, uSomRango:{value:SOM_LEJOS-SOM_CERCA},
              uSomOn:{value:SOM_HAY?1.0:0.0} };
const SOM_GLSL=`
  uniform sampler2D uSomTex; uniform mat4 uSomMat;
  uniform float uSomPx, uSomRango, uSomOn;
  /* SESGO SEGUN LA PENDIENTE. Una cara casi de canto al sol se aleja del plano
     del mapa medio texel por texel, asi que compararla con la profundidad
     guardada la deja sombreandose a si misma en rayas —el acne—. El sesgo va en
     METROS y se pasa a profundidad al final: en metros uno sabe lo que esta
     pidiendo (cinco centimetros de piso, sesenta con el sol rasante), en
     unidades del recorte no. */
  float sesgoSom(float ndl){ return (0.05+0.60*(1.0-ndl))/uSomRango; }
  /* peso: cuanto se le puede creer al mapa. Cero fuera del recorte, para que
     ahi siga mandando la elipse analitica; y se apaga contra el borde, porque
     un corte duro se lee como un cuadrado dibujado en el pasto. */
  float pesoSom(vec3 s){
    if(s.z<0.0||s.z>1.0) return 0.0;
    vec2 b=min(s.xy, 1.0-s.xy);
    return smoothstep(0.0, 0.05, min(b.x,b.y));
  }
  /* nueve muestras, para el suelo, los edificios y el agua */
  float sombraMapa(vec3 W, float ndl, out float peso){
    peso=0.0;
    if(uSomOn<0.5) return 0.0;
    vec3 s=(uSomMat*vec4(W,1.0)).xyz;    // ortogonal: w vale 1
    peso=pesoSom(s);
    if(peso<=0.0) return 0.0;
    float z=s.z-sesgoSom(ndl), som=0.0;
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++)
      som+=step(texture2D(uSomTex, s.xy+vec2(float(i),float(j))*uSomPx).r, z);
    return som/9.0;
  }
  /* una sola muestra, para las briznas: son doscientas cincuenta mil y esto
     corre en el vertex. A una brizna no le falta suavizado en el borde de la
     sombra —le falta ancho—, asi que las nueve muestras no se notarian. */
  float sombraMapa1(vec3 W, float ndl, out float peso){
    peso=0.0;
    if(uSomOn<0.5) return 0.0;
    vec3 s=(uSomMat*vec4(W,1.0)).xyz;
    peso=pesoSom(s);
    if(peso<=0.0) return 0.0;
    return step(texture2D(uSomTex, s.xy).r, s.z-sesgoSom(ndl));
  }`;
const _somBias=new THREE.Matrix4().set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1);
const _somV=new THREE.Vector3();
const _somGuarda=[];
function pintarSombras(){
  if(!SOM_HAY) return;
  /* La camara mira EN CONTRA del sol desde el origen del mundo. Dejando la
     rotacion fija y moviendo solo el recorte, los ejes del mapa no giran con el
     jugador —si giraran, el ajuste a texeles de abajo no querria decir nada—. */
  camSombra.position.set(0,0,0);
  camSombra.lookAt(-SOL.x,-SOL.y,-SOL.z);
  camSombra.updateMatrixWorld(true);
  _somV.set(PJ.x,0,PJ.z).applyMatrix4(camSombra.matrixWorldInverse);
  const tex=2*SOM_R/SOM_N;
  const cx=Math.round(_somV.x/tex)*tex, cy=Math.round(_somV.y/tex)*tex;
  camSombra.left=cx-SOM_R; camSombra.right=cx+SOM_R;
  camSombra.bottom=cy-SOM_R; camSombra.top=cy+SOM_R;
  camSombra.updateProjectionMatrix();
  SOM_U.uSomMat.value.copy(_somBias).multiply(camSombra.projectionMatrix)
       .multiply(camSombra.matrixWorldInverse);
  _somGuarda.length=0;
  for(const o of NO_PROYECTA){ _somGuarda.push(o.visible); o.visible=false; }
  escena.overrideMaterial=matProf;
  const antes=renderer.getRenderTarget();
  renderer.setRenderTarget(rtSombra);
  renderer.render(escena,camSombra);
  escena.overrideMaterial=null;
  renderer.setRenderTarget(antes);
  for(let i=0;i<NO_PROYECTA.length;i++) NO_PROYECTA[i].visible=_somGuarda[i];
}

/* ============================================================================
   ATMOSFERA Y NUBES
   Lo que hace que un campo se vea real no son los objetos: es el AIRE que hay
   entre uno y ellos, y la luz que se mueve por encima. Estas dos funciones las
   comparten el cielo, el suelo, las briznas y los edificios, asi que todos
   cuentan la misma historia del mismo dia.
============================================================================ */
const ATMOS_GLSL=`
  /* Dispersion de Rayleigh (el azul del cielo) y de Mie (el halo blanco
     alrededor del sol, que son las particulas grandes). Los coeficientes van
     en las proporciones reales entre canales; la escala es de gusto. */
  const vec3 BETA_R=vec3(5.8,13.5,33.1)*0.052;
  const vec3 BETA_M=vec3(21.0,21.0,21.0)*0.0098;
  float faseR(float mu){ return 0.0596831*(1.0+mu*mu); }
  float faseM(float mu, float g){
    float g2=g*g;
    return 0.1193662*((1.0-g2)*(1.0+mu*mu))/((2.0+g2)*pow(max(1.0+g2-2.0*g*mu,1e-4),1.5));
  }
  /* espesor de aire mirando en una direccion: crece muchisimo hacia el horizonte */
  float masaAire(float y){ return 1.0/(max(y,0.0)+0.14); }

  /* Los coeficientes de arriba estan en las unidades de la atmosfera de
     verdad —por METRO, del orden de 1e-6— y aca las distancias son de juego.
     Usarlos tal cual lava la imagen entera de cian: pasa a sumarse luz
     dispersada del orden de 3 en lineal a cincuenta metros. Asi que de ellos
     se toma solo la PROPORCION entre canales, que es lo que da el color, y la
     densidad la pone el deslizador de niebla. */
  vec3 atmosfera(vec3 dir, vec3 sol, vec3 solc){
    float mu=dot(dir,sol);
    float mv=masaAire(dir.y), ms=masaAire(sol.y);
    vec3 rr=BETA_R/BETA_R.g;                       // (0.43, 1.0, 2.45)
    /* 0.11 y no 0.17: con 0.17 el sol a 26 grados ya le sacaba la mitad del
       azul a TODO el cielo, y eso mas el halo dejaba la boveda entera en un
       gris de (176,175,174) medido. El enrojecimiento del camino del sol tiene
       que llegar cuando el sol esta en el horizonte, no a media tarde. */
    vec3 ext=exp(-rr*ms*0.11);                     // el camino del sol
    /* MENOS MIE. La fase de Mie con g=0.76 vale 2.8 apuntando al sol contra los
       0.25 del Rayleigh: pesada al 14% seguia siendo el TRIPLE del azul, y por
       eso mirando hacia el sol el cielo entero se volvia una lechada blanca en
       la que no se leia ni una nube. Es el mismo halo, solo que del tamano que
       tiene de verdad. */
    vec3 disp=(rr*faseR(mu)*0.92+vec3(faseM(mu,0.70))*0.08)*mv*0.40;
    vec3 col=disp*ext*solc;
    /* el ozono le come un poco el naranja al cenit y deja el azul mas limpio */
    col*=mix(vec3(1.0), vec3(0.92,0.97,1.06), clamp(dir.y*1.3,0.0,1.0));
    return col;
  }
  /* PERSPECTIVA AEREA: la misma cuenta, pero para lo que hay a media distancia.
     No es una niebla gris: es aire azul con el sol dispersandose adentro, y por
     eso lo lejano se aclara Y se tine hacia donde esta el sol. */
  vec3 aereo(vec3 col, vec3 W, vec3 ojo, vec3 sol, vec3 solc, vec3 hor, float k){
    vec3 dv=W-ojo; float d=length(dv); dv/=max(d,1e-4);
    float mu=dot(dv,sol);
    vec3 rr=BETA_R/BETA_R.g;
    /* La EXTINCION casi sin color. Con (rr*0.74+0.26) el azul se apagaba tres
       veces y media mas rapido que el rojo, y como lo que entra ya no es un
       azul propio sino el horizonte, esa diferencia solo dejaba un reborde
       herrumbre de un pixel contra el cielo. Se le deja apenas la pendiente
       que hace falta para que lo lejano pierda el verde antes que el resto. */
    vec3 tau=(rr*0.28+vec3(0.72))*k*d;
    vec3 trans=exp(-tau);
    /* LO QUE ENTRA EN EL CAMINO ES EL HORIZONTE, no un azul calculado aparte.
       La cuenta de antes saturaba en (0.03,0.06,0.13) lineal: azul marino y
       tres veces mas oscuro que el cielo que tenia justo encima. Por eso el
       campo lejano era una franja oscura con un canto duro contra el cielo, en
       lugar de aclararse hasta desaparecer. Le faltaba la masa de aire: el
       cielo mira un camino infinito y el suelo uno de trescientos metros, pero
       la RADIANCIA que entra de costado es la misma en los dos casos.
       Partiendo del horizonte —el mismo color al que ya converge la niebla de
       las briznas, asi que suelo y pastizal se funden juntos— la fase de
       Rayleigh y la de Mie solo lo TINEN: mas frio mirando en contra del sol,
       mas dorado mirando a contraluz. */
    vec3 fac=rr*faseR(mu)*0.74+vec3(faseM(mu,0.72))*0.26;
    vec3 aire=hor*(0.75+2.6*fac)*(0.42+0.58*max(sol.y,0.0));
    /* y el resplandor del sol atravesando el aire, que es lo unico que de
       verdad tiene que sumar por encima del horizonte */
    aire+=solc*pow(max(mu,0.0),12.0)*0.12;
    return col*trans+aire*(1.0-trans);
  }`;

/* Los dos numeros del banco, en JS y no sueltos en el shader, porque los usan
   TRES cosas que tienen que estar de acuerdo: el umbral del cielo, el umbral de
   la sombra en el suelo y el uniforme. Cuando estaban por separado, el cielo se
   marchaba con 0,55 y la sombra del pasto con 0,44: se veian sombras corriendo
   por el campo sin ninguna nube arriba, que es justo lo que el comentario de
   abajo dice que no puede pasar. */
/* 0.56 y no 0.61: atar el techo del banco a la cobertura hizo que los bancos
   flacos se quedaran en panqueque, y con eso se perdio la mitad del cielo
   cubierto. Bajar el umbral devuelve la cantidad de nubes SIN devolver la capa
   pareja, porque los que entran nuevos entran bajos. */
const COB_NUBE=0.56;   // arriba de esto hay nube
const COB_TOPE=0.82;   // y aca el nucleo ya es opaco
/* LA FORMA DEL BANCO, y es lo que decidia si el cielo se veia bien o a barras.
   Con la base a 900 m, 1700 m de espesor y un campo cuyo grano media 300 m, cada
   nube era SEIS VECES MAS ALTA QUE ANCHA. Una capa de nubes se mira siempre de
   canto, asi que esos husos verticales se leian como cortinas colgando —y no
   habia paso de marcha ni filtro que lo arreglara, porque el artefacto era la
   forma, no el muestreo—. Un cumulo de verdad tiene la base cerca de los mil
   metros, unos mil de espesor y entre quinientos y dos mil de ancho: mas ancho
   que alto. Con eso, y solo con eso, el cielo se acomoda. */
const NUBE_BASE=950, NUBE_ESP=1050;   // metros
const NUBE_ESC=0.00055;               // 1/1818 m: el periodo de la octava mas gorda
const NUBES_GLSL=`
  /* ------------------------------------------------------------------------
     UN SOLO CAMPO DE NUBES para todo. La cobertura que se marcha en el cielo
     es la MISMA que apaga el pasto: si fueran dos, verias una sombra en el
     suelo sin nube arriba, y eso rompe la ilusion mas rapido que cualquier
     otra cosa.
     ------------------------------------------------------------------------ */
  vec2 vientoNube(float t){ return vec2(t*0.0075, t*0.0042); }
  /* ------------------------------------------------------------------------
     EL CAMPO SE FILTRA SEGUN EL PASO DE LA MARCHA, octava por octava.
     Este fue el artefacto mas caro de encontrar: el cielo salia con cortinas
     verticales de tres pixeles de ancho colgando de cada nube. No era el
     jitter, ni el bloom, ni los rayos —se probaron los tres apagados—. Es
     geometria: una capa de nubes plana vista casi de canto hace que UNA COLUMNA
     de pantalla recorra siempre la MISMA recta del plano, solo que a distintas
     distancias. Si el campo tiene detalle de cincuenta metros y la marcha da
     pasos de doscientos, que un banco caiga o no dentro de un paso decide la
     columna entera: eso es la cortina.
     La unica salida barata es no muestrear lo que no se puede: cada octava
     entra solo si su periodo le entra al paso, igual que un mipmap. Y como
     apagarlas achica el contraste —y un cumulo a diez kilometros sigue siendo
     blanco, no gris—, se reexpande por la desviacion que queda.
     ------------------------------------------------------------------------ */
  float octNube(float per, float paso){ return clamp(per/max(paso*1.25,1.0)-0.60, 0.0, 1.0); }
  float coberturaNube(vec2 q, float t, float paso){
    vec2 p=q*${NUBE_ESC}+vientoNube(t);
    /* CADA OCTAVA CON SU PROPIA DERIVA. Si todas se corren con el mismo
       viento, el banco entero desfila rígido y las nubes son siempre las
       mismas, sólo que más allá. Dándole a cada octava una dirección y una
       velocidad distintas, la suma nunca vuelve a la misma forma: las nubes se
       deforman solas mientras avanzan. */
    vec2 d1=vec2( t*0.0016,  t*0.0009);
    vec2 d2=vec2(-t*0.0031,  t*0.0013);
    vec2 d3=vec2( t*0.0007, -t*0.0026);
    /* CADA OCTAVA GIRADA UN ANGULO DISTINTO. El ruido de valor vive sobre una
       rejilla alineada a los ejes; si todas las octavas comparten esa rejilla,
       los cuadrados se suman y el banco sale a bloques con los cantos rectos.
       De frente casi no se nota, pero una capa de nubes se mira SIEMPRE de
       canto, y ahi los cantos se leen como barras verticales. */
    mat2 R1=mat2(0.80,-0.60,0.60,0.80), R2=mat2(0.28,-0.96,0.96,0.28);
    /* los periodos en METROS de cada octava: 1818/escala, con q en metros */
    float w1=0.341;
    float w2=0.174*octNube(878.0,paso), w3=0.105*octNube(440.0,paso);
    float w4=0.209*octNube(673.0,paso), w5=0.106*octNube(325.0,paso);
    float w6=0.065*octNube(163.0,paso);
    float c=(ruido(p                       )-0.5)*w1+(ruido(R1*p*2.07+11.3+d1)-0.5)*w2
           +(ruido(R2*p*4.13 + 5.7 +d2      )-0.5)*w3+(ruido(R2*p*2.70+13.1+d1)-0.5)*w4
           +(ruido(R1*p*5.59 +29.6 +d3      )-0.5)*w5+(ruido(R1*p*11.15+15.4+d2)-0.5)*w6;
    float v=w1*w1+w2*w2+w3*w3+w4*w4+w5*w5+w6*w6;
    float cob=0.5+c*0.4655/max(sqrt(v),1e-4);
    /* NACIMIENTO Y MUERTE. Un campo muy grande y muy lento sube y baja el
       umbral local: donde crece, la nube engorda hasta aparecer; donde cae, se
       adelgaza hasta deshacerse. Es lo que hace que el cielo no sea siempre el
       mismo cielo corrido de lugar. */
    float vida=ruido(q*0.00021+vec2(t*0.0021,-t*0.0014)+71.3);
    return cob+(vida-0.5)*0.30;
  }
  /* densidad dentro del banco: la cobertura, tallada por el perfil de altura y
     erosionada por un detalle mas fino en los bordes */
  float densNube(vec3 P, float t, float cobMin, int detalle, float paso){
    float cob=coberturaNube(P.xz, t, paso);
    float h=clamp((P.y-${NUBE_BASE}.0)/${NUBE_ESP}.0, 0.0, 1.0);
    /* CADA BANCO LLEGA HASTA DONDE LE DA LA COBERTURA. Antes el perfil de
       altura era el mismo para todos, asi que TODAS las nubes tenian el mismo
       espesor y la misma silueta: una capa pareja recortada por un umbral, o
       sea manchas de aerografo. Un cumulo crece hacia arriba donde hay
       material —por eso la coliflor— y se queda en panqueque donde hay poco.
       Atando el techo del banco a la cobertura, la misma cuenta que decide si
       hay nube decide cuanto sube, y la silueta deja de ser plana. */
    float espesor=mix(0.26, 1.0, clamp((cob-cobMin)/max(${COB_TOPE.toFixed(2)}-cobMin,1e-3), 0.0, 1.0));
    float hh=clamp(h/espesor, 0.0, 1.0);
    /* perfil: base plana, panza redonda, corona deshilachada */
    float perfil=smoothstep(0.0,0.13,hh)*smoothstep(1.0,0.36,hh);
    /* NORMALIZAR POR LO QUE HAY, no por lo que podria haber. Dividir por
       (1-umbral) suponia que la cobertura llega a 1, y no llega nunca: su
       maximo medido en todo el campo es 0,863 y su excedente MEDIO sobre el
       umbral es 0,15. Con eso el nucleo de un banco daba densidad 0,15 y el
       cielo salia pelado por mas extincion que se le pusiera. Se divide por el
       excedente que de verdad existe (${COB_TOPE.toFixed(2)}), asi el nucleo llega a 1 y solo
       el borde queda por el medio. */
    float d=(cob-cobMin)/max(${COB_TOPE.toFixed(2)}-cobMin,1e-3)*perfil;
    if(d<=0.0) return 0.0;
    d=min(d,1.0);                    // el nucleo no puede pasarse, y (1-d) de abajo se iria negativo
    /* la erosion tiene periodo de 133 y 53 m: por debajo del paso es ruido, y
       por eso tambien se apaga con la distancia */
    float fino=octNube(385.0,paso);
    if(detalle>0 && fino>0.001){
      float er=fbm(P.xz*0.0026+vec2(t*0.02,0.0))*0.6+fbm(vec3(P.xz*0.0065,0.0).xy+P.y*0.004)*0.4;
      /* LA EROSION MUERDE EL BORDE, NO EL NUCLEO. Restar (o remapear) el ruido
         parejo se lleva puesta la nube entera: el ruido vale lo mismo en el
         medio del cumulo que en el fleco. Se pesa por (1-d), o sea que donde la
         densidad ya es 1 la erosion vale cero y donde es fina se la come.
         Eso es lo que deja la panza maciza y la corona deshilachada. */
      /* 0.55 y no 0.30: con 0.30 el fleco seguia siendo un degradado suave y
         el borde de la nube se leia como aerografo. Como va pesada por (1-d),
         subirla NO adelgaza el nucleo —ahi vale cero— y si le come el borde. */
      float k=er*0.55*(1.0-d)*fino;
      d=(d-k)/max(1.0-k,1e-3);
    }
    return clamp(d,0.0,1.0);
  }
  /* SOMBRAS DE NUBES. Se muestrea el campo EN EL PLANO DE LAS NUBES, o sea
     proyectando el punto del suelo hacia el sol: por eso al atardecer las
     sombras se estiran kilometros, como pasa de verdad. Y como sale de la
     misma cobertura que se marcha arriba, la sombra cae donde esta la nube. */
  float sombraNube(vec2 P, float t, vec3 sol){
    vec2 q=P + sol.xz/max(sol.y,0.12)*1500.0;
    /* EL MISMO UMBRAL QUE EL CIELO. Antes eran 0,44 y 0,72 a mano, mas bajos
       que el del banco: la sombra empezaba donde todavia no habia nube. */
    return smoothstep(${COB_NUBE.toFixed(2)}, ${(COB_NUBE+0.14).toFixed(2)}, coberturaNube(q, t, 30.0));
  }`;

/* ============================================================================
   EL CIELO Y EL SUELO
   Los dos procedurales: el cielo es un degradado con el disco del sol y su
   halo; el suelo, un plano verde con manchones de tono. Como el pasto lo tapa
   casi entero, el suelo sólo tiene que dar el color de fondo correcto para que
   los huecos no canten.
============================================================================ */
/* La panoramica 360 va COMO CAPA DE NUBES sobre el cielo calculado, no en su
   lugar. Es a proposito: la foto trae la estructura de nube que ninguna cuenta
   te da, pero el degradado, el color de la hora y el sol tienen que seguir
   saliendo de la dispersion, porque son los mismos que iluminan el pasto. Si se
   pegara la foto entera, al mover el sol el cielo se quedaria quieto mientras
   el campo cambia, y eso canta de lejos. */
/* La panorámica queda cargada pero en peso CERO: el cielo es puramente la
   dispersión de Rayleigh y Mie, que es azul de verdad y —a diferencia de una
   foto— acompaña al sol cuando se mueve. El deslizador de MOTOR la puede
   volver a subir si algún día hace falta. */
const texCielo=new THREE.TextureLoader().load(CIELO_URL);
texCielo.colorSpace=THREE.SRGBColorSpace;
texCielo.wrapS=THREE.RepeatWrapping; texCielo.wrapT=THREE.ClampToEdgeWrapping;
texCielo.minFilter=THREE.LinearMipmapLinearFilter; texCielo.magFilter=THREE.LinearFilter;
texCielo.anisotropy=8;

const cieloMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ luz:{value:SOL.clone()}, uCenit:{value:CIELO.clone()},
             uHoriz:{value:HORIZ.clone()}, uSolC:{value:SOLC.clone()}, uT:{value:0},
             /* La panoramica bajo de 0,20 a 0,12: con las nubes marchadas andando de
                verdad, la foto ya no tiene que inventar el cielo. Se queda con
                lo unico que aporta y la cuenta no da: los cirros de arriba. */
             uPano:{value:texCielo}, uPanoK:{value:0.0},
             uOjoC:{value:new THREE.Vector3()},
             uPasosNube:{value:MOVIL?16:34}, uPasosLuz:{value:MOVIL?2:4},
             /* Con la densidad ya normalizada por el excedente real, el umbral
                vuelve a mandar: medido sobre la marcha completa, 0,61 deja el
                24% del cielo con nube maciza y el 50% de azul limpio entre
                medio. Bajarlo a 0,55 tapaba el 68% —eso ya es un dia nublado,
                no cumulos sueltos. */
             uCobNube:{value:COB_NUBE}, uVolNube:{value:1.0} },
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    precision highp float;
    varying vec3 vD; uniform vec3 luz,uCenit,uHoriz,uSolC; uniform float uT,uPanoK;
    uniform sampler2D uPano; uniform vec3 uOjoC;
    uniform int uPasosNube,uPasosLuz; uniform float uCobNube,uVolNube;
    ${RUIDO_GLSL}
    ${ATMOS_GLSL}
    ${NUBES_GLSL}

    /* ------------------------------------------------------------------------
       NUBES VOLUMETRICAS
       Se marcha el rayo por el banco de nubes acumulando densidad. En cada paso
       se dan unos pocos pasos MAS hacia el sol para saber cuanta nube hay entre
       ese punto y la luz: eso es lo que da el interior oscuro y el borde
       encendido, y es la diferencia entre una nube y una mancha blanca.

       Beer-Lambert para la extincion, Henyey-Greenstein para la fase —por eso
       mirando a contraluz aparece el filo de plata— y una segunda exponencial
       mas suave sumada a la primera, que es el truco viejo para que la nube no
       se ponga negra por dentro como pasa con Beer puro.
       ------------------------------------------------------------------------ */
    float faseHG(float mu, float g){
      float g2=g*g;
      return (1.0-g2)/(12.566370*pow(max(1.0+g2-2.0*g*mu,1e-4),1.5));
    }
    vec4 marcharNubes(vec3 ori, vec3 dir, vec3 sol, vec3 solc, float t){
      if(dir.y<0.020) return vec4(0.0,0.0,0.0,1.0);
      float y0=${NUBE_BASE}.0, y1=${NUBE_BASE+NUBE_ESP}.0;
      float t0=(y0-ori.y)/dir.y, t1=(y1-ori.y)/dir.y;
      t0=max(t0,0.0);
      if(t1<=t0) return vec4(0.0,0.0,0.0,1.0);
      /* mirando bajo, el camino dentro del banco es larguisimo: se recorta o
         cada pixel del horizonte cuesta lo que toda la pantalla */
      t1=min(t1, t0+4500.0);
      int PASOS=uPasosNube;
      float dt=(t1-t0)/float(PASOS);
      float mu=dot(dir,sol);
      /* LA FASE ESTABA SIN NORMALIZAR y por eso el cielo era o blanco cegador o
         negro: faseHG devuelve la densidad de probabilidad, cuya MEDIA sobre la
         esfera es 1/4pi=0,08, asi que a noventa grados del sol la nube valia
         0,03 —negra— y de frente 1,8 —cincuenta veces mas—. Un cumulo de verdad
         no cambia cincuenta veces de brillo segun donde uno se para. Se
         multiplica por 4pi para que la media valga 1 y despues se la aplasta a
         la mitad: queda el filo de plata a contraluz (x4) sin que el resto del
         cielo se apague. */
      float fase=(faseHG(mu,0.62)*0.62+faseHG(mu,-0.22)*0.38)*12.566370;
      fase=mix(1.0, fase, 0.55);

      vec3 acc=vec3(0.0);
      float trans=1.0;
      /* EL ARRANQUE SE CORRE AL AZAR POR PIXEL, si no se ven los escalones de
         la marcha como anillos. Pero h21() no sirve para esto y era la causa de
         las cortinas verticales que tapaban medio cielo: adentro hace
         fract(vec3(p.xyx)*0.1031), o sea que la primera y la tercera componente
         son LA MISMA, el hash degenera, y con la coordenada de pantalla por
         0,37 el patron se repite cada veintiseis pixeles. Eso no es ruido, es
         una rejilla. Se usa ruido de gradiente entrelazado, que es lo que se usa
         para esto: no repite y su grano queda parejo. */
      float jitter=fract(52.9829189*fract(dot(gl_FragCoord.xy, vec2(0.06711056,0.00583715))));
      for(int i=0;i<48;i++){
        if(i>=PASOS) break;
        if(trans<0.02) break;
        vec3 P=ori+dir*(t0+(float(i)+jitter)*dt);
        float dens=densNube(P, t, uCobNube, 1, dt);
        if(dens<=0.001) continue;
        /* cuanta nube hay entre este punto y el sol */
        float sombra=0.0;
        for(int j=1;j<=4;j++){
          if(j>uPasosLuz) break;
          /* pasos de 260 m sobre un banco de mil: con cuatro se cruzan dos
             cumulos enteros, que es lo que hace falta para que el nucleo se
             entere de que esta tapado. */
          vec3 Q=P+sol*(float(j)*260.0);
          sombra+=densNube(Q, t, uCobNube, 0, 300.0);
        }
        float luzN=exp(-sombra*1.35)+0.28*exp(-sombra*0.22);
        /* PANZA GRIS, CORONA ENCENDIDA. Los pasos hacia el sol dan la sombra
           que una nube le tira a la de al lado, pero no la clave del cumulo: la
           luz entra por ARRIBA y la base esta al fondo de mil metros de agua, o
           sea que la panza vive del cielo y no del sol. Contarlo con mas pasos
           costaria el doble; la altura dentro del banco ya lo dice y sale
           gratis. Se le quita el sol a la base, NO el ambiente: por eso la
           panza queda gris azulada y la corona blanca. */
        float hN=clamp((P.y-${NUBE_BASE}.0)/${NUBE_ESP}.0, 0.0, 1.0);
        luzN*=mix(0.16, 1.0, smoothstep(0.05, 0.58, hN));
        /* El cielo que entra de costado tambien lo tapa la nube de arriba: si
           el ambiente se sumaba parejo —y peor, CRECIENDO con la densidad, que
           era lo que habia— la panza salia igual de clara que la corona y el
           cumulo quedaba en mancha blanca. Se lo apaga con la misma sombra. */
        vec3 col=solc*luzN*fase*0.78 + uCenit*0.32*(0.28+0.72*exp(-sombra*0.55));
        /* la extincion estaba tan floja que ni con densidad 1 en TODO el banco
           una columna al cenit pasaba de 0,85 de opacidad; con la densidad real
           daba 0,05. A 0,008 un nucleo tapa el cielo y un fleco no. */
        float ext=exp(-dens*dt*0.0030);
        acc+=trans*(1.0-ext)*col;
        trans*=ext;
      }
      /* LA BRUMA SE COME LAS NUBES DE LEJOS. Pegada al horizonte, una nube
         esta a veinte kilometros y la atmosfera se le pone delante: sin esto
         quedaban confetis blancos y duros clavados sobre la linea del campo,
         mas contrastados que la casa que tenes a treinta metros. */
      float bruma=1.0-smoothstep(0.020, 0.24, dir.y);
      acc=mix(acc, uHoriz*(1.0-trans)*1.05, bruma*0.85);
      trans=mix(trans, 1.0, bruma*0.55);
      return vec4(acc, trans);
    }

    void main(){
      vec3 d=normalize(vD);
      float h=clamp(d.y,-1.0,1.0);
      /* el degradado real del cielo no es lineal: se abre rápido cerca del
         horizonte y se aplana arriba */
      /* El cielo sale de la DISPERSION, no de un degradado a mano: Rayleigh
         para el azul, Mie para el halo, y la extincion del camino del sol para
         el naranja del atardecer. Se mezcla con el degradado viejo para no
         perder el control de los deslizadores. */
      vec3 fis=atmosfera(d, luz, uSolC);
      vec3 grad=mix(uHoriz, uCenit, pow(clamp(h,0.0,1.0), 0.42));
      grad=mix(grad, uHoriz*0.86, clamp(-h*3.0,0.0,1.0));
      vec3 col=mix(grad, fis, 0.60);
      float ds=max(dot(d, luz), 0.0);
      /* HALO, no lechada. Con potencia 5 el halo del sol todavia valia un tercio
         a cuarenta grados del disco: o sea que la mitad del cielo estaba
         blanqueada y mirando hacia el sol no se leia ni una nube. Potencia 16
         lo deja en los quince grados que ocupa de verdad, y como se concentra
         se le puede subir el brillo sin lavar nada. */
      col+=uSolC*pow(ds, 26.0)*0.34;
      /* el disco con OSCURECIMIENTO DE LIMBO: un sol real no es un plato
         parejo, se apaga hacia el borde */
      float disco=smoothstep(0.99960, 0.99990, ds);
      float limbo=sqrt(max(1.0-pow(clamp((1.0-ds)/0.0004,0.0,1.0),2.0),0.0));
      col+=uSolC*disco*(0.50+0.50*limbo)*18.0;
      /* --- las nubes volumetricas, sobre todo lo demas --- */
      float libre=1.0;                 // cuanto cielo queda sin tapar por la nube marchada
      if(uVolNube>0.5){
        vec4 n=marcharNubes(uOjoC, d, luz, uSolC, uT);
        col=col*n.w + n.rgb;
        libre=n.w;
      }
      /* LA PANORAMICA 360, en coordenadas equirectangulares: la longitud sale
         del angulo alrededor del eje vertical y la latitud del angulo con el
         horizonte. Se desplaza despacio, que es el viento en altura. */
      if(h>-0.02){
        vec2 uvp=vec2(atan(d.z,d.x)/6.2831853+0.5+uT*0.0016,
                      1.0-(asin(clamp(d.y,-1.0,1.0))/3.14159265+0.5));
        vec3 foto=texture2D(uPano, uvp).rgb;
        foto*=foto;                                  // a lineal, aproximado
        /* De la foto se toma SOLO la nube: se compara contra su propio cielo de
           fondo, y lo que sobresale es nube. Asi la panoramica no impone su
           color —que es de otra hora— sino su forma. */
        float lum=dot(foto, vec3(0.2126,0.7152,0.0722));
        float base=0.10+0.30*max(d.y,0.0);
        float nube=clamp((lum-base)*2.6, 0.0, 1.0);
        nube*=smoothstep(-0.02,0.16,h);              // se apaga contra el horizonte
        /* la nube se ilumina con el sol de la escena, no con el de la foto */
        vec3 tono=mix(vec3(0.86,0.88,0.93), uSolC*1.18, pow(ds,3.0)*0.55);
        vec3 nubeCol=tono*(0.55+0.75*lum);
        /* SOLO DONDE NO HAY NUBE MARCHADA. La foto se pintaba encima de todo,
           asi que sobre un cumulo con panza gris le encajaba una mancha clara
           plana y le borraba el volumen que acababa de costar treinta pasos.
           Multiplicada por lo que queda libre, la panoramica cumple su papel
           —cirros y estructura alta donde el cielo esta vacio— y se calla donde
           la nube de verdad ya dijo algo. */
        col=mix(col, nubeCol, nube*uPanoK*libre);
      }
      gl_FragColor=vec4(col,1.0);
    }`
});
MATS.push(cieloMat);
const cielo=new THREE.Mesh(new THREE.SphereGeometry(1500,40,26), cieloMat);
cielo.frustumCulled=false;
/* EL CIELO VA ULTIMO. Antes se dibujaba primero y cada pixel marchaba las
   nubes aunque despues lo tapara el pasto: con doscientas mil briznas encima,
   eso es marchar la pantalla entera al pepe. Dibujandolo al final y con el test
   de profundidad prendido, solo marchan los pixeles que de verdad son cielo.
   Es la optimizacion que paga las nubes volumetricas. */
cielo.renderOrder=900;
NO_PROYECTA.push(cielo);
cieloMat.depthTest=true; cieloMat.depthWrite=false;
escena.add(cielo);

const matSuelo=new THREE.ShaderMaterial({
  uniforms:Object.assign({ luz:{value:SOL.clone()}, uOjo:{value:new THREE.Vector3()},
    uSolC:{value:SOLC.clone()}, uCielo:{value:CIELO.clone()}, uHoriz:{value:HORIZ.clone()},
    uFogD:{value:nieblaD}, uT:{value:0} }, HUELLA_U, PIS_U, INT_U, SOM_U),
  /* el plano sigue al jugador, así que la posición del mundo hay que sacarla de
     la matriz del objeto y no del atributo, o los manchones viajarían con uno */
  vertexShader:`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0);
    vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`
    precision highp float;
    varying vec3 vW; uniform vec3 luz,uOjo,uSolC,uCielo,uHoriz; uniform float uFogD,uT;
    ${RUIDO_GLSL}
    ${HUELLA_GLSL}
    ${SOM_GLSL}
    ${PIS_GLSL}
    ${INT_GLSL}
    ${RIO_GLSL}
    ${ATMOS_GLSL}
    ${NUBES_GLSL}
    ${NIEBLA_GLSL}
    void main(){
      /* el mismo campo de manchones que decide la altura del pasto, para que el
         suelo y las briznas cuenten la misma historia */
      float m=fbm(vW.xz*0.035);
      float g=fbm(vW.xz*0.21+31.7);
      /* Estaba demasiado oscuro: entre las briznas se veían huecos casi negros
         y el pastizal se leía sucio. La tierra bajo un pastizal tiene hojarasca
         y raíz seca, que es marrón claro, no negro. */
      vec3 col=mix(vec3(0.070,0.098,0.048), vec3(0.118,0.150,0.066), m);
      col=mix(col, vec3(0.078,0.082,0.036), smoothstep(0.62,0.92,g)*0.35);
      col*=0.82+0.36*ruido(vW.xz*1.7);

      /* DETALLE POR DISTANCIA.
         El problema del suelo de antes era que su frecuencia mas alta media
         sesenta centimetros: a medio metro del ojo eso es un manchon marron y
         nada mas. Se le agregan octavas finas, PERO solo cerca: mantenerlas a
         lo lejos no aporta nada y alias contra el pixel, que es peor que no
         tenerlas. */
      /* EL AGUJERO DEL CAUCE. El suelo es un plano infinito a y=0 y el agua va
         mas abajo: sin descartar el canal, el plano tapa el rio entero y no se
         ve una gota. Se descarta justo hasta donde arranca la barranca, que es
         geometria de verdad y se dibuja aparte. */
      if(distRio(vW.xz) < ${(RIO_ANCHO+RIO_ORILLA).toFixed(2)}) discard;
      float fr=fueraDelRio(vW.xz);
      float dOjo=length(vW.xz-uOjo.xz);
      float det=1.0-smoothstep(2.5,22.0,dOjo);
      float det2=1.0-smoothstep(0.8,7.0,dOjo);

      /* tierra pisada alrededor de lo construido */
      float dE=distEdificio(vW.xz);
      float pisado=1.0-smoothstep(-0.5,2.6,dE);
      float pis=pisadoEn(vW.xz);
      float tie=clamp(pisado*0.94+pis*0.55,0.0,1.0);

      /* La tierra, ahora con cuatro escalas y granos sueltos. La mezcla entre
         terrones claros y oscuros la decide un ruido de escala media, asi que
         no queda un marron parejo sino un piso con manchas y polvo. */
      vec3 t1=vec3(0.128,0.098,0.061), t2=vec3(0.086,0.062,0.038);
      float tm=ruido(vW.xz*0.9)*0.55+ruido(vW.xz*3.3)*0.45;
      vec3 tierra=mix(t2,t1,tm);
      tierra*=0.86+0.28*ruido(vW.xz*8.0+5.1)*det;
      tierra*=0.92+0.18*ruido(vW.xz*26.0)*det;
      /* pedregullo: puntos claros dispersos, casi nada pero se nota al caminar */
      float piedra=smoothstep(0.80,0.94,ruido(vW.xz*47.0+2.7))*det2;
      tierra=mix(tierra, vec3(0.30,0.27,0.23), piedra*0.55);
      /* grietas de barro seco */
      float gr=ruido(vW.xz*5.5+11.0);
      float grieta=smoothstep(0.47,0.50,gr)*smoothstep(0.53,0.50,gr);
      tierra*=1.0-grieta*0.45*det;
      tie=clamp(tie+(1.0-fr)*0.95, 0.0, 1.0);
      col=mix(col, tierra, tie);
      col=mix(col*vec3(0.62,0.66,0.60), col, fr);   // humedad junto al agua
      /* EL CAMPO LEJANO ES PASTIZAL, NO LA TIERRA DE ABAJO. Mas alla de donde
         mueren las briznas queda este plano solo, y su verde es el del suelo
         BAJO el manojo: la mitad de claro que el manojo visto de lejos. De ahi
         el disco de pasto brillante centrado en el jugador con un escalon neto
         al campo, que ademas se movia con el. Se lo lleva al color que tiene un
         pastizal a cien metros, y el escalon desaparece porque las briznas se
         van apagando justo en ese tramo. */
      float manto=smoothstep(16.0, 56.0, dOjo)*(1.0-tie);
      col=mix(col, mix(vec3(0.050,0.104,0.026), vec3(0.088,0.170,0.040), m), manto*0.90);

      /* RELIEVE: la tierra deja de ser un plano pintado. La normal sale de las
         derivadas del propio ruido, asi que los terrones se prenden y se apagan
         segun de donde venga el sol. */
      float e=0.06;
      float hC=ruido(vW.xz*8.0+5.1)+0.45*ruido(vW.xz*26.0);
      float hX=ruido((vW.xz+vec2(e,0.0))*8.0+5.1)+0.45*ruido((vW.xz+vec2(e,0.0))*26.0);
      float hZ=ruido((vW.xz+vec2(0.0,e))*8.0+5.1)+0.45*ruido((vW.xz+vec2(0.0,e))*26.0);
      vec3 Nt=normalize(vec3(-(hX-hC)/e*0.16, 1.0, -(hZ-hC)/e*0.16));
      vec3 Ns=mix(vec3(0.0,1.0,0.0), Nt, tie*det);
      /* OCLUSION AMBIENTAL DEL PISO. Dos cosas le tapan el cielo: la pared que
         tiene al lado y el propio pastizal. La pared es un rincon y se apaga en
         un metro; el pastizal es un techo de briznas y se apaga en cuatro.
         Sin esto el pasto corta contra el zocalo con una linea de navaja y con
         el mismo brillo que el pasto abierto, que es lo que mas delata que
         estan solo apoyados uno al lado del otro. */
      float aoPared=mix(0.42, 1.0, smoothstep(-0.7, 1.1, dE))
                   *mix(0.74, 1.0, smoothstep(0.0, 4.2, dE));
      float aoPasto=mix(1.0, 0.48, (1.0-tie)*smoothstep(0.05,0.55,m));
      col*=aoPared*aoPasto;

         porque decide cuanta tierra hay) */
      col=mix(col, col*vec3(0.70,0.66,0.58), pis*0.42);
      /* LA SOMBRA QUE TIRA EL EDIFICIO SOBRE EL CAMPO. Donde llega el mapa
         manda el mapa; mas alla de los noventa metros del recorte vuelve la
         elipse analitica, que es lo unico que hay. Sumarlas seria dibujar dos
         sombras encimadas y se veria el doble borde. */
      float ndl=max(dot(Ns,luz),0.0);
      float pesoS; float somM=sombraMapa(vW, ndl, pesoS);

         larga y se ve— som=1 restaba un 18% del brillo, y con el sol a 74,

         57%. La sombra se marcaba justo cuando no habia sombra que ver.
         Ahora el sol se apaga ENTERO en la sombra y lo que queda es el cielo,
         que es literalmente lo que pasa: por eso la sombra es fria y no negra,
         y por eso su contraste ya no depende de la hora. */
      float dir=mix(max(luz.y,0.0), ndl, tie*det)*(1.0-som)*(1.0-nub*0.60);
      col*=(0.12+0.88*dir)*uSolC*1.45 + uCielo*(0.42+som*0.12+nub*0.06);

   Una cinta de S tramos: dos vértices por tramo y uno solo en la punta. Nace
   ancha, se afina y se arquea. Todo lo demás —dónde cae, cuánto mide, hacia

const PASTO_U={

const CAMPOS=[];
function crearCampo(o){
  const N=o.N, S=o.segs;

  const pos=[], idx=[];
  for(let k=0;k<S;k++){ const v=k/S; pos.push(-1,v,0, 1,v,0); }
  pos.push(0,1,0);
  for(let k=0;k<S-1;k++){ const a=k*2; idx.push(a,a+1,a+3, a,a+3,a+2); }

      uAltoMin:{value:o.altoMin}, uAltoMax:{value:o.altoMax} }, PASTO_U, HUELLA_U, PIS_U, SOM_U),

      uniform vec3 uJug,uOjo;

      void main(){

           pixel: es el enrejado en cruz que se veia sobre el pasto y sobre el
           agua. Fundir el ultimo tercio del campo lo saca sin que se note el
           borde. */
        alto*=1.0-smoothstep(uDist*0.58, uDist*0.98, dcam);

                                +0.20*sin(P.x*0.041-P.y*0.063-uT*0.33));
        float osc=sin(uT*1.9+P.x*0.7+P.y*0.55+r4*6.283)+0.42*sin(uT*3.7+P.x*1.5-P.y*1.1);
        float dob=(uArco*(0.35+r6*1.6) + uViento*raf*osc*0.60)*v*v;

           ancho como una hoja acanalada. Sin eso la brizna se prende entera de
           golpe y el pastizal titila. */
        float dv=2.0*dob*v;                        // derivada del arco
        vec3 tan=normalize(vec3(dir.x*dv, 1.0-dob*dob*0.64*v, dir.y*dv));
        vec3 lat3=vec3(late.x,0.0,late.y);

        vV=v; vTono=0.80+r2*0.40; vSeco=smoothstep(0.62,1.0,r6);

           la punta que asoma del borde de la sombra se prende y la base sigue
           apagada, que es lo que pasa contra una pared. */
        float pesoS; float somM=sombraMapa1(W, max(luz.y,0.05), pesoS);
        vSom=mix(sombraSol(P, luz), somM, pesoS);
        vNub=sombraNube(P, uT, luz);     // y la nube que pasa por encima

           mas del doble de senal que el rojo y seis veces la del azul, y al
           pasar por la vibranza el pastizal salia fosforescente. El pasto de
           verdad no es un verde de un solo canal: tiene rojo adentro. */
        vec3 col=mix(vec3(0.026,0.062,0.022), vec3(0.180,0.360,0.078), pow(vV,0.80));

        /* MENOS Y MAS ANGOSTA. Con potencia 2.4 al 85% y multiplicada por 3.2

           contraluz el pastizal entero se iba a (132,172,89) —amarillo verdoso
           lavado, con el negro mas profundo del cuadro en 42— y se comia todo
           el contraste que el resto del grado gana. Una hoja se prende cuando
           el sol le pega CASI de atras, no en medio cielo. */
        float atras=pow(max(dot(-E,luz),0.0),3.6)*0.50*vV

/* ============================================================================
   LOS EDIFICIOS
   Un casco de estancia en medio del pastizal: la casa, el galpon, dos silos,
   el molino y el alambrado. Todo procedural, como el resto: no entra ni un
   archivo de modelo ni una textura.

   Tres cosas hacen que no queden pegoteados encima del pasto:

   1) Comparten el sol y la niebla. El material se anota en MATS, asi que
      cuando se mueve el sol o se cierra la niebla, los edificios acompanian.
      Un material propio con luz fija cantaria a la legua.
   2) El pasto no los atraviesa. Cada edificio deja su HUELLA —un par de
      circulos— y el shader de las briznas mata las que caen adentro, con un
      borde suave para que no quede un corte de cuchillo. El suelo, en el
      mismo lugar, se pela y se pone tierra.
   3) Se chocan. Las paredes son cajas orientadas de verdad y el jugador se
      frena contra ellas; las puertas son huecos reales, se entra caminando.

   La textura es de shader y en metros del mundo: la chapa acanalada, los
   tablones, las hiladas de ladrillo y las tejas salen de la posicion, asi que
   dos paredes distintas nunca repiten el mismo dibujo.

const V=[], NR=[], CL=[], TP=[], UV=[];   /* posicion, normal, color, tipo, uv */
const CHOQUES=[];                          /* cajas orientadas para el jugador */
/* tipos de superficie que entiende el shader */

/* El lecho y las barrancas usaban T_LADRILLO —el tipo que dibuja hiladas
   trabadas— asi que el fondo del rio salia literalmente empedrado de ladrillos.
   Tienen su tipo propio: barro con canto rodado. */

/* Los vidrios y las puertas NO pueden vivir en la malla opaca: el vidrio tiene
   que ser transparente y la puerta tiene que girar sobre su eje. Asi que el
   emisor de vertices se puede DESVIAR a otro juego de arrays sin tocar ninguna
   de las funciones que dibujan —caja, cara, pared siguen igual—. */
let DEST=null;
function vert(x,y,z, nx,ny,nz, c, t, u,v){
  const D=DEST;
  if(D){ D.V.push(x,y,z); D.NR.push(nx,ny,nz); D.CL.push(c[0],c[1],c[2]);
         D.TP.push(t); D.UV.push(u,v); return; }
  V.push(x,y,z); NR.push(nx,ny,nz); CL.push(c[0],c[1],c[2]); TP.push(t); UV.push(u,v);

const nuevoDest=()=>({V:[],NR:[],CL:[],TP:[],UV:[]});
function geometriaDeDest(D){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(D.V,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(D.NR,3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(D.CL,3));
  g.setAttribute('tipo',     new THREE.Float32BufferAttribute(D.TP,1));
  g.setAttribute('uvm',      new THREE.Float32BufferAttribute(D.UV,2));
