<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>POLÍGONO · sprites 2D en 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0c10;color:#e8eaf0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  #err{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#8e2b20;color:#fff;
    font:11px/1.5 ui-monospace,monospace;padding:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20}
  #ammo{position:absolute;right:18px;bottom:14px;font:800 30px/1 ui-monospace,monospace;
    letter-spacing:2px;color:#eef2f6;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  #ammo small{font-size:15px;color:#8c98a6;font-weight:700}
  #ammo.low{color:#ff8a7a}
  #score{position:absolute;left:18px;top:14px;font:700 12px/1.7 ui-monospace,monospace;
    letter-spacing:3px;color:#c9d3dd;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  #score b{color:#ffce9e}
  #hint{position:absolute;left:18px;bottom:14px;font:600 10px/1.8 ui-monospace,monospace;
    letter-spacing:2px;color:#7e8894;text-shadow:0 2px 6px rgba(0,0,0,.9)}

  /* ---------- Menú ---------- */
  #menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;text-align:center;padding:28px;
    background:radial-gradient(70% 70% at 50% 40%,rgba(14,22,34,.82),rgba(3,5,9,.97))}
  #menu.hide{display:none}
  #menu .eyebrow{font-size:10px;letter-spacing:10px;color:#6fa8dc}
  #menu h1{font-size:clamp(24px,7vw,52px);font-weight:900;letter-spacing:5px;color:#dce8f4;
    text-shadow:0 3px 0 #14202e, 0 8px 22px rgba(0,0,0,.8)}
  #menu p{color:#8a929c;max-width:460px;font-size:12px;line-height:1.9}
  #menu .play{margin-top:8px;pointer-events:auto;cursor:pointer;font:900 14px/1 ui-monospace,monospace;
    letter-spacing:5px;padding:17px 44px;border-radius:5px;border:2px solid #5f9ad4;color:#fff;
    background:linear-gradient(180deg,#3f7fbe,#1e4a76);box-shadow:0 7px 0 #12293f}
  #menu .play:active{transform:translateY(3px);box-shadow:0 4px 0 #12293f}

  /* ---------- Mandos táctiles ---------- */
  #touch{position:fixed;inset:0;z-index:40;display:none}
  #touch.on{display:block}
  #stick{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;
    border:2px solid rgba(190,210,230,.30);background:rgba(10,16,24,.34)}
  #knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;
    background:rgba(215,230,245,.55);border:2px solid rgba(255,255,255,.5)}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(190,210,230,.34);
    background:rgba(12,20,30,.42);color:#dfe8f2;font:800 12px/1 ui-monospace,monospace;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center}
  #bFire{right:24px;bottom:118px;width:104px;height:104px;font-size:14px}
  #bFire:active{background:rgba(220,90,60,.55)}
  #bReload{right:146px;bottom:34px;width:70px;height:70px}
  #bJump{right:38px;bottom:26px;width:70px;height:70px}
</style>
</head>
<body>
<div id="err"></div>
<div id="stage"></div>

<div id="hud">
  <div id="score">BLANCOS <b id="hits">0</b> / <span id="total">0</span></div>
  <div id="ammo"><span id="mag">30</span><small> / <span id="res">90</span></small></div>
  <div id="hint"></div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="tbtn" id="bFire">FUEGO</div>
  <div class="tbtn" id="bReload">R</div>
  <div class="tbtn" id="bJump">▲</div>
</div>

<div id="menu">
  <div class="eyebrow">EXPERIMENTO BASE</div>
  <h1>POLÍGONO</h1>
  <p id="mtxt">Sprites 2D de mano y arma sobre un mundo 3D.</p>
  <button class="play" id="playBtn">▶ ENTRAR</button>
</div>

 window.addEventListener('error',e=>{const b=document.getElementById('err');b.style.display='block';

 window.addEventListener('unhandledrejection',e=>{const b=document.getElementById('err');b.style.display='block';
   b.textContent+='PROMISE: '+((e.reason&&e.reason.message)||e.reason)+'\n';});
</script>

<script type="module">
import * as THREE from 'three';

const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
document.getElementById('mtxt').textContent = IS_TOUCH
  ? 'Sprites 2D de mano y arma sobre un mundo 3D. Joystick para andar, arrastrá para mirar.'
  : 'Sprites 2D de mano y arma sobre un mundo 3D. WASD para andar, ratón para mirar, clic para disparar, R para recargar.';
document.getElementById('hint').textContent = IS_TOUCH ? '' : 'WASD · RATÓN · CLIC DISPARA · R RECARGA · MAYÚS CORRE';

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

/* ============================================================================
   MUNDO — cielo 360 y suelo gris
============================================================================ */
const scene=new THREE.Scene();
const SHOOT=[];      // sólo esto entra en el rayo: los sprites de chispa lo rompen
const camera=new THREE.PerspectiveCamera(75, 1, 0.05, 900);
camera.position.set(0, 1.68, 8);

{
  const sky=new THREE.TextureLoader().load(FPSDATA.sky, t=>{
    t.mapping=THREE.EquirectangularReflectionMapping;
    t.colorSpace=THREE.SRGBColorSpace;
    scene.background=t;
  });
  scene.fog=new THREE.Fog(0x9aa2ad, 90, 480);
}

/* Suelo: gris de calibración, con rejilla tenue para que se lea el movimiento */
function floorTex(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle='#666c74'; x.fillRect(0,0,512,512);
  for(let i=0;i<26000;i++){
    const v=Math.random()*26-13;
    x.fillStyle=`rgba(${102+v|0},${108+v|0},${116+v|0},.55)`;
    x.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }
  x.strokeStyle='rgba(56,62,70,.55)'; x.lineWidth=3;
  x.strokeRect(0,0,512,512);
  x.strokeStyle='rgba(150,158,168,.16)'; x.lineWidth=1;
  for(let i=64;i<512;i+=64){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,512);
    x.moveTo(0,i); x.lineTo(512,i); x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(160,160); t.anisotropy=8;
  return t;
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),
  new THREE.MeshStandardMaterial({ map:floorTex(), roughness:0.94, metalness:0.02 }));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

SHOOT.push(ground);

/* Luz de amanecer, a juego con el cielo */
{
  const sun=new THREE.DirectionalLight(0xffe6c4, 1.85);
  sun.position.set(-60, 42, 34); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  const c=sun.shadow.camera; c.left=-45;c.right=45;c.top=45;c.bottom=-45;c.near=1;c.far=160;
  sun.shadow.bias=-0.0012;

  scene.add(new THREE.HemisphereLight(0xbcd6f2, 0x5c636c, 0.85));
  scene.add(new THREE.AmbientLight(0xffffff, 0.16));
}

/* ============================================================================
   BLANCOS — placas de acero que se abaten al recibir un tiro
============================================================================ */
const targets=[];
{
  const steel=new THREE.MeshStandardMaterial({color:0xd9dde2, roughness:0.42, metalness:0.75});
  const post =new THREE.MeshStandardMaterial({color:0x3b4048, roughness:0.7, metalness:0.4});
  const paint=new THREE.MeshStandardMaterial({color:0xe0552f, roughness:0.6});
  function plate(x,z,h){
    const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,h,8), post);
    p.position.y=h/2; p.castShadow=true; g.add(p); SHOOT.push(p);
    const piv=new THREE.Group(); piv.position.y=h; g.add(piv);
    const d=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.06,22), steel);
    d.rotation.x=Math.PI/2; d.castShadow=true; d.receiveShadow=true; piv.add(d); SHOOT.push(d);
    const r=new THREE.Mesh(new THREE.TorusGeometry(0.26,0.035,8,24), paint);
    r.position.z=0.045; piv.add(r);
    const o=new THREE.Object3D(); // el disco es el que se puede impactar
    targets.push({ g, piv, disc:d, down:false, t:0 });
    return g;
  }
  const R=[[-9,-16,1.5],[-3,-19,1.2],[3,-19,1.6],[9,-16,1.3],
           [-14,-26,1.7],[-6,-29,1.4],[0,-31,1.8],[6,-29,1.4],[14,-26,1.7],
           [-20,-40,1.6],[0,-44,2.0],[20,-40,1.6]];
  for(const [x,z,h] of R) plate(x,z,h);
  document.getElementById('total').textContent=targets.length;

  // Algún bloque para que el suelo no sea infinito y liso
  const conc=new THREE.MeshStandardMaterial({color:0x8e939a, roughness:0.9});
  for(const [x,z,w,h,d] of [[-16,-8,3,1.1,1.4],[15,-10,2.4,0.8,1.4],[-2,-36,26,0.5,1.0],[0,-52,44,3.2,1.2]]){
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), conc);
    b.position.set(x,h/2,z); b.castShadow=true; b.receiveShadow=true; scene.add(b); SHOOT.push(b);
  }
}

/* ============================================================================
   IMPACTOS — chispa, marca en el suelo y trazadora
============================================================================ */
const sparks=[], decals=[], tracers=[];
const decalMat=new THREE.MeshBasicMaterial({color:0x1b1d21, transparent:true, opacity:0.85,
  depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4});
const decalGeo=new THREE.CircleGeometry(0.055, 10);
const sparkMat=new THREE.SpriteMaterial({color:0xffd08a, transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending});
function impact(p, n, metal){
  const s=new THREE.Sprite(sparkMat.clone());
  s.position.copy(p); s.scale.setScalar(metal?0.55:0.30); scene.add(s);
  sparks.push({s, t:0, life:metal?0.16:0.10});
  if(!metal){
    const d=new THREE.Mesh(decalGeo, decalMat);
    d.position.copy(p).addScaledVector(n, 0.006);
    d.lookAt(p.clone().add(n));
    scene.add(d); decals.push(d);
    if(decals.length>90){ scene.remove(decals.shift()); }
  }
}
const tracerMat=new THREE.LineBasicMaterial({color:0xffe3a8, transparent:true, opacity:0.75});
function tracer(a,b){
  const g=new THREE.BufferGeometry().setFromPoints([a,b]);
  const l=new THREE.Line(g, tracerMat.clone()); scene.add(l);
  tracers.push({l, t:0});
}

/* ============================================================================
   SONIDO
============================================================================ */
let AC=null, master=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
}
function noiseBuf(sec){
  const n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function shot(){
  if(!AC) return; const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=noiseBuf(0.4);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.6;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0008,t+0.24);
  s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t+0.42);
  const o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13);
  const og=AC.createGain(); og.gain.setValueAtTime(0.7,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(og).connect(master); o.start(t); o.stop(t+0.2);
}
function ping(){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(1750,t); o.frequency.exponentialRampToValueAtTime(880,t+0.28);
  const g=AC.createGain(); g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.0008,t+0.42);
  o.connect(g).connect(master); o.start(t); o.stop(t+0.45);
}
function clack(f,v){
  if(!AC) return; const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=noiseBuf(0.09);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=2.4;
  const g=AC.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0006,t+0.085);
  s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t+0.1);
}
function dry(){ clack(2600,0.22); }

/* ============================================================================
   EL ARMA EN PANTALLA — sprites 2D dibujados en una capa ortográfica.
   Va DENTRO del render, no en el DOM: así entra en cualquier captura y se
   puede empujar con el retroceso como si fuera un viewmodel de verdad.
============================================================================ */
const hudScene=new THREE.Scene();
const hudCam=new THREE.OrthographicCamera(-1,1,1,-1,0,10);
hudCam.position.z=5;

/* Cada animación es UNA hoja de sprites y se recorre moviendo el UV.
   Así son cuatro texturas y no cuarenta, y los fotogramas comprimen mejor juntos. */
const ANIM={};
let sprRatio=0.79;
const gunMat=new THREE.MeshBasicMaterial({transparent:true, depthTest:false, depthWrite:false});
const gunMesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1), gunMat);
gunMesh.renderOrder=10; hudScene.add(gunMesh);
{
  const L=new THREE.TextureLoader();
  for(const k of Object.keys(FPSDATA.anim)){
    const a=FPSDATA.anim[k];
    const t=L.load(a.uri, tex=>{
      if(k==='idle'&&tex.image) sprRatio=(tex.image.height/a.rows)/(tex.image.width/a.cols);
    });
    t.colorSpace=THREE.SRGBColorSpace;
    t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
    t.generateMipmaps=false;
    t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
    ANIM[k]={ tex:t, cols:a.cols, rows:a.rows, n:a.n, inset:(a.inset===undefined?0.0015:a.inset) };
  }
  gunMat.map=ANIM.idle.tex;
}
/* Coloca el UV en el fotograma i. El margen evita que se cuele el vecino
   cuando el filtro es lineal. */
function setFrame(name, i){
  const A=ANIM[name]; if(!A) return;
  i=Math.max(0, Math.min(A.n-1, i|0));
  const c=i%A.cols, r=(i/A.cols)|0, m=A.inset;
  A.tex.repeat.set(1/A.cols - m*2, 1/A.rows - m*2);
  A.tex.offset.set(c/A.cols + m, 1-(r+1)/A.rows + m);
  if(gunMat.map!==A.tex){ gunMat.map=A.tex; gunMat.needsUpdate=true; }
}

/* Puntero: cuatro trazos que se abren al disparar y al correr */
const crossG=new THREE.Group(); crossG.renderOrder=11; hudScene.add(crossG);
{
  const m=new THREE.MeshBasicMaterial({color:0xdff0ff, transparent:true, opacity:0.9,
    depthTest:false, depthWrite:false});
  for(let i=0;i<4;i++){
    const b=new THREE.Mesh(new THREE.PlaneGeometry(1,1), m);
    b.renderOrder=11; crossG.add(b);
  }
  const dot=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({color:0xdff0ff, transparent:true, opacity:0.55,
      depthTest:false, depthWrite:false}));
  dot.renderOrder=11; crossG.add(dot);
}

/* ============================================================================
   JUGADOR
============================================================================ */
let gunFrame='idle', fireT=-1;
const FIRE_FPS=24;    // cadencia nativa del clip
const FIRE_ONE=4;     // un tiro suelto muestra sólo el primer ciclo de fogonazo
const RELOAD_T=1.85;
const P = {
  yaw:0, pitch:0, vy:0, onGround:true,
  pos:new THREE.Vector3(0,1.68,8),
  mag:30, res:90, MAG:30,
  firing:false, cool:0, reloading:0, recoil:0, spread:0,
  bob:0, speed:0, hits:0, dead:false
};
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true;
  if(e.code==='KeyR') startReload();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });

let started=false;
function startReload(){
  if(P.reloading>0 || P.mag>=P.MAG || P.res<=0) return;
  P.reloading=RELOAD_T; clack(900,0.30);
  setTimeout(()=>clack(600,0.26), 520);
  setTimeout(()=>clack(1400,0.30), 1150);
}
function fire(){
  if(P.reloading>0 || P.cool>0) return;
  if(P.mag<=0){ P.cool=0.28; dry(); return; }
  P.mag--; P.cool=0.092; P.recoil=1; if(fireT<0) fireT=0; shot();
  P.spread=Math.min(1, P.spread+0.34);
  updateHud();

  // Dispersión: sale del centro de pantalla, no de la punta del sprite
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const s=0.006+P.spread*0.030+P.speed*0.010;
  dir.x+=(Math.random()-0.5)*s; dir.y+=(Math.random()-0.5)*s;
  dir.normalize();
  const ray=new THREE.Raycaster(camera.position.clone(), dir, 0.2, 400);
  const hit=ray.intersectObjects(SHOOT, false)[0];
  const end=hit? hit.point.clone() : camera.position.clone().addScaledVector(dir, 300);
  // La trazadora arranca a la altura del cañón del sprite, abajo a la derecha
  const muzzle=camera.position.clone()
    .addScaledVector(new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion), 0.22)
    .addScaledVector(new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion), -0.16)
    .addScaledVector(dir, 0.55);
  tracer(muzzle, end);
  if(hit){
    const tg=targets.find(t=>t.disc===hit.object);
    if(tg && !tg.down){ tg.down=true; tg.t=0; P.hits++; ping();
      document.getElementById('hits').textContent=P.hits; }
    impact(hit.point, hit.face? hit.face.normal.clone().transformDirection(hit.object.matrixWorld)
                              : new THREE.Vector3(0,1,0), !!tg);
  }
}
function updateHud(){
  document.getElementById('mag').textContent=P.mag;
  document.getElementById('res').textContent=P.res;
  document.getElementById('ammo').classList.toggle('low', P.mag<=5);
}

/* ---------- Ratón y teclado ---------- */
const canvas=renderer.domElement;
if(!IS_TOUCH){
  canvas.addEventListener('click',()=>{
    if(!started) return;
    if(document.pointerLockElement!==canvas){ const p=canvas.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }
  });
  addEventListener('mousemove',e=>{
    if(document.pointerLockElement!==canvas) return;
    P.yaw   -= e.movementX*0.0022;
    P.pitch -= e.movementY*0.0022;
    P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch));
  });
  addEventListener('mousedown',e=>{ if(e.button===0 && document.pointerLockElement===canvas) P.firing=true; });
  addEventListener('mouseup',  e=>{ if(e.button===0) P.firing=false; });
}

/* ---------- Mandos táctiles ---------- */
const move={x:0,y:0};
if(IS_TOUCH){
  document.getElementById('touch').classList.add('on');
  const stick=document.getElementById('stick'), knob=document.getElementById('knob');
  let sid=null, sc={x:0,y:0};
  const R=41;
  stick.addEventListener('touchstart',e=>{ e.preventDefault();
    const r=stick.getBoundingClientRect(); sc={x:r.left+r.width/2, y:r.top+r.height/2};
    sid=e.changedTouches[0].identifier; }, {passive:false});
  addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===sid){
        let dx=t.clientX-sc.x, dy=t.clientY-sc.y;
        const d=Math.hypot(dx,dy), m=56;
        if(d>m){ dx*=m/d; dy*=m/d; }
        knob.style.transform=`translate(${dx}px,${dy}px)`;
        move.x=dx/m; move.y=dy/m;
      }
    }
    // Mirar: cualquier dedo en la mitad derecha que no sea el joystick
    for(const t of e.changedTouches){
      if(t.identifier===sid) continue;
      const prev=look[t.identifier];
      if(prev){
        P.yaw   -= (t.clientX-prev.x)*0.0040;
        P.pitch -= (t.clientY-prev.y)*0.0040;
        P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch));
        look[t.identifier]={x:t.clientX,y:t.clientY};
      }
    }
  }, {passive:false});
  const endT=e=>{ for(const t of e.changedTouches){
      if(t.identifier===sid){ sid=null; move.x=move.y=0; knob.style.transform=''; }
      delete look[t.identifier];
    } };
  addEventListener('touchend',endT); addEventListener('touchcancel',endT);
  var look={};
  addEventListener('touchstart',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===sid) continue;
      if(t.target.closest('#stick')||t.target.closest('.tbtn')) continue;
      look[t.identifier]={x:t.clientX,y:t.clientY};
    }
  }, {passive:true});
  const bf=document.getElementById('bFire');
  bf.addEventListener('touchstart',e=>{e.preventDefault(); P.firing=true;}, {passive:false});
  bf.addEventListener('touchend',  e=>{e.preventDefault(); P.firing=false;}, {passive:false});
  document.getElementById('bReload').addEventListener('touchstart',e=>{e.preventDefault(); startReload();}, {passive:false});
  document.getElementById('bJump').addEventListener('touchstart',e=>{e.preventDefault();
    if(P.onGround){ P.vy=5.4; P.onGround=false; }}, {passive:false});
} else { var look={}; }

/* ============================================================================
   BUCLE
============================================================================ */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  hudCam.left=-w/2; hudCam.right=w/2; hudCam.top=h/2; hudCam.bottom=-h/2;
  hudCam.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
const FWD=new THREE.Vector3(), RIGHT=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(), 0.05);
  const et=clock.elapsedTime;

  /* --- andar --- */
  let ix=0, iz=0;
  if(!IS_TOUCH){
    if(keys.KeyW||keys.ArrowUp) iz-=1;
    if(keys.KeyS||keys.ArrowDown) iz+=1;
    if(keys.KeyA||keys.ArrowLeft) ix-=1;
    if(keys.KeyD||keys.ArrowRight) ix+=1;
    if(keys.Space && P.onGround){ P.vy=5.4; P.onGround=false; }
  } else { ix=move.x; iz=move.y; }
  const run = (!IS_TOUCH && (keys.ShiftLeft||keys.ShiftRight)) ? 1.75 : 1;
  const len=Math.hypot(ix,iz);
  if(len>1){ ix/=len; iz/=len; }
  const spd=4.3*run;

  FWD.set(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), P.yaw);
  RIGHT.set(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), P.yaw);
  P.pos.addScaledVector(FWD, -iz*spd*dt);
  P.pos.addScaledVector(RIGHT, ix*spd*dt);
  P.pos.x=Math.max(-200,Math.min(200,P.pos.x));
  P.pos.z=Math.max(-200,Math.min(200,P.pos.z));

  P.vy-=15.5*dt; P.pos.y+=P.vy*dt;
  if(P.pos.y<=1.68){ P.pos.y=1.68; P.vy=0; P.onGround=true; }

  P.speed = Math.min(1, Math.hypot(ix,iz)*run/1.75);
  if(P.onGround) P.bob += dt*P.speed*(9.5+run*1.6);

  camera.position.copy(P.pos);
  // Balanceo del paso: la cámara acompaña poco, el arma acompaña mucho
  camera.position.y += Math.sin(P.bob*2)*0.022*P.speed;
  camera.position.addScaledVector(RIGHT, Math.sin(P.bob)*0.016*P.speed);
  camera.rotation.set(0,0,0);
  camera.rotateY(P.yaw); camera.rotateX(P.pitch);
  camera.rotateZ(Math.sin(P.bob)*0.006*P.speed - P.recoil*0.012);
  camera.rotateX(P.recoil*0.045);

  /* --- disparo automático --- */
  P.cool=Math.max(0, P.cool-dt);
  if(P.reloading>0){
    P.reloading-=dt;
    if(P.reloading<=0){
      const need=P.MAG-P.mag, take=Math.min(need, P.res);
      P.mag+=take; P.res-=take; updateHud();
    }
  } else if(P.firing) fire();
  P.recoil=Math.max(0, P.recoil-dt*7.5);
  P.spread=Math.max(0, P.spread-dt*1.9);

  /* --- blancos que se abaten --- */
  for(const t of targets){
    if(t.down && t.t<1){ t.t=Math.min(1, t.t+dt*3.4);
      t.piv.rotation.x = -Math.PI*0.46*(1-Math.pow(1-t.t,3)); }
  }
  /* --- chispas, marcas, trazadoras --- */
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.t+=dt;
    const k=s.t/s.life;
    if(k>=1){ scene.remove(s.s); sparks.splice(i,1); continue; }
    s.s.material.opacity=1-k; s.s.scale.setScalar(s.s.scale.x*(1+dt*2.5));
  }
  for(let i=tracers.length-1;i>=0;i--){
    const tr=tracers[i]; tr.t+=dt;
    if(tr.t>0.055){ scene.remove(tr.l); tr.l.geometry.dispose(); tracers.splice(i,1); continue; }
    tr.l.material.opacity=0.75*(1-tr.t/0.055);
  }

  /* --- el arma en pantalla --- */
  layoutGun(dt, et);

  renderer.render(scene, camera);
  renderer.autoClear=false;
  renderer.clearDepth();
  renderer.render(hudScene, hudCam);
  renderer.autoClear=true;
}

function layoutGun(dt, et){
  const W=innerWidth, H=innerHeight;
  /* --- qué animación toca y en qué fotograma --- */
  if(fireT>=0){
    fireT+=dt;
    const f=fireT*FIRE_FPS;
    const auto=(P.firing && P.mag>0 && P.reloading<=0);
    // Manteniendo el gatillo la ráfaga se encadena; un tiro suelto corta al primer ciclo.
    if(f >= (auto ? ANIM.fire.n : FIRE_ONE)) fireT = auto ? 0 : -1;
  }
  if(P.reloading>0){
    gunFrame='reload';
    const k=1-P.reloading/RELOAD_T;                 // 0 → 1 a lo largo de la recarga
    setFrame('reload', k*ANIM.reload.n);
  } else if(fireT>=0){
    gunFrame='fire';
    setFrame('fire', fireT*FIRE_FPS);
  } else if(P.speed>0.08){
    gunFrame='walk';
    // El ciclo va atado al mismo reloj que el balanceo de la cámara:
    // así el paso del sprite y el bamboleo caen juntos.
    let ph=(P.bob/(Math.PI*2))%1; if(ph<0) ph+=1;
    setFrame('walk', ph*ANIM.walk.n);
  } else {
    gunFrame='idle';
    setFrame('idle', 0);
  }

  // El sprite ocupa poco más de la mitad del ancho y se ancla abajo a la derecha
  // El vídeo generado encuadra más lejos que la imagen original, así que el
  // sprite se agranda para que el arma vuelva a ocupar el cuarto de abajo.
  const w=Math.min(W*1.06, H*1.62);
  const h=w*sprRatio;
  gunMesh.scale.set(w, h, 1);
  // Balanceo de paso, respiración al estar quieto, retroceso y hundido al recargar
  const bobX=Math.sin(P.bob)*W*0.006*P.speed;
  const bobY=-Math.abs(Math.cos(P.bob))*H*0.007*P.speed;
  const brX=Math.sin(et*1.1)*W*0.004*(1-P.speed);
  const brY=Math.sin(et*1.6)*H*0.005*(1-P.speed);
  const rec=P.recoil*0.55;   // el retroceso ya está dibujado en los fotogramas
  const rl = P.reloading>0 ? Math.sin(Math.min(1,(RELOAD_T-P.reloading)/RELOAD_T)*Math.PI) : 0;
  gunMesh.position.set(
    W*0.5 - w*0.34 + bobX + brX + rec*W*0.012,
   -H*0.5 + h*0.40 + bobY + brY - rec*H*0.030 - rl*H*0.16, 0);
  gunMesh.rotation.z = Math.sin(P.bob)*0.012*P.speed + rec*0.055 - rl*0.20;

  // Puntero
  const gap = 9 + P.spread*26 + P.speed*10;
  const L=9, T=2.2;
  const bars=crossG.children;
  const set=(m,x,y,sx,sy)=>{ m.position.set(x,y,0); m.scale.set(sx,sy,1); };
  set(bars[0], 0,  gap+L/2, T, L);
  set(bars[1], 0, -gap-L/2, T, L);
  set(bars[2], -gap-L/2, 0, L, T);
  set(bars[3],  gap+L/2, 0, L, T);
  set(bars[4], 0, 0, 2, 2);
}
animate();

   ARRANQUE
============================================================================ */
function goFullscreen(){
  const el=document.documentElement;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  try{ const p=rq&&rq.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  try{ const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');
       if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  setTimeout(resize,220); setTimeout(resize,700);
}
document.getElementById('playBtn').addEventListener('click',()=>{
  started=true;
  goFullscreen();
  initAudio(); if(AC&&AC.state==='suspended') AC.resume().catch(()=>{});
  document.getElementById('menu').classList.add('hide');
  if(!IS_TOUCH){ const p=canvas.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }
  updateHud();
});
</script>
