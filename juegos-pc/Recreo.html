function cargarBaldi(luego){
  if(!BALDI_GLB || BALDI_GLB.indexOf('data:')!==0){ usarCajas(); if(luego) luego(false); return; }
  try{
    new GLTFLoader().parse2 ? 0 : 0;
  }catch(e){}
  const ld=new GLTFLoader();
  ld.load(BALDI_GLB, (gl)=>{
    try{
      const raiz=gl.scene;
      /* SE ESCALA POR LA CAJA Y NO POR UN NUMERO. Meshy respeta la altura pedida casi siempre, pero
         "casi" no sirve: si sale a 1,4 en vez de 2,2 el personaje queda enano detras del escritorio
         y no hay como enterarse sin mirar. Se mide la caja y se lleva a 2,20 exacto. */
      raiz.updateMatrixWorld(true);
      const caja=new THREE.Box3().setFromObject(raiz);
      const alto=Math.max(0.01, caja.max.y-caja.min.y);
      const e=2.20/alto;
      raiz.scale.setScalar(e);
      raiz.updateMatrixWorld(true);
      const c2=new THREE.Box3().setFromObject(raiz);
      raiz.position.y -= c2.min.y;                 // los pies en el piso, no adivinado
      raiz.traverse(o=>{ if(o.isMesh){ o.frustumCulled=false;
        if(o.material){ o.material.side=THREE.FrontSide; } } });
      baldi=mapearGLB(raiz);
      baldi.baseY=raiz.position.y;
      baldiGLB = (baldi.faltan===0);
      if(!baldiGLB){ usarCajas(); if(luego) luego(false); return; }
      escena.add(raiz);
      profe.raiz.visible=false;
      if(luego) luego(true);
    }catch(err){ usarCajas(); if(luego) luego(false); }
  }, undefined, ()=>{ usarCajas(); if(luego) luego(false); });
}
function usarCajas(){
  baldiGLB=false; baldi=profe; profe.raiz.visible=true; profe.baseY=0;
}

/* =========================================================================================
   LA CAMARA SOBRE RIELES
   No hay joystick, no hay mouse y no hay teclas de movimiento. La camara recorre una lista de puntos
   a velocidad constante y MIRA HACIA DONDE VA, girando con un resorte para que el giro se lea como
   una cabeza que voltea y no como un corte.
   Por que asi y no libre: el jugador tiene una sola cosa que hacer con la mano, y si esa misma mano
   tuviera que manejar la camara las dos cosas se pelearian — mover la mano para girar y mover la
   mano para contar son el mismo gesto.
   ========================================================================================= */
const OJO=1.58;
const cam={ x:0, z:0, giro:0, pitch:0, ojo:OJO,
            ax:0, az:0, agiro:0, apitch:0, aojo:OJO };
let riel=null;          // {pts:[[x,z]…], k, t, vel, girar, alListo}
function rielIr(pts, vel, alListo){
  riel={ pts, k:0, vel:vel||2.4, alListo:alListo||null };
}
function rielTick(dt){
  if(!riel) return false;
  const meta=riel.pts[riel.k];
  if(!meta){ const f=riel.alListo; riel=null; if(f) f(); return false; }
  const dx=meta[0]-cam.x, dz=meta[1]-cam.z, d=Math.hypot(dx,dz);
  if(d<0.10){
    riel.k++;
    if(riel.k>=riel.pts.length){ const f=riel.alListo; riel=null; if(f) f(); }
    return true;
  }
  const paso=Math.min(d, riel.vel*dt);
  cam.x += dx/d*paso; cam.z += dz/d*paso;
  /* mira hacia donde va. El resorte a dt*3 es lo que hace que en una esquina la camara "doble" en
     medio segundo en vez de teletransportar el rumbo. */
  const gq=Math.atan2(dx,dz);
  let g=gq-cam.giro; while(g>Math.PI)g-=2*Math.PI; while(g<-Math.PI)g+=2*Math.PI;
  cam.giro += g*Math.min(1, dt*3.0);
  return true;
}
function mirarA(x,z,dt,k){
  const gq=Math.atan2(x-cam.x, z-cam.z);
  let g=gq-cam.giro; while(g>Math.PI)g-=2*Math.PI; while(g<-Math.PI)g+=2*Math.PI;
  cam.giro += g*Math.min(1, dt*(k||2.4));
}

/* ===================== EL PROFESOR EN EL MUNDO ===================== */
const PROFE={ x:0, z:0, giro:0, anim:'quieto', animOtro:null, mezcla:0, at:0,
              ax:0, az:0, agiro:0 };
function profeAnim(nombre){
  if(nombre===PROFE.anim) return;
  PROFE.animOtro=PROFE.anim; PROFE.anim=nombre; PROFE.mezcla=1;
}
let profeRiel=null;
function profeIr(pts, vel, alListo){ profeRiel={ pts, k:0, vel:vel||2.7, alListo:alListo||null }; }
function profeTick(dt){
  if(profeRiel){
    const meta=profeRiel.pts[profeRiel.k];
    if(!meta){ const f=profeRiel.alListo; profeRiel=null; if(f) f(); }
    else {
      const dx=meta[0]-PROFE.x, dz=meta[1]-PROFE.z, d=Math.hypot(dx,dz);
      if(d<0.14){
        profeRiel.k++;
        if(profeRiel.k>=profeRiel.pts.length){ const f=profeRiel.alListo; profeRiel=null; if(f) f(); }
      } else {
        const paso=Math.min(d, profeRiel.vel*dt);
        PROFE.x += dx/d*paso; PROFE.z += dz/d*paso;
        const gq=Math.atan2(dx,dz);
        let g=gq-PROFE.giro; while(g>Math.PI)g-=2*Math.PI; while(g<-Math.PI)g+=2*Math.PI;
        PROFE.giro += g*Math.min(1, dt*5.0);
      }
    }
  }
  /* 0,22 Y NO 0,40. Un crossfade de 0,40 s a 60 pasos son veinticuatro cuadros mezclando dos poses:
     durante casi medio segundo el personaje no esta haciendo ninguna de las dos cosas, y eso es lo
     que se lee como "animaciones lentas". 0,22 alcanza para que no haya salto y se nota el cambio. */
  if(PROFE.mezcla>0) PROFE.mezcla=Math.max(0, PROFE.mezcla - dt/0.22);
  PROFE.at+=dt;
}
function profeMirarCam(dt,k){
  const gq=Math.atan2(cam.x-PROFE.x, cam.z-PROFE.z);
  let g=gq-PROFE.giro; while(g>Math.PI)g-=2*Math.PI; while(g<-Math.PI)g+=2*Math.PI;
  PROFE.giro += g*Math.min(1, dt*(k||3.0));
}

/* =========================================================================================
   EL GUION
   Una lista de escenas. Cada una dice que animacion pone, que dice, y como se sale de ella: por
   TIEMPO (dur) o porque el jugador HIZO algo con la mano (espera). Las que esperan una mano tienen
   respaldo con numeros, porque un juego que solo se abre con webcam es un juego que la mayoria no
   puede abrir.
   ========================================================================================= */
const PASO=1/60;
const MANO_SOSTEN=1.1;                 // cuanto hay que sostener el numero para que cuente
let escena_i=-1, escenaT=0, esperaT=0, jugando=false, terminado=0;
let libros=0, aciertos=0, cuenta=null, cuentaTxt='';
let bloqueo=false;
/* VAN DECLARADOS ACA Y NO EN i2.js, donde vive su logica, POR EL ORDEN DE EVALUACION: pintarLibros()
   los lee y se llama desde pintarIdioma() al armar la pantalla de idioma, o sea mil lineas antes.
   Un let leido antes de su linea no rompe una funcion: rompe el modulo entero. Es la sexta vez en
   este proyecto que una declaracion puesta "donde corresponde tematicamente" tira todo abajo. */
let aulaN=1, aulaK=0, aulaIdx=0, muertes=0, bichosVivos=0;

/* EL RECORRIDO DE LA ESCUELA.
   Ocho aulas, y el orden no es 1..8 sino el que dibuja una vuelta sin volver sobre sus pasos: las
   cuatro de arriba de izquierda a derecha por el pasillo de la fila 1, se baja por la columna 21 y
   las cuatro de abajo de derecha a izquierda por la fila 9. Recorrer 1,2,3,4,5,6,7,8 obligaria a
   cruzar la escuela entera entre la 4 y la 5, y son veinte metros de pasillo vacio. */
const TOUR=[1,2,3,4,8,7,6,5];
/* QUE ACTIVIDAD HAY EN CADA TRAMO, Y POR QUE SON TRES Y NO UNA.
   Siete tandas de bichos son una tanda repetida siete veces. Las tres piden algo DISTINTO de la
   mano, y ese es el criterio —no la variedad decorativa:
     bichos     → vienen hacia vos: se entrena APUNTAR a un blanco que se mueve.
     tizas      → caen: se entrena el TIEMPO, hay que llegar antes de que toquen el piso.
     casilleros → tiembla uno de ocho, todos a la misma distancia: se entrena ELEGIR.
   El primer tramo no tiene nada: es el que sigue al tutorial y el jugador recien aprendio a contar.
   Las cantidades suben, y ninguna pasa de cinco o seis blancos a la vez porque en un marco 9:16 mas
   que eso se solapa y deja de poder apuntarse de a uno. */
const TRAMOS=[ null,
  { tipo:'bichos',     n:2, txt:'dBichos' },
  { tipo:'tizas',      n:3, txt:'dTizas' },
  { tipo:'casilleros', n:3, txt:'dCasill' },
  { tipo:'bichos',     n:4, txt:'dBichos' },
  { tipo:'tizas',      n:4, txt:'dTizas' },
  { tipo:'casilleros', n:3, txt:'dCasill' },
  { tipo:'bichos',     n:5, txt:'dBichos' } ];
const TOTAL_CUENTAS=TOUR.length*CUENTAS_AULA;

const GUION=[
 { id:'saludo',  anim:'saludar',  txt:'d1', dur:3.0, mira:true, voz:'hola' },
 { id:'presenta',anim:'explicar', txt:'d2', dur:3.8, mira:true },
 { id:'t5',      anim:'explicar', txt:'d3', mira:true, espera:{tipo:'dedos', n:5} },
 { id:'tp',      anim:'explicar', txt:'d4', mira:true, espera:{tipo:'gesto', g:'pinza'} },
 { id:'t2',      anim:'explicar', txt:'d5', mira:true, espera:{tipo:'dedos', n:2} },
 { id:'listo',   anim:'saludar',  txt:'d6', dur:2.6, mira:true, voz:'risa' }
];
/* EL GUION DE LAS AULAS SE GENERA. Ocho aulas por tres escenas mas siete tandas de bichos son
   treinta y una escenas: escritas a mano son treinta y una oportunidades de poner un numero de aula
   en el lugar de otro. Se genera del TOUR y cada escena lleva ADENTRO el numero de aula al que se
   refiere, asi que ninguna parte del codigo tiene que adivinar "en que aula estoy". */
TOUR.forEach((n,k)=>{
  const T=TRAMOS[k];
  if(T){
    /* el viaje va PARTIDO EN DOS y la actividad cae en la juntura: tiene que estar EN el camino, no
       al final de el */
    GUION.push({ id:'viaje'+n, anim:'caminar', txt:'dSale',  viaje:n, mitad:true, aula:n });
    GUION.push({ id:'act'+n,   anim:'quieto',  txt:T.txt, act:T.n, tipo:T.tipo, aula:n });
    GUION.push({ id:'sigue'+n, anim:'caminar', txt:'dSale2', viaje:n, resto:true, aula:n });
  } else {
    GUION.push({ id:'viaje'+n,  anim:'caminar', txt:'d7', viaje:n, aula:n });
  }
  GUION.push({ id:'entra'+n,  anim:'puerta',   txt:'d8', puerta:n, aula:n });
  GUION.push({ id:'clase'+n,  anim:'explicar', txt:(k===0?'d9':'dAula'), dur:3.4,
               clase:n, aula:n, mira:true });
});

/* LAS VEINTICUATRO CUENTAS: tres por aula, y el resultado siempre entra en los dedos de dos manos,
   o sea de 1 a 10. La dificultad sube POR AULA y no cuenta por cuenta: dentro de un aula las tres
   son del mismo tipo, asi que el jugador no tiene que volver a entender el enunciado en cada libro —
   entiende el aula. Y sube de a un paso: una mano, dos manos, restas y al final multiplicar.
   El tope de 10 no es un detalle: una cuenta que da 12 no se puede contestar con el cuerpo, y una
   cuenta que no se puede contestar es una muerte que el jugador no entiende. */
function armarCuentas(){
  const R=[];
  const azar=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  for(let k=0;k<TOTAL_CUENTAS;k++){
    const aula=Math.floor(k/CUENTAS_AULA);        // 0..7
    let a,b,r,t;
    if(aula<2){        r=azar(2,5);  a=azar(1,r-1); b=r-a; t=a+' + '+b; }
    else if(aula<4){   r=azar(6,10); a=azar(2,r-2); b=r-a; t=a+' + '+b; }
    else if(aula<6){   a=azar(7,12); b=azar(2,Math.min(6,a-1)); r=a-b;
                       if(r>10){ a=12; b=2; r=10; } t=a+' − '+b; }
    else {             const pares=[[2,2],[2,3],[3,3],[2,4],[2,5],[3,2],[4,2],[5,2],[1,7],[3,1]];
                       const p=pares[azar(0,pares.length-1)];
                       a=p[0]; b=p[1]; r=a*b; t=a+' × '+b; }
    R.push({ txt:t, res:r, aula:aula+1 });
  }
  return R;
}
let CUENTAS=[];

/* =========================================================================================
   LAS MANOS: DE 21 PUNTOS POR MANO A UN NUMERO DEL 0 AL 10

   Lo que el juego necesita ahora no es "girar/avanzar/correr": es CONTAR DEDOS. Cuatro mas cuatro
   son ocho, y ocho dedos son las DOS manos — asi que el detector va con numHands 2 y el numero es la
   suma de las dos.

   TRES PROBLEMAS Y NINGUNO ES "leer los puntos":
   1. LA ESCALA. La mano puede estar a veinte centimetros o a un metro de la camara, asi que ninguna
      distancia en pixeles significa nada. TODO se mide en proporcion al tamano de la palma —muneca a
      nudillo del medio— que es invariante a la distancia Y al tamano de la mano de quien juega.
   2. EL PULGAR NO SE MIDE COMO LOS DEMAS. Los otros cuatro dedos se estiran ALEJANDO la punta de la
      muneca, y con eso alcanza; el pulgar se abre HACIA EL COSTADO y su punta puede quedar a la
      misma distancia de la muneca abierto o cerrado. Se mide contra el nudillo del MENIQUE: abierto
      se aleja de el, cerrado se le cruza por delante. Sin esta distincion, "cinco dedos" no existe.
   3. EL NUMERO TIEMBLA. Un dedo a medio estirar cruza el umbral varias veces por segundo. Asi que el
      numero no se toma: SE SOSTIENE. Hay que mantenerlo quieto 1,1 s y un aro se va llenando. Eso
      resuelve el temblor y ademas le da al jugador tiempo de cambiar de idea, que es lo que hace que
      contestar con el cuerpo no se sienta como una trampa.
   ========================================================================================= */
const MANO={ on:false, estado:'no', det:null, vid:null, dedos:0, gesto:'', hay:false,
             cand:-1, votos:0, ultT:0, manos:0, lms:null, pinzas:[], pzPrev:[],
             error:'', delegado:'', cdn:null, crudo:0, pausa:false, habia:false,
             /* espejo: la camara FRONTAL se muestra espejada porque asi funciona un espejo y es lo
                unico con lo que se puede apuntar; la TRASERA no, porque ahi la mano ya se ve del
                lado que esta. Depende de que camara se abrio, no es una constante. */
             espejo:true, camaraUsada:'',
             hz:24, medidas:0, msDet:0, ranuras:[null,null] };
/* CUANTAS VECES POR SEGUNDO SE MIDE, que no es lo mismo que cuantas veces se dibuja.
   24 y no 60: el detector tarda entre 8 y 20 ms por cuadro en un telefono, asi que medir en cada
   cuadro de render es gastar un tercio del presupuesto de 16,6 ms en mirar una mano que apenas se
   movio. Se mide 24 veces por segundo y se INTERPOLA el resto, que es exactamente lo que hace el
   propio juego con su paso fijo de 60 y sus 120 cuadros. */
const MANO_HZ_MOVIL=24, MANO_HZ_PC=30;
const MANO_URL='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MANO_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
/* DOS CDN Y NO UNO. El detector son dos descargas de un tercero, y si ese tercero no contesta el
   juego entero se queda sin manos sin que se pueda saber por que. unpkg sirve el mismo paquete. */
const MANO_CDN=[{ js:MANO_URL, wasm:MANO_WASM },
                { js:'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
                  wasm:'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm' }];
const MANO_MODELO='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

function d3(a,b){ const x=a.x-b.x, y=a.y-b.y, z=(a.z||0)-(b.z||0); return Math.hypot(x,y,z); }
/* PURA A PROPOSITO: entran 21 puntos y sale {dedos, pinza}. Sin camara, sin estado y sin navegador,
   asi que se puede comprobar inyectando manos de mentira y midiendo — que es la unica forma de
   probar esto en un banco sin camara ni mano. */
function manoLeer(lm){
  if(!lm || lm.length<21) return null;
  const mu=lm[0], nu=lm[9];
  const palma=Math.max(1e-6, d3(mu,nu));
  const largos=[[8,5],[12,9],[16,13],[20,17]].map(([pt,n])=>
    (d3(lm[pt],mu) / Math.max(1e-6,d3(lm[n],mu))) > 1.28 );
  /* el pulgar, contra el nudillo del menique */
  const pulgar = (d3(lm[4], lm[17]) / palma) > 1.05;
  const pinza  = (d3(lm[4], lm[8]) / palma) < 0.45 && largos.filter(Boolean).length<=2;
  /* SE DEVUELVE TAMBIEN CUALES. El dibujo de la mano marca en verde los dedos que el juego CONTO,
     y eso es la mitad de la enseñanza: cuando el numero no es el que el jugador cree, se ve cual
     dedo no cerro o no estiro del todo. Un numero solo no explica nada. */
  return { dedos: largos.filter(Boolean).length + (pulgar?1:0),
           pulgar, pinza, palma,
           estirados: [pulgar, largos[0], largos[1], largos[2], largos[3]],
           abierta: largos.every(Boolean) && pulgar };
}
function manoTotal(lms){
  if(!lms || !lms.length) return { hay:false, dedos:0, pinza:false, manos:0 };
  let d=0, pz=false;
  for(const lm of lms){ const r=manoLeer(lm); if(!r) continue; d+=r.dedos; pz=pz||r.pinza; }
  return { hay:true, dedos:Math.min(10,d), pinza:pz, manos:lms.length };
}
/* ---------- DONDE ESTA LA PINZA EN LA PANTALLA ----------
   Contar dedos no necesita saber DONDE esta la mano; reventar un bicho si. El punto de la pinza es
   el medio entre la punta del pulgar y la del indice, que es justo donde el jugador cree que esta
   pinchando.
   DOS COSAS QUE NO SON OBVIAS:
   1. VA ESPEJADO. La camara se muestra como un espejo —si no, mover la mano a la derecha mueve la
      marca a la izquierda y no hay forma de apuntar—, asi que la x de MediaPipe se invierte. Es el
      mismo 1-x que ya usaba dibujarManos() para el esqueleto de la camarita.
   2. LO QUE VALE ES EL FLANCO, no el estado. Una pinza sostenida medio segundo son treinta cuadros:
      si cada cuadro matara, una sola pinza limpiaria el pasillo entero. Solo cuenta el cuadro en que
      la pinza APARECE, y para eso hay que recordar la de cada mano en el cuadro anterior. */
function manoPinzas(lms){
  const r=[];
  if(!lms || !lms.length){ MANO.pzPrev=[]; return r; }
  lms.forEach((lm,k)=>{
    const q=manoLeer(lm); if(!q) return;
    const p4=lm[4], p8=lm[8];
    r.push({ x: 1-(p4.x+p8.x)/2, y: (p4.y+p8.y)/2,
             pinza:q.pinza, nueva: q.pinza && !MANO.pzPrev[k] });
    MANO.pzPrev[k]=q.pinza;
  });
  return r;
}

/* el voto: tres lecturas seguidas con el mismo numero para que el numero valga */
function manoVoto(n){
  if(n===MANO.cand) MANO.votos++;
  else { MANO.cand=n; MANO.votos=1; }
  if(MANO.votos>=3) MANO.dedos=MANO.cand;
}
/* =========================================================================================
   ARRANCAR EL DETECTOR, Y QUE SE SEPA CUANDO NO ARRANCA

   EL ORDEN IMPORTA Y ES: LA CAMARA PRIMERO. El detector son dos descargas de un CDN mas un modelo
   de siete megas de Google, o sea varios segundos; si se piden ANTES del permiso, cuando por fin se
   llama a getUserMedia el gesto del jugador ya expiro y Safari lo rechaza con NotAllowedError sin
   mostrar el cartelito. Pidiendo la camara en la primera linea, el permiso aparece al instante y la
   descarga pasa despues, con el permiso ya dado.

   Y CADA FALLA SE NOMBRA. Antes cualquier problema terminaba en un cartel de 2,6 segundos dentro
   del juego que decia "sin camara": el mismo mensaje para "negaste el permiso", "no hay camara",
   "el CDN no contesta" y "estas en http y el navegador no expone la camara". Desde afuera eso se ve
   como un juego que simplemente no usa la camara, que es justo lo que reporto el usuario.
   ========================================================================================= */
function manosFallo(cual){
  MANO.estado='no'; MANO.on=false; MANO.error=cual||'camara';
  document.body.classList.remove('manos'); document.body.classList.add('pad');
  pintarCam(); pintarCtrl();
  return 'no';
}
async function manosIniciar(){
  if(MANO.estado==='carga'||MANO.estado==='lista') return MANO.estado;
  MANO.estado='carga'; MANO.error=''; pintarCam(); pintarCtrl();
  /* CONTEXTO SEGURO. Sin https —o sin localhost— navigator.mediaDevices NO EXISTE, asi que no hay
     permiso que negar: el navegador ni pregunta. Es la causa mas facil de confundir con un error
     del juego, y la unica que no se arregla desde el codigo. */
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return manosFallo(window.isSecureContext===false? 'insegura' : 'camara');
  }
  let st=null;
  try{
    /* LA TRASERA PRIMERO, Y 320x240. Dos decisiones separadas:
       - 'environment' es la camara trasera, que es la que pidio el usuario: el telefono queda
         apoyado y las manos se mueven del otro lado, con mas espacio y mejor luz que apuntandose a
         uno mismo. Va como `ideal` y no `exact` para que una notebook sin camara trasera abra la
         que tenga en vez de fallar.
       - 320x240 y no 480x360: el detector escala la entrada igual, y 320x240 son 76.800 pixeles
         contra 172.800, o sea 2,25 veces menos trabajo por medicion para la misma mano. */
    st=await navigator.mediaDevices.getUserMedia({
      video:{ width:{ideal:320}, height:{ideal:240}, facingMode:{ideal:'environment'} } });
  }catch(e){
    const n=(e && e.name)||'';
    return manosFallo(n==='NotAllowedError'||n==='SecurityError'? 'permiso'
                    : (n==='NotFoundError'||n==='OverconstrainedError'? 'camara' : 'camara'));
  }
  const v=document.getElementById('camVid');
  v.srcObject=st; MANO.vid=v;
  await v.play().catch(()=>{});
  /* QUE CAMARA ABRIO DE VERDAD, que no es siempre la que se pidio. De eso depende el espejo, y si
     se espeja al reves no hay forma de apuntar: mover la mano a la derecha mueve la mano del juego
     a la izquierda. Se lee del propio track y no de lo que se pidio. */
  try{
    const t=st.getVideoTracks()[0], aj=t? t.getSettings() : {};
    MANO.camaraUsada=aj.facingMode||'';
    MANO.espejo = (MANO.camaraUsada!=='environment');
  }catch(e){ MANO.espejo=true; }
  /* recien ahora el detector, que es lo lento */
  let vision=null;
  for(const c of MANO_CDN){
    try{ vision=await import(c.js); MANO.cdn=c; break; }catch(e){}
  }
  if(!vision) return manosFallo('cdn');
  let fs=null;
  try{ fs=await vision.FilesetResolver.forVisionTasks(MANO.cdn.wasm); }
  catch(e){ return manosFallo('cdn'); }
  /* GPU PRIMERO Y CPU DE RESPALDO: en telefonos viejos el delegado de GPU tira al crear la tarea, y
     un detector a 15 cuadros por segundo en CPU sigue siendo un juego jugable. */
  for(const dg of ['GPU','CPU']){
    try{
      MANO.det=await vision.HandLandmarker.createFromOptions(fs,{
        baseOptions:{ modelAssetPath:MANO_MODELO, delegate:dg },
        runningMode:'VIDEO', numHands:2 });
      MANO.delegado=dg; break;
    }catch(e){ MANO.det=null; }
  }
  if(!MANO.det) return manosFallo('modelo');
  MANO.estado='lista'; MANO.on=true; MANO.error='';
  MANO.hz = (plataf==='movil')? MANO_HZ_MOVIL : MANO_HZ_PC;
  document.body.classList.add('manos'); document.body.classList.remove('pad');
  pintarCam(); pintarCtrl();
  manosLazo();
  return MANO.estado;
}
/* =========================================================================================
   LA MEDICION VA POR SU CUENTA Y EL DIBUJO INTERPOLA

   El problema medido: detectForVideo() tarda entre 8 y 20 ms en un telefono, y estaba llamandose
   DENTRO del requestAnimationFrame del juego. O sea que cada cuadro de render pagaba la medicion, y
   con un presupuesto de 16,6 ms para 60 fps eso se come todo: el juego bajaba a 30 o menos "solo por
   las manos", que es exactamente lo que reporto el usuario.

   La solucion NO es medir mas rapido, es medir MENOS y dibujar igual:
   1. La medicion la maneja requestVideoFrameCallback del propio <video>, que dispara una vez por
      CUADRO DE CAMARA — no por cuadro de render. Segun la especificacion corre al minimo entre los
      fps del video y los del navegador, asi que con una camara de 30 fps dispara 30 veces por
      segundo aunque el juego dibuje 120. Y encima se limita a 24 Hz en telefono.
   2. Entre medicion y medicion los 21 puntos de cada mano se INTERPOLAN, con un poco de prediccion
      acotada y un suavizado exponencial. Es el mismo criterio que el juego ya usa con su paso fijo
      de 60 y sus cuadros de 120: la verdad se calcula pocas veces y el dibujo rellena.
   3. La entrada baja a 320x240 (2,25 veces menos pixeles que 480x360).

   Por que no un Web Worker, que seria lo "correcto": @mediapipe/tasks-vision hace
   document.createElement('canvas') adentro, que no existe en un worker, y el caso de iOS 17 esta
   abierto en el repositorio de MediaPipe. Un worker que no arranca en la mitad de los telefonos es
   peor que 24 Hz interpolados que arrancan en todos.
   ========================================================================================= */
const MANO_PRED=45;      // ms de prediccion como maximo: mas que esto y la mano se adelanta y tiembla
const MANO_TAU=0.032;    // constante del suavizado, en segundos
const MANO_CADUCA=260;   // sin medicion nueva por mas de esto, la mano se fue
const MANO_SALTO=0.22;   // si el objetivo esta mas lejos que esto (en fraccion de pantalla), se salta

function ranuraNueva(){
  const R={ hay:false, viva:0, t0:0, t1:0,
            a:new Float32Array(63), b:new Float32Array(63), sal:new Float32Array(63),
            dedos:0, estirados:[false,false,false,false,false], pinza:false, lado:'',
            lmsSal:new Array(21) };
  /* LA SALIDA VA PREASIGNADA. Convertir 21 puntos a objetos en cada cuadro son 42 objetos por
     cuadro y 2.520 por segundo tirados a la basura: en un telefono eso es el recolector de basura
     entrando cada pocos segundos, o sea un tironcito periodico justo en un juego cuyo unico defecto
     reportado era el rendimiento. Se escriben los mismos objetos siempre. */
  for(let i=0;i<21;i++) R.lmsSal[i]={x:0,y:0,z:0};
  return R;
}
MANO.ranuras=[ranuraNueva(), ranuraNueva()];

function lmsAArreglo(lm, dst){
  for(let i=0;i<21;i++){ const p=lm[i]; dst[i*3]=p.x; dst[i*3+1]=p.y; dst[i*3+2]=p.z||0; }
}
/* el arreglo suavizado vuelto a la forma que esperan manoLeer() y manoPinzas(), EN SITIO */
function arregloALms(src, dst){
  for(let i=0;i<21;i++){ const p=dst[i]; p.x=src[i*3]; p.y=src[i*3+1]; p.z=src[i*3+2]; }
  return dst;
}
/* una medicion entra a su ranura: corre la anterior a `a`, la nueva a `b`, y guarda los tiempos.
   Es lo unico que la interpolacion necesita saber. */
function ranuraPoner(q, lm, t){
  const R=MANO.ranuras[q];
  const lec=manoLeer(lm);
  if(lec){ R.dedos=lec.dedos; R.estirados=lec.estirados; R.pinza=lec.pinza; }
  if(!R.hay){ lmsAArreglo(lm, R.a); R.sal.set(R.a); R.t0=t-33; }
  else { R.a.set(R.b); R.t0=R.t1; }
  lmsAArreglo(lm, R.b);
  R.t1=t; R.hay=true; R.viva=t;
  return R;
}
/* GANCHO DE PRUEBA: mete manos como si las hubiera medido la camara. Entra por el MISMO lugar que
   una medicion de verdad —las ranuras— porque probar el dibujo por otro camino no probaria ni la
   interpolacion ni el reparto por mano izquierda/derecha. */
function manosInyectar(lms){
  const t=performance.now();
  const n=Math.min(2, (lms&&lms.length)||0);
  for(let k=0;k<n;k++) ranuraPoner(k, lms[k], t);
  for(let q=n;q<2;q++) MANO.ranuras[q].hay=false;
  MANO.lms=lms||null;
}

function manosMedir(t){
  let r=null;
  const t0=performance.now();
  try{ r=MANO.det.detectForVideo(MANO.vid, t); }catch(e){ return; }
  MANO.msDet = MANO.msDet*0.8 + (performance.now()-t0)*0.2;
  MANO.medidas++;
  const lms=(r && r.landmarks)? r.landmarks : [];
  const lados=(r && (r.handednesses||r.handedness)) || [];
  MANO.lms=lms.length? lms : null;
  /* LAS RANURAS SE ASIGNAN POR MANO IZQUIERDA/DERECHA Y NO POR ORDEN DE LLEGADA. MediaPipe devuelve
     las manos en el orden que le sale, asi que usar el indice del arreglo hace que en cuanto el orden
     cambia la interpolacion cruce una mano con la otra: en pantalla se ve un salto de una mano a la
     otra. `handedness` es estable. */
  const usada=[false,false];
  const asignada=new Array(lms.length).fill(-1);
  for(let k=0;k<lms.length;k++){
    const cat=(lados[k] && lados[k][0] && lados[k][0].categoryName)||'';
    let q = (cat==='Left')? 0 : (cat==='Right'? 1 : -1);
    if(q<0 || usada[q]) q = usada[0]? (usada[1]? -1 : 1) : 0;
    if(q<0) continue;
    usada[q]=true; asignada[k]=q;
    ranuraPoner(q, lms[k], t).lado=cat;
  }
  pintarCam();
}

/* SE LLAMA UNA VEZ POR CUADRO DE RENDER, y es lo unico de las manos que corre a 60. */
function manosAvanzar(dt){
  const ahora=performance.now();
  let vivas=0, total=0, pinza=false;
  const salida=[];
  for(let q=0;q<2;q++){
    const R=MANO.ranuras[q];
    if(!R.hay) continue;
    /* con la pausa puesta no caducan: en el banco la mano se inyecta y despues hay que sacar la
       foto, y una captura por CDP tarda mas de los 260 ms de caducidad — la mano se moria entre la
       inyeccion y la foto y la captura salia sin manos aunque el codigo estuviera bien. */
    if(!MANO.pausa && ahora-R.viva > MANO_CADUCA){ R.hay=false; continue; }
    const span=Math.max(8, R.t1-R.t0);
    /* prediccion ACOTADA: se extrapola el tiempo que paso desde la ultima medicion, pero nunca mas
       de MANO_PRED. Sin tope, un hueco de medio segundo manda la mano al otro lado de la pantalla. */
    const f = 1 + Math.min(MANO_PRED, ahora-R.t1)/span;
    const k = 1-Math.exp(-dt/MANO_TAU);
    /* si el objetivo salto lejisimo —la mano reaparecio en otro lado— no se desliza, se pone */
    const d=Math.hypot(R.b[0]+(R.b[0]-R.a[0])*(f-1)-R.sal[0],
                       R.b[1]+(R.b[1]-R.a[1])*(f-1)-R.sal[1]);
    const salta = d>MANO_SALTO;
    for(let i=0;i<63;i++){
      const obj=R.b[i]+(R.b[i]-R.a[i])*(f-1);
      R.sal[i] = salta? obj : R.sal[i]+(obj-R.sal[i])*k;
    }
    vivas++; total+=R.dedos; if(R.pinza) pinza=true;
    salida.push(R);
  }
  MANO.hay=vivas>0; MANO.manos=vivas;
  MANO.crudo=Math.min(10, total);
  MANO.gesto=pinza? 'pinza' : '';
  manoVoto(vivas? Math.min(10,total) : -1);
  /* las pinzas salen de los puntos SUAVIZADOS, no de la ultima medicion: si salieran de la medicion,
     apuntar a un bicho seria apuntar con una mano que se mueve a saltos de 24 Hz mientras se ve una
     que se mueve a 60 */
  MANO.pinzas=manoPinzas(salida.map(R=>arregloALms(R.sal, R.lmsSal)));
  MANO.vivas=salida;
}

/* el lazo de medicion, colgado del video y no del render */
function manosLazo(){
  const v=MANO.vid; if(!v) return;
  const paso=(ahora)=>{
    if(MANO.estado!=='lista'){ return; }
    const t=performance.now();
    if(!MANO.pausa && v.readyState>=2 && (t-MANO.ultT) >= (1000/MANO.hz)-2){
      MANO.ultT=t; manosMedir(t);
    }
    pedir();
  };
  const pedir=()=>{
    if(MANO.estado!=='lista') return;
    if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
    else setTimeout(()=>paso(performance.now()), Math.max(8, 1000/MANO.hz));
  };
  pedir();
}

function pintarCam(){
  const e=document.getElementById('camEst'); if(!e) return;   // sigue existiendo, oculto
  if(MANO.estado==='carga'){ e.textContent=TX('manoCarga'); return; }
  if(MANO.estado!=='lista'){ e.textContent='—'; return; }
  if(!MANO.hay){ e.textContent=TX('manoLista'); return; }
  if(MANO.gesto==='pinza'){ e.textContent=TX('hazPinza'); return; }
  /* CON DOS MANOS SE DICE QUE SON DOS. El detector va con numHands 2 porque las cuentas llegan a
     diez, y si el cartel dice solo "7 DEDOS" no hay forma de saber si leyo las dos manos o una. */
  const n=(MANO.crudo!=null? MANO.crudo : Math.max(0,MANO.dedos));
  e.textContent = (MANO.manos>1)? TX('manoDos',{n}) : TX('dedos',{n});
}

/* ===================== EL TOQUE, PARA QUIEN NO TIENE CAMARA =====================
   Los bichos se revientan con pinza, pero un juego que solo se puede jugar con webcam es un juego
   que la mayoria no puede jugar — la misma razon por la que existe el teclado de numeros. Un toque
   en la pantalla es la pinza de quien no tiene camara, y ademas es lo que cualquiera intenta primero.
   Se guardan las coordenadas NORMALIZADAS del marco y no los pixeles: el marco cambia de tamano con
   la pantalla, y la proyeccion de los bichos tambien, asi que compararlos en 0..1 es lo unico que no
   depende del aparato. */
const TOQUES=[];
(function(){
  const m=document.getElementById('marco'); if(!m) return;
  m.addEventListener('pointerdown', e=>{
    const r=m.getBoundingClientRect();
    if(!r.width || !r.height) return;
    TOQUES.push({ x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height });
    if(TOQUES.length>8) TOQUES.shift();
  }, {passive:true});
})();

/* =========================================================================================
   LAS MANOS EN 3D, RECONSTRUIDAS DESDE LA PANTALLA

   El pedido era manos humanas con profundidad, no un esqueleto de palitos encima del cuadro. Son
   dos manos de verdad en la escena: falanges con volumen, articulaciones redondeadas, palma, y
   delante de todo el mundo, asi que tapan al profesor y a los bichos como taparia una mano.

   LA DECISION IMPORTANTE ES DE DONDE SALE LA FORMA, y no es de los worldLandmarks metricos de
   MediaPipe aunque parezca lo obvio. Cada punto se coloca SOBRE SU PROPIO RAYO DE PANTALLA, a una
   profundidad que sale de la z relativa. Por que asi:

   - Con los worldLandmarks habria que anclar la mano en algun punto —la muneca— y escalar la forma
     desde ahi. Eso hace que el pulgar y el indice EN 3D no caigan donde estan los mismos puntos EN
     PANTALLA, y el juego apunta a los bichos con los puntos de pantalla. O sea: verias la pinza en
     un lugar y reventarias un bicho en otro. Inaceptable en un juego que se apunta con la mano.
   - Reconstruyendo por rayos, el dibujo y el apuntado son la misma cosa POR CONSTRUCCION, y la
     perspectiva sale gratis: los puntos normalizados ya la traen puesta, porque vienen de una camara.

   La z de MediaPipe es "profundidad relativa a la muneca" en unidades parecidas a las de x, no en
   metros; se multiplica por MANO_KZ para llevarla a metros y ese numero se ajusto mirando.

   Y VAN INSTANCIADAS. Una mano son 21 articulaciones y 21 huesos; dos manos son 84 piezas. Sueltas
   serian 84 llamadas de dibujo sobre un juego que dibuja la escuela con una. Instanciadas son DOS:
   un cilindro para los huesos y una esfera para las articulaciones.
   ========================================================================================= */
const MANO_HUESOS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                   [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const MANO_PUNTAS=[4,8,12,16,20];
/* EL RADIO DE CADA ARTICULACION, EN METROS Y A ESCALA DE MANO DE VERDAD. Todos iguales se lee a
   cadena de bolitas; los dedos AFINAN hacia la punta y la muneca es lo mas gordo, y eso es la mitad
   de lo que hace que una mano parezca una mano. */
const MANO_RADIO=(()=>{
  const r=new Float32Array(21);
  r[0]=0.0175;                                        // muneca
  r[1]=0.0150; r[2]=0.0125; r[3]=0.0110; r[4]=0.0098; // pulgar
  const base=[0.0135,0.0135,0.0128,0.0118];
  for(let d=0;d<4;d++){ const i0=5+d*4;
    r[i0]=base[d]; r[i0+1]=base[d]*0.86; r[i0+2]=base[d]*0.74; r[i0+3]=base[d]*0.66; }
  return r;
})();
const MANO_KZ=0.42;        // metros por unidad de z relativa
const MANO_DIST=0.40;      // a que distancia de la camara flota la mano
const MANO_ESC=1.00;       // escala general, por si hay que agrandarlas
/* EL GROSOR SALE DE LA PROPIA MANO Y NO ES UN NUMERO FIJO, y esto se vio en la primera captura: con
   los radios en metros absolutos los dedos salian como chorizos —radio de 30 px— porque el grosor
   dependia de MANO_DIST y el ANCHO en pantalla, en cambio, sale de los puntos. Dos cosas que tienen
   que ser proporcionales manejadas por dos numeros distintos: si el jugador acerca la mano a la
   camara, la mano crece y los dedos no.
   Ahora se mide la palma reconstruida —muneca al nudillo del medio— y los radios se escalan contra
   los 9,5 cm que mide esa distancia en una mano adulta. Con eso el grosor es correcto a cualquier
   distancia y MANO_DIST deja de afectarlo. */
const MANO_PALMA_M=0.095;
const MANOS_MAX=2, MANO_ART=21, MANO_HUE=MANO_HUESOS.length;

/* el nombre lleva MANO_ adelante porque M_PIEL ya existe: es el material del rig de cajas del
   profesor, declarado en e2.js. Dos const con el mismo nombre en un modulo no son un aviso, son un
   SyntaxError que tira la pagina entera antes de la primera linea. */
const MANO_M_PIEL=new THREE.MeshLambertMaterial({ color:0xEDB894 });
/* la punta del dedo que el juego CONTO se pinta distinto, y por eso las esferas llevan color por
   instancia: cuando el numero no es el que el jugador esperaba, ahi se ve cual dedo no estiro */
const manoArt=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8), MANO_M_PIEL, MANOS_MAX*MANO_ART);
const manoHue=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,9,1,true), MANO_M_PIEL, MANOS_MAX*MANO_HUE);
for(const m of [manoArt, manoHue]){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled=false; m.visible=false; m.renderOrder=5; escena.add(m);
}
manoArt.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MANOS_MAX*MANO_ART*3), 3);
manoArt.instanceColor.setUsage(THREE.DynamicDrawUsage);
/* LA PALMA. Sin ella la mano se lee a "cinco cadenas de bolitas saliendo de un punto": los huesos
   del esqueleto que van de la muneca a los nudillos no tienen carne alrededor. Es un elipsoide
   —esfera achatada— apoyado en el plano de la palma, y es la pieza que hace que se lea a mano. */
const manoPal=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,9), MANO_M_PIEL, MANOS_MAX);
manoPal.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
manoPal.frustumCulled=false; manoPal.visible=false; manoPal.renderOrder=5; escena.add(manoPal);
const _hx=new THREE.Vector3(), _hy=new THREE.Vector3(), _hn=new THREE.Vector3();
const _hmat=new THREE.Matrix4();

const _hp=[], _hm=new THREE.Matrix4(), _hq=new THREE.Quaternion(), _hv=new THREE.Vector3();
const _hd=new THREE.Vector3(), _hs=new THREE.Vector3(), _hup=new THREE.Vector3(0,1,0);
const _hc=new THREE.Color();
for(let i=0;i<MANO_ART;i++) _hp.push(new THREE.Vector3());

/* LA PUNTA CONTADA SE TINE, NO SE PINTA DE VERDE FLUOR. En la primera captura las puntas eran
   pelotitas verdes pegadas a una mano de piel: se leia a error de render, no a informacion. Un tono
   apenas mas claro y frio alcanza para verlo y no rompe la mano. */
const COL_PIEL=new THREE.Color(0xEDB894), COL_CUENTA=new THREE.Color(0xC8E8A8);

function manos3DDibujar(){
  const vivas=(MANO.on && MANO.vivas)? MANO.vivas : null;
  const n=vivas? vivas.length : 0;
  manoArt.visible=n>0; manoHue.visible=n>0; manoPal.visible=n>0;
  if(!n){
    /* LOS NUMEROS TAMBIEN SE APAGAN. Estaban colgados de la rama con manos: cuando la mano se iba
       —o caducaba a los 260 ms sin medicion— las mallas se ocultaban pero los dos numeros quedaban
       clavados en pantalla, en el ultimo lugar donde hubo una mano. */
    for(let q=0;q<MANOS_MAX;q++){
      const el=document.getElementById('manoN'+q); if(el) el.classList.remove('ver');
    }
    return;
  }
  /* de pantalla a espacio de camara: media altura visible a la distancia de la mano */
  const tanV=Math.tan(camara.fov*Math.PI/360);
  let ia=0, ih=0;
  for(let q=0;q<n && q<MANOS_MAX;q++){
    const R=vivas[q], L=R.sal;
    const z0=L[2];
    for(let i=0;i<MANO_ART;i++){
      const x=MANO.espejo? 1-L[i*3] : L[i*3];
      const y=L[i*3+1];
      const D=MANO_DIST + (L[i*3+2]-z0)*MANO_KZ;
      const d=Math.max(0.12, D);
      _hp[i].set((x*2-1)*tanV*camara.aspect*d*MANO_ESC, -(y*2-1)*tanV*d*MANO_ESC, -d);
      camara.localToWorld(_hp[i]);
    }
    /* la escala de ESTA mano, medida en ella misma */
    const esc=Math.max(0.15, _hd.subVectors(_hp[9], _hp[0]).length()/MANO_PALMA_M);
    /* las articulaciones */
    for(let i=0;i<MANO_ART;i++){
      const r=MANO_RADIO[i]*esc;
      _hm.compose(_hp[i], _hq.identity(), _hs.set(r,r,r));
      manoArt.setMatrixAt(ia, _hm);
      const punta=MANO_PUNTAS.indexOf(i);
      _hc.copy(punta>=0 && R.estirados[punta]? COL_CUENTA : COL_PIEL);
      manoArt.setColorAt(ia, _hc);
      ia++;
    }
    /* la palma: un elipsoide en el plano de la muneca y los nudillos */
    {
      const p0=_hp[0], p5=_hp[5], p17=_hp[17];
      _hv.copy(p5).add(p17).multiplyScalar(0.5);
      _hy.subVectors(_hv, p0);
      const largo=Math.max(1e-4, _hy.length());
      _hy.multiplyScalar(1/largo);
      _hn.crossVectors(_hd.subVectors(p5,p0), _hx.subVectors(p17,p0)).normalize();
      _hx.crossVectors(_hy, _hn).normalize();
      const ancho=_hp[5].distanceTo(_hp[17]);
      _hmat.makeBasis(_hx, _hy, _hn);
      _hq.setFromRotationMatrix(_hmat);
      _hv.copy(p0).addScaledVector(_hy, largo*0.52);
      _hm.compose(_hv, _hq, _hs.set(ancho*0.60, largo*0.62, MANO_RADIO[0]*esc*1.05));
      manoPal.setMatrixAt(q, _hm);
    }
    /* los huesos: un cilindro de largo 1 estirado entre las dos puntas.
       SE USA CILINDRO Y NO CAPSULA a proposito: una capsula estirada en su eje deforma las dos
       tapas, y las tapas ya las ponen las esferas de las articulaciones. */
    for(const [a,b] of MANO_HUESOS){
      _hd.subVectors(_hp[b], _hp[a]);
      const largo=_hd.length();
      if(largo<1e-5){ _hm.makeScale(0.0001,0.0001,0.0001); manoHue.setMatrixAt(ih++, _hm); continue; }
      _hv.addVectors(_hp[a], _hp[b]).multiplyScalar(0.5);
      _hq.setFromUnitVectors(_hup, _hd.clone().normalize());
      /* el hueso toma el PROMEDIO de los dos radios y un pelo mas, no el minimo y un pelo menos:
         con el minimo por 0,92 el cilindro quedaba mas fino que las dos esferas de sus puntas y el
         dedo se veia como un collar de cuentas en vez de un dedo */
      const r=(MANO_RADIO[a]+MANO_RADIO[b])*0.5*1.02*esc;
      _hm.compose(_hv, _hq, _hs.set(r, largo, r));
      manoHue.setMatrixAt(ih++, _hm);
    }
  }
  /* las instancias que no se usan se esconden en escala cero */
  for(; ia<MANOS_MAX*MANO_ART; ia++){
    _hm.makeScale(0.0001,0.0001,0.0001); _hm.setPosition(0,-90,0);
    manoArt.setMatrixAt(ia, _hm);
  }
  for(; ih<MANOS_MAX*MANO_HUE; ih++){
    _hm.makeScale(0.0001,0.0001,0.0001); _hm.setPosition(0,-90,0);
    manoHue.setMatrixAt(ih, _hm);
  }
  for(let q=n;q<MANOS_MAX;q++){
    _hm.makeScale(0.0001,0.0001,0.0001); _hm.setPosition(0,-90,0);
    manoPal.setMatrixAt(q, _hm);
  }
  manoArt.instanceMatrix.needsUpdate=true;
  manoHue.instanceMatrix.needsUpdate=true;
  manoPal.instanceMatrix.needsUpdate=true;
  if(manoArt.instanceColor) manoArt.instanceColor.needsUpdate=true;
  manos3DNumeros(vivas, n, tanV);
}
/* el numero de cada mano, en DOM y no en el mundo: es informacion de interfaz y tiene que leerse
   nitida y del mismo tamano en cualquier pantalla */
function manos3DNumeros(vivas, n, tanV){
  const W=lienzo.clientWidth, H=lienzo.clientHeight;
  for(let q=0;q<MANOS_MAX;q++){
    const el=document.getElementById('manoN'+q); if(!el) continue;
    if(q>=n){ el.classList.remove('ver'); continue; }
    const R=vivas[q], L=R.sal;
    const x=MANO.espejo? 1-L[0] : L[0];
    el.style.left=(x*100)+'%';
    el.style.top=((L[1]*H+34)/H*100)+'%';
    el.textContent=String(R.dedos);
    el.classList.add('ver');
  }
}

/* GANCHO: donde cayeron las manos en el mundo y donde se proyectan, para poder comprobar que el
   dibujo 3D y el apuntado 2D son el mismo lugar — que es toda la razon de reconstruir por rayos. */
function manos3DVer(){
  const r={ vivas:(MANO.vivas||[]).length, dist:MANO_DIST, kz:MANO_KZ, esc:MANO_ESC, manos:[] };
  const W=lienzo.clientWidth, H=lienzo.clientHeight;
  const v=new THREE.Vector3();
  for(const R of (MANO.vivas||[])){
    const L=R.sal, tanV=Math.tan(camara.fov*Math.PI/360);
    const m={ dedos:R.dedos, puntos:{} };
    for(const [nom,i] of [['muneca',0],['pulgar',4],['indice',8]]){
      const x=MANO.espejo? 1-L[i*3] : L[i*3], y=L[i*3+1];
      const D=Math.max(0.12, MANO_DIST+(L[i*3+2]-L[2])*MANO_KZ);
      v.set((x*2-1)*tanV*camara.aspect*D*MANO_ESC, -(y*2-1)*tanV*D*MANO_ESC, -D);
      camara.localToWorld(v);
      const mundo=[+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)];
      v.project(camara);
      m.puntos[nom]={ mundo, px:[Math.round((v.x*0.5+0.5)*W), Math.round((-v.y*0.5+0.5)*H)],
                      esperado:[Math.round(x*W), Math.round(y*H)] };
    }
    r.manos.push(m);
  }
  return r;
}
window.manos3DVer=manos3DVer;

/* ===================== EL SONIDO, PROCEDURAL ===================== */
const AUD={ ctx:null, on:true };
function audioIniciar(){
  if(AUD.ctx) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  let c; try{ c=new C(); }catch(e){ return; }
  AUD.ctx=c;
  const m=c.createGain(); m.gain.value=0.8; m.connect(c.destination); AUD.m=m;
  /* la voz se decodifica UNA vez, aca: decodeAudioData es asincrono y hacerlo en el momento de
     hablar dejaria el primer "eh!" del juego sin sonar */
  vozCargar();
  try{ const an=c.createAnalyser(); an.fftSize=2048; m.connect(an);
       AUD.an=an; AUD.buf=new Float32Array(an.fftSize); }catch(e){}
}
function tono(f,dur,vol,tipo,f2){
  if(!AUD.ctx||!AUD.on) return;
  const c=AUD.ctx, t=c.currentTime;
  const o=c.createOscillator(); o.type=tipo||'square'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AUD.m); o.start(t); o.stop(t+dur+0.02);
}
/* RUIDO FILTRADO. Un grito y un bicho reventando son ruido, no tono: con osciladores solos el
   grito sale a pitido de microondas y el estallido a timbre de ascensor. Un segundo de ruido blanco
   por un pasabanda que barre da las dos cosas, y el barrido es lo que decide cual es cual — el grito
   BAJA (un grito que sube suena a persona, uno que baja suena a animal grande) y el estallido sube. */
function soplo(dur, vol, f0, f1, q){
  if(!AUD.ctx||!AUD.on) return;
  const c=AUD.ctx, t=c.currentTime, n=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=b;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||0.9;
  bp.frequency.setValueAtTime(f0,t);
  if(f1) bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(AUD.m); src.start(t); src.stop(t+dur+0.03);
}
function son(k){
  if(!AUD.ctx||!AUD.on) return;
  try{
    if(k==='bien'){ [660,880,1174].forEach((f,i)=>setTimeout(()=>tono(f,0.16,0.15,'square'),i*80)); }
    else if(k==='mal'){ tono(200,0.30,0.17,'sawtooth',110); }
    else if(k==='listo'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tono(f,0.20,0.13,'square'),i*85)); }
    else if(k==='puerta'){ tono(170,0.18,0.13,'sawtooth',115); }
    else if(k==='libro'){ tono(1046,0.10,0.12,'square'); }
    else if(k==='paso'){ tono(90+Math.random()*24,0.06,0.07,'sine'); }
    else if(k==='bicho'){ tono(1500,0.09,0.07,'sawtooth',2400); tono(1500,0.09,0.05,'square',900); }
    /* MEDIDO: con soplo a 0,20 y Q 0,7 el estallido daba 0,0136 de pico contra 0,1155 de 'bien' —
       o sea que reventar un bicho sonaba doce veces mas bajo que acertar una cuenta. Un pasabanda
       angosto se come casi toda la energia del ruido blanco. Con Q 0,5, mas volumen y un golpe bajo
       encima queda por debajo del grito pero se escucha como lo que es. */
    else if(k==='revienta'){ soplo(0.22,0.55,380,2200,0.5); tono(280,0.12,0.16,'square',80);
                             tono(1100,0.07,0.09,'sawtooth',420); }
    else if(k==='muerde'){ soplo(0.18,0.40,220,90,0.8); tono(150,0.16,0.16,'sawtooth',70); }
    /* EL GRITO ES EL SONIDO MAS FUERTE DEL JUEGO, y tiene que serlo: es el unico momento en que el
       juego habla mas fuerte que el jugador. Tres formantes que BAJAN mas un soplo ancho. */
    else if(k==='grito'){
      /* LA VOZ VA ENCIMA DEL GRITO SINTETICO Y NO EN SU LUGAR. Sola, la voz generada es un hombre
         gritando en una habitacion; solo, el sintetico es un ruido descendente sin garganta. Juntos
         suena a algo con pulmones que ademas rompe el aire, y encima el sintetico tapa el corte del
         final del archivo. */
      hablar('grito', 1.0);
      musicaBajar(0.08, 0);
      tono(840,1.15,0.30,'sawtooth',170);
      tono(520,1.15,0.24,'sawtooth',115);
      tono(1280,0.85,0.14,'square',300);
      soplo(1.10,0.22,1600,180,0.6);
    }
  }catch(e){}
}
/* LA VOZ: un bip por letra, con el tono siguiendo la letra. No es un idioma y no pretende serlo —
   es lo que hace que el subtitulo se lea COMO SI alguien lo estuviera diciendo. Grabar la voz seria
   catorce lineas por tres idiomas, o sea cuarenta y dos archivos para un juego que no tiene ninguno. */
function voz(ch){
  if(!AUD.ctx||!AUD.on) return;
  const c=ch.charCodeAt(0);
  tono(230 + (c%14)*13, 0.045, 0.055, 'square');
}

/* ===================== EL DIALOGO, ESCRITO A MAQUINA ===================== */
const dEl=document.getElementById('dialogo'), dTxt=document.getElementById('dTxt');
let dCola='', dPos=0, dT=0, dVer=false;
const D_VEL=0.030;                    // segundos por letra
function decir(txt){
  dCola=txt||''; dPos=0; dT=0;
  dTxt.innerHTML='';
  dVer=!!dCola;
  dEl.classList.toggle('ver', dVer);
}
function dialogoTick(dt){
  if(!dVer || dPos>=dCola.length) return;
  dT+=dt;
  while(dT>=D_VEL && dPos<dCola.length){
    dT-=D_VEL;
    /* las etiquetas <b> se copian de una: si se escribieran letra por letra, el HTML quedaria roto
       a mitad de camino y el navegador mostraria "<b" en pantalla */
    if(dCola[dPos]==='<'){
      const fin=dCola.indexOf('>', dPos);
      dPos = fin<0? dCola.length : fin+1;
    } else {
      const ch=dCola[dPos]; dPos++;
      if(ch!==' ' && (dPos%2===0)) voz(ch);
    }
    dTxt.innerHTML=dCola.slice(0,dPos);
  }
}

function pintarLibros(){

let pant='idioma';
function verPantalla(p){
  pant=p;
  for(const [id,n] of [['pIdioma','idioma'],['pMenu','menu'],['pComo','como'],['pFin','fin'],['pMuere','muere']])
    document.getElementById(id).classList.toggle('ver', p===n);
  const enJuego=(p==='juego');
  document.body.classList.toggle('jugando', enJuego);
  jugando=enJuego && !terminado;
  if(!enJuego){ document.body.classList.remove('esperando'); document.body.classList.remove('clase');
                document.body.classList.remove('bichos'); document.body.classList.remove('grito');
                musicaParar(p==='muere'? 0.25 : 0.8); }
}

function pintarCal(){

  if(!CAL[c]) return;
  calidad=c; try{ localStorage.setItem('recreo_cal',c); }catch(e){}
  escena.fog.far=CAL[c].niebla;
  if(escuela.lockers) escuela.lockers.visible=CAL[c].lockers;
  ajustar(); pintarCal();
}

const MANO_MOTIVO={ permiso:'manoErrPermiso', camara:'manoErrCamara', cdn:'manoErrCdn',
                    modelo:'manoErrModelo', insegura:'manoErrInsegura' };
function pintarCtrl(){
  document.getElementById('oManos').classList.toggle('si', ctrlManos);
  document.getElementById('oPad').classList.toggle('si', !ctrlManos);
  document.body.classList.toggle('pad', !ctrlManos || MANO.estado==='no');
  /* EL MOTIVO SE ESCRIBE Y SE QUEDA. Un juego que se maneja con la camara y no la pide se ve roto,
     y sin decir por que no hay nada que el jugador pueda hacer al respecto. */
  const av=document.getElementById('camAviso'); if(!av) return;
  av.classList.remove('mal','bien');
  if(!ctrlManos){ av.textContent=TX('manoPad'); return; }
  if(MANO.estado==='carga'){ av.textContent=TX('manoCarga'); return; }
  if(MANO.estado==='lista'){ av.textContent=TX('manoOk'); av.classList.add('bien'); return; }
  if(MANO.error){ av.textContent=TX(MANO_MOTIVO[MANO.error]||'manoErrCamara'); av.classList.add('mal'); return; }
  av.textContent=TX('manoPide');
}
document.getElementById('oManos').onclick=async()=>{
  ctrlManos=true; try{ localStorage.setItem('recreo_ctrl','manos'); }catch(e){}
  pintarCtrl(); await manosIniciar(); ctrlManos=MANO.on; pintarCtrl(); };
document.getElementById('oPad').onclick=()=>{
  ctrlManos=false; try{ localStorage.setItem('recreo_ctrl','pad'); }catch(e){}
  MANO.on=false; document.body.classList.remove('manos'); pintarCtrl(); };
/* LA CAMARA SE PIDE AL TOCAR JUGAR, y esto era el defecto que reporto el usuario: "no me pide
   permiso de camara". El permiso solo se pedia al tocar el boton MANOS, que es una de seis opciones
   chicas del menu Y QUE YA APARECIA ELEGIDA —el modo manos es el de por defecto—, asi que tocarlo
   no parecia hacer nada y no habia ninguna razon para hacerlo. Resultado: el juego arrancaba en modo
   numeros y MediaPipe no se cargaba nunca.
   Va en JUGAR porque getUserMedia necesita un gesto del jugador y JUGAR es el gesto que todos hacen.
   Y no se bloquea el juego si falla: si no hay camara, arranca con los numeros. */
document.getElementById('bJugar').onclick=async()=>{
  audioIniciar();
  if(ctrlManos && MANO.estado!=='lista'){
    await manosIniciar();
    ctrlManos=MANO.on; pintarCtrl();
  }
  empezar();
};

/* =========================================================================================
   LA VOZ DE BALDI Y LA MUSICA

   DOS ORIGENES DISTINTOS, Y NO ES INCONSISTENCIA:

   - LA VOZ ESTA GENERADA. Cinco ladridos cortos —hola, bien, mal, grito, risa— hechos con un
     text-to-speech, recortados a la rafaga util y horneados a MP3 mono de 16 kHz: diecinueve
     kilobytes los cinco. Son INTERJECCIONES a proposito, no frases: el juego habla en tres idiomas y
     una frase grabada habria que grabarla tres veces, mientras que un "eh!" y un grito se entienden
     igual en los tres. Los subtitulos siguen haciendo el trabajo del idioma.
   - LA MUSICA ES PROCEDURAL, escrita con osciladores. No por gusto: no hubo con que generarla —el
     unico modelo de musica disponible esta reservado para otro flujo y no habia llave del otro
     proveedor— asi que en vez de dejar el juego en silencio se compone. Y encima resulta lo correcto
     para este juego: pesa CERO bytes, no se corta nunca, y puede cambiar de intensidad segun el aula
     en la que estas, que un archivo suelto no puede.

   COMO SE AGENDA LA MUSICA, que es la unica parte con truco: NO va colgada del bucle de dibujo. Un
   requestAnimationFrame se atrasa, se pausa cuando el telefono se va a segundo plano y no garantiza
   nada; el reloj de AudioContext es un reloj de audio y no se mueve. Asi que un temporizador de 100
   ms mira "que notas entran en los proximos 250 ms" y las agenda con su tiempo exacto. El sonido
   nunca depende de los cuadros. Es el patron clasico de dos relojes: el de la agenda puede temblar,
   el de la reproduccion no.
   ========================================================================================= */

const VOZ={};                     // nombre -> AudioBuffer, decodificado al arrancar el audio
let vozLista=false;
function vozCargar(){
  if(!AUD.ctx || vozLista) return;
  vozLista=true;
  for(const k in VOZ_DATOS){
    const b64=VOZ_DATOS[k].split(',')[1];
    if(!b64) continue;
    try{
      const bin=atob(b64), n=bin.length, u=new Uint8Array(n);
      for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i);
      AUD.ctx.decodeAudioData(u.buffer, (buf)=>{ VOZ[k]=buf; }, ()=>{});
    }catch(e){}
  }
}
/* SE LLAMA hablar() Y NO voz(): `voz` ya existe y es el bip por letra del subtitulo, en h2b.js. Dos
   `function voz` en un modulo no son un aviso, son un SyntaxError que tira la pagina antes de la
   primera linea — la segunda vez en este archivo que un nombre repetido cuesta una vuelta entera.
   PARA QUE NO SE PISE CONSIGO MISMA: dos "bien" encimados suenan a coro de una persona, que es lo
   mas raro que puede sonar una voz. Si el mismo ladrido ya esta sonando, el nuevo lo reemplaza. */
const vozSonando={};
function hablar(k, vol){
  if(!AUD.ctx || !AUD.on) return;
  const buf=VOZ[k]; if(!buf) return;
  try{
    const s=vozSonando[k];
    if(s){ try{ s.stop(); }catch(e){} }
    const src=AUD.ctx.createBufferSource(); src.buffer=buf;
    const g=AUD.ctx.createGain(); g.gain.value=(vol==null?1:vol);
    src.connect(g); g.connect(AUD.m);
    src.start(); vozSonando[k]=src;
    src.onended=()=>{ if(vozSonando[k]===src) vozSonando[k]=null; };
  }catch(e){}
}

/* ===================== LA MUSICA ===================== */
/* Cuatro compases en la menor con el ultimo acorde tenso: Am - F - G - E. El E mayor sobre una
   escala menor es lo que hace que el loop no se cierre nunca del todo, o sea que suene a "todavia
   falta algo" — que es exactamente el clima de una escuela en la que algo va a pasar. */
const MUS_BPM=92;
const MUS_BAJO=[[110.00,0],[87.31,1],[98.00,2],[82.41,3]];     // A2 F2 G2 E2, un acorde por compas
const MUS_ACORDE=[[220.0,261.6,329.6],[174.6,220.0,261.6],
                  [196.0,246.9,293.7],[164.8,207.7,246.9]];
/* la melodia va en grados de la escala y no en frecuencias: asi la misma linea sirve sobre los
   cuatro acordes sin escribirla cuatro veces */
const MUS_MEL=[0,2,4,2, 7,4,2,0, 0,4,7,4, 2,0,-1,0];
const MUS_ESC=[220.0,246.9,261.6,293.7,329.6,349.2,392.0,440.0,493.9];
const MUS={ on:false, paso:0, prox:0, timer:null, gan:null, pad:null, nivel:0, ducking:1,
            nBajar:0, nParar:0, nNotas:0 };
/* UNA NOTA PUEDE DECAER O SOSTENER, Y LA DIFERENCIA ERA TODO EL PROBLEMA.
   La primera version tenia un solo sobre: subir y despues caer exponencialmente hasta cero a lo
   largo de toda la duracion. Con eso una nota "sostenida" de un segundo pasa el 80% de ese segundo
   casi en silencio, porque una exponencial baja rapido al principio. Medido con audioVentana: el
   96% de las muestras del nivel 0 salian MUDAS. Una cama de fondo que esta callada el 96% del tiempo
   no es una cama tenue, es silencio con un bip cada tanto.
   Con `sostener`, la nota sube, SE QUEDA en su nivel, y recien suelta al final. */
function musNota(f, t, dur, vol, tipo, ataque, sostener){
  if(!AUD.ctx) return;
  const c=AUD.ctx;
  const o=c.createOscillator(); o.type=tipo||'triangle'; o.frequency.setValueAtTime(f,t);
  const g=c.createGain();
  const at=Math.min(ataque||0.008, dur*0.4);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+at);
  if(sostener){
    const suelta=Math.min(0.28, dur*0.45);
    g.gain.setValueAtTime(vol, t+dur-suelta);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  } else {
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }
  o.connect(g); g.connect(MUS.gan||AUD.m); o.start(t); o.stop(t+dur+0.02); MUS.nNotas++;
}
/* =========================================================================================
   EL COLCHON, QUE SUENA SIEMPRE
   Tres osciladores por un pasabajos, creados UNA vez y encendidos para todo el juego; lo unico que
   cambia es su afinacion, que sigue al acorde del compas. Es lo que hace que la musica sea una cama
   y no una sucesion de notas: entre nota y nota siempre hay algo sonando.
   Y son tres osciladores para el juego entero, no tres por compas: encender y apagar osciladores 90
   veces por minuto es basura para el recolector y clicks en los bordes.
   ========================================================================================= */
function padArmar(){
  const c=AUD.ctx;
  const fil=c.createBiquadFilter(); fil.type='lowpass'; fil.frequency.value=540; fil.Q.value=0.7;
  const gan=c.createGain(); gan.gain.value=0.075;
  fil.connect(gan); gan.connect(MUS.gan);
  const osc=[];
  for(const [d,v] of [[1,1.0],[1.5,0.45],[2,0.30]]){       // raiz, quinta, octava
    const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=110*d;
    const g=c.createGain(); g.gain.value=v;
    o.connect(g); g.connect(fil); o.start();
    osc.push({o,d});
  }
  MUS.pad={ osc, fil, gan };
}
function padAfinar(base, t){
  if(!MUS.pad) return;
  for(const {o,d} of MUS.pad.osc){
    /* setTargetAtTime y no setValueAtTime: un salto de frecuencia en un sawtooth sostenido hace un
       click, y un glissando de 120 ms se lee como que el acorde "gira" */
    o.frequency.setTargetAtTime(base*d, t, 0.12);
  }
}
function musGolpe(t, vol){
  if(!AUD.ctx) return;
  const c=AUD.ctx, dur=0.045, n=Math.floor(c.sampleRate*dur);
  const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=5200;
  const g=c.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(MUS.gan||AUD.m); s.start(t);
}
/* agenda todo lo que entra en la ventana de adelanto.
   LO QUE SUENA EN CADA NIVEL, Y POR QUE EL NIVEL 0 NO ES "CASI NADA":
   la primera version dejaba en el nivel 0 solamente el bajo en los pasos 0 y 4, o sea DOS notas por
   compas de 2,6 segundos — medido con el contador de notas, UNA nota agendada en tres segundos de
   juego y el analizador leyendo cero casi todo el tiempo. Eso no es una musica tenue: es silencio con
   un bip. El nivel 0 ya tiene que ser una musica completa y tranquila, y los niveles siguientes
   AGREGAN capas sobre ella, no la vuelven audible. */
function musAgendar(){
  if(!MUS.on || !AUD.ctx) return;
  const c=AUD.ctx;
  const semi=60/MUS_BPM/2;                       // duracion de una corchea
  if(MUS.prox < c.currentTime) MUS.prox = c.currentTime + 0.06;
  while(MUS.prox < c.currentTime + 0.30){
    const p=MUS.paso, t=MUS.prox;
    const compas=(p>>3)&3, dentro=p&7;
    const ac=MUS_ACORDE[compas];
    /* EL BAJO, en las cuatro negras del compas: es el pulso, y un pulso que aparece dos veces por
       compas no es un pulso, es un aviso */
    if((dentro&1)===0) musNota(MUS_BAJO[compas][0], t, semi*1.5, 0.100, 'square', 0.010);
    /* EL ACORDE SOSTENIDO, desde el nivel 0: es lo que hace que haya musica y no percusion. Dura
       cuatro corcheas y entra suave, asi que las tres notas se leen como un colchon y no como un
       golpe de organo. */
    if(dentro===0 || dentro===4)
      for(let k=0;k<ac.length;k++) musNota(ac[k], t, semi*3.6, 0.026, 'triangle', 0.120, true);
    /* el colchon se reafina al empezar cada compas */
    if(dentro===0) padAfinar(MUS_BAJO[compas][0], t);
    /* la melodia desde el aula 3 */
    if(MUS.nivel>=1 && (p&1)===0){
      const g=MUS_MEL[(p>>1)&15];
      if(g!=null){
        const f=MUS_ESC[Math.max(0, Math.min(MUS_ESC.length-1, g+1))];
        musNota(f, t, semi*0.95, 0.048, 'triangle', 0.006);
      }
    }
    /* el charles en las corcheas impares desde el aula 5: aprieta el pulso sin subir el volumen */
    if(MUS.nivel>=2 && (dentro&1)===1) musGolpe(t, 0.034);
    /* y desde el aula 7 una quinta abajo del bajo: la nota que hace que suene amenazante */
    if(MUS.nivel>=3 && dentro===0) musNota(MUS_BAJO[compas][0]*0.5, t, semi*3.2, 0.062, 'sawtooth', 0.030);
    MUS.prox += semi;
    MUS.paso = (MUS.paso+1) & 31;
  }
}
function musicaEmpezar(){
  if(!AUD.ctx || MUS.on) return;
  if(!MUS.gan){ MUS.gan=AUD.ctx.createGain(); MUS.gan.gain.value=0; MUS.gan.connect(AUD.m); }
  if(!MUS.pad) padArmar();
  MUS.on=true; MUS.paso=0; MUS.prox=AUD.ctx.currentTime+0.1;
  /* ENTRA CON RAMPA LINEAL Y NO EXPONENCIAL, y no es cosmetica: una rampa exponencial no puede pasar
     por cero, asi que hay que arrancarla en un valor chiquito como 0,0001 — y medido en este
     navegador la rampa quedaba congelada a mitad de camino, en 0,0049, o sea la musica agendandose y
     sonando a la milesima parte de su volumen: `on:true`, `paso` avanzando, y el analizador leyendo
     cero. La lineal arranca en 0 de verdad y no tiene ese borde. */
  const t0=AUD.ctx.currentTime;
  MUS.gan.gain.cancelScheduledValues(t0);
  MUS.gan.gain.setValueAtTime(0, t0);
  MUS.gan.gain.linearRampToValueAtTime(1, t0+1.6);
  if(MUS.timer) clearInterval(MUS.timer);
  MUS.timer=setInterval(musAgendar, 100);
  musAgendar();
}
function musicaParar(seg){
  if(!AUD.ctx || !MUS.on) return;
  MUS.nParar++;
  const t=AUD.ctx.currentTime, d=seg==null? 0.6 : seg;
  if(MUS.gan){
    MUS.gan.gain.cancelScheduledValues(t);
    MUS.gan.gain.setValueAtTime(MUS.gan.gain.value, t);
    MUS.gan.gain.linearRampToValueAtTime(0, t+d);
  }
  MUS.on=false;
  if(MUS.timer){ clearInterval(MUS.timer); MUS.timer=null; }
}
/* LA MUSICA SE AGACHA CUANDO EL HABLA O GRITA. Sin esto, el grito —que es el sonido mas fuerte del
   juego— compite con una musica que sigue a su volumen y el susto se diluye. */
function musicaBajar(f, seg){
  if(!AUD.ctx || !MUS.gan) return;
  MUS.nBajar++;
  const t=AUD.ctx.currentTime;
  MUS.gan.gain.cancelScheduledValues(t);
  MUS.gan.gain.setValueAtTime(MUS.gan.gain.value, t);
  MUS.gan.gain.linearRampToValueAtTime(Math.max(0, f), t+0.08);
  if(seg>0) MUS.gan.gain.linearRampToValueAtTime(1, t+0.08+seg);
}
/* el nivel sube con el aula: mismo tema, mas voces. Cuatro escalones en ocho aulas. */
function musicaNivel(n){ MUS.nivel=Math.max(0, Math.min(3, n)); }

/* =========================================================================================
   LOS DOS FILTROS: SATURACION Y BAJA CALIDAD

   Lo que se pidio es la cara del juego original: colores gritones y pocos pixeles. Las dos cosas se
   hacen en el MISMO sitio y por el mismo precio — la escena no se dibuja en la pantalla, se dibuja
   en un lienzo chico y despues ese lienzo se estira a pantalla completa.

   POR QUE ES ASI Y NO UN FILTRO CSS: `filter: saturate()` sobre el canvas satura, si, pero no baja
   la resolucion —solo la desenfoca— y ademas el navegador lo aplica DESPUES de haber dibujado todos
   los pixeles, o sea que cuesta igual. Dibujando en un destino de 0,34 se dibujan NUEVE VECES MENOS
   pixeles: el filtro de baja calidad no es solo un look, es la razon por la que esto corre en un
   telefono viejo. Y el estirado va con NEAREST, que es lo que da el pixel cuadrado en vez de un
   borron.

   LA CUANTIZACION DE COLOR es el tercer ingrediente y es el que hace la diferencia entre "borroso" y
   "de la epoca": el original guardaba pocos bits por canal, asi que los degradados se rompen en
   escalones. Sin esto, una pared con niebla se ve suave y moderna aunque este pixelada.
   ========================================================================================= */
const FILTROS={
  apagado:{ escala:1.00, sat:1.00, niveles:0   },
  suave:  { escala:0.80, sat:1.14, niveles:44  },
  /* 0,58 Y NO 0,40, y el numero sale de una cuenta que no habia hecho: con 0,40 en un marco de
     790x1400 el destino de render son 148x264 pixeles. El personaje ocupa un tercio de la altura,
     o sea SETENTA Y CUATRO pixeles de alto: su cara son ocho, y un brazo son dos. A ese tamano no
     hay modelo que sobreviva — se ve una mancha verde, y eso es exactamente lo que se veia.
     Con 0,58 el destino son 214x382 y el personaje pasa a 130 pixeles: se le ve la cara.
     La saturacion y los escalones se quedan; lo que estaba mal era la resolucion. */
  fuerte: { escala:0.58, sat:1.28, niveles:26  }
};
let filtro='fuerte';
try{ const g=localStorage.getItem('recreo_filtro'); if(g && FILTROS[g]) filtro=g; }catch(e){}

const postEsc=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
let postRT=null;
const postMat=new THREE.ShaderMaterial({
  uniforms:{ uTex:{value:null}, uSat:{value:1.0}, uNiv:{value:0.0} },
  vertexShader:`
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader:`
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uTex; uniform float uSat; uniform float uNiv;
    /* LA CONVERSION A sRGB VA ACA Y NO SE PUEDE SALTEAR.
       three.js aplica outputColorSpace solo cuando dibuja en el buffer de pantalla; cuando el
       destino es un WebGLRenderTarget la imagen queda en LINEAL. Mi pasada la copiaba tal cual, asi
       que todo salia oscuro y con un tinte verde-oliva: el techo casi blanco se veia verde musgo y
       el pasillo beige se veia militar. No era la saturacion —saturar un beige lo pone naranja, no
       oliva— era el gamma. Se vio en una foto y se arregla en dos lineas. */
    vec3 aSRGB(vec3 c){
      return mix(c*12.92, 1.055*pow(max(c, vec3(0.0)), vec3(0.41666))-0.055, step(vec3(0.0031308), c));
    }
    void main(){
      vec3 c=aSRGB(texture2D(uTex, vUv).rgb);
      /* la saturacion, contra el gris de LUMINANCIA y no contra el promedio: con el promedio los
         verdes se van de rango antes que los azules y el sueter verde se quema solo.
         Y va DESPUES del sRGB: la epoca que se esta imitando saturaba sobre valores de 8 bits ya
         corregidos, no sobre luz lineal. */
      float l=dot(c, vec3(0.2126, 0.7152, 0.0722));
      c=mix(vec3(l), c, uSat);
      c=clamp(c, 0.0, 1.0);
      /* y los escalones de color. floor(c*n)/n a secas oscurece medio escalon, asi que va el +0.5 */
      if(uNiv > 0.5){ c=floor(c*uNiv + 0.5)/uNiv; }
      gl_FragColor=vec4(c, 1.0);
    }`,
  depthTest:false, depthWrite:false
});
postEsc.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));

function postTam(){
  const F=FILTROS[filtro];
  const w=Math.max(2, marco.clientWidth), h=Math.max(2, marco.clientHeight);
  const dpr=render.getPixelRatio();
  const bw=Math.max(2, Math.round(w*dpr*F.escala)), bh=Math.max(2, Math.round(h*dpr*F.escala));
  if(!postRT){
    postRT=new THREE.WebGLRenderTarget(bw,bh,{ depthBuffer:true, stencilBuffer:false });
  } else if(postRT.width!==bw || postRT.height!==bh){
    postRT.setSize(bw,bh);
  }
  /* NEAREST en los dos: el magFilter da el pixel cuadrado al estirar, y el minFilter tiene que ser
     NEAREST tambien o three.js pide mipmaps de un destino de render y la textura sale negra. */
  postRT.texture.magFilter=THREE.NearestFilter;
  postRT.texture.minFilter=THREE.NearestFilter;
  postRT.texture.generateMipmaps=false;
  postMat.uniforms.uTex.value=postRT.texture;
  postMat.uniforms.uSat.value=F.sat;
  postMat.uniforms.uNiv.value=F.niveles;
  return [bw,bh];
}
function aplicarFiltro(f){
  if(!FILTROS[f]) return;
  filtro=f; try{ localStorage.setItem('recreo_filtro', f); }catch(e){}
  postTam(); pintarFiltro();
}
function pintarFiltro(){
  for(const b of document.querySelectorAll('[data-fil]')) b.classList.toggle('si', b.dataset.fil===filtro);
}
for(const b of document.querySelectorAll('[data-fil]')) b.onclick=()=>aplicarFiltro(b.dataset.fil);

/* dibuja la escena a traves del filtro. Con el filtro apagado va derecho a la pantalla y no se paga
   ni el destino de render ni la pasada de pantalla completa. */
function pintarEscena(){
  if(filtro==='apagado'){
    render.setRenderTarget(null);
    render.render(escena, camara);
    return;
  }
  postTam();
  render.setRenderTarget(postRT);
  render.clear();
  render.render(escena, camara);
  render.setRenderTarget(null);
  render.render(postEsc, postCam);
}

/* IDEM manosTam: pintarIdioma() la llama con `if(window.pintarFiltro)` y nadie la asignaba, asi que
   al cambiar de idioma los botones del filtro no se repintaban nunca. El guard esta para saltear la
   llamada del arranque —cuando `filtro` de este archivo todavia no existe y leerlo rompe el modulo
   entero—, no para desactivarla siempre. */
window.pintarFiltro=pintarFiltro;

/* =========================================================================================
   EL GUION CORRIENDO, Y EL BUCLE
   ========================================================================================= */
/* =========================================================================================
   LAS RUTAS SE CALCULAN, NO SE ESCRIBEN

   Antes habia dos constantes —RUTA_CAM y RUTA_DENTRO— con las celdas del unico viaje que existia.
   Con ocho aulas eso serian quince rutas escritas a mano, y una celda mal puesta manda la camara a
   atravesar una pared en el aula 7 sin que nadie se entere hasta llegar ahi. Asi que el camino de
   pasillo entre dos puntos sale de un BFS sobre el mapa, que es la misma estructura que ya decide
   donde va la puerta de cada aula: se declara la geometria y el resto se deduce.
   ========================================================================================= */
function puertaDe(n){ return PUERTAS.find(p=>p.aula===n && p.j===AULA_SITIO[n].j0-1)
                          || PUERTAS.find(p=>p.aula===n); }
/* la celda de PASILLO delante de la puerta principal: la puerta va siempre en j0-1 y el pasillo
   inmediatamente antes, o sea j0-2 */
function frenteDe(n){ const p=puertaDe(n); return [p.i, p.j-1]; }

function rutaCeldas(a, b){
  const K=(i,j)=>j*GW+i;
  const paso=(i,j)=> i>=0 && j>=0 && i<GW && j<GH &&
        (MAPA[j][i]===1 || (i===a[0]&&j===a[1]) || (i===b[0]&&j===b[1]));
  const de=new Map(); de.set(K(a[0],a[1]), null);
  const q=[[a[0],a[1]]];
  let hallado=false;
  while(q.length){
    const [i,j]=q.shift();
    if(i===b[0] && j===b[1]){ hallado=true; break; }
    for(const [di,dj] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const x=i+di, y=j+dj;
      if(!paso(x,y) || de.has(K(x,y))) continue;
      de.set(K(x,y), [i,j]); q.push([x,y]);
    }
  }
  if(!hallado) return null;
  const R=[]; let c=[b[0],b[1]];
  while(c){ R.push(c); c=de.get(K(c[0],c[1])); }
  return R.reverse();
}
/* Y SE SIMPLIFICA A LAS ESQUINAS. Un riel con veinte puntos en linea recta no camina distinto que
   uno con dos, pero cada punto es una parada de 10 cm donde el resorte del giro vuelve a arrancar:
   en pantalla eso se ve como una camara que tiembla al avanzar. */
function esquinas(r){
  if(!r || r.length<3) return r||[];
  const R=[r[0]];
  for(let k=1;k<r.length-1;k++){
    const a=r[k-1], b=r[k], c=r[k+1];
    if((a[0]===b[0]) !== (b[0]===c[0])) R.push(b);
  }
  R.push(r[r.length-1]);
  return R;
}
/* SI EL PRIMER PUNTO YA LE QUEDA ENCIMA, SE TIRA. El profesor no arranca sobre la ruta: en el
   tutorial esta 2,73 m delante de la camara y el primer punto de la ruta es la celda de la camara,
   asi que lo primero que hacia era caminar hacia atras y cruzarse con ella — en la captura del
   pasillo no habia nadie y el "vení conmigo" lo decia una voz sin cuerpo. Si ya esta dentro de la
   celda del primer punto, ese punto no tiene nada que decirle. */
function rutaDesde(pts, x, z){
  const R=pts.slice();
  /* SE DESCARTA COMO MAXIMO EL PRIMERO. El `while` descartaba TODOS los puntos que estuvieran a
     menos de una celda, y en un pasillo con esquina eso se come el punto de la esquina: la ruta
     [entrada, esquina, destino] queda en [destino] y el profesor camina en DIAGONAL, atravesando la
     pared — que es exactamente el "se desvia a veces" que reporto el usuario. Nunca fue un problema
     de rumbo: era una ruta a la que le faltaba la esquina.
     Y ni el primero se descarta si el segundo no queda MAS ADELANTE: se compara la distancia al
     punto 1 desde el profesor contra la distancia desde el punto 0, y si desde el profesor no esta
     mas cerca, el punto 0 todavia tiene algo que decirle. */
  if(R.length>2 && Math.hypot(R[0][0]-x, R[0][1]-z) < CEL*0.75){
    const dProf=Math.hypot(R[1][0]-x, R[1][1]-z);
    const dCero=Math.hypot(R[1][0]-R[0][0], R[1][1]-R[0][1]);
    if(dProf<=dCero) R.shift();
  }
  return R;
}
/* entrar al aula: la puerta, la primera fila del aula, el medio, y el sitio de la camara */
function rutaEntrar(n){
  const S=AULA_SITIO[n], p=puertaDe(n);
  return [[p.i,p.j],[S.i,S.j0],[S.i,S.jm],[S.i,S.jCam]];
}
/* salir del aula: al reves, hasta el pasillo */
function rutaSalir(n){
  const S=AULA_SITIO[n], p=puertaDe(n);
  return [[S.i,S.jm],[S.i,S.j0],[p.i,p.j],[p.i,p.j-1]];
}

function cel2(p){ return [XC(p[0]), ZC(p[1])]; }
let restoRuta=null;          // la segunda mitad del viaje, la que se camina despues de los bichos
let bichosCerrado=false;     // la tanda de bichos de la escena actual ya se cerro
let aulaPrev=0;              // de que aula venimos, para saber si hay que salir de ella

/* ---------- LAS ESPERAS VAN EN EL PASO FIJO, NO EN setTimeout ----------
   Estaban con setTimeout y el propio auto-jugador lo destapo: corre el guion entero de forma
   sincronica, asi que los setTimeout NUNCA disparan y el juego se quedaba clavado despues del primer
   libro con `bloqueo` en true para siempre (6.001 vueltas y seguia en la cuenta 1).
   Pero el defecto no es del test: una pausa de 1,1 s medida con setTimeout es una pausa que depende
   del reloj de la pestaña y no del reloj del juego, o sea la unica parte del juego que NO respeta el
   paso fijo. Metida en el paso fijo, dura lo mismo a 30 y a 144 cuadros. */
const espDespues=[];
function luegoDe(seg, fn){ espDespues.push({ t:seg, fn }); }
function esperasTick(dt){
  for(let k=espDespues.length-1;k>=0;k--){
    const e=espDespues[k];
    e.t-=dt;
    if(e.t<=0){ espDespues.splice(k,1); try{ e.fn(); }catch(err){} }
  }
}

function empezar(){
  terminado=0; libros=0; aciertos=0; cuenta=null; bloqueo=false;
  aulaN=TOUR[0]; aulaIdx=0; aulaK=0; muertes=0; aulaPrev=0; restoRuta=null; gritoT=0;
  bichosApagar();
  CUENTAS=armarCuentas();
  for(const l of LIBROS){ l.hecho=false; l.g.visible=false; }
  for(const p of PUERTAS){ p.abierta=false; p.t=0; p.ang=0; }
  /* ARRANCA MIRANDO HACIA DONDE VA A CAMINAR, y no de costado. Estaba con la camara mirando a -X y
     el profesor 2,73 m en esa direccion; pero el primer viaje baja por la columna 11, o sea -Z. Con
     lo cual lo primero que hacia el profesor era caminar HACIA ATRAS hasta la celda de la camara
     para poder doblar, cruzandose con el jugador — y si en vez de eso se le saltea ese punto, corta
     la esquina y camina en diagonal por dentro de la pared (medido: 113 pasos en la celda [10,8]).
     El problema nunca fue la ruta: era que el saludo pasaba en una esquina. Poniendo a los dos sobre
     la columna 11 y la camara mirando a -Z, la ruta sale derecho y no hay esquina que cortar. */
  cam.x=XC(11); cam.z=ZC(9); cam.giro=Math.PI; cam.pitch=0.02; cam.ojo=OJO;
  cam.ax=cam.x; cam.az=cam.z; cam.agiro=cam.giro; cam.apitch=cam.pitch; cam.aojo=cam.ojo;
  /* A DOS METROS SETENTA Y NO A SEIS. El primer plano del juego es el saludando, y a 5,88 m en un
     pasillo de 3,6 de techo el personaje ocupaba 90 px de los 732 del marco: un muneco al fondo.
     A 2,73 ocupa el 40% de la altura, que es la distancia a la que alguien te saluda. */
  PROFE.x=XC(11); PROFE.z=ZC(8.35); PROFE.giro=0;
  PROFE.ax=PROFE.x; PROFE.az=PROFE.z; PROFE.agiro=PROFE.giro;
  PROFE.anim='saludar'; PROFE.animOtro=null; PROFE.mezcla=0; PROFE.at=0;
  riel=null; profeRiel=null;
  escena_i=-1; escenaT=0; esperaT=0; espDespues.length=0;
  MANO.cand=-1; MANO.votos=0; MANO.dedos=0; padPedido=-1;
  document.body.classList.remove('clase');
  pintarLibros(); verPantalla('juego');
  musicaNivel(0); musicaEmpezar();
  siguienteEscena();
}
function siguienteEscena(){
  escena_i++; escenaT=0; esperaT=0; padPedido=-1;
  MANO.cand=-1; MANO.votos=0;
  const E=GUION[escena_i];
  if(!E){ ganar(); return; }
  profeAnim(E.anim);
  /* EL NUMERO QUE SE DICE ES EL DEL RECORRIDO Y NO EL DEL MAPA. El aula 5 es la octava que se
     visita, asi que decir "Aula 5" con el cartel de arriba en "AULA 8/8" son dos numeros distintos
     para la misma cosa. Al jugador no le importa como se llaman las aulas en el plano: le importa
     cuantas le faltan. */
  decir(TX(E.txt, {a:(E.aula? TOUR.indexOf(E.aula)+1 : 1), t:TOUR.length}));
  if(E.voz) hablar(E.voz, 0.9);
  document.body.classList.toggle('esperando', !!E.espera);
  if(E.espera) pintarAro(0, null, '');
  if(E.viaje!=null){
    /* EL VA ADELANTE Y LA CAMARA LO SIGUE. Se lanzan los dos rieles a la vez con el de el mas
       rapido: asi le saca ventaja, y lo que el jugador ve es una espalda que se aleja y una camara
       que la persigue — que es como se lee "vení conmigo" sin decirlo. Y su ruta NO empieza en el
       primer punto de la de la camara: el arranca delante, asi que empezar ahi lo hacia caminar
       hacia atras y cruzarse con ella. */
    const n=E.viaje;
    let ruta;
    if(E.resto && restoRuta){ ruta=restoRuta; restoRuta=null; }
    else {
      /* de donde salimos: si venimos de un aula, primero hay que salir de ella */
      let pre=[];
      let desde;
      if(aulaPrev && aulaPrev!==n){
        const pa=puertaDe(aulaPrev);
        pa.abierta=true;
        pre=rutaSalir(aulaPrev);
        desde=[pa.i, pa.j-1];
      } else {
        desde=celda(cam.x, cam.z);
      }
      const medio=rutaCeldas(desde, frenteDe(n));
      ruta=[...pre, ...esquinas(medio||[frenteDe(n)])];
      /* SE CORTA AL MEDIO SI DESPUES VIENEN BICHOS. El tramo mas largo son catorce celdas y los
         bichos al final de la caminata dejarian veinte segundos seguidos de pasillo antes. Cortado
         a la mitad, la actividad cae EN el camino, que es lo que se pidio. */
      if(E.mitad && ruta.length>2){
        const k=Math.max(1, Math.floor(ruta.length/2));
        restoRuta=ruta.slice(k);
