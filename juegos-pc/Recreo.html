<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Recreo</title>
<style>
  /* ===================== VERTICAL, Y NO ES UNA PREFERENCIA =====================
     El juego se juega con UNA MANO EN EL AIRE delante de la camara del telefono. Eso obliga a
     vertical: el telefono queda parado (apoyado o en la otra mano), la camara frontal mira de frente,
     y la mano entra en el cuadro completa. Acostado, la mano tapa media pantalla o se sale del
     encuadre. Asi que el marco es 9:16 SIEMPRE — en un telefono ocupa todo, y en una notebook queda
     centrado con negro a los costados, que es como se ve un juego vertical en un monitor y no un
     error. */
  :root{ --tinta:#1b1b1f; --papel:#f2efe6; --beige:#c9b48a; --rojo:#c0392b;
         --verde:#2ecc0f; --azul:#2626d6; --calma:#7fb2a2; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#07070a;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    color:#f2efe6; -webkit-user-select:none; user-select:none; touch-action:none; }
  #caja{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #marco{ position:relative; overflow:hidden; background:#0d0d10;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9)); }
  canvas#lienzo{ display:block; width:100%; height:100%; }

  .pan{ position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(9px,1.7vh,17px); background:#0d0d10;
    padding:22px; text-align:center; }
  .pan.ver{ display:flex; }
  .tit{ font-size:clamp(26px,8.4vw,54px); font-weight:900; letter-spacing:.28em;
    margin-left:.28em; }
  .sub{ font-size:max(9.5px,2.6vw); font-weight:700; letter-spacing:.22em; color:#8a8a94;
    text-transform:uppercase; }
  .bot{ appearance:none; border:1.4px solid #45454f; background:transparent; color:#f2efe6;
    font:inherit; font-size:max(12px,3.2vw); font-weight:800; letter-spacing:.16em;
    padding:12px 26px; border-radius:999px; cursor:pointer; text-transform:uppercase; }
  .bot.lleno{ background:#f2efe6; color:#0d0d10; border-color:#f2efe6; }
  .fila{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .rot{ font-size:max(8px,2.2vw); font-weight:900; letter-spacing:.24em; color:#6a6a74;
    text-transform:uppercase; }
  .opB{ font:inherit; font-size:max(9px,2.4vw); font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; padding:7px 13px; border-radius:999px; cursor:pointer;
    color:#9a9aa4; background:transparent; border:1px solid #35353d; }
  .opB.si{ color:#0d0d10; background:var(--beige); border-color:var(--beige); }
  #creditos{ position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-size:8.5px; letter-spacing:.22em; color:#3a3a42; }

  /* ===================== EL HUD ===================== */
  #hud{ position:absolute; inset:0; z-index:20; pointer-events:none; display:none; }
  body.jugando #hud{ display:block; }
  /* el subtitulo: es la voz de el, y va abajo porque arriba esta su cara */
  /* SUBE CUANDO ESTA EL TECLADO. Con los dos a la vez el teclado se comia el globo de dialogo y la
     unica cosa que el juego dice quedaba tapada por el respaldo de la cosa que dice. */
  body.pad #dialogo{ bottom:23% !important; }
  #dialogo{ position:absolute; left:4%; right:4%; bottom:12%; z-index:24;
    background:rgba(10,10,14,.80); border:1.2px solid rgba(201,180,138,.42);
    border-radius:14px; padding:11px 14px; min-height:4.2em;
    font-size:max(12px,3.5vw); font-weight:700; letter-spacing:.03em; line-height:1.55;
    color:#f2efe6; opacity:0; transition:opacity .25s ease; }
  #dialogo.ver{ opacity:1; }
  body.grito #dialogo{ display:none; }
  #dialogo b{ color:var(--verde); }
  #quien{ position:absolute; top:-9px; left:12px; font-size:max(8px,2.2vw); font-weight:900;
    letter-spacing:.20em; color:var(--beige); background:#0d0d10; padding:0 7px;
    text-transform:uppercase; }
  /* el aro de espera: se llena cuando la mano hace lo que hay que hacer */
  /* EL ARO VA AL COSTADO Y NO EN EL MEDIO: en el medio quedaba justo encima del pecho de el, o sea
     tapando lo unico que hay que mirar. A la derecha queda enfrentado al libro, que flota a la
     izquierda. */
  body.pad #aro{ bottom:34% !important; }
  #aro{ position:absolute; right:5%; bottom:26%; z-index:24;
    width:clamp(66px,19vw,104px); aspect-ratio:1; display:none; }
  body.esperando #aro{ display:block; }
  #aro svg{ width:100%; height:100%; transform:rotate(-90deg); }
  #aroN{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:max(20px,7vw); font-weight:900; color:#f2efe6; }
  /* CON FONDO PROPIO. El aro flota sobre la pared del aula, que es beige claro, y este cartel
     estaba en beige sobre beige: en la captura del telefono la cuenta se leia como una marca de
     agua. El texto claro necesita su propio respaldo oscuro, no depender de lo que haya detras. */
  #aroS{ position:absolute; left:-60%; right:-10%; bottom:-22px; text-align:center;
    font-size:max(8.5px,2.3vw); font-weight:800; letter-spacing:.16em; color:#f2efe6;
    text-transform:uppercase; }
  #aroS:not(:empty){ background:rgba(13,13,16,.72); border-radius:8px; padding:3px 0; }
  #libros{ position:absolute; top:12px; left:0; right:0; text-align:center; z-index:23;
    font-size:max(12px,3.6vw); font-weight:900; letter-spacing:.20em;
    text-shadow:0 2px 0 rgba(0,0,0,.6); display:none; }
  body.clase #libros, body.bichos #libros{ display:block; }
  /* EL FOGONAZO DEL GRITO. Va en CSS y no en el shader por una razon de costo: son cero triangulos y
     cero uniformes, y ademas tiene que taparlo TODO —el HUD incluido—, que es justo lo que un
     elemento con z-index alto hace y una pasada de render no. Y va A TIRONES y no en desvanecido:
     un fogonazo que se apaga suave se lee a transicion, y uno que corta se lee a susto. */
  #flash{ position:absolute; inset:0; z-index:46; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 42%, #fff 0%, #f6d5cd 45%, #b5231a 100%); }
  body.grito #flash{ animation:gritoF 1.15s steps(1,end) 1 both; }
  @keyframes gritoF{
    0%{opacity:.96} 7%{opacity:.10} 13%{opacity:.88} 19%{opacity:.06}
    27%{opacity:.62} 36%{opacity:.10} 52%{opacity:.42} 64%{opacity:.08}
    80%{opacity:.26} 100%{opacity:0} }
  /* CON RESPALDO OSCURO. El cartel del medio se dibuja encima de lo que haya, y en el grito lo que
     hay es un sueter verde fluor a noventa centimetros: un texto claro con sombra ahi no se lee. */
  #marca{ position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); z-index:26;
    font-size:max(26px,9vw); font-weight:900; letter-spacing:.16em; opacity:0;
    transition:opacity .2s ease; text-shadow:0 3px 0 rgba(0,0,0,.5);
    background:rgba(13,13,16,.62); padding:6px 18px; border-radius:12px; }
  body.grito #libros{ display:none; }
  #marca.ver{ opacity:1; }
  #salirJ{ position:absolute; top:8px; left:8px; pointer-events:auto; width:32px; height:32px;
    border-radius:50%; border:1.2px solid #45454f; background:rgba(0,0,0,.4); color:#c9c9d2;
    cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
    z-index:25; }

  /* =========================================================================================
     LA CAMARA NO SE VE, PERO SIGUE VIVA
     El usuario la quiere fuera de la pantalla y las manos en 3D ya son el aviso de "te estoy
     viendo", asi que la miniatura no aporta nada y tapaba la esquina.
     PERO NO VA CON display:none NI CON visibility:hidden: un <video> que el compositor considera
     que no se dibuja puede dejar de entregar cuadros, y sin cuadros no hay deteccion — se queda un
     juego que pidio la camara y no ve nada. Queda de 1 px, transparente y fuera de foco: presente
     para el navegador, invisible para el jugador.
     ========================================================================================= */
  #camCaja{ position:absolute; right:0; top:0; width:2px; height:2px; overflow:hidden;
    opacity:0.01; pointer-events:none; z-index:1; }
  #camVid{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #camCv, #camEst{ display:none; }
  /* el numero que leyo CADA mano, al lado de su muneca. Con dos manos el total no alcanza: si dice
     7 y pusiste 4 y 3, hay que poder ver que leyo 4 en una y 3 en la otra. */
  .manoN{ position:absolute; z-index:26; transform:translate(-50%,-50%); display:none;
    font-size:max(17px,5.2vw); font-weight:900; color:#f2efe6; pointer-events:none;
    text-shadow:0 0 6px rgba(13,13,16,.95), 0 2px 0 rgba(13,13,16,.8); }
  body.manos .manoN.ver{ display:block; }

  /* EL TECLADO DE NUMEROS: el respaldo para quien no tiene camara o no quiere darla.
     Un juego que solo se puede abrir con webcam es un juego que la mayoria no puede abrir. */
  #pad{ position:absolute; left:5%; right:5%; bottom:3%; z-index:25; display:none;
    grid-template-columns:repeat(5,1fr); gap:5px; pointer-events:auto; }
  /* SOLO CUANDO HAY ALGO QUE CONTESTAR. Estaba visible toda la partida, asi que en la escena del
     saludo —donde no hay nada que responder— habia diez botones de numeros abajo pidiendo algo que
     el juego no estaba preguntando. Se muestra con la misma condicion que el aro: 'esperando'. */
  body.pad.jugando.esperando #pad{ display:grid; }
  #pad button{ appearance:none; border:1.2px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.42); color:#f2efe6; font:inherit; font-weight:900;
    font-size:max(13px,3.8vw); border-radius:9px; padding:9px 0; cursor:pointer; }
  #pad button:active{ background:#f2efe6; color:#0d0d10; }
  /* POR QUE HAY UN CARTEL DE ESTADO DE CAMARA EN EL MENU.
     Cuando el detector no arranca —permiso negado, sin camara, el CDN caido— el unico aviso era un
     cartel de 2,6 segundos DENTRO del juego, o sea en una pantalla que en ese momento no se estaba
     mirando. Desde afuera el juego simplemente "no usaba la camara" y no habia forma de saber por
     que. El motivo va escrito y se queda puesto. */
  #camAviso{ font-size:max(9.5px,2.6vw); font-weight:800; letter-spacing:.10em; line-height:1.5;
    max-width:92%; min-height:1.2em; text-align:center; color:var(--beige); }
  #camAviso.mal{ color:#e8776d; }
  #camAviso.bien{ color:var(--verde); }
  #idBotones{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
</style>
</head>

  </div>

  <div id="pComo" class="pan">
    <div class="sub" data-i18n="como"></div>
    <div id="comoTxt" style="max-width:94%; line-height:2.0; font-size:max(11px,3.1vw);

    <button class="bot" id="bVolver" data-i18n="volver"></button>
  </div>

  <div id="flash"></div>

  <div id="pMuere" class="pan">

  <div id="pFin" class="pan">

    <button class="bot lleno" id="bFin" data-i18n="volver"></button>
  </div>
</div></div>

   RECREACION DE FAN, NO COMERCIAL Y SIN PUBLICAR del personaje y del colegio de Baldi's Basics
   (Basically Games / mystman12). El modelo 3D esta GENERADO con Higgsfield a partir de la referencia
   que mando el usuario y riggeado automaticamente; las animaciones —saludar, caminar, abrir la
   puerta, explicar— estan escritas a mano sobre ese esqueleto. La escuela sale de un mapa escrito a
   mano. No hay un solo archivo del original.

   LAS TRES DECISIONES QUE MANDAN SOBRE TODO LO DEMAS:
   1. NO SE MUEVE LA CAMARA. No hay joystick, no hay mouse, no hay WASD. La camara va sobre rieles y
      gira sola hacia donde va. El jugador tiene UNA cosa que hacer con las manos, y si esa misma
      mano tuviera que manejar la camara, las dos cosas se pelearian: mover la mano para girar y
      mover la mano para contar son el mismo gesto.
   2. VERTICAL. El telefono queda parado y la mano entra completa en el cuadro; acostado, la mano
      tapa media pantalla. La camara que se usa es la TRASERA: el telefono queda apoyado y las manos
      se mueven del otro lado, con mas espacio y mejor luz que apuntandose a uno mismo.
   3. SE CONTESTA CON LOS DEDOS. Cuatro mas cuatro son ocho dedos, o sea las dos manos. Es la unica
      forma de que la cuenta se sienta con el cuerpo y no con un teclado.
   ========================================================================================= */

/* ===================== EL MAPA DE LA ESCUELA =====================
   NO ES UN LABERINTO GENERADO, ES UNA ESCUELA ESCRITA A MANO, y la diferencia es todo el punto: un
   laberinto se recorre a ciegas, una escuela se APRENDE — tres pasillos horizontales, tres
   verticales y ocho aulas colgadas de ellos. A la segunda partida el jugador ya sabe que el aula del
   fondo a la izquierda es la que tiene dos puertas, y eso es exactamente lo que hace que huir sea
   una decision y no una tirada.

   Las aulas se declaran como rectangulos y los pasillos se tallan alrededor. Se declara la
   GEOMETRIA, no el resultado: asi la puerta de cada aula se calcula y no se dibuja a mano, y no
   puede quedar una sin salida. */
/* =========================================================================================
   LAS VELOCIDADES Y EL RITMO DE LA CAMINATA, JUNTOS Y DERIVADO UNO DEL OTRO

   Van aca —el primer archivo— y no donde se usan, por una razon concreta: el ciclo de la caminata se
   evalua en la tabla de animaciones (e2.js) y las velocidades se usan en el guion (i2.js), que va
   despues. Con las velocidades declaradas en i2.js, e2.js las leeria antes de su linea y un `const`
   leido antes de existir no rompe una funcion: rompe el modulo entero.

   Y EL RITMO SE CALCULA, no se elige. Estuvo en t*2,0 —un paso cada 1,57 s— mientras el riel lo movia
   a 3,4 m/s: eso son 2,7 metros por paso, o sea los pies arrastrando mientras el cuerpo avanza. El
   patinaje clasico. Con una zancada de 1,15 m el ciclo sale de la division, y si algun dia cambia la
   velocidad el ciclo la sigue solo.
   ========================================================================================= */
const VEL_CAM=2.6, VEL_PROFE=3.0;
const ZANCADA=1.15;                                       // metros por paso
const CAMINA_W=2*Math.PI*VEL_PROFE/(2*ZANCADA);           // rad/s del ciclo (dos pasos por ciclo)

const CEL=4.2, ALTO_M=3.6, GRUESO=0.30;
const GW=23, GH=19;                      // celdas
const PAS_F=[1,9,17], PAS_C=[1,11,21];   // pasillos: filas y columnas
/* LAS AULAS DEJAN UN ANILLO DE PARED, y esto lo encontro la propia prueba del mapa. La primera
   version las pegaba directo a los pasillos —filas 2..8 contra el pasillo de la fila 1— y entonces
   NO HABIA DONDE PONER LA PUERTA, porque no quedaba ni una celda de pared entre el aula y el
   pasillo. El gancho lo canto en dos numeros: `puertasPorAula:[0,0,0,0,0,0,0,0]` y las ocho aulas
   alcanzables SIN abrir nada. Un aula sin puerta no es un aula, es un ensanchamiento del pasillo, y
   eso no se ve en una foto del pasillo.
   Con los pasillos en las filas 1, 9 y 17 y en las columnas 1, 11 y 21, el interior de cada aula va
   de la fila 3 a la 7 (o de la 11 a la 15) y mide tres columnas: las filas 2, 8, 10 y 16 y las
   columnas 2, 6, 10, 12, 16 y 20 quedan de pared, que es donde se abren las puertas. */
const AULAS=[
  {i0:3, i1:5,  j0:3,  j1:7,  n:1}, {i0:7, i1:9,  j0:3,  j1:7,  n:2},
  {i0:13,i1:15, j0:3,  j1:7,  n:3}, {i0:17,i1:19, j0:3,  j1:7,  n:4},
  {i0:3, i1:5,  j0:11, j1:15, n:5}, {i0:7, i1:9,  j0:11, j1:15, n:6},
  {i0:13,i1:15, j0:11, j1:15, n:7}, {i0:17,i1:19, j0:11, j1:15, n:8}
];
const LIBRETAS_N=AULAS.length;
/* 0 = pared, 1 = pasillo, 2 = aula, 3 = puerta */
const MAPA=[];
for(let j=0;j<GH;j++){ MAPA.push([]); for(let i=0;i<GW;i++) MAPA[j].push(0); }
for(const f of PAS_F) for(let i=1;i<=21;i++) MAPA[f][i]=1;
for(const c of PAS_C) for(let j=1;j<=17;j++) MAPA[j][c]=1;
for(const a of AULAS) for(let j=a.j0;j<=a.j1;j++) for(let i=a.i0;i<=a.i1;i++) MAPA[j][i]=2;
/* LA PUERTA DE CADA AULA SE CALCULA: la celda del borde del aula que toca un pasillo. Dibujarlas a
   mano en un mapa de 23x19 es la forma mas rapida de que una quede tapiada y el nivel sea
   imposible sin que nadie se entere hasta jugarlo. */
const PUERTAS=[];
for(const a of AULAS){
  const im=Math.round((a.i0+a.i1)/2), jm=Math.round((a.j0+a.j1)/2);
  /* LA PARED DEL FONDO NO ES CANDIDATA A PUERTA, y esto aparecio al amueblar las ocho aulas:
     el pizarron va en la pared de enfrente de la puerta principal —la del fondo— y mide 2,5 celdas
     de ancho sobre un aula de 3, o sea que la tapa entera. Las aulas 3 y 6, que llevan dos puertas,
     tenian la segunda justo ahi: un pizarron con una puerta atras. Sacando (im, j1+1) de la lista,
     la segunda puerta cae en una pared LATERAL —la 3 en (12,5) y la 6 en (10,13), las dos contra el
     pasillo de la columna 11— y el fondo queda libre por construccion. */
  const cand=[[im,a.j0-1],[a.i0-1,jm],[a.i1+1,jm]];
  let puesta=0;
  for(const [i,j] of cand){
    if(i<0||j<0||i>=GW||j>=GH) continue;
    const vecinos=[[i,j-1],[i,j+1],[i-1,j],[i+1,j]];
    const tocaPas=vecinos.some(([x,y])=>x>=0&&y>=0&&x<GW&&y<GH&&MAPA[y][x]===1);
    const tocaAula=vecinos.some(([x,y])=>x>=0&&y>=0&&x<GW&&y<GH&&MAPA[y][x]===2);
    if(MAPA[j][i]===0 && tocaPas && tocaAula){
      MAPA[j][i]=3;
      PUERTAS.push({ i, j, aula:a.n, abierta:false, ang:0 });
      if(++puesta>=(a.n%3===0?2:1)) break;   // un tercio de las aulas tiene dos puertas
    }
  }
  a.puertas=puesta;
}
/* las dos salidas, al este y al oeste del pasillo del medio */
const SALIDAS=[{i:0,j:9},{i:22,j:9}];
for(const s of SALIDAS) MAPA[s.j][s.i]=3;
for(const s of SALIDAS) PUERTAS.push({ i:s.i, j:s.j, aula:0, abierta:false, ang:0, salida:true });

function XC(i){ return (i-(GW-1)/2)*CEL; }
function ZC(j){ return (j-(GH-1)/2)*CEL; }
function celda(x,z){ return [Math.round(x/CEL+(GW-1)/2), Math.round(z/CEL+(GH-1)/2)]; }
function pisable(i,j){
  if(i<0||j<0||i>=GW||j>=GH) return false;
  const c=MAPA[j][i];
  if(c===1||c===2) return true;
  if(c===3){ const p=PUERTAS.find(q=>q.i===i&&q.j===j); return !!(p&&p.abierta); }
  return false;
}
/* EL PROFESOR ABRE LAS PUERTAS, ASI QUE PARA EL TODAS ESTAN ABIERTAS.
   Con una sola funcion de "se pisa" para los dos pasaba esto, y lo encontro la prueba: el profesor
   arranca DENTRO del aula 8 con la puerta cerrada, o sea que el BFS desde el jugador no llegaba
   hasta el, `rumbo` devolvia null, y el pobre caminaba en linea recta contra la pared de su propia
   aula. La distancia al jugador bajaba 6,9 m en tres segundos y despues 2,2 m en cuatro: estaba
   raspando una pared. Un perseguidor encerrado no es una amenaza, es un adorno. */
function pisableProf(i,j){
  if(i<0||j<0||i>=GW||j>=GH) return false;
  const c=MAPA[j][i];
  return c===1||c===2||c===3;
}

/* ===================== LAS TEXTURAS, DIBUJADAS AL CARGAR =====================
   Ni un archivo de imagen. Cada textura es un lienzo de 64 o 128 px pintado por codigo y repetido:
   la baldosa del piso, el panel de la pared con su zocalo, la chapa del locker y la madera de la
   puerta. Cuatro texturas de 64x64 pesan menos que un favicon y se ven exactamente como tienen que
   verse, porque el original tambien son cuatro texturas chicas repetidas hasta el infinito. */
function tex(w,h,pinta,repX,repY,filtro){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  pinta(c.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repX||1, repY||1);
  /* NEAREST a proposito: el juego que rehacemos se ve a bloques y suavizar las baldosas le saca
     justamente eso. Y con mipmaps, porque sin ellos el piso de un pasillo largo titila. */
  t.magFilter = filtro===false? THREE.LinearFilter : THREE.NearestFilter;
  t.minFilter=THREE.LinearMipmapLinearFilter;
  t.generateMipmaps=true;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const T_PISO=tex(64,64,(g,w,h)=>{
  g.fillStyle='#d9d5c8'; g.fillRect(0,0,w,h);
  g.fillStyle='#cfcabb'; g.fillRect(0,0,w/2,h/2); g.fillRect(w/2,h/2,w/2,h/2);
  g.strokeStyle='rgba(120,116,105,0.55)'; g.lineWidth=1.5;
  g.strokeRect(0.5,0.5,w-1,h-1); g.beginPath();
  g.moveTo(w/2,0); g.lineTo(w/2,h); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  /* dos manchitas por baldosa: sin ellas un pasillo de veinte metros se ve como un solo plano */
  g.fillStyle='rgba(120,116,105,0.16)';
  g.fillRect(9,13,4,3); g.fillRect(44,38,5,3);
}, 1, 1);
const T_PARED=tex(64,128,(g,w,h)=>{
  g.fillStyle='#c9b48a'; g.fillRect(0,0,w,h);
  g.fillStyle='#bda87e'; g.fillRect(0,0,w,h*0.06);
  g.fillStyle='#8f7c55'; g.fillRect(0,h*0.86,w,h*0.14);      // el zocalo
  g.fillStyle='#a08b60'; g.fillRect(0,h*0.86,w,2);
  g.strokeStyle='rgba(120,102,68,0.40)'; g.lineWidth=1;
  for(let x=0;x<=w;x+=w/2){ g.beginPath(); g.moveTo(x+0.5,0); g.lineTo(x+0.5,h*0.86); g.stroke(); }
  g.fillStyle='rgba(255,255,255,0.05)'; g.fillRect(0,h*0.10,w,h*0.02);
}, 1, 1);
const T_TECHO=tex(32,32,(g,w,h)=>{
  g.fillStyle='#eceade'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(150,148,138,0.45)'; g.lineWidth=1; g.strokeRect(0.5,0.5,w-1,h-1);
}, 1, 1);
const T_LOCKER=tex(64,128,(g,w,h)=>{
  g.fillStyle='#c0392b'; g.fillRect(0,0,w,h);
  g.fillStyle='#9c2c20'; g.fillRect(0,0,2,h); g.fillRect(w-2,0,2,h);

  g.fillStyle='rgba(255,255,255,0.10)'; g.fillRect(4,4,w-8,3);
  /* las rejillas y la manija, que es lo que lo vuelve un locker y no una caja roja */
  g.fillStyle='#7e2318';
  for(let k=0;k<4;k++){ g.fillRect(w*0.24, h*0.09+k*4, w*0.52, 2);
                        g.fillRect(w*0.24, h*0.59+k*4, w*0.52, 2); }
  g.fillStyle='#e2e2e2'; g.fillRect(w*0.78, h*0.30, 4, 8); g.fillRect(w*0.78, h*0.80, 4, 8);
}, 1, 1);
const T_PUERTA=tex(64,128,(g,w,h)=>{
  g.fillStyle='#b98d54'; g.fillRect(0,0,w,h);
  g.fillStyle='#a87c46'; g.fillRect(0,0,3,h); g.fillRect(w-3,0,3,h);
  g.fillStyle='#cfa269'; g.fillRect(w*0.14,h*0.08,w*0.72,h*0.30);   // el vidrio
  g.fillStyle='#8ea9b8'; g.fillRect(w*0.18,h*0.11,w*0.64,h*0.24);
  g.fillStyle='rgba(255,255,255,0.18)'; g.fillRect(w*0.20,h*0.13,w*0.24,h*0.08);
  g.fillStyle='#e6c98d'; g.beginPath(); g.arc(w*0.80,h*0.56,3.4,0,7); g.fill();
  g.fillStyle='#8f6a3c'; g.fillRect(w*0.14,h*0.66,w*0.72,2);
}, 1, 1);

/* EL TECHO VA SIN LUZ, y no es un atajo: con Lambert la cara del techo apunta HACIA ABAJO, o sea
   que recibe el color de suelo de la hemisferica —un gris verdoso oscuro— y el pasillo quedaba con

/* ===================== LAS LUCES =====================

const luzA=new THREE.HemisphereLight(0xfff6e2, 0x5a5f55, 1.85); escena.add(luzA);

/* ===================== ARMAR LA ESCUELA EN CUATRO MALLAS =====================
   23x19 celdas son unas cuatrocientas paredes. Sueltas serian cuatrocientas llamadas de dibujo;
   fundidas por MATERIAL son cuatro. Y se funden por material y no todas juntas porque el piso, la
   pared, el techo y los lockers usan texturas distintas: fundir dos materiales en una malla obliga
   a un atlas, y un atlas para cuatro texturas de 64 px es trabajo para no ganar nada. */
function armarEscuela(){
  const paredes=[], pisos=[], techos=[], lockers=[];
  const caja=(lista,w,h,d,x,y,z,uv)=>{
    const g=new THREE.BoxGeometry(w,h,d);
    if(uv){ const a=g.attributes.uv.array; for(let k=0;k<a.length;k+=2){ a[k]*=uv[0]; a[k+1]*=uv[1]; } }
    g.translate(x,y,z); lista.push(g);
  };
  for(let j=0;j<GH;j++) for(let i=0;i<GW;i++){
    const c=MAPA[j][i], x=XC(i), z=ZC(j);
    if(c===0){
      /* solo se construye la pared si toca algo pisable: una pared entre dos paredes no se ve
         nunca y son doce triangulos que el aparato dibuja para nadie */
      const toca=[[i,j-1],[i,j+1],[i-1,j],[i+1,j]].some(([a,b])=>
        a>=0&&b>=0&&a<GW&&b<GH&&(MAPA[b][a]===1||MAPA[b][a]===2||MAPA[b][a]===3));
      if(toca) caja(paredes, CEL, ALTO_M, CEL, x, ALTO_M/2, z, [CEL/2.2, ALTO_M/2.4]);
      continue;
    }
    caja(pisos, CEL, 0.16, CEL, x, -0.08, z, [CEL/2.1, CEL/2.1]);
    caja(techos, CEL, 0.16, CEL, x, ALTO_M+0.08, z, [CEL/2.1, CEL/2.1]);
  }
  /* LOS LOCKERS VAN CONTRA LAS PAREDES DE PASILLO Y NO EN LAS AULAS, que es donde estan en una
     escuela. Se buscan las celdas de pasillo que tienen pared al lado y se pega una fila. */
  if(CAL[calidad].lockers) for(let j=0;j<GH;j++) for(let i=0;i<GW;i++){
    if(MAPA[j][i]!==1) continue;
    const lados=[[0,-1,0,0],[0,1,Math.PI,0],[-1,0,0,1],[1,0,0,1]];
    for(const [di,dj,rot,vert] of lados){
      const a=i+di, b=j+dj;
      if(a<0||b<0||a>=GW||b>=GH||MAPA[b][a]!==0) continue;
      if(((i*7+j*13+di*3+dj*5)%3)!==0) continue;         // no en todas, se ve mejor
      const w = vert? 0.32 : CEL*0.78, d = vert? CEL*0.78 : 0.32;
      const x=XC(i)+di*(CEL/2-0.20), z=ZC(j)+dj*(CEL/2-0.20);
      caja(lockers, w, 2.10, d, x, 1.05, z, [vert? d/1.1 : w/1.1, 1.4]);
    }
  }
  const juntar=(lista, mat)=>{
    if(!lista.length) return null;
    const g=mergeGeometries(lista,false);
    for(const q of lista) q.dispose();
    const m=new THREE.Mesh(g, mat); m.frustumCulled=false; escena.add(m); return m;
  };
  return { paredes:juntar(paredes,M_PARED), pisos:juntar(pisos,M_PISO),
           techos:juntar(techos,M_TECHO), lockers:juntar(lockers,M_LOCKER) };
}
const escuela=armarEscuela();

/* ---------- LAS PUERTAS, SUELTAS PORQUE SE ABREN ----------
   Cada una gira sobre su marco. Van sueltas y con su propio material: es lo unico del edificio que
   se mueve, y fundirlas con la pared las dejaria clavadas para siempre. */
const puertaGeo=new THREE.BoxGeometry(CEL*0.92, ALTO_M*0.86, 0.14);
{ const a=puertaGeo.attributes.uv.array; for(let k=0;k<a.length;k+=2){ a[k]*=1; a[k+1]*=1; } }
puertaGeo.translate(CEL*0.46, 0, 0);            // la bisagra en el borde
for(const p of PUERTAS){
  const g=new THREE.Group();
  const m=new THREE.Mesh(puertaGeo, p.salida? new THREE.MeshLambertMaterial({map:T_PUERTA, color:0x9fd08f}) : M_PUERTA);
  g.add(m);
  /* la puerta se orienta segun por donde se pasa: si los vecinos pisables estan en Z, la hoja va en X */
  const vertical = (pisable(p.i,p.j-1)||pisable(p.i,p.j+1)) &&
                   !(pisable(p.i-1,p.j)||pisable(p.i+1,p.j));
  g.position.set(XC(p.i) - CEL*0.46*(vertical?1:0), ALTO_M*0.43, ZC(p.j) - CEL*0.46*(vertical?0:1));
  if(!vertical){ g.rotation.y=Math.PI/2; g.position.set(XC(p.i), ALTO_M*0.43, ZC(p.j) - CEL*0.46); }
  else { g.position.set(XC(p.i) - CEL*0.46, ALTO_M*0.43, ZC(p.j)); }
  p.g=g; p.vertical=vertical; escena.add(g);
}
/* TAPA POR FUERA DE CADA SALIDA. La celda de una salida es puerta, asi que el constructor de
   paredes no levanta pared ahi, y del otro lado de la reja del mapa NO HAY NADA. Mirando el pasillo
   del medio de punta a punta se veia un agujero negro al fondo: medido en una captura de 790x1400,
   unos 90 px de lado a 42 m de distancia, o sea los 4,2 m enteros de la celda. Eso era el vacio de
   afuera de la escuela, visible por arriba y por los costados de la hoja —que mide 0,92 de celda de
   ancho y 0,86 de alto—. Dos paneles pegados por fuera y el pasillo vuelve a terminar en algo. */
for(const p of PUERTAS){
  if(!p.salida) continue;
  const fuera=(p.i===0)? -1 : 1;
  const tapa=new THREE.Mesh(new THREE.BoxGeometry(CEL*0.5, ALTO_M, CEL), M_PARED);
  tapa.position.set(XC(p.i)+fuera*CEL*0.62, ALTO_M/2, ZC(p.j));
  escena.add(tapa);
}

/* ---------- LOS PUPITRES DE ADORNO ----------
   Un aula vacia con una libreta en el medio se lee a deposito. Cuatro pupitres alcanzan. */
{
  const gs=[];
  for(const a of AULAS){
    for(let k=0;k<4;k++){
      const i=a.i0 + ((k%2)? (a.i1-a.i0) : 0), j=a.j0 + ((k<2)? 1 : (a.j1-a.j0-1));
      const g1=new THREE.BoxGeometry(1.0,0.08,0.66); g1.translate(XC(i), 0.78, ZC(j)); gs.push(g1);
      const g2=new THREE.BoxGeometry(1.0,0.50,0.07); g2.translate(XC(i), 0.50, ZC(j)+0.30); gs.push(g2);
    }
  }
  const g=mergeGeometries(gs,false); for(const q of gs) q.dispose();
  const m=new THREE.Mesh(g, new THREE.MeshLambertMaterial({color:0xa9753f}));
  m.frustumCulled=false; escena.add(m);
}

/* =========================================================================================
   EL AULA DE LA CLASE
   Una sola aula amueblada de verdad: pizarron en la pared del fondo, escritorio en el medio, y
   ocho libros que flotan a un costado. Las otras siete quedan con sus pupitres y nada mas — el
   juego pasa entero en esta, asi que amueblar las ocho seria trabajo que nadie va a ver.
   ========================================================================================= */

/* el pizarron: un verde oscuro con marco de madera y tiza. Va contra la pared del fondo. */
const T_PIZA=tex(256,128,(g,w,h)=>{
  g.fillStyle='#2f4f3a'; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,0.05)';
  for(let k=0;k<40;k++){ const x=Math.random()*w, y=Math.random()*h;
    g.fillRect(x,y, 8+Math.random()*30, 1); }
  g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,h*0.5); g.lineTo(w,h*0.5); g.stroke();
}, 1, 1, false);

/* =========================================================================================
   LAS OCHO AULAS AMUEBLADAS, Y CADA UNA CON SU SITIO CALCULADO

   Antes habia UNA aula amueblada a mano con numeros escritos: pizarron en z=27,47, escritorio en
   23,6, el en 25,2 y la camara en 22,85. Con ocho aulas eso serian cuarenta numeros a mano, y el
   primero que se escriba mal deja un pizarron dentro de una pared sin que nadie se entere hasta
   llegar a ese salon. Asi que el sitio de cada aula SE CALCULA a partir de su rectangulo:

     pared del fondo = la fila j1+1, que es pared por construccion y —desde que la puerta principal
                       va siempre en j0-1— nunca tiene puerta;
     el              = la ultima fila del aula (j1);
     el escritorio   = 1,6 m delante de el;
     la camara       = 2,35 m delante de el, que es la distancia medida donde ocupa el 51,9% del
                       alto del marco en un telefono;
     el libro        = 0,6 m delante de el y 0,55 a un costado.

   Y TODO EL MOBILIARIO VA FUNDIDO. Ocho pizarrones y ocho escritorios sueltos son 56 mallas, o sea
   56 llamadas de dibujo sobre un juego que venia usando UNA para la escuela entera. Fundido por
   material son tres: las pizarras, la madera clara y la madera oscura.
   ========================================================================================= */
const M_MAD1=new THREE.MeshLambertMaterial({color:0x8f6a3c});
const M_MAD2=new THREE.MeshLambertMaterial({color:0x7d5c34});
const AULA_SITIO={};
{
  const pizas=[], mad1=[], mad2=[];
  const caja=(lista,w,h,d,x,y,z)=>{ const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); lista.push(g); };
  for(const a of AULAS){
    const xC=XC(Math.round((a.i0+a.i1)/2));
    /* EL PIZARRON VA DELANTE DE LA CARA DE LA PARED, NO ADENTRO.
       Esto estuvo mal desde que existe el aula y no se vio nunca por una casualidad. La formula era
       ZC(j1+1) - CEL/2 + GRUESO/2 + 0.02, o sea 17 cm PASADA la cara interior de la pared — y una
       pared es un cubo de celda entera, no un panel de GRUESO de espesor. El pizarron quedaba
       enterrado y la pared lo tapaba.
       Por que no se noto: la unica aula amueblada era la 6, y la 6 tenia su segunda puerta justo en
       esa celda del fondo. Donde hay puerta el constructor no levanta pared, asi que el pizarron se
       veia POR EL AGUJERO. Al mover las segundas puertas a las paredes laterales —para que no
       quedaran detras del pizarron— la pared del fondo se cerro en las ocho aulas y el defecto salio
       a la luz en las ocho a la vez.
       Ahora la cara interior de la pared es F y todo se cuelga hacia adelante de ella: el marco
       apoyado (F-0,10 a F), la pizarra 1,5 cm delante del marco y la bandeja de la tiza sobresaliendo,
       que es lo que hace una bandeja. */
    const F=ZC(a.j1+1)-CEL/2;
    const zPiza=F-0.115;
    const zProfe=ZC(a.j1);
    const zEsc=zProfe-1.60;
    const zCam=zProfe-2.35;
    AULA_SITIO[a.n]={ n:a.n, x:xC, i:Math.round((a.i0+a.i1)/2), zPiza, zProfe, zEsc, zCam,
                      jCam:zCam/CEL+(GH-1)/2, jm:Math.round((a.j0+a.j1)/2), j0:a.j0, j1:a.j1 };
    /* EL MARCO VA DETRAS DE LA PIZARRA Y NO DELANTE, y esto se vio en una foto: el marco estaba a
       zP-0,03 y la pizarra a zP+0,03, o sea que desde la camara —que esta a menor Z— el marco tapaba
       la pizarra entera y el aula tenia un rectangulo de madera en la pared. Tres centimetros. */
    caja(mad1, CEL*2.5+0.34, 2.02, 0.10, xC, 1.90, F-0.05);
    caja(mad1, CEL*2.5, 0.07, 0.16, xC, 0.94, F-0.14);           // la bandeja de la tiza
    /* la pizarra: un plano, y el material va a DOS CARAS — un PlaneGeometry mira a su +Z y girarlo
       con FrontSide lo deja invisible desde este lado. Con DoubleSide no hay lado equivocado. */
    const pl=new THREE.PlaneGeometry(CEL*2.5, 1.86);
    pl.translate(xC, 1.90, zPiza); pizas.push(pl);
    /* EL ESCRITORIO. El se para DEL OTRO LADO, entre el escritorio y el pizarron: es la posicion de
       un maestro y ademas pone una mesa entre el jugador y el, que es lo que hace que la escena se
       lea a clase y no a persecucion. */
    caja(mad1, 2.60, 0.11, 1.10, xC, 0.86, zEsc);
    caja(mad2, 2.60, 0.74, 0.09, xC, 0.45, zEsc-0.50);
    for(const sx of [-1,1]) caja(mad2, 0.09, 0.74, 1.10, xC+sx*1.25, 0.45, zEsc);
  }
  const juntar=(lista, mat)=>{
    if(!lista.length) return null;
    const g=mergeGeometries(lista,false);
    for(const q of lista) q.dispose();
    const m=new THREE.Mesh(g, mat); m.frustumCulled=false; escena.add(m); return m;
  };
  juntar(pizas, new THREE.MeshLambertMaterial({map:T_PIZA, side:THREE.DoubleSide}));
  juntar(mad1, M_MAD1);
  juntar(mad2, M_MAD2);
}
const AULA_CLASE=AULAS[0];
const CLASE_I=AULA_SITIO[1].i, CLASE_J=AULA_SITIO[1].jm;
const CLASE_X=AULA_SITIO[1].x, CLASE_Z=ZC(CLASE_J);

/* ---------- LOS OCHO LIBROS ----------
   Flotan a un costado, girando despacio. El de turno se pone al frente, grande, y en su tapa se
   dibuja la cuenta: la cuenta va en una TEXTURA y no en HTML porque tiene que estar en el mundo —
   pegada al libro, girando con el— y porque asi no hay que traducir un numero. */
/* UN SOLO LIBRO Y NO OCHO. Antes habia un libro por cuenta y las ocho cuentas eran de la misma
   aula, asi que ocho grupos de tres mallas dormidos esperando su turno. Ahora hay un libro por
   AULA —eso pidio el usuario— y las tres cuentas del aula se dibujan sobre la misma tapa: un libro
   que cambia de pagina es exactamente lo que hace un libro. */
const CUENTAS_AULA=3;
const LIBROS_N=1;
const LIBROS=[];
function texCuenta(txt){
  return tex(256,256,(g,w,h)=>{
    g.fillStyle='#f2efe6'; g.fillRect(0,0,w,h);
    g.strokeStyle='#c0392b'; g.lineWidth=6; g.strokeRect(12,12,w-24,h-24);
    g.fillStyle='#1b1b1f'; g.textAlign='center'; g.textBaseline='middle';
    const f = txt.length>5? 62 : 82;
    g.font='900 '+f+'px ui-sans-serif,system-ui,Arial';
    g.fillText(txt, w/2, h*0.46);
    g.font='900 30px ui-sans-serif,system-ui,Arial';
    g.fillStyle='#c0392b'; g.fillText('= ?', w/2, h*0.76);
  }, 1, 1, false);
}
const M_TAPA=new THREE.MeshLambertMaterial({color:0x2b6cd4});
const M_HOJAS=new THREE.MeshLambertMaterial({color:0xf2efe6});
for(let k=0;k<LIBROS_N;k++){
  const g=new THREE.Group();
  const tapa=new THREE.Mesh(new THREE.BoxGeometry(0.50,0.66,0.07), M_TAPA);
  const hojas=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.61,0.06), M_HOJAS);
  hojas.position.z=0.03;
  const cara=new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.60),
                            new THREE.MeshLambertMaterial({color:0xffffff}));
  cara.position.z=0.075;
  g.add(tapa); g.add(hojas); g.add(cara);
  g.visible=false;
  escena.add(g);
  LIBROS.push({ g, cara, hecho:false, giro:k*0.7 });
}

/* =========================================================================================
   LOS BICHOS DEL PASILLO
   La actividad de en medio: entre un aula y la siguiente aparecen bichos flotando y hay que
   reventarlos haciendo PINZA con la mano encima de cada uno (o tocandolos, si no hay camara).

   POR QUE VAN INSTANCIADOS. Un bicho creible son nueve piezas —cuerpo, cabeza, seis patas, dos
   antenas, dos ojos—; seis bichos sueltos serian cincuenta y cuatro mallas, o sea cincuenta y cuatro
   llamadas de dibujo en un juego que dibuja la escuela entera con una. Fundido, un bicho es UNA
   geometria, y seis bichos son UN InstancedMesh: dos llamadas en total contando los ojos, haya uno
   o haya seis. Reventar un bicho es ponerle la escala en cero, no borrar nada.

   Y LOS OJOS VAN EN OTRA MALLA A PROPOSITO: son lo unico del bicho que tiene que verse a oscuras y
   de lejos —es el aviso de "hay algo ahi"— asi que van con material propio, sin luz. Con el mismo
   material que el cuerpo un bicho a cuatro metros es una mancha marron y no se sabe para donde mira.
   ========================================================================================= */
const BICHOS_MAX=6, ESQ_MAX=54;
const bichoGeo=(()=>{
  const ps=[];
  const cuerpo=new THREE.IcosahedronGeometry(0.17,0);
  cuerpo.scale(1.05,0.78,1.25); ps.push(cuerpo);
  const cab=new THREE.SphereGeometry(0.105,8,6); cab.translate(0,0.02,0.20); ps.push(cab);
  for(const sx of [-1,1]) for(const [dz,ang] of [[0.10,0.5],[-0.02,0.0],[-0.14,-0.5]]){
    const p=new THREE.BoxGeometry(0.022,0.022,0.26);
    p.rotateX(Math.PI/2.6); p.rotateY(sx*(1.15+ang));
    p.translate(sx*0.13, -0.06, dz); ps.push(p);
  }
  for(const sx of [-1,1]){
    const an=new THREE.BoxGeometry(0.016,0.15,0.016);
    an.rotateZ(sx*0.42); an.rotateX(-0.30);
    an.translate(sx*0.055, 0.13, 0.20); ps.push(an);
  }
  /* TODAS SIN INDICE ANTES DE FUNDIR. IcosahedronGeometry viene NO indexada y BoxGeometry y
     SphereGeometry vienen indexadas, y mergeGeometries no acepta la mezcla: tira "make sure index
     attribute exists among all geometries, or in none of them" y devuelve null, o sea que el bicho
     se quedaba sin geometria y no se dibujaba nada. Se lleva todo al mismo lado y no al otro porque
     desindexar es una operacion que siempre existe; reindexar hay que calcularla. */
  const pl=ps.map(p=>p.index? p.toNonIndexed() : p);
  const g=mergeGeometries(pl,false);
  for(const p of ps) p.dispose();
  return g;
})();
const ojosGeo=(()=>{
  const ps=[];
  for(const sx of [-1,1]){ const o=new THREE.SphereGeometry(0.040,7,5);
    o.translate(sx*0.050, 0.055, 0.275); ps.push(o); }
  const g=mergeGeometries(ps,false); for(const p of ps) p.dispose(); return g;
})();
const bichoMalla=new THREE.InstancedMesh(bichoGeo, new THREE.MeshLambertMaterial({color:0x2a2118}), BICHOS_MAX);
const bichoOjos=new THREE.InstancedMesh(ojosGeo, new THREE.MeshBasicMaterial({color:0xff3a1e}), BICHOS_MAX);
for(const m of [bichoMalla, bichoOjos]){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled=false; m.visible=false; escena.add(m);
}
const esqGeo=new THREE.TetrahedronGeometry(0.062,0);
const esqMalla=new THREE.InstancedMesh(esqGeo, new THREE.MeshLambertMaterial({color:0x6f3a1c}), ESQ_MAX);
esqMalla.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
esqMalla.frustumCulled=false; esqMalla.visible=false; escena.add(esqMalla);

/* =========================================================================================
   LAS OTRAS DOS ACTIVIDADES DE PASILLO

   Los bichos solos se gastan: siete tandas de lo mismo es una tanda repetida siete veces. Se agregan
   dos que piden algo DISTINTO de la mano, y eso es el criterio, no la variedad decorativa:

   - BICHOS: vienen hacia vos. Lo que se entrena es APUNTAR a un blanco que se mueve.
   - TIZAS: caen. Lo que se entrena es el TIEMPO — hay que llegar antes de que toquen el piso, y no
     importa que la tiza este quieta en x.
   - CASILLEROS: uno de los ocho tiembla. Lo que se entrena es ELEGIR: los ocho estan a la misma
     distancia y hay que pinzar el correcto, no el mas cercano.

   Las tres se juegan con la misma pinza y ninguna necesita un boton nuevo.
   ========================================================================================= */
const TIZAS_MAX=7;
const tizaGeo=(()=>{
  /* una tiza: un cilindro corto y gordo, con la punta gastada de un lado */
  const ps=[];
  /* 4,5 cm DE RADIO Y NO 3: una tiza de verdad mide 1 cm, pero a tres metros eso son OCHO PIXELES en
     un marco de 790 y con el filtro de baja calidad puesto desaparece. Es el mismo criterio que el
     radio del blanco: lo que tiene que costar es llegar a tiempo, no distinguir el objeto. */
  const c=new THREE.CylinderGeometry(0.045,0.045,0.26,9,1,false); ps.push(c);
  const p=new THREE.ConeGeometry(0.045,0.06,9); p.rotateX(Math.PI); p.translate(0,0.16,0); ps.push(p);
  /* la faja de papel del medio, que es lo que la hace leer a tiza y no a palito */
  const f=new THREE.CylinderGeometry(0.048,0.048,0.07,9,1,false); f.translate(0,-0.02,0); ps.push(f);
  const pl=ps.map(g=>g.index? g.toNonIndexed() : g);
  const g=mergeGeometries(pl,false); for(const q of ps) q.dispose(); return g;
})();
const tizaMalla=new THREE.InstancedMesh(tizaGeo,
  /* emissive bajo: la tiza cae en un pasillo beige y contra el piso beige un blanco mate se pierde.
     Con un pelo de emision se lee como algo que cae aunque este a contraluz. */
  new THREE.MeshLambertMaterial({color:0xfdfaf0, emissive:0x2a2620}), TIZAS_MAX);
tizaMalla.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
tizaMalla.frustumCulled=false; tizaMalla.visible=false; escena.add(tizaMalla);

/* LOS CASILLEROS DE LA ACTIVIDAD son propios y no los del pasillo: los del pasillo estan fundidos en
   una malla con toda la escuela y no se pueden mover ni sacudir. Estos son ocho, instanciados, y se
   ponen delante del jugador cuando toca. */
/* CINCO Y NO OCHO, Y MAS LEJOS. Con ocho de 0,62 m cada 0,66 m el abanico medía 5,3 metros de ancho
   puesto a 3 m de la camara, donde solo entran 3,4: en pantalla no eran ocho casilleros, era UNA
   PARED ROJA de lado a lado tapando el pasillo — y encima 5,3 m no caben en un pasillo de 4,2. Cinco
   cada 0,76 m son 3,8 m de abanico a 4,4 de distancia: entran en el pasillo, entran en el cuadro con
   margen, y se ven separados, que es lo unico que hace que se puedan elegir de a uno. */
const CASILL_N=5;
const casillGeo=new THREE.BoxGeometry(0.56, 1.55, 0.30);
const casillMalla=new THREE.InstancedMesh(casillGeo,
  new THREE.MeshLambertMaterial({color:0xb2392c}), CASILL_N);
casillMalla.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
casillMalla.frustumCulled=false; casillMalla.visible=false; escena.add(casillMalla);
casillMalla.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(CASILL_N*3), 3);
casillMalla.instanceColor.setUsage(THREE.DynamicDrawUsage);

/* =========================================================================================
   EL PROFESOR
   Modelado por codigo copiando la referencia: cabeza pelada de piel clara con ojos grandes y una
   boca roja, sueter verde ancho, brazos verdes flacos con manos claras de dedos visibles, dos
   piernas azules separadas y zapatos naranjas. Ni un archivo: veinte cajas y dos esferas.

   Y RIGGEADO A MANO, NO IMPORTADO. En la vuelta de Eco importar un esqueleto de un GLB costo un
   retarget entero en espacio de mundo porque cada generacion trae otro rig; acá el esqueleto lo
   escribimos nosotros, asi que una animacion es una funcion del tiempo a diez rotaciones y no hay
   nada que retargetear. Con graficos simples eso no es una concesion: es la version buena.
   ========================================================================================= */
const M_PIEL =new THREE.MeshLambertMaterial({color:0xd8c39a});
const M_VERDE=new THREE.MeshLambertMaterial({color:0x2ecc0f});
const M_AZUL =new THREE.MeshLambertMaterial({color:0x2626d6});
const M_ZAPA =new THREE.MeshLambertMaterial({color:0xd98a2b});
const M_OJO  =new THREE.MeshBasicMaterial({color:0xf7f7f2});
const M_PUPILA=new THREE.MeshBasicMaterial({color:0x24242b});
const M_BOCA =new THREE.MeshBasicMaterial({color:0xc0392b});

function armarProfe(){
  const R={};
  const raiz=new THREE.Group();          R.raiz=raiz;
  /* LAS MEDIDAS SALEN DE UNA CUENTA Y NO DE PROBAR, y hubo que hacerla porque la primera version
     lo dejaba ENTERRADO: con el torso a 1,06 y la cadena cadera(-0,56) -> pierna(0,60) ->
     pantorrilla(0,26) -> zapato(-0,34) el pie terminaba en y = -1,06, o sea un metro debajo del
     piso, y en pantalla se leia como un profesor de piernas cortas. La cadena hacia abajo mide
     0,56 + 0,44 + 0,42 + 0,065 = 1,485, asi que el torso va a 1,44 y el pie queda en -0,045:
     apenas hundido, que es lo que se quiere para que no flote.
     Y queda de 2,4 m de alto, que es la referencia: el personaje es larguirucho a proposito y en un
     pasillo de 3,6 de techo eso es exactamente lo que lo vuelve incomodo de ver venir. */
  const torso=new THREE.Group();         R.torso=torso;  raiz.add(torso);
  torso.position.y=1.44;

  const cuerpo=new THREE.Mesh(new THREE.BoxGeometry(0.86,0.86,0.42), M_VERDE);
  cuerpo.position.y=-0.05; torso.add(cuerpo);

  /* la cabeza: una esfera achatada, sin cuello, como en la referencia */
  const cabeza=new THREE.Group(); R.cabeza=cabeza; torso.add(cabeza);
  cabeza.position.y=0.58;
  const craneo=new THREE.Mesh(new THREE.SphereGeometry(0.40,14,10), M_PIEL);
  craneo.scale.set(1,1.10,0.94); cabeza.add(craneo);
  for(const sg of [-1,1]){
    const ojo=new THREE.Mesh(new THREE.SphereGeometry(0.115,10,8), M_OJO);
    ojo.position.set(sg*0.155,0.04,0.345); ojo.scale.set(1,1.18,0.5); cabeza.add(ojo);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6), M_PUPILA);
    pup.position.set(sg*0.155,0.03,0.395); pup.scale.set(1,1.1,0.4); cabeza.add(pup);
    R['pup'+(sg<0?'I':'D')]=pup;
  }
  const boca=new THREE.Mesh(new THREE.SphereGeometry(0.115,10,8), M_BOCA);
  boca.position.set(0,-0.21,0.335); boca.scale.set(1.05,0.52,0.42); cabeza.add(boca);
  R.boca=boca;

  /* los brazos: hombro -> brazo -> codo -> antebrazo -> mano con cinco dedos */
  const mano=()=>{
    const g=new THREE.Group();
    const palma=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.17,0.09), M_PIEL);
    g.add(palma);
    for(let k=0;k<4;k++){
      const d=new THREE.Mesh(new THREE.BoxGeometry(0.028,0.14,0.028), M_PIEL);
      d.position.set(-0.052+k*0.035, -0.15, 0); g.add(d);
    }
    const pulgar=new THREE.Mesh(new THREE.BoxGeometry(0.030,0.10,0.030), M_PIEL);
    pulgar.position.set(-0.085,-0.06,0.02); pulgar.rotation.z=0.7; g.add(pulgar);
    return g;
  };
  for(const sg of [-1,1]){
    const lado = sg<0? 'I':'D';
    /* el hombro AFUERA del torso: a 0,47 el brazo -de 0,16 de ancho- quedaba mordido por el borde
       del cuerpo, que esta a 0,43, y los brazos se leian como dos rebanadas. A 0,53 cuelgan
       separados, como en la referencia. */
    const hombro=new THREE.Group(); hombro.position.set(sg*0.53, 0.32, 0);
    torso.add(hombro); R['hombro'+lado]=hombro;
    const brazo=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.56,0.16), M_VERDE);
    brazo.position.y=-0.28; hombro.add(brazo);
    const codo=new THREE.Group(); codo.position.y=-0.56; hombro.add(codo); R['codo'+lado]=codo;
    const ante=new THREE.Mesh(new THREE.BoxGeometry(0.145,0.50,0.145), M_VERDE);
    ante.position.y=-0.25; codo.add(ante);
    const m=mano(); m.position.y=-0.58; codo.add(m); R['mano'+lado]=m;
  }
  /* las piernas: dos, separadas, sin cadera visible — es asi en la referencia */
  for(const sg of [-1,1]){
    const lado = sg<0? 'I':'D';
    const cadera=new THREE.Group(); cadera.position.set(sg*0.20, -0.56, 0);
    torso.add(cadera); R['cadera'+lado]=cadera;
    const pierna=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.44,0.17), M_AZUL);
    pierna.position.y=-0.22; cadera.add(pierna);
    const rodilla=new THREE.Group(); rodilla.position.y=-0.44; cadera.add(rodilla);
    R['rodilla'+lado]=rodilla;
    const pant=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.44,0.16), M_AZUL);
    pant.position.y=-0.22; rodilla.add(pant);
    const zapa=new THREE.Mesh(new THREE.BoxGeometry(0.21,0.13,0.34), M_ZAPA);
    zapa.position.set(0,-0.42,0.06); rodilla.add(zapa);
  }
  return R;
}

/* ---------- LAS ANIMACIONES ----------
   Una animacion es una funcion (t) -> diez rotaciones. Nada de clips, nada de keyframes: con un rig
   propio y diez articulaciones, escribir la curva es mas corto que describirla, y se puede MEZCLAR
   dos animaciones evaluando las dos y promediando — que es todo lo que un crossfade es. */
const HUESOS=['torso','cabeza','hombroI','codoI','hombroD','codoD',
              'caderaI','rodillaI','caderaD','rodillaD'];
function poseNueva(){ const p={}; for(const h of HUESOS) p[h]=[0,0,0]; p.alto=0; return p; }
const _pa=poseNueva(), _pb=poseNueva();

const ANIM={
  /* QUIETO: respira y nada mas. Un personaje perfectamente inmovil se lee a estatua, y una estatua
     no da miedo — da la sensacion de que el juego se colgo. */
  quieto:(t,p)=>{
    /* DOS RITMOS Y NO UNO. Respirar a 1,7 y mirar alrededor a 0,7 estaba bien, pero todo el cuerpo
       iba con la MISMA fase: eso hace un latido, no una respiracion. El tronco va a 1,7 y los
       hombros medio ciclo atras, que es lo que hace el hombro de verdad cuando el pecho se infla. */
    const r=Math.sin(t*1.7), rh=Math.sin(t*1.7-1.1), m=Math.sin(t*0.7);
    p.torso[0]=r*0.022; p.torso[1]=m*0.045;
    p.cabeza[0]=-r*0.030; p.cabeza[1]=m*0.16; p.cabeza[2]=Math.sin(t*0.43)*0.030;
    p.hombroI[2]= 0.09+rh*0.026; p.hombroD[2]=-0.09-rh*0.026;
    p.hombroI[0]=rh*0.030; p.hombroD[0]=rh*0.030;
    p.codoI[0]=-0.12-rh*0.035; p.codoD[0]=-0.12-rh*0.035; p.alto=r*0.013;
  },
  /* CAMINAR: piernas en oposicion, brazos en contra, y el tronco sube dos veces por ciclo. Esa
     doble subida es lo que hace que se lea a paso y no a deslizamiento. */
  /* CAMINAR A 3,4 m/s, QUE ES LA VELOCIDAD A LA QUE CAMINA DE VERDAD.
     El ciclo estaba en t*2,0, o sea un paso cada 1,57 s. Pero el riel lo mueve a 3,4 m/s, y una
     zancada de una persona son unos 0,75 m: a 3,4 m/s eso son 4,5 pasos por segundo, no 0,64. El
     resultado era el patinaje clasico —los pies se arrastran porque el cuerpo avanza mas rapido que
     la pierna— y se lee como que el personaje flota. Ahora el ritmo sale de la velocidad: ver
     CAMINA_W en b2.js.
     Y ADEMAS HAY DESFASE: las rodillas y los codos van un poco atrasados respecto de la cadera y el
     hombro (0,45 rad). Sin desfase todo el cuerpo cambia de direccion en el mismo cuadro y se lee a
     marioneta de dos palos; con desfase la pierna "sigue" a la cadera, que es lo que hace una pierna. */
  caminar:(t,p)=>{
    const a=t*CAMINA_W, s=Math.sin(a), c=Math.cos(a);
    const sr=Math.sin(a-0.45);                      // rodillas y codos, atrasados
    p.caderaI[0]= s*0.66;  p.caderaD[0]=-s*0.66;
    p.rodillaI[0]=Math.max(0,-sr)*0.92; p.rodillaD[0]=Math.max(0, sr)*0.92;
    p.hombroI[0]=-s*0.50; p.hombroD[0]= s*0.50;
    p.hombroI[2]= 0.12;   p.hombroD[2]=-0.12;
    p.codoI[0]=-0.34-Math.max(0,-sr)*0.42; p.codoD[0]=-0.34-Math.max(0,sr)*0.42;
    p.torso[0]=0.060+Math.abs(c)*0.034; p.torso[1]=s*0.070;
    /* la cabeza va casi quieta mientras el cuerpo sube y baja: en una persona la cabeza es lo ultimo
       que se mueve, y compensar el rebote con la cabeza es lo que separa caminar de saltar */
    p.cabeza[0]=-0.05-Math.abs(c)*0.030; p.cabeza[1]=-s*0.045;
    p.alto=Math.abs(c)*0.062;
  },
  /* SALUDAR: el brazo derecho arriba y el antebrazo yendo y viniendo. El cuerpo se inclina un poco
     hacia ese lado: un saludo con el torso quieto se ve como un brazo que se movio solo. */
  saludar:(t,p)=>{
    ANIM.quieto(t,p);
    const w=Math.sin(t*8.2);      // el saludo mas vivo: 6,4 se leia a abanico lento
    /* 2,15 y no 2,42: con la abduccion ya medida en radianes de verdad, 2,42 mas los 0,14 de base
       son 2,56 — o sea el brazo PASADO de la vertical, cruzandose por encima de la cabeza. 2,15
       deja la mano un puno arriba de la oreja, que es donde saluda una persona. */
    p.hombroD[2]=-2.15; p.hombroD[0]=0.18;
    p.codoD[2]=w*0.62; p.codoD[0]=-0.26;
    p.torso[2]=-0.075; p.cabeza[1]=0.16; p.cabeza[2]=0.06;
  },
  /* ABRIR PUERTA: los dos brazos van adelante, el de adelante empuja y el cuerpo se va con el
     empujon. Se resuelve en un ciclo de dos segundos que va y vuelve. */
  puerta:(t,p)=>{
    const f=(Math.sin(t*3.1)+1)/2;
    /* EL TRONCO YA NO GIRA CON EL MISMO f QUE EL BRAZO. Estaba con torso[1]=-0,20-f*0,12 y el
       brazo con -1,44-f*0,30: el tronco es ANTEPASADO del hombro, asi que los dos movimientos se
       restaban y la mano quedaba clavada — medido, 3 mm de recorrido en todo el ciclo, o sea un
       empujon que no empuja. El giro del tronco pasa a constante y el empujon queda solo en el
       brazo y el codo. */
    p.hombroD[0]=-1.10-f*0.34; p.hombroD[2]=-0.26;
    p.codoD[0]=-0.40+f*0.34;
    p.hombroI[0]=-0.44; p.hombroI[2]= 0.22; p.codoI[0]=-0.66;
    p.torso[0]=0.08+f*0.06; p.torso[1]=-0.14;
    p.cabeza[0]=0.10; p.cabeza[1]=0.16;
    p.caderaD[0]=0.18; p.caderaI[0]=-0.12; p.rodillaI[0]=0.20;
    p.alto=-0.028-f*0.022;
  },
  /* EXPLICANDO: las dos manos hablando, la cabeza acompanando y el tronco girando de a poco. Las
     dos manos van DESFASADAS: en fase se lee a marioneta. */
  explicar:(t,p)=>{
    const a=Math.sin(t*3.5), b=Math.sin(t*3.5+1.9), c=Math.sin(t*1.4);
    /* EL GESTO VA EN LOS CODOS Y NO EN LOS HOMBROS, y la razon es el punto de vista: en esta escena
       el mira A LA CAMARA. Un brazo levantado hacia adelante —1,06 de flexion, que es lo que tenia—
       apunta al lente y en pantalla no se ve como un brazo que gesticula sino como un palo saliendo
       del hombro; medido, la mano terminaba a 615 px con la cabeza a 618, o sea a la altura de la
       oreja. De frente lo que se lee es el ANTEBRAZO: hombros casi pegados al cuerpo, codos a 70
       grados y las manos hablando. El giro del codo tampoco usa mas el eje Y —medido con poseCruda,
       ese eje mueve la mano 1 mm porque es el eje del propio hueso: es torsion, no flexion. */
    p.hombroD[0]=-0.34+a*0.14; p.hombroD[2]=-0.26-a*0.07;
    p.codoD[0]=-1.25+b*0.32;   p.codoD[2]=-b*0.20;
    p.hombroI[0]=-0.30+b*0.12; p.hombroI[2]= 0.24+b*0.07;
    p.codoI[0]=-1.32+a*0.30;   p.codoI[2]= a*0.20;
    p.torso[1]=c*0.14; p.cabeza[1]=-c*0.24; p.cabeza[0]=-0.06+a*0.07;
    p.alto=a*0.012;
  },
  /* EL GRITO: la unica pose que no es de un maestro. Los dos brazos abiertos y arriba, el tronco
     echado atras, la cabeza levantada y TODO vibrando a 22 Hz. La vibracion es la pieza: una pose
     quieta a diez centimetros de la camara se lee a muneco, y una que tiembla se lee a algo vivo
     que te esta gritando. Va con `alto` positivo porque en el grito se estira hacia arriba. */
  grito:(t,p)=>{
    const s=Math.sin(t*22)*0.055, r=Math.sin(t*31)*0.035;
    p.hombroD[2]=-2.05+s; p.hombroI[2]= 2.05-s;
    p.hombroD[0]=-0.30-r; p.hombroI[0]=-0.30+r;
    p.codoD[0]=-0.34; p.codoI[0]=-0.34;
    p.torso[0]=-0.20+r*0.5; p.torso[2]=s*0.3;
    p.cabeza[0]=-0.32+s; p.cabeza[1]=r;
    p.caderaD[0]=-0.10; p.caderaI[0]=0.10;
    p.alto=0.055+Math.abs(s)*0.5;
  }
};
const ANIM_NOMBRES=['quieto','caminar','saludar','puerta','explicar','grito'];

function animar(R, nombre, otro, mezcla, t){
  const A=ANIM[nombre]||ANIM.quieto;
  for(const h of HUESOS){ _pa[h][0]=_pa[h][1]=_pa[h][2]=0; } _pa.alto=0;
  A(t,_pa);
  let P=_pa;
  if(otro && mezcla>0.001){
    for(const h of HUESOS){ _pb[h][0]=_pb[h][1]=_pb[h][2]=0; } _pb.alto=0;
    (ANIM[otro]||ANIM.quieto)(t,_pb);
    for(const h of HUESOS) for(let k=0;k<3;k++) _pa[h][k]=_pa[h][k]*(1-mezcla)+_pb[h][k]*mezcla;
    _pa.alto=_pa.alto*(1-mezcla)+_pb.alto*mezcla;
  }
  for(const h of HUESOS){ const q=R[h]; if(q) q.rotation.set(P[h][0],P[h][1],P[h][2]); }
  if(R.torso) R.torso.position.y=1.44+P.alto;
}

/* =========================================================================================
   EL MODELO GENERADO, Y COMO SE LE PEGAN LAS ANIMACIONES ESCRITAS A MANO

   El GLB lo genero Higgsfield (Meshy image_to_3d) desde la referencia, texturizado y RIGGEADO: vino
   con un esqueleto humanoide de 24 huesos y nombres estandar —Hips, Spine01, Head, LeftArm,
   LeftForeArm, LeftUpLeg…—, que es exactamente lo que hacia falta.

   POR QUE NO SE USA LA ANIMACION QUE TRAE: Meshy puede pegarle un clip de su biblioteca, pero de las
   cuatro que este juego necesita, dos no existen ahi —"abrir la puerta" y "explicando"— y las otras
   dos no se pueden mezclar con las mias. Con el esqueleto en la mano, una animacion es una funcion
   del tiempo a diez rotaciones, asi que se escriben las cuatro y se acabo.

   EL PROBLEMA DE VERDAD ES LA POSE DE REPOSO. El modelo se pidio en T-POSE porque es lo que da un
   rigging limpio, pero una T no es una pose de personaje: los brazos salen horizontales. Mis poses
   estan escritas para brazos colgando. Asi que cada hueso lleva un DESVIO DE REPOSO que lo lleva de
   la T a colgando, y la pose se suma encima.
   Y ese desvio NO SE ADIVINA: los ejes locales de un hueso dependen de como quedo el bind, asi que
   se MIDE — se gira el hueso en cada eje y se mira para donde se fue la mano en el mundo. El gancho
   __recreo.probarHueso() esta justo para eso.
   ========================================================================================= */
const HUESO_DE={ torso:'Spine01', cabeza:'Head',
                 hombroI:'LeftArm',  codoI:'LeftForeArm',
                 hombroD:'RightArm', codoD:'RightForeArm',
                 caderaI:'LeftUpLeg', rodillaI:'LeftLeg',
                 caderaD:'RightUpLeg', rodillaD:'RightLeg' };
/* ---------- LOS EJES DEL RIG, MEDIDOS Y NO SUPUESTOS ----------
   Habia puesto el desvio de reposo sobre la Z local del brazo "porque es lo que suele ser", y el
   personaje aparecio en T perfecta: la Z no baja el brazo, lo hace girar hacia adelante.
   Con __recreo.probarHueso() se gira un hueso un radian en cada eje y se mira PARA DONDE SE FUE LA
   MANO en el mundo. El resultado, en metros:

     hombroD  +1,2 en X  ->  mano (0,828 · 1,779) a (0,462 · 1,173)   dy = -0,606   BAJA
     hombroD  -1,2 en X  ->                                            dy = +0,561   SUBE
     hombroD  +1,2 en Z  ->  dz = +0,642                                             ADELANTE
     hombroD  +1,2 en Y  ->  dy = +0,030                                             casi nada
     hombroI  +1,2 en X  ->  dy = -0,614   BAJA TAMBIEN, con el mismo signo
     caderaD  +0,6 en X  ->  rodilla dy = -0,241                                     PIERNA ATRAS
     codoD    -1,2 en X  ->  mano dy = +0,241                                        DOBLA

   O sea: en este rig el brazo sube y baja sobre X y se mece adelante y atras sobre Z — justo al
   revés de lo que asumen mis poses, que estan escritas para el rig de cajas. La Y no hace nada
   porque es el eje que corre A LO LARGO del hueso.
   Asi que las poses no se reescriben: se REMAPEAN los canales. Es una tabla de diez lineas contra
   reescribir cinco animaciones, y ademas las dos versiones —cajas y generado— siguen compartiendo
   exactamente las mismas curvas. */
/* Y AHORA EL DESVIO ES UN DELTA CHICO, no 1,30: barrido con probarHueso() sobre el bind,
   delta 0 deja la mano en (0,724 · 1,365) —brazo casi horizontal— y cada dos decimas la baja:
     0,2 -> (0,592 · 1,230)      0,6 -> (0,358 · 1,117)
     0,4 -> (0,481 · 1,162)      0,8 -> (0,229 · 1,097)  <- la mano se mete en el cuerpo
   0,42 deja la mano justo por fuera del torso y a la altura de la cadera, que es como cuelga un
   brazo. Con 1,30 —el numero de cuando pisaba el bind— el brazo se cruzaba por delante del pecho. */
/* LOS HOMBROS YA NO LLEVAN DESVIO A MANO. Estuvo en 0,42 y despues en 0,65 —numeros sacados de
   medir donde caia la mano— y los dos eran el mismo parche: tapar con una constante que el eje
   estaba mal. Ahora el reposo del hombro se calcula solo (ver ABD_COLGADO) y aca queda unicamente
   el de los codos, que si tienen su eje anatomico en el bind. */
const REPOSO={ codoI:[0.10,0,0], codoD:[0.10,0,0] };
/* p = [x,y,z] de mi pose; r = desvio de reposo. Devuelve los tres angulos del hueso del GLB. */
const CANAL={
  torso:   (p,r)=>[r[0]+p[0], r[1]+p[1], r[2]+p[2]],
  cabeza:  (p,r)=>[r[0]+p[0], r[1]+p[1], r[2]+p[2]],
  /* EL SIGNO DEL MECEO VA AL REVES, y se vio en 'explicando': con el signo directo el brazo se iba
     para ATRAS en vez de adelante, o sea que el personaje explicaba de espaldas a sus propias manos.
     En el rig de cajas el brazo cuelga sobre -Y y girar +X lo lleva adelante; acá el mismo gesto va
     sobre -Z. Medido: hombroD +1,2 en Z movio la mano +0,642 en Z, o sea adelante. */
  /* los hombros no estan aca: van por quaternion en ejes del cuerpo, mas abajo */
  codoD:   (p,r)=>[r[0]+p[0], p[1],  p[2]],
  codoI:   (p,r)=>[r[0]+p[0], p[1], -p[2]],
  caderaD: (p,r)=>[p[0], p[1],  p[2]],
  caderaI: (p,r)=>[p[0], p[1], -p[2]],
  rodillaD:(p,r)=>[p[0], p[1],  p[2]],
  rodillaI:(p,r)=>[p[0], p[1], -p[2]]
};
const REPOSO_MANO={ manoI:'LeftHand', manoD:'RightHand' };

let baldi=null;                 // el rig que se esta usando (generado o de cajas)
/* =========================================================================================
   LOS HOMBROS SE MANEJAN EN EJES DEL CUERPO Y NO EN LOS DEL HUESO
   Por que hizo falta esto: los ejes locales de un hueso son los que dejo el bind, y en este rig el
   bind del hombro es (0,743 · -0,743 · 0) —el brazo en T—, asi que ninguno de los tres ejes locales
   es un eje anatomico. Medido con probarHueso() sobre este modelo: girar el eje X mueve la mano en
   el plano XY (sirve de abduccion, bien), pero girar Z la mueve 0,27 en Z Y ADEMAS 0,39 en Y. O sea
   que "levantar el brazo hacia adelante" tambien lo subia. Con eso, la pose de 'explicando' —que
   pide 1,06 de flexion— le ponia las dos manos a la altura de la oreja: medido, mano a y=643 px con
   la cabeza a 628. Dos palos en cruz.
   La salida no es buscar mejores numeros para los mismos ejes: es dejar de usar los ejes del hueso.
   La abduccion es un giro alrededor del Z DEL CUERPO, la flexion alrededor del X DEL CUERPO y la
   torsion alrededor del Y, y eso se pasa al espacio del padre con P⁻¹·R·P una sola vez al cargar.
   Los codos NO: ahi el eje local X del hueso ya es la bisagra buena —medido, mueve la mano en el
   plano del brazo— y encima acompana al brazo solo, que es justo lo que tiene que hacer un codo.
   ========================================================================================= */
const ABD_COLGADO=0.14;          // 8 grados: un brazo colgando no queda pegado al cuerpo
const EJE_X=new THREE.Vector3(1,0,0), EJE_Y=new THREE.Vector3(0,1,0), EJE_Z=new THREE.Vector3(0,0,1);
const _qA=new THREE.Quaternion(), _qB=new THREE.Quaternion(), _qC=new THREE.Quaternion();
const _vS=new THREE.Vector3(), _vH=new THREE.Vector3();

let baldiGLB=false;
const profe=armarProfe();       // el de cajas: existe SIEMPRE, y es el respaldo
profe.raiz.visible=false;
escena.add(profe.raiz);

function mapearGLB(raiz){
  const R={ raiz };
  raiz.traverse(o=>{ if(o.isBone||o.isObject3D){ /* por nombre, no por indice */ } });
  const porNombre={};
  raiz.traverse(o=>{ if(o.name) porNombre[o.name]=o; });
  let faltan=0;
  for(const k in HUESO_DE){
    const o=porNombre[HUESO_DE[k]];
    if(o){ R[k]=o; o.userData.rep=REPOSO[k]||[0,0,0];
           /* SE GUARDA LA ROTACION CON LA QUE VINO. Es la pose de reposo del rig, y hay huesos que
              la traen distinta de cero. */
           o.userData.bind=[o.rotation.x, o.rotation.y, o.rotation.z]; }
    else faltan++;
  }
  for(const k in REPOSO_MANO){ const o=porNombre[REPOSO_MANO[k]]; if(o) R[k]=o; }
  /* CUANTO HAY QUE BAJAR CADA BRAZO SALE MEDIDO, NO ELEGIDO. Se mide el angulo que forma el brazo
     del bind con la vertical y se guarda: el reposo es ese angulo menos ABD_COLGADO, con lo cual las
     poses vuelven a significar lo mismo que en el rig de cajas —donde 0 es colgando— sin tocar la
     tabla de animaciones. Si Meshy manda el proximo modelo en A-pose en vez de T-pose, esto se
     acomoda solo. */
  raiz.updateMatrixWorld(true);
  for(const k of ['hombroI','hombroD']){
    const o=R[k], mano=R[k==='hombroI'? 'manoI':'manoD'];
    if(!o || !mano) continue;
    o.getWorldPosition(_vS); mano.getWorldPosition(_vH);
    o.userData.abdBind=Math.atan2(Math.abs(_vH.x-_vS.x), Math.max(1e-6, _vS.y-_vH.y));
    o.userData.lado = (k==='hombroI')? 1 : -1;
    o.userData.qBind=o.quaternion.clone();
    const qp=new THREE.Quaternion();
    if(o.parent) o.parent.getWorldQuaternion(qp);
    o.userData.qP=qp.clone(); o.userData.qPI=qp.clone().invert();
  }
  R.porNombre=porNombre;
  R.faltan=faltan;
  return R;
}
/* animar() del rig de cajas escribe rotation.set() a secas. Sobre el GLB hay que SUMAR el desvio de
   reposo, asi que va una version propia y no un parche dentro de la otra: dos rigs distintos con la
   misma tabla de poses es mas claro que una funcion con un if adentro. */
let _poseFija=null;      // gancho de prueba: fuerza una pose cruda para poder medir un solo eje
function animarGLB(R, nombre, otro, mezcla, t){
  for(const h of HUESOS){ _pa[h][0]=_pa[h][1]=_pa[h][2]=0; } _pa.alto=0;
  (ANIM[nombre]||ANIM.quieto)(t,_pa);
  if(_poseFija){ for(const h of HUESOS){ const v=_poseFija[h];
    _pa[h][0]=v?v[0]:0; _pa[h][1]=v?v[1]:0; _pa[h][2]=v?v[2]:0; } _pa.alto=0; }
  if(otro && mezcla>0.001){
    for(const h of HUESOS){ _pb[h][0]=_pb[h][1]=_pb[h][2]=0; } _pb.alto=0;
    (ANIM[otro]||ANIM.quieto)(t,_pb);
    for(const h of HUESOS) for(let k=0;k<3;k++) _pa[h][k]=_pa[h][k]*(1-mezcla)+_pb[h][k]*mezcla;
    _pa.alto=_pa.alto*(1-mezcla)+_pb.alto*mezcla;
  }
  for(const h of HUESOS){
    const q=R[h]; if(!q) continue;
    const r=q.userData.rep||[0,0,0];
    const b=q.userData.bind||[0,0,0];
    const f=CANAL[h];
    if(q.userData.qP){
      /* HOMBRO: abduccion / flexion / torsion en ejes del cuerpo, sobre el bind.
         abd sale de la medida del bind, asi que _pa[h][2] significa exactamente lo mismo que en el
         rig de cajas: 0 es el brazo colgando. */
      const lado=q.userData.lado;
      const abd = (ABD_COLGADO - q.userData.abdBind) + lado*_pa[h][2];
      /* EL ORDEN IMPORTA Y ESTE ES EL BUENO: primero abduccion, despues flexion.
         Al reves —flexion adentro— la abduccion deja de ser un angulo en el plano frontal y se
         mezcla: con 'explicando' (0,52 de abduccion y 1,06 de flexion) la mano terminaba MAS ARRIBA
         que el hombro, medido a y=629 px con la cabeza a 618. Abduccion adentro: el brazo se separa
         del cuerpo lo que dice la pose y despues la flexion lo lleva hacia adelante desde ahi. */
      _qA.setFromAxisAngle(EJE_X, _pa[h][0]);
      _qB.setFromAxisAngle(EJE_Z, lado*abd);
      _qA.multiply(_qB);
      if(_pa[h][1]){ _qC.setFromAxisAngle(EJE_Y, _pa[h][1]); _qA.multiply(_qC); }
      q.quaternion.copy(q.userData.qPI).multiply(_qA).multiply(q.userData.qP)
                  .multiply(q.userData.qBind);
      continue;
    }
    const a = f? f(_pa[h], r) : [r[0]+_pa[h][0], r[1]+_pa[h][1], r[2]+_pa[h][2]];
    /* SE SUMA A LA ROTACION DE BIND. NO SE PISA.
       Esto era EL defecto, y se veia como un personaje derretido. Un rig de Meshy trae la pose de
       reposo escrita EN LAS ROTACIONES de los huesos, no solo en la jerarquia: medido en este
       modelo, `caderaI` viene con X = -3,078 radianes —casi media vuelta— y `hombroD` con
       (0,743 · -0,743 · 0), que es la direccion del brazo en T.
       Mi codigo hacia `rotation.set(mi_pose)`, o sea que BORRABA todo eso: la cadera saltaba de -176
       grados a 0 y la pierna se le iba a la altura de la cabeza (la rodilla medida en y=1,529 cuando
       tiene que estar en 0,44), y a los brazos les borraba la Y y quedaban metidos dentro del torso.
       El resultado en pantalla era una mancha verde con un zapato al lado de la oreja.
       La pose es un DELTA sobre el reposo del rig. Siempre lo fue; yo estaba escribiendo absolutos. */
    q.rotation.set(b[0]+a[0], b[1]+a[1], b[2]+a[2]);
  }
  if(R.raiz) R.raiz.position.y = (R.baseY||0) + _pa.alto;
}
function animarBaldi(nombre, otro, mezcla, t){
  if(baldiGLB) animarGLB(baldi, nombre, otro, mezcla, t);
  else animar(profe, nombre, otro, mezcla, t);
}
