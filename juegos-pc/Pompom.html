<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pompom</title>
<style>
  /* ===================== LO BLANCO =====================
     Una sola idea: casi todo es papel. Hay UN color y es el peligro, y hay una tinta y es la pelusa.
     Todo lo demas son grises de humo. Un juego "de tranquilidad" no se hace con musica suave sobre
     una pantalla llena: se hace sacando cosas hasta que lo unico que queda es lo que hay que mirar. */
  :root{
    --papel:#F7F6F3; --papel2:#EFEEEA;
    --tinta:#24242B; --humo:#C9C7C0; --humo2:#DEDCD6;
    --peligro:#D9695A; --calma:#7FB2A2;
    --esc:1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--papel2);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    color:var(--tinta); -webkit-user-select:none; user-select:none; touch-action:none; }
  #caja{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #lienzo{ display:block; background:var(--papel); }

  /* LOS PANELES SON TRANSLUCIDOS A PROPOSITO. Con el papel opaco encima, el fondo de capas se
     apagaba justo en la pantalla donde el jugador pasa mas tiempo mirando, y un menu sin nada
     moviendose detras se lee a formulario. Translucido, el mismo parallax que hay en el juego sigue
     corriendo debajo del menu, y la pelusa flota ahi con su pelo de verdad. */
  .pan{ position:absolute; inset:0; z-index:20; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(14px * var(--esc));
    background:rgba(247,246,243,0.87); padding:24px; text-align:center; }
  /* SIN backdrop-filter A PROPOSITO. Lo tenia y desenfocaba TODO lo de atras, la pelusa incluida:
     el unico personaje del juego se veia como una mancha. El velo solo ya separa el texto del
     fondo, y el fondo de capas ya esta al 45% de opacidad, que es su propio desenfoque. */
  #pIdioma, #pHistoria{ background:rgba(247,246,243,0.94); }
  /* EL MENU NO SE TAPA CON OPACIDAD PAREJA, SE TAPA CON UN DEGRADE. Con un velo parejo al 87% pasan
     dos cosas malas a la vez: el fondo de capas queda a la mitad de contraste en todas partes, y la
     pelusa que flota abajo se ve turbia. Con el velo cerrado en la franja del texto y abierto arriba
     y abajo, el titulo se lee con el contraste entero y el juego se ve moverse a los dos lados. */
  #pMenu{ background:linear-gradient(180deg, rgba(247,246,243,0.50) 0%,
    rgba(247,246,243,0.94) 22%, rgba(247,246,243,0.94) 58%, rgba(247,246,243,0.38) 100%); }
  .pan.ver{ display:flex; }
  .tit{ font-size:clamp(30px,7.4vmin,58px); font-weight:200; letter-spacing:.30em;
    margin-left:.30em; color:var(--tinta); }
  .sub{ font-size:max(11px,calc(12px * var(--esc))); font-weight:600; letter-spacing:.22em;
    color:var(--humo); text-transform:uppercase; }
  .bot{ appearance:none; border:1.4px solid var(--humo); background:transparent; color:var(--tinta);
    font:inherit; font-size:max(12px,calc(13px * var(--esc))); font-weight:700; letter-spacing:.18em;
    padding:13px 30px; border-radius:999px; cursor:pointer; transition:.18s ease;
    text-transform:uppercase; }
  .bot:hover{ border-color:var(--tinta); }
  .bot:active{ background:var(--tinta); color:var(--papel); }
  .bot.lleno{ background:var(--tinta); color:var(--papel); border-color:var(--tinta); }
  .fila{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* la rejilla de mundos: seis fichas, nada mas */
  #gMundos{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;
    width:min(560px,92%); max-height:74vh; overflow-y:auto; padding:2px; }
  @media (min-width:720px){ #gMundos{ grid-template-columns:repeat(4,minmax(0,1fr));
    width:min(880px,94%); } }
  .mundo{ border:1.4px solid var(--humo2); border-radius:18px; padding:16px 12px; cursor:pointer;
    background:var(--papel); transition:.18s ease; display:flex; flex-direction:column;
    align-items:center; gap:7px; }
  .mundo:hover{ border-color:var(--tinta); }
  .mundo .n{ font-size:max(9px,calc(10px * var(--esc))); letter-spacing:.24em; color:var(--humo);
    font-weight:700; }
  .mundo .nm{ font-size:max(13px,calc(15px * var(--esc))); font-weight:300; letter-spacing:.14em; }
  .mundo .pg{ font-size:max(9px,calc(10px * var(--esc))); color:var(--humo); letter-spacing:.14em; }
  .mundo.trabado{ opacity:.38; cursor:not-allowed; }
  .mundo .bolita{ width:34px; height:34px; }

  /* los veinte niveles */
  #gNiveles{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px;
    width:min(430px,92%); }
  .niv{ aspect-ratio:1; border:1.3px solid var(--humo2); border-radius:12px; background:var(--papel);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s ease;
    font-size:max(11px,calc(12px * var(--esc))); font-weight:600; color:var(--tinta); }
  .niv:hover{ border-color:var(--tinta); }
  .niv.hecho{ background:var(--tinta); color:var(--papel); border-color:var(--tinta); }
  .niv.limpio{ background:var(--calma); border-color:var(--calma); color:var(--papel); }
  .niv.trabado{ opacity:.3; cursor:not-allowed; }

  /* ===================== EL HUD =====================
     Tres cosas y ninguna mas: donde estas, cuanto falta, y como se sale. Un contador de vidas o un
     reloj serian exactamente lo contrario de lo que este juego dice ser. */
  #hud{ position:absolute; inset:0; z-index:10; pointer-events:none; }
  #arriba{ position:absolute; top:calc(14px * var(--esc)); left:0; right:0; display:flex;
    align-items:center; justify-content:center; gap:calc(12px * var(--esc)); }
  #donde{ font-size:max(10px,calc(11px * var(--esc))); font-weight:700; letter-spacing:.22em;
    color:var(--humo); }
  #barra{ width:min(190px,34%); height:3px; border-radius:9px; background:var(--humo2);
    overflow:hidden; }
  #barra i{ display:block; height:100%; width:0%; background:var(--tinta);
    transition:width .28s cubic-bezier(.2,.8,.2,1); }
  #salir{ position:absolute; top:calc(10px * var(--esc)); left:calc(12px * var(--esc));
    pointer-events:auto; width:36px; height:36px; border-radius:50%; border:1.3px solid var(--humo2);
    background:var(--papel); color:var(--humo); cursor:pointer; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  #salir:active{ color:var(--tinta); border-color:var(--tinta); }
  #son{ position:absolute; top:calc(10px * var(--esc)); right:calc(12px * var(--esc));
    pointer-events:auto; width:36px; height:36px; border-radius:50%; border:1.3px solid var(--humo2);
    background:var(--papel); color:var(--humo); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; }
  #son.mudo{ color:var(--humo2); }

  /* el cartel del tutorial: se explica haciendo, nunca antes */
  #tuto{ position:absolute; left:50%; bottom:12%; transform:translateX(-50%); z-index:14;
    display:none; flex-direction:column; align-items:center; gap:8px; width:86%; max-width:520px;
    text-align:center; pointer-events:none; }
  body.tutorial #tuto{ display:flex; }
  #tutoT{ font-size:max(14px,calc(17px * var(--esc))); font-weight:300; letter-spacing:.10em; }
  #tutoS{ font-size:max(11px,calc(12px * var(--esc))); font-weight:600; letter-spacing:.10em;
    color:var(--humo); line-height:1.6; }
  #tutoP{ width:120px; height:2px; background:var(--humo2); border-radius:9px; overflow:hidden; }
  #tutoP i{ display:block; height:100%; width:0%; background:var(--tinta); }

  /* el aviso del medio, que casi nunca aparece */
  #aviso{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); z-index:15;
    font-size:clamp(17px,4.4vmin,30px); font-weight:200; letter-spacing:.24em; margin-left:.24em;
    opacity:0; transition:opacity .35s ease; text-align:center; pointer-events:none; }
  #aviso.ver{ opacity:1; }

  #toque{ position:absolute; left:50%; bottom:calc(26px * var(--esc)); transform:translateX(-50%);
    z-index:12; font-size:max(10px,calc(11px * var(--esc))); font-weight:700; letter-spacing:.22em;
    color:var(--humo); opacity:0; transition:opacity .4s ease; pointer-events:none; }
  #toque.ver{ opacity:1; }

  #idBotones{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }

  /* ===================== LA HISTORIA =====================
     Cinco planos dibujados en un lienzo aparte. No hay una sola foto en todo el juego y no la va a
     haber: lo que da el tono es la MISMA tinta con la que se dibuja el juego, asi que la historia
     tiene que estar hecha con lo mismo o se lee pegada encima. */
  /* EL LIENZO SE ENCOGE POR LOS DOS LADOS. Con el ancho fijo y el alto libre, en una ventana baja
     -que es como se ve un telefono acostado, y como se ve media notebook- el plano ocupaba 300 px de
     los 460 y el texto y el boton se salian del panel. Un elemento reemplazado con max-width Y
     max-height respeta la proporcion solo, asi que el plano se achica entero en vez de deformarse. */
  #hL{ max-width:min(560px,94%); max-height:46vh; width:auto; height:auto; display:block; }
  #hT{ font-size:max(13px,calc(15px * var(--esc))); font-weight:300; letter-spacing:.10em;
    line-height:1.8; width:min(520px,92%); min-height:4.4em; color:var(--tinta); }
  #hP{ display:flex; gap:6px; }
  #hP b{ width:20px; height:2px; border-radius:9px; background:var(--humo2); display:block;
    transition:.3s ease; }
  #hP b.hay{ background:var(--tinta); width:30px; }
  #creditos{ position:absolute; bottom:8px; left:0; right:0; text-align:center;
    font-size:9px; letter-spacing:.24em; color:var(--humo2); }

  /* ===================== EL HUB =====================
     NO HAY BOTON "JUGAR" EN EL MEDIO. Lo que hay en el medio es Pelusin, y sigue el dedo: la
     primera cosa que el jugador hace en este juego es tocar la pantalla y ver que algo peludo le
     contesta. Un boton no ensena nada; un bicho que se mueve con el dedo ensena las dos unicas
     reglas que el juego tiene — se toca, y lo que hay es blando.
     Las cuatro salidas van en los cuatro bordes y el panel NO tapa el centro: es un marco. */
  #pHub{ background:transparent; backdrop-filter:none; padding:0;
    display:none; }
  #pHub.ver{ display:block; }
  #hubVelo{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 52%, rgba(247,246,243,0) 26%, rgba(247,246,243,.72) 62%,
      rgba(247,246,243,.93) 100%); }
  #hubTit{ position:absolute; top:calc(16px * var(--esc)); left:0; right:0; text-align:center;
    font-size:clamp(19px,4.6vmin,34px); font-weight:200; letter-spacing:.34em; margin-left:.34em;
    color:var(--tinta); pointer-events:none; }
  #hubSub{ position:absolute; top:calc(52px * var(--esc)); left:0; right:0; text-align:center;
    font-size:max(9px,calc(10px * var(--esc))); font-weight:700; letter-spacing:.22em;
    color:var(--humo); text-transform:uppercase; pointer-events:none; }
  .hubB{ position:absolute; appearance:none; border:1.4px solid var(--humo2); background:var(--papel);
    color:var(--tinta); font:inherit; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    border-radius:999px; cursor:pointer; padding:11px 22px; font-size:max(10px,calc(11px * var(--esc)));
    display:flex; flex-direction:column; align-items:center; gap:3px; line-height:1.2; }
  .hubB small{ font-size:max(8px,calc(8.5px * var(--esc))); letter-spacing:.14em; color:var(--humo);
    font-weight:700; }
  .hubB:active{ background:var(--tinta); color:var(--papel); }
  .hubB:active small{ color:var(--papel2); }
  /* PLAY tiene que despegarse del pie. Con `calc(30px * esc)` y esc=0,62 en una ventana baja el
     boton arranca a 18 px del borde y se comia la fila de HISTORIA / IDIOMA / sonido. El minimo de
     48 px es lo que mide esa fila mas su aire. */
  #hJugar{ left:50%; transform:translateX(-50%); bottom:max(48px, calc(58px * var(--esc)));
    background:var(--tinta); color:var(--papel); border-color:var(--tinta); padding:14px 40px;
    font-size:max(12px,calc(14px * var(--esc))); }
  #hJugar small{ color:rgba(247,246,243,.62); }
  #hNiveles{ left:50%; transform:translateX(-50%); top:calc(84px * var(--esc)); }
  #hColor{ left:calc(12px * var(--esc)); top:50%; transform:translateY(-50%); }
  #hGorro{ right:calc(12px * var(--esc)); top:50%; transform:translateY(-50%); }
  #hMotas{ position:absolute; right:calc(12px * var(--esc)); top:calc(14px * var(--esc));
    font-size:max(10px,calc(11px * var(--esc))); font-weight:800; letter-spacing:.14em;
    color:var(--tinta); display:flex; align-items:center; gap:6px; pointer-events:none; }
  #hMotas i{ width:9px; height:9px; border-radius:50%; background:var(--calma); display:block; }
  #hPie{ position:absolute; bottom:max(9px, calc(11px * var(--esc))); left:0; right:0;
    text-align:center; display:flex; gap:14px; justify-content:center; align-items:center; }
  .pieB{ appearance:none; border:0; background:transparent; color:var(--humo); cursor:pointer;
    font:inherit; font-size:max(8.5px,calc(9px * var(--esc))); letter-spacing:.22em;
    text-transform:uppercase; font-weight:700; padding:6px; }
  .pieB:active{ color:var(--tinta); }

  /* ===================== LAS DOS TIENDAS ===================== */
  #gTienda{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px;
    width:min(430px,92%); max-height:64vh; overflow-y:auto; padding:3px; }
  @media (min-width:720px){ #gTienda{ grid-template-columns:repeat(4,minmax(0,1fr));
    width:min(620px,92%); } }
  .art{ border:1.4px solid var(--humo2); border-radius:16px; padding:9px 6px 8px; cursor:pointer;
    background:var(--papel); display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:.15s ease; }
  .art:hover{ border-color:var(--tinta); }
  .art canvas{ width:52px; height:52px; }
  .art .pr{ font-size:max(9px,calc(9.5px * var(--esc))); font-weight:800; letter-spacing:.10em;
    color:var(--humo); }
  .art.tiene .pr{ color:var(--calma); }
  .art.puesto{ border-color:var(--tinta); background:var(--papel2); }
  .art.puesto .pr{ color:var(--tinta); }
  .art.caro{ opacity:.42; }
  #tMotas{ font-size:max(10px,calc(11px * var(--esc))); font-weight:800; letter-spacing:.16em;
    color:var(--tinta); }

  /* ===================== LA CINEMATICA =====================
     El panel es TRANSPARENTE salvo por un velo abajo: la cinematica se dibuja en el lienzo de
     siempre —el mismo fondo, el mismo Pelusin, el mismo pelo con fisica— y lo unico que va en DOM
     es el texto, que tiene que ser nitido y traducible. Una cinematica dibujada con texto de lienzo
     se ve borrosa en un telefono y no se puede traducir sin volver a medir todo. */
  #pCine{ background:transparent; backdrop-filter:none; justify-content:flex-end; padding-bottom:0; }
  #pCine::before{ content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(247,246,243,0) 40%, rgba(247,246,243,.86) 78%,
      rgba(247,246,243,.97) 100%); }
  #cineT{ position:relative; z-index:1; font-size:max(13px,calc(16px * var(--esc))); font-weight:300;
    letter-spacing:.09em; line-height:1.85; width:min(540px,90%); min-height:3.6em;
    color:var(--tinta); margin-bottom:calc(10px * var(--esc)); }
  #cineP{ position:relative; z-index:1; width:min(220px,54%); height:2px; border-radius:9px;
    background:var(--humo2); overflow:hidden; margin-bottom:calc(12px * var(--esc)); }
  #cineP i{ display:block; height:100%; width:0%; background:var(--tinta); }
  #cineSaltar{ position:relative; z-index:1; margin-bottom:calc(26px * var(--esc)); }

  /* ===================== LAS VIDAS ===================== */
  #vidas{ position:absolute; top:calc(14px * var(--esc)); right:calc(56px * var(--esc));
    display:flex; gap:5px; align-items:center; }
  #vidas b{ width:calc(9px * var(--esc)); height:calc(9px * var(--esc)); min-width:7px; min-height:7px;
    border-radius:50%; background:var(--tinta); display:block; transition:.2s ease; }
  #vidas b.no{ background:transparent; box-shadow:inset 0 0 0 1.4px var(--humo2); }
  #vidas .esc{ width:calc(11px * var(--esc)); height:calc(11px * var(--esc)); min-width:9px;
    min-height:9px; border-radius:3px; background:var(--calma); display:none; }
  body.escudo #vidas .esc{ display:block; }
</style>
</head>
<body>

<div id="caja">
  <canvas id="lienzo"></canvas>

  <div id="hud">
    <div id="arriba">
      <div id="donde">1 · 1</div>
      <div id="barra"><i></i></div>
    </div>
    <button id="salir">‹</button>
    <button id="son">♪</button>
    <div id="vidas"><b></b><b></b><b></b><b></b><span class="esc"></span></div>
    <div id="aviso"></div>
    <div id="toque"></div>
    <div id="tuto">
      <div id="tutoT"></div>
      <div id="tutoS"></div>
      <div id="tutoP"><i></i></div>
    </div>
  </div>

  <div id="pIdioma" class="pan ver">
    <div class="tit">POMPOM</div>
    <div class="sub">Language · Idioma · Idioma</div>
    <div id="idBotones"></div>
  </div>

  <div id="pHistoria" class="pan">
    <canvas id="hL" width="1040" height="470"></canvas>
    <div id="hT"></div>
    <div id="hP"></div>
    <button class="bot" id="hSaltar" data-i18n="saltar"></button>
  </div>

  <div id="pHub" class="pan">
    <div id="hubVelo"></div>
    <div id="hubTit">POMPOM</div>
    <div id="hubSub" data-i18n="sub"></div>
    <div id="hMotas"><i></i><span id="hMotasN">0</span></div>
    <button class="hubB" id="hNiveles"><span data-i18n="niveles"></span><small id="hNivelesS"></small></button>
    <button class="hubB" id="hColor"><span data-i18n="colores"></span><small data-i18n="tienda"></small></button>
    <button class="hubB" id="hGorro"><span data-i18n="gorros"></span><small data-i18n="tienda"></small></button>
    <button class="hubB" id="hJugar"><span data-i18n="jugar"></span><small id="hJugarS"></small></button>
    <div id="hPie">
      <button class="pieB" id="bCuento" data-i18n="cuento"></button>
      <button class="pieB" id="bEfe" data-i18n="grafica"></button>
      <button class="pieB" id="bIdioma" data-i18n="idioma"></button>
      <button class="pieB" id="bSon2">♪</button>
    </div>
  </div>

  <div id="pCine" class="pan">
    <div id="cineT"></div>
    <div id="cineP"><i></i></div>
    <button class="bot" id="cineSaltar" data-i18n="saltarCine"></button>
  </div>

  <div id="pTienda" class="pan">
    <div class="sub" id="tTit"></div>
    <div id="tMotas"></div>
    <div id="gTienda"></div>
    <button class="bot" id="bVolver3" data-i18n="volver"></button>
  </div>

  <div id="pMundos" class="pan">
    <div class="sub" data-i18n="mundos"></div>
    <div id="gMundos"></div>
    <button class="bot" id="bVolver1" data-i18n="volver"></button>
  </div>

  <div id="pNiveles" class="pan">
    <div class="sub" id="tNiveles"></div>
    <div id="gNiveles"></div>
    <button class="bot" id="bVolver2" data-i18n="volver"></button>
  </div>

  <div id="pFin" class="pan">
    <div class="tit" data-i18n="finT"></div>
    <div class="sub" data-i18n="finS"></div>
    <button class="bot lleno" id="bFin" data-i18n="volver"></button>
  </div>
</div>

<script>
/* =========================================================================================
   PELUSA — un juego de tocar en el momento justo.

   LA REGLA, Y ES UNA SOLA: la pelusa esta pegada a un punto, hay una linea recta marcada hasta el
   punto siguiente, y alrededor de ese punto giran bolas con espinas. Se toca y sale. Si una espina
   la toca en el camino, vuelve. Nada mas que eso.

   POR QUE NO HAY RELOJ NI VIDAS: el pedido dice "de tranquilidad". Un contador de vidas convierte
   cada error en una perdida y eso es exactamente lo contrario. Fallar cuesta volver a tocar.
   ========================================================================================= */

/* ===================== LOS IDIOMAS =====================
   Arranca en INGLES y se elige antes que nada. Ni una cadena suelta en el codigo: una sola que se
   escape es la que el jugador va a ver en el idioma equivocado. */
const IDIOMAS=[['en','English'],['es','Español'],['pt','Português']];
let IDIOMA='en';
try{ const g=localStorage.getItem('pelusa_idioma'); if(g && IDIOMAS.some(i=>i[0]===g)) IDIOMA=g; }catch(e){}
const L={
 sub:{en:'tap at the right moment', es:'tocá en el momento justo', pt:'toque no momento certo'},
 jugar:{en:'PLAY', es:'JUGAR', pt:'JOGAR'},
 niveles:{en:'LEVELS', es:'NIVELES', pt:'NÍVEIS'},
 colores:{en:'COLOURS', es:'COLORES', pt:'CORES'},
 gorros:{en:'HATS', es:'GORRITOS', pt:'CHAPÉUS'},
 tienda:{en:'shop', es:'tienda', pt:'loja'},
 motas:{en:'{n} specks', es:'{n} motas', pt:'{n} motas'},
 comprar:{en:'{n}', es:'{n}', pt:'{n}'},

       return (t&&d)? 'movil':'pc'; }catch(e){ return 'pc'; }
}

/* ===================== EL BLOOM =====================
   BLOOM SELECTIVO Y NO DE PANTALLA ENTERA, y en un juego blanco no es una preferencia, es la unica
   opcion que funciona: el bloom de pantalla completa toma lo mas brillante del cuadro y lo derrama,
   y acá lo mas brillante del cuadro ES EL PAPEL. Un bloom global sobre #F7F6F3 devuelve una pantalla
   lavada donde ya no se lee ni la linea de puntos.
   Asi que el brillo no se DEDUCE de la imagen: se DECLARA. Cada cosa que tiene que brillar —el punto
   de llegada, los premios, el escudo, los estallidos— se anota en una lista mientras se dibuja, y al
   final esa lista se pinta en un lienzo a mitad de resolucion como degradados radiales y se suma
   encima con 'lighter'. Son cuatro o cinco degradados por cuadro contra un desenfoque de pantalla
   completa: mas barato Y mas correcto.
   Y NO EN TODOS LOS MUNDOS. Va donde la historia lo pide —el hielo, el canon, la salina y el ultimo
   blanco— porque un brillo que esta siempre deja de significar algo. */
const BLOOM_MUNDO=[false,false,false,false,false,true,true,true,true];
const BLOOM_FUERZA=0.85;
let bloomOn=true;
try{ const g=localStorage.getItem('pompom_bloom'); if(g!=null) bloomOn=(g==='1'); }catch(e){}
const glow=[];
let blCv=null, blG=null, blFiltro=null;
function brillar(X,Y,r,rgb,a){
  if(!bloomOn || !BLOOM_MUNDO[Math.max(0,Math.min(8,fondoMundo))]) return;
  glow.push({X,Y,r,rgb,a});
}
function estallido(X,Y,r,rgb,a){ if(bloomOn) glow.push({X,Y,r,rgb,a}); }  // los estallidos brillan siempre
function bloomPintar(){
  if(!glow.length) return;
  const k=0.5, bw=Math.max(2,Math.round(W*k)), bh=Math.max(2,Math.round(H*k));
  if(!blCv){ blCv=document.createElement('canvas'); blG=blCv.getContext('2d');
    try{ blG.filter='blur(2px)'; blFiltro=(blG.filter!=='none'); blG.filter='none'; }
    catch(e){ blFiltro=false; } }
  if(blCv.width!==bw||blCv.height!==bh){ blCv.width=bw; blCv.height=bh; }
  const b=blG;
  b.setTransform(1,0,0,1,0,0);
  b.clearRect(0,0,bw,bh);
  for(const q of glow){
    const R=Math.max(2,q.r*k), X=q.X*k, Y=q.Y*k;
    if(X<-R||X>bw+R||Y<-R||Y>bh+R) continue;
    const gr=b.createRadialGradient(X,Y,0,X,Y,R);
    gr.addColorStop(0,   'rgba('+q.rgb+','+q.a.toFixed(3)+')');
    gr.addColorStop(0.45,'rgba('+q.rgb+','+(q.a*0.34).toFixed(3)+')');
    gr.addColorStop(1,   'rgba('+q.rgb+',0)');
    b.fillStyle=gr; b.beginPath(); b.arc(X,Y,R,0,7); b.fill();
  }
  const g=cx;
  g.save(); g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation='lighter';
  g.globalAlpha=BLOOM_FUERZA;
  /* el desenfoque de lienzo es un extra: los degradados radiales YA son un halo. Si el navegador no
     soporta ctx.filter no se pierde el efecto, se pierde medio pixel de suavidad. */
  if(blFiltro){ try{ g.filter='blur('+Math.max(2,Math.round(Math.min(W,H)*0.008))+'px)'; }catch(e){} }
  g.drawImage(blCv, 0,0, W,H);
  g.filter='none'; g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.restore();
}

const lienzo=document.getElementById('lienzo');

function ajustar(){
  const w=innerWidth, h=innerHeight;
  DPR=Math.min(devicePixelRatio||1, 2);
  lienzo.style.width=w+'px'; lienzo.style.height=h+'px';
  lienzo.width=Math.round(w*DPR); lienzo.height=Math.round(h*DPR);
  W=w; H=h;
  esc=Math.max(0.62, Math.min(1.18, h/860));
  document.documentElement.style.setProperty('--esc', esc.toFixed(3));
  /* LA ESCALA LA DECIDE EL LADO QUE APRIETA, Y LA GEOMETRIA NO SE TOCA. Un nivel con semilla tiene
     que ser el MISMO nivel en cualquier pantalla: si los nodos se corrieran para caber, el 12 del
     mundo 4 seria otro nivel en cada telefono. Asi que se aleja la camara.
     Medido: con los nodos en una banda de +-2,3 y una orbita de 2,15, hace falta ver 5,16 unidades a
     cada lado. En un telefono 9:19,5 la altura sola daria 4,11 y las bolas de la derecha quedaban
     cortadas por el borde. */
  U=Math.min(H/ALTO_CAM, W/(2*MEDIO_MIN));
}

   Cuatro capas a cuatro velocidades. Con UNA sola capa quieta detras, subir doce metros y subir uno

function dibujarFig(g, X, Y, r, forma, soloLinea, giro){
  g.save(); g.translate(X,Y);
  if(forma!=='disco' && forma!=='aro') g.rotate(giro||0);
  g.beginPath();
  if(forma==='disco' || forma==='aro'){ g.arc(0,0,r,0,7); }
  else if(forma==='triangulo'){ for(let i=0;i<3;i++){ const a=-Math.PI/2+i/3*Math.PI*2;
      i? g.lineTo(Math.cos(a)*r,Math.sin(a)*r) : g.moveTo(Math.cos(a)*r,Math.sin(a)*r); } g.closePath(); }
  else if(forma==='rombo'){ g.moveTo(0,-r); g.lineTo(r*0.72,0); g.lineTo(0,r); g.lineTo(-r*0.72,0); g.closePath(); }
  else if(forma==='hexa'){ for(let i=0;i<6;i++){ const a=i/6*Math.PI*2;
      i? g.lineTo(Math.cos(a)*r,Math.sin(a)*r) : g.moveTo(Math.cos(a)*r,Math.sin(a)*r); } g.closePath(); }
  else if(forma==='cruz'){ const b=r*0.34;
      g.moveTo(-b,-r); g.lineTo(b,-r); g.lineTo(b,-b); g.lineTo(r,-b); g.lineTo(r,b); g.lineTo(b,b);
      g.lineTo(b,r); g.lineTo(-b,r); g.lineTo(-b,b); g.lineTo(-r,b); g.lineTo(-r,-b); g.lineTo(-b,-b);
      g.closePath(); }
  else if(forma==='estrella'){ for(let i=0;i<10;i++){ const a=-Math.PI/2+i/10*Math.PI*2, q=(i%2)? r*0.46 : r;
      i? g.lineTo(Math.cos(a)*q,Math.sin(a)*q) : g.moveTo(Math.cos(a)*q,Math.sin(a)*q); } g.closePath(); }
  else if(forma==='arco'){ g.arc(0,0,r,Math.PI*0.08,Math.PI*0.92); }
  if(soloLinea || forma==='arco') g.stroke(); else g.fill();
  g.restore();
}

function dibujarFondoImg(){
  const im=cargarFondo(fondoMundo||1);
  if(!im || !im.complete || !im.naturalWidth) return;
  const g=cx;
  /* la imagen se estira al ancho de la pantalla y sube MUY despacio: es lo mas lejos que hay */
  const alto=W*(im.naturalHeight/im.naturalWidth);
  const base=camY*0.020*U;
  let y0=((base % (alto*2)) + alto*2) % (alto*2) - alto*2;
  g.save();
  for(let y=y0; y<H+alto; y+=alto){
    const i=Math.round((y-y0)/alto);
    if(i%2===0){ g.drawImage(im, 0, y, W, alto); }
    else { g.save(); g.translate(0, y+alto); g.scale(1,-1); g.drawImage(im, 0, 0, W, alto); g.restore(); }
  }
  g.restore();
}
let fondo=null, fondoMundo=0;
function armarFondo(m){
  if(fondo && fondoMundo===m) return;
  fondoMundo=m; fondo=[];
  const R=rng(m*7717+331), ancho=MEDIO_MIN*2.7;
  for(const C of CAPAS){
    const it=[];
    for(let i=0;i<C.n;i++)
      it.push({ x:(R()*2-1)*ancho, y:R()*FONDO_ALTO, r:C.r[0]+R()*(C.r[1]-C.r[0]),
                f:R()*Math.PI*2, w:0.08+R()*0.22 });
    fondo.push(it);
  }
}
/* ===================== EL CLIMA =====================
   Una cosa en movimiento por mundo: niebla, polvo, arena, espuma, nieve, brasas, calor y aurora.
   LAS PARTICULAS VIVEN EN LA PANTALLA Y NO EN EL MUNDO, y es a proposito: el clima no es geometria
   —no hay que poder aprenderselo, ni tiene que ser igual en todos los telefonos— asi que se guarda
   en coordenadas de 0 a 1 y se envuelve por modulo. Ponerlo en unidades de mundo obligaria a toda
   la maquinaria de repeticion del parallax para algo que el jugador no mira nunca de frente.
   Lo unico que las ata al juego es un arrastre chico con la camara: sin eso se leen a calcomania
   pegada al vidrio. */
const CLIMA=['niebla','niebla','lunas','arena','agua','nieve','brasas','calor','aurora'];
let clima=null, climaMundo=-1;
function armarClima(m){
  if(clima && climaMundo===m) return;
  climaMundo=m; clima=[];
  const R=rng(m*3313+77), n=(CLIMA[m]==='aurora')? 34 : 62;
  for(let i=0;i<n;i++) clima.push({ x:R(), y:R(), r:R(), f:R()*6.283, v:0.35+R()*0.9 });
}
function dibujarClima(){
  const m=Math.max(0,Math.min(8,fondoMundo));
  armarClima(m);
  const t=CLIMA[m], g=cx, T=tiempo, arr=(camY*0.055)/Math.max(1,ALTO_CAM);
  const env=(v)=>((v%1)+1)%1;
  g.save();
  if(t==='nieve' || t==='arena' || t==='lunas'){
    const cae = t==='nieve'? 0.055 : (t==='arena'? 0.030 : 0.008);
    const lado= t==='arena'? 0.055 : 0.012;
    g.fillStyle = t==='arena'? 'rgba(150,130,100,0.20)' : 'rgba(120,140,160,0.26)';
    for(const p of clima){
      const yy=env(p.y + T*cae*p.v + arr)*1.12-0.06;
      const xx=env(p.x + T*lado*p.v)*1.12-0.06;
      const rr=(0.7+p.r*2.1)*(t==='nieve'?1.5:1)*Math.max(1,U*0.028);
      g.beginPath(); g.arc(xx*W, yy*H, rr, 0, 7); g.fill();
    }
  } else if(t==='brasas' || t==='calor'){
    const sube = t==='brasas'? -0.070 : -0.045;
    for(const p of clima){
      const yy=env(p.y + T*sube*p.v + arr)*1.12-0.06;
      const xx=env(p.x + Math.sin(T*0.5+p.f)*0.012)*1.12-0.06;
      const a=(t==='brasas'? 0.34 : 0.16)*(0.4+0.6*Math.sin(T*2.2+p.f)*0.5+0.5);
      g.fillStyle = t==='brasas'? 'rgba(217,105,90,'+a.toFixed(3)+')' : 'rgba(160,150,140,'+a.toFixed(3)+')';
      const rr=(0.6+p.r*1.7)*Math.max(1,U*0.026);
      g.beginPath(); g.arc(xx*W, yy*H, rr, 0, 7); g.fill();
      if(t==='brasas') estallido(xx*W, yy*H, rr*7, '217,105,90', a*0.34);
    }
  } else if(t==='agua'){
    g.strokeStyle='rgba(120,160,180,0.20)'; g.lineWidth=Math.max(1,U*0.020); g.lineCap='round';
    for(const p of clima){
      const yy=env(p.y + T*0.020*p.v + arr)*1.12-0.06;
      const xx=env(p.x + T*0.055*p.v)*1.2-0.10;
      const l=(0.05+p.r*0.13)*W;
      g.beginPath(); g.moveTo(xx*W, yy*H); g.lineTo(xx*W+l, yy*H); g.stroke();
    }
  } else if(t==='aurora'){
    /* la aurora son cintas y no puntos: seis curvas anchas que se ondulan y brillan. Es el unico
       clima que pasa por el bloom, y por eso el mundo 8 se siente distinto de los otros siete. */
    g.lineCap='round';
    for(let i=0;i<6;i++){
      const yb=(0.10+i*0.055)*H + Math.sin(T*0.34+i)*H*0.020 - camY*0.9;
      const a=0.10+0.07*Math.sin(T*0.7+i*1.3);
      g.strokeStyle='rgba(127,178,162,'+a.toFixed(3)+')';
      g.lineWidth=Math.max(3, H*(0.014+0.010*Math.sin(i*2.1)));
      g.beginPath();
      for(let q=0;q<=10;q++){
        const X=q/10*W, Y=yb + Math.sin(T*0.55 + q*0.7 + i)*H*0.028;
        q? g.lineTo(X,Y) : g.moveTo(X,Y);
      }
      g.stroke();
      estallido(W*0.5, yb, W*0.55, '127,178,162', a*0.55);
    }
  } else {
    /* niebla: bandas anchas y lentas. Casi no se ven, y esa es la idea */
    for(const p of clima){
      if(p.r>0.42) continue;
      const yy=env(p.y + T*0.010*p.v + arr)*1.12-0.06;
      const xx=env(p.x + T*0.016*p.v)*1.3-0.15;
      g.fillStyle='rgba(150,150,150,'+(0.030+p.r*0.045).toFixed(3)+')';
      g.beginPath();
      g.ellipse(xx*W, yy*H, W*(0.14+p.r*0.5), H*(0.012+p.r*0.030), 0, 0, 7);
      g.fill();
    }
  }
  g.restore();
}

function dibujarFondo(){
  if(!fondo) armarFondo(1);
  dibujarFondoImg();
  const g=cx, T=TINTE[Math.max(0,Math.min(TINTE.length-1, fondoMundo))];
  for(let c=0;c<CAPAS.length;c++){
    const C=CAPAS[c], base=camY*C.v, col=(c<2)? T[0] : T[1];
    g.strokeStyle=col; g.fillStyle=col; g.globalAlpha=C.a;
    g.lineWidth=Math.max(1, U*0.014);
    for(const o of fondo[c]){
      let yy=((o.y-base)%FONDO_ALTO+FONDO_ALTO)%FONDO_ALTO;
      if(yy>FONDO_ALTO*0.62) yy-=FONDO_ALTO;
      const Y=H*0.76 - yy*U;
      const r=o.r*U;
      if(Y<-r-40||Y>H+r+40) continue;
      const X=px(o.x) + Math.sin(tiempo*o.w+o.f)*U*C.v*0.55;
      /* CADA MUNDO DIBUJA OTRA FIGURA. Antes los ocho eran discos y aros y lo unico que cambiaba era
         un par de grises: dos mundos seguidos se veian iguales con el brillo apenas movido, o sea
         que avanzar no se notaba. Ahora el mundo 3 son triangulos y el 6 son hexagonos, y eso se
         nota de una ojeada sin leer un solo rotulo. */
      dibujarFig(g, X, Y, r, DECOR[Math.max(0,Math.min(DECOR.length-1,fondoMundo))],
                 C.forma==='aro', tiempo*0.10+o.f);
    }
  }
  g.globalAlpha=1;
  dibujarClima();
}
/* la pelusa va abajo del todo y no en el medio: lo que hay que mirar es lo que VIENE,
   asi que el papel de arriba es el que sirve. */
function py(y){ return H*0.76 - (y-camY)*U; }
addEventListener('resize', ajustar);

/* ===================== EL AZAR CON SEMILLA =====================
   Un nivel procedural que cambia cada vez que entras no es un nivel, es una tirada. Con semilla, el
   3 del mundo 2 es SIEMPRE el mismo 3 del mundo 2: se puede aprender, que es de lo que se trata. */
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a);
  t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ===================== LOS ROTORES =====================
   Todo el juego depende de que la posicion de una espina en un instante se pueda calcular sin
   simular nada: asi el validador que comprueba que el nivel se pueda pasar usa EXACTAMENTE la misma
   cuenta que el dibujo. Si fueran dos cuentas distintas, el validador estaria aprobando otro juego. */
function rotorAng(ro, t){
  if(ro.tipo==='vaiven') return ro.fase + ro.amp*Math.sin(ro.w*t);
  return ro.fase + ro.w*t;
}
function rotorRad(ro, t){
  if(ro.tipo==='pulso') return ro.r + ro.pa*Math.sin(ro.pw*t);
  return ro.r;
}
function rotorPos(ro, nodo, t, sal){
  const a=rotorAng(ro,t), r=rotorRad(ro,t);
  sal.x = nodo.x + Math.cos(a)*r;
  sal.y = nodo.y + Math.sin(a)*r;
  return sal;
}

/* ---------- LAS CINCO FORMAS ----------
   bola      · la de siempre
   doble     · la misma bola y su antipoda: el hueco pasa a ser medio anillo y no uno entero
   barra     · una helice de dos brazos que NO llega al centro (si llegara, aterrizar en el nodo
               seria chocar SIEMPRE, porque el nodo es el centro de giro)
   satelite  · una bola con una luna chica dando vueltas encima, mas rapido
   cometa    · la bola con tres bolitas de cola pegadas atras sobre la misma orbita

   TODAS PASAN POR chocaRotor Y POR NADA MAS. El validador que decide si un nivel se puede pasar y
   el choque de verdad llaman a esta misma funcion: si fueran dos cuentas, el validador estaria
   aprobando un juego que no existe. Es la razon por la que se puede afirmar que los 160 niveles se
   pasan sin jugarlos a mano. */
const R_BARRA=0.22, BARRA_IN=0.86, R_LUNA=0.20, R_COLA=0.34;
function d2Seg(x,y,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1e-9;
  let u=((x-ax)*dx+(y-ay)*dy)/L2; u=u<0?0:(u>1?1:u);
  const fx=x-(ax+dx*u), fy=y-(ay+dy*u);
  return fx*fx+fy*fy;
}
function chocaRotor(ro, nodo, t, x, y, rad){
  const a=rotorAng(ro,t), rr=rotorRad(ro,t), cs=Math.cos(a), sn=Math.sin(a);
  if(ro.forma==='barra'){
    const l2=(rad+R_BARRA)*(rad+R_BARRA), ex=cs*rr, ey=sn*rr,
          ix=cs*BARRA_IN, iy=sn*BARRA_IN;
    if(d2Seg(x,y, nodo.x+ix, nodo.y+iy, nodo.x+ex, nodo.y+ey) < l2) return true;
    if(d2Seg(x,y, nodo.x-ix, nodo.y-iy, nodo.x-ex, nodo.y-ey) < l2) return true;
    return false;
  }
  const lim=(rad+R_ESP)*(rad+R_ESP);
  const bx=nodo.x+cs*rr, by=nodo.y+sn*rr;
  let dx=x-bx, dy=y-by;
  if(dx*dx+dy*dy<lim) return true;
  if(ro.forma==='doble'){
    dx=x-(nodo.x-cs*rr); dy=y-(nodo.y-sn*rr);
    if(dx*dx+dy*dy<lim) return true;
  } else if(ro.forma==='satelite'){
    const la=a*3.4+ro.fase, l2=(rad+R_LUNA)*(rad+R_LUNA);
    dx=x-(bx+Math.cos(la)*R_ESP*1.55); dy=y-(by+Math.sin(la)*R_ESP*1.55);
    if(dx*dx+dy*dy<l2) return true;
  } else if(ro.forma==='cometa'){
    const sg=(ro.w<0)? 1 : -1;
    for(let i=1;i<=3;i++){
      const aa=a+sg*i*0.30, rc=R_COLA*(1-i*0.18), l2=(rad+rc)*(rad+rc);
      dx=x-(nodo.x+Math.cos(aa)*rr); dy=y-(nodo.y+Math.sin(aa)*rr);
      if(dx*dx+dy*dy<l2) return true;
    }
  }
  return false;
}

/* ===================== EL GENERADOR =====================
   Seis mundos, veinte niveles cada uno. Cada mundo agrega UNA idea y nada mas: dos lunas, dos
   radios, ida y vuelta, anillos que respiran. Meter todo en el mundo uno es la forma mas rapida de
   que nadie entienda ninguna. */
const MUNDOS=8, NIVELES=20;

/* ---------- EL TRAZADO ----------
   Cuatro formas de camino, y el mundo no elige una: eligen el mundo Y el nivel juntos, asi que
   dentro de un mundo los veinte no se parecen entre si. Un mundo entero de zigzag son veinte
   niveles que se sienten uno. */
const TRAZADOS=['zigzag','ancho','columna','espiral'];
/* la forma que ESTRENA cada mundo, declarada y no deducida. Sacandola de la lista de formas del
   mundo salian cuatro iconos iguales del 5 al 8, porque los cuatro terminan en la helice: el icono
   dejaba de ser noticia justo en la mitad del juego donde mas noticias hay. */
const ICONO_FORMA=['bola','bola','bola','doble','doble','barra','barra','satelite','cometa'];
function caminoDe(forma, R, saltos){
  const nodos=[{x:0,y:0}];
  let lado = R()<0.5? -1 : 1;
  for(let k=0;k<saltos;k++){
    const ant=nodos[nodos.length-1];
    let sep=SEP_MIN + R()*(SEP_MAX-SEP_MIN), nx;
    if(forma==='ancho'){ lado=-lado; nx=lado*(BANDA*(0.74+R()*0.26)); }
    else if(forma==='columna'){ nx=Math.max(-BANDA, Math.min(BANDA, ant.x+(R()*2-1)*0.80));
                                sep*=0.86; }
    else if(forma==='espiral'){ nx=Math.sin((k+1)*1.15+R()*0.22)*BANDA*0.92; }
    else { let dx=(R()*2-1)*(BANDA*1.55);
           if(Math.abs(ant.x+dx)>BANDA) dx=-dx*0.6;
           nx=Math.max(-BANDA, Math.min(BANDA, ant.x+dx)); }
    /* SIEMPRE SE SUBE. Con un salto casi horizontal la camara no acompana y el nivel se lee a
       pasillo; el paso de costado se paga alargando la separacion, no achatando la subida. */
    const hor=Math.abs(nx-ant.x);
    if(sep < hor+2.2) sep = hor+2.2;
    const dy=Math.sqrt(Math.max(0.6, sep*sep - hor*hor));
    nodos.push({x:nx, y:ant.y+dy});
  }
  return nodos;
}

function generar(mundo, nivel){
  const R=rng(mundo*1009 + nivel*7919 + 1013);
  const d=(nivel-1)/(NIVELES-1);                    // 0..1 dentro del mundo
  /* MAS SECTORES A MEDIDA QUE SE AVANZA. De 2-9 saltos a 3-13: el mundo 1 arranca en tres, que ya
     es un nivel y no una demostracion, y el ultimo del 8 son trece puntos seguidos. */
  const saltos=Math.min(13, 3 + Math.round(d*4) + Math.floor(mundo*0.75));
  const nodos=caminoDe(TRAZADOS[(mundo+nivel)%4], R, saltos);
  const anillos=[];
  for(let k=1;k<nodos.length;k++) anillos.push(anilloDe(R, mundo, d, k));
  /* LOS PREMIOS SE TIRAN AL FINAL Y NO EN EL MEDIO. El nivel entero sale de una semilla, asi que
     cualquier R() intercalado antes correria todos los numeros de atras y el 12 del mundo 4 pasaria
     a ser otro nivel. Al final, no toca nada de lo que ya se decidio.
     Y NUNCA EN EL PRIMER SALTO: un escudo regalado antes de haber arriesgado nada no se lee a
     premio, se lee a adorno. */
  const premios=[];
  for(let k=0;k<nodos.length;k++) premios.push(null);
  if(mundo>=2) for(let k=2;k<nodos.length;k++){
    const q=R();
    if(q<0.11) premios[k]='vida';
    else if(q<0.26) premios[k]='escudo';
  }
  const niv={ mundo, nivel, trazado:TRAZADOS[(mundo+nivel)%4], nodos, anillos, premios, ventanas:[] };
  ajustarDificultad(niv, mundo, d, R);
  return niv;
}

/* que formas se ha visto ya cada mundo. Se agregan de a UNA y nunca en el nivel 1: la forma nueva
   aparece cuando el jugador ya entendio el mundo, no cuando entra. */
const FORMAS_MUNDO=[['bola'],
  ['bola'],                                          // 1
  ['bola'],                                          // 2
  ['bola','doble'],                                  // 3
  ['bola','doble'],                                  // 4
  ['bola','doble','barra'],                          // 5
  ['bola','doble','barra'],                          // 6
  ['bola','satelite','cometa','barra'],              // 7
  ['bola','doble','satelite','cometa','barra']];     // 8
function formaDe(R, mundo, d, i){
  const P=FORMAS_MUNDO[Math.max(0,Math.min(FORMAS_MUNDO.length-1,mundo))];
  if(P.length===1 || d<0.18) return 'bola';
  return P[Math.floor(R()*P.length)];
}

function anilloDe(R, mundo, d, k){
  /* HASTA CUATRO POR SECTOR, y entran antes. Antes el cuarto no existia y el tercero recien
     aparecia en el mundo 6 pasado el 70% — o sea que catorce de los veinte niveles de casi todos los
     mundos tenian uno o dos y nada mas. */
  const cuantos = 1 + ((mundo>=2 && d>0.20)?1:0) + ((mundo>=3 && d>0.45)?1:0)
                    + ((mundo>=5 && d>0.35)?1:0) + ((mundo>=7 && d>0.60)?1:0);
  const base = 1.55 + mundo*0.17 + d*0.85;
  /* CUATRO RADIOS DISTINTOS Y NO DOS ALTERNADOS. Con el patron viejo (cerca, lejos, cerca, lejos) el
     tercero y el primero caian en la misma orbita: dos bolas girando sobre la misma circunferencia
     no son dos peligros, son uno con un hueco. */
  const RAD=[0.10, 0.44, 0.74, 0.98];
  const ro=[];
  for(let i=0;i<Math.min(4,cuantos);i++){
    let r = ORB_MIN + (ORB_MAX-ORB_MIN)*((mundo>=3)? RAD[i] + R()*0.06 : R());
    let tipo='fijo', amp=0, pa=0, pw=0;
    const forma=formaDe(R, mundo, d, i);
    /* la helice necesita orbita larga: sus brazos arrancan a 0,86 del centro y un brazo mas corto
       que eso no existe */
    if(forma==='barra') r=Math.max(r, 1.62);
    /* la luna orbita a 0,71 de su bola: con la bola mas cerca de 1,50 la luna pasa por encima del
       punto de llegada y el sector queda imposible */
    if(forma==='satelite') r=Math.max(r, 1.50);
    if(mundo>=4 && (i===0) && d>0.3){ tipo='vaiven'; amp=1.1+R()*1.5; }
    if(mundo>=5 && (i===(cuantos>1?1:0)) && d>0.2 && forma!=='barra'){
      tipo='pulso'; pa=0.28+R()*0.3; pw=0.9+R()*1.1;
      /* EL PULSO NO PUEDE COMERSE EL NODO. Si el radio minimo baja de 1,05 la bola pasa por encima
         del punto de llegada y aterrizar seria chocar siempre, gire como gire: el nivel quedaria
         imposible y el ajuste de dificultad -que solo toca la velocidad- no lo podria arreglar. */
      pa=Math.min(pa, Math.max(0, r-1.05));
      if(pa<0.05) tipo='fijo';
    }
    const w = (base*(0.82+R()*0.42)) * ((i%2)? -1 : 1);
    ro.push({ r, w, fase:R()*Math.PI*2, tipo, amp, pa, pw, forma });
  }
  return ro;
}

/* ---------- ¿SE PUEDE PASAR? ----------
   Se barren los instantes posibles de salida a lo largo de cuatro segundos y se simula el viaje
   entero con la misma cuenta que usa el dibujo. Sale la VENTANA MAS LARGA en la que se puede salir
   sano. Es el mismo criterio que en Maicol: un nivel generado y no comprobado es un nivel roto que
   todavia no se descubrio. */
/* El barrido y el paso de vuelo son un presupuesto, no un gusto: con ocho mundos, cinco formas y
   hasta once saltos, generar un nivel es lo que tarda en cargar. PASO_VUELO=1/220 sigue siendo casi
   cuatro veces mas fino que los 60 cuadros por segundo a los que corre el juego de verdad, o sea que
   el validador ve MAS que el jugador: si el se salva, el jugador se salva. El error va para el lado
   seguro por construccion. */
const BARRIDO=3.6, PASO_BARRIDO=1/96, PASO_VUELO=1/220;
/* el 12% de los instantes de salida tiene que servir. No alcanza con que EXISTA un hueco: el
   jugador no llega al sector en el segundo cero. */
const FRAC_MIN=0.12;
function velDe(mundo){ return 8.6 + mundo*0.42; }

function seguro(nodoA, nodoB, anillo, t0, vel){
  const dx=nodoB.x-nodoA.x, dy=nodoB.y-nodoA.y;
  const largo=Math.hypot(dx,dy), ux=dx/largo, uy=dy/largo;
  const T=largo/vel;
  for(let t=0;t<=T;t+=PASO_VUELO){
    const x=nodoA.x+ux*vel*t, y=nodoA.y+uy*vel*t;
    for(const ro of anillo) if(chocaRotor(ro, nodoB, t0+t, x, y, RP)) return false;
  }
  return true;
}

function ventana(nodoA, nodoB, anillo, vel){
  let mejor=0, actual=0, seguros=0, total=0;
  for(let t0=0;t0<BARRIDO;t0+=PASO_BARRIDO){
    total++;
    if(seguro(nodoA,nodoB,anillo,t0,vel)){ seguros++; actual+=PASO_BARRIDO; if(actual>mejor) mejor=actual; }
    else actual=0;
  }
  return { mejor, fraccion: seguros/Math.max(1,total) };
}

/* La ventana minima se achica de mundo en mundo, pero NUNCA baja de 90 ms: por debajo de eso deja de
   ser puntería y pasa a ser lotería, y este juego no es de lotería. */
function ventanaMinima(mundo, d){ return Math.max(0.090, 0.30 - mundo*0.021 - d*0.040); }

function ajustarDificultad(niv, mundo, d, R){
  const vel=velDe(mundo), min=ventanaMinima(mundo, d);
  for(let k=0;k<niv.anillos.length;k++){
    const A=niv.nodos[k], B=niv.nodos[k+1];
    let v=ventana(A,B,niv.anillos[k],vel), intentos=0;
    /* DEMASIADO DIFICIL: se aflojan las vueltas. Cambiar la fase no sirve — la ventana mas larga de
       un anillo no depende de donde arranca, depende de que tan rapido gira y cuantos son. */
    while((v.mejor<min || v.fraccion<FRAC_MIN) && intentos++<14){
      const a=niv.anillos[k];
      if(a.length>1 && intentos%4===0) a.pop();
      else for(const ro of a) ro.w*=0.88;
      v=ventana(A,B,a,vel);
    }
    /* LA RED DE SEGURIDAD. Aflojar la velocidad no arregla una geometria que TAPA el destino: por
       rapido o lento que gire, el hueco no existe. Si despues de todo eso el sector sigue sin servir
       se sacan rotores de a uno; si con uno solo tampoco alcanza, ese ultimo se vuelve una bola fija
       y se frena — pero CON PISO, porque una espina a 0,2 radianes por segundo tarda treinta
       segundos en dar la vuelta y eso no es un peligro, es un adorno. Y si ni asi, el sector queda
       vacio: un respiro es infinitamente mejor que un sector imposible. */
    while((v.mejor<min || v.fraccion<FRAC_MIN) && niv.anillos[k].length>1){
      niv.anillos[k].pop();
      v=ventana(A,B,niv.anillos[k],vel);
    }
    if((v.mejor<min || v.fraccion<FRAC_MIN) && niv.anillos[k].length){
      const ro=niv.anillos[k][0], W_MIN=0.55;
      ro.forma='bola'; ro.tipo='fijo'; ro.amp=0; ro.pa=0;
      ro.r=Math.max(ro.r, 1.45);
      let s2=0;
      while((v.mejor<min || v.fraccion<FRAC_MIN) && s2++<10 && Math.abs(ro.w)>W_MIN){
        ro.w*=0.80;
        if(Math.abs(ro.w)<W_MIN) ro.w=(ro.w<0? -W_MIN : W_MIN);
        v=ventana(A,B,niv.anillos[k],vel);
      }
      if(v.mejor<min || v.fraccion<FRAC_MIN){ niv.anillos[k].length=0;
        v=ventana(A,B,niv.anillos[k],vel); }
    }
    /* DEMASIADO FACIL: si se puede salir en cualquier momento no hay juego. Se aprieta hasta que
       haya peligro de verdad, sin pasarse del minimo. */
    let ap=0;
    while(v.fraccion>0.82 && ap++<7){
      const a=niv.anillos[k];
      for(const ro of a) ro.w*=1.12;
      const w2=ventana(A,B,a,vel);
      if(w2.mejor<min){ for(const ro of a) ro.w/=1.12; break; }
      v=w2;
    }
    niv.ventanas.push({ mejor:+v.mejor.toFixed(3), fraccion:+v.fraccion.toFixed(3) });
  }
}

/* ===================== LA PELUSA =====================
   El pelo es fisica de verdad y no un dibujo: cada mechon es una cadena de tres puntos con verlet,
   con gravedad y con el arrastre del cuerpo. Es lo que hace que al salir disparada el pelo se quede
   atras y al frenar se le venga encima — y eso, que no se puede animar a mano sin que se note, es la
   mitad de por que el bicho cae simpatico. */
/* MAS PELO Y MAS ARTICULADO: 118 mechones de cuatro tramos contra 62 de tres. El numero importa
   por una razon concreta: con 62 mechones sobre un circulo de 0,42 hay un mechon cada 6 grados y en
   el contorno se cuentan las cerdas de a una; con 118 el borde deja de ser un peine y pasa a ser
   pelusa, que es la palabra del titulo. Y con cuatro tramos el mechon puede formar una S -raiz
   tiesa, medio que sigue, punta que se atrasa- que con tres no entra. */
const PELOS=118, PELO_N=4, PELO_LARGO=0.082;
const GROSORES=[0.70,1.00,1.36];
const pelusa={
  x:0, y:0, vx:0, vy:0, ux:0, uy:0, en:0, viajando:false, t:0, T:0, ax:0, ay:0, bx:0, by:0,
  ang:0, sq:0, sqv:0, pelo:[], mira:0, parpadeo:2.0, sacude:0
};
function armarPelo(){
  pelusa.pelo.length=0;
  for(let i=0;i<PELOS;i++){
    const a=(i/PELOS)*Math.PI*2 + ((i*7)%5)*0.012;
    const p=[];
    for(let k=0;k<=PELO_N;k++){
      const rr=RP + k*PELO_LARGO;
      p.push({ x:pelusa.x+Math.cos(a)*rr, y:pelusa.y+Math.sin(a)*rr, px:0, py:0, init:false });
    }
    pelusa.pelo.push({ a, p, largo:PELO_LARGO*(0.70+((i*37)%17)/17*0.66), gr:i%3 });
  }
}
const PELO_G=-2.0, PELO_RIG=0.30, PELO_ROCE=0.885;
function peloTick(dt){
  /* DOS COSAS NUEVAS Y LAS DOS SALEN DE LA VELOCIDAD DEL CUERPO.
     1. VIENTO: el aire empuja al pelo para atras mientras la pelusa avanza. Sin esto el mechon solo
        se atrasa por inercia, y la inercia se agota en dos cuadros: el latigo dura un pestaneo y
        despues el pelo va tieso a 12 unidades por segundo, que es exactamente lo que no hace el pelo.
     2. LA RIGIDEZ AFLOJA CON LA VELOCIDAD: quieta, la pelusa es un cardo -las cerdas salen derechas-;
        disparada, se peina sola hacia atras. Es la misma cerda con menos ganas de volver. */
  const vel=Math.hypot(pelusa.vx,pelusa.vy);
  const wx=-pelusa.vx*0.010, wy=-pelusa.vy*0.010;
  const blando=1-Math.min(0.55, vel*0.055);
  for(const m of pelusa.pelo){
    const ang=m.a+pelusa.ang, cs=Math.cos(ang), sn=Math.sin(ang);
    const base=m.p[0];
    base.x = pelusa.x + cs*RP;
    base.y = pelusa.y + sn*RP;
    for(let k=1;k<m.p.length;k++){
      const q=m.p[k];
      if(!q.init){ q.px=q.x; q.py=q.y; q.init=true; }
      const vx=(q.x-q.px)*PELO_ROCE, vy=(q.y-q.py)*PELO_ROCE;
      q.px=q.x; q.py=q.y;
      q.x+=vx+wx*dt*60*0.016; q.y+=vy+wy*dt*60*0.016 + PELO_G*dt*dt;
    }
    /* dos pasadas de restriccion: con una el mechon se estira y se ve de goma */
    for(let it=0; it<2; it++){
      for(let k=1;k<m.p.length;k++){
        const a=m.p[k-1], b=m.p[k];
        let dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1e-6;
        const f=(l-m.largo)/l;
        b.x-=dx*f; b.y-=dy*f;
      }
      /* PELO Y NO BARBA. Con verlet a secas los mechones se caen todos para abajo y el bicho queda
         hecho una fregona: la gravedad es lo unico que los orienta. Un pelo REAL tiene rigidez —
         sale perpendicular a la piel y solo se dobla— asi que cada punto se tira hacia donde
         estaria el mechon tieso. La rigidez baja hacia la punta: la raiz casi no cede y la punta
         sigue al cuerpo, que es de donde sale el latigueo al salir disparada. */
      for(let k=1;k<m.p.length;k++){
        const q=m.p[k], rr=RP + k*m.largo;
        const ox=pelusa.x + cs*rr, oy=pelusa.y + sn*rr;
        const rig=(PELO_RIG/k)*blando;
        q.x += (ox-q.x)*rig; q.y += (oy-q.y)*rig;
      }
    }
  }
}

/* ===================== CUATRO VIDAS =====================
   El juego nacio SIN vidas a proposito -"de tranquilidad", fallar costaba volver a tocar y nada mas-
   y ahora las tiene porque el jugador las pidio. La forma de que no se peleen con el tono es que la
   vida no se pierda para siempre: quedarse sin las cuatro no es un game over, es volver al primer
   punto del mismo nivel con las cuatro otra vez. Lo unico que se pierde es el LIMPIO.
   Y hay dos premios que aparecen en algunos sectores: el escudo, que se come un golpe entero, y la
   vida, que devuelve una. Con eso un tramo de cinco saltos difíciles deja de ser un muro. */
const VIDAS_MAX=4;
let vidas=VIDAS_MAX, escudo=false, brillos=[], rastro=[];

const prog=(()=>{ try{ return JSON.parse(localStorage.getItem('pelusa_prog')||'{}'); }catch(e){ return {}; } })();
function guardar(){ try{ localStorage.setItem('pelusa_prog', JSON.stringify(prog)); }catch(e){} }
function clave(m,n){ return m+'-'+n; }
function hechoDe(m,n){ return prog[clave(m,n)]||0; }        // 0 nada, 1 pasado, 2 limpio
function mundoHechos(m){ let n=0; for(let k=1;k<=NIVELES;k++) if(hechoDe(m,k)) n++; return n; }
function mundoAbierto(m){ return m===1 || mundoHechos(m-1)>=Math.ceil(NIVELES*0.6); }
function nivelAbierto(m,n){ return n===1 || hechoDe(m,n-1)>0; }

/* ===================== LA TIENDA =====================
   Las motas se ganan pasando niveles y no se pueden comprar con nada: es la unica moneda y sale de
   jugar. Un nivel nuevo da 2, y darlo LIMPIO da 3 — o sea que pasarlo sin que te toquen vale una vez
   y media, que es lo unico que premia jugar bien en un juego sin puntaje ni reloj.
   Y no se puede farmear: se cobra la PRIMERA vez, y la mejora de "pasado" a "limpio" se cobra una
   sola vez tambien. Repetir un nivel es gratis y no da nada, que es como tiene que ser en un juego

/* EL GORRO SE DIBUJA POR CODIGO, como todo lo demas. No hay un solo asset en este archivo y no lo va
   a haber: nueve gorros como imagenes serian nueve descargas para nueve dibujos de treinta lineas.
   Y VA DERECHO, no gira con el cuerpo: un gorro que rota con la pelusa se lee a objeto pegado; uno
   que se queda arriba se lee a gorro. */
function dibujarGorro(g, r, id, tono){
  if(!id || id==='nada') return;
  const T=tono||'#24242B';
  g.save();
  g.lineCap='round'; g.lineJoin='round';
  if(id==='gorrito'){
    g.fillStyle=T; g.beginPath();
    g.moveTo(-r*0.72,-r*0.66); g.quadraticCurveTo(0,-r*1.86, r*0.72,-r*0.66); g.closePath(); g.fill();
    /* el vivo del gorro va redondeado: un fillRect blanco encima de una cabeza redonda se lee a
       barra pegada, no a gorro */
    g.fillStyle='#F7F6F3'; g.beginPath();
    g.ellipse(0,-r*0.70, r*0.80, r*0.19, 0, 0, 7); g.fill();
    g.beginPath(); g.arc(0,-r*1.72, r*0.20, 0, 7); g.fill();
  } else if(id==='cinta'){
    g.strokeStyle=T; g.lineWidth=r*0.22;
    g.beginPath(); g.arc(0,0, r*1.02, -Math.PI*0.92, -Math.PI*0.08); g.stroke();
  } else if(id==='mono'){
    g.fillStyle='#D9695A';
    for(const sg of [-1,1]){ g.beginPath();
      g.moveTo(0,-r*0.92); g.lineTo(sg*r*0.78,-r*1.34); g.lineTo(sg*r*0.78,-r*0.52); g.closePath(); g.fill(); }
    g.beginPath(); g.arc(0,-r*0.92, r*0.19, 0, 7); g.fill();
  } else if(id==='hoja'){
    g.strokeStyle='#3C5A3A'; g.lineWidth=r*0.11;
    g.beginPath(); g.moveTo(0,-r*0.82); g.lineTo(r*0.10,-r*1.26); g.stroke();
    g.fillStyle='#7FB2A2'; g.beginPath();
    g.moveTo(r*0.10,-r*1.26); g.quadraticCurveTo(r*0.86,-r*1.62, r*0.16,-r*1.90);
    g.quadraticCurveTo(-r*0.18,-r*1.52, r*0.10,-r*1.26); g.fill();
  } else if(id==='antenas'){
    g.strokeStyle=T; g.lineWidth=r*0.10;
    for(const sg of [-1,1]){ g.beginPath(); g.moveTo(sg*r*0.26,-r*0.86);
      g.quadraticCurveTo(sg*r*0.62,-r*1.50, sg*r*0.40,-r*1.86); g.stroke();
      g.fillStyle='#D9695A'; g.beginPath(); g.arc(sg*r*0.40,-r*1.92, r*0.19, 0, 7); g.fill(); }
  } else if(id==='flor'){
    g.fillStyle='#D9695A';
    for(let i=0;i<5;i++){ const a=-Math.PI/2 + i/5*Math.PI*2;
      g.beginPath(); g.ellipse(r*0.42+Math.cos(a)*r*0.30, -r*1.18+Math.sin(a)*r*0.30, r*0.24, r*0.18, a, 0, 7); g.fill(); }
    g.fillStyle='#F7F6F3'; g.beginPath(); g.arc(r*0.42,-r*1.18, r*0.15, 0, 7); g.fill();
  } else if(id==='corona'){
    g.fillStyle='#C79A2B'; g.beginPath();
    g.moveTo(-r*0.74,-r*0.82); g.lineTo(-r*0.74,-r*1.44); g.lineTo(-r*0.37,-r*1.06);
    g.lineTo(0,-r*1.66); g.lineTo(r*0.37,-r*1.06); g.lineTo(r*0.74,-r*1.44);
    g.lineTo(r*0.74,-r*0.82); g.closePath(); g.fill();
  } else if(id==='sombrero'){
    g.fillStyle=T;
    g.beginPath(); g.ellipse(0,-r*0.86, r*1.42, r*0.26, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(-r*0.62,-r*0.90); g.lineTo(-r*0.50,-r*1.72);
    g.lineTo(r*0.50,-r*1.72); g.lineTo(r*0.62,-r*0.90); g.closePath(); g.fill();
    g.fillStyle='#D9695A'; g.fillRect(-r*0.60,-r*1.10, r*1.20, r*0.20);
  }
  g.restore();
}
