let isPaused = false;
let isMuted = false;

function showPause(){
  if (typeof gameState !== 'undefined' && (gameState === 'menu' || gameState === 'gameover')) return;
  isPaused = true;
  document.getElementById('pauseMenu').classList.add('show');
}
function hidePause(){
  isPaused = false;
  document.getElementById('pauseMenu').classList.remove('show');
}
function restartGame(){
  hidePause();
  currentRound = 0;
  if (typeof roundEl !== 'undefined' && roundEl) roundEl.textContent = '0';
  const roundNumEl = document.getElementById('roundNum');
  if (roundNumEl) roundNumEl.textContent = '0';
  if (typeof bola !== 'undefined' && bola && bola.body){
    bola.body.position.set(0, TILE_Y + 5, 0);
    bola.body.velocity.set(0, 0, 0);
    bola.body.angularVelocity.set(0, 0, 0);
  }
  for (const t of tiles){
    if (!t.alive){
      t.alive = true;
      t.mesh.visible = true;
      if (t.body){
        t.body.position.set(t.wx, TILE_Y, t.wz);
        t.body.velocity.set(0,0,0);
        try { world.removeBody(t.body); } catch(e){}
        world.addBody(t.body);
      }
    }
  }
  if (typeof resetNPCs === 'function') resetNPCs();
  gameState = 'idle';
  setTimeout(() => { if (typeof startShowPhase === 'function') startShowPhase(); }, 500);
}
function exitToMenu(){
  hidePause();
  gameState = 'menu';
  juegoIniciado = false;
  document.getElementById('menu').classList.remove('hidden');
  document.body.classList.add('in-menu');
  renderer.domElement.style.filter = 'blur(12px) saturate(1.4) brightness(0.85)';
  if (typeof stopMusic === 'function') stopMusic();
}

document.getElementById('pauseBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (isPaused) hidePause(); else showPause();
});
document.getElementById('resumeBtn').addEventListener('click', hidePause);
document.getElementById('restartBtn').addEventListener('click', restartGame);
document.getElementById('exitBtn').addEventListener('click', exitToMenu);

document.getElementById('muteBtn').addEventListener('click', e => {
  e.stopPropagation();
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
  if (typeof audioCtx !== 'undefined' && audioCtx && typeof masterGain !== 'undefined' && masterGain){
    masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
  }
});

// =====================================================
// ROUND INDICATOR (fade in/out)
// =====================================================
let roundFadeTimer = null;
function showRoundIndicator(){
  const el = document.getElementById('roundIndicator');
  const numEl = document.getElementById('roundNum');
  if (!el || !numEl) return;
  numEl.textContent = currentRound;
  el.classList.add('show');
  if (roundFadeTimer) clearTimeout(roundFadeTimer);
  roundFadeTimer = setTimeout(() => { el.classList.remove('show'); }, 2200);
}

// =====================================================
// COLOR TARGET DISPLAY (single + double-color)
// =====================================================
function updateColorTarget(primaryIdx, secondaryIdx){
  const el = document.getElementById('colorTarget');
  const txt = document.getElementById('goToText');
  if (!el) return;
  const dict = i18nDict[currentLang];
  if (secondaryIdx == null || secondaryIdx < 0){
    const hex = '#' + COLORS[primaryIdx].hex.toString(16).padStart(6, '0');
    el.style.background = hex;
    el.style.boxShadow = `0 4px 14px ${hex}88, inset 0 0 0 2px rgba(255,255,255,0.35)`;
    if (txt){
      txt.textContent = dict.goTo + ' ' + dict.colors[primaryIdx];
      txt.style.opacity = '1';
    }
  } else {
    const hex1 = '#' + COLORS[primaryIdx].hex.toString(16).padStart(6, '0');
    const hex2 = '#' + COLORS[secondaryIdx].hex.toString(16).padStart(6, '0');
    el.style.background = `radial-gradient(circle at center, ${hex1} 0%, ${hex1} 38%, ${hex2} 50%, ${hex2} 100%)`;
    el.style.boxShadow = `0 4px 14px ${hex2}88, inset 0 0 0 2px rgba(255,255,255,0.35)`;
    if (txt){
      txt.innerHTML = dict.goTo + ' <b>' + dict.colors[primaryIdx] + '</b> + <b>' + dict.colors[secondaryIdx] + '</b>';
      txt.style.opacity = '1';
    }
  }
}
function hideGoToText(){
  const txt = document.getElementById('goToText');
  if (txt) txt.style.opacity = '0';
}
// =====================================================
// TUTORIAL INTERACTIVO
// =====================================================
const tutorialState = {
  active: false,
  step: 0,
  moved: 0,       // distancia movida con joystick
  jumped: false,
  cameraSwiped: false,
  watchedColor: false,
  watchStartTime: 0
};

const TUT_STEPS_ES = [
  { id: 'move',   title: 'MUEVE',     hint: 'Joystick izquierdo' },
  { id: 'jump',   title: 'SALTA',     hint: 'Botón derecho ↑' },
  { id: 'color',  title: 'TU COLOR',  hint: 'Mira el cuadro y ve a esos azulejos' },
  { id: 'done',   title: '¡LISTO!',   hint: 'Sobrevive las rondas' }
];
const TUT_STEPS_EN = [
  { id: 'move',   title: 'MOVE',      hint: 'Left joystick' },
  { id: 'jump',   title: 'JUMP',      hint: 'Right button ↑' },
  { id: 'color',  title: 'YOUR COLOR', hint: 'Look at the cube and go to those tiles' },
  { id: 'done',   title: 'READY!',    hint: 'Survive the rounds' }
];

function startTutorial(){
  tutorialState.active = true;
  tutorialState.step = 0;
  tutorialState.moved = 0;
  tutorialState.jumped = false;
  tutorialState.cameraSwiped = false;
  tutorialState.watchStartTime = 0;
  document.getElementById('tutorialUI').style.display = 'block';
  updateTutorialUI();
  // Demo color rojo (idx 0) para que el jugador vea como funciona
  updateColorTarget(0, -1);
  const phaseEl = document.getElementById('phase');
  if (phaseEl) phaseEl.textContent = currentLang === 'es' ? 'TUTORIAL' : 'TUTORIAL';
  const timerEl = document.getElementById('timer');
  if (timerEl) timerEl.textContent = '∞';
}

// Pistas de tutorial por plataforma (una cadena por plataforma)
const TUT_HINTS = {
  es: {
    move:  { pc: 'Teclas WASD o flechas', mobile: 'Joystick izquierdo' },
    jump:  { pc: 'Barra espaciadora',     mobile: 'Botón derecho ↑' },
    color: { pc: 'Mira el cuadro y ve a esos azulejos', mobile: 'Mira el cuadro y ve a esos azulejos' },
    done:  { pc: 'Sobrevive las rondas',  mobile: 'Sobrevive las rondas' }
  },
  en: {
    move:  { pc: 'WASD or arrow keys', mobile: 'Left joystick' },
    jump:  { pc: 'Spacebar',           mobile: 'Right button ↑' },
    color: { pc: 'Look at the cube and go to those tiles', mobile: 'Look at the cube and go to those tiles' },
    done:  { pc: 'Survive the rounds', mobile: 'Survive the rounds' }
  }
};
function updateTutorialUI(){
  const steps = currentLang === 'en' ? TUT_STEPS_EN : TUT_STEPS_ES;
  const cur = steps[tutorialState.step];
  if (!cur) return;
  document.getElementById('tutStepLabel').textContent =
    (currentLang === 'en' ? 'STEP ' : 'PASO ') + (tutorialState.step + 1) + '/' + steps.length;
  document.getElementById('tutInstruction').textContent = cur.title;
  const hintTbl = TUT_HINTS[currentLang] && TUT_HINTS[currentLang][cur.id];
  document.getElementById('tutHint').textContent = hintTbl ? hintTbl[platform] : cur.hint;
  document.getElementById('tutStartBtn').style.display = (cur.id === 'done') ? 'inline-block' : 'none';
}

function advanceTutorial(){
  tutorialState.step++;
  const steps = currentLang === 'en' ? TUT_STEPS_EN : TUT_STEPS_ES;
  if (tutorialState.step >= steps.length){
    tutorialState.step = steps.length - 1;
  }
  updateTutorialUI();
}

function updateTutorialProgress(dt){
  if (!tutorialState.active) return;
  const steps = currentLang === 'en' ? TUT_STEPS_EN : TUT_STEPS_ES;
  const cur = steps[tutorialState.step];
  if (!cur) return;
  
  if (cur.id === 'move'){
    // Detectar magnitud del joystick o teclas de movimiento (PC)
    const mag = Math.sqrt(joyInput.x * joyInput.x + joyInput.y * joyInput.y);
    const kbdMove = keys['w']||keys['a']||keys['s']||keys['d']||
                    keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright'];
    if (mag > 0.4 || kbdMove) tutorialState.moved += dt;
    if (tutorialState.moved > 0.6) advanceTutorial();
  } else if (cur.id === 'jump'){
    if (tutorialState.jumped) advanceTutorial();
  } else if (cur.id === 'camera'){
    if (tutorialState.cameraSwiped) advanceTutorial();
  } else if (cur.id === 'color'){
    // Esperar 1.5 segundos viendo el color
    if (tutorialState.watchStartTime === 0) tutorialState.watchStartTime = clock.getElapsedTime();
    if (clock.getElapsedTime() - tutorialState.watchStartTime > 1.5) advanceTutorial();
  }
}

function endTutorialAndStart(){
  // Fade negro
  const fade = document.createElement('div');
  fade.style.cssText = 'position:fixed; inset:0; background:#000; opacity:0; z-index:9999; pointer-events:none; transition:opacity 0.5s;';
  document.body.appendChild(fade);
  requestAnimationFrame(() => { fade.style.opacity = '1'; });
  
  setTimeout(() => {
    document.getElementById('tutorialUI').style.display = 'none';
    tutorialState.active = false;
    juegoIniciado = true;
    renderer.domElement.style.filter = 'none';
    startShowPhase();
    showKbdLegend();
    fade.style.opacity = '0';
    setTimeout(() => fade.remove(), 500);
  }, 600);
}

document.getElementById('tutSkipBtn').addEventListener('click', e => {
  e.stopPropagation();
  endTutorialAndStart();
});
document.getElementById('tutStartBtn').addEventListener('click', e => {
  e.stopPropagation();
  endTutorialAndStart();
});

// Hook jump y camera para detectar acciones
const _jumpBtnTut = document.getElementById('jumpBtn');
_jumpBtnTut.addEventListener('pointerdown', () => {
  if (tutorialState.active) tutorialState.jumped = true;
}, true);
const _camzoneTut = document.getElementById('camzone');
if (_camzoneTut){
  _camzoneTut.addEventListener('pointermove', () => {
    if (tutorialState.active) tutorialState.cameraSwiped = true;
  }, true);
}
// Por si el camera swipe es global
addEventListener('pointermove', e => {
  if (tutorialState.active && e.clientX > innerWidth / 2){
    tutorialState.cameraSwiped = true;
  }
}, true);

// =====================================================
// FIN TUTORIAL
// =====================================================

let juegoIniciado = false;
let menuTime = 0;
const menuEl = document.getElementById('menu');
document.getElementById('playBtn').addEventListener('click', () => {
  initAudio();
  startMusic();
  menuEl.classList.add('hidden');
  document.body.classList.remove('in-menu');
  renderer.domElement.style.filter = 'none';
  // En vez de iniciar directo, abrir el tutorial
  startTutorial();
});
// Aplicar blur al canvas mientras está el menú
renderer.domElement.style.filter = 'blur(12px) saturate(1.4) brightness(0.85)';
renderer.domElement.style.transition = 'filter 0.6s ease';
document.body.classList.add('in-menu');

refreshPlatformText();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
