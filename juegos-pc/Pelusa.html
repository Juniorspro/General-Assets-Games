<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pelusa</title>
<style>
  /* ===================== LO BLANCO =====================
     Una sola idea: casi todo es papel. Hay UN color y es el peligro, y hay una tinta y es la pelusa.
     Todo lo demas son grises de humo. Un juego "de tranquilidad" no se hace con musica suave sobre
     una pantalla llena: se hace sacando cosas hasta que lo unico que queda es lo que hay que mirar. */
  :root{
    --papel:#F7F6F3; --papel2:#EFEEEA;
    --tinta:#24242B; --humo:#C9C7C0; --humo2:#DEDCD6;
    --peligro:#D9695A; --calma:#7FB2A2;
    --esc:1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--papel2);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    color:var(--tinta); -webkit-user-select:none; user-select:none; touch-action:none; }
  #caja{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #lienzo{ display:block; background:var(--papel); }

  /* LOS PANELES SON TRANSLUCIDOS A PROPOSITO. Con el papel opaco encima, el fondo de capas se
     apagaba justo en la pantalla donde el jugador pasa mas tiempo mirando, y un menu sin nada
     moviendose detras se lee a formulario. Translucido, el mismo parallax que hay en el juego sigue
     corriendo debajo del menu, y la pelusa flota ahi con su pelo de verdad. */
  .pan{ position:absolute; inset:0; z-index:20; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(14px * var(--esc));
    background:rgba(247,246,243,0.87); padding:24px; text-align:center; }
  /* SIN backdrop-filter A PROPOSITO. Lo tenia y desenfocaba TODO lo de atras, la pelusa incluida:
     el unico personaje del juego se veia como una mancha. El velo solo ya separa el texto del
     fondo, y el fondo de capas ya esta al 45% de opacidad, que es su propio desenfoque. */
  #pIdioma, #pHistoria{ background:rgba(247,246,243,0.94); }
  /* EL MENU NO SE TAPA CON OPACIDAD PAREJA, SE TAPA CON UN DEGRADE. Con un velo parejo al 87% pasan
     dos cosas malas a la vez: el fondo de capas queda a la mitad de contraste en todas partes, y la
     pelusa que flota abajo se ve turbia. Con el velo cerrado en la franja del texto y abierto arriba
     y abajo, el titulo se lee con el contraste entero y el juego se ve moverse a los dos lados. */
  #pMenu{ background:linear-gradient(180deg, rgba(247,246,243,0.50) 0%,
    rgba(247,246,243,0.94) 22%, rgba(247,246,243,0.94) 58%, rgba(247,246,243,0.38) 100%); }
  .pan.ver{ display:flex; }
  .tit{ font-size:clamp(30px,7.4vmin,58px); font-weight:200; letter-spacing:.30em;
    margin-left:.30em; color:var(--tinta); }
  .sub{ font-size:max(11px,calc(12px * var(--esc))); font-weight:600; letter-spacing:.22em;
    color:var(--humo); text-transform:uppercase; }
  .bot{ appearance:none; border:1.4px solid var(--humo); background:transparent; color:var(--tinta);
    font:inherit; font-size:max(12px,calc(13px * var(--esc))); font-weight:700; letter-spacing:.18em;
    padding:13px 30px; border-radius:999px; cursor:pointer; transition:.18s ease;
    text-transform:uppercase; }
  .bot:hover{ border-color:var(--tinta); }
  .bot:active{ background:var(--tinta); color:var(--papel); }
  .bot.lleno{ background:var(--tinta); color:var(--papel); border-color:var(--tinta); }
  .fila{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* la rejilla de mundos: seis fichas, nada mas */
  #gMundos{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;
    width:min(560px,92%); max-height:74vh; overflow-y:auto; padding:2px; }
  @media (min-width:720px){ #gMundos{ grid-template-columns:repeat(4,minmax(0,1fr));
    width:min(880px,94%); } }
  .mundo{ border:1.4px solid var(--humo2); border-radius:18px; padding:16px 12px; cursor:pointer;
    background:var(--papel); transition:.18s ease; display:flex; flex-direction:column;
    align-items:center; gap:7px; }
  .mundo:hover{ border-color:var(--tinta); }
  .mundo .n{ font-size:max(9px,calc(10px * var(--esc))); letter-spacing:.24em; color:var(--humo);
    font-weight:700; }
  .mundo .nm{ font-size:max(13px,calc(15px * var(--esc))); font-weight:300; letter-spacing:.14em; }
  .mundo .pg{ font-size:max(9px,calc(10px * var(--esc))); color:var(--humo); letter-spacing:.14em; }
  .mundo.trabado{ opacity:.38; cursor:not-allowed; }
  .mundo .bolita{ width:34px; height:34px; }

  /* los veinte niveles */
  #gNiveles{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px;
    width:min(430px,92%); }
  .niv{ aspect-ratio:1; border:1.3px solid var(--humo2); border-radius:12px; background:var(--papel);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s ease;
    font-size:max(11px,calc(12px * var(--esc))); font-weight:600; color:var(--tinta); }
  .niv:hover{ border-color:var(--tinta); }
  .niv.hecho{ background:var(--tinta); color:var(--papel); border-color:var(--tinta); }
  .niv.limpio{ background:var(--calma); border-color:var(--calma); color:var(--papel); }
  .niv.trabado{ opacity:.3; cursor:not-allowed; }

  /* ===================== EL HUD =====================
     Tres cosas y ninguna mas: donde estas, cuanto falta, y como se sale. Un contador de vidas o un
     reloj serian exactamente lo contrario de lo que este juego dice ser. */
  #hud{ position:absolute; inset:0; z-index:10; pointer-events:none; }
  #arriba{ position:absolute; top:calc(14px * var(--esc)); left:0; right:0; display:flex;
    align-items:center; justify-content:center; gap:calc(12px * var(--esc)); }
  #donde{ font-size:max(10px,calc(11px * var(--esc))); font-weight:700; letter-spacing:.22em;
    color:var(--humo); }
  #barra{ width:min(190px,34%); height:3px; border-radius:9px; background:var(--humo2);
    overflow:hidden; }
  #barra i{ display:block; height:100%; width:0%; background:var(--tinta);
    transition:width .28s cubic-bezier(.2,.8,.2,1); }
  #salir{ position:absolute; top:calc(10px * var(--esc)); left:calc(12px * var(--esc));
    pointer-events:auto; width:36px; height:36px; border-radius:50%; border:1.3px solid var(--humo2);
    background:var(--papel); color:var(--humo); cursor:pointer; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  #salir:active{ color:var(--tinta); border-color:var(--tinta); }
  #son{ position:absolute; top:calc(10px * var(--esc)); right:calc(12px * var(--esc));
    pointer-events:auto; width:36px; height:36px; border-radius:50%; border:1.3px solid var(--humo2);
    background:var(--papel); color:var(--humo); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; }
  #son.mudo{ color:var(--humo2); }

  /* el cartel del tutorial: se explica haciendo, nunca antes */
  #tuto{ position:absolute; left:50%; bottom:12%; transform:translateX(-50%); z-index:14;
    display:none; flex-direction:column; align-items:center; gap:8px; width:86%; max-width:520px;
    text-align:center; pointer-events:none; }
  body.tutorial #tuto{ display:flex; }
  #tutoT{ font-size:max(14px,calc(17px * var(--esc))); font-weight:300; letter-spacing:.10em; }
  #tutoS{ font-size:max(11px,calc(12px * var(--esc))); font-weight:600; letter-spacing:.10em;
    color:var(--humo); line-height:1.6; }
  #tutoP{ width:120px; height:2px; background:var(--humo2); border-radius:9px; overflow:hidden; }
  #tutoP i{ display:block; height:100%; width:0%; background:var(--tinta); }

  /* el aviso del medio, que casi nunca aparece */
  #aviso{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); z-index:15;
    font-size:clamp(17px,4.4vmin,30px); font-weight:200; letter-spacing:.24em; margin-left:.24em;
    opacity:0; transition:opacity .35s ease; text-align:center; pointer-events:none; }
  #aviso.ver{ opacity:1; }

  #toque{ position:absolute; left:50%; bottom:calc(26px * var(--esc)); transform:translateX(-50%);
    z-index:12; font-size:max(10px,calc(11px * var(--esc))); font-weight:700; letter-spacing:.22em;
    color:var(--humo); opacity:0; transition:opacity .4s ease; pointer-events:none; }
  #toque.ver{ opacity:1; }

  #idBotones{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }

  /* ===================== LA HISTORIA =====================
     Cinco planos dibujados en un lienzo aparte. No hay una sola foto en todo el juego y no la va a
     haber: lo que da el tono es la MISMA tinta con la que se dibuja el juego, asi que la historia
     tiene que estar hecha con lo mismo o se lee pegada encima. */
  /* EL LIENZO SE ENCOGE POR LOS DOS LADOS. Con el ancho fijo y el alto libre, en una ventana baja
     -que es como se ve un telefono acostado, y como se ve media notebook- el plano ocupaba 300 px de
     los 460 y el texto y el boton se salian del panel. Un elemento reemplazado con max-width Y
     max-height respeta la proporcion solo, asi que el plano se achica entero en vez de deformarse. */
  #hL{ max-width:min(560px,94%); max-height:46vh; width:auto; height:auto; display:block; }
  #hT{ font-size:max(13px,calc(15px * var(--esc))); font-weight:300; letter-spacing:.10em;
    line-height:1.8; width:min(520px,92%); min-height:4.4em; color:var(--tinta); }
  #hP{ display:flex; gap:6px; }
  #hP b{ width:20px; height:2px; border-radius:9px; background:var(--humo2); display:block;
    transition:.3s ease; }
  #hP b.hay{ background:var(--tinta); width:30px; }
  #creditos{ position:absolute; bottom:8px; left:0; right:0; text-align:center;
    font-size:9px; letter-spacing:.24em; color:var(--humo2); }
</style>
</head>
<body>

<div id="caja">
  <canvas id="lienzo"></canvas>

  <div id="hud">
    <div id="arriba">
      <div id="donde">1 · 1</div>
      <div id="barra"><i></i></div>
    </div>
    <button id="salir">‹</button>
    <button id="son">♪</button>
    <div id="aviso"></div>
    <div id="toque"></div>
    <div id="tuto">
      <div id="tutoT"></div>
      <div id="tutoS"></div>
      <div id="tutoP"><i></i></div>
    </div>
  </div>

  <div id="pIdioma" class="pan ver">
    <div class="tit">PELUSA</div>
    <div class="sub">Language · Idioma · Idioma</div>
    <div id="idBotones"></div>
  </div>

  <div id="pHistoria" class="pan">
    <canvas id="hL" width="1040" height="470"></canvas>
    <div id="hT"></div>
    <div id="hP"></div>
    <button class="bot" id="hSaltar" data-i18n="saltar"></button>
  </div>

  <div id="pMenu" class="pan">
    <div class="tit">PELUSA</div>
    <div class="sub" data-i18n="sub"></div>
    <div style="height:6px"></div>
    <button class="bot lleno" id="bJugar" data-i18n="jugar"></button>
    <div class="fila">
      <button class="bot" id="bMundos" data-i18n="mundos"></button>
      <button class="bot" id="bCuento" data-i18n="cuento"></button>
      <button class="bot" id="bIdioma" data-i18n="idioma"></button>
    </div>
    <div id="creditos">REZONA</div>
  </div>

  <div id="pMundos" class="pan">
    <div class="sub" data-i18n="mundos"></div>
    <div id="gMundos"></div>
    <button class="bot" id="bVolver1" data-i18n="volver"></button>
  </div>

  <div id="pNiveles" class="pan">
    <div class="sub" id="tNiveles"></div>
    <div id="gNiveles"></div>
    <button class="bot" id="bVolver2" data-i18n="volver"></button>
  </div>

  <div id="pFin" class="pan">
    <div class="tit" data-i18n="finT"></div>
    <div class="sub" data-i18n="finS"></div>
    <button class="bot lleno" id="bFin" data-i18n="volver"></button>
  </div>
</div>

<script>
/* =========================================================================================
   PELUSA — un juego de tocar en el momento justo.

   LA REGLA, Y ES UNA SOLA: la pelusa esta pegada a un punto, hay una linea recta marcada hasta el
   punto siguiente, y alrededor de ese punto giran bolas con espinas. Se toca y sale. Si una espina
   la toca en el camino, vuelve. Nada mas que eso.

   POR QUE NO HAY RELOJ NI VIDAS: el pedido dice "de tranquilidad". Un contador de vidas convierte
   cada error en una perdida y eso es exactamente lo contrario. Fallar cuesta volver a tocar.
   ========================================================================================= */

/* ===================== LOS IDIOMAS =====================
   Arranca en INGLES y se elige antes que nada. Ni una cadena suelta en el codigo: una sola que se
   escape es la que el jugador va a ver en el idioma equivocado. */
const IDIOMAS=[['en','English'],['es','Español'],['pt','Português']];
let IDIOMA='en';
try{ const g=localStorage.getItem('pelusa_idioma'); if(g && IDIOMAS.some(i=>i[0]===g)) IDIOMA=g; }catch(e){}
const L={
 sub:{en:'tap at the right moment', es:'tocá en el momento justo', pt:'toque no momento certo'},
 jugar:{en:'PLAY', es:'JUGAR', pt:'JOGAR'},
 mundos:{en:'WORLDS', es:'MUNDOS', pt:'MUNDOS'},
 idioma:{en:'LANGUAGE', es:'IDIOMA', pt:'IDIOMA'},
 volver:{en:'BACK', es:'VOLVER', pt:'VOLTAR'},
 nivel:{en:'LEVEL', es:'NIVEL', pt:'NÍVEL'},
 mundo:{en:'WORLD', es:'MUNDO', pt:'MUNDO'},
 m1:{en:'FIRST BREATH', es:'PRIMER RESPIRO', pt:'PRIMEIRO FÔLEGO'},
 m2:{en:'TWO MOONS', es:'DOS LUNAS', pt:'DUAS LUAS'},
 m3:{en:'FAR AND NEAR', es:'LEJOS Y CERCA', pt:'LONGE E PERTO'},
 m4:{en:'THE TIDE', es:'LA MAREA', pt:'A MARÉ'},
 m5:{en:'BREATHING RINGS', es:'ANILLOS QUE RESPIRAN', pt:'ANÉIS QUE RESPIRAM'},
 m6:{en:'ALL AT ONCE', es:'TODO JUNTO', pt:'TUDO JUNTO'},
 m7:{en:'THE LONG WAY', es:'EL CAMINO LARGO', pt:'O CAMINHO LONGO'},
 m8:{en:'THE LAST WHITE', es:'EL ÚLTIMO BLANCO', pt:'O ÚLTIMO BRANCO'},
 saltar:{en:'SKIP', es:'SALTAR', pt:'PULAR'},
 cuento:{en:'STORY', es:'HISTORIA', pt:'HISTÓRIA'},
 h1:{en:'There was a small fluff at the bottom of everything, and everything above it was white.',
     es:'Había una pelusa chiquita en el fondo de todo, y todo lo que había encima era blanco.',
     pt:'Havia uma pelúcia pequenina no fundo de tudo, e tudo acima dela era branco.'},
 h2:{en:'A road of quiet points went up through that white, one hop at a time.',
     es:'Un camino de puntos callados subía por ese blanco, de un salto por vez.',
     pt:'Um caminho de pontos calados subia por esse branco, um salto de cada vez.'},
 h3:{en:'Around each point, thorns had learned to spin. They never stop, and they never hurry.',
     es:'Alrededor de cada punto, unas espinas aprendieron a girar. No paran nunca, y nunca se apuran.',
     pt:'Em volta de cada ponto, espinhos aprenderam a girar. Nunca param, e nunca têm pressa.'},
 h4:{en:'The fluff could not fly, or fight, or go back. It could only wait, and let go at the right moment.',
     es:'La pelusa no podía volar, ni pelear, ni volver. Sólo podía esperar y soltarse en el momento justo.',
     pt:'A pelúcia não podia voar, nem lutar, nem voltar. Só podia esperar e se soltar no momento certo.'},
 h5:{en:'It is still going up. This is that climb — take all the time you want.',
     es:'Todavía está subiendo. Esta es esa subida — tomate todo el tiempo que quieras.',
     pt:'Ela ainda está subindo. Esta é essa subida — leve o tempo que quiser.'},
 hecho:{en:'{n} of 20', es:'{n} de 20', pt:'{n} de 20'},
 trabado:{en:'finish the world before', es:'terminá el mundo anterior', pt:'termine o mundo anterior'},
 listo:{en:'DONE', es:'LISTO', pt:'PRONTO'},
 limpio:{en:'CLEAN', es:'LIMPIO', pt:'LIMPO'},
 tocaPC:{en:'CLICK OR SPACE', es:'CLIC O ESPACIO', pt:'CLIQUE OU ESPAÇO'},
 tocaMov:{en:'TAP ANYWHERE', es:'TOCÁ EN CUALQUIER LADO', pt:'TOQUE EM QUALQUER LUGAR'},
 finT:{en:'THAT IS ALL OF IT', es:'ESO FUE TODO', pt:'FOI TUDO'},
 finS:{en:'eight worlds, one hundred and sixty hops', es:'ocho mundos, ciento sesenta saltos', pt:'oito mundos, cento e sessenta saltos'},
 /* tutorial */
 t0:{en:'THIS IS YOU', es:'ESTA SOS VOS', pt:'ESTA É VOCÊ'},
 t0s:{en:'the dotted line is where you will go · tap and you go', es:'la línea de puntos es a dónde vas a ir · tocá y vas', pt:'a linha pontilhada é para onde você vai · toque e vai'},
 t1:{en:'WATCH THE SPIKES', es:'MIRÁ LAS ESPINAS', pt:'OLHE OS ESPINHOS'},
 t1s:{en:'they turn around the next point · wait until the way is clear, then tap', es:'giran alrededor del punto siguiente · esperá a que el camino esté libre y tocá', pt:'giram em volta do próximo ponto · espere o caminho ficar livre e toque'},
 t2:{en:'IF THEY TOUCH YOU, YOU COME BACK', es:'SI TE TOCAN, VOLVÉS', pt:'SE TE TOCAREM, VOCÊ VOLTA'},
 t2s:{en:'nothing else happens · there is no clock and there are no lives', es:'no pasa nada más · no hay reloj y no hay vidas', pt:'não acontece mais nada · não há relógio nem vidas'},
 t3:{en:'ONCE YOU LAND, THAT RING SLEEPS', es:'AL LLEGAR, ESE ANILLO SE DUERME', pt:'AO CHEGAR, ESSE ANEL DORME'},
 t3s:{en:'you are safe on a point · the danger is only on the way', es:'sobre un punto estás a salvo · el peligro es sólo el camino', pt:'sobre um ponto você está a salvo · o perigo é só o caminho'},
 t4:{en:'GET TO THE LAST ONE', es:'LLEGÁ AL ÚLTIMO', pt:'CHEGUE AO ÚLTIMO'},
 t4s:{en:'that is the whole game · take all the time you want', es:'ese es todo el juego · tomate todo el tiempo que quieras', pt:'esse é o jogo todo · leve o tempo que quiser'},
 aLimpio:{en:'CLEAN', es:'LIMPIO', pt:'LIMPO'},
 aBien:{en:'DONE', es:'LISTO', pt:'PRONTO'},
 aMundo:{en:'WORLD DONE', es:'MUNDO COMPLETO', pt:'MUNDO COMPLETO'}
};
function TX(k,v){ let s=(L[k]&&(L[k][IDIOMA]||L[k].en))||k;
  if(v) for(const p in v) s=s.split('{'+p+'}').join(v[p]);
  return s; }

/* ===================== QUE APARATO ES ESTE =====================
   Telefono solo si hay tactil Y el puntero es grueso: una notebook tactil tiene tactil y puntero
   fino, y ahi el texto de "tocá" seria mentira. */
function adivinar(){
  try{ const t=matchMedia('(pointer:coarse)').matches, d=('ontouchstart' in window)||navigator.maxTouchPoints>0;
       return (t&&d)? 'movil':'pc'; }catch(e){ return 'pc'; }
}
let plataf=adivinar();

/* ===================== EL MUNDO EN UNIDADES =====================
   La columna de juego mide 10 unidades de ancho SIEMPRE y la camara muestra 17,8 de alto. En un
   telefono 9:16 eso da exactamente los 10 de ancho; en una pantalla ancha la columna queda centrada
   con papel a los costados, que es como se ve un juego minimalista en un monitor y no un error. */
const ANCHO_COL=10, ALTO_CAM=17.8;
const RP=0.42;                 // el radio de la pelusa
const R_BOLA=0.26, R_ESP=0.46; // la bola mala y hasta donde llegan sus espinas (lo que choca)
const SEP_MIN=3.6, SEP_MAX=5.0;
const ORB_MIN=1.15, ORB_MAX=2.15;
const BANDA=2.30;                      // hasta donde se corre un nodo del centro
const MEDIO_MIN=BANDA+ORB_MAX+R_ESP+0.25;   // lo que hay que ver a cada lado, si o si

const lienzo=document.getElementById('lienzo');
const cx=lienzo.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1, esc=1, camY=0, camObj=0;

function ajustar(){
  const w=innerWidth, h=innerHeight;
  DPR=Math.min(devicePixelRatio||1, 2);
  lienzo.style.width=w+'px'; lienzo.style.height=h+'px';
  lienzo.width=Math.round(w*DPR); lienzo.height=Math.round(h*DPR);
  W=w; H=h;
  esc=Math.max(0.62, Math.min(1.18, h/860));
  document.documentElement.style.setProperty('--esc', esc.toFixed(3));
  /* LA ESCALA LA DECIDE EL LADO QUE APRIETA, Y LA GEOMETRIA NO SE TOCA. Un nivel con semilla tiene
     que ser el MISMO nivel en cualquier pantalla: si los nodos se corrieran para caber, el 12 del
     mundo 4 seria otro nivel en cada telefono. Asi que se aleja la camara.
     Medido: con los nodos en una banda de +-2,3 y una orbita de 2,15, hace falta ver 5,16 unidades a
     cada lado. En un telefono 9:19,5 la altura sola daria 4,11 y las bolas de la derecha quedaban
     cortadas por el borde. */
  U=Math.min(H/ALTO_CAM, W/(2*MEDIO_MIN));
}
let U=40;                     // pixeles por unidad
function px(x){ return W/2 + x*U; }

/* ===================== EL FONDO DE CAPAS =====================
   Cuatro capas a cuatro velocidades. Con UNA sola capa quieta detras, subir doce metros y subir uno
   se ven igual: no hay nada respecto de lo cual moverse, y entonces la pelusa no sube, la pantalla
   se desliza. Con cuatro, cada salto produce PARALAJE y eso es lo unico que da distancia en 2D.

   Y SE REPITE POR MODULO, no se genera sin fin. Un nivel del mundo 8 son 40 unidades de alto; una
   lista de discos que no se repita nunca serian cientos de objetos por nivel para algo que esta al
   4% de opacidad. Con la vuelta por modulo sobre 42 unidades -mas alto que la pantalla, que ve
   unas 18- la costura nunca cae adentro del cuadro. */
const FONDO_ALTO=42;
/* LAS OPACIDADES SE BAJARON DESPUES DE MIRAR UNA FOTO DEL JUEGO, no antes. Con 0,55 y 0,62 los
   discos lentos competian con la linea de puntos -que es el enunciado del nivel- y el cuadro se
   leia a burbujas. Un fondo tiene que poder taparse con el pulgar sin que se note que falta algo. */
const CAPAS=[{v:0.045,n:7, r:[1.50,3.00],forma:'disco',a:0.40},
             {v:0.130,n:12,r:[0.90,2.10],forma:'aro',  a:0.46},
             {v:0.300,n:17,r:[0.42,1.05],forma:'aro',  a:0.40},
             {v:0.560,n:24,r:[0.05,0.15],forma:'mota', a:0.34}];
/* un par de grises por mundo: el fondo cambia de temperatura y no de color. Un mundo verde y otro
   naranja en un juego que se llama "lo blanco" seria otro juego. */
const TINTE=[['#DCE0DE','#CBD3D0'],
             ['#DCE3E1','#C9D5D2'],
             ['#E2DCE6','#D0C7D7'],
             ['#E4DED4','#D5CCBD'],
             ['#D6E0E6','#C3D1DA'],
             ['#E6DED9','#D8CBC4'],
             ['#DCE0D6','#CAD1C1'],
             ['#E0DAE2','#CDC5D1'],
             ['#DAD8D4','#C5C2BC']];
let fondo=null, fondoMundo=0;
function armarFondo(m){
  if(fondo && fondoMundo===m) return;
  fondoMundo=m; fondo=[];
  const R=rng(m*7717+331), ancho=MEDIO_MIN*2.7;
  for(const C of CAPAS){
    const it=[];
    for(let i=0;i<C.n;i++)
      it.push({ x:(R()*2-1)*ancho, y:R()*FONDO_ALTO, r:C.r[0]+R()*(C.r[1]-C.r[0]),
                f:R()*Math.PI*2, w:0.08+R()*0.22 });
    fondo.push(it);
  }
}
function dibujarFondo(){
  if(!fondo) armarFondo(1);
  const g=cx, T=TINTE[Math.max(0,Math.min(TINTE.length-1, fondoMundo))];
  for(let c=0;c<CAPAS.length;c++){
    const C=CAPAS[c], base=camY*C.v, col=(c<2)? T[0] : T[1];
    g.strokeStyle=col; g.fillStyle=col; g.globalAlpha=C.a;
    g.lineWidth=Math.max(1, U*0.014);
    for(const o of fondo[c]){
      let yy=((o.y-base)%FONDO_ALTO+FONDO_ALTO)%FONDO_ALTO;
      if(yy>FONDO_ALTO*0.62) yy-=FONDO_ALTO;
      const Y=H*0.76 - yy*U;
      const r=o.r*U;
      if(Y<-r-40||Y>H+r+40) continue;
      const X=px(o.x) + Math.sin(tiempo*o.w+o.f)*U*C.v*0.55;
      g.beginPath(); g.arc(X,Y,r,0,7);
      if(C.forma==='aro') g.stroke(); else g.fill();
    }
  }
  g.globalAlpha=1;
}
/* la pelusa va abajo del todo y no en el medio: lo que hay que mirar es lo que VIENE,
   asi que el papel de arriba es el que sirve. */
function py(y){ return H*0.76 - (y-camY)*U; }
addEventListener('resize', ajustar);

/* ===================== EL AZAR CON SEMILLA =====================
   Un nivel procedural que cambia cada vez que entras no es un nivel, es una tirada. Con semilla, el
   3 del mundo 2 es SIEMPRE el mismo 3 del mundo 2: se puede aprender, que es de lo que se trata. */
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a);
  t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ===================== LOS ROTORES =====================
   Todo el juego depende de que la posicion de una espina en un instante se pueda calcular sin
   simular nada: asi el validador que comprueba que el nivel se pueda pasar usa EXACTAMENTE la misma
   cuenta que el dibujo. Si fueran dos cuentas distintas, el validador estaria aprobando otro juego. */
function rotorAng(ro, t){
  if(ro.tipo==='vaiven') return ro.fase + ro.amp*Math.sin(ro.w*t);
  return ro.fase + ro.w*t;
}
function rotorRad(ro, t){
  if(ro.tipo==='pulso') return ro.r + ro.pa*Math.sin(ro.pw*t);
  return ro.r;
}
function rotorPos(ro, nodo, t, sal){
  const a=rotorAng(ro,t), r=rotorRad(ro,t);
  sal.x = nodo.x + Math.cos(a)*r;
  sal.y = nodo.y + Math.sin(a)*r;
  return sal;
}

/* ---------- LAS CINCO FORMAS ----------
   bola      · la de siempre
   doble     · la misma bola y su antipoda: el hueco pasa a ser medio anillo y no uno entero
   barra     · una helice de dos brazos que NO llega al centro (si llegara, aterrizar en el nodo
               seria chocar SIEMPRE, porque el nodo es el centro de giro)
   satelite  · una bola con una luna chica dando vueltas encima, mas rapido
   cometa    · la bola con tres bolitas de cola pegadas atras sobre la misma orbita

   TODAS PASAN POR chocaRotor Y POR NADA MAS. El validador que decide si un nivel se puede pasar y
   el choque de verdad llaman a esta misma funcion: si fueran dos cuentas, el validador estaria
   aprobando un juego que no existe. Es la razon por la que se puede afirmar que los 160 niveles se
   pasan sin jugarlos a mano. */
const R_BARRA=0.22, BARRA_IN=0.86, R_LUNA=0.20, R_COLA=0.34;
function d2Seg(x,y,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1e-9;
  let u=((x-ax)*dx+(y-ay)*dy)/L2; u=u<0?0:(u>1?1:u);
  const fx=x-(ax+dx*u), fy=y-(ay+dy*u);
  return fx*fx+fy*fy;
}
function chocaRotor(ro, nodo, t, x, y, rad){
  const a=rotorAng(ro,t), rr=rotorRad(ro,t), cs=Math.cos(a), sn=Math.sin(a);
  if(ro.forma==='barra'){
    const l2=(rad+R_BARRA)*(rad+R_BARRA), ex=cs*rr, ey=sn*rr,
          ix=cs*BARRA_IN, iy=sn*BARRA_IN;
    if(d2Seg(x,y, nodo.x+ix, nodo.y+iy, nodo.x+ex, nodo.y+ey) < l2) return true;
    if(d2Seg(x,y, nodo.x-ix, nodo.y-iy, nodo.x-ex, nodo.y-ey) < l2) return true;
    return false;
  }
  const lim=(rad+R_ESP)*(rad+R_ESP);
  const bx=nodo.x+cs*rr, by=nodo.y+sn*rr;
  let dx=x-bx, dy=y-by;
  if(dx*dx+dy*dy<lim) return true;
  if(ro.forma==='doble'){
    dx=x-(nodo.x-cs*rr); dy=y-(nodo.y-sn*rr);
    if(dx*dx+dy*dy<lim) return true;
  } else if(ro.forma==='satelite'){
    const la=a*3.4+ro.fase, l2=(rad+R_LUNA)*(rad+R_LUNA);
    dx=x-(bx+Math.cos(la)*R_ESP*1.55); dy=y-(by+Math.sin(la)*R_ESP*1.55);
    if(dx*dx+dy*dy<l2) return true;
  } else if(ro.forma==='cometa'){
    const sg=(ro.w<0)? 1 : -1;
    for(let i=1;i<=3;i++){
      const aa=a+sg*i*0.30, rc=R_COLA*(1-i*0.18), l2=(rad+rc)*(rad+rc);
      dx=x-(nodo.x+Math.cos(aa)*rr); dy=y-(nodo.y+Math.sin(aa)*rr);
      if(dx*dx+dy*dy<l2) return true;
    }
  }
  return false;
}

/* ===================== EL GENERADOR =====================
   Seis mundos, veinte niveles cada uno. Cada mundo agrega UNA idea y nada mas: dos lunas, dos
   radios, ida y vuelta, anillos que respiran. Meter todo en el mundo uno es la forma mas rapida de
   que nadie entienda ninguna. */
const MUNDOS=8, NIVELES=20;

/* ---------- EL TRAZADO ----------
   Cuatro formas de camino, y el mundo no elige una: eligen el mundo Y el nivel juntos, asi que
   dentro de un mundo los veinte no se parecen entre si. Un mundo entero de zigzag son veinte
   niveles que se sienten uno. */
const TRAZADOS=['zigzag','ancho','columna','espiral'];
/* la forma que ESTRENA cada mundo, declarada y no deducida. Sacandola de la lista de formas del
   mundo salian cuatro iconos iguales del 5 al 8, porque los cuatro terminan en la helice: el icono
   dejaba de ser noticia justo en la mitad del juego donde mas noticias hay. */
const ICONO_FORMA=['bola','bola','bola','doble','doble','barra','barra','satelite','cometa'];
function caminoDe(forma, R, saltos){
  const nodos=[{x:0,y:0}];
  let lado = R()<0.5? -1 : 1;
  for(let k=0;k<saltos;k++){
    const ant=nodos[nodos.length-1];
    let sep=SEP_MIN + R()*(SEP_MAX-SEP_MIN), nx;
    if(forma==='ancho'){ lado=-lado; nx=lado*(BANDA*(0.74+R()*0.26)); }
    else if(forma==='columna'){ nx=Math.max(-BANDA, Math.min(BANDA, ant.x+(R()*2-1)*0.80));
                                sep*=0.86; }
    else if(forma==='espiral'){ nx=Math.sin((k+1)*1.15+R()*0.22)*BANDA*0.92; }
    else { let dx=(R()*2-1)*(BANDA*1.55);
           if(Math.abs(ant.x+dx)>BANDA) dx=-dx*0.6;
           nx=Math.max(-BANDA, Math.min(BANDA, ant.x+dx)); }
    /* SIEMPRE SE SUBE. Con un salto casi horizontal la camara no acompana y el nivel se lee a
       pasillo; el paso de costado se paga alargando la separacion, no achatando la subida. */
    const hor=Math.abs(nx-ant.x);
    if(sep < hor+2.2) sep = hor+2.2;
    const dy=Math.sqrt(Math.max(0.6, sep*sep - hor*hor));
    nodos.push({x:nx, y:ant.y+dy});
  }
  return nodos;
}

function generar(mundo, nivel){
  const R=rng(mundo*1009 + nivel*7919 + 1013);
  const d=(nivel-1)/(NIVELES-1);                    // 0..1 dentro del mundo
  const saltos=Math.min(11, 2 + Math.round(d*3) + Math.floor(mundo/2));
  const nodos=caminoDe(TRAZADOS[(mundo+nivel)%4], R, saltos);
  const anillos=[];
  for(let k=1;k<nodos.length;k++) anillos.push(anilloDe(R, mundo, d, k));
  const niv={ mundo, nivel, trazado:TRAZADOS[(mundo+nivel)%4], nodos, anillos, ventanas:[] };
  ajustarDificultad(niv, mundo, d, R);
  return niv;
}

/* que formas se ha visto ya cada mundo. Se agregan de a UNA y nunca en el nivel 1: la forma nueva
   aparece cuando el jugador ya entendio el mundo, no cuando entra. */
const FORMAS_MUNDO=[['bola'],
  ['bola'],                                          // 1
  ['bola'],                                          // 2
  ['bola','doble'],                                  // 3
  ['bola','doble'],                                  // 4
  ['bola','doble','barra'],                          // 5
  ['bola','doble','barra'],                          // 6
  ['bola','satelite','cometa','barra'],              // 7
  ['bola','doble','satelite','cometa','barra']];     // 8
function formaDe(R, mundo, d, i){
  const P=FORMAS_MUNDO[Math.max(0,Math.min(FORMAS_MUNDO.length-1,mundo))];
  if(P.length===1 || d<0.18) return 'bola';
  return P[Math.floor(R()*P.length)];
}

function anilloDe(R, mundo, d, k){
  const cuantos = 1 + ((mundo>=2 && d>0.25)?1:0) + ((mundo>=4 && d>0.55)?1:0) + ((mundo>=6 && d>0.7)?1:0);
  const base = 1.55 + mundo*0.17 + d*0.85;
  const ro=[];
  for(let i=0;i<Math.min(3,cuantos);i++){
    let r = ORB_MIN + (ORB_MAX-ORB_MIN)*((mundo>=3)? ((i%2)? 0.92 : 0.14) + R()*0.08 : R());
    let tipo='fijo', amp=0, pa=0, pw=0;
    const forma=formaDe(R, mundo, d, i);
    /* la helice necesita orbita larga: sus brazos arrancan a 0,86 del centro y un brazo mas corto
       que eso no existe */
    if(forma==='barra') r=Math.max(r, 1.62);
    if(mundo>=4 && (i===0) && d>0.3){ tipo='vaiven'; amp=1.1+R()*1.5; }
    if(mundo>=5 && (i===(cuantos>1?1:0)) && d>0.2 && forma!=='barra'){
      tipo='pulso'; pa=0.28+R()*0.3; pw=0.9+R()*1.1;
      /* EL PULSO NO PUEDE COMERSE EL NODO. Si el radio minimo baja de 1,05 la bola pasa por encima
         del punto de llegada y aterrizar seria chocar siempre, gire como gire: el nivel quedaria
         imposible y el ajuste de dificultad -que solo toca la velocidad- no lo podria arreglar. */
      pa=Math.min(pa, Math.max(0, r-1.05));
      if(pa<0.05) tipo='fijo';
    }
    const w = (base*(0.82+R()*0.42)) * ((i%2)? -1 : 1);
    ro.push({ r, w, fase:R()*Math.PI*2, tipo, amp, pa, pw, forma });
  }
  return ro;
}

/* ---------- ¿SE PUEDE PASAR? ----------
   Se barren los instantes posibles de salida a lo largo de cuatro segundos y se simula el viaje
   entero con la misma cuenta que usa el dibujo. Sale la VENTANA MAS LARGA en la que se puede salir
   sano. Es el mismo criterio que en Maicol: un nivel generado y no comprobado es un nivel roto que
   todavia no se descubrio. */
/* El barrido y el paso de vuelo son un presupuesto, no un gusto: con ocho mundos, cinco formas y
   hasta once saltos, generar un nivel es lo que tarda en cargar. PASO_VUELO=1/220 sigue siendo casi
   cuatro veces mas fino que los 60 cuadros por segundo a los que corre el juego de verdad, o sea que
   el validador ve MAS que el jugador: si el se salva, el jugador se salva. El error va para el lado
   seguro por construccion. */
const BARRIDO=3.6, PASO_BARRIDO=1/96, PASO_VUELO=1/220;
function velDe(mundo){ return 8.6 + mundo*0.42; }

function seguro(nodoA, nodoB, anillo, t0, vel){
  const dx=nodoB.x-nodoA.x, dy=nodoB.y-nodoA.y;
  const largo=Math.hypot(dx,dy), ux=dx/largo, uy=dy/largo;
  const T=largo/vel;
  for(let t=0;t<=T;t+=PASO_VUELO){
    const x=nodoA.x+ux*vel*t, y=nodoA.y+uy*vel*t;
    for(const ro of anillo) if(chocaRotor(ro, nodoB, t0+t, x, y, RP)) return false;
  }
  return true;
}

function ventana(nodoA, nodoB, anillo, vel){
  let mejor=0, actual=0, seguros=0, total=0;
  for(let t0=0;t0<BARRIDO;t0+=PASO_BARRIDO){
    total++;
    if(seguro(nodoA,nodoB,anillo,t0,vel)){ seguros++; actual+=PASO_BARRIDO; if(actual>mejor) mejor=actual; }
    else actual=0;
  }
  return { mejor, fraccion: seguros/Math.max(1,total) };
}

/* La ventana minima se achica de mundo en mundo, pero NUNCA baja de 90 ms: por debajo de eso deja de
   ser puntería y pasa a ser lotería, y este juego no es de lotería. */
function ventanaMinima(mundo, d){ return Math.max(0.090, 0.30 - mundo*0.021 - d*0.040); }

function ajustarDificultad(niv, mundo, d, R){
  const vel=velDe(mundo), min=ventanaMinima(mundo, d);
  for(let k=0;k<niv.anillos.length;k++){
    const A=niv.nodos[k], B=niv.nodos[k+1];
    let v=ventana(A,B,niv.anillos[k],vel), intentos=0;
    /* DEMASIADO DIFICIL: se aflojan las vueltas. Cambiar la fase no sirve — la ventana mas larga de
       un anillo no depende de donde arranca, depende de que tan rapido gira y cuantos son. */
    while(v.mejor<min && intentos++<12){
      const a=niv.anillos[k];
      if(a.length>1 && intentos%5===0) a.pop();
      else for(const ro of a) ro.w*=0.88;
      v=ventana(A,B,a,vel);
    }
    /* DEMASIADO FACIL: si se puede salir en cualquier momento no hay juego. Se aprieta hasta que
       haya peligro de verdad, sin pasarse del minimo. */
    let ap=0;
    while(v.fraccion>0.82 && ap++<7){
      const a=niv.anillos[k];
      for(const ro of a) ro.w*=1.12;
      const w2=ventana(A,B,a,vel);
      if(w2.mejor<min){ for(const ro of a) ro.w/=1.12; break; }
      v=w2;
    }
    niv.ventanas.push({ mejor:+v.mejor.toFixed(3), fraccion:+v.fraccion.toFixed(3) });
  }
}

/* ===================== LA PELUSA =====================
   El pelo es fisica de verdad y no un dibujo: cada mechon es una cadena de tres puntos con verlet,
   con gravedad y con el arrastre del cuerpo. Es lo que hace que al salir disparada el pelo se quede
   atras y al frenar se le venga encima — y eso, que no se puede animar a mano sin que se note, es la
   mitad de por que el bicho cae simpatico. */
/* MAS PELO Y MAS ARTICULADO: 118 mechones de cuatro tramos contra 62 de tres. El numero importa
   por una razon concreta: con 62 mechones sobre un circulo de 0,42 hay un mechon cada 6 grados y en
   el contorno se cuentan las cerdas de a una; con 118 el borde deja de ser un peine y pasa a ser
   pelusa, que es la palabra del titulo. Y con cuatro tramos el mechon puede formar una S -raiz
   tiesa, medio que sigue, punta que se atrasa- que con tres no entra. */
const PELOS=118, PELO_N=4, PELO_LARGO=0.082;
const GROSORES=[0.70,1.00,1.36];
const pelusa={
  x:0, y:0, vx:0, vy:0, ux:0, uy:0, en:0, viajando:false, t:0, T:0, ax:0, ay:0, bx:0, by:0,
  ang:0, sq:0, sqv:0, pelo:[], mira:0, parpadeo:2.0, sacude:0
};
function armarPelo(){
  pelusa.pelo.length=0;
  for(let i=0;i<PELOS;i++){
    const a=(i/PELOS)*Math.PI*2 + ((i*7)%5)*0.012;
    const p=[];
    for(let k=0;k<=PELO_N;k++){
      const rr=RP + k*PELO_LARGO;
      p.push({ x:pelusa.x+Math.cos(a)*rr, y:pelusa.y+Math.sin(a)*rr, px:0, py:0, init:false });
    }
    pelusa.pelo.push({ a, p, largo:PELO_LARGO*(0.70+((i*37)%17)/17*0.66), gr:i%3 });
  }
}
const PELO_G=-2.0, PELO_RIG=0.30, PELO_ROCE=0.885;
function peloTick(dt){
  /* DOS COSAS NUEVAS Y LAS DOS SALEN DE LA VELOCIDAD DEL CUERPO.
     1. VIENTO: el aire empuja al pelo para atras mientras la pelusa avanza. Sin esto el mechon solo
        se atrasa por inercia, y la inercia se agota en dos cuadros: el latigo dura un pestaneo y
        despues el pelo va tieso a 12 unidades por segundo, que es exactamente lo que no hace el pelo.
     2. LA RIGIDEZ AFLOJA CON LA VELOCIDAD: quieta, la pelusa es un cardo -las cerdas salen derechas-;
        disparada, se peina sola hacia atras. Es la misma cerda con menos ganas de volver. */
  const vel=Math.hypot(pelusa.vx,pelusa.vy);
  const wx=-pelusa.vx*0.010, wy=-pelusa.vy*0.010;
  const blando=1-Math.min(0.55, vel*0.055);
  for(const m of pelusa.pelo){
    const ang=m.a+pelusa.ang, cs=Math.cos(ang), sn=Math.sin(ang);
    const base=m.p[0];
    base.x = pelusa.x + cs*RP;
    base.y = pelusa.y + sn*RP;
    for(let k=1;k<m.p.length;k++){
      const q=m.p[k];
      if(!q.init){ q.px=q.x; q.py=q.y; q.init=true; }
      const vx=(q.x-q.px)*PELO_ROCE, vy=(q.y-q.py)*PELO_ROCE;
      q.px=q.x; q.py=q.y;
      q.x+=vx+wx*dt*60*0.016; q.y+=vy+wy*dt*60*0.016 + PELO_G*dt*dt;
    }
    /* dos pasadas de restriccion: con una el mechon se estira y se ve de goma */
    for(let it=0; it<2; it++){
      for(let k=1;k<m.p.length;k++){
        const a=m.p[k-1], b=m.p[k];
        let dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1e-6;
        const f=(l-m.largo)/l;
        b.x-=dx*f; b.y-=dy*f;
      }
      /* PELO Y NO BARBA. Con verlet a secas los mechones se caen todos para abajo y el bicho queda
         hecho una fregona: la gravedad es lo unico que los orienta. Un pelo REAL tiene rigidez —
         sale perpendicular a la piel y solo se dobla— asi que cada punto se tira hacia donde
         estaria el mechon tieso. La rigidez baja hacia la punta: la raiz casi no cede y la punta
         sigue al cuerpo, que es de donde sale el latigueo al salir disparada. */
      for(let k=1;k<m.p.length;k++){
        const q=m.p[k], rr=RP + k*m.largo;
        const ox=pelusa.x + cs*rr, oy=pelusa.y + sn*rr;
        const rig=(PELO_RIG/k)*blando;
        q.x += (ox-q.x)*rig; q.y += (oy-q.y)*rig;
      }
    }
  }
}

/* ===================== EL ESTADO ===================== */
let pant='idioma';            // idioma | menu | mundos | niveles | juego | fin
let mundoAct=1, nivelAct=1, nivel=null, tiempo=0, intentos=0, limpio=true;
let jugando=false, terminado=0, sacudon=0, chispas=[], ondas=[];
let tutoPaso=0, tutoT=0, tutoListo=true, tutoSalio=0, tutoChoques=0;

const prog=(()=>{ try{ return JSON.parse(localStorage.getItem('pelusa_prog')||'{}'); }catch(e){ return {}; } })();
function guardar(){ try{ localStorage.setItem('pelusa_prog', JSON.stringify(prog)); }catch(e){} }
function clave(m,n){ return m+'-'+n; }
function hechoDe(m,n){ return prog[clave(m,n)]||0; }        // 0 nada, 1 pasado, 2 limpio
function mundoHechos(m){ let n=0; for(let k=1;k<=NIVELES;k++) if(hechoDe(m,k)) n++; return n; }
function mundoAbierto(m){ return m===1 || mundoHechos(m-1)>=Math.ceil(NIVELES*0.6); }
function nivelAbierto(m,n){ return n===1 || hechoDe(m,n-1)>0; }

/* ===================== EL SONIDO =====================
   Procedural y suave: senos con ataque lento sobre una escala pentatonica, que es la escala en la
   que cualquier nota suena bien con cualquier otra. En un juego de tocar cien veces, dos notas que
   chocan se vuelven insoportables a la tercera partida. */
const AUD={ ctx:null, on:true };
function audioIniciar(){
  if(AUD.ctx) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  let ctx; try{ ctx=new C(); }catch(e){ return; }
  AUD.ctx=ctx;
  const m=ctx.createGain(); m.gain.value=0.0; m.connect(ctx.destination);
  m.gain.linearRampToValueAtTime(0.9, ctx.currentTime+1.2);
  const conv=ctx.createConvolver();
  const seg=2.2, n=Math.floor(ctx.sampleRate*seg), ir=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){ const dd=ir.getChannelData(c);
    for(let i=0;i<n;i++){ const t=i/n; dd[i]=(Math.random()*2-1)*Math.pow(1-t,2.8)*(t<0.002?t/0.002:1); } }
  conv.buffer=ir;
  const env=ctx.createGain(); env.gain.value=0.5; env.connect(conv); conv.connect(m);
  const seco=ctx.createGain(); seco.gain.value=0.75; seco.connect(m);
  try{ const an=ctx.createAnalyser(); an.fftSize=2048; m.connect(an); AUD.an=an;
       AUD.buf=new Float32Array(an.fftSize); }catch(e){}
  AUD.maestro=m; AUD.seco=seco; AUD.envio=env;
  musicaIniciar();
}
/* ===================== LA MUSICA =====================
   Un acorde que no termina nunca. No hay compas, no hay tambor y no hay melodia: cuatro senos en
   fundamental, quinta, octava y novena, cada uno DOBLADO y desafinado un 0,23 por mil respecto de su
   gemelo. Ese desajuste minusculo es todo el truco: dos senos identicos suenan a tono de prueba de
   audio, y dos que baten cada pocos segundos suenan a instrumento.
   Encima, un filtro pasabajos que se abre y se cierra a 0,055 Hz -una vuelta cada dieciocho
   segundos- que es lo que hace que respire en vez de zumbar.
   Y el volumen es 0,052, o sea la mitad de lo que suena una nota del juego: la musica tiene que
   quedar POR DEBAJO del sonido de llegar a un punto, porque llegar a un punto es la recompensa. */
const MUS_VOL=0.052;
const RAIZ_MUNDO=[0,0,-2,3,5,-4,2,7,-5];
const MUS={ voces:[], g:null, filtro:null, raiz:0, t:0, prox:5 };
function musicaIniciar(){
  if(!AUD.ctx || MUS.g) return;
  const ctx=AUD.ctx;
  const g=ctx.createGain(); g.gain.value=0.0001;
  const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520; f.Q.value=0.55;
  g.connect(f); f.connect(AUD.maestro);
  const lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.055;
  const lg=ctx.createGain(); lg.gain.value=210;
  lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  let i=0;
  for(const s of [0,7,12,19]) for(const dd of [1, 1.0023]){
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.value=130.81*Math.pow(2,s/12)*dd;
    const og=ctx.createGain(); og.gain.value=0.26/(1+i*0.14);
    o.connect(og); og.connect(g); o.start();
    MUS.voces.push({o, s, dd}); i++;
  }
  /* cuatro segundos y medio de entrada. Que la musica APAREZCA se nota; que empiece, no. */
  g.gain.setValueAtTime(0.0001, ctx.currentTime);
  g.gain.linearRampToValueAtTime(MUS_VOL, ctx.currentTime+4.5);
  MUS.g=g; MUS.filtro=f;
}
function musicaVol(v){
  if(!MUS.g||!AUD.ctx) return;
  MUS.g.gain.cancelScheduledValues(AUD.ctx.currentTime);
  MUS.g.gain.setValueAtTime(Math.max(0.0001,MUS.g.gain.value), AUD.ctx.currentTime);
  MUS.g.gain.linearRampToValueAtTime(Math.max(0.0001,v), AUD.ctx.currentTime+0.8);
}
/* CADA MUNDO CAMBIA DE RAIZ Y NO DE TEMA. Ocho temas distintos en un juego de tranquilidad son ocho
   cortes; la misma tela transportada se siente otro lugar sin que nada se corte. Y el traslado tarda
   tres segundos, asi que no hay un instante en el que suene el salto de tono. */
function musicaMundo(m){
  if(!MUS.g||!AUD.ctx) return;
  const r=RAIZ_MUNDO[Math.max(0,Math.min(RAIZ_MUNDO.length-1,m))];
  if(r===MUS.raiz) return;
  MUS.raiz=r;
  const t=AUD.ctx.currentTime;
  for(const v of MUS.voces)
    v.o.frequency.linearRampToValueAtTime(130.81*Math.pow(2,(v.s+r)/12)*v.dd, t+3.0);
}
function musicaTick(dt){
  if(!MUS.g||!AUD.on) return;
  MUS.t+=dt;
  if(MUS.t>=MUS.prox){
    MUS.t=0; MUS.prox=4.5+Math.random()*6.5;
    nota(PENTA[Math.floor(Math.random()*7)]+MUS.raiz+12, 3.0, 0.028);
  }
}

const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
function nota(semi, dur, vol, tipo){
  if(!AUD.ctx||!AUD.on) return;
  const ctx=AUD.ctx, t=ctx.currentTime;
  const f=261.63*Math.pow(2, semi/12);
  const o=ctx.createOscillator(); o.type=tipo||'sine'; o.frequency.value=f;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AUD.seco);
  const e=ctx.createGain(); e.gain.value=0.9; g.connect(e); e.connect(AUD.envio);
  o.start(t); o.stop(t+dur+0.03);
}
function son(tipo, k){
  if(!AUD.ctx||!AUD.on) return;
  try{
    if(tipo==='salta'){ nota(PENTA[Math.min(PENTA.length-1, k||0)]+12, 0.5, 0.13); }
    else if(tipo==='llega'){ const s=PENTA[Math.min(PENTA.length-1,(k||0)+1)];
      nota(s+12,0.7,0.16); nota(s+19,0.55,0.07); }
    else if(tipo==='choque'){
      const ctx=AUD.ctx, t=ctx.currentTime;
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(220,t);
      o.frequency.exponentialRampToValueAtTime(90,t+0.22);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
      o.connect(g); g.connect(AUD.seco); o.start(t); o.stop(t+0.34);
    }
    else if(tipo==='nivel'){ [0,4,7,12].forEach((s,i)=>setTimeout(()=>nota(s+12,1.3,0.13), i*95)); }
    else if(tipo==='mundo'){ [0,7,12,16,19].forEach((s,i)=>setTimeout(()=>nota(s+12,1.8,0.12), i*130)); }
    else if(tipo==='toque'){ nota(PENTA[3]+24, 0.22, 0.05); }
  }catch(e){}
}

/* ===================== JUGAR ===================== */
let vioHistoria=false;
function cargarNivel(m,n){
  mundoAct=m; nivelAct=n;
  armarFondo(m); musicaMundo(m);
  nivel=generar(m,n);
  pelusa.en=0; pelusa.viajando=false;
  pelusa.x=nivel.nodos[0].x; pelusa.y=nivel.nodos[0].y;
  pelusa.vx=pelusa.vy=0; pelusa.sq=0; pelusa.sqv=0; pelusa.ang=0;
  for(const m2 of pelusa.pelo) for(const q of m2.p) q.init=false;
  camY=pelusa.y; camObj=pelusa.y;
  tiempo=0; intentos=0; limpio=true; terminado=0; chispas.length=0; ondas.length=0;
  jugando=true;
  const esTuto = (m===1 && n===1);
  tutoListo=!esTuto; tutoPaso=0; tutoT=0; tutoSalio=0; tutoChoques=0;
  document.body.classList.toggle('tutorial', esTuto);
  pintarHud();
  verPantalla('juego');
  avisoToque(true);
}
function saltar(){
  if(!jugando || pelusa.viajando || terminado) return;
  const A=nivel.nodos[pelusa.en], B=nivel.nodos[pelusa.en+1];
  if(!B) return;
  const dx=B.x-A.x, dy=B.y-A.y, l=Math.hypot(dx,dy);
  pelusa.ax=A.x; pelusa.ay=A.y; pelusa.bx=B.x; pelusa.by=B.y;
  pelusa.T=l/velDe(mundoAct); pelusa.t=0; pelusa.viajando=true; pelusa.t0=tiempo;
  pelusa.sqv=-7.5;                       // se estira al salir
  son('salta', pelusa.en);
  tutoSalio++;
  camObj=B.y;
  avisoToque(false);
  ondas.push({x:A.x, y:A.y, r:0, v:1});
}
function chocar(){
  intentos++; limpio=false; tutoChoques++;
  pelusa.viajando=false;
  const A=nivel.nodos[pelusa.en];
  pelusa.x=A.x; pelusa.y=A.y; pelusa.sqv=9.5; pelusa.sacude=0.42;
  sacudon=0.34;
  camObj=A.y;
  son('choque');
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, v=1.6+Math.random()*2.6;
    chispas.push({x:pelusa.x, y:pelusa.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0, T:0.5+Math.random()*0.3});
  }
  avisoToque(true);
}
function llegar(){
  pelusa.viajando=false;
  pelusa.en++;
  const B=nivel.nodos[pelusa.en];
  pelusa.x=B.x; pelusa.y=B.y; pelusa.sqv=6.2;
  /* EL ANILLO SE DUERME AL LLEGAR. Sin esto, pararse en un punto seria pararse adentro de un
     molinete: el peligro tiene que ser el camino y nada mas que el camino. */
  const an=nivel.anillos[pelusa.en-1];
  if(an) for(const ro of an) ro.duerme=0.0001;
  son('llega', pelusa.en);
  ondas.push({x:B.x, y:B.y, r:0, v:1});
  camObj=B.y;
  pintarHud();
  if(pelusa.en>=nivel.nodos.length-1) completar();
  else avisoToque(true);
}
function completar(){
  terminado=1;
  const antes=hechoDe(mundoAct,nivelAct);
  const val=limpio?2:1;
  if(val>antes){ prog[clave(mundoAct,nivelAct)]=val; guardar(); }
  avisar(limpio? TX('aLimpio') : TX('aBien'), 1.5);
  son('nivel');
  const eraUltimo = nivelAct>=NIVELES;
  setTimeout(()=>{
    if(!jugando) return;
    if(eraUltimo){
      son('mundo');
      if(mundoAct>=MUNDOS){ verPantalla('fin'); jugando=false; }
      else { mundoAct++; nivelAct=1; cargarNivel(mundoAct,1); }
    } else cargarNivel(mundoAct, nivelAct+1);
  }, 1450);
}

/* ===================== EL BUCLE ===================== */
let ultimo=performance.now();
function paso(dt){
  tiempo+=dt;
  if(sacudon>0) sacudon=Math.max(0, sacudon-dt*2.4);
  if(pelusa.sacude>0) pelusa.sacude=Math.max(0, pelusa.sacude-dt*2.2);

  /* el muelle del aplaste: pasa de largo y vuelve, que es lo que hace que se lea a blando */
  pelusa.sqv += (-pelusa.sq*150 - pelusa.sqv*11)*dt;
  pelusa.sq  += pelusa.sqv*dt;

  if(jugando && nivel){
    if(pelusa.viajando){
      pelusa.t+=dt;
      const f=Math.min(1, pelusa.t/pelusa.T);
      pelusa.x = pelusa.ax + (pelusa.bx-pelusa.ax)*f;
      pelusa.y = pelusa.ay + (pelusa.by-pelusa.ay)*f;
      pelusa.ang += dt*7.5;
      /* EL CHOQUE SE MIRA CON LA MISMA CUENTA QUE EL VALIDADOR. Si el juego usara una y el
         comprobador otra, el comprobador estaria aprobando un juego que no existe. */
      const B=nivel.nodos[pelusa.en+1], an=nivel.anillos[pelusa.en];
      if(an) for(const ro of an){
        if(ro.duerme) continue;
        if(chocaRotor(ro, B, tiempo, pelusa.x, pelusa.y, RP)){ chocar(); break; }
      }
      if(pelusa.viajando && f>=1) llegar();
    } else {
      pelusa.ang *= Math.max(0, 1-dt*4);
    }
  }
  /* los anillos que se durmieron se apagan de a poco: cortarlos de golpe se lee a error */
  if(nivel) for(const an of nivel.anillos) for(const ro of an)
    if(ro.duerme!==undefined && ro.duerme<1) ro.duerme=Math.min(1, ro.duerme+dt*1.6);

  /* EN EL MENU LA PELUSA SIGUE VIVA. No es adorno: el pelo es fisica, y la unica forma de que se
     vea que lo es antes de tocar nada es que este flotando ahi, respirando, con las cerdas
     cayendo de verdad. */
  if(pant!=='juego' && pant!=='historia'){
    camObj=0; camY += (0-camY)*Math.min(1, dt*3.0);
    pelusa.x = Math.sin(tiempo*0.55)*0.30;
    /* abajo del todo y no en el medio: en el medio queda justo detras de los botones y no se ve */
    pelusa.y = camY - 0.058*H/Math.max(1,U) + Math.sin(tiempo*1.15)*0.16;
  } else camY += (camObj-camY)*Math.min(1, dt*3.4);

  pelusa.parpadeo-=dt; if(pelusa.parpadeo<-0.02) pelusa.parpadeo=2.2+Math.random()*3.4;

  /* la velocidad del cuerpo, medida y no supuesta: el vuelo es una interpolacion, asi que la unica
     forma honesta de saber a que velocidad va es restar la posicion del cuadro anterior */
  pelusa.vx=(pelusa.x-pelusa.ux)/Math.max(1e-4,dt);
  pelusa.vy=(pelusa.y-pelusa.uy)/Math.max(1e-4,dt);
  pelusa.ux=pelusa.x; pelusa.uy=pelusa.y;
  peloTick(dt);
  musicaTick(dt);
  if(pant==='historia'){ histT+=dt; if(histT>=HIST_DUR) histPasar(1); }

  for(let i=chispas.length-1;i>=0;i--){ const c=chispas[i];
    c.t+=dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy-=6*dt; c.vx*=1-dt*1.4; c.vy*=1-dt*1.4;
    if(c.t>=c.T) chispas.splice(i,1); }
  for(let i=ondas.length-1;i>=0;i--){ const o=ondas[i]; o.r+=dt*4.2; o.v-=dt*1.5;
    if(o.v<=0) ondas.splice(i,1); }

  if(!tutoListo) tutoTick(dt);
  if(avisoT>0){ avisoT-=dt; if(avisoT<=0) document.getElementById('aviso').classList.remove('ver'); }
}

/* ===================== EL DIBUJO =====================
   Todo con la misma tinta y un solo color. Las sombras son una elipse suave y nada mas: una sombra
   de verdad en un juego blanco lo ensucia. */
function dibujar(){
  const g=cx;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#F7F6F3'; g.fillRect(0,0,W,H);
  if(sacudon>0){ g.translate((Math.random()*2-1)*sacudon*9, (Math.random()*2-1)*sacudon*9); }
  dibujarFondo();
  if(pant==='historia'){ histDibujar(); return; }
  if(pant!=='juego'){
    /* EN EL MENU LA PELUSA VA AGRANDADA, y se agranda con una transformacion del lienzo y no con un
       radio distinto: asi el pelo, la sombra y los ojos crecen todos juntos y con el mismo grosor de
       trazo relativo. A la escala del juego mide once pixeles de radio en un telefono, o sea que en
       el menu -donde es lo unico que hay que mirar- seria una mosca. */
    const X=px(pelusa.x), Y=py(pelusa.y), k=Math.max(1.7, Math.min(3.0, H/260));
    g.save(); g.translate(X,Y); g.scale(k,k); g.translate(-X,-Y);
    dibujarPelusa(); g.restore(); return;
  }
  if(!nivel){ return; }

  /* la columna, apenas insinuada: en una pantalla ancha dice donde esta el juego */
  g.strokeStyle='rgba(0,0,0,0.030)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(px(-ANCHO_COL/2), 0); g.lineTo(px(-ANCHO_COL/2), H);
  g.moveTo(px(ANCHO_COL/2), 0); g.lineTo(px(ANCHO_COL/2), H); g.stroke();

  /* el camino ya hecho: una linea llena y clara */
  g.strokeStyle='rgba(36,36,43,0.13)'; g.lineWidth=Math.max(1.2, U*0.035); g.lineCap='round';
  g.beginPath();
  for(let k=0;k<=pelusa.en && k<nivel.nodos.length-1;k++){
    const a=nivel.nodos[k], b=nivel.nodos[k+1];
    g.moveTo(px(a.x),py(a.y)); g.lineTo(px(b.x),py(b.y));
  }
  g.stroke();

  /* LA LINEA QUE VIENE, DE PUNTOS. Es el enunciado del juego: dice exactamente por donde vas a
     pasar, asi que el error nunca puede ser "no sabia". */
  const B=nivel.nodos[pelusa.en+1];
  if(B && !terminado){
    const A=nivel.nodos[pelusa.en];
    g.save();
    g.strokeStyle='rgba(36,36,43,0.34)'; g.lineWidth=Math.max(1.1, U*0.028);
    g.setLineDash([U*0.13, U*0.20]); g.lineDashOffset=-(tiempo*U*0.7)%(U*0.33);
    g.beginPath(); g.moveTo(px(A.x),py(A.y)); g.lineTo(px(B.x),py(B.y)); g.stroke();
    g.restore();
  }

  /* los nodos */
  for(let k=0;k<nivel.nodos.length;k++){
    const n=nivel.nodos[k], hecho=k<=pelusa.en, meta=k===nivel.nodos.length-1;
    const X=px(n.x), Y=py(n.y);
    if(Y<-80||Y>H+80) continue;
    const r=U*(meta?0.40:0.30);
    g.beginPath(); g.ellipse(X, Y+r*0.95, r*0.9, r*0.30, 0, 0, 7); g.fillStyle='rgba(0,0,0,0.045)'; g.fill();
    g.beginPath(); g.arc(X,Y,r,0,7);
    g.fillStyle='#FFFFFF'; g.fill();
    g.lineWidth=Math.max(1.2,U*0.030);
    g.strokeStyle = meta? 'rgba(127,178,162,0.95)' : (hecho? 'rgba(36,36,43,0.55)':'rgba(36,36,43,0.20)');
    g.stroke();
    if(meta){ g.beginPath(); g.arc(X,Y,r*0.42,0,7); g.fillStyle='rgba(127,178,162,0.85)'; g.fill(); }
    else if(hecho){ g.beginPath(); g.arc(X,Y,r*0.30,0,7); g.fillStyle='rgba(36,36,43,0.5)'; g.fill(); }
  }

  /* los anillos y sus bolas con espinas */
  const p={x:0,y:0};
  for(let k=0;k<nivel.anillos.length;k++){
    const nodo=nivel.nodos[k+1], an=nivel.anillos[k];
    const Y=py(nodo.y); if(Y<-260||Y>H+260) continue;
    for(const ro of an){
      const dorm = ro.duerme!==undefined? ro.duerme : 0;
      const alfa = 1-dorm;
      if(alfa<=0.01) continue;
      const rr=rotorRad(ro, tiempo), a=rotorAng(ro, tiempo);
      /* la orbita: un circulo finisimo. Sin el, la bola aparece de la nada y no se puede prever */
      g.beginPath(); g.arc(px(nodo.x),Y,rr*U,0,7);
      g.strokeStyle='rgba(217,105,90,'+(0.16*alfa).toFixed(3)+')'; g.lineWidth=1; g.stroke();
      const cs=Math.cos(a), sn=Math.sin(a), NX=px(nodo.x);
      if(ro.forma==='barra'){
        g.strokeStyle='rgba(217,105,90,'+(0.92*alfa).toFixed(3)+')';
        g.lineWidth=Math.max(2, R_BARRA*2*U); g.lineCap='round';
        g.beginPath();
        g.moveTo(NX+cs*BARRA_IN*U, Y-sn*BARRA_IN*U); g.lineTo(NX+cs*rr*U, Y-sn*rr*U);
        g.moveTo(NX-cs*BARRA_IN*U, Y+sn*BARRA_IN*U); g.lineTo(NX-cs*rr*U, Y+sn*rr*U);
        g.stroke();
        for(const sg of [1,-1]){
          g.beginPath(); g.arc(NX+sg*cs*rr*U, Y-sg*sn*rr*U, R_BARRA*1.35*U, 0, 7);
          g.fillStyle='rgba(217,105,90,'+(0.95*alfa).toFixed(3)+')'; g.fill();
        }
      } else {
        rotorPos(ro, nodo, tiempo, p);
        const BX=px(p.x), BY=py(p.y);
        if(ro.forma==='cometa'){
          const sg=(ro.w<0)? 1 : -1;
          for(let i=3;i>=1;i--){
            const aa=a+sg*i*0.30, rc=R_COLA*(1-i*0.18);
            g.beginPath(); g.arc(NX+Math.cos(aa)*rr*U, Y-Math.sin(aa)*rr*U, rc*0.62*U, 0, 7);
            g.fillStyle='rgba(217,105,90,'+((0.30+0.16*(3-i))*alfa).toFixed(3)+')'; g.fill();
          }
        }
        dibujarEspinosa(BX, BY, U, a*1.6, alfa);
        if(ro.forma==='doble') dibujarEspinosa(px(2*nodo.x-p.x), py(2*nodo.y-p.y), U, a*1.6+1.1, alfa);
        if(ro.forma==='satelite'){
          const la=a*3.4+ro.fase;
          g.beginPath(); g.arc(BX+Math.cos(la)*R_ESP*1.55*U, BY-Math.sin(la)*R_ESP*1.55*U, R_LUNA*U, 0, 7);
          g.fillStyle='rgba(217,105,90,'+(0.90*alfa).toFixed(3)+')'; g.fill();
          g.beginPath(); g.arc(BX,BY,R_ESP*1.55*U,0,7);
          g.strokeStyle='rgba(217,105,90,'+(0.13*alfa).toFixed(3)+')'; g.lineWidth=1; g.stroke();
        }
      }
    }
  }

  /* las ondas de salir y de llegar */
  for(const o of ondas){
    g.beginPath(); g.arc(px(o.x),py(o.y),o.r*U,0,7);
    g.strokeStyle='rgba(36,36,43,'+(0.20*o.v).toFixed(3)+')'; g.lineWidth=Math.max(1,U*0.02); g.stroke();
  }
  /* las chispas del choque */
  for(const c of chispas){
    const a=1-c.t/c.T;
    g.beginPath(); g.arc(px(c.x),py(c.y), U*0.035*a, 0, 7);
    g.fillStyle='rgba(217,105,90,'+(0.75*a).toFixed(3)+')'; g.fill();
  }

  dibujarPelusa();
}

function dibujarEspinosa(X,Y,u,giro,alfa){
  const g=cx;
  g.save(); g.translate(X,Y); g.rotate(giro);
  g.strokeStyle='rgba(217,105,90,'+(0.92*alfa).toFixed(3)+')';
  g.lineWidth=Math.max(1.1,u*0.030); g.lineCap='round';
  g.beginPath();
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    g.moveTo(Math.cos(a)*R_BOLA*u*0.86, Math.sin(a)*R_BOLA*u*0.86);
    g.lineTo(Math.cos(a)*R_ESP*u*0.94, Math.sin(a)*R_ESP*u*0.94);
  }
  g.stroke();
  g.beginPath(); g.arc(0,0,R_BOLA*u,0,7);
  g.fillStyle='rgba(217,105,90,'+(0.95*alfa).toFixed(3)+')'; g.fill();
  g.beginPath(); g.arc(-R_BOLA*u*0.25,-R_BOLA*u*0.25,R_BOLA*u*0.30,0,7);
  g.fillStyle='rgba(255,255,255,'+(0.35*alfa).toFixed(3)+')'; g.fill();
  g.restore();
}

function dibujarPelusa(){
  const g=cx;
  const X=px(pelusa.x), Y=py(pelusa.y);
  const s=1+pelusa.sq*0.055, sx=1/Math.max(0.55,s), sy=Math.max(0.55,s);
  /* la sombra: cuanto mas arriba del piso, mas chica y mas clara. Es lo unico que ancla al bicho */
  g.beginPath(); g.ellipse(X, Y+RP*U*1.15, RP*U*0.95*sx, RP*U*0.26, 0, 0, 7);
  g.fillStyle='rgba(0,0,0,0.055)'; g.fill();

  /* EL PELO, EN TRES TANDAS Y CON CURVA.
     Tres grosores, porque 118 cerdas del mismo ancho se leen a rayado de lapiz; y curva de Bezier
     por tramo, porque una polilinea de cuatro segmentos en un mechon de 25 pixeles muestra los tres
     codos y el pelo queda de alambre. Van agrupadas por grosor para que sean TRES trazos por cuadro
     y no 118: cada stroke() es una orden de dibujo, y 118 por cuadro a 60 por segundo son siete mil
     ordenes por segundo para lo mismo. */
  g.strokeStyle='rgba(36,36,43,0.78)'; g.lineCap='round'; g.lineJoin='round';
  for(let gi=0; gi<GROSORES.length; gi++){
    g.lineWidth=Math.max(0.7, U*0.019*GROSORES[gi]);
    g.beginPath();
    for(const m of pelusa.pelo){
      if(m.gr!==gi) continue;
      const p=m.p, n=p.length;
      g.moveTo(px(p[0].x),py(p[0].y));
      for(let k=1;k<n-1;k++){
        const X=px(p[k].x), Y=py(p[k].y);
        g.quadraticCurveTo(X, Y, (X+px(p[k+1].x))/2, (Y+py(p[k+1].y))/2);
      }
      g.lineTo(px(p[n-1].x),py(p[n-1].y));
    }
    g.stroke();
  }

  g.save(); g.translate(X,Y); g.scale(sx,sy);
  g.beginPath(); g.arc(0,0,RP*U,0,7); g.fillStyle='#24242B'; g.fill();
  /* los ojos miran a donde va: es lo unico que le da intencion */
  const B=nivel? nivel.nodos[pelusa.en+1] : null;
  let mx=0, my=0.35;
  if(B){ const dx=B.x-pelusa.x, dy=B.y-pelusa.y, l=Math.hypot(dx,dy)||1; mx=dx/l; my=dy/l; }
  const oj=RP*U*0.30, se=RP*U*0.34;
  /* el parpadeo: el ojo se aplasta, no se apaga. Apagarlo lee a error de dibujo */
  const cerr = pelusa.parpadeo<0.11? Math.max(0.10, Math.abs(pelusa.parpadeo-0.055)/0.055) : 1;
  g.fillStyle='#F7F6F3';
  for(const sg of [-1,1]){
    g.beginPath();
    g.ellipse(sg*se + mx*oj*0.5, -my*oj*0.5, RP*U*0.15, RP*U*0.15*cerr, 0, 0, 7);
    g.fill();
  }
  g.restore();
}

/* ===================== LA HISTORIA =====================
   Cinco planos, siempre al arrancar, y salteable en un toque. POR QUE SIEMPRE: el juego no dice una
   sola palabra mientras se juega -no hay reloj, ni puntaje, ni texto- y sin la historia lo unico que
   el jugador sabe es que hay una bolita y unas espinas. Treinta segundos de cuento son la unica
   parte del juego que explica para que.
   Y esta DIBUJADA, no fotografiada: la misma tinta y el mismo color de peligro que el juego. Una
   foto pegada arriba de un juego de dos colores se ve pegada arriba. */
const HIST=['h1','h2','h3','h4','h5'], HIST_DUR=6.4;
let histI=0, histT=0;
function histVer(){ histI=0; histT=0; histPintar(); verPantalla('historia'); }
function histPasar(n){
  histI+=n; histT=0;
  if(histI>=HIST.length){ verPantalla('menu'); return; }
  histPintar(); son('toque');
}
function histPintar(){
  const t=document.getElementById('hT'); if(t) t.textContent=TX(HIST[histI]);
  const p=document.getElementById('hP');
  if(p){ p.innerHTML=''; for(let i=0;i<HIST.length;i++){ const b=document.createElement('b');
    if(i===histI) b.className='hay'; p.appendChild(b); } }
}
/* una pelusa de adorno, con el pelo dibujado a mano: la del juego vive en unidades de mundo y aca
   hace falta una en pixeles, a cualquier tamano */
function peluchito(g,X,Y,r,t,n){
  g.save(); g.translate(X,Y);
  g.strokeStyle='rgba(36,36,43,0.72)'; g.lineWidth=Math.max(1,r*0.085); g.lineCap='round';
  g.beginPath();
  const N=n||40;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2, l=r*(1.30+0.26*Math.sin(i*2.7+t*1.5));
    g.moveTo(Math.cos(a)*r*0.95, Math.sin(a)*r*0.95);
    g.lineTo(Math.cos(a)*l, Math.sin(a)*l + Math.sin(t*1.2+i)*r*0.05);
  }
  g.stroke();
  g.beginPath(); g.arc(0,0,r,0,7); g.fillStyle='#24242B'; g.fill();
  g.fillStyle='#F7F6F3';
  g.beginPath(); g.arc(-r*0.33,-r*0.08,r*0.15,0,7); g.fill();
  g.beginPath(); g.arc( r*0.33,-r*0.08,r*0.15,0,7); g.fill();
  g.restore();
}
function histEspina(g,X,Y,r,giro){
  g.save(); g.translate(X,Y); g.rotate(giro);
  g.strokeStyle='rgba(217,105,90,0.92)'; g.lineWidth=Math.max(1.2,r*0.26); g.lineCap='round';
  g.beginPath();
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2;
    g.moveTo(Math.cos(a)*r*0.86, Math.sin(a)*r*0.86);
    g.lineTo(Math.cos(a)*r*1.75, Math.sin(a)*r*1.75); }
  g.stroke();
  g.beginPath(); g.arc(0,0,r,0,7); g.fillStyle='#D9695A'; g.fill();
  g.restore();
}
function histDibujar(){
  const cv=document.getElementById('hL'); if(!cv) return;
  const g=cv.getContext('2d'), w=cv.width, h=cv.height, t=tiempo, f=Math.min(1,histT/0.7);
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,w,h);
  g.globalAlpha=f;
  const R=rng(4321+histI*97);
  if(histI===0){
    /* sola en el fondo de todo, y todo lo de arriba vacio */
    g.fillStyle='rgba(36,36,43,0.055)';
    for(let i=0;i<70;i++){ const x=R()*w, y=R()*h*0.86, r=2+R()*9;
      g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
    peluchito(g, w*0.5, h*0.78, 34, t);
  } else if(histI===1){
    /* el camino de puntos, subiendo */
    let x=w*0.5, y=h*0.94;
    const pts=[];
    for(let k=0;k<6;k++){ pts.push([x,y]); x=w*0.5+Math.sin(k*1.25)*w*0.26; y-=h*0.155; }
    g.strokeStyle='rgba(36,36,43,0.30)'; g.lineWidth=2.6; g.setLineDash([7,11]);
    g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
    for(const q of pts) g.lineTo(q[0],q[1]);
    g.stroke(); g.setLineDash([]);
    for(let i=0;i<pts.length;i++){
      g.beginPath(); g.arc(pts[i][0],pts[i][1], i===pts.length-1? 20:15, 0, 7);
      g.fillStyle='#FFFFFF'; g.fill();
      g.lineWidth=2.4; g.strokeStyle= i===pts.length-1? 'rgba(127,178,162,0.95)':'rgba(36,36,43,0.28)';
      g.stroke();
    }
    peluchito(g, pts[0][0], pts[0][1], 26, t);
  } else if(histI===2){
    /* las espinas, girando alrededor de tres puntos */
    for(let k=0;k<3;k++){
      const X=w*(0.22+k*0.28), Y=h*(0.32+((k%2)?0.34:0)), rr=62+k*15;
      g.beginPath(); g.arc(X,Y,rr,0,7);
      g.strokeStyle='rgba(217,105,90,0.18)'; g.lineWidth=1.4; g.stroke();
      g.beginPath(); g.arc(X,Y,14,0,7); g.fillStyle='#FFFFFF'; g.fill();
      g.lineWidth=2.2; g.strokeStyle='rgba(36,36,43,0.25)'; g.stroke();
      const a=t*(0.7+k*0.35)*(k%2?-1:1);
      histEspina(g, X+Math.cos(a)*rr, Y+Math.sin(a)*rr, 15, a*1.6);
      if(k===1) histEspina(g, X-Math.cos(a)*rr, Y-Math.sin(a)*rr, 15, a*1.6+1.1);
    }
  } else if(histI===3){
    /* soltarse: la pelusa a mitad de camino y el pelo tirado para atras */
    const A=[w*0.20,h*0.86], B=[w*0.78,h*0.22];
    g.strokeStyle='rgba(36,36,43,0.28)'; g.lineWidth=2.6; g.setLineDash([7,11]);
    g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke(); g.setLineDash([]);
    g.beginPath(); g.arc(B[0],B[1],20,0,7); g.fillStyle='#FFFFFF'; g.fill();
    g.lineWidth=2.4; g.strokeStyle='rgba(217,105,90,0.30)'; g.stroke();
    const a=t*1.25;
    g.beginPath(); g.arc(B[0],B[1],58,0,7); g.strokeStyle='rgba(217,105,90,0.18)'; g.lineWidth=1.4; g.stroke();
    histEspina(g, B[0]+Math.cos(a)*58, B[1]+Math.sin(a)*58, 13, a*1.6);
    const u=0.42+Math.sin(t*0.8)*0.06;
    const X=A[0]+(B[0]-A[0])*u, Y=A[1]+(B[1]-A[1])*u;
    g.strokeStyle='rgba(36,36,43,0.13)'; g.lineWidth=2;
    for(let i=0;i<7;i++){ g.beginPath();
      g.moveTo(X-(B[0]-A[0])*0.03*i, Y-(B[1]-A[1])*0.03*i);
      g.lineTo(X-(B[0]-A[0])*0.05*i, Y-(B[1]-A[1])*0.05*i); g.stroke(); }
    peluchito(g, X, Y, 29, t);
  } else {
    /* todavia subiendo: el ultimo punto, en calma */
    g.fillStyle='rgba(36,36,43,0.05)';
    for(let i=0;i<48;i++){ const x=R()*w, y=R()*h, r=2+R()*7;
      g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
    const X=w*0.5, Y=h*0.40;
    for(let i=3;i>=1;i--){ g.beginPath();
      g.arc(X, Y, 34+i*30+Math.sin(t*0.9-i*0.6)*8, 0, 7);
      g.strokeStyle='rgba(127,178,162,'+(0.30/i).toFixed(3)+')'; g.lineWidth=2; g.stroke(); }
    g.beginPath(); g.arc(X,Y,24,0,7); g.fillStyle='#FFFFFF'; g.fill();
    g.lineWidth=2.6; g.strokeStyle='rgba(127,178,162,0.95)'; g.stroke();
    g.beginPath(); g.arc(X,Y,10,0,7); g.fillStyle='rgba(127,178,162,0.85)'; g.fill();
    peluchito(g, X, h*0.80, 31, t);
  }
  g.globalAlpha=1;
}

/* ===================== EL TUTORIAL =====================
   Cinco pasos y cada uno ESPERA a que la cosa pase. Un tutorial que se pasa solo con un temporizador
   se lee sin leerlo; uno que espera obliga a hacerlo una vez, y hacerlo una vez es entenderlo. */
const TUTO=[
  { t:()=>TX('t0'), s:()=>TX('t0s'), p:()=>Math.min(1,tutoT/2.4), ok:()=>tutoT>2.4 },
  { t:()=>TX('t1'), s:()=>TX('t1s'), p:()=>Math.min(1,tutoT/3.4), ok:()=>tutoT>3.4 },
  { t:()=>TX('t2'), s:()=>TX('t2s'), p:()=>Math.min(1,tutoSalio/1), ok:()=>tutoSalio>=1 },
  { t:()=>TX('t3'), s:()=>TX('t3s'), p:()=>Math.min(1,pelusa.en/1), ok:()=>pelusa.en>=1 },
  { t:()=>TX('t4'), s:()=>TX('t4s'), p:()=>Math.min(1,tutoT/3.0), ok:()=>tutoT>3.0 }
];
function tutoTick(dt){
  tutoT+=dt;
  const P=TUTO[tutoPaso];
  const T=document.getElementById('tutoT'), S=document.getElementById('tutoS'),
        b=document.querySelector('#tutoP i');
  if(T && T._p!==tutoPaso){ T._p=tutoPaso; T.textContent=P.t(); S.textContent=P.s(); }
  if(b) b.style.width=(P.p()*100).toFixed(0)+'%';
  if(P.ok() && tutoT>0.6){
    tutoPaso++; tutoT=0;
    if(tutoPaso>=TUTO.length){ tutoListo=true; document.body.classList.remove('tutorial'); }
    else son('toque');
  }
}

/* el iconito de cada mundo: la idea del mundo dibujada, no un numero */
function icono(cv, m){
  const g=cv.getContext('2d'); const s=68;
  g.clearRect(0,0,s,s); g.translate(s/2,s/2);
  g.strokeStyle='rgba(36,36,43,0.30)'; g.lineWidth=1;
  const radios = (m>=3)? [12,25] : [21];
  for(const r of radios){ g.beginPath(); g.arc(0,0,r,0,7); g.stroke(); }
  g.fillStyle='#24242B'; g.beginPath(); g.arc(0,0,7,0,7); g.fill();
  /* EL ICONO DIBUJA LA FORMA QUE TRAE EL MUNDO, que es la unica noticia que da un mundo nuevo. Un
     numero adentro de un circulo no dice nada que no diga ya el rotulo de al lado. */
  const fm=ICONO_FORMA[Math.max(0,Math.min(ICONO_FORMA.length-1,m))];
  g.fillStyle='#D9695A'; g.strokeStyle='#D9695A';
  if(fm==='barra'){
    g.lineWidth=5; g.lineCap='round';
    g.beginPath(); g.moveTo(-9,0); g.lineTo(-25,0); g.moveTo(9,0); g.lineTo(25,0); g.stroke();
  } else {
    const n = 1 + ((m>=2)?1:0) + ((m>=4)?1:0);
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2 + 0.5, r=radios[i%radios.length];
      const X=Math.cos(a)*r, Y=Math.sin(a)*r;
      g.beginPath(); g.arc(X, Y, 4.6, 0, 7); g.fill();
      if(fm==='doble' && i===0){ g.beginPath(); g.arc(-X,-Y,4.6,0,7); g.fill(); }
      if(fm==='satelite' && i===0){ g.beginPath(); g.arc(X+7,Y-6,2.6,0,7); g.fill(); }
      if(fm==='cometa' && i===0){ for(let q=1;q<=3;q++){ const aa=a-q*0.30;
        g.globalAlpha=0.55-q*0.11;
        g.beginPath(); g.arc(Math.cos(aa)*r, Math.sin(aa)*r, 3.4-q*0.5, 0, 7); g.fill(); }
        g.globalAlpha=1; }
    }
  }
  g.setTransform(1,0,0,1,0,0);
}

/* ===================== LO QUE SE TOCA =====================
   Un solo gesto en todo el juego: tocar en cualquier lado, o la barra, o un clic. No hay nada mas
   que aprender y por eso no hay nada mas que explicar. */
function tocar(e){
  if(e && e.target && e.target.closest && e.target.closest('button')) return;
  if(pant==='historia'){ audioIniciar(); histPasar(1); return; }
  if(pant!=='juego') return;
  audioIniciar();
  saltar();
}
addEventListener('pointerdown', tocar, {passive:true});
addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); tocar(null); }
  if(e.key==='Escape' && pant==='historia') verPantalla('menu');
  if(e.key==='Escape' && pant==='juego'){ pintarNiveles(); verPantalla('niveles'); }
});
/* Chrome de Android manda un mousemove sintetico despues de cada toque: sin la guarda, un telefono
   pasaria a modo PC y el cartel diria "clic o espacio" en una pantalla sin mouse. */
let ultimoToque=-1e9;
addEventListener('pointerdown', ()=>{ ultimoToque=performance.now(); }, {passive:true});
addEventListener('mousemove', e=>{
  if(performance.now()-ultimoToque < 1200) return;
  if(!e.movementX && !e.movementY) return;
  if(plataf!=='pc'){ plataf='pc'; avisoToque(document.getElementById('toque').classList.contains('ver')); }
});

/* ===================== ARRANQUE ===================== */
ajustar(); armarPelo(); armarFondo(1);
function bucle(){
  requestAnimationFrame(bucle);
  const t=performance.now(), dt=Math.min(0.05, (t-ultimo)/1000); ultimo=t;
  paso(dt);
  dibujar();
}
bucle();

/* ===================== GANCHOS DE PRUEBA =====================
   Un juego de puntería no se comprueba mirando una foto: se comprueba midiendo que exista la ventana
   en la que se puede pasar, y que el juego use la MISMA cuenta para chocar que el validador. */
window.__pelusa={
  estado:()=>({ pant, mundo:mundoAct, nivel:nivelAct, jugando, terminado,
                en:pelusa.en, nodos:nivel? nivel.nodos.length:0,
                viajando:pelusa.viajando, intentos, limpio, plataf,
                pos:[+pelusa.x.toFixed(2),+pelusa.y.toFixed(2)],
                tuto:{ paso:tutoPaso, listo:tutoListo, texto:(document.getElementById('tutoT')||{}).textContent||'' } }),
  nivel:()=>nivel && ({ mundo:nivel.mundo, nivel:nivel.nivel, saltos:nivel.nodos.length-1,
                        vel:velDe(nivel.mundo),
                        ventanas:nivel.ventanas,
                        trazado:nivel.trazado,
                        rotores:nivel.anillos.map(a=>a.map(r=>({ r:+r.r.toFixed(2), w:+r.w.toFixed(2),
                                 tipo:r.tipo, forma:r.forma, duerme:r.duerme!==undefined })))}),
  cargar:(m,n)=>{ cargarNivel(m,n); return window.__pelusa.nivel(); },
  /* genera TODOS los niveles y devuelve el peor caso: es la unica forma de afirmar que los ciento
     veinte se pueden pasar sin jugarlos a mano */
  auditar:(mundos)=>{
    const r=[]; let peor=9, peorEn=null, dur=0;
    for(let m=1;m<=(mundos||MUNDOS);m++){
      let pm=9;
      for(let n=1;n<=NIVELES;n++){
        const t0=performance.now();
        const nv=generar(m,n); dur+=performance.now()-t0;
        for(const v of nv.ventanas){
          if(v.mejor<pm) pm=v.mejor;
          if(v.mejor<peor){ peor=v.mejor; peorEn=[m,n]; }
        }
      }
      r.push({ mundo:m, ventanaPeor:+pm.toFixed(3), minimo:+ventanaMinima(m,1).toFixed(3) });
    }
    return { mundos:r, peor:+peor.toFixed(3), peorEn, msTotal:Math.round(dur) };
  },
  /* EL MEDIO DE LA VENTANA, NO SU BORDE. Es el detalle que hizo fallar la primera prueba: devolver
     el primer instante seguro y despues redondearlo al cuadro mas cercano cae ocho milisegundos
     ANTES del borde, o sea justo del lado malo. Un jugador tampoco apunta al borde: apunta al medio.
     Con el medio, si el juego y el validador no usaran la misma cuenta esto chocaria igual — y ahi
     estaria la prueba de que una de las dos esta mal. */
  saltarBien:(minVent)=>{
    if(!nivel||pelusa.viajando) return 'no se puede';
    const A=nivel.nodos[pelusa.en], B=nivel.nodos[pelusa.en+1], an=nivel.anillos[pelusa.en];
    if(!B) return 'no hay a donde';
    const vel=velDe(mundoAct), P=1/240, MIN=minVent||0.07;
    let ini=-1;
    for(let k=0;k<2400;k++){
      const t=tiempo + k*P;
      if(seguro(A,B,an,t,vel)){ if(ini<0) ini=t; }
      else { if(ini>=0 && (t-P-ini)>=MIN) return { esperar:+((ini + (t-P-ini)/2) - tiempo).toFixed(4),
                                                   ventana:+(t-P-ini).toFixed(3) };
             ini=-1; }
    }
    return 'sin ventana';
  },
  cuadros:(n,dt)=>{ for(let k=0;k<(n||60);k++) paso(dt||1/60); return window.__pelusa.estado(); },
  saltar:()=>{ saltar(); return pelusa.viajando; },
  /* juega un nivel entero solo, saltando siempre en la ventana: comprueba de punta a punta */
  jugarSolo:(tope)=>{
    let vueltas=0, choques=0; const ventanas=[];
    while(!terminado && vueltas++<(tope||5000)){
      if(!pelusa.viajando){
        const q=window.__pelusa.saltarBien();
        if(typeof q==='string') return { error:q, en:pelusa.en };
        const n=Math.max(0, Math.round(q.esperar*60));
        for(let i=0;i<n;i++) paso(1/60);
        ventanas.push(q.ventana);
        const antes=intentos;
        saltar();
        while(pelusa.viajando && vueltas++<(tope||5000)) paso(1/60);
        if(intentos>antes) choques++;
      } else paso(1/60);
    }
    return { terminado:!!terminado, en:pelusa.en, saltos:nivel.nodos.length-1, choques, limpio,
             ventanaMin:ventanas.length? +Math.min(...ventanas).toFixed(3) : null };
  },
  audio:()=>{ let pico=0,rms=0;
    if(AUD.an&&AUD.buf){ AUD.an.getFloatTimeDomainData(AUD.buf);
      for(let i=0;i<AUD.buf.length;i++){ const v=Math.abs(AUD.buf[i]); if(v>pico)pico=v; rms+=v*v; }
      rms=Math.sqrt(rms/AUD.buf.length); }
    return { hay:!!AUD.ctx, on:AUD.on, pico:+pico.toFixed(4), rms:+rms.toFixed(4) }; },
  son:(t,k)=>{ son(t,k); return true; },
  /* DESVIO: cuanto se aparta la punta de donde estaria un pelo tieso. Es la unica medida que
     distingue "hay fisica" de "hay un dibujo de pelo": quieta tiene que dar casi cero y disparada
     tiene que dar varios centesimos de unidad. */
  pelo:()=>{ let des=0, n=0;
    for(const m of pelusa.pelo){
      const ang=m.a+pelusa.ang, k=PELO_N, rr=RP+k*m.largo;
      const ox=pelusa.x+Math.cos(ang)*rr, oy=pelusa.y+Math.sin(ang)*rr;
      des+=Math.hypot(m.p[k].x-ox, m.p[k].y-oy); n++;
    }
    return { mechones:pelusa.pelo.length, tramos:PELO_N, puntos:pelusa.pelo.length*(PELO_N+1),
             trazos:GROSORES.length,
             largo:+(pelusa.pelo[0]?Math.hypot(pelusa.pelo[0].p[PELO_N].x-pelusa.pelo[0].p[0].x,
                    pelusa.pelo[0].p[PELO_N].y-pelusa.pelo[0].p[0].y):0).toFixed(3),
             vel:+Math.hypot(pelusa.vx,pelusa.vy).toFixed(2),
             desvio:+(des/Math.max(1,n)).toFixed(4) }; },
  fondo:()=>({ mundo:fondoMundo, capas:fondo? fondo.map((c,i)=>({v:CAPAS[i].v, n:c.length})):null,
               objetos:fondo? fondo.reduce((a,c)=>a+c.length,0):0, alto:FONDO_ALTO }),
  historia:()=>({ pant, i:histI, de:HIST.length, t:+histT.toFixed(2), dur:HIST_DUR,
                  texto:(document.getElementById('hT')||{}).textContent||'' }),
  verHistoria:()=>{ histVer(); return histI; },
  musica:()=>({ hay:!!MUS.g, voces:MUS.voces.length, raiz:MUS.raiz, vol:MUS_VOL,
                filtro: MUS.filtro? Math.round(MUS.filtro.frequency.value):0 }),
  formas:()=>{ const c={};
    for(let m=1;m<=MUNDOS;m++) for(let n=1;n<=NIVELES;n++){
      const nv=generar(m,n);
      for(const an of nv.anillos) for(const r of an) c[r.forma]=(c[r.forma]||0)+1; }
    return c; },
  progreso:()=>({ prog:Object.keys(prog).length,
                  mundosAbiertos:Array.from({length:MUNDOS},(_,i)=>i+1).filter(mundoAbierto) }),
  idioma:(c)=>{ if(c) elegirIdioma(c); return IDIOMA; },
  pantalla:(p)=>{ verPantalla(p); return pant; },
  costo:(n)=>{ const t0=performance.now();
    for(let i=0;i<(n||120);i++){ paso(1/60); dibujar(); }
    return { cuadros:n||120, msPorCuadro:+((performance.now()-t0)/(n||120)).toFixed(2) }; },
  medidas:()=>({ W, H, U:+U.toFixed(2), DPR, banda:BANDA, medioMin:+MEDIO_MIN.toFixed(2),
                 vePorLado:+((W/2)/U).toFixed(2), veDeAlto:+(H/U).toFixed(2),
                 entraTodo:((W/2)/U)>=MEDIO_MIN-0.001, esc:+esc.toFixed(2) })
};
</script>
</body>
