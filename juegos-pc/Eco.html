<!--
  ===================== ECO =====================
  Un laberinto que no se ve. Se oye.

  LA IDEA, Y DE DONDE SALE TODO LO DEMAS: el mundo esta a oscuras de verdad —no "oscuro pero se
  adivina", negro— y lo unico que existe para el ojo es tu propio cuerpo. Caminar hace ruido, y el
  ruido sale como una onda esferana que al pasar por una pared la MARCA en blanco. Asi que para ver
  hay que moverse, y moverse es lo que te delata. Ese es el juego entero.

  POR QUE LA ONDA VA EN EL MATERIAL Y NO EN UNA PASADA DE PANTALLA. Lo natural seria hacerlo de
  post-proceso: dibujar profundidad, reconstruir la posicion del mundo por pixel y evaluar las ondas
  ahi. Anda, pero cuesta una pasada mas, un blanco de render del tamano de la pantalla y reconstruir
  posicion por pixel. Metiendolo en el material, cada fragmento YA SABE donde esta en el mundo: es
  un varying que la tarjeta interpola gratis. Una sola pasada, sin blancos de render, y el
  laberinto entero es UN material y UNA malla fundida.

  LA ONDA NO SE CORTA CON LAS PAREDES, y es a proposito. Ocluir de verdad pediria un mapa de sombras
  por onda desde su origen: seis caras por onda y hasta ocho ondas vivas. En un laberinto el sonido
  DOBLA por los pasillos, asi que no ocluir se parece mas a como suena de verdad que ocluir, y sale
  gratis. Es una decision, no una limitacion que no vi.
-->

  /* ---------- EL CUADRO 16:9 ----------
     El juego se dibuja SIEMPRE en 16:9 y con 90 grados de campo HORIZONTAL, como un tirador. Lo que
     sobra de la pantalla queda negro.
     Y EN UN TELEFONO VERTICAL EL CUADRO SE GIRA 90 GRADOS en vez de encogerse a una tirita. En
     412x915 un 16:9 sin girar mide 412x232: el 11% de la pantalla. Girado mide 915x515 y usa todo.
     Adentro va TODO —lienzo, HUD, botones y menu— asi que hay una sola transformacion y nada queda
     desalineado. */
  #caja{ position:fixed; left:50%; top:50%; overflow:hidden; background:#000; z-index:10;
    transform:translate(-50%,-50%); }

  /* ---------- la pantalla de idioma ---------- */
  #idioma{ position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(12px,2vw,24px); background:#04060a;
    transition:opacity .4s ease; }
  #idioma.ir{ opacity:0; pointer-events:none; }
  #idTit{ font-size:clamp(34px,7.4vw,74px); font-weight:900; letter-spacing:.34em;
    margin-left:.34em; color:#dbe4ee; }
  #idSub{ font-size:max(9px,calc(11px * var(--esc,1))); font-weight:700; letter-spacing:.30em;
    color:#5d6a78; }
  #idBotones{ display:flex; gap:clamp(8px,1.4vw,18px); flex-wrap:wrap; justify-content:center; }
  .idB{ padding:clamp(9px,1.2vw,15px) clamp(20px,3.4vw,42px); border-radius:999px; cursor:pointer;
    font-size:max(12px,calc(13px * var(--esc,1))); font-weight:900; letter-spacing:.14em;
    color:#cfd9e4; background:transparent; border:1.4px solid rgba(232,238,245,.34);
    transition:background .2s ease, color .2s ease, border-color .2s ease; }
  .idB:hover{ background:#e8eef5; color:#04060a; border-color:#e8eef5; }
  .idB:active{ transform:scale(.96); }
  body.tapa #menu{ opacity:0; pointer-events:none; }
  #cambiaIdioma{ cursor:pointer; pointer-events:auto; text-decoration:underline;
    text-underline-offset:3px; }
  #cambiaIdioma:hover{ color:#8fa0b2; }

  /* ---------- el menu: lo mas simple que se pueda ---------- */
  /* ---------- EL MENU ----------
     Una pantalla negra con el titulo y un boton alcanza para arrancar, pero no dice que juego es
     este. Ahora el fondo son ondas: tres anillos que salen del centro y se apagan, o sea la mecanica
     del juego funcionando de fondo antes de tocar nada. Y lo que hay que saber va en tres fichas
     —moverse, el ruido, las hojas— y no en un parrafo: un parrafo en un menu no se lee. */
  #menu{ position:absolute; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(10px,1.7vw,20px); background:#04060a;
    transition:opacity .5s ease; overflow:hidden; }
  #menu.ir{ opacity:0; pointer-events:none; }
  /* los anillos del fondo */
  #ondasM{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  #ondasM i{ position:absolute; left:50%; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px;
    border-radius:50%; border:1px solid rgba(150,175,205,.30);
    animation:crecer 6.2s linear infinite; }
  #ondasM i:nth-child(2){ animation-delay:2.07s; }
  #ondasM i:nth-child(3){ animation-delay:4.14s; }
  @keyframes crecer{
    0%{   transform:scale(1);   opacity:0; border-width:2px; }
    12%{  opacity:.55; }
    100%{ transform:scale(130); opacity:0; border-width:.4px; } }
  /* OJO: los huecos en PORCENTAJE en una columna de altura automatica resuelven contra cero, asi
     que el subtitulo se montaba sobre la base del titulo y "beta" quedaba pegado al boton. Van en
     clamp de px. */
  #menuIn{ position:relative; z-index:1; display:flex; flex-direction:column;
    align-items:center; gap:clamp(11px,1.5vw,19px); width:100%; }
  #tit{ font-size:clamp(38px,9.4vw,96px); font-weight:900; letter-spacing:.34em;
    margin-left:.34em; line-height:.98;
    animation:latir 3.6s ease-in-out infinite; }
  @keyframes latir{ 0%,100%{ text-shadow:0 0 0 rgba(255,255,255,0); color:#8b98a6; }
                    50%{ text-shadow:0 0 44px rgba(255,255,255,.60); color:#ffffff; } }
  #sub{ font-size:clamp(8.5px,1.15vw,12px); font-weight:700; letter-spacing:.42em;
    color:#5d6a78; text-transform:uppercase; text-align:center; padding:0 24px; }
  #sub::before, #sub::after{ content:''; display:inline-block; width:clamp(16px,3vw,44px);
    height:1px; background:linear-gradient(90deg,rgba(93,106,120,0),rgba(93,106,120,.8));
    vertical-align:middle; margin:0 12px 3px; }
  #sub::after{ transform:scaleX(-1); }
  /* las tres fichas */
  #fichas{ display:flex; gap:clamp(8px,1.4vw,20px); justify-content:center; flex-wrap:nowrap;
    padding:0 3%; max-width:96%; }
  .ficha{ flex:1 1 0; min-width:0; max-width:230px; padding:clamp(8px,1.2vw,15px) clamp(8px,1.1vw,15px);
    border:1px solid rgba(255,255,255,.075); background:rgba(160,185,215,.028); text-align:left; }
  .ficha h4{ margin:0 0 .5em; font-size:clamp(7.5px,.86vw,9.5px); font-weight:900;
    letter-spacing:.26em; color:#7c8b9b; text-transform:uppercase; }
  .ficha p{ margin:0; font-size:clamp(9px,1.02vw,12px); line-height:1.62; color:#9fb0c1; }
  .ficha b{ color:#e2ebf4; font-weight:800; }
  #jugar{ margin-top:clamp(2px,.5vw,8px); padding:clamp(10px,1.35vw,17px) clamp(38px,5.6vw,74px);
    border-radius:999px; cursor:pointer; position:relative; overflow:hidden;
    font-size:clamp(11px,1.24vw,15px); font-weight:900; letter-spacing:.26em;
    color:#e8eef5; background:transparent; border:1.4px solid rgba(232,238,245,.55);
    transition:color .25s ease, border-color .25s ease, transform .12s ease; }
  #jugar::before{ content:''; position:absolute; inset:0; background:#e8eef5;
    transform:scaleX(0); transform-origin:left; transition:transform .3s cubic-bezier(.2,.9,.25,1);
    z-index:-1; }
  #jugar:hover{ color:#04060a; border-color:#e8eef5; }
  #jugar:hover::before{ transform:scaleX(1); }
  #jugar:active{ transform:scale(.965); }
  #pie{ font-size:clamp(7px,.8vw,9px); letter-spacing:.30em; color:#33404d; }

  /* ---------- el HUD, casi nada ---------- */
  #hud{ position:absolute; inset:0; z-index:20; pointer-events:none; display:none; }
  body.jugando #hud{ display:block; }
  /* el interruptor de sonido: chico, arriba a la derecha, y con puntero propio porque el HUD entero
     no recibe toques */
  #bSon{ position:absolute; right:14px; top:12px; z-index:24;
    width:max(26px, calc(30px * var(--esc,1))); height:max(26px, calc(30px * var(--esc,1)));
    border-radius:50%; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05);
    color:rgba(220,232,244,.75); font-size:13px; line-height:1; cursor:pointer;
    pointer-events:auto; display:none; align-items:center; justify-content:center; padding:0; }
  body.jugando #bSon{ display:flex; }
  #bSon.mudo{ color:rgba(220,232,244,.28); border-color:rgba(255,255,255,.07); }
  /* ---------- EL BLOQUE DE ARRIBA, EN COLUMNA ----------
     Estaba todo posicionado en absoluto con medidas en px por un factor de escala, y eso tiene dos
     problemas que se pisan entre si: si el factor es chico el texto queda ilegible, y si lo agrando
     los bloques se solapan porque las posiciones son fijas. En columna, el solapamiento es imposible
     POR CONSTRUCCION y las fuentes quedan libres de tener un minimo legible. */
  #top{ position:absolute; left:50%; top:calc(10px * var(--esc,1)); transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:calc(3px + 3px * var(--esc,1));
    width:88%; }
  #eco{ font-size:max(9px, calc(10px * var(--esc,1))); font-weight:800; letter-spacing:.20em;
    color:rgba(190,205,220,.42); white-space:nowrap; }
  #reloj{ font-size:max(17px, calc(22px * var(--esc,1))); font-weight:900; letter-spacing:.06em;
    color:rgba(230,240,250,.72); font-variant-numeric:tabular-nums; line-height:1; }
  #aviso{ position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    font-size:clamp(15px,4vw,22px); font-weight:900; letter-spacing:.14em; text-align:center;
    color:#fff; opacity:0; transition:opacity .4s ease; padding:0 22px; }
  #aviso.ver{ opacity:1; }
  /* la mira: un punto, y muy tenue. No hay armas: es para saber donde esta el centro */
  #punto{ position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px 0 0 -1.5px;
    border-radius:50%; background:rgba(255,255,255,.30); }

  /* ---------- los controles del telefono ---------- */
  #joy{ position:absolute; left:20px; bottom:20px;
    width:132px; height:132px; border-radius:50%; z-index:22; display:none;
    background:rgba(255,255,255,.045); border:1.4px solid rgba(255,255,255,.10); }
  #joyP{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:rgba(232,238,245,.30); border:1.4px solid rgba(255,255,255,.22); }
  .btn{ position:absolute; z-index:22; display:none; border-radius:50%; border:1.4px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05); color:#cdd8e3; font-size:10px; font-weight:900;
    letter-spacing:.10em; align-items:center; justify-content:center; cursor:pointer; }
  .btn:active{ background:rgba(255,255,255,.16); }
  #bGrito{ right:20px; bottom:118px; width:86px; height:86px; }
  /* con una hoja sin revelar al lado el boton late: en telefono no hay leyenda de teclas donde
     poner "grita aca", asi que lo dice el boton */
  body.hoja #bGrito{ animation:latirBoton 1.5s ease-in-out infinite; border-color:rgba(255,240,210,.55); }
  @keyframes latirBoton{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,238,205,.00); }
                         50%{ box-shadow:0 0 0 9px rgba(255,238,205,.13); } }
  /* HABLAR VA AL LADO DE GRITAR y no abajo: son la misma accion en dos tamanos, y el pulgar
     derecho tiene que poder ir de una a la otra sin mirar. Mas chico que gritar a proposito. */
  #bHabla{ right:112px; bottom:124px; width:74px; height:74px; font-size:9px; }
  #bSalto{ right:118px; bottom:30px; width:66px; height:66px; }
  #bAgachar{ right:22px; bottom:30px; width:66px; height:66px; font-size:9px; }
  #bAgachar.on{ background:rgba(255,255,255,.20); color:#fff; }
  body.movil.jugando #joy, body.movil.jugando .btn{ display:flex; }

  /* ---------- los cuatro sellos: lo unico que hay que juntar ---------- */
  #sellos{ display:flex; gap:9px; }
  /* ---------- QUE HAY QUE HACER AHORA ----------
     Sin esto el juego no se puede terminar: hay cuatro enigmas repartidos en un laberinto a oscuras
     y nada que te diga cual estas haciendo ni que te falta. Una linea. Se lee de un vistazo y no
     tapa nada. */
  /* MEDIDO EN UN TELEFONO: con la escala en 0,60 esta linea se dibujaba a 6,3 px y el subtitulo a
     5,4, encima al 62% de opacidad. O sea que el unico cartel que dice QUE HAY QUE HACER era
     ilegible justo en el aparato donde se juega. Las posiciones pueden encoger; el texto no.
     Ahora tiene minimo de 12 px, contraste de verdad y un fondo propio, porque tiene que leerse
     igual sobre el negro que sobre el fogonazo, que deja la pantalla clara. */
  #meta{ max-width:100%; text-align:center; font-size:max(12px, calc(11px * var(--esc,1)));
    font-weight:800; letter-spacing:.08em; color:rgba(236,244,252,.95); line-height:1.45;
    padding:calc(4px + 2px * var(--esc,1)) calc(10px + 6px * var(--esc,1));
    border-radius:999px; background:rgba(6,9,14,.58);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); backdrop-filter:blur(3px);
    text-shadow:0 1px 6px rgba(0,0,0,.95); }
  #meta:empty{ display:none; }
  body.tutorial #meta{ display:none; }

  /* ---------- EL TUTORIAL ----------
     El juego no se entendia, y con razon: te suelta en una pantalla negra y espera que descubras
     solo que el ruido es la vista, que hay hojas en las paredes y que hay que gritarles. Ahora hay
     cuatro pasos que se ENSEÑAN HACIENDO: cada uno espera a que hagas la cosa y recien ahi pasa al
     siguiente. No se puede quedar trabado y no se puede saltear sin haber entendido. */
  #tuto{ position:absolute; left:50%; bottom:16%; transform:translateX(-50%); z-index:23;
    display:none; flex-direction:column; align-items:center; gap:7px; text-align:center;
    max-width:84%; }
  body.tutorial.jugando #tuto{ display:flex; }
  #tutoT{ font-size:max(15px, calc(19px * var(--esc,1))); font-weight:900; letter-spacing:.10em;
    color:#fff; text-shadow:0 2px 16px rgba(0,0,0,1); line-height:1.35; }
  #tutoS{ font-size:max(11px, calc(12px * var(--esc,1))); font-weight:700; letter-spacing:.08em;
    color:rgba(210,222,236,.86); text-shadow:0 2px 12px rgba(0,0,0,1); line-height:1.5; }
  #tutoK{ margin-top:3px; font-size:max(11px, calc(12px * var(--esc,1))); font-weight:900;
    letter-spacing:.14em; color:#05070a; background:rgba(245,240,228,.94); border-radius:6px;
    padding:5px 13px; animation:tk 1.5s ease-in-out infinite; }
  #tutoK:empty{ display:none; }
  @keyframes tk{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,244,220,0); }
                 50%{ box-shadow:0 0 0 8px rgba(255,244,220,.18); } }
  #tutoP{ width:min(210px,42vw); height:3px; border-radius:3px; background:rgba(255,255,255,.13);
    overflow:hidden; margin-top:4px; }
  #tutoP i{ display:block; height:100%; width:0%; background:rgba(255,245,225,.80);
    transition:width .25s linear; }

  /* ---------- LA FLECHA QUE DICE PARA DONDE IR ----------
     Un objetivo escrito dice QUE hacer; en un laberinto a oscuras falta el DONDE. Sin esto el
     jugador entiende la consigna y aun asi da vueltas veinte minutos. */
  #guia{ position:absolute; left:50%; top:50%; z-index:21; transform:translate(-50%,-50%);
    display:none; flex-direction:column; align-items:center; gap:2px; pointer-events:none; }
  body.jugando #guia.ver{ display:flex; }
  #guiaF{ font-size:19px; line-height:1; color:rgba(255,226,170,.92);
    text-shadow:0 0 12px rgba(0,0,0,1), 0 0 22px rgba(255,190,110,.45); }
  #guiaD{ font-size:max(9.5px, calc(10px * var(--esc,1))); font-weight:900; letter-spacing:.10em;
    color:rgba(255,232,196,.80); text-shadow:0 1px 8px rgba(0,0,0,1); }
  #meta em{ font-style:normal; color:#ffe9b8; }
  #meta s{ text-decoration:none; display:block; font-size:max(10px, calc(9.5px * var(--esc,1)));
    letter-spacing:.10em; font-weight:700; color:rgba(178,194,212,.80); margin-top:3px; }
  #sellos i{ width:9px; height:9px; border-radius:50%; border:1.4px solid rgba(200,215,230,.32); }
  #sellos i.on{ background:#fff; border-color:#fff; box-shadow:0 0 11px rgba(255,255,255,.75); }

  /* ---------- LA HOJA DE PAPEL ----------
     Antes esto era un globo de texto con borde de un pixel, y en un juego que va de encontrar
     papeles escritos a mano eso rompe todo: el texto mas importante del juego se leia como un
     cartel de sistema. Ahora es una HOJA: foto de papel de trapo envejecido, manchas de humedad,
     esquinas dobladas y un borde roto, apoyada de costado y girada un grado y medio, con la tinta
     en sepia oscuro y la sombra que la separa del fondo.
     LA FOTO VA ADENTRO DEL ARCHIVO (57 KB en WebP, una sola). Es una hoja: no vale bajarla de una
     red que puede no estar, y el juego tiene que andar solo.
     Y VA CON CANAL ALFA. La primera version era WebP opaco y arrastraba el fondo negro de la foto:
     en pantalla se veia un RECTANGULO negro alrededor de la hoja, porque las esquinas dobladas son
     oscuras y el recorte por luminancia no las puede separar del fondo. Con alfa (rampa de 14 a 30
     de luminancia) la sombra sigue la silueta de verdad, borde roto incluido. */
  #nota{ position:absolute; inset:0; z-index:34; display:none; align-items:center;
    justify-content:center; background:rgba(2,3,5,.88); backdrop-filter:blur(2px); }
  #nota.ver{ display:flex; }
  #notaP{ position:relative; height:min(84%, 560px); aspect-ratio:880/627;
    background:var(--hoja) center/100% 100% no-repeat;
    filter:drop-shadow(0 26px 44px rgba(0,0,0,.92));
    transform:rotate(-1.4deg) scale(.965); opacity:0;
    transition:transform .34s cubic-bezier(.2,.9,.25,1), opacity .28s ease;
    padding:7% 12.5% 7.5% 8%; display:flex; flex-direction:column; }
  #nota.ver #notaP{ transform:rotate(-1.4deg) scale(1); opacity:1; }
  #notaT{ font-size:clamp(8px,1.05vw,10.5px); font-weight:900; letter-spacing:.30em;
    color:#7a6144; margin-bottom:3.2%; flex:0 0 auto;
    border-bottom:1px solid rgba(90,66,40,.28); padding-bottom:2.2%; }
  /* el cuerpo del texto entra en la hoja y no se recorta: con 1,42vw y linea 1,72 el ultimo parrafo
     de la nota mas larga quedaba cortado abajo, tapado por el pie. Medido a ojo sobre la foto: con
     estos valores entran catorce lineas en una hoja de 84% de alto. */
  #notaC{ font-family:Georgia,'Times New Roman',serif; font-size:clamp(10px,1.28vw,15.5px);
    line-height:1.56; color:#3a2c1c; flex:1 1 auto; overflow:auto; }
  #notaC b{ color:#1f1710; }
  #notaX{ margin-top:2.5%; font-size:clamp(7px,.85vw,9px); letter-spacing:.20em; color:#8a7357;
    flex:0 0 auto; text-align:right; }

  /* ---------- la pista de "aca se puede leer" ---------- */
  /* el aviso de la hoja va abajo del centro pero ARRIBA de la leyenda de teclas y de los botones:
     en un cuadro bajo, al 60% ya se metia en el bloque de teclas */
  #leerP{ position:absolute; left:50%; top:56%; transform:translateX(-50%);
    font-size:max(11px, calc(10px * var(--esc,1))); font-weight:900; letter-spacing:.14em;
    color:rgba(248,242,230,.92); opacity:0; transition:opacity .22s ease; white-space:nowrap;

  #leerP b{ color:#05070a; background:rgba(245,238,225,.92); border-radius:4px;
    padding:2px 7px; letter-spacing:.10em; }
  #leerP.ver{ opacity:1; }
  #bLeer{ position:absolute; left:50%; bottom:26px; margin-left:-56px; width:112px; height:40px;
    z-index:22; display:none; align-items:center; justify-content:center; border-radius:999px;
    border:1.4px solid rgba(255,255,255,.30); background:rgba(232,238,245,.14); color:#fff;
    font-size:10px; font-weight:900; letter-spacing:.14em; cursor:pointer; }
  #bLeer:active{ background:rgba(255,255,255,.30); }
  body.movil.jugando.cerca #bLeer{ display:flex; }
  /* la barra del grito: dice cuando se puede volver a gritar */
  #gritoAro, #hablaAro{ position:absolute; inset:-4px; border-radius:50%; pointer-events:none;
    background:conic-gradient(rgba(255,255,255,.34) var(--g,0%), rgba(0,0,0,0) 0); }

  /* ---------- la leyenda de teclas, en PC ---------- */
  #teclas{ position:absolute; left:16px; bottom:16px;
    z-index:22; display:none; grid-template-columns:auto auto; gap:4px 10px;
    opacity:0; transition:opacity .6s ease; pointer-events:none; }
  body.pc.jugando #teclas{ display:grid; }
  #teclas.ver{ opacity:1; }
  #teclas i{ font-style:normal; font-size:max(8.5px, calc(9px * var(--esc,1))); font-weight:900;
    letter-spacing:.05em; color:#05070a; background:rgba(232,238,245,.78); border-radius:4px;
    padding:2px 6px; text-align:center; }
  #teclas span{ font-size:max(9.5px, calc(10px * var(--esc,1))); font-weight:700;
    color:rgba(190,205,220,.55); }

  /* ---------- la viñeta ---------- */
  #vineta{ position:absolute; inset:0; z-index:18; pointer-events:none; display:none;
    background:radial-gradient(ellipse 78% 78% at 50% 50%,
      rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 76%, rgba(0,0,0,.62) 100%); }
  body.jugando #vineta{ display:block; }
  /* ---------- LA HISTORIA ----------
     Cuatro planos, cuatro lineas y cuatro voces por idioma. En un juego que empieza en negro
     absoluto y sin una sola palabra, lo primero que le falta al jugador no es una mecanica: es
     saber DONDE ESTA y por que le importa. */
  #cine{ position:absolute; inset:0; z-index:70; background:#000; display:none; overflow:hidden; }
  #cine.ver{ display:block; }
  #cineFoto{ position:absolute; inset:0; background-position:center; background-size:cover;
    background-repeat:no-repeat; animation:ecoAcerca 10s linear both; }
  @keyframes ecoAcerca{ from{ transform:scale(1.00); } to{ transform:scale(1.09) translateX(-1%); } }
  #cine::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 24%,
      rgba(0,0,0,0) 42%, rgba(0,0,0,.9) 80%, #000 100%); }
  #cinePie{ position:absolute; left:8%; right:8%; bottom:max(46px,calc(56px * var(--esc,1)));

    font-size:max(12px,calc(17px * var(--esc,1))); font-weight:600; letter-spacing:.02em;

  #cinePuntos{ position:absolute; left:0; right:0; bottom:max(22px,calc(26px * var(--esc,1)));

  #cinePuntos i{ width:max(6px,calc(7px * var(--esc,1))); height:max(6px,calc(7px * var(--esc,1)));
    border-radius:50%; background:#2b3a42; }
  #cinePuntos i.on{ background:#8fd8ea; box-shadow:0 0 8px rgba(143,216,234,.7); }
  #cineSalta{ position:absolute; top:max(12px,calc(15px * var(--esc,1)));
    right:max(12px,calc(15px * var(--esc,1))); z-index:4;
    background:rgba(10,16,20,.7); color:#9fc4d0; border:1px solid rgba(143,216,234,.35);

    padding:max(6px,calc(7px * var(--esc,1))) max(10px,calc(13px * var(--esc,1)));

  /* el nombre, dibujado y no escrito */
  #logoEco{ display:none; width:min(58%, calc(340px * var(--esc,1))); margin:0 auto;
    filter:drop-shadow(0 0 26px rgba(143,216,234,.28)); }
  #logoEco.hay{ display:block; }
  #menu.conLogo #tit{ display:none; }
  #telonMenu{ position:absolute; inset:0; z-index:0; pointer-events:none;

    -webkit-mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.15) 100%);
    mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.15) 100%); }
  .filaB{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #verCuento{ background:rgba(10,16,20,.6); color:#9fc4d0;
    border:1px solid rgba(143,216,234,.32); border-radius:4px; cursor:pointer;
    letter-spacing:.18em; font-weight:700;
    padding:max(9px,calc(12px * var(--esc,1))) max(14px,calc(20px * var(--esc,1)));
    font-size:max(10px,calc(12px * var(--esc,1))); }
  #verCuento:hover{ border-color:rgba(143,216,234,.7); color:#d6eef5; }
</style>

/* SE LLAMA TX Y NO t A PROPOSITO. Una funcion global de UNA letra es una bomba: cualquier
   script que comparta la pagina —o un eval con un `var t` adentro— la pisa, y cuando se pisa
   no falla el idioma, falla TODO, porque no queda un solo texto que no pase por aca.
   Paso de verdad en una prueba: un `var t` en un eval dejo el juego sin cargar nivel. */
function TX(k,v){
  let s=(L[k] && (L[k][IDIOMA]||L[k].en)) || k;
  if(v) for(const p in v) s=s.split('{'+p+'}').join(v[p]);
  return s;
}

/* ===================== QUE APARATO ES ESTE =====================
   Es telefono solo si tiene tactil Y el puntero es grueso. Con una sola de las dos no alcanza: una
   notebook con pantalla tactil tiene tactil y puntero fino, y ahi el joystick seria un estorbo.
   Y despues manda el ULTIMO metodo que se uso, no el hardware: si en una notebook tactil alguien
   toca la pantalla, aparecen los controles; si mueve el mouse, se van. */
function adivinar(){
  const grueso=!!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const tactil=(navigator.maxTouchPoints||0)>0 || 'ontouchstart' in window;
  return (tactil && grueso) ? 'movil' : 'pc';
}
let plataf=adivinar();
function ponerPlataforma(p){
  if(p===plataf) return;
  plataf=p;
  document.body.classList.toggle('pc', p==='pc');
  document.body.classList.toggle('movil', p==='movil');
  /* la leyenda se muestra con una clase aparte, asi que al pasar a PC en medio de la partida hay
     que volver a encenderla: si no, queda con display puesto y opacidad cero, o sea invisible */
  const T=document.getElementById('teclas');
  if(T){ if(p==='pc'){ T.classList.add('ver'); clearTimeout(T._t);
            T._t=setTimeout(()=>T.classList.remove('ver'), 7000); }
         else T.classList.remove('ver'); }
}
document.body.classList.add(plataf);
/* el celular tambien manda mousemove: Chrome de Android dispara mouse* sintetico despues de cada
   toque por compatibilidad. Si se le cree, el primer toque apaga el joystick y el juego queda sin
   controles. Asi que un mousemove solo cuenta como "mouse" si movio de verdad Y si no viene pegado
   a un toque. */
let ultimoToque=-1e9;
addEventListener('touchstart',()=>{ ultimoToque=performance.now(); ponerPlataforma('movil'); },{passive:true});
addEventListener('touchend',()=>{ ultimoToque=performance.now(); },{passive:true});
addEventListener('mousemove',e=>{
  if(performance.now()-ultimoToque < 1200) return;
  if(!(e.movementX||e.movementY||e.clientX||e.clientY)) return;
  ponerPlataforma('pc');
});
addEventListener('keydown',()=>ponerPlataforma('pc'));

/* ===================== EL LABERINTO =====================
   Se genera con vuelta atras recursiva sobre una grilla de celdas: se cava desde una celda a un
   vecino no visitado, y cuando no queda ninguno se vuelve por donde se vino. Da un laberinto
   PERFECTO —un solo camino entre dos puntos cualesquiera, sin ciclos ni zonas sueltas—, que es lo
   que hace falta para garantizar que la salida se pueda alcanzar.
   Despues se le abren unos pocos atajos: un laberinto perfecto es un arbol, y en un arbol cada
   error te obliga a desandar TODO el ramal. Con un 6% de paredes de menos siguen habiendo decisiones
   pero dejan de haber castigos de un minuto. */
const CEL=4.2;            // el lado de una celda, en metros
/* 11 Y NO 13. Ciento sesenta y nueve celdas a oscuras son muchisimas: entre un enigma y el
   siguiente se caminaban cuarenta o cincuenta salas sin ver nada, y eso no es tension, es
   aburrimiento. Con 11 son 121, un tercio menos, y todo queda mas cerca sin dejar de ser laberinto. */
const N=11;               // celdas por lado (impar queda mejor centrado)
const ALTO=3.4;           // alto de las paredes
const GRUESO=0.34;

function generarLaberinto(n){
  /* pared[y][x] = {n,e,s,o} en true si esa pared existe */
  const cel=[];
  for(let y=0;y<n;y++){ cel.push([]); for(let x=0;x<n;x++) cel[y].push({n:true,e:true,s:true,o:true,v:false}); }
  const pila=[[0,0]]; cel[0][0].v=true;
  const DIR=[[0,-1,'n','s'],[1,0,'e','o'],[0,1,'s','n'],[-1,0,'o','e']];
  while(pila.length){
    const [x,y]=pila[pila.length-1];
    const opciones=[];
    for(const [dx,dy,a,b] of DIR){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n) continue;
      if(cel[ny][nx].v) continue;
      opciones.push([nx,ny,a,b]);
    }
    if(!opciones.length){ pila.pop(); continue; }
    const [nx,ny,a,b]=opciones[(Math.random()*opciones.length)|0];
    cel[y][x][a]=false; cel[ny][nx][b]=false;
    cel[ny][nx].v=true; pila.push([nx,ny]);
  }
  /* los atajos: se tiran paredes internas al azar */
  /* MAS ATAJOS: del 6% al 14%. Un laberinto perfecto es un arbol, y en un arbol cada decision
     equivocada obliga a desandar el ramal ENTERO. A oscuras eso no se siente a desafio, se siente a
     castigo. Con mas paredes de menos hay bucles: casi siempre hay otra forma de volver. */
  let atajos=Math.round(n*n*0.14);
  let intentos=0;
  while(atajos>0 && intentos++<n*n*4){
    const x=1+((Math.random()*(n-2))|0), y=1+((Math.random()*(n-2))|0);
    const [dx,dy,a,b]=DIR[(Math.random()*4)|0];
    const nx=x+dx, ny=y+dy;
    if(nx<1||ny<1||nx>=n-1||ny>=n-1) continue;
    if(!cel[y][x][a]) continue;
    cel[y][x][a]=false; cel[ny][nx][b]=false; atajos--;
  }
  return cel;
}

/* la distancia en pasos desde una celda, por anchura: sirve para poner la salida LEJOS de verdad */
function distancias(cel,n,x0,y0){
  const d=[]; for(let y=0;y<n;y++){ d.push(new Array(n).fill(-1)); }
  d[y0][x0]=0;
  const cola=[[x0,y0]];
  const DIR=[[0,-1,'n'],[1,0,'e'],[0,1,'s'],[-1,0,'o']];
  while(cola.length){
    const [x,y]=cola.shift();
    for(const [dx,dy,a] of DIR){
      if(cel[y][x][a]) continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n) continue;
      if(d[ny][nx]>=0) continue;
      d[ny][nx]=d[y][x]+1; cola.push([nx,ny]);
    }
  }
  return d;
}

const MAPA=generarLaberinto(N);

/* ===================== LAS SALAS =====================
   Un laberinto perfecto son 169 cajas del mismo tamano, y ese es el problema que hace que no se
   sienta un lugar: TODAS las celdas son iguales, asi que no hay forma de saber si ya pasaste por
   ahi. Sin puntos de referencia uno no explora, da vueltas.
   Se abren unas plazas de dos por dos tirando las cuatro paredes internas del bloque. Quedan salas
   de ocho metros y medio de lado, con una columna en el cruce: se leen de lejos con una sola onda y
   funcionan como mojones. Van ANTES de calcular distancias, porque cambian el laberinto de verdad. */
const SALAS=[];
(function abrirSalas(){
  let intentos=0;
  while(SALAS.length<4 && intentos++<300){
    const x=1+((Math.random()*(N-3))|0), y=1+((Math.random()*(N-3))|0);
    if(x===0&&y===0) continue;
    if(SALAS.some(s2=>Math.abs(s2[0]-x)<3 && Math.abs(s2[1]-y)<3)) continue;
    MAPA[y][x].e=false;   MAPA[y][x+1].o=false;
    MAPA[y+1][x].e=false; MAPA[y+1][x+1].o=false;
    MAPA[y][x].s=false;   MAPA[y+1][x].n=false;
    MAPA[y][x+1].s=false; MAPA[y+1][x+1].n=false;
    SALAS.push([x,y]);
  }
})();

const DIST=distancias(MAPA,N,0,0);
/* la salida va en la celda MAS LEJANA en pasos, no en la esquina opuesta: en un laberinto la
   esquina de enfrente puede estar a la vuelta de una pared y arruinar la partida */
let salida=[N-1,N-1], mejor=-1;
for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(DIST[y][x]>mejor){ mejor=DIST[y][x]; salida=[x,y]; }

/* ===================== LA ESCENA ===================== */
const escena=new THREE.Scene();
escena.background=new THREE.Color(0x000000);
/* EL CAMPO DE VISION: 90 GRADOS, Y HORIZONTALES.
   Los tiradores cuentan el campo en horizontal; three.js lo pide en VERTICAL. Con 16:9, 90
   horizontales son 58,72 verticales, no 90. Ponerle 90 a three.js da 121 horizontales y el mundo
   sale estirado como en un ojo de pez. */
const FOV_H=90, ASPECTO=16/9;
const FOV_V=2*Math.atan(Math.tan(FOV_H*Math.PI/360)/ASPECTO)*180/Math.PI;
const camara=new THREE.PerspectiveCamera(FOV_V, ASPECTO, 0.05, 220);
const render=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
/* SE TOPA LA DENSIDAD EN 2. Un telefono moderno da 3 o 3,5, y a esa densidad se dibujan mas del
   doble de pixeles para una diferencia que no se ve — y en un juego cuya imagen es casi toda negra,
   menos todavia. */
render.setPixelRatio(Math.min(devicePixelRatio||1, 2));
render.outputColorSpace=THREE.SRGBColorSpace;
const CAJA=document.getElementById('caja');
CAJA.appendChild(render.domElement);

/* ---------- EL CUADRO: 16:9 SIEMPRE, GIRADO SI EL APARATO ESTA VERTICAL ---------- */
let girado=false, cajaW=16, cajaH=9;
function ajustarCuadro(){
  const W=innerWidth, H=innerHeight;
  girado = H>W;
  const dw=girado?H:W, dh=girado?W:H;     // el espacio disponible, ya girado si hace falta
  let w=dw, h=Math.round(w/ASPECTO);
  if(h>dh){ h=dh; w=Math.round(h*ASPECTO); }
  cajaW=w; cajaH=h;
  /* EL HUD ESCALA CON EL CUADRO. Con medidas fijas en px, en un cuadro bajo —un telefono girado da
     732x412— el reloj, los sellos, la linea del objetivo, el aviso de la hoja y la leyenda de teclas
     se pisan entre si. Medido a 480x270: la linea del objetivo se encimaba con la leyenda Y con el
     aviso de la hoja. Un solo factor lo resuelve para todos los tamanos. */
  CAJA.style.setProperty('--esc', Math.max(0.60, Math.min(1.15, h/720)).toFixed(3));
  CAJA.style.width=w+'px'; CAJA.style.height=h+'px';
  CAJA.style.transform='translate(-50%,-50%)'+(girado?' rotate(90deg)':'');
  render.setSize(w,h);
  camara.aspect=ASPECTO; camara.updateProjectionMatrix();
}
ajustarCuadro();
addEventListener('resize',ajustarCuadro);
addEventListener('orientationchange',()=>setTimeout(ajustarCuadro,120));

/* PASAR UN PUNTO DE LA PANTALLA AL CUADRO. Hace falta porque con el cuadro girado
   getBoundingClientRect devuelve la caja ALINEADA A LOS EJES: para un joystick redondo eso da el
   cuadrado equivocado y el dedo nunca acierta.
   CSS rotate(90deg) manda un punto local (ex,ey) medido desde el centro a (-ey, ex) en la pantalla.
   Invertido: lx = (py - H/2) + w/2 y ly = h/2 - (px - W/2). */
function aCuadro(px,py){
  const W=innerWidth, H=innerHeight;
  if(!girado) return [px-(W-cajaW)/2, py-(H-cajaH)/2];
  return [ (py-H/2)+cajaW/2, cajaH/2-(px-W/2) ];
}
/* y los arrastres: un delta tambien gira */
function dCuadro(dx,dy){ return girado? [dy,-dx] : [dx,dy]; }

/* ===================== LAS ONDAS =====================
   Ocho como maximo, y no es un numero al azar: cada una es un vec4 y un float de uniforme, y el
   bucle del shader los recorre TODOS por fragmento. Con ocho el bucle son ocho distancias por
   pixel, que a esta resolucion no se nota; con treinta y dos si.
   Cuando hay mas ondas que lugares se reemplaza la MAS VIEJA, que es la que ya se apago casi. */
const MAX_ONDAS=8;
const ondaPos=[], ondaDat=[];
for(let i=0;i<MAX_ONDAS;i++){ ondaPos.push(new THREE.Vector3()); ondaDat.push(new THREE.Vector3(-1,0,0)); }
/* ondaDat = (radio, vida 0..1, fuerza) — radio negativo significa apagada */
const ondas=[];   // {i, r, t, dur, fuerza, alcance}

const VEL_SONIDO=13.5;    // m/s del frente de onda. No son 343: a 343 el laberinto parpadea y no se
                          // llega a leer nada. Es la velocidad a la que se LEE, no a la que suena.
function emitir(x,y,z,fuerza,alcance){
  /* el hueco: uno libre, o el mas viejo */
  let i=-1;
  for(let k=0;k<MAX_ONDAS;k++) if(!ondas.some(o=>o.i===k)){ i=k; break; }
  if(i<0){ let vieja=ondas[0]; for(const o of ondas) if(o.t/o.dur > vieja.t/vieja.dur) vieja=o;
           i=vieja.i; ondas.splice(ondas.indexOf(vieja),1); }
  ondas.push({ i, r:0, t:0, dur:alcance/VEL_SONIDO, fuerza, alcance });
  ondaPos[i].set(x,y,z);
}
function ondasTick(dt){
  for(let k=ondas.length-1;k>=0;k--){
    const o=ondas[k];
    o.t+=dt; o.r=o.t*VEL_SONIDO;
    if(o.t>=o.dur){ ondaDat[o.i].set(-1,0,0); ondas.splice(k,1); continue; }
    const vida=1-(o.t/o.dur);
    ondaDat[o.i].set(o.r, vida, o.fuerza);
  }
}

/* ===================== EL MATERIAL QUE SE ENCIENDE CON EL SONIDO ===================== */
const matMundo=new THREE.ShaderMaterial({
  uniforms:{
    uPos:{value:ondaPos}, uDat:{value:ondaDat},
    uBanda:{value:0.42},        // el grosor de la raya del frente, en metros
    uCola:{value:7.0},          // hasta donde llegan las rayas detras del frente
    uRayaSep:{value:1.05},      // cada cuantos metros va una raya
    uRayaFino:{value:3.0},      // que tan marcadas: es la potencia del coseno
    /* el fogonazo del grito y donde esta el ojo, que el fogonazo necesita para el termino de cara */
    uFlash:{value:0},
    uOjo:{value:new THREE.Vector3()},
    uSalida:{value:new THREE.Vector3()},
    /* uEco = cuanto eco vivo hay ahora mismo, de 0 a 1. TODO lo que no sea el frente de una onda se
       multiplica por esto, asi que en silencio absoluto la pantalla queda NEGRA de verdad y no
       "oscura pero se adivina". Era el agujero de la version anterior: el faro de la salida se veia
       siempre, sin hacer un solo ruido. */
    uEco:{value:0},
    uAbierta:{value:0},
    uT:{value:0}
  },
  vertexShader:`
    varying vec3 vW; varying vec3 vN;
    void main(){
      vec4 wp=modelMatrix*vec4(position,1.0);
      vW=wp.xyz; vN=normalize(mat3(modelMatrix)*normal);
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    precision highp float;
    varying vec3 vW; varying vec3 vN;
    uniform vec3 uPos[${MAX_ONDAS}];
    uniform vec3 uDat[${MAX_ONDAS}];
    uniform float uBanda; uniform float uCola; uniform vec3 uSalida; uniform float uT;
    uniform float uEco; uniform float uAbierta;
    uniform float uRayaSep; uniform float uRayaFino; uniform float uFlash; uniform vec3 uOjo;

    void main(){
      float luz=0.0;
      vec3 nN=normalize(vN);
      for(int i=0;i<${MAX_ONDAS};i++){
        if(uDat[i].x < 0.0) continue;
        float r=uDat[i].x, vida=uDat[i].y, fuerza=uDat[i].z;
        vec3 aP=vW-uPos[i];
        float d=length(aP);
        float atras = r - d;      // cuanto quedo por detras del frente
        /* LA RAYA DE ADELANTE, la mas fuerte: el borde de la onda. */
        float frente=1.0-smoothstep(0.0, uBanda, abs(atras));
        /* Y LAS RAYAS DE ATRAS. Antes esto era una cola lisa que se apagaba con la distancia, o sea
           un degrade: el laberinto salia iluminado como con una linterna redonda. Ahora son LINEAS
           CONCENTRICAS cada uRayaSep metros, y eso cambia todo lo que se lee: una linea cruzando una
           pared plana no dice nada, pero al doblar una esquina se QUIEBRA, y al cruzar un hueco se
           corta. Las rayas dibujan la forma; un degrade solo dibuja el brillo.
           El coseno elevado a 26 es lo que las hace finas con los bordes suaves. Con step() salen
           duras y titilan (aliasing) en cuanto la pared se ve de canto. */
        float env = (atras > 0.0) ? (1.0-smoothstep(0.0, uCola, atras)) : 0.0;
        /* PRIMER INTENTO, MEDIDO Y DESCARTADO: anillos finisimos (coseno a la 26). Se veia UN aro
           grande y borroso en la pared de enfrente y nada mas, porque los anillos de atras caen
           todos dentro de la misma celda y no hay geometria donde dibujarlos. Y el brillo medio se
           fue de 80% de pantalla encendida a 9,8%: quedo injugable.
           LO QUE FUNCIONA: dejar la zona iluminada ANCHA como antes, y modularla con franjas. La
           franja no es la luz, es el DIBUJO sobre la luz: cruzando una pared plana es una banda
           recta, al doblar una esquina se quiebra, y al pasar un hueco se corta. Eso es lo que se
           lee como sonar. */
        float cc  = max(0.0, cos(atras * 6.28318 / uRayaSep));
        float rr  = 0.26 + 0.74*pow(cc, uRayaFino);
        /* la onda pierde fuerza con la distancia: el sonido tambien */
        /* 0,013 y no 0,020: con la version anterior una pisada dejaba de verse a los diez metros
           (medido, 0,7 de brillo medio a 9,5 m) y en pasillos de veinte metros eso es caminar a
           ciegas entre paso y paso. */
        float caida=1.0/(1.0+d*d*0.013);
        /* LA CARA IMPORTA. Una pared de frente al ruido devuelve mas que una de canto: es lo que
           hace que las esquinas se lean como esquinas y no como manchas. */
        float cara=clamp(dot(nN, normalize(-aP)), 0.0, 1.0);
        cara=0.35+0.65*cara;
        luz=max(luz, (frente + rr*env*0.62) * vida * fuerza * caida * cara);
      }
      /* EL FOGONAZO DEL GRITO: el laberinto ENTERO encendido dos segundos, y despues se apaga.
         PRIMER INTENTO, MEDIDO Y DESCARTADO: un nivel parejo con el termino de cara contra el ojo.
         Dejo la pantalla BLANCA de punta a punta —220 sobre 255 de brillo medio y 100% de pixeles
         encendidos— y no se leia UNA esquina. El problema no era el nivel: era que sin variacion
         entre caras un laberinto de cajas es una sola superficie.
         LO QUE FUNCIONA SON TRES TONOS POR EJE: un valor para las paredes que miran en X, otro para
         las que miran en Z, otro para el piso y otro para el techo. Es el truco del "ambiente de tres
         tonos" y hace que cada quiebre del laberinto aparezca como un quiebre, gratis, sin sombras.
         Y con la caida por distancia queda profundidad: lo de lejos es mas oscuro, asi que se lee
         cuanto pasillo falta. */
      if(uFlash > 0.001){
        float ax=abs(nN.x), ay=abs(nN.y), az=abs(nN.z);
        float tono = ax*0.340 + az*0.240 + ay*(nN.y>0.0? 0.160 : 0.100);
        /* la caida es floja a proposito: con una caida fuerte el fondo del laberinto quedaba a 51
           sobre 255 y "brille entero" dejaba de ser cierto. Asi lo lejano queda al 45%, que alcanza
           para leer profundidad sin apagar la mitad del mapa. */
        float lejos = mix(1.0, 0.45, smoothstep(6.0, 55.0, distance(vW, uOjo)));
        luz = max(luz, uFlash * tono * lejos);
      }
      /* LA SALIDA LATE, PERO SOLO MIENTRAS HAYA ECO. Sin una referencia fija un laberinto a oscuras
         no se recorre, se deambula; pero un faro encendido en silencio rompe la unica regla del
         juego. Asi que late con el eco: hace ruido y aparece, te quedas quieto y se apaga.
         Con los cuatro sellos late mas fuerte y desde mas lejos: es el premio. */
      float dS=distance(vW, uSalida);
      float alc=mix(22.0, 40.0, uAbierta);
      float faro=(1.0-smoothstep(2.0, alc, dS))*(0.14+0.34*uAbierta+0.10*sin(uT*2.6))*uEco;
      luz=max(luz, faro);
      /* UN GRANO FIJO EN EL MUNDO. Sin esto una pared es un plano de un solo valor, y un plano de un
         solo valor se lee a plastico por mas bien iluminado que este. El ruido va anclado a la
         posicion del mundo (no a la pantalla), asi que no titila al moverse: se lee como piedra. */
      float grano=fract(sin(dot(vW.xz*4.1 + vW.y*2.7, vec2(12.9898,78.233)))*43758.5453);
      luz *= 0.93 + 0.14*grano;
      luz=clamp(luz,0.0,1.0);
      /* blanco y negro, con una pizca de azul en las luces bajas para que no se vea sucio */
      vec3 col=vec3(luz)*vec3(0.95,0.98,1.0);
      gl_FragColor=vec4(col,1.0);
    }`
});

/* ===================== ARMAR EL LABERINTO EN UNA SOLA MALLA =====================
   Trece por trece celdas son unas trescientas paredes. Como mallas sueltas serian trescientas
   llamadas de dibujo; fundidas en una geometria es UNA. Y como todas comparten el material del
   sonido, no hay nada que perder al fundirlas: no se mueven y no se apagan por separado. */
function construirLaberinto(){
  const cajas=[];
  const meter=(w,h,d,x,y,z)=>{ const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); cajas.push(g); };
  const X=(i)=>(i-(N-1)/2)*CEL, Z=(j)=>(j-(N-1)/2)*CEL;

  /* el piso y el techo, de una pieza. El techo importa: sin el, la onda se va para arriba y el
     laberinto se lee como un plano y no como un lugar cerrado. */
  meter(N*CEL+2, 0.4, N*CEL+2, 0, -0.2, 0);
  meter(N*CEL+2, 0.4, N*CEL+2, 0, ALTO+0.2, 0);

  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const c=MAPA[j][i], x=X(i), z=Z(j);
    if(c.n) meter(CEL+GRUESO, ALTO, GRUESO, x, ALTO/2, z-CEL/2);
    if(c.o) meter(GRUESO, ALTO, CEL+GRUESO, x-CEL/2, ALTO/2, z);
    if(i===N-1 && c.e) meter(GRUESO, ALTO, CEL+GRUESO, x+CEL/2, ALTO/2, z);
    if(j===N-1 && c.s) meter(CEL+GRUESO, ALTO, GRUESO, x, ALTO/2, z+CEL/2);
  }
  const g=mergeGeometries(cajas,false);
  for(const c of cajas) c.dispose();
  const m=new THREE.Mesh(g, matMundo);
  m.frustumCulled=false;   // es el mundo entero: recortarlo no ahorra nada y puede fallar
  escena.add(m);
  return m;
}
const laberinto=construirLaberinto();

/* las colisiones salen de la MISMA grilla que las paredes, no de una lista de cajas: preguntar
   "hay pared entre esta celda y la de al lado" es una lectura, y probar contra trescientas cajas
   son trescientas pruebas. */
function celdaDe(x,z){ return [Math.round(x/CEL+(N-1)/2), Math.round(z/CEL+(N-1)/2)]; }
function paredEn(i,j,lado){
  if(i<0||j<0||i>=N||j>=N) return true;
  return !!MAPA[j][i][lado];
}
const RADIO=0.34;          // el radio del cuerpo, para las colisiones
function corregir(px,pz,nx,nz){
  /* se resuelve eje por eje: asi al raspar una pared uno DESLIZA por ella en vez de frenar en seco,
     que es la diferencia entre un movimiento que se siente bien y uno que se traba en cada esquina */
  const [i,j]=celdaDe(px,pz);
  const cx=(i-(N-1)/2)*CEL, cz=(j-(N-1)/2)*CEL;
  const lim=CEL/2-GRUESO/2-RADIO;
  let x=nx, z=nz;
  const lx=x-cx, lz=z-cz;
  if(lx> lim && paredEn(i,j,'e')) x=cx+lim;
  if(lx<-lim && paredEn(i,j,'o')) x=cx-lim;
  if(lz> lim && paredEn(i,j,'s')) z=cz+lim;
  if(lz<-lim && paredEn(i,j,'n')) z=cz-lim;
  /* y las esquinas: si se cruzo a una celda nueva en diagonal hay que revisar la nueva tambien */
  const [i2,j2]=celdaDe(x,z);
  if(i2!==i||j2!==j){
    const c2x=(i2-(N-1)/2)*CEL, c2z=(j2-(N-1)/2)*CEL;
    const l2x=x-c2x, l2z=z-c2z;
    if(l2x> lim && paredEn(i2,j2,'e')) x=c2x+lim;
    if(l2x<-lim && paredEn(i2,j2,'o')) x=c2x-lim;
    if(l2z> lim && paredEn(i2,j2,'s')) z=c2z+lim;
    if(l2z<-lim && paredEn(i2,j2,'n')) z=c2z-lim;
  }
  /* Y LOS TAMBORES FRENAN. Las colisiones salen de la grilla, asi que un tambor plantado en el
     medio de una celda no existe para ellas y el jugador lo cruza como si fuera humo: se ve un
     cilindro con la onda y se pasa por adentro. Un circulo por obstaculo alcanza, y son cuatro. */
  for(const o of OBST){
    const dx=x-o.x, dz=z-o.z, d=Math.hypot(dx,dz), lim2=o.r+RADIO;
    if(d>1e-4 && d<lim2){ x=o.x+dx/d*lim2; z=o.z+dz/d*lim2; }
  }
  return [x,z];
}
/* se llena mas abajo, cuando se plantan los tambores. Va declarado ACA porque corregir() lo lee y
   una constante leida antes de su linea tira ReferenceError y se cae el modulo entero. */
const OBST=[];

/* ===================== LAS NOTAS Y LOS CUATRO ENIGMAS =====================
   El laberinto solo, aunque se vea lindo, es una caminata. Lo que lo vuelve un juego es que haya
   algo que ENTENDER, y en un mundo que se lee por el oido lo que se entiende tiene que entrar por
   ahi: contar paredes con una onda, cruzar en silencio, golpear el piso, gritarle a un tambor.

   TODAS LAS MARCAS VAN AL MATERIAL DEL SONIDO, no a uno propio. O sea que los tambores, los aros y
   los arcos tampoco se ven si no hacés ruido: si se vieran, serian faroles y el juego se caeria.
   Y van FUNDIDAS EN UNA SOLA MALLA, igual que el laberinto: son adorno fijo, no hay nada que ganar
   teniendolas sueltas.
   Las NOTAS si van sueltas y con material propio, porque cada una se enciende sola segun cuantos
   gritos lleva encima. Seis notas son seis llamadas de dibujo; es el precio de que se revelen de a
   una. */
const XC=i=>(i-(N-1)/2)*CEL, ZC=j=>(j-(N-1)/2)*CEL;
const LADOS=['n','e','s','o'];
function paredesDe(i,j){ let n=0; for(const l of LADOS) if(MAPA[j][i][l]) n++; return n; }
function mezclar(a){ for(let k=a.length-1;k>0;k--){ const r=(Math.random()*(k+1))|0; const t=a[k]; a[k]=a[r]; a[r]=t; } return a; }
const usadas=new Set();
const cl=(i,j)=>i+','+j;
function libre(i,j){ return !usadas.has(cl(i,j)); }
function tomar(i,j){ usadas.add(cl(i,j)); return [i,j]; }

/* ---------- ENIGMA 4: el pasillo mas profundo ----------
   Es el que se elige PRIMERO porque es el mas exigente: tiene que ser un sin salida y tiene que ser
   el mas lejano. Si lo eligiera al final, los otros enigmas ya le habrian ocupado la celda. */
const sinSalida=[];
for(let j=0;j<N;j++) for(let i=0;i<N;i++) if(paredesDe(i,j)===3 && !(i===salida[0]&&j===salida[1])) sinSalida.push([i,j]);
sinSalida.sort((a,b)=>DIST[b[1]][b[0]]-DIST[a[1]][a[0]]);
const celP4 = sinSalida.length? tomar(sinSalida[0][0],sinSalida[0][1]) : tomar(0,0);

/* ---------- ENIGMA 3: contar las paredes de una sala y golpear el piso ---------- */
let celP3=null;
for(const c of sinSalida){ if(libre(c[0],c[1]) && DIST[c[1]][c[0]]>=3){ celP3=tomar(c[0],c[1]); break; } }
if(!celP3){ for(let j=1;j<N-1&&!celP3;j++) for(let i=1;i<N-1&&!celP3;i++)
              if(libre(i,j)&&paredesDe(i,j)===2&&DIST[j][i]>=3) celP3=tomar(i,j); }
if(!celP3) celP3=tomar(1,1);
const P3_GOLPES=paredesDe(celP3[0],celP3[1]);

/* ---------- ENIGMA 1: los tres tambores ----------
   Van en celdas de paso (dos salidas o mas) para no tapar un sin salida, y separadas al menos
   cuatro celdas: tres tambores juntos no son un enigma, son un adorno. */
const tambores=[];
{
  const cand=[];
  for(let j=0;j<N;j++) for(let i=0;i<N;i++)
    if(libre(i,j) && paredesDe(i,j)<=2 && DIST[j][i]>=3) cand.push([i,j]);
  mezclar(cand);
  for(const c of cand){
    if(tambores.length>=3) break;
    if(tambores.some(t=>Math.abs(t.cel[0]-c[0])+Math.abs(t.cel[1]-c[1])<4)) continue;
    tambores.push({ cel:tomar(c[0],c[1]), bandas:0 });
  }
  /* si el laberinto salio raro y no hubo tres huecos separados, se relaja la separacion antes de
     quedarse con menos de tres: un enigma que no se puede resolver es peor que uno apretado */
  for(const c of cand){ if(tambores.length>=3) break;
    if(!libre(c[0],c[1])) continue;
    tambores.push({ cel:tomar(c[0],c[1]), bandas:0 }); }
  mezclar(tambores);
  tambores.forEach((t,k)=>{ t.bandas=k+1; });
}
const P1_ORDEN=mezclar([1,2,3]);

/* ---------- ENIGMA 2: el pasillo que no perdona un ruido ----------
   Se busca la tirada recta mas larga del laberinto. Recta y larga importan las dos: cruzar a ciegas
   una linea se puede hacer de memoria, y cruzar a ciegas dos celdas no es nada. */
let corredor=[];
{
  const tiradas=[];
  for(let j=0;j<N;j++){ let run=[[0,j]];
    for(let i=0;i<N-1;i++){ if(!MAPA[j][i].e){ run.push([i+1,j]); } else { tiradas.push(run); run=[[i+1,j]]; } }
    tiradas.push(run); }
  for(let i=0;i<N;i++){ let run=[[i,0]];
    for(let j=0;j<N-1;j++){ if(!MAPA[j][i].s){ run.push([i,j+1]); } else { tiradas.push(run); run=[[i,j+1]]; } }
    tiradas.push(run); }
  tiradas.sort((a,b)=>b.length-a.length);
  for(const t of tiradas){ if(t.length<3) break;
    if(t.every(c=>libre(c[0],c[1]))){ corredor=t; break; } }
  if(!corredor.length) corredor=tiradas[0]||[[0,0]];
  for(const c of corredor) tomar(c[0],c[1]);
}
const CORR_IDX=new Map(); corredor.forEach((c,k)=>CORR_IDX.set(cl(c[0],c[1]),k));

/* ---------- LAS CUATRO LLAVES ----------
   UNA POR SALA, y las salas ya existian: son los unicos cuatro lugares del laberinto que se leen
   distinto de un pasillo, o sea los unicos donde tiene sentido decir "esta en una habitacion".
   La celda se marca como usada ANTES de construir las marcas, si no un prop puede aparecer plantado
   en el mismo metro cuadrado que la llave.
   La llave NO se ve sola: va con el material del sonido, igual que todo. Lo unico propio es un
   resplandor chico que crece de cerca — sin eso, encontrarla seria pisarla de casualidad, porque en
   el frente de una onda de dos segundos una llave de veinte centimetros no se distingue de una
   piedra. Y como el laberinto se dibuja de verdad, ese resplandor lo tapa cualquier pared: solo se
   ve si la tenes a la vista. */
const LLAVES=[];
(function ponerLlaves(){
  const celdas=[];
  for(const s2 of SALAS){
    /* de las cuatro celdas de la sala, la primera que este libre */
    const cuatro=[[s2[0],s2[1]],[s2[0]+1,s2[1]],[s2[0],s2[1]+1],[s2[0]+1,s2[1]+1]];
    let ele=null;
    for(const c of cuatro) if(libre(c[0],c[1])){ ele=c; break; }
    if(ele) celdas.push(tomar(ele[0],ele[1]));
  }
  /* si el laberinto salio con menos de cuatro salas, se completan con las celdas mas lejanas que
     queden libres: cuatro llaves tiene que haber SIEMPRE, la puerta no abre con tres */
  if(celdas.length<4){
    const resto=[];
    for(let j=0;j<N;j++) for(let i=0;i<N;i++)
      if(libre(i,j) && DIST[j][i]>=3 && !(i===salida[0]&&j===salida[1])) resto.push([i,j]);
    resto.sort((a,b)=>DIST[b[1]][b[0]]-DIST[a[1]][a[0]]);
    for(const c of resto){ if(celdas.length>=4) break; celdas.push(tomar(c[0],c[1])); }
  }
  const pedestales=[];
  celdas.slice(0,4).forEach((cel,k)=>{
    const x=XC(cel[0]), z=ZC(cel[1]);
    /* UN MATERIAL POR LLAVE Y NO UNO COMPARTIDO. Con uno solo, el brillo se calcula por llave y se
       escribe en el mismo sitio: manda la ultima del bucle y las cuatro terminan con el brillo de
       esa. O sea que la llave que tenes al lado se ve apagada si la cuarta esta lejos. */
    const matLlave=new THREE.MeshBasicMaterial({color:0x000000});
    const g=new THREE.Group();
    /* la forma: un anillo, un cuerpo y dos dientes. Con una caja no se lee a llave ni de cerca */
    const aro=new THREE.Mesh(new THREE.TorusGeometry(0.19,0.045,8,16), matLlave);
    aro.position.y=0.20; g.add(aro);
    const cana=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.46,0.055), matLlave);
    cana.position.y=-0.20; g.add(cana);
    for(let d=0;d<2;d++){
      const di=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.05,0.058), matLlave);
      di.position.set(0.085, -0.28-d*0.11, 0); g.add(di);
    }
    g.position.set(x, 1.02, z);
    g.frustumCulled=false;
    escena.add(g);
    /* el pedestal SI va con el material del sonido y fundido con los otros tres: es piedra, y es lo
       que hace que al pasar una onda se lea "hay algo en el medio de esta sala" */
    const pe=new THREE.CylinderGeometry(0.26,0.38,0.70,10,1); pe.translate(x,0.35,z); pedestales.push(pe);
    const pl=new THREE.BoxGeometry(0.62,0.10,0.62); pl.translate(x,0.05,z); pedestales.push(pl);
    OBST.push({x, z, r:0.46});
    LLAVES.push({ k, cel, x, z, g, mat:matLlave, tomada:false, oida:false, giro:Math.random()*6.28 });
  });
  if(pedestales.length){
    const pg=mergeGeometries(pedestales,false);
    for(const q of pedestales) q.dispose();
    const pm=new THREE.Mesh(pg, matMundo); pm.frustumCulled=false; escena.add(pm);
  }
})();
const LLAVE_AGARRA=2.20;      // a que distancia se levanta, ademas de estar en su celda
/* CUANDO UNA ONDA TUYA LLEGA A UNA LLAVE, LA LLAVE CONTESTA.
   Y contesta TARDE, no en el mismo cuadro: el sonido tarda en ir y en volver, y esa demora es la
   informacion. Un tintineo a los tres segundos de gritar quiere decir "veinte metros"; uno inmediato
   quiere decir "la tenes al lado". Sin la demora las cuatro llaves sonarian igual y no diria nada. */
function llavesOyen(x,z,alcance){
  for(const l of LLAVES){
    if(l.tomada) continue;
    const d=Math.hypot(l.x-x, l.z-z);
    if(d > alcance*0.86) continue;
    const era=l.oida;
    l.oida=true;
    const ms=Math.round(2*d/VEL_SONIDO*1000);
    setTimeout(()=>{ if(!l.tomada){ son('llave', Math.max(0.25, 1-d/52));
                                    if(!era) avisar(TX('aLlaveSuena'), 2.2); } }, ms);
  }
}
function llavesTick(dt){
  for(const l of LLAVES){
    if(l.tomada) continue;
    l.giro+=dt*0.9;
    l.g.rotation.y=l.giro;
    l.g.position.y=1.02+Math.sin(l.giro*1.7)*0.045;
    const d=Math.hypot(jug.x-l.x, jug.z-l.z);
    /* el resplandor propio: poco y de cerca. 0,05 de lejos es apenas un punto que se adivina */
    const b=0.05+0.55*Math.max(0, 1-d/8.5)+0.35*eco;
    l.mat.color.setRGB(b*0.98, b*0.86, b*0.52);
    /* SE LEVANTA POR CELDA O POR DISTANCIA, LO QUE PASE PRIMERO.
       Solo por distancia no alcanzaba y se midio: la llave va en el centro de su celda y el pedestal
       frena el cuerpo a 0,80 m, pero una celda mide 4,2 m, asi que cruzarla por el borde te deja a
       2,1 m —y en diagonal a 2,97— y la llave no se levantaba. En un juego a oscuras eso es pasar
       por encima de lo que buscas y no enterarte. Estar en su celda YA cuenta. */
    const c=celdaDe(jug.x,jug.z);
    if(jugando && (d<LLAVE_AGARRA || (c[0]===l.cel[0] && c[1]===l.cel[1]))) tomarLlave(l);
  }
}
function tomarLlave(l){
  if(l.tomada) return;
  l.tomada=true;
  l.g.visible=false;
  sellar(l.k, TX('sLlave'));
}

/* ---------- LAS MARCAS EN EL MUNDO, todas en una malla ---------- */
function construirMarcas(){
  const gs=[];
  const meter=(g,x,y,z,rx)=>{ if(rx) g.rotateX(rx); g.translate(x,y,z); gs.push(g); };
  /* los tambores: un cilindro con una, dos o tres bandas talladas. Las bandas son el enunciado del
     enigma: sin algo que los distinga, "en este orden" no quiere decir nada. */
  for(const t of tambores){
    const x=XC(t.cel[0]), z=ZC(t.cel[1]);
    meter(new THREE.CylinderGeometry(0.50,0.56,1.40,18,1), x,0.70,z);
    for(let k=0;k<t.bandas;k++) meter(new THREE.TorusGeometry(0.57,0.055,7,20), x, 0.42+k*0.34, z, Math.PI/2);
    OBST.push({x, z, r:0.62});
  }
  /* el aro del enigma de los golpes */
  meter(new THREE.TorusGeometry(1.15,0.075,7,34), XC(celP3[0]),0.09,ZC(celP3[1]), Math.PI/2);
  /* los cuatro postes del pasillo mas profundo */
  for(const [dx,dz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
    meter(new THREE.BoxGeometry(0.17,0.95,0.17), XC(celP4[0])+dx*1.05, 0.47, ZC(celP4[1])+dz*1.05);
  /* los dos arcos del corredor silencioso, uno en cada punta */
  for(const c of [corredor[0], corredor[corredor.length-1]]){
    const x=XC(c[0]), z=ZC(c[1]);
    const horiz = corredor.length>1 && corredor[0][1]===corredor[1][1];
    const w=horiz? 0.22 : CEL*0.72, d=horiz? CEL*0.72 : 0.22;
    meter(new THREE.BoxGeometry(w,0.20,d), x, 2.62, z);
    /* y las dos jambas: un dintel flotando no se lee como arco, se lee como una viga suelta */
    for(const sg of [-1,1]){
      const jx = horiz? x+sg*(CEL*0.36) : x, jz = horiz? z : z+sg*(CEL*0.36);
      meter(new THREE.BoxGeometry(horiz?0.22:0.26, 2.52, horiz?0.26:0.22), jx, 1.26, jz);
    }
  }

  /* ---------- LA COLUMNA DE CADA SALA ----------
     Va en el cruce de las cuatro celdas. Es el mojon: una plaza vacia de ocho metros y medio se
     parece a cualquier otra plaza vacia, una plaza con una columna en el medio es ESA plaza. */
  for(const s2 of SALAS){
    const cx=XC(s2[0])+CEL/2, cz=ZC(s2[1])+CEL/2;
    meter(new THREE.CylinderGeometry(0.42,0.50,ALTO,14,1), cx, ALTO/2, cz);
    meter(new THREE.BoxGeometry(1.30,0.24,1.30), cx, 0.12, cz);        // la base
    meter(new THREE.BoxGeometry(1.16,0.20,1.16), cx, ALTO-0.10, cz);   // el capitel
    OBST.push({x:cx, z:cz, r:0.66});
  }

  /* ---------- LOS PROPS: MOJONES REPARTIDOS ----------
     Uno de cada cinco celdas lleva algo. No es decoracion: en un laberinto a oscuras donde todas las
     celdas miden lo mismo, un objeto es la UNICA forma de decir "por acá ya pasé". Se elige por un
     hash de la celda, asi que es fijo para cada partida y no cambia entre cuadros.
     Todo va contra las paredes o es finito: lo que se cruza en el medio del paso molesta y no ayuda. */
  const lados=['n','e','s','o'];
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    if(i===0&&j===0) continue;
    if(usadas.has(cl(i,j))) continue;              // las celdas de los enigmas no se tocan
    const h=(i*73856093 ^ j*19349663)>>>0;
    /* una de cada TRES celdas, no una de cada cinco: el laberinto quedo mas chico (11 en vez de 13)
       y con un objeto cada cinco salas seguian sobrando pasillos identicos entre mojon y mojon */
    if(h%3!==0) continue;
    const x=XC(i), z=ZC(j), tipo=(h>>3)%9;
    /* contra que pared: la primera que exista */
    let lado=null;
    for(let k=0;k<4;k++){ const l=lados[(h>>7|0+k)%4]; if(MAPA[j][i][l]){ lado=l; break; } }
    if(!lado) lado='n';
    const dir={n:[0,-1],s:[0,1],o:[-1,0],e:[1,0]}[lado];
    const px=x+dir[0]*(CEL/2-0.55), pz=z+dir[1]*(CEL/2-0.55);
    const ang=Math.atan2(dir[0],dir[1]);
    if(tipo===0){
      /* escombros: cuatro bloques caidos contra la pared */
      for(let k=0;k<4;k++){
        const hh=0.18+0.30*(((h>>(k+2))&7)/7), an=0.28+0.22*(((h>>(k+5))&3)/3);
        const g=new THREE.BoxGeometry(an,hh,an*0.8);
        g.rotateY(ang + ((h>>(k+9))&15)/15*1.2);
        g.translate(px + dir[1]*(k-1.5)*0.52, hh/2, pz - dir[0]*(k-1.5)*0.52);
        gs.push(g);
      }
    } else if(tipo===1){
      /* la losa: un banco de piedra partido */
      const g=new THREE.BoxGeometry(1.70,0.42,0.56); g.rotateY(ang); g.translate(px,0.21,pz); gs.push(g);
      const g2=new THREE.BoxGeometry(0.42,0.30,0.44); g2.rotateY(ang+0.5);
      g2.translate(px + dir[1]*1.05, 0.15, pz - dir[0]*1.05); gs.push(g2);
      OBST.push({x:px, z:pz, r:0.80});
    } else if(tipo===2){
      /* la cadena colgada del techo: no estorba y se lee de lejos */
      const largo=1.5+1.0*(((h>>4)&7)/7);
      const g=new THREE.BoxGeometry(0.075,largo,0.075);
      g.translate(x+dir[0]*0.9, ALTO-largo/2, z+dir[1]*0.9); gs.push(g);
      const g2=new THREE.BoxGeometry(0.30,0.12,0.30);
      g2.translate(x+dir[0]*0.9, ALTO-largo-0.06, z+dir[1]*0.9); gs.push(g2);
    } else if(tipo===3){
      /* el nicho: una repisa con algo encima */
      const g=new THREE.BoxGeometry(0.86,0.13,0.36); g.rotateY(ang);
      g.translate(px+dir[0]*0.34, 1.30, pz+dir[1]*0.34); gs.push(g);
      const g2=new THREE.CylinderGeometry(0.13,0.17,0.34,9,1);
      g2.translate(px+dir[0]*0.34, 1.53, pz+dir[1]*0.34); gs.push(g2);
    } else if(tipo===4){
      /* pilastras: dos medias columnas contra la pared. Es lo que le da cara de sala construida */
      for(const sg of [-1,1]){
        const g=new THREE.CylinderGeometry(0.26,0.30,ALTO,10,1);
        g.translate(px + dir[1]*sg*1.25, ALTO/2, pz - dir[0]*sg*1.25);
        gs.push(g);
        OBST.push({x:px+dir[1]*sg*1.25, z:pz-dir[0]*sg*1.25, r:0.44});
      }
    } else if(tipo===5){
      /* EL POZO: un brocal en el medio de la sala. Es el mojon mas fuerte que hay, porque hay que
         rodearlo: una sala en la que caminaste distinto no se olvida. */
      const br=new THREE.CylinderGeometry(0.92,1.00,0.62,16,1,true); br.translate(x,0.31,z); gs.push(br);
      const bo=new THREE.TorusGeometry(0.96,0.09,7,18); bo.rotateX(Math.PI/2); bo.translate(x,0.62,z); gs.push(bo);
      for(const sg of [-1,1]){ const pos=new THREE.BoxGeometry(0.12,1.70,0.12);
        pos.translate(x+sg*0.92, 0.85, z); gs.push(pos); }
      const vg=new THREE.BoxGeometry(2.10,0.13,0.13); vg.translate(x,1.70,z); gs.push(vg);
      OBST.push({x, z, r:1.16});
    } else if(tipo===6){
      /* LA COLUMNA PARTIDA: el fuste cortado y el resto tirado al lado */
      const alto=1.1+1.0*(((h>>6)&7)/7);
      const f=new THREE.CylinderGeometry(0.30,0.36,alto,11,1); f.translate(px,alto/2,pz); gs.push(f);
      const c=new THREE.CylinderGeometry(0.30,0.30,1.35,11,1);
      c.rotateZ(Math.PI/2); c.rotateY(ang+0.4);
      c.translate(px+dir[1]*1.05, 0.30, pz-dir[0]*1.05); gs.push(c);
      OBST.push({x:px, z:pz, r:0.50});
    } else if(tipo===7){
      /* EL BRASERO apagado: un trípode con una copa. Hace siglos que no arde nada acá. */
      for(let k=0;k<3;k++){ const a2=ang+k*2.094;
        const pa=new THREE.BoxGeometry(0.09,1.05,0.09);
        pa.rotateX(0.20*Math.cos(a2)); pa.rotateZ(-0.20*Math.sin(a2));
        pa.translate(px+Math.sin(a2)*0.24, 0.52, pz+Math.cos(a2)*0.24); gs.push(pa); }
      const co=new THREE.CylinderGeometry(0.44,0.26,0.34,13,1); co.translate(px,1.18,pz); gs.push(co);
      OBST.push({x:px, z:pz, r:0.46});
    } else {
      /* LA FIGURA: algo que alguna vez fue una estatua, sin cabeza y sin un brazo. Es el unico prop
         con forma de persona, y a oscuras eso pega distinto que una caja. */
      const pe=new THREE.BoxGeometry(0.80,0.26,0.80); pe.translate(px,0.13,pz); gs.push(pe);
      const cu=new THREE.BoxGeometry(0.42,1.05,0.30); cu.rotateY(ang); cu.translate(px,0.78,pz); gs.push(cu);
      const ho=new THREE.BoxGeometry(0.56,0.20,0.30); ho.rotateY(ang); ho.translate(px,1.34,pz); gs.push(ho);
      const br2=new THREE.BoxGeometry(0.15,0.62,0.15); br2.rotateX(0.30); br2.rotateY(ang);
      br2.translate(px+Math.cos(ang)*0.30, 1.02, pz-Math.sin(ang)*0.30); gs.push(br2);
      const pi=new THREE.BoxGeometry(0.34,0.44,0.30); pi.rotateY(ang); pi.translate(px,0.36,pz); gs.push(pi);
      OBST.push({x:px, z:pz, r:0.52});
    }
  }
  const g=mergeGeometries(gs,false);
  for(const q of gs) q.dispose();
  const m=new THREE.Mesh(g, matMundo);
  m.frustumCulled=false;
  escena.add(m);
  return m;
}
const marcas=construirMarcas();

/* ---------- LAS NOTAS ---------- */
/* 4,4 Y NO 3,0, Y ESTO ERA UN DEFECTO DE VERDAD.
   La hoja va pegada a una pared, o sea a 1,90 m del centro de su celda. El jugador puede pararse en
   el lado opuesto de ESA MISMA CELDA, a 1,59 m del centro: 3,49 m de la hoja, y en diagonal 3,84.
   Con el alcance en 3,0, buena parte de la celda de la hoja NO CONTABA. El usuario lo dijo tal cual:
   "me acerco y nada". Con 4,4 entra la celda entera y sobra un poco. */
const NOTA_ALC=4.4;
const NOTA_GRITOS=3;

const notas=[];
function ponerNota(cel, claveTit, claveTxt, datos){
  const [i,j]=cel;
  /* la nota va en una pared de la celda, la que haya. Sin esto una nota puede quedar colgada en el
     aire en el medio de un cruce, que es exactamente donde no se lee. */
  const orden=mezclar(LADOS.slice()).filter(l=>MAPA[j][i][l]);
  const lado=orden[0]||'n';
  const g=new THREE.PlaneGeometry(1.05,1.40);
  const mat=new THREE.MeshBasicMaterial({color:0x000000, side:THREE.DoubleSide});
  const me=new THREE.Mesh(g,mat);
  const x=XC(i), z=ZC(j), sep=CEL/2-GRUESO/2-0.03;
  if(lado==='n'){ me.position.set(x, 1.55, z-sep); }
  if(lado==='s'){ me.position.set(x, 1.55, z+sep); me.rotation.y=Math.PI; }
  if(lado==='o'){ me.position.set(x-sep, 1.55, z); me.rotation.y=Math.PI/2; }
  if(lado==='e'){ me.position.set(x+sep, 1.55, z); me.rotation.y=-Math.PI/2; }
  escena.add(me);
  notas.push({ cel:[i,j], lado, claveTit, claveTxt, datos:datos||null, mat, malla:me,
               cargas:0, abierta:false, leida:false, x:me.position.x, z:me.position.z });
}
/* la primera va al lado de la entrada: si el juego no explica el silencio, el enigma del corredor
   es imposible de adivinar y no es un enigma, es una pared */
