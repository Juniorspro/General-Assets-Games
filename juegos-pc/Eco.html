}
/* el texto de una hoja se arma en el momento de leerla, no al crearla: asi cambiar de idioma
   tambien cambia las hojas que ya encontraste */
function textoHoja(nt){
  const e=HOJAS[nt.claveTxt];
  let txt=(e && (e[IDIOMA]||e.en)) || '';
  const d = typeof nt.datos==='function'? nt.datos() : nt.datos;
  if(d) for(const k in d) txt=txt.split('{'+k+'}').join(d[k]);
  return txt;
}
function cerrarNota(){
  /* al cerrar una hoja que explica un enigma, se avisa que hay objetivo nuevo: si no, el jugador
     cierra el papel, vuelve al negro y no le queda nada en la mano */
  if(notaAbierta && notaAbierta._nuevo){ notaAbierta._nuevo=false;
    const i=notas.indexOf(notaAbierta);
    if(NOTA_DE[i]!==null && !SELLOS[NOTA_DE[i]]) avisar(TX('aObjetivo'), 2.2);
  }
  notaAbierta=null; notaEl.classList.remove('ver');
}
notaEl.addEventListener('click',cerrarNota);
notaEl.addEventListener('touchstart',e=>{ e.preventDefault(); cerrarNota(); },{passive:false});
function notaCercana(){
  let mejorN=null, mejorD=1e9;
  for(const nt of notas){ if(!nt.abierta) continue;
    const d=Math.hypot(jug.x-nt.x, jug.z-nt.z);
    if(d<NOTA_ALC && d<mejorD){ mejorD=d; mejorN=nt; } }
  return mejorN;
}
function notaSinAbrirCerca(){
  let mejorN=null, mejorD=1e9;
  for(const nt of notas){ if(nt.abierta) continue;
    const d=Math.hypot(jug.x-nt.x, jug.z-nt.z);
    if(d<NOTA_ALC && d<mejorD){ mejorD=d; mejorN=nt; } }
  return mejorN;
}
function leerCercana(){ const nt=notaCercana(); if(nt && !notaAbierta) abrirNota(nt); }

/* ===================== EL CUERPO =====================
   Es lo unico que se ve siempre, asi que es lo unico que lleva material propio: un blanco apagado
   que no depende de las ondas. Y se ve DE VERDAD: mirando para abajo estan el pecho, las piernas y
   los pies, y adelante las dos manos.
   Sin cuerpo, una pantalla negra con un punto en el medio no se lee como estar en un lugar. */
const matCuerpo=new THREE.MeshBasicMaterial({color:0x6f7a86});
const matPiel  =new THREE.MeshBasicMaterial({color:0x9aa6b2});
/* los colores de referencia y cuanto queda en silencio absoluto. El cuerpo tambien se apaga con el
   eco: el pedido fue que NADA se vea sin hacer ruido, y un cuerpo encendido en un cuarto negro es
   justamente lo que se veia. Queda un 12% de silueta para no perder la referencia de donde estas. */
const CUERPO_BASE=new THREE.Color(0x6f7a86), PIEL_BASE=new THREE.Color(0x9aa6b2);
/* EL PISO ES 0,012 Y NO 0,12, Y LA DIFERENCIA LA ENCONTRO UNA MEDICION.
   three.js guarda el color del material en espacio LINEAL y la salida lo convierte a sRGB. O sea
   que multiplicar por 0,12 no da un 12% en pantalla: da 0,12^(1/2,2) = 36%. Medido: con el piso en
   0,12 el cuerpo se leia a 60 sobre 255 en silencio absoluto, un gris bien visible, y el pedido era
   justo el contrario. 0,012 sale a 13% en pantalla: una silueta que se adivina y nada mas. */
const CUERPO_PISO=0.012;
let eco=0;      // cuanto eco vivo hay, 0 a 1. Lo calcula el bucle y lo lee medio juego.
const cuerpo=new THREE.Group(); camara.add(cuerpo); escena.add(camara);

function caja(w,h,d,x,y,z,m,padre){
  const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m||matCuerpo);
  me.position.set(x,y,z); (padre||cuerpo).add(me); return me;
}
/* el torso y las piernas cuelgan de la camara y NO giran con la vista vertical: si giraran, mirar
   al piso llevaria el pecho a la cara. Van en un grupo que solo hereda el giro horizontal. */
const tronco=new THREE.Group(); cuerpo.add(tronco);
/* el torso va corrido para atras y abajo. Puesto donde va de verdad —el pecho arranca 22 cm debajo
   del ojo— mirar al piso lo unico que muestra es una pared de pecho que tapa la pantalla entera y
   no se ven ni las piernas ni el laberinto. Todos los primera persona con cuerpo hacen esta trampa. */
tronco.position.set(0,-0.10,0.10);
caja(0.40,0.34,0.22, 0,-0.42,-0.02, matCuerpo, tronco);          // pecho, visto desde arriba
caja(0.15,0.44,0.16, -0.13,-0.86,0.02, matCuerpo, tronco);       // muslo izquierdo
caja(0.15,0.44,0.16,  0.13,-0.86,0.02, matCuerpo, tronco);       // muslo derecho
const piernaI=caja(0.13,0.46,0.14, -0.13,-1.30,0.02, matCuerpo, tronco);
const piernaD=caja(0.13,0.46,0.14,  0.13,-1.30,0.02, matCuerpo, tronco);
const pieI=caja(0.15,0.09,0.26, -0.13,-1.55,-0.05, matPiel, tronco);
const pieD=caja(0.15,0.09,0.26,  0.13,-1.55,-0.05, matPiel, tronco);

/* SIN BRAZOS, A PEDIDO. Y con razon: dos cajas a veinte centimetros del ojo se proyectan enormes y
   entran en cuna desde las esquinas de abajo. Medido en su momento, cada antebrazo ocupaba una franja
   de treinta grados; en una pantalla que es casi toda negra eso no lee como un brazo, lee como dos
   tablones grises tapando el juego. El cuerpo de abajo si queda: mirando al piso estan el pecho, los
   muslos, las piernas y los pies, que es lo que hace que uno se sienta EN un lugar.
   No se reemplazan por nada: el hueco de abajo es aire, y el aire deja ver el laberinto. */


/* ===================== EL JUGADOR ===================== */
const OJO=1.62, OJO_AGACHADO=1.04;
const jug={
  x:(0-(N-1)/2)*CEL, z:(0-(N-1)/2)*CEL, y:OJO,
  vx:0, vz:0, vy:0, giro:0, alto:0, enPiso:true, agachado:false,
  ojo:OJO,          // la altura del ojo, que baja al agacharse con un muelle y no de golpe
  paso:0,           // la fase del ciclo de la marcha, 0 a 1. Dos pisadas por ciclo.
  dip:0, dipV:0,    // el muelle del aterrizaje
  roll:0,           // la inclinacion al ir de costado
  ruido:0           // cuanto ruido viene haciendo: alimenta el rotulo del HUD
};
const salidaMundo=new THREE.Vector3((salida[0]-(N-1)/2)*CEL, 1.2, (salida[1]-(N-1)/2)*CEL);
matMundo.uniforms.uSalida.value.copy(salidaMundo);

const tecla={};
addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  /* con una nota abierta cualquier tecla la cierra, y NO hace lo que esa tecla hace: si no, cerrar
     el papel con la barra te manda un salto de regalo */
  if(notaAbierta){ e.preventDefault(); cerrarNota(); return; }
  tecla[k]=true;
  if(k===' ') { e.preventDefault(); saltar(); }
  if(k==='e') gritar();
  if(k==='f') leerCercana();
  if(k==='c'||k==='control'){ e.preventDefault(); agacharBoton=!agacharBoton; pintarAgachar(); }
  if(k==='escape'){ document.exitPointerLock&&document.exitPointerLock(); }
});
addEventListener('keyup',e=>{ tecla[(e.key||'').toLowerCase()]=false; });

/* el mouse con captura de puntero: en un juego de mirar alrededor, sin captura el cursor se choca
   con el borde de la ventana y la vista se traba */
let pitch=0;
render.domElement.addEventListener('click',()=>{
  if(!jugando) return;
  if(!document.pointerLockElement && render.domElement.requestPointerLock)
    render.domElement.requestPointerLock();
});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==render.domElement) return;
  const [mx,my]=dCuadro(e.movementX||0, e.movementY||0);
  jug.giro -= mx*0.0022;
  pitch = Math.max(-1.35, Math.min(1.35, pitch - my*0.0022));
});

/* ---------- el joystick y el arrastre para mirar, en telefono ---------- */
const joyEl=document.getElementById('joy'), joyP=document.getElementById('joyP');
const joy={x:0,y:0,bruto:0}; let joyId=null, mirarId=null, mirarX=0, mirarY=0;
/* el rectangulo del joystick se lee de offset*, que son coordenadas DE LA CAJA y no de la pantalla.
   getBoundingClientRect no sirve: con el cuadro girado devuelve la caja alineada a los ejes. */
function joyRect(){ return { l:joyEl.offsetLeft, t:joyEl.offsetTop, w:joyEl.offsetWidth, h:joyEl.offsetHeight }; }
function dentroJoy(t){ const r=joyRect(), [x,y]=aCuadro(t.clientX,t.clientY);
  return x>=r.l-26 && x<=r.l+r.w+26 && y>=r.t-26 && y<=r.t+r.h+26; }
addEventListener('touchstart',e=>{
  if(!e.changedTouches) return;
  for(const t of e.changedTouches){
    if(joyId===null && dentroJoy(t)){ joyId=t.identifier; moverJoy(t); }
    else if(mirarId===null){ const [lx,ly]=aCuadro(t.clientX,t.clientY);
      if(lx>cajaW*0.30){ mirarId=t.identifier; mirarX=lx; mirarY=ly; } }
  }
},{passive:true});
addEventListener('touchmove',e=>{
  if(!e.changedTouches) return;
  for(const t of e.changedTouches){
    if(t.identifier===joyId) moverJoy(t);
    else if(t.identifier===mirarId){
      const [lx,ly]=aCuadro(t.clientX,t.clientY);
      jug.giro -= (lx-mirarX)*0.0052;
      pitch = Math.max(-1.35, Math.min(1.35, pitch - (ly-mirarY)*0.0052));
      mirarX=lx; mirarY=ly;
    }
  }
},{passive:true});
addEventListener('touchend',e=>{
  if(!e.changedTouches) return;
  for(const t of e.changedTouches){
    if(t.identifier===joyId){ joyId=null; joy.x=0; joy.y=0; joy.bruto=0; joyP.style.transform='translate(0,0)'; }
    if(t.identifier===mirarId) mirarId=null;
  }
},{passive:true});
function moverJoy(t){
  const r=joyRect(), cx=r.l+r.w/2, cy=r.t+r.h/2, [lx,ly]=aCuadro(t.clientX,t.clientY);
  let dx=(lx-cx)/(r.w/2), dy=(ly-cy)/(r.h/2);
  /* SE GUARDA LA DESVIACION EN BRUTO, antes de recortarla. De ahi sale el correr en telefono:
     empujar el dedo MAS ALLA del aro. El umbral que habia antes (0,90 de desviacion ya recortada)
     estaba roto de raiz: un joystick de pulgar se lleva al borde para caminar normal, asi que
     medido, en telefono el personaje corria SIEMPRE y la velocidad de caminar no existia. */
  joy.bruto=Math.hypot(dx,dy);
  const L=joy.bruto; if(L>1){ dx/=L; dy/=L; }
  joy.x=dx; joy.y=dy;
  joyP.style.transform='translate('+(dx*36)+'px,'+(dy*36)+'px)';
}
const tocar=(id,fn)=>{ const el=document.getElementById(id); if(!el) return;
  el.addEventListener('touchstart',ev=>{ ev.preventDefault(); fn(); },{passive:false});
  el.addEventListener('pointerdown',ev=>{ if(ev.pointerType==='touch') return; fn(); }); };
tocar('bSalto',()=>saltar());
tocar('bGrito',()=>gritar());
tocar('bLeer',()=>leerCercana());
tocar('bSon',()=>{ AUD.on=!AUD.on;
  const b=document.getElementById('bSon');
  if(b){ b.classList.toggle('mudo', !AUD.on); b.textContent = AUD.on? '♪' : '×'; }
  if(AUD.drone && AUD.ctx) try{ AUD.drone.gain.value = AUD.on? 0.012 : 0; }catch(e){} });
/* agacharse en telefono es un INTERRUPTOR y no un boton que se mantiene: el enigma del corredor
   pide cruzar veinte metros agachado, y sostener un boton con el pulgar mientras el otro maneja el
   joystick no se puede. En PC C y Ctrl hacen lo mismo. */
let agacharBoton=false;
function pintarAgachar(){ const b=document.getElementById('bAgachar');
  if(b) b.classList.toggle('on', agacharBoton); }
tocar('bAgachar',()=>{ agacharBoton=!agacharBoton; pintarAgachar(); });

/* ===================== LO QUE HACE RUIDO ===================== */
/* EL SALTO SE PIDE Y SE GUARDA. Apretar en el aire un pelo antes de tocar el piso tiene que valer:
   sin ese margen el salto se siente roto y la culpa se le echa al juego, no al dedo. */
let saltoPedido=0, coyote=0;
function saltar(){ if(!jugando) return; saltoPedido=0.16; }
let gritoT=0, gritoMax=6.0;
const GRITO_ESPERA=4.0, GRITO_ESPERA_NOTA=1.6;
/* el fogonazo: dos segundos enteros encendido y despues se apaga en medio segundo. Se sostiene
   plano y NO se desvanece de a poco durante los dos segundos: si se desvanece, no se lee como un
   fogonazo, se lee como una onda mas grande. */
const FLASH_DURA=2.0, FLASH_APAGA=0.55;
let flashT=0, flash=0;
function gritar(){
  if(!jugando||gritoT>0) return;
  /* LA ESPERA SE ACORTA AL LADO DE UNA NOTA SIN REVELAR, y no es un mimo: revelarla pide tres
     gritos, y a seis segundos cada uno son dieciocho segundos parado mirando una pared. Medido en
     una prueba: tres gritos seguidos dejaban la nota en 1 de 3 porque los otros dos caian en la
     espera. Con dos segundos son seis, y de paso la pared que contesta rapido se lee como que ahi
     hay algo. Lejos de una nota el grito sigue costando los seis: es el recurso del juego. */
  let hayNota=false;
  for(const nt of notas) if(!nt.abierta && cerca(nt.x,nt.z,NOTA_ALC)){ hayNota=true; break; }
  gritoMax = hayNota? GRITO_ESPERA_NOTA : GRITO_ESPERA;
  gritoT = gritoMax;
  flashT = FLASH_DURA;  flash = 1;
  tutoGritos++;
  /* el grito ve MUCHO mas lejos y mas fuerte: es el recurso, y por eso tiene espera */
  ruido('grito', jug.x, jug.y, jug.z, 1.0, 46);
  avisar('');
}
function pisada(fuerte){
  ruido('paso', jug.x, 0.35, jug.z, fuerte?0.85:0.55, fuerte?24:15);
}

/* ===================== EL SONIDO =====================
   UN JUEGO QUE VA DE ESCUCHAR EL ECO NO PUEDE SER MUDO. Era lo que mas le faltaba: todo el diseño
   dice "esto se oye" y despues no sonaba nada, asi que el grito era un boton que prendia luces.

   TODO ES PROCEDURAL: ni un archivo. Ruido blanco de un segundo generado una vez y filtrado distinto
   para cada golpe, mas dos osciladores para el sello. Pesa cero y no depende de ninguna red.

   Y LA REVERB ES LA PIEZA CENTRAL, no un adorno. La respuesta al impulso se arma con ruido que decae
   en 2,8 segundos: es literalmente un eco de piedra. Cada sonido va por dos caminos, seco y enviado
   a la reverb, y el grito manda mucho mas que una pisada — por eso gritar SUENA a laberinto y un
   paso suena a paso. */
const AUD={ ctx:null, on:true };
function audioIniciar(){
  if(AUD.ctx) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  let ctx; try{ ctx=new C(); }catch(e){ return; }
  AUD.ctx=ctx;
  const maestro=ctx.createGain(); maestro.gain.value=0.0; maestro.connect(ctx.destination);
  maestro.gain.linearRampToValueAtTime(1.0, ctx.currentTime+1.4);
  /* la respuesta al impulso: ruido que decae. El arranque suave de 4 ms evita el "clic" del primer
     sample, que en una reverb se escucha como un chasquido en cada sonido. */
  const seg=2.8, n=Math.floor(ctx.sampleRate*seg);
  const ir=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c);
    for(let i=0;i<n;i++){ const t=i/n;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,2.4)*(t<0.0015? t/0.0015 : 1); } }
  const conv=ctx.createConvolver(); conv.buffer=ir;
  const envio=ctx.createGain(); envio.gain.value=1.0;
  envio.connect(conv); conv.connect(maestro);
  const seco=ctx.createGain(); seco.gain.value=0.78; seco.connect(maestro);
  const nn=ctx.sampleRate|0;
  const rb=ctx.createBuffer(1,nn,ctx.sampleRate);
  const rd=rb.getChannelData(0);
  for(let i=0;i<nn;i++) rd[i]=Math.random()*2-1;
  /* un analizador colgado del maestro. No es para el juego: es para poder COMPROBAR que suena.
     Sin esto, "el audio anda" seria "no tiro excepcion", que no es lo mismo ni parecido. */
  try{ const an=ctx.createAnalyser(); an.fftSize=2048; maestro.connect(an); AUD.an=an;
       AUD.buf=new Float32Array(an.fftSize); }catch(e){}
  AUD.maestro=maestro; AUD.seco=seco; AUD.envio=envio; AUD.ruido=rb;
  /* el zumbido de fondo, casi inaudible. Sin el, el silencio del juego suena a archivo cortado y no
     a un lugar; con el, se siente que hay aire ahi abajo.
     A 0,030 el zumbido COMPETIA con todo lo demas: medido, un grito daba 0,0228 de RMS contra 0,0122
     del zumbido solo, o sea vez y media. Un grito tiene que ser un acontecimiento, no un matiz. A
     0,012 el fondo se sigue sintiendo y deja lugar. */
  try{
    const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=37;
    const og=ctx.createGain(); og.gain.value=0.012;
    osc.connect(og); og.connect(maestro); osc.start();
    AUD.drone=og;
  }catch(e){}
}
/* un golpe de ruido filtrado, con envolvente. Es el ladrillo de todos los sonidos. */
function golpeRuido(dur, tipo, f0, f1, q, vol, env){
  const ctx=AUD.ctx, t=ctx.currentTime;
  const src=ctx.createBufferSource(); src.buffer=AUD.ruido; src.loop=true;
  src.playbackRate.value=0.85+Math.random()*0.3;
  const bq=ctx.createBiquadFilter(); bq.type=tipo; bq.Q.value=q||1;
  bq.frequency.setValueAtTime(f0,t);
  bq.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+dur*0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(bq); bq.connect(g); g.connect(AUD.seco);
  const e=ctx.createGain(); e.gain.value=env; g.connect(e); e.connect(AUD.envio);
  src.start(t); src.stop(t+dur+0.05);
}
function tono(frec, dur, vol, env, tipoOsc){
  const ctx=AUD.ctx, t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type=tipoOsc||'sine'; o.frequency.setValueAtTime(frec,t);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AUD.seco);
  const e=ctx.createGain(); e.gain.value=env; g.connect(e); e.connect(AUD.envio);
  o.start(t); o.stop(t+dur+0.05);
}
function son(tipo, f){
  if(!AUD.ctx || !AUD.on) return;
  if(AUD.ctx.state==='suspended'){ try{ AUD.ctx.resume(); }catch(e){} }
  f = f==null? 1 : f;
  try{
    if(tipo==='paso'){    golpeRuido(0.16,'lowpass', 1500, 260, 0.9, 0.34*f, 0.34);
                          tono(58+Math.random()*8, 0.10, 0.14*f, 0.20); }
    else if(tipo==='caida'){ golpeRuido(0.26,'lowpass', 1100, 150, 1.1, 0.62*f, 0.70);
                          tono(46, 0.20, 0.28*f, 0.40); }
    else if(tipo==='salto'){ golpeRuido(0.11,'highpass', 700, 1600, 0.8, 0.16, 0.25); }
    /* EL GRITO: dos formantes sobre ruido y un envio a la reverb TRES VECES mas alto que el de una
       pisada. Esa diferencia de envio es lo que hace que el grito suene a "acabo de despertar un
       laberinto entero" y no a un ruido mas fuerte. */
    else if(tipo==='grito'){
      const ctx=AUD.ctx, t=ctx.currentTime;
      for(const [fr,q,v] of [[760,2.6,0.52],[1280,3.4,0.30],[2300,4.0,0.12]]){
        const src=ctx.createBufferSource(); src.buffer=AUD.ruido; src.loop=true;
        const bq=ctx.createBiquadFilter(); bq.type='bandpass'; bq.Q.value=q;
        bq.frequency.setValueAtTime(fr*1.12,t);
        bq.frequency.exponentialRampToValueAtTime(fr*0.80, t+0.55);
        const g=ctx.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(v, t+0.055);
        g.gain.setValueAtTime(v, t+0.20);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.60);
        src.connect(bq); bq.connect(g); g.connect(AUD.seco);
        const e=ctx.createGain(); e.gain.value=1.6; g.connect(e); e.connect(AUD.envio);
        src.start(t); src.stop(t+0.7);
      }
    }
    else if(tipo==='sello'){ tono(622,1.5,0.26,1.1); tono(933,1.3,0.15,1.1);
                             setTimeout(()=>{ if(AUD.ctx&&AUD.on) tono(1245,1.6,0.10,1.2); }, 130); }
    else if(tipo==='papel'){ golpeRuido(0.34,'highpass', 1800, 4200, 0.7, 0.24, 0.30); }
    /* el resuello de la cosa: ruido grave y aspero, con muy poca reverb para que suene CERCA aunque
       este lejos. Un resuello con eco se confunde con el ambiente; uno seco se te mete en la nuca. */
    else if(tipo==='resuello'){ golpeRuido(0.42,'bandpass', 220, 130, 2.2, 0.34*f, 0.16);
                                tono(52+Math.random()*10, 0.30, 0.12*f, 0.10, 'sawtooth'); }
    else if(tipo==='resuelloLento'){ golpeRuido(0.70,'lowpass', 380, 150, 1.2, 0.20*f, 0.22); }
    else if(tipo==='agarron'){ golpeRuido(0.55,'lowpass', 900, 90, 1.0, 0.75, 0.9);
                               tono(74,0.7,0.34,0.7,'sawtooth'); tono(58,0.9,0.30,0.7,'square'); }
    else if(tipo==='tambor'){ tono(96,0.9,0.34,1.0); golpeRuido(0.5,'lowpass',900,180,1.4,0.28,0.9); }
    else if(tipo==='mal'){ tono(140,0.5,0.20,0.6,'sawtooth'); tono(133,0.5,0.18,0.6,'sawtooth'); }
    else if(tipo==='salida'){ tono(392,2.4,0.26,1.3); tono(523,2.4,0.20,1.3); tono(784,2.2,0.13,1.3); }
  }catch(e){}
}

/* ===================== IDIOMA: PINTAR Y ELEGIR ===================== */
function pintarIdioma(){
  for(const el of document.querySelectorAll('[data-i18n]')) el.innerHTML=TX(el.getAttribute('data-i18n'));
  pintarTeclas();
  /* si hay una hoja abierta se vuelve a armar con el idioma nuevo */
  if(notaAbierta) abrirNota(notaAbierta);
  const m=document.getElementById('meta'); if(m) m._ult=null;
  const T=document.getElementById('tutoT'); if(T) T._p=null;
}
function elegirIdioma(cod){
  IDIOMA=cod;
  try{ localStorage.setItem('eco_idioma', cod); }catch(e){}
  document.documentElement.lang=cod;
  pintarIdioma();
}
(function armarIdioma(){
  const cont=document.getElementById('idBotones');
  for(const [cod,nom] of IDIOMAS){
    const b=document.createElement('button'); b.className='idB'; b.textContent=nom;
    const ir=()=>{ elegirIdioma(cod);
      document.getElementById('idioma').classList.add('ir');
      document.body.classList.remove('tapa');
      setTimeout(()=>{ const e=document.getElementById('idioma'); if(e) e.style.display='none';
        /* la primera vez la historia se cuenta sola: un juego que arranca en negro absoluto y sin
           una palabra no deja claro DONDE esta uno ni por que le importa */
        if(!cineHecha()) abrirCine();
      }, 420); };
    b.addEventListener('click', ir);
    b.addEventListener('touchstart', ev=>{ ev.preventDefault(); ir(); }, {passive:false});
    cont.appendChild(b);
  }
  document.body.classList.add('tapa');
  elegirIdioma(IDIOMA);
  /* y desde el menu se puede volver a elegir */
  const c=document.getElementById('cambiaIdioma');
  if(c){ const volver=()=>{ const e=document.getElementById('idioma');
      e.style.display=''; e.classList.remove('ir'); document.body.classList.add('tapa'); };
    c.addEventListener('click', volver);
    c.addEventListener('touchstart', ev=>{ ev.preventDefault(); volver(); }, {passive:false}); }
})();

/* ===================== LA HISTORIA Y EL AMBIENTE ===================== */
/* Todo por WebAudio y colgado del MAESTRO, que es lo que ya mide el analizador: en este juego el
   sonido no es adorno, es el mecanismo, asi que cualquier cosa que se agregue tiene que poder
   compararse contra un grito. */
const BUFE={};
let cineK=-1, cineFuente=null, cineReloj=null, ambFuente=null, ambGan=null, ambK='';
const CINE_N=4, CINE_TOPE=11000;
function b64aBytes(d){
  const t=atob(d.slice(d.indexOf(',')+1));
  const b=new Uint8Array(t.length);
  for(let k=0;k<t.length;k++) b[k]=t.charCodeAt(k);
  return b.buffer;
}
function decodificar(k, dato, luego){
  if(!AUD.ctx || BUFE[k]) return;
  try{ AUD.ctx.decodeAudioData(b64aBytes(dato), b=>{ BUFE[k]=b; if(luego) luego(k); }, ()=>{}); }catch(e){}
}
function cargarAmbiente(){ if(AUD.ctx) for(const k in AMB) decodificar(k, AMB[k], n=>{ if(ambK===n) ambiente(n); }); }
function cargarVoces(){ if(AUD.ctx) for(const k in VOZ) decodificar(k, VOZ[k]); }
/* EL AMBIENTE VA MUY ABAJO Y ESO ESTA MEDIDO. La regla de este juego ya estaba escrita para el
   zumbido: a 0,030 competia con un grito -0,0228 de RMS el grito contra 0,0122 el zumbido, o sea
   vez y media- y un grito tiene que ser un ACONTECIMIENTO, no un matiz. La cama de ambiente se
   pone al mismo criterio: se sube hasta donde el grito siga midiendo al menos el doble. */
const AMB_VOL=0.055;
function ambiente(k){
  ambK=k||'';
  if(ambFuente){ try{ ambFuente.stop(); }catch(e){} ambFuente=null; }
  if(!k || !AUD.on || !AUD.ctx || !AUD.maestro) return;
  const b=BUFE[k]; if(!b) return;
  try{
    ambGan=AUD.ctx.createGain(); ambGan.gain.value=AMB_VOL;
    const f=AUD.ctx.createBufferSource(); f.buffer=b; f.loop=true;
    f.connect(ambGan); ambGan.connect(AUD.maestro); f.start();
    ambFuente=f;
  }catch(e){ ambFuente=null; }
}
function ambienteVol(v){ if(ambGan) try{ ambGan.gain.value=v; }catch(e){} }

function cineHecha(){ try{ return localStorage.getItem('eco_cine')==='1'; }catch(e){ return true; } }
function marcarCine(){ try{ localStorage.setItem('eco_cine','1'); }catch(e){} }
function cineParar(){
  if(cineFuente){ try{ cineFuente.onended=null; cineFuente.stop(); }catch(e){} cineFuente=null; }
  if(cineReloj){ clearTimeout(cineReloj); cineReloj=null; }
}
function cinePlano(k){
  cineParar(); cineK=k;
  if(k>=CINE_N){ cerrarCine(); return; }
  const foto=document.getElementById('cineFoto');
  const im=IMGC['cine'+(k+1)];
  foto.style.backgroundImage = im? 'url('+im+')' : 'none';
  foto.style.animation='none'; void foto.offsetWidth; foto.style.animation='';
  document.getElementById('cinePie').textContent=TX('cine'+(k+1));
  const p=document.getElementById('cinePuntos'); p.innerHTML='';
  for(let n=0;n<CINE_N;n++){ const i=document.createElement('i'); if(n<=k) i.className='on'; p.appendChild(i); }
  let dur=0;
  const b=BUFE[IDIOMA+(k+1)];
  if(b && AUD.on && AUD.ctx){
    try{
      if(AUD.ctx.state==='suspended') AUD.ctx.resume();
      const f=AUD.ctx.createBufferSource(); f.buffer=b;
      const g=AUD.ctx.createGain(); g.gain.value=0.95;
      f.connect(g); g.connect(AUD.maestro);
      f.onended=()=>{ if(cineK===k) cinePlano(k+1); };
      f.start(); cineFuente=f; dur=b.duration;
    }catch(e){}
  }
  cineReloj=setTimeout(()=>{ if(cineK===k) cinePlano(k+1); }, dur>0? dur*1000+800 : CINE_TOPE);
}
function abrirCine(){
  audioIniciar(); cargarVoces(); cargarAmbiente();
  ambiente('ambMenu'); ambienteVol(AMB_VOL*0.35);
  document.getElementById('cine').classList.add('ver');
  cinePlano(0);
}
function cerrarCine(){
  cineParar(); cineK=-1; marcarCine();
  ambienteVol(AMB_VOL);
  document.getElementById('cine').classList.remove('ver');
}
(function armarCine(){
  const b=document.getElementById('cineSalta');
  b.addEventListener('click', e=>{ e.stopPropagation(); cerrarCine(); });
  b.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); cerrarCine(); },{passive:false});
  const c=document.getElementById('cine');
  const seguir=()=>{ if(cineK>=0) cinePlano(cineK+1); };
  c.addEventListener('click', seguir);
  c.addEventListener('touchstart', e=>{ e.preventDefault(); seguir(); },{passive:false});
  const v=document.getElementById('verCuento');
  if(v){ const ver=()=>abrirCine();
    v.addEventListener('click', ver);
    v.addEventListener('touchstart', e=>{ e.preventDefault(); ver(); },{passive:false}); }
})();

(function piezasMenu(){
  const lg=document.getElementById('logoEco');
  if(lg && IMGC.logo){ lg.src=IMGC.logo; lg.classList.add('hay');
    document.getElementById('menu').classList.add('conLogo'); }
  const tl=document.getElementById('telonMenu');
  if(tl && IMGC.telon) tl.style.backgroundImage='url('+IMGC.telon+')';
})();

/* ===================== EL MENU ===================== */
let jugando=false, tiempo=0, ganado=false, selloAviso=0;
const menuEl=document.getElementById('menu');
document.getElementById('jugar').addEventListener('click',()=>{
  /* el audio SOLO se puede crear desde un gesto del usuario: los navegadores bloquean un
     AudioContext creado al cargar la pagina, y queda "suspended" para siempre */
  audioIniciar(); cargarAmbiente(); ambiente('ambJuego');
  menuEl.classList.add('ir');
  setTimeout(()=>{ menuEl.style.display='none'; },460);
  document.body.classList.add('jugando');
  jugando=true; tiempo=0; ganado=false;
  if(plataf==='pc'){ const T=document.getElementById('teclas'); T.classList.add('ver');
    setTimeout(()=>T.classList.remove('ver'), 7000); }
  /* la primera onda, de regalo: si el juego empieza en negro absoluto nadie entiende que paso */
  emitir(jug.x, jug.y, jug.z, 1.0, 40);
  eco=1;
  avisar(TX('aEscucha'), 3.0);
});

/* ===================== LA COSA =====================
   Un monstruo que te sigue, y que en este juego solo puede funcionar de una forma: CAZANDO POR EL
   RUIDO. Todo el juego dice que el sonido es lo que existe, asi que un bicho que te ve seria una
   regla nueva y peor; uno que te OYE convierte la mecanica en un dilema. Para ver hay que hacer
   ruido, y hacer ruido es exactamente lo que lo trae. Agacharse deja de ser un truco para un enigma
   y pasa a ser la forma de escaparse.

   VA CON EL MATERIAL DE LAS ONDAS, no con uno propio: se ve cuando una onda lo toca y desaparece
   cuando pasa, igual que las paredes. Verlo un cuadro en el frente de tu propio grito y perderlo es
   la mitad del susto. Lo unico suyo son los ojos, que emiten poquito y de cerca — si no, no habria
   forma justa de darse cuenta de que lo tenes encima.

   Y NO MATA. Te agarra, te sacude y aparecés en la entrada con los sellos que ya tenias. El juego es
   de entender un laberinto, no de perder media hora por un descuido. */
const COSA_LENTO=1.55, COSA_CAZA=3.05;   // m/s. Correr son 5,5: siempre se le puede ganar corriendo
const COSA_AGARRA=1.20;                  // a que distancia te alcanza
const COSA_GRACIA=25;                    // segundos de arranque antes de que despierte
const COSA_OYE=30;                       // hasta donde le llega un ruido, en metros

const cosa={ g:new THREE.Group(), x:0, z:0, vy:0, giro:0, fase:0, vel:0,
             meta:null, metaCel:null, estado:'duerme', t:0, aturdida:0, cerca:9e9 };
const cosaOjosMat=new THREE.MeshBasicMaterial({color:0x000000});
(function armarCosa(){
  const M=matMundo;
  const caja=(w,h,d,x,y,z,padre)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M);
    m.position.set(x,y,z); m.frustumCulled=false; (padre||cosa.g).add(m); return m; };
  /* el tronco y la cabeza van fundidos: la cabeza no necesita moverse sola y cada malla suelta es
     una llamada de dibujo mas */
  const gs=[];
  const met=(g,x,y,z,rx)=>{ if(rx) g.rotateX(rx); g.translate(x,y,z); gs.push(g); };
  /* MAS GRANDE DE LO QUE PARECIA NECESARIO. Con el tronco chico, a cuatro metros el bicho se leia
     como cuatro patas sueltas: la masa del cuerpo no llegaba a ocupar nada y la cabeza quedaba
     perdida. Un tronco ancho y un cuello largo hacen que se entienda de un vistazo QUE es, que es
     todo lo que se necesita cuando lo ves un cuadro y medio en el frente de tu propio grito. */
  met(new THREE.BoxGeometry(0.72,0.56,1.45), 0,0,0);              // tronco
  met(new THREE.BoxGeometry(0.62,0.44,0.34), 0,0.06,-0.62);       // el pecho, mas angosto
  met(new THREE.BoxGeometry(0.26,0.24,0.62), 0,0.12,-1.02);       // cuello largo
  met(new THREE.BoxGeometry(0.44,0.40,0.54), 0,0.16,-1.52);       // craneo
  met(new THREE.BoxGeometry(0.36,0.15,0.38), 0,-0.10,-1.68);      // mandibula
  met(new THREE.BoxGeometry(0.24,0.56,0.70), 0,0.42,0.32);        // la joroba
  for(let k=0;k<5;k++)                                            // las vertebras del lomo
    met(new THREE.BoxGeometry(0.09,0.20+0.10*Math.sin(k),0.09), 0, 0.34+0.06*k, 0.66-k*0.30);
  const tg=mergeGeometries(gs,false); for(const q of gs) q.dispose();
  const tronco=new THREE.Mesh(tg, M); tronco.frustumCulled=false;
  cosa.tronco=new THREE.Group(); cosa.tronco.position.y=1.62;
  cosa.tronco.add(tronco); cosa.g.add(cosa.tronco);
  /* los ojos: dos puntos que emiten. Es lo unico del bicho con luz propia */
  const og=[];
  for(const sg of [-1,1]){ const e=new THREE.SphereGeometry(0.062,7,5);
    e.translate(sg*0.145, 0.21, -1.77); og.push(e); }
  const ojos=new THREE.Mesh(mergeGeometries(og,false), cosaOjosMat);
  for(const q of og) q.dispose();
  ojos.frustumCulled=false; cosa.tronco.add(ojos);
  /* CUATRO PATAS LARGAS, de dos tramos. Las patas largas son lo que lo hace leer a bicho y no a
     persona: el tronco casi no se mueve y lo que camina son cuatro angulos por encima de tu cabeza. */
  cosa.patas=[];
  const anclas=[[-0.38,0.08,-0.56],[0.38,0.08,-0.56],[-0.38,0.04,0.62],[0.38,0.04,0.62]];
  for(let k=0;k<4;k++){
    const hombro=new THREE.Group(); hombro.position.set(anclas[k][0],anclas[k][1],anclas[k][2]);
    cosa.tronco.add(hombro);
    caja(0.115,0.115,0.95, 0,0,0, hombro).position.set(0,-0.02,0);
    const sup=hombro.children[hombro.children.length-1];
    sup.geometry.translate(0,0,-0.46);          // el tramo cuelga desde el hombro
    const codo=new THREE.Group(); codo.position.set(0,0,-0.92); hombro.add(codo);
    const bg=[];
    const b1=new THREE.BoxGeometry(0.095,0.095,1.00); b1.translate(0,0,-0.48); bg.push(b1);
    const b2=new THREE.BoxGeometry(0.20,0.075,0.26); b2.translate(0,-0.02,-1.03); bg.push(b2);
    for(let d=0;d<3;d++){ const gd=new THREE.BoxGeometry(0.038,0.038,0.20);
      gd.translate((d-1)*0.062,-0.03,-1.22); bg.push(gd); }
    const inf=new THREE.Mesh(mergeGeometries(bg,false), M);
    for(const q of bg) q.dispose();
    inf.frustumCulled=false; codo.add(inf);
    cosa.patas.push({hombro, codo, lado:(k%2)?1:-1, par:(k<2)?0:1});
  }
  escena.add(cosa.g);
})();

function cosaPonerLejos(){
  /* la mandan lo mas lejos que se pueda del jugador, en pasos y no en linea recta */
  const c=celdaDe(jug.x,jug.z);
  const D=distancias(MAPA,N,c[0],c[1]);
  let mejor=-1, cel=[N-1,N-1];
  for(let j=0;j<N;j++) for(let i=0;i<N;i++) if(D[j][i]>mejor){ mejor=D[j][i]; cel=[i,j]; }
  cosa.x=XC(cel[0]); cosa.z=ZC(cel[1]);
  cosa.meta=null; cosa.metaCel=null; cosa.estado='ronda';
}
function cosaOye(x,z,fuerza){
  if(cosa.estado==='duerme' || cosa.aturdida>0) return;
  const d=Math.hypot(cosa.x-x, cosa.z-z);
  if(d > COSA_OYE*(0.45+0.55*(fuerza||1))) return;
  cosa.meta=[x,z]; cosa.metaCel=celdaDe(x,z); cosa.estado='caza'; cosa.t=0;
}
function cosaSiguiente(){
  /* el paso que sigue: BFS desde la meta y bajar la cuesta. Se recalcula pocas veces por segundo. */
  if(!cosa.metaCel) return null;
  const c=celdaDe(cosa.x,cosa.z);
  if(c[0]===cosa.metaCel[0] && c[1]===cosa.metaCel[1]) return null;
  const D=distancias(MAPA,N,cosa.metaCel[0],cosa.metaCel[1]);
  let mejorD=D[c[1]][c[0]], sig=null;
  for(const [dx,dz,l] of [[0,-1,'n'],[1,0,'e'],[0,1,'s'],[-1,0,'o']]){
    if(MAPA[c[1]][c[0]][l]) continue;
    const ni=c[0]+dx, nj=c[1]+dz;
    if(ni<0||nj<0||ni>=N||nj>=N) continue;
    if(D[nj][ni]>=0 && D[nj][ni]<mejorD){ mejorD=D[nj][ni]; sig=[ni,nj]; }
  }
  return sig;
}
let cosaRuta=0, cosaSig=null, cosaResuello=0;
function cosaTick(dt){
  if(!jugando || ganado){ cosa.g.visible=false; return; }
  cosa.g.visible=true;
  cosa.t+=dt;
  if(cosa.estado==='duerme'){
    if(tiempo>COSA_GRACIA && tutoListo){ cosaPonerLejos(); avisar(TX('aDesperto'), 2.6); son('mal'); }
    else return;
  }
  /* LA DISTANCIA Y LOS OJOS SE ACTUALIZAN SIEMPRE, aturdida o no. Estaban despues del corte y eso
     daba dos defectos: la distancia se quedaba en infinito (o sea que el HUD nunca avisaba mientras
     estaba aturdida) y el material de los ojos se quedaba en NEGRO PURO. Y un negro puro no es
     invisible: se pinta, y escribe profundidad. Con la cosa cerca, los ojos salian como dos agujeros
     negros recortados sobre la pared iluminada. */
  cosa.cerca=Math.hypot(jug.x-cosa.x, jug.z-cosa.z);
  {
    const kOjo=Math.max(0, 1-cosa.cerca/13)*0.55 + 0.30*eco;
    cosaOjosMat.color.setRGB(kOjo, kOjo*0.16, kOjo*0.10);
  }
  /* Y LA MALLA SE MUEVE SIEMPRE. Estaba al final de la funcion, o sea despues del corte por aturdida:
     al agarrarte, la cosa se teletransporta al otro punto del laberinto pero su MALLA se quedaba
     donde estaba, y quedaba dibujada al lado tuyo los once segundos del aturdimiento. */
  cosa.g.position.set(cosa.x, 0, cosa.z);
  cosa.g.rotation.y=cosa.giro;
  if(cosa.aturdida>0){ cosa.aturdida-=dt; cosa.vel=0; return; }
  /* si no tiene a donde ir, se pone a rondar: elige una celda al azar y camina para alla */
  if(!cosa.metaCel || (cosa.estado==='ronda' && cosa.t>9)){
    const i=(Math.random()*N)|0, j=(Math.random()*N)|0;
    if(DIST[j][i]>=0){ cosa.metaCel=[i,j]; cosa.meta=[XC(i),ZC(j)]; cosa.t=0; }
  }
  cosaRuta-=dt;
  if(cosaRuta<=0){ cosaRuta=0.30; cosaSig=cosaSiguiente(); }
  const objetivoVel = cosa.estado==='caza'? COSA_CAZA : COSA_LENTO;
  let tx=cosa.x, tz=cosa.z;
  if(cosaSig){ tx=XC(cosaSig[0]); tz=ZC(cosaSig[1]); }
  else if(cosa.meta){ tx=cosa.meta[0]; tz=cosa.meta[1]; }
  const ex=tx-cosa.x, ez=tz-cosa.z, dd=Math.hypot(ex,ez);
  if(dd>0.06){
    const v=objetivoVel;
    cosa.x+=ex/dd*v*dt; cosa.z+=ez/dd*v*dt;
    cosa.vel=v;
    const gq=Math.atan2(ex,ez);
    let dif=gq-cosa.giro; while(dif>Math.PI)dif-=2*Math.PI; while(dif<-Math.PI)dif+=2*Math.PI;
    cosa.giro+=dif*Math.min(1,dt*4.5);
    cosa.fase=(cosa.fase + v*dt/1.9)%1;
  } else {
    cosa.vel*= Math.max(0,1-3*dt);
    if(cosa.estado==='caza' && cosa.t>3.5){ cosa.estado='ronda'; cosa.t=0; cosa.metaCel=null; }
  }
  cosa.g.position.set(cosa.x, 0, cosa.z);
  cosa.g.rotation.y=cosa.giro;
  /* las patas: dos pares en contrafase, y el tronco cabecea con el paso */
  const f=cosa.fase*Math.PI*2, amp=Math.min(1, cosa.vel/2.8);
  /* LOS ANGULOS. El primer intento tenia el codo en +1,75, y como el codo es RELATIVO al hombro el
     angulo neto daba +0,70: o sea que el antebrazo apuntaba hacia ARRIBA y el bicho caminaba con las
     cuatro patas dobladas al reves, con las garras por encima del lomo. Se ve raro y encima no toca
     el piso.
     Las cuentas: el hombro esta a 1,65 m del suelo y los dos tramos miden 0,92 y 1,00. Con el hombro
     en -1,15 el codo baja 0,86 (queda a 0,79) y con el codo en -0,62 —o sea neto -1,77— el antebrazo
     baja otros 0,98 y la garra llega al piso. Eso es una pata.
     El giro de apertura va en Y y no en Z: la pata se extiende sobre -Z, asi que rotar en Z la
     RETUERCE sobre si misma en vez de abrirla. */
  for(let k=0;k<cosa.patas.length;k++){
    const P=cosa.patas[k];
    const ang=Math.sin(f + (P.par? Math.PI:0) + (P.lado>0? 0.45:0));
    P.hombro.rotation.set(-1.15 + ang*0.40*amp, P.lado*0.42 + (P.par? -0.30 : 0.26), 0);
    P.codo.rotation.x = -0.62 - Math.max(0,ang)*0.34*amp;
  }
  cosa.tronco.position.y = 1.62 + Math.sin(f*2)*0.055*amp;
  cosa.tronco.rotation.x = 0.12 + Math.sin(f*2)*0.035*amp;
  /* el resuello: mas seguido y mas fuerte cuanto mas cerca. Es el sistema de aviso de verdad —
     el que te hace frenar y agacharte antes de verlo. */
  cosaResuello-=dt;
  if(cosaResuello<=0 && cosa.cerca<22){
    cosaResuello=0.75+Math.random()*0.7;
    const v=Math.max(0, 1-cosa.cerca/22);
    son(cosa.estado==='caza'? 'resuello' : 'resuelloLento', v*v);
  }
  if(cosa.cerca<COSA_AGARRA) cosaAgarra();
}
function cosaAgarra(){
  cosa.aturdida=11;
  cosa.estado='ronda'; cosa.metaCel=null;
  son('agarron');
  jug.dipV -= 3.2;                     // el sacudon
  emitir(jug.x, 1.2, jug.z, 1.0, 52);
  avisar(TX('aAgarro'), 3.0);
  /* de vuelta a la entrada, con los sellos puestos. No se pierde nada: perder progreso por un
     descuido en un juego a oscuras es la forma mas rapida de que lo cierren. */
  jug.x=XC(0); jug.z=ZC(0); jug.vx=0; jug.vz=0;
  cosaPonerLejos();
}

/* ===================== EL BUCLE ===================== */
const reloj=new THREE.Clock();
const ADEL=new THREE.Vector3(), DER=new THREE.Vector3();

function animar(){
  requestAnimationFrame(animar);
  const dt=Math.min(0.05, reloj.getDelta());
  matMundo.uniforms.uT.value+=dt;

  if(jugando && !ganado){
    tiempo+=dt;
    const m=Math.floor(tiempo/60), s=Math.floor(tiempo%60);
    relojEl.textContent=m+':'+(s<10?'0':'')+s;
  }
  if(avisoT>0){ avisoT-=dt; if(avisoT<=0) avisoEl.classList.remove('ver'); }
  if(gritoT>0){ gritoT-=dt;
    const aro=document.getElementById('gritoAro');
    if(aro) aro.style.setProperty('--g', (100*(1-gritoT/gritoMax)).toFixed(0)+'%');
  }

  /* ---------- lo que pide el jugador ---------- */
  let ax=0, az=0;
  if(jugando && !notaAbierta){
    if(plataf==='pc'){
      if(tecla['w']||tecla['arrowup'])   az-=1;
      if(tecla['s']||tecla['arrowdown']) az+=1;
      if(tecla['a']||tecla['arrowleft']) ax-=1;
      if(tecla['d']||tecla['arrowright'])ax+=1;
    }
    ax+=joy.x; az+=joy.y;
    const L=Math.hypot(ax,az); if(L>1){ ax/=L; az/=L; }
  }
  const pedido = Math.hypot(ax,az);
  const quiere = pedido>0.03;
  jug.agachado = agacharBoton;
  const corriendo = !jug.agachado && quiere && (tecla['shift'] || joy.bruto>1.35);
  /* Y LA VELOCIDAD ES ANALOGICA con el joystick: media desviacion, media velocidad. En un juego que
     se juega por el ruido que hacés, poder ir despacio no es un lujo: es la mitad del juego. El
     teclado no tiene medias tintas, asi que ahi el factor es 1. */
  const analog = (plataf==='pc' && !joy.bruto)? 1 : Math.max(0.34, Math.min(1, pedido));
  const VEL = (jug.agachado? 1.30 : (corriendo? 5.50 : 2.85)) * (corriendo?1:analog);

  /* ---------- EL MOVIMIENTO ----------
     LO QUE ESTABA MAL ANTES: se sumaba aceleracion al vector de la velocidad y despues se topaba la
     velocidad TOTAL. Eso hace dos cosas raras a la vez. Una, al girar en movimiento la velocidad
     vieja y la nueva se suman y el tope las recorta juntas, asi que doblar FRENA. Dos, en diagonal
     se acumulaba mas empuje que en recto. El resultado se siente a patinar sobre hielo con freno de
     mano, que es literalmente lo que dijo el usuario.

     COMO SE HACE BIEN, Y ES COMO LO HACEN LOS TIRADORES DESDE QUAKE: se mira cuanto de la velocidad
     que YA se tiene va en la direccion que se pide, y se agrega solo lo que falta para llegar al
     tope EN ESA DIRECCION. La componente de costado no se toca: la frena el roce. Con eso la
     inercia se conserva al cambiar de rumbo —que es lo que da peso— pero no se acumula velocidad de
     la nada, y el tope se cumple sin recortar nada a mano. */
  ADEL.set(Math.sin(jug.giro),0,Math.cos(jug.giro));
  DER.set(-Math.cos(jug.giro),0,Math.sin(jug.giro));
  const dx=(DER.x*ax - ADEL.x*az), dz=(DER.z*ax - ADEL.z*az);
  const dl=Math.hypot(dx,dz)||1, ux=dx/dl, uz=dz/dl;
  const ACEL = jug.enPiso? 58 : 11;      // en el aire casi no se corrige: si no, se vuela
  if(quiere){
    const yaVa = jug.vx*ux + jug.vz*uz;
    const falta = VEL - yaVa;
    if(falta>0){ const suma=Math.min(falta, ACEL*dt); jug.vx+=ux*suma; jug.vz+=uz*suma; }
  }
  /* EL ROCE. Y ACA HAY UNA TRAMPA QUE COSTO UNA MEDICION:
     frenando la velocidad ENTERA mientras se acelera, el roce y la aceleracion se equilibran ANTES
     del tope. Medido: con el tope en 5,50 la velocidad se plantaba en 4,96, un 10% menos, y la
     misma cuenta para caminar. O sea que los numeros del ajuste eran mentira.
     Se arregla frenando SOLO la parte de la velocidad que NO va en la direccion pedida. Asi el tope
     es exactamente el tope, y la inercia se sigue perdiendo al doblar —que es lo que se buscaba—
     porque al girar la velocidad vieja pasa a ser "de costado" y ahi si la come el roce. */
  if(jug.enPiso && quiere){
    let pl = jug.vx*ux + jug.vz*uz;                  // lo que ya va en la direccion pedida
    let lx = jug.vx - ux*pl, lz = jug.vz - uz*pl;    // y lo que va de costado
    const ll=Math.hypot(lx,lz);
    if(ll>1e-5){ const nl=Math.max(0, ll - ll*9.0*dt); lx*=nl/ll; lz*=nl/ll; }
    /* si venias mas rapido que el tope de ahora (soltaste el correr), el exceso si se frena */
    if(pl>VEL) pl = VEL + (pl-VEL)*(1-Math.min(1, 9.0*dt));
    jug.vx = ux*pl + lx; jug.vz = uz*pl + lz;
  } else {
    const v=Math.hypot(jug.vx,jug.vz);
    if(v>1e-5){
      /* EL UMBRAL DE PARADA. Un roce proporcional nunca llega a cero y deja al personaje derrapando
         medio metro cada vez que se suelta la tecla; en pasillos de cuatro metros eso es la
         diferencia entre doblar y chocar. */
      const ROCE = jug.enPiso? 13.5 : 0.35;
      let nv=v - v*ROCE*dt;
      if(jug.enPiso && nv<0.14) nv=0;
      jug.vx*=nv/v; jug.vz*=nv/v;
    }
  }

  if(jugando && !tutoListo) tutoAndado += Math.hypot(jug.vx,jug.vz)*dt;
  const px=jug.x+jug.vx*dt, pz=jug.z+jug.vz*dt;
  const [nx,nz]=corregir(jug.x, jug.z, px, pz);
  /* si la pared freno el movimiento, tambien se frena la velocidad: si no, uno queda "empujando"
     la pared y al soltar sale disparado */
  if(Math.abs(nx-px)>1e-6) jug.vx*=0.2;
  if(Math.abs(nz-pz)>1e-6) jug.vz*=0.2;
  jug.x=nx; jug.z=nz;

  /* ---------- EL SALTO, CON MARGEN DE LOS DOS LADOS ----------
     coyote: seguis pudiendo saltar 0,12 s despues de salir del borde. saltoPedido: el pedido vale
     0,16 s, asi que apretar justo antes de aterrizar salta al tocar. Los dos margenes son invisibles
     y son la diferencia entre "salta cuando le digo" y "a veces no salta". */
  if(jug.enPiso) coyote=0.12; else coyote=Math.max(0,coyote-dt);
  saltoPedido=Math.max(0,saltoPedido-dt);
  if(saltoPedido>0 && coyote>0 && jugando){
    jug.vy=5.0; jug.enPiso=false; coyote=0; saltoPedido=0;
    if(!jug.agachado) ruido('salto', jug.x, 0.45, jug.z, 0.45, 13);
  }
  jug.vy-=17.0*dt;
  jug.alto+=jug.vy*dt;
  if(jug.alto<=0){
    if(!jug.enPiso){
      /* el golpe se mide por la velocidad de caida, no es fijo: caer de un salto no es lo mismo que
         bajar un escalon, y el ruido y el sacudon van con lo que dolio */
      const golpe=Math.min(1, Math.abs(jug.vy)/7.0);
      jug.dipV -= 2.0*golpe;
      if(!jug.agachado) ruido('caida', jug.x, 0.25, jug.z, 0.50+0.45*golpe, 16+18*golpe);
    }
    jug.alto=0; jug.vy=0; jug.enPiso=true;
  }

  /* ---------- LAS PISADAS: POR DISTANCIA, NO POR TIEMPO ----------
     Antes el reloj de la zancada avanzaba con la velocidad y disparaba en un umbral fijo, o sea que
     la zancada MEDIA distinto segun lo rapido que fueras. Ahora la zancada es una distancia en
     metros: caminando 3,4 m por ciclo, corriendo 4,3, agachado 2,6. Asi la pisada cae siempre en el
     mismo punto del paso y las piernas y el bamboleo van clavados con ella.
     Y AGACHADO NO SUENA. No es un detalle de sabor: es la herramienta del enigma del corredor. */
  const velH=Math.hypot(jug.vx,jug.vz);
  if(jug.enPiso && velH>0.30){
    const ZANC = corriendo? 4.3 : (jug.agachado? 2.6 : 3.4);
    const p0=jug.paso;
    jug.paso=(jug.paso + velH*dt/ZANC)%1;
    const cruzo = (p0<0.5 && jug.paso>=0.5) || (jug.paso<p0);
    if(cruzo && !jug.agachado) pisada(corriendo);
  } else {
    /* parado las piernas vuelven a su lugar, no se quedan clavadas a media zancada */
    jug.paso += (0-jug.paso)*Math.min(1,dt*7);
  }

  ondasTick(dt);
  corredorTick();
  cosaTick(dt);

  /* ---------- CUANTO ECO HAY VIVO ----------
     Es el numero del que cuelga TODO lo que no sea el frente de una onda: el faro de la salida, el
     brillo del cuerpo y el de las notas. Se toma la onda mas viva y se deja BAJAR despacio, no
     saltar: si sigue al maximo instantaneo, la pantalla pestañea cada vez que muere una onda. */
  if(flashT>0){ flashT-=dt; flash=1; }
  else if(flash>0){ flash=Math.max(0, flash - dt/FLASH_APAGA); }
  matMundo.uniforms.uFlash.value=flash;
  let ecoCrudo=flash;
  for(const o of ondas) ecoCrudo=Math.max(ecoCrudo, (1-o.t/o.dur)*o.fuerza);
  eco = ecoCrudo>eco? ecoCrudo : eco + (ecoCrudo-eco)*Math.min(1,dt*2.2);
  matMundo.uniforms.uEco.value=eco;
  /* el cuerpo se apaga con el eco pero no del todo: en silencio absoluto queda una silueta apenas
     visible. Sin ese piso la pantalla queda literalmente en negro y no se lee ni donde estas
     mirando; con el piso muy alto, el cuerpo seria un farol y romperia la regla del juego. */
  const kc=CUERPO_PISO+(1-CUERPO_PISO)*eco;
  matCuerpo.color.copy(CUERPO_BASE).multiplyScalar(kc);
  matPiel.color.copy(PIEL_BASE).multiplyScalar(kc);
  /* LAS HOJAS TIENEN LUZ PROPIA, poca. Antes eran una mancha OSCURA sobre una pared iluminada: a
     oscuras no se veian y con luz se leian como una sombra. Una hoja de papel viejo en una pared de
     piedra tiene que ser lo mas claro del cuadro, no lo mas oscuro. Ahora tienen un piso propio
     —como los rastros del suelo— asi que se ven aunque no hagas ruido, y cada grito que les das las
     sube un escalon. Es la unica forma de que "acercate y gritale a la pared" sea una instruccion
     que se pueda seguir. */
  for(const nt of notas){
    const piso = nt.abierta? 0.055 : (0.030 + 0.045*nt.cargas);
    const k = piso + (nt.abierta? 0.90 : 0.30+0.22*nt.cargas)*eco;
    nt.mat.color.setRGB(k, k*0.965, k*0.90);
  }
  /* los rastros: el tramo que lleva a una hoja ya encontrada se apaga al 22%, asi el unico que
     realmente se ve es el que lleva a la que falta */
  for(const tr of tramos){
    const vivo = notas[tr.hasta].abierta? 0.22 : 1.0;
    const k=(RASTRO_PISO + (0.92-RASTRO_PISO)*eco)*vivo;
    tr.mat.color.copy(RASTRO_BASE).multiplyScalar(k);
  }

  /* ---------- la camara y el cuerpo ---------- */
  /* la altura del ojo baja al agacharse con un muelle: de golpe se lee como un corte de camara */
  jug.ojo += ((jug.agachado?OJO_AGACHADO:OJO) - jug.ojo)*Math.min(1,dt*11);
  jug.y = jug.ojo + jug.alto;
  /* EL MUELLE DEL ATERRIZAJE. Amortiguado, no un decaimiento: un decaimiento baja y sube, un muelle
     baja, pasa de largo y vuelve, y eso es lo que se siente como golpe. w=12,6 y amortiguacion 0,71,
     o sea un rebote y medio. */
  jug.dipV += (-jug.dip*160 - jug.dipV*18)*dt;
  jug.dip  += jug.dipV*dt;
  /* EL BAMBOLEO VA EN OCHO. Sube y baja al DOBLE de la frecuencia con la que va y viene de costado,
     porque hay dos pisadas por ciclo de marcha y un solo vaiven de cadera. Con las dos al mismo
     ritmo el paso se lee a rengo. */
  const ampB=Math.min(1, velH/4.6);
  const fase=jug.paso*Math.PI*2;
  const bobY=Math.sin(fase*2)*0.034*ampB;
  const bobX=Math.sin(fase)*0.046*ampB;
  const bobR=Math.sin(fase)*0.013*ampB;
  /* y la inclinacion al ir de costado, suavizada: es poco y es la mitad de lo que hace que doblar
     se sienta como doblar */
  jug.roll += ((-ax*0.052) - jug.roll)*Math.min(1,dt*7);
  camara.position.set(jug.x + DER.x*bobX, jug.y + bobY + jug.dip, jug.z + DER.z*bobX);
  matMundo.uniforms.uOjo.value.copy(camara.position);
  camara.rotation.set(pitch, jug.giro+Math.PI, jug.roll+bobR, 'YXZ');
  /* EL TIRON DE CAMPO AL CORRER. Cinco grados de mas. Es un truco viejo de los tiradores y funciona:
     la velocidad se siente en el campo de vision, no en el numero. */
  const fovMeta = FOV_V + (corriendo && velH>3.0 ? 5.0 : 0) - (jug.agachado? 2.0 : 0);
  if(Math.abs(camara.fov-fovMeta)>0.02){
    camara.fov += (fovMeta-camara.fov)*Math.min(1,dt*6); camara.updateProjectionMatrix(); }
  /* el tronco NO hereda el cabeceo: se le resta, asi mirar al piso no te mete el pecho en la cara */
  tronco.rotation.x = -pitch;
  /* las piernas caminan: es lo unico que hay para mirar, asi que tiene que moverse bien */
  const cic=fase;
  const amp=Math.min(1, velH/4.2);
  piernaI.rotation.x =  Math.sin(cic)*0.55*amp;
  piernaD.rotation.x = -Math.sin(cic)*0.55*amp;
  pieI.position.z = -0.05 + Math.sin(cic)*0.16*amp;
  pieD.position.z = -0.05 - Math.sin(cic)*0.16*amp;
  pieI.position.y = -1.55 + Math.max(0,Math.sin(cic))*0.10*amp;
  pieD.position.y = -1.55 + Math.max(0,-Math.sin(cic))*0.10*amp;
  /* ---------- ¿llego a la salida? ---------- */
  if(jugando && !ganado){
    const d=Math.hypot(jug.x-salidaMundo.x, jug.z-salidaMundo.z);
    if(d<1.7){
      if(nSellos()>=4){
        ganado=true;
        const m=Math.floor(tiempo/60), sg=Math.floor(tiempo%60);
        avisar(TX('aSaliste',{t:m+':'+(sg<10?'0':'')+sg}), 999);
        son('salida');
        emitir(jug.x, jug.y, jug.z, 1.0, 78);
      } else if(selloAviso<=0){
        /* con espera: sin ella el cartel se vuelve a poner cada cuadro que estas parado ahi y no se
           puede leer nada mas */
        selloAviso=4.0;
        avisar(TX('aSellada',{n:nSellos()}), 2.4);
      }
    }
  }
  if(selloAviso>0) selloAviso-=dt;

  /* ---------- ¿HAY UNA HOJA AL LADO? ----------
     Esto antes solo avisaba de hojas YA REVELADAS y solo en PC. O sea que el jugador se acercaba a
     una pared con una hoja sin revelar y no pasaba absolutamente nada: no habia forma de saber que
     ahi habia algo ni que habia que gritarle. Ahora avisa en los dos casos y en las dos plataformas,
     y dice exactamente que hacer y cuanto falta. */
  if(jugando){
    const leible=notaCercana(), sinAbrir=notaSinAbrirCerca();
    document.body.classList.toggle('cerca', !!leible);
    document.body.classList.toggle('hoja', !!sinAbrir);
    const lp=document.getElementById('leerP');
    /* durante los tres primeros pasos del tutorial el aviso de la hoja se calla: el tutorial ya esta
       diciendo una cosa y dos carteles a la vez no se leen, se ignoran los dos */
    const tapado = !tutoListo && tutoPaso<3;
    if(lp && !notaAbierta && !tapado){
      if(sinAbrir){
        lp.innerHTML=TX('pHoja')+'<br><b>'+(plataf==='pc'?'E':TX('bGritar'))+'</b> · '+
                     TX('pGritos',{n:sinAbrir.cargas, m:NOTA_GRITOS});
        lp.classList.add('ver');
      } else if(leible){
        lp.innerHTML='<b>'+(plataf==='pc'?'F':TX('bLeer'))+'</b> · '+TX(leible.claveTit);
        lp.classList.add('ver');
      } else lp.classList.remove('ver');
    } else if(lp) lp.classList.remove('ver');
  }

  /* el aro del HUD dice cuanto ruido estas haciendo: es la unica lectura que importa */
  tutoTick(dt);
  guiaTick(dt);
  /* la linea del objetivo */
  if(jugando){
    const mEl=document.getElementById('meta');
    if(mEl){ const o=objetivo();
      const txt=o.t+(o.s? '<s>'+o.s+'</s>' : '');
      if(mEl._ult!==txt){ mEl._ult=txt; mEl.innerHTML=txt; } }
  }

  const ecoEl=document.getElementById('eco');
  if(ecoEl){ jug.ruido += (((jug.agachado?0:velH)/5.5) - jug.ruido)*Math.min(1,dt*4);
    ecoEl.style.color='rgba(190,205,220,'+(0.22+jug.ruido*0.62).toFixed(2)+')';
    if(cosa.estado!=='duerme' && cosa.aturdida<=0 && cosa.cerca<14){
      ecoEl.style.color='rgba(255,120,96,'+(0.45+0.55*Math.max(0,1-cosa.cerca/14)).toFixed(2)+')';
      ecoEl.textContent = cosa.cerca<6? TX('hEncima') : TX('hSigue');
    } else
    ecoEl.textContent = ganado? TX('hSalida') : jug.agachado? TX('hAgachado')
                      : (jug.ruido>0.62? TX('hRuido') : jug.ruido>0.18? TX('hEco') : TX('hSilencio')); }

  render.render(escena,camara);
}
animar();

/* ===================== GANCHOS DE PRUEBA =====================
   Sin esto no hay forma de comprobar nada de un juego que es casi todo negro: no se puede mirar una
   foto y decir "el laberinto esta bien conectado". Se mide. */
window.__eco={
  cine:()=>({ k:cineK, hecha:cineHecha(), n:CINE_N,
              ver:document.getElementById('cine').classList.contains('ver'),

  ambienteVol:(v)=>{ ambienteVol(v); return v; },
  estado:()=>({ jugando, ganado, t:+tiempo.toFixed(1),
                jug:[+jug.x.toFixed(2),+jug.z.toFixed(2)], celda:celdaDe(jug.x,jug.z),
                salida:salida.slice(), salidaPasos:mejor, plataf,
                sellos:nSellos(), eco:+eco.toFixed(3), flash:+flash.toFixed(3),
                agachado:jug.agachado,
                vel:+Math.hypot(jug.vx,jug.vz).toFixed(2), enPiso:jug.enPiso,
                alto:+jug.alto.toFixed(3), bruto:+joy.bruto.toFixed(2),
                ojo:+jug.ojo.toFixed(2), fov:+camara.fov.toFixed(2) }),
  /* EL CUADRO: que sea 16:9 de verdad y que el mapeo de coordenadas cierre. Sin medir esto, con el
     cuadro girado el joystick apunta a otro lado y no hay foto que lo muestre. */
  cuadro:()=>{
    const l=render.domElement;
    const pr=[[10,10],[innerWidth-10,10],[innerWidth/2,innerHeight/2],[10,innerHeight-10]]
      .map(([x,y])=>{ const [a,b]=aCuadro(x,y); return [Math.round(a),Math.round(b)]; });
    return { girado, ancho:cajaW, alto:cajaH, relacion:+(cajaW/cajaH).toFixed(4),
             lienzo:[l.clientWidth,l.clientHeight], buffer:[l.width,l.height],
             fovV:+camara.fov.toFixed(2),
             fovH:+(2*Math.atan(Math.tan(camara.fov*Math.PI/360)*camara.aspect)*180/Math.PI).toFixed(2),
             aspecto:+camara.aspect.toFixed(4), mapeo:pr };
  },
  /* el estado de los cuatro enigmas, con lo que hace falta para resolverlos desde una prueba */
  enigmas:()=>({
    sellos:SELLOS.slice(), n:nSellos(),
    tambores:{ orden:P1_ORDEN.slice(), paso:p1Paso,
               donde:tambores.map(t=>({bandas:t.bandas, cel:t.cel.slice()})) },
    corredor:{ celdas:corredor.map(c=>c.slice()), largo:corredor.length, desde:p2Desde },
    cuenta:{ cel:celP3.slice(), golpes:P3_GOLPES, van:p3Cuenta },

                                                          rojo:+t.mat.color.r.toFixed(4) })),
  notas:()=>notas.map(n=>({ titulo:n.titulo, cel:n.cel.slice(), lado:n.lado,
                            cargas:n.cargas, abierta:n.abierta, leida:n.leida,
                            dist:+Math.hypot(jug.x-n.x, jug.z-n.z).toFixed(2) })),
  idioma:(c)=>{ if(c) elegirIdioma(c); return { actual:IDIOMA, hay:IDIOMAS.map(i=>i[0]) }; },
  textos:()=>({ menuSub:document.getElementById('sub').textContent,

  objetivo:()=>objetivo(),

  cosa:()=>({ estado:cosa.estado, celda:celdaDe(cosa.x,cosa.z), pos:[+cosa.x.toFixed(1),+cosa.z.toFixed(1)],
              dist:+cosa.cerca.toFixed(2), vel:+cosa.vel.toFixed(2), aturdida:+cosa.aturdida.toFixed(1),
              patas:cosa.patas.length, visible:cosa.g.visible }),
  despertar:()=>{ cosaPonerLejos(); cosa.estado='ronda'; return cosa.estado; },
  congelar:(sg)=>{ cosa.aturdida=(sg==null?6:sg); return cosa.aturdida; },
  abierto:(i,j,l)=>!MAPA[j][i][l],
  /* apuntar la vista a la cosa: hace falta para poder FOTOGRAFIARLA, porque el laberinto es distinto
     cada partida y un angulo fijo la encuadra una de cada cinco veces */
  mirarCosa:()=>{ const ex=cosa.x-jug.x, ez=cosa.z-jug.z;
    jug.giro=Math.atan2(ex,ez);
    pitch=Math.atan2(1.9-jug.y, Math.hypot(ex,ez))*0.6;
    return { giro:+jug.giro.toFixed(2), dist:+Math.hypot(ex,ez).toFixed(2) }; },
  animarCosa:(n)=>{ for(let k=0;k<(n||30);k++){ cosa.fase=(cosa.fase+0.02)%1;
      const f=cosa.fase*Math.PI*2;
      for(const P of cosa.patas){ const ang=Math.sin(f+(P.par?Math.PI:0)+(P.lado>0?0.45:0));
        P.hombro.rotation.set(-1.15+ang*0.40, P.lado*0.42+(P.par?-0.30:0.26), 0);
        P.codo.rotation.x=-0.62-Math.max(0,ang)*0.34; } }
    return cosa.fase; },
  /* donde cae cada garra: sin esto no hay forma de saber si las patas llegan al piso o el bicho
     camina en el aire, que es exactamente lo que pasaba */
  garras:()=>{ const v=new THREE.Vector3(); return cosa.patas.map(P=>{
      const inf=P.codo.children[0]; inf.updateWorldMatrix(true,false);
      v.set(0,-0.03,-1.22).applyMatrix4(inf.matrixWorld);
      return { y:+v.y.toFixed(2) }; }); },
  traerCosa:(i,j)=>{ cosa.x=XC(i==null?celdaDe(jug.x,jug.z)[0]:i); cosa.z=ZC(j==null?celdaDe(jug.x,jug.z)[1]:j);
                     return [+cosa.x.toFixed(1),+cosa.z.toFixed(1)]; },
  guia:()=>{ const el=document.getElementById('guia');
    return { ver:el.classList.contains('ver'), flecha:document.getElementById('guiaF').textContent,
             dist:document.getElementById('guiaD').textContent,
             izq:el.style.left, arr:el.style.top,
             destino:guiaPos? [+guiaPos.x.toFixed(1), +guiaPos.z.toFixed(1)] : null }; },
  audio:()=>{ let pico=0, rms=0;
    if(AUD.an&&AUD.buf){ AUD.an.getFloatTimeDomainData(AUD.buf);
      for(let i=0;i<AUD.buf.length;i++){ const v=Math.abs(AUD.buf[i]); if(v>pico) pico=v; rms+=v*v; }
      rms=Math.sqrt(rms/AUD.buf.length); }
    return { hay:!!AUD.ctx, estado:AUD.ctx? AUD.ctx.state:null, on:AUD.on,
             pico:+pico.toFixed(4), rms:+rms.toFixed(4) }; },

    if(AUD.drone) try{ AUD.drone.gain.value = AUD.on? 0.012 : 0; }catch(e){}

  son:(t,f)=>{ son(t,f); return true; },
  papel:()=>({ abierta:!!notaAbierta, titulo:notaAbierta? notaAbierta.titulo:null,
               visible:document.getElementById('nota').classList.contains('ver') }),

    for(let k=0;k<(n||60);k++){ const a0=ondas.length; animarUno(0.0166);
      if(ondas.length>a0) ond++; vMax=Math.max(vMax,Math.hypot(jug.vx,jug.vz)); }
    return { velMax:+vMax.toFixed(2), ondas:ond, celda:celdaDe(jug.x,jug.z) }; },
  agachar:(v)=>{ agacharBoton=(v==null? !agacharBoton : !!v); pintarAgachar(); return agacharBoton; },

  emitir:(f,a)=>{ emitir(jug.x,jug.y,jug.z,f==null?1:f,a==null?40:a); return ondas.length; },
  gritar:(respetar)=>{ if(!respetar) gritoT=0; const antes=gritoT; gritar();
                       return {habiaEspera:+antes.toFixed(2), espera:+gritoT.toFixed(2)}; },
  /* el laberinto se comprueba de verdad: que TODAS las celdas se alcancen desde el arranque */
  laberinto:()=>{ let alc=0, tot=N*N, peor=0;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(DIST[y][x]>=0){ alc++; if(DIST[y][x]>peor) peor=DIST[y][x]; } }
    return { celdas:tot, alcanzables:alc, todasAlcanzables:alc===tot, pasosALaSalida:peor,
             paredes:(()=>{ let n=0; for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const c=MAPA[y][x];
               if(c.n)n++; if(c.o)n++; } return n; })() }; },
  /* donde caen los pies en la pantalla: es la unica forma de comprobar que el cuerpo se ve de verdad

  manos:()=>{ const v=new THREE.Vector3(); const r={};
    for(const [n,o] of [['pieI',pieI],['pieD',pieD]]){
      o.getWorldPosition(v); v.project(camara);
      r[n]={ x:+v.x.toFixed(3), y:+v.y.toFixed(3), enCuadro:(Math.abs(v.x)<1&&Math.abs(v.y)<1&&v.z<1) }; }
    return r; },
  poner:(i,j)=>{ jug.x=(i-(N-1)/2)*CEL; jug.z=(j-(N-1)/2)*CEL; jug.vx=0; jug.vz=0;
                 return {celda:celdaDe(jug.x,jug.z)}; },
  mirar:(p,g)=>{ if(p!=null) pitch=p; if(g!=null) jug.giro=g; return {pitch:+pitch.toFixed(2), giro:+jug.giro.toFixed(2)}; },
  /* camina de verdad hacia un lado durante n cuadros: sirve para comprobar que las pisadas emiten
     y que no se atraviesan paredes */
  caminar:(n,ejeX,ejeZ,correr)=>{ const p0=[jug.x,jug.z]; let ondasVistas=0, vMax=0;
    for(let k=0;k<(n||60);k++){
      joy.x=ejeX||0; joy.y=ejeZ==null?-1:ejeZ;
      joy.bruto=Math.hypot(joy.x,joy.y);
      if(correr) tecla['shift']=true;
      const antes=ondas.length; animarUno(0.0166); if(ondas.length>antes) ondasVistas++;
      vMax=Math.max(vMax, Math.hypot(jug.vx,jug.vz));
    }
    joy.x=0; joy.y=0; joy.bruto=0; tecla['shift']=false;
    return { de:p0.map(v=>+v.toFixed(2)), a:[+jug.x.toFixed(2),+jug.z.toFixed(2)],
             ondasEmitidas:ondasVistas, velMax:+vMax.toFixed(2) }; },
  /* ir a una celda CAMINANDO por el laberinto, siguiendo el camino corto. Sin esto no hay forma de
     probar un enigma que esta a cuarenta pasos: teletransportarse saltea justo lo que se quiere
     comprobar, que es que se pueda llegar. */
  ir:(i,j,agachado)=>{
    const antes=agacharBoton; if(agachado!=null){ agacharBoton=!!agachado; pintarAgachar(); }
    const D=distancias(MAPA,N,i,j);
    let pasos=0, ondas0=0;
    for(let g=0; g<4000; g++){
      const c=celdaDe(jug.x,jug.z);
      if(c[0]===i && c[1]===j) break;
      /* el vecino que baja la distancia al destino */
      let mejorL=null, mejorD=D[c[1]][c[0]];
      for(const [dx,dz,l] of [[0,-1,'n'],[1,0,'e'],[0,1,'s'],[-1,0,'o']]){
        if(MAPA[c[1]][c[0]][l]) continue;
        const ni=c[0]+dx, nj=c[1]+dz;
        if(ni<0||nj<0||ni>=N||nj>=N) continue;
        if(D[nj][ni]>=0 && D[nj][ni]<mejorD){ mejorD=D[nj][ni]; mejorL=[dx,dz]; }
      }
      if(!mejorL) break;
      /* se apunta al centro de la celda vecina y se camina para alla en coordenadas del mundo */
      const tx=(c[0]+mejorL[0]-(N-1)/2)*CEL, tz=(c[1]+mejorL[1]-(N-1)/2)*CEL;
      for(let k=0;k<40;k++){
        const ex=tx-jug.x, ez=tz-jug.z;
        if(Math.hypot(ex,ez)<0.45) break;
        /* adelante es (sin giro, cos giro): la camara mira por -Z girada giro+PI, y eso da lo mismo */
        jug.giro=Math.atan2(ex,ez);
        joy.x=0; joy.y=-1; joy.bruto=1;
        const a0=ondas.length; animarUno(0.0166); if(ondas.length>a0) ondas0++;
      }
      pasos++;
    }
    joy.x=0; joy.y=0; joy.bruto=0;
    if(agachado!=null){ agacharBoton=antes; pintarAgachar(); }
    return { celda:celdaDe(jug.x,jug.z), meta:[i,j], celdasAndadas:pasos, ondas:ondas0 };
  },
  perfil:(n)=>{ n=n||30; const I=render.info, ar=I.autoReset;
    I.autoReset=false; I.reset();
    const t0=performance.now();
    for(let k=0;k<n;k++) animarUno(0.0166);
    const ms=(performance.now()-t0)/n;
    const r={ llamadas:Math.round(I.render.calls/n), tris:Math.round(I.render.triangles/n),
              programas:(I.programs||[]).length, geometrias:I.memory.geometries,
              texturas:I.memory.textures, msPorCuadro:+ms.toFixed(1) };
    I.autoReset=ar; I.reset();
    let mallas=0; escena.traverse(o=>{ if(o.isMesh) mallas++; });
    r.mallas=mallas; return r; },
  /* EL BRILLO MEDIO DE LA PANTALLA. Es la unica forma de comprobar que las ondas iluminan algo: en
     un juego que es casi todo negro, mirar una foto no distingue "la onda no anda" de "la onda paso
     hace un rato".
     SE LEE DEL CONTEXTO, NO COPIANDO EL LIENZO. La primera version hacia drawImage del canvas a otro
     canvas 2D, y daba CERO siempre: un lienzo WebGL sin preserveDrawingBuffer queda vacio en cuanto
     el navegador lo compone, asi que copiarlo despues no copia nada. Casi me manda a buscar un
     defecto en el shader que no existia. Con readPixels se lee el buffer de verdad, y para eso hay
     que dibujar y leer SIN dejar que el cuadro termine. */
  brillo:()=>{
    const gl=render.getContext();
    render.render(escena,camara);
    /* Y SE LEE EL CUADRO COMPLETO. Recortando 96x54 del centro, medio y maximo salian IGUALES: el
       recorte caia entero dentro de una pared y no decia nada del cuadro. Leer todo son 1,6 MB por
       llamada, que para un gancho de prueba no es nada, y evita sacar conclusiones de una ventanita. */
    const w=gl.drawingBufferWidth, h=gl.drawingBufferHeight;
    const px=new Uint8Array(w*h*4);
    gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
    let s=0, max=0, encendidos=0;
    for(let i=0;i<px.length;i+=4){ const l=(px[i]+px[i+1]+px[i+2])/3; s+=l; if(l>max)max=l; if(l>16) encendidos++; }
    const n=px.length/4;
    /* y por franjas horizontales, de arriba abajo: dice DONDE hay luz, no solo cuanta */
    const franjas=[];
    for(let k=4;k>=0;k--){ let ss=0, nn=0;
      const y0=(h*k/5)|0, y1=(h*(k+1)/5)|0;
      for(let y=y0;y<y1;y++) for(let x=0;x<w;x+=3){ const i=(y*w+x)*4; ss+=(px[i]+px[i+1]+px[i+2])/3; nn++; }
      franjas.push(+(ss/Math.max(1,nn)).toFixed(1)); }
    return { medio:+(s/n).toFixed(1), maximo:max, pctEncendido:+(100*encendidos/n).toFixed(1),
             franjas }; }
};
/* un cuadro suelto, para los ganchos: el bucle de verdad va por requestAnimationFrame y los ganchos
   necesitan poder pedir cuadros de a uno */
function animarUno(dt){
  const g=reloj.getDelta; reloj.getDelta=()=>dt;
  const raf=window.requestAnimationFrame; window.requestAnimationFrame=()=>0;
  try{ animar(); } finally { window.requestAnimationFrame=raf; reloj.getDelta=g; }
}
</script>
