   es la mitad del "se ve todo raro". Una camara de mano ronda los 65-75; 80

   encuadre dependia del telefono: en 19,5:9 se veia una cosa y en 4:3 otra, y
   el campo horizontal se iba de 90 a 117 grados segun el aparato. Una cinta de
   video tiene UN formato; ademas asi todos ven la misma composicion.
   Lo que sobra queda en negro — que en un found footage no es un defecto.

   EL ORIGEN DEL ESCENARIO SE GUARDA, NO SE RECALCULA. `toLocal` tiene que
   invertir exactamente la misma colocacion; recalculandola por su cuenta,
   cualquier cambio de aca la desincroniza y los toques quedan corridos sin que
   nada falle a la vista. */

   hoy— contra la version original de pantalla completa:

   | | campo | mundo visible | pantalla usada | las dos juntas |
   |---|---|---|---|---|
   | original, pantalla llena | 117,2 x 74,0 | 100% | 100% | 100% |
   | 16:9 encajado | 90,0 x 58,7 | 46% | 82% | **37%** |

    stgL=centrar(VW,w,S.l,S.r); stgT=centrar(VH,h,S.t,S.b); stgX1=0;

       desde una pantalla de dpr 1. `setSize(...,false)` no toca el estilo, y el
       lienzo no tiene ancho en CSS: entonces su caja de layout termina midiendo
       `VW * pixelRatio` PIXELES DE CSS. Con el pixelRatio topado en 1,5 y un
       telefono de dpr 2,75 eso es 1,5 veces el escenario — y el escenario tiene
       `overflow:hidden` con `transform-origin:top left`.
       Medido, reproducido en el banco a dpr 2,75: lienzo 1503x691 dentro de un
       escenario de 1002x461, o sea que el jugador veia el **44,5%** del cuadro,
       y la esquina de ARRIBA A LA IZQUIERDA. El centro del render no caia en el
       centro de la pantalla; la mira, que es DOM y vive en el escenario, si.
       De ahi salian las dos cosas que venia reportando: "el centro no esta en el
       centro" y "veo un cuarto de lo que se debe ver" (0,445 x 0,82 del 16:9 =

       ninguna de mis capturas lo mostro nunca. */
    const cv=renderer.domElement;

    '  col+=(n-0.5)*uGrain*(0.72+0.34*lum);',           // ruido de cinta
    '  float stt=step(0.9925-uGlitch*0.035,h1(floor(uv.y*200.0)-floor(uTime*18.0)*7.1));',
    '  col+=stt*(0.09+0.26*uGlitch)*h2(uv*uRes);',      // rayas que cruzan
    '  col=mix(col,vec3(dot(col,vec3(0.333)))+(h2(uv*uRes*1.7+uTime)-0.5)*0.4,hs*0.85);',

    '  col=pow(max(col,0.0),vec3(uLift));',
    '  float r2=dot(cc,cc);',
    '  col*=mix(1.0,smoothstep(0.62,0.05,r2),uVig);',   // viñeteado
    '  vec2 ob=step(vec2(0.0),uvb)*step(uvb,vec2(1.0));',
    '  col*=ob.x*ob.y;',
    '  gl_FragColor=vec4(max(col,0.0)*uBright,1.0);',

/* ══════════ texturas + normal maps procedurales ══════════ */
function makeCanvas(size,draw){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'),size); return c;
}
function makeCanvas2(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h); return c;
}
function colorTex(size,draw,rx,ry){
  const t=new THREE.CanvasTexture(makeCanvas(size,draw));
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t;
}
/* deriva un normal map del propio dibujo: relieve sin costo de descarga */
function normalTex(size,draw,rx,ry,str){
  const c=makeCanvas(size,draw), g=c.getContext('2d');
  const s=g.getImageData(0,0,size,size).data;
  const out=g.createImageData(size,size), o=out.data;
  const H=(x,y)=>{x=(x+size)%size;y=(y+size)%size;const i=(y*size+x)*4;
    return (s[i]*0.299+s[i+1]*0.587+s[i+2]*0.114)/255;};
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const nx=(H(x-1,y)-H(x+1,y))*str, ny=(H(x,y-1)-H(x,y+1))*str;
    const l=Math.sqrt(nx*nx+ny*ny+1), i=(y*size+x)*4;
    o[i]=(nx/l*.5+.5)*255; o[i+1]=(ny/l*.5+.5)*255; o[i+2]=(1/l*.5+.5)*255; o[i+3]=255;
  }
  g.putImageData(out,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry); return t;
}

/* ══════════ colisiones ══════════ */
const COL=[]; const addCol=(x0,x1,z0,z1,y0,y1)=>COL.push({x0,x1,z0,z1,y0,y1});

function box(w,h,d,mat,x,y,z,ry,collide,cast){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); if(ry)m.rotation.y=ry;
  m.castShadow=cast!==false; m.receiveShadow=true; scene.add(m);
  if(collide){const c=Math.abs(Math.cos(ry||0)),s=Math.abs(Math.sin(ry||0));
    const ew=(w*c+d*s)/2, ed=(d*c+w*s)/2;
    addCol(x-ew,x+ew,z-ed,z+ed,y-h/2,y+h/2);}
  return m;
}
function plane(w,d,mat,x,y,z,rx){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
  m.rotation.x=rx===undefined?-Math.PI/2:rx;
  m.position.set(x,y,z); m.receiveShadow=true; scene.add(m); return m;
}

const WH=2.42, TH=0.2;
function wall(x1,z1,x2,z2,h,openings,mat,y0){
  y0=y0||0; mat=mat||M.wall;
  const horiz=Math.abs(x2-x1)>Math.abs(z2-z1);
  const len=horiz?x2-x1:z2-z1, dir=Math.sign(len), L=Math.abs(len);
  const ops=(openings||[]).slice().sort((a,b)=>a[0]-b[0]);
  const seg=(t0,t1,ya,yb)=>{
    if(t1-t0<=0.002||yb-ya<=0.002)return;
    const cx=horiz?x1+dir*(t0+t1)/2:x1, cz=horiz?z1:z1+dir*(t0+t1)/2;
    box(horiz?(t1-t0):TH, yb-ya, horiz?TH:(t1-t0), mat, cx, y0+(ya+yb)/2, cz, 0, true);
  };
  let cur=0;
  for(const o of ops){ seg(cur,o[0],0,h);
    if(o[2]>0)seg(o[0],o[1],0,o[2]);
    if(o[3]<h)seg(o[0],o[1],o[3],h);
    cur=o[1]; }
  seg(cur,L,0,h);
}

/* ══════════ CUANTO AIRE ILUMINADO HAY DELANTE ══════════
   El halo del haz tiene que ser proporcional a la columna de aire que la luz
   cruza: en un pasillo largo se ve, contra una pared a medio metro no hay nada
   que iluminar. Con la placa a 0,35 m y prueba de profundidad, la oclusion es
   binaria y SALTA —medido, el aporte pasaba de +68% en un pasillo a +0,1% en un
   cuarto, o sea que el efecto se prendia y se apagaba—. Asi que la placa va sin
   prueba de profundidad y la oclusion se MIDE: se marcha por la lista de cajas
   de colision, que es lo mismo contra lo que choca el cuerpo. */
function aireLibre(ox,oy,oz,dx,dy,dz,max){
  const paso=0.28;
  for(let t=paso;t<=max;t+=paso){
    const x=ox+dx*t, y=oy+dy*t, z=oz+dz*t;
    if(!inHouse(x,z)) return t;
    for(let i=0;i<COL.length;i++){ const c=COL[i];
      if(x>c.x0&&x<c.x1&&z>c.z0&&z<c.z1&&y>c.y0&&y<c.y1) return t; }
  }
  return max;
}

   separado —y lo estaban: la luz en (-24,30,18) y el haz con un desplazamiento

/* ══════════ EL HAZ DEL TECHO ES UN VOLUMEN, NO UNA CÁSCARA ══════════
   Lo que habia era un tronco de piramide de UNA capa iluminado por `rim`, o sea
   1-|dot(N,V)|, que es MAXIMO donde la superficie esta de canto al ojo y CERO
   donde te mira de frente. Eso pinta exactamente lo contrario de un haz: el
   centro —que es por donde el rayo de vision cruza mas aire iluminado— salia
   oscuro y lo unico brillante era el contorno. Es el mismo defecto que ya habia
   costado una vuelta con el cono de la linterna: una SUPERFICIE no puede ser un
   volumen, por mas shader que se le ponga.

   Ahora son SIETE CASCARAS ANIDADAS y la suma las convierte en volumen: por el
   medio el rayo cruza las siete —catorce caras, porque cada cascara se atraviesa
   entrando y saliendo— y por el borde cruza solo la de afuera. El maximo cae en
   el centro POR CONSTRUCCION y no por un termino elegido a mano.

   Y EL PESO POR CARA VA CON 1/|dot(N,V)| PERO TOPADO. El grosor de cascara que
   cruza un rayo es tau/|cos| —de canto se atraviesa mas— pero con siete cascaras
   el 1/cos crudo vuelve a inflar la silueta como hacia `rim`. Queda entre 0,73
   y 1,00: la orilla se marca un 36% y no cinco veces.

   TRES COSAS MAS QUE UN HAZ DE VERDAD TIENE Y ESTE NO TENIA:
   · POLVO ADENTRO. El aire iluminado no es parejo: tiene vetas. Dos octavas de
     ruido en coordenadas de MUNDO, derivando casi todas hacia abajo, que es como
     cae el polvo. Sin esto un haz es un solido azul.
   · NO SE APAGA AL LLEGAR AL PISO. `pow(t,1.35)` lo dejaba en cero contra el
     suelo, asi que el haz no aterrizaba: se disolvia en el aire. Baja al 44% y
     ahi se queda, y el charco del piso cierra.
   · NO PULSA. El parpadeo era 0,14*sin(0,7t): eso no se lee a luna, se lee a que
     alguien toca un dimmer. Queda una variacion de 0,17 rad/s —una nube que
     pasa cada 37 s— y nada mas. */
const shaftMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  side:THREE.DoubleSide,fog:false,
  /* LA GANANCIA SE ELIGIO MIRANDO Y CON EL NUMERO AL LADO. Barridas cuatro
     —0,085 · 0,065 · 0,048 · 0,034— con la linterna apagada y el mismo encuadre:
     en 0,085 el haz es una pared de leche y la pared de atras pierde la textura
     y el cuadro colgado; en 0,034 lo unico que queda son las motas. En 0,048 el
     haz se lee como columna, las vetas se ven y detras se sigue leyendo el
     revoque: +60,8% de brillo medio y x1,52 en los brillos altos. */
  uniforms:{uT:{value:0},uH:{value:WH},uA:{value:0.048}},
  vertexShader:[
    'attribute float aS;',
    'varying vec3 vW;varying vec3 vN;varying vec3 vV;varying float vS;',
    'void main(){vW=position;vS=aS;',
    ' vec4 mv=modelViewMatrix*vec4(position,1.0);',
    ' vV=normalize(-mv.xyz);vN=normalize(normalMatrix*normal);',
    ' gl_Position=projectionMatrix*mv;}'
  ].join('\n'),
  fragmentShader:[
    'varying vec3 vW;varying vec3 vN;varying vec3 vV;varying float vS;',
    'uniform float uT;uniform float uH;uniform float uA;',
    'float h31(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}',
    'float rui(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);',
    ' return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),',
    '                mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),',
    '            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),',
    '                mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}',
    'void main(){',
    '  float t=clamp(vW.y/uH,0.0,1.0);',
    '  float dens=0.44+0.56*t;',
    '  dens*=smoothstep(0.0,0.034,1.0-t);',
    '  float ndv=max(abs(dot(normalize(vN),normalize(vV))),0.30);',
    '  float cru=0.62+0.38*(0.30/ndv);',
    '  vec3 q1=vW*1.55+vec3( uT*0.035,-uT*0.110, uT*0.021);',
    '  vec3 q2=vW*4.10+vec3(-uT*0.060,-uT*0.230, uT*0.040);',
    '  float mot=0.58+0.42*(rui(q1)*0.64+rui(q2)*0.36);',
    '  float pes=0.52+0.48*vS;',
    '  vec3 col=mix(vec3(0.58,0.69,0.95),vec3(0.83,0.89,1.00),vS*vS);',
    '  float nube=0.90+0.10*sin(uT*0.17)+0.04*sin(uT*0.41);',
    '  gl_FragColor=vec4(col,uA*dens*cru*mot*pes*nube);',
    '}'
  ].join('\n')
});
/* ══════════ CUANTA INCLINACION ACEPTA EL CUARTO ══════════
   El rayo de la luna se corre 0,80 m en x y 0,60 en -z por cada metro que baja,
   asi que sobre los 2,42 m de altura son 1,94 y 1,45. Con eso el charco del
   boquete del pasillo caeria DEL OTRO LADO de la pared —el pasillo mide 3,4 m
   de ancho— y el del dormitorio 2 atravesaria la pared del este.
   Se toma la inclinacion de la luna hasta donde el cuarto la aguanta: la
   DIRECCION es siempre la de la luna, asi el haz y las sombras coinciden, y lo
   unico que se recorta es cuanto. Se busca por muestreo y no por algebra de
   signos, que es donde se equivoca uno. */
function inclina(h){
  const cx=(h.x0+h.x1)/2, cz=(h.z0+h.z1)/2;
  const r=cuartoDe(cx,cz); if(!r) return 0.28;
  const rad=Math.max(h.x1-h.x0,h.z1-h.z0)*0.62;   // el charco se desvanece en la orilla
  let t=0;
  for(let k=1;k<=40;k++){
    const q=k/40, px=cx+DER_X*WH*q, pz=cz+DER_Z*WH*q;
    if(px-rad<r[0]+0.08||px+rad>r[1]-0.08||pz-rad<r[2]+0.08||pz+rad>r[3]-0.08) break;
    t=q;
  }
  return Math.max(0.18,t);
}
const SH_ESC=[1.00,0.87,0.745,0.62,0.495,0.37,0.245];   // escala de cada cáscara
const SH_ENS=1.16;                                       // el haz se abre al bajar
const _shV=[], _shS=[];
let _hazMalla=null; const _hazInc=[]; let _luzForz=null; const _cielos=[];
let _dibEsc=0, _triEsc=0;
const dripSystems=[];
HOLES.forEach((h,hi)=>{
  const cx=(h.x0+h.x1)/2, cz=(h.z0+h.z1)/2;
  const w=h.x1-h.x0, d=h.z1-h.z0;
  const floorY=0;

  /* bordes: tablas partidas asomando hacia el vacío */
  for(let i=0;i<11;i++){
    const side=i%4;
    let px,pz,ry;
    if(side===0){px=rnd(h.x0,h.x1);pz=h.z0;ry=0;}
    else if(side===1){px=rnd(h.x0,h.x1);pz=h.z1;ry=0;}
    else if(side===2){px=h.x0;pz=rnd(h.z0,h.z1);ry=Math.PI/2;}
    else {px=h.x1;pz=rnd(h.z0,h.z1);ry=Math.PI/2;}
    const L=rnd(0.12,0.34);
    const t=box(ry?L:0.115,0.028,ry?0.115:L,M.machiD,
      px+(ry?(side===2?L/2:-L/2):0), WH-0.03, pz+(ry?0:(side===0?L/2:-L/2)),0,false);
    t.rotation.set(rnd(-0.14,0.14),0,rnd(-0.14,0.14));
  }
  /* listones y tablas colgando de un clavo */
  for(let i=0;i<4;i++){
    const px=rnd(h.x0,h.x1), pz=rnd(h.z0,h.z1), L=rnd(0.35,0.8);
    const pl=box(0.1,L,0.03,M.machiD,px,WH-0.06-L*0.42,pz,Math.random()*3,false);
    pl.rotation.z=rnd(-0.4,0.4); pl.rotation.x=rnd(-0.3,0.3);
    sway.push({o:pl,base:pl.rotation.z,amp:rnd(0.03,0.09),sp:rnd(0.6,1.2),ph:Math.random()*6.3,axis:'z'});
  }
  /* jirón de tela / aislante */
  {
    const g=new THREE.PlaneGeometry(rnd(0.3,0.5),rnd(0.4,0.7),3,3);
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++) p.setZ(i,rnd(-0.04,0.04));
    const cl=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x6d6558,
      roughness:1,side:THREE.DoubleSide}));

    sway.push({o:cl,base:0,amp:rnd(0.05,0.12),sp:rnd(0.4,0.8),ph:Math.random()*6.3,axis:'z'});
  }
  /* vigas del entretecho, visibles por el agujero */
  for(let i=0;i<2;i++)
    box(w+0.5,0.11,0.09,M.wood,cx,WH+0.42+i*0.34,cz+rnd(-d/2,d/2),rnd(-0.2,0.2),false);
  /* parche de cielo: el tejado también está abierto.
     EL CIELO SE VE DEL LADO DE LA LUNA, no del lado donde cae la luz. Mirando
     hacia arriba por el boquete uno mira CONTRA el rayo, asi que el parche va
     corrido al reves que el charco del piso. Estaba en un +0,25/-0,2 escrito a
     mano, que lo corria justo para el otro lado. */
  const sky=new THREE.Mesh(new THREE.PlaneGeometry(w*0.75,d*0.75),
    new THREE.MeshBasicMaterial({color:0x3a4a68,fog:false}));
  sky.rotation.x=Math.PI/2;
  sky.position.set(cx-DER_X*1.5,WH+1.5,cz-DER_Z*1.5); scene.add(sky);
  _cielos.push(sky);   // un relámpago enciende el cielo, no sólo el cuarto

  /* haz de luna: siete cáscaras anidadas, inclinadas como la luna */
  {
    const tt=inclina(h); _hazInc.push(+tt.toFixed(3));
    const ox=DER_X*WH*tt, oz=DER_Z*WH*tt;
    const A=[[h.x0,h.z0],[h.x1,h.z0],[h.x1,h.z1],[h.x0,h.z1]];
    for(let k=0;k<SH_ESC.length;k++){
      const sc=SH_ESC[k], vs=k/(SH_ESC.length-1);
      const Tp=A.map(p=>[cx+(p[0]-cx)*sc, WH, cz+(p[1]-cz)*sc]);
      const Bp=A.map(p=>[cx+(p[0]-cx)*sc*SH_ENS+ox, 0, cz+(p[1]-cz)*sc*SH_ENS+oz]);
      for(let i=0;i<4;i++){
        const j=(i+1)%4;
        _shV.push(...Tp[i],...Tp[j],...Bp[j], ...Tp[i],...Bp[j],...Bp[i]);
        for(let q=0;q<6;q++) _shS.push(vs);
      }
    }
    /* charco de luz al PIE del haz, y no debajo del hueco */
    const pool=new THREE.Mesh(new THREE.PlaneGeometry(w*1.5,d*1.5),
      new THREE.MeshBasicMaterial({color:0x4a5c80,transparent:true,opacity:0.16,
        blending:THREE.AdditiveBlending,depthWrite:false,map:blobTex}));
    pool.rotation.x=-Math.PI/2; pool.position.set(cx+ox,floorY+0.015,cz+oz); scene.add(pool);
    /* EL REBOTE VA A MEDIA ALTURA DEL HAZ Y NO PEGADO AL TECHO. Estaba en
       WH-0.6, o sea iluminando el machimbre de alrededor del boquete; lo que una
       columna de luz ilumina de verdad es el suelo donde cae y el zocalo de las
       paredes que roza. */
    const ml=new THREE.PointLight(0x86a0cc,0.30,5.5,2);
    ml.position.set(cx+ox*0.62,WH*0.46,cz+oz*0.62); scene.add(ml);
  }

  /* gotera: hilo de gotas cayendo por el hueco */
  {
    const N=22, arr=new Float32Array(N*6), spd=new Float32Array(N);
    const gx=cx+rnd(-w*0.25,w*0.25), gz=cz+rnd(-d*0.25,d*0.25);
    for(let i=0;i<N;i++){
      const x=gx+rnd(-0.12,0.12), z=gz+rnd(-0.12,0.12), y=rnd(0,WH);
      spd[i]=rnd(3.4,5.2);
      arr[i*6]=x; arr[i*6+1]=y; arr[i*6+2]=z;
      arr[i*6+3]=x; arr[i*6+4]=y+0.11; arr[i*6+5]=z;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const ls=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({
      color:0x9fb4cf,transparent:true,opacity:0.5}));
    ls.frustumCulled=false; scene.add(ls);
    dripSystems.push({geo,arr,spd,N,top:WH,gx,gz});
    /* mancha húmeda y charquito debajo */
    blob(gx,gz,0.85,floorY);
    const pud=new THREE.Mesh(new THREE.CircleGeometry(rnd(0.28,0.45),14),M.water);
    pud.rotation.x=-Math.PI/2; pud.position.set(gx,floorY+0.008,gz); scene.add(pud);
  }
});

/* LAS VEINTIUNA CASCARAS VAN EN UNA SOLA MALLA. Sueltas serian siete llamadas
   de dibujo por boquete —veintiuna en total— para algo que la mezcla aditiva
   suma sin importar el orden. Fundidas cuestan UNA, o sea DOS MENOS que los tres
   troncos de antes. Las posiciones van en coordenadas de MUNDO y la malla se
   queda en el origen: asi `position` ES la posicion de mundo y el ruido del
   polvo no necesita otra matriz. */
{
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(_shV),3));
  g.setAttribute('aS',new THREE.BufferAttribute(new Float32Array(_shS),1));
  g.computeVertexNormals();
  _hazMalla=new THREE.Mesh(g,shaftMat);
  _hazMalla.renderOrder=3; scene.add(_hazMalla);
}

}

function pic(x,y,z,ry,w,h){

const _escombros={n:0,suma:0,peor:0};
let _debSalteados=0;
function debris(x0,x1,z0,z1,n,y){
  for(let i=0;i<n;i++){
    /* se sortea de nuevo mientras caiga sobre la escalera al sotano. Diez
       intentos y se descarta la pieza: con la region entera dentro de la zona
       despejada, insistir seria un bucle infinito. */
    let x=0,z=0,ok=false;
    for(let k=0;k<10&&!ok;k++){
      x=rnd(x0,x1); z=rnd(z0,z1);
      ok=!despejado(x,z,(y||0)+0.15);
    }
    if(!ok){ _debSalteados++; continue; }
    const t=Math.random();
    let m;
    if(t<.45) m=box(rnd(.5,1.3),.05,rnd(.08,.16),M.wood,x,(y||0)+.03,z,Math.random()*3,false,false);
    else if(t<.8) m=box(rnd(.1,.3),rnd(.05,.2),rnd(.1,.3),M.dark,x,(y||0)+.06,z,Math.random()*3,false,false);
    else m=box(rnd(.25,.5),rnd(.2,.4),rnd(.2,.4),M.wood,x,(y||0)+.15,z,Math.random()*3,false,false);
    // una tabla larga se ladea poco —se apoya en el piso— y un cascote chico
    // puede quedar de canto. De ahi que el ladeo dependa de que pieza es.
    const lad=t<.45?0.10:(t<.8?0.42:0.22);
    m.rotation.x=rnd(-lad,lad); m.rotation.z=rnd(-lad,lad);
    m.position.y+=Math.abs(m.rotation.x)*0.12+Math.abs(m.rotation.z)*0.12;
    { const r=Math.abs(m.rotation.x)+Math.abs(m.rotation.z);
      _escombros.n++; _escombros.suma+=r; if(r>_escombros.peor)_escombros.peor=r; }
  }
}
function sheet(w,h,d,x,y,z){
  const m=box(w,h,d,M.cloth,x,y,z,rnd(-.2,.2),true);
  m.geometry=new THREE.BoxGeometry(w,h,d,3,3,3);
  const p=m.geometry.attributes.position;
  for(let i=0;i<p.count;i++)p.setXYZ(i,p.getX(i)+rnd(-.05,.05),p.getY(i)+rnd(-.06,.03),p.getZ(i)+rnd(-.05,.05));
  m.geometry.computeVertexNormals();
  blob(x,z,Math.max(w,d)*0.8,y-h/2);
  return m;
}
function web(x,y,z,s,ry){   // telaraña de rincón: membrana + hilos + un tirante colgando
  const grp=new THREE.Group(); grp.position.set(x,y,z); grp.rotation.y=ry; scene.add(grp);
  const h=s*rnd(0.7,1.05), s2=s*rnd(0.85,1.15);
  const A=[0,0,0], B=[s,0,0], C=[0,0,s2], D=[0,-h,0];
  const mid=[s*0.42,-h*0.34,s2*0.42];
  const v=[];
  const tri=(p,q,r)=>v.push(p[0],p[1],p[2],q[0],q[1],q[2],r[0],r[1],r[2]);
  tri(A,B,C); tri(A,B,D); tri(A,C,D); tri(B,C,mid); tri(B,D,mid); tri(C,D,mid);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,M.web); mesh.renderOrder=2; grp.add(mesh);
  const lv=[];
  const seg=(p,q)=>lv.push(p[0],p[1],p[2],q[0],q[1],q[2]);
  for(let i=1;i<=4;i++){                       // anillos concéntricos
    const f=i/4.6;
    seg([s*f,0,0],[0,0,s2*f]);
    seg([s*f,0,0],[0,-h*f,0]);
    seg([0,0,s2*f],[0,-h*f,0]);
  }
  seg(A,B); seg(A,C); seg(A,D); seg(A,mid);    // radiales
  seg(B,mid); seg(C,mid); seg(D,mid);
  const hx=s*rnd(0.3,0.6), hz=s2*rnd(0.3,0.6);
  seg([hx,-h*0.5,hz],[hx+rnd(-0.05,0.05),-h*0.5-rnd(0.25,0.7),hz+rnd(-0.05,0.05)]);
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lv),3));
  grp.add(new THREE.LineSegments(lg,M.webLine));
}
function curtain(x,y,z,ry,w,h){
  const g=new THREE.PlaneGeometry(w,h,4,5), p=g.attributes.position;
  for(let i=0;i<p.count;i++) p.setZ(i,Math.sin(p.getX(i)*6)*0.05+rnd(-.03,.03));
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x6b6355,roughness:1,
    side:THREE.DoubleSide,transparent:true,opacity:.92}));
  m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=true; scene.add(m);
}
function shards(x,y,z,ry){ // vidrio roto en el marco

  }
}

/* haz visible de la linterna */
const BEAM=11;
const TORCH_ANG=0.44;     // el mismo semiangulo que el cono de luz, con su margen
/* ══════════ EL HAZ ES UNA COLUMNA, NO UN CONTORNO ══════════
   El haz venia iluminado por `rim` —o sea 1-|dot(N,V)|, que es maximo en la
   SILUETA del cono— asi que lo que se dibujaba era un tubo hueco: dos lineas
   claras a los costados y nada en el medio. Eso no se lee a luz volumetrica,
   se lee a un cono de alambre.
   Lo que hace ver una columna de luz es el GROSOR de aire iluminado que el rayo
   de vision cruza, y en un cono eso es maximo en el EJE y cero en el borde: un
   perfil `1-r²` con r la distancia al eje en fracciones del radio local. Encima
   la luz cae con la distancia y el aire no es homogeneo, asi que va multiplicado
   por un ruido 3D que se mueve — ahi aparecen las vetas de polvo. */
/* ══════════ Y NO PUEDE SER UN CONO ══════════
   Un cono es una SUPERFICIE, y visto desde su propio vertice —que es justo donde
   esta el ojo en primera persona— el rayo de vision solo lo toca en el BORDE:
   toda la malla se proyecta como un anillo delgado a 25 grados del centro.
   Medido con la sonda de aporte: el cono entero, con su perfil y su ruido,
   sumaba **1,1% de brillo y x1,01 en los brillos altos**, o sea nada.
   Lo que de verdad se ve mirando por el eje de una linterna en aire con polvo es
   un HALO redondo centrado en el eje, con vetas que se mueven despacio. Eso es
   una placa que mira a la camara, no un cono: un cuadrado a 1,05 m que abarca
   exactamente el semiangulo del cono. Con prueba de profundidad puesta, asi que
   pegado a una pared el halo desaparece. */
const BEAM_D=0.35;
const beam=new THREE.Mesh(
  new THREE.PlaneGeometry(Math.tan(TORCH_ANG)*BEAM_D*2,Math.tan(TORCH_ANG)*BEAM_D*2),
  new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,depthTest:false,
    blending:THREE.AdditiveBlending,side:THREE.DoubleSide,fog:false,
    uniforms:{uI:{value:1.0},uT:{value:0},uDen:{value:1.0}},
    vertexShader:`varying vec2 vU;
      void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vU; uniform float uI,uT,uDen;
      /* ruido de valor 3D, trilineal: ocho hashes por muestra y una muestra por
         fragmento. Alcanza para vetas de polvo y no cuesta nada. */
      float h31(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123); }
      float vn(vec3 p){
        vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        float a=mix(mix(mix(h31(i+vec3(0,0,0)),h31(i+vec3(1,0,0)),f.x),
                        mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
                    mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),
                        mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);
        return a;
      }
      void main(){
        /* distancia al eje del haz, 0 en el centro y 1 en el borde del cono */
        vec2 c=vU-0.5; float r=clamp(length(c)*2.0,0.0,1.0);
        /* el grosor de aire iluminado que cruza el rayo es maximo en el eje */
        float perfil=pow(1.0-r*r,1.7);
        /* vetas de polvo: dos escalas que se arrastran, en el marco del haz, asi
           que giran con la vista igual que el aire iluminado */
        vec3 q=vec3(c*5.5,uT*0.28);
        float humo=0.46+0.72*vn(q)+0.30*vn(q*2.7+11.3);
        float a=perfil*humo*0.13*uI*uDen;
        gl_FragColor=vec4(0.82,0.89,1.00,clamp(a,0.0,1.0));}`
  }));
beam.frustumCulled=false;

/* — puertas con bisagra — */
const doors=[];
function updateDoorCol(d){
  const a=d.angle, L=d.hinge*d.W;
  const dx = d.axis==='z' ? L*Math.sin(a) :  L*Math.cos(a);
  const dz = d.axis==='z' ? L*Math.cos(a) : -L*Math.sin(a);
  const x=d.g.position.x, z=d.g.position.z;
  d.col.x0=Math.min(x,x+dx)-0.07; d.col.x1=Math.max(x,x+dx)+0.07;
  d.col.z0=Math.min(z,z+dz)-0.07; d.col.z1=Math.max(z,z+dz)+0.07;
}
function makeDoor(x,z,axis,hinge,swing,ajar){
  const W=0.96,H=2.02,T=0.055;
  const g=new THREE.Group(); g.position.set(x,H/2+0.02,z); scene.add(g);
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(axis==='z'?T:W,H,axis==='z'?W:T),M.wood);
  leaf.castShadow=true; leaf.receiveShadow=true;
  leaf.position.set(axis==='z'?0:hinge*W/2,0,axis==='z'?hinge*W/2:0);
  g.add(leaf);
  const panel=new THREE.Mesh(new THREE.BoxGeometry(axis==='z'?T+0.02:W*0.6,H*0.34,axis==='z'?W*0.6:T+0.02),M.dark);
  panel.position.copy(leaf.position); panel.position.y=0.42; g.add(panel);
  const kn=new THREE.Mesh(new THREE.SphereGeometry(0.036,8,6),M.metal);
  kn.position.set(axis==='z'?0.055:hinge*W*0.84,-0.05,axis==='z'?hinge*W*0.84:0.055);
  g.add(kn);
  const col={x0:0,x1:0,z0:0,z1:0,y0:0.02,y1:H}; COL.push(col);
  const d={g,axis,hinge,swing,W,col,angle:0,target:0,open:false,ajar:ajar||0};
  if(ajar){ d.open=true; d.angle=d.target=swing*ajar; g.rotation.y=d.angle; }
  doors.push(d); updateDoorCol(d);
  const act=()=>{ d.open=!d.open; d.target=d.open?swing*1.48:0; if(A)A.door(); };
  const lp=()=>d.open?TX('cerrarP'):TX('abrirP');
  register(leaf,lp,act); register(panel,lp,act);
  return d;
}

function agePaper(g,w,h,tone){
  g.fillStyle=tone||'#cdc1a2'; g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){
    g.fillStyle=Math.random()<.5?'rgba(120,106,78,.06)':'rgba(240,232,208,.07)';
    g.fillRect(Math.random()*w,Math.random()*h,rnd(1,4),rnd(1,4));
  }
  for(let i=0;i<12;i++){                       // manchas de humedad
    const x=Math.random()*w,y=Math.random()*h,r=rnd(30,150);
    const gr=g.createRadialGradient(x,y,2,x,y,r);
    gr.addColorStop(0,'rgba(122,98,58,.20)');
    gr.addColorStop(.7,'rgba(122,98,58,.07)');
    gr.addColorStop(1,'rgba(122,98,58,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,6.3); g.fill();
  }
  g.strokeStyle='rgba(110,96,68,.22)'; g.lineWidth=2;   // pliegues
  g.beginPath(); g.moveTo(0,h*0.5); g.lineTo(w,h*0.5+rnd(-6,6)); g.stroke();
  g.beginPath(); g.moveTo(w*0.5,0); g.lineTo(w*0.5+rnd(-6,6),h); g.stroke();
  const eg=g.createLinearGradient(0,0,0,h);            // bordes gastados
  eg.addColorStop(0,'rgba(90,74,48,.30)'); eg.addColorStop(.12,'rgba(90,74,48,0)');
  eg.addColorStop(.88,'rgba(90,74,48,0)'); eg.addColorStop(1,'rgba(90,74,48,.30)');
  g.fillStyle=eg; g.fillRect(0,0,w,h);
  const eg2=g.createLinearGradient(0,0,w,0);
  eg2.addColorStop(0,'rgba(90,74,48,.26)'); eg2.addColorStop(.12,'rgba(90,74,48,0)');
  eg2.addColorStop(.88,'rgba(90,74,48,0)'); eg2.addColorStop(1,'rgba(90,74,48,.26)');
  g.fillStyle=eg2; g.fillRect(0,0,w,h);
}
function wrap(g,text,x,y,maxW,lh,jitter){
  const words=text.split(' '); let line='', yy=y;
  for(let i=0;i<words.length;i++){
    const test=line?line+' '+words[i]:words[i];
    if(g.measureText(test).width>maxW&&line){
      g.fillText(line,x+(jitter?rnd(-3,3):0),yy); line=words[i]; yy+=lh;
    }else line=test;
  }
  if(line) g.fillText(line,x+(jitter?rnd(-3,3):0),yy);
  return yy+lh;
}

const papers=[];
let reading=null, paperRX=0, paperRY=0, readCount=0;
const countEl=document.getElementById('count');
function makePaper(x,y,z,ry,kind,ck,sign){
  const w=0.21,h=0.297;
  const grp=new THREE.Group();
  grp.position.set(x,y,z);
  grp.rotation.set(-Math.PI/2,0,ry);
  scene.add(grp);
  /* la hoja se curva. Cada una distinta: nueve hojas identicas se leen a
     copia y pega, que es el otro modo de que algo parezca puesto y no caido. */
  const cu=rnd(0.5,1.0), cv=rnd(0.4,0.9), on=rnd(0.25,0.75),
        ph=Math.random()*6.3, alza=rnd(0.006,0.016), T2=0.0012;
  const alto=(px,py)=>{
    const u=px/(w/2), v=py/(h/2);
    // cuenco: el centro apoya y los bordes se levantan. Nunca negativo, asi que
    // la hoja no se hunde en el piso por construccion.
    let d=alza*(cu*u*u + cv*v*v)*0.5;
    d+=alza*on*0.35*(1+Math.sin(u*2.1+ph))*0.5*(1-v*v);   // una onda suave
    return d;
  };
  const superficie=(off)=>{
    const g=new THREE.PlaneGeometry(w,h,6,8), a=g.attributes.position;
    for(let i=0;i<a.count;i++) a.setZ(i, alto(a.getX(i),a.getY(i))+off);
    a.needsUpdate=true; g.computeVertexNormals(); return g;
  };
  const front=new THREE.Mesh(superficie(2*T2),
    new THREE.MeshStandardMaterial({map:paperFace(kind,ck,sign),roughness:.95,
      emissive:0xffffff,emissiveIntensity:0.10,side:THREE.FrontSide}));
  front.material.emissiveMap=front.material.map;
  const back=new THREE.Mesh(superficie(0),
    new THREE.MeshStandardMaterial({map:paperBack(),roughness:.95,
      emissive:0xffffff,emissiveIntensity:0.08,side:THREE.BackSide}));
  /* Y AHORA SI PROYECTA SOMBRA: lo que convence de que una punta esta levantada
     no es la punta, es la sombra que tira debajo. Antes era un plano pegado al
     piso y una sombra no habria dicho nada. */
  front.castShadow=true; back.castShadow=false;
  grp.add(front,back);
  const p={grp,front,back,read:false,
    homePos:grp.position.clone(),homeQ:grp.quaternion.clone()};
  p.kind=kind; p.ck=ck; p.sign=sign;   // para repintarlas al cambiar de idioma
  papers.push(p);
  const lr=()=>TX('leer');
  register(front,lr,()=>openPaper(p));
  register(back ,lr,()=>openPaper(p));
  return p;
}
function openPaper(p){
  reading=p; paperRX=0; paperRY=0; focusObj=null;
  p.grp.renderOrder=5;
  if(!p.read){ p.read=true; readCount++;
    countEl.textContent=TX('papeles')+'  '+readCount+' / '+papers.length;
    countEl.style.opacity=1; setTimeout(()=>countEl.style.opacity=0,3200);
    setTension(readCount/papers.length);
    if(readCount>=papers.length) lastPaper=true; }
  useBtn.textContent=TX('dejar'); useBtn.classList.add('show');
  promptEl.style.opacity=0; dotEl.classList.remove('act');
  if(A) A.handle();
}
function closePaper(){
  if(!reading) return;
  reading.returning=true; reading.grp.renderOrder=0;
  reading=null; useBtn.textContent=TX('usar'); useBtn.classList.remove('show');
  if(A) A.handle();
  /* el octavo papel cierra la cinta: se lo deja soltar primero */
  if(lastPaper){ lastPaper=false; setTimeout(startFinale,1400); }
}

  for(const c of COL){
    if(c.y1<=y+0.4||c.y0>=y+1.9) continue;
    if(x>c.x0-0.34&&x<c.x1+0.34&&z>c.z0-0.34&&z<c.z1+0.34) return false;

  if(tension<0.45||fin||!inHouse(P.x,P.z)||P.y<-1.2) return;
  for(let i=0;i<14;i++){
    const a=P.yaw+Math.PI+rnd(-1.5,1.5), d=rnd(2.8,6.0);
    const x=P.x-Math.sin(a)*d, z=P.z-Math.cos(a)*d;
    if(!inHouse(x,z)||inHole(x,z)) continue;
    if(seen(x,z)) continue;                     // sólo aparece fuera del encuadre

    placeFigure(d,a);

function beat(n,at,fn){ if(fin.step===n&&fin.t>at){ fin.step=n+1; fn(); } }
function runFinale(){
  beat(0,0.3,()=>{                                   // se van las luces
    bulbs.forEach(b=>{ if(b.on) b.dying=rnd(0.4,2.0); });
    vhs.g=0.55; vhs.hold=0.25;
  });
  beat(1,3.4,()=>{                                   // se corta la linterna
    torchCut=true;
    vhs.g=1; vhs.hold=0.45; vhs.roll=rnd(-1.4,1.4);
    shakeKick(0.45); if(A) A.hit();
  });
  /* LOS TRES RAYOS DEL FINAL NO SE SORTEAN: son el revelado de la figura, y con
     una distancia al azar podia salir uno lejano —que casi no ilumina y cuyo
     trueno llega diez segundos despues— justo en el golpe de la escena. Van
     cerca y cada vez mas cerca (1,1 s de trueno, 0,8 y 0,4), y el azimut es
     `yaw+PI`, o sea que la luz viene DE ADELANTE del jugador: eso pone a la
     figura a contraluz, que es el unico encuadre en el que se lee. */
  beat(2,4.6,()=>{ placeFigure(6.0); figure.visible=true; lightning(380,P.yaw+Math.PI); });
  beat(3,6.8,()=>{ placeFigure(3.2); lightning(270,P.yaw+Math.PI); shakeKick(0.6); if(A) A.hit(); });
  beat(4,8.6,()=>{

  beat(5,9.8,()=>{ fadeEl.style.opacity=1; });
  beat(6,11.8,()=>{
    figure.visible=false;

    endTxt.textContent=TX('finTxt');

}

/* cuánto lo tenés de frente: 1 = justo en el centro de la pantalla */
function facing(x,z){
  const dx=x-camera.position.x, dz=z-camera.position.z, l=Math.hypot(dx,dz)||1;
  return (dx*-Math.sin(P.yaw)+dz*-Math.cos(P.yaw))/l;

function spawnGhost(){
  if(gh.on||gh.cool>0||fin) return false;
  if(!inHouse(P.x,P.z)||P.y<-1.2) return false;
  const mine=roomOf(P.x,P.z,P.y);
  const cand=WINDOWS.filter(w=>w.room===mine&&facing(w.x,w.z)<0.42);
  if(!cand.length) return false;                     // esta pieza no tiene ventana: se reintenta

/* ── el sacudón ──
   antes eran senos de alta frecuencia evaluados por frame: a 60 fps entraban en
   aliasing y se veían a los tirones. Ahora es un resorte amortiguado integrado en
   subpasos fijos, así que sale igual de suave a 30 que a 120 fps. */
const shk={r:new V3(),rv:new V3(),p:new V3(),pv:new V3(),trauma:0,tick:0};
function shakeKick(str){
  const rr=()=>rnd(-1,1);
  shk.rv.x+= 3.4*str + Math.abs(rr())*1.5*str;   // siempre hacia arriba, nunca al revés
  shk.rv.y+= rr()*2.0*str;
  shk.rv.z+= rr()*2.8*str;
  shk.pv.x+= rr()*1.2*str;
  shk.pv.y+= 1.0*str + Math.abs(rr())*0.7*str;
  shk.pv.z+= rr()*1.2*str;
  shk.trauma=Math.min(1,Math.max(shk.trauma,str));
}
function shakeReset(){
  shk.r.set(0,0,0); shk.rv.set(0,0,0); shk.p.set(0,0,0); shk.pv.set(0,0,0);
  shk.trauma=0; shk.tick=0;
}
function shakeUpdate(dt){
  if(shk.trauma<=0&&shk.rv.lengthSq()<1e-7&&shk.r.lengthSq()<1e-7) return false;
  shk.trauma=Math.max(0,shk.trauma-dt*0.95);
  /* golpes secundarios a intervalo fijo, no una vez por frame */
  shk.tick-=dt;
  if(shk.tick<=0&&shk.trauma>0.06){
    shk.tick=0.055;
    const s=shk.trauma*shk.trauma;
    shk.rv.x+=rnd(-1,1)*2.6*s; shk.rv.y+=rnd(-1,1)*2.6*s; shk.rv.z+=rnd(-1,1)*3.8*s;
    shk.pv.y+=rnd(-1,1)*1.4*s;
  }
  const K=150, D=11, H=1/120;
  let acc=Math.min(dt,0.1);
  while(acc>0){                            // subpasos fijos: estable con fps bajos
    const s=Math.min(H,acc); acc-=s;
    const damp=1-Math.min(1,D*s);
    shk.rv.addScaledVector(shk.r,-K*s); shk.rv.multiplyScalar(damp);
    shk.r.addScaledVector(shk.rv,s);
    shk.pv.addScaledVector(shk.p,-K*s); shk.pv.multiplyScalar(damp);
    shk.p.addScaledVector(shk.pv,s);
  }
  return true;
}

function triggerScare(){
  hideGhost();
  gh.cool=rnd(80,140);
  P.panic=1;
  shakeKick(1);
  /* el cuerpo se va para atrás solo, pero suave: un empujón fuerte se clava en las paredes */
  P.vx+= Math.sin(P.yaw)*1.4; P.vz+= Math.cos(P.yaw)*1.4;
  vhs.g=1; vhs.hold=0.30; vhs.roll=rnd(-1.2,1.2);
  if(A) A.scare();
  /* las luces cercanas acusan el golpe */
  bulbs.forEach(b=>{ if(b.on&&Math.random()<0.7){ b.state=0; b.next=0; } });
  /* la nota va después del golpe: si entra en el mismo frame se pisa con el susto */
  setTimeout(()=>showNote('Había alguien del otro lado del vidrio.'),1100);
}

/* ══════════ eventos ambientales ══════════ */
function roomOf(x,z,y){
  if(y<-1.2) return 'sotano';
  if(!inHouse(x,z)) return 'patio';
  if(x>-1.8&&x<1.8) return z>3.8?'entrada':'pasillo';
  if(x<=-1.8) return z>1.2?'sala':(z>-2.6?'cocina':'trastero');
  return z>2.2?'dorm1':(z>-0.2?'bano':'dorm2');
}
function panOf(x,z){
  const dx=x-camera.position.x, dz=z-camera.position.z;
  const l=Math.hypot(dx,dz)||1;
  return Math.max(-1,Math.min(1,(dx*Math.cos(P.yaw)-dz*Math.sin(P.yaw))/l));
}
/* ¿lo tengo a la vista? los eventos prefieren ocurrir fuera del encuadre */
function seen(x,z){
  const dx=x-camera.position.x, dz=z-camera.position.z;
  const l=Math.hypot(dx,dz)||1;
  const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw);
  return (dx*fx+dz*fz)/l>0.55 && l<9;
}

/* — objetos sueltos que pueden caerse — */
const fallers=[];

const swingers=[], shutters=[];
function shutter(x,y,z,axis){
  const W=0.72,H=1.15,T=0.05;
  const g=new THREE.Group(); g.position.set(x,y,z); scene.add(g);
  const px=axis==='x'?W/2:0, pz=axis==='x'?0:W/2;
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(axis==='x'?W:T,H,axis==='x'?T:W),M.wood);
  leaf.position.set(px,0,pz); leaf.castShadow=true; leaf.receiveShadow=true; g.add(leaf);
  [-0.34,0.34].forEach(o=>{
    const b=new THREE.Mesh(new THREE.BoxGeometry(axis==='x'?W:T+0.02,0.1,axis==='x'?T+0.02:W),M.dark);
    b.position.set(px,o,pz); g.add(b);
  });
  const sw={g,angle:0,target:0,speed:1.2,onArrive:null,busy:false};
  swingers.push(sw); shutters.push(sw); return sw;
}

function evDoor(){
  const cand=doors.filter(d=>!seen(d.g.position.x,d.g.position.z));
  const d=(cand.length?cand:doors)[Math.floor(Math.random()*(cand.length||doors.length))];
  if(!d||d.drifting) return;
  d.drifting=true; d.speed=rnd(0.45,0.75);
  const rel=Math.abs(d.angle/(d.swing*1.48));
  d.target = rel<0.15 ? d.swing*rnd(0.22,0.45)
           : rel>0.8  ? d.swing*rnd(0.5,0.75)
                      : d.swing*(Math.random()<0.5?rnd(0.05,0.2):rnd(0.75,1.2));
  d.open = Math.abs(d.target)>0.1;
  if(A) A.door(panOf(d.g.position.x,d.g.position.z));
  setTimeout(()=>{d.speed=3.4;d.drifting=false;},5000);
}
function evLight(){
  const on=bulbs.filter(b=>b.on), off=bulbs.filter(b=>!b.on);
  if(on.length && (Math.random()<0.82||!off.length)){
    const b=on[Math.floor(Math.random()*on.length)];
    b.dying=rnd(0.7,1.6);
  }else if(off.length){
    const b=off[Math.floor(Math.random()*off.length)];
    b.on=true; b.state=0; b.next=0;

}
function evFall(){
  const cand=fallers.filter(f=>!f.active&&f.hits===0);
  if(!cand.length) return;
  const hidden=cand.filter(f=>!seen(f.m.position.x,f.m.position.z));
  const f=(hidden.length?hidden:cand)[Math.floor(Math.random()*(hidden.length||cand.length))];
  f.active=true; f.v=0; f.spin=rnd(-4,4);
}

/* el peso de evGlimpse es 0 hasta que la tensión sube: al principio no existe */
const DIRECTOR=[{w:22,f:evDoor},{w:15,f:evLight},{w:18,f:evFall},
                {w:16,f:evShutter},{w:24,f:evNoise},
                {w:0,f:evGlimpse,tw:t=>Math.max(0,(t-0.4)*40)},
                {w:0,f:spawnGhost,tw:t=>14+t*14}];
let lastEv=null;
function fireEvent(){
  for(const e of DIRECTOR) if(e.tw) e.w=e.tw(tension);
  const DW=DIRECTOR.reduce((a,b)=>a+b.w,0);
  let pick=null;
  for(let i=0;i<4;i++){
    let r=Math.random()*DW;
    for(const e of DIRECTOR){ r-=e.w; if(r<=0){pick=e;break;} }
    if(pick&&pick!==lastEv) break;
  }
  if(!pick) return;
  lastEv=pick;
  /* el fantasma necesita una pieza con ventana: si no la hay, queda pendiente */
  if(pick.f===spawnGhost){
    if(spawnGhost()===false){ gh.pending=1; fireEventFallback(); }
    return;
  }
  pick.f();
}
function fireEventFallback(){
  const alt=DIRECTOR.filter(e=>e.f!==spawnGhost&&e.w>0);
  const e=alt[Math.floor(Math.random()*alt.length)];
  if(e) e.f();
}

const moteTex=(()=>{
  const t=new THREE.CanvasTexture(makeCanvas(32,(g,s)=>{
    const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    gr.addColorStop(0,'rgba(255,250,232,1)');
