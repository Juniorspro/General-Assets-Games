/* ══════════ EL POLVO REACCIONA AL HAZ ══════════
   El polvo ya existia —mil motas— y no servia de nada: iba con `PointsMaterial`,
   que NO RECIBE LUZ, asi que cada mota tenia el mismo brillo dentro del haz y a
   tres metros en la oscuridad. Eso no se lee a polvo en suspension: se lee a
   manchitas pegadas encima de la imagen.
   Lo unico que convierte una mota en polvo iluminado es que se ENCIENDA cuando
   entra en el cono, y eso hay que calcularlo por mota: angulo contra el eje de
   la linterna, con penumbra, por la caida de la distancia. Fuera del cono queda
   un resto minimo, que es lo que se ve de verdad en un cuarto a oscuras.

   Y LA DERIVA PASA AL VERTEX SHADER. Antes eran seis senos por mota en
   JavaScript, o sea que la densidad se pagaba en el hilo principal; con la
   deriva en GLSL y el envoltorio por modulo alrededor de la camara, agregar
   motas cuesta CERO trabajo de JS — y por eso se puede triplicar la densidad. */
const dustFields=[];
const dustMat=[];
const _pLuz=new THREE.Vector3(), _dLuz=new THREE.Vector3(), _vTam=new THREE.Vector2();
let _motas=0;
/* POLVO_ON: null = lo maneja el juego. La sonda tiene que poder APAGARLO para
   comparar el mismo cuadro con y sin polvo, y sin esto no puede: el bucle
   reescribe beam.visible y rampa uI en CADA cuadro, asi que un apagado de una
   sola vez se deshace al cuadro siguiente. Es la misma leccion que el parpadeo
   de la fogata en LEMI. */
let POLVO_ON=null;
function dustField(n,size,op,rise,spread,alto){
  alto=alto||2.9;
  const a=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    a[i*3]=rnd(-spread,spread); a[i*3+1]=rnd(-alto/2,alto/2); a[i*3+2]=rnd(-spread,spread);
  }
  const geo=new THREE.BufferGeometry();
  /* la semilla ES `position`: el vertex shader la lee de ahi y no hay dos
     atributos apuntando al mismo buffer */
  geo.setAttribute('position',new THREE.BufferAttribute(a,3));
  const mat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false,
    uniforms:{
      uMapa:{value:moteTex}, uT:{value:0}, uOp:{value:op}, uI:{value:1},
      uCam:{value:new THREE.Vector3()}, uLPos:{value:new THREE.Vector3()},
      uLDir:{value:new THREE.Vector3(0,0,-1)},
      uCos:{value:Math.cos(TORCH_ANG)}, uEsc:{value:300},
      uTam:{value:size}, uCaja:{value:new THREE.Vector3(spread*2,alto,spread*2)},
      uSube:{value:rise}
    },
    vertexShader:`
      uniform float uT,uOp,uI,uCos,uEsc,uTam,uSube;
      uniform vec3 uCam,uLPos,uLDir,uCaja;
      varying float vB;
      void main(){
        /* deriva: dos senos por eje, de periodos que no son multiplos entre si,
           asi que el remolino no se repite igual nunca */
        vec3 p=position;
        p.x+=sin(uT*0.37+position.z*3.1)*0.20+sin(uT*0.11+position.y*2.0)*0.09;
        p.y+=sin(uT*0.23+position.x*2.7)*0.12+uT*uSube;
        p.z+=cos(uT*0.31+position.x*3.4)*0.20+cos(uT*0.09+position.y*1.7)*0.09;
        /* el polvo SIEMPRE rodea al jugador: se envuelve por modulo alrededor de
           la camara, asi que nunca se agota ni queda atras */
        p=mod(p-uCam+uCaja*0.5,uCaja)-uCaja*0.5+uCam;
        /* cuanto la enciende la linterna */
        vec3 h=p-uLPos; float d=length(h);
        float ca=dot(h/max(d,1e-4),uLDir);
        float cono=smoothstep(uCos-0.02,uCos+0.20,ca);
        float caida=1.0/(1.0+0.30*d*d);
        vB=uOp*(0.11+6.2*cono*caida*uI);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        /* una mota en el haz se ve mas GRANDE, no solo mas clara: es lo que hace
           que se lea a mota de polvo brillando y no a pixel encendido */
        gl_PointSize=uTam*(1.0+1.3*cono*uI)*(uEsc/max(-mv.z,0.05));
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform sampler2D uMapa; varying float vB;
      void main(){
        float m=texture2D(uMapa,gl_PointCoord).a;
        /* con mezcla aditiva el aporte es rgb*a: el brillo va en el color —que
           puede pasar de 1 y sumar— y el alfa es solo la forma redonda de la
           mota. Metiendo vB en los dos, el aporte saldria al CUADRADO. */
        gl_FragColor=vec4(vec3(0.91,0.86,0.75)*clamp(vB,0.0,3.0),m);
      }`
  });
  const pts=new THREE.Points(geo,mat);
  pts.frustumCulled=false; scene.add(pts);
  dustFields.push({mat,base:op}); _motas+=n;
  dustMat.push(mat);
}
/* LA DENSIDAD ES CANTIDAD SOBRE VOLUMEN, no cantidad, y lo que importa es la
   densidad DENTRO DEL CONO, que es un volumen chico y pegado al jugador: a tres
   metros el cono mide unos 6 m3. Con las 760 motas originales repartidas en
   14x2,6x14 —1,5 por m3— dentro del haz habia NUEVE motas. De ahi que no se
   leyera a polvo en suspension.
   Y como la deriva ahora la hace la GPU, subir la cantidad no cuesta un solo
   ciclo de JavaScript: lo unico que se paga son vertices. */
/* Y LO QUE FALTABA ERA AREA EN PANTALLA, NO BRILLO. Medido subiendo la ganancia
   del polvo: x4 -> +3,6% · x16 -> +7,7% · x64 -> +11,1%, o sea que SATURA: los
   pixeles de las motas ya estaban al maximo y el techo lo ponia cuanta pantalla
   cubren. Con 0,019 m a un metro una mota mide 16 px en el telefono y 6 en el
   banco — una mota de polvo iluminada se ve, no se adivina. */
dustField(1200,0.050,0.52,0.022,5.5);       // motas finas, todo el cuarto
dustField(1800,0.034,0.40,0.014,3.0,2.6);   // EL POLVILLO DEL HAZ
dustField(230 ,0.075,0.30,0.011 ,6);        // pelusas mas grandes
dustField(110 ,0.150,0.13,0.006 ,5);        // hilachas que flotan cerca

/* ══════════ audio ══════════ */
let A=null;
function initAudio(){
  if(A) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const ctx=new AC();
  const t=()=>ctx.currentTime;
  const R=(a,b)=>a+Math.random()*(b-a);

  /* ─── cadena principal: compresor suave para que nada salte ─── */
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-17; comp.knee.value=24; comp.ratio.value=3.2;
  comp.attack.value=0.006; comp.release.value=0.3;
  const master=ctx.createGain(); master.gain.value=0.85;
  comp.connect(master); master.connect(ctx.destination);
  /* ANALIZADOR COLGADO DEL MAESTRO. Sin esto, "el trueno suena" y "el trueno
     llega tarde" son dos afirmaciones que no se pueden comprobar: lo unico que
     se sabria es que la llamada no tiro excepcion. Con el analizador el retardo
     se MIDE, que es justo el defecto que esta vuelta arregla. */
  const ana=ctx.createAnalyser(); ana.fftSize=2048; ana.smoothingTimeConstant=0;
  const anaBuf=new Float32Array(ana.fftSize);
  const anaFrq=new Float32Array(ana.frequencyBinCount);
  master.connect(ana);
  /* Y SE MIDE TAMBIEN LA BANDA BAJA. Un trueno vive por debajo de 200 Hz y el
     manto de lluvia tiene un pasaaltos en 360, asi que en la banda baja se
     separan solos. En rms total un trueno lejano es INDISTINGUIBLE de la lluvia
     —medido: 0,025 contra 0,023 de fondo— y entonces la medicion no puede decir
     si llego ni cuando. */
  const binHz=ctx.sampleRate/ana.fftSize;
  const binTope=Math.max(2,Math.round(250/binHz));   // el manto de lluvia tiene un pasaaltos en 360
  function nivel(){
    ana.getFloatTimeDomainData(anaBuf);
    let sum=0,pk=0;
    for(let i=0;i<anaBuf.length;i++){ const v=anaBuf[i]; sum+=v*v; const a=Math.abs(v); if(a>pk)pk=a; }
    ana.getFloatFrequencyData(anaFrq);
    let lo=0;
    for(let i=1;i<=binTope;i++) lo+=Math.pow(10,anaFrq[i]/20);
    return {rms:Math.sqrt(sum/anaBuf.length), pico:pk, bajos:lo/binTope};
  }
  const amb=ctx.createGain(); amb.gain.value=1; amb.connect(comp);   // baja en los silencios

  /* ─── reverb con respuesta al impulso generada ─── */
  const irLen=Math.floor(ctx.sampleRate*2.1);
  const ir=ctx.createBuffer(2,irLen,ctx.sampleRate);
  for(let c=0;c<2;c++){
    const d=ir.getChannelData(c);
    for(let i=0;i<irLen;i++){
      const x=i/irLen;
      d[i]=(Math.random()*2-1)*Math.pow(1-x,2.7)*(1-Math.exp(-i/350));
    }
  }
  const conv=ctx.createConvolver(); conv.buffer=ir;
  const revOut=ctx.createGain(); revOut.gain.value=0.8;
  conv.connect(revOut); revOut.connect(amb);
  const revBus=ctx.createGain(); revBus.gain.value=0.4;   // cuánta cola tiene el ambiente actual
  revBus.connect(conv);

  const noise=(()=>{const b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return b;})();
  const nsrc=l=>{const s=ctx.createBufferSource(); s.buffer=noise; s.loop=!!l; return s;};
  const panner=v=>{ if(!ctx.createStereoPanner) return null;
    const p=ctx.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,v)); return p; };

  /* enruta un evento puntual: señal directa + envío a la reverb */
  function route(node,panV,send){
    const p=panner(panV||0);
    let last=node;
    if(p){ node.connect(p); last=p; }
    last.connect(amb);
    const s=ctx.createGain(); s.gain.value=(send==null?0.5:send);
    last.connect(s); s.connect(revBus);
  }
  function env(g,atk,peak,dec){
    g.gain.setValueAtTime(0.0001,t());
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t()+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t()+atk+dec);
  }
  const later=(f,ms)=>setTimeout(f,ms);

  /* ═══════════ capas continuas ═══════════ */
  /* lluvia: manto lejano */
  const rFarG=ctx.createGain(); rFarG.gain.value=0;
  const rFarLP=ctx.createBiquadFilter(); rFarLP.type='lowpass'; rFarLP.frequency.value=4200;
  const rFarHP=ctx.createBiquadFilter(); rFarHP.type='highpass'; rFarHP.frequency.value=360;
  const n1=nsrc(true); n1.connect(rFarHP); rFarHP.connect(rFarLP); rFarLP.connect(rFarG);
  rFarG.connect(amb);
  const rFarS=ctx.createGain(); rFarS.gain.value=0.3; rFarG.connect(rFarS); rFarS.connect(revBus);
  n1.start();

  /* lluvia: repiqueteo cercano, con ondulación lenta */
  const rCloG=ctx.createGain(); rCloG.gain.value=0;
  const rCloBP=ctx.createBiquadFilter(); rCloBP.type='bandpass';
  rCloBP.frequency.value=3000; rCloBP.Q.value=0.6;
  const n2=nsrc(true); n2.connect(rCloBP); rCloBP.connect(rCloG); rCloG.connect(amb); n2.start();
  const rLfo=ctx.createOscillator(); rLfo.frequency.value=0.11;
  const rLfoG=ctx.createGain(); rLfoG.gain.value=0.022;
  rLfo.connect(rLfoG); rLfoG.connect(rCloG.gain); rLfo.start();

  /* lluvia sobre el techo y los vidrios: lo que se oye desde adentro */
  const roofG=ctx.createGain(); roofG.gain.value=0;
  const roofLP=ctx.createBiquadFilter(); roofLP.type='lowpass'; roofLP.frequency.value=1150;
  const roofHP=ctx.createBiquadFilter(); roofHP.type='highpass'; roofHP.frequency.value=170;
  const n3=nsrc(true); n3.connect(roofHP); roofHP.connect(roofLP); roofLP.connect(roofG);
  roofG.connect(amb);
  const roofS=ctx.createGain(); roofS.gain.value=0.35; roofG.connect(roofS); roofS.connect(revBus);
  n3.start();
  const roofLfo=ctx.createOscillator(); roofLfo.frequency.value=0.068;
  const roofLfoG=ctx.createGain(); roofLfoG.gain.value=0.016;
  roofLfo.connect(roofLfoG); roofLfoG.connect(roofG.gain); roofLfo.start();

  /* viento grave */
  const wLowG=ctx.createGain(); wLowG.gain.value=0.02;
  const wLP=ctx.createBiquadFilter(); wLP.type='lowpass'; wLP.frequency.value=250; wLP.Q.value=3.2;
  const n4=nsrc(true); n4.connect(wLP); wLP.connect(wLowG); wLowG.connect(amb); n4.start();
  const wLfo=ctx.createOscillator(); wLfo.frequency.value=0.052;
  const wLfoG=ctx.createGain(); wLfoG.gain.value=165;
  wLfo.connect(wLfoG); wLfoG.connect(wLP.frequency); wLfo.start();

  /* silbido del viento colándose por las ventanas rotas */
  const whG=ctx.createGain(); whG.gain.value=0;
  const whBP=ctx.createBiquadFilter(); whBP.type='bandpass'; whBP.frequency.value=880; whBP.Q.value=13;
  const n5=nsrc(true); n5.connect(whBP); whBP.connect(whG); whG.connect(amb);
  const whS=ctx.createGain(); whS.gain.value=0.55; whG.connect(whS); whS.connect(revBus);
  n5.start();
  const whL1=ctx.createOscillator(); whL1.frequency.value=0.041;
  const whL1G=ctx.createGain(); whL1G.gain.value=340;
  whL1.connect(whL1G); whL1G.connect(whBP.frequency); whL1.start();
  const whL2=ctx.createOscillator(); whL2.frequency.value=0.029;
  const whL2G=ctx.createGain(); whL2G.gain.value=0.010;
  whL2.connect(whL2G); whL2G.connect(whG.gain); whL2.start();

  /* colchón grave de tensión: casi inaudible, se nota al desaparecer */
  const drG=ctx.createGain(); drG.gain.value=0;
  const drLP=ctx.createBiquadFilter(); drLP.type='lowpass'; drLP.frequency.value=190;
  [43.6,58.3,87.2].forEach((f,i)=>{
    const o=ctx.createOscillator(); o.type=i===2?'triangle':'sine'; o.frequency.value=f;
    const g=ctx.createGain(); g.gain.value=i===2?0.22:0.5;
    o.connect(g); g.connect(drLP); o.start();
  });
  drLP.connect(drG); drG.connect(amb);

  /* ═══════════ eventos ═══════════ */
  function drip(p){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(R(720,1500),t());
    o.frequency.exponentialRampToValueAtTime(R(180,320),t()+0.12);
    env(g,0.004,R(0.035,0.075),0.19);
    o.connect(g); route(g,p===undefined?R(-0.7,0.7):p,0.6);
    o.start(); o.stop(t()+0.26);
  }
  /* crujido largo: la madera cediendo */
  function groan(scale,p){
    scale=scale||1;
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.Q.value=11;
    f.frequency.setValueAtTime(R(150,330),t());
    f.frequency.linearRampToValueAtTime(R(80,180),t()+R(0.7,1.7));
    o.type='sawtooth';
    o.frequency.setValueAtTime(R(44,86),t());
    o.frequency.linearRampToValueAtTime(R(32,62),t()+1.2);
    const d=R(0.9,2.0);
    env(g,0.3,R(0.030,0.070)*scale,d);
    o.connect(f); f.connect(g); route(g,p===undefined?R(-0.8,0.8):p,0.65);
    o.start(); o.stop(t()+d+0.5);
  }
  /* chasquido seco: una tabla que se parte en algún lado */
  function crack(p){
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=R(380,950); f.Q.value=2.4;
    env(g,0.002,R(0.045,0.085),0.09);
    s.connect(f); f.connect(g); route(g,p===undefined?R(-0.85,0.85):p,0.8);
    s.start(); s.stop(t()+0.2);
  }
  /* tablas del piso bajo el pie */
  function board(p,sp){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=R(220,420); f.Q.value=6;
    o.type='triangle';
    o.frequency.setValueAtTime(R(120,250),t());
    o.frequency.linearRampToValueAtTime(R(70,150),t()+0.28);
    env(g,0.03,R(0.012,0.026)*sp,0.28);
    o.connect(f); f.connect(g); route(g,p,0.3);
    o.start(); o.stop(t()+0.36);
  }

  /* ─── pasos, sincronizados por el bucle del juego ─── */
  let side=1;
  function step(surf,sp){
    sp=Math.max(0.3,Math.min(1,sp||1));
    side=-side;
    const p=side*0.11;
    /* impacto del talón */
    const o=ctx.createOscillator(), og=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(surf==='tile'?155:R(88,105),t());
    o.frequency.exponentialRampToValueAtTime(42,t()+0.09);
    env(og,0.006,0.048*sp,0.11);
    o.connect(og); route(og,p,surf==='grass'?0.15:0.4);
    o.start(); o.stop(t()+0.22);
    /* roce de la suela, distinto según la superficie */
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    if(surf==='conc'){ f.type='bandpass'; f.frequency.value=R(1700,2500); f.Q.value=1.1;
      env(g,0.004,0.040*sp,0.08); }
    else if(surf==='tile'){ f.type='bandpass'; f.frequency.value=R(2500,3700); f.Q.value=1.7;
      env(g,0.003,0.034*sp,0.07); }
    else if(surf==='grass'){ f.type='lowpass'; f.frequency.value=1300;
      env(g,0.02,0.030*sp,0.20); }
    else { f.type='bandpass'; f.frequency.value=R(850,1500); f.Q.value=1.3;
      env(g,0.005,0.036*sp,0.11); }
    s.connect(f); f.connect(g);
    route(g,p, surf==='grass'?0.1:(surf==='conc'?0.7:0.35));
    s.start(); s.stop(t()+0.4);
    /* la madera protesta cada tanto */
    if(surf==='wood'&&Math.random()<0.26) later(()=>board(p,sp),R(30,95));
    if(surf==='conc'&&Math.random()<0.10) later(()=>drip(p*2),R(200,600));
  }

  /* ─── banco de sonidos ambientales lejanos ─── */
  function farThud(){            // un golpe apagado en otra habitación
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=R(150,280);
    env(g,0.01,R(0.05,0.10),R(0.3,0.6));
    s.connect(f); f.connect(g); route(g,R(-0.9,0.9),0.9);
    s.start(); s.stop(t()+1);
  }
  function doorGroan(){          // una puerta girando sola sobre sus bisagras
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.Q.value=18;
    const d=R(1.4,2.6);
    f.frequency.setValueAtTime(R(400,700),t());
    f.frequency.linearRampToValueAtTime(R(700,1300),t()+d*0.7);
    o.type='sawtooth';
    o.frequency.setValueAtTime(R(90,140),t());
    o.frequency.linearRampToValueAtTime(R(130,190),t()+d);
    env(g,0.4,R(0.020,0.040),d);
    o.connect(f); f.connect(g); route(g,R(-0.9,0.9),0.85);
    o.start(); o.stop(t()+d+0.6);
  }
  function scratch(){            // algo pequeño moviéndose entre las paredes
    const n=Math.floor(R(4,9)), p=R(-0.9,0.9);
    for(let i=0;i<n;i++) later(()=>{
      const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
      f.type='highpass'; f.frequency.value=R(2600,4800);
      env(g,0.002,R(0.012,0.030),R(0.02,0.06));
      s.connect(f); f.connect(g); route(g,p,0.4);
      s.start(); s.stop(t()+0.12);
    }, i*R(35,110));
  }
  function tinkle(){             // vidrio suelto vibrando
    const p=R(-0.8,0.8), n=Math.floor(R(3,6));
    for(let i=0;i<n;i++) later(()=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='triangle'; o.frequency.value=R(1800,3600);
      env(g,0.003,R(0.010,0.022),R(0.08,0.2));
      o.connect(g); route(g,p,0.8); o.start(); o.stop(t()+0.35);
    }, i*R(45,130));
  }
  function rustle(){             // tela o papel movido por una corriente de aire
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.setValueAtTime(R(900,1600),t());
    f.frequency.linearRampToValueAtTime(R(500,1100),t()+1.1); f.Q.value=1.4;
    env(g,0.25,R(0.014,0.030),1.1);
    s.connect(f); f.connect(g); route(g,R(-0.8,0.8),0.6);
    s.start(); s.stop(t()+1.6);
  }
  function houseSettle(){        // la estructura entera acomodándose
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=R(90,160);
    o.type='sine'; o.frequency.setValueAtTime(R(38,54),t());
    o.frequency.linearRampToValueAtTime(R(28,40),t()+2.4);
    env(g,0.8,R(0.05,0.09),2.2);
    o.connect(f); f.connect(g); route(g,R(-0.4,0.4),0.7);
    o.start(); o.stop(t()+3.4);
    later(()=>groan(0.7),R(400,1400));
  }
  function stepsAbove(){         // pasos apagados en otro piso: raro, y por eso funciona
    const n=Math.floor(R(3,6)), p=R(-0.6,0.6);
    for(let i=0;i<n;i++) later(()=>{
      const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
      f.type='lowpass'; f.frequency.value=R(170,300);
      env(g,0.008,R(0.030,0.055),0.22);
      s.connect(f); f.connect(g); route(g,p,1.0);
      s.start(); s.stop(t()+0.5);
    }, i*R(480,760));
  }
  function farDrip(){ for(let i=0;i<3;i++) later(()=>drip(R(-0.9,0.9)),i*R(500,1200)); }

  const POOL=[
    {f:groan,      w:16},
    {f:crack,      w:8},
    {f:farThud,    w:9},
    {f:doorGroan,  w:8},
    {f:scratch,    w:9},
    {f:tinkle,     w:7},
    {f:rustle,     w:10},
    {f:houseSettle,w:7},
    {f:farDrip,    w:9},
    {f:stepsAbove, w:3}
  ];
  const TOTW=POOL.reduce((a,b)=>a+b.w,0);
  let lastEvent=null;
  /* los setTimeout encadenados corrían siempre: en pausa, en el menú y de fondo */
  const idle=()=>paused||ending;
  function ambientEvent(){
    if(idle()){ later(ambientEvent,3000); return; }
    let pick=null;
    for(let tries=0;tries<4;tries++){
      let r=Math.random()*TOTW;
      for(const e of POOL){ r-=e.w; if(r<=0){ pick=e; break; } }
      if(pick&&pick!==lastEvent) break;
    }
    if(pick){ lastEvent=pick; pick.f(); }
    const gap=Math.max(4.5, R(9,24)-tension*4);
    later(ambientEvent, gap*1000);
  }

  /* ─── goteo constante, más denso que los eventos ─── */
  function dripLoop(){ if(!idle()) drip(); later(dripLoop, R(1400,5600)); }

  /* ─── ráfagas de viento ─── */
  let gustTarget=1, gustCur=1;
  function gust(){
    if(idle()){ later(gust,4000); return; }
    const d=R(3.5,8);
    gustTarget=R(1.9,3.3);
    later(()=>gustTarget=1, d*550);
    if(Math.random()<0.45) later(()=>groan(0.75), d*380);
    later(gust,(d+R(6,17))*1000);
  }

  /* ═══════════ TRUENOS ═══════════
     LO QUE HABIA ERA UN SOLO SOPLIDO. Un `nsrc` pasado por un pasabajos que
     barria de 190 a 46 Hz, con ATAQUE DE 0,20 A 0,36 s: eso no es un trueno, es
     un whoosh — el ataque de un chasquido son cinco milisegundos. Y era el mismo
     sonido siempre, sin sitio y sin distancia.

     UN TRUENO SON DOS COSAS Y LA DISTANCIA DECIDE CUAL SE OYE:
     · EL CHASQUIDO es el tramo del canal que uno tiene mas cerca: banda ancha,
       ataque de 4 ms, doscientos milisegundos. Se lo come el aire, que absorbe
       los agudos con la distancia — por eso un trueno lejano es SOLO retumbo, y
       eso no es una eleccion de mezcla sino la razon fisica de que suene asi.
     · EL RETUMBO es el resto del canal llegando a destiempo, mas los rebotes
       del suelo y de las nubes. Van de tres a seis rafagas repartidas en hasta
       cuatro segundos, cada una un poco mas abajo y mas floja: eso es lo que
       hace que RUEDE en vez de soplar. Con una sola rafaga no rueda.

     Y EL CORTE DEL PASABAJOS SALE DE LA DISTANCIA, no de un sorteo: 300 Hz
     encima, 55 a cuatro kilometros. */
  function trueno(dist,az,yaw){
    if(idle()) return;
    const d=Math.max(120,Math.min(4200,dist||1200));
    const espera=d/343;                       // el retardo, que es todo el punto
    /* EL NIVEL NO CAE CON 1/d NI CON 1/d^2. Con 1/(1+d/700) un rayo a 2,6 km
       quedaba POR DEBAJO del manto de lluvia —medido, 0,025 de rms contra 0,023
       de fondo— o sea que se veia el destello y no llegaba nada, que es peor que
       el defecto que esta vuelta arregla. Un trueno lejano se oye de sobra: lo
       que pierde con la distancia son los agudos, no el cuerpo. */
    const nivel=1.0/(1.0+d/2200);             // 300 m -> 0,88 · 3800 m -> 0,37
    /* el aire se come los agudos: a 1,4 km ya no queda chasquido */
    const filo=Math.pow(Math.max(0,1-d/1400),1.6);
    /* EL CORTE ERA DEMASIADO BAJO Y AHI SE PERDIA EL TRUENO LEJANO. Con
       55+245*(1-d/4200), a 2,6 km el pasabajos quedaba en 148 Hz: eso deja pasar
       el 0,7% de la banda y el retumbo se hundia bajo la lluvia —medido en la
       banda baja, x1,9 sobre el fondo, o sea nada—. El aire se come lo de arriba
       de un kilohercio; de 200 a 500 Hz sobrevive casi todo, y ese es el cuerpo
       del retumbo. */
    const fc=120+480*Math.max(0,1-d/5000);
    /* de que lado suena, respecto de donde mira el jugador */
    const pan=Math.max(-1,Math.min(1,Math.sin(az-(yaw||0))*0.85));

    const T0=t()+espera;
    /* ── el chasquido ── */
    if(filo>0.02){
      const s=nsrc(false), g=ctx.createGain(), bp=ctx.createBiquadFilter();
      bp.type='bandpass'; bp.Q.value=0.7;
      bp.frequency.setValueAtTime(2100,T0);
      bp.frequency.exponentialRampToValueAtTime(520,T0+0.22);
      g.gain.setValueAtTime(0.0001,T0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,0.62*nivel*filo),T0+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,T0+0.30);
      s.connect(bp); bp.connect(g);
      const p=panner(pan); if(p){ g.connect(p); p.connect(comp); } else g.connect(comp);
      const sd=ctx.createGain(); sd.gain.value=0.55; g.connect(sd); sd.connect(revBus);
      s.start(T0); s.stop(T0+0.5);
      /* SUB QUE SE SIENTE, solo cerca: un chasquido cercano no se oye, golpea.
         Es el mismo recurso que ya usa el sacudon del final. */
      if(filo>0.35){
        const o=ctx.createOscillator(), og=ctx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(58,T0); o.frequency.exponentialRampToValueAtTime(26,T0+0.55);
        og.gain.setValueAtTime(0.0001,T0);
        og.gain.exponentialRampToValueAtTime(0.42*filo,T0+0.012);
        og.gain.exponentialRampToValueAtTime(0.0001,T0+0.70);
        o.connect(og); og.connect(comp); o.start(T0); o.stop(T0+0.8);
      }
    }
    /* ── el retumbo, en rafagas ── */
    const raf=3+Math.floor(Math.random()*4);
    let off=filo>0.35?0.05:R(0,0.5);
    for(let i=0;i<raf;i++){
      const s=nsrc(false), g=ctx.createGain(), lp=ctx.createBiquadFilter();
      lp.type='lowpass'; lp.Q.value=0.9;
      const f0=fc*R(0.85,1.5)*(1-i*0.10);
      lp.frequency.setValueAtTime(Math.max(40,f0),T0+off);
      lp.frequency.linearRampToValueAtTime(Math.max(34,f0*0.55),T0+off+1.6);
      const atk=R(0.03,0.14)+i*0.02, dec=R(0.7,1.9)+i*0.18;
      const amp=0.58*nivel*Math.pow(0.78,i)*R(0.7,1.25);
      g.gain.setValueAtTime(0.0001,T0+off);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,amp),T0+off+atk);
      g.gain.exponentialRampToValueAtTime(0.0001,T0+off+atk+dec);
      s.connect(lp); lp.connect(g);
      const p=panner(pan*R(0.4,1.0)); if(p){ g.connect(p); p.connect(comp); } else g.connect(comp);
      const sd=ctx.createGain(); sd.gain.value=0.62; g.connect(sd); sd.connect(revBus);
      s.start(T0+off); s.stop(T0+off+atk+dec+0.3);
      off+=R(0.28,0.95);
    }
    /* LA LLUVIA SE AGACHA Y DESPUES CRECE, y solo con un rayo cerca. Sin la
       agachada el trueno pelea contra el manto de lluvia y pierde; sin el
       crecimiento posterior el cielo no reacciona a nada. */
    if(filo>0.3){
      const k=0.55+0.45*(1-filo);
      amb.gain.cancelScheduledValues(T0);
      amb.gain.setValueAtTime(amb.gain.value,T0);
      amb.gain.linearRampToValueAtTime(k,T0+0.10);
      amb.gain.linearRampToValueAtTime(1.14,T0+1.9);
      amb.gain.linearRampToValueAtTime(1.0,T0+7.0);
    }
  }

  /* ─── silencios y latido ─── */
  let quiet=false, beat=null;
  function heart(){
    if(!quiet) return;
    const thump=(off,amp)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(60,t()+off);
      o.frequency.exponentialRampToValueAtTime(37,t()+off+0.16);
      g.gain.setValueAtTime(0.0001,t()+off);
      g.gain.exponentialRampToValueAtTime(amp,t()+off+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t()+off+0.3);
      o.connect(g); g.connect(master);
      o.start(t()+off); o.stop(t()+off+0.34);
    };
    thump(0,0.075); thump(0.26,0.045);
    beat=later(heart,1180);
  }
  function silence(){
    if(idle()){ later(silence,15000); return; }
    quiet=true;
    amb.gain.cancelScheduledValues(t());
    amb.gain.linearRampToValueAtTime(0.09,t()+1.9);
    later(heart,1000);
    const hold=R(5,9);
    later(()=>{
      quiet=false; if(beat) clearTimeout(beat);
      amb.gain.linearRampToValueAtTime(1,ctx.currentTime+2.4);
      if(Math.random()<0.5) later(()=>groan(1.1),R(300,900));   // la casa vuelve a respirar
    }, hold*1000);
    later(silence,(hold+R(38,75))*1000);
  }

  later(dripLoop,2200); later(ambientEvent,6000); later(gust,3000);
  later(silence,45000);
  /* LOS TRUENOS YA NO SE AGENDAN ACA. La cadencia vive en tormentaPaso(), que
     corre en el bucle: puesta aca, sin permiso de audio no caia un solo rayo. */

  /* ─── mezcla según dónde esté el jugador ─── */
  let tension=0, dread=0, ending=false;
  function update(dt,e){
    const k=Math.min(dt*1.6,1);
    const deep=e.deep, inside=e.inside;
    const rf = deep?0.028 : inside?0.052 : 0.185;
    const rc = deep?0.003 : inside?0.020 : 0.100;
    const rr = deep?0.010 : inside?0.070 : 0.020;
    const lp = deep?720   : inside?2050  : 5200;
    rFarG.gain.value += (rf-rFarG.gain.value)*k;
    rCloG.gain.value += (rc-rCloG.gain.value)*k;
    roofG.gain.value += (rr-roofG.gain.value)*k;
    rFarLP.frequency.value += (lp-rFarLP.frequency.value)*k;

    gustCur += (gustTarget-gustCur)*Math.min(dt*0.9,1);
    const wt=(deep?0.011:inside?0.024:0.070)*gustCur;
    wLowG.gain.value += (wt-wLowG.gain.value)*k;
    const wh=(deep?0.0015:inside?0.014:0.007)*gustCur;
    whG.gain.value += (wh-whG.gain.value)*k;

    revBus.gain.value += ((deep?0.9:inside?0.45:0.10)-revBus.gain.value)*k;

    const tt=Math.min(1,(deep?0.8:inside?0.35:0.05)+(e.torchOff?0.3:0)+dread*0.55);
    tension += (tt-tension)*Math.min(dt*0.22,1);
    drG.gain.value += ((0.005+tension*0.026+dread*0.020)-drG.gain.value)*k;
  }

  /* ─── sonidos de interacción ─── */
  function clickSw(){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=R(1500,2500); f.Q.value=3.2;
    o.type='square'; o.frequency.value=R(850,1350);
    env(g,0.0012,0.055,0.035);
    o.connect(f); f.connect(g); route(g,0,0.4);
    o.start(); o.stop(t()+0.07);
  }
  function doorMove(p){
    groan(0.5,p==null?R(-0.25,0.25):p);
    later(()=>{
      const s2=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
      f.type='lowpass'; f.frequency.value=R(280,560);
      env(g,0.005,0.035,0.13);
      s2.connect(f); f.connect(g); route(g,0,0.5);
      s2.start(); s2.stop(t()+0.28);
    }, R(550,950));
  }
  function handle(){
    const s2=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=R(1200,2200); f.Q.value=1.6;
    env(g,0.01,0.022,0.22);
    s2.connect(f); f.connect(g); route(g,0,0.35);
    s2.start(); s2.stop(t()+0.4);
  }

  function impactFall(p,str){
    str=str==null?1:str;
    const s2=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=R(220,420);
    env(g,0.004,R(0.05,0.085)*str,R(0.18,0.34));
    s2.connect(f); f.connect(g); route(g,p||0,0.8);
    s2.start(); s2.stop(t()+0.5);
    const n=Math.floor(R(2,5));                       // rebotes / rodada
    for(let i=0;i<n;i++) later(()=>{
      const s3=nsrc(false), g2=ctx.createGain(), f2=ctx.createBiquadFilter();
      f2.type='bandpass'; f2.frequency.value=R(800,2400); f2.Q.value=2;
      env(g2,0.002,R(0.008,0.022)*str,R(0.03,0.08));
      s3.connect(f2); f2.connect(g2); route(g2,p||0,0.7);
      s3.start(); s3.stop(t()+0.15);
    }, 90+i*R(70,190));
  }
  function slam(p,str){
    str=str==null?1:str;
    const s2=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=R(320,620); f.Q.value=1.1;
    env(g,0.002,R(0.09,0.15)*str,0.16);
    s2.connect(f); f.connect(g); route(g,p||0,0.85);
    s2.start(); s2.stop(t()+0.3);
    const o=ctx.createOscillator(), og=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(R(90,140),t());
    o.frequency.exponentialRampToValueAtTime(45,t()+0.12);
    env(og,0.004,0.07*str,0.2);
    o.connect(og); route(og,p||0,0.6); o.start(); o.stop(t()+0.4);
  }
  function roomNoise(p){
    const pool=[()=>farThud(),()=>scratch(),()=>tinkle(),()=>rustle(),()=>groan(0.8,p)];
    pool[Math.floor(Math.random()*pool.length)]();
    if(Math.random()<0.35) later(()=>impactFall(p,0.5),R(400,1100));
  }

  /* golpe seco y grave: va directo al compresor para que se oiga sobre el silencio */
  function bigHit(){
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='lowpass';
    f.frequency.setValueAtTime(250,t()); f.frequency.linearRampToValueAtTime(58,t()+1.6);
    env(g,0.004,0.30,1.7);
    s.connect(f); f.connect(g); g.connect(comp);
    const sd=ctx.createGain(); sd.gain.value=0.6; g.connect(sd); sd.connect(revBus);
    s.start(); s.stop(t()+2.4);
    const o=ctx.createOscillator(), og=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(70,t()); o.frequency.exponentialRampToValueAtTime(26,t()+1.2);
    env(og,0.006,0.20,1.4);
    o.connect(og); og.connect(comp); o.start(); o.stop(t()+1.9);
  }
  function hush(){
    ending=true; quiet=false; if(beat) clearTimeout(beat);
    amb.gain.cancelScheduledValues(t());
    amb.gain.linearRampToValueAtTime(0.03,t()+1.5);
  }
  function unhush(){
    ending=false; dread=0;
    amb.gain.cancelScheduledValues(t());
    amb.gain.linearRampToValueAtTime(1,t()+1.0);
  }

  /* ── el susto: va directo al compresor para que corte por encima del ambiente ── */
  function gaspSound(){
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime(R(500,720),t());
    f.frequency.linearRampToValueAtTime(R(1150,1550),t()+0.15);
    env(g,0.028,0.10,0.30);
    s.connect(f); f.connect(g); g.connect(comp);
    const sd=ctx.createGain(); sd.gain.value=0.35; g.connect(sd); sd.connect(revBus);
    s.start(); s.stop(t()+0.6);
  }
  function scareHit(){
    /* golpe agudo */
    const s=nsrc(false), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='highpass'; f.frequency.value=1700;
    env(g,0.002,0.32,0.55);
    s.connect(f); f.connect(g); g.connect(comp);
    const sd=ctx.createGain(); sd.gain.value=0.55; g.connect(sd); sd.connect(revBus);
    s.start(); s.stop(t()+0.9);
    /* chirrido que se desploma */
    const o=ctx.createOscillator(), og=ctx.createGain(), of=ctx.createBiquadFilter();
    of.type='bandpass'; of.Q.value=5.5;
    of.frequency.setValueAtTime(2700,t()); of.frequency.exponentialRampToValueAtTime(300,t()+0.7);
    o.type='sawtooth';
    o.frequency.setValueAtTime(900,t()); o.frequency.exponentialRampToValueAtTime(105,t()+0.7);
    env(og,0.004,0.17,0.72);
    o.connect(of); of.connect(og); og.connect(comp);
    o.start(); o.stop(t()+1.1);
    /* sub que sacude */
    const b=ctx.createOscillator(), bg=ctx.createGain();
    b.type='sine';
    b.frequency.setValueAtTime(92,t()); b.frequency.exponentialRampToValueAtTime(29,t()+0.9);
    env(bg,0.006,0.26,1.1);
    b.connect(bg); bg.connect(comp); b.start(); b.stop(t()+1.5);
    /* el jugador toma aire, y después el corazón */
    later(gaspSound,R(240,400));
    for(let i=0;i<7;i++) later(()=>{
      const h=ctx.createOscillator(), hg=ctx.createGain();
      h.type='sine';
      h.frequency.setValueAtTime(62,t()); h.frequency.exponentialRampToValueAtTime(35,t()+0.15);
      env(hg,0.004,0.085-i*0.008,0.30);
      h.connect(hg); hg.connect(comp); h.start(); h.stop(t()+0.36);
    }, 620+i*(430+i*38));
  }

  let vol=0.85, paused=false;
  function applyVol(){
    master.gain.cancelScheduledValues(t());
    master.gain.linearRampToValueAtTime(Math.max(0.0001,vol*(paused?0.12:1)),t()+0.25);
  }
  A={ctx,step,update,isQuiet:()=>quiet,door:doorMove,click:clickSw,handle,trueno,nivel,
     fall:impactFall,bang:slam,roomNoise,hush,hit:bigHit,reset:unhush,scare:scareHit,
     setDread:v=>{dread=v;},
     setVolume:v=>{vol=v;applyVol();},
     setPaused:p=>{paused=p;applyVol();}};
  if(ctx.state==='suspended') ctx.resume();
}

const flashEl=document.getElementById('flash');
let lightBoost=0;

/* ══════════════════════════ LA TORMENTA ══════════════════════════
   ANTES ERAN DOS EFECTOS PEGADOS Y NO UN FENÓMENO. `thunder()` disparaba el
   ruido y en la misma linea llamaba a `lightning()`: destello y trueno en el
   MISMO instante. La luz viaja al toque y el sonido a 343 m/s, asi que un rayo
   a un kilometro se ve tres segundos antes de oirse — y ese retardo es lo unico
   que convierte un fogonazo y un ruido en una tormenta. La leccion ya estaba
   escrita en este repo desde BARRIO y este juego no la aplicaba.

   AHORA HAY UN SOLO RELOJ Y EL RAYO TIENE SITIO. Cada rayo se sortea con una
   DISTANCIA y un AZIMUT, y de la distancia salen las cuatro cosas que la
   distancia decide de verdad:
     · cuanto tarda el trueno            → d / 343
     · si hay chasquido o solo retumbo   → el aire se come los agudos
     · cuanto suena                      → 1/(1+d/700)
     · y cuanto ilumina
   Con eso un rayo cerca es un latigazo y uno lejos es un rumor del otro lado
   del campo, sin que haya dos listas de sonidos.

   Y EL DESTELLO ES UNA FUNCIÓN DEL TIEMPO, EVALUADA EN EL BUCLE. La version
   anterior eran cinco `setTimeout` anidados con otro `setTimeout` de 70 ms
   adentro de cada uno: eso corre fuera del reloj del cuadro, asi que en un
   telefono lento el destello puede caer ENTERO entre dos cuadros y no verse, y
   en uno rapido es un escalon cuadrado que se prende y se apaga. Un relampago
   real sube en menos de un milisegundo y decae exponencialmente en decenas: eso
   es una suma de exponenciales, y una suma de exponenciales se puede evaluar en
   cualquier instante.

   Y LA TORMENTA EXISTE AUNQUE NO HAYA AUDIO. La cadencia estaba adentro de
   `initAudio()`, o sea que sin permiso de sonido no caia un solo rayo. Ahora el
   reloj vive aca y el audio es un consumidor: `A.trueno(d,az)` si esta. */
const TORM={
  t:0, prox:5.5,
  nucleo:1500,        // a que distancia esta el nucleo de la tormenta, en metros
  deriva:-1,          // se acerca (-1) o se va (+1)
  golpes:[],          // los sub-destellos vivos de los rayos recientes
  flash:0, az:0, ult:0, n:0, fijo:null   // `fijo` es para las sondas: clava el destello
};
const TORM_MIN=140, TORM_MAX=3800;
const SH_BASE=0.048;                    // la ganancia de fabrica del haz del techo
/* CUANTO MULTIPLICA UN RELAMPAGO LA GANANCIA DEL HAZ. Barrido a destello 0,85
   —o sea un rayo a 150 m, el peor caso— con la linterna apagada:
     8,5 -> el haz es un borron blanco solido: se pierden las tablas de adentro
            y la columna deja de tener forma
     5,0 -> sigue muy quemado, las tablas recien se adivinan
     3,0 -> blanco casi puro PERO con las tablas en silueta adentro, el papel de
            la pared y el cuadro colgado legibles, y la columna con canto
     1,6 -> se lee todo y el haz no estalla: es un cuarto claro, no un fogonazo
   Queda en 3,0: un relampago tiene que quemar el haz sin borrarlo. */
let SH_RAYO=3.0;
const _cieloBase=new THREE.Color(0x3a4a68), _BLANCO=new THREE.Color(0xe8eeff);
let _flashDom=-1;

/* un rayo: distancia en metros y azimut en radianes. Sin argumentos se sortea
   uno acorde al nucleo de la tormenta. */
function lightning(dist,az){
  const d=(dist===undefined)
    ? Math.max(TORM_MIN,Math.min(TORM_MAX, TORM.nucleo*rnd(0.55,1.6)))
    : Math.max(TORM_MIN,Math.min(TORM_MAX,dist));
  const a=(az===undefined)? Math.random()*6.2832 : az;
  TORM.az=a; TORM.ult=d; TORM.n++;

  /* CUANTO ILUMINA: la caida no es 1/d^2 sino mucho mas floja, porque el rayo
     no es un punto sino un canal de kilometros y lo que llega al cuarto es la
     mitad del cielo encendida. Con 1/d^2 un rayo a 2 km no se veria. */
  const pot=1.0/(1.0+d/1100);

  /* DE UNO A CINCO GOLPES DE RETORNO, que es lo que hace que un relampago
     titile en vez de encenderse una vez. Separados 40-130 ms, cada uno con su
     propia caida: los cortos son los que se leen a chispazo. */
  /* CON `rnd*rnd*5` EL 64% DE LOS RAYOS SALIA DE UN SOLO GOLPE, y un golpe solo
     no titila: se enciende y se apaga, que es lo que hacia la version anterior.
     Con `rnd^1.7` el 38% queda simple y el 62% parpadea, que es la proporcion
     que tiene un relampago de verdad. */
  const golpes=1+Math.floor(Math.pow(Math.random(),1.7)*4.99);
  let off=0;
  for(let i=0;i<golpes;i++){
    TORM.golpes.push({t0:TORM.t+off, amp:pot*rnd(0.55,1.0)*(i?rnd(0.35,0.9):1),
                      tau:rnd(0.022,0.085)});
    off+=rnd(0.040,0.130);
  }
  /* y un resplandor largo y debil: el canal tarda en apagarse */
  TORM.golpes.push({t0:TORM.t, amp:pot*0.20, tau:rnd(0.18,0.34)});

  if(A&&A.trueno) A.trueno(d,a,P.yaw);
  return {dist:+d.toFixed(0), az:+a.toFixed(3), golpes:golpes+1};
}

function tormentaPaso(dt){
  TORM.t+=dt;
  /* el nucleo se mueve: una tormenta que tira rayos siempre a la misma
     distancia es un metronomo, no un clima */
  TORM.nucleo+=TORM.deriva*dt*rnd(6,26);
  if(TORM.nucleo<TORM_MIN*1.5){ TORM.nucleo=TORM_MIN*1.5; TORM.deriva=1; }
  if(TORM.nucleo>TORM_MAX*0.85){ TORM.nucleo=TORM_MAX*0.85; TORM.deriva=-1; }

  if(state==='play'&&!fin){
    TORM.prox-=dt;
    if(TORM.prox<=0){
      lightning();
      /* mas cerca el nucleo, mas seguido cae: de 7-22 s encima a 20-58 s lejos */
      const k=(TORM.nucleo-TORM_MIN)/(TORM_MAX-TORM_MIN);
      TORM.prox=rnd(7+k*13, 22+k*36);
    }
  }

  /* EL DESTELLO: suma de exponenciales con una subida de 4 ms. La subida no es
     un detalle de gusto: sin ella el primer cuadro del rayo salta de 0 al pico
     y eso, en un juego que dibuja con cinta VHS encima, se lee a error de
     compresion y no a luz. */
  let f=0;
  for(let i=TORM.golpes.length-1;i>=0;i--){
    const g=TORM.golpes[i], x=TORM.t-g.t0;
    if(x<0) continue;
    if(x>g.tau*7){ TORM.golpes.splice(i,1); continue; }
    f+=g.amp*Math.min(1,x/0.004)*Math.exp(-x/g.tau);
  }
  TORM.flash=(TORM.fijo===null)?Math.min(2.6,f):TORM.fijo;
  lightBoost=TORM.flash*1.35;          // lo que ya consumian la luna y el relleno

  /* LA DIRECCIONAL DEL RAYO, en el azimut del ultimo */
  const el=0.62;                        // 35 grados de elevacion
  rayoLuz.position.set(Math.sin(TORM.az)*Math.cos(el)*60, Math.sin(el)*60,
                       Math.cos(TORM.az)*Math.cos(el)*60);
  rayoLuz.intensity=TORM.flash*5.2;

  /* LOS HACES DEL TECHO SON LO QUE MAS LO CUENTA: son las tres columnas por
     donde el cuarto ve el cielo, asi que un fogonazo afuera tiene que hacerlas
     estallar. La ganancia se multiplica sobre la de fabrica, no se reemplaza. */
  shaftMat.uniforms.uA.value=SH_BASE*(1+TORM.flash*SH_RAYO);
  const cf=Math.min(1,TORM.flash*0.85);
  for(const c of _cielos) c.material.color.copy(_cieloBase).lerp(_BLANCO,cf);

  /* y el velo en el OJO, que va despues del post: es lo unico que puede pasar
     de blanco, porque una pantalla no tiene mas rango. Va con la misma curva
     que la luz, no con un escalon de 0,26. */
  const o=Math.min(0.30,TORM.flash*0.19);
  if(Math.abs(o-_flashDom)>0.004){ flashEl.style.opacity=o.toFixed(3); _flashDom=o; }
}

  torchBtn.textContent=torchOn?TX('linterna'):TX('apagada');}

function begin(){
  if(started) return;
  started=true; initAudio();
  setTimeout(()=>{hint.style.opacity=0;},7000);
}
function hitEl(el,cx,cy){const r=el.getBoundingClientRect();
  return cx>=r.left-10&&cx<=r.right+10&&cy>=r.top-10&&cy<=r.bottom+10;}

addEventListener('touchstart',e=>{
  if(state!=='play') return;
  if(fin){ e.preventDefault(); return; }
  if(reading){
    for(const t of e.changedTouches){
      if(hitEl(useBtn,t.clientX,t.clientY)){ closePaper(); e.preventDefault(); return; }
      if(lookId===null){ lookId=t.identifier; lookPrev={x:t.clientX,y:t.clientY}; }
    }
    e.preventDefault(); return;
  }
  for(const t of e.changedTouches){
    if(hitEl(pauseBtn,t.clientX,t.clientY)){setState('paused');continue;}
    if(hitEl(torchBtn,t.clientX,t.clientY)){toggleTorch();continue;}
    if(useBtn.classList.contains('show')&&hitEl(useBtn,t.clientX,t.clientY)){doUse();continue;}
    const p=toLocal(t.clientX,t.clientY);
    /* el joystick sólo toma el primer dedo de la izquierda: el resto mira */
    if(p.x<VW*0.5&&moveId===null){
      moveId=t.identifier; origin=p;
      stickBase.style.left=p.x+'px'; stickBase.style.top=p.y+'px';
      stickKnob.style.left=p.x+'px'; stickKnob.style.top=p.y+'px';
      stickBase.classList.add('on'); stickKnob.classList.add('on');
    }else if(lookId===null){lookId=t.identifier;lookPrev={x:t.clientX,y:t.clientY};}
  }
  e.preventDefault();
},{passive:false});
addEventListener('touchmove',e=>{
  if(state!=='play') return;
  if(reading){
    for(const t of e.changedTouches) if(t.identifier===lookId){
      const d=dLocal(t.clientX-lookPrev.x,t.clientY-lookPrev.y);
      paperRY+=d.x*0.0095;
      paperRX=Math.max(-1.5,Math.min(1.5,paperRX+d.y*0.0095));
      lookPrev={x:t.clientX,y:t.clientY};
    }
    e.preventDefault(); return;
  }
  for(const t of e.changedTouches){
    if(t.identifier===moveId){
      const p=toLocal(t.clientX,t.clientY);
      let dx=p.x-origin.x,dy=p.y-origin.y,d=Math.hypot(dx,dy);
      if(d>MAXS){dx=dx/d*MAXS;dy=dy/d*MAXS;}
      stickKnob.style.left=(origin.x+dx)+'px'; stickKnob.style.top=(origin.y+dy)+'px';
      move.x=dx/MAXS; move.y=dy/MAXS;
    }else if(t.identifier===lookId){
      const d=dLocal(t.clientX-lookPrev.x,t.clientY-lookPrev.y);
      P.yaw-=d.x*SENS; P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-d.y*SENS));
      P.yawVel+=-d.x*SENS; lookPrev={x:t.clientX,y:t.clientY};
    }
  }
  e.preventDefault();
},{passive:false});
function endT(e){for(const t of e.changedTouches){
  if(t.identifier===moveId){moveId=null;move.x=move.y=0;
    stickBase.classList.remove('on');stickKnob.classList.remove('on');}
  if(t.identifier===lookId)lookId=null;}}
addEventListener('touchend',endT,{passive:false});
addEventListener('touchcancel',endT,{passive:false});

});

/* ══════════ jugador ══════════ */
/* aparece en la entrada, de cara al pasillo (hacia -Z) */
const P={x:-0.65,z:5.25,y:0,level:0,yaw:0,pitch:0,
  vx:0,vz:0,bob:0,bobY:0,bobX:0,breath:0,roll:0,lean:0,yawVel:0,fov:HFOV,sprint:0,stepPh:0,panic:0};
const R=0.32, EYE=1.66;
const WALK=1.15, RUN=2.0;          // marcha lenta: tensión

function resolve(){
  const feet=P.y, head=P.y+1.62;
  for(let it=0;it<2;it++){
    for(const c of COL){
      if(c.y1<=feet+0.32||c.y0>=head)continue;
      const cx=Math.max(c.x0,Math.min(P.x,c.x1)), cz=Math.max(c.z0,Math.min(P.z,c.z1));
      const dx=P.x-cx, dz=P.z-cz, d2=dx*dx+dz*dz;
      if(d2>R*R)continue;
      if(d2>1e-6){const d=Math.sqrt(d2);P.x=cx+dx/d*R;P.z=cz+dz/d*R;}
      else{const px=Math.min(P.x-c.x0,c.x1-P.x),pz=Math.min(P.z-c.z0,c.z1-P.z);
        if(px<pz)P.x+=(P.x-(c.x0+c.x1)/2)>0?px+R:-(px+R);
        else P.z+=(P.z-(c.z0+c.z1)/2)>0?pz+R:-(pz+R);}
    }
  }
  P.x=Math.max(-13.6,Math.min(13.6,P.x)); P.z=Math.max(-13.6,Math.min(13.6,P.z));
}
function roomName(){
  const x=P.x,z=P.z;
  if(P.y<-1.2)return'sotano';
  if(!inHouse(x,z))return'patio';
  if(x>-1.8&&x<1.8)return z>3.8?'entradaC':'pasillo';
  if(x<=-1.8)return z>1.2?'sala':(z>-2.6?'cocina':'trastero');
  return z>2.2?'dormitorio':(z>-0.2?'bano':'dormitorio');
}

const clock=new THREE.Clock();
const tDir=new V3(), tPos=new V3(), tAim=new V3(0,1.5,-1);
/* preasignados: antes se creaban Vector3/Quaternion/Euler nuevos en cada frame */
const _aim=new V3(), _tp=new V3();
const _eu=new THREE.Euler(0,0,0,'YXZ'), _q=new THREE.Quaternion(), _q2=new THREE.Quaternion();
let lastRoom='', flickT=0;

function tick(){
  requestAnimationFrame(tick);
  const raw=Math.min(clock.getDelta(),0.05), T=clock.elapsedTime;
  const dt=(state==='paused')?0:raw;

  /* ─ entrada: adelante = adelante ─ */
  let ix=move.x, iz=move.y;                 // iz<0 → adelante
  if(state!=='play'||reading||fin){ ix=0; iz=0; }
  if(keys.KeyW||keys.ArrowUp)iz-=1;
  if(keys.KeyS||keys.ArrowDown)iz+=1;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  let mag=Math.hypot(ix,iz); if(mag>1){ix/=mag;iz/=mag;mag=1;}

  const wantRun=(mag>0.93)||keys.ShiftLeft||keys.ShiftRight;
  P.sprint+=((wantRun&&mag>0.3?1:0)-P.sprint)*Math.min(dt*3,1);
  const spd=(WALK+P.sprint*(RUN-WALK))*mag;

  const sy=Math.sin(P.yaw), cy=Math.cos(P.yaw);
  /* frente = (-sin, -cos) · derecha = (cos, -sin) */
  const tvx=(ix*cy + iz*sy)*spd;
  const tvz=(iz*cy - ix*sy)*spd;
  P.vx+=(tvx-P.vx)*Math.min(dt*7.5,1);
  P.vz+=(tvz-P.vz)*Math.min(dt*7.5,1);
  P.x+=P.vx*dt; P.z+=P.vz*dt;
  resolve();

  if(inHole(P.x,P.z)) P.level=stairY(P.x);
  else if(P.x>HX0&&P.x<-1.8&&P.z>HZ0&&P.z<0) P.level=P.y<-1.5?-3:0;
  else P.level=0;
  const gy=inHole(P.x,P.z)?stairY(P.x):P.level;
  P.y+=(gy-P.y)*Math.min(dt*10,1);

  const v=Math.hypot(P.vx,P.vz);

  /* pasos sincronizados con la marcha */
  P.stepPh+=dt*v*3.0;
  if(P.stepPh>Math.PI){
    P.stepPh-=Math.PI;
    if(A&&v>0.22){
      const out=!inHouse(P.x,P.z);
      const surf = P.y<-1.2 ? 'conc'
                 : out ? 'grass'
                 : (P.x>1.8&&P.z>-0.2&&P.z<2.2) ? 'tile'
                 : 'wood';
      A.step(surf, 0.45+Math.min(v/RUN,1)*0.55);
    }
  }

  /* ══════════════════ LA CÁMARA ══════════════════
     Rehecha de cero. La anterior no estaba rota en una linea: tenia CUATRO
     ESCRITORES pisandose —el balanceo, el sacudon, el paseo del menu y el fov
     de la respiracion— asi que la vista final era la suma de cuatro cosas que
     nadie podia seguir. Ahora hay uno solo, en cinco pasos y en orden, y nada
     mas en el juego toca position, quaternion ni fov.

     LA ORIENTACION SALE DE DOS NUMEROS Y DE NINGUNO MAS: yaw y pitch, los dos
     que mueve el dedo. Se arma con un cuaternion desde un Euler YXZ con la Z
     en cero, asi que el alabeo no queda "amortiguado a cero": NO EXISTE — no
     hay una sola linea capaz de escribirlo. */

  P.bob+=dt*v*2.6;
  const amp=Math.min(v/1.4,1.15);
  P.bobY+=(Math.sin(P.bob*2)*0.030*amp-P.bobY)*Math.min(dt*13,1);
  P.bobX+=(Math.sin(P.bob)*0.020*amp-P.bobX)*Math.min(dt*13,1);
  P.breath+=dt*(0.75+P.sprint*1.7+P.panic*3.4);
  const rest=1-Math.min(v/1.4,1);
  const brY=Math.sin(P.breath)*(0.009+rest*0.013+P.panic*0.018);
  P.yawVel*=Math.pow(0.0018,dt);
  P.roll=0; P.lean=0;                      // quedan solo para que las sondas los lean

  /* 1 · DONDE ESTA EL OJO. A la altura del ojo y en el eje del cuerpo. Se fue
        la deriva de "camara en mano" (tres senos por eje): un centimetro que
        no pidio nadie, moviendose todo el tiempo, es exactamente lo que se
        siente como que el encuadre no se queda quieto. */
  camera.position.set(P.x+P.bobX*cy, P.y+EYE+P.bobY+brY, P.z-P.bobX*sy);

  /* 2 · HACIA DONDE MIRA. Nada mas que lo que pidio el dedo.
        El tope de cabeceo va antes de armar la rotacion, no despues de
        haberla escrito: en YXZ el pitch se degenera en ±π/2. */
  P.pitch=Math.max(-1.35,Math.min(1.35,P.pitch));
  _camEu.set(P.pitch,P.yaw,0);
  camera.quaternion.setFromEuler(_camEu);

  /* 3 · EL SACUDON MUEVE EL OJO, NUNCA LA MIRADA. Antes tambien sumaba
        rotacion, y su componente Z es alabeo: un golpe torcia el horizonte y
        eso no se lee a susto, se lee a que el juego se rompio. */
  P.panic=Math.max(0,P.panic-dt*0.16);
  if(shakeUpdate(dt)){
    camera.position.x+=shk.p.x; camera.position.y+=shk.p.y; camera.position.z+=shk.p.z;
  }

  /* 4 · EL PASEO DEL MENU ES ESTE MISMO ESCRITOR y no otro colgado al final */
  if(state==='menu'){
    const a=T*0.042+2.2;
    const x=Math.cos(a)*11.4, z=Math.sin(a)*9.6;
    camera.position.set(x,1.95+Math.sin(T*0.21)*0.22,z);
    _camEu.set(-0.05+Math.sin(T*0.16)*0.022, Math.atan2(x,z), 0);
    camera.quaternion.setFromEuler(_camEu);
  }

  /* 5 · EL CAMPO. Se fue el fov que respiraba: movia el encuadre casi dos
        grados a ritmo de pulmon, y un zoom que va y viene solo no se lee a
        respiracion — se lee a que el mundo se hincha y se desinfla. Lo unico
        que lo abre es correr, y poco.
        HFOV es el horizontal DE REFERENCIA a 16:9; lo que se le escribe a la
        camara es el VERTICAL que sale de ahi, y es el mismo en toda pantalla.
        El horizontal de verdad lo pone camera.aspect, asi que una pantalla mas
        ancha muestra mas de costado: Hor+, y nunca menos. */
  P.fov+=((HFOV+P.sprint*3)-P.fov)*Math.min(dt*4,1);
  const vf=2*Math.atan(Math.tan(P.fov*Math.PI/360)/ASP)*180/Math.PI;
  if(Math.abs(camera.fov-vf)>0.002){ camera.fov=vf; camera.updateProjectionMatrix(); }

  /* linterna: retardo, temblor y batería inestable */
  camera.getWorldDirection(tDir);
  const bat=1-0.15*Math.max(0,Math.sin(T*0.29))-(Math.random()<0.0035?0.65:0);
  const lit=(torchOn&&!torchCut)||state==='menu';
  torch.intensity=lit?3.9*bat:0;
  beam.visible=lit&&(POLVO_ON!==false);
  if(lit){ const bu=beam.material.uniforms;
    bu.uI.value=bat*(inHouse(P.x,P.z)?1:0.6);
    bu.uT.value=T;
    /* adentro el aire tiene polvo; afuera, a la intemperie, casi nada. Y por
       encima de eso, cuanta columna de aire iluminado hay delante de verdad. */
    const aire=aireLibre(camera.position.x,camera.position.y,camera.position.z,
                         tDir.x,tDir.y,tDir.z,5.6);
    const meta=(inHouse(P.x,P.z)?1.0:0.34)*(0.10+0.90*Math.min(1,Math.max(0,(aire-0.45)/2.3)));
    bu.uDen.value+=(meta-bu.uDen.value)*Math.min(dt*2.2,1); }
  halo.position.copy(camera.position);
  halo.intensity=(reading?0.85:(lit?0.40*bat:0.14));
  halo.distance=reading?2.2:4.0;
  /* la tormenta va ANTES de las luces: de ella sale lightBoost, y calculada
     despues las luces usarian el destello del cuadro anterior */
  tormentaPaso(dt);
  fill.position.copy(camera.position); fill.intensity=0.26+lightBoost*0.25;
  /* el hemisferico sube mas que la luna: en un relampago lo que se enciende es
     el cielo entero, y eso es ambiente y no una direccional */
  hemi.intensity=0.5+lightBoost*0.9; moon.intensity=0.30+lightBoost*0.35;

  /* bombillas */
  flickT+=dt;
  const nervous=(A&&A.isQuiet()?2.4:1)*(1+tension*1.5);
  for(const b of bulbs){
    if(flickT>b.next){
      b.next=flickT+(b.state?rnd(.15,3.2)/nervous:rnd(.04,.5));
      b.state=b.state?(Math.random()<.55?0:1):1;
    }
    if(b.dying>0){
      b.dying-=dt;
      b.state=Math.random()<0.45?1:0; b.next=flickT+0.05;
      if(b.dying<=0){ b.on=false; b.dying=0; }
    }
    const n=.6+.4*Math.sin(T*12+b.seed);
    const tgt=b.on?(b.state?b.base*n:0.02):0;
    b.l.intensity+=(tgt-b.l.intensity)*Math.min(dt*22,1);
    const e=Math.min(1,.12+b.l.intensity);
    b.g.material.color.setScalar(e);
    b.sp.material.opacity=e*.6; b.sp.scale.setScalar(.55+e*.5);
  }

  /* lluvia */
  const arr=rainGeo.attributes.position.array;
  for(let i=0;i<RN;i++){
    const o=i*6, fall=rv[i]*dt, drift=1.5*dt;
    arr[o+1]-=fall; arr[o+4]-=fall; arr[o]+=drift; arr[o+3]+=drift;
    const x=arr[o], y=arr[o+1], z=arr[o+2];
    if(y<0||(inHouse(x,z)&&y<WH+2.0)||Math.abs(x-camera.position.x)>22||Math.abs(z-camera.position.z)>22){
      let nx,nz,g=0;
      do{nx=camera.position.x+rnd(-20,20);nz=camera.position.z+rnd(-20,20);g++;}
      while(inHouse(nx,nz)&&g<6);
      const ny=rnd(9,20);
      arr[o]=nx;arr[o+1]=ny;arr[o+2]=nz;arr[o+3]=nx+.06;arr[o+4]=ny+.6;arr[o+5]=nz;
    }else{arr[o+3]=arr[o]+.06;arr[o+5]=arr[o+2];}
  }
  rainGeo.attributes.position.needsUpdate=true;

  /* salpicaduras */
  const sa=splashGeo.attributes.position.array;
  for(let i=0;i<SN;i++){
    sl[i]-=dt*2.6;
    if(sl[i]<0){sl[i]=1;
      let nx,nz,g=0;
      do{nx=camera.position.x+rnd(-9,9);nz=camera.position.z+rnd(-9,9);g++;}
      while(inHouse(nx,nz)&&g<5);
      sa[i*3]=nx; sa[i*3+2]=nz;}
    sa[i*3+1]=0.02+(1-sl[i])*0.14*sl[i]*3;
  }
  splashGeo.attributes.position.needsUpdate=true;

  /* goteras por los boquetes del techo */
  for(const d of dripSystems){
    const a=d.arr;
    for(let i=0;i<d.N;i++){
      const o=i*6, f=d.spd[i]*dt;
      a[o+1]-=f; a[o+4]-=f;
      if(a[o+1]<0.02){
        const y=d.top-rnd(0,0.25);
        a[o]=d.gx+rnd(-0.1,0.1); a[o+2]=d.gz+rnd(-0.1,0.1);
        a[o+3]=a[o]; a[o+5]=a[o+2];
        a[o+1]=y; a[o+4]=y+0.11;
      }
    }
    d.geo.attributes.position.needsUpdate=true;
  }

  /* lo que cuelga se mece con la corriente */
  for(const w of sway) w.o.rotation.z=w.base+Math.sin(T*w.sp+w.ph)*w.amp;
  shaftMat.uniforms.uT.value=T;
  if(_luzForz!==null){ torch.intensity=_luzForz?3.9:0; beam.visible=_luzForz&&beam.visible; }

  /* POLVO: la deriva la hace el vertex shader, aca solo viajan siete numeros.
     Antes eran seis senos por mota en JavaScript. */
  const insideNow=inHouse(P.x,P.z);
  {
    const lp=_pLuz, ld=_dLuz;
    torch.getWorldPosition(lp);
    torch.target.getWorldPosition(ld); ld.sub(lp).normalize();
    const encendida=(torchOn&&!torchCut)||state==='menu';
    for(const m of dustMat){
      const u=m.uniforms;
      u.uT.value=T;
      u.uCam.value.copy(camera.position);
      u.uLPos.value.copy(lp); u.uLDir.value.copy(ld);
      u.uEsc.value=renderer.getDrawingBufferSize(_vTam).y*0.5;
      const meta=(POLVO_ON===null?(encendida?bat:0):(POLVO_ON?bat:0));
      u.uI.value+=(meta-u.uI.value)*Math.min(dt*6,1);
    }
    for(const f of dustFields){
      const o=f.mat.uniforms.uOp;
      o.value+=((insideNow?f.base:f.base*0.30)-o.value)*Math.min(dt*1.5,1);
    }
  }

  /* mezcla del ambiente según dónde esté el jugador */
  if(A) A.update(dt,{inside:inHouse(P.x,P.z), deep:P.y<-1.2, torchOff:!torchOn});

  const rn=roomName();

/* ══════════ fundir lo estatico ══════════
   MEDIDO ANTES DE TOCAR NADA: 798 mallas para 10.787 triangulos con solo 41
   materiales distintos, o sea 673 llamadas de dibujo por cuadro. El peor grupo
   son 223 mallas que comparten UN material y suman 2.676 triangulos — doce
   triangulos cada una. Una malla es una llamada de dibujo, asi que se estaba
   pagando el precio de un mundo grande para dibujar una casa chica.

   Se funden solo las que se puede probar que no molestan:
   · hijos DIRECTOS de la escena (lo que cuelga de un grupo se queda: las
     puertas son grupos y su bisagra los mueve),
   · opacas — fundir transparentes cambia el orden de dibujo y eso se ve,
   · un solo material, sin morphs ni esqueleto,
   · y que no esten en ninguna de las listas que el juego anima.

   LAS COLISIONES NO SE ENTERAN: viven en COL como cajas planas, separadas de
   las mallas. Por eso esto se puede hacer sin tocar el choque. */
function fundirEstatico(){
  const prot=new Set();
  const marcar=e=>{ if(!e) return;
    if(e.isObject3D){ e.traverse(x=>prot.add(x)); return; }
    if(typeof e==='object') for(const k in e){ const v=e[k];
      if(v&&v.isObject3D) v.traverse(x=>prot.add(x)); } };
  // las listas que el juego mueve, prende, abre o hace caer
  [INTER,sway,doors,papers,fallers,swingers,shutters,bulbs].forEach(L=>{
    if(Array.isArray(L)) L.forEach(marcar); });

  const grupos=new Map();
  for(const o of scene.children){
    if(!o.isMesh||o.isInstancedMesh||o.isSkinnedMesh) continue;
    if(prot.has(o)) continue;
    const g=o.geometry, m=o.material;
    if(!g||!g.attributes||!g.attributes.position) continue;
    if(Array.isArray(m)||!m) continue;
    if(m.transparent||m.alphaTest>0) continue;      // el orden de dibujo importa
    if(g.morphAttributes&&Object.keys(g.morphAttributes).length) continue;
    const k=m.uuid+'|'+(o.castShadow?1:0)+'|'+(o.receiveShadow?1:0)+'|'+(o.renderOrder||0);
    if(!grupos.has(k)) grupos.set(k,{m,cast:o.castShadow,rec:o.receiveShadow,
                                    ro:o.renderOrder||0,l:[]});
    grupos.get(k).l.push(o);
  }

  let fundidas=0, mallas=0;
  let vSrc=0, sSrc=0, vDst=0, sDst=0;   // firma: cantidad de vertices y suma ponderada
  for(const {m,cast,rec,ro,l} of grupos.values()){
    if(l.length<2) continue;
    const P=[],N=[],U=[];
    const nm=new THREE.Matrix3();
    for(const o of l){
      o.updateWorldMatrix(true,false);
      const g=o.geometry.index? o.geometry.toNonIndexed() : o.geometry;
      const pa=g.attributes.position, na=g.attributes.normal, ua=g.attributes.uv;
      nm.getNormalMatrix(o.matrixWorld);
      const v=new THREE.Vector3();
      for(let i=0;i<pa.count;i++){
        v.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld);
        P.push(v.x,v.y,v.z);
        vSrc++; sSrc+=v.x*0.7548776662+v.y*0.5698402909+v.z*0.3247179572;
        if(na){ v.fromBufferAttribute(na,i).applyMatrix3(nm).normalize();
                N.push(v.x,v.y,v.z); } else N.push(0,1,0);
        if(ua) U.push(ua.getX(i),ua.getY(i)); else U.push(0,0);
      }
      if(g!==o.geometry) g.dispose();
    }
    const ng=new THREE.BufferGeometry();
    ng.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
    ng.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
    ng.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
    ng.computeBoundingSphere();
    { const pa=ng.attributes.position;
      for(let i=0;i<pa.count;i++){ vDst++;
        sDst+=pa.getX(i)*0.7548776662+pa.getY(i)*0.5698402909+pa.getZ(i)*0.3247179572; } }
    const nmesh=new THREE.Mesh(ng,m);
    nmesh.castShadow=cast; nmesh.receiveShadow=rec; nmesh.renderOrder=ro;
    nmesh.matrixAutoUpdate=false;   // ya esta todo horneado en los vertices
    for(const o of l){ scene.remove(o); o.geometry.dispose(); }
    scene.add(nmesh);
    fundidas+=l.length; mallas++;
  }
  return {fundidas, mallas, grupos:grupos.size,
          vertices:vSrc, vertices_igual:vSrc===vDst,
          firma_dif:Math.abs(sSrc-sDst),
          identico: vSrc===vDst && Math.abs(sSrc-sDst)<1e-6*Math.max(1,Math.abs(sSrc))};

/* ══════════ las fotos pisan a los lienzos cuando llegan ══════════
   NO REEMPLAZAN NADA HASTA QUE DECODIFICAN. Un data URI se decodifica de forma
   asincronica, asi que un material que naciera esperando la foto daria un cuadro
   —o veinte— sin textura. Nace con el lienzo dibujado, que ya funciona, y la
   foto entra encima cuando esta lista. Si una no decodifica, ese material se
   queda con su dibujo: no hay estado roto posible.

   EL TINTE SE APLICA COMO RAZON Y NO COMO UN COLOR ESCRITO A MANO. three.js
   multiplica map x color, y la pared dibujada promedia 0,078 en lineal contra
   0,351 de la foto: dejando el tinte, la casa entera se iba lavada. La razon
   viejo/nuevo se le aplica al color QUE CADA MATERIAL YA TENGA, asi que tambien
   corrige a los clones —el suelo exterior es un clon con su propio tinte y su
   propio repeat 28,28— sin tener que enumerarlos.

   Y EL RELIEVE SE DERIVA DE LA PROPIA FOTO. El normal map que habia salia del
   lienzo dibujado; dejandolo, el relieve describiria una imagen que ya no esta.  */
function _normalDe(img,str){
  const w=img.width,h=img.height;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  const s0=g.getImageData(0,0,w,h).data;
  const out=g.createImageData(w,h), o=out.data;
  const H=(x,y)=>{x=(x+w)%w;y=(y+h)%h;const i=(y*w+x)*4;
    return (s0[i]*0.299+s0[i+1]*0.587+s0[i+2]*0.114)/255;};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const nx=(H(x-1,y)-H(x+1,y))*str, ny=(H(x,y-1)-H(x,y+1))*str;
    const l=Math.sqrt(nx*nx+ny*ny+1), i=(y*w+x)*4;
    o[i]=(nx/l*.5+.5)*255; o[i+1]=(ny/l*.5+.5)*255; o[i+2]=(1/l*.5+.5)*255; o[i+3]=255;
  }
  g.putImageData(out,0,0); return c;
}
let _fotosPuestas=0, _fotosFallo=0, _fotosSinDestino=[];
/* ══════════ CADA TEXTURA NOMBRA SUS MATERIALES ══════════
   Antes esto reemplazaba el mapa en TODO material que usara la misma imagen, y
   eso alcanzaba mientras habia cuatro texturas. Con catorce se rompe: `wood` y
   `bark` comparten la foto del piso, asi que una entrada para la madera de
   mueble le pisaba el mapa al piso Y a los troncos, y cual ganaba dependia de
   cual imagen terminara de decodificar primero. Ahora cada entrada dice a que
   materiales va, y no hay orden que pueda cambiar el resultado. */
function _aplicarFoto(nom,img){
  const F=FOTOS[nom];
  const lienzoN=_normalDe(img,F.s);
  let n=0;
  for(const clave of F.m){
    const m=M[clave];
    if(!m){ _fotosSinDestino.push(nom+'->'+clave); continue; }
    /* LA REPETICION SALE DEL MAPA QUE YA ESTABA. Y si el material no tenia
       ninguno —los que iban en color plano— sale de la tabla, donde el numero es
       el TAMAÑO REAL de la pieza: un colchon mide 1,9 m y la foto de la sabana
       cubre unos 0,9, o sea dos vueltas. Sin esa cuenta la tela sale con
       pliegues de dos metros y se lee a plastico estampado. */
    const rep=m.map?m.map.repeat.clone()
                   :new THREE.Vector2((F.rep||[1,1])[0],(F.rep||[1,1])[1]);
    const an=(m.map&&m.map.anisotropy)||4;
    const t=new THREE.Texture(img);
    t.wrapS=t.wrapT=THREE.MirroredRepeatWrapping;   // la costura no puede existir
    t.repeat.copy(rep); t.encoding=THREE.sRGBEncoding; t.anisotropy=an; t.needsUpdate=true;
    m.map=t;
    const tn=new THREE.Texture(lienzoN);
    tn.wrapS=tn.wrapT=THREE.MirroredRepeatWrapping;
    tn.repeat.copy(rep); tn.anisotropy=an; tn.needsUpdate=true;
    m.normalMap=tn;
    if(!m.normalScale) m.normalScale=new THREE.Vector2(1,1);
    /* EL TINTE SE MULTIPLICA CRUDO, SIN PASAR POR GAMMA, y eso es propio de
       r128: es anterior a la gestion de color de r152, asi que `material.color`
       llega al shader tal cual —un multiplicador lineal— mientras que el mapa SI
       se decodifica por su sRGBEncoding. Metiendo una ida y vuelta por sRGB en
       el medio, la compensacion sale mal justo en los tonos oscuros, que es casi
       toda esta casa.
       En las cuatro primeras la razon compensa el cambio de lienzo a foto; en
       las diez nuevas es 1/color, o sea que el tinte termina en BLANCO y el
       nivel lo lleva la propia imagen, horneada a su objetivo. */
    if(m.color){ const c=m.color;
      c.setRGB(Math.min(1,c.r*F.r[0]), Math.min(1,c.g*F.r[1]), Math.min(1,c.b*F.r[2])); }
    m.needsUpdate=true; n++;
  }
  _fotosPuestas++;
  return n;
}
for(const nom of Object.keys(FOTOS)){
  const im=new Image();
  im.onload=()=>{ try{ _aplicarFoto(nom,im); }catch(e){ _fotosFallo++; } };
  im.onerror=()=>{ _fotosFallo++; };
  im.src='data:image/webp;base64,'+FOTOS[nom].b;
}

const _FUND=fundirEstatico();

ponIdioma(IDI);   // va al final: repinta cosas que se declaran mas abajo

tick();
})();
