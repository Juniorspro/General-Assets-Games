  /* ── EL AUTO-JUGADOR ES LO QUE DEMUESTRA QUE UN NIVEL SE PUEDE LIMPIAR ──
     Un tablero generado y no jugado es un nivel roto que todavia no se sabe.
     Prueba los angulos de a poco, simula el tiro con la MISMA fisica del juego
     —el mismo rebote, el mismo choque— y se queda con el que revienta mas. Si
     ninguno revienta nada, tira al que deja la burbuja mas arriba, que es lo
     que hace una persona cuando no ve jugada. */
  juegaSolo(n, azar){
    const res = [];
    /* `n` es el nivel por el que empezar: sin eso el auto-jugador solo puede
       probar los primeros veinte, y los que se rompen son los de arriba */
    const desde = Math.max(1, n || 1);
    const hasta = Math.min(B_NIVELES, desde + (azar ? 7 : 19));
    for (let nv = desde; nv <= hasta; nv++){
      /* por la cadena de verdad: `empieza` pone el nivel y `termina` guarda
         las estrellas, asi que el progreso queda probado y no supuesto */
      empieza(nv);
      let vueltas = 0;
      while (this.vivo && vueltas < 4000){
        if (!B_bola){
          if (azar) B_ang = -Math.PI/2 + (bAz()-0.5)*2.4;
          else B_ang = bMejorAngulo(B_cola[0]);
          this.dispara();
        }
        this.paso(1/60);
        vueltas++;
      }
      if (!this.vivo) termina();
      res.push({ n: nv, gano: !!this.gano, tiros: B_tiros, tope: B_tope,
                 est: this.estrellas, quedan: B_quedan });
    }
    const malos = res.filter(r => !r.gano);
    return { probados: res.length, limpiados: res.length - malos.length,
             malos: malos.map(r => ({ n: r.n, quedan: r.quedan, tiros: r.tiros + '/' + r.tope })),
             est3: res.filter(r => r.est === 3).length,
             muestra: res.slice(0, 6) };
  },

  audita(desde, hasta){
    const out = [];
    let minB = 999, maxB = 0, sumB = 0, n = 0, colgados = 0;
    for (let nv = desde; nv <= hasta; nv++){
      const gen = bGenera(nv);
      const guard = B_g; B_g = gen.g;
      const b = bCuenta();
      /* una burbuja que nace colgando se cae en el primer cuadro y el nivel
         arranca con un regalo: se cuenta, porque no se ve jugando */
      colgados += bColgando().length;
      B_g = guard;
      if (b < 6) out.push(nv);
      minB = Math.min(minB, b); maxB = Math.max(maxB, b); sumB += b; n++;
    }
    return { desde, hasta, muyChicos: out, colgadosAlNacer: colgados,
             burbMin: minB, burbMax: maxB, burbMedia: +(sumB/Math.max(1,n)).toFixed(1) };
  },

  ver(){
    return { nivel: NIVEL, filas: B_g.length, quedan: B_quedan,
             tiros: B_tiros, tope: B_tope, cola: B_cola.slice(),
             ang: +B_ang.toFixed(3), bola: !!B_bola, caen: B_caen.length,
             colgando: bColgando().length,
             colores: bColores().length,
             geo: { r: B_r, x0: +B_x0.toFixed(1), y0: B_y0, paso: B_paso,
                    muerte: Math.round(bMuerte()) } };
  }
};

/* ── EL BUSCADOR DE ANGULO SIMULA EL TIRO DE VERDAD ──
   Con geometría a mano habría que rehacer el rebote y el choque, y ahí serían
   dos físicas distintas: el buscador aprobaría tiros que el juego no hace. Esto
   copia el tablero, dispara, y mira qué pasó. */
function bMejorAngulo(col){
  const c = bCanon();
  let mejor = -Math.PI/2, mejorP = -1e9;
  /* veintisiete angulos y no cincuenta y tres: la reja tiene nueve columnas,
     asi que dos angulos separados menos de un grado apuntan a la misma celda y
     el segundo es trabajo tirado */
  for (let k = -13; k <= 13; k++){
    const a = -Math.PI/2 + k*0.096;
    if (Math.abs(a + Math.PI/2) > 1.30) continue;
    const r = bSimula(c.x, c.y, a, col);
    if (!r) continue;
    /* lo que se revienta pesa, lo que se cae pesa el doble, y quedar arriba
       vale un poco: es el mismo orden de premios que el juego paga */
    /* revienta > se cae > arrima. Y quedar abajo resta, porque una burbuja
       cerca de la linea de muerte acerca la derrota. */
    const bajo = bXY(r.f, r.c).y + B_r > bMuerte() - B_paso ? -30 : 0;
    const p = r.pop*10 + r.cae*22 + (r.vec||0)*5 + (B_g.length - r.f)*0.4 + bajo;
    if (p > mejorP){ mejorP = p; mejor = a; }
  }
  return mejor;
}
function bSimula(x, y, a, col){
  const g0 = B_g.map(f => f.slice());
  let bx = x, by = y, ba = a;
  const sub = B_r*0.4;
  /* ── EL TOPE DE SUBPASOS SALE DE UNA CUENTA Y NO DE UN NUMERO GRANDE ──
     Con 2000 subpasos de nueve unidades el tiro recorre dieciocho mil unidades,
     o sea doce pantallas: eran mil novecientos subpasos gastados despues de que
     la burbuja ya se clavo o ya se fue. El recorrido mas largo posible es la
     pantalla entera rebotando, y con 300 pasos de 0,4 radios eso sobra. */
  for (let i = 0; i < 300; i++){
    bx += Math.cos(ba)*sub; by += Math.sin(ba)*sub;
    if (bx < B_x0 + B_r){ bx = B_x0 + B_r; ba = Math.PI - ba; }
    if (bx > AN - B_x0 - B_r){ bx = AN - B_x0 - B_r; ba = Math.PI - ba; }
    if (!bChoca(g0, bx, by)){ if (by > AL) return null; continue; }
    const cel = bCelda(g0, bx, by);
    if (!cel) return null;
    const guard = B_g; B_g = g0;
    /* los vecinos del mismo color ANTES de poner la burbuja: es lo que dice si
       el tiro CONSTRUYE un racimo. Sin este termino el bot solo veia los tiros
       que revientan ya, y cuando no habia ninguno tiraba a cualquier parte —
       medido, limpiaba tres niveles de veinte y se quedaba sin tiros con una o
       dos burbujas puestas. Una persona en cambio arrima de a una. */
    let vec = 0;
    for (const [nf, nc] of bVec(cel[0], cel[1]))
      if (bDe(nf, nc) === col) vec++;
    g0[cel[0]][cel[1]] = col;
    const rac = bRacimo(cel[0], cel[1]);
    let pop = 0, cae = 0;
    if (rac.length >= 3){
      pop = rac.length;
      for (const [f, cc] of rac) g0[f][cc] = -1;
      cae = bColgando().length;
    }
    B_g = guard;
    return { f: cel[0], c: cel[1], pop, cae, vec };
  }
  return null;
}

function bBurbuja(g, x, y, r, ci){
  const col = B_COL[ci] || '#888';
  /* ── UNA SOLA BURBUJA BLANCA Y LAS SIETE SALEN TENIDAS ──
     Es una generacion en vez de siete, y ademas no puede pasar que dos colores
     queden con brillos distintos: el brillo especular y el borde de luz son
     literalmente los mismos pixeles en las siete. `tenido()` multiplica sobre
     blanco, asi que el color sale exacto y el gris del cuerpo se convierte en
     el sombreado. */
  if (dibSello('burbujas', x, y, r, 0, col)) return;
  const gr = g.createRadialGradient(x - r*0.32, y - r*0.34, r*0.05, x, y, r*1.02);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(0.26, col);
  gr.addColorStop(1, 'rgba(0,0,0,.50)');
  g.beginPath(); g.arc(x, y, r*0.96, 0, 7); g.fillStyle = gr; g.fill();
  g.beginPath();
  g.ellipse(x - r*0.30, y - r*0.36, r*0.24, r*0.13, -0.7, 0, 7);
  g.fillStyle = 'rgba(255,255,255,.52)'; g.fill();
}

/* la mira: puntos que se van achicando y NO una línea. Una línea recta miente
   —no muestra el rebote— y encima tapa las burbujas que hay que mirar. */
function bMira(g, a, alfa){
  const c = bCanon();
  let x = c.x, y = c.y, ang = a;
  g.save();
  g.globalAlpha = 0.30 + 0.45*alfa;
  const sub = B_r*0.5;
  for (let i = 0; i < 46; i++){
    x += Math.cos(ang)*sub*2; y += Math.sin(ang)*sub*2;
    if (x < B_x0 + B_r){ x = B_x0 + B_r; ang = Math.PI - ang; }
    if (x > AN - B_x0 - B_r){ x = AN - B_x0 - B_r; ang = Math.PI - ang; }
    if (y < B_y0) break;
    /* la mira se corta donde chocaría: así muestra exactamente hasta dónde
       llega el tiro, rebote incluido */
    if (bChoca(B_g, x, y)) break;
    g.beginPath();
    g.arc(x, y, Math.max(1.6, 5 - i*0.09), 0, 7);
    g.fillStyle = '#f2eee6'; g.fill();
  }
  g.restore();
}
function bCanonDib(g, x, y, r){
  g.save();
  g.beginPath(); g.arc(x, y, r*1.34, 0, 7);
  g.fillStyle = 'rgba(7,7,11,.55)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(242,238,230,.34)'; g.stroke();
  g.restore();
}
function bDemo(g, filas){
  bGeo();
  for (let f = 0; f < filas; f++) for (let c = 0; c < bAncho(f); c++){
    const p = bXY(f, c);
    bBurbuja(g, p.x, p.y, B_r, (f*2 + c) % 5);
  }
}
function bFondo(g){
  if (dibCubre('fondo')) return;
  const gr = g.createLinearGradient(0, 0, 0, AL);
  gr.addColorStop(0, '#101a3a');
  gr.addColorStop(0.55, '#16274f');
  gr.addColorStop(1, '#0a1024');
  g.fillStyle = gr; g.fillRect(0, 0, AN, AL);
  /* el techo del que cuelgan: sin él la primera fila flota y no se entiende de
     qué está agarrado el tablero */
  g.fillStyle = 'rgba(242,238,230,.10)';
  g.fillRect(0, 0, AN, B_y0 - B_r*0.9);
  g.fillStyle = 'rgba(242,238,230,.18)';
  g.fillRect(0, B_y0 - B_r*0.9 - 4, AN, 4);
}
/* ══════════════════════ LOS TRES IDIOMAS ══════════════════════
   La pantalla de idioma va ANTES del menú, que es la lección de los otros seis
   juegos de este repo: elegir el idioma adentro de un menú ya escrito en un
   idioma que no entendés no sirve de nada, porque para cuando lo encontrás ya
   leíste todo sin entenderlo.

   Y NO SE GUARDA NADA EN DISCO. `localStorage` TIRA en una ventana privada, y
   un minijuego que se abre desde un enlace se abre en ventanas raras todo el
   tiempo. El idioma sale de `navigator.language` y el jugador lo cambia con los
   tres botones chicos del menú. La única cosa que sí se intenta guardar es el
   récord, y va envuelta en `try` justamente porque puede tirar. */
let LANG = 'en';
const TXB = {
  es: { jugar:'JUGAR', como:'CÓMO SE JUEGA', otra:'OTRA VEZ', menu:'MENÚ',
        mejor:'MEJOR', salta:'TOCÁ PARA SALTEAR', pts:'PUNTOS',
        finBien:'¡BIEN!', finMal:'SE TERMINÓ', nuevoRec:'RÉCORD NUEVO',
        racha:'RACHA', niveles:'NIVELES', nivel:'NIVEL', movs:'MOVIDAS',
        deshacer:'DESHACER', reiniciar:'REINICIAR', salir:'SALIR',
        seguir:'SEGUIR', ganaste:'¡NIVEL LISTO!', perdiste:'NO SALIÓ',
        proximo:'SIGUIENTE', progreso:'{0} DE {1}' },
  en: { jugar:'PLAY', como:'HOW TO PLAY', otra:'AGAIN', menu:'MENU',
        mejor:'BEST', salta:'TAP TO SKIP', pts:'POINTS',
        finBien:'NICE!', finMal:'GAME OVER', nuevoRec:'NEW RECORD',
        racha:'STREAK', niveles:'LEVELS', nivel:'LEVEL', movs:'MOVES',
        deshacer:'UNDO', reiniciar:'RESTART', salir:'EXIT',
        seguir:'CONTINUE', ganaste:'LEVEL CLEAR!', perdiste:'NO LUCK',
        proximo:'NEXT', progreso:'{0} OF {1}' },
  pt: { jugar:'JOGAR', como:'COMO JOGAR', otra:'DE NOVO', menu:'MENU',
        mejor:'MELHOR', salta:'TOQUE PARA PULAR', pts:'PONTOS',
        finBien:'BOA!', finMal:'ACABOU', nuevoRec:'NOVO RECORDE',
        racha:'SEQUÊNCIA', niveles:'NÍVEIS', nivel:'NÍVEL', movs:'JOGADAS',
        deshacer:'DESFAZER', reiniciar:'REINICIAR', salir:'SAIR',
        seguir:'CONTINUAR', ganaste:'NÍVEL FEITO!', perdiste:'NÃO DEU',
        proximo:'PRÓXIMO', progreso:'{0} DE {1}' }
};
/* ── LA TABLA DEL JUEGO SE FUSIONA CON LA DEL NÚCLEO, NO LA REEMPLAZA ──
   Cada juego trae sus propias frases y hereda las siete del núcleo. Si cada
   juego tuviera que repetir «JUGAR» y «MENÚ» en tres idiomas, serían veintiún
   cadenas duplicadas por juego y la primera que se corrija va a quedar
   corregida en uno solo. */
const TXT = {};
for (const l of ['es','en','pt']) TXT[l] = Object.assign({}, TXB[l], (JT[l] || {}));

function TX(k, ...a){
  let s = (TXT[LANG] && TXT[LANG][k]) != null ? TXT[LANG][k]
        : (TXT.es[k] != null ? TXT.es[k] : k);
  /* los patrones con hueco: `{0}` se reemplaza por el argumento. Una frase con
     un número adentro no se puede armar concatenando, porque el número no cae
     en el mismo lugar en los tres idiomas. */
  return String(s).replace(/\{(\d)\}/g, (_, i) => a[i] != null ? a[i] : '');
}

function pintaIdioma(){
  document.documentElement.lang = LANG;
  for (const e of document.querySelectorAll('[data-i18n]'))
    e.textContent = TX(e.dataset.i18n);
  for (const b of document.querySelectorAll('[data-lang]'))
    b.classList.toggle('p', b.dataset.lang === LANG);
  $('salta').textContent = TX('salta');
  if (window.pintaJuego) window.pintaJuego();
}

function ponIdioma(l){ LANG = l; pintaIdioma(); }

/* el idioma del aparato, y sólo si es uno de los tres */
(() => {
  const n = (navigator.language || 'en').slice(0,2).toLowerCase();
  if (n === 'es' || n === 'pt') LANG = n;
})();
/* ══════════════════════════ EL SONIDO ══════════════════════════
   Procedural y sin un solo archivo, y acá eso no es una limitación sino la
   respuesta correcta: un minijuego de TikTok se abre desde un enlace y tiene
   que estar jugable en el primer segundo. Medio mega de MP3 antes del primer
   cuadro es exactamente lo que hace que alguien se vaya.

   Y LA ESCALA ESTÁ ESCALONADA, que es la regla que ya se midió en Eco, en
   RECREO y en PULSO: la cama de fondo tiene que quedar MUY por debajo de un
   acierto, porque si compiten, el acierto deja de ser un acontecimiento y pasa
   a ser un matiz. Fondo 0,03 · toque 0,10 · acierto 0,18 · error 0,22 · final
   0,30. */
let AUD = null, MAESTRO = null, ANAL = null, RUIDO = null, CAMA = null;
let SILENCIO = false;

function armaAudio(){
  if (AUD) return;
  try { AUD = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  MAESTRO = AUD.createGain(); MAESTRO.gain.value = 0.9;
  MAESTRO.connect(AUD.destination);
  ANAL = AUD.createAnalyser(); ANAL.fftSize = 1024; MAESTRO.connect(ANAL);
  /* un segundo de ruido blanco generado una vez: cada golpe es el mismo ruido
     con otro filtro y otro sobre, así que no hay que generar nada más */
  const n = AUD.sampleRate;
  RUIDO = AUD.createBuffer(1, n, n);
  const d = RUIDO.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
}

function env(gn, t0, at, dur, pico){
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t0 + at);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function tono(t0, f0, f1, dur, pico, tipo){
  if (!AUD) return;
  const o = AUD.createOscillator(); o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const gn = AUD.createGain(); o.connect(gn); gn.connect(MAESTRO);
  env(gn, t0, Math.min(0.02, dur*0.2), dur, pico);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function ruido(t0, dur, f, q, pico, tipo){
  if (!AUD) return null;
  const s = AUD.createBufferSource(); s.buffer = RUIDO; s.loop = true;
  const b = AUD.createBiquadFilter(); b.type = tipo || 'bandpass';
  b.frequency.value = f; b.Q.value = q;
  const gn = AUD.createGain();
  s.connect(b); b.connect(gn); gn.connect(MAESTRO);
  env(gn, t0, Math.min(0.01, dur*0.2), dur, pico);
  s.start(t0); s.stop(t0 + dur + 0.05);
  return b;
}

/* ── LA ESCALA PENTATÓNICA NO ES UN GUSTO ──
   Un acierto suena cien veces por partida. En cualquier otra escala, dos notas
   seguidas pueden sonar mal juntas y a los treinta segundos molesta; en
   pentatónica cualquier nota pega con cualquier otra. Es la misma decisión que
   en POMPOM, y ahí se notó al primer minuto de juego. */
const PENTA = [0, 2, 4, 7, 9];
function nota(i){ /* i = grado, sube por octavas */
  const o = Math.floor(i / 5), s = PENTA[((i % 5) + 5) % 5];
  return 220 * Math.pow(2, (s + 12*o) / 12);
}

let _racha = 0;
function son(tipo, k){
  if (!AUD || SILENCIO) return;
  const t = AUD.currentTime, v = k == null ? 1 : k;
  if (tipo === 'toque'){
    tono(t, 620, 460, 0.05, 0.10*v, 'sine');
  } else if (tipo === 'bien'){
    /* ── LA RACHA SUBE DE NOTA, Y ES LO QUE ENGANCHA ──
       Con una nota fija, veinte aciertos son el mismo sonido veinte veces. Con
       la escala subiendo, la racha SE ESCUCHA: el jugador oye que va bien antes
       de mirar el número, y perder la racha se siente porque el tono vuelve
       abajo. Es la mitad del enganche de un minijuego y cuesta dos líneas. */
    _racha = Math.min(_racha + 1, 14);
    tono(t, nota(_racha + 4), nota(_racha + 4)*1.5, 0.16, 0.18*v, 'triangle');
    tono(t + 0.03, nota(_racha + 9), nota(_racha + 9), 0.10, 0.07*v, 'sine');
  } else if (tipo === 'mal'){
    _racha = 0;
    tono(t, 190, 78, 0.30, 0.22*v, 'sawtooth');
    ruido(t, 0.16, 260, 0.8, 0.14*v, 'lowpass');
  } else if (tipo === 'gana'){
    _racha = 0;
    for (let i = 0; i < 5; i++)
      tono(t + i*0.085, nota(6 + i*2), nota(6 + i*2), 0.30, 0.30, 'triangle');
  } else if (tipo === 'pierde'){
    _racha = 0;
    for (let i = 0; i < 3; i++)
      tono(t + i*0.13, nota(8 - i*3), nota(8 - i*3)*0.98, 0.34, 0.24, 'sawtooth');
  } else if (tipo === 'raspa'){
    const b = ruido(t, 0.09, 2600, 0.6, 0.13*v);
    if (b) b.frequency.linearRampToValueAtTime(1400, t + 0.09);
  } else if (tipo === 'clic'){
    ruido(t, 0.035, 1800, 1.4, 0.12*v);
  } else if (tipo === 'pop'){
    /* una burbuja que revienta: un golpe de ruido corto y agudo mas un tono que
       cae rapido. El tono solo suena a bip; el ruido solo, a chasquido. */
    ruido(t, 0.05, 1500 + 900*Math.random(), 1.1, 0.14*v);
    tono(t, 900, 320, 0.07, 0.09*v, 'sine');
  } else if (tipo === 'caida'){
    /* algo apoyandose: casi todo grave, porque lo que dice «peso» es lo de
       abajo. Con un tono agudo se lee a boton y no a bloque. */
    tono(t, 150, 62, 0.13, 0.16*v, 'sine');
    ruido(t, 0.06, 220, 0.7, 0.10*v, 'lowpass');
  }
}
function rachaCero(){ _racha = 0; }

/* la cama: dos senos muy graves y desafinados entre sí, que baten cada pocos
   segundos. Dos senos idénticos suenan a tono de prueba; desafinados suenan a
   instrumento, y es lo que ya se midió en POMPOM. */
function camaFondo(on){
  if (!AUD) return;
  if (on && !CAMA){
    const o = AUD.createOscillator(); o.type = 'sine'; o.frequency.value = 55;
    const o2 = AUD.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.4;
    const gn = AUD.createGain(); gn.gain.value = 0.030;
    o.connect(gn); o2.connect(gn); gn.connect(MAESTRO);
    o.start(); o2.start();
    CAMA = { o, o2, gn };
  } else if (!on && CAMA){
    CAMA.gn.gain.setTargetAtTime(0.0001, AUD.currentTime, 0.25);
    const c = CAMA; CAMA = null;
    setTimeout(() => { try { c.o.stop(); c.o2.stop(); } catch(e){} }, 900);
  }
}
function pico(){
  if (!ANAL) return 0;
  const a = new Uint8Array(ANAL.fftSize);
  ANAL.getByteTimeDomainData(a);
  let m = 0;
  for (const v of a) m = Math.max(m, Math.abs(v - 128) / 128);
  return +m.toFixed(4);
}
/* ══════════════════ LOS ASSETS GENERADOS ══════════════════
   Las imágenes y el sonido están generados con Rezona y horneados en base64
   dentro del archivo por `herramientas/casual/hornear.py`. Este módulo es lo
   único que los conoce: los juegos piden `IMG.pj` o `dibCuadro('pj', 2, …)` y
   no saben de dónde salió.

   ── Y NADA REEMPLAZA NADA HASTA QUE LLEGA ──
   Es la regla del repo y acá pesa más que en ningún otro juego: un data URI se
   decodifica de forma ASINCRÓNICA, así que un juego que naciera esperando la
   foto daría un cuadro —o veinte— en negro justo en el primer segundo, que es
   el único que un minijuego tiene para engancharte. Todo lo dibujado por código
   sigue en pie y la imagen lo PISA cuando está lista. Si una no decodifica,
   cuesta esa pieza y no la pantalla. */

const IMG = {}, SON = {};
let AS_LISTAS = 0, AS_PEDIDAS = 0, AS_FALLADAS = 0;

function cargaImg(){
  if (typeof AS === 'undefined' || !AS.img) return;
  for (const k in AS.img){
    const m = AS.img[k];
    const o = { ok: false, n: m.n || 1, w: m.w || 0, h: m.h || 0,
                im: new Image(), msk: null, cache: {} };
    IMG[k] = o; AS_PEDIDAS++;
    o.im.onload = () => {
      o.ok = true; AS_LISTAS++;
      if (!o.w){ o.w = o.im.width; o.h = o.im.height; }
    };
    o.im.onerror = () => { AS_FALLADAS++; };
    o.im.src = m.d;
    if (m.m){ o.msk = new Image(); o.msk.src = m.m; }
  }
}

/* el sonido necesita el contexto, así que se carga cuando el contexto existe —
   o sea con el primer toque. Ningún navegador deja sonar nada antes de un
   gesto, así que decodificar antes sería trabajo tirado. */
let _sonPedido = false;
function cargaSon(){
  if (_sonPedido || !AUD || typeof AS === 'undefined' || !AS.son) return;
  _sonPedido = true;
  for (const k in AS.son){
    const b = atob(AS.son[k]);
    const ab = new ArrayBuffer(b.length), v = new Uint8Array(ab);
    for (let i = 0; i < b.length; i++) v[i] = b.charCodeAt(i);
    AUD.decodeAudioData(ab, (buf) => {
      SON[k] = buf;
      /* ── Y SI EL TEMA QUE HACE FALTA ERA ESTE, ARRANCA AHORA ──
         `decodeAudioData` es asincronico, asi que el primer pedido de musica
         casi siempre llega ANTES de que el buffer exista: sin esto, el menu
         se quedaria con la cama de osciladores para siempre y el tema
         generado no sonaria nunca. */
      if (_musK === k) musQuiere(k);
    }, () => {});
  }
}

/* ══════════ LA MÚSICA ══════════
   Va con `BufferSource` en bucle y no con un `<audio loop>`: el loop de un
   `<audio>` vuelve al cero con un hueco de milisegundos y en un tema de nueve
   segundos eso se escucha en cada vuelta. Más la cola fundida sobre la cabeza,
   que la pone el horneado.

   Y SE CRUZAN, no se cortan: el menú y la partida son dos temas, y un corte en
   seco entre los dos se lee a error y no a que empezó el juego. */
const MUS_VOL = { menu: 0.30, mus: 0.26 };
let MUS = null;

function musPon(k){
  if (!AUD) return;
  if (MUS && MUS.k === k) return;
  if (MUS){
    const v = MUS; MUS = null;
    v.gn.gain.cancelScheduledValues(AUD.currentTime);
    v.gn.gain.setTargetAtTime(0.0001, AUD.currentTime, 0.28);
    setTimeout(() => { try { v.src.stop(); } catch(e){} }, 1200);
  }
  if (!k || !SON[k]) return;
  const src = AUD.createBufferSource();
  src.buffer = SON[k]; src.loop = true;
  const gn = AUD.createGain(); gn.gain.value = 0.0001;
  src.connect(gn); gn.connect(MAESTRO);
  src.start();
  gn.gain.setTargetAtTime(MUS_VOL[k] != null ? MUS_VOL[k] : 0.26, AUD.currentTime, 0.35);
  MUS = { k, src, gn };
}
/* ── QUE TEMA QUIERE EL JUEGO ──
   Un solo sitio decide si suena la muestra o la cama de osciladores, y se
   acuerda de lo que se le pidio para poder arrancarlo cuando el buffer llegue.
   Repartido en cinco llamadas, el dia que se agregue una pantalla va a quedar
   una sin musica y nadie se va a enterar hasta jugarla. */
let _musK = null;
function musQuiere(k){
  _musK = k;
  cargaSon();
  if (k && SON[k]){ camaFondo(false); musPon(k); return; }
  musPon(null);
  camaFondo(!!k);
}

/* la música se agacha mientras suena algo importante: si compiten, el
   acontecimiento deja de ser un acontecimiento y pasa a ser un matiz */
function musAgacha(k, seg){
  if (!MUS) return;
  const g0 = MUS_VOL[MUS.k] != null ? MUS_VOL[MUS.k] : 0.26;
  MUS.gn.gain.cancelScheduledValues(AUD.currentTime);
  MUS.gn.gain.setTargetAtTime(g0*k, AUD.currentTime, 0.05);
  MUS.gn.gain.setTargetAtTime(g0, AUD.currentTime + (seg || 0.5), 0.25);
}

/* ══════════ EL SONIDO: LA MUESTRA PRIMERO Y EL OSCILADOR DE RED ══════════
   `son()` sigue siendo el de siempre —está medido y funciona— y esto lo
   ENVUELVE: si el juego declaró un alias y la muestra decodificó, suena la
   muestra; si no, suena el sintetizado. Un juego mudo por un decodificador es
   peor que un juego con bips, y ya pasó una vez en este repo. */
const _sonProc = son;
son = function(tipo, k){
  if (!AUD || SILENCIO) return;
  const al = (typeof SON_ALIAS !== 'undefined' && SON_ALIAS) ? SON_ALIAS[tipo] : null;
  if (al && SON[al]){
    if (tipo === 'bien') _racha = Math.min(_racha + 1, 14);
    else if (tipo === 'mal' || tipo === 'gana' || tipo === 'pierde') _racha = 0;
    const src = AUD.createBufferSource();
    src.buffer = SON[al];
    const gn = AUD.createGain();
    gn.gain.value = (k == null ? 1 : k) * 0.85;
    src.connect(gn); gn.connect(MAESTRO);
    src.start();
    return;
  }
  _sonProc(tipo, k);
};

/* ══════════ DIBUJO ══════════ */

/* el fondo se dibuja por COVER y no estirado: la imagen viene 720x1280 y el
   alto de diseño se mueve entre 1100 y 1760 según la pantalla, así que
   estirándola la entrada del boliche sale aplastada en un teléfono largo */
function dibCubre(k){
  const o = IMG[k];
  if (!o || !o.ok) return false;
  const e = Math.max(AN/o.im.width, AL/o.im.height);
  const w = o.im.width*e, h = o.im.height*e;
  g.drawImage(o.im, (AN - w)/2, (AL - h)/2, w, h);
  return true;
}

/* un cuadro de una hoja de sprites, centrado en x y APOYADO en y (los pies),
   que es como se piensa un personaje. `esp` lo espeja. */
function dibCuadro(k, i, x, y, alto, esp, lienzo){
  const o = IMG[k];
  if (!o || !o.ok) return false;
  const src = lienzo || o.im;
  const e = alto / o.h, w = o.w*e;
  g.save();
  g.translate(x, y);
  if (esp) g.scale(-1, 1);
  g.drawImage(src, (i % o.n)*o.w, 0, o.w, o.h, -w/2, -alto, w, alto);
  g.restore();
  return true;
}

/* ── EL TEÑIDO: LA HOJA SE PINTA UNA VEZ Y SE GUARDA ──
   El personaje se generó con la ropa BLANCA para poder pintarla del color que
   la regla pida. Pintar por cuadro serían tres operaciones de lienzo sesenta
   veces por segundo para obtener siempre lo mismo: se hornea una hoja por
   color la primera vez que se pide y después son copias.

   `multiply` sobre blanco devuelve el color exacto y sobre el contorno oscuro
   lo deja oscuro, que es justo lo que tiene que pasar. Y donde la máscara es
   transparente no cambia nada, así que la piel y el pelo no se tocan. */
function tenido(k, color){
  const o = IMG[k];
  if (!o || !o.ok) return null;
  if (o.cache[color]) return o.cache[color];
  /* ── Y NO SE CACHEA UN TEÑIDO HECHO SIN LA MÁSCARA ──
     La máscara es una segunda imagen y decodifica DESPUÉS de la hoja. Sin esta
     guarda, el primer cuadro teñía con la hoja entera de máscara —o sea todo el
     sprite, piel incluida— y GUARDABA eso para siempre: medido en la captura,
     el visitante salía azul de la cara a las zapatillas.
     Mientras la máscara no esté, se devuelve la hoja cruda sin teñir y sin
     guardar nada: un visitante de blanco por dos cuadros es infinitamente mejor
     que uno pintado entero por el resto de la partida. */
  if (AS.img[k] && AS.img[k].m && !(o.msk && o.msk.complete)) return o.im;
  const c = document.createElement('canvas');
  c.width = o.im.width; c.height = o.im.height;
  const x = c.getContext('2d');
  x.drawImage(o.im, 0, 0);
  const t = document.createElement('canvas');
  t.width = c.width; t.height = c.height;
  const y = t.getContext('2d');
  /* la máscara es la de la ropa si la hay; si no, el sprite entero (que en ese
     caso se generó blanco a propósito, como la bola de MANCHA) */
  y.drawImage(o.msk && o.msk.complete ? o.msk : o.im, 0, 0);
  y.globalCompositeOperation = 'source-in';
  y.fillStyle = color; y.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'multiply';
  x.drawImage(t, 0, 0);
  o.cache[color] = c;
  return c;
}

/* una textura como patrón repetible, guardada. Se hornean embaldosadas de
   verdad (la banda del borde fundida sobre el opuesto), así que se repiten sin
   espejo y sin costura. */
function patron(k){
  const o = IMG[k];
  if (!o || !o.ok) return null;
  if (!o.pat) o.pat = g.createPattern(o.im, 'repeat');
  return o.pat;
}

/* un sello (la salpicadura, la bola) teñido y girado. El sello se horneó con el
   RGB en blanco puro, así que el color sale exacto y no multiplicado por lo que
   la generación hubiera puesto de gris. */
function dibSello(k, x, y, r, gi, color){
  const c = tenido(k, color);
  if (!c) return false;
  g.save();
  g.translate(x, y);
  if (gi) g.rotate(gi);
  g.drawImage(c, -r, -r, r*2, r*2);
  g.restore();
  return true;
}

function asEstado(){
  return { pedidas: AS_PEDIDAS, listas: AS_LISTAS, falladas: AS_FALLADAS,
           son: Object.keys(SON).length,
           mus: MUS ? MUS.k : null };
}
/* ══════════════════ EL JUGO Y LA RACHA ══════════════════
   Lo que separa un minijuego de una demostración de una mecánica. Va en el
   núcleo y no en cada juego por la razón de siempre —cinco copias divergen— y
   porque acá hay algo más: la RACHA es una segunda capa de juego que los cinco
   heredan de una.

   ── POR QUÉ UN MULTIPLICADOR Y NO PUNTOS MÁS GRANDES ──
   Un minijuego de cuarenta segundos con un solo verbo tiene un problema de
   diseño concreto: la décima vez que hacés la cosa vale lo mismo que la
   primera, así que a los quince segundos ya sabés cuánto vas a sacar. Con el
   multiplicador la partida tiene una CURVA: los primeros cuatro aciertos valen
   uno, el quinto vale dos, y a partir de ahí cada error no cuesta un punto,
   cuesta la escalera entera. Eso convierte «tocar bien» en «no cortar la
   racha», que es una decisión aunque el verbo sea el mismo.

   Y LA VENTANA ES DE TIEMPO Y NO SÓLO DE ACIERTOS: dudar también corta. En un
   juego que se filma, eso es lo que hace que el jugador se apure. */

const COMBO = { n: 0, t: 0, mult: 1, max: 0, brillo: 0 };
const COMBO_VENT = 2.8;          /* segundos de gracia entre dos aciertos */
const COMBO_ESC = 4;             /* aciertos por escalón */
const COMBO_TOPE = 5;            /* x5 y no más: con x10 la última partida borra
                                    todas las anteriores y el récord deja de
                                    querer decir algo */

function comboCero(){
  COMBO.n = 0; COMBO.t = 0; COMBO.mult = 1; COMBO.brillo = 0;
  pintaCombo();
}
function comboSuma(){
  COMBO.n++;
  COMBO.t = COMBO_VENT;
  const m = Math.min(COMBO_TOPE, 1 + Math.floor(COMBO.n / COMBO_ESC));
  if (m !== COMBO.mult){
    COMBO.mult = m;
    COMBO.brillo = 1;
    /* el escalón suena, y suena distinto de un acierto: si sonara igual, subir
       de multiplicador no se notaría hasta mirar el número */
    son('combo');
    sacude(0.35);
  }
  if (COMBO.n > COMBO.max) COMBO.max = COMBO.n;
  pintaCombo();
}
function comboCorta(){
  if (COMBO.n === 0 && COMBO.mult === 1) return;
  COMBO.n = 0; COMBO.mult = 1; COMBO.t = 0; COMBO.brillo = 0;
  pintaCombo();
}
function comboPaso(dt){
  if (COMBO.brillo > 0) COMBO.brillo -= dt*2.2;
  if (COMBO.t <= 0) return;
  COMBO.t -= dt;
  if (COMBO.t <= 0) comboCorta();
  else if (COMBO.mult > 1) pintaCombo();
}

/* la ficha del multiplicador vive en DOM como el resto del HUD: es un número
   que tiene que quedar nítido en cualquier densidad de pantalla. Y se escribe
   sólo cuando cambia, salvo la barra de la ventana, que es un ancho. */
let _comboUlt = '';
function pintaCombo(){
  const e = $('combo');
  if (!e) return;
  const v = COMBO.mult > 1 ? ('x' + COMBO.mult) : '';
  if (v !== _comboUlt){ e.textContent = v; _comboUlt = v; e.classList.toggle('on', !!v); }
  const b = $('comboB');
  if (b) b.style.width = (COMBO.t > 0 ? (COMBO.t/COMBO_VENT*100) : 0).toFixed(0) + '%';
}

/* ── SUMAR PUNTOS PASA POR UN SOLO SITIO ──
   Acá se aplica el multiplicador, se sube la racha y sale el número flotante.
   Repartido, cada juego tendría que acordarse de las tres cosas y la primera
   que se olvide es el número, que es justo lo que hace que el punto se sienta
   ganado. */
function sumaPuntos(n, x, y){
  comboSuma();
  const g0 = n * COMBO.mult;
  PUNTOS += g0;
  if (x != null) flota('+' + g0, x, y, COMBO.mult > 1 ? '#ffd76a' : '#f2eee6',
                       COMBO.mult > 1 ? 44 : 34);
  return g0;
}

/* ══════════ PARTÍCULAS ══════════
   Con gravedad y con roce, y el color lo elige quien las tira. Son la
   diferencia entre «el bicho desapareció» y «le pegué»: sin nada, un objeto que
   se va del cuadro se lee a error de dibujo. */
const PART = [];
const PART_TOPE = 220;           /* tope duro: sin él, una racha larga en MANCHA
                                    llena el array y el cuadro se cae */
function chispas(x, y, n, col, fuerza){
  const f = fuerza || 1;
  for (let i = 0; i < n && PART.length < PART_TOPE; i++){
    const a = Math.random()*6.283, v = (90 + Math.random()*260)*f;
    PART.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60*f,
                r: 3 + Math.random()*6, t: 0.38 + Math.random()*0.42, T: 0, col });
  }
}
function partPaso(dt){
  for (let i = PART.length - 1; i >= 0; i--){
    const p = PART[i];
    p.T += dt;
    if (p.T >= p.t){ PART.splice(i, 1); continue; }
    p.vy += 1500*dt;
    p.vx *= 1 - 2.2*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ══════════ NÚMEROS FLOTANTES ══════════ */
const FLOT = [];
function flota(txt, x, y, col, tam){
  if (FLOT.length > 24) FLOT.shift();
  FLOT.push({ txt, x, y, col: col || '#f2eee6', tam: tam || 34, t: 0.9, T: 0 });
}
function flotPaso(dt){
  for (let i = FLOT.length - 1; i >= 0; i--){
    const f = FLOT[i];
    f.T += dt;
    if (f.T >= f.t) FLOT.splice(i, 1);
  }
}

/* ══════════ SACUDÓN ══════════
   Se aplica SÓLO a la capa del juego y no al fondo: sacudiendo el fondo
   aparecen dos franjas negras en los bordes, y eso se ve peor que no sacudir.
   Y decae rápido: un sacudón de medio segundo no es un golpe, es un terremoto. */
let SAC = 0;
function sacude(k){ SAC = Math.min(1.4, SAC + k); }
function sacPaso(dt){ if (SAC > 0) SAC = Math.max(0, SAC - dt*4.2); }
function sacAplica(){
  if (SAC <= 0.002) return false;
  const k = SAC*SAC;               /* al cuadrado: el final del sacudón se apaga
                                      y no queda un temblor largo y parejo */
  g.save();
  g.translate((Math.random() - 0.5)*26*k, (Math.random() - 0.5)*26*k);
  return true;
}

/* los tres cosméticos van con el `dt` del reloj y no con el paso fijo: son
   dibujo, así que tienen que verse igual de suaves a 30 y a 120 cuadros. La
   ventana de la racha NO está acá — vive adentro de la simulación, porque en
   dos de los cinco juegos el multiplicador es física y no puntos. */
function jugoPaso(dt){
  partPaso(dt); flotPaso(dt); sacPaso(dt);
}
function jugoPinta(){
  for (const p of PART){
    const u = 1 - p.T/p.t;
    g.globalAlpha = Math.min(1, u*1.8);
    disco(p.x, p.y, p.r*u, p.col);
  }
  g.globalAlpha = 1;
  for (const f of FLOT){
    const u = f.T/f.t;
    g.globalAlpha = Math.min(1, (1 - u)*2.2);
    /* sube y frena: con velocidad constante se lee a texto que se desliza */
    texto(f.txt, f.x, f.y - 80*(1 - (1 - u)*(1 - u)), f.tam*(1 + 0.14*(1 - u)), f.col);
    g.globalAlpha = 1;
  }
}
function jugoCero(){ PART.length = 0; FLOT.length = 0; SAC = 0; comboCero(); }
/* ══════════════════════ EL PROGRESO Y LA REJA DE NIVELES ══════════════════════
   Lo que separa un casual adictivo de un minijuego: que lo que hiciste QUEDE.
   Sin progreso guardado, un rompecabezas de doscientos niveles es el nivel 1
   doscientas veces — no hay a qué volver.

   TRES COSAS QUE ESTO TIENE QUE HACER BIEN:

   1. NO PUEDE FALLAR SI NO HAY DISCO. `localStorage` TIRA en una ventana
      privada, y esto se abre desde enlaces todo el tiempo. Todo va envuelto en
      `try`: sin disco el juego se juega igual y lo único que se pierde es el
      progreso, que es infinitamente mejor que una pantalla en blanco.
   2. LO QUE SE GUARDA ES LO MEJOR, NO LO ÚLTIMO. Rejugar un nivel que ya salió
      con tres estrellas y hacerlo con una no puede BAJARLE la nota: eso castiga
      justamente al que vuelve a jugar.
   3. EL FORMATO TIENE QUE SOBREVIVIR A UN JSON ROTO. Una versión anterior del
      juego, un dedo en la consola, media escritura: `JSON.parse` tira y ahí se
      cae el módulo entero. Va con `try` y con respaldo a vacío. */

const PROG = { est: {}, ultimo: 1 };
const P_CLAVE = 'cas_' + JUEGO.id + '_prog';

function progCarga(){
  try {
    const s = localStorage.getItem(P_CLAVE);
    if (!s) return;
    const o = JSON.parse(s);
    if (o && typeof o === 'object'){
      if (o.est && typeof o.est === 'object') PROG.est = o.est;
      if (o.ultimo) PROG.ultimo = o.ultimo|0;
    }
  } catch(e){ PROG.est = {}; PROG.ultimo = 1; }
}
function progGuarda(){
  try { localStorage.setItem(P_CLAVE, JSON.stringify(PROG)); } catch(e){}
}
/* cuántos niveles tiene este juego; los de puntaje devuelven 0 */
function progTotal(){ return JUEGO.nivelesTotal || 0; }
/* el 1 siempre está abierto; el resto pide que el anterior esté hecho */
function progAbierto(n){ return n <= 1 || PROG.est[n-1] != null; }
function progHecho(n){ return PROG.est[n] != null; }
function progEstrellas(n){ return PROG.est[n] || 0; }
/* el primero que falta: es el nivel que abre el botón JUGAR, así que quien
   vuelve al juego sigue donde estaba en vez de tener que buscarlo en la reja */
function progSiguiente(){
  const T = progTotal();
  for (let n = 1; n <= T; n++) if (!progHecho(n)) return n;
  return T;                      /* están todos: se queda en el último */
}
function progGana(n, estrellas){
  const e = Math.max(1, Math.min(3, estrellas|0));
  if (!(PROG.est[n] > e)) PROG.est[n] = e;   /* nunca baja la nota */
  PROG.ultimo = Math.max(PROG.ultimo, Math.min(progTotal(), n+1));
  progGuarda();
}
function progContados(){
  let n = 0, e = 0;
  for (const k in PROG.est){ n++; e += PROG.est[k]|0; }
  return { hechos: n, estrellas: e };
}

/* ── LA REJA SE ARMA UNA VEZ Y DESPUÉS SÓLO SE REPINTA ──
   Doscientos botones creados de nuevo en cada visita al selector son doscientos
   nodos que el navegador tiene que descartar y volver a hacer, y encima se
   pierde la posición del deslizamiento: el jugador vuelve del nivel 140 y la
   reja lo deja arriba de todo, mirando el 1. */
let _rejaHecha = false;
function rejaArma(){
  const T = progTotal();
  if (_rejaHecha || !T) return;
  const r = $('rejaN');
  r.innerHTML = '';
  for (let n = 1; n <= T; n++){
    const b = document.createElement('button');
    b.className = 'nv';
    b.dataset.n = n;
    b.innerHTML = '<span class="num">' + n + '</span><span class="es"></span>';
    b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const k = +b.dataset.n;
      if (!progAbierto(k)) return;
      son('clic');
      empieza(k);
    });
    r.appendChild(b);
  }
  /* el alto de la reja sale de lo que sobra entre el título y el botón MENÚ; en
     px y no en vh porque el marco puede ser más chico que la ventana */
  r.style.maxHeight = Math.round(caja.clientHeight * 0.66) + 'px';
  _rejaHecha = true;
}
function rejaPinta(){
  const T = progTotal();
  if (!T) return;
  const r = $('rejaN');
  for (const b of r.children){
    const n = +b.dataset.n;
    const ab = progAbierto(n), e = progEstrellas(n);
    b.classList.toggle('trabado', !ab);
    b.classList.toggle('hecho', e > 0);
    b.disabled = !ab;
    b.querySelector('.es').textContent = e ? '★'.repeat(e) : '';
  }
}
function verNiveles(){
  MODO = 'niveles';
  rejaArma();
  rejaPinta();
  verPantalla('pNiveles');
  /* deja a la vista el primero que falta: con doscientos niveles, abrir la reja
     arriba de todo obliga a deslizar medio minuto para llegar a donde uno iba */
  const b = $('rejaN').querySelector('[data-n="' + progSiguiente() + '"]');
  if (b) $('rejaN').scrollTop = Math.max(0, b.offsetTop - $('rejaN').clientHeight*0.35);
}
/* ══════════════════════ LA CINEMÁTICA ══════════════════════
   Cuatro o cinco planos de tres segundos, dibujados en el MISMO lienzo con la
   misma tinta que el juego. Nada de fotos: una imagen pegada arriba de un juego
   de dos colores se ve pegada arriba, y eso ya costó una vuelta en POMPOM.

   TRES REGLAS, Y LAS TRES SALEN DE HABERSE EQUIVOCADO ANTES:

   1. ES UNA FUNCIÓN DEL TIEMPO, NO UNA MÁQUINA DE ESTADOS. `cinePon(t)` recibe
      el segundo y dibuja. Por eso la prueba puede fotografiar el segundo 7,4
      sin esperar siete segundos, y por eso los defectos de encuadre se
      encuentran mirando un instante en vez de mirando el código.

   2. SE PUEDE SALTEAR, CON GRACIA DE MEDIO SEGUNDO. Una cinemática obligatoria
      se ve una vez; vista cinco veces es un peaje, y un minijuego se abre
      veinte veces. La gracia no es capricho: el mismo toque que apretó JUGAR
      llega a veces como un segundo evento y se la comería entera — es
      exactamente la guarda que hizo falta en BARRIO y en POMPOM.

   3. SÓLO LA PRIMERA VEZ. Después queda en su botón del menú. */
const CINE = { on: false, t: 0, dur: 0, plano: -1, gracia: 0, alTerminar: null };

function cineArranca(alTerminar){
  CINE.on = true; CINE.t = 0; CINE.plano = -1; CINE.gracia = 0.55;
  CINE.alTerminar = alTerminar || null;
  CINE.dur = JUEGO.planos.reduce((a, p) => a + p.dur, 0);
  MODO = 'cine';
  $('cine').classList.add('on');
  $('salta').classList.add('on');
  $('hud').classList.remove('on');
  for (const p of document.querySelectorAll('.pan')) p.classList.remove('on');
}
function cineSalta(){
  if (!CINE.on || CINE.gracia > 0) return;
  cineTermina();
}
function cineTermina(){
  CINE.on = false;
  $('cine').classList.remove('on');
  $('salta').classList.remove('on');
  const f = CINE.alTerminar; CINE.alTerminar = null;
  if (f) f();
}
/* qué plano cae en el segundo `t`, y cuánto lleva ese plano corrido */
function cineDonde(t){
  let acum = 0;
  for (let i = 0; i < JUEGO.planos.length; i++){
    const p = JUEGO.planos[i];
    if (t < acum + p.dur || i === JUEGO.planos.length - 1)
      return { i, p, u: Math.max(0, Math.min(1, (t - acum) / p.dur)) };
    acum += p.dur;
  }
  return { i: 0, p: JUEGO.planos[0], u: 0 };
}
function cinePon(t){
  const d = cineDonde(t);
  /* el pie se escribe SÓLO cuando cambia de plano: escribir en el DOM en cada
     cuadro obliga al navegador a recalcular el layout sesenta veces por segundo
     para poner el mismo texto */
  if (d.i !== CINE.plano){
    CINE.plano = d.i;
    $('cine').textContent = d.p.pie ? TX(d.p.pie) : '';
  }
  g.save();
  d.p.dibuja(g, d.u, t);
  g.restore();
  /* entra y sale de negro: un corte seco desde el menú se lee a error */
  const fEnt = Math.min(1, t / 0.5);
  const fSal = Math.min(1, Math.max(0, (CINE.dur - t) / 0.5));
  const k = 1 - Math.min(fEnt, fSal);
  if (k > 0.001){ g.fillStyle = 'rgba(7,7,11,' + k.toFixed(3) + ')'; g.fillRect(0, 0, AN, AL); }
}
function cinePaso(dt){
  if (CINE.gracia > 0) CINE.gracia -= dt;
  CINE.t += dt;
  if (CINE.t >= CINE.dur) cineTermina();
}

/* ── HERRAMIENTAS DE DIBUJO QUE LOS CINCO JUEGOS COMPARTEN ──
   No es una biblioteca por prolijidad: es que un redondeo o un degradado
   escritos cinco veces terminan siendo cinco cosas distintas, y entonces los
   cinco juegos dejan de verse de la misma familia. */
function caja2(x, y, w, h, r, relleno, borde){
  g.beginPath();
  const rr = Math.min(r, w/2, h/2);
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
  if (relleno){ g.fillStyle = relleno; g.fill(); }
  if (borde){ g.strokeStyle = borde; g.lineWidth = 3; g.stroke(); }
}
function texto(s, x, y, tam, col, peso, alin){
  g.fillStyle = col || '#f2eee6';
  g.font = (peso || 800) + ' ' + tam + 'px ui-sans-serif,system-ui,sans-serif';
  g.textAlign = alin || 'center';
  g.textBaseline = 'middle';
  g.fillText(s, x, y);
}
function disco(x, y, r, col){
  g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
/* el grano: lo mismo que en los juegos 3D del repo, un plano de un solo color
   se lee a plástico y con grano se lee a superficie */
function grano(x, y, w, h, k, n){
  g.save();
  for (let i = 0; i < (n || 90); i++){
    g.fillStyle = 'rgba(255,255,255,' + (Math.random()*k).toFixed(3) + ')';
    g.fillRect(x + Math.random()*w, y + Math.random()*h, 2, 2);
  }
  g.restore();
}
const suave = (u) => u*u*(3 - 2*u);
/* ══════════════════════ EL ARMADO Y EL BUCLE ══════════════════════
   Todo lo que sigue es del núcleo y ninguno de los cinco juegos lo toca. El
   contrato de un juego es corto a propósito:

       JT              las frases, por idioma
       JUEGO.tipo      'niveles' (progreso guardado) o 'puntos' (sin fin)
       JUEGO.nivelesTotal   cuántos, en los de niveles
       JUEGO.planos    la cinemática: [{dur, pie, dibuja(g,u,t)}]
       JUEGO.arranca(n)     poner el estado en cero; n = nivel
       JUEGO.paso(dt)  la simulación, en pasos de 1/60
       JUEGO.pinta(g)  el dibujo, en unidades de 720 x AL
       JUEGO.baja/mueve/sube(x,y)   el verbo
       JUEGO.marca     el número grande de arriba
       JUEGO.sub       el rótulo debajo del número (o null)
       JUEGO.ficI/ficD las dos fichas de los costados (o null)
       JUEGO.resta     0..1 para la barra de abajo, o null si no hay
       JUEGO.vivo      cuando pasa a false, se termina
       JUEGO.gano      si el nivel salió
       JUEGO.estrellas 1..3 al ganar un nivel
       JUEGO.deshacer()     y JUEGO.puedeDeshacer
       JUEGO.juegaSolo(n, azar)

   ── POR QUE HAY DOS TIPOS Y NO UNO ──
   Los tres rompecabezas necesitan progreso, reja de niveles, deshacer y
   estrellas; los dos de destreza necesitan récord y nada de eso. Metidos en un
   solo molde, cada juego arrastraría la mitad de una interfaz que no usa — y
   eso se ve: un botón DESHACER en un juego donde no hay nada que deshacer se
   lee a juego roto. El tipo decide qué interfaz existe. */

let PUNTOS = 0, MEJOR = 0;
let NIVEL = 1;

/* ── EL RÉCORD SE INTENTA GUARDAR Y PUEDE FALLAR ──
   `localStorage` TIRA en una ventana privada, y esto se abre desde enlaces. Sin
   el `try` el juego no arranca en la mitad de los casos raros, que es peor que
   no tener récord. */
const CLAVE = 'cas_' + JUEGO.id;
try { MEJOR = parseInt(localStorage.getItem(CLAVE) || '0', 10) || 0; } catch(e){}
function guardaMejor(){
  try { localStorage.setItem(CLAVE, String(MEJOR)); } catch(e){}
}
const esNiv = () => JUEGO.tipo === 'niveles';

function pintaJuego(){
  if (esNiv()){
    /* en un juego de niveles el récord no significa nada: lo que el jugador
       quiere ver es cuánto le falta y cuántas estrellas juntó */
    const c = progContados();
    $('mejor').textContent = TX('progreso', c.hechos, progTotal()) +
      (c.estrellas ? '  ·  ★ ' + c.estrellas : '');
    $('bJugar').textContent = c.hechos > 0 ? TX('seguir') : TX('jugar');
  } else {
    $('mejor').textContent = MEJOR > 0 ? TX('mejor') + ' · ' + MEJOR : '';
  }
  if (JUEGO.pintaTextos) JUEGO.pintaTextos();
}
window.pintaJuego = pintaJuego;

function verPantalla(p){
  for (const e of document.querySelectorAll('.pan')) e.classList.remove('on');
  if (p) $(p).classList.add('on');
  $('hud').classList.toggle('on', p === null);
  /* el telón se enciende con cualquier panel y se apaga en partida: en partida
     el lienzo dibuja su propio fondo y dejarlo encendido serían dos fondos
     superpuestos */
  $('tela').classList.toggle('on', p !== null);
}

/* ── LA PIEL DEL JUEGO ──
   El color de acento, el telón del menú y el emblema. Los cinco comparten la
   estructura y no la piel: cinco menús del mismo gris con el mismo panel se
   leen a cinco pantallas de opciones de la misma aplicación, y eso es lo que
   hace que ninguno se recuerde. */
function pieles(){
  const pl = (typeof PIEL !== 'undefined') ? PIEL : {};
  /* el ancho que ocupa el título es, aproximadamente, letras x (0,6 + 0,26) em:
     de ahí sale el tamaño que lo deja adentro del marco con aire a los costados */
  const L = ($('pMenu').querySelector('h1').textContent || '').trim().length || 6;
  caja.style.setProperty('--h1', Math.min(11, 78/L).toFixed(2) + 'vw');
  if (pl.ac) caja.style.setProperty('--ac', pl.ac);
  if (typeof AS === 'undefined' || !AS.img) return;
  const f = AS.img[pl.tela || 'fondo'];
  if (f) $('tela').style.backgroundImage = 'url(' + f.d + ')';
  const e = AS.img.em;
  if (e) for (const id of ['emI','emM']){ const n = $(id); n.src = e.d; n.hidden = false; }
}

function alMenu(){
  MODO = 'menu';
  musQuiere('menu');
  verPantalla('pMenu');
  pintaJuego();
}

let _vistaCine = false;
function jugar(){
  armaAudio();
  cargaSon();
  if (AUD && AUD.state === 'suspended') AUD.resume();
  if (!_vistaCine){
    _vistaCine = true;
    /* la cinemática se ve UNA vez y después va a su botón. Obligatoria en cada
       partida es un peaje, y eso ya costó una vuelta en POMPOM. */
    cineArranca(traslaCine);
    return;
  }
  traslaCine();
}
/* después de la cinemática: los de niveles van a la reja y los de puntaje
   arrancan de una. Un selector de niveles en un juego sin niveles sería una
   pantalla de más entre el dedo y el juego. */
function traslaCine(){
  if (esNiv()) verNiveles(); else empieza();
}
function empieza(n){
  /* el pie de la cinemática se apaga acá también: normalmente lo apaga
     `cineTermina`, pero la sonda que salta a un instante de la cinemática lo
     deja encendido y entonces la partida arranca con un subtítulo puesto */
  $('cine').classList.remove('on');
  $('salta').classList.remove('on');
  PUNTOS = 0;
  NIVEL = esNiv() ? (n || progSiguiente()) : 1;
  rachaCero();
  jugoCero();
  JUEGO.arranca(NIVEL);
  MODO = 'juega';
  verPantalla(null);
  musQuiere('mus');
  /* ── LOS BOTONES DE PARTIDA, Y CADA UNO SOLO SI SIRVE ──
     La fila existe en los juegos de niveles. Pero DESHACER solo tiene sentido
     donde hay algo que deshacer: en BURBUJAS un tiro ya salio y no se puede
     devolver, asi que el boton quedaba dibujado y APAGADO para siempre — y un
     boton que nunca se puede tocar no se lee a «no hay nada que deshacer», se
     lee a juego roto. Si el juego no trae `deshacer`, el boton no existe. */
  $('acc').hidden = !esNiv();
  $('bDes').hidden = !JUEGO.deshacer;
  document.body.classList.toggle('conAcc', esNiv());
  pintaHud();
}
function termina(){
  MODO = 'fin';
  musQuiere('menu');
  $('acc').hidden = true;
  document.body.classList.remove('conAcc');
  const gano = !!JUEGO.gano;
  if (esNiv()){
    const e = gano ? Math.max(1, Math.min(3, JUEGO.estrellas|0)) : 0;
    if (gano) progGana(NIVEL, e);
    son(gano ? 'gana' : 'pierde');
    musAgacha(0.30, 1.4);
    $('finT').textContent = gano ? TX('ganaste') : TX('perdiste');
    const es = $('estr');
    es.hidden = !gano;
    if (gano) es.textContent = '★'.repeat(e) + '☆'.repeat(3-e);
    $('finP').textContent = TX('nivel') + ' ' + NIVEL +
      (JUEGO.finP ? '  ·  ' + JUEGO.finP : '');
    /* OTRA VEZ pasa a ser SIGUIENTE cuando el nivel salió: repetir un nivel que
       ya salió es lo último que quiere hacer alguien que lo acaba de pasar */
    const hayMas = gano && NIVEL < progTotal();
    $('bOtra').textContent = hayMas ? TX('proximo') : TX('otra');
    $('bOtra').dataset.sig = hayMas ? '1' : '';
  } else {
    const rec = PUNTOS > MEJOR;
    if (rec){ MEJOR = PUNTOS; guardaMejor(); }
    son(rec ? 'gana' : 'pierde');
    musAgacha(0.30, 1.4);
    $('estr').hidden = true;
    $('finT').textContent = rec ? TX('nuevoRec') : (gano ? TX('finBien') : TX('finMal'));
    $('finP').textContent = PUNTOS + ' ' + TX('pts') +
      (MEJOR > 0 ? '  ·  ' + TX('mejor') + ' ' + MEJOR : '');
    if (COMBO.max > 3) $('finP').textContent += '  ·  ' + TX('racha') + ' ' + COMBO.max;
    $('bOtra').textContent = TX('otra');
    $('bOtra').dataset.sig = '';
  }
  verPantalla('pFin');
  pintaJuego();
}

function pintaHud(){
  $('marca').textContent = JUEGO.marca != null ? JUEGO.marca : PUNTOS;
  $('sub').textContent = JUEGO.sub != null ? JUEGO.sub
    : (esNiv() ? TX('nivel') + ' ' + NIVEL : TX('pts'));
  /* las dos fichas de los costados: cada juego pone lo que cambia adentro del
     nivel y las apaga con null. Escribirlas siempre dejaría un rótulo vacío
     dibujado, que se lee a hueco y no a ficha apagada. */
  for (const [id, v] of [['ficI', JUEGO.ficI], ['ficD', JUEGO.ficD]]){
    const e = $(id);
    e.hidden = v == null;
    if (v != null) e.textContent = v;
  }
  const b = $('bDes');
  if (b) b.disabled = !JUEGO.puedeDeshacer;
  const r = JUEGO.resta;
  const rel = $('reloj');
  rel.style.display = r == null ? 'none' : 'block';
  if (r != null){
    const bb = $('relojB');
    bb.style.width = (Math.max(0, Math.min(1, r))*100).toFixed(1) + '%';
    bb.classList.toggle('poco', r < 0.25);
  }
}

/* el fogonazo: va en CSS y no en el lienzo a propósito, porque tiene que poder
   encenderse en el mismo cuadro en que pasa algo sin esperar al dibujo */
let _flash = 0;
function fogonazo(v){ _flash = Math.max(_flash, v); }
function pasoFogonazo(dt){
  if (_flash <= 0) return;
  _flash = Math.max(0, _flash - dt*4.2);
  $('flash').style.opacity = _flash.toFixed(3);
}

function bucle(){
  requestAnimationFrame(bucle);
  const ahora = performance.now();
  let dt = Math.min((ahora - _ultimo)/1000, 0.25);
  _ultimo = ahora;

  if (!CONGELADO){
    if (MODO === 'cine'){
      cinePaso(dt);
    } else if (MODO === 'juega' && !PAUSA){
      _acum += dt;
      let n = 0;
      while (_acum >= PASO && n < 8){ JUEGO.paso(PASO); _acum -= PASO; n++; }
      if (n >= 8) _acum = 0;      /* si el aparato no llega, va en cámara lenta y no se cuelga */
      if (!JUEGO.vivo) termina();
    }
    pasoFogonazo(dt);
    if (MODO === 'juega' || MODO === 'fin') jugoPaso(dt);
  }

  g.clearRect(0, 0, AN, AL);
  if (MODO === 'cine') cinePon(CINE.t);
  else if (JUEGO.fondo) JUEGO.fondo(g);
  if (MODO === 'juega' || MODO === 'fin'){
    /* el sacudón envuelve SÓLO la capa del juego: sacudiendo el fondo aparecen
       dos franjas negras en los bordes */
    const sac = sacAplica();
    JUEGO.pinta(g);
    jugoPinta();
    if (sac) g.restore();
  }
  if (MODO === 'juega') pintaHud();

  _cuadros++; _acumF += dt;
  if (_acumF >= 0.5){ fps = Math.round(_cuadros/_acumF); _cuadros = 0; _acumF = 0; }
}

/* ══════════════════════ LOS BOTONES ══════════════════════ */
for (const b of document.querySelectorAll('[data-lang]'))
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    ponIdioma(b.dataset.lang);
    if (MODO === 'idioma') alMenu();
  });
$('bJugar').addEventListener('click', (e) => { e.stopPropagation(); jugar(); });
$('bComo').addEventListener('click', (e) => { e.stopPropagation(); cineArranca(alMenu); });
$('bMenu').addEventListener('click', (e) => { e.stopPropagation(); alMenu(); });
$('bNMenu').addEventListener('click', (e) => { e.stopPropagation(); alMenu(); });
$('bOtra').addEventListener('click', (e) => {
  e.stopPropagation();
  /* SIGUIENTE avanza el nivel; OTRA VEZ repite el mismo */
  empieza(esNiv() ? (NIVEL + ($('bOtra').dataset.sig ? 1 : 0)) : undefined);
});
$('bDes').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!JUEGO.puedeDeshacer) return;
  son('clic'); JUEGO.deshacer(); pintaHud();
});
$('bRei').addEventListener('click', (e) => { e.stopPropagation(); son('clic'); empieza(NIVEL); });
$('bSal').addEventListener('click', (e) => {
  e.stopPropagation(); son('clic');
  /* salir de un nivel vuelve A LA REJA y no al menú: el jugador quiere elegir
     otro nivel, no volver a la portada */
  if (esNiv()) verNiveles(); else alMenu();
});

/* ══════════════════════ SONDAS ══════════════════════
   Todo lo que el banco necesita, y nada que el juego use. Un juego que se
   prueba sólo mirando capturas se prueba mal: acá se puede jugar solo, saltar a
   un instante de la cinemática y leer el estado. */
/* el arnes de pruebas inyecta su propio `__errs` en el <head>, o sea ANTES de que
   este modulo se evalue: pisandolo con un array nuevo se perderian justamente los
   errores del arranque, que son los que importan */
window.__errs = window.__errs || [];
addEventListener('error', (e) => window.__errs.push(String(e.message)));
addEventListener('unhandledrejection', (e) => window.__errs.push('promesa: ' + e.reason));

window.__J = {
  id: JUEGO.id,
  estado: () => JSON.stringify({ modo: MODO, puntos: PUNTOS, mejor: MEJOR, nivel: NIVEL,
    marca: JUEGO.marca, resta: JUEGO.resta == null ? null : +JUEGO.resta.toFixed(3),
    vivo: !!JUEGO.vivo, fps, esc: +ESC.toFixed(3), lienzo: [lienzo.width, lienzo.height],
    /* el ultimo toque que ENTRO por el camino de verdad (lienzo -> baja): es lo
       unico que distingue «el juego no reacciono» de «el dedo no llego» */
    toque: [Math.round(TOQUE.x), Math.round(TOQUE.y), TOQUE.abajo, TOQUE.n || 0] }),
  lang: (l) => { ponIdioma(l); return LANG; },
  menu: () => { alMenu(); return MODO; },
  jugar: () => { jugar(); return MODO; },
  empieza: () => { empieza(); return MODO; },
  /* la cinemática en un instante exacto, CONGELADA. Sin congelar, entre que la
     sonda escribe el segundo y el navegador entrega la foto el bucle ya la
     corrió y la captura sale de otro instante — es el defecto que ya costó una
     vuelta en BARRIO y otra en PULSO. */
  /* Y APAGA EL FOGONAZO ANTES DE CONGELAR. `pasoFogonazo` corre dentro del
     `if (!CONGELADO)`, asi que congelando con el fogonazo a medio apagar el
     velo blanco de CSS QUEDA PUESTO para siempre: medido, una foto de la
     cinematica sacada justo despues de un golpe salia con un 6 % de blanco
     encima —el fondo pasaba de 28 a 43— y yo lo lei como que el plano estaba
     mal iluminado. El pixel del lienzo daba 28 en los dos casos. Una sonda que
     deja un velo encima no fotografia lo que le piden. */
  /* ── Y APAGA EL HUD, QUE ES LO QUE `cineArranca` HACE Y LA SONDA NO HACIA ──
     Medido en la foto del segundo plano: el marcador, el rotulo PUNTOS, el
     multiplicador y la ficha de la derecha quedaban DIBUJADOS ENCIMA de la
     cinematica, porque la sonda saltaba desde una partida y nadie apagaba el
     HUD. En el juego de verdad no pasa nunca; en la foto parecia un defecto de
     la cinematica. Una sonda que no reproduce el estado del juego fotografia
     otra cosa. */
  cine: (t) => { armaAudio(); CINE.on = true; MODO = 'cine'; CINE.gracia = 9e9;
                 _flash = 0; $('flash').style.opacity = '0';
                 $('hud').classList.remove('on'); $('acc').hidden = true;
                 CINE.dur = JUEGO.planos.reduce((a,p) => a+p.dur, 0);
                 CINE.t = Math.max(0, Math.min(CINE.dur - 0.01, t));
                 CONGELADO = true;
                 for (const p of document.querySelectorAll('.pan')) p.classList.remove('on');
                 $('cine').classList.add('on');
                 cinePon(CINE.t);
                 return JSON.stringify({ t: +CINE.t.toFixed(2), dur: +CINE.dur.toFixed(2),
                                         plano: CINE.plano, pie: $('cine').textContent }); },
  correr: () => { CONGELADO = false; return true; },
  /* toca en unidades de diseño, por el mismo camino que un dedo */
  toca: (x, y) => { if (JUEGO.baja) JUEGO.baja(x, y);
                    if (JUEGO.sube) JUEGO.sube(x, y);
                    return JSON.stringify({ puntos: PUNTOS, vivo: !!JUEGO.vivo }); },
  /* ── UN ARRASTRE OCUPA TIEMPO, Y ESO HUBO QUE MEDIRLO ──
     La primera version solo llamaba a `mueve` veinte veces seguidas, sin
     simular. Sirve para un juego que reacciona en el evento —RASPA borra la
     mugre ahi mismo— y NO SIRVE para uno cuyo movimiento vive en `paso`:
     medido en MANCHA, el dedo dejaba el destino puesto, la mancha no se movia
     ni un pixel y el arrastre devolvia 0 %. Y no fallaba: contestaba.
     Ahora cada muestra adelanta la simulacion, que es lo que pasa de verdad
     cuando un dedo cruza la pantalla en un tercio de segundo. */
  arrastra: (x0, y0, x1, y1, n, pasos) => {
    const N = n || 20, P = pasos == null ? 2 : pasos;
    if (JUEGO.baja) JUEGO.baja(x0, y0);
    for (let i = 1; i <= N; i++){
      if (JUEGO.mueve) JUEGO.mueve(x0 + (x1-x0)*i/N, y0 + (y1-y0)*i/N);
      for (let k = 0; k < P && JUEGO.vivo; k++) JUEGO.paso(PASO);
    }
    if (JUEGO.sube) JUEGO.sube(x1, y1);
    return JSON.stringify({ puntos: PUNTOS, vivo: !!JUEGO.vivo });
  },
  /* avanza la simulación sin dibujar: así una partida de cuarenta segundos se
     prueba en un instante y no en cuarenta segundos */
  avanza: (segs) => { const n = Math.round(segs*60);
                      for (let i = 0; i < n && JUEGO.vivo; i++) JUEGO.paso(PASO);
                      return JSON.stringify({ vivo: !!JUEGO.vivo, puntos: PUNTOS,
                                              resta: JUEGO.resta == null ? null : +JUEGO.resta.toFixed(3) }); },
  pico: () => pico(),
  combo: () => JSON.stringify({ n: COMBO.n, mult: COMBO.mult, max: COMBO.max,
    t: +COMBO.t.toFixed(2), part: PART.length, flot: FLOT.length, sac: +SAC.toFixed(2) }),
  assets: () => JSON.stringify(asEstado()),
  /* la caja de cada elemento visible del DOM, para poder comprobar que nada se
     solapa en una pantalla chica sin mirar una captura */
  cajas: () => {
    const out = {};
    for (const id of ['marca','sub','ficI','ficD','reloj','acc','cine','finT','finP','mejor','estr','tituN','rejaN']){
      const e = $(id); if (!e) continue;
      const r = e.getBoundingClientRect();
      /* «visible» tiene que incluir que MIDA algo: un elemento adentro de un
         panel con `display:none` devuelve una caja de 0×0 y decía visible */
      /* ── LA OPACIDAD SE MULTIPLICA HASTA EL MARCO ──
         Mirando solo el panel mas cercano, los elementos del HUD daban
         `vis:true` con el HUD entero en `opacity:0`: medido en la foto de la
         cinematica, la sonda informaba el marcador visible cuando en pantalla
         no habia nada. La opacidad de un antepasado apaga a todos sus hijos, y
         acá los hijos son justamente lo que se quiere medir. */
      let op = 1;
      for (let a = e; a && a !== document.body; a = a.parentElement){
        const cs = getComputedStyle(a);
        if (cs.display === 'none' || cs.visibility === 'hidden'){ op = 0; break; }
        op *= +cs.opacity;
      }
      const vis = r.width > 0 && r.height > 0 && op > 0.02;
      out[id] = { x: Math.round(r.left), y: Math.round(r.top),
                  w: Math.round(r.width), h: Math.round(r.height), vis };
    }
    return JSON.stringify(out);
  },
  /* el marcador se pone en cero antes de cada corrida: `arranca()` no lo toca
     —lo hace `empieza()`— asi que dos corridas seguidas informaban el puntaje
     de la anterior y el numero mentia sin que nada fallara */
  juegaSolo: (n, azar) => { PUNTOS = 0; rachaCero();
    return JSON.stringify(JUEGO.juegaSolo ? JUEGO.juegaSolo(n || 3000, azar) : 'sin auto'); },
  /* ── LAS SONDAS DE PROGRESO ──
     Sin esto, probar el nivel 140 obliga a jugar los 139 anteriores, o sea que
     no se prueba nunca. `nivel(n)` entra derecho; `prog()` dice qué quedó
     guardado; `borra()` deja el disco limpio para que dos corridas seguidas no
     se contaminen — que es el defecto que ya hizo que un puntaje mintiera. */
  nivel: (n) => { empieza(n); return JSON.stringify({ modo: MODO, nivel: NIVEL,
                    marca: JUEGO.marca, vivo: !!JUEGO.vivo }); },
  niveles: () => { verNiveles(); return JSON.stringify({ modo: MODO,
                    total: progTotal(), abiertos: (() => { let k = 0;
                      for (let i = 1; i <= progTotal(); i++) if (progAbierto(i)) k++;
                      return k; })() }); },
  prog: () => JSON.stringify({ tipo: JUEGO.tipo, total: progTotal(),
    sig: progSiguiente(), est: PROG.est, cont: progContados(), mejor: MEJOR }),
  borra: () => { PROG.est = {}; PROG.ultimo = 1; MEJOR = 0;
                 try { localStorage.removeItem(P_CLAVE); localStorage.removeItem(CLAVE); } catch(e){}
                 return true; },
  /* el auditor de niveles: cada juego de niveles comprueba que los suyos SE
     PUEDEN pasar. Un nivel generado y no comprobado es un nivel roto que
     todavia no se sabe — costo siete niveles imposibles en Maicol. */
  audita: (desde, hasta) => JSON.stringify(
    JUEGO.audita ? JUEGO.audita(desde || 1, hasta || progTotal()) : 'sin auditoria'),
  deshacer: () => { if (!JUEGO.puedeDeshacer) return 'no'; JUEGO.deshacer();
                    return JSON.stringify({ marca: JUEGO.marca, puede: !!JUEGO.puedeDeshacer }); },
  /* la sonda propia de cada juego: el estado de su tablero sin tener que mirar
     una captura. Es lo unico que distingue «se ve raro» de un numero. */
  ver: () => JSON.stringify(JUEGO.ver ? JUEGO.ver() : 'sin ver'),
  /* ── LOS AJUSTES DEL BANCO PASAN POR ACA Y NO POR `eval` ──
     Barri la escala de las frutas con `eval('F_KR='+k)` desde el banco y los
     cuatro valores dieron EXACTAMENTE el mismo resultado —el mismo puntaje
     hasta la unidad y las mismas 1.428 sueltas—, que es la firma de un
     parametro que no toca nada. La causa: esto es un modulo ES, asi que sus
     `let` de nivel superior NO estan en el ambito global y un `eval` desde
     afuera crea otra variable con el mismo nombre. La medicion no medio nada y
     no fallo: contesto.
     Un ajuste tiene que entrar por una funcion que viva ADENTRO del modulo. */
  cfg: (o) => JSON.stringify(JUEGO.cfg ? JUEGO.cfg(o || {}) : 'sin cfg'),
  /* ── LOS SOLAPAMIENTOS SE CUENTAN, NO SE MIRAN ──
     `cajas()` devuelve las cajas y hay que cruzarlas a mano, y eso es
     exactamente lo que no se hace: el reloj de BURBUJAS estuvo dibujado ENCIMA
     de la fila de botones y lo vi en una captura y no en un numero. Esto
     devuelve los pares que se pisan, asi que un elemento nuevo que caiga sobre
     otro se denuncia solo en la proxima corrida. */
  solapes: () => {
    const ids = ['marca','sub','ficI','ficD','reloj','acc','cine','estr',
                 'finT','finP','mejor','tituN','rejaN'];
    const cajas = [];
    for (const id of ids){
      const e = $(id); if (!e) continue;
      const r = e.getBoundingClientRect();
      let op = 1;
      for (let a = e; a && a !== document.body; a = a.parentElement){
        const cs = getComputedStyle(a);
        if (cs.display === 'none' || cs.visibility === 'hidden'){ op = 0; break; }
        op *= +cs.opacity;
      }
      if (!(r.width > 0 && r.height > 0 && op > 0.02)) continue;
      /* ── LA CAJA QUE IMPORTA ES LA DEL TEXTO, NO LA DEL ELEMENTO ──
         `#marca` va `left:0;right:0` con el texto centrado, asi que su caja
         mide el ancho entero del marco y las dos fichas de los costados caen
         adentro sin tocar una sola letra. La primera version denunciaba tres
         choques por juego que no existen —y una sonda que grita en falso es
         peor que no tener sonda, porque el proximo choque de verdad se lee como
         mas ruido—. Con un `Range` sobre el contenido se obtiene lo que de
         verdad se pinta. Es el mismo error que ya costo una medicion en BARRIO
         con la caja alineada a los ejes. */
      let caja = r;
      if (e.firstChild){
        try {
          const rg = document.createRange();
          rg.selectNodeContents(e);
          const rt = rg.getBoundingClientRect();
          if (rt.width > 1 && rt.height > 1) caja = rt;
        } catch(err){}
      }
      cajas.push([id, caja]);
    }
    const out = [];
    for (let i = 0; i < cajas.length; i++) for (let j = i+1; j < cajas.length; j++){
      const [ai, a] = cajas[i], [bi, b] = cajas[j];
      const w = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      /* dos pixeles de tolerancia: un borde que toca al de al lado no es un
         solapamiento, y con tolerancia cero cualquier par apilado da positivo */
      if (w > 2 && h > 2) out.push(ai + '/' + bi + ' ' + Math.round(w) + 'x' + Math.round(h));
    }
    return JSON.stringify({ visibles: cajas.map(c => c[0]), choques: out });
  }
};

/* ── LA VENTANA DE LA RACHA SE ADELANTA CON LA SIMULACIÓN, NO CON EL DIBUJO ──
   Estaba en `jugoPaso`, que corre una vez por CUADRO con el `dt` de reloj. Para
   las partículas y el sacudón eso es correcto —son cosméticos— pero la racha
   NO es cosmética: en MANCHA engorda la brocha y en RASPÁ el pincel, o sea que
   es física. Y peor: los auto-jugadores llaman a `JUEGO.paso` directo, así que
   la ventana no se vencía nunca y el multiplicador se quedaba clavado en x5 —
   medido, `racha 622` en una partida de 45 s de MANCHA y `7.882` en RASPÁ, que
   son números que ninguna persona puede hacer.
   Envolver `JUEGO.paso` una vez es lo único que garantiza que la racha caduque
   en los seis caminos que existen (el bucle, `avanza`, y los cinco
   auto-jugadores) sin repetir la llamada en cada juego. Es el mismo recurso con
   el que `d.js` envuelve `son()`. */
const _pasoJuego = JUEGO.paso.bind(JUEGO);
JUEGO.paso = (dt) => { comboPaso(dt); _pasoJuego(dt); };
