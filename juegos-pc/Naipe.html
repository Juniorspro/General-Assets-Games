/* ============================================================
   LA MESA

   Mientras se elige, muestra las cartas elegidas en grande; al
   tirar, las mismas cartas puntuando una por una. Es la misma
   funcion porque es la misma fila: cambiando de sitio entre la
   vista previa y la jugada, la mano "salta" justo cuando hay que
   mirarla.
   ============================================================ */
function pintaMesa(){
  const A = JU.anim;
  const cs = A ? A.r.cuentan : (JU.sel.length ? JU.sel.map(i => JU.mano[i]) : []);
  const todas = A ? A.cs : cs;
  if (!todas.length){
    txt(T('elegiCiega'), AN / 2, MESA_Y + MESA_H / 2, 11, '#4f615e', 'center', 700);
    return;
  }
  const w = 76, h = 108;
  const paso = Math.min(w + 10, (AN - 24 - w) / Math.max(1, todas.length - 1));
  const x0 = (AN - (w + paso * (todas.length - 1))) / 2;
  const y = MESA_Y + 22;
  todas.forEach((c, i) => {
    const vivo = !A || A.brilla === c;
    const cuenta = cs.indexOf(c) >= 0;
    pintaCarta(x0 + paso * i, y, w, h, c,
               { alza: vivo && A ? 10 : 0, muerta: A ? !cuenta : false });
  });
  /* el numerito que sale de la carta que acaba de puntuar */
  if (A && A.pop && A.popT > 0){
    const i = todas.indexOf(A.brilla);
    const px = x0 + paso * Math.max(0, i) + w / 2;
    const a = Math.min(1, A.popT / .30);
    CX.globalAlpha = a;
    txtB(A.pop, px, y - 14 - (1 - a) * 16, 17, A.popC, 'center', 900);
    CX.globalAlpha = 1;
  }
  if (A && A.fin){
    txtB('+' + A.r.total, AN / 2, MESA_Y + MESA_H - 14, 26, '#ffd166', 'center', 900);
  }
}

/* ============================================================
   LA ANIMACION DE PUNTUAR

   Recorre el mismo `log` que devolvio `puntua`, asi que lo que se
   ve sumar ES lo que se sumo: con una cuenta propia, la animacion
   podria terminar en un numero distinto del que el juego ya cobro.
   ============================================================ */
const ANIM_PASO = 0.15, ANIM_FIN = 0.75;
function animArranca(r, cs){
  const M = MANOS[r.tipo];
  const ev = [];
  r.log.forEach(L => ev.push({ t:'c', L }));
  r.comLog.forEach(L => ev.push({ t:'j', L }));
  JU.anim = {
    r, cs, ev, i: -1, t: 0, fin: false,
    f: M.f + M.df * (r.lv - 1), m: M.m + M.dm * (r.lv - 1),
    brilla: null, pop: '', popC: '#fff', popT: 0,
  };
}
function animPaso(dt){
  const A = JU.anim; if (!A) return;
  A.t += dt;
  if (A.popT > 0) A.popT -= dt;
  if (A.fin){
    if (A.t >= ANIM_FIN){ JU.anim = null; tiraCierra(); }
    return;
  }
  while (A.t >= ANIM_PASO && A.i < A.ev.length - 1){
    A.t -= ANIM_PASO;
    A.i++;
    const e = A.ev[A.i];
    if (e.t === 'c'){
      const L = e.L;
      A.brilla = L.c;
      if (L.nada){ A.pop = '—'; A.popC = '#6e7f7c'; son('mal'); }
      else {
        A.f += L.df; A.m += L.dm;
        if (L.dm > 0){ A.pop = '+' + Math.round(L.dm * 100) / 100; A.popC = '#fe5f55'; son('mult'); }
        else          { A.pop = '+' + Math.round(L.df);            A.popC = '#3fa9f5'; son('ficha'); }
      }
    } else {
      const L = e.L;
      A.f += L.df; A.m += L.dm;
      A.brilla = null;
      A.pop = (L.dm ? '+' + Math.round(L.dm * 100) / 100 : '+' + Math.round(L.df));
      A.popC = '#ffd166'; son('comodin');
      avisa(tt('comN', L.k));
    }
    A.popT = .32;
  }
  if (A.i >= A.ev.length - 1 && A.t >= ANIM_PASO){
    A.fin = true; A.t = 0; A.f = A.r.fichas; A.m = A.r.mult;
    son(A.r.total >= JU.objetivo ? 'gana' : 'ficha');
  }
}
/* lo que pasa DESPUES de la animacion, que es donde el juego avanza */
function tiraCierra(){
  JU.jugadas = [];
  if (gano()){
    JU.modo = 'puntua';
    JU.pago = pagoRonda();
    son('gana');
  } else if (perdio()){
    JU.modo = 'fin';
    finMuestra(false);
  }
}

function pintaTienda(){
  pintaFieltro();
  txtB(T('tienda'), 14, 28, 18, '#ffd166', 'left');
  txtB('$' + JU.dinero, AN - 14, 28, 20, '#ffd166', 'right');

  /* lo que ya se tiene, arriba: comprar sin ver las ranuras que
     quedan es comprar a ciegas */
  pintaComodines();
  const Tn = JU.tienda; if (!Tn) return;

  /* los dos articulos */
  const w = 150, h = 176, y = 172;
  const x0 = (AN - (w * 2 + 12)) / 2;
  Tn.it.forEach((it, i) => {
    const x = x0 + (w + 12) * i;
    if (it.ido){ pintaRanura(x, y, w, h, true); return; }
    pintaPanel(x, y, w, h);
    if (it.t === 'comodin') pintaComodin(x + 22, y + 14, w - 44, 104, it.k, {});
    else                    pintaCons(x + 30, y + 14, w - 60, 104, { t:it.t, k:it.k }, {});
    const d = it.t === 'comodin' ? tt('comD', it.k)
            : it.t === 'tarot'   ? tt('tarD', it.k)
            : T('planeta', tt('manosN', it.k));
    envuelve(d, x + w / 2, y + 132, w - 14, 8.5, '#93a3a0');
    const pu = JU.dinero >= it.pre;
    pintaBoton(x + 30, y + h - 34, w - 60, 26, '$' + it.pre, '#6ece8a', !pu);
    zona('compra', x, y, w, h, i);
  });

  /* los sobres */
  const sw = 150, sh = 62, sy = y + h + 14;
  Tn.sobres.forEach((s, i) => {
    const x = x0 + (sw + 12) * i;
    if (s.ido){ pintaRanura(x, sy, sw, sh, true); return; }

    txt(tt('sobreN', s.k), x + sw / 2, sy + 22, 10, '#c47bff', 'center', 900);
    const pu = JU.dinero >= s.pre;
    pintaBoton(x + 30, sy + 34, sw - 60, 20, '$' + s.pre, '#c47bff', !pu);
    zona('sobre', x, sy, sw, sh, i);

  /* reroll y salida */

  zona('salirTienda', AN - 164, by, 150, 44);

  /* los consumibles y el boton de vender, que solo existe con un
     comodin elegido: un boton de vender siempre visible es una
     venta accidental esperando */
  pintaConsumibles();

    pintaBoton(bx, byy, 160, 38, T('vender') + '  $' + pre, '#fe5f55', false);
    zona('vender', bx, byy, 160, 38);

}

/* ============================================================
   EL DEDO
   ============================================================ */
function toca(px, py){
  if (typeof tutoToque === 'function' && tutoToque(px, py)) return;
  const z = zonaEn(px, py);
  if (!z) { COM_SEL = -1; pista(''); return; }
  son('ui');
  switch (z.id){
    case 'carta': {
      const i = z.dat, k = JU.sel.indexOf(i);
      if (k >= 0) JU.sel.splice(k, 1);
      else if (JU.sel.length < SEL_MAX) JU.sel.push(i);
      else { avisa(T('elegiCartas', SEL_MAX)); return; }
      son('elige');
      break;
    }
    case 'jugar':     accionTira();     break;
    case 'descartar': accionDescarta(); break;
    case 'orden':     ordena(ORDEN_MANO === 'rango' ? 'palo' : 'rango'); son('baraja'); break;
    case 'com':
      COM_SEL = COM_SEL === z.dat ? -1 : z.dat;
      pista(tt('comN', JU.com[z.dat]) + ' · ' + tt('comD', JU.com[z.dat]));
      break;
    case 'cons':      accionCons(z.dat); break;
    case 'ciegaVa':   JU.modo = 'juega'; pista(''); break;
    case 'aTienda':   cieganCierra(); COM_SEL = -1; break;
    case 'compra':
      if (!tiendaCompra(z.dat)) avisa(JU.dinero < JU.tienda.it[z.dat].pre ? T('sinPlata') : T('sinSitio'));
      else son('compra');
      break;
    case 'sobre':
      if (!sobreCompra(z.dat)) avisa(T('sinPlata'));
      else { JU.modo = 'sobre'; son('compra'); }
      break;
    case 'sobreOp':
      if (!sobreElige(z.dat)) avisa(T('sinSitio'));
      else { son('compra'); if (JU.sobre.hechas >= JU.sobre.elige){ JU.sobre = null; JU.modo = 'tienda'; } }
      break;
    case 'sobreSale': JU.sobre = null; JU.modo = 'tienda'; break;
    case 'reroll':    if (tiendaReroll()) son('baraja'); break;
    case 'vender': {
      const k = JU.com[COM_SEL];
      JU.dinero += Math.max(1, Math.floor((COM[k].pre || 4) / 2));
      JU.com.splice(COM_SEL, 1); COM_SEL = -1; son('plata');
      break;
    }
    case 'salirTienda': vaCiega(); break;
    case 'pausa':     pausaAbre(); break;
  }
}

function accionTira(){
  const cs = JU.sel.map(i => JU.mano[i]);
  const r = tira(cs);
  if (!r){ avisa(T('elegiCartas', SEL_MAX)); son('mal'); return; }
  animArranca(r, cs);
  son('carta');
}
function accionDescarta(){
  const cs = JU.sel.map(i => JU.mano[i]);
  if (!descarta(cs)){ son('mal'); return; }
  son('baraja');
}
/* Un consumible se usa con lo que este elegido: el tarot pide
   cartas y el planeta no, y `consUsa` ya sabe cual es cual. */
function accionCons(i){
  const C = JU.cons[i];
  const cs = JU.sel.map(k => JU.mano[k]);
  if (!consUsa(i, cs)){
    const T2 = C.t === 'tarot' ? TAROT[C.k] : null;
    avisa(T2 ? T('elegiCartas', T2.sel) : T('sinSitio'));
    son('mal');
    return;
  }
  son(C.t === 'planeta' ? 'sube' : 'compra');
  if (C.t === 'planeta') avisa(T('planeta', tt('manosN', C.k)));
  ordena();
}

/* --- pasar de la tienda a la ciega siguiente --- */
function vaCiega(){
  cieganNueva();
  JU.modo = 'ciega';
  COM_SEL = -1;
  if (JU.ante > 8){ JU.modo = 'fin'; finMuestra(true); }
}

/* ============================================================
   EL TUTORIAL

   Cinco pasos, y CADA UNO ESPERA A QUE SE HAGA LA COSA. Un
   tutorial que se pasa leyendo se saltea, y lo que se saltea es
   exactamente lo que despues no se entiende — la leccion que este
   repo ya pago en MEKO, FLECHAS y RezUno.

   De ahi sale la decision que ordena el archivo entero: EL
   TUTORIAL NO SE COME LOS TOQUES. `tutoToque` devuelve true
   unicamente sobre su propio boton de saltear; todo lo demas pasa
   de largo al juego, porque el juego es lo que hay que hacer.

   Y ningun paso puede quedarse trabado: cada condicion tiene una
   salida por si el camino que esperaba no ocurre (la ciega se gana
   con la primera mano y no hay ocasion de descartar, o se pierde y
   no hay tienda). Un tutorial trabado es peor que ninguno.
   ============================================================ */

const TUTO = { on:false, i:0, t:0, fin:0, mem:{ man:0, desc:0 } };

function tutoArranca(){
  TUTO.on = true; TUTO.fin = 0;
  tutoEntra(0);
}
function tutoCorta(){
  TUTO.on = false; TUTO.fin = 0;
  GUARDA.visto = 1; guardaEscribe();
}
/* al entrar a un paso se guarda contra QUE se compara: los
   contadores del juego son acumulados, asi que "descarto" es
   "bajo respecto de cuando el paso empezo" y no un numero fijo */
function tutoEntra(i){
  TUTO.i = i; TUTO.t = 0;
  TUTO.mem.man = JU.totManos;
  TUTO.mem.desc = JU.desc;
}

/* La condicion de cada paso. El `||` de la segunda parte es la
   salida: si el juego se fue del sitio donde ese paso se podia
   hacer, el paso se da por hecho en vez de esperar para siempre. */
const TUTO_LISTO = [
  () => JU.totManos > TUTO.mem.man,
  () => (JU.ultima && !JU.anim) || JU.modo !== 'juega',
  () => JU.desc < TUTO.mem.desc || JU.modo !== 'juega',
  () => JU.modo === 'tienda' || JU.modo === 'fin',
  () => JU.modo === 'ciega' || JU.modo === 'juega' || JU.modo === 'fin',
];

/* Donde mirar en cada paso. Se calcula y no se escribe a mano:
   los botones y la mano salen de las mismas constantes que los
   dibujan, asi que mover el HUD no deja al tutorial senalando
   un sitio vacio. */
function tutoFoco(){
  const w = 116;
  /* un contorno latiendo sobre una pantalla donde esa cosa no se
     esta dibujando senala un sitio vacio, asi que el foco se apaga
     cuando su blanco no esta en pantalla */
  const enMesa = JU.modo === 'juega';
  const enFila = JU.modo === 'juega' || JU.modo === 'ciega';
  switch (TUTO.i){
    case 0: case 1: case 2: if (!enMesa) return null; break;
    case 3: if (!enFila) return null; break;
  }
  switch (TUTO.i){
    case 0: return [10, MANO_Y - ALZA - 4, AN - 20, MANO_H + ALZA + 8];
    case 1: return [10, PUN_Y, AN - 20, PUN_H];
    case 2: return [AN - 12 - w, BOT_Y, w, BOT_H];
    case 3: return [10, COM_Y, AN - 20, COM_H];
    default: return null;
  }
}
/* la ficha se va al lado contrario del foco: un cartel encima de
   la cosa que el cartel manda a mirar no ensena nada */
const TUTO_Y = [300, 604, 300, 300, 392];

const TUTO_BW = 120, TUTO_BH = 34;
function tutoSaltarCaja(){ return [AN - 12 - TUTO_BW, 12, TUTO_BW, TUTO_BH]; }

function tutoPaso(dt){
  if (!TUTO.on) return;
  TUTO.t += dt;
  if (TUTO.fin > 0){
    TUTO.fin -= dt;
    if (TUTO.fin <= 0) tutoCorta();
    return;
  }
  /* medio segundo de piso antes de mirar la condicion: si no, un
     paso cuya condicion ya esta cumplida al entrar pasa de largo
     sin que a nadie le de tiempo de leerlo */
  if (TUTO.t < 0.5) return;
  if (!TUTO_LISTO[TUTO.i]()) return;
  son('sube');
  if (TUTO.i >= TUTO_LISTO.length - 1){ TUTO.fin = 1.6; return; }
  tutoEntra(TUTO.i + 1);
}

function tutoPinta(){
  if (!TUTO.on) return;
  const f = TUTO_FIN_VER();
  if (f) return;

  /* el foco: un contorno que late. No se oscurece el resto —
     con un velo encima, las cartas que hay que elegir se leen
     apagadas justo cuando hay que elegirlas */
  const fo = tutoFoco();
  if (fo){
    const k = 0.5 + 0.5 * Math.sin(JU.t * 4.4);
    CX.save();
    CX.strokeStyle = '#ffd166';
    CX.globalAlpha = 0.45 + 0.45 * k;
    CX.lineWidth = 3;
    rr(fo[0] - 3, fo[1] - 3, fo[2] + 6, fo[3] + 6, 12);
    CX.stroke();
    CX.restore();
  }

  tutoFicha(TUTO_TXT()[TUTO.i], (TUTO.i + 1) + '/' + TUTO_LISTO.length);

  const b = tutoSaltarCaja();
  pintaBoton(b[0], b[1], b[2], b[3], T('saltar'), '#93a3a0', false);
}

/* el cierre: la misma ficha, sin numero y sin boton */
function TUTO_FIN_VER(){
  if (TUTO.fin <= 0) return false;
  tutoFicha(T('tutoFin'), '');
  return true;
}

const TUTO_TXT = () => (LANG[IDIOMA] && LANG[IDIOMA].tuto) || LANG.es.tuto;

function tutoFicha(s, num){
  const w = AN - 48, x = 24;
  const y = TUTO.fin > 0 ? 392 : TUTO_Y[TUTO.i];
  /* el alto sale de cuantas lineas entran de verdad: en tres
     idiomas la misma frase mide distinto y un alto fijo deja la
     ultima linea afuera o media ficha vacia */
  const ls = envuelveLineas(s, w - 28, 15, 700);
  const h = 22 + ls.length * 20 + (num ? 16 : 0);
  CX.save();
  CX.shadowColor = 'rgba(0,0,0,.55)'; CX.shadowBlur = 16; CX.shadowOffsetY = 4;
  caja(x, y, w, h, 14, '#161d20', '#ffd166', 2);
  CX.restore();
  if (num) txt(num, x + w - 14, y + 16, 9, '#ffd166', 'right', 900);
  ls.forEach((l, i) => txt(l, x + w / 2, y + 26 + i * 20 + (num ? 8 : 0), 15,
                           '#f4f1e8', 'center', 700));
}

/* SOLO el boton de saltear se come el toque. Todo lo demas tiene
   que llegar al juego: el paso se aprueba haciendo la cosa. */
function tutoToque(px, py){
  if (!TUTO.on || TUTO.fin > 0) return false;
  const b = tutoSaltarCaja();
  if (px >= b[0] && px <= b[0] + b[2] && py >= b[1] && py <= b[1] + b[3]){
    son('ui');
    tutoCorta();
    return true;
  }
  return false;
}

/* ============================================================
   LOS PANELES

   El DOM de este juego es cuatro paneles y nada mas: idioma,
   menu, pausa y final. Todo lo demas se dibuja en el lienzo, asi
   que hay UN solo sistema de toque — y estos cuatro son
   justamente lo que tiene que ser texto de verdad, porque se
   traduce y tiene que leerse nitido en cualquier densidad.
   ============================================================ */

function verPanel(id){
  document.querySelectorAll('.pan').forEach(p => p.classList.toggle('on', p.id === id));
}

/* ---------- idioma ----------
   Se pregunta ANTES del menu. Elegir el idioma dentro de un menu
   ya escrito en un idioma que no entendes no sirve: para cuando
   lo encontras ya leiste todo lo demas sin entenderlo. */
const IDIOMAS = [['es', 'ESPAÑOL'], ['en', 'ENGLISH'], ['pt', 'PORTUGUÊS']];

function idiomaArma(){
  const l = $('#idL');
  l.innerHTML = '';
  IDIOMAS.forEach(([k, n]) => {
    const b = document.createElement('button');
    b.className = 'b'; b.textContent = n;
    b.onclick = () => { ponIdioma(k); alMenu(); };
    l.appendChild(b);
  });
}
function ponIdioma(k){
  IDIOMA = k;
  GUARDA.idioma = k; guardaEscribe();
  pintaIdioma();
}

/* UNA sola funcion repinta TODO el texto del DOM. Escrito boton
   por boton donde se arma cada panel, cambiar de idioma con un
   panel ya abierto lo deja en el anterior — el defecto que en Z
   Force costo 107 claves. */
function pintaIdioma(){
  $('#idT').textContent = T('idT');
  $('#mSub').textContent = T('sub');
  $('#mJugar').textContent = T('jugar');
  $('#mTuto').textContent = T('tuto');
  $('#mIdioma').textContent = T('idioma');
  $('#pie').textContent = T('pie');
  $('#mRec').textContent = GUARDA.rec ? T('rec', GUARDA.rec) : '';
  $('#paT').textContent = T('paT');
  $('#paSigue').textContent = T('sigue');
  $('#paMenu').textContent = T('menu');
  $('#fiOtra').textContent = T('otra');
  $('#fiMenu').textContent = T('menu');
  /* el panel de final se repinta con SU estado guardado y no con
     el del juego: al terminar una corrida el estado ya se reseteo,
     asi que leerlo de JU mostraria la partida siguiente */
  if (FIN.vista) finEscribe();
}

/* ---------- menu ---------- */
function alMenu(){
  JU.modo = 'menu';
  TUTO.on = false;
  DEMO = false;
  pintaIdioma();
  verPanel('pMenu');
}

function juegaArranca(conTuto){
  partidaNueva();
  cieganNueva();
  JU.modo = 'ciega';
  COM_SEL = -1;
  FIN.vista = false;
  verPanel('');
  if (conTuto) tutoArranca(); else TUTO.on = false;
}

/* ---------- pausa ---------- */
let MODO_PREV = 'juega';
function pausaAbre(){
  if (JU.modo === 'pausa') return;
  MODO_PREV = JU.modo;
  JU.modo = 'pausa';
  son('ui');
  verPanel('pPausa');
}
function pausaCierra(){
  JU.modo = MODO_PREV;
  verPanel('');
}

/* ---------- final ---------- */
const FIN = { vista:false, gano:false, ante:0, manos:0, dinero:0, mejor:0 };

function finMuestra(gano){
  FIN.vista = true;
  FIN.gano = gano;
  FIN.ante = JU.ante;
  FIN.manos = JU.totManos;
  FIN.dinero = JU.dinero;
  FIN.mejor = JU.mejorMano;
  if (JU.ante > GUARDA.rec){ GUARDA.rec = JU.ante; guardaEscribe(); }
  son(gano ? 'gana' : 'pierde');
  finEscribe();
  verPanel('pFin');
}
function finEscribe(){
  const t = $('#fiT');
  t.textContent = FIN.gano ? T('gana') : T('muerto');
  t.className = FIN.gano ? 'bien' : 'mal';
  $('#fiS').textContent = FIN.gano ? T('ganaS') : T('muertoS');
  $('#fiD').textContent = T('fiD', FIN.ante, FIN.manos, FIN.dinero, FIN.mejor);
}

/* ---------- cableado ---------- */
function panelesArma(){
  idiomaArma();
  $('#mJugar').onclick  = () => { audioDespierta(); juegaArranca(!GUARDA.visto); };
  $('#mTuto').onclick   = () => { audioDespierta(); juegaArranca(true); };
  $('#mIdioma').onclick = () => verPanel('pIdioma');
  $('#paSigue').onclick = () => pausaCierra();
  $('#paMenu').onclick  = () => alMenu();
  $('#fiOtra').onclick  = () => juegaArranca(false);
  $('#fiMenu').onclick  = () => alMenu();
  /* el idioma guardado salta la primera pantalla; la primera vez
     no hay ninguno y hay que preguntar */
  if (GUARDA.idioma){ IDIOMA = GUARDA.idioma; pintaIdioma(); alMenu(); }
  else { pintaIdioma(); verPanel('pIdioma'); }
}

/* ============================================================
   EL RELOJ Y EL DEDO

   Paso fijo con interpolacion: un telefono a 30 y una notebook a
   144 tienen que jugar el mismo juego. Aca casi nada se integra
   —es un juego de cartas— pero los relojes que SI corren (la
   animacion de puntuar, el aviso, el tutorial, la demo del menu)
   tienen que durar lo mismo en los dos, y eso no sale solo.
   ============================================================ */
const PASO = 1 / 60, PASO_TOPE = 0.25, PASOS_MAX = 8;
let ACUM = 0, T_ANT = performance.now() / 1000;

function ajusta(){
  const esc = Math.min(innerWidth / AN, innerHeight / AL);
  $('#marco').style.transform = 'translate(-50%,-50%) scale(' + esc + ')';
  const d = Math.min(devicePixelRatio || 1, 2.5);
  CV.width = Math.round(AN * d);
  CV.height = Math.round(AL * d);
  CX.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', ajusta);

/* ---------- el dedo ----------
   UNA sola entrada. El marco esta escalado, asi que las
   coordenadas salen de la caja que el navegador informa y no de
   una cuenta con el factor: con la cuenta a mano, el dia que
   cambie el encuadre el dedo y el dibujo dejan de coincidir. */
function aCuadro(cx, cy){
  const r = CV.getBoundingClientRect();
  return [(cx - r.left) * AN / r.width, (cy - r.top) * AL / r.height];
}
CV.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioDespierta();
  if (JU.modo === 'menu' || JU.modo === 'pausa' || JU.modo === 'fin') return;
  const [x, y] = aCuadro(e.clientX, e.clientY);
  toca(x, y);
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && (JU.modo === 'juega' || JU.modo === 'tienda')) pausaAbre();
});

/* ---------- la demo del menu ----------
   Un panel opaco encima de una mesa quieta tira a la basura lo
   unico que este menu tiene para mostrar. Corre el juego de
   verdad, jugado por el mismo bot que lo audita — asi no hay una
   segunda animacion que mantener — y con DEMO puesto, que es lo
   que impide que la demo toque el record ni el guardado. */
let DEMO_T = 0;
const DEMO_RITMO = 1.15;
function demoArranca(){
  DEMO = true;
  partidaNueva(Math.floor(Math.random() * 1e6));
  cieganNueva();
  DEMO_T = 0;
}
function demoPaso(dt){
  if (JU.modo !== 'menu' && JU.modo !== 'pausa') return;
  DEMO_T += dt;
  if (DEMO_T < DEMO_RITMO) return;
  DEMO_T = 0;
  if (JU.modo === 'pausa') return;
  if (JU.anim) return;
  if (JU.mano.length === 0 || JU.ante > 8 || perdio()){ demoArranca(); return; }
  const j = mejorJugada();
  if (!j){ demoArranca(); return; }
  /* la MISMA cuota que el auditor: contra el objetivo entero
     ninguna primera mano llega nunca y la demo quemaria los tres
     descartes de arrancada. Con dos cerebros distintos, el menu
     muestra un juego que el auditor no esta midiendo. */
  const cuota = (JU.objetivo - JU.puntaje) / Math.max(1, JU.manos);
  if (JU.desc > 0 && j.total < cuota && JU.manos > 1){
    const fuera = botDescarte();
    if (fuera.length){ JU.sel = []; descarta(fuera); return; }
  }
  /* la demo ELIGE y despues tira, con un tiempo en el medio: sin
     eso las cartas aparecen ya jugadas y no se ve que alguien las
     esta eligiendo, que es lo unico que este menu tiene que decir */
  if (JU.sel.length === 0){
    JU.sel = j.cs.map(c => JU.mano.indexOf(c)).filter(i => i >= 0);
    return;
  }
  const cs = JU.sel.map(i => JU.mano[i]);
  const r = tira(cs);
  if (r) animArranca(r, cs);
  else JU.sel = [];
}

/* ---------- la vuelta ---------- */
function vuelta(){
  requestAnimationFrame(vuelta);
  const t = performance.now() / 1000;
  let dt = t - T_ANT; T_ANT = t;
  if (dt > PASO_TOPE) dt = PASO_TOPE;
  ACUM += dt;
  let n = 0;
  while (ACUM >= PASO && n++ < PASOS_MAX){
    ACUM -= PASO;
    JU.t += PASO;
    aviPaso(PASO);
    animPaso(PASO);
    tutoPaso(PASO);
    demoPaso(PASO);
  }
  /* el menu dibuja la mesa detras del velo, asi que la demo tiene
     que pintarse con el mismo pintor del juego y no con uno propio */
  const m = JU.modo;
  if (m === 'menu' || m === 'pausa'){
    const g = JU.modo;
    JU.modo = (m === 'pausa') ? MODO_PREV : 'juega';
    pinta();
    JU.modo = g;
  } else {
    pinta();
  }
}

/* ============================================================
   LAS SONDAS
   ============================================================ */
function zonaCentro(id, dat){
  for (const z of ZONAS){
    if (z.id !== id) continue;
    if (dat !== undefined && z.dat !== dat) continue;
    return [z.x + z.w / 2, z.y + z.h / 2];
  }
  return null;
}
window.__naipe = {
  est: () => ({
    modo: JU.modo, ante: JU.ante, ronda: JU.ronda, ciega: CIEGAS[JU.ciegaIx].id,
    jefe: JU.jefe, dinero: JU.dinero, manos: JU.manos, desc: JU.desc,
    puntaje: JU.puntaje, objetivo: JU.objetivo, mano: JU.mano.length,
    com: JU.com.slice(), cons: JU.cons.map(c => c.t + ':' + c.k),
    sel: JU.sel.slice(), anim: !!JU.anim, tuto: TUTO.on ? TUTO.i : -1,
    idioma: IDIOMA, rec: GUARDA.rec,
  }),
  /* EL CAMINO DEL DEDO. Se busca la zona donde el juego la dibujo
     y se toca su centro: una sonda que llama a la accion directo
     saltea justamente la parte que puede estar rota. */
  zonas: () => ZONAS.map(z => z.id + (z.dat !== undefined ? ':' + z.dat : '')),
  toc: (id, dat) => {
    const c = zonaCentro(id, dat);
    if (!c) return { err: 'sin ' + id, hay: ZONAS.map(z => z.id) };
    toca(c[0], c[1]);
    return { ok: true, en: c };
  },
  tocXY: (x, y) => { toca(x, y); return true; },
  /* elegir cartas por indice, que es lo que hace el dedo */
  elige: is => { is.forEach(i => { const c = zonaCentro('carta', i); if (c) toca(c[0], c[1]); });
                 return JU.sel.slice(); },
  /* adelantar el reloj sin dibujar: la animacion de puntuar dura
     mas de un segundo y esperarla con sleep cuesta la corrida */
  corre: seg => {
    let n = Math.round(seg / PASO);
    while (n-- > 0){ JU.t += PASO; aviPaso(PASO); animPaso(PASO); tutoPaso(PASO); demoPaso(PASO); }
    return window.__naipe.est();
  },
  pinta: () => { pinta(); return true; },
  modo: m => { JU.modo = m; pinta(); return JU.modo; },
  panel: id => { verPanel(id); return id; },
  tuto: () => ({ on: TUTO.on, i: TUTO.i, t: +TUTO.t.toFixed(2), fin: +TUTO.fin.toFixed(2),
                 txt: TUTO.on ? TUTO_TXT()[TUTO.i] : '' }),
  juega: (n, modo, tope) => audita(n || 8, modo || 'honesto', tope || 8),
  manos: () => auditaManos(),
  assets: () => ({ hay: Object.keys(IMG).length, fallan: (IMG.fallan || []).slice(),
                   son: MUESTRAS ? Object.keys(MUESTRAS).length : 0 }),
  son: k => { son(k); return k; },
  lang: k => { ponIdioma(k); pinta(); return IDIOMA; },
  /* cuanto cuesta un cuadro. Sin numero no hay afirmacion. */
  costo: (n) => {
    n = n || 60;
    const t0 = performance.now();
    for (let i = 0; i < n; i++) pinta();
    return { ms: +((performance.now() - t0) / n).toFixed(3), zonas: ZONAS.length };
  },
  /* solapamientos del DOM: los cuatro paneles y nada mas, porque
     todo lo demas vive en el lienzo */
  cajas: () => {
    const p = document.querySelector('.pan.on');
    if (!p) return { panel: null, choques: [], fuera: [] };
    const hs = [...p.querySelectorAll('h1,h2,.sub,.dat,button,#pie')]
      .filter(e => e.offsetWidth > 0)
      .map(e => ({ id: e.id || e.className, t: e.offsetTop, h: e.offsetHeight,
                   l: e.offsetLeft, w: e.offsetWidth }));
    const ch = [], fu = [];
    for (let i = 0; i < hs.length; i++){
      const a = hs[i];
      if (a.t < 0 || a.t + a.h > AL || a.l < 0 || a.l + a.w > AN) fu.push(a.id);
      for (let j = i + 1; j < hs.length; j++){
        const b = hs[j];
        if (a.t < b.t + b.h && b.t < a.t + a.h && a.l < b.l + b.w && b.l < a.l + a.w)
          ch.push(a.id + '×' + b.id);
      }
    }
    return { panel: p.id, n: hs.length, choques: ch, fuera: fu };
  },
};

/* ============================================================
   ARRANQUE
   ============================================================ */
window.__errs = [];
addEventListener('error', e => window.__errs.push(String(e.message)));
addEventListener('unhandledrejection', e => window.__errs.push('promesa: ' + e.reason));

guardaLee();
ajusta();
imgCarga();
sonDecodifica();
panelesArma();
demoArranca();
vuelta();
</script>
