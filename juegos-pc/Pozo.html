    if (!fuera && hip(P.x-b.x, P.y-b.y) < J_R + b.r){ BALA_D = hip(b.x-b.x0, b.y-b.y0); BALA_N.pega++; danoJug(b.d, b.de); BALA_D = -1; fuera = true; }
    if (fuera){ esquirlas(b.x, b.y, b.col, 2); JU.eba.splice(i,1); }
  }
}

function pasoEfectos(dt){
  for (let i = JU.par.length-1; i >= 0; i--){
    const p = JU.par[i];
    p.t -= dt;
    if (p.tipo !== 'aro'){
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= Math.pow(.02, dt); p.vy *= Math.pow(.02, dt);
      p.a += p.va*dt;
    }
    if (p.t <= 0) JU.par.splice(i,1);
  }
  for (let i = JU.flot.length-1; i >= 0; i--){
    const f = JU.flot[i];
    f.t -= dt; f.y += f.vy*dt; f.vy *= Math.pow(.05, dt);
    if (f.t <= 0) JU.flot.splice(i,1);
  }
  JU.fog  = Math.max(0, JU.fog - dt*4.5);
  JU.rojo = Math.max(0, JU.rojo - dt*2.2);
  JU.sac  = Math.max(0, JU.sac - dt*46);
  JU.sacX = (Math.random()*2-1) * JU.sac;
  JU.sacY = (Math.random()*2-1) * JU.sac;
  if (JU.puerta > 0) JU.puerta = Math.max(0, JU.puerta - dt*1.6);
}

/* ---------- EL PASO ---------- */
function paso(dt){
  if (JU.modo !== 'juega') return;
  JU.seg += dt;
  /* el hitstop y la camara lenta escalan dt para TODO, asi que el
     auto-jugador los paga igual que el dedo */
  if (JU.hitstop > 0){ JU.hitstop -= dt; dt *= .14; }
  else if (JU.lento > 0){ JU.lento -= dt; dt *= .34; }
  JU.t += dt;
  if (BOT.on) botPaso(dt);
  tutPaso(dt);
  pasoJugador(dt);
  if (JU.modo !== 'juega') return;      // pudo morir o bajar de piso
  pasoEnem(dt);
  pasoBalas(dt);
  pasoEfectos(dt);
}

/* ELEGIR MEJORA ES UNA DECISION DEL JUEGO, no un sorteo. Estaba escrita cinco
   veces —al azar en juega(), siempre la 0 en las otras cuatro sondas y al azar en
   la demo— asi que el bot "honesto" tiraba a la moneda la unica decision que el
   juego le pide entre piso y piso. Con una sola funcion no puede haber dos
   criterios, y el del azar sigue siendo el control. */
const MEJ_PREF = ['dano','cad','esq','vel','bala','rec','ener'];
function mejorElige(modo){
  if (!MEJ_OPC.length) return 0;
  if (modo === 'azar') return (Math.random() * MEJ_OPC.length) | 0;
  const P = JU.P, falta = P.vidaMax - P.vida;
  const ix = id => MEJ_OPC.findIndex(m => m.id === id);
  /* cura llena al maximo y vida sube el techo curando uno: con la barra baja
     manda la cura, con la barra llena manda el techo */
  if (falta >= 2 && ix('cura') >= 0) return ix('cura');
  if (ix('vida') >= 0) return ix('vida');
  if (falta >= 1 && ix('cura') >= 0) return ix('cura');
  for (const id of MEJ_PREF){ const i = ix(id); if (i >= 0) return i; }
  return 0;
}

/* ---------- bajar, morir, ganar ---------- */
function bajaPiso(){
  son('baja');
  if (JU.piso >= PISOS){ gana(); return; }
  JU.modo = 'mejora';
  MEJ_OPC = [];
  const pool = MEJORAS.slice();
  /* CON LA BARRA BAJA, UNA DE LAS TRES ES CURA. No es un regalo: curarse sigue
     costando la mejora del piso, o sea que se paga con no crecer. Lo que saca es
     la VARIANZA DEL SORTEO — cura y vida son 2 de 9, asi que el 42% de los pisos
     no ofrecia ninguna forma de recuperar, y eso mataba corridas buenas por una
     tirada y no por como se jugo. */
  if (JU.P.vida <= JU.P.vidaMax - 2){
    const i = pool.findIndex(m => m.id === 'cura');
    if (i >= 0) MEJ_OPC.push(pool.splice(i, 1)[0]);
  }
  while (MEJ_OPC.length < 3 && pool.length)
    MEJ_OPC.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  pintaMejoras();
  verPan('#pMejora');
}
function eligeMejora(i){
  const m = MEJ_OPC[i]; if (!m) return;
  m.f(JU.P);
  son('mejora');
  JU.modo = 'juega';
  verPan(null);
  entraPiso(JU.piso + 1, (Math.random()*1e9)|0);
  hudPinta();
}
function gana(){
  JU.gano = true; JU.modo = 'fin';
  GUARDA.rec = Math.max(GUARDA.rec, PISOS); guardaEscribe();
  son('gana');
  pintaFin(); verPan('#pFin');
}
function pierde(){
  JU.gano = false; JU.modo = 'fin';
  GUARDA.rec = Math.max(GUARDA.rec, JU.piso); guardaEscribe();
  esquirlas(JU.P.x, JU.P.y, '#8ce0ff', 20);
  son('pierde');
  pintaFin(); verPan('#pFin');
}

/* ============================================================
   EL AUTO-JUGADOR. Escribe en ENT, o sea que entra por el mismo
   sitio que el dedo: si termina el juego, el juego se termina.
   ============================================================ */
function rutaSalas(desde, hasta){
  const P = JU.pisoObj;
  const pre = {}; pre[desde] = -1;
  const q = [desde];
  for (let i = 0; i < q.length; i++){
    const s = P.salas[q[i]];
    if (q[i] === hasta) break;
    for (const k in s.vec){
      const j = s.vec[k];
      if (pre[j] === undefined){ pre[j] = q[i]; q.push(j); }
    }
  }
  if (pre[hasta] === undefined) return [];
  const r = []; let c = hasta;
  while (c !== desde){ r.unshift(c); c = pre[c]; }
  return r;
}

/* CUANTO PEGA UN ARMA POR SEGUNDO. UNA cuenta y la usan el bot, el cartel del
   cofre y la sonda: con dos, el cartel diria una cosa y el bot elegiria otra.
   Es una aproximacion y conviene decirlo: cuenta los `n` perdigones como si
   los cinco pegaran, asi que sobrestima a la escopeta y a la cruz de lejos.
   Para decidir "esto es mejor que lo que llevo" alcanza; para balancear las
   diez armas entre si, no. */
const dps = i => { const A = ARMAS[i]; return A.d * A.n / A.c; };

/* SI VALE LA PENA IR A ESE COFRE. UNA puerta y TRES que la llaman —el destino
   entre salas, el destino dentro de la sala y el dedo del bot— porque con la
   condicion repartida el bot camina hasta un cofre que despues no abre y se
   queda plantado ahi para siempre: medido asi, el piso medio se derrumbo de
   6,04 a 2,96 con las mejores armas que el juego llego a darle. Decir que no
   tiene que significar SEGUIR. */
const cofreVale = c => !!c && !c.abierto && dps(ARMA_ID[c.arma]) > dps(JU.P.arma);

/* ---------- COMO SE MUEVE EL BOT ----------
   NO alcanza con mirar 62 px adelante y probar ocho angulos: eso es un
   buscador de minimos locales, y medido se clavaba DOSCIENTOS cuadros
   contra un muro interior con la sala limpia y la puerta a cinco metros
   (sala 0 del piso 1, ENT.x=1 empujando contra la celda 6,8). La sala es
   una reja de 11x17: un campo de distancias es exacto y cuesta nada.

   EL CAMPO SALE DE bloq(), o sea LA MISMA cuenta que frena al jugador.
   Con dos, el bot caminaria por un mapa que no es el que choca — y que
   llegue no probaria que se puede llegar. */
function haceCampo(s, tx, ty){
  const d = new Int16Array(SALA_W * SALA_H).fill(-1);
  if (bloq(s, tx, ty)) return d;
  const q = [ty * SALA_W + tx]; d[q[0]] = 0;
  for (let i = 0; i < q.length; i++){
    const c = q[i], x = c % SALA_W, y = (c / SALA_W) | 0;
    for (const L of LADOS){
      const nx = x + L.dx, ny = y + L.dy;
      if (nx < 0 || ny < 0 || nx >= SALA_W || ny >= SALA_H) continue;
      const k = ny * SALA_W + nx;
      if (d[k] >= 0 || bloq(s, nx, ny)) continue;
      d[k] = d[c] + 1; q.push(k);
    }
  }
  return d;
}
/* DOS CACHES Y NO UNA. El bot y los bichos piden campos con destinos
   distintos en el mismo cuadro: con una sola, cada llamada pisa a la otra
   y el BFS se rehace dos veces por cuadro para nada. */
function campoCache(C, s, tx, ty){
  const lim = s.limpia ? 1 : 0;
  if (C.s === s && C.cx === tx && C.cy === ty && C.lim === lim) return C.d;
  C.s = s; C.cx = tx; C.cy = ty; C.lim = lim; C.d = haceCampo(s, tx, ty);
  return C.d;
}
const BOTC = {s:null, cx:-1, cy:-1, lim:-1, d:null};
const ENEC = {s:null, cx:-1, cy:-1, lim:-1, d:null};
const botCampo = (s, tx, ty) => campoCache(BOTC, s, tx, ty);
const eneCampo = (s, tx, ty) => campoCache(ENEC, s, tx, ty);

/* baja `n` vecinos por el campo y devuelve la celda a la que hay que ir.
   Devuelve null si la celda de origen no tiene camino al destino. */
function bajaCampo(d, cx, cy, n){
  if (cx < 0 || cy < 0 || cx >= SALA_W || cy >= SALA_H) return null;
  if (d[cy*SALA_W + cx] < 0) return null;
  let x = cx, y = cy;
  for (let paso = 0; paso < n; paso++){
    let mx = -1, my = -1, mv = d[y*SALA_W + x];
    for (const L of LADOS){
      const nx = x + L.dx, ny = y + L.dy;
      if (nx < 0 || ny < 0 || nx >= SALA_W || ny >= SALA_H) continue;
      const v = d[ny*SALA_W + nx];
      if (v >= 0 && v < mv){ mv = v; mx = nx; my = ny; }
    }
    if (mx < 0) break;
    x = mx; y = my;
    if (mv === 0) break;
  }
  return {x, y};
}

/* ---------- LINEA DE VISTA ----------
   Es la MISMA cuenta que mata una bala (`bloq`), no una parecida: con dos,
   el bot decidiria que tiene tiro donde la bala choca, o al reves. Se
   muestrea cada 10 px y la celda mide 48, asi que no se saltea ninguna. */
function visto(s, ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay, L = Math.sqrt(dx*dx + dy*dy);
  const n = Math.max(1, Math.ceil(L / 10));
  for (let i = 1; i < n; i++){
    const x = ax + dx*i/n, y = ay + dy*i/n;
    if (bloq(s, Math.floor(x/CELDA), Math.floor(y/CELDA))) return false;
  }
  return true;
}

/* mira si hay pared en una direccion antes de meterse de cabeza */
function botLibre(dx, dy){
  const P = JU.P, s = JU.sala;
  for (let t = 20; t <= 62; t += 14){
    if (bloq(s, Math.floor((P.x+dx*t)/CELDA), Math.floor((P.y+dy*t)/CELDA))) return false;
  }
  return true;
}
function botVa(tx, ty){
  const P = JU.P;
  let dx = tx-P.x, dy = ty-P.y;
  const d = hip(dx,dy) || 1; dx /= d; dy /= d;
  if (!botLibre(dx,dy)){
    for (const g of [.6,-.6,1.2,-1.2,1.9,-1.9,2.6,-2.6]){
      const c = Math.cos(g), sn = Math.sin(g);
      const nx = dx*c - dy*sn, ny = dx*sn + dy*c;
      if (botLibre(nx,ny)){ dx = nx; dy = ny; break; }
    }
  }
  ENT.x = dx; ENT.y = dy;
}

/* va a una CELDA por el campo, bajando de a un vecino. Se apunta dos
   celdas adelante y no una: apuntando a la de al lado el rumbo cambia
   noventa grados en cada borde y el cuerpo va a los tirones. */
function botCelda(tx, ty){
  const P = JU.P, s = JU.sala;
  tx = Math.max(0, Math.min(SALA_W-1, tx|0));
  ty = Math.max(0, Math.min(SALA_H-1, ty|0));
  const cx = Math.floor(P.x/CELDA), cy = Math.floor(P.y/CELDA);
  if (cx === tx && cy === ty){ botVa((tx+.5)*CELDA, (ty+.5)*CELDA); return; }
  const c = bajaCampo(botCampo(s, tx, ty), cx, cy, 2);
  if (!c){ botVa((tx+.5)*CELDA, (ty+.5)*CELDA); return; }   // no hay camino
  botVa((c.x+.5)*CELDA, (c.y+.5)*CELDA);
}
function botPunto(px, py){
  botCelda(Math.floor(px/CELDA), Math.floor(py/CELDA));
}

function botPaso(dt){
  const P = JU.P, s = JU.sala;
  BOT.t += dt;
  ENT.fuego = false; ENT.esq = false; ENT.usar = false; ENT.x = 0; ENT.y = 0;

  if (BOT.modo === 'azar'){
    if (BOT.t > .40){ BOT.t = 0; BOT.dir = Math.random()*6.2832; }
    ENT.x = Math.cos(BOT.dir); ENT.y = Math.sin(BOT.dir);
    ENT.fuego = Math.random() < .6;
    ENT.usar = Math.random() < .05;
    return;
  }

  /* --- honesto --- */
  ENT.fuego = true;
  /* NO SE TOMA UN ARMA PEOR. `P.arma = ARMA_ID[s.cofre.arma]` toma lo que haya
     a ciegas, asi que cambiar la cruz (95,7) por el orbe (27,3) es legal y
     triplica lo que dura cada sala. Medido al enrutar el bot al cofre sin este
     filtro: el piso 4 salia con `orbe:6` y el piso medio BAJO de 6,04 a 5,38 —
     o sea que ir al cofre sin mirar cuesta mas de lo que da. */
  ENT.usar = cofreVale(JU.sala.cofre) || !JU.sala.cofre;

  /* EL AVISO ES LA VENTANA, Y EL BOT NO LA JUGABA. Un bicho cuerpo a cuerpo se
     queda QUIETO mientras avisa y resuelve el golpe al terminar contra su
     alcance: salirse de ahi es la respuesta y es la mitad del juego. El bot
     solo reaccionaba a las BALAS, asi que contra baba, corredor, bomba y
     bruto se comia el golpe siempre — medido, 1,91 de vida por mil pasos. */
  let av = null, ad = 1e9;
  for (const e of JU.enemV){
    if (!e.vivo || e.avisa <= 0) continue;
    const D = ENEM[e.cl];
    if (D.f > 0 && !D.expl) continue;        // ese tira, no pega
    /* el radio que importa es el de SU golpe: la bomba revienta en 78 y un
       baba pega en 26, asi que un solo numero esquivaria de mas o de menos */
    const alc = (D.expl || D.a) + J_R + 10;
    const d = hip(e.x-P.x, e.y-P.y);
    /* 30 px de margen: una esquiva recorre 71, asi que disparandola al borde
       del golpe se sale con aire y no se gasta el enfriamiento de gusto */
    if (d > alc + 30) continue;
    if (d < ad){ ad = d; av = e; }
  }
  if (av){
    const dx = P.x-av.x, dy = P.y-av.y, l = hip(dx,dy) || 1;
    ENT.x = dx/l; ENT.y = dy/l;
    /* LA ESQUIVA NO SE GASTA SI CAMINANDO ALCANZA, y es una cuenta: el bicho
       pega al terminar el aviso contra SU alcance, asi que hay que estar mas
       lejos que `alc` para entonces. Caminando se recorre vel*avisa. Gastarla
       de gusto contra un baba deja al bot sin esquiva para la bala que si le
       iba a dar — y desde el piso 3 las dos cosas pasan a la vez. */
    const alcAv = (ENEM[av.cl].expl || ENEM[av.cl].a) + J_R + 10;
    const llego = ad + J_VEL * P.mVel * av.avisa;
    if (llego < alcAv + 14 && P.esqCd <= 0) ENT.esq = true;
    return;
  }

  /* LA BALA QUE HAY QUE ESQUIVAR ES LA QUE VA A PEGAR, no la que se acerca.
     Con "se acerca" el bot gastaba la esquiva en balas que pasaban a dos
     cuerpos de distancia; con dos tiradores en abanico eso es la mitad de los
     disparos. Se calcula el punto de paso mas cercano —t = -(r·v)/|v|²— y se
     mide el TIEMPO que falta, no los pixeles: una bala de 300 px/s y una de 640
     no dan el mismo aviso a la misma distancia. */
  let peligro = null, pt = 1e9;
  for (const b of JU.eba){
    const rx = P.x-b.x, ry = P.y-b.y;
    const v2 = b.vx*b.vx + b.vy*b.vy; if (v2 < 1) continue;
    const t = (rx*b.vx + ry*b.vy) / v2;
    if (t <= 0 || t > .55) continue;                 // ya paso, o falta demasiado
    const mx = rx - b.vx*t, my = ry - b.vy*t, m = hip(mx,my);
    if (m > J_R + b.r + 10) continue;                // pasa de largo
    if (t < pt){ pt = t; peligro = b; b.mx = mx; b.my = my; b.m = m; }
  }
  if (peligro){
    /* PARA QUE LADO SALIRSE, y es UNA cuenta para los dos casos. El vector que
       va del punto de paso de la bala al cuerpo (`m`) apunta justo para donde
       hay que irse: alejarse del eje. Con la bala derecho al centro ese vector
       es ruido, y ahi recien se cae al perpendicular con el signo de la
       velocidad que ya se traia — girar 180 grados a mitad de camino tira a la
       basura lo que se venia acumulando. */
    const lv = hip(peligro.vx, peligro.vy) || 1;
    let nx, ny;
    if (peligro.m > 3){ nx = peligro.mx/peligro.m; ny = peligro.my/peligro.m; }
    else {
      nx = -peligro.vy/lv; ny = peligro.vx/lv;
      if (nx*P.vx + ny*P.vy < 0){ nx = -nx; ny = -ny; }
    }
    if (P.esqCd <= 0){ ENT.esq = true; ENT.x = nx; ENT.y = ny; return; }
    /* SIN ESQUIVA TAMBIEN SE SALE, CAMINANDO. Medido: de 292 balas que pegaron,
       288 llegaron con la esquiva en enfriamiento y CERO llegaron tarde — o sea
       que la esquiva anda y lo que faltaba es la respuesta para cuando no esta.
       Y alcanza de sobra: el pasillo peligroso mide 27 px de ancho y caminando
       se recorren 113 en los 0,55 s de la ventana. Sin esto el bot se caia al
       bloque de pelea y seguia orbitando con una bala encima. */
    botVa(P.x + nx*90, P.y + ny*90);
    return;
  }

  /* UN CORAZON EN EL PISO SOLO EXISTE SI YA TE PEGARON: `caeBotin` no suelta
     nada con la barra llena. Asi que levantarlo no es un desvio, es la otra
     mitad de la economia del piso — y el bot no la jugaba: no hay UNA linea
     sobre `s.cor` en todo `botPaso`. Medido, el piso 5 cobraba 6,29 y curaba
     0,71, o sea que lo que se levantaba era de casualidad, pasandole por
     encima mientras se orbitaba. Un auto-jugador que se saltea una mecanica
     entera no esta midiendo el juego que se juega.
     CON LA SALA LIMPIA SE VA SIEMPRE —es gratis, el corazon no se vence— y
     PELEANDO solo si falta mas de uno y hay linea limpia: cruzar la sala a
     ciegas por media curacion cuesta mas de lo que devuelve. */
  if (s.cor && P.vida < P.vidaMax){
    let cc = null, cd = 1e9;
    for (const c of s.cor){
      if (c.tomado) continue;
      const d = hip(c.x-P.x, c.y-P.y);
      if (d < cd){ cd = d; cc = c; }
    }
    if (cc && (s.limpia || (P.vida <= P.vidaMax-2 && visto(s, P.x, P.y, cc.x, cc.y)))){
      /* EL ULTIMO TRAMO VA DERECHO AL CORAZON Y NO A SU CELDA. `botPunto` deja
         en el CENTRO de la celda y el radio de levantar son 26 px sobre una
         celda de 48: un corazon contra la esquina de su celda queda a 34 y no
         se levanta nunca — el bot llegaria, se plantaria encima y no lo tomaria. */
      if (cd < 70) botVa(cc.x, cc.y); else botPunto(cc.x, cc.y);
      return;
    }
  }

  if (!s.limpia){
    /* pelear: sostener distancia del mas cercano */
    let m = null, md = 1e9;
    for (const e of JU.enemV){
      if (!e.vivo) continue;
      const d = hip(e.x-P.x, e.y-P.y);
      if (d < md){ md = d; m = e; }
    }
    if (m){
      /* SIN TIRO NO HAY DISTANCIA QUE MANTENER. El plante de PELEA_D supone
         que la bala llega; con una pared en el medio lo unico que hace es
         quedarse quieto a tiro de nadie. */
      if (!visto(s, P.x, P.y, m.x, m.y)){ botPunto(m.x, m.y); return; }
      const dx = (P.x-m.x)/(md||1), dy = (P.y-m.y)/(md||1);
      const quiero = PELEA_D;
      if (md < quiero-25)      botPunto(P.x + dx*90, P.y + dy*90);
      else if (md > quiero+55) botPunto(m.x, m.y);
      else {                                   // orbitar
        botPunto(P.x - dy*80, P.y + dx*80);
      }
    }
    return;
  }

  /* limpia: a la escalera, o a la puerta que lleva hacia ella */
  if (s.esc){ botCelda(s.esc.cx, s.esc.cy); return; }
  if (cofreVale(s.cofre)){ botCelda(s.cofre.cx, s.cofre.cy); return; }
  /* AL COFRE ANTES QUE A LA ESCALERA, y esto no es una preferencia del bot: es
     la unica forma de que el bot juegue el juego que se juega. El cofre cuelga
     de una RAMA muerta del camino (c.js: `extra` -> tipo 'cofre'), asi que la
     ruta mas corta a la escalera NO PASA POR EL NUNCA — y el unico codigo de
     cofre que habia miraba `s.cofre` de la sala en la que ya se estaba parado.
     Medido antes de tocar nada: 1 a 2 cofres por piso del 2 al 8 y **CERO
     abiertos en 24 corridas**, o sea que el bot terminaba los nueve pisos con
     la pistola pelada (34,6 de dano por segundo contra 95,7 de la cruz) y el
     dano por segundo se quedaba plano en 69-82 mientras los pisos escalaban.
     Y el desvio NO ES GRATIS: la sala del cofre trae tres enemigos, asi que se
     paga con una pelea. Esa es exactamente la apuesta que el juego propone. */
  let destino = JU.pisoObj.salas.findIndex(x => cofreVale(x.cofre));
  if (destino < 0) destino = JU.pisoObj.salas.findIndex(x => x.esc);
  const r = rutaSalas(JU.salaIx, destino < 0 ? 0 : destino);
  const sig = r.length ? r[0] : -1;
  let kk = null;
  for (const k in s.vec) if (s.vec[k] === sig) kk = k;
  if (!kk) for (const k in s.vec){ kk = k; break; }
  if (kk){
    const p = PUERTA_C[kk];
    botCelda(p.x, p.y);
  }
}

/* ============================================================
   EL TUTORIAL. Cinco pasos, y cada uno ESPERA A QUE SE HAGA LA
   COSA: un tutorial que se pasa leyendo se saltea, y lo que se
   saltea es exactamente lo que despues no se entiende.
   Se ve cada vez que se abre el juego, porque guardaLee() pone
   GUARDA.visto en cero DESPUES de leer el disco: dentro de la
   sesion sigue valiendo, asi que no vuelve a salir entre piso y
   piso.
   ============================================================ */
const TUT = {on:false, p:0, fin:0, rec:0, disp:0, esq:0,
             px:0, py:0, fog0:0, esq0:0, piso0:1};

/* Las condiciones son del JUEGO y no de un reloj: no se puede
   avanzar sin haber hecho la cosa. */
const TUT_PASOS = [
  {k:'pTuto1', ok:() => TUT.rec  >= 150},
  {k:'pTuto2', ok:() => TUT.disp >= 3},
  {k:'pTuto3', ok:() => TUT.esq  >= 1},
  {k:'pTuto4', ok:() => JU.sala && JU.sala.limpia && JU.sala.tipo !== 'entrada'},
  {k:'pTuto5', ok:() => JU.piso > TUT.piso0},
];

function tutArranca(){
  TUT.on = !GUARDA.visto;
  TUT.p = 0; TUT.fin = 0; TUT.rec = 0; TUT.disp = 0; TUT.esq = 0;
  TUT.fog0 = 0; TUT.esq0 = 0; TUT.piso0 = 1;
  TUT.px = JU.P ? JU.P.x : 0; TUT.py = JU.P ? JU.P.y : 0;
  tutRepinta();
}

/* Corta sin marcar visto: el que murio en el paso dos no aprendio
   nada, asi que la partida siguiente se lo vuelve a ensenar. */
function tutCorta(){
  TUT.on = false; TUT.fin = 0;
  pista(null);
}

function tutRepinta(){
  if (!TUT.on){ pista(null); return; }
  if (TUT.fin > 0) pista(T('tutoFin'));
  else pista(T(TUT_PASOS[TUT.p].k));
}

function tutPaso(dt){
  if (!TUT.on) return;
  const P = JU.P;

  /* cuanto se movio de verdad, no cuanto se empujo el joystick */
  TUT.rec += hip(P.x - TUT.px, P.y - TUT.py);
  TUT.px = P.x; TUT.py = P.y;

  /* el disparo y la esquiva se leen por FLANCO sobre el propio
     estado del jugador: asi no hace falta un contador aparte que
     se pueda desincronizar del juego */
  if (P.fog >= .999 && TUT.fog0 < .999) TUT.disp++;
  TUT.fog0 = P.fog;
  if (P.esqT > 0 && TUT.esq0 <= 0) TUT.esq++;
  TUT.esq0 = P.esqT;

  if (TUT.fin > 0){
    TUT.fin -= dt;
    if (TUT.fin <= 0){ TUT.on = false; pista(null); }
    return;
  }

  if (TUT_PASOS[TUT.p].ok()){
    TUT.p++;
    son('ui');
    if (TUT.p >= TUT_PASOS.length){
      TUT.fin = 2.4;
      GUARDA.visto = 1; guardaEscribe();   // se marca al TERMINARLO
      aviso(T('tutoFin'));
    }
    tutRepinta();
  }
}

/* ---------- HUD ----------
   Se llama en cada cuadro, asi que cada campo se compara antes de
   escribir: escribir en el DOM sesenta veces por segundo para poner
   el mismo texto obliga al navegador a rehacer el layout de gusto. */
const HUDV = {vidas:-1, vidaMax:-1, ener:-1, piso:-1, salas:'', arma:'', mon:-1};
function hudPinta(){
  const P = JU.P; if (!P) return;

  if (P.vida !== HUDV.vidas || P.vidaMax !== HUDV.vidaMax){
    HUDV.vidas = P.vida; HUDV.vidaMax = P.vidaMax;
    let h = '';
    for (let i = 0; i < P.vidaMax; i++) h += '<div class="cor' + (i < P.vida ? ' on' : '') + '"><i></i></div>';
    $('#vidas').innerHTML = h;
  }

  const e = Math.round(P.ener / P.eMax * 100);
  if (e !== HUDV.ener){ HUDV.ener = e; $('#barE b').style.width = e + '%'; }

  if (JU.piso !== HUDV.piso){ HUDV.piso = JU.piso; $('#piso').textContent = T('piso', JU.piso); }

  if (JU.pisoObj){
    let li = 0;
    for (const s of JU.pisoObj.salas) if (s.limpia) li++;
    const t = li + '/' + JU.pisoObj.salas.length;
    if (t !== HUDV.salas){ HUDV.salas = t; $('#salas').textContent = t; }
  }

  const a = TARMA(ARMAS[P.arma].id);
  if (a !== HUDV.arma){ HUDV.arma = a; $('#arma').textContent = a; }

  if (JU.monedas !== HUDV.mon){ HUDV.mon = JU.monedas; $('#monN').textContent = '◈ ' + JU.monedas; }
}
function hudReset(){ HUDV.vidas = -1; HUDV.ener = -1; HUDV.piso = -1; HUDV.salas = ''; HUDV.arma = ''; HUDV.mon = -1; }

/* ---------- el dedo ----------
   El joystick se agarra desde CUALQUIER punto de la mitad
   izquierda y no solo desde el circulo dibujado: un pulgar no
   apunta, se apoya. El aro dibujado dice donde esta el centro. */
const JOY = {id:-1, cx:0, cy:0, r:58};
/* El dedo y el teclado NO escriben en ENT directamente: cada uno
   deja su estado y entradaPaso() los junta. Escribiendo los dos en
   ENT, sostener FUEGO sin mover el joystick lo apagaba en el cuadro
   siguiente, porque el teclado ponia false encima. */
const DEDO = {x:0, y:0, fuego:false, esq:false};
function joyPone(dx, dy){
  const m = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, m / JOY.r);
  DEDO.x = dx / m * k; DEDO.y = dy / m * k;
  $('#joyP').style.transform = 'translate(' + (dx / m * JOY.r * k) + 'px,' + (dy / m * JOY.r * k) + 'px)';
}
function joySuelta(){
  JOY.id = -1; DEDO.x = 0; DEDO.y = 0;
  $('#joyP').style.transform = '';
}

function armaDedo(){
  const D = $('#dedo');

  const bt = (sel, abajo, arriba) => {
    const e = $(sel);
    e.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      e.setPointerCapture && e.setPointerCapture(ev.pointerId);
      e.classList.add('on'); abajo();
    });
    const fin = ev => { ev.preventDefault(); e.classList.remove('on'); if (arriba) arriba(); };
    e.addEventListener('pointerup', fin);
    e.addEventListener('pointercancel', fin);
  };
  bt('#bTira', () => { DEDO.fuego = true; }, () => { DEDO.fuego = false; });
  bt('#bEsq',  () => { DEDO.esq   = true; }, () => { DEDO.esq   = false; });
  bt('#bUsa',  () => { ENT.usar   = true; });   // flanco: lo consume f.js

  D.addEventListener('pointerdown', ev => {
    if (JOY.id !== -1) return;
    const r = $('#marco').getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    if (x > r.width * .52) return;              // esa mitad es de los botones
    const j = $('#joy').getBoundingClientRect();
    JOY.id = ev.pointerId;
    JOY.cx = j.left + j.width / 2 - r.left;
    JOY.cy = j.top  + j.height / 2 - r.top;
    D.setPointerCapture && D.setPointerCapture(ev.pointerId);
    joyPone(x - JOY.cx, y - JOY.cy);
    ev.preventDefault();
  });
  D.addEventListener('pointermove', ev => {
    if (ev.pointerId !== JOY.id) return;
    const r = $('#marco').getBoundingClientRect();
    joyPone(ev.clientX - r.left - JOY.cx, ev.clientY - r.top - JOY.cy);
    ev.preventDefault();
  });
  const sol = ev => { if (ev.pointerId === JOY.id) joySuelta(); };
  D.addEventListener('pointerup', sol);
  D.addEventListener('pointercancel', sol);
}

/* ---------- teclado ----------
   No es un extra: sin el, el juego no se puede probar ni jugar en
   una notebook, que es donde se lo mide. */
const TEC = {};
function armaTeclas(){
  addEventListener('keydown', ev => {
    TEC[ev.code] = true;
    if (ev.code === 'Escape'){ pausa(JU.modo === 'juega'); }
    if (ev.code === 'KeyE') ENT.usar = true;
    if (ev.code === 'Space' || ev.code === 'ShiftLeft') ev.preventDefault();
  });
  addEventListener('keyup', ev => { TEC[ev.code] = false; });
  addEventListener('blur', () => { for (const k in TEC) TEC[k] = false; });
}
/* junta dedo y teclado en ENT, una vez por cuadro. El bot escribe
   en ENT por su cuenta, asi que mientras corre nadie lo pisa. */
function entradaPaso(){
  if (BOT.on) return;
  let x = 0, y = 0;
  if (TEC.KeyA || TEC.ArrowLeft)  x -= 1;
  if (TEC.KeyD || TEC.ArrowRight) x += 1;
  if (TEC.KeyW || TEC.ArrowUp)    y -= 1;
  if (TEC.KeyS || TEC.ArrowDown)  y += 1;
  const m = Math.hypot(x, y);
  if (JOY.id !== -1){ ENT.x = DEDO.x; ENT.y = DEDO.y; }
  else if (m > 0)   { ENT.x = x / m;  ENT.y = y / m;  }
  else              { ENT.x = 0;      ENT.y = 0;      }
  ENT.fuego = DEDO.fuego || !!TEC.Space;
  ENT.esq   = DEDO.esq   || !!(TEC.ShiftLeft || TEC.ShiftRight);
}

/* ============================================================
   z.html — el arranque y el reloj.

   PASO FIJO CON INTERPOLACION. Un telefono a 30 y una notebook a
   144 tienen que jugar el MISMO juego: con dt variable la
   velocidad, el alcance de las balas y el enfriamiento de la
   esquiva salen distintos, y eso no es rendimiento, es otro
   juego. La verdad se calcula 60 veces por segundo y el dibujo
   rellena lo que sobra.
   ============================================================ */

const PASO = 1/60, PASO_TOPE = .25, PASOS_MAX = 8;
let acum = 0, ultimo = performance.now();

function cuadro(ahora){
  requestAnimationFrame(cuadro);

  let dt = (ahora - ultimo) / 1000;
  ultimo = ahora;
  /* una pestaña que estuvo dormida no simula cuarenta pasos de golpe */
  if (dt > PASO_TOPE) dt = PASO_TOPE;
  acum += dt;

  entradaPaso();

  let n = 0;
  while (acum >= PASO && n < PASOS_MAX){ paso(PASO); acum -= PASO; n++; }
  /* si el aparato no llega, va en camara lenta pero no se cuelga
     persiguiendo el reloj */
  if (n >= PASOS_MAX) acum = 0;

  demoPaso();          /* la demo del menu no se puede morir: vuelve a empezar */

  hudPinta();
  dibuja();
}

/* ============================================================
   LAS SONDAS. Una afirmacion sin numero no vale: de aca salen el
   costo del cuadro, el auto-jugador y las cajas del HUD.
   ============================================================ */
window.__pozo = {
  est(){
    const P = JU.P;
    return {
      modo:JU.modo, piso:JU.piso, salaIx:JU.salaIx,
      salas:JU.pisoObj ? JU.pisoObj.salas.length : 0,
      limpias:JU.pisoObj ? JU.pisoObj.salas.filter(s => s.limpia).length : 0,
      limpia:JU.sala ? !!JU.sala.limpia : false,
      tipo:JU.sala ? JU.sala.tipo : '',
      vivos:JU.enemV.filter(e => e.vivo).length,
      bajas:JU.bajas, monedas:JU.monedas, seg:+JU.seg.toFixed(2),
      vida:P ? P.vida : 0, vidaMax:P ? P.vidaMax : 0,
      ener:P ? +P.ener.toFixed(1) : 0, arma:P ? ARMAS[P.arma].id : '',
      x:P ? +P.x.toFixed(1) : 0, y:P ? +P.y.toFixed(1) : 0,
      bal:JU.bal.length, eba:JU.eba.length, par:JU.par.length,
      tut:TUT.on ? TUT.p : -1, idioma:IDIOMA,
    };
  },

  /* el cuadro entero, dibujo incluido */
  costo(n = 120){
    const t0 = performance.now();
    for (let i = 0; i < n; i++){ paso(PASO); dibuja(); }
    return {ms:+((performance.now()-t0)/n).toFixed(3), n};
  },

  /* mueve al jugador POR EL MISMO SITIO que el dedo */
  anda(n, x, y, fuego){
    if (BOT.on) return 'bot';
    const a = {x:JU.P.x, y:JU.P.y};
    for (let i = 0; i < n; i++){
      ENT.x = x; ENT.y = y; ENT.fuego = !!fuego;
      paso(PASO);
    }
    ENT.x = 0; ENT.y = 0; ENT.fuego = false;
    return {rec:+hip(JU.P.x-a.x, JU.P.y-a.y).toFixed(1),
            x:+JU.P.x.toFixed(1), y:+JU.P.y.toFixed(1)};
  },

  /* el auto-jugador. Escribe en ENT, o sea el mismo camino que el
     dedo: con dos caminos estaria jugando otro juego y que gane no
     probaria nada. */
  juega(modo = 'honesto', pasosMax = 60000){
    BOT.on = true; BOT.modo = modo; BOT.t = 0;
    arrancaPartida();
    TUT.on = false;
    let n = 0;
    while (n < pasosMax && (JU.modo === 'juega' || JU.modo === 'mejora')){
      if (JU.modo === 'mejora') eligeMejora(mejorElige(modo));
      else { paso(PASO); n++; }
    }
    const r = {modo, gano:JU.gano, piso:JU.piso, bajas:JU.bajas,
               monedas:JU.monedas, seg:+JU.seg.toFixed(1), pasos:n,
               vida:JU.P.vida, arma:ARMAS[JU.P.arma].id,
               corto:n >= pasosMax};
    BOT.on = false;
    return r;
  },

  bot(v){ BOT.on = !!v; return BOT.on; },

  /* DE QUE SE MUERE UNO. juega() dice hasta que piso llega; esto dice por que
     no llega mas lejos: cuantos corazones cuesta cada piso y QUIEN los cobra.
     Sin esto, tocar un numero de la economia es adivinar. */
  dano(n = 8){
    const porPiso = {}, porCl = {}, porPC = {}, vidaP = {}, dists = [], fin = [];
    const curaP = {};   /* lo que se curo por piso: el otro lado de la cuenta */
    const cofP = {};   /* cofres que HABIA y cuantos se abrieron, por piso */
  const comoCl = {};  /* como pego cada clase: cuerpo o bala, y con que esquiva */
    /* LA TASA SE ACUMULA, como `dists`. Reseteada por corrida y leida al
       final informa SOLO la ultima, y eso se ve porque `dist.n` y `pega` no
       pueden describir la misma muestra (215 contra 13). */
    let tSale = 0, tPega = 0;
    /* Y EN QUE ESTADO ESTABA LA ESQUIVA: no se puede arreglar sin saber si
       el problema es que no se podia esquivar o que esquivar no alcanzo. */
    const esq = {cd:0, tarde:0, libre:0};
    const mata = {}, rafaga = [], entraFatal = [];
    for (let i = 0; i < n; i++){
      DANO_LOG.length = 0; VIDA_LOG.length = 0; CURA_LOG.length = 0; COF_LOG.length = 0;
      BALA_N.sale = 0; BALA_N.pega = 0;
      const r = this.juega('honesto');
      fin.push({p:r.piso, gano:r.gano?1:0, b:r.bajas, corto:r.corto?1:0});
      for (const g of DANO_LOG){
        porPiso[g.p] = (porPiso[g.p]||0) + g.c;
        porCl[g.de]  = (porCl[g.de] ||0) + g.c;
        const k = g.p + '|' + g.de;
        porPC[k] = (porPC[k]||0) + g.c;
        /* COMO PEGO, y no solo cuanto. Un jefe que cobra por CUERPO se arregla
           con la distancia de pelea; uno que cobra por BALA, con el abanico o
           con la cadencia. Con una sola columna los dos se leen igual. */
        const dd = (comoCl[g.de] ||= {golpes:0, cor:0, cuerpo:0, bala:0, cd:0, tarde:0, libre:0});
        dd.golpes++; dd.cor += g.c;
        if (g.dist >= 0){
          dd.bala++;
          dists.push(Math.round(g.dist));
          if (g.cd > 0){        esq.cd++;    dd.cd++;    }  // no se podia esquivar
          else if (g.esqT > 0){ esq.tarde++; dd.tarde++; }  // se esquivo y la invencibilidad ya se vencio
          else {                esq.libre++; dd.libre++; }  // la esquiva estaba lista y no se uso
        } else dd.cuerpo++;
      }
      /* CON QUE ARMA SE PELEA CADA PISO. El dano que cobra una sala es una
         funcion del TIEMPO que se pasa adentro, y el tiempo lo pone el arma:
         con la pistola pelada (34,6 de dano por segundo) contra la cruz (95,7)
         la misma sala dura tres veces mas y ataca tres veces mas. Sin esta
         columna, "el piso 6 cobra mucho" no distingue un piso duro de un arma
         que se quedo corta. */
      /* CON CUANTA VIDA SE LLEGA. Si al piso que cobra se entra con la barra
         llena, el problema es ese piso; si se entra herido, el problema esta
         antes y ese piso solo es donde termina de cobrar. */
      for (const e of VIDA_LOG){
        if (!vidaP[e.p]) vidaP[e.p] = {s:0, n:0, dps:0, arm:{}};
        vidaP[e.p].s += e.v; vidaP[e.p].n++;
        const A = ARMAS[ARMA_ID[e.a]];
        vidaP[e.p].dps += A.d*A.n/A.c*(1+e.md);
        vidaP[e.p].arm[e.a] = (vidaP[e.p].arm[e.a]||0) + 1;
      }
      for (const g of CURA_LOG) curaP[g.p] = (curaP[g.p]||0) + g.c;
      for (const g of COF_LOG){
        const c = (cofP[g.p] ||= {hay:0, abrio:0, n:0});
        c.hay += g.hay; c.abrio += g.abrio; c.n++;
      }
      tSale += BALA_N.sale; tPega += BALA_N.pega;
      /* EL GOLPE FATAL, que es lo unico que dice DE QUE se muere uno. Todo lo
         de arriba mide lo que cuesta cada clase REPARTIDO en la corrida, y eso
         no distingue morir de a un rozon a lo largo de diez minutos de morir de
         un abrazo con la barra casi llena. Y la ventana de los ultimos cinco
         segundos separa las dos: si la mitad de la barra se fue en cinco
         segundos, lo que mata es una RAFAGA y se arregla con la sala; si se fue
         de a poco, lo que mata es la economia y se arregla con la cura. */
      if (DANO_LOG.length){
        const u = DANO_LOG[DANO_LOG.length-1];
        if (u.v <= 0){
          mata[u.de] = (mata[u.de]||0) + 1;
          let raf = 0; for (const g of DANO_LOG) if (u.t - g.t <= 5) raf += g.c;
          rafaga.push(raf);
          /* Y CON CUANTA VIDA SE ENTRO AL PISO QUE MATO. `vidaAlEntrar` no lo
             puede decir: solo mide las corridas que SOBREVIVIERON ese piso, asi
             que informa la barra de los que zafaron. Esto mide la de los que no.
             Si se entra sano, el problema es la sala; si se entra herido, el
             problema esta antes y esa sala solo es donde termina de cobrar. */
          const pri = DANO_LOG.find(g => g.p === u.p);
          if (pri) entraFatal.push(pri.v + pri.c);
        }
      }
    }
    const pp = {}; for (const k in porPiso) pp[k] = +(porPiso[k]/n).toFixed(2);
    const pc = {}; for (const k in porCl)  pc[k]  = +(porCl[k] /n).toFixed(2);
    /* EL CRUCE, que es lo unico que dice QUE ARREGLAR. "el piso 3 cobra 4,8" y
       "el tirador cobra 8,3" son dos hechos que no se tocan: puede ser que el
       tirador cobre eso repartido en seis pisos y el 3 lo cobre otro. */
    const pxc = {};
    for (const k in porPC){ const [p,c] = k.split('|');
      (pxc[p] = pxc[p] || {})[c] = +(porPC[k]/n).toFixed(2); }
    const vp = {}; for (const k in vidaP)
      vp[k] = {ent:+(vidaP[k].s/vidaP[k].n).toFixed(2), n:vidaP[k].n,
               dps:+(vidaP[k].dps/vidaP[k].n).toFixed(0), arm:vidaP[k].arm};
    return {n, pisoMedio:+(fin.reduce((a,b)=>a+b.p,0)/n).toFixed(2),
            gana:fin.filter(f=>f.gano).length, cortos:fin.filter(f=>f.corto).length,
            corPorPiso:pp, corPorClase:pc, pisoXclase:pxc, vidaAlEntrar:vp,
            cofres:(()=>{ const o={}; for(const k in cofP){ const c=cofP[k];
              o[k]={hay:+(c.hay/c.n).toFixed(2), abrio:+(c.abrio/c.n).toFixed(2), n:c.n}; }
              return o; })(),
            curaPorPiso:(()=>{ const o={}; for(const k in curaP) o[k]=+(curaP[k]/n).toFixed(2);
              /* NETO: lo que el piso le saca de verdad a la barra. Un piso que cobra 6
                 y devuelve 4 no es el mismo problema que uno que cobra 6 y no devuelve
                 nada, y con las dos columnas sueltas los dos se leen igual. */
              const net={}; for(const k in pp) net[k]=+(pp[k]-(o[k]||0)).toFixed(2);
              return {cura:o, neto:net}; })(),
            balaDist:(()=>{ if(!dists.length) return null; const d=dists.slice().sort((a,b)=>a-b);
              const q=f=>d[Math.min(d.length-1, Math.floor(d.length*f))];
              return {n:d.length, med:+(d.reduce((a,b)=>a+b,0)/d.length).toFixed(0),
                      p10:q(.10), p25:q(.25), p50:q(.50), p75:q(.75), p90:q(.90)}; })(),
            balaTasa:{sale:tSale, pega:tPega,
              pct:tSale ? +(tPega/tSale*100).toFixed(1) : 0},
            comoPega:(()=>{ const o={};
              for (const k in comoCl){ const d=comoCl[k];
                o[k]={gol:+(d.golpes/n).toFixed(2), cor:+(d.cor/n).toFixed(2),
                      cuerpoPct:+(d.cuerpo/d.golpes*100).toFixed(0),
                      cd:d.cd, tarde:d.tarde, libre:d.libre}; }
              return o; })(),
            balaEsq:esq,
            mata,
            rafaga:(()=>{ if(!rafaga.length) return null;
              const d=rafaga.slice().sort((a,b)=>a-b);
              return {n:d.length, med:+(d.reduce((a,b)=>a+b,0)/d.length).toFixed(2),
                      p50:d[Math.floor(d.length*.5)], p90:d[Math.floor(d.length*.9)]}; })(),
            entraFatal:(()=>{ if(!entraFatal.length) return null;
              const d=entraFatal.slice().sort((a,b)=>a-b);
              return {n:d.length, med:+(d.reduce((a,b)=>a+b,0)/d.length).toFixed(2),
                      p10:d[Math.floor(d.length*.1)], p50:d[Math.floor(d.length*.5)],
                      p90:d[Math.floor(d.length*.9)]}; })(),
            fin};
  },

  /* POR QUE NO SALE DE LA SALA. Todo lo de arriba mide el resultado; esto mide
     la DECISION: que celda pidio el bot, si hay campo hasta ahi, y que le salio
     por ENT. Sin esto, "se queda quieto" es un sintoma sin causa. */
  porque(pasosMax = 40000){
    BOT.on = true; BOT.modo = 'honesto'; BOT.t = 0;
    arrancaPartida(); TUT.on = false;
    let n = 0, claveAnt = -1, quieto = 0;
    while (n < pasosMax && (JU.modo === 'juega' || JU.modo === 'mejora')){
      if (JU.modo === 'mejora'){ eligeMejora(mejorElige('honesto')); continue; }
      /* NO SE MIDE "no se movio": el cuerpo tirita, orbita y esquiva sin avanzar
         un metro de progreso. Se mide NO CAMBIA DE SALA durante medio minuto, y
         esa es la definicion ancha a proposito: cubre las dos trabas — la sala
         limpia de la que no encuentra la puerta Y la sala sucia que no limpia. */
      const clave = JU.piso*100 + JU.salaIx;
      quieto = clave === claveAnt ? quieto+1 : 0;
      claveAnt = clave;
      if (quieto > 1800) break;
      paso(PASO); n++;
    }
    const P = JU.P, s = JU.sala;
    const cx = Math.floor(P.x/CELDA), cy = Math.floor(P.y/CELDA);
    const destino = JU.pisoObj.salas.findIndex(q => q.esc);
    const r = rutaSalas(JU.salaIx, destino < 0 ? 0 : destino);
    const sig = r.length ? r[0] : -1;
    let kk = null;
    for (const k in s.vec) if (s.vec[k] === sig) kk = k;
    if (!kk) for (const k in s.vec){ kk = k; break; }
    const pc = kk ? PUERTA_C[kk] : null;
    const campo = pc ? botCampo(s, pc.x, pc.y) : null;
    BOT.on = false;
    return {pasos:n, trab:quieto > 1800, piso:JU.piso, sala:JU.salaIx,
            lim:s.limpia?1:0, tipo:s.tipo, esc:!!s.esc,
            cofre: s.cofre ? (s.cofre.abierto?'abierto':'cerrado') : 'no',
            x:Math.round(P.x), y:Math.round(P.y), cel:[cx,cy],
            vec:Object.keys(s.vec), destino, ruta:r, sig, kk,
            puerta: pc, dPuerta: campo ? campo[(pc.y)*SALA_W + pc.x] : null,
            dAqui: campo ? campo[cy*SALA_W + cx] : null,
            bloqPuerta: pc ? bloq(s, pc.x, pc.y) : null,
            ent:{x:+ENT.x.toFixed(3), y:+ENT.y.toFixed(3)},
            vivos: JU.enemV.filter(e => e.vivo).length};
  },

  /* CUANTO PEGA POR MINUTO. Lo unico que explica que el bot honesto mate MENOS
     que el que se mueve al azar es una de tres: tira menos, apunta peor, o se
     come mas golpes. Se miden las tres por mil pasos, que es lo unico que se
     puede comparar entre dos corridas de largo distinto. */
  tasa(modo = 'honesto', pasosMax = 60000){
    BOT.on = true; BOT.modo = modo; BOT.t = 0;
    arrancaPartida(); TUT.on = false;
    let n = 0, tiros = 0, balas = 0, dano = 0, recib = 0, sumE = 0, mE = 0;
    let vidAnt = JU.P.vida;
    /* la vida de los bichos se mide sala por sala: al entrar a una nueva la
       referencia se rehace, si no un cambio de sala cuenta como dano */
    let ref = new Map(), salaAnt = -1, pisoAnt = -1;
    while (n < pasosMax && (JU.modo === 'juega' || JU.modo === 'mejora')){
      if (JU.modo === 'mejora'){ eligeMejora(mejorElige('honesto')); continue; }
      const b0 = JU.bal.length;
      paso(PASO); n++;
      if (JU.bal.length > b0){ tiros++; balas += JU.bal.length - b0; }
      if (JU.salaIx !== salaAnt || JU.piso !== pisoAnt){
        salaAnt = JU.salaIx; pisoAnt = JU.piso; ref = new Map();
      }
      for (const e of JU.enemV){
        const v = e.vivo ? e.vida : 0;
        if (ref.has(e)){ const a = ref.get(e); if (v < a) dano += a - v; }
        ref.set(e, v);
      }
      if (JU.P.vida < vidAnt) recib += vidAnt - JU.P.vida;
      vidAnt = JU.P.vida;
      sumE += JU.P.ener; mE = Math.max(mE, JU.P.ener);
    }
    const k = 1000 / Math.max(1, n);
    const r = {modo, pasos:n, piso:JU.piso, bajas:JU.bajas,
               tiros:+(tiros*k).toFixed(1), balas:+(balas*k).toFixed(1),
               dano:+(dano*k).toFixed(1), recib:+(recib*k).toFixed(2),
               matas:+(JU.bajas*k).toFixed(2),
               enerMed:+(sumE/Math.max(1,n)).toFixed(1), enerMax:Math.round(mE),
               arma:ARMAS[JU.P.arma].id};
    BOT.on = false;
    return r;
  },

  /* POR QUE NO MATA. El bot navega bien y la sala no se limpia: hay que ver
     si las balas SALEN, si hay BLANCO, y si el blanco esta a la vista. */
  pelea(pasosMax = 12000, cada = 600){
    BOT.on = true; BOT.modo = 'honesto'; BOT.t = 0;
    arrancaPartida(); TUT.on = false;
    const tz = []; let n = 0, tiros = 0;
    const balAnt = () => JU.bal.length;
    let ultBal = 0;
    while (n < pasosMax && (JU.modo === 'juega' || JU.modo === 'mejora')){
      if (JU.modo === 'mejora'){ eligeMejora(mejorElige('honesto')); continue; }
      const b0 = JU.bal.length;
      paso(PASO); n++;
      if (JU.bal.length > b0) tiros++;
      if (n % cada === 0){
        const P = JU.P, s = JU.sala;
        const vv = JU.enemV.filter(e => e.vivo);
        const b = P.blanco;
        tz.push({n, sala:JU.salaIx, lim:s.limpia?1:0,
                 x:Math.round(P.x), y:Math.round(P.y),
                 ener:Math.round(P.ener), cd:+P.cd.toFixed(2),
                 mira:+P.mira.toFixed(2), tiros,
                 bal:JU.bal.length, blanco: b ? Math.round(hip(b.x-P.x,b.y-P.y)) : -1,
                 en: vv.map(e => ({t:e.tipo, v:Math.round(e.vida),
                                   d:Math.round(hip(e.x-P.x,e.y-P.y))}))});
      }
    }
    BOT.on = false;
    return {pasos:n, tiros, piso:JU.piso, tz};
  },

  /* POR QUE SE TRABA. Corre hasta que el bot deja de avanzar y devuelve
     la decision entera: a que sala va, que ruta salio, que puerta eligio
     y que le escribio a ENT. */
  atasco(pasosMax = 40000){
    BOT.on = true; BOT.modo = 'honesto'; BOT.t = 0;
    arrancaPartida(); TUT.on = false;
    let n = 0, quieto = 0, ax = 0, ay = 0;
    while (n < pasosMax && (JU.modo === 'juega' || JU.modo === 'mejora')){
      if (JU.modo === 'mejora'){ eligeMejora(mejorElige('honesto')); continue; }
      paso(PASO); n++;
      const d = Math.abs(JU.P.x-ax) + Math.abs(JU.P.y-ay);
      ax = JU.P.x; ay = JU.P.y;
      quieto = d < .05 ? quieto+1 : 0;
      if (quieto > 200) break;
    }
    const s = JU.sala, P = JU.P;
    const dest = JU.pisoObj.salas.findIndex(x => x.esc);
    const ru = rutaSalas(JU.salaIx, dest < 0 ? 0 : dest);
    const sig = ru.length ? ru[0] : -1;
    let kk = null;
    for (const k in s.vec) if (s.vec[k] === sig) kk = k;
    const fb = kk; if (!kk) for (const k in s.vec){ kk = k; break; }
    const pc = kk ? PUERTA_C[kk] : null;
    BOT.on = false;
    return {n, quieto, trab: quieto > 200,
            modo:JU.modo, piso:JU.piso, sala:JU.salaIx, tipo:s.tipo,
            lim:!!s.limpia, esc:!!s.esc, cofre:s.cofre ? !s.cofre.abierto : false,
            vivos:JU.enemV.filter(e => e.vivo).length,
            x:+P.x.toFixed(1), y:+P.y.toFixed(1),
            vec:s.vec, dest, ruta:ru, sig, kk, porRuta:!!fb,
            meta: pc ? [(pc.x+.5)*CELDA, (pc.y+.5)*CELDA] : null,
            ent:{x:+ENT.x.toFixed(3), y:+ENT.y.toFixed(3)},
            mapa: JU.pisoObj.salas.map((z,i) => ({i, esc:!!z.esc, vec:z.vec}))};
  },

  /* LA TRAZA. "El bot se traba" no es un diagnostico: hay que ver DONDE.
     Corre una partida y saca una foto cada `cada` pasos. */
  traza(modo = 'honesto', pasosMax = 40000, cada = 900){
    BOT.on = true; BOT.modo = modo; BOT.t = 0;
    arrancaPartida();
    TUT.on = false;
    const tz = [];
    let n = 0;
    while (n < pasosMax && (JU.modo === 'juega' || JU.modo === 'mejora')){
      if (JU.modo === 'mejora'){ eligeMejora(mejorElige('honesto')); continue; }
      paso(PASO); n++;
      if (n % cada === 0){
        const P = JU.P, s = JU.sala;
        tz.push({n, piso:JU.piso, sala:JU.salaIx,
                 lim:s ? (s.limpia?1:0) : -1,
                 tipo:s ? s.tipo : '',
                 esc:s && s.esc ? 1 : 0,
                 viv:JU.enemV.filter(e => e.vivo).length,
                 x:Math.round(P.x), y:Math.round(P.y), vida:P.vida});
      }
    }
    BOT.on = false;
    return {modo, gano:JU.gano, piso:JU.piso, pasos:n, corto:n >= pasosMax, tz};
  },

  /* salta a un piso para poder fotografiarlo */
  piso(n, sem){
    if (JU.modo === 'menu') { arrancaPartida(); TUT.on = false; }
    entraPiso(n, sem === undefined ? ((Math.random()*1e9)|0) : sem);
    verPan(null);
    return this.est();
  },

  /* el mapa del piso, para ver que las salas encadenan */
  mapa(){
    if (!JU.pisoObj) return null;
    return JU.pisoObj.salas.map((s,i) => ({
      i, gx:s.gx, gy:s.gy, tipo:s.tipo, limpia:!!s.limpia,
      enem:s.enem.length, vec:Object.keys(s.vec).join(''),
      esc:!!s.esc, cofre:!!s.cofre,
    }));
  },

  /* CAJAS DEL HUD. Un elemento nuevo que ninguna prueba mira es un
     solapamiento esperando. Se mide con offsetLeft/offsetTop porque
     getBoundingClientRect devuelve la caja alineada a los ejes y
     el marco puede estar transformado. */
  cajas(){
    const ids = ['#vidas','#barE','#piso','#salas','#arma','#monN',
                 '#joy','#bTira','#bEsq','#bUsa','#bPau','#pista','#aviso'];
    const c = [];
    for (const id of ids){
      const e = $(id); if (!e) continue;
      const cs = getComputedStyle(e);
      if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < .05) continue;
      let x = 0, y = 0, n = e;
      while (n && n.id !== 'marco'){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
      const w = e.offsetWidth, h = e.offsetHeight;
      if (!w || !h) continue;
      c.push({id, x, y, w, h});
    }
    const ch = [], fuera = [];
    for (let i = 0; i < c.length; i++){
      if (c[i].x < -1 || c[i].y < -1 || c[i].x + c[i].w > AN + 1 || c[i].y + c[i].h > AL + 1)
        fuera.push(c[i].id);
      for (let j = i+1; j < c.length; j++){
        const a = c[i], b = c[j];
        if (a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h)
          ch.push(a.id + '×' + b.id);
      }
    }
    return {n:c.length, choques:ch, fuera, marco:[AN, AL]};
  },

  /* lo que se ve de verdad: lee el buffer del lienzo */
  brillo(){
    const d = CX.getImageData(0, 0, CV.width, CV.height).data;
    let s = 0, mx = 0, n = 0;
    for (let i = 0; i < d.length; i += 16){
      const l = (d[i]*.299 + d[i+1]*.587 + d[i+2]*.114);
      s += l; if (l > mx) mx = l; n++;
    }
    return {medio:+(s/n).toFixed(1), max:+mx.toFixed(0)};
  },

  /* el audio pasa por el maestro, asi que esto prueba que SONO */
  son(k, ms = 320){
    if (!ANA) return Promise.resolve({error:'sin audio'});
    if (k) son(k);
    return new Promise(res => {
      const b = new Uint8Array(ANA.fftSize);
      let pico = 0, sum = 0, n = 0;
      const t0 = performance.now();
      const paso2 = () => {
        ANA.getByteTimeDomainData(b);
        for (let i = 0; i < b.length; i++){
          const v = Math.abs(b[i] - 128) / 128;
          if (v > pico) pico = v; sum += v*v; n++;
        }
        if (performance.now() - t0 < ms) requestAnimationFrame(paso2);
        else res({k:k||'(fondo)', pico:+pico.toFixed(4), rms:+Math.sqrt(sum/n).toFixed(4)});
      };
      paso2();
    });
  },

  idioma(l){ ponIdioma(l); return IDIOMA; },
  pan(id){ verPan(id); return JU.modo; },
  auditar(n = 60){ return auditaPisos(n); },
};
</script>
