<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DADOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07070b;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#f2eee6;user-select:none;-webkit-user-select:none;touch-action:none}

/* ══════════ EL MARCO ES VERTICAL Y NO SE GIRA ══════════
   Al revés de los juegos 3D de este repo, que se dibujan apaisados adentro de un
   teléfono vertical. Un casual se juega con el teléfono como uno lo tiene y un
   solo pulgar: girarlo sería pedirle al jugador que cambie de postura.
   El lienzo se dibuja con el ANCHO clavado en 720 y el alto según la forma de
   la pantalla —lo calcula `medir()`— así que el marco la llena entera y una
   ficha de 40 px mide lo mismo en un teléfono de 360 y en uno de 1440. */
#caja{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  overflow:hidden;background:#000;--ac:#f2eee6}
canvas{display:block;width:100%;height:100%}
/* ══════════ EL TELON DEL MENU ══════════
   En el menu el lienzo no dibuja nada, asi que sin esto el menu es un panel
   gris sobre negro — o sea la pantalla de opciones de cualquier cosa. Es el
   MISMO fondo generado que usa la partida, asi que el menu y el juego se ven
   del mismo sitio, y va en DOM y no en el lienzo porque no hay que redibujarlo
   sesenta veces por segundo para que quede quieto.
   ── Y NO RECIBE TOQUES, QUE ES LO QUE ROMPIO EL JUEGO UNA VEZ ──
   Un elemento con `opacity:0` SIGUE RECIBIENDO el dedo. Medido con
   `elementFromPoint` en el medio de la pantalla y en partida: lo que estaba
   debajo del dedo era `tela` y no el lienzo, o sea que NINGUN toque llegaba al
   juego. Y no lo vio ninguna sonda, porque las sondas llaman a `JUEGO.baja`
   directo y se saltean todo el camino entre el dedo y el juego. */
#tela{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;
  transition:opacity .6s;z-index:1;pointer-events:none}
#tela.on{opacity:1}

/* ══════════ LO QUE VA EN DOM Y LO QUE VA EN EL LIENZO ══════════
   En el lienzo: el juego y las cinemáticas. En DOM: sólo el texto que hay que
   TRADUCIR y que tiene que quedar nítido en cualquier densidad de pantalla.
   Un texto dibujado en un lienzo de 720 se ve borroso en un teléfono de 1440, y
   el nombre del juego es justo lo que se mira primero. */
.pan{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:2.6vh;padding:6vw;text-align:center;z-index:5;
  background:linear-gradient(180deg,rgba(7,7,11,.34) 0%,rgba(7,7,11,.74) 44%,
    rgba(7,7,11,.93) 100%)}
.pan.on{display:flex}
/* ── EL TAMAÑO DEL TÍTULO SALE DEL LARGO DEL NOMBRE ──
   Con 11vw clavado, un nombre de diez letras —con un cuarto de em de espaciado
   entre cada una— mide mas que el marco y sale CORTADO por los dos lados.
   `--h1` lo calcula el arranque a partir de la cantidad de letras, así que el
   próximo nombre largo entra solo. */
.pan h1{font-size:clamp(26px,var(--h1,11vw),64px);letter-spacing:.26em;font-weight:800;
  text-indent:.26em;line-height:1;
  text-shadow:0 0 30px var(--ac),0 4px 22px #000}
.em{width:clamp(90px,27vw,158px);height:auto;margin-bottom:-1.4vh;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.75))}
.em[hidden]{display:none}
#pFin h1{font-size:clamp(24px,7.5vw,42px);letter-spacing:.16em;text-indent:.16em}
.pan p{font-size:clamp(12px,3.4vw,17px);line-height:1.6;opacity:.62;max-width:24em}
.fila{display:flex;gap:2.6vw;flex-wrap:wrap;justify-content:center}
.bt{appearance:none;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.05);
  color:inherit;font:inherit;font-size:clamp(12px,3.5vw,16px);font-weight:700;
  letter-spacing:.16em;padding:1.5vh 5.5vw;border-radius:999px;cursor:pointer}
.bt.p{background:var(--ac);color:#0b0b10;border-color:var(--ac)}
.bt:disabled{opacity:.34}
.bt.ch{padding:.9vh 3.4vw;font-size:11px;letter-spacing:.12em}

/* ══════════ EL SELECTOR DE NIVELES ══════════
   Los tres juegos de niveles necesitan una reja con el progreso: qué está
   abierto, cuántas estrellas dio cada uno. Y tiene que poder DESLIZARSE, porque
   son doscientos niveles y en un teléfono entran veinte por pantalla.
   `justify-content:flex-start` a propósito: centrado, con la reja más alta que
   el marco, el navegador recorta por ARRIBA y las primeras filas quedan
   inalcanzables — un defecto clásico de flex con overflow. */
#pNiveles{justify-content:flex-start;padding-top:4vh;gap:1.8vh}
#rejaN{display:grid;grid-template-columns:repeat(5,1fr);gap:2.2vw;width:100%;
  max-width:520px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;padding:1vh .5vw 3vh}
.nv{position:relative;aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-weight:800;font-size:clamp(13px,4vw,19px);color:inherit;font-family:inherit}
.nv.hecho{border-color:var(--ac);background:rgba(255,255,255,.10)}
.nv.trabado{opacity:.26;cursor:default}
.nv .es{font-size:9px;letter-spacing:.08em;color:#ffd76a;line-height:1;height:9px}
#tituN{font-size:clamp(15px,4.6vw,22px);letter-spacing:.2em;font-weight:800}

/* ══════════ EL HUD ══════════
   Arriba el número grande —los puntos en los de puntaje, el nivel en los de
   niveles— y debajo su rótulo. A los costados, dos fichas chicas para lo que
   cambia dentro del nivel (movimientos, burbujas que quedan). */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:4}
#hud.on{opacity:1}
#marca{position:absolute;top:2.2vh;left:0;right:0;text-align:center;
  font-size:clamp(28px,9.4vw,54px);font-weight:800;letter-spacing:.04em;
  text-shadow:0 3px 18px rgba(0,0,0,.75)}
#sub{position:absolute;top:calc(2.2vh + 10.6vw);left:0;right:0;text-align:center;
  font-size:clamp(10px,3vw,14px);letter-spacing:.28em;opacity:.55}
.fic{position:absolute;top:2.4vh;font-size:clamp(10px,3vw,14px);letter-spacing:.14em;
  font-weight:700;opacity:.72;padding:.7vh 3vw;border-radius:999px;
  background:rgba(7,7,11,.5);border:1px solid rgba(255,255,255,.12)}
#ficI{left:3.5vw}
#ficD{right:3.5vw}
.fic[hidden]{display:none}
/* ── LA FICHA DEL MULTIPLICADOR ──
   Debajo del marcador y con su propia barrita: la barra es la ventana de la
   racha, o sea el tiempo que queda para que el próximo acierto la sostenga. Sin
   la barra, la racha se corta sola y el jugador no sabe por qué. */
#combo{position:absolute;top:calc(2.2vh + 15vw);left:0;right:0;text-align:center;
  font-size:clamp(18px,6vw,34px);font-weight:800;letter-spacing:.06em;
  color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.6),0 3px 12px #000;
  opacity:0;transform:scale(.7);transition:opacity .18s,transform .18s}
#combo.on{opacity:1;transform:scale(1)}
#comboV{position:absolute;top:calc(2.2vh + 22vw);left:38%;right:38%;height:4px;
  background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden;
  opacity:0;transition:opacity .18s}
#combo.on ~ #comboV{opacity:.8}
#comboB{height:100%;width:0;background:#ffd76a}
#reloj{position:absolute;left:12%;right:12%;bottom:3.2vh;height:6px;
  background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
/* ── Y SUBE CUANDO HAY FILA DE BOTONES ──
   Medido con `cajas()` en BURBUJAS: el reloj caia en y 857 y la fila de botones
   ocupaba de 840 a 871, o sea la barra dibujada por ENCIMA de DESHACER. Los dos
   viven anclados abajo y ninguno sabia del otro. */
body.conAcc #reloj{bottom:9.6vh}
#relojB{height:100%;width:100%;background:#f2eee6}
#relojB.poco{background:#e0553f}
/* ══════════ LOS BOTONES DE PARTIDA ══════════
   DESHACER y REINICIAR sólo existen en los juegos de niveles, y son la mitad de
   lo que hace que un rompecabezas se pueda jugar: sin deshacer, un movimiento
   mal pensado cuesta el nivel entero y el jugador cierra el juego. Van con
   `pointer-events:auto` porque el HUD entero está en `none` — si no, el botón
   se ve y no se puede tocar, que es exactamente el defecto que ya costó una
   vuelta con el telón. */
#acc{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;gap:3vw;
  justify-content:center;pointer-events:auto}
#acc[hidden]{display:none}
#acc .bt{background:rgba(7,7,11,.62)}
/* ── Y NO RECIBEN EL DEDO CON EL HUD APAGADO ──
   `#hud` va a `opacity:0` entre partidas, y un elemento invisible SIGUE
   RECIBIENDO toques: con `pointer-events:auto` clavado, los tres botones se
   quedarían comiendo el dedo por encima del menú. Es exactamente el defecto que
   ya dejó un juego sin poder empezar, y ahí lo causaba el telón. */
#hud:not(.on) #acc{pointer-events:none}

/* el pie de la cinemática: el único texto de una cinemática, y va en DOM por lo
   mismo que el título — hay que poder traducirlo y tiene que leerse */
#cine{position:absolute;left:8%;right:8%;bottom:9vh;text-align:center;z-index:5;
  font-size:clamp(13px,3.8vw,19px);line-height:1.5;opacity:0;transition:opacity .5s;
  text-shadow:0 2px 16px #000;pointer-events:none}
#cine.on{opacity:.96}
#salta{position:absolute;right:4vw;top:3vh;z-index:6;font-size:11px;letter-spacing:.2em;
  opacity:0;transition:opacity .4s;pointer-events:none}
#salta.on{opacity:.4}

#estr{font-size:clamp(22px,7vw,38px);letter-spacing:.18em;color:#ffd76a;
  text-shadow:0 0 20px rgba(255,215,106,.55)}
#estr[hidden]{display:none}

/* ══════════ EL VIDEO DE LA CAMARA ══════════
   Dos pixeles y transparente, NO `display:none`. Un video que el compositor
   considera que no se dibuja puede DEJAR DE ENTREGAR CUADROS, y sin cuadros no
   hay deteccion: es la leccion de RECREO, donde esconderlo dejaba el juego sin
   manos sin un solo error en la consola. */
#camVid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;
  pointer-events:none;z-index:0}
/* la linea de estado del sensor: permanente y en el MENU, no un aviso de dos
   segundos dentro de la partida. Un aviso de dos segundos en una pantalla que
   no se esta mirando no es un aviso — y el motivo por el que el sensor no anda
   es justamente lo que el jugador necesita saber antes de empezar. */
#sensor{font-size:clamp(10px,2.9vw,13px);letter-spacing:.14em;opacity:.62;
  line-height:1.5;max-width:22em}
#sensor.mal{color:#ffc98a;opacity:.85}
#sensor[hidden]{display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#velo{position:absolute;inset:0;background:#07070b;opacity:0;pointer-events:none;
  z-index:6;transition:opacity .45s}
#velo.on{opacity:1}
</style></head><body>
<div id="caja">
  <canvas id="c"></canvas>
  <video id="camVid" playsinline muted autoplay></video>
  <div id="tela"></div>
  <div id="hud">
    <div id="marca">0</div>
    <div id="sub"></div>
    <div class="fic" id="ficI" hidden></div>
    <div class="fic" id="ficD" hidden></div>
    <div id="combo"></div>
    <div id="comboV"><div id="comboB"></div></div>
    <div id="reloj"><div id="relojB"></div></div>
    <div id="acc" hidden>
      <button class="bt ch" id="bDes" data-i18n="deshacer"></button>
      <button class="bt ch" id="bRei" data-i18n="reiniciar"></button>
      <button class="bt ch" id="bSal" data-i18n="salir"></button>
    </div>
  </div>
  <div id="cine"></div>
  <div id="salta"></div>
  <div id="velo"></div>
  <div id="flash"></div>

  <div class="pan on" id="pIdioma">
    <img class="em" id="emI" alt="" hidden>
    <h1>DADOS</h1>
    <div class="fila">
      <button class="bt p" data-lang="es">ESPAÑOL</button>
      <button class="bt" data-lang="en">ENGLISH</button>
      <button class="bt" data-lang="pt">PORTUGUÊS</button>
    </div>
  </div>

  <div class="pan" id="pMenu">
    <img class="em" id="emM" alt="" hidden>
    <h1>DADOS</h1>
    <p data-i18n="sub"></p>
    <div class="fila">
      <button class="bt p" id="bJugar" data-i18n="jugar"></button>
      <button class="bt" id="bComo" data-i18n="como"></button>
    </div>
    <p id="sensor" hidden></p>
    <p id="mejor" style="opacity:.42;letter-spacing:.2em;font-size:12px"></p>
    <div class="fila" style="gap:1.8vw">
      <button class="bt ch" data-lang="es">ES</button>
      <button class="bt ch" data-lang="en">EN</button>
      <button class="bt ch" data-lang="pt">PT</button>
    </div>
  </div>

  <div class="pan" id="pNiveles">
    <div id="tituN" data-i18n="niveles"></div>
    <div id="rejaN"></div>
    <div class="fila"><button class="bt ch" id="bNMenu" data-i18n="menu"></button></div>
  </div>

  <div class="pan" id="pFin">
    <h1 id="finT"></h1>
    <div id="estr" hidden></div>
    <p id="finP"></p>
    <div class="fila">
      <button class="bt p" id="bOtra" data-i18n="otra"></button>
      <button class="bt" id="bMenu" data-i18n="menu"></button>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{}}</script>
<script type="module">
/* ══════════════════════ EL MARCO Y EL RELOJ ══════════════════════ */
const $ = (i) => document.getElementById(i);

/* ── EL ANCHO DE DISEÑO ES FIJO Y EL ALTO NO ──
   Todo lo que un juego escribe —una posición, un radio, un tamaño de letra—
   está en unidades de diseño con el ancho clavado en 720, así que una moneda de
   40 px mide lo mismo en un teléfono de 360 y en uno de 1440. Eso es lo que
   evita el defecto que aparece sólo en un tamaño de pantalla y que nadie puede
   reproducir.

   PERO EL ALTO NO PUEDE SER FIJO, y eso se vio en la primera captura: con
   720×1280 clavado —9:16, la relación de un teléfono de 2016— en un teléfono de
   hoy (412×892, o sea 0,46) el marco entraba por el ancho y quedaban DOS BANDAS
   NEGRAS arriba y abajo. Un minijuego que se abre adentro de TikTok tiene que
   ocupar la pantalla entera; una banda negra se lee a que el juego está roto.
   Así que el alto se calcula de la pantalla y los juegos lo leen: lo que se
   ancla abajo se escribe como `AL - algo`, no como un número. Se topa arriba y
   abajo para que una ventana de escritorio muy ancha o muy alta no deforme el
   diseño — ahí sí quedan bandas, y ahí sí corresponde. */
const AN = 720;
let AL = 1280;
const AL_MIN = 1100, AL_MAX = 1760;

const lienzo = $('c');
const g = lienzo.getContext('2d');
const caja = $('caja');
let ESC = 1, DPR = 1;

function medir(){
  const vw = window.innerWidth, vh = window.innerHeight;
  /* el alto de diseño sale de la forma de la pantalla, así que el marco la llena
     entera y no hay bandas */
  let e = vw / AN;
  AL = Math.round(vh / e);
  if (AL < AL_MIN){ AL = AL_MIN; e = vh / AL; }
  else if (AL > AL_MAX){ AL = AL_MAX; e = vh / AL; }
  const w = Math.round(AN * e), h = Math.round(AL * e);
  caja.style.width = w + 'px'; caja.style.height = h + 'px';
  /* ── EL PIXEL RATIO VA TOPADO EN 2, Y ESO ESTÁ MEDIDO EN OTRO JUEGO ──
     En Maicol se midió que dibujar al doble de la resolución de diseño costaba
     la mitad de los cuadros y no compraba ni un detalle, porque no hay más
     detalle que dar: los dibujos están hechos para 720 de ancho. Con 2 el texto
     y los bordes quedan finos y no se paga un tercer múltiplo. */
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(w * DPR);
  lienzo.height = Math.round(h * DPR);
  ESC = (w * DPR) / AN;
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.imageSmoothingEnabled = true;
}
addEventListener('resize', () => setTimeout(medir, 60));
addEventListener('orientationchange', () => setTimeout(medir, 120));

/* ── EL RELOJ: PASO FIJO DE 60 CON TOPE ──
   Un minijuego que se juega por reflejos NO PUEDE depender de los cuadros por
   segundo del aparato: si la moneda cae más rápido en un teléfono lento, es
   otro juego. La simulación va a 60 pasos fijos y el dibujo sale de donde
   quedó. Y el `dt` se topa en un cuarto de segundo, porque una pestaña que
   estuvo dormida no puede simular un minuto de golpe. */
const PASO = 1/60;
let _acum = 0, _ultimo = performance.now();
let MODO = 'idioma';      /* idioma · menu · como · cine · juega · fin */
let PAUSA = false, CONGELADO = false;
let fps = 0, _cuadros = 0, _acumF = 0;

/* la entrada: un solo verbo. Llega normalizada a las unidades de diseño, así
   que un juego nunca ve un píxel de pantalla. */
const TOQUE = { x: 0, y: 0, abajo: false, movido: false, n: 0 };
function aDiseno(ev){
  const r = lienzo.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: (t.clientX - r.left) / r.width * AN,
           y: (t.clientY - r.top) / r.height * AL };
}
/* ── EL `preventDefault` DE UN `touchstart` CANCELA EL CLICK, Y ESO DEJABA EL
       JUEGO SIN PODER EMPEZAR ──
   Los cuatro escuchas estaban colgados de la VENTANA, así que un toque en el
   botón JUGAR o en el de idioma pasaba primero por acá, llegaba a
   `preventDefault()` —el juego consume el toque— y el navegador entonces NO
   sintetiza el `click`. En el banco no se veía: Playwright despacha un click de
   ratón de verdad y ese camino no pasa por el táctil. En un teléfono, tocar
   JUGAR no hacía absolutamente nada.

   Ahora la entrada del juego cuelga del LIENZO. Los paneles viven por encima
   (`z-index 5`), así que mientras hay un panel abierto el lienzo no recibe nada
   y los botones son botones; en partida no hay panel y el lienzo recibe todo.
   `touchend`/`mouseup` siguen en la ventana a propósito: un arrastre que
   termina afuera del marco tiene que soltar igual. */
function baja(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.abajo = true; TOQUE.movido = false; TOQUE.n++;
  if (MODO === 'cine'){ cineSalta(); return; }
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function mueve(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.movido = true;
  if (MODO === 'juega' && TOQUE.abajo && JUEGO.mueve) JUEGO.mueve(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function sube(){
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(TOQUE.x, TOQUE.y);
  TOQUE.abajo = false;
}
lienzo.addEventListener('touchstart', baja, { passive: false });
lienzo.addEventListener('touchmove', mueve, { passive: false });
addEventListener('touchend', sube, { passive: true });
addEventListener('touchcancel', sube, { passive: true });
lienzo.addEventListener('mousedown', baja);
addEventListener('mousemove', (e) => { if (TOQUE.abajo) mueve(e); });
addEventListener('mouseup', sube);
/* la barra espaciadora hace de toque EN EL MEDIO del marco: es lo que permite
   probarlo en una notebook sin fingir un táctil. Y va con las coordenadas de
   diseño y no con las del evento, porque un `keydown` no trae ninguna — con
   `clientX` en cero el toque caía en el borde izquierdo, que en un juego de
   tocar la mitad es una respuesta equivocada. */
function toqueMedio(){
  if (MODO === 'cine'){ cineSalta(); return; }
  TOQUE.x = AN/2; TOQUE.y = AL/2; TOQUE.abajo = true;
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(AN/2, AL/2);
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(AN/2, AL/2);
  TOQUE.abajo = false;
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') toqueMedio();
});
/* ══════════════════════ EL GIROSCOPIO Y LA SACUDIDA ══════════════════════
   Dos cosas distintas que salen del mismo aparato: cuanto esta INCLINADO el
   telefono (`deviceorientation`) y cuando lo SACUDEN (`devicemotion`). La
   primera es una posicion y la segunda un acontecimiento, y por eso se leen de
   dos eventos y no de uno.

   ── POR QUE NO SE USA LA CAMARA PARA ESTO ──
   Es la leccion de BARRIO: para saber para donde esta mirando el jugador, lo
   obvio seria detectar la cara. Y no hace falta — el telefono YA sabe como esta
   orientado, sin camara, sin modelo y sin un milisegundo de deteccion. La
   orientacion del aparato ES la postura del jugador, porque el aparato lo tiene
   en la mano.

   ── LAS CINCO COSAS QUE HAY QUE HACER BIEN, Y CADA UNA COSTO UNA VUELTA ──
   1. EL PERMISO DE iOS. Desde iOS 13, `deviceorientation` no dispara hasta que
      `DeviceOrientationEvent.requestPermission()` se llama DENTRO de un gesto
      del usuario. Llamado en el arranque, la promesa se rechaza y el juego se
      queda sin sensor sin decir por que.
   2. EL CERO ES LA POSTURA EN LA QUE SE EMPEZO. Nadie juega con el telefono
      perfectamente vertical: con un cero absoluto, el juego arranca inclinado.
   3. ZONA MUERTA. Una mano nunca esta quieta, y sin zona muerta el mundo
      tiembla despacio todo el tiempo. 1,6 grados, que es lo que se midio en
      BARRIO.
   4. LA VUELTA CORTA. `beta` y `gamma` dan la vuelta: cruzando de 179 a -179 la
      diferencia cruda son 358 grados y el mundo pega media vuelta.
   5. LA SACUDIDA SE MIDE EN EL CAMBIO Y NO EN LA MAGNITUD. La gravedad ya son
      9,8: mirando el modulo de la aceleracion, el telefono quieto parece estar
      sacudiendose siempre. Lo que distingue una sacudida es que el vector
      CAMBIE rapido. */

const GIRO = {
  estado: 'no',        /* no · pidiendo · lista · negado · sin · insegura */
  on: false,
  x: 0, y: 0,          /* la inclinacion, de -1 a 1, ya con cero y zona muerta */
  crudo: { b: 0, g: 0, a: 0 },
  cero: { b: 0, g: 0, a: 0 },
  hayCero: false,
  n: 0,                /* eventos recibidos: distingue «no hay sensor» de «no llego ninguno» */
  sac: 0,              /* fuerza de la ultima sacudida, decae */
  sacN: 0,
  sacPico: 0,
  _sacFrio: 0,
  _ult: null,
  /* ── LO QUE CADA JUEGO AJUSTA ──
     `rango` son los grados de inclinacion que valen 1: un laberinto quiere poco
     (se juega con muñeca) y una camara quiere mas. `recentra` es la constante de
     tiempo con la que el cero persigue la postura actual — un juego de mirar la
     quiere para que dejar el telefono torcido no te deje mirando al techo, y un
     laberinto NO la quiere, porque ahi el cero es el nivel del piso. */
  rango: 30,
  recentra: 0,
  zona: 1.6
};
const GIRO_SAC_UMB = 22;      /* m/s^2 de CAMBIO para que cuente como sacudida */
const GIRO_SAC_FRIO = 0.42;   /* segundos entre dos sacudidas */

/* la vuelta corta: la diferencia entre dos angulos, siempre en (-180, 180] */
function giroDelta(a, b){
  let d = a - b;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

function giroEvento(e){
  if (e.beta == null && e.gamma == null) return;   /* el evento existe y viene vacio */
  GIRO.n++;
  GIRO.crudo.b = e.beta || 0;
  GIRO.crudo.g = e.gamma || 0;
  GIRO.crudo.a = e.alpha || 0;
  if (!GIRO.hayCero) giroCero();
  GIRO.on = true;
  giroCalcula();
}
function giroCero(){
  GIRO.cero.b = GIRO.crudo.b; GIRO.cero.g = GIRO.crudo.g; GIRO.cero.a = GIRO.crudo.a;
  GIRO.hayCero = true;
}
function giroCalcula(){
  /* en vertical, `gamma` es inclinar de costado y `beta` adelante y atras */
  const dg = giroDelta(GIRO.crudo.g, GIRO.cero.g);
  const db = giroDelta(GIRO.crudo.b, GIRO.cero.b);
  const z = GIRO.zona;
  const ap = (d) => {
    const s = Math.sign(d), m = Math.abs(d);
    if (m <= z) return 0;
    return Math.max(-1, Math.min(1, s*(m - z)/GIRO.rango));
  };
  GIRO.x = ap(dg);
  GIRO.y = ap(db);
}

/* ── LA SACUDIDA ──
   Se mira el CAMBIO del vector de aceleracion entre dos eventos. Y con
   `accelerationIncludingGravity`, que es la que existe en todos los aparatos —
   `acceleration` sin gravedad la informa solo una parte de ellos, y la
   diferencia entre dos lecturas ya le quita la gravedad, porque la gravedad no
   cambia. */
function giroMocion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const p = GIRO._ult;
  GIRO._ult = { x: a.x, y: a.y, z: a.z };
  if (!p) return;
  const d = Math.hypot(a.x - p.x, a.y - p.y, a.z - p.z);
  GIRO.sacPico = Math.max(GIRO.sacPico, d);
  if (d > GIRO_SAC_UMB && GIRO._sacFrio <= 0){
    GIRO._sacFrio = GIRO_SAC_FRIO;
    giroSacudida(Math.min(1, (d - GIRO_SAC_UMB)/34 + 0.35));
  }
}
/* quien quiera enterarse se cuelga de acá: el juego pone `GIRO.alSacudir` */
function giroSacudida(k){
  GIRO.sac = Math.max(GIRO.sac, k);
  GIRO.sacN++;
  if (GIRO.alSacudir) GIRO.alSacudir(k);
}

function giroPaso(dt){
  if (GIRO._sacFrio > 0) GIRO._sacFrio = Math.max(0, GIRO._sacFrio - dt);
  if (GIRO.sac > 0) GIRO.sac = Math.max(0, GIRO.sac - dt*3.2);
  /* el recentrado va DESPACIO y solo cuando el juego lo pide: rapido, el mundo
     se endereza solo mientras uno lo esta inclinando y no se puede jugar */
  if (GIRO.recentra > 0 && GIRO.hayCero){
    const k = Math.min(1, dt/GIRO.recentra);
    GIRO.cero.b += giroDelta(GIRO.crudo.b, GIRO.cero.b)*k;
    GIRO.cero.g += giroDelta(GIRO.crudo.g, GIRO.cero.g)*k;
    giroCalcula();
  }
}

/* ── SE PIDE DENTRO DE UN GESTO, Y DEVUELVE SI QUEDO ANDANDO ──
   Y no bloquea: si el permiso se niega o el aparato no tiene sensor, el juego
   tiene que seguir siendo jugable con el dedo. Cada juego trae su respaldo. */
async function giroPide(){
  if (GIRO.estado === 'lista' || GIRO.estado === 'pidiendo') return GIRO.on;
  GIRO.estado = 'pidiendo';
  /* sin HTTPS los sensores no existen en varios navegadores, y ahi no hay
     permiso que negar: ni preguntan. Es la causa mas facil de confundir con un
     error del juego. */
  if (!window.isSecureContext && location.protocol !== 'file:'){
    GIRO.estado = 'insegura'; return false;
  }
  if (typeof DeviceOrientationEvent === 'undefined'){ GIRO.estado = 'sin'; return false; }
  const DOE = DeviceOrientationEvent, DME = window.DeviceMotionEvent;
  try {
    if (DOE && typeof DOE.requestPermission === 'function'){
      const r = await DOE.requestPermission();
      if (r !== 'granted'){ GIRO.estado = 'negado'; return false; }
    }
    if (DME && typeof DME.requestPermission === 'function'){
      try { await DME.requestPermission(); } catch(e){}
    }
  } catch(e){ GIRO.estado = 'negado'; return false; }
  addEventListener('deviceorientation', giroEvento, { passive: true });
  addEventListener('devicemotion', giroMocion, { passive: true });
  GIRO.estado = 'lista';
  /* ── Y SE COMPRUEBA QUE LLEGUE ALGO ──
     En una notebook `deviceorientation` se registra sin error y NUNCA dispara:
     el estado diria «lista» con el sensor muerto, y el juego esperaria para
     siempre una inclinacion que no va a llegar. A los 1,2 s, si no llego ni un
     evento, se declara sin sensor y entra el respaldo. */
  setTimeout(() => { if (GIRO.n === 0 && GIRO.estado === 'lista') GIRO.estado = 'sin'; }, 1200);
  return true;
}

function giroVer(){
  return { estado: GIRO.estado, on: GIRO.on, n: GIRO.n,
           x: +GIRO.x.toFixed(3), y: +GIRO.y.toFixed(3),
           crudo: [Math.round(GIRO.crudo.b), Math.round(GIRO.crudo.g)],
           cero: [Math.round(GIRO.cero.b), Math.round(GIRO.cero.g)],
           sac: +GIRO.sac.toFixed(2), sacN: GIRO.sacN,
           sacPico: +GIRO.sacPico.toFixed(1),
           rango: GIRO.rango, recentra: GIRO.recentra };
}
/* ══════════════════════ LA MANO POR LA CAMARA ══════════════════════
   MediaPipe lee la mano y de los veintiun puntos sale UNA cosa: que gesto es.
   No se dibuja la mano en 3D ni se apunta con ella —eso ya lo hacen RECREO y
   RezUno—: acá lo unico que hace falta es piedra, papel o tijera, o sea un
   simbolo, y un simbolo es mucho mas barato y mucho mas robusto que una
   posicion.

   ── TODO LO QUE SIGUE SALE DE DOS JUEGOS QUE YA COSTARON SUS VUELTAS ──
   1. LA CAMARA SE PIDE CON `exact` Y NO COMO PREFERENCIA. `facingMode:'user'` a
      secas es un DESEO: el navegador abre la que quiera. Con `exact`, si la
      peticion vuelve ES esa camara; si no hay, tira y se prueba la otra.
   2. LA ENTRADA VA A 640x480 Y NO A 256x192. Medido en RezUno: diez veces mas
      pixeles NO cuestan mas —MediaPipe redimensiona adentro al tamano de sus
      modelos— y bajarla es regalar deteccion a cambio de nada.
   3. LOS UMBRALES VAN BAJOS (0,4 / 0,4 / 0,3). Soltar una mano ya encontrada no
      cuesta un cuadro: la medicion siguiente tiene que volver a correr el
      buscador de palma, que es la parte cara. Dudar sale mas caro que seguir.
   4. LA MEDICION CUELGA DEL CUADRO DE CAMARA y no del de render: con
      `requestVideoFrameCallback` corre una vez por cuadro de camara, que es lo
      unico que puede traer datos nuevos.
   5. GPU PRIMERO Y CPU DE RESPALDO: en telefonos viejos el delegado de GPU tira
      al crear la tarea, y un detector a 15 por segundo en CPU sigue siendo
      jugable.
   6. DOS CDN: el detector es una descarga de un tercero, y si ese tercero no
      contesta el juego se queda sin manos y el jugador no puede hacer nada.
   7. EL GESTO NO SE TOMA, SE SOSTIENE. Un gesto mal leido en un juego donde el
      gesto es la jugada es una derrota que el jugador no entiende: cada lectura
      tiene que ganar tres cuadros seguidos para valer. */

const MANO_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MANO_CDN = [
  { js: MANO_URL, wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm' }];
const MANO_MODELO = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const MANO_ENT_W = 640, MANO_ENT_H = 480;

const MANO = {
  estado: 'no',      /* no · pidiendo · lista · permiso · camara · cdn · modelo · insegura */
  det: null, vid: null, usa: '', espejo: true, delegado: '',
  pts: null,         /* los 21 puntos crudos, para dibujar */
  dedos: -1,         /* cuantos estirados, crudo */
  gesto: null,       /* 'piedra' · 'papel' · 'tijera' · null, ya votado */
  gestoCrudo: null,
  n: 0, hz: 0,
  _votos: [], _ultT: 0, _huecos: 0
};
/* ── LA CAMARA FRONTAL, Y ACA SI ES LA CORRECTA ──
   Al reves de RECREO y RezUno, donde se mete la mano POR DETRAS del telefono
   para que entre en la escena. Piedra papel o tijera se juega mostrando la mano
   DE FRENTE, como se juega de verdad, y el jugador tiene que poder verse: con la
   trasera habria que apuntar el telefono para el otro lado y jugar a ciegas. */
const MANO_PREF = 'user';

function manoFallo(q){ MANO.estado = q; if (window.pintaMano) window.pintaMano(); }

async function manoPide(){
  if (MANO.estado === 'lista' || MANO.estado === 'pidiendo') return MANO.estado === 'lista';
  MANO.estado = 'pidiendo';
  if (window.pintaMano) window.pintaMano();
  /* sin HTTPS `navigator.mediaDevices` NO EXISTE, asi que no hay permiso que
     negar: el navegador ni pregunta */
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ manoFallo('insegura'); return false; }
  const pedir = (v) => navigator.mediaDevices.getUserMedia({
    video: Object.assign({ width: { ideal: MANO_ENT_W }, height: { ideal: MANO_ENT_H },
                           frameRate: { ideal: 60 } }, v), audio: false });
  let flujo = null, cierto = '';
  const otra = MANO_PREF === 'user' ? 'environment' : 'user';
  try { flujo = await pedir({ facingMode: { exact: MANO_PREF } }); cierto = MANO_PREF; }
  catch(e){
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){ manoFallo('permiso'); return false; }
    try { flujo = await pedir({ facingMode: { exact: otra } }); cierto = otra; }
    catch(e2){
      if (e2 && (e2.name === 'NotAllowedError' || e2.name === 'SecurityError')){ manoFallo('permiso'); return false; }
      try { flujo = await pedir({}); }
      catch(e3){ manoFallo((e3 && (e3.name === 'NotFoundError' || e3.name === 'OverconstrainedError')) ? 'camara' : 'permiso'); return false; }
    }
  }
  const v = $('camVid');
  v.srcObject = flujo; MANO.vid = v;
  try { await v.play(); } catch(e){}
  try {
    const tr = flujo.getVideoTracks()[0];
    const s = tr.getSettings ? tr.getSettings() : {};
    /* ── EL ESPEJO SE LEE DEL TRACK Y LA REGLA ES ASIMETRICA ──
       Una camara que NO dice para donde mira no es la trasera: un telefono
       informa su `facingMode` y una webcam callada es de las que apuntan a la
       cara. Medido en el banco, `getSettings()` de una camara de notebook no
       trae la clave, y suponer «trasera» dejaba la imagen sin espejo. */
    MANO.usa = cierto || s.facingMode || 'user';
    MANO.espejo = (MANO.usa !== 'environment');
  } catch(e){ MANO.usa = cierto || 'user'; MANO.espejo = true; }

  let vision = null;
  for (const cdn of MANO_CDN){
    try { vision = await import(/* @vite-ignore */ cdn.js); MANO.cdn = cdn; break; } catch(e){}
  }
  if (!vision){ manoFallo('cdn'); return false; }
  try {
    const fs = await vision.FilesetResolver.forVisionTasks(MANO.cdn.wasm);
    for (const del of ['GPU','CPU']){
      try {
        MANO.det = await vision.HandLandmarker.createFromOptions(fs, {
          baseOptions: { modelAssetPath: MANO_MODELO, delegate: del },
          runningMode: 'VIDEO', numHands: 1,
          minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4,
          minTrackingConfidence: 0.3 });
        MANO.delegado = del; break;
      } catch(e){}
    }
  } catch(e){}
  if (!MANO.det){ manoFallo('modelo'); return false; }
  MANO.estado = 'lista';
  if (window.pintaMano) window.pintaMano();
  manoLazo();
  return true;
}

/* la medicion cuelga del cuadro de CAMARA: es lo unico que puede traer datos
   nuevos, y colgada del render se mide dos veces el mismo cuadro */
function manoLazo(){
  const v = MANO.vid;
  if (!v || !MANO.det) return;
  const paso = () => {
    if (!MANO.det) return;
    try {
      const t = performance.now();
      const r = MANO.det.detectForVideo(v, t);
      manoLee(r && r.landmarks && r.landmarks[0] ? r.landmarks[0] : null);
      if (MANO._ultT) MANO.hz = Math.round(1000/Math.max(1, t - MANO._ultT));
      MANO._ultT = t;
      MANO.n++;
    } catch(e){}
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
    else setTimeout(paso, 40);
  };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
  else setTimeout(paso, 40);
}

/* ══════════ DE VEINTIUN PUNTOS A UN SIMBOLO ══════════
   ── TODO SE MIDE EN PROPORCION AL TAMANO DE LA PALMA ──
   La mano puede estar a veinte centimetros o a un metro de la camara, asi que
   ninguna distancia en pixeles sirve. La palma —muñeca al nudillo del medio— es
   invariante a la distancia Y al tamano de la mano de quien juega. Es la misma
   regla que en RECREO.

   ── Y EL PULGAR NO SE MIDE COMO LOS DEMAS ──
   Los otros cuatro se estiran ALEJANDO la punta de la muñeca. El pulgar se abre
   hacia el COSTADO, y su punta puede quedar a la misma distancia de la muñeca
   abierto o cerrado: se mide contra el nudillo del MENIQUE, del que se aleja al
   abrirse y al que le cruza por delante al cerrarse. Sin esa distincion, «cinco
   dedos» no existe. */
const M_TIP = [4, 8, 12, 16, 20], M_PIP = [3, 6, 10, 14, 18];
function manoLee(pts){
  MANO.pts = pts;
  if (!pts){
    MANO.dedos = -1; MANO.gestoCrudo = null;
    MANO._huecos++;
    /* ── LA CADUCIDAD SE MIDE EN HUECOS Y NO EN MILISEGUNDOS ──
       280 ms fijos son once mediciones a 40 Hz y tres y media a 12: en un
       aparato lento, dos fallos seguidos borraban el gesto. */
    if (MANO._huecos > 5){ MANO.gesto = null; MANO._votos.length = 0; }
    return;
  }
  MANO._huecos = 0;
  const d = (a, b) => Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y);
  const palma = Math.max(0.0001, d(0, 9));
  const est = [];
  /* el pulgar: abierto se aleja del nudillo del meñique */
  est.push(d(4, 17)/palma > 0.92);
  for (let i = 1; i < 5; i++){
    /* la punta mas lejos de la muñeca que la falange de en medio */
    est.push(d(M_TIP[i], 0) > d(M_PIP[i], 0)*1.14);
  }
  const n = est.filter(Boolean).length;
  MANO.dedos = n;
  let g = null;
  if (n <= 1) g = 'piedra';
  else if (n >= 4) g = 'papel';
  else if (n === 2 && est[1] && est[2]) g = 'tijera';
  /* dos dedos que NO son el indice y el medio no son tijera: es una mano a
     medio cerrar, y tomarla por tijera es perder una ronda por una lectura */
  MANO.gestoCrudo = g;
  MANO._votos.push(g);
  if (MANO._votos.length > 3) MANO._votos.shift();
  if (MANO._votos.length === 3 && MANO._votos[0] === MANO._votos[1] &&
      MANO._votos[1] === MANO._votos[2]) MANO.gesto = MANO._votos[0];
}

function manoVer(){
  return { estado: MANO.estado, usa: MANO.usa, espejo: MANO.espejo,
           delegado: MANO.delegado, n: MANO.n, hz: MANO.hz,
           dedos: MANO.dedos, gesto: MANO.gesto, crudo: MANO.gestoCrudo,
           pts: MANO.pts ? MANO.pts.length : 0, huecos: MANO._huecos };
}
/* la sonda: una mano de mentira con los dedos que se pidan, para poder probar
   el camino entero sin una camara */
function manoFalsa(dedos, tijera){
  const p = [];
  for (let i = 0; i < 21; i++) p.push({ x: 0.5, y: 0.5, z: 0 });
  p[0] = { x: 0.5, y: 0.9, z: 0 };      /* muñeca */
  p[9] = { x: 0.5, y: 0.62, z: 0 };     /* nudillo del medio: la palma mide 0,28 */
  p[17] = { x: 0.40, y: 0.68, z: 0 };   /* nudillo del meñique */
  const abierto = [];
  if (tijera){ abierto.push(1, 2); }
  else if (dedos >= 4){ abierto.push(0, 1, 2, 3, 4); }
  else for (let i = 1; i <= dedos; i++) abierto.push(i);
  for (let i = 0; i < 5; i++){
    const ab = abierto.indexOf(i) >= 0;
    const bx = 0.34 + i*0.08;
    if (i === 0){
      /* el pulgar: abierto se va al costado y lejos del meñique */
      p[3] = { x: ab ? 0.72 : 0.50, y: 0.74, z: 0 };
      p[4] = { x: ab ? 0.82 : 0.46, y: 0.70, z: 0 };
    } else {
      p[M_PIP[i]] = { x: bx, y: 0.56, z: 0 };
      p[M_TIP[i]] = { x: bx, y: ab ? 0.30 : 0.66, z: 0 };
    }
  }
  manoLee(p);
  return manoVer();

/* ══════════════════════════════ DADOS ══════════════════════════════
   Se SACUDE el teléfono y los dados se tiran. Se guardan los que sirven, se
   tira otra vez, y la mano puntúa por lo que salió. Cada ronda pide más, y al
   pasarla se elige una reliquia que queda para toda la corrida.

   POR QUE ESTE GENERO Y ESTE SENSOR:
   Sacudir para tirar un dado no es una idea: es el gesto que la gente YA hace
   con un cubilete, y es el unico caso en el que un sensor no se siente pegado
   encima. Y un roguelike de dados es la forma mas barata que existe de que una
   partida de dos minutos importe: las reliquias se acumulan, asi que la corrida
   veinte no se parece a la corrida uno aunque el juego sea el mismo.

   ── LA ESTRUCTURA ES DE TRES NIVELES, Y ESO ES A PROPOSITO ──
   TIRADA (se sacude) -> MANO (tres tiradas, puntua una vez) -> RONDA (tres
   manos, hay que llegar a un objetivo). Con un solo nivel no hay decision: se
   tira y sale lo que sale. La decision esta en QUE GUARDAR, y guardar solo
   significa algo si queda otra tirada; y la tension esta en el objetivo, que
   solo significa algo si hay varias manos para llegar. */

const D_CARAS = 6;
const D_DADOS0 = 5, D_TIRADAS0 = 3, D_MANOS0 = 3;
const D_TOPE_DADOS = 7;

/* ── LOS COMBOS ──
   Base mas multiplicador, que es lo que hace que un poker no sea «un poco mejor
   que un par» sino OTRA cosa: con solo la base, la diferencia entre el mejor y
   el peor combo es de tres veces; con el multiplicador encima es de veinte, y
   ahi buscar el combo grande vale arriesgar una tirada. */
const D_COMBOS = [
  { k:'quintilla', base:120, mult:6 },
  { k:'poker',     base: 75, mult:4 },
  { k:'full',      base: 55, mult:3 },
  { k:'escalera',  base: 45, mult:3 },
  { k:'terna',     base: 30, mult:2 },
  { k:'doblepar',  base: 20, mult:2 },
  { k:'par',       base: 10, mult:1 },
  { k:'nada',      base:  0, mult:1 }
];

/* ── LAS RELIQUIAS ──
   Doce, y cada una cambia una cosa distinta: cuantas tiradas hay, cuantas
   manos, cuantos dados, como se suma, como multiplica, o el objetivo. Doce que
   todas dieran «mas puntos» serian una sola reliquia con doce nombres. */
/* ── Y CADA UNA TIENE TOPE, QUE ES LO QUE FALTABA Y ROMPIA EL JUEGO ──
   Sin tope, `+1 tirada` y `+1 mano` se acumulan: cada ronda da mas tiradas y
   mas manos, o sea que la ronda siguiente es MAS FACIL que la anterior. Medido
   con el auto-jugador, la corrida llegaba a la RONDA 419 con ciento cinco
   tiradas y ciento ocho manos por ronda y un puntaje de 1,4 por diez a la
   dieciseis. Eso no es un roguelike: es una cuenta que crece sola.
   Los topes son distintos a proposito: las dos que multiplican todo lo demas
   —tiradas y manos— son las mas cortas, y las que solo suman puntos aguantan
   mas. Y una reliquia con el tope puesto NO SE OFRECE, porque una carta muerta
   en una mano de tres es un tercio de la decision tirado. */
const D_RELIQ = [
  { k:'tirada',  cara:'+1',    tope:3 },
  { k:'mano',    cara:'+1',    tope:3 },
  { k:'dado',    cara:'+1',    tope:2 },
  { k:'unos',    cara:'1→6',   tope:1 },
  { k:'pares',   cara:'+15',   tope:3 },
  { k:'escala',  cara:'×2',    tope:2 },
  { k:'poker',   cara:'+40',   tope:3 },
  { k:'suma',    cara:'+1',    tope:3 },
  { k:'mult',    cara:'+1',    tope:5 },
  { k:'terna',   cara:'+25',   tope:3 },
  { k:'guarda',  cara:'×2',    tope:1 },
  { k:'facil',   cara:'−12%',  tope:4 }
];

let D_dados = [];          /* {v, guardado, gi, vgi, tumba} */
let D_ronda = 1, D_mano = 1, D_tirada = 0;
let D_puntosRonda = 0, D_objetivo = 0;
let D_rel = {};            /* clave -> cuantas veces se tomo */
let D_fase = 'espera';     /* espera · tirando · elegir · fin */
let D_tumba = 0;           /* reloj de la tirada, cosmético */
let D_ultCombo = null, D_ultPts = 0, D_ultT = 0;
let D_oferta = [];         /* las tres reliquias que se ofrecen */
let D_azar = 7;
let D_maxRonda = 1;
let D_SEM = 991;
let D_cadena = null;       /* el combo de la mano anterior, para la reliquia */
function dAz(){ D_azar = (D_azar*1664525 + 1013904223) >>> 0; return D_azar / 4294967296; }

const dR = (k) => D_rel[k] || 0;
const dTiradas = () => D_TIRADAS0 + dR('tirada');
const dManos = () => D_MANOS0 + dR('mano');
const dNDados = () => Math.min(D_TOPE_DADOS, D_DADOS0 + dR('dado'));
/* ── EL OBJETIVO CRECE GEOMETRICAMENTE, Y ESO SALIO DE MEDIR DOS VECES ──
   Primero fue una potencia de la ronda (`38 * r^1.42`), que es lo que uno
   escribe. Medido con el auto-jugador: llegaba a la RONDA 112. La razon es que
   las reliquias tienen tope, asi que a partir de la ronda ~34 el puntaje que un
   jugador puede sacar se PLANCHA en unos veinte mil por ronda — y una potencia
   con exponente 1,42 tarda cien rondas en llegar ahi. Una corrida de cien
   rondas no es un roguelike, es una tarea.
   Geometrico si alcanza al techo: cada ronda pide un tanto por ciento mas, o
   sea que cruza cualquier techo en unas veinte. La razon se barrio midiendo —
   ver la tabla en `juegaSolo`. */
let D_KOBJ = 44, D_ROBJ = 1.42;
function dObjetivo(r){
  const b = Math.round(D_KOBJ * Math.pow(D_ROBJ, r - 1));
  return Math.max(20, Math.round(b * Math.pow(0.88, dR('facil'))));
}

/* ══════════ EL PUNTAJE DE UNA MANO ══════════
   Una sola funcion, y la usan el juego Y el auto-jugador: con dos cuentas, el
   bot elegiria guardar dados por un puntaje que el juego no paga. */
function dCombo(v){
  const c = new Array(D_CARAS + 1).fill(0);
  for (const x of v) c[x]++;
  const cuentas = c.slice(1).sort((a, b) => b - a);
  const set = new Set(v);
  /* la escalera necesita cinco valores seguidos, y con seis o siete dados puede
     estar adentro de un puñado mas grande: se busca la corrida mas larga */
  let mejorCorr = 0, corr = 0;
  for (let i = 1; i <= D_CARAS; i++){
    if (set.has(i)){ corr++; mejorCorr = Math.max(mejorCorr, corr); }
    else corr = 0;
  }
  if (cuentas[0] >= 5) return 'quintilla';
  if (cuentas[0] === 4) return 'poker';
  if (cuentas[0] === 3 && cuentas[1] >= 2) return 'full';
  if (mejorCorr >= 5) return 'escalera';
  if (cuentas[0] === 3) return 'terna';
  if (cuentas[0] === 2 && cuentas[1] === 2) return 'doblepar';
  if (cuentas[0] === 2) return 'par';
  return 'nada';
}
function dPuntos(v, guardados){
  const k = dCombo(v);
  const C = D_COMBOS.find(c => c.k === k);
  let base = C.base, mult = C.mult;
  if (k === 'par' || k === 'doblepar') base += 15*dR('pares');
  if (k === 'terna' || k === 'full') base += 25*dR('terna');
  if (k === 'poker' || k === 'quintilla') base += 40*dR('poker');
  if (k === 'escalera') mult *= Math.pow(2, dR('escala'));
  mult += dR('mult');
  /* la suma de los dados: los unos pueden valer seis, cada dado puede valer uno
     mas, y los guardados pueden contar doble */
  let suma = 0;
  for (let i = 0; i < v.length; i++){
    let x = v[i];
    if (x === 1 && dR('unos') > 0) x = 6;
    x += dR('suma');
    if (guardados && guardados[i] && dR('guarda') > 0) x *= 2;
    suma += x;
  }
  let p = (base + suma) * mult;
  /* la cadena: dos manos seguidas con el mismo combo pagan mas. Es la unica
     reliquia que premia repetir una jugada en vez de buscar la mejor, o sea la
     unica que cambia COMO se juega y no cuanto se cobra. */
  if (dR('cadena') > 0 && D_cadena === k && k !== 'nada') p = Math.round(p*1.5);
  return { k, base, mult, suma, pts: Math.round(p) };
}

  pt: { sub:'Sacuda o telefone para rolar. Guarde os que servem e role de novo.',
        c1:'Sacuda e os dados caem.',
        c2:'Toque num dado para guardar e role de novo.',
        c3:'Chegue ao alvo da rodada e escolha uma relíquia.',
        tirar:'ROLAR', sacudi:'SACUDA', obj:'ALVO', rondaC:'RODADA',
        manoC:'MÃO', tiradaC:'ROLAGEM', elegi:'ESCOLHA UMA RELÍQUIA',
        nada:'nada', par:'par', doblepar:'dois pares', terna:'trinca',

        r_pares:'Par e dois pares valem mais', r_escala:'A sequência multiplica o dobro',

};
const PIEL = { ac:'#f2c33c', tela:'fondo', rachaFin:false };
const SON_ALIAS = { bien:'dado', toque:'clic', pierde:'perder', gana:'gana', clic:'clic' };

/* ══════════ EL AMBIENTE ══════════
   Un tapete de casino bajo un foco. El haz es el más fuerte de los seis (0,18)
   y eso es la puesta en escena entera: lo que separa una mesa de juego de un
   fondo verde es que haya UN cono de luz cayendo sobre los dados, con el polvo
   dorado flotando adentro. */
const AMB = {
  foto: 'f_dados',
  cielo: ['#10231a', '#0a1710'],
  haz: 0.18,
  vineta: 0.50,
  part: { n: 22, dir: 'cae', forma: 'disco', col: '#ffd76a',
          r0: 1.2, r1: 3.0, v0: 5, v1: 18, amp: 40, gira: 0,
          a0: 0.08, a1: 0.22 }
};


/* ══════════ GEOMETRIA ══════════ */
let DG = { s: 96, y: 700, x0: 0, hueco: 12 };
function dGeo(){
  const n = dNDados();
  /* el lado del dado sale del ancho: cinco dados y siete tienen que entrar los
     dos, y con un lado fijo el septimo se sale del marco */
  /* el margen es 120 y no 80: el dado se dibuja GIRADO, y girado 45 grados su
     media diagonal es 1,41 veces su medio lado — medido en la captura, el
     primero de la fila llegaba a cinco pixeles del borde izquierdo */
  DG.s = Math.floor(Math.min(112, (AN - 120) / n - 10));
  DG.hueco = Math.floor(DG.s*0.14);
  const tot = n*DG.s + (n-1)*DG.hueco;
  DG.x0 = (AN - tot)/2;
  DG.y = AL*0.46;
}
function dCaja(i){
  return { x: DG.x0 + i*(DG.s + DG.hueco), y: DG.y - DG.s/2, s: DG.s };
}

const JUEGO = {
  id: 'dados',
  tipo: 'puntos',
  /* el giroscopio ES la tirada. Y hay boton igual, porque sin sensor —una
     notebook, un permiso negado— el juego tiene que poder jugarse. */
  usa: ['giro'],
  vivo: true, gano: false,
  get marca(){ return D_puntosRonda; },
  get sub(){ return TX('obj') + ' ' + D_objetivo; },
  get ficI(){ return TX('rondaC') + ' ' + D_ronda; },
  get ficD(){ return TX('manoC') + ' ' + Math.min(D_mano, dManos()) + '/' + dManos(); },
  get resta(){ return Math.max(0, Math.min(1, D_puntosRonda/Math.max(1, D_objetivo))); },

  planos: [
    { dur: 2.8, pie: 'c1', dibuja(g, u){
        dFondo(g);
        dGeo();
        /* los dados cayendo: es la unica cosa que se mueve en el plano */
        const s = suave(Math.min(1, u*1.4));
        for (let i = 0; i < 5; i++){
          const c = dCaja(i);
          const t = Math.max(0, Math.min(1, u*2.2 - i*0.14));
          const y = c.y - (1 - suave(t))*420;
          dDado(g, c.x, y, c.s, 1 + Math.floor(dAz()*6), false, (1-t)*7);
        }
      } },
    { dur: 3.2, pie: 'c2', dibuja(g, u){
        dFondo(g);
        dGeo();
        /* dos guardados y tres girando: la decision del juego, sin palabras */
        const v = [4, 4, 2, 6, 3];
        for (let i = 0; i < 5; i++){
          const c = dCaja(i);
          const gu = i < 2 && u > 0.30;
          const tum = (!gu && u > 0.55) ? (u - 0.55)*9 : 0;
          dDado(g, c.x, c.y - (gu ? 18 : 0), c.s,
                tum ? 1 + Math.floor(dAz()*6) : v[i], gu, tum);
        }
      } },
    { dur: 3.4, pie: 'c3', dibuja(g, u){
        dFondo(g);
        /* las tres cartas de reliquia: es la promesa del juego, o sea lo que
           hace que perder no importe */
        const s = suave(Math.min(1, u*1.3));
        dCartas(g, [D_RELIQ[0], D_RELIQ[5], D_RELIQ[8]], -1, s);
        texto(TX('elegi'), AN/2, AL*0.30, 28, '#ffd76a', '800', 'center');
      } }
  ],

  arranca(){
    D_azar = (Date.now() ^ 0x1d3f7b) >>> 0;
    D_rel = {};
    D_ronda = 1; D_maxRonda = 1;
    D_fase = 'espera';
    D_oferta.length = 0;
    D_cadena = null;
    this.vivo = true; this.gano = false;
    this.rondaNueva();
    /* ── LA SACUDIDA ENTRA POR UN GANCHO Y NO SE CONSULTA CADA CUADRO ──
       Mirando `GIRO.sac > 0` en `paso`, una sola sacudida dispara sesenta veces
       —el valor decae en varios cuadros— y la mano se tiraria sola hasta el
       final. Un gancho es un acontecimiento, que es lo que una sacudida es. */
    GIRO.alSacudir = () => { if (MODO === 'juega') this.tira(); };
    GIRO.rango = 34;
  },

  rondaNueva(){
    D_objetivo = dObjetivo(D_ronda);
    D_puntosRonda = 0;
    D_mano = 1;
    D_cadena = null;
    this.manoNueva();
  },
  manoNueva(){
    dGeo();
    D_dados = [];
    for (let i = 0; i < dNDados(); i++)
      D_dados.push({ v: 1 + Math.floor(dAz()*D_CARAS), guardado: false, gi: 0, vgi: 0 });
    D_tirada = 0;
    D_fase = 'espera';
  },

  /* ── TIRAR: SOLO LOS QUE NO ESTAN GUARDADOS ──
     Y con la reliquia de los unos, cada dado que caiga en 1 se vuelve a tirar
     una vez: es la unica reliquia que toca la TIRADA y no el puntaje, asi que
     se siente distinta aunque el numero final se parezca. */
  tira(){
    if (MODO !== 'juega' || D_fase !== 'espera') return false;
    if (D_tirada >= dTiradas()) return false;
    D_tirada++;
    for (const d of D_dados){
      if (d.guardado) continue;
      d.v = 1 + Math.floor(dAz()*D_CARAS);
      d.vgi = (dAz() - 0.5)*20;
    }
    D_fase = 'tirando';
    D_tumba = 0.62;
    son('toque', 0.9);
    sacude(0.20);
    return true;
  },

  /* al terminar de rodar: si era la ultima tirada, la mano puntua sola. Sin eso
     el jugador tiene que tocar un boton para cobrar algo que ya no puede
     cambiar, o sea un toque que no decide nada. */
  asienta(){
    D_fase = 'espera';
    for (const d of D_dados) d.vgi = 0;
    if (D_tirada >= dTiradas()) this.puntua();
  },

  puntua(){
    const v = D_dados.map(d => d.v);
    const gu = D_dados.map(d => d.guardado);
    const r = dPuntos(v, gu);
    D_puntosRonda += r.pts;
    PUNTOS += r.pts;
    D_ultCombo = r.k; D_ultPts = r.pts; D_ultT = 1.5;
    D_cadena = r.k;
    if (r.k === 'nada'){ son('mal', 0.5); }
    else {
      son('bien', 0.6 + Math.min(0.4, r.mult*0.06));
      const c = dCaja(Math.floor(D_dados.length/2));
      sumaPuntos(0, 0, 0);          /* sostiene la racha del nucleo */
      flota('+' + r.pts, c.x + c.s/2, DG.y - DG.s, '#ffd76a', 44);
      chispas(c.x + c.s/2, DG.y, Math.min(24, 6 + r.mult*3), '#ffd76a', 160);
      if (r.mult >= 3){ destella('#ffd76a', 0.4 + r.mult*0.10); sacude(0.28); }
    }
    if (D_puntosRonda >= D_objetivo){
      /* la ronda salio: se ofrecen tres reliquias y el juego ESPERA. Dandole una
         al azar, la reliquia deja de ser una decision y pasa a ser un premio. */
      D_maxRonda = Math.max(D_maxRonda, D_ronda);
      D_fase = 'elegir';
      D_oferta = dSorteaOferta();
      son('gana', 0.6);
      fogonazo(0.3);
      return;
    }
    if (D_mano >= dManos()){
      /* no llego: la corrida termina. Y lo que se guarda es la RONDA a la que
         llego, que es la medida que un roguelike usa. */
      this.gano = false;
      this.finP = TX('faltaron', D_objetivo - D_puntosRonda);
      this.vivo = false;
      return;
    }
    D_mano++;
    this.manoNueva();
  },

  eligeReliquia(i){
    if (D_fase !== 'elegir') return false;
    const r = D_oferta[i];
    /* ── SIN OFERTA SE SIGUE IGUAL ──
       Con las doce reliquias en su tope no queda ninguna que ofrecer, y ahi el
       juego se quedaria esperando un toque en una carta que no existe. Se pasa
       de ronda sin premio, que es lo que corresponde: el jugador ya tiene todo. */
    if (!r){
      if (!D_oferta.length){ D_ronda++; son('clic'); this.rondaNueva(); return true; }
      return false;
    }
    D_rel[r.k] = (D_rel[r.k] || 0) + 1;
    D_oferta.length = 0;
    D_ronda++;
    son('clic');
    this.rondaNueva();
    return true;
  },

  paso(dt){
    dGeo();
    if (D_ultT > 0) D_ultT = Math.max(0, D_ultT - dt);
    if (D_fase === 'tirando'){
      D_tumba -= dt;
      for (const d of D_dados){
        if (d.guardado) continue;
        d.gi += d.vgi*dt; d.vgi *= 0.94;
      }
      if (D_tumba <= 0) this.asienta();
    }
    /* ── EL GUARDADO SE ENDEREZA ──
       Medido en la captura: los dos dados guardados seguian girados el angulo
       con el que cayeron, y un dado torcido se lee a «todavia esta rodando»
       justo en los que ya estan apartados. Un dado que uno saca del cubilete y
       deja al costado lo deja derecho. */
    for (const d of D_dados)
      if (d.guardado && d.gi !== 0) d.gi += (0 - d.gi)*Math.min(1, dt*9);
  },

  baja(x, y){
    if (MODO !== 'juega') return;
    if (D_fase === 'elegir'){
      const i = dCartaEn(x, y);
      if (i >= 0) this.eligeReliquia(i);
      return;
    }
    if (D_fase !== 'espera') return;
    /* el boton de tirar: el respaldo de la sacudida, y ademas lo unico que
       existe en una notebook */
    if (y > AL - 210 && y < AL - 90 && Math.abs(x - AN/2) < 170){ this.tira(); return; }
    /* guardar un dado. No se puede antes de la primera tirada: guardar un valor
       que todavia no se tiro no significa nada. */
    if (D_tirada === 0) return;
    const i = dDadoEn(x, y);
    if (i >= 0){
      D_dados[i].guardado = !D_dados[i].guardado;
      son('clic', 0.7);
    }
  },

  fondo(g){ dGeo(); dFondo(g); },

  pinta(g){
    /* los dados */
    for (let i = 0; i < D_dados.length; i++){
      const d = D_dados[i], c = dCaja(i);
      /* la entrada en escena: los dados caen sobre el fieltro uno por uno */
      const ke = entradaK(i, D_dados.length);
      if (ke <= 0) continue;
      if (ke < 1){
        g.save();
        g.translate(c.x + c.s/2, c.y + c.s/2);
        g.scale(ke, ke);
        g.translate(-(c.x + c.s/2), -(c.y + c.s/2));
      }
      dDado(g, c.x, c.y - (d.guardado ? 20 : 0), c.s, d.v, d.guardado, d.gi);
      if (ke < 1) g.restore();
    }
    /* ── LO QUE LOS DADOS VALEN AHORA MISMO ──
       El nombre del combo y los puntos que pagaria, arriba de la fila. Es la
       pieza que le faltaba al juego: sin ella el jugador no sabe si le conviene
       guardar dos pares o ir por la terna, y peor, no aprende que combos
       existen — o sea que nunca los busca. Va apagado, porque es una cuenta y
       no un acontecimiento. */
    /* y NO mientras el combo grande esta en pantalla: medido en la captura,
       «ESCALERA» salia dos veces, una encima de la otra, porque el que acaba de
       pagar y el que vale ahora son el mismo. */
    if (D_tirada > 0 && D_fase === 'espera' && D_ultT <= 0){
      const v = D_dados.map(d => d.v);
      const r = dPuntos(v, D_dados.map(d => d.guardado));
      const yy = DG.y - DG.s*0.95 - 30;
      texto(TX(r.k).toUpperCase(), AN/2, yy, 30,
            r.k === 'nada' ? 'rgba(242,238,230,.34)' : 'rgba(255,215,106,.80)',
            '800', 'center');
      if (r.k !== 'nada')
        texto('+' + r.pts + '   ×' + r.mult, AN/2, yy + 30, 20,
              'rgba(242,238,230,.50)', '700', 'center');
    }
    /* y el combo que ACABA de pagar, grande y encima: es el acontecimiento */
    if (D_ultT > 0 && D_ultCombo){
      const a = Math.min(1, D_ultT/0.5);
      texto(TX(D_ultCombo).toUpperCase(), AN/2, DG.y - DG.s*0.95 - 86, 40,
            'rgba(255,215,106,' + a.toFixed(2) + ')', '800', 'center');
    }
    /* las tiradas que quedan, como puntos y no como un numero: se lee de reojo */
    const T = dTiradas();
    for (let i = 0; i < T; i++){
      const x = AN/2 - (T-1)*13 + i*26, y = DG.y + DG.s*0.92;
      g.beginPath(); g.arc(x, y, 7, 0, 7);
      g.fillStyle = i < (T - D_tirada) ? '#f2c33c' : 'rgba(255,255,255,.16)';
      g.fill();
    }
    /* las reliquias que se juntaron, chiquitas arriba: es el rastro de la
       corrida, y sin verlo el jugador no siente que junto nada */
    /* ── Y VAN CENTRADAS, que es lo que costo una captura ──
       Con `x = 38 + i*44` la fila arranca pegada al borde izquierdo y crece
       hacia el medio: con seis reliquias se lee a que algo se salio de sitio, y
       encima el rastro de la corrida —que es lo unico que dice «junte todo
       esto»— queda en la esquina donde nadie mira. */
    const ks = Object.keys(D_rel);
    if (ks.length){
      const POR = 8, sep = 44;
      for (let f = 0; f*POR < ks.length; f++){
        const n = Math.min(POR, ks.length - f*POR);
        const x0 = AN/2 - (n-1)*sep/2;
        for (let i = 0; i < n; i++)
          dFicha(g, x0 + i*sep, 118 + f*sep, ks[f*POR+i], D_rel[ks[f*POR+i]]);
      }
    }
    /* ══ LA BARRA DEL OBJETIVO, EN EL HUECO QUE HABIA ══
       Medido en la captura: entre la fila de dados y el boton de tirar quedaban
       quinientos sesenta puntos de nada, y el unico sitio donde se leia cuanto
       faltaba era una barra de tres pixeles pegada al borde de abajo. En un
       juego cuyo verbo entero es «llegar al objetivo», eso es esconder la
       pregunta. Va grande, en el medio del hueco, con los dos numeros adentro:
       el marcador de arriba dice cuanto llevas y esto dice cuanto falta, que no
       es la misma pregunta.
       Y lo que se dibuja en dorado claro por delante es LO QUE LA MANO PAGARIA
       si se anotara ahora: asi se ve de una si esta tirada alcanza. */
    if (D_fase !== 'elegir'){
      const bw = Math.min(460, AN - 140), bx = (AN - bw)/2, by = AL*0.63, bh = 26;
      const u = Math.max(0, Math.min(1, D_puntosRonda/Math.max(1, D_objetivo)));
      caja2(bx, by, bw, bh, 13, 'rgba(255,255,255,.07)', null);
      if (u > 0) caja2(bx, by, Math.max(bh, bw*u), bh, 13, '#f2c33c', null);
      /* la parte de adelante es la mano de ahora, y solo mientras haya algo
         tirado: dibujarla siempre pondria una franja fantasma en cero */
      if (D_tirada > 0 && D_fase === 'espera'){
        const pr = dPuntos(D_dados.map(d => d.v), D_dados.map(d => d.guardado));
        const u2 = Math.max(0, Math.min(1, (D_puntosRonda + pr.pts*pr.mult)/Math.max(1, D_objetivo)));
        if (u2 > u){
          g.save();
          g.beginPath();
          g.rect(bx + bw*u, by, bw*(u2 - u), bh);
          g.clip();
          caja2(bx, by, Math.max(bh, bw*u2), bh, 13, 'rgba(255,215,106,.42)', null);
          g.restore();
        }
      }
      texto(D_puntosRonda + ' / ' + D_objetivo, AN/2, by + bh/2 + 1, 20,
            u > 0.42 ? '#171410' : 'rgba(242,238,230,.72)', '800', 'center');
    }
    if (D_fase === 'elegir'){
      dCartas(g, D_oferta, -1, 1);
      texto(TX('elegi'), AN/2, AL*0.28, 26, '#ffd76a', '800', 'center');
      return;
    }
    /* el boton de tirar, y dice SACUDÍ cuando el sensor esta andando: si dijera
       siempre lo mismo, el jugador con giroscopio no se enteraria de que puede
       sacudir, y el que no lo tiene creeria que le falta algo */
    if (D_fase === 'espera' && D_tirada < dTiradas()){
      const hay = GIRO.estado === 'lista' && GIRO.on;
      dBoton(g, AN/2, AL - 150, 340, 96, hay ? TX('sacudi') : TX('tirar'), hay);
    }
  },

  /* ══════════ EL AUTO-JUGADOR ══════════
     Guarda lo que una persona guardaria: el grupo mas grande, o la corrida si
     esta a un dado de la escalera. Contra uno que no guarda NADA y tira las
     tres veces a lo bruto, la diferencia dice si decidir sirve. Y es lo unico
     que puede decir si la curva del objetivo esta bien: si el honesto se queda
     en la ronda tres, el juego es imposible; si pasa de veinte, no hay tension. */
  juegaSolo(n, azar){
    this.arranca();
    /* ── LA SEMILLA VA DESPUES DE `arranca`, PORQUE `arranca` LA PISA ──
       `arranca` la siembra con el reloj, asi que sembrandola antes las seis
       corridas del barrido salian identicas: medido, `rondaMin` y `rondaMax`
       daban el MISMO numero en las seis. Es la tercera vez en esta tanda que la
       semilla no llega a donde tiene que llegar. */
    D_azar = D_SEM;
    let vueltas = 0;
    const rel = [];
    while (this.vivo && vueltas < (n || 40000)){
      vueltas++;
      if (D_fase === 'elegir'){
        /* elige la reliquia por un orden de preferencia fijo, que es lo que
           hace una persona que ya jugo: mas tiradas y mas manos antes que mas
           puntos, porque las dos primeras multiplican todo lo demas */
        const pref = azar ? null : ['mano','tirada','dado','mult','poker','escala',
                                    'suma','terna','pares','guarda','unos','facil'];
        let i = 0;
        if (pref){
          let mejor = 99;
          for (let j = 0; j < D_oferta.length; j++){
            const p = pref.indexOf(D_oferta[j].k);
            if (p >= 0 && p < mejor){ mejor = p; i = j; }
          }
        } else i = Math.floor(dAz()*D_oferta.length);
        /* con las doce reliquias en su tope la oferta viene VACIA, y la primera
           version leia `D_oferta[i].k` sin comprobar: el auto-jugador se caia en
           la ronda 34 con un TypeError y la corrida terminaba ahi por un defecto
           de la prueba y no del juego */
        if (D_oferta[i]) rel.push(D_oferta[i].k);
        this.eligeReliquia(i);
        continue;
      }
      if (D_fase === 'espera'){
        if (D_tirada === 0){ this.tira(); }
        else if (D_tirada < dTiradas()){
          if (!azar) dGuardaBien();
          this.tira();
        }
      }
      /* la tirada tarda 0,62 s en asentarse: sin adelantar el reloj la mano no
         termina nunca y el bucle se va en vacio */
      for (let k = 0; k < 40 && D_fase === 'tirando'; k++) this.paso(1/60);
    }
    return { ronda: D_maxRonda, puntos: PUNTOS, vueltas,
             reliquias: rel.length, tomadas: rel.slice(0, 10),
             dados: dNDados(), tiradas: dTiradas(), manos: dManos(),
             obj: D_objetivo, vivo: !!this.vivo };
  },

  cfg(o){
    if (o.sem != null) D_SEM = o.sem;
    if (o.kobj != null) D_KOBJ = o.kobj;
    if (o.robj != null) D_ROBJ = o.robj;
    return { sem: D_SEM, kobj: D_KOBJ, robj: D_ROBJ,
             obj: [1,5,10,15,20].map(dObjetivo) };
  },

  ver(){
    const v = D_dados.map(d => d.v);
    return { ronda: D_ronda, mano: D_mano + '/' + dManos(),
             tirada: D_tirada + '/' + dTiradas(), fase: D_fase,
             dados: v, guardados: D_dados.map(d => d.guardado ? 1 : 0),
             combo: dCombo(v), pts: dPuntos(v, D_dados.map(d => d.guardado)).pts,
             ronPts: D_puntosRonda, obj: D_objetivo,
             rel: D_rel, oferta: D_oferta.map(r => r.k),
             giro: GIRO.estado, sacN: GIRO.sacN };
  }
};

/* ── QUE GUARDARIA UNA PERSONA ──
   El grupo mas grande, salvo que falte UN dado para la escalera: ahi conviene
   guardar la corrida. Es la misma cuenta que hace cualquiera jugando al
   generala, y esta escrita una sola vez asi que el bot no puede elegir por una
   regla que el juego no premia. */
function dGuardaBien(){
  const v = D_dados.map(d => d.v);
  const c = new Array(D_CARAS + 1).fill(0);
  for (const x of v) c[x]++;
  let mejorCara = 1, mejorN = 0;
  for (let i = 1; i <= D_CARAS; i++) if (c[i] > mejorN){ mejorN = c[i]; mejorCara = i; }
  /* cuantos valores distintos seguidos hay: si son cuatro, la escalera esta a
     un dado y vale mas que un par */
  let mejorCorr = 0, corr = 0, corrIni = 1, iniMejor = 1;
  for (let i = 1; i <= D_CARAS; i++){
    if (c[i] > 0){ if (corr === 0) corrIni = i; corr++;
                   if (corr > mejorCorr){ mejorCorr = corr; iniMejor = corrIni; } }
    else corr = 0;
  }
  const porEscalera = mejorCorr >= 4 && mejorN < 3;
  const usados = new Set();
  for (let i = 0; i < D_dados.length; i++){
    const d = D_dados[i];
    if (porEscalera){
      const dentro = d.v >= iniMejor && d.v < iniMejor + mejorCorr;
      /* y un solo dado por valor: dos cuatros no ayudan a una escalera */
      d.guardado = dentro && !usados.has(d.v);
      if (d.guardado) usados.add(d.v);
    } else {
      d.guardado = (d.v === mejorCara);
    }
  }
}

function dSorteaOferta(){
  /* tres distintas, y ninguna que ya llego a su tope: una carta muerta es un
     tercio de la decision tirado */
  const pool = D_RELIQ.filter(r => dR(r.k) < r.tope);
  const o = [];
  while (o.length < 3 && o.length < pool.length){
    const r = pool[Math.floor(dAz()*pool.length)];
    if (o.indexOf(r) < 0) o.push(r);
  }
  return o;
}

/* ══════════ DIBUJO ══════════ */
function dDadoEn(x, y){
  for (let i = 0; i < D_dados.length; i++){
    const c = dCaja(i);
    /* el blanco se infla: un dado mide 96 de diseño, o sea 55 px en un
       telefono, y pedir el toque exacto en algo que se toca cien veces por
       partida es hacer fallar al jugador por el pixel y no por la decision */
    if (x > c.x - 12 && x < c.x + c.s + 12 &&
        y > c.y - 34 && y < c.y + c.s + 22) return i;
  }
  return -1;
}
const D_PIPS = {
  1: [[.5,.5]],
  2: [[.28,.28],[.72,.72]],
  3: [[.26,.26],[.5,.5],[.74,.74]],
  4: [[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
  5: [[.26,.26],[.74,.26],[.5,.5],[.26,.74],[.74,.74]],
  6: [[.28,.24],[.72,.24],[.28,.5],[.72,.5],[.28,.76],[.72,.76]]
};
function dDado(g, x, y, s, v, guardado, gi){
  g.save();
  g.translate(x + s/2, y + s/2);
  if (gi) g.rotate(gi);
  /* la sombra de contacto: sin ella el dado flota sobre el fieltro */
  g.save();
  g.globalAlpha = 0.30;
  g.beginPath(); g.ellipse(0, s*0.56, s*0.42, s*0.10, 0, 0, 7);
  g.fillStyle = '#000'; g.fill();
  g.restore();
  /* ── LA CARA GENERADA, Y EL TEÑIDO DEL GUARDADO SE QUEDA ──
     El dado horneado es blanco de marfil, así que un dado guardado se sigue
     marcando con el velo dorado ENCIMA en vez de con otro sprite: seis caras
     por dos estados serían doce imágenes para decir algo que un velo dice. */
  if (dibCuadroWH('caras', Math.max(0, Math.min(5, v - 1)), 0, 0, s, s)){
    if (guardado){
      g.globalAlpha = 0.34;
      caja2(-s/2, -s/2, s, s, s*0.18, '#f2c33c', null);
      g.globalAlpha = 1;
      g.strokeStyle = '#f2c33c'; g.lineWidth = 3;
      caja2(-s/2, -s/2, s, s, s*0.18, null, '#f2c33c');
    }
    g.restore();
    return;
  }
  if (!dibCuadro('dados', v - 1, 0, s/2, s, false)){
    const r = s*0.20;
    /* el cuerpo con degradado y el canto claro arriba: un cuadrado de un solo
       color se lee a ficha y no a dado */
    const gr = g.createLinearGradient(0, -s/2, 0, s/2);
    gr.addColorStop(0, guardado ? '#fff8e0' : '#f4f1e8');
    gr.addColorStop(1, guardado ? '#d8bd72' : '#c9c4b4');
    caja2(-s/2, -s/2, s, s, r, gr, null);
    g.strokeStyle = 'rgba(0,0,0,.20)'; g.lineWidth = Math.max(1.5, s*0.022);
    g.beginPath();
    g.moveTo(-s/2 + r, -s/2); g.lineTo(s/2 - r, -s/2);
    g.stroke();
    const pips = D_PIPS[v] || D_PIPS[1];
    for (const [px, py] of pips){
      g.beginPath();
      g.arc(-s/2 + px*s, -s/2 + py*s, s*0.085, 0, 7);
      g.fillStyle = '#2a2620'; g.fill();
    }
  }
  if (guardado){
    /* el guardado se ve por DOS cosas: levantado y con aro. Solo levantado, en
       una fila de siete no se nota cual esta arriba. */
    g.beginPath();
    caja2(-s/2 - 6, -s/2 - 6, s + 12, s + 12, s*0.24, null, null);
    g.strokeStyle = '#f2c33c'; g.lineWidth = 4;
    g.strokeRect(-s/2 - 6, -s/2 - 6, s + 12, s + 12);
  }
  g.restore();
}

function dFicha(g, x, y, k, n){
  const r = 17;
  g.beginPath(); g.arc(x, y, r, 0, 7);
  g.fillStyle = 'rgba(242,195,60,.16)'; g.fill();
  g.strokeStyle = 'rgba(242,195,60,.55)'; g.lineWidth = 2; g.stroke();
  const R = D_RELIQ.find(z => z.k === k);
  texto(R ? R.cara : '?', x, y + 5, 12, '#ffd76a', '800', 'center');
  if (n > 1) texto('x' + n, x + 13, y + 15, 10, '#ffd76a', '800', 'center');
}

/* las tres cartas de reliquia. Van dibujadas en el lienzo y no en DOM porque
   son parte de la partida —aparecen y se van— y el texto igual pasa por TX(),
   asi que estan traducidas. */
function dCartas(g, lista, sel, k){
  const w = Math.min(190, (AN - 60)/3 - 12), h = w*1.5;
  const tot = lista.length*w + (lista.length-1)*14;
  const x0 = (AN - tot)/2, y = AL*0.40;
  for (let i = 0; i < lista.length; i++){
    const r = lista[i];
    if (!r) continue;
    const x = x0 + i*(w + 14);
    const yy = y + (1 - k)*220;
    g.save();
    g.globalAlpha = k;
    caja2(x, yy, w, h, 18, 'rgba(20,18,26,.92)', null);
    g.strokeStyle = '#f2c33c'; g.lineWidth = 3;
    g.strokeRect(x, yy, w, h);
    texto(r.cara, x + w/2, yy + h*0.34, Math.min(46, w*0.36), '#ffd76a', '800', 'center');
    /* la descripcion partida en lineas: una frase de cuarenta caracteres en una
       carta de 190 se sale por los dos lados */
    const pal = TX('r_' + r.k).split(' ');
    const lin = [];
    let cur = '';
    for (const p of pal){
      if ((cur + ' ' + p).trim().length > 15){ lin.push(cur.trim()); cur = p; }
      else cur += ' ' + p;
    }
    if (cur.trim()) lin.push(cur.trim());
    for (let j = 0; j < lin.length; j++)
      texto(lin[j], x + w/2, yy + h*0.56 + j*20, 14, '#f2eee6', '600', 'center');
    g.restore();
  }
}
function dCartaEn(x, y){
  const n = D_oferta.length;
  if (!n) return -1;
  const w = Math.min(190, (AN - 60)/3 - 12), h = w*1.5;
  const tot = n*w + (n-1)*14, x0 = (AN - tot)/2, yy = AL*0.40;
  for (let i = 0; i < n; i++){
    const cx = x0 + i*(w + 14);
    if (x > cx - 8 && x < cx + w + 8 && y > yy - 8 && y < yy + h + 8) return i;
  }
  return -1;
}

function dBoton(g, cx, cy, w, h, txt, fuerte){
  g.save();
  caja2(cx - w/2, cy - h/2, w, h, h/2,
        fuerte ? 'rgba(242,195,60,.92)' : 'rgba(242,238,230,.14)', null);
  if (!fuerte){
    g.strokeStyle = 'rgba(242,238,230,.34)'; g.lineWidth = 2;
    g.strokeRect(cx - w/2, cy - h/2, w, h);
  }
  texto(txt, cx, cy + 11, 30, fuerte ? '#1a1608' : '#f2eee6', '800', 'center');
  g.restore();
}

function dFondo(g){
  /* el degradado y la foto los pone `ambAtras()`: acá va el fieltro y la banda */
  /* el fieltro: una trama fina anclada al mundo. Sin ella el fondo es un
     degradado liso, que es lo que delata a un juego hecho a las apuradas. */
  g.fillStyle = 'rgba(255,255,255,.022)';
  for (let y = 24; y < AL; y += 18) g.fillRect(0, y, AN, 1);
  /* y la banda de la mesa donde caen los dados */
  const b = g.createLinearGradient(0, AL*0.38, 0, AL*0.66);
  b.addColorStop(0, 'rgba(255,255,255,0)');
  b.addColorStop(0.5, 'rgba(255,255,255,.045)');
  b.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = b; g.fillRect(0, AL*0.38, AN, AL*0.28);
}
