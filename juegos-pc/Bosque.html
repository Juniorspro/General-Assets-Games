<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ================= escenario girado ================= */
const stage=document.getElementById('stage');
function medida(){
  const vv=window.visualViewport;
  return {w:Math.round(vv?vv.width:window.innerWidth),h:Math.round(vv?vv.height:window.innerHeight)};
}
const rotado=()=>{const m=medida();return m.h>m.w;};
const anchoStage=()=>{const m=medida();return m.h>m.w?m.h:m.w;};
const altoStage =()=>{const m=medida();return m.h>m.w?m.w:m.h;};
function aLocal(px,py){
  const m=medida();
  if(m.h<=m.w)return{x:px,y:py};
  return{x:m.h/2+(py-m.h/2),y:m.w/2-(px-m.w/2)};
}
const deltaLocal=(dx,dy)=>rotado()?{x:dy,y:-dx}:{x:dx,y:dy};

/* ================= render ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(anchoStage(),altoStage());
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.9;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement,stage.firstChild);

/* ================= ajustes ================= */
const CFG={sens:1,gfx:'media'};
try{
  const g=localStorage.getItem('bosque_gfx'),v=parseFloat(localStorage.getItem('bosque_sens'));
  if(g==='baja'||g==='media'||g==='alta')CFG.gfx=g;
  if(isFinite(v))CFG.sens=Math.min(2.4,Math.max(.4,v));
}catch(e){}
const GFX={baja:{px:.55,som:false,mapa:512},media:{px:.85,som:true,mapa:1024},
           alta:{px:Math.min(window.devicePixelRatio||1,2),som:true,mapa:2048}};
function aplicarGfx(){
  const g=GFX[CFG.gfx];
  renderer.setPixelRatio(g.px);
  // el mapa de sombra viejo hay que soltarlo a mano: three.js no lo recrea
  // porque cambie mapSize, se queda con el de antes y el cambio no hace nada
  if(astro.shadow.map){astro.shadow.map.dispose();astro.shadow.map=null;}
  astro.shadow.mapSize.set(g.mapa,g.mapa);
  if(renderer.shadowMap.enabled!==g.som){
    renderer.shadowMap.enabled=g.som;
    // apagar las sombras cambia el shader: sin esto los materiales ya compilados
    // siguen muestreando un mapa que ya no se dibuja
    scene.traverse(o=>{if(o.material){const m=o.material;
      (Array.isArray(m)?m:[m]).forEach(x=>x.needsUpdate=true);}});
  }
  if(typeof redim==='function')redim();
}

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x060a0e,.055);

/* ---------- post-proceso: cinta VHS ---------- */
const destino=new THREE.WebGLRenderTarget(2,2,{
  minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
  format:THREE.RGBAFormat,stencilBuffer:false});
destino.texture.encoding=THREE.sRGBEncoding;
const escenaVHS=new THREE.Scene();
const camVHS=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const uVHS={
  tDiffuse:{value:destino.texture},
  uTiempo:{value:0},
  uFuerza:{value:.85},
  uGlitch:{value:0},
  uRes:{value:new THREE.Vector2(1,1)}
};
const matVHS=new THREE.ShaderMaterial({
  uniforms:uVHS,depthTest:false,depthWrite:false,
  vertexShader:`varying vec2 vUv;
    void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uTiempo,uFuerza,uGlitch;
    uniform vec2 uRes;
    float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    float ruido(vec2 p){
      vec2 i=floor(p),f=fract(p);
      float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }
    void main(){
      float F=uFuerza;
      vec2 uv=vUv;
      float t=uTiempo;
      // ondulación de la cinta
      uv.x+=sin(uv.y*190.0+t*7.0)*0.0011*F;
      uv.x+=sin(uv.y*9.0-t*1.6)*0.0024*F;
      // banda de seguimiento que recorre la imagen
      float banda=fract(uv.y+t*0.09);
      float enBanda=smoothstep(0.055,0.0,abs(banda-0.5));
      uv.x+=enBanda*(ruido(vec2(t*9.0,uv.y*70.0))-0.5)*0.045*F;
      // saltos por bloques
      float fila=floor(uv.y*30.0);
      float salto=step(0.988-uGlitch*0.5,hash(vec2(fila,floor(t*11.0))));
      uv.x+=salto*(hash(vec2(fila,floor(t*11.0)+9.0))-0.5)*0.09;
      uv=clamp(uv,vec2(0.0),vec2(1.0));
      // aberración cromática
      float ab=(0.0015+enBanda*0.004+salto*0.007+uGlitch*0.003)*F;
      float r=texture2D(tDiffuse,clamp(vec2(uv.x+ab,uv.y),0.0,1.0)).r;
      vec4 base=texture2D(tDiffuse,uv);
      float b=texture2D(tDiffuse,clamp(vec2(uv.x-ab,uv.y),0.0,1.0)).b;
      vec3 col=vec3(r,base.g,b);
      // sangrado horizontal hacia la derecha, como una cinta gastada
      vec3 arrastre=texture2D(tDiffuse,clamp(uv+vec2(-3.0/uRes.x,0.0),0.0,1.0)).rgb;
      col=mix(col,col*0.62+arrastre*0.38,0.4*F);
      // desaturado y tinte de tubo
      float lum=dot(col,vec3(0.299,0.587,0.114));
      col=mix(col,vec3(lum),0.2*F);
      col*=mix(vec3(1.0),vec3(0.93,1.03,0.97),F);
      // líneas de barrido
      float scan=0.5+0.5*sin(uv.y*uRes.y*1.1);
      col*=1.0-0.15*scan*F;
      // cabezal: línea clara que sube despacio
      float cabezal=smoothstep(0.007,0.0,abs(fract(uv.y+t*0.06)-0.5));
      col+=cabezal*0.07*F;
      col+=enBanda*0.035*F;
      // grano
      float n=hash(uv*uRes*0.6+vec2(t*41.0,t*17.0));
      col+=(n-0.5)*0.08*F;
      // viñeta de pantalla curva
      vec2 d=uv-0.5;
      col*=mix(1.0,1.0-dot(d,d)*0.95,0.8*F);
      gl_FragColor=vec4(col,1.0);
    }`
});
escenaVHS.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),matVHS));
let vhsActivo=true,vistaPresencia=0,glitchT=2+Math.random()*6;
const camera=new THREE.PerspectiveCamera(72,anchoStage()/altoStage(),.1,400);
camera.rotation.order='YXZ';
const cabeza=new THREE.Object3D(),cuello=new THREE.Object3D();
cabeza.add(cuello);cuello.add(camera);scene.add(cabeza);

/* ================= cielo (shader) ================= */
const uCielo={
  uCenit:{value:new THREE.Color(0x030610)},
  uHorizonte:{value:new THREE.Color(0x0a1018)},
  uNiebla:{value:new THREE.Color(0x060a0e)},
  uSolDir:{value:new THREE.Vector3(0,1,0)},
  uSolCol:{value:new THREE.Color(0xbcd4ff)},
  uDia:{value:0},
  uTiempo:{value:0},
  uTapado:{value:0}
};
const cielo=new THREE.Mesh(new THREE.SphereGeometry(320,48,32),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:uCielo,
  vertexShader:`varying vec3 vDir;
    void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    varying vec3 vDir;
    uniform vec3 uCenit,uHorizonte,uNiebla,uSolCol;
    uniform vec3 uSolDir; uniform float uDia,uTiempo,uTapado;
    float hash(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
    void main(){
      vec3 d=normalize(vDir);
      float h=clamp(d.y,-1.0,1.0);
      vec3 col=mix(uHorizonte,uCenit,pow(clamp(h,0.0,1.0),0.52));
      // estrellas (sólo de noche)
      vec3 q=floor(d*280.0);
      float r=hash(q);
      float centelleo=0.55+0.45*sin(uTiempo*2.2+r*90.0);
      col+=vec3(0.82,0.86,1.0)*step(0.9977,r)*(1.0-uDia)*centelleo*max(0.0,h)*1.6;
      // sol / luna
      float s=max(dot(d,normalize(uSolDir)),0.0);
      float claro=1.0-uTapado;                  // 0 = tapado por las nubes
      col+=uSolCol*pow(s,2200.0)*22.0*claro*claro;   // disco
      col+=uSolCol*pow(s,42.0)*0.55*claro;           // halo interior
      col+=uSolCol*pow(s,6.0)*0.16*(0.12+0.88*claro);// resplandor amplio
      col+=uSolCol*pow(s,1.6)*0.05*uDia*claro;       // difusión atmosférica
      // fundido con la niebla en el horizonte
      col=mix(uNiebla,col,smoothstep(-0.04,0.30,h));
      gl_FragColor=vec4(col,1.0);
    }`
}));
cielo.renderOrder=-1;scene.add(cielo);

/* ================= luces ================= */
const DIR_SOL=new THREE.Vector3(.55,.34,-.52).normalize();
const DIR_LUNA=new THREE.Vector3(-.45,.52,.42).normalize();
const astro=new THREE.DirectionalLight(0x8fb0e0,.45);
astro.castShadow=true;astro.shadow.mapSize.set(2048,2048);
astro.shadow.camera.near=1;astro.shadow.camera.far=170;
astro.shadow.camera.left=-28;astro.shadow.camera.right=28;
astro.shadow.camera.top=28;astro.shadow.camera.bottom=-28;
astro.shadow.bias=-.0006;astro.shadow.normalBias=.04;
scene.add(astro,astro.target);
const ambiente=new THREE.HemisphereLight(0x162434,0x050806,.22);scene.add(ambiente);

const linterna=new THREE.SpotLight(0xfff0cc,0,48,.44,.62,1.35);
linterna.castShadow=true;linterna.shadow.mapSize.set(1024,1024);
linterna.shadow.camera.near=.4;linterna.shadow.camera.far=50;
linterna.shadow.bias=-.0012;linterna.shadow.normalBias=.03;
linterna.position.set(.18,-.12,0);camera.add(linterna);
const objLint=new THREE.Object3D();objLint.position.set(0,0,-12);camera.add(objLint);
linterna.target=objLint;
const halo=new THREE.PointLight(0xffe6b8,0,6,2);camera.add(halo);

/* ================= terreno ================= */
const SITIOS=[];
[{r:98,n:5,off:.30},{r:196,n:5,off:.93},{r:252,n:2,off:1.90}].forEach(A=>{
  for(let i=0;i<A.n;i++){
    const a=A.off+i*6.28318/A.n;
    const x=Math.cos(a)*A.r,z=Math.sin(a)*A.r;
    // la puerta (eje +Z local) mira siempre hacia el claro central
    SITIOS.push({x,z,rot:Math.atan2(-Math.cos(a),-Math.sin(a)),dos:SITIOS.length%2===0});
  }
});
const PLAZA=new THREE.Vector3(0,0,4);
const relieve=(x,z)=>Math.sin(x*.058)*1.55+Math.cos(z*.051)*1.35+
  Math.sin((x+z)*.121)*.55+Math.sin(x*.203-z*.171)*.28;
// explanadas: el terreno se allana alrededor de cada casa y de la plaza,
// para que la entrada quede al mismo nivel que el suelo interior
const APLANADOS=SITIOS.map(s=>({x:s.x,z:s.z,ri:17,ro:29,h:relieve(s.x,s.z)}));
APLANADOS.push({x:PLAZA.x,z:PLAZA.z,ri:6,ro:14,h:relieve(PLAZA.x,PLAZA.z)});
function alturaEn(x,z){
  let h=relieve(x,z);
  for(let i=0;i<APLANADOS.length;i++){
    const a=APLANADOS[i];
    const dx=x-a.x,dz=z-a.z,d=Math.sqrt(dx*dx+dz*dz);
    if(d>=a.ro)continue;
    let k=d<=a.ri?1:1-(d-a.ri)/(a.ro-a.ri);
    k=k*k*(3-2*k);
    h=h*(1-k)+a.h*k;
  }
  return h;
}

function texSuelo(){
  const s=512,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#2f3d26';x.fillRect(0,0,s,s);
  for(let i=0;i<11000;i++){const t=Math.random();
    x.fillStyle=t<.36?'rgba(60,78,40,.5)':t<.7?'rgba(30,40,24,.6)':'rgba(74,62,40,.35)';
    const r=1+Math.random()*4;x.fillRect(Math.random()*s,Math.random()*s,r,r);}
  for(let i=0;i<260;i++){x.save();x.translate(Math.random()*s,Math.random()*s);x.rotate(Math.random()*6.28);
    x.fillStyle='rgba(84,62,34,.4)';x.fillRect(-4,-1.5,8,3);x.restore();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(150,150);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
const geoSuelo=new THREE.PlaneGeometry(1020,1020,260,260);geoSuelo.rotateX(-Math.PI/2);
{
  const pos=geoSuelo.attributes.position,col=new Float32Array(pos.count*3);
  const c1=new THREE.Color(0x4b6435),c2=new THREE.Color(0x283320),tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i),h=alturaEn(x,z);pos.setY(i,h);
    const k=THREE.MathUtils.clamp((h+3)/6,0,1)*.75+Math.random()*.25;
    tmp.copy(c2).lerp(c1,k);col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  geoSuelo.setAttribute('color',new THREE.BufferAttribute(col,3));geoSuelo.computeVertexNormals();
}
const suelo=new THREE.Mesh(geoSuelo,new THREE.MeshStandardMaterial({map:texSuelo(),vertexColors:true,roughness:1}));
suelo.receiveShadow=true;scene.add(suelo);

/* ================= texturas ================= */
function texCorteza(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#443426';x.fillRect(0,0,s,s);
  for(let i=0;i<520;i++){x.strokeStyle=Math.random()<.5?'rgba(22,16,10,.55)':'rgba(104,86,62,.3)';
    x.lineWidth=.5+Math.random()*2.6;const px=Math.random()*s;x.beginPath();x.moveTo(px,0);
    for(let y=0;y<s;y+=12)x.lineTo(px+Math.sin(y*.09+i)*3.4,y);x.stroke();}
  for(let i=0;i<40;i++){x.fillStyle='rgba(70,92,52,.22)';
    x.beginPath();x.arc(Math.random()*s,Math.random()*s,3+Math.random()*10,0,6.28);x.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,2);
  t.encoding=THREE.sRGBEncoding;return t;
}
function texPiedra(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#5e6058';x.fillRect(0,0,s,s);
  for(let i=0;i<2800;i++){x.fillStyle=Math.random()<.5?'rgba(36,38,34,.5)':'rgba(122,124,114,.32)';
    x.fillRect(Math.random()*s,Math.random()*s,1+Math.random()*5,1+Math.random()*5);}
  for(let i=0;i<80;i++){x.fillStyle='rgba(60,84,44,.32)';
    x.beginPath();x.arc(Math.random()*s,Math.random()*s,4+Math.random()*14,0,6.28);x.fill();}
  for(let y=0;y<s;y+=32){x.strokeStyle='rgba(22,24,20,.5)';x.lineWidth=2;
    x.beginPath();x.moveTo(0,y);x.lineTo(s,y);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);
  t.encoding=THREE.sRGBEncoding;return t;
}
function texTabla(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#4a3a29';x.fillRect(0,0,s,s);
  for(let i=0;i<8;i++){
    x.fillStyle=`rgba(${60+Math.random()*40|0},${44+Math.random()*30|0},${28+Math.random()*22|0},.9)`;
    x.fillRect(0,i*32,s,30);
    for(let j=0;j<40;j++){x.strokeStyle='rgba(28,20,12,.35)';x.lineWidth=1;
      x.beginPath();x.moveTo(Math.random()*s,i*32);x.lineTo(Math.random()*s,i*32+30);x.stroke();}
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);
  t.encoding=THREE.sRGBEncoding;return t;
}
function texGlow(){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,222,155,.95)');g.addColorStop(.35,'rgba(255,190,90,.35)');
  g.addColorStop(1,'rgba(255,170,60,0)');x.fillStyle=g;x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);

const VIENTO={uTiempo:{value:0},uFuerza:{value:.55}};
function inyectarViento(mat,flutter,escala){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uTiempo=VIENTO.uTiempo;
    sh.uniforms.uFuerza=VIENTO.uFuerza;
    sh.vertexShader='uniform float uTiempo;uniform float uFuerza;\nattribute float aFlex;\nattribute float aFase;\n'
      +sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
        vec2 sem=vec2(instanceMatrix[3][0],instanceMatrix[3][2]);
        float f=aFlex*uFuerza*${escala.toFixed(2)};
        float o1=sin(uTiempo*0.85+sem.x*0.16+sem.y*0.13);
        float o2=sin(uTiempo*2.05+sem.x*0.42+aFase*1.7);
        float o3=sin(uTiempo*5.6+aFase*4.3+sem.y*0.6);
        float lat=o1*0.46+o2*0.18+o3*${flutter.toFixed(2)};
        transformed.x+=lat*f;
        transformed.z+=(o1*0.33-o2*0.2+o3*${(flutter*0.8).toFixed(2)})*f;
        transformed.y-=abs(o1)*0.09*f;`);
  };
}

function fusionar(geos){
  let nv=0,ni=0;
  for(const g of geos){nv+=g.attributes.position.count;ni+=g.index?g.index.count:0;}
  const pos=new Float32Array(nv*3),nor=new Float32Array(nv*3),uv=new Float32Array(nv*2);
  const flex=new Float32Array(nv),fase=new Float32Array(nv),col=new Float32Array(nv*3);
  const idx=new Uint32Array(ni);
  let o=0,io=0;
  for(const g of geos){
    const c=g.attributes.position.count;
    pos.set(g.attributes.position.array,o*3);
    nor.set(g.attributes.normal.array,o*3);
    if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);
    flex.set(g.attributes.aFlex.array,o);
    fase.set(g.attributes.aFase.array,o);
    col.set(g.attributes.color.array,o*3);
    const gi=g.index.array;
    for(let i=0;i<gi.length;i++)idx[io+i]=gi[i]+o;
    io+=gi.length;o+=c;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setAttribute('aFlex',new THREE.BufferAttribute(flex,1));
  g.setAttribute('aFase',new THREE.BufferAttribute(fase,1));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();
  return g;
}
function marcar(g,flexFn,fase,color){
  const p=g.attributes.position,n=p.count;
  const fl=new Float32Array(n),fs=new Float32Array(n),co=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    fl[i]=flexFn(p.getX(i),p.getY(i),p.getZ(i));
    fs[i]=fase;
    co[i*3]=color.r;co[i*3+1]=color.g;co[i*3+2]=color.b;
  }
  g.setAttribute('aFlex',new THREE.BufferAttribute(fl,1));
  g.setAttribute('aFase',new THREE.BufferAttribute(fs,1));
  g.setAttribute('color',new THREE.BufferAttribute(co,3));
  return g;
}
function geoHojaBase(){
  const g=new THREE.PlaneGeometry(.62,1.0,1,3);
  g.translate(0,.5,0);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const t=p.getY(i);
    const w=Math.pow(Math.sin(Math.PI*(.10+.9*t)),.72);
    p.setX(i,p.getX(i)*w);
    p.setZ(i,p.getZ(i)+Math.sin(t*Math.PI)*.14-Math.abs(p.getX(i))*.3);
  }
  g.computeVertexNormals();
  return g;
}
const HOJA_BASE=geoHojaBase();

function rngSemilla(s){let a=s>>>0;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296;};}

function construirArbol(semilla){
  const rnd=rngSemilla(semilla*7919+13);
  const ramas=[],hojas=[];
  const ALTO_REF=5.4;
  const tonoHoja=new THREE.Color().setHSL(.24+rnd()*.06,.42+rnd()*.18,.24+rnd()*.1);
  const tonoCorteza=new THREE.Color().setHSL(.08+rnd()*.03,.16,.42+rnd()*.12);

  function flexRama(nivel){
    return (x,y,z)=>Math.min(1.15, Math.pow(Math.max(0,(y-.35))/ALTO_REF,1.7)*(0.5+nivel*0.55));
  }
  function flexHoja(nivel){
    return (x,y,z)=>Math.min(1.5, Math.pow(Math.max(0,(y-.35))/ALTO_REF,1.3)*(0.9+nivel*0.5)+0.12);
  }

  function hojasEn(mat,largo,nivel){
    const K=3+(rnd()*3|0);
    for(let i=0;i<K;i++){
      const s=.30+rnd()*.20;
      const m=mat.clone()
        .multiply(new THREE.Matrix4().makeTranslation(0,largo*(.15+rnd()*.95),0))
        .multiply(new THREE.Matrix4().makeRotationY(rnd()*6.283))
        .multiply(new THREE.Matrix4().makeRotationZ(.55+rnd()*1.25))
        .multiply(new THREE.Matrix4().makeRotationX(rnd()*1.3-.65))
        .multiply(new THREE.Matrix4().makeScale(s,s*(1.1+rnd()*.5),s));
      const g=HOJA_BASE.clone();g.applyMatrix4(m);g.computeVertexNormals();
      const c=tonoHoja.clone().offsetHSL((rnd()-.5)*.03,(rnd()-.5)*.12,(rnd()-.5)*.14);
      marcar(g,flexHoja(nivel),rnd()*6.283,c);
      hojas.push(g);
    }
  }

  function rama(mat,largo,radio,nivel){
    const seg=nivel===0?2:1;
    const g=new THREE.CylinderGeometry(radio*.62,radio,largo,nivel===0?8:5,seg,true);
    g.translate(0,largo/2,0);g.applyMatrix4(mat);g.computeVertexNormals();
    marcar(g,flexRama(nivel),rnd()*6.283,tonoCorteza);
    ramas.push(g);
    if(nivel>=3){hojasEn(mat,largo,nivel);return;}
    if(nivel>=2)hojasEn(mat,largo,nivel);
    const n=nivel===0?(3+(rnd()*2|0)):(2+(rnd()<.32?1:0));
    for(let i=0;i<n;i++){
      const m=mat.clone()
        .multiply(new THREE.Matrix4().makeTranslation(0,largo*(nivel===0?.55+rnd()*.42:.4+rnd()*.55),0))
        .multiply(new THREE.Matrix4().makeRotationY(i*(6.283/n)+rnd()*1.1))
        .multiply(new THREE.Matrix4().makeRotationZ((nivel===0?.42:.55)+rnd()*.42));
      rama(m,largo*(.62+rnd()*.16),radio*(.56+rnd()*.12),nivel+1);
    }
  }

  const base=new THREE.Matrix4().makeRotationZ((rnd()-.5)*.12);
  rama(base,2.3+rnd()*.5,.20+rnd()*.05,0);
  return {ramas:fusionar(ramas),hojas:fusionar(hojas)};
}

function crearCasa(ax,az,rot,semilla,dosPisos){
  const base=alturaEn(ax,az)-.3;

  centrosCasa.push({x:ax,z:az,r:29});
  const W=17,D=14,T=.6,H1=4.0,H2=3.5,EX=W/9,EZ=D/8,cs=Math.cos(rot),sn=Math.sin(rot);
  interiores.push({cx:ax,cz:az,rot,hw:W/2+.15,hd:D/2+.15});
  function caja(cx,cy,cz,sx,sy,sz,mat,col,plat){
    const m=new THREE.Mesh(gCaja,mat);m.scale.set(sx,sy,sz);m.position.set(cx,cy,cz);
    m.castShadow=m.receiveShadow=true;g.add(m);ocluyentes.push(m);

    if(col)muros.push({cx:wx,cz:wz,hw:sx/2,hd:sz/2,rot,y0:base+cy-sy/2,y1:base+cy+sy/2});
    if(plat)plataformas.push({cx:wx,cz:wz,hw:sx/2,hd:sz/2,rot,top:base+cy+sy/2});
    return m;
  }
  caja(0,.2,0,W+1.4,.4,D+1.4,matPiedra,false,true);
  function paredX(px,alto){
    caja(px,alto/2,-D/4-.6,T,alto,D/2-1.2,matPiedra,true,false);
    caja(px,alto/2, D/4+.6,T,alto,D/2-1.2,matPiedra,true,false);
    caja(px,.55,0,T,1.1,2.4,matPiedra,true,false);
    caja(px,alto-.45,0,T,.9,2.4,matPiedra,true,false);
  }
  function paredZ(pz,alto,hueco){
    if(hueco==='puerta'){
      const a=(W-3.4)/2;
      caja(-(W/2-a/2),alto/2,pz,a,alto,T,matPiedra,true,false);
      caja( (W/2-a/2),alto/2,pz,a,alto,T,matPiedra,true,false);

      const a=(W-2.6)/2;
      caja(-(W/2-a/2),alto/2,pz,a,alto,T,matPiedra,true,false);
      caja( (W/2-a/2),alto/2,pz,a,alto,T,matPiedra,true,false);
      caja(0,.55,pz,2.6,1.1,T,matPiedra,true,false);
      caja(0,alto-.45,pz,2.6,.9,T,matPiedra,true,false);
    }
  }
  paredX(-W/2,H1);paredX(W/2,H1);paredZ(-D/2,H1,'ventana');paredZ(D/2,H1,'puerta');
  if(dosPisos){
    const NIVEL=H1+.3;
    const HUECO=4.8,ESC=16,PROF=.62;
    caja(0,H1+.15,-HUECO/2,W,.3,D-HUECO,matTabla,false,true);
    caja(1.4,H1+.15,D/2-HUECO/2,W-2.8,.3,HUECO,matTabla,false,true);
    for(let i=0;i<ESC;i++){
      const h=(i+1)*(NIVEL/ESC);

    }
    caja(-W/2,NIVEL+H2/2,-D/4-.6,T,H2,D/2-1.2,matPiedra,true,false);
    caja(-W/2,NIVEL+H2/2, D/4+.6,T,H2,D/2-1.2,matPiedra,true,false);
    caja(-W/2,NIVEL+.55,0,T,1.1,2.4,matPiedra,true,false);
    caja(-W/2,NIVEL+H2-.45,0,T,.9,2.4,matPiedra,true,false);
    caja( W/2,NIVEL+H2/2,0,T,H2,D,matPiedra,true,false);
    caja(0,NIVEL+H2/2,-D/2,W,H2,T,matPiedra,true,false);
    caja(-W/4,NIVEL+H2/2,D/2,W/2,H2,T,matPiedra,true,false);
    caja( W/4,NIVEL+.5,  D/2,W/2,1.0,T,matPiedra,true,false);

  {

  const formas=[new THREE.OctahedronGeometry(.28,0),new THREE.TorusGeometry(.24,.09,8,16),

  function reliquia(lx,lz,nivelLocal,idx){

  /* ---- muebles (sin colisión: se pasa entre ellos) ---- */
  const SU=.4;
  function mb(x,y,z,sx,sy,sz,mat,ry,rz){

function ribete(a,b,ctrl,ancho){
  const pos=[],uvs=[],idx=[],centros=[];
  const N=Math.max(16,Math.round(a.distanceTo(b)/1.4));
  const P=new THREE.Vector3(),Q=new THREE.Vector3();
  let acum=0,ant=null;
  for(let i=0;i<=N;i++){
    const t=i/N,mt=1-t;
    P.set(mt*mt*a.x+2*mt*t*ctrl.x+t*t*b.x,0,mt*mt*a.z+2*mt*t*ctrl.z+t*t*b.z);
    const t2=Math.min(1,t+1/N),m2=1-t2;
    Q.set(m2*m2*a.x+2*m2*t2*ctrl.x+t2*t2*b.x,0,m2*m2*a.z+2*m2*t2*ctrl.z+t2*t2*b.z);
    let tx=Q.x-P.x,tz=Q.z-P.z;const L=Math.hypot(tx,tz)||1;tx/=L;tz/=L;
    const nx=-tz,nz=tx;
    const w=(ancho*.5)*(.82+Math.sin(t*13.7+a.x)*.16+Math.sin(t*31.1)*.08);
    if(ant)acum+=Math.hypot(P.x-ant.x,P.z-ant.z);
    ant={x:P.x,z:P.z};marcarCamino({x:P.x,z:P.z});
    centros.push({x:P.x,z:P.z,nx,nz,d:acum});
    const x1=P.x+nx*w,z1=P.z+nz*w,x2=P.x-nx*w,z2=P.z-nz*w;
    pos.push(x1,alturaEn(x1,z1)+.12,z1,x2,alturaEn(x2,z2)+.12,z2);
    uvs.push(acum/5,0,acum/5,1);
    if(i<N){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,matCamino);m.receiveShadow=true;m.renderOrder=1;scene.add(m);

}

const PRESENCIA=(function(){
  const g=new THREE.Group();
  const negro=new THREE.MeshBasicMaterial({color:0x000000,fog:false});
  const cil=(rt,rb,h)=>new THREE.CylinderGeometry(rt,rb,h,16,1);
  const esf=r=>new THREE.SphereGeometry(r,20,14);
  function pz(geo,padre,x,y,z,ex,ey,ez){
    const o=new THREE.Mesh(geo,negro);o.position.set(x,y,z);
    if(ex!==undefined)o.scale.set(ex,ey,ez);
    padre.add(o);return o;
  }
  function pivote(padre,x,y,z){const q=new THREE.Group();q.position.set(x,y,z);padre.add(q);return q;}

  // ---- tronco ----
  pz(esf(.22),g,0,1.66,0,1.18,.82,.80);            // cadera
  pz(cil(.31,.205,.74),g,0,2.04,0,1,1,.66);        // torso, estrecho de cintura
  const hombros=pz(esf(.27),g,0,2.36,0,1.68,.62,.80);
  pz(cil(.082,.094,.19),g,0,2.50,0);               // cuello
  const cabeza=pivote(g,0,2.68,0);
  pz(esf(.19),cabeza,0,0,0,.88,1.15,.94);          // cráneo
  pz(esf(.115),cabeza,0,-.10,.09,.86,.72,1.0);     // mandíbula

  // ---- piernas con rodilla ----
  const piernas=[],rodillas=[];
  for(const l of[-1,1]){
    const cad=pivote(g,l*.15,1.62,0);
    pz(cil(.118,.09,.84),cad,0,-.42,0);
    pz(esf(.098),cad,0,-.84,0);
    const rod=pivote(cad,0,-.84,0);
    pz(cil(.086,.062,.80),rod,0,-.40,0);
    pz(esf(.085),rod,0,-.80,.05,1.25,.55,1.9);     // pie
    piernas.push(cad);rodillas.push(rod);
  }
  // ---- brazos largos con codo ----
  const brazos=[],codos=[];
  for(const l of[-1,1]){
    const hom=pivote(g,l*.375,2.30,0);
    hom.rotation.z=l*.05;
    pz(cil(.074,.058,.66),hom,0,-.33,0);
    pz(esf(.072),hom,0,-.66,0);
    const cod=pivote(hom,0,-.66,0);
    pz(cil(.058,.045,.64),cod,0,-.32,0);
    pz(esf(.06),cod,0,-.66,.02,.95,1.6,.75);       // mano alargada
    brazos.push(hom);codos.push(cod);
  }

  const ojos=[];
  for(const l of[-1,1]){
    const o=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,color:0xff1d0c,transparent:true,
      blending:THREE.AdditiveBlending,depthWrite:false,opacity:.9,fog:false}));
    o.scale.set(.34,.34,1);o.position.set(l*.068,-.01,.165);cabeza.add(o);ojos.push(o);
    const nucleo=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,color:0xffd0c0,transparent:true,
      blending:THREE.AdditiveBlending,depthWrite:false,opacity:.85,fog:false}));
    nucleo.scale.set(.12,.12,1);nucleo.position.set(l*.068,-.01,.175);cabeza.add(nucleo);ojos.push(nucleo);
  }
  g.renderOrder=4;
  g.scale.setScalar(.88);
  const cuerpo=[];
  g.traverse(o=>{if(o.isMesh)cuerpo.push(o);});
  scene.add(g);
  g.visible=false;
  return {grupo:g,ojos,cuerpo,piernas,rodillas,brazos,codos,cabeza,hombros,
          activa:false,ang:Math.random()*6.283,dist:34,visibleT:6,
          anclaje:null,destino:null,arbol:null,estado:'oculto',estadoT:0,lado:1,desp:0,esconde:0,
          ux:0,uz:0,mvx:0,mvz:0,rumbo:0,huirT:0,vel:0,paso:0,miradaT:0,oculta:0,susto:0,sustoEspera:30};
})();

/* ================= la malla metalica que cierra el bosque ================= */
{
  const RAD=264,N=210,ALTO=3.3;                 // el jugador se topa en 262
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d');
  x.strokeStyle='#a7adb3';x.lineWidth=3.4;
  for(let i=-64;i<128;i+=16){
    x.beginPath();x.moveTo(i,0);x.lineTo(i+64,64);x.stroke();
    x.beginPath();x.moveTo(i,64);x.lineTo(i+64,0);x.stroke();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.encoding=THREE.sRGBEncoding;
  // alphaTest y no transparencia: un material transparente no escribe profundidad
  // y dos paños cruzados se dibujarian en el orden equivocado
  const matMalla=new THREE.MeshStandardMaterial({map:tex,color:0x8d949a,roughness:.5,
    metalness:.5,alphaTest:.45,side:THREE.DoubleSide});
  const matHierro=new THREE.MeshStandardMaterial({color:0x6b7075,roughness:.52,metalness:.6});
  const pos=[],uvs=[],idx=[],post=[];
  for(let i=0;i<N;i++){
    const a0=i/N*6.283185,a1=(i+1)/N*6.283185;
    const x0=Math.cos(a0)*RAD,z0=Math.sin(a0)*RAD;
    const x1=Math.cos(a1)*RAD,z1=Math.sin(a1)*RAD;
    const y0=alturaEn(x0,z0),y1=alturaEn(x1,z1),b=pos.length/3;
    pos.push(x0,y0-.35,z0, x1,y1-.35,z1, x1,y1+ALTO,z1, x0,y0+ALTO,z0);
    const rep=Math.hypot(x1-x0,z1-z0);            // una celda de rombo por metro
    uvs.push(0,0, rep,0, rep,ALTO, 0,ALTO);
    idx.push(b,b+1,b+2, b,b+2,b+3);
    post.push(compR(x0,y0+ALTO*.5-.35,z0,0,a0,0,1,ALTO+.7,1));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,matMalla);m.frustumCulled=false;scene.add(m);
  const ip=new THREE.InstancedMesh(new THREE.CylinderGeometry(.055,.075,1,6),matHierro,N);
  post.forEach((mm,k)=>ip.setMatrixAt(k,mm));
  ip.instanceMatrix.needsUpdate=true;ip.frustumCulled=false;scene.add(ip);
}

const OJOS=1.62;

function chocarArboles(nx,nz){
  if(BAJO.on)return[nx,nz];          // los arboles estan arriba
  for(let i=0;i<obstaculos.length;i++){
    const a=obstaculos[i],dx=nx-a.x,dz=nz-a.z,min=a.r+.42,d2=dx*dx+dz*dz;
    if(d2<min*min){const d=Math.sqrt(d2)||1e-4;nx=a.x+dx/d*min;nz=a.z+dz/d*min;}
  }
  return[nx,nz];
}
function chocarMuros(nx,nz,pieY){
  // dentro de una casa no hay colisiones: se camina libre entre los muebles
  for(let i=0;i<interiores.length;i++){
    const q=interiores[i],qc=Math.cos(q.rot),qs=Math.sin(q.rot);
    const rx=jugador.pos.x-q.cx,rz=jugador.pos.z-q.cz;
    const lx=rx*qc-rz*qs,lz=rx*qs+rz*qc;
    if(Math.abs(lx)<q.hw&&Math.abs(lz)<q.hd)return[nx,nz];
  }
  const cabezaY=pieY+1.7;
  for(let i=0;i<muros.length;i++){
    const w=muros[i];
    if(w.y1<pieY+.45||w.y0>cabezaY)continue;
    const c=Math.cos(w.rot),s=Math.sin(w.rot);
    const dx=nx-w.cx,dz=nz-w.cz;
    let lx=dx*c-dz*s,lz=dx*s+dz*c;
    const hw=w.hw+.38,hd=w.hd+.38;
    if(Math.abs(lx)<hw&&Math.abs(lz)<hd){
      if(hw-Math.abs(lx)<hd-Math.abs(lz))lx=(lx<0?-1:1)*hw;else lz=(lz<0?-1:1)*hd;
      nx=w.cx+lx*c+lz*s;nz=w.cz-lx*s+lz*c;
    }
  }
  return[nx,nz];
}
function soporteEn(nx,nz,pieY){
  if(BAJO.on)return BAJO.piso;       // el piso del laboratorio manda
  let s=alturaEn(nx,nz);
  for(let i=0;i<plataformas.length;i++){
    const p=plataformas[i],c=Math.cos(p.rot),sn=Math.sin(p.rot);
    const dx=nx-p.cx,dz=nz-p.cz;
    const lx=dx*c-dz*sn,lz=dx*sn+dz*c;
    if(Math.abs(lx)<p.hw&&Math.abs(lz)<p.hd&&p.top<=pieY+.62&&p.top>s)s=p.top;
  }
  return s;
}

  const c=t%CICLO;

  if(c<CICLO-TRANS)return 1;

}

  elReloj.textContent=esNoche?'amanece en '+mmss(DUR_NOCHE-c):'anochece en '+mmss(CICLO-c);

  dirAstro.copy(DIR_LUNA).lerp(DIR_SOL,dia).normalize();

  scene.fog.color.copy(tmpCol);

  uCielo.uHorizonte.value.copy(cHorizN).lerp(cHorizD,dia).lerp(cNieblaLl,intLluvia*.9);
  uCielo.uNiebla.value.copy(tmpCol);

  uCielo.uTapado.value=Math.min(1,intLluvia*1.45);   // la lluvia tapa el sol

  // viento: brisa base + rachas + refuerzo con la lluvia
  VIENTO.uTiempo.value=t;

  const parp=.93+Math.sin(t*23.1)*.035+Math.sin(t*7.7)*.035;

    if(d<dCerca&&mismoPiso){dCerca=d;cerca=r;}
    if(d<1.5&&mismoPiso){
      r.tomada=true;r.malla.visible=false;recogidas++;
      elRel.textContent=`Reliquias ${recogidas} / ${TOTAL}`;
      mostrar(recogidas===TOTAL?'Todas las reliquias recuperadas':'Reliquia recuperada');
      if(recogidas===TOTAL)activarNotas();
      else if(recogidas===TOTAL-1)ultimaAlInicio();
    }
  }
  /* --- notas --- */
  if(faseNotas&&notas<NOTAS.length){
    for(const n of NOTAS){
      if(n.tomada)continue;
      n.malla.position.y=n.y+.05+Math.sin(t*1.4+n.fase)*.05;
      n.malla.rotation.z+=dt*.25;
      const la=.58+Math.sin(t*2.2+n.fase)*.26;
      n.halo.position.set(n.x,n.malla.position.y+.30,n.z);
      n.halo.material.opacity=la;
      n.halo.scale.set(.034*(.9+la*.25),.042*(.9+la*.25),1);
      if(Math.abs(altSuave-n.nivel)<1.6&&Math.hypot(jugador.pos.x-n.x,jugador.pos.z-n.z)<1.5){
        n.tomada=true;n.malla.visible=false;n.halo.visible=false;notas++;
        elRel.textContent='Notas '+notas+' / '+NOTAS.length;
        mostrar(notas===NOTAS.length?'La ultima nota':'Nota '+notas);
        if(notas===NOTAS.length)abrirTrampilla();
      }
    }
    // la siguiente lleva el contorno y se ve siempre, tambien tras las paredes
    let sig=null;
    for(const n of NOTAS)if(!n.tomada){sig=n;break;}
    if(sig){
      MARCA.visible=true;
      MARCA.position.set(sig.x,sig.malla.position.y+.46,sig.z);
      const pu=.80+Math.sin(t*3.1)*.13;
      MARCA.material.opacity=pu;MARCA.scale.set(.62*pu,.78*pu,1);
    }else MARCA.visible=false;
  }else if(MARCA.visible)MARCA.visible=false;
  /* --- bajar y subir --- */
  if(BAJO.listo){
    // la marca solo existe arriba: desde abajo seria un haz saliendo del techo
    BAJO.trampa.visible=!BAJO.on;
    if(!BAJO.on){
      const pu=.62+Math.sin(t*1.9)*.32,k=.92+pu*.18;
      BAJO.haz.material.opacity=.07+pu*.09;
      BAJO.marca.material.opacity=pu;
      BAJO.marca.scale.set(.062*k,.076*k,1);
    }
  }
  if(BAJO.listo&&!BAJO.on&&Math.hypot(jugador.pos.x-BAJO.trX,jugador.pos.z-BAJO.trZ)<1.9)bajar();
  if(BAJO.on){
    scene.fog.color.setHex(0x04060a);scene.fog.density=.030;
    BAJO.luz.intensity=.78+Math.sin(t*1.7)*.10;
    BAJO.luz.position.z=THREE.MathUtils.clamp(jugador.pos.z,BAJO.cz-BAJO.hd+3,BAJO.cz+BAJO.hd-3);
    const MAT=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),E=new THREE.Vector3();
    for(const [im,lista,osc] of BAJO.cuerpos){
      lista.forEach((c,i)=>{
        const y=BAJO.piso+.30+Math.sin(t*.55+c.f)*.13;   // flota dentro del tubo
        Q.setFromEuler(new THREE.Euler(0,Math.sin(t*.31+c.f)*.5,0));
        MAT.compose(V.set(c.x,y,c.z),Q,E.set(1,1,1));
        im.setMatrixAt(i,MAT);
      });
      im.instanceMatrix.needsUpdate=true;
    }
    // los ojos laten con la ESCALA y no con la opacidad: un material instanciado
    // tiene una sola opacidad para todas sus copias, y latirian todos a la vez
    for(const [im,lista] of BAJO.ojos){
      lista.forEach((o,i)=>{
        const br=.55+.45*Math.abs(Math.sin(t*1.3+o.f*1.7));
        MAT.compose(V.set(o.x+o.dx,BAJO.piso+1.92+Math.sin(t*.55+o.f)*.13,o.z+.10),
          Q.set(0,0,0,1),E.set(br*.72,br*.72,br*.85));
        im.setMatrixAt(i,MAT);
      });
      im.instanceMatrix.needsUpdate=true;
    }
    // el final: al llegar al tubo destrozado
    if(!FIN.on&&Math.hypot(jugador.pos.x-BAJO.rotoX,jugador.pos.z-BAJO.rotoZ)<2.9){
      FIN.on=true;FIN.t=0;GUIA.on=false;
    }
    // salida: por donde se bajo
    BAJO.espera=Math.max(0,(BAJO.espera||0)-dt);
    if(!FIN.on&&BAJO.espera<=0&&
       Math.hypot(jugador.pos.x-BAJO.cx,jugador.pos.z-(BAJO.cz+BAJO.hd-1.6))<1.3)subir();
  }
  /* --- el final --- */
  if(FIN.on){
    FIN.t+=dt;
    // el juego toma el control: no se camina ni se corre
    entrada.mov.x=0;entrada.mov.y=0;entrada.correr=false;
    for(const k in entrada.teclas)entrada.teclas[k]=false;
    // la sombra sale del tubo roto y se acerca hasta dos metros y medio
    const FP=PRESENCIA,fg=FP.grupo;
    const tx=BAJO.rotoX,tz=BAJO.rotoZ;
    const dx=jugador.pos.x-tx,dz=jugador.pos.z-tz,L=Math.hypot(dx,dz)||1;
    const av=THREE.MathUtils.clamp(FIN.t/5,0,1),e=av*av*(3-2*av);
    const d=Math.max(2.5,L-e*(L-2.5));
    fg.visible=FIN.t<9.5;
    fg.position.set(jugador.pos.x-dx/L*d,BAJO.piso,jugador.pos.z-dz/L*d);
    fg.scale.y=.88;fg.rotation.set(0,Math.atan2(dx,dz),0);
    FP.cabeza.rotation.set(0,0,0);
    // la camara se gira sola hacia ella
    yawObj=Math.atan2(-(fg.position.x-jugador.pos.x),-(fg.position.z-jugador.pos.z));
    pitchObj=-.04;
    // funde a negro recien cuando llego, y despues habla
    FIN.velo.style.opacity=String(THREE.MathUtils.clamp((FIN.t-5.4)/3.0,0,1));
    let li='';
    for(const l of FIN_LINEAS)if(FIN.t>=l[0])li=l[1];
    if(li!==FIN.cap){
      FIN.cap=li;FIN.txt.textContent=li;
      FIN.txt.style.opacity=li?'1':'0';
      if(li==='BOSQUE')FIN.txt.style.letterSpacing='.5em';
    }
  }
  /* --- la anteultima brilla y se ve desde cualquier parte del mapa --- */
  if(recogidas===TOTAL-2){
    let sr=null;
    for(const r of reliquias)if(!r.tomada){sr=r;break;}
    if(sr){
      MARCA_R.visible=true;
      MARCA_R.position.set(sr.x,sr.malla.position.y+.55,sr.z);
      const pu=.66+Math.sin(t*2.6)*.30,k=.92+pu*.16;
      MARCA_R.material.opacity=pu;
      MARCA_R.scale.set(.058*k,.072*k,1);
    }else MARCA_R.visible=false;
  }else if(MARCA_R.visible)MARCA_R.visible=false;
  if(cerca&&dCerca<15){
    luzReliquia.position.set(cerca.x,cerca.y+.4,cerca.z);
    luzReliquia.intensity=(1.9+Math.sin(t*2.4)*.35)*(1-dia*.4);
  }else luzReliquia.intensity=0;
  if(avisoT>0){avisoT-=dt;if(avisoT<=0)elAviso.style.opacity='0';}

  /* --- ambiente sonoro: pájaros de día, grillos de noche --- */
  if(audioCtx){
    const calma=1-Math.min(1,intLluvia*1.3);
    tGrillo-=dt;
    if(tGrillo<=0){
      tGrillo=.26+Math.random()*.55;
      grillo((1-dia)*calma*(PRESENCIA.susto>0?0:1));
    }
    tPajaro-=dt;
    if(tPajaro<=0){
      tPajaro=2.4+Math.random()*7;
      pajaro(dia*calma);
    }
  }

  /* --- lluvia --- */
  proxCambio-=dt;
  if(proxCambio<=0){
    if(objLluvia>.5){                                  // deja de llover
      objLluvia=0;proxCambio=45+Math.random()*70;
    }else{                                             // ¿empieza a llover?
      // de día es mucho menos probable, y al empezar la partida casi nunca
      const arranque=THREE.MathUtils.clamp((t-120)/240,0,1);
      const prob=THREE.MathUtils.lerp(.85,.16,dia)*(.08+.92*arranque);
      if(Math.random()<prob){
        objLluvia=.55+Math.random()*.45;
        proxCambio=35+Math.random()*55;
        mostrar('Empieza a llover');
      }else proxCambio=22+Math.random()*30;             // se vuelve a intentar más tarde
    }
  }
  intLluvia+=(objLluvia-intLluvia)*Math.min(1,dt*.35);
  matLluvia.opacity=intLluvia*.62;
  elMojado.style.opacity=String(intLluvia*.9);
  if(intLluvia>.05){
    for(let i=0;i<N_GOTAS;i++){
      const g=gotas[i];
      g.y-=g.v*dt*(.6+intLluvia*.6);g.x-=dt*2.2;
      if(g.y<-2){g.y=22+Math.random()*6;g.x=(Math.random()-.5)*46;g.z=(Math.random()-.5)*46;}
      const bx=jugador.pos.x+g.x,bz=jugador.pos.z+g.z,by=jugador.pos.y+g.y;
      posLluvia[i*6]=bx;posLluvia[i*6+1]=by;posLluvia[i*6+2]=bz;
      posLluvia[i*6+3]=bx+.1;posLluvia[i*6+4]=by-.85;posLluvia[i*6+5]=bz;
    }
    geoLluvia.attributes.position.needsUpdate=true;lluvia.visible=true;
    proxRayo-=dt;
    if(proxRayo<=0&&intLluvia>.5){
      flash=1;proxRayo=8+Math.random()*16;
      elDestello.style.opacity='0.3';setTimeout(()=>elDestello.style.opacity='0',90);
    }
  }else lluvia.visible=false;
  flash=Math.max(0,flash-dt*3.2);

  nubes.forEach((n,i)=>{
    n.position.x+=dt*(1.2+(i%3)*.4);
    if(n.position.x>540)n.position.x=-540;
    const op=(.10+intLluvia*.4)*(.35+dia*.65);
    n.material.opacity+=(op-n.material.opacity)*Math.min(1,dt*1.5);
    n.material.color.setHex(intLluvia>.4?0x3b444e:(dia>.5?0xdae4ea:0x18202c));
  });

  const at=motas.p.geometry.attributes.position;
  for(let i=0;i<motas.N;i++){
    const f=motas.fase[i];
    at.array[i*3]=jugador.pos.x+Math.sin(t*.35+f)*16+Math.sin(f*7.3)*11;
    at.array[i*3+2]=jugador.pos.z+Math.cos(t*.29+f*1.4)*16+Math.cos(f*5.1)*11;
    at.array[i*3+1]=alturaEn(at.array[i*3],at.array[i*3+2])+.5+((f*3.1+t*.22)%3.4)+Math.sin(t*2.1+f)*.25;
  }
  at.needsUpdate=true;
  motas.p.material.opacity=(1-intLluvia*.85)*(esNoche?.95:.45);
  motas.p.material.color.setHex(dia>.5?0xffeec0:0xaaff88);
  motas.p.material.size=dia>.5?.13:.2;

  // ---- pase de vídeo ----
  if(vhsActivo){
    glitchT-=dt;
    if(glitchT<=0){uVHS.uGlitch.value=.7+Math.random()*.5;glitchT=1.6+Math.random()*7.5;}
    uVHS.uGlitch.value=Math.max(0,uVHS.uGlitch.value-dt*2.4);
    uVHS.uTiempo.value=t;
    uVHS.uFuerza.value=.62+intLluvia*.35+vistaPresencia*.5+(1-dia)*.12
                      +(PRESENCIA.susto>0?1.15:0);
    if(PRESENCIA.susto>0)uVHS.uGlitch.value=Math.max(uVHS.uGlitch.value,1.5);
    renderer.setRenderTarget(destino);
    renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    renderer.render(escenaVHS,camVHS);
  }else{
    renderer.render(scene,camera);
  }
}

function redim(){
  // vh/vw mienten en móvil y al entrar en pantalla completa: medimos en píxeles reales
  const m=medida(),vertical=m.h>m.w;
  stage.style.width =(vertical?m.h:m.w)+'px';
  stage.style.height=(vertical?m.w:m.h)+'px';
  stage.style.transform='translate(-50%,-50%) rotate('+(vertical?90:0)+'deg)';
  const w=vertical?m.h:m.w,h=vertical?m.w:m.h;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  const pr=renderer.getPixelRatio();
  destino.setSize(Math.max(2,Math.floor(w*pr)),Math.max(2,Math.floor(h*pr)));
  uVHS.uRes.value.set(Math.floor(w*pr),Math.floor(h*pr));
  joy.style.left='120px';joy.style.top=(h-110)+'px';
}

function enPantallaCompleta(){
  return document.fullscreenElement||document.webkitFullscreenElement||
         document.mozFullScreenElement||document.msFullscreenElement;
}
function refrescarPantalla(){[50,220,550,1000].forEach(ms=>setTimeout(redim,ms));}
/* --- panel de ajustes --- */
{
  const P=document.getElementById('cfgP'),bt=document.getElementById('cfg');
  const vv=document.getElementById('cfgV');
  const pinta=()=>{
    vv.textContent=CFG.sens.toFixed(1);
    P.querySelectorAll('.gfx').forEach(b=>b.classList.toggle('on',b.dataset.g===CFG.gfx));
  };
  const guarda=()=>{try{localStorage.setItem('bosque_gfx',CFG.gfx);
    localStorage.setItem('bosque_sens',String(CFG.sens));}catch(e){}};
  // un solo camino para el toque y el click: en un movil el toque genera ademas

  const toca=(el,fn)=>{

const btnPantalla=document.getElementById('pantalla');
function pantallaCompleta(forzar){
  if(enPantallaCompleta()){
    if(forzar){refrescarPantalla();return;}
    const salir=document.exitFullscreen||document.webkitExitFullscreen||
                document.mozCancelFullScreen||document.msExitFullscreen;
    if(salir){try{salir.call(document);}catch(e){}}
    btnPantalla.classList.remove('on');
    refrescarPantalla();return;
  }
  // ── LA PANTALLA COMPLETA VA SOBRE LA PAGINA, NUNCA SOBRE #stage ──
  // Con el escenario como elemento de pantalla completa, el navegador le impone
  // su propio tamano y le pisa el ancho, el alto y la rotacion que escribe
  // redim(): medido, el stage pasaba de 892x412 girado a 412x892 sin girar, y el
  // lienzo de 892 de ancho quedaba recortado a la mitad. Eso es la media pantalla
  // negra al cruzar la puerta. El escenario tiene que seguir siendo el hijo
  // girado de una pagina que si puede estar en pantalla completa.
  const candidatos=[document.documentElement,document.body];
  let lanzado=false;
  for(const el of candidatos){
    const pedir=el.requestFullscreen||el.webkitRequestFullscreen||
                el.mozRequestFullScreen||el.msRequestFullscreen;
    if(!pedir)continue;
    try{
      const r=pedir.call(el,{navigationUI:'hide'});
      lanzado=true;
      if(r&&r.then){
        r.then(()=>{btnPantalla.classList.add('on');refrescarPantalla();})
         .catch(()=>{if(!forzar)mostrar('Este visor no permite pantalla completa');});
      }else btnPantalla.classList.add('on');
      break;
    }catch(e){}
  }
  if(!lanzado&&!forzar)mostrar('Este visor no permite pantalla completa');
  refrescarPantalla();
}
btnPantalla.addEventListener('touchstart',e=>{e.stopPropagation();e.preventDefault();pantallaCompleta(false);},{passive:false});
btnPantalla.addEventListener('click',e=>{e.stopPropagation();if(!('ontouchstart'in window))pantallaCompleta(false);});
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']

    btnPantalla.classList.toggle('on',!!enPantallaCompleta());
    refrescarPantalla();
  }));

/* --- sonido del susto --- */
let audioCtx=null;
function iniciarAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){audioCtx=null;}
}
function curvaDistorsion(k){
  const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}
  return c;
}
function sonidoSusto(){            // grito
  if(!audioCtx)return;
  const t0=audioCtx.currentTime,dur=.8;
  const dist=audioCtx.createWaveShaper();dist.curve=curvaDistorsion(9);dist.oversample='2x';
  const salida=audioCtx.createGain();
  salida.gain.setValueAtTime(.0001,t0);
  salida.gain.exponentialRampToValueAtTime(.62,t0+.035);
  salida.gain.setValueAtTime(.62,t0+.34);
  salida.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  dist.connect(salida);salida.connect(audioCtx.destination);
  // vibrato del grito
  const lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=17+Math.random()*9;
  const lfoG=audioCtx.createGain();lfoG.gain.value=55;
  lfo.connect(lfoG);lfo.start(t0);lfo.stop(t0+dur);
  // dos voces desafinadas que suben y se desploman
  [1,1.007].forEach((mult,i)=>{
    const o=audioCtx.createOscillator();o.type=i?'square':'sawtooth';
    const f=(560+Math.random()*120)*mult;
    o.frequency.setValueAtTime(f*.62,t0);
    o.frequency.exponentialRampToValueAtTime(f*1.5,t0+.09);
    o.frequency.setValueAtTime(f*1.5,t0+.30);
    o.frequency.exponentialRampToValueAtTime(f*.42,t0+dur);
    lfoG.connect(o.frequency);
    const g=audioCtx.createGain();g.gain.value=i?.22:.5;
    o.connect(g);g.connect(dist);o.start(t0);o.stop(t0+dur);
  });
  // aspereza de garganta
  const sr=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,Math.floor(sr*dur),sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const k=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-k,1.1);}
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;
  bp.frequency.setValueAtTime(2600,t0);bp.frequency.exponentialRampToValueAtTime(700,t0+dur);
  const gn=audioCtx.createGain();gn.gain.value=.30;
  src.connect(bp);bp.connect(gn);gn.connect(dist);src.start(t0);
}
function grillo(vol){
  if(!audioCtx||vol<.02)return;
  const t0=audioCtx.currentTime+Math.random()*.12;
  const o=audioCtx.createOscillator();o.type='sine';
  o.frequency.value=4100+Math.random()*1100;
  const trino=audioCtx.createOscillator();trino.type='square';
  trino.frequency.value=32+Math.random()*16;
  const gt=audioCtx.createGain();gt.gain.value=.5;
  const am=audioCtx.createGain();am.gain.value=.5;
  trino.connect(gt);gt.connect(am.gain);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol*.045,t0+.02);
  g.gain.setValueAtTime(vol*.045,t0+.15);
  g.gain.linearRampToValueAtTime(0,t0+.21);
  o.connect(am);am.connect(g);g.connect(audioCtx.destination);
  o.start(t0);trino.start(t0);o.stop(t0+.23);trino.stop(t0+.23);
}
function pajaro(vol){
  if(!audioCtx||vol<.02)return;
  let t0=audioCtx.currentTime+Math.random()*.25;
  const notas=2+((Math.random()*3)|0);
  for(let i=0;i<notas;i++){
    const d=.06+Math.random()*.10,f0=1700+Math.random()*1700;
    const o=audioCtx.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(f0*(.55+Math.random()*1.0),t0+d);
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol*.055,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(t0);o.stop(t0+d+.03);
    t0+=d+.03+Math.random()*.07;
  }
}
function pisada(fuerte,mojado){
  if(!audioCtx)return;
  const t0=audioCtx.currentTime,dur=fuerte?.20:.16;
  const sr=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,Math.floor(sr*dur),sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const k=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-k,fuerte?2.1:3.0);}
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.Q.value=.75;
  bp.frequency.value=(mojado?1700:fuerte?900:1200)+Math.random()*480;
  const lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=mojado?6000:3400;
  const g=audioCtx.createGain(),vol=(fuerte?.17:.10)*(.85+Math.random()*.3);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(bp);bp.connect(lp);lp.connect(g);g.connect(audioCtx.destination);src.start(t0);
  const o=audioCtx.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(fuerte?125:98,t0);
  o.frequency.exponentialRampToValueAtTime(46,t0+.09);
  const g2=audioCtx.createGain();
  g2.gain.setValueAtTime(.0001,t0);
  g2.gain.exponentialRampToValueAtTime(fuerte?.14:.07,t0+.01);
  g2.gain.exponentialRampToValueAtTime(.0001,t0+.13);
  o.connect(g2);g2.connect(audioCtx.destination);o.start(t0);o.stop(t0+.15);
}
let tGrillo=0,tPajaro=1.5,ultimoPaso=0;

const intro=document.getElementById('intro');
let cruzado=false;
function cruzarPuerta(){
  if(cruzado)return;cruzado=true;
  iniciarAudio();
  pantallaCompleta(true);
  intro.classList.add('abriendo');
  setTimeout(()=>{intro.style.opacity='0';},1650);
  setTimeout(()=>{intro.remove();},2700);
}
intro.addEventListener('touchstart',e=>{e.stopPropagation();e.preventDefault();cruzarPuerta();},{passive:false});
intro.addEventListener('click',e=>{e.stopPropagation();cruzarPuerta();});
