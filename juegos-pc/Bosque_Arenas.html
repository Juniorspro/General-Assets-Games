/* ============================================================================
   EL RECORRIDO · cinemáticas y oleadas
============================================================================ */
const JUEGO={estado:'libre', t:0, arena:null, restantes:0, ganó:false};
const elCartel=document.getElementById('cartel');
const elCG=document.getElementById('cartelG'), elCP=document.getElementById('cartelP');
const elBarras=document.getElementById('barras'), elTinte=document.getElementById('tinte');
const elVida=document.getElementById('vida'), elVidaI=elVida.querySelector('i');
const elOleada=document.getElementById('oleada'), elAyuda=document.getElementById('ayuda');
let ayudaIda=false;
function esconderAyuda(){ if(ayudaIda) return; ayudaIda=true;
  setTimeout(()=>{ elAyuda.style.opacity=0; }, 2600); }
function cartel(g,p,seg){
  elCG.textContent=g||''; elCP.textContent=p||'';
  elCartel.classList.add('show');
  clearTimeout(cartel._t);
  if(seg) cartel._t=setTimeout(()=>elCartel.classList.remove('show'), seg*1000);
}
function tinteDaño(){
  elTinte.style.opacity=Math.min(0.9, 0.35+(1-PJ.vida/PJ.vidaMax)*0.55);
  CAM.sacudir=0.55;
  clearTimeout(tinteDaño._t);
  tinteDaño._t=setTimeout(()=>{ elTinte.style.opacity=0; }, 190);
}
function morir(){
  JUEGO.estado='muerto'; JUEGO.t=0;
  ruidoMorir(); ponerTension(0.15);
  cartel('CAÍSTE', 'el bosque te devuelve a la arena', 0);
}
function revivir(){
  const A=JUEGO.arena;
  limpiarBichos();
  PJ.vida=PJ.vidaMax; PJ.muerto=0; PJ.invul=1.6;
  elTinte.style.opacity=0;
  if(A){
    PJ.pos.set(A.nodo.x, 0, A.nodo.z); PJ.vel.set(0,0,0);
    A.oleada=0; JUEGO.estado='aviso'; JUEGO.t=0;
  }else{
    PJ.pos.set(0,0,4); PJ.vel.set(0,0,0);
    JUEGO.estado='libre';
  }
  elCartel.classList.remove('show');
}
function entrarArena(k){
  const A=ARENAS[k];
  A.estado='peleando'; A.oleada=0;
  JUEGO.arena=A; JUEGO.estado='cine'; JUEGO.t=0;
  elBarras.classList.add('show');
  cartel('ARENA '+(k+1), 'cinco oleadas · sin salida', 0);
  ponerTension(0.85);
}
function pasoJuego(dt){
  JUEGO.t+=dt;
  const A=JUEGO.arena;
  switch(JUEGO.estado){
    case 'libre': {
      const ni=nodoEn(PJ.pos.x, PJ.pos.z);
      /* se dispara bien adentro, no al pisar el borde: si los troncos cayeran
         con uno todavía en la boca, el empujón de la pared lo podría dejar del
         lado de afuera y con la puerta cerrada */
      if(ni>=1 && ARENAS[ni-1].estado==='dormida'){
        const n=NODOS[ni];
        if(Math.hypot(PJ.pos.x-n.x, PJ.pos.z-n.z) < n.r*0.80) entrarArena(ni-1);
      }
      ponerTension(0);
      break;
    }
    case 'cine': {
      /* la cámara gira sola hacia la boca por donde entraste y ahí ve caer los
         troncos que la tapan */
      const b=barrera(A.i,'entra');
      if(b){
        const obj=Math.atan2(b.x-PJ.pos.x, b.z-PJ.pos.z)+Math.PI;
        let d=obj-PJ.yaw;
        while(d>Math.PI) d-=6.2831853; while(d<-Math.PI) d+=6.2831853;
        PJ.yaw+=d*Math.min(1,dt*2.6);
        PJ.cabeceo+=(0.06-PJ.cabeceo)*Math.min(1,dt*2.2);
        if(JUEGO.t>0.75 && b.estado==='guardada'){
          cerrarBarrera(b); ruidoTroncos(true); CAM.sacudir=0.9;
        }
      }
      if(JUEGO.t>3.6){ JUEGO.estado='aviso'; JUEGO.t=0; elBarras.classList.remove('show'); }
      break;
    }
    case 'aviso': {
      const n=A.oleada+1;
      if(JUEGO.t<0.05){ cartel('OLEADA '+n+' / 5', n===5?'la última':'preparate', 2.2);
                        ruidoOleada(A.oleada); }
      ponerTension(0.55+A.oleada*0.10);
      if(JUEGO.t>2.4){
        soltarOleada(A);
        JUEGO.estado='pelea'; JUEGO.t=0;
      }
      break;
    }
    case 'pelea': {
      ponerTension(0.75+A.oleada*0.06);
      const vivos=BICHOS.filter(b=>!b.muerto).length;
      if(vivos===0 && JUEGO.t>0.6){
        A.oleada++;
        if(A.oleada>=5){
          A.estado='limpia';
          JUEGO.estado='limpia'; JUEGO.t=0;
          const s=barrera(A.i,'sale');
          if(s && s.estado==='cerrada'){ abrirBarrera(s); ruidoTroncos(false); }
          ruidoLimpia();
          cartel(A.i===N_ARENAS-1? 'BOSQUE LIMPIO' : 'PASO LIBRE',
                 A.i===N_ARENAS-1? 'las diez arenas cayeron'
                                 : 'los troncos se hunden · seguí el camino', 4.0);
          if(A.i===N_ARENAS-1) JUEGO.ganó=true;
        }else{ JUEGO.estado='aviso'; JUEGO.t=0; }
      }
      break;
    }
    case 'limpia': {
      ponerTension(Math.max(0, 0.5-JUEGO.t*0.25));
      if(JUEGO.t>3.2){ JUEGO.estado='libre'; JUEGO.arena=JUEGO.ganó?A:null; }
      break;
    }
    case 'muerto': {
      matGrado.uniforms.uRojo.value=Math.min(0.85, JUEGO.t*0.55);
      if(JUEGO.t>3.4){ matGrado.uniforms.uRojo.value=0; revivir(); }
      break;
    }
  }
  if(JUEGO.estado!=='muerto') matGrado.uniforms.uRojo.value*=Math.pow(0.02,dt);
}

/* ============================================================================
   EL BOSQUE QUE SE VE
   Cada tanto se decide quién se dibuja entero y quién como carta. No se hace
   todos los cuadros: tres veces por segundo no se nota y sale diez veces más
   barato.
============================================================================ */
let R_VIS=118, R_REAL=21, MAX_REAL=16;
const REALES=[], IMPOS=[];
const _mat4=new THREE.Matrix4(), _q=new THREE.Quaternion(), _v3=new THREE.Vector3();
const _bufCerca=[[],[],[]];
function armarBosque(){
  for(let t=0;t<ESPECIES.length;t++){
    const g=MOD[ESPECIES[t]]; if(!g){ REALES.push(null); IMPOS.push(null); continue; }
    const mat=matModelo(g.tex, {hoja:0.55, inst:true});
    const im=new THREE.InstancedMesh(g.geo, mat, MAX_REAL);
    im.frustumCulled=false; im.count=0; escena.add(im);
    REALES.push(im);
    IMPOS.push(mallaImpostores(retratar(g, 384, 512), 1100));
  }
}
function refrescarBosque(x,z){
  for(const c of _bufCerca) c.length=0;
  const nI=[0,0,0];
  const R2=R_VIS*R_VIS, RR2=R_REAL*R_REAL;
  cerca(x,z,R_VIS,a=>{
    const dx=a.x-x, dz=a.z-z, d2=dx*dx+dz*dz;
    if(d2>R2) return;
    if(d2<RR2){ _bufCerca[a.tipo].push(a, d2); return; }
    const I=IMPOS[a.tipo]; if(!I) return;
    const k=nI[a.tipo]; if(k>=I.max) return;
    const j=k*4;
    I.dat[j]=a.x; I.dat[j+1]=a.z; I.dat[j+2]=a.e; I.dat[j+3]=a.tono;
    nI[a.tipo]=k+1;
  });
  for(let t=0;t<3;t++){
    const im=REALES[t], I=IMPOS[t]; if(!im||!I) continue;
    /* los de adentro del anillo se ordenan y los MAX_REAL más cercanos van
       enteros; los que sobran caen a carta, así el presupuesto no se desborda
       cuando el jugador se mete contra la pared del bosque */
    const b=_bufCerca[t], par=[];
    for(let i=0;i<b.length;i+=2) par.push([b[i], b[i+1]]);
    par.sort((p,q)=>p[1]-q[1]);
    let n=0;
    for(const [a] of par){
      if(n<MAX_REAL){
        _q.setFromAxisAngle(_v3.set(0,1,0), a.tono*11.7);
        _mat4.compose(_v3.set(a.x,0,a.z), _q, new THREE.Vector3(a.e,a.e,a.e));
        im.setMatrixAt(n, _mat4);
        im.material.uniforms.uTinte.value.setScalar(1);
        n++;
      }else{
        const k=nI[t]; if(k>=I.max) break;
        const j=k*4;
        I.dat[j]=a.x; I.dat[j+1]=a.z; I.dat[j+2]=a.e; I.dat[j+3]=a.tono;
        nI[t]=k+1;
      }
    }
    im.count=n; im.instanceMatrix.needsUpdate=true;
    I.geo.instanceCount=nI[t]; I.attr.needsUpdate=true;
  }
}

/* ============================================================================
   AJUSTES, ESTADO Y BUCLE
============================================================================ */
function ponerSol(a){
  const el=lerp(0.10,1.25,a);
  SOL.set(Math.cos(el)*0.55, Math.sin(el), -Math.cos(el)*0.84).normalize();
  const calor=Math.max(0,1-a*1.35);
  SOLC.setRGB(1, 0.97-calor*0.22, 0.92-calor*0.48);
  CIELO.setHSL(0.58, lerp(0.55,0.62,a), lerp(0.30,0.52,a));
  HORIZ.setHSL(lerp(0.10,0.55,Math.min(1,a*1.5)), lerp(0.55,0.30,a), lerp(0.55,0.82,a));
  for(const m of MATS){
    if(m.uniforms.luz) m.uniforms.luz.value.copy(SOL);
    if(m.uniforms.uSolC) m.uniforms.uSolC.value.copy(SOLC);
    if(m.uniforms.uCielo) m.uniforms.uCielo.value.copy(CIELO);
    if(m.uniforms.uCenit) m.uniforms.uCenit.value.copy(CIELO);
    if(m.uniforms.uHoriz) m.uniforms.uHoriz.value.copy(HORIZ);
  }
}
function ponerNiebla(d){ nieblaD=0.0004+d*0.0090;
  for(const m of MATS) if(m.uniforms.uFogD) m.uniforms.uFogD.value=nieblaD; }
function acomodar(){
  acomodarCaja(); renderer.setSize(CAJA.w,CAJA.h,false);
  camara.aspect=CAJA.w/CAJA.h; camara.updateProjectionMatrix();
  acomodarPost(CAJA.w,CAJA.h); acomodarMandos();
}
addEventListener('resize',acomodar);
addEventListener('orientationchange',()=>setTimeout(acomodar,120));

let T=0, ultimo=performance.now(), fps=0, cuadros=0, fpsT=0, refT=0;
const NIVELES=[{p:[0.58,0.55,0.55], vis:70,  real:8,  b:false},
               {p:[0.80,0.78,0.78], vis:95,  real:12, b:true},
               {p:[1.0,1.0,1.0],    vis:118, real:16, b:true}];
let nivel=MOVIL?1:2, autoNivel=true, nivelT=0;
const DIST0=[];
function aplicarNivel(){
  const n=NIVELES[nivel];
  for(let i=0;i<CAMPOS.length;i++) CAMPOS[i].mat.uniforms.uDist.value=DIST0[i]*n.p[i];
  postBloom=n.b;
  R_VIS=n.vis*arbolK; R_REAL=Math.min(21, n.vis*0.20); MAX_REAL=Math.round(n.real*arbolK);
  refT=99;
}
let arbolK=1;
const $=id=>document.getElementById(id);
function deslizador(id, vid, fn, dec){
  const s=$(id), v=$(vid);
  const ap=()=>{ const x=parseFloat(s.value); v.textContent=x.toFixed(dec===undefined?2:dec); fn(x); };
  s.addEventListener('input',ap); ap();
}
function bucle(ahora){
  requestAnimationFrame(bucle);
  let dt=(ahora-ultimo)/1000; ultimo=ahora;
  /* el contador de cuadros suma el tiempo REAL, no el recortado: si se suma el
     recortado, con el juego a un cuadro por segundo el contador informa quince
     y uno se pasa la tarde optimizando lo que no era */
  cuadros++; fpsT+=dt;
  if(dt>0.08) dt=0.08;
  T+=dt;
  if(fpsT>0.5){
    fps=Math.round(cuadros/fpsT); cuadros=0; fpsT=0;
    if(autoNivel){ nivelT+=0.5;
      if(nivelT>2.5){
        if(fps<26 && nivel>0){ nivel--; aplicarNivel(); nivelT=0; }
        else if(fps>52 && nivel<2){ nivel++; aplicarNivel(); nivelT=0; }
      }
    }
  }
  giroVel=(PJ.yaw-yawAnt)/Math.max(dt,1e-4); yawAnt=PJ.yaw;

  PJ.golpeT=Math.max(0,PJ.golpeT-dt);
  PJ.invul=Math.max(0,PJ.invul-dt);
  pulsG=Math.max(0,pulsG-dt*4); pulsS=Math.max(0,pulsS-dt*4);

  verCerca(PJ.pos.x, PJ.pos.z);
  piezasCerca(PJ.pos.x, PJ.pos.z);
  pasoJuego(dt);
  moverJugador(dt);
  pasoBarreras(dt);
  pasoBichos(dt);
  pasoChispas(dt);
  pasoAudio(dt, tierraEn(PJ.pos.x,PJ.pos.z), PJ.rapidez<0.2);

  seguirPasto(PJ.pos.x, PJ.pos.z);
  suelo.position.set(PJ.pos.x, 0, PJ.pos.z);
  refT+=dt;
  if(refT>0.32){ refT=0; refrescarBosque(PJ.pos.x, PJ.pos.z); }

  PASTO_U.uT.value=T;
  PASTO_U.uJug.value.set(PJ.pos.x, PJ.pos.y, PJ.pos.z);
  cieloMat.uniforms.uT.value=T;
  for(const m of MATS) if(m.uniforms.uOjo) m.uniforms.uOjo.value.copy(camara.position);
  chispasG.material.uniforms.uOjo.value.copy(camara.position);
  camara.matrixWorld.decompose(_v3, _q, new THREE.Vector3());
  chispasG.material.uniforms.uDer.value.set(1,0,0).applyQuaternion(_q);
  chispasG.material.uniforms.uArriba.value.set(0,1,0).applyQuaternion(_q);

  renderer.setRenderTarget(rtEsc); renderer.clear();
  renderer.render(escena, camara);
  pintarPost();
  dibujarMandos();

  /* HUD */
  const v=PJ.vida/PJ.vidaMax;
  elVidaI.style.width=(v*100).toFixed(1)+'%';
  elVida.classList.toggle('baja', v<0.34);
  const A=JUEGO.arena;
  if(A && (JUEGO.estado==='pelea'||JUEGO.estado==='aviso')){
    const vivos=BICHOS.filter(b=>!b.muerto).length;
    elOleada.innerHTML='ARENA <b>'+(A.i+1)+'</b>/'+N_ARENAS+'<br>OLEADA <b>'
      +Math.min(5,A.oleada+1)+'</b>/5'+(JUEGO.estado==='pelea'? '<br>'+vivos+' EN PIE':'');
  }else if(JUEGO.ganó) elOleada.innerHTML='<b>BOSQUE LIMPIO</b><br>'+PJ.kills+' CAÍDOS';
  else{
    const ni=nodoEn(PJ.pos.x,PJ.pos.z);
    const hechas=ARENAS.filter(a=>a.estado==='limpia').length;
    elOleada.innerHTML='ARENAS <b>'+hechas+'</b>/'+N_ARENAS+(ni===0? '<br>SEGUÍ EL CAMINO':'');
  }
  const st=$('stats');
  if(st) st.textContent=fps+' fps · '+ARBOLES.length+' árboles · calidad '+(nivel+1)+'/3';
}

/* ============================================================================
   ARRANQUE
============================================================================ */
async function arrancar(){
  await cargarModelos();
  _ctxt && (_ctxt.textContent='sembrando el bosque…');
  await new Promise(r=>setTimeout(r,16));
  sembrar(); indexar(ARBOLES); avance('el bosque');
  _ctxt && (_ctxt.textContent='retratando los árboles…');
  await new Promise(r=>setTimeout(r,16));
  armarBosque(); avance('los impostores');
  _ctxt && (_ctxt.textContent='levantando las arenas…');
  await new Promise(r=>setTimeout(r,16));
  if(MOD.troncos) matMadera=matModelo(MOD.troncos.tex, {inst:false});
  armarArenas();
  armarMadera();
  armarBarreras();
  /* la salida de cada arena nace tapada; la entrada cae recién en la cinemática */
  for(const b of BARRERAS) if(b.lado==='sale'){ b.estado='cerrada'; b.obj.visible=true; }
  avance('las arenas');
  crearChispas();

  for(const c of CAMPOS) DIST0.push(c.mat.uniforms.uDist.value);
  deslizador('sArb','vArb', x=>{ arbolK=x; aplicarNivel(); });
  deslizador('sDens','vDens', x=>PASTO_U.uDens.value=x);
  deslizador('sViento','vViento', x=>PASTO_U.uViento.value=x);
  deslizador('sSol','vSol', ponerSol);
  deslizador('sExp','vExp', x=>matGrado.uniforms.uExp.value=x);
  deslizador('sSat','vSat', x=>matGrado.uniforms.uSat.value=x);
  deslizador('sNit','vNit', x=>matGrado.uniforms.uNit.value=x);
  deslizador('sNiebla','vNiebla', ponerNiebla);
  deslizador('sVol','vVol', ponerVolumen);
  $('bPanel').addEventListener('click',()=>$('panel').classList.toggle('show'));
  $('bCorrer').addEventListener('click',()=>{ correr=!correr;
    $('bCorrer').classList.toggle('on',correr); });
  aplicarNivel();
  acomodar();

  /* el arranque: en el claro, mirando el camino que sale hacia la arena uno */
  const d=NODOS[1];
  PJ.pos.set(NODOS[0].x, 0, NODOS[0].z+4);
  PJ.yaw=Math.atan2(-(d.x-PJ.pos.x), -(d.z-PJ.pos.z));
  yawAnt=PJ.yaw;
  refrescarBosque(PJ.pos.x, PJ.pos.z);

  avance('listo');
  document.getElementById('carga').classList.add('ir');
  setTimeout(()=>{ const c=document.getElementById('carga'); if(c) c.remove(); }, 900);
  requestAnimationFrame(bucle);
}
arrancar();

window.__dbg={
  get fps(){ return fps; },
  get jugador(){ return {x:+PJ.pos.x.toFixed(2), y:+PJ.pos.y.toFixed(2), z:+PJ.pos.z.toFixed(2),
                         yaw:+PJ.yaw.toFixed(2), vida:Math.round(PJ.vida), kills:PJ.kills}; },
  get juego(){ return {estado:JUEGO.estado, arena:JUEGO.arena?JUEGO.arena.i:-1,
                       oleada:JUEGO.arena?JUEGO.arena.oleada:-1, bichos:BICHOS.length,
                       vivos:BICHOS.filter(b=>!b.muerto).length}; },
  get mundo(){ return {arboles:ARBOLES.length, piezas:PIEZAS.length, barreras:BARRERAS.length,
                       nodos:NODOS.length, lim:LIM,
                       reales:REALES.map(r=>r?r.count:0),
                       cartas:IMPOS.map(i=>i?i.geo.instanceCount:0)}; },
  get modelos(){ const o={}; for(const k in MOD) o[k]=MOD[k]? {alto:+MOD[k].alto.toFixed(2),
                   tri:MOD[k].geo.index?MOD[k].geo.index.count/3:0} : null; return o; },
  poner(x,z){ PJ.pos.set(x,PJ.pos.y,z); PJ.vel.set(0,0,0); refrescarBosque(x,z); },
  irArena(k){ const n=NODOS[k+1]; this.poner(n.x,n.z); },
  mirar(y,c){ PJ.yaw=y; PJ.cabeceo=c; yawAnt=y; },
  ojo(h){ PJ.pos.y=h; },
  palanca(x,y){ palanca.activa=(x||y)!==0; palanca.x=x||0; palanca.y=y||0; },
  golpe(){ golpear(); },
  nodos(){ return NODOS.map(n=>({x:+n.x.toFixed(1), z:+n.z.toFixed(1), r:n.r})); },
  calidad(n){ autoNivel=(n===undefined); if(n!==undefined){ nivel=n; aplicarNivel(); } return nivel; },
  holgura(x,z){ return holgura(x,z); },
  /* para probar la lógica del juego en una máquina sin GPU: se apaga lo que
     cuesta dibujar y el bucle corre a velocidad usable */
  ligero(v){ const on=v!==false;
    for(const c of CAMPOS) c.malla.visible=!on;
    for(const m of REALES) if(m) m.visible=!on;
    for(const I of IMPOS) if(I) I.malla.visible=!on;
    return on; },
  escena, renderer, camara, CAMPOS, REALES, IMPOS, ARENAS, BARRERAS, BICHOS, JUEGO
};
