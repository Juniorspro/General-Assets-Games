<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CANICA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07070b;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#f2eee6;user-select:none;-webkit-user-select:none;touch-action:none}

/* ══════════ EL MARCO ES VERTICAL Y NO SE GIRA ══════════
   Al revés de los juegos 3D de este repo, que se dibujan apaisados adentro de un
   teléfono vertical. Un casual se juega con el teléfono como uno lo tiene y un
   solo pulgar: girarlo sería pedirle al jugador que cambie de postura.
   El lienzo se dibuja con el ANCHO clavado en 720 y el alto según la forma de
   la pantalla —lo calcula `medir()`— así que el marco la llena entera y una
   ficha de 40 px mide lo mismo en un teléfono de 360 y en uno de 1440. */
#caja{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  overflow:hidden;background:#000;--ac:#f2eee6}
canvas{display:block;width:100%;height:100%}
/* ══════════ EL TELON DEL MENU ══════════
   En el menu el lienzo no dibuja nada, asi que sin esto el menu es un panel
   gris sobre negro — o sea la pantalla de opciones de cualquier cosa. Es el
   MISMO fondo generado que usa la partida, asi que el menu y el juego se ven
   del mismo sitio, y va en DOM y no en el lienzo porque no hay que redibujarlo
   sesenta veces por segundo para que quede quieto.
   ── Y NO RECIBE TOQUES, QUE ES LO QUE ROMPIO EL JUEGO UNA VEZ ──
   Un elemento con `opacity:0` SIGUE RECIBIENDO el dedo. Medido con
   `elementFromPoint` en el medio de la pantalla y en partida: lo que estaba
   debajo del dedo era `tela` y no el lienzo, o sea que NINGUN toque llegaba al
   juego. Y no lo vio ninguna sonda, porque las sondas llaman a `JUEGO.baja`
   directo y se saltean todo el camino entre el dedo y el juego. */
#tela{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;
  transition:opacity .6s;z-index:1;pointer-events:none}
#tela.on{opacity:1}

/* ══════════ LO QUE VA EN DOM Y LO QUE VA EN EL LIENZO ══════════
   En el lienzo: el juego y las cinemáticas. En DOM: sólo el texto que hay que
   TRADUCIR y que tiene que quedar nítido en cualquier densidad de pantalla.
   Un texto dibujado en un lienzo de 720 se ve borroso en un teléfono de 1440, y
   el nombre del juego es justo lo que se mira primero. */
.pan{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:2.6vh;padding:6vw;text-align:center;z-index:5;
  background:linear-gradient(180deg,rgba(7,7,11,.34) 0%,rgba(7,7,11,.74) 44%,
    rgba(7,7,11,.93) 100%)}
.pan.on{display:flex}
/* ── EL TAMAÑO DEL TÍTULO SALE DEL LARGO DEL NOMBRE ──
   Con 11vw clavado, un nombre de diez letras —con un cuarto de em de espaciado
   entre cada una— mide mas que el marco y sale CORTADO por los dos lados.
   `--h1` lo calcula el arranque a partir de la cantidad de letras, así que el
   próximo nombre largo entra solo. */
.pan h1{font-size:clamp(26px,var(--h1,11vw),64px);letter-spacing:.26em;font-weight:800;
  text-indent:.26em;line-height:1;
  text-shadow:0 0 30px var(--ac),0 4px 22px #000}
.em{width:clamp(90px,27vw,158px);height:auto;margin-bottom:-1.4vh;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.75))}
.em[hidden]{display:none}
#pFin h1{font-size:clamp(24px,7.5vw,42px);letter-spacing:.16em;text-indent:.16em}
.pan p{font-size:clamp(12px,3.4vw,17px);line-height:1.6;opacity:.62;max-width:24em}
.fila{display:flex;gap:2.6vw;flex-wrap:wrap;justify-content:center}
.bt{appearance:none;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.05);
  color:inherit;font:inherit;font-size:clamp(12px,3.5vw,16px);font-weight:700;
  letter-spacing:.16em;padding:1.5vh 5.5vw;border-radius:999px;cursor:pointer}
.bt.p{background:var(--ac);color:#0b0b10;border-color:var(--ac)}
.bt:disabled{opacity:.34}
.bt.ch{padding:.9vh 3.4vw;font-size:11px;letter-spacing:.12em}

/* ══════════ EL SELECTOR DE NIVELES ══════════
   Los tres juegos de niveles necesitan una reja con el progreso: qué está
   abierto, cuántas estrellas dio cada uno. Y tiene que poder DESLIZARSE, porque
   son doscientos niveles y en un teléfono entran veinte por pantalla.
   `justify-content:flex-start` a propósito: centrado, con la reja más alta que
   el marco, el navegador recorta por ARRIBA y las primeras filas quedan
   inalcanzables — un defecto clásico de flex con overflow. */
#pNiveles{justify-content:flex-start;padding-top:4vh;gap:1.8vh}
#rejaN{display:grid;grid-template-columns:repeat(5,1fr);gap:2.2vw;width:100%;
  max-width:520px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;padding:1vh .5vw 3vh}
.nv{position:relative;aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-weight:800;font-size:clamp(13px,4vw,19px);color:inherit;font-family:inherit}
.nv.hecho{border-color:var(--ac);background:rgba(255,255,255,.10)}
.nv.trabado{opacity:.26;cursor:default}
.nv .es{font-size:9px;letter-spacing:.08em;color:#ffd76a;line-height:1;height:9px}
#tituN{font-size:clamp(15px,4.6vw,22px);letter-spacing:.2em;font-weight:800}

/* ══════════ EL HUD ══════════
   Arriba el número grande —los puntos en los de puntaje, el nivel en los de
   niveles— y debajo su rótulo. A los costados, dos fichas chicas para lo que
   cambia dentro del nivel (movimientos, burbujas que quedan). */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:4}
#hud.on{opacity:1}
#marca{position:absolute;top:2.2vh;left:0;right:0;text-align:center;
  font-size:clamp(28px,9.4vw,54px);font-weight:800;letter-spacing:.04em;
  text-shadow:0 3px 18px rgba(0,0,0,.75)}
#sub{position:absolute;top:calc(2.2vh + 10.6vw);left:0;right:0;text-align:center;
  font-size:clamp(10px,3vw,14px);letter-spacing:.28em;opacity:.55}
.fic{position:absolute;top:2.4vh;font-size:clamp(10px,3vw,14px);letter-spacing:.14em;
  font-weight:700;opacity:.72;padding:.7vh 3vw;border-radius:999px;
  background:rgba(7,7,11,.5);border:1px solid rgba(255,255,255,.12)}
#ficI{left:3.5vw}
#ficD{right:3.5vw}
.fic[hidden]{display:none}
/* ── LA FICHA DEL MULTIPLICADOR ──
   Debajo del marcador y con su propia barrita: la barra es la ventana de la
   racha, o sea el tiempo que queda para que el próximo acierto la sostenga. Sin
   la barra, la racha se corta sola y el jugador no sabe por qué. */
#combo{position:absolute;top:calc(2.2vh + 15vw);left:0;right:0;text-align:center;
  font-size:clamp(18px,6vw,34px);font-weight:800;letter-spacing:.06em;
  color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.6),0 3px 12px #000;
  opacity:0;transform:scale(.7);transition:opacity .18s,transform .18s}
#combo.on{opacity:1;transform:scale(1)}
#comboV{position:absolute;top:calc(2.2vh + 22vw);left:38%;right:38%;height:4px;
  background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden;
  opacity:0;transition:opacity .18s}
#combo.on ~ #comboV{opacity:.8}
#comboB{height:100%;width:0;background:#ffd76a}
#reloj{position:absolute;left:12%;right:12%;bottom:3.2vh;height:6px;
  background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
/* ── Y SUBE CUANDO HAY FILA DE BOTONES ──
   Medido con `cajas()` en BURBUJAS: el reloj caia en y 857 y la fila de botones
   ocupaba de 840 a 871, o sea la barra dibujada por ENCIMA de DESHACER. Los dos
   viven anclados abajo y ninguno sabia del otro. */
body.conAcc #reloj{bottom:9.6vh}
#relojB{height:100%;width:100%;background:#f2eee6}
#relojB.poco{background:#e0553f}
/* ══════════ LOS BOTONES DE PARTIDA ══════════
   DESHACER y REINICIAR sólo existen en los juegos de niveles, y son la mitad de
   lo que hace que un rompecabezas se pueda jugar: sin deshacer, un movimiento
   mal pensado cuesta el nivel entero y el jugador cierra el juego. Van con
   `pointer-events:auto` porque el HUD entero está en `none` — si no, el botón
   se ve y no se puede tocar, que es exactamente el defecto que ya costó una
   vuelta con el telón. */
#acc{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;gap:3vw;
  justify-content:center;pointer-events:auto}
#acc[hidden]{display:none}
#acc .bt{background:rgba(7,7,11,.62)}
/* ── Y NO RECIBEN EL DEDO CON EL HUD APAGADO ──
   `#hud` va a `opacity:0` entre partidas, y un elemento invisible SIGUE
   RECIBIENDO toques: con `pointer-events:auto` clavado, los tres botones se
   quedarían comiendo el dedo por encima del menú. Es exactamente el defecto que
   ya dejó un juego sin poder empezar, y ahí lo causaba el telón. */
#hud:not(.on) #acc{pointer-events:none}

/* el pie de la cinemática: el único texto de una cinemática, y va en DOM por lo
   mismo que el título — hay que poder traducirlo y tiene que leerse */
#cine{position:absolute;left:8%;right:8%;bottom:9vh;text-align:center;z-index:5;
  font-size:clamp(13px,3.8vw,19px);line-height:1.5;opacity:0;transition:opacity .5s;
  text-shadow:0 2px 16px #000;pointer-events:none}
#cine.on{opacity:.96}
#salta{position:absolute;right:4vw;top:3vh;z-index:6;font-size:11px;letter-spacing:.2em;
  opacity:0;transition:opacity .4s;pointer-events:none}
#salta.on{opacity:.4}

#estr{font-size:clamp(22px,7vw,38px);letter-spacing:.18em;color:#ffd76a;
  text-shadow:0 0 20px rgba(255,215,106,.55)}
#estr[hidden]{display:none}

/* ══════════ EL VIDEO DE LA CAMARA ══════════
   Dos pixeles y transparente, NO `display:none`. Un video que el compositor
   considera que no se dibuja puede DEJAR DE ENTREGAR CUADROS, y sin cuadros no
   hay deteccion: es la leccion de RECREO, donde esconderlo dejaba el juego sin
   manos sin un solo error en la consola. */
#camVid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;
  pointer-events:none;z-index:0}
/* la linea de estado del sensor: permanente y en el MENU, no un aviso de dos
   segundos dentro de la partida. Un aviso de dos segundos en una pantalla que
   no se esta mirando no es un aviso — y el motivo por el que el sensor no anda
   es justamente lo que el jugador necesita saber antes de empezar. */
#sensor{font-size:clamp(10px,2.9vw,13px);letter-spacing:.14em;opacity:.62;
  line-height:1.5;max-width:22em}
#sensor.mal{color:#ffc98a;opacity:.85}
#sensor[hidden]{display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#velo{position:absolute;inset:0;background:#07070b;opacity:0;pointer-events:none;
  z-index:6;transition:opacity .45s}
#velo.on{opacity:1}
</style></head><body>
<div id="caja">
  <canvas id="c"></canvas>
  <video id="camVid" playsinline muted autoplay></video>
  <div id="tela"></div>
  <div id="hud">
    <div id="marca">0</div>
    <div id="sub"></div>
    <div class="fic" id="ficI" hidden></div>
    <div class="fic" id="ficD" hidden></div>
    <div id="combo"></div>
    <div id="comboV"><div id="comboB"></div></div>
    <div id="reloj"><div id="relojB"></div></div>
    <div id="acc" hidden>
      <button class="bt ch" id="bDes" data-i18n="deshacer"></button>
      <button class="bt ch" id="bRei" data-i18n="reiniciar"></button>
      <button class="bt ch" id="bSal" data-i18n="salir"></button>
    </div>
  </div>
  <div id="cine"></div>
  <div id="salta"></div>
  <div id="velo"></div>
  <div id="flash"></div>

  <div class="pan on" id="pIdioma">
    <img class="em" id="emI" alt="" hidden>
    <h1>CANICA</h1>
    <div class="fila">
      <button class="bt p" data-lang="es">ESPAÑOL</button>
      <button class="bt" data-lang="en">ENGLISH</button>
      <button class="bt" data-lang="pt">PORTUGUÊS</button>
    </div>
  </div>

  <div class="pan" id="pMenu">
    <img class="em" id="emM" alt="" hidden>
    <h1>CANICA</h1>
    <p data-i18n="sub"></p>
    <div class="fila">
      <button class="bt p" id="bJugar" data-i18n="jugar"></button>
      <button class="bt" id="bComo" data-i18n="como"></button>
    </div>
    <p id="sensor" hidden></p>
    <p id="mejor" style="opacity:.42;letter-spacing:.2em;font-size:12px"></p>
    <div class="fila" style="gap:1.8vw">
      <button class="bt ch" data-lang="es">ES</button>
      <button class="bt ch" data-lang="en">EN</button>
      <button class="bt ch" data-lang="pt">PT</button>
    </div>
  </div>

  <div class="pan" id="pNiveles">
    <div id="tituN" data-i18n="niveles"></div>
    <div id="rejaN"></div>
    <div class="fila"><button class="bt ch" id="bNMenu" data-i18n="menu"></button></div>
  </div>

  <div class="pan" id="pFin">
    <h1 id="finT"></h1>
    <div id="estr" hidden></div>
    <p id="finP"></p>
    <div class="fila">
      <button class="bt p" id="bOtra" data-i18n="otra"></button>
      <button class="bt" id="bMenu" data-i18n="menu"></button>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{}}</script>
<script type="module">
/* ══════════════════════ EL MARCO Y EL RELOJ ══════════════════════ */
const $ = (i) => document.getElementById(i);

/* ── EL ANCHO DE DISEÑO ES FIJO Y EL ALTO NO ──
   Todo lo que un juego escribe —una posición, un radio, un tamaño de letra—
   está en unidades de diseño con el ancho clavado en 720, así que una moneda de
   40 px mide lo mismo en un teléfono de 360 y en uno de 1440. Eso es lo que
   evita el defecto que aparece sólo en un tamaño de pantalla y que nadie puede
   reproducir.

   PERO EL ALTO NO PUEDE SER FIJO, y eso se vio en la primera captura: con
   720×1280 clavado —9:16, la relación de un teléfono de 2016— en un teléfono de
   hoy (412×892, o sea 0,46) el marco entraba por el ancho y quedaban DOS BANDAS
   NEGRAS arriba y abajo. Un minijuego que se abre adentro de TikTok tiene que
   ocupar la pantalla entera; una banda negra se lee a que el juego está roto.
   Así que el alto se calcula de la pantalla y los juegos lo leen: lo que se
   ancla abajo se escribe como `AL - algo`, no como un número. Se topa arriba y
   abajo para que una ventana de escritorio muy ancha o muy alta no deforme el
   diseño — ahí sí quedan bandas, y ahí sí corresponde. */
const AN = 720;
let AL = 1280;
const AL_MIN = 1100, AL_MAX = 1760;

const lienzo = $('c');
const g = lienzo.getContext('2d');
const caja = $('caja');
let ESC = 1, DPR = 1;

function medir(){
  const vw = window.innerWidth, vh = window.innerHeight;
  /* el alto de diseño sale de la forma de la pantalla, así que el marco la llena
     entera y no hay bandas */
  let e = vw / AN;
  AL = Math.round(vh / e);
  if (AL < AL_MIN){ AL = AL_MIN; e = vh / AL; }
  else if (AL > AL_MAX){ AL = AL_MAX; e = vh / AL; }
  const w = Math.round(AN * e), h = Math.round(AL * e);
  caja.style.width = w + 'px'; caja.style.height = h + 'px';
  /* ── EL PIXEL RATIO VA TOPADO EN 2, Y ESO ESTÁ MEDIDO EN OTRO JUEGO ──
     En Maicol se midió que dibujar al doble de la resolución de diseño costaba
     la mitad de los cuadros y no compraba ni un detalle, porque no hay más
     detalle que dar: los dibujos están hechos para 720 de ancho. Con 2 el texto
     y los bordes quedan finos y no se paga un tercer múltiplo. */
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(w * DPR);
  lienzo.height = Math.round(h * DPR);
  ESC = (w * DPR) / AN;
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.imageSmoothingEnabled = true;
}
addEventListener('resize', () => setTimeout(medir, 60));
addEventListener('orientationchange', () => setTimeout(medir, 120));

/* ── EL RELOJ: PASO FIJO DE 60 CON TOPE ──
   Un minijuego que se juega por reflejos NO PUEDE depender de los cuadros por
   segundo del aparato: si la moneda cae más rápido en un teléfono lento, es
   otro juego. La simulación va a 60 pasos fijos y el dibujo sale de donde
   quedó. Y el `dt` se topa en un cuarto de segundo, porque una pestaña que
   estuvo dormida no puede simular un minuto de golpe. */
const PASO = 1/60;
let _acum = 0, _ultimo = performance.now();
let MODO = 'idioma';      /* idioma · menu · como · cine · juega · fin */
let PAUSA = false, CONGELADO = false;
let fps = 0, _cuadros = 0, _acumF = 0;

/* la entrada: un solo verbo. Llega normalizada a las unidades de diseño, así
   que un juego nunca ve un píxel de pantalla. */
const TOQUE = { x: 0, y: 0, abajo: false, movido: false, n: 0 };
function aDiseno(ev){
  const r = lienzo.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return { x: (t.clientX - r.left) / r.width * AN,
           y: (t.clientY - r.top) / r.height * AL };
}
/* ── EL `preventDefault` DE UN `touchstart` CANCELA EL CLICK, Y ESO DEJABA EL
       JUEGO SIN PODER EMPEZAR ──
   Los cuatro escuchas estaban colgados de la VENTANA, así que un toque en el
   botón JUGAR o en el de idioma pasaba primero por acá, llegaba a
   `preventDefault()` —el juego consume el toque— y el navegador entonces NO
   sintetiza el `click`. En el banco no se veía: Playwright despacha un click de
   ratón de verdad y ese camino no pasa por el táctil. En un teléfono, tocar
   JUGAR no hacía absolutamente nada.

   Ahora la entrada del juego cuelga del LIENZO. Los paneles viven por encima
   (`z-index 5`), así que mientras hay un panel abierto el lienzo no recibe nada
   y los botones son botones; en partida no hay panel y el lienzo recibe todo.
   `touchend`/`mouseup` siguen en la ventana a propósito: un arrastre que
   termina afuera del marco tiene que soltar igual. */
function baja(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.abajo = true; TOQUE.movido = false; TOQUE.n++;
  if (MODO === 'cine'){ cineSalta(); return; }
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function mueve(ev){
  const p = aDiseno(ev);
  TOQUE.x = p.x; TOQUE.y = p.y; TOQUE.movido = true;
  if (MODO === 'juega' && TOQUE.abajo && JUEGO.mueve) JUEGO.mueve(p.x, p.y);
  if (ev.cancelable) ev.preventDefault();
}
function sube(){
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(TOQUE.x, TOQUE.y);
  TOQUE.abajo = false;
}
lienzo.addEventListener('touchstart', baja, { passive: false });
lienzo.addEventListener('touchmove', mueve, { passive: false });
addEventListener('touchend', sube, { passive: true });
addEventListener('touchcancel', sube, { passive: true });
lienzo.addEventListener('mousedown', baja);
addEventListener('mousemove', (e) => { if (TOQUE.abajo) mueve(e); });
addEventListener('mouseup', sube);
/* la barra espaciadora hace de toque EN EL MEDIO del marco: es lo que permite
   probarlo en una notebook sin fingir un táctil. Y va con las coordenadas de
   diseño y no con las del evento, porque un `keydown` no trae ninguna — con
   `clientX` en cero el toque caía en el borde izquierdo, que en un juego de
   tocar la mitad es una respuesta equivocada. */
function toqueMedio(){
  if (MODO === 'cine'){ cineSalta(); return; }
  TOQUE.x = AN/2; TOQUE.y = AL/2; TOQUE.abajo = true;
  if (MODO === 'juega' && JUEGO.baja) JUEGO.baja(AN/2, AL/2);
  if (MODO === 'juega' && JUEGO.sube) JUEGO.sube(AN/2, AL/2);
  TOQUE.abajo = false;
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') toqueMedio();
});
/* ══════════════════════ EL GIROSCOPIO Y LA SACUDIDA ══════════════════════
   Dos cosas distintas que salen del mismo aparato: cuanto esta INCLINADO el
   telefono (`deviceorientation`) y cuando lo SACUDEN (`devicemotion`). La
   primera es una posicion y la segunda un acontecimiento, y por eso se leen de
   dos eventos y no de uno.

   ── POR QUE NO SE USA LA CAMARA PARA ESTO ──
   Es la leccion de BARRIO: para saber para donde esta mirando el jugador, lo
   obvio seria detectar la cara. Y no hace falta — el telefono YA sabe como esta
   orientado, sin camara, sin modelo y sin un milisegundo de deteccion. La
   orientacion del aparato ES la postura del jugador, porque el aparato lo tiene
   en la mano.

   ── LAS CINCO COSAS QUE HAY QUE HACER BIEN, Y CADA UNA COSTO UNA VUELTA ──
   1. EL PERMISO DE iOS. Desde iOS 13, `deviceorientation` no dispara hasta que
      `DeviceOrientationEvent.requestPermission()` se llama DENTRO de un gesto
      del usuario. Llamado en el arranque, la promesa se rechaza y el juego se
      queda sin sensor sin decir por que.
   2. EL CERO ES LA POSTURA EN LA QUE SE EMPEZO. Nadie juega con el telefono
      perfectamente vertical: con un cero absoluto, el juego arranca inclinado.
   3. ZONA MUERTA. Una mano nunca esta quieta, y sin zona muerta el mundo
      tiembla despacio todo el tiempo. 1,6 grados, que es lo que se midio en
      BARRIO.
   4. LA VUELTA CORTA. `beta` y `gamma` dan la vuelta: cruzando de 179 a -179 la
      diferencia cruda son 358 grados y el mundo pega media vuelta.
   5. LA SACUDIDA SE MIDE EN EL CAMBIO Y NO EN LA MAGNITUD. La gravedad ya son
      9,8: mirando el modulo de la aceleracion, el telefono quieto parece estar
      sacudiendose siempre. Lo que distingue una sacudida es que el vector
      CAMBIE rapido. */

const GIRO = {
  estado: 'no',        /* no · pidiendo · lista · negado · sin · insegura */
  on: false,
  x: 0, y: 0,          /* la inclinacion, de -1 a 1, ya con cero y zona muerta */
  crudo: { b: 0, g: 0, a: 0 },
  cero: { b: 0, g: 0, a: 0 },
  hayCero: false,
  n: 0,                /* eventos recibidos: distingue «no hay sensor» de «no llego ninguno» */
  sac: 0,              /* fuerza de la ultima sacudida, decae */
  sacN: 0,
  sacPico: 0,
  _sacFrio: 0,
  _ult: null,
  /* ── LO QUE CADA JUEGO AJUSTA ──
     `rango` son los grados de inclinacion que valen 1: un laberinto quiere poco
     (se juega con muñeca) y una camara quiere mas. `recentra` es la constante de
     tiempo con la que el cero persigue la postura actual — un juego de mirar la
     quiere para que dejar el telefono torcido no te deje mirando al techo, y un
     laberinto NO la quiere, porque ahi el cero es el nivel del piso. */
  rango: 30,
  recentra: 0,
  zona: 1.6
};
const GIRO_SAC_UMB = 22;      /* m/s^2 de CAMBIO para que cuente como sacudida */
const GIRO_SAC_FRIO = 0.42;   /* segundos entre dos sacudidas */

/* la vuelta corta: la diferencia entre dos angulos, siempre en (-180, 180] */
function giroDelta(a, b){
  let d = a - b;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

function giroEvento(e){
  if (e.beta == null && e.gamma == null) return;   /* el evento existe y viene vacio */
  GIRO.n++;
  GIRO.crudo.b = e.beta || 0;
  GIRO.crudo.g = e.gamma || 0;
  GIRO.crudo.a = e.alpha || 0;
  if (!GIRO.hayCero) giroCero();
  GIRO.on = true;
  giroCalcula();
}
function giroCero(){
  GIRO.cero.b = GIRO.crudo.b; GIRO.cero.g = GIRO.crudo.g; GIRO.cero.a = GIRO.crudo.a;
  GIRO.hayCero = true;
}
function giroCalcula(){
  /* en vertical, `gamma` es inclinar de costado y `beta` adelante y atras */
  const dg = giroDelta(GIRO.crudo.g, GIRO.cero.g);
  const db = giroDelta(GIRO.crudo.b, GIRO.cero.b);
  const z = GIRO.zona;
  const ap = (d) => {
    const s = Math.sign(d), m = Math.abs(d);
    if (m <= z) return 0;
    return Math.max(-1, Math.min(1, s*(m - z)/GIRO.rango));
  };
  GIRO.x = ap(dg);
  GIRO.y = ap(db);
}

/* ── LA SACUDIDA ──
   Se mira el CAMBIO del vector de aceleracion entre dos eventos. Y con
   `accelerationIncludingGravity`, que es la que existe en todos los aparatos —
   `acceleration` sin gravedad la informa solo una parte de ellos, y la
   diferencia entre dos lecturas ya le quita la gravedad, porque la gravedad no
   cambia. */
function giroMocion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const p = GIRO._ult;
  GIRO._ult = { x: a.x, y: a.y, z: a.z };
  if (!p) return;
  const d = Math.hypot(a.x - p.x, a.y - p.y, a.z - p.z);
  GIRO.sacPico = Math.max(GIRO.sacPico, d);
  if (d > GIRO_SAC_UMB && GIRO._sacFrio <= 0){
    GIRO._sacFrio = GIRO_SAC_FRIO;
    giroSacudida(Math.min(1, (d - GIRO_SAC_UMB)/34 + 0.35));
  }
}
/* quien quiera enterarse se cuelga de acá: el juego pone `GIRO.alSacudir` */
function giroSacudida(k){
  GIRO.sac = Math.max(GIRO.sac, k);
  GIRO.sacN++;
  if (GIRO.alSacudir) GIRO.alSacudir(k);
}

function giroPaso(dt){
  if (GIRO._sacFrio > 0) GIRO._sacFrio = Math.max(0, GIRO._sacFrio - dt);
  if (GIRO.sac > 0) GIRO.sac = Math.max(0, GIRO.sac - dt*3.2);
  /* el recentrado va DESPACIO y solo cuando el juego lo pide: rapido, el mundo
     se endereza solo mientras uno lo esta inclinando y no se puede jugar */
  if (GIRO.recentra > 0 && GIRO.hayCero){
    const k = Math.min(1, dt/GIRO.recentra);
    GIRO.cero.b += giroDelta(GIRO.crudo.b, GIRO.cero.b)*k;
    GIRO.cero.g += giroDelta(GIRO.crudo.g, GIRO.cero.g)*k;
    giroCalcula();
  }
}

/* ── SE PIDE DENTRO DE UN GESTO, Y DEVUELVE SI QUEDO ANDANDO ──
   Y no bloquea: si el permiso se niega o el aparato no tiene sensor, el juego
   tiene que seguir siendo jugable con el dedo. Cada juego trae su respaldo. */
async function giroPide(){
  if (GIRO.estado === 'lista' || GIRO.estado === 'pidiendo') return GIRO.on;
  GIRO.estado = 'pidiendo';
  /* sin HTTPS los sensores no existen en varios navegadores, y ahi no hay
     permiso que negar: ni preguntan. Es la causa mas facil de confundir con un
     error del juego. */
  if (!window.isSecureContext && location.protocol !== 'file:'){
    GIRO.estado = 'insegura'; return false;
  }
  if (typeof DeviceOrientationEvent === 'undefined'){ GIRO.estado = 'sin'; return false; }
  const DOE = DeviceOrientationEvent, DME = window.DeviceMotionEvent;
  try {
    if (DOE && typeof DOE.requestPermission === 'function'){
      const r = await DOE.requestPermission();
      if (r !== 'granted'){ GIRO.estado = 'negado'; return false; }
    }
    if (DME && typeof DME.requestPermission === 'function'){
      try { await DME.requestPermission(); } catch(e){}
    }
  } catch(e){ GIRO.estado = 'negado'; return false; }
  addEventListener('deviceorientation', giroEvento, { passive: true });
  addEventListener('devicemotion', giroMocion, { passive: true });
  GIRO.estado = 'lista';
  /* ── Y SE COMPRUEBA QUE LLEGUE ALGO ──
     En una notebook `deviceorientation` se registra sin error y NUNCA dispara:
     el estado diria «lista» con el sensor muerto, y el juego esperaria para
     siempre una inclinacion que no va a llegar. A los 1,2 s, si no llego ni un
     evento, se declara sin sensor y entra el respaldo. */
  setTimeout(() => { if (GIRO.n === 0 && GIRO.estado === 'lista') GIRO.estado = 'sin'; }, 1200);
  return true;
}

function giroVer(){
  return { estado: GIRO.estado, on: GIRO.on, n: GIRO.n,
           x: +GIRO.x.toFixed(3), y: +GIRO.y.toFixed(3),
           crudo: [Math.round(GIRO.crudo.b), Math.round(GIRO.crudo.g)],
           cero: [Math.round(GIRO.cero.b), Math.round(GIRO.cero.g)],
           sac: +GIRO.sac.toFixed(2), sacN: GIRO.sacN,
           sacPico: +GIRO.sacPico.toFixed(1),
           rango: GIRO.rango, recentra: GIRO.recentra };
}
/* ══════════════════════ LA MANO POR LA CAMARA ══════════════════════
   MediaPipe lee la mano y de los veintiun puntos sale UNA cosa: que gesto es.
   No se dibuja la mano en 3D ni se apunta con ella —eso ya lo hacen RECREO y
   RezUno—: acá lo unico que hace falta es piedra, papel o tijera, o sea un
   simbolo, y un simbolo es mucho mas barato y mucho mas robusto que una
   posicion.

   ── TODO LO QUE SIGUE SALE DE DOS JUEGOS QUE YA COSTARON SUS VUELTAS ──
   1. LA CAMARA SE PIDE CON `exact` Y NO COMO PREFERENCIA. `facingMode:'user'` a
      secas es un DESEO: el navegador abre la que quiera. Con `exact`, si la
      peticion vuelve ES esa camara; si no hay, tira y se prueba la otra.
   2. LA ENTRADA VA A 640x480 Y NO A 256x192. Medido en RezUno: diez veces mas
      pixeles NO cuestan mas —MediaPipe redimensiona adentro al tamano de sus
      modelos— y bajarla es regalar deteccion a cambio de nada.
   3. LOS UMBRALES VAN BAJOS (0,4 / 0,4 / 0,3). Soltar una mano ya encontrada no
      cuesta un cuadro: la medicion siguiente tiene que volver a correr el
      buscador de palma, que es la parte cara. Dudar sale mas caro que seguir.
   4. LA MEDICION CUELGA DEL CUADRO DE CAMARA y no del de render: con
      `requestVideoFrameCallback` corre una vez por cuadro de camara, que es lo
      unico que puede traer datos nuevos.
   5. GPU PRIMERO Y CPU DE RESPALDO: en telefonos viejos el delegado de GPU tira
      al crear la tarea, y un detector a 15 por segundo en CPU sigue siendo
      jugable.
   6. DOS CDN: el detector es una descarga de un tercero, y si ese tercero no
      contesta el juego se queda sin manos y el jugador no puede hacer nada.
   7. EL GESTO NO SE TOMA, SE SOSTIENE. Un gesto mal leido en un juego donde el
      gesto es la jugada es una derrota que el jugador no entiende: cada lectura
      tiene que ganar tres cuadros seguidos para valer. */

const MANO_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MANO_CDN = [
  { js: MANO_URL, wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm' }];
const MANO_MODELO = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const MANO_ENT_W = 640, MANO_ENT_H = 480;

const MANO = {
  estado: 'no',      /* no · pidiendo · lista · permiso · camara · cdn · modelo · insegura */
  det: null, vid: null, usa: '', espejo: true, delegado: '',
  pts: null,         /* los 21 puntos crudos, para dibujar */
  dedos: -1,         /* cuantos estirados, crudo */
  gesto: null,       /* 'piedra' · 'papel' · 'tijera' · null, ya votado */
  gestoCrudo: null,
  n: 0, hz: 0,
  _votos: [], _ultT: 0, _huecos: 0
};
/* ── LA CAMARA FRONTAL, Y ACA SI ES LA CORRECTA ──
   Al reves de RECREO y RezUno, donde se mete la mano POR DETRAS del telefono
   para que entre en la escena. Piedra papel o tijera se juega mostrando la mano
   DE FRENTE, como se juega de verdad, y el jugador tiene que poder verse: con la
   trasera habria que apuntar el telefono para el otro lado y jugar a ciegas. */
const MANO_PREF = 'user';

function manoFallo(q){ MANO.estado = q; if (window.pintaMano) window.pintaMano(); }

async function manoPide(){
  if (MANO.estado === 'lista' || MANO.estado === 'pidiendo') return MANO.estado === 'lista';
  MANO.estado = 'pidiendo';
  if (window.pintaMano) window.pintaMano();
  /* sin HTTPS `navigator.mediaDevices` NO EXISTE, asi que no hay permiso que
     negar: el navegador ni pregunta */
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ manoFallo('insegura'); return false; }
  const pedir = (v) => navigator.mediaDevices.getUserMedia({
    video: Object.assign({ width: { ideal: MANO_ENT_W }, height: { ideal: MANO_ENT_H },
                           frameRate: { ideal: 60 } }, v), audio: false });
  let flujo = null, cierto = '';
  const otra = MANO_PREF === 'user' ? 'environment' : 'user';
  try { flujo = await pedir({ facingMode: { exact: MANO_PREF } }); cierto = MANO_PREF; }
  catch(e){
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){ manoFallo('permiso'); return false; }
    try { flujo = await pedir({ facingMode: { exact: otra } }); cierto = otra; }
    catch(e2){
      if (e2 && (e2.name === 'NotAllowedError' || e2.name === 'SecurityError')){ manoFallo('permiso'); return false; }
      try { flujo = await pedir({}); }
      catch(e3){ manoFallo((e3 && (e3.name === 'NotFoundError' || e3.name === 'OverconstrainedError')) ? 'camara' : 'permiso'); return false; }
    }
  }
  const v = $('camVid');
  v.srcObject = flujo; MANO.vid = v;
  try { await v.play(); } catch(e){}
  try {
    const tr = flujo.getVideoTracks()[0];
    const s = tr.getSettings ? tr.getSettings() : {};
    /* ── EL ESPEJO SE LEE DEL TRACK Y LA REGLA ES ASIMETRICA ──
       Una camara que NO dice para donde mira no es la trasera: un telefono
       informa su `facingMode` y una webcam callada es de las que apuntan a la
       cara. Medido en el banco, `getSettings()` de una camara de notebook no
       trae la clave, y suponer «trasera» dejaba la imagen sin espejo. */
    MANO.usa = cierto || s.facingMode || 'user';
    MANO.espejo = (MANO.usa !== 'environment');
  } catch(e){ MANO.usa = cierto || 'user'; MANO.espejo = true; }

  let vision = null;
  for (const cdn of MANO_CDN){
    try { vision = await import(/* @vite-ignore */ cdn.js); MANO.cdn = cdn; break; } catch(e){}
  }
  if (!vision){ manoFallo('cdn'); return false; }
  try {
    const fs = await vision.FilesetResolver.forVisionTasks(MANO.cdn.wasm);
    for (const del of ['GPU','CPU']){
      try {
        MANO.det = await vision.HandLandmarker.createFromOptions(fs, {
          baseOptions: { modelAssetPath: MANO_MODELO, delegate: del },
          runningMode: 'VIDEO', numHands: 1,
          minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4,
          minTrackingConfidence: 0.3 });
        MANO.delegado = del; break;
      } catch(e){}
    }
  } catch(e){}
  if (!MANO.det){ manoFallo('modelo'); return false; }
  MANO.estado = 'lista';
  if (window.pintaMano) window.pintaMano();
  manoLazo();
  return true;
}

/* la medicion cuelga del cuadro de CAMARA: es lo unico que puede traer datos
   nuevos, y colgada del render se mide dos veces el mismo cuadro */
function manoLazo(){
  const v = MANO.vid;
  if (!v || !MANO.det) return;
  const paso = () => {
    if (!MANO.det) return;
    try {
      const t = performance.now();
      const r = MANO.det.detectForVideo(v, t);
      manoLee(r && r.landmarks && r.landmarks[0] ? r.landmarks[0] : null);
      if (MANO._ultT) MANO.hz = Math.round(1000/Math.max(1, t - MANO._ultT));
      MANO._ultT = t;
      MANO.n++;
    } catch(e){}
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
    else setTimeout(paso, 40);
  };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paso);
  else setTimeout(paso, 40);
}

/* ══════════ DE VEINTIUN PUNTOS A UN SIMBOLO ══════════
   ── TODO SE MIDE EN PROPORCION AL TAMANO DE LA PALMA ──
   La mano puede estar a veinte centimetros o a un metro de la camara, asi que
   ninguna distancia en pixeles sirve. La palma —muñeca al nudillo del medio— es
   invariante a la distancia Y al tamano de la mano de quien juega. Es la misma
   regla que en RECREO.

   ── Y EL PULGAR NO SE MIDE COMO LOS DEMAS ──
   Los otros cuatro se estiran ALEJANDO la punta de la muñeca. El pulgar se abre
   hacia el COSTADO, y su punta puede quedar a la misma distancia de la muñeca
   abierto o cerrado: se mide contra el nudillo del MENIQUE, del que se aleja al
   abrirse y al que le cruza por delante al cerrarse. Sin esa distincion, «cinco
   dedos» no existe. */
const M_TIP = [4, 8, 12, 16, 20], M_PIP = [3, 6, 10, 14, 18];
function manoLee(pts){
  MANO.pts = pts;
  if (!pts){
    MANO.dedos = -1; MANO.gestoCrudo = null;
    MANO._huecos++;
    /* ── LA CADUCIDAD SE MIDE EN HUECOS Y NO EN MILISEGUNDOS ──
       280 ms fijos son once mediciones a 40 Hz y tres y media a 12: en un
       aparato lento, dos fallos seguidos borraban el gesto. */
    if (MANO._huecos > 5){ MANO.gesto = null; MANO._votos.length = 0; }
    return;
  }
  MANO._huecos = 0;
  const d = (a, b) => Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y);
  const palma = Math.max(0.0001, d(0, 9));
  const est = [];
  /* el pulgar: abierto se aleja del nudillo del meñique */
  est.push(d(4, 17)/palma > 0.92);
  for (let i = 1; i < 5; i++){
    /* la punta mas lejos de la muñeca que la falange de en medio */
    est.push(d(M_TIP[i], 0) > d(M_PIP[i], 0)*1.14);
  }
  const n = est.filter(Boolean).length;
  MANO.dedos = n;
  let g = null;
  if (n <= 1) g = 'piedra';
  else if (n >= 4) g = 'papel';
  else if (n === 2 && est[1] && est[2]) g = 'tijera';
  /* dos dedos que NO son el indice y el medio no son tijera: es una mano a
     medio cerrar, y tomarla por tijera es perder una ronda por una lectura */
  MANO.gestoCrudo = g;
  MANO._votos.push(g);
  if (MANO._votos.length > 3) MANO._votos.shift();
  if (MANO._votos.length === 3 && MANO._votos[0] === MANO._votos[1] &&
      MANO._votos[1] === MANO._votos[2]) MANO.gesto = MANO._votos[0];
}

function manoVer(){
  return { estado: MANO.estado, usa: MANO.usa, espejo: MANO.espejo,
           delegado: MANO.delegado, n: MANO.n, hz: MANO.hz,
           dedos: MANO.dedos, gesto: MANO.gesto, crudo: MANO.gestoCrudo,
           pts: MANO.pts ? MANO.pts.length : 0, huecos: MANO._huecos };
}
/* la sonda: una mano de mentira con los dedos que se pidan, para poder probar
   el camino entero sin una camara */
function manoFalsa(dedos, tijera){
  const p = [];
  for (let i = 0; i < 21; i++) p.push({ x: 0.5, y: 0.5, z: 0 });
  p[0] = { x: 0.5, y: 0.9, z: 0 };      /* muñeca */
  p[9] = { x: 0.5, y: 0.62, z: 0 };     /* nudillo del medio: la palma mide 0,28 */
  p[17] = { x: 0.40, y: 0.68, z: 0 };   /* nudillo del meñique */
  const abierto = [];
  if (tijera){ abierto.push(1, 2); }
  else if (dedos >= 4){ abierto.push(0, 1, 2, 3, 4); }
  else for (let i = 1; i <= dedos; i++) abierto.push(i);
  for (let i = 0; i < 5; i++){
    const ab = abierto.indexOf(i) >= 0;
    const bx = 0.34 + i*0.08;
    if (i === 0){
      /* el pulgar: abierto se va al costado y lejos del meñique */
      p[3] = { x: ab ? 0.72 : 0.50, y: 0.74, z: 0 };
      p[4] = { x: ab ? 0.82 : 0.46, y: 0.70, z: 0 };
    } else {
      p[M_PIP[i]] = { x: bx, y: 0.56, z: 0 };
      p[M_TIP[i]] = { x: bx, y: ab ? 0.30 : 0.66, z: 0 };
    }
  }
  manoLee(p);
  return manoVer();

/* ══════════════════════════════ CANICA ══════════════════════════════
   Se inclina el teléfono y una canica rueda por un laberinto. Hay que juntar
   las tres chispas del piso y salir por la baldosa clara antes de que se acabe
   el reloj, esquivando los pozos. Al salir se elige una de tres mejoras y se
   baja al piso siguiente. Roguelike: la corrida se termina cuando se acaban las
   vidas, y lo que se lleva de una corrida a otra es lo que se aprendió.

   ── POR QUÉ EL GIROSCOPIO Y NO EL DEDO ──
   Un laberinto con joystick ya existe y se juega igual con el pulgar. Lo que
   hace que éste sea otro juego es que el jugador tiene que MOVER EL APARATO, y
   entonces la torpeza es física: inclinar de más y pasarse de largo es un error
   del cuerpo y no del dedo. Y el respaldo táctil existe igual —una notebook no
   tiene sensor— pero se siente distinto a propósito y eso está bien.

   ── LAS CUATRO COSAS QUE HACEN QUE UN PISO SEA JUGABLE, Y LAS CUATRO SE
      COMPRUEBAN EN VEZ DE ESPERARSE ──
   1. LA SALIDA ES LA CELDA MÁS LEJANA EN PASOS desde la entrada, por BFS. En la
      esquina no: en un laberinto con atajos la esquina puede quedar a tres
      celdas y el piso se termina antes de empezar.
   2. LOS POZOS NO PUEDEN CAER EN EL CAMINO CORTO. Un pozo en el único paso hacia
      la salida convierte el piso en una moneda al aire, y eso no se ve como
      dificultad: se ve como que el juego está roto.
   3. LAS CHISPAS TIENEN QUE ESTAR REPARTIDAS. Tres chispas en el mismo rincón
      son una sola chispa que vale el triple, y el piso pasa a ser un pasillo.
      Van en tercios distintos del laberinto por distancia a la entrada.
   4. Y EL RELOJ SALE DEL LARGO DEL CAMINO, NO DE UN NÚMERO A MANO. Un piso de
      5x7 y uno de 9x13 no pueden tener el mismo reloj: se mide el recorrido
      real —entrada, las tres chispas en el mejor orden, la salida— y se paga
      con margen. Eso es lo único que hace que la dificultad crezca de verdad y
      no por accidente.

   Todo eso lo comprueba `audita()`, que genera los cien pisos y lo verifica uno
   por uno; y `juegaSolo()` los JUEGA, que es lo único que prueba que además de
   existir el camino se puede recorrer con esta física. */

const K_PISOS = 100;
const K_DX = [0, 1, 0, -1], K_DY = [-1, 0, 1, 0];

/* ── LA FÍSICA, Y LOS TRES NÚMEROS SALEN DE UNA CUENTA ──
   La celda mide `KG.s` en pantalla y la canica un tercio de eso. Cruzar una
   celda con la inclinación al tope tiene que llevar más o menos un tercio de
   segundo: más rápido no se puede frenar en una esquina, más lento el laberinto
   se hace largo. Con `a` la aceleración y `r` el roce, la velocidad de régimen
   es `a/r`, así que se elige la velocidad y sale la aceleración. */
const K_VMAX = 3.2;            /* celdas por segundo con el aparato al tope */
const K_ROCE = 6.4;            /* 1/s: en medio segundo pierde el 96 % */
const K_ACEL = K_VMAX*K_ROCE;  /* la que da esa velocidad de régimen */
const K_REBOTE = 0.30;         /* una canica en un laberinto de madera casi no rebota */

let K_W = 5, K_H = 7;
let K_mur = [];                /* mascara de paredes por celda, bits N E S O */
let K_pozo = [];               /* booleano por celda */
let K_ent = 0, K_sal = 0;      /* indices de celda */
let K_chis = [];               /* [{i, tomada}] */
let K_azar = 7;
const kIx = (x, y) => y*K_W + x;
function kAz(){ K_azar = (K_azar*1664525 + 1013904223) >>> 0; return K_azar / 4294967296; }

/* el estado de la canica, en unidades de CELDA y no de pixel: asi la fisica no
   cambia cuando cambia el tamaño de la pantalla */
const CAN = { x: 0.5, y: 0.5, vx: 0, vy: 0, r: 0.30 };
let K_piso = 1, K_vidas = 3, K_reloj = 0, K_relojT = 0;
let K_esc = 0;                 /* escudos: se comen una caida */
let K_muerto = 0;              /* el parpadeo despues de caer */
let K_fase = 'juega';          /* juega · elige · cae */
let K_oferta = [];
let K_mej = {};                /* las mejoras tomadas: clave -> cuantas */
let K_puntos = 0;
let K_marca = 0;               /* la marca del pozo pisado, cosmetica */
let K_aviso = '', K_avisoT = 0;/* por que se fallo: se dice, no se adivina */

/* ══════════ LAS MEJORAS ══════════
   Doce, todas con TOPE. Es la lección que DADOS ya costó: sin tope, el bot
   llegó a la ronda 419 con un puntaje de 1,4e16 porque una mejora multiplicativa
   sin techo convierte el roguelike en una cuenta que se va al infinito.
   Y NINGUNA es «más puntos»: todas cambian cómo se juega el piso siguiente. */
const K_MEJ = [
  { k: 'vida',   tope: 3 },    /* una vida más */
  { k: 'freno',  tope: 4 },    /* más roce: se controla mejor y se va menos de largo */
  { k: 'reloj',  tope: 4 },    /* +8 s por piso */
  { k: 'iman',   tope: 3 },    /* las chispas se agarran de más lejos */
  { k: 'escudo', tope: 2 },    /* se come una caída */
  { k: 'pozo',   tope: 3 },    /* los pozos son más chicos */
  { k: 'chica',  tope: 3 },    /* la canica es más chica: pasa más ajustado */
  { k: 'brujula',tope: 1 },    /* la salida se marca desde el primer cuadro */
  { k: 'lenta',  tope: 3 },    /* menos aceleración: más lenta y más precisa */
  { k: 'chispa', tope: 2 },    /* una chispa menos por piso */
  { k: 'rebote', tope: 2 },    /* menos rebote contra la pared */
  { k: 'salto',  tope: 1 },    /* la primera caída de cada piso es gratis */
];
const kM = (k) => K_mej[k] || 0;

/* ── LO QUE CADA MEJORA CAMBIA, EN UN SOLO SITIO ──
   Repartidas por el código, la tercera que se agregue va a quedar sin efecto en
   algún cálculo y nadie se va a enterar hasta jugarla. */
const kRoce   = () => K_ROCE*(1 + kM('freno')*0.22);
const kAcel   = () => K_ACEL*(1 - kM('lenta')*0.11);
const kRadio  = () => 0.30*(1 - kM('chica')*0.10);
const kIman   = () => 0.34 + kM('iman')*0.16;
const kPozoR  = () => 0.30*(1 - kM('pozo')*0.14);
const kRebote = () => K_REBOTE*(1 - kM('rebote')*0.35);
const kNChis  = () => Math.max(1, 3 - kM('chispa'));

/* ══════════ EL LABERINTO ══════════ */
function kConf(n){
  /* crece de 5x7 a 9x13, y los pozos con él. Los dos topes están en el mismo
     sitio a propósito: con el laberinto creciendo y los pozos no, el piso 90
     sería más fácil que el 40. */
  const w = Math.min(9, 5 + Math.floor((n - 1)/14));
  const h = Math.min(13, 7 + Math.floor((n - 1)/9));
  return { w, h,
           pozos: Math.min(12, Math.floor((n - 1)/4)),
           atajos: 0.06 + Math.min(0.10, (n - 1)*0.0011) };
}

function kCava(w, h, atajos){
  const m = new Array(w*h).fill(15);   /* todas las paredes puestas */
  const vis = new Array(w*h).fill(false);
  const pila = [0];
  vis[0] = true;
  while (pila.length){
    const i = pila[pila.length - 1];
    const x = i % w, y = (i / w) | 0;
    const op = [];
    for (let d = 0; d < 4; d++){
      const nx = x + K_DX[d], ny = y + K_DY[d];
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      if (!vis[ny*w + nx]) op.push(d);
    }
    if (!op.length){ pila.pop(); continue; }
    const d = op[(kAz()*op.length) | 0];
    const j = (y + K_DY[d])*w + (x + K_DX[d]);
    m[i] &= ~(1 << d);
    m[j] &= ~(1 << ((d + 2) % 4));
    vis[j] = true;
    pila.push(j);
  }
  /* ── LOS ATAJOS NO SON DECORACIÓN ──
     Un laberinto perfecto es un ÁRBOL: cada error obliga a desandar el ramal
     entero, y con una canica que se va de largo en cada esquina eso no es
     dificultad, es castigo. Con bucles hay más de un camino. */
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    for (const d of [1, 2]){
      const nx = x + K_DX[d], ny = y + K_DY[d];
      if (nx >= w || ny >= h) continue;
      if (kAz() < atajos){
        m[y*w + x] &= ~(1 << d);
        m[ny*w + nx] &= ~(1 << ((d + 2) % 4));
      }
    }
  }
  return m;
}

/* distancias en pasos desde `s`, y de quién viene cada celda */
function kBFS(m, w, h, s){
  const d = new Array(w*h).fill(-1), pa = new Array(w*h).fill(-1);
  d[s] = 0;
  const q = [s];
  for (let k = 0; k < q.length; k++){
    const i = q[k], x = i % w, y = (i / w) | 0;
    for (let dir = 0; dir < 4; dir++){
      if (m[i] & (1 << dir)) continue;
      const nx = x + K_DX[dir], ny = y + K_DY[dir];
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = ny*w + nx;
      if (d[j] >= 0) continue;
      d[j] = d[i] + 1; pa[j] = i; q.push(j);
    }
  }
  return { d, pa };
}
function kCamino(pa, a, b){
  const r = [];
  for (let i = b; i >= 0; i = pa[i]){ r.push(i); if (i === a) break; }
  return r.reverse();
}

function kGenera(n){
  K_azar = (n*2654435761) >>> 0;
  for (let i = 0; i < 6; i++) kAz();
  const c = kConf(n);
  const w = c.w, h = c.h;
  const m = kCava(w, h, c.atajos);
  const ent = 0;
  const { d, pa } = kBFS(m, w, h, ent);
  /* la salida es la celda más lejana EN PASOS */
  let sal = 0;
  for (let i = 0; i < w*h; i++) if (d[i] > d[sal]) sal = i;

  /* ── LAS CHISPAS, UNA POR TERCIO DE PROFUNDIDAD ──
     Y ninguna en la entrada ni en la salida: una chispa encima de la salida no
     obliga a desviarse, que es lo único que las chispas existen para hacer. */
  const nch = kNChis();
  const orden = [];
  for (let i = 0; i < w*h; i++) if (i !== ent && i !== sal && d[i] > 0) orden.push(i);
  orden.sort((a, b) => d[a] - d[b]);
  const chis = [];
  for (let t = 0; t < nch && orden.length; t++){
    const lo = Math.floor(orden.length*(t + 0.15)/nch);
    const hi = Math.max(lo + 1, Math.floor(orden.length*(t + 1)/nch));
    let pick = -1;
    for (let intento = 0; intento < 24; intento++){
      const cand = orden[lo + ((kAz()*(hi - lo)) | 0)];
      if (cand != null && chis.indexOf(cand) < 0){ pick = cand; break; }
    }
    if (pick >= 0) chis.push(pick);
  }

  /* ── LOS POZOS, FUERA DEL CAMINO CORTO ──
     El camino protegido no es sólo entrada→salida: es el recorrido completo que
     el piso OBLIGA a hacer, o sea pasando por las tres chispas. Protegiendo
     sólo la recta a la salida, un pozo puede quedar en el único acceso a una
     chispa — y entonces el piso pide una chispa que no se puede juntar. */
  const prot = new Set();
  let cur = ent;
  const parada = chis.slice().concat([sal]);
  for (const p of parada){
    const b = kBFS(m, w, h, cur);
    for (const i of kCamino(b.pa, cur, p)) prot.add(i);
    cur = p;
  }
  prot.add(ent);
  const pozo = new Array(w*h).fill(false);
  const libres = [];
  for (let i = 0; i < w*h; i++) if (!prot.has(i)) libres.push(i);
  for (let k = libres.length - 1; k > 0; k--){
    const j = (kAz()*(k + 1)) | 0;
    const t = libres[k]; libres[k] = libres[j]; libres[j] = t;
  }
  for (let k = 0; k < Math.min(c.pozos, libres.length); k++) pozo[libres[k]] = true;

  /* ── EL RELOJ SALE DEL RECORRIDO MEDIDO ──
     `pasos` es el largo real del camino obligado. A `K_VMAX` celdas por segundo
     en línea recta eso serían `pasos/K_VMAX` segundos: se paga 2,6 veces, que es
     lo que cuesta frenar en cada esquina y equivocarse alguna vez. */
  let pasos = 0;
  cur = ent;
  for (const p of parada){
    const b = kBFS(m, w, h, cur);
    pasos += b.d[p];
    cur = p;
  }
  /* ── Y EL MARGEN SE APRIETA CON EL PISO ──
     Con un factor constante, el reloj crece exactamente igual que el laberinto y
     el piso 100 se siente igual que el 10 — medido, margen 2,6 en los cien. Lo
     único que crecía era el tamaño, y un laberinto más grande con el mismo
     margen relativo no es más difícil, sólo es más largo. Baja de 2,6 a 1,7 a lo
     largo de la corrida: 2,6 es un piso en el que se puede dudar y 1,7 uno que
     hay que recorrer casi sin frenar. Y ahí sí la corrida tiene un techo, que es
     lo que un roguelike necesita para que llegar lejos signifique algo. */
  const marg = 2.6 - Math.min(0.9, (n - 1)*0.012);
  const reloj = Math.round(pasos/K_VMAX*marg) + 8 + kM('reloj')*8;
  return { w, h, m, ent, sal, chis, pozo, pasos, reloj };
}

/* ══════════ EL AMBIENTE ══════════
   El laberinto es de madera vieja bajo una luz de taller. El polvo que cae
   despacio en el haz es lo único que se mueve además de la canica — y tiene que
   ser LENTO: en un juego cuya dificultad es no pasarse de largo, algo rápido
   cruzando el cuadro engancha el ojo justo en la esquina. */
const AMB = {
  foto: 'f_canica',
  cielo: ['#241a12', '#100b08'],
  haz: 0.13,
  vineta: 0.46,
  granoK: 0.014,
  part: { n: 18, dir: 'cae', forma: 'disco', col: '#ffdca8',
          r0: 1.2, r1: 3.0, v0: 6, v1: 20, amp: 38, gira: 0,
          a0: 0.08, a1: 0.22 }

/* ══════════ GEOMETRIA ══════════ */
let KG = { s: 60, x0: 0, y0: 0 };
function kGeo(){
  const dispW = AN - 44, dispH = AL - 300 - 210;
  KG.s = Math.floor(Math.min(dispW/K_W, dispH/K_H));
  KG.x0 = (AN - KG.s*K_W)/2;
  KG.y0 = 300 + (dispH - KG.s*K_H)/2;
}
const kPX = (cx) => KG.x0 + cx*KG.s;
const kPY = (cy) => KG.y0 + cy*KG.s;

/* ══════════ LA INCLINACION ══════════
   Sale del sensor si lo hay y del dedo si no. UN SOLO SITIO lo decide: con dos,
   el respaldo se desincroniza el dia que se toque la fisica, y el respaldo es
   justo lo que nadie prueba. */
let K_dedo = { on: false, x: 0, y: 0 };
let K_forz = null;             /* la sonda escribe acá */
function kIncl(){
  if (K_forz) return K_forz;
  if (GIRO.estado === 'lista' && GIRO.on) return { x: GIRO.x, y: GIRO.y };
  return { x: K_dedo.x, y: K_dedo.y };
}

const JUEGO = {
  id: 'canica',
  tipo: 'puntos',
  usa: ['giro'],
  vivo: true, gano: false,
  get marca(){ return K_puntos; },
  get sub(){ return TX('pisoC') + ' ' + K_piso; },
  get ficI(){ return '♥ '.repeat(Math.max(0, K_vidas)).trim() || '—'; },
  get ficD(){ return TX('chisC') + ' ' + K_chis.filter(c => c.t).length + '/' + K_chis.length; },
  get resta(){ return K_reloj > 0 ? Math.max(0, Math.min(1, K_relojT/K_reloj)) : 0; },

  planos: [
    { dur: 3.0, pie: 'c1', dibuja(g, u){ kDemo(g, u, 0); } },
    { dur: 3.2, pie: 'c2', dibuja(g, u){ kDemo(g, u, 1); } },
    { dur: 3.2, pie: 'c3', dibuja(g, u){ kDemo(g, u, 2); } }
  ],

  arranca(){
    K_piso = 1; K_puntos = 0; K_vidas = 3; K_esc = 0;
    K_mej = {};
    this.vivo = true; this.gano = false;
    this.pisoNuevo();
  },

  pisoNuevo(){
    const G = kGenera(K_piso);
    K_W = G.w; K_H = G.h; K_mur = G.m; K_pozo = G.pozo;
    K_ent = G.ent; K_sal = G.sal;
    K_chis = G.chis.map(i => ({ i, t: false }));
    K_reloj = G.reloj; K_relojT = G.reloj;
    K_vidas = Math.max(K_vidas, 0) + (K_piso === 1 ? kM('vida') : 0);
    K_esc = Math.max(K_esc, kM('escudo'));
    K_fase = 'juega'; K_muerto = 0; K_marca = 0;
    this.alPrincipio();
    kGeo();
  },
  alPrincipio(){
    CAN.x = (K_ent % K_W) + 0.5; CAN.y = ((K_ent/K_W)|0) + 0.5;
    CAN.vx = 0; CAN.vy = 0;
    CAN.r = kRadio();
  },

  paso(dt){
    kGeo();
    if (K_avisoT > 0) K_avisoT = Math.max(0, K_avisoT - dt);
    if (K_muerto > 0){ K_muerto = Math.max(0, K_muerto - dt); return; }
    if (K_fase !== 'juega') return;

    K_relojT -= dt;
    if (K_relojT <= 0){ this.castiga('tarde'); return; }

    const inc = kIncl();
    CAN.vx += inc.x*kAcel()*dt;
    CAN.vy += inc.y*kAcel()*dt;
    const r = kRoce();
    CAN.vx -= CAN.vx*Math.min(1, r*dt);
    CAN.vy -= CAN.vy*Math.min(1, r*dt);

    /* ── EL CHOQUE VA EJE POR EJE, Y ESO ES LO QUE HACE QUE SE DESLICE ──
       Resolviendo los dos a la vez, la canica se clava en cada esquina y el
       laberinto se vuelve intransitable. Es la misma corrección que en Eco. */
    kMueve(CAN.vx*dt, 0, 'x');
    kMueve(0, CAN.vy*dt, 'y');

    /* las chispas: por distancia, y el radio lo pone el imán */
    const ri = kIman() + CAN.r;
    for (const c of K_chis){
      if (c.t) continue;
      const cx = (c.i % K_W) + 0.5, cy = ((c.i/K_W)|0) + 0.5;
      if (Math.hypot(CAN.x - cx, CAN.y - cy) < ri){
        c.t = true;
        son('bien', 0.8);
        /* ── EL CONTADOR SE ACTUALIZA CON LO QUE `sumaPuntos` DEVUELVE ──
           Medido con el auto-jugador: llegaba al piso 31 con `puntos: 0`, porque
           `sumaPuntos` escribe el `PUNTOS` del núcleo y `marca` leía mi propia
           variable, que nadie tocaba. Y no se puede leer `PUNTOS` directo: lo
           que devuelve `sumaPuntos` es el valor YA MULTIPLICADO por la racha, o
           sea que juntar tres chispas seguidas tiene que pagar más — y ése es el
           único incentivo que hay para no quedarse pensando. */
        K_puntos += sumaPuntos(20, kPX(cx), kPY(cy));
        chispas(kPX(cx), kPY(cy), 14, '#ffd76a', 150);
        destella('#ffd76a', 0.35);
      }
    }

    /* el pozo: se cae si el CENTRO entra en él. Con el borde, una canica que
       roza el labio se cae, y eso no se ve venir. */
    const ci = kIx(Math.floor(CAN.x), Math.floor(CAN.y));
    if (K_pozo[ci]){
      const px = (ci % K_W) + 0.5, py = ((ci/K_W)|0) + 0.5;
      if (Math.hypot(CAN.x - px, CAN.y - py) < kPozoR()) this.cae(ci);
      return;
    }

    /* la salida: sólo con todas las chispas */
    if (ci === K_sal && K_chis.every(c => c.t)) this.sale();
  },

  cae(i){
    K_marca = i;
    chispas(kPX((i % K_W) + 0.5), kPY(((i/K_W)|0) + 0.5), 18, '#2b2016', 130);
    this.castiga('cayo');
  },

  /* ── LAS DOS FORMAS DE FALLAR PASAN POR EL MISMO SITIO ──
     Y eso arregló un defecto que sólo se vio midiendo: quedarse sin tiempo
     llamaba a `pierde()` directo, o sea que terminaba la CORRIDA ENTERA con las
     tres vidas intactas — el bot al azar moría en el piso 1 con `caidas: 0` y
     `vidas: 3`, que es la firma exacta de un camino de derrota que no pasa por
     las vidas. En un roguelike de pisos el reloj tiene que ser una presión y no
     una guillotina: cuesta una vida y se reintenta el piso. */
  castiga(motivo){
    K_aviso = motivo; K_avisoT = 1.5;
    son('pierde', 0.8);
    sacude(0.5);
    /* ── EL ESCUDO Y LA PRIMERA GRATIS SE COMEN EL CASTIGO, Y NO SON LO MISMO ──
       El escudo se GASTA y hay que volver a comprarlo; «la primera gratis» se
       repone en cada piso. Con las dos iguales, una de las dos cartas no
       significaría nada. */
    if (K_esc > 0){ K_esc--; this.reintenta(0.7); return; }
    if (kM('salto') && !this._gratis){ this._gratis = true; this.reintenta(0.7); return; }
    K_vidas--;
    if (K_vidas <= 0){ this.pierde(); return; }
    this.reintenta(0.9);
  },
  reintenta(esp){
    this.alPrincipio();
    /* el reloj vuelve entero: reintentar un piso con dos segundos en el reloj no
       es un reintento, es tirar una vida a la basura */
    K_relojT = K_reloj;
    K_muerto = esp;
  },

  sale(){
    K_fase = 'elige';
    son('gana', 0.9);
    destella('#8ad7ff', 1.0);
    sacude(0.28);
    /* el piso paga por lo que sobró de reloj: sin eso, salir rápido y salir con
       un segundo valen lo mismo y el reloj sólo sirve para perder */
    K_puntos += sumaPuntos(60 + K_piso*10 + Math.round(K_relojT*4), AN/2, AL*0.42);
    K_oferta = kSorteaOferta();
    if (!K_oferta.length){ K_piso++; this.pisoNuevo(); }
  },

  pierde(){
    son('pierde');
    this.vivo = false;
  },

  eligeMejora(i){
    const r = K_oferta[i];
    if (!r) return false;
    K_mej[r.k] = (K_mej[r.k] || 0) + 1;
    if (r.k === 'vida') K_vidas++;
    if (r.k === 'escudo') K_esc++;
    K_oferta.length = 0;
    K_piso++;
    this._gratis = false;
    son('clic');
    this.pisoNuevo();
    return true;
  },

  baja(x, y){
    if (MODO !== 'juega') return;
    if (K_fase === 'elige'){
      const i = kCartaEn(x, y);
      if (i >= 0) this.eligeMejora(i);
      return;
    }
    /* ── EL RESPALDO: ARRASTRAR EL DEDO INCLINA ──
       No es un extra. Sin sensor —una notebook, un permiso negado— el juego
       sería imposible de jugar, y eso no es degradar, es romperse. */
    K_dedo.on = true; K_dedo.cx = x; K_dedo.cy = y; K_dedo.x = 0; K_dedo.y = 0;
  },
  mueve(x, y){
    if (!K_dedo.on) return;
    /* 150 unidades de arrastre son el tope, que es más o menos un pulgar */
    K_dedo.x = Math.max(-1, Math.min(1, (x - K_dedo.cx)/150));
    K_dedo.y = Math.max(-1, Math.min(1, (y - K_dedo.cy)/150));
  },
  sube(){ K_dedo.on = false; K_dedo.x = 0; K_dedo.y = 0; },

  fondo(g){ kGeo(); },
  pinta(g){ kPinta(g); },

  /* ══════════ EL AUTO-JUGADOR ══════════
     Va por el mismo camino que el jugador: mira el BFS hasta el próximo objetivo
     y ESCRIBE UNA INCLINACIÓN, o sea que pasa por la misma física, los mismos
     choques y los mismos pozos. Un bot que teletransportara la canica probaría
     que el laberinto tiene camino y nada más — que ya lo dice `audita()`. */
  juegaSolo(n, azar){
    this.arranca();
    let v = 0, pisoMax = 1, caidas = 0, vueltas = 0;
    const dt = 1/60;
    while (v < (n || 12000) && this.vivo){
      v++;
      if (K_fase === 'elige'){
        /* el honesto prefiere lo que le hace falta; el del azar toma cualquiera */
        let i = 0;
        if (!azar){
          const pref = ['freno', 'reloj', 'iman', 'vida', 'escudo', 'lenta'];
          let mejor = 99;
          for (let j = 0; j < K_oferta.length; j++){
            const p = pref.indexOf(K_oferta[j].k);
            if (p >= 0 && p < mejor){ mejor = p; i = j; }
          }
        } else i = (Math.random()*K_oferta.length) | 0;
        this.eligeMejora(i);
        continue;
      }
      K_forz = azar ? { x: Math.random()*2 - 1, y: Math.random()*2 - 1 } : kBotIncl();
      /* ── EL MÁXIMO SE MIDE EN CADA VUELTA Y NO AL ELEGIR ──
         Medido: devolvía `piso: 40` con `pisoMax: 32`. Cuando todas las mejoras
         llegaron a su tope no hay oferta, así que `sale()` avanza el piso sin
         pasar por la fase de elegir — y la métrica se quedaba atrás justo en la
         parte de la corrida que interesa medir. */
      pisoMax = Math.max(pisoMax, K_piso);
      const antes = K_vidas;
      this.paso(dt);
      if (K_vidas < antes) caidas++;
      vueltas++;
    }
    K_forz = null;
    return JSON.stringify({ piso: K_piso, pisoMax, puntos: K_puntos,
                            caidas, vidas: K_vidas, vueltas, vivo: this.vivo });
  },

  /* ══════════ LA AUDITORIA ══════════
     Genera los cien pisos y comprueba las cuatro propiedades. No los juega: eso
     lo hace `juegaSolo`, y son dos preguntas distintas —«existe el camino» y
     «se puede recorrer con esta física»— que hay que poder contestar por
     separado, porque si el bot falla hay que saber cuál de las dos falló. */
  audita(a, b){
    const malos = [], guardaM = K_mej;
    K_mej = {};
    let minReloj = 1e9, maxReloj = 0, minPasos = 1e9, maxPasos = 0;
    for (let n = (a || 1); n <= (b || K_PISOS); n++){
      const G = kGenera(n);
      const { d } = kBFS(G.m, G.w, G.h, G.ent);
      const fall = [];
      if (d.some(x => x < 0)) fall.push('celdas sueltas');
      if (G.sal === G.ent) fall.push('salida en la entrada');
      if (G.chis.length !== kNChis()) fall.push('faltan chispas');
      if (new Set(G.chis).size !== G.chis.length) fall.push('chispas repetidas');
      /* la comprobación que importa: el recorrido obligado no toca un pozo */
      let cur = G.ent;
      for (const p of G.chis.concat([G.sal])){
        const bb = kBFS(G.m, G.w, G.h, cur);
        if (bb.d[p] < 0){ fall.push('inalcanzable'); break; }
        for (const i of kCamino(bb.pa, cur, p)) if (G.pozo[i]) fall.push('pozo en el camino');
        cur = p;
      }
      if (G.pozo[G.ent]) fall.push('pozo en la entrada');
      if (G.pozo[G.sal]) fall.push('pozo en la salida');
      if (fall.length) malos.push([n, fall[0]]);
      minReloj = Math.min(minReloj, G.reloj); maxReloj = Math.max(maxReloj, G.reloj);
      minPasos = Math.min(minPasos, G.pasos); maxPasos = Math.max(maxPasos, G.pasos);
    }
    K_mej = guardaM;
    return JSON.stringify({ pisos: (b || K_PISOS) - (a || 1) + 1,
                            malos: malos.slice(0, 8), nMalos: malos.length,
                            reloj: [minReloj, maxReloj], pasos: [minPasos, maxPasos] });
  },

  ver(){
    return JSON.stringify({
      piso: K_piso, fase: K_fase, vidas: K_vidas, esc: K_esc,
      reloj: +K_relojT.toFixed(1), de: K_reloj,
      chis: K_chis.filter(c => c.t).length + '/' + K_chis.length,
      can: [+CAN.x.toFixed(2), +CAN.y.toFixed(2)],
      vel: +Math.hypot(CAN.vx, CAN.vy).toFixed(2),
      reja: [K_W, K_H], pozos: K_pozo.filter(Boolean).length,
      mej: K_mej, oferta: K_oferta.map(o => o.k),
      giro: GIRO.estado, incl: [+kIncl().x.toFixed(2), +kIncl().y.toFixed(2)],
      puntos: K_puntos, vivo: this.vivo });
  },
  cfg(o){
    if (o.incl) K_forz = { x: o.incl[0], y: o.incl[1] };
    if (o.incl === null) K_forz = null;
    if (o.piso){ K_piso = o.piso; this.pisoNuevo(); }
    return this.ver();
  }
};

/* ── EL CHOQUE ──
   La canica es un círculo y las paredes son los lados de las celdas. Se prueba
   contra la pared del lado hacia el que se mueve, y basta con la celda actual y
   sus vecinas: una canica de radio 0,3 no puede tocar una pared a dos celdas. */
function kMueve(dx, dy, eje){
  let nx = CAN.x + dx, ny = CAN.y + dy;
  const r = CAN.r;
  const cx = Math.floor(CAN.x), cy = Math.floor(CAN.y);
  if (eje === 'x'){
    const i = kIx(Math.max(0, Math.min(K_W-1, cx)), Math.max(0, Math.min(K_H-1, cy)));
    if (dx > 0 && (K_mur[i] & 2) && nx > cx + 1 - r){ nx = cx + 1 - r; CAN.vx = -CAN.vx*kRebote(); kGolpe(); }
    if (dx < 0 && (K_mur[i] & 8) && nx < cx + r){ nx = cx + r; CAN.vx = -CAN.vx*kRebote(); kGolpe(); }
    nx = Math.max(r, Math.min(K_W - r, nx));
  } else {
    const i = kIx(Math.max(0, Math.min(K_W-1, cx)), Math.max(0, Math.min(K_H-1, cy)));
    if (dy > 0 && (K_mur[i] & 4) && ny > cy + 1 - r){ ny = cy + 1 - r; CAN.vy = -CAN.vy*kRebote(); kGolpe(); }
    if (dy < 0 && (K_mur[i] & 1) && ny < cy + r){ ny = cy + r; CAN.vy = -CAN.vy*kRebote(); kGolpe(); }
    ny = Math.max(r, Math.min(K_H - r, ny));
  }
  CAN.x = nx; CAN.y = ny;
}
let _golpeFrio = 0;
function kGolpe(){
  /* el sonido va con freno: sin él, una canica apoyada contra una pared suena
     sesenta veces por segundo, que es ruido blanco y no un golpe. Es
     exactamente el defecto que Maicol ya tuvo con las pisadas. */
  const v = Math.hypot(CAN.vx, CAN.vy);
  if (v < 0.35 || _golpeFrio > 0) return;
  _golpeFrio = 0.09;
  son('caida', Math.min(0.55, v*0.13));
}

/* ── EL BOT: HACIA DÓNDE INCLINAR ──
   Se apunta al CENTRO de la celda siguiente y no al objetivo final: apuntando
   derecho al objetivo, la canica se pega a la pared que hay en el medio y se
   queda ahí. Es la misma lección que en LEMI hizo falta con el camello. */
function kBotIncl(){
  const ci = kIx(Math.max(0, Math.min(K_W-1, Math.floor(CAN.x))),
                 Math.max(0, Math.min(K_H-1, Math.floor(CAN.y))));
  const falta = K_chis.filter(c => !c.t);
  const meta = falta.length ? falta[0].i : K_sal;
  const { pa } = kBFS(K_mur, K_W, K_H, meta);
  const sig = pa[ci] >= 0 ? pa[ci] : meta;
  const tx = (sig % K_W) + 0.5, ty = ((sig/K_W)|0) + 0.5;
  let dx = tx - CAN.x, dy = ty - CAN.y;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  /* ── Y FRENA ANTES DE LLEGAR ──
     Inclinando siempre hacia adelante, la canica llega a la esquina a toda
     velocidad y se pasa: es exactamente el error que comete una persona. El bot
     compensa restando la velocidad que trae, que es lo que hace alguien que
     aprendió a jugarlo. */
  return { x: Math.max(-1, Math.min(1, dx*1.6 - CAN.vx*0.42)),
           y: Math.max(-1, Math.min(1, dy*1.6 - CAN.vy*0.42)) };
}

function kSorteaOferta(){
  const hay = K_MEJ.filter(m => (K_mej[m.k] || 0) < m.tope);
  for (let i = hay.length - 1; i > 0; i--){
    const j = (Math.random()*(i + 1)) | 0;
    const t = hay[i]; hay[i] = hay[j]; hay[j] = t;
  }
  return hay.slice(0, 3);
}

/* ══════════ DIBUJO ══════════ */
function kPinta(g){
  kGeo();
  const s = KG.s;
  /* ── LA BANDEJA, Y SU MADERA VA COMO PATRON ANCLADO AL MUNDO ──
     `createPattern` queda atado al origen de la TRANSFORMACION del contexto, no
     al rectángulo que se rellena: dibujado sin correr el lienzo, el patrón se
     desliza por debajo de la bandeja cuando la bandeja cambia de sitio entre
     pisos. Es exactamente el defecto que ya costó una vuelta con el piso de
     MANCHA. */
  const pat = patron('madera');
  caja2(KG.x0 - 10, KG.y0 - 10, K_W*s + 20, K_H*s + 20, 14,
        'rgba(26,20,14,.78)', 'rgba(255,220,168,.22)');
  if (pat){
    g.save();
    g.beginPath();
    caja2(KG.x0 - 10, KG.y0 - 10, K_W*s + 20, K_H*s + 20, 14, null, null);
    g.clip();
    g.translate(KG.x0, KG.y0);
    g.globalAlpha = 0.72;
    g.fillStyle = pat;
    g.fillRect(-10, -10, K_W*s + 20, K_H*s + 20);
    g.restore();
  }
  /* el piso de cada celda, con una trama que ancla el laberinto al mundo */
  g.fillStyle = 'rgba(255,235,205,.045)';
  for (let y = 0; y < K_H; y++) for (let x = 0; x < K_W; x++)
    if ((x + y) & 1) g.fillRect(KG.x0 + x*s, KG.y0 + y*s, s, s);

  /* ── LA SALIDA, Y SU ESTADO CERRADO TAMBIÉN TIENE QUE LEERSE ──
     Estaba en 0,12 de alfa sobre la madera y medido en la captura era un
     rectángulo gris que no se distinguía de una tabla: el jugador no sabía a
     dónde tenía que ir hasta juntar la última chispa. Cerrada va marcada con una
     cruz de trazos —o sea «acá es, y todavía no»— y abierta se enciende con un
     halo que late. Las dos cosas dicen lo mismo del sitio y distinto del estado,
     que es exactamente lo que hace falta. */
  const listo = K_chis.every(c => c.t);
  const sx = (K_sal % K_W), sy = (K_sal/K_W)|0;
  const bx = KG.x0 + sx*s + 3, by = KG.y0 + sy*s + 3, bs = s - 6;
  if (listo){
    const la = 0.62 + 0.20*Math.sin(performance.now()*0.006);
    g.globalAlpha = 0.35;
    disco(bx + bs/2, by + bs/2, bs*0.82, '#8ad7ff');
    g.globalAlpha = 1;
    caja2(bx, by, bs, bs, 8, 'rgba(138,215,255,' + la.toFixed(2) + ')',
          'rgba(220,245,255,.95)');
  } else {
    caja2(bx, by, bs, bs, 8, 'rgba(138,215,255,.14)', 'rgba(138,215,255,.55)');
    g.strokeStyle = 'rgba(138,215,255,.55)'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(bx + bs*0.26, by + bs*0.26); g.lineTo(bx + bs*0.74, by + bs*0.74);
    g.moveTo(bx + bs*0.74, by + bs*0.26); g.lineTo(bx + bs*0.26, by + bs*0.74);
    g.stroke();
  }

  /* los pozos: un disco negro con reborde. Sin el reborde, sobre una bandeja
     oscura un disco negro no se ve — y un pozo que no se ve no es una trampa,
     es una injusticia. */
  for (let i = 0; i < K_pozo.length; i++){
    if (!K_pozo[i]) continue;
    const px = kPX((i % K_W) + 0.5), py = kPY(((i/K_W)|0) + 0.5);
    const pr = kPozoR()*s;
    if (dibCuadroWH('cosas', 2, px, py, pr*2.3, pr*2.3)) continue;
    disco(px, py, pr, '#080604');
    g.strokeStyle = 'rgba(255,220,168,.30)'; g.lineWidth = 2;
    g.beginPath(); g.arc(px, py, pr, 0, 7); g.stroke();
  }

  /* las chispas */
  for (const c of K_chis){
    if (c.t) continue;
    const px = kPX((c.i % K_W) + 0.5), py = kPY(((c.i/K_W)|0) + 0.5);
    const la = 1 + Math.sin(performance.now()*0.004 + c.i)*0.14;
    /* el halo va SIEMPRE, también con el sprite puesto: es lo que hace que la
       chispa se vea de lejos en un laberinto oscuro, y una imagen recortada no
       lo puede traer porque el halo es aditivo sobre lo que haya detrás */
    g.globalAlpha = 0.30;
    disco(px, py, s*0.30*la, '#ffd76a');
    g.globalAlpha = 1;
    if (!dibCuadroWH('cosas', 1, px, py, s*0.46*la, s*0.46*la))
      disco(px, py, s*0.15*la, '#ffd76a');
  }

  /* ── LAS PAREDES, EN UN SOLO TRAZO Y CON LA ENTRADA EN DIAGONAL ──
     Un `stroke()` por pared serían doscientas órdenes de dibujo por cuadro para
     pintar líneas que no se mueven. Y la entrada se hace saltando las paredes
     que todavía no llegaron, no escalando: escalar cada una obligaría a un
     `save`/`restore` por pared y perdería el trazo único, que es justamente lo
     que hace que el laberinto cueste una orden. */
  g.strokeStyle = '#e8c79a'; g.lineWidth = Math.max(3, s*0.09);
  g.lineCap = 'round';
  g.beginPath();
  for (let y = 0; y < K_H; y++) for (let x = 0; x < K_W; x++){
    if (entradaK(x + y, K_W + K_H - 2) <= 0) continue;
    const m = K_mur[kIx(x, y)], X = KG.x0 + x*s, Y = KG.y0 + y*s;
    if (m & 1){ g.moveTo(X, Y); g.lineTo(X + s, Y); }
    if (m & 8){ g.moveTo(X, Y); g.lineTo(X, Y + s); }
    if (x === K_W-1 && (m & 2)){ g.moveTo(X + s, Y); g.lineTo(X + s, Y + s); }
    if (y === K_H-1 && (m & 4)){ g.moveTo(X, Y + s); g.lineTo(X + s, Y + s); }
  }
  g.stroke();

  /* la brújula: una flecha desde la canica hacia la salida */
  if (kM('brujula') && K_fase === 'juega'){
    const ax = kPX(CAN.x), ay = kPY(CAN.y);
    const bx = kPX(sx + 0.5), by = kPY(sy + 0.5);
    const a = Math.atan2(by - ay, bx - ax);
    g.save(); g.translate(ax, ay); g.rotate(a);
    g.globalAlpha = 0.55; g.fillStyle = '#8ad7ff';
    g.beginPath(); g.moveTo(s*0.62, 0); g.lineTo(s*0.42, -s*0.13);
    g.lineTo(s*0.42, s*0.13); g.closePath(); g.fill();
    g.restore(); g.globalAlpha = 1;
  }

  /* la canica: un disco con brillo arriba a la izquierda y sombra abajo. Con un
     disco liso se lee a ficha; el brillo es lo único que la hace esférica. */
  if (K_muerto <= 0 || ((K_muerto*10)|0) & 1) kCanica(g, kPX(CAN.x), kPY(CAN.y), CAN.r*s);

  /* el escudo, como un anillo alrededor */
  if (K_esc > 0 && K_muerto <= 0){
    g.strokeStyle = 'rgba(138,215,255,.75)'; g.lineWidth = 3;
    g.beginPath(); g.arc(kPX(CAN.x), kPY(CAN.y), CAN.r*s + 7, 0, 7); g.stroke();
  }

  /* el reloj, como un arco arriba del laberinto: se lee de reojo, que es lo que
     hace falta cuando las dos manos están ocupadas sosteniendo el aparato */
  const u = this && K_reloj > 0 ? K_relojT/K_reloj : 0;
  /* ── Y ESTAS TRES NO SE LLAMAN `bx`/`by` ──
     La caja de la salida ya usa esos nombres en la MISMA función, y un `const`
     declarado dos veces en el mismo ámbito no es un aviso: tira al parsear y se
     lleva el módulo entero — medido, el juego se quedaba en la pantalla de
     idioma con `__J` sin definir. Es la undécima vez en este repo. */
  const rw = Math.min(430, AN - 120), rx = (AN - rw)/2, ry = KG.y0 - 46;
  caja2(rx, ry, rw, 14, 7, 'rgba(255,255,255,.08)', null);
  if (u > 0) caja2(rx, ry, Math.max(14, rw*u), 14, 7,
                   u < 0.25 ? '#ff6a5a' : '#8ad7ff', null);

  /* ── Y SE DICE POR QUÉ SE FALLÓ ──
     Sin esto, caerse en un pozo y quedarse sin tiempo se ven igual: la canica
     vuelve al principio y una vida menos. Dos causas distintas que producen la
     misma imagen es lo que hace que un jugador no aprenda nada del error. */
  if (K_avisoT > 0 && K_aviso){
    const a = Math.min(1, K_avisoT/0.5);
    texto(TX(K_aviso), AN/2, KG.y0 - 92, 32,
          'rgba(255,106,90,' + a.toFixed(2) + ')', '800', 'center');
  }
  if (K_fase === 'elige'){
    kCartas(g, K_oferta);
    texto(TX('elegi'), AN/2, AL*0.20, 26, '#8ad7ff', '800', 'center');
  }
}

function kCanica(g, x, y, r){
  if (dibCuadroWH('cosas', 0, x, y, r*2.2, r*2.2)) return;
  const gr = g.createRadialGradient(x - r*0.34, y - r*0.34, r*0.1, x, y, r);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(0.42, '#bfe8ff');
  gr.addColorStop(1, '#3d7ea8');
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.globalAlpha = 0.8;
  disco(x - r*0.36, y - r*0.36, r*0.20, '#ffffff');
  g.globalAlpha = 1;
}

/* las tres cartas de mejora. Van en el lienzo y no en DOM porque aparecen y se
   van con la partida, y el texto igual pasa por TX(), así que están traducidas. */
let KC = { w: 0, h: 0, x0: 0, y: 0 };
function kCartas(g, lista){
  KC.w = Math.min(196, (AN - 56)/3 - 12);
  KC.h = KC.w*1.62;
  const tot = lista.length*KC.w + (lista.length - 1)*14;
  KC.x0 = (AN - tot)/2; KC.y = AL*0.30;
  for (let i = 0; i < lista.length; i++){
    const x = KC.x0 + i*(KC.w + 14);
    caja2(x, KC.y, KC.w, KC.h, 18, 'rgba(18,14,10,.94)', 'rgba(255,220,168,.55)');
    const n = (K_mej[lista[i].k] || 0);
    /* el icono generado, arriba del nombre: en una carta que se elige en dos
       segundos, la forma se reconoce antes que el texto — y el índice sale del
       orden de `K_MEJ`, o sea que la hoja y la lista no pueden desalinearse sin
       que alguien mueva las dos */
    const ii = K_MEJ.findIndex(m => m.k === lista[i].k);
    const conIc = ii >= 0 && dibCuadroWH('mejo', ii, x + KC.w/2, KC.y + 46, 52, 52);
    const y0 = conIc ? KC.y + 92 : KC.y + 40;
    texto(TX('m_' + lista[i].k), x + KC.w/2, y0, 19, '#ffd76a', '800', 'center');
    /* la descripción va partida a mano por ancho: un `fillText` no envuelve */
    const pal = TX('d_' + lista[i].k).split(' ');
    let ln = '', yy = y0 + 34;
    for (const p of pal){
      const pr = ln ? ln + ' ' + p : p;
      g.font = '600 15px ui-sans-serif,system-ui,sans-serif';
      if (g.measureText(pr).width > KC.w - 22 && ln){
        texto(ln, x + KC.w/2, yy, 15, 'rgba(242,238,230,.78)', '600', 'center');
        ln = p; yy += 20;
      } else ln = pr;
    }
    if (ln) texto(ln, x + KC.w/2, yy, 15, 'rgba(242,238,230,.78)', '600', 'center');
    if (n > 0) texto('×' + n, x + KC.w/2, KC.y + KC.h - 22, 15,
                     'rgba(255,215,106,.65)', '800', 'center');
  }
}
function kCartaEn(x, y){
  if (y < KC.y || y > KC.y + KC.h) return -1;
  for (let i = 0; i < K_oferta.length; i++){
    const cx = KC.x0 + i*(KC.w + 14);
    if (x >= cx && x <= cx + KC.w) return i;
  }
  return -1;
}

/* la cinemática usa el laberinto de verdad, así que lo que se ve en la escena
   es exactamente lo que se ve jugando */
function kDemo(g, u, plano){
  const guardaW = K_W, guardaH = K_H, guardaM = K_mur, guardaP = K_pozo;
  const guardaC = K_chis, guardaS = K_sal, guardaF = K_fase;
  const gx = CAN.x, gy = CAN.y, gr = CAN.r;
  const G = kGenera(3);
  K_W = G.w; K_H = G.h; K_mur = G.m; K_sal = G.sal;
  K_pozo = plano >= 1 ? G.pozo : new Array(G.w*G.h).fill(false);
  K_chis = plano >= 1 ? G.chis.map((i, k) => ({ i, t: plano === 2 })) : [];
  K_fase = 'juega';
  kGeo();
  /* la canica recorre el principio del camino: en un plano quieto no se ve que
     rueda, y rodar es todo lo que este juego hace */
  const b = kBFS(G.m, G.w, G.h, G.ent);
  const cam = kCamino(b.pa, G.ent, G.sal);
  const t = Math.min(cam.length - 1.001, u*Math.min(6, cam.length - 1));
  const a = cam[Math.floor(t)], bb = cam[Math.floor(t) + 1] || a;
  const f = t - Math.floor(t);
  CAN.x = ((a % G.w) + 0.5)*(1 - f) + ((bb % G.w) + 0.5)*f;
  CAN.y = (((a/G.w)|0) + 0.5)*(1 - f) + (((bb/G.w)|0) + 0.5)*f;
  CAN.r = 0.30;
  kPinta(g);
  K_W = guardaW; K_H = guardaH; K_mur = guardaM; K_pozo = guardaP;
  K_chis = guardaC; K_sal = guardaS; K_fase = guardaF;
  CAN.x = gx; CAN.y = gy; CAN.r = gr;
}

        seguir:'CONTINUAR', ganaste:'NÍVEL FEITO!', perdiste:'NÃO DEU',
        proximo:'PRÓXIMO', progreso:'{0} DE {1}',
        gNo:'Jogue inclinando o telefone', gSi:'Giroscópio pronto',
        gSin:'Este aparelho não tem giroscópio · jogue com o dedo',
        gNeg:'Permissão de movimento negada · jogue com o dedo',
        gIns:'Sem HTTPS não há sensores · jogue com o dedo',
