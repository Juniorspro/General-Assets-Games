<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor 3D · GLB</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root{--bg:#0b0d10;--panel:#14181d;--edge:#232a31;--ink:#e8edf2;--orange:#f5822e;--dim:#8a97a3}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--edge);background:#0e1216}
  header b{font-weight:800;letter-spacing:.3px}
  header b span{color:var(--orange)}
  header .sp{flex:1}
  .btn{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:9px;padding:8px 14px;cursor:pointer}
  .btn:hover{border-color:var(--orange)}
  main{position:relative;height:calc(100% - 58px)}
  model-viewer{width:100%;height:100%;background:radial-gradient(60% 60% at 50% 40%, #1a2027, #0b0d10)}
  #drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #drop .card{pointer-events:none;text-align:center;color:var(--dim);border:2px dashed #2b333b;border-radius:16px;padding:28px 34px;max-width:460px;background:rgba(10,13,16,.4)}
  #drop.hot .card{border-color:var(--orange);color:var(--ink)}
  #drop h2{margin:.2em 0;font-size:18px;color:var(--ink)}
  #drop code{color:var(--orange)}
  .hint{position:absolute;left:16px;bottom:14px;color:var(--dim);font-size:12px}
  input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <b>Visor 3D · <span>GLB</span></b>
  <span class="sp"></span>
  <label class="btn" for="file">Abrir modelo .glb/.gltf</label>
  <input id="file" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
  <button class="btn" id="reset">Recentrar</button>
</header>
<main>
  <model-viewer id="mv" camera-controls auto-rotate touch-action="pan-y"
    shadow-intensity="1" exposure="1.05" environment-image="neutral"
    ar ar-modes="webxr scene-viewer quick-look" interaction-prompt="none"></model-viewer>
  <div id="drop"><div class="card">
    <h2>Arrastra aquí tu <code>.glb</code></h2>
    <div>o usa "Abrir modelo". También carga <code>./dino.glb</code> automáticamente si está junto a este archivo.</div>
  </div></div>
  <div class="hint">Arrastra para rotar · rueda/pinza para zoom · botón derecho para desplazar</div>
</main>
<script>
  const mv = document.getElementById('mv');
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');

  function load(url, revoke){
    mv.src = url;
    drop.style.display = 'none';
    mv.addEventListener('error', () => {
      drop.style.display = 'flex';
      drop.querySelector('h2').textContent = 'No se pudo cargar el modelo';
    }, { once:true });
    if (revoke) mv.addEventListener('load', () => URL.revokeObjectURL(url), { once:true });
  }
  function loadFile(f){
    if(!f) return;
    if(!/\.(glb|gltf)$/i.test(f.name)){ alert('Elige un archivo .glb o .gltf'); return; }
    load(URL.createObjectURL(f), true);
  }

  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
  document.getElementById('reset').addEventListener('click', () => { mv.cameraOrbit='auto auto auto'; mv.cameraTarget='auto auto auto'; });

  // Drag & drop
  window.addEventListener('dragover', e => { e.preventDefault(); drop.style.display='flex'; drop.classList.add('hot'); });
  window.addEventListener('dragleave', e => { if(e.relatedTarget===null){ drop.classList.remove('hot'); } });
  window.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('hot');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(f);
  });

  // Autocargar ./dino.glb o ?model=URL
  const q = new URLSearchParams(location.search).get('model');
  if (q) { load(q, false); }
  else {
    fetch('./dino.glb', { method:'HEAD' })
      .then(r => { if (r.ok) load('./dino.glb', false); })
      .catch(()=>{});
  }
</script>
</body>
</html>
