<title>Redline Rider</title>
<style>

  #bar{width:min(80vw,300px);height:7px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}

    border-radius:8px;padding:5px 7px}

  .bike{border:1px solid var(--line);border-radius:16px;padding:13px;background:rgba(255,255,255,.05);

  .bname{font-size:14px;font-weight:900;letter-spacing:.07em}
  .btop{font-size:11px;font-weight:800;color:var(--accent)}

    font-weight:800;padding:6px 9px;border-radius:8px;cursor:pointer}

  .chip{background:rgba(6,9,15,.55);border:1px solid var(--line);border-radius:12px;padding:7px 10px;

  .chip .k{font-size:8px;font-weight:800;letter-spacing:.15em;color:var(--dim)}

  .big{font-size:clamp(46px,13vw,74px);font-weight:900;line-height:1;text-align:center;

  .lab{font-size:9.5px;font-weight:800;letter-spacing:.2em;color:var(--dim);text-align:center}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;

  .kv b{font-variant-numeric:tabular-nums}
  .record{text-align:center;font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--accent);margin-top:5px}
  .toast{position:absolute;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
