<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080c">
<meta name="description" content="Redline Rider — first-person motorcycle highway racer built with three.js.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101520'/%3E%3Ccircle cx='22' cy='42' r='11' fill='none' stroke='%23e8551f' stroke-width='5'/%3E%3Ccircle cx='46' cy='42' r='11' fill='none' stroke='%23e8551f' stroke-width='5'/%3E%3Cpath d='M18 30h12l8 10' stroke='%23f5f7fa' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Redline Rider</title>
<style>
  :root{
    --accent:#ff6a1a; --ink:#07080c; --panel:rgba(11,15,23,.82); --line:rgba(255,255,255,.13);
    --text:#eef2f8; --dim:#8b97a8;
    --sa-t:env(safe-area-inset-top, 0px); --sa-r:env(safe-area-inset-right, 0px);
    --sa-b:env(safe-area-inset-bottom, 0px); --sa-l:env(safe-area-inset-left, 0px);
  }
  /* Con el escenario girado 90 grados las muescas cambian de lado. Local (x,y) acaba en
     pantalla en (W-y, x), asi que el borde IZQUIERDO del juego cae en el borde superior
     fisico (donde suele estar la muesca) y el borde SUPERIOR del juego cae a la derecha
     fisica. Sin este cambio de nombres, la distancia y la puntuacion acaban justo debajo de
     la camara frontal. */
  html.rot{
    --sa-t:env(safe-area-inset-right, 0px); --sa-r:env(safe-area-inset-bottom, 0px);
    --sa-b:env(safe-area-inset-left, 0px);  --sa-l:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#07080c;color:var(--text);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Inter,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  /* El escenario se gira cuando el navegador dice que la pantalla esta en vertical, para
     presentar el juego en horizontal sin pedirle al jugador que gire el telefono.
     transform-origin en 0 0 para que la matematica del puntero sea invertible a mano. */
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;transform-origin:0 0;
    overflow:hidden;background:#07080c}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:2}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;
    padding:calc(16px + var(--sa-t)) calc(16px + var(--sa-r))
            calc(16px + var(--sa-b)) calc(16px + var(--sa-l));
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .26s ease,visibility .26s;overflow:hidden}
  .screen.on{opacity:1;visibility:visible;pointer-events:auto}
  .screen.dim{background:radial-gradient(115% 85% at 50% 15%,rgba(4,6,11,.4),rgba(4,6,11,.88))}
  .screen.blur{backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1)}

  .brand{text-align:center;line-height:.9}
  .brand b{display:block;font-size:clamp(34px,9.5vmin,64px);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
  .brand i{display:block;font-style:normal;font-size:clamp(10px,2.5vmin,14px);font-weight:800;
    letter-spacing:.44em;color:var(--accent);opacity:.92;margin-top:7px;text-indent:.44em}

  .panel{width:min(94%,460px);background:var(--panel);border:1px solid var(--line);
    border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 22px 56px rgba(0,0,0,.55)}
  .panel.tall{max-height:min(74%,640px);display:flex;flex-direction:column}
  .ptitle{font-size:14px;font-weight:900;letter-spacing:.2em;color:var(--accent);
    text-align:center;margin-bottom:13px}
  .scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    flex:1;min-height:0;padding-right:3px}
  .scroll::-webkit-scrollbar{width:5px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;
    border-radius:15px;padding:14px 18px;font:inherit;font-size:15px;font-weight:900;
    letter-spacing:.12em;color:#20150a;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),#c9430a);
    box-shadow:0 10px 22px rgba(0,0,0,.45);transition:transform .08s}
  .btn:active{transform:translateY(2px)}
  .btn.ghost{background:rgba(10,14,22,.72);color:var(--text);border:1px solid var(--line);
    box-shadow:none;font-size:13px;padding:12px 16px;backdrop-filter:blur(6px)}
  .btn.small{width:auto;padding:9px 14px;font-size:12px;border-radius:11px}
  .btn[disabled]{opacity:.42;cursor:default}
  .btnstack{display:flex;flex-direction:column;gap:9px;width:min(94%,330px)}
  .back{width:min(94%,330px)}

  .stats{display:flex;gap:8px;width:min(94%,330px)}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px 6px;text-align:center;backdrop-filter:blur(10px)}
  .stat .k{font-size:8.5px;font-weight:800;letter-spacing:.15em;color:var(--dim)}
  .stat .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}

  #bar{width:min(80%,300px);height:7px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#fff);transition:width .2s}
  #boot-pct{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--dim);font-variant-numeric:tabular-nums}
  #boot-tip{max-width:min(86%,420px);text-align:center;font-size:12.5px;color:var(--dim);
    line-height:1.5;min-height:3em}
  #boot-go{font-size:12px;font-weight:900;letter-spacing:.24em;color:var(--accent);opacity:0;
    transition:opacity .3s;animation:pulse 1.7s ease-in-out infinite}
  #boot-go.on{opacity:1}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.05);opacity:1}}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);border-radius:14px;padding:12px;cursor:pointer;
    font:inherit;color:var(--text);text-align:left}
  .card b{font-size:13px;font-weight:900;letter-spacing:.08em}
  .card span{font-size:10.5px;color:var(--dim)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .lang b{font-size:11px;color:var(--accent);background:rgba(255,255,255,.08);
    border-radius:8px;padding:5px 7px}

  .bike{border:1px solid var(--line);border-radius:16px;padding:13px;background:rgba(255,255,255,.05);
    margin-bottom:9px}
  .bike.sel{border-color:var(--accent)}
  .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bname{font-size:14px;font-weight:900;letter-spacing:.07em}
  .btop{font-size:11px;font-weight:800;color:var(--accent)}
  .barrow{display:grid;grid-template-columns:78px 1fr;gap:7px;align-items:center;margin-top:7px;
    font-size:10.5px;color:var(--dim)}
  .track{height:5px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}
  .track>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .bfoot{margin-top:9px}
  .ups{margin-top:10px}
  .uprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .pips{display:flex;gap:3px}
  .pip{width:13px;height:5px;border-radius:2px;background:rgba(255,255,255,.16)}
  .pip.on{background:var(--accent)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:11px;padding:11px 2px;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .row:last-child{border-bottom:0}
  .row .lb{font-size:12.5px;font-weight:700}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.07);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:10.5px;
    font-weight:800;padding:6px 9px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#20150a}
  input[type=range]{-webkit-appearance:none;appearance:none;width:124px;height:20px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--accent);margin-top:-6px}
  input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:var(--accent)}
  .danger{color:#ff8080!important;border-color:rgba(255,120,120,.4)!important}
  .note{font-size:10.5px;color:var(--dim);text-align:center;margin-top:9px;line-height:1.55;white-space:pre-line}

  /* ---- maquetacion horizontal ----
     El juego SIEMPRE se presenta tumbado, asi que "apretado" no es un caso raro: es EL caso.
     Una sola columna centrada en un escenario de 844x390 deja los dos lados vacios y encima no
     cabe a lo alto. Medido con tools/probe_layout.mjs antes de tocar nada: el menu se salia
     25-53 px, los resultados 62-88, y ninguna pantalla pasaba del 47% del ancho mientras el
     garaje pedia 474 px de scroll. En horizontal las pantallas se reparten en DOS columnas:
     identidad y cifras a la izquierda, lo que hay que pulsar a la derecha.

     Las clases wide y short las pone controls.layoutStage() midiendo el escenario, NO una media
     query: con la presentacion girada el navegador ve un movil de pie mientras el juego se dibuja
     tumbado, asi que una media query de orientacion acierta exactamente al reves. */

  /* Poco alto util: se recorta todo lo que solo es aire. */
  #stage.short .screen{gap:10px;
    padding:calc(10px + var(--sa-t)) calc(14px + var(--sa-r))
            calc(10px + var(--sa-b)) calc(14px + var(--sa-l))}
  #stage.short .panel{padding:14px;border-radius:18px}
  #stage.short .panel.tall{max-height:min(92%,600px)}
  #stage.short .ptitle{font-size:12.5px;margin-bottom:9px}
  #stage.short .btn{padding:11px 16px;border-radius:13px}
  #stage.short .btn.ghost{padding:10px 15px}
  #stage.short .btnstack{gap:7px}
  #stage.short .brand i{margin-top:4px}
  #stage.short .row{padding:8px 2px}
  #stage.short .note{margin-top:6px}
  /* Los mandos de tocar NO se encogen con la pantalla. Un segmentado de 24 px de alto es la
     mitad de lo que un pulgar acierta sin mirar, y en horizontal es justo donde el aparato se
     sujeta con las dos manos y se toca de refilon. */
  .seg button{min-height:34px}
  .btn.small{min-height:34px}

  /* ---- dos columnas ---- */
  #stage.wide #s-menu, #stage.wide #s-pause, #stage.wide #s-boot, #stage.wide #s-lang,
  #stage.wide #s-quality, #stage.wide #s-results, #stage.wide #s-garage,
  #stage.wide #s-settings, #stage.wide #s-credits{
    display:grid;align-content:center;justify-content:center;
    column-gap:clamp(16px,4vmin,48px);row-gap:9px}

  /* Menu: marca arriba y cifras debajo en la izquierda, los cinco botones en la derecha. Apilados
     los ocho elementos no caben en 358 px de alto util; en dos columnas sobran 100. */
  #stage.wide #s-menu{grid-template-columns:minmax(0,auto) minmax(230px,320px);
    grid-template-areas:"brand acciones" "stats acciones"}
  /* La marca y las cifras se alinean a la IZQUIERDA en su columna: centradas cada una respecto a
     si misma, quedaban descolgadas entre ellas y parecia que estuvieran puestas a mano. */
  #stage.wide #s-menu .brand{grid-area:brand;align-self:end;text-align:left}
  #stage.wide #s-menu .brand i{text-indent:0}
  #stage.wide #s-menu .stats{grid-area:stats;align-self:start;width:100%}
  #stage.wide #s-menu .btnstack{grid-area:acciones;align-self:center;width:100%}

  /* Velo por la izquierda, solo en el menu. El menu no lleva atenuacion a proposito, porque la
     gracia es ver la moto; pero con la marca a un lado y un cielo de atardecer detras, un texto
     que degrada de blanco a naranja sobre naranja no se lee. El velo cubre la mitad del texto y
     deja la moto y la carretera despejadas. */
  #stage.wide #s-menu{background:linear-gradient(90deg,rgba(4,6,11,.78) 0%,rgba(4,6,11,.55) 38%,
    rgba(4,6,11,.12) 64%,rgba(4,6,11,0) 82%)}
  /* Sombra corta y oscura pegada a la letra, ademas de la difusa: la difusa da profundidad pero no
     separa la letra de un fondo del mismo color. Y line-height a 1: con .9 sobre una letra de 64 px
     la caja queda mas corta que el propio texto y el subtitulo se sube encima del rabo de las
     letras de arriba, que es exactamente lo que se ve apretado. */
  #stage.wide .brand b{line-height:1;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.85)) drop-shadow(0 6px 18px rgba(0,0,0,.5))}
  #stage.wide .brand i{margin-top:7px}

  #stage.wide #s-pause{grid-template-columns:minmax(0,auto) minmax(210px,300px);align-items:center}
  #stage.wide #s-pause .btnstack{width:100%}

  #stage.wide #s-lang, #stage.wide #s-quality{
    grid-template-columns:minmax(0,auto) minmax(250px,420px);align-items:center}
  #stage.wide #s-lang .panel, #stage.wide #s-quality .panel{width:100%}

  /* Arranque: la marca a la izquierda y la barra, el porcentaje y el consejo en la derecha, en la
     misma columna. El consejo se alinea a la izquierda porque centrado a media pantalla salta de
     sitio en cada frase. */
  #stage.wide #s-boot{grid-template-columns:minmax(0,auto) minmax(230px,360px);
    grid-template-rows:auto auto auto auto;row-gap:7px}
  #stage.wide #s-boot .brand{grid-column:1;grid-row:1/span 4;align-self:center;text-align:right}
  #stage.wide #s-boot #bar{grid-column:2;grid-row:1;width:100%}
  #stage.wide #s-boot #boot-pct{grid-column:2;grid-row:2;text-align:left}
  #stage.wide #s-boot #boot-tip{grid-column:2;grid-row:3;max-width:100%;text-align:left;min-height:2.8em}
  #stage.wide #s-boot #boot-go{grid-column:2;grid-row:4;text-align:left}

  /* Resultados: tres bloques a lo ancho. La puntuacion grande a la izquierda, el desglose en el
     medio y los dos botones a la derecha. Apilado se salia 88 px, o sea que el ultimo boton
     quedaba fuera de la pantalla justo cuando hay que pulsarlo. */
  #stage.wide #s-results{grid-template-columns:minmax(0,1fr) minmax(190px,260px);align-items:center}
  #stage.wide #s-results .panel{width:100%;max-width:none;display:grid;
    grid-template-columns:minmax(96px,auto) minmax(0,1fr);
    grid-template-rows:auto auto auto auto;column-gap:clamp(12px,3vmin,26px);align-items:center}
  #stage.wide #s-results .ptitle{grid-column:1/-1;grid-row:1;margin-bottom:4px;text-align:left}
  #stage.wide #s-results .lab{grid-column:1;grid-row:2;align-self:end}
  #stage.wide #s-results .big{grid-column:1;grid-row:3}
  #stage.wide #s-results .record{grid-column:1;grid-row:4;align-self:start;margin-top:2px}
  #stage.wide #s-results .kvs{grid-column:2;grid-row:2/span 3;margin-top:0}
  #stage.wide #s-results .btnstack{width:100%}

  /* Garaje, ajustes y creditos: el panel ocupa el ancho de verdad y el boton de volver se va a
     una columna propia a la derecha, que es donde cae el pulgar. */
  /* La fila se declara con minmax(0,1fr) y NO en automatico. Con una fila automatica el alto sale
     del contenido, asi que el max-height del panel no ataba nada: dejaba de haber scroll interno
     y el panel crecia fuera de la pantalla (236 px de garaje por debajo del borde). Con la fila de
     alto definido, el 100% del panel ya significa algo y la lista vuelve a desplazarse dentro. */
  #stage.wide #s-garage, #stage.wide #s-settings, #stage.wide #s-credits{
    grid-template-columns:minmax(0,1fr) minmax(110px,160px);
    grid-template-rows:minmax(0,1fr);align-items:center}
  /* Los creditos son tres frases: estirarlos a lo ancho de la pantalla deja un panel plano y
     vacio. Se les pone techo y el par panel-boton se centra. */
  #stage.wide #s-credits{grid-template-columns:minmax(0,540px) minmax(110px,160px)}
  #stage.wide #s-garage .panel, #stage.wide #s-settings .panel, #stage.wide #s-credits .panel{
    width:100%;max-width:none;align-self:center}
  #stage.wide #s-garage .panel.tall, #stage.wide #s-settings .panel.tall{max-height:100%}
  #stage.wide .back{width:100%;align-self:center}

  /* El contenido largo pasa a dos columnas: con el panel al ancho de la pantalla, una sola
     columna deja media pantalla en blanco y obliga a 300-500 px de scroll. */
  #stage.wide #s-settings .scroll{display:grid;grid-template-columns:1fr 1fr;
    column-gap:clamp(14px,3vmin,30px);align-content:start}
  /* El borrado va a lo ancho: es una accion aparte y no debe compartir fila con un ajuste. La del
     sensor NO, aunque lleve barra y boton: ocupando las dos columnas obligaba a la fila anterior a
     quedarse sola y dejaba un hueco vacio en medio de la lista. */
  #stage.wide #s-settings #row-wipe{grid-column:1/-1}
  /* El garaje se parte DENTRO de cada tarjeta, no en dos columnas de tarjetas: prestaciones a la
     izquierda y mejoras a la derecha. Con dos columnas de tarjetas, la moto en uso (que trae lista
     de mejoras) media el doble que la que solo se puede comprar y dejaba un hueco enorme al lado,
     con la tercera moto empujada fuera de la vista. Partiendo la tarjeta, cada una mide la mitad
     de alto y ocupa el ancho entero. */
  #stage.wide #bikelist .bike{display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    column-gap:clamp(12px,2.5vmin,24px);align-content:start}
  #stage.wide #bikelist .bike>*{grid-column:1}
  #stage.wide #bikelist .bike>.ups{grid-column:2;grid-row:1/span 7;margin-top:0}
  #stage.short .barrow{margin-top:5px}
  #stage.short .uprow{margin-top:6px}

  /* ---- HUD ---- */
  #hud{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .25s}
  #hud.on{opacity:1;visibility:visible}
  #hudtop{position:absolute;top:calc(9px + var(--sa-t));left:0;right:0;
    display:flex;align-items:flex-start;justify-content:space-between;padding:0 12px;gap:8px}
  .chip{background:rgba(6,9,15,.55);border:1px solid var(--line);border-radius:12px;padding:7px 10px;
    backdrop-filter:blur(7px)}
  .chip .k{font-size:8px;font-weight:800;letter-spacing:.15em;color:var(--dim)}
  .chip .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .chip.cash .v{color:#ffd23f}
  /* Aviso de monedas, aparte del de puntos: los dos salen a la vez en un roce y superpuestos
     no se lee ninguno, asi que este sale mas abajo y en dorado. */
  #coinpop{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;
    pointer-events:none;opacity:0;font-size:clamp(16px,4.4vmin,24px);font-weight:900;
    color:#ffd23f;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  #pausebtn{pointer-events:auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:rgba(6,9,15,.55);color:var(--text);cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(7px)}
  #pausebtn i{width:3px;height:13px;background:currentColor;border-radius:2px;box-shadow:6px 0 0 currentColor;
    display:block;margin-left:-3px}
  #speedo{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(10px + var(--sa-b));text-align:center;
    text-shadow:0 3px 14px rgba(0,0,0,.65)}
  #speedo .n{font-size:clamp(38px,8vmin,58px);font-weight:900;line-height:.92;font-variant-numeric:tabular-nums}
  #speedo .u{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--dim)}
  #speedo .g{margin-top:5px;font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--accent)}
  #rpm{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(96px + var(--sa-b));width:min(42%,210px);height:5px;
    border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  #rpm>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cf39a,#ffd23f 62%,#ff2d2d)}
  #popup{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;
    opacity:0;pointer-events:none;text-shadow:0 4px 18px rgba(0,0,0,.6)}

  /* ---- asistente del tutorial ----
     Va abajo a la izquierda, en la banda que el HUD deja libre mientras se conduce, y NUNCA
     tapa el gas ni el freno: si el globo cubriera el mando que se esta explicando, el paso
     seria imposible de completar. */
  /* Por ENCIMA de la fila de mandos, no a su altura: abajo del todo el globo tapaba el
     velocimetro, y quedarse sin saber a que velocidad vas justo en el paso que te ensena a
     acelerar es contradecir el propio tutorial. */
  /* La fila empieza PASADO el claxon, que vive en el mismo borde y a la misma altura: el dino
     se le ponia encima y tapaba justo un mando que el tutorial manda pulsar. */
  #tut{position:absolute;left:calc(var(--sa-l) + 84px);
    bottom:calc(var(--sa-b) + 104px);
    right:calc(var(--sa-r) + 8px);display:none;align-items:flex-end;gap:8px;
    pointer-events:none;z-index:3}
  #tut.on{display:flex}
  #tut-dino{width:clamp(48px,10vmin,74px);height:auto;flex:0 0 auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  /* Compacto a proposito. La primera version se comia el 58% del ancho y el 29% del alto, y
     eso en un juego donde hay que MIRAR la carretera es tapar lo unico importante: el numero
     del paso y los botones van en la misma linea que el texto, no apilados debajo. */

    border:1px solid var(--line);border-radius:13px;padding:6px 9px;

  #tut-head{display:flex;align-items:center;gap:7px}
  #tut-n{font-size:8px;font-weight:800;letter-spacing:.14em;color:var(--accent);flex:0 0 auto}
  #tut-btns{display:flex;gap:5px;margin-left:auto;pointer-events:auto;flex:0 0 auto}
  #tut-btns .btn{width:auto;flex:0 0 auto;padding:4px 8px;font-size:9px;border-radius:8px;
    letter-spacing:.08em}
  #tut-txt{font-size:clamp(10px,2vmin,12.5px);line-height:1.32;margin-top:3px}
  /* Resalte del mando que toca. El anillo va por FUERA del boton con un box-shadow y no
     cambia su tamano: agrandarlo movería el sitio donde el jugador tiene que tocar. */
  .pad.hl{border-color:var(--accent);
    animation:ring 1.1s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,106,26,.7)}
                  100%{box-shadow:0 0 0 18px rgba(255,106,26,0)}}

  /* Fundido del choque. Va DENTRO del escenario y por encima del lienzo pero por debajo de
     las pantallas, para que el panel de resultados aparezca ya sobre negro. */
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:1}

  /* ---- mandos en pantalla ----
     El gas a la derecha y el freno a su lado porque el pulgar derecho es el que descansa
     ahi sujetando el aparato; el giro a la izquierda. 76 px es el minimo con el que un
     pulgar acierta sin mirar, y 14 px de separacion evitan pulsar los dos a la vez. */
  /* Los mandos solo mientras se conduce. En pausa seguian visibles Y pulsables por encima
     del panel, asi que se podia acelerar con el juego parado. */
  #pedals{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .18s}
  #pedals.ride{opacity:1;visibility:visible}
  .pad{position:absolute;pointer-events:auto;display:grid;place-items:center;
    border-radius:50%;border:1px solid rgba(255,255,255,.22);color:var(--text);

    transition:transform .07s,background .12s;touch-action:none;-webkit-user-select:none;
    user-select:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .pad.press{transform:scale(.94);background:rgba(255,106,26,.42);border-color:var(--accent)}
  .pad .ico{font-size:20px;line-height:1;font-weight:400}
  #pedals{--pad:clamp(74px,15vmin,96px);--sec:clamp(64px,12.5vmin,84px);
    --horn:clamp(50px,9.5vmin,62px);--gap:14px;--edge:16px}
  #p-gas{right:calc(var(--edge) + var(--sa-r));bottom:calc(var(--edge) + var(--sa-b));
    width:var(--pad);height:var(--pad);
    background:rgba(255,106,26,.26);border-color:rgba(255,140,70,.55)}
  #p-brake{right:calc(var(--edge) + var(--sa-r) + var(--pad) + var(--gap));
    bottom:calc(var(--edge) + var(--sa-b));width:var(--sec);height:var(--sec)}
  #p-left{left:calc(var(--edge) + var(--sa-l));bottom:calc(var(--edge) + var(--sa-b));
    width:var(--sec);height:var(--sec)}
  #p-right{left:calc(var(--edge) + var(--sa-l) + var(--sec) + var(--gap));
    bottom:calc(var(--edge) + var(--sa-b));width:var(--sec);height:var(--sec)}
  /* El claxon SIEMPRE encima de la flecha izquierda, tambien sin flechas: moverlo de sitio
     al cambiar de esquema lo llevaba a mitad de pantalla, donde no llega ningun pulgar. */
  #p-horn{left:calc(var(--edge) + var(--sa-l));
    bottom:calc(var(--edge) + var(--sa-b) + var(--sec) + var(--gap));
    width:var(--horn);height:var(--horn);font-size:9px}
  /* El giro por botones solo se ensena cuando es el esquema activo: con giroscopio o
     arrastre esas dos ruedas solo taparian carretera. */
  #pedals:not(.btns) .steer{display:none}

  /* Indicador vivo del giroscopio en los ajustes: sin el, el jugador no sabe si el permiso
     se concedio de verdad ni hacia donde esta inclinando. */

    background:rgba(255,255,255,.28)}

  /* Sin esta linea el jugador solo sabe que el giroscopio "no va", no POR QUE: falta permiso,
     no hay sensor, hace falta https, o el sensor ha dejado de responder. */
  .hint{display:block;font-size:10px;font-weight:600;letter-spacing:0;color:var(--dim);
