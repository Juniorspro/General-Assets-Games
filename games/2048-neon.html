<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 Neón</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #101020;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: none;
    overflow: hidden;
  }
  canvas {
    border-radius: 14px;
    box-shadow: 0 0 50px rgba(255, 170, 50, 0.2);
    max-width: 96vw; max-height: 80vh;
  }
  #back {
    position: fixed; top: 12px; left: 12px;
    color: #fc8; text-decoration: none; font-size: 14px; opacity: .7;
  }
  #back:hover { opacity: 1; }
  #hint { color: rgba(255,255,255,.45); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<a id="back" href="index.html">← Menú</a>
<canvas id="c" width="460" height="560"></canvas>
<div id="hint">Flechas / WASD o desliza · Junta fichas iguales hasta llegar a 2048</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const N = 4, PAD = 12, TOP = 100;
const TILE = (cv.width - PAD * (N + 1)) / N;

let grid, score, best, state, anims, spawnAnims, t, won;
best = +localStorage.getItem('2048NeonBest') || 0;

const COLORS = {
  2:    ['#2a3a5c', '#9fc4ff'], 4:    ['#2a4a6c', '#aee0ff'],
  8:    ['#c46a2a', '#fff'],    16:   ['#d4552a', '#fff'],
  32:   ['#e04444', '#fff'],    64:   ['#e02a6a', '#fff'],
  128:  ['#c428b4', '#fff'],    256:  ['#8a28d4', '#fff'],
  512:  ['#5a3ae4', '#fff'],    1024: ['#2a5ae4', '#fff'],
  2048: ['#ffd435', '#3a2a00'], 4096: ['#00e0a0', '#003a2a'],
};
const GLOW = { 128: 8, 256: 10, 512: 12, 1024: 16, 2048: 24, 4096: 28 };

function reset() {
  grid = Array.from({ length: N }, () => Array(N).fill(0));
  score = 0;
  anims = [];
  spawnAnims = [];
  won = false;
  state = 'play';
  t = 0;
  addTile(); addTile();
}

function addTile() {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  spawnAnims.push({ r, c, life: 12 });
}

function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!grid[r][c]) return true;
    if (c < N - 1 && grid[r][c] === grid[r][c + 1]) return true;
    if (r < N - 1 && grid[r][c] === grid[r + 1][c]) return true;
  }
  return false;
}

// mueve una fila hacia la izquierda, devuelve {row, gained, moved, merges}
function slideRow(row) {
  const vals = row.filter(v => v);
  const out = [];
  let gained = 0;
  const merges = [];
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] === vals[i + 1]) {
      out.push(vals[i] * 2);
      gained += vals[i] * 2;
      merges.push(out.length - 1);
      if (vals[i] * 2 === 2048) won = true;
      i++;
    } else out.push(vals[i]);
  }
  while (out.length < N) out.push(0);
  const moved = out.some((v, i) => v !== row[i]);
  return { row: out, gained, moved, merges };
}

function move(dx, dy) {
  if (state !== 'play') { if (state === 'dead' || state === 'won') reset(); return; }
  let moved = false;
  const newMerges = [];

  const get = (i, j) => {
    if (dx === -1) return [i, j];        // izquierda
    if (dx === 1)  return [i, N - 1 - j]; // derecha
    if (dy === -1) return [j, i];        // arriba
    return [N - 1 - j, i];               // abajo
  };

  for (let i = 0; i < N; i++) {
    const line = [];
    for (let j = 0; j < N; j++) { const [r, c] = get(i, j); line.push(grid[r][c]); }
    const res = slideRow(line);
    if (res.moved) moved = true;
    score += res.gained;
    for (let j = 0; j < N; j++) { const [r, c] = get(i, j); grid[r][c] = res.row[j]; }
    res.merges.forEach(j => { const [r, c] = get(i, j); newMerges.push({ r, c, life: 14 }); });
  }

  if (moved) {
    anims.push(...newMerges);
    addTile();
    if (score > best) { best = score; localStorage.setItem('2048NeonBest', best); }
    if (won && state === 'play') state = 'won';
    else if (!canMove()) state = 'dead';
  }
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { e.preventDefault(); move(-1, 0); }
  else if (k === 'arrowright' || k === 'd') { e.preventDefault(); move(1, 0); }
  else if (k === 'arrowup' || k === 'w') { e.preventDefault(); move(0, -1); }
  else if (k === 'arrowdown' || k === 's') { e.preventDefault(); move(0, 1); }
  else if (k === 'enter' && state !== 'play') reset();
});

let touchStart = null;
addEventListener('pointerdown', e => { touchStart = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
    if (state !== 'play') reset();
  } else if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0);
  else move(0, Math.sign(dy));
  touchStart = null;
});

function tileXY(r, c) {
  return [PAD + c * (TILE + PAD), TOP + PAD + r * (TILE + PAD)];
}

function draw() {
  t++;
  ctx.fillStyle = '#101020';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // HUD
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd435';
  ctx.shadowColor = '#fa0'; ctx.shadowBlur = 10;
  ctx.font = 'bold 34px Segoe UI, sans-serif';
  ctx.fillText('2048', PAD + 4, 52);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Segoe UI, sans-serif';
  ctx.fillText(score, cv.width - PAD - 4, 42);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '14px Segoe UI, sans-serif';
  ctx.fillText(`Récord: ${best}`, cv.width - PAD - 4, 66);

  // tablero
  ctx.fillStyle = '#1c1c34';
  ctx.beginPath();
  ctx.roundRect(0, TOP, cv.width, cv.width, 14);
  ctx.fill();

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const [x, y] = tileXY(r, c);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.beginPath();
    ctx.roundRect(x, y, TILE, TILE, 10);
    ctx.fill();
  }

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = grid[r][c];
    if (!v) continue;
    const [x, y] = tileXY(r, c);
    const [bg, fg] = COLORS[v] || ['#00ffc8', '#003328'];

    let scale = 1;
    const sa = spawnAnims.find(a => a.r === r && a.c === c);
    if (sa) scale = 1 - sa.life / 12 * 0.7;
    const ma = anims.find(a => a.r === r && a.c === c);
    if (ma) scale = 1 + Math.sin((14 - ma.life) / 14 * Math.PI) * 0.18;

    ctx.save();
    ctx.translate(x + TILE / 2, y + TILE / 2);
    ctx.scale(scale, scale);
    if (GLOW[v]) { ctx.shadowColor = bg; ctx.shadowBlur = GLOW[v] + Math.sin(t * .1) * 4; }
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(-TILE / 2, -TILE / 2, TILE, TILE, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fs = v < 100 ? 42 : v < 1000 ? 34 : 27;
    ctx.font = `bold ${fs}px Segoe UI, sans-serif`;
    ctx.fillText(v, 0, 3);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';

  spawnAnims.forEach(a => a.life--);
  spawnAnims = spawnAnims.filter(a => a.life > 0);
  anims.forEach(a => a.life--);
  anims = anims.filter(a => a.life > 0);

  if (state === 'dead' || state === 'won') {
    ctx.fillStyle = state === 'won' ? 'rgba(40,30,0,.7)' : 'rgba(0,0,0,.6)';
    ctx.fillRect(0, TOP, cv.width, cv.width);
    ctx.textAlign = 'center';
    ctx.fillStyle = state === 'won' ? '#ffd435' : '#f66';
    ctx.shadowColor = state === 'won' ? '#fd0' : '#f00';
    ctx.shadowBlur = 16;
    ctx.font = 'bold 36px Segoe UI, sans-serif';
    ctx.fillText(state === 'won' ? '¡GANASTE! 🎉' : '¡SIN MOVIMIENTOS!', cv.width / 2, TOP + cv.width / 2 - 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '18px Segoe UI, sans-serif';
    ctx.fillText(`Puntos: ${score}`, cv.width / 2, TOP + cv.width / 2 + 20);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(t * .1) * .4})`;
    ctx.font = '15px Segoe UI, sans-serif';
    ctx.fillText('Toca o ENTER para jugar de nuevo', cv.width / 2, TOP + cv.width / 2 + 55);
  }

  requestAnimationFrame(draw);
}

reset();
draw();
</script>
</body>
</html>
