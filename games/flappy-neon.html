<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Neón</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0, 255, 200, 0.25);
    max-width: 100vw;
    max-height: 100vh;
  }
  #back {
    position: fixed; top: 12px; left: 12px;
    color: #7ff; text-decoration: none; font-size: 14px;
    opacity: .7; z-index: 10;
  }
  #back:hover { opacity: 1; }
</style>
</head>
<body>
<a id="back" href="index.html">← Menú</a>
<canvas id="c" width="420" height="640"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const GRAVITY = 0.45, FLAP = -7.8, PIPE_GAP = 165, PIPE_W = 70, SPEED0 = 2.6;

let bird, pipes, particles, stars, score, best, state, t, speed, flashT;
best = +localStorage.getItem('flappyNeonBest') || 0;

function reset() {
  bird = { x: 110, y: H / 2, vy: 0, r: 14, rot: 0 };
  pipes = [];
  particles = [];
  score = 0;
  t = 0;
  speed = SPEED0;
  flashT = 0;
  state = 'ready';
}

stars = Array.from({ length: 60 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  s: Math.random() * 1.5 + .3, v: Math.random() * .4 + .1
}));

function spawnPipe() {
  const margin = 70;
  const gapY = margin + Math.random() * (H - margin * 2 - PIPE_GAP);
  pipes.push({ x: W + 20, gapY, passed: false, hue: 160 + Math.random() * 120 });
}

function burst(x, y, hue, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue });
  }
}

function flap() {
  if (state === 'ready') state = 'play';
  if (state === 'play') {
    bird.vy = FLAP;
    burst(bird.x - 10, bird.y + 8, 190, 6);
  } else if (state === 'dead' && flashT <= 0) {
    reset();
  }
}

addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } });
cv.addEventListener('pointerdown', flap);

function update() {
  t++;
  stars.forEach(s => { s.x -= s.v; if (s.x < 0) s.x = W; });

  if (state === 'play') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.08));

    if (t % Math.max(60, Math.round(95 - speed * 6)) === 0) spawnPipe();
    speed = SPEED0 + score * 0.04;

    for (const p of pipes) {
      p.x -= speed;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        burst(bird.x, bird.y, 60, 10);
      }
      // colisión
      if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
        if (bird.y - bird.r < p.gapY || bird.y + bird.r > p.gapY + PIPE_GAP) die();
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 20);

    if (bird.y + bird.r > H - 30 || bird.y - bird.r < 0) die();
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.025; });
  particles = particles.filter(p => p.life > 0);
  if (flashT > 0) flashT--;
}

function die() {
  if (state !== 'play') return;
  state = 'dead';
  flashT = 25;
  burst(bird.x, bird.y, 0, 30);
  if (score > best) { best = score; localStorage.setItem('flappyNeonBest', best); }
}

function neonRect(x, y, w, h, hue) {
  ctx.save();
  ctx.shadowColor = `hsl(${hue},100%,60%)`;
  ctx.shadowBlur = 18;
  ctx.fillStyle = `hsl(${hue},90%,55%)`;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(x, y, w, 6);
  ctx.restore();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0d2b');
  g.addColorStop(1, '#1a0a2e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.3 + Math.sin(t * .05 + s.x) * .2;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });
  ctx.globalAlpha = 1;

  for (const p of pipes) {
    neonRect(p.x, -10, PIPE_W, p.gapY + 10, p.hue);
    neonRect(p.x, p.gapY + PIPE_GAP, PIPE_W, H - p.gapY - PIPE_GAP, p.hue);
  }

  // suelo
  ctx.fillStyle = '#12123a';
  ctx.fillRect(0, H - 30, W, 30);
  ctx.strokeStyle = 'rgba(0,255,200,.5)';
  ctx.beginPath(); ctx.moveTo(0, H - 30); ctx.lineTo(W, H - 30); ctx.stroke();

  // partículas
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue},100%,65%)`;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // pájaro
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#0ff';
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a0a1a';
  ctx.beginPath(); ctx.arc(5, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -5, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 7);
  ctx.fill();
  // ala
  ctx.fillStyle = '#8ff';
  const wingY = state === 'play' ? Math.sin(t * .5) * 5 : 0;
  ctx.beginPath();
  ctx.ellipse(-4, 4 + wingY, 8, 5, -.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // HUD
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 12;
  ctx.font = 'bold 44px Segoe UI, sans-serif';
  ctx.fillText(score, W / 2, 70);
  ctx.shadowBlur = 0;
  ctx.font = '15px Segoe UI, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText(`Récord: ${best}`, W / 2, 95);

  if (state === 'ready') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px Segoe UI, sans-serif';
    ctx.fillText('FLAPPY NEÓN', W / 2, H / 2 - 60);
    ctx.font = '17px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.fillText('Toca o pulsa ESPACIO para volar', W / 2, H / 2 - 20);
    bird.y = H / 2 + Math.sin(t * .06) * 10;
  }

  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f55';
    ctx.shadowColor = '#f00'; ctx.shadowBlur = 15;
    ctx.font = 'bold 34px Segoe UI, sans-serif';
    ctx.fillText('¡GAME OVER!', W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '22px Segoe UI, sans-serif';
    ctx.fillText(`Puntos: ${score}   Récord: ${best}`, W / 2, H / 2 + 5);
    if (flashT <= 0) {
      ctx.font = '16px Segoe UI, sans-serif';
      ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(t * .1) * .4})`;
      ctx.fillText('Toca para reintentar', W / 2, H / 2 + 45);
    }
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
