<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Serpiente Turbo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #071510;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: none;
    overflow: hidden;
  }
  canvas {
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(50, 255, 120, 0.2);
    max-width: 96vw; max-height: 80vh;
  }
  #back {
    position: fixed; top: 12px; left: 12px;
    color: #6f6; text-decoration: none; font-size: 14px; opacity: .7;
  }
  #back:hover { opacity: 1; }
  #hint { color: rgba(255,255,255,.45); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<a id="back" href="index.html">← Menú</a>
<canvas id="c" width="480" height="480"></canvas>
<div id="hint">Flechas / WASD o desliza el dedo · La fruta dorada vale x5</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const CELL = 24, COLS = cv.width / CELL, ROWS = cv.height / CELL;

let snake, dir, nextDir, food, gold, score, best, state, tick, interval, particles, shakeT;
best = +localStorage.getItem('serpienteTurboBest') || 0;

function reset() {
  snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  tick = 0;
  interval = 9;      // frames por paso, baja al crecer
  particles = [];
  shakeT = 0;
  gold = null;
  state = 'ready';
  placeFood();
}

function freeCell() {
  let c;
  do {
    c = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === c.x && s.y === c.y) ||
           (food && food.x === c.x && food.y === c.y) ||
           (gold && gold.x === c.x && gold.y === c.y));
  return c;
}

function placeFood() {
  food = freeCell();
  // 18% de probabilidad de que aparezca fruta dorada temporal
  if (!gold && Math.random() < 0.18) {
    gold = freeCell();
    gold.life = 90;  // pasos hasta desaparecer
  }
}

function burst(cx, cy, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 3 + 1;
    particles.push({
      x: cx * CELL + CELL / 2, y: cy * CELL + CELL / 2,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color
    });
  }
}

function setDir(x, y) {
  if (state === 'ready') state = 'play';
  if (state === 'dead') { reset(); return; }
  if (x === -dir.x && y === -dir.y) return; // no reversa
  nextDir = { x, y };
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') { e.preventDefault(); setDir(0, -1); }
  else if (k === 'arrowdown' || k === 's') { e.preventDefault(); setDir(0, 1); }
  else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); setDir(-1, 0); }
  else if (k === 'arrowright' || k === 'd') { e.preventDefault(); setDir(1, 0); }
  else if (k === ' ' && state !== 'play') { e.preventDefault(); state === 'dead' ? reset() : state = 'play'; }
});

// control táctil por deslizamiento
let touchStart = null;
addEventListener('pointerdown', e => { touchStart = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
    if (state !== 'play') setDir(dir.x, dir.y);
  } else if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
  else setDir(0, Math.sign(dy));
  touchStart = null;
});

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // muros
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    state = 'dead';
    shakeT = 15;
    burst(snake[0].x, snake[0].y, '#f44', 25);
    if (score > best) { best = score; localStorage.setItem('serpienteTurboBest', best); }
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    burst(food.x, food.y, '#f66');
    interval = Math.max(4, 9 - Math.floor(snake.length / 6));
    placeFood();
  } else if (gold && head.x === gold.x && head.y === gold.y) {
    score += 50;
    burst(gold.x, gold.y, '#fd0', 22);
    gold = null;
    snake.push({ ...snake[snake.length - 1] }); // crece extra
  } else {
    snake.pop();
  }

  if (gold && --gold.life <= 0) gold = null;
}

function update() {
  tick++;
  if (state === 'play' && tick % interval === 0) step();
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= .95; p.vy *= .95; p.life -= .03; });
  particles = particles.filter(p => p.life > 0);
  if (shakeT > 0) shakeT--;
}

function cell(x, y, r, color, glow) {
  ctx.shadowColor = glow || color;
  ctx.shadowBlur = glow ? 14 : 0;
  ctx.fillStyle = color;
  const pad = 2;
  ctx.beginPath();
  ctx.roundRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2, r);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);

  ctx.fillStyle = '#0a1f14';
  ctx.fillRect(-10, -10, cv.width + 20, cv.height + 20);
  ctx.strokeStyle = 'rgba(80,255,140,.06)';
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
  }

  // comida
  const pulse = 1 + Math.sin(tick * .15) * .12;
  ctx.save();
  ctx.translate(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-(food.x * CELL + CELL / 2), -(food.y * CELL + CELL / 2));
  cell(food.x, food.y, 8, '#ff5566', '#f44');
  ctx.restore();

  if (gold) {
    const gp = 1 + Math.sin(tick * .3) * .2;
    ctx.save();
    ctx.translate(gold.x * CELL + CELL / 2, gold.y * CELL + CELL / 2);
    ctx.scale(gp, gp);
    ctx.translate(-(gold.x * CELL + CELL / 2), -(gold.y * CELL + CELL / 2));
    cell(gold.x, gold.y, 10, '#ffd435', '#fd0');
    ctx.restore();
  }

  // serpiente con degradado
  snake.forEach((s, i) => {
    const hue = 140 - i * 1.2;
    const light = i === 0 ? 60 : Math.max(30, 50 - i);
    cell(s.x, s.y, i === 0 ? 8 : 6, `hsl(${hue},80%,${light}%)`, i === 0 ? '#4f8' : null);
  });
  // ojos
  const h = snake[0];
  ctx.fillStyle = '#04120a';
  const ex = h.x * CELL + CELL / 2, ey = h.y * CELL + CELL / 2;
  ctx.beginPath();
  ctx.arc(ex + dir.x * 5 - dir.y * 4, ey + dir.y * 5 - dir.x * 4, 2.5, 0, 7);
  ctx.arc(ex + dir.x * 5 + dir.y * 4, ey + dir.y * 5 + dir.x * 4, 2.5, 0, 7);
  ctx.fill();

  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Segoe UI, sans-serif';
  ctx.fillText(`${score}`, 14, 30);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '14px Segoe UI, sans-serif';
  ctx.fillText(`Récord: ${best}`, cv.width - 14, 28);

  ctx.textAlign = 'center';
  if (state === 'ready') {
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#5f8';
    ctx.shadowColor = '#4f8'; ctx.shadowBlur = 16;
    ctx.font = 'bold 32px Segoe UI, sans-serif';
    ctx.fillText('SERPIENTE TURBO', cv.width / 2, cv.height / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '17px Segoe UI, sans-serif';
    ctx.fillText('Mueve con flechas o desliza para empezar', cv.width / 2, cv.height / 2 + 15);
  } else if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#f55';
    ctx.font = 'bold 32px Segoe UI, sans-serif';
    ctx.fillText('¡TE ESTRELLASTE!', cv.width / 2, cv.height / 2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Segoe UI, sans-serif';
    ctx.fillText(`Puntos: ${score}   Récord: ${best}`, cv.width / 2, cv.height / 2 + 10);
    ctx.font = '15px Segoe UI, sans-serif';
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(tick * .1) * .4})`;
    ctx.fillText('Toca o pulsa una flecha para reintentar', cv.width / 2, cv.height / 2 + 45);
  }
  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset();
loop();
</script>
</body>
</html>
