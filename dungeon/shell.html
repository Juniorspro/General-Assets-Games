<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La casa de la langosta</title>
<style>
  :root { --ink: #ded7c6; --dim: #9a9384; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a;
    font-family: "Times New Roman", Georgia, serif; color: var(--ink);
    user-select: none; touch-action: none; }

  /* EL MARCO GIRADO
     El juego entero vive acá adentro. En vertical mide innerHeight de ancho y
     se gira 90°, así que sale apaisado sin que el navegador rote nada: el
     teléfono puede tener el giro bloqueado y el juego igual viene acostado.
     Se gira el aparato, como con una foto apaisada. En una ventana que YA es
     apaisada no se gira nada — no hace falta. */
  #rot { position: fixed; left: 50%; top: 50%; transform-origin: 50% 50%;
    transform: translate(-50%, -50%); overflow: hidden; background: #05060a; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #ui { position: absolute; inset: 0; pointer-events: none; }
  #vig { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,.72) 100%); }

  #level { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 14px; letter-spacing: .22em; color: var(--dim);
    text-transform: uppercase; text-shadow: 0 2px 10px #000; }
  #state { position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .18em; color: rgba(222,215,198,.5); }

  /* el pendiente de la misión, arriba a la izquierda */
  #tarea { position: absolute; top: 14px; left: 18px; max-width: 46%;
    font-size: 14.5px; letter-spacing: .06em; line-height: 1.5;
    color: #e6dcc4; text-shadow: 0 2px 12px #000; }
  #tarea::before { content: "▸ "; color: #c8a24a; }

  /* lo que tengo delante, sobre el centro */
  #accion { position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    font-size: 15px; letter-spacing: .14em; opacity: 0; transition: opacity .14s;
    background: rgba(8,8,10,.55); border: 1px solid rgba(210,196,160,.3);
    padding: 7px 15px; border-radius: 2px; white-space: nowrap; }
  #aviso { position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    font-size: 17px; letter-spacing: .1em; color: #f0e2bd; opacity: 0;
    transition: opacity .3s; text-shadow: 0 2px 14px #000; white-space: nowrap; }

  #hint { position: absolute; right: 16px; bottom: 16px; font-size: 11px;
    letter-spacing: .08em; color: rgba(222,215,198,.34); text-align: right; line-height: 1.75; }
  #prompt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; font-size: 15px; letter-spacing: .12em;
    background: rgba(8,8,10,.6); border: 1px solid rgba(200,190,170,.22);
    padding: 8px 16px; border-radius: 2px; }

  #stick { position: absolute; left: 24px; bottom: 62px; width: 124px; height: 124px;
    border-radius: 50%; border: 1px solid rgba(222,215,198,.20);
    background: rgba(255,255,255,.035); display: none; pointer-events: auto; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
    margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(222,215,198,.22); border: 1px solid rgba(222,215,198,.35); }
  #ring { position: absolute; inset: 13px; border-radius: 50%;
    border: 1px dashed rgba(222,215,198,.16); }
  @media (hover: none) and (pointer: coarse) {
    #stick { display: block; }
    .tbtn { display: block; }
    #hint { display: none; }
  }

  .tbtn { display: none; position: absolute; border-radius: 50%; pointer-events: auto;
    font: inherit; letter-spacing: .08em; color: var(--ink); text-align: center;
    background: rgba(24,26,32,.42); border: 1px solid rgba(222,215,198,.20);
    transition: background .18s, border-color .18s; }
  .tbtn.on { background: rgba(74,124,205,.60); border-color: rgba(190,215,255,.55); }
  .tbtn:active { background: rgba(90,140,220,.66); }
  #usar   { right: 168px; bottom: 152px; width: 104px; height: 104px; font-size: 14px; }
  #usar.on { background: rgba(200,162,74,.62); border-color: rgba(255,232,170,.6); }
  #crouch { right: 20px; bottom: 178px; width: 110px; height: 68px; font-size: 12px; }
  #runtoggle { right: 140px; bottom: 42px; width: 112px; height: 84px; font-size: 13px; }
  #slide  { right: 18px; bottom: 42px; width: 106px; height: 106px; font-size: 13px; }

  #fin { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(4,10,6,.86); opacity: 0;
    pointer-events: none; transition: opacity 1s; font-size: 34px;
    letter-spacing: .4em; color: #9fe8b6; }
  #fin.ver { opacity: 1; }

  #boot { position: absolute; inset: 0; background: #05060a; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; transition: opacity .7s ease; }
  #boot.gone { opacity: 0; }
  #boot h1 { font-size: clamp(20px, 4.4vw, 40px); letter-spacing: .28em;
    margin: 0 0 0 .28em; font-weight: normal; text-align: center; }
  #boot p { font-size: 12px; letter-spacing: .18em; color: var(--dim); margin: 0;
    text-align: center; }
</style>
</head>
<body>

<div id="rot">
  <canvas id="view"></canvas>

  <div id="ui">
    <div id="vig"></div>
    <div id="level">Planta baja</div>
    <div id="state"></div>
    <div id="tarea"></div>
    <div id="aviso"></div>
    <div id="accion"></div>
    <div id="hint">
      WASD / flechas moverse · SHIFT correr · C agacharse<br>
      E usar · ESPACIO deslizarse al correr · R carrera automática<br>
      mouse mirar · click para tomar el mouse
    </div>
    <div id="prompt">Click para mirar alrededor</div>
    <div id="stick"><div id="ring"></div><div id="knob"></div></div>
    <button id="usar" class="tbtn" type="button">USAR</button>
    <button id="crouch" class="tbtn" type="button">AGACHARSE</button>
    <button id="runtoggle" class="tbtn" type="button">Alternar<br>carrera</button>
    <button id="slide" class="tbtn" type="button">DESLIZAR</button>
    <div id="fin">ESCAPASTE</div>
  </div>

  <div id="boot">
    <h1>LA CASA DE<br>LA LANGOSTA</h1>
    <p>tres cubos · la pinza · la llave · la puerta</p>
    <p>perfil bajo, o él viene</p>
  </div>
</div>

<script>window.DUNGEON_ASSETS = /*__ASSETS__*/{};</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
