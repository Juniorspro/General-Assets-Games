<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>El plano — dungeon en primera persona</title>
<style>
  :root { --ink: #d7d0bf; --dim: #8d8676; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a;
    font-family: "Times New Roman", Georgia, serif; color: var(--ink);
    user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #ui { position: fixed; inset: 0; pointer-events: none; }
  #vig { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,.9) 100%); }

  #level { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); font-size: 15px; letter-spacing: .22em;
    color: var(--dim); text-transform: uppercase; text-shadow: 0 2px 10px #000; }
  #state { position: absolute; top: calc(max(16px, env(safe-area-inset-top)) + 22px);
    left: 50%; transform: translateX(-50%); font-size: 12.5px; letter-spacing: .18em;
    color: rgba(215,208,191,.5); }

  #stam { position: absolute; left: 22px; bottom: 22px; width: 130px; height: 4px;
    background: rgba(255,255,255,.10); border-radius: 3px; overflow: hidden; }
  #stam-fill { height: 100%; width: 100%; background: #c9c2ae; transition: background .3s; }

  #hint { position: absolute; right: 18px; bottom: 20px; font-size: 11.5px;
    letter-spacing: .1em; color: rgba(215,208,191,.38); text-align: right; line-height: 1.75; }
  #prompt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; font-size: 15px; letter-spacing: .12em;
    background: rgba(8,8,10,.6); border: 1px solid rgba(200,190,170,.22);
    padding: 8px 16px; border-radius: 2px; }

  /* joystick: aparece solo en tactil */
  #stick { position: absolute; left: 26px; bottom: 86px; width: 132px; height: 132px;
    border-radius: 50%; border: 1px solid rgba(215,208,191,.20);
    background: rgba(255,255,255,.035); display: none; pointer-events: auto; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(215,208,191,.22); border: 1px solid rgba(215,208,191,.35); }
  #ring { position: absolute; inset: 14px; border-radius: 50%;
    border: 1px dashed rgba(215,208,191,.16); }
  @media (hover: none) and (pointer: coarse) {
    #stick { display: block; }
    .tbtn { display: block; }
    #hint { display: none; }
  }

  /* los tres botones de la referencia */
  .tbtn { display: none; position: absolute; border-radius: 50%; pointer-events: auto;
    font: inherit; letter-spacing: .1em; color: var(--ink); text-align: center;
    background: rgba(24,26,32,.42); border: 1px solid rgba(215,208,191,.20);
    transition: background .18s, border-color .18s; }
  .tbtn.on { background: rgba(74,124,205,.60); border-color: rgba(190,215,255,.55); }
  .tbtn:active { background: rgba(90,140,220,.66); }
  #crouch { right: 24px; bottom: 232px; width: 118px; height: 74px; font-size: 12.5px; }
  #runtoggle { right: 150px; bottom: 104px; width: 122px; height: 90px; font-size: 14px; }
  #slide { right: 24px; bottom: 104px; width: 112px; height: 112px; font-size: 13.5px; }

  #boot { position: fixed; inset: 0; background: #05060a; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; transition: opacity .7s ease; }
  #boot.gone { opacity: 0; }
  #boot h1 { font-size: clamp(24px, 5vw, 46px); letter-spacing: .3em; margin: 0 0 0 .3em; font-weight: normal; }
  #boot p { font-size: 12.5px; letter-spacing: .2em; color: var(--dim); margin: 0; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="ui">
  <div id="vig"></div>
  <div id="level">Planta baja</div>
  <div id="state"></div>
  <div id="stam"><div id="stam-fill"></div></div>
  <div id="hint">
    WASD / flechas moverse · SHIFT correr<br>
    ESPACIO / X deslizarse al correr · C agacharse<br>
    R alternar carrera automática<br>
    mouse mirar · click para tomar el mouse
  </div>
  <div id="prompt">Click para mirar alrededor</div>
  <div id="stick"><div id="ring"></div><div id="knob"></div></div>
  <button id="crouch" class="tbtn" type="button">AGACHARSE</button>
  <button id="runtoggle" class="tbtn" type="button">Alternar<br>carrera</button>
  <button id="slide" class="tbtn" type="button">DESLIZAR</button>
</div>

<div id="boot">
  <h1>EL PLANO</h1>
  <p>tres niveles · escaleras · huecos para escapar</p>
</div>

<script>window.DUNGEON_ASSETS = /*__ASSETS__*/{};</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
