<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Helix Jump 3D — three.js remake with fireball combos, 27 balls, missions and a full menu flow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2036'/%3E%3Cellipse cx='32' cy='44' rx='23' ry='8' fill='%23ffd23f'/%3E%3Cellipse cx='32' cy='44' rx='9' ry='3' fill='%230f2036'/%3E%3Ccircle cx='32' cy='24' r='10' fill='%23f4f6fa'/%3E%3C/svg%3E">
<title>Helix Jump 3D</title>
<style>
  :root{
    --accent:#ffd23f;
    --ink:#0d1424;
    --panel:rgba(14,20,34,.72);
    --panel-solid:#111a2c;
    --line:rgba(255,255,255,.12);
    --text:#eef2f8;
    --dim:#93a3b8;
    --ui: clamp(13px, 1.6vh, 16px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0b1020;color:var(--text);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Inter,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:calc(18px + env(safe-area-inset-top)) 18px
    calc(18px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .28s ease,visibility .28s;overflow:hidden}
  .screen.on{opacity:1;visibility:visible;pointer-events:auto}
  .screen.dim{background:radial-gradient(120% 90% at 50% 20%,rgba(6,10,20,.35),rgba(6,10,20,.82))}
  .screen.blur{backdrop-filter:blur(9px) saturate(1.1);-webkit-backdrop-filter:blur(9px) saturate(1.1)}
  /* el menu deja ver la torre, pero con un velo que separa el texto del fondo */
  #s-menu{background:radial-gradient(78% 58% at 50% 54%,rgba(5,9,18,.66),rgba(5,9,18,.22) 72%,transparent)}

  .brand{text-align:center;line-height:.92}
  .brand b{display:block;font-size:clamp(38px,11vw,74px);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .brand i{display:block;font-style:normal;font-size:clamp(11px,2.6vw,15px);font-weight:800;
    letter-spacing:.42em;color:var(--accent);opacity:.9;margin-top:8px;text-indent:.42em}

  .panel{width:min(94vw,470px);background:var(--panel);border:1px solid var(--line);
    border-radius:24px;padding:20px;backdrop-filter:blur(14px) saturate(1.15);
    -webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .panel.tall{max-height:min(72vh,620px);display:flex;flex-direction:column}
  .ptitle{font-size:15px;font-weight:900;letter-spacing:.2em;color:var(--accent);
    text-align:center;margin-bottom:14px}
  .scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding-right:4px;flex:1;min-height:0}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    border:0;border-radius:16px;padding:15px 20px;font:inherit;font-size:15px;font-weight:900;
    letter-spacing:.12em;color:#0e1626;cursor:pointer;
    background:linear-gradient(180deg,#fff,#d8e2f0);box-shadow:0 10px 22px rgba(0,0,0,.35);
    transition:transform .08s ease,filter .15s ease}
  .btn:active{transform:translateY(2px)}
  .btn.primary{color:#241300;
    background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#c26a00));
    box-shadow:0 12px 26px rgba(0,0,0,.42)}
  /* opaco a proposito: sobre la torre 3D en movimiento un boton translucido no se lee */
  .btn.ghost{background:rgba(9,14,26,.62);color:var(--text);border:1px solid var(--line);
    box-shadow:none;font-size:13px;padding:13px 18px;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px)}
  .btn.small{width:auto;padding:10px 16px;font-size:12px;border-radius:12px}
  .btn[disabled]{opacity:.42;cursor:default}
  .btnstack{display:flex;flex-direction:column;gap:10px;width:min(94vw,340px)}

  .stats{display:flex;gap:10px;width:min(94vw,340px)}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:11px 8px;text-align:center;backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px)}
  .stat .k{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
  .stat .v{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}

  /* ---- carga ---- */
  #bar{width:min(80vw,320px);height:8px;border-radius:99px;background:rgba(255,255,255,.14);
    overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#fff);transition:width .2s ease}
  #boot-pct{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--dim);
    font-variant-numeric:tabular-nums}
  #boot-tip{max-width:min(86vw,420px);text-align:center;font-size:13px;color:var(--dim);
    line-height:1.5;min-height:3em}
  #boot-go{font-size:13px;font-weight:900;letter-spacing:.24em;color:var(--accent);
    opacity:0;transition:opacity .3s;animation:pulse 1.7s ease-in-out infinite}
  #boot-go.on{opacity:1}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.05);opacity:1}}

  /* ---- idioma ---- */
  .langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lang{display:flex;align-items:center;gap:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);border-radius:16px;padding:14px;cursor:pointer;
    font:inherit;color:var(--text);text-align:left}
  .lang b{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--accent);
    background:rgba(255,255,255,.09);border-radius:9px;padding:6px 8px}
  .lang span{font-size:14px;font-weight:700}
  .lang:active{transform:translateY(2px)}

  /* ---- pelotas ---- */
  .skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .skin{border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;
    background:rgba(255,255,255,.05);cursor:pointer;font:inherit;color:var(--text)}
  .skin.sel{border-color:var(--accent);background:rgba(255,255,255,.12);
    box-shadow:0 0 0 1px var(--accent) inset}
  .skin .orb{width:44px;height:44px;border-radius:50%;margin:0 auto 7px;
    box-shadow:inset -5px -6px 12px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.4)}
  .skin .nm{font-size:10px;font-weight:900;letter-spacing:.08em}
  .skin .rr{font-size:8px;font-weight:800;letter-spacing:.1em;margin-top:3px;opacity:.85}
  .skin .st{font-size:9px;font-weight:800;margin-top:5px;color:var(--dim)}
  .skin.locked .orb{filter:grayscale(1) brightness(.55)}
  .r-common{color:#a8b6c6}.r-rare{color:#5cc7ff}.r-epic{color:#c58bff}.r-legendary{color:#ffc73c}

  /* ---- misiones ---- */
  .mission{border:1px solid var(--line);border-radius:16px;padding:13px;
    background:rgba(255,255,255,.05);margin-bottom:10px}
  .mission .tx{font-size:13px;font-weight:700}
  .mtrack{height:7px;border-radius:99px;background:rgba(255,255,255,.14);margin:9px 0 8px;
    overflow:hidden}
  .mtrack>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mfoot .n{font-size:11px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .reward{font-size:11px;font-weight:900;color:var(--accent)}

  /* ---- ajustes ---- */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
  .row:last-child{border-bottom:0}
  .row .lb{font-size:13px;font-weight:700}
  .seg{display:flex;gap:5px;background:rgba(255,255,255,.07);border-radius:12px;padding:4px}
  .seg button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:11px;
    font-weight:800;padding:7px 11px;border-radius:9px;cursor:pointer;letter-spacing:.04em}
  .seg button.on{background:var(--accent);color:#20180a}
  input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:22px;
    background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
    background:rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
    border-radius:50%;background:var(--accent);margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;
    background:var(--accent)}
  .danger{color:#ff8080!important;border-color:rgba(255,120,120,.4)!important}
  .note{font-size:11px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5;
    white-space:pre-line}

  /* ---- HUD ---- */
  #hud{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .25s}
  #hud.on{opacity:1;visibility:visible}
  #hudtop{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;
    display:flex;align-items:flex-start;justify-content:space-between;padding:0 14px;gap:10px}
  .hchip{background:rgba(8,13,24,.5);border:1px solid var(--line);border-radius:14px;
    padding:8px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .hchip .k{font-size:8px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
  .hchip .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  #pausebtn{pointer-events:auto;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);
    background:rgba(8,13,24,.5);color:var(--text);cursor:pointer;display:grid;place-items:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #pausebtn i{width:4px;height:15px;background:currentColor;border-radius:2px;
    box-shadow:7px 0 0 currentColor;display:block;margin-left:-3px}
  #prog{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  #prog>i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);
    transition:width .15s linear}
  #combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(1);
    font-size:clamp(26px,7vw,40px);font-weight:900;letter-spacing:.02em;opacity:0;
    text-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap;color:#fff}
  #firebar{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(30px + env(safe-area-inset-bottom));width:min(60vw,240px);text-align:center;
    opacity:0;transition:opacity .2s}
  #firebar.on{opacity:1}
  #firebar .lb{font-size:11px;font-weight:900;letter-spacing:.18em;color:#ffb056;
    text-shadow:0 0 14px rgba(255,120,20,.7);margin-bottom:5px}
  #firebar .tr{height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  #firebar .tr>i{display:block;height:100%;background:linear-gradient(90deg,#ff3d00,#ffd000)}

  .big{font-size:clamp(54px,15vw,84px);font-weight:900;line-height:1;
    font-variant-numeric:tabular-nums;text-align:center}
  .lab{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--dim);text-align:center}
  .record{text-align:center;font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--accent)}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .kv b{font-variant-numeric:tabular-nums}
  .toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:rgba(8,13,24,.9);border:1px solid var(--line);
    border-radius:12px;padding:10px 16px;font-size:12px;font-weight:700;opacity:0;
    transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
  #nogl{position:fixed;inset:0;display:none;place-items:center;padding:30px;text-align:center;
    font-size:14px;line-height:1.6;color:var(--dim);z-index:9}
</style>

<canvas id="gl"></canvas>

<div id="ui">

  <!-- carga -->
  <div class="screen on dim" id="s-boot">
    <div class="brand"><b>HELIX</b><i>JUMP 3D</i></div>
    <div id="bar"><i></i></div>
    <div id="boot-pct">0%</div>
    <div id="boot-tip"></div>
    <div id="boot-go" data-i18n="boot.ready"></div>
  </div>

  <!-- idioma -->
  <div class="screen dim blur" id="s-lang">
    <div class="brand"><b>HELIX</b><i>JUMP 3D</i></div>
    <div class="panel">
      <div class="ptitle" data-i18n="lang.title"></div>
      <div class="langgrid" id="langgrid"></div>
      <div class="note" data-i18n="lang.sub"></div>
    </div>
  </div>

  <!-- menu principal -->
  <div class="screen" id="s-menu">
    <div class="brand"><b>HELIX</b><i>JUMP 3D</i></div>
    <div class="stats">
      <div class="stat"><div class="k" data-i18n="menu.level"></div><div class="v" id="m-level">1</div></div>
      <div class="stat"><div class="k" data-i18n="menu.best"></div><div class="v" id="m-best">0</div></div>
      <div class="stat"><div class="k" data-i18n="menu.coins"></div><div class="v" id="m-coins">0</div></div>
    </div>
    <div class="btnstack">
      <button class="btn primary" id="b-play" data-i18n="menu.play"></button>
      <button class="btn ghost" id="b-skins" data-i18n="menu.skins"></button>
      <button class="btn ghost" id="b-missions" data-i18n="menu.missions"></button>
      <button class="btn ghost" id="b-settings" data-i18n="menu.settings"></button>
      <button class="btn ghost" id="b-credits" data-i18n="menu.credits"></button>
    </div>
  </div>

  <!-- pelotas -->
  <div class="screen dim blur" id="s-skins">
    <div class="panel tall">
      <div class="ptitle" data-i18n="skins.title"></div>
      <div class="scroll"><div class="skins" id="skingrid"></div></div>
    </div>
    <button class="btn ghost" style="width:min(94vw,340px)" data-back data-i18n="common.back"></button>
  </div>

  <!-- misiones -->
  <div class="screen dim blur" id="s-missions">
    <div class="panel tall">
      <div class="ptitle" data-i18n="missions.title"></div>
      <div class="scroll" id="missionlist"></div>
    </div>
    <button class="btn ghost" style="width:min(94vw,340px)" data-back data-i18n="common.back"></button>
  </div>

  <!-- ajustes -->
  <div class="screen dim blur" id="s-settings">
    <div class="panel tall">
      <div class="ptitle" data-i18n="settings.title"></div>
      <div class="scroll">
        <div class="row"><span class="lb" data-i18n="settings.lang"></span><div class="seg" id="set-lang"></div></div>
        <div class="row"><span class="lb" data-i18n="settings.music"></span><input type="range" id="set-music" min="0" max="100"></div>
        <div class="row"><span class="lb" data-i18n="settings.sfx"></span><input type="range" id="set-sfx" min="0" max="100"></div>
        <div class="row"><span class="lb" data-i18n="settings.track"></span><div class="seg" id="set-track"></div></div>
        <div class="row"><span class="lb" data-i18n="settings.quality"></span><div class="seg" id="set-quality"></div></div>
        <div class="row"><span class="lb" data-i18n="settings.sens"></span><input type="range" id="set-sens" min="50" max="200"></div>
        <div class="row"><span class="lb" data-i18n="settings.haptics"></span><div class="seg" id="set-haptics"></div></div>
        <div class="row"><span class="lb" data-i18n="settings.invert"></span><div class="seg" id="set-invert"></div></div>
        <div class="row" style="justify-content:center">
          <button class="btn ghost small danger" id="b-wipe" data-i18n="settings.reset"></button>
        </div>
      </div>
    </div>
    <button class="btn ghost" style="width:min(94vw,340px)" data-back data-i18n="common.back"></button>
  </div>

  <!-- creditos -->
  <div class="screen dim blur" id="s-credits">
    <div class="panel">
      <div class="ptitle" data-i18n="credits.title"></div>
      <div class="note" style="font-size:12.5px" data-i18n="credits.body"></div>
    </div>
    <button class="btn ghost" style="width:min(94vw,340px)" data-back data-i18n="common.back"></button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="hudtop">
      <div class="hchip"><div class="k" data-i18n="hud.level"></div><div class="v" id="h-level">1</div></div>
      <div class="hchip" style="text-align:center"><div class="k" data-i18n="over.score"></div><div class="v" id="h-score">0</div></div>
      <button id="pausebtn" aria-label="pause"><i></i></button>
    </div>
    <div id="combo"></div>
    <div id="firebar"><div class="lb" data-i18n="hud.fire"></div><div class="tr"><i></i></div></div>
    <div id="prog"><i></i></div>
  </div>

  <!-- pausa -->
  <div class="screen dim blur" id="s-pause">
    <div class="brand" style="margin-bottom:6px"><b style="font-size:clamp(28px,8vw,46px)" data-i18n="pause.title"></b></div>
    <div class="btnstack">
      <button class="btn primary" id="b-resume" data-i18n="pause.resume"></button>
      <button class="btn ghost" id="b-restart" data-i18n="pause.restart"></button>
      <button class="btn ghost" id="b-tomenu" data-i18n="pause.menu"></button>
    </div>
  </div>

  <!-- derrota -->
  <div class="screen dim blur" id="s-over">
    <div class="panel">
      <div class="ptitle" data-i18n="over.title"></div>
      <div class="lab" data-i18n="over.score"></div>
      <div class="big" id="o-score">0</div>
      <div class="record" id="o-record"></div>
      <div class="note" id="o-best"></div>
    </div>
    <div class="btnstack">
      <button class="btn primary" id="b-retry" data-i18n="over.retry"></button>
      <button class="btn ghost" id="b-omenu" data-i18n="over.menu"></button>
    </div>
  </div>

  <!-- nivel completado -->
  <div class="screen dim blur" id="s-win">
    <div class="panel">
      <div class="ptitle" id="w-title"></div>
      <div class="lab" data-i18n="over.score"></div>
      <div class="big" id="w-score">0</div>
      <div style="margin-top:14px">
        <div class="kv"><span data-i18n="win.rings"></span><b id="w-rings">0</b></div>
        <div class="kv"><span data-i18n="win.coins"></span><b id="w-coins">0</b></div>
        <div class="kv"><span data-i18n="win.bonus"></span><b id="w-bonus">0</b></div>
      </div>
    </div>
    <div class="btnstack">
      <button class="btn primary" id="b-next" data-i18n="win.next"></button>
      <button class="btn ghost" id="b-wmenu" data-i18n="over.menu"></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<div id="nogl">WebGL no está disponible en este navegador.<br>WebGL is not available in this browser.</div>
