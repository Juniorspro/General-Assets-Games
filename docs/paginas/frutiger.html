<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frutiger Aero · Generador de interfaces</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Un escritorio que se inventa interfaces solo: buscadores, generadores de imágenes, descargas y gadgets, todos con la estética Frutiger Aero y Windows Vista.">
<meta name="theme-color" content="#0a4c7a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.28'%3E%3Cstop offset='0' stop-color='%23eaffff'/%3E%3Cstop offset='.45' stop-color='%2354c8f5'/%3E%3Cstop offset='1' stop-color='%230a4c7a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='29' fill='url(%23g)'/%3E%3Cellipse cx='24' cy='20' rx='12' ry='7' fill='%23fff' opacity='.75'/%3E%3C/svg%3E">

<!-- ============================================================
     Frutiger Aero · generador de interfaces

     Todo se dibuja acá: no hay una sola imagen traída de afuera. Los fondos,
     los iconos, las burbujas y las «fotos» que genera el generador salen de
     canvas y de SVG hechos en el momento. Por eso la página pesa poco, anda sin
     internet y cada vez que se abre se ve distinta.

     La estética: Vista/Aero es vidrio con brillo arriba, bordes de luz y
     saturación alta; Frutiger Aero le suma agua, burbujas, cielo y pasto. Las
     dos comparten la idea de que un botón parece un caramelo mojado.
     ============================================================ -->
<style>
:root{
  --agua:#1ba4e0; --agua2:#0a6fb0; --hondo:#053a63;
  --verde:#5fd33a; --verde2:#2a9e18;
  --vidrio:rgba(255,255,255,.30);
  --vidrio2:rgba(255,255,255,.12);
  --linea:rgba(255,255,255,.55);
  --sombra:0 12px 34px -10px rgba(2,20,40,.7);
  --tipo:"Segoe UI","Frutiger","Helvetica Neue",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; font-family:var(--tipo); color:#0b2a41;
  background:#0a4c7a; user-select:none; -webkit-tap-highlight-color:transparent;
}

/* ---------- el escritorio ---------- */
#fondo{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0}
#brillo{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 80% at 70% -10%, rgba(255,255,255,.45), transparent 55%),
             radial-gradient(90% 60% at 10% 110%, rgba(0,40,70,.5), transparent 60%)}
#burbujas{position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden}
.burbuja{position:absolute; border-radius:50%; bottom:-15vh;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,.35) 32%,
             rgba(140,220,255,.20) 55%, rgba(255,255,255,.06) 72%, rgba(255,255,255,.28) 100%);
  box-shadow:inset 0 -6px 12px rgba(255,255,255,.5), 0 3px 14px rgba(0,60,110,.25);
  animation:subir linear infinite}
@keyframes subir{
  0%{transform:translate3d(0,0,0) scale(.85); opacity:0}
  12%{opacity:.85}
  100%{transform:translate3d(var(--der,20px),-118vh,0) scale(1.12); opacity:0}
}

/* ---------- ventanas ---------- */
/* La capa de las ventanas cubre toda la pantalla, así que sin esto se comía los
   clics de los iconos del escritorio, que están abajo: se veían y no se podían
   tocar. La capa deja pasar el dedo y cada ventana lo vuelve a agarrar. */
#tablero{position:fixed; inset:0 0 54px 0; z-index:5; pointer-events:none}
#tablero > *{pointer-events:auto}
.ven{
  position:absolute; min-width:250px; border-radius:11px 11px 8px 8px;
  background:linear-gradient(rgba(238,248,255,.90), rgba(214,236,250,.86));
  border:1px solid rgba(255,255,255,.75);
  box-shadow:var(--sombra), inset 0 0 0 1px rgba(255,255,255,.5);
  backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
  animation:abrir .26s cubic-bezier(.2,1.1,.3,1) both; overflow:hidden;
}
@keyframes abrir{from{opacity:0; transform:scale(.94) translateY(10px)} to{opacity:1; transform:none}}
.ven.cerrando{animation:cerrar .16s ease-in forwards}
@keyframes cerrar{to{opacity:0; transform:scale(.96)}}
.ven .barra{
  display:flex; align-items:center; gap:9px; padding:7px 8px 7px 12px; cursor:grab;
  background:linear-gradient(rgba(255,255,255,.85), rgba(206,232,250,.55) 48%, rgba(160,205,238,.5));
  border-bottom:1px solid rgba(255,255,255,.7);
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.ven .barra:active{cursor:grabbing}
.ven .barra b{flex:1; font:600 12.5px/1.2 var(--tipo); color:#0d3350; letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ven .barra .ico{width:16px; height:16px; flex:none}
.bot{width:22px; height:18px; border-radius:5px; border:1px solid rgba(255,255,255,.8);
  background:linear-gradient(rgba(255,255,255,.9), rgba(190,222,245,.75)); cursor:pointer;
  display:grid; place-items:center; color:#12405f; font:700 11px/1 var(--tipo); padding:0}
.bot:hover{background:linear-gradient(rgba(255,255,255,1), rgba(210,236,255,.9))}
.bot.x{background:linear-gradient(rgba(255,190,190,.95), rgba(220,90,90,.9)); color:#fff;
  border-color:rgba(255,255,255,.85)}
.bot.x:hover{background:linear-gradient(rgba(255,150,150,1), rgba(235,60,60,.95))}
.ven .cuerpo{padding:13px 14px 15px; font-size:13px; color:#12384f; max-height:64vh; overflow:auto}
.ven .cuerpo::-webkit-scrollbar{width:12px}
.ven .cuerpo::-webkit-scrollbar-thumb{border-radius:9px;
  background:linear-gradient(90deg, rgba(255,255,255,.9), rgba(140,200,240,.9));
  border:1px solid rgba(255,255,255,.8)}

/* ---------- piezas comunes ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:7px 15px; border-radius:7px;
  border:1px solid rgba(120,180,220,.9); cursor:pointer; font:600 12.5px/1 var(--tipo);
  color:#0d3350; text-shadow:0 1px 0 rgba(255,255,255,.8);
  background:linear-gradient(rgba(255,255,255,.98) 0%, rgba(236,248,255,.95) 48%,
             rgba(190,226,250,.95) 50%, rgba(214,240,255,.95) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1), 0 2px 6px rgba(10,60,100,.22);
}
.btn:hover{background:linear-gradient(rgba(255,255,255,1) 0%, rgba(224,244,255,1) 48%,
             rgba(160,214,248,1) 50%, rgba(198,236,255,1) 100%)}
.btn:active{transform:translateY(1px); box-shadow:inset 0 2px 5px rgba(10,60,100,.28)}
.btn.verde{border-color:rgba(90,180,60,.9);
  background:linear-gradient(rgba(255,255,255,.98), rgba(220,250,205,.95) 48%,
             rgba(130,215,90,.95) 50%, rgba(180,238,150,.95))}
.campo{width:100%; padding:8px 11px; border-radius:20px; font:400 13px var(--tipo); color:#0d3350;
  border:1px solid rgba(120,175,215,.9); background:linear-gradient(rgba(232,245,255,.9), #fff 60%);
  box-shadow:inset 0 2px 4px rgba(10,60,100,.16)}
.campo:focus{outline:2px solid rgba(60,170,235,.55); outline-offset:1px}
.pill{display:inline-block; padding:3px 9px; border-radius:999px; font:600 10.5px/1.5 var(--tipo);
  background:linear-gradient(rgba(255,255,255,.9), rgba(170,220,250,.8));
  border:1px solid rgba(255,255,255,.9); color:#0d4363}
.chico{font-size:11.5px; color:#3d6f92}
hr.sep{border:0; border-top:1px solid rgba(255,255,255,.85);
  border-bottom:1px solid rgba(140,190,225,.5); margin:11px 0}

/* barra de progreso de Vista, con su brillo que viaja */
.prog{height:17px; border-radius:9px; overflow:hidden; position:relative;
  background:linear-gradient(rgba(210,232,246,.9), rgba(238,250,255,.9));
  border:1px solid rgba(130,185,220,.9); box-shadow:inset 0 2px 4px rgba(10,60,100,.2)}
.prog i{display:block; height:100%; border-radius:8px; position:relative;
  background:linear-gradient(rgba(190,255,170,.95), rgba(70,205,40,.95) 50%, rgba(40,170,20,.95));
  transition:width .4s ease}
.prog i::after{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.42) 0 12px, transparent 12px 26px);
  animation:correr 1s linear infinite}
@keyframes correr{to{background-position:26px 0}}

/* iconos de escritorio */
/* Se llenan hacia abajo y recién ahí saltan a otra columna, como un escritorio
   de verdad. Con columnas que se llenaban a lo ancho, la caja no tenía ancho al
   estar fija y quedaban los diez en una sola tira que se metía abajo de la barra
   de tareas: los últimos no se podían tocar. */
#iconos{position:fixed; z-index:4; left:12px; top:12px; bottom:62px;
  display:grid; grid-auto-flow:column; grid-template-rows:repeat(auto-fill,84px);
  grid-auto-columns:84px; gap:4px; align-content:start}
.icoEsc{width:84px; padding:8px 4px 7px; border-radius:8px; cursor:pointer; text-align:center;
  border:1px solid transparent; background:transparent}
.icoEsc:hover{background:rgba(120,200,255,.28); border-color:rgba(255,255,255,.6)}
.icoEsc span{display:block; margin-top:5px; font:500 11px/1.25 var(--tipo); color:#fff;
  text-shadow:0 1px 3px rgba(0,30,60,.9)}
.icoEsc svg{width:42px; height:42px; filter:drop-shadow(0 3px 5px rgba(0,40,80,.5))}

/* ---------- la barra de abajo ---------- */
#barra{
  position:fixed; left:0; right:0; bottom:0; height:54px; z-index:20;
  display:flex; align-items:center; gap:9px; padding:0 10px 0 6px;
  background:linear-gradient(rgba(60,120,170,.55), rgba(8,42,72,.82));
  border-top:1px solid rgba(255,255,255,.5);
  box-shadow:0 -2px 20px rgba(0,25,50,.55), inset 0 1px 0 rgba(255,255,255,.35);
  backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
}
#orbe{width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; flex:none; padding:0;
  background:radial-gradient(circle at 35% 28%, #eaffff, #7fd8ff 26%, #1d8fd8 55%, #0b4f86 78%, #062f52);
  box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 0 18px rgba(90,200,255,.75),
             inset 0 -6px 12px rgba(0,40,80,.5), inset 0 5px 10px rgba(255,255,255,.6);
  display:grid; place-items:center; transition:filter .18s, transform .12s}
#orbe:hover{filter:brightness(1.15) saturate(1.2)}
#orbe:active{transform:scale(.96)}
#tareas{flex:1; display:flex; gap:7px; overflow:hidden}
.tarea{max-width:190px; padding:7px 13px; border-radius:7px; cursor:pointer;
  font:600 12px/1 var(--tipo); color:#eaf6ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:linear-gradient(rgba(255,255,255,.30), rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.45); text-shadow:0 1px 2px rgba(0,25,50,.8)}
.tarea:hover{background:linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.18))}
#reloj{flex:none; text-align:center; color:#f2fbff; font:600 12px/1.35 var(--tipo);
  text-shadow:0 1px 2px rgba(0,25,50,.9); padding:0 8px;
  border-left:1px solid rgba(255,255,255,.3)}
#reloj small{display:block; font-weight:400; font-size:10.5px; opacity:.85}

/* ---------- el menú inicio ---------- */
#menu{position:fixed; left:6px; bottom:58px; width:330px; z-index:25; border-radius:12px;
  padding:12px; display:none; box-shadow:var(--sombra);
  background:linear-gradient(rgba(240,250,255,.93), rgba(198,230,250,.90));
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(16px) saturate(1.5); -webkit-backdrop-filter:blur(16px) saturate(1.5)}
#menu.abierto{display:block; animation:abrir .18s ease both}
#menu h4{margin:0 0 9px; font:600 12px/1 var(--tipo); color:#0d3350; letter-spacing:.06em;
  text-transform:uppercase}
.mit{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:7px;
  border:1px solid transparent; background:transparent; cursor:pointer; text-align:left;
  font:500 12.5px/1.2 var(--tipo); color:#123c58}
.mit:hover{background:linear-gradient(rgba(255,255,255,.95), rgba(190,226,250,.8));
  border-color:rgba(255,255,255,.9)}
.mit svg{width:22px; height:22px; flex:none}

/* ---------- avisos ---------- */
#globo{position:fixed; right:14px; bottom:64px; z-index:30; max-width:290px; padding:11px 13px;
  border-radius:10px; display:none; box-shadow:var(--sombra);
  background:linear-gradient(rgba(255,255,255,.96), rgba(222,242,255,.94));
  border:1px solid rgba(255,255,255,.9); font:400 12px/1.5 var(--tipo); color:#123c58}
#globo.ver{display:block; animation:abrir .2s ease both}
#globo b{display:block; margin-bottom:3px; color:#0d3350}

@media (max-width:640px){
  #iconos{grid-template-rows:repeat(auto-fill,76px); grid-auto-columns:74px}
  .icoEsc{width:74px; padding:6px 3px 5px} .icoEsc svg{width:34px;height:34px}
  #menu{width:calc(100vw - 12px)}
  .ven{max-width:calc(100vw - 16px)}
}
@media (prefers-reduced-motion:reduce){
  .burbuja{animation:none; display:none}
  .prog i::after{animation:none}
  .ven{animation:none}
}
</style>
</head>
<body>

<canvas id="fondo"></canvas>
<div id="brillo"></div>
<div id="burbujas" aria-hidden="true"></div>

<div id="iconos"></div>
<div id="tablero"></div>

<div id="globo" role="status"></div>

<div id="menu" role="menu" aria-label="Menú de inicio"></div>

<div id="barra">
  <button id="orbe" title="Inicio" aria-label="Inicio">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <g fill="#fff" opacity=".95">
        <path d="M3.6 5.4 11 4.3v7.2H3.6z"/><path d="M12.2 4.1 21 3v8.5h-8.8z"/>
        <path d="M3.6 12.7H11v7.1l-7.4-1.1z"/><path d="M12.2 12.7H21V21l-8.8-1.2z"/>
      </g>
    </svg>
  </button>
  <div id="tareas"></div>
  <div id="reloj"><span id="hora">--:--</span><small id="fecha">—</small></div>
</div>

<script>
/* ============================================================
   Lo de siempre primero: atajos y azar.
   `azar` y `elegir` se usan en todos lados; tener una sola versión evita que
   cada generador invente la suya y que dos ventanas «al azar» salgan iguales.
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
function azar(a, b){ return a + Math.random() * (b - a); }
function entero(a, b){ return Math.floor(azar(a, b + 1)); }
function elegir(lista){ return lista[entero(0, lista.length - 1)]; }
function revolver(lista){
  var l = lista.slice();
  for (var i = l.length - 1; i > 0; i--){ var j = entero(0, i); var t = l[i]; l[i] = l[j]; l[j] = t; }
  return l;
}
function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}

/* ============================================================
   EL FONDO

   Un cielo Frutiger no es un degradado y ya: son tres capas. El cielo, una
   laguna con caústicas —esas rayas de luz que hace el agua—, y las lomas de
   pasto recortadas contra el horizonte. Todo en canvas, así se puede regenerar
   y descargar como imagen de verdad.
   ============================================================ */
var PALETAS = [
  { nombre:"Laguna",   cielo:["#bff3ff","#4fc6f5","#0a76c2"], agua:["#22c9e8","#0a6ba8"], pasto:["#8fe45a","#1d8f2c"] },
  { nombre:"Amanecer", cielo:["#ffe9b8","#8fd8ff","#1a7fc4"], agua:["#5fd6e8","#0f5f95"], pasto:["#a8ec6a","#2a9a35"] },
  { nombre:"Menta",    cielo:["#e6fff4","#7ff0d0","#12a5a0"], agua:["#4de3c4","#0b8a86"], pasto:["#b6f77a","#31a83f"] },
  { nombre:"Burbuja",  cielo:["#f4f9ff","#a9d8ff","#2f7fd0"], agua:["#7fd8ff","#1f6fae"], pasto:["#c6f58e","#3fae4a"] },
  { nombre:"Atardecer",cielo:["#ffd9a8","#ff9ec4","#5b5fd6"], agua:["#8f9ef0","#2c3a9e"], pasto:["#9be86a","#227a2f"] },
  { nombre:"Vidrio",   cielo:["#ffffff","#cfe9ff","#5a9fd8"], agua:["#a9dcf5","#3f7fb0"], pasto:["#d2f5a8","#5fae5a"] }
];
var paleta = elegir(PALETAS);

function pintarFondo(lienzo, an, al, p){
  var c = lienzo.getContext("2d");
  lienzo.width = an; lienzo.height = al;
  var horizonte = al * azar(.58, .72);

  /* 1. el cielo */
  var g = c.createLinearGradient(0, 0, 0, horizonte);
  g.addColorStop(0, p.cielo[0]); g.addColorStop(.45, p.cielo[1]); g.addColorStop(1, p.cielo[2]);
  c.fillStyle = g; c.fillRect(0, 0, an, horizonte);

  /* el sol y sus rayos: lo que le da el brillo mojado */
  var sx = an * azar(.15, .85), sy = horizonte * azar(.15, .5);
  var sol = c.createRadialGradient(sx, sy, 0, sx, sy, Math.max(an, al) * .5);
  sol.addColorStop(0, "rgba(255,255,255,.95)");
  sol.addColorStop(.12, "rgba(255,255,255,.55)");
  sol.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = sol; c.fillRect(0, 0, an, horizonte);

  c.save(); c.globalCompositeOperation = "lighter";
  for (var r = 0; r < 9; r++){
    var ang = azar(-1.35, 1.35), largo = Math.max(an, al) * azar(.5, 1.1), ancho = azar(8, 46);
    c.save(); c.translate(sx, sy); c.rotate(ang);
    var rg = c.createLinearGradient(0, 0, 0, largo);
    rg.addColorStop(0, "rgba(255,255,255,.30)"); rg.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = rg;
    c.beginPath(); c.moveTo(-ancho / 6, 0); c.lineTo(ancho / 6, 0);
    c.lineTo(ancho, largo); c.lineTo(-ancho, largo); c.closePath(); c.fill();
    c.restore();
  }
  c.restore();

  /* nubes redondas de mediodía */
  for (var n = 0; n < entero(3, 7); n++){
    var nx = azar(0, an), ny = azar(horizonte * .08, horizonte * .55), ne = azar(.5, 1.5);
    c.save(); c.globalAlpha = azar(.35, .75);
    for (var b = 0; b < 7; b++){
      var bx = nx + azar(-90, 90) * ne, by = ny + azar(-16, 16) * ne, br = azar(22, 55) * ne;
      var ng = c.createRadialGradient(bx, by - br * .3, br * .1, bx, by, br);
      ng.addColorStop(0, "rgba(255,255,255,.98)"); ng.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = ng; c.beginPath(); c.arc(bx, by, br, 0, 7); c.fill();
    }
    c.restore();
  }

  /* 2. el agua, con sus caústicas */
  var ag = c.createLinearGradient(0, horizonte, 0, al);
  ag.addColorStop(0, p.agua[0]); ag.addColorStop(1, p.agua[1]);
  c.fillStyle = ag; c.fillRect(0, horizonte, an, al - horizonte);

  c.save();
  c.beginPath(); c.rect(0, horizonte, an, al - horizonte); c.clip();
  c.globalCompositeOperation = "lighter";
  for (var o = 0; o < 60; o++){
    var oy = horizonte + Math.pow(Math.random(), 1.7) * (al - horizonte);
    var prof = (oy - horizonte) / Math.max(1, al - horizonte);
    c.strokeStyle = "rgba(255,255,255," + (.30 - prof * .2).toFixed(3) + ")";
    c.lineWidth = azar(1, 3 + prof * 5);
    c.beginPath();
    var ox = azar(-100, an), largoO = azar(40, 260) * (1 + prof);
    c.moveTo(ox, oy);
    c.bezierCurveTo(ox + largoO * .3, oy - 4, ox + largoO * .7, oy + 4, ox + largoO, oy);
    c.stroke();
  }
  /* el reflejo del sol, partido en la superficie */
  for (var q = 0; q < 26; q++){
    var ry = horizonte + q * ((al - horizonte) / 26);
    c.fillStyle = "rgba(255,255,255," + (.20 - q * .006).toFixed(3) + ")";
    var rw = azar(20, 110) * (1 + q / 8);
    c.fillRect(sx - rw / 2, ry, rw, azar(2, 5));
  }
  c.restore();

  /* 3. las lomas de pasto */
  var capas = entero(2, 3);
  for (var k = 0; k < capas; k++){
    var base = horizonte + (al - horizonte) * (.42 + k * .26);
    var pg = c.createLinearGradient(0, base - 90, 0, al);
    pg.addColorStop(0, p.pasto[0]); pg.addColorStop(1, p.pasto[1]);
    c.fillStyle = pg; c.globalAlpha = k === 0 ? .92 : 1;
    c.beginPath(); c.moveTo(-10, al);
    var pasoL = an / 6;
    c.lineTo(-10, base + azar(-30, 30));
    for (var x = 0; x <= an + pasoL; x += pasoL){
      c.quadraticCurveTo(x + pasoL / 2, base + azar(-70, 40), x + pasoL, base + azar(-30, 30));
    }
    c.lineTo(an + 10, al); c.closePath(); c.fill();
    c.globalAlpha = 1;
  }

  /* el velo de luz que unifica todo: sin esto parece un dibujo plano */
  var velo = c.createLinearGradient(0, 0, 0, al);
  velo.addColorStop(0, "rgba(255,255,255,.16)");
  velo.addColorStop(.5, "rgba(255,255,255,0)");
  velo.addColorStop(1, "rgba(0,40,80,.24)");
  c.fillStyle = velo; c.fillRect(0, 0, an, al);
}

function nuevoFondo(){
  paleta = elegir(PALETAS);
  var l = $("fondo");
  pintarFondo(l, Math.round(innerWidth * devicePixelRatio), Math.round(innerHeight * devicePixelRatio), paleta);
  l.style.width = innerWidth + "px"; l.style.height = innerHeight + "px";
}
addEventListener("resize", nuevoFondo);

/* las burbujas que suben, que son la mitad de la estética */

/* ============================================================
   LOS ICONOS

   Dibujados como SVG en el momento. Un icono Aero es siempre lo mismo: una
   forma de color saturado, un brillo elíptico en la mitad de arriba y una
   sombra abajo. Con esa receta salen todos.
   ============================================================ */
function brilloSVG(id){
  return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#fff" stop-opacity=".85"/>' +
    '<stop offset=".48" stop-color="#fff" stop-opacity=".22"/>' +
    '<stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>';
}
var nSVG = 0;
function icono(tipo, tam){
  tam = tam || 42;
  var id = "g" + (++nSVG);
  var C = {
    carpeta:  ["#ffd97a","#e8a020"], mundo:["#8fe0ff","#0f7ec4"], foto:["#a8f0c0","#1ba05a"],
    baja:     ["#b8e0ff","#2a7fc4"], nota:["#fff3c0","#e0b83a"], musica:["#e0b8ff","#8a3fd0"],
    chat:     ["#ffd0e8","#d84f9a"], pc:["#cfe4f5","#5f8fb8"], papelera:["#c8f0ff","#3f9fd0"],
    clima:    ["#fff0a8","#f0a020"], reloj:["#e8f4ff","#7fa8c8"], escudo:["#ffe0a8","#e08020"]
  }[tipo] || ["#cfe8ff","#3f8fc8"];

  var formas = {
    carpeta:  '<path d="M6 16h16l4 5h20a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3z"/>',
    mundo:    '<circle cx="26" cy="34" r="22"/>',
    foto:     '<rect x="4" y="12" width="44" height="34" rx="4"/>',
    baja:     '<path d="M26 8v26m0 0-11-11m11 11 11-11M8 44h36v6H8z"/>',
    nota:     '<path d="M10 6h22l12 12v34a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/>',
    musica:   '<path d="M40 8v28a8 8 0 1 1-5-7.4V16l-18 4v22a8 8 0 1 1-5-7.4V14z"/>',
    chat:     '<path d="M8 10h36a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H24l-12 10v-10H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/>',
    pc:       '<rect x="5" y="9" width="42" height="29" rx="3"/><path d="M17 44h18l3 6H14z"/>',
    papelera: '<path d="M13 16h26l-3 34a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3zM18 10h16l2 6H16z"/>',
    clima:    '<circle cx="20" cy="22" r="11"/><path d="M22 44a10 10 0 0 1 0-20 13 13 0 0 1 24 4 8 8 0 0 1-2 16z"/>',
    reloj:    '<circle cx="26" cy="30" r="22"/>',
    escudo:   '<path d="M26 4 46 12v16c0 14-9 22-20 26C15 50 6 42 6 28V12z"/>'
  };

  return '<svg viewBox="0 0 52 56" width="' + tam + '" height="' + tam + '" aria-hidden="true">' +
    '<defs><linearGradient id="c' + id + '" x1="0" y1="0" x2=".3" y2="1">' +
      '<stop offset="0" stop-color="' + C[0] + '"/><stop offset="1" stop-color="' + C[1] + '"/>' +
    '</linearGradient>' + brilloSVG(id) + '</defs>' +
    '<g fill="url(#c' + id + ')" stroke="rgba(255,255,255,.85)" stroke-width="1.5" stroke-linejoin="round">' +
      formas[tipo] + '</g>' +

    (tipo === "reloj"
      ? '<g stroke="#12405f" stroke-width="2.5" stroke-linecap="round"><path d="M26 30V18"/><path d="M26 30l9 6"/></g>'

/* ============================================================
   LAS VENTANAS

   Una sola función las arma todas: título, icono y contenido. Cada generador de
   abajo devuelve nada más que su HTML y lo que haya que enganchar después.
   ============================================================ */
var zTope = 10, abiertas = [], cascada = 0;

/* Dónde cae una ventana nueva. Al azar puro se superponían justo y parecía un
   error; en cascada, corridas de a poco, se lee como un escritorio de verdad.
   Cuando la cascada llega abajo vuelve a empezar un poco más a la derecha. */
function dondeCae(an, alto){
  var pasoX = 34, pasoY = 30, filas = Math.max(2, Math.floor((innerHeight - 150) / pasoY));
  var i = cascada++, vuelta = Math.floor(i / filas);
  var x = 60 + (i % filas) * pasoX + vuelta * 90;
  var y = 34 + (i % filas) * pasoY;
  if (x + an > innerWidth - 16){ x = azar(12, Math.max(14, innerWidth - an - 12)); }
  if (y + 120 > innerHeight - 70){ y = azar(20, Math.max(24, innerHeight - 220)); }
  return { x:Math.max(8, x), y:Math.max(8, y) };
}

function ventana(opc){
  var v = document.createElement("div");
  v.className = "ven";
  var an = Math.min(opc.ancho || 360, innerWidth - 24);
  v.style.width = an + "px";
  var pos = dondeCae(an);
  v.style.left = Math.max(8, Math.min(innerWidth - an - 8, opc.x != null ? opc.x : pos.x)) + "px";
  v.style.top = Math.max(8, opc.y != null ? opc.y : pos.y) + "px";
  v.style.zIndex = ++zTope;
  v.innerHTML =
    '<div class="barra">' + icono(opc.icono || "carpeta", 16).replace("<svg", '<svg class="ico"') +
      '<b>' + esc(opc.titulo) + '</b>' +
      '<button class="bot" data-min title="Minimizar">–</button>' +
      '<button class="bot x" data-cerrar title="Cerrar">✕</button>' +
    '</div>' +
    '<div class="cuerpo">' + opc.cuerpo + '</div>';
  $("tablero").appendChild(v);

  var tarea = document.createElement("button");
  tarea.className = "tarea"; tarea.textContent = opc.titulo;
  $("tareas").appendChild(tarea);

  function alFrente(){ v.style.zIndex = ++zTope; v.hidden = false; }
  tarea.addEventListener("click", function(){
    if (v.hidden) alFrente(); else if (v.style.zIndex == zTope) v.hidden = true; else alFrente();
  });
  v.addEventListener("mousedown", alFrente, true);
  v.addEventListener("touchstart", alFrente, { capture:true, passive:true });

  function cerrar(){
    v.classList.add("cerrando");
    setTimeout(function(){
      v.remove(); tarea.remove();
      abiertas = abiertas.filter(function(o){ return o.v !== v; });
      if (opc.alCerrar) opc.alCerrar();
    }, 160);
  }
  v.querySelector("[data-cerrar]").addEventListener("click", cerrar);
  v.querySelector("[data-min]").addEventListener("click", function(){ v.hidden = true; });

  /* arrastrar de la barra: con puntero, así anda igual con dedo y con mouse */
  var barra = v.querySelector(".barra"), dx = 0, dy = 0, arrastrando = false;
  barra.addEventListener("pointerdown", function(ev){
    if (ev.target.closest("button")) return;
    arrastrando = true; barra.setPointerCapture(ev.pointerId);
    dx = ev.clientX - v.offsetLeft; dy = ev.clientY - v.offsetTop;
  });
  barra.addEventListener("pointermove", function(ev){
    if (!arrastrando) return;
    v.style.left = Math.max(-an + 60, Math.min(innerWidth - 60, ev.clientX - dx)) + "px";
    v.style.top = Math.max(0, Math.min(innerHeight - 60, ev.clientY - dy)) + "px";
  });
  barra.addEventListener("pointerup", function(){ arrastrando = false; });
  barra.addEventListener("pointercancel", function(){ arrastrando = false; });

  abiertas.push({ v:v, tarea:tarea });
  if (opc.listo) opc.listo(v, v.querySelector(".cuerpo"));
  return v;
}

/* ============================================================
   LOS GENERADORES

   Cada uno arma una ventana distinta. Se eligen al azar, así el escritorio
   nunca sale dos veces igual. Nada de esto se conecta a ningún lado: es todo
   de mentira, que es de lo que se trata.
   ============================================================ */
var PALABRAS = ["burbujas","acuario","vidrio líquido","pasto brillante","cielo de mediodía","delfines",

var ARCHIVOS = ["Mis imágenes","Mis videos","Mi música","Fondos de pantalla","Acuario","Verano 2007",
  "Capturas","Salvapantallas","Documentos","Descargas","Copia de seguridad","Nuevo Documento"];
var EXT = ["jpg","png","bmp","wmv","mp3","txt","zip","scr","avi","gif"];

/* ---------- 2. generador de imágenes ----------
   Lo que dibuja es la estética misma: degradados de agua, burbujas con su
   brillo, hojas y destellos. Y se puede bajar de verdad, porque el canvas no
   toca ninguna imagen de afuera y `toDataURL` no se ensucia. */
function arteFrutiger(c, an, al, semilla){
  var p = elegir(PALETAS);
  var g = c.createLinearGradient(0, 0, an * .3, al);
  g.addColorStop(0, p.cielo[0]); g.addColorStop(.5, p.agua[0]); g.addColorStop(1, p.agua[1]);
  c.fillStyle = g; c.fillRect(0, 0, an, al);

  /* hojas al fondo, apenas */
  c.save(); c.globalAlpha = .28;
  for (var h = 0; h < entero(3, 7); h++){
    var hx = azar(0, an), hy = azar(0, al), hr = azar(al * .2, al * .6);
    c.fillStyle = elegir([p.pasto[0], p.pasto[1]]);
    c.beginPath();
    c.ellipse(hx, hy, hr, hr * azar(.2, .45), azar(0, 3.14), 0, 7);
    c.fill();
  }
  c.restore();

  /* el sol */
  var sx = azar(an * .1, an * .9), sy = azar(0, al * .5);
  var sg = c.createRadialGradient(sx, sy, 0, sx, sy, Math.max(an, al) * .55);
  sg.addColorStop(0, "rgba(255,255,255,.95)"); sg.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = sg; c.fillRect(0, 0, an, al);

  /* burbujas: el brillo arriba a la izquierda y el aro de luz son lo que las
     hace leer como burbuja y no como círculo */
  for (var i = 0; i < entero(9, 22); i++){
    var x = azar(0, an), y = azar(0, al), r = azar(al * .04, al * .22);
    var bg = c.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r);
    bg.addColorStop(0, "rgba(255,255,255,.95)");
    bg.addColorStop(.25, "rgba(255,255,255,.30)");
    bg.addColorStop(.75, "rgba(190,240,255,.10)");
    bg.addColorStop(1, "rgba(255,255,255,.42)");
    c.fillStyle = bg; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 1; c.stroke();
    c.fillStyle = "rgba(255,255,255,.9)";
    c.beginPath(); c.ellipse(x - r * .35, y - r * .4, r * .22, r * .13, -.6, 0, 7); c.fill();
  }

  /* destellos */
  c.save(); c.globalCompositeOperation = "lighter";
  for (var d = 0; d < entero(4, 10); d++){
    var dx = azar(0, an), dy = azar(0, al), dr = azar(3, 16);
    c.fillStyle = "rgba(255,255,255,.85)";
    c.beginPath(); c.arc(dx, dy, dr * .3, 0, 7); c.fill();
    c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(dx - dr, dy); c.lineTo(dx + dr, dy);
    c.moveTo(dx, dy - dr); c.lineTo(dx, dy + dr); c.stroke();
  }
  c.restore();
  return p.nombre;
}

/* ---------- 3. descargas ----------
   Las barras avanzan de a saltos raros, como avanzaban de verdad: si suben
   parejo se nota que es de mentira. */
function verDescargas(){
  var n = entero(2, 4), filas = [];
  for (var i = 0; i < n; i++){
    filas.push({
      nombre: elegir(PALABRAS).replace(/\s+/g, "_") + "_" + entero(100, 999) + "." + elegir(EXT),
      total: azar(3, 780),
      hecho: 0,
      vel: azar(.4, 3.2)
    });
  }
  ventana({
    titulo:"Descargas", icono:"baja", ancho:400,
    cuerpo: filas.map(function(f, k){
      return '<div style="margin-bottom:13px" data-fila="' + k + '">' +
        '<div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:5px">' +
          '<b style="font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">' +
            esc(f.nombre) + '</b>' +
          '<span class="chico" data-pct>0 %</span></div>' +
        '<div class="prog"><i style="width:0"></i></div>' +
        '<div class="chico" data-det style="margin-top:4px">esperando…</div></div>';
    }).join("") +
      '<hr class="sep"><div style="display:flex; gap:8px">' +
      '<button class="btn" data-pausa>Pausar todo</button>' +
      '<button class="btn" data-limpiar>Limpiar la lista</button></div>',
    listo:function(v){
      var andando = true;
      var reloj = setInterval(function(){
        if (!andando) return;
        filas.forEach(function(f, k){
          if (f.hecho >= f.total) return;
          /* el salto raro: a veces se traba, a veces vuela */
          f.hecho = Math.min(f.total, f.hecho + f.vel * azar(.1, 2.4));
          var caja = v.querySelector('[data-fila="' + k + '"]');
          if (!caja) return;
          var pct = f.hecho / f.total;
          caja.querySelector(".prog i").style.width = (pct * 100).toFixed(1) + "%";
          caja.querySelector("[data-pct]").textContent = Math.round(pct * 100) + " %";
          caja.querySelector("[data-det]").textContent = f.hecho >= f.total
            ? "Completa · " + f.total.toFixed(1) + " MB"
            : f.hecho.toFixed(1) + " de " + f.total.toFixed(1) + " MB · " +
              (f.vel * azar(60, 190)).toFixed(0) + " KB/s";
          if (f.hecho >= f.total) avisar("Descarga completa", f.nombre);
        });
      }, 260);
      v.querySelector("[data-pausa]").addEventListener("click", function(){
        andando = !andando; this.textContent = andando ? "Pausar todo" : "Reanudar";
      });
      v.querySelector("[data-limpiar]").addEventListener("click", function(){
        filas.forEach(function(f){ f.hecho = 0; f.vel = azar(.4, 3.2); });
      });
      return function(){ clearInterval(reloj); };
    },
    alCerrar:function(){}
  });
}

        g.addColorStop(0, "#1ba4e0"); g.addColorStop(.55, "#6ee8c0"); g.addColorStop(1, "#eaffff");
        c.fillStyle = g;
        for (var i = 0; i < barras; i++){
          var objetivo = sonando
            ? (Math.sin(t + i * .5) * .5 + .5) * (Math.sin(t * 1.7 + i) * .35 + .65) * l.height * .9
            : 2;
          alturas[i] += (objetivo - alturas[i]) * .28;        // inercia: sin esto tiembla
          var an = l.width / barras - 2;
          c.fillRect(i * (l.width / barras) + 1, l.height - alturas[i], an, alturas[i]);
          c.fillStyle = "rgba(255,255,255,.55)";
          c.fillRect(i * (l.width / barras) + 1, l.height - alturas[i] - 2, an, 2);
          c.fillStyle = g;
        }
      }, 45);
      v.querySelector("[data-play]").addEventListener("click", function(){
        sonando = !sonando; this.textContent = sonando ? "❚❚ Pausa" : "▶ Reproducir";
      });
      v.querySelector("[data-sig]").addEventListener("click", function(){ avance = 0; });
      v.addEventListener("DOMNodeRemovedFromDocument", function(){ clearInterval(lazo); });
      /* el navegador ya no avisa cuando se saca un nodo, así que se controla acá */
      var vigia = setInterval(function(){
        if (!document.body.contains(l)){ clearInterval(lazo); clearInterval(vigia); }
      }, 1200);
    }
  });
}

/* ---------- 9. copiando archivos ----------
   El diálogo con la animación de las hojitas volando, que siempre calculaba mal
   cuánto faltaba. Acá también calcula mal, a propósito. */
function verCopia(){
  var total = entero(40, 900), hechos = 0;
  ventana({
    titulo:"Copiando " + total + " elementos", icono:"carpeta", ancho:390,
    cuerpo:
      '<div style="display:flex; align-items:center; gap:12px; margin-bottom:12px">' +
        '<canvas data-vuelo width="86" height="56" style="flex:none"></canvas>' +
        '<div><b style="font-size:13px">Copiando…</b>' +
        '<div class="chico" data-de>de <b>Mis imágenes</b> a <b>Copia de seguridad</b></div></div></div>' +
      '<div class="prog"><i style="width:0"></i></div>' +
      '<div class="chico" data-falta style="margin-top:7px">Calculando el tiempo restante…</div>' +
      '<hr class="sep"><div class="chico" data-arch>—</div>',
    listo:function(v){
      var l = v.querySelector("[data-vuelo]"), c = l.getContext("2d"), f = 0;
      var lazo = setInterval(function(){
        f += .12;
        c.clearRect(0, 0, l.width, l.height);
        for (var i = 0; i < 5; i++){
          var t = (f + i * .4) % 3 / 3;
          var x = 6 + t * 68, y = 30 + Math.sin(t * 6 + i) * 13;
          c.save(); c.translate(x, y); c.rotate(Math.sin(f + i) * .6);
          c.fillStyle = "rgba(255,255,255," + (1 - Math.abs(t - .5) * 1.2).toFixed(2) + ")";
          c.strokeStyle = "rgba(60,150,210,.9)"; c.lineWidth = 1;
          c.beginPath(); c.moveTo(-7, -9); c.lineTo(4, -9); c.lineTo(7, -5); c.lineTo(7, 9);
          c.lineTo(-7, 9); c.closePath(); c.fill(); c.stroke();
          c.restore();
        }
        if (hechos < total){
          hechos = Math.min(total, hechos + azar(.2, 4));
          var pct = hechos / total;
          v.querySelector(".prog i").style.width = (pct * 100).toFixed(1) + "%";
          /* el chiste es que el tiempo restante no baja parejo */
          v.querySelector("[data-falta]").textContent = pct > .97
            ? "Casi listo…"
            : "Tiempo restante: " + entero(2, 40) + " " + elegir(["segundos","minutos","segundos"]);
          v.querySelector("[data-arch]").textContent =
            "Copiando: " + elegir(PALABRAS).replace(/\s+/g, "_") + "." + elegir(EXT) +
            "  (" + Math.round(hechos) + " de " + total + ")";
        }
      }, 60);
      var vigia = setInterval(function(){
        if (!document.body.contains(l)){ clearInterval(lazo); clearInterval(vigia); }
      }, 1200);
    }
  });
}

/* ---------- 10. reloj gadget ---------- */
function verReloj(){
  ventana({
    titulo:"Reloj", icono:"reloj", ancho:190,
    cuerpo:'<canvas data-reloj width="160" height="160" style="width:100%; height:auto; display:block"></canvas>',
    listo:function(v){
      var l = v.querySelector("[data-reloj]"), c = l.getContext("2d"), R = 78;
      function dibujar(){
        var d = new Date();
        c.clearRect(0, 0, 160, 160); c.save(); c.translate(80, 80);
        var g = c.createRadialGradient(-20, -30, 6, 0, 0, R);
        g.addColorStop(0, "#ffffff"); g.addColorStop(.55, "#dceffc"); g.addColorStop(1, "#8fc0e0");
        c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, 7); c.fill();
        c.strokeStyle = "rgba(255,255,255,.95)"; c.lineWidth = 4; c.stroke();
        c.strokeStyle = "rgba(30,110,170,.35)"; c.lineWidth = 1;
        c.beginPath(); c.arc(0, 0, R - 4, 0, 7); c.stroke();
        for (var i = 0; i < 12; i++){
          c.save(); c.rotate(i * Math.PI / 6);
          c.fillStyle = "#1a5f8f"; c.fillRect(-1.6, -R + 8, 3.2, i % 3 === 0 ? 12 : 7);
          c.restore();
        }
        var s = d.getSeconds(), m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
        function aguja(ang, largo, grosor, color){
          c.save(); c.rotate(ang); c.strokeStyle = color; c.lineWidth = grosor; c.lineCap = "round";
          c.beginPath(); c.moveTo(0, 8); c.lineTo(0, -largo); c.stroke(); c.restore();
        }
        aguja(h * Math.PI / 6, R * .5, 5.5, "#0d3350");
        aguja(m * Math.PI / 30, R * .72, 3.5, "#0d3350");
        aguja(s * Math.PI / 30, R * .8, 1.6, "#e04f4f");
        c.fillStyle = "#0d3350"; c.beginPath(); c.arc(0, 0, 4, 0, 7); c.fill();
        /* el brillo de vidrio arriba, que es lo que lo hace Aero */
        var br = c.createLinearGradient(0, -R, 0, 10);
        br.addColorStop(0, "rgba(255,255,255,.75)"); br.addColorStop(1, "rgba(255,255,255,0)");
        c.fillStyle = br; c.beginPath(); c.ellipse(0, -R * .35, R * .78, R * .5, 0, 0, 7); c.fill();
        c.restore();
      }
      dibujar();
      var lazo = setInterval(dibujar, 1000);
      var vigia = setInterval(function(){
        if (!document.body.contains(l)){ clearInterval(lazo); clearInterval(vigia); }
      }, 1500);
    }
  });
}

/* ============================================================
   EL ESCRITORIO: lo que engancha todo
   ============================================================ */
var GENERADORES = [
  { n:"Buscar en la Web",  i:"mundo",    f:verBuscador },
  { n:"Generar imágenes",  i:"foto",     f:verGenerador },
  { n:"Descargas",         i:"baja",     f:verDescargas },
  { n:"Reproductor",       i:"musica",   f:verMedia },
  { n:"El tiempo",         i:"clima",    f:verClima },
  { n:"Conversación",      i:"chat",     f:verChat },
  { n:"Explorador",        i:"carpeta",  f:verExplorador },
  { n:"Rendimiento",       i:"pc",       f:verSistema },
  { n:"Copiar archivos",   i:"papelera", f:verCopia },
  { n:"Reloj",             i:"reloj",    f:verReloj }
];

function avisar(titulo, texto){
  var g = $("globo");
  g.innerHTML = "<b>" + esc(titulo) + "</b>" + esc(texto);
  g.classList.add("ver");
  clearTimeout(avisar.t);
  avisar.t = setTimeout(function(){ g.classList.remove("ver"); }, 3400);
}

/* una interfaz al azar, que es de lo que se trata la página */
function unaAlAzar(){ elegir(GENERADORES).f(); }

function unEscritorio(cuantas){
  abiertas.slice().forEach(function(o){ o.v.remove(); o.tarea.remove(); });
  abiertas = []; cascada = 0;
  var lista = revolver(GENERADORES).slice(0, cuantas || entero(3, 5));
  lista.forEach(function(g, k){ setTimeout(g.f, k * 170); });
}

/* los iconos del escritorio */
function pintarIconos(){
  $("iconos").innerHTML = GENERADORES.map(function(g, k){
    return '<button class="icoEsc" data-g="' + k + '">' + icono(g.i, 42) +
      '<span>' + esc(g.n) + '</span></button>';
  }).join("");
}
$("iconos").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-g]"); if (b) GENERADORES[+b.dataset.g].f();
});

/* el menú de inicio */
function pintarMenu(){
  $("menu").innerHTML =
    '<h4>Todos los programas</h4>' +
    GENERADORES.map(function(g, k){
      return '<button class="mit" data-g="' + k + '">' + icono(g.i, 22) + esc(g.n) + '</button>';
    }).join("") +
    '<hr class="sep">' +
    '<button class="mit" data-hacer="todas">' + icono("escudo", 22) + 'Abrir cuatro al azar</button>' +
    '<button class="mit" data-hacer="fondo">' + icono("foto", 22) + 'Fondo nuevo</button>' +
    '<button class="mit" data-hacer="cerrar">' + icono("papelera", 22) + 'Cerrar todo</button>';
}
$("menu").addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.g) GENERADORES[+b.dataset.g].f();
  else if (b.dataset.hacer === "todas") unEscritorio(4);
  else if (b.dataset.hacer === "fondo"){ nuevoFondo(); sembrarBurbujas(); avisar("Fondo nuevo", "Paleta: " + paleta.nombre + "."); }
  else if (b.dataset.hacer === "cerrar"){
    abiertas.slice().forEach(function(o){ o.v.remove(); o.tarea.remove(); });
    abiertas = []; cascada = 0;
  }
  $("menu").classList.remove("abierto");
});
$("orbe").addEventListener("click", function(ev){
  ev.stopPropagation();
  $("menu").classList.toggle("abierto");
});
document.addEventListener("click", function(ev){
  if (!ev.target.closest("#menu") && !ev.target.closest("#orbe")) $("menu").classList.remove("abierto");
});

/* Doble toque en el escritorio: otra interfaz al azar. Va en el documento y no
   en la capa de ventanas, porque esa capa ya no recibe clics. */
document.addEventListener("dblclick", function(ev){
  if (ev.target.closest(".ven, .icoEsc, #barra, #menu, #globo")) return;
  unaAlAzar();
});

/* el reloj de la barra */
function tictac(){
  var d = new Date();
  $("hora").textContent = d.toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });
  $("fecha").textContent = d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"numeric" });
}
setInterval(tictac, 1000);

/* atajos: la barra espaciadora tira una interfaz nueva */
addEventListener("keydown", function(ev){
  if (ev.target.matches("input, textarea")) return;
  if (ev.code === "Space"){ ev.preventDefault(); unaAlAzar(); }
  if (ev.key === "f" || ev.key === "F"){ nuevoFondo(); sembrarBurbujas(); }
  if (ev.key === "Escape") $("menu").classList.remove("abierto");
});

/* ---------- arranque ---------- */
nuevoFondo();
sembrarBurbujas();
pintarIconos();
pintarMenu();
tictac();
unEscritorio(entero(3, 4));
setTimeout(function(){
  avisar("Bienvenido", "Tocá el escritorio dos veces, apretá la barra espaciadora o entrá al menú de inicio para que aparezcan más interfaces.");
}, 1200);
</script>
