<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>__TITLE__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#05060c;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:__SKY__;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;z-index:5;display:none}
.scr.on{display:block}
/* -------- carga -------- */
#load{z-index:20;flex-direction:column;align-items:center;justify-content:center;
  background:__SKY__;text-align:center;padding:8%}
#load.on{display:flex}
#ldTitle{font-size:13vmin;font-weight:900;letter-spacing:.02em;color:#fff;line-height:1;
  text-shadow:0 4px 24px rgba(0,0,0,.5)}
#ldSub{margin-top:2.5vmin;font-size:3.4vmin;color:__ACC__;font-weight:700;letter-spacing:.14em}
#ldLang{display:flex;gap:2.4vmin;margin-top:6vmin}
#ldLang .chip{padding:2.2vmin 4.2vmin;border-radius:3vmin;font-size:3.4vmin;font-weight:800;
  color:#dfe7ff;background:rgba(255,255,255,.08);border:.5vmin solid rgba(255,255,255,.16)}
#ldLang .chip.on{background:__ACC__;color:#06121c;border-color:#fff}
#ldGo{margin-top:8vmin;padding:4vmin 12vmin;border-radius:5vmin;font-size:5vmin;font-weight:900;
  letter-spacing:.06em;color:#06121c;background:linear-gradient(180deg,#fff,__ACC__);
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px __ACC__;cursor:pointer;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* -------- menú -------- */
#menu{z-index:10;background:transparent}
#menuArt{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
  transition:opacity .5s}
#menu.hasart #menuArt{opacity:1}
#menu.live #menuArt{opacity:0}
#menuVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,12,.15),rgba(5,6,12,.72))}
#badges{position:absolute;top:3vmin;left:0;right:0;display:flex;justify-content:center;gap:3vmin;z-index:3}
.badge{background:rgba(0,0,0,.42);border:.4vmin solid rgba(255,255,255,.18);border-radius:3vmin;
  padding:1.6vmin 3.4vmin;font-size:3.1vmin;font-weight:800;color:#fff;backdrop-filter:blur(3px)}
#mTitle{position:absolute;top:18%;left:0;right:0;text-align:center;z-index:3}
#menu.hasart #mTitle{display:none}
#mTitle h1{font-size:15vmin;font-weight:900;color:#fff;line-height:.95;letter-spacing:.01em;
  text-shadow:0 4px 30px rgba(0,0,0,.6)}
#mTitle .s{margin-top:2vmin;font-size:3.4vmin;color:__ACC__;font-weight:700;letter-spacing:.12em}
#bPlay{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:4;
  min-width:70vw;text-align:center;padding:4.2vmin 8vmin;border-radius:6vmin;
  font-size:6vmin;font-weight:900;letter-spacing:.06em;color:#06121c;
  background:linear-gradient(180deg,#fff,__ACC__);box-shadow:0 7px 0 rgba(0,0,0,.32),0 0 46px __ACC__;
  cursor:pointer;animation:rise .5s ease-out,beat 1.2s .5s infinite}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(6vmin)}to{opacity:1;transform:translateX(-50%)}}
@keyframes beat{50%{transform:translateX(-50%) scale(1.05)}}
#mRow{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:4vmin;z-index:4}
#mRow .mi{width:12vmin;height:12vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:6vmin;background:rgba(0,0,0,.4);border:.5vmin solid rgba(255,255,255,.2);cursor:pointer}
/* -------- HUD -------- */
#hud{z-index:6;pointer-events:none}
#score{position:absolute;top:3vmin;left:0;right:0;text-align:center;font-size:9vmin;font-weight:900;
  color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.6)}
#info{position:absolute;top:13vmin;left:0;right:0;text-align:center;font-size:3.4vmin;font-weight:700;
  color:__ACC__;letter-spacing:.08em}
#bPause{position:absolute;top:3vmin;right:3vmin;width:11vmin;height:11vmin;border-radius:3vmin;
  background:rgba(0,0,0,.4);border:.5vmin solid rgba(255,255,255,.2);color:#fff;font-size:5vmin;
  display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:7}
/* -------- pausa / fin -------- */
#pause,#over{z-index:12;background:rgba(5,6,12,.82);display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:8%;backdrop-filter:blur(4px)}
#pause.on,#over.on{display:flex}
.big{font-size:11vmin;font-weight:900;color:#fff;line-height:1}
.ovSub{margin-top:2vmin;font-size:4vmin;color:__ACC__;font-weight:800}
.ovScore{margin-top:5vmin;font-size:16vmin;font-weight:900;color:#fff;line-height:1}
.ovBest{margin-top:1vmin;font-size:3.6vmin;color:#9fb0d8;font-weight:700}
.btns{margin-top:7vmin;display:flex;flex-direction:column;gap:3vmin;width:70%}
.btn{padding:4vmin;border-radius:5vmin;font-size:5vmin;font-weight:900;letter-spacing:.05em;
  color:#06121c;background:linear-gradient(180deg,#fff,__ACC__);box-shadow:0 6px 0 rgba(0,0,0,.3);cursor:pointer}
.btn.ghost{color:#dfe7ff;background:rgba(255,255,255,.09);border:.5vmin solid rgba(255,255,255,.2);box-shadow:none}
#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:15;
  background:rgba(0,0,0,.7);color:#fff;font-size:4.4vmin;font-weight:800;padding:3vmin 6vmin;
  border-radius:4vmin;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style>
