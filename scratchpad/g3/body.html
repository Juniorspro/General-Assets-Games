<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="cv"></canvas>

  <div id="menu" class="scr">
    <div id="menuVeil"></div>
    <div id="badges"><div class="badge" id="bgBest">★ 0</div><div class="badge" id="bgCoin">◆ 0</div></div>
    <div id="mTitle"><h1>__NAME__</h1><div class="s">__SUB__</div></div>
    <div id="bPlay">JUGAR</div>
    <div id="mRow"><div class="mi" id="miSon">🔊</div><div class="mi" id="miVib">📳</div></div>
  </div>

  <div id="hud" class="scr"></div>

  <div id="pause" class="scr">
    <div class="big">PAUSA</div>
    <div class="btns"><div class="btn" id="pReanudar">SEGUIR</div><div class="btn ghost" id="pMenu">MENÚ</div></div>
  </div>

  <div id="over" class="scr">
    <div class="big" id="ovTitle">FIN</div>
    <div class="ovSub" id="ovSub"></div>
    <div class="ovScore" id="ovScore">0</div>
    <div class="ovBest" id="ovBest"></div>
    <div class="btns"><div class="btn" id="oOtra">OTRA VEZ</div><div class="btn ghost" id="oMenu">MENÚ</div></div>
  </div>

  <div id="load" class="scr on">
    <div id="ldT">__NAME__</div>
    <div id="ldS">__SUB__</div>
    <div id="ldLang">
      <div class="chip on" data-l="es">ESPAÑOL</div>
      <div class="chip" data-l="en">ENGLISH</div>
      <div class="chip" data-l="pt">PORTUGUÊS</div>
    </div>
    <div id="ldGo">JUGAR ▸</div>
    <div id="ldBar"><div id="ldFill"></div></div>
  </div>

  <div id="toast"></div>
</div>
