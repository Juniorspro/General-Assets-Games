<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>__TITLE__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;
  -webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform-origin:center;background:__SKY__;overflow:hidden}
#gl,#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#cv{pointer-events:none}
.scr{position:absolute;inset:0;z-index:5;display:none;color:#fff}
#load,#menu,#pause,#over{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5%}
#load.on,#menu.on,#pause.on,#over.on{display:flex}
#hud.on{display:block}
/* carga */
#load{z-index:20;background:__SKY__}
#ldT{font-size:11vmin;font-weight:900;letter-spacing:.03em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#ldS{margin-top:1.6vmin;font-size:3vmin;color:__ACC__;font-weight:700;letter-spacing:.16em}
#ldLang{display:flex;gap:2vmin;margin-top:4vmin}
#ldLang .chip{padding:1.8vmin 3.6vmin;border-radius:2.4vmin;font-size:2.8vmin;font-weight:800;color:#dfe7ff;
  background:rgba(255,255,255,.08);border:.4vmin solid rgba(255,255,255,.16)}
#ldLang .chip.on{background:__ACC__;color:#06121c;border-color:#fff}
#ldGo{margin-top:5vmin;padding:3vmin 9vmin;border-radius:4vmin;font-size:4.2vmin;font-weight:900;letter-spacing:.06em;
  color:#06121c;background:linear-gradient(180deg,#fff,__ACC__);box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 40px __ACC__;
  cursor:pointer;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#ldBar{margin-top:4vmin;width:44vmin;height:1.4vmin;background:rgba(255,255,255,.12);border-radius:1vmin;overflow:hidden}
#ldFill{height:100%;width:0;background:__ACC__;transition:width .2s}
/* menú */
#menu{z-index:10;background:transparent}
#menuVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,12,.1),rgba(5,6,12,.62));z-index:1}
#badges{position:absolute;top:2.4vmin;left:0;right:0;display:flex;justify-content:center;gap:2.4vmin;z-index:3}
.badge{background:rgba(0,0,0,.42);border:.35vmin solid rgba(255,255,255,.18);border-radius:2.4vmin;
  padding:1.2vmin 2.8vmin;font-size:2.6vmin;font-weight:800;backdrop-filter:blur(3px)}
#mTitle{position:absolute;top:16%;left:0;right:0;text-align:center;z-index:3}
#mTitle h1{font-size:13vmin;font-weight:900;line-height:.95;text-shadow:0 4px 30px rgba(0,0,0,.7)}
#mTitle .s{margin-top:1.4vmin;font-size:2.8vmin;color:__ACC__;font-weight:700;letter-spacing:.14em}
#bPlay{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);z-index:4;min-width:40vw;text-align:center;
  padding:3vmin 8vmin;border-radius:5vmin;font-size:5vmin;font-weight:900;letter-spacing:.06em;color:#06121c;
  background:linear-gradient(180deg,#fff,__ACC__);box-shadow:0 6px 0 rgba(0,0,0,.32),0 0 46px __ACC__;
  cursor:pointer;animation:rise .5s ease-out,beat 1.2s .5s infinite}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(5vmin)}to{opacity:1;transform:translateX(-50%)}}
@keyframes beat{50%{transform:translateX(-50%) scale(1.05)}}
#mRow{position:absolute;right:2.4vmin;bottom:3vmin;display:flex;gap:2.4vmin;z-index:4}
#mRow .mi{width:9vmin;height:9vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:4.4vmin;background:rgba(0,0,0,.4);border:.4vmin solid rgba(255,255,255,.2);cursor:pointer}
/* hud */
#hud{z-index:6;pointer-events:none}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:15;background:rgba(0,0,0,.7);
  font-size:3.4vmin;font-weight:800;padding:2vmin 4.4vmin;border-radius:3vmin;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
/* pausa / fin */
#pause,#over{z-index:12;background:rgba(5,6,12,.82);backdrop-filter:blur(4px)}
.big{font-size:9vmin;font-weight:900;line-height:1}
.ovSub{margin-top:1.4vmin;font-size:3.2vmin;color:__ACC__;font-weight:800}
.ovScore{margin-top:2.6vmin;font-size:13vmin;font-weight:900;line-height:1}
.ovBest{margin-top:.6vmin;font-size:2.8vmin;color:#9fb0d8;font-weight:700}
.btns{margin-top:4vmin;display:flex;gap:2.4vmin}
.btn{padding:2.6vmin 6vmin;border-radius:4vmin;font-size:4vmin;font-weight:900;letter-spacing:.05em;color:#06121c;
  background:linear-gradient(180deg,#fff,__ACC__);box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer}
.btn.ghost{color:#dfe7ff;background:rgba(255,255,255,.09);border:.4vmin solid rgba(255,255,255,.2);box-shadow:none}
#rot{position:absolute;inset:0;z-index:30;display:none;background:#05060c;color:#fff;
  align-items:center;justify-content:center;text-align:center;font-size:5vmin;font-weight:800;padding:10%}
</style>
