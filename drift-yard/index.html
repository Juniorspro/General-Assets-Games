<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drift Yard</title>
<style>
:root{--ink:#f2efe8;--dim:#9a958c;--bg:#191a1e;--panel:rgba(24,25,30,.82);
  --org:#ff7a1a;--yel:#ffd23c;--red:#e84040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--ink)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;background-size:cover;background-position:center;text-align:center}
.screen.hidden{display:none}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,15,.6),rgba(12,12,15,.3) 40%,rgba(12,12,15,.8))}
.screen>*{position:relative}
#logo{width:min(44vh,70vw);filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tagline{font-style:italic;font-weight:400;opacity:.9;font-size:clamp(13px,2.2vh,18px)}
.btn{min-width:min(72vw,380px);padding:.75em 1.3em;font:900 clamp(15px,2.6vh,22px) inherit;letter-spacing:.07em;
  color:var(--ink);background:var(--panel);border:2px solid rgba(242,239,232,.35);border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.focus,.btn:hover:not(:disabled){border-color:var(--org);background:rgba(255,122,26,.18);
  box-shadow:0 0 16px rgba(255,122,26,.35)}
.btn small{display:block;font-weight:400;font-size:.6em;color:var(--dim);margin-top:.25em}
.title-xl{font-size:clamp(24px,5.6vh,48px);font-style:italic;letter-spacing:.05em;
  text-shadow:0 3px 0 rgba(0,0,0,.7)}
.org{color:var(--org)}.yel{color:var(--yel)}
.hint{color:var(--dim);font-weight:400;font-size:clamp(11px,1.8vh,14px);line-height:1.5}
#loadbar{width:min(70vw,420px);height:12px;background:var(--panel);border-radius:4px;overflow:hidden;
  border:1px solid rgba(242,239,232,.3)}
#loadbar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--yel),var(--org))}
#loadmsg{font-weight:400;color:var(--dim);font-size:13px}
/* garage */
#garage_ui{position:fixed;inset:0;z-index:10;display:none;pointer-events:none}
#garage_ui .top{position:absolute;top:4vh;left:0;right:0;text-align:center}
#carname{font-size:clamp(28px,6vh,54px);font-style:italic;letter-spacing:.08em;text-shadow:0 3px 0 rgba(0,0,0,.7)}
#stats{position:absolute;left:50%;transform:translateX(-50%);bottom:19vh;width:min(78vw,420px);
  background:var(--panel);border:1.5px solid rgba(242,239,232,.25);border-radius:10px;padding:12px 16px;text-align:left}
.stat{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px;letter-spacing:.15em;color:var(--dim)}
.stat .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.stat .bar>div{height:100%;background:var(--org)}
.garrow{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto;width:15vmin;height:15vmin;
  min-width:56px;min-height:56px;font:900 7vmin inherit;color:var(--ink);background:var(--panel);
  border:2px solid rgba(242,239,232,.35);border-radius:12px}
#gprev{left:3vmin}#gnext{right:3vmin}
#gbottom{position:absolute;bottom:3vh;left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:auto}
#gbest{position:absolute;bottom:12vh;left:0;right:0;text-align:center;color:var(--dim);font-weight:400;font-size:13px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#score{position:absolute;top:1.6vh;left:0;right:0;text-align:center;font-style:italic}
#score .total{font-size:clamp(26px,5.2vh,46px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#score .cur{font-size:clamp(16px,3.2vh,26px);color:var(--org);min-height:1.3em}
#score .cur .combo{color:var(--yel)}
#timer{position:absolute;top:2vh;right:2.4vw;font-size:clamp(18px,3.6vh,30px);font-style:italic}
#speedo{position:absolute;right:2.4vw;bottom:2vh;text-align:right;font-style:italic}
#speedo .kmh{font-size:clamp(30px,6vh,52px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#speedo .ang{color:var(--org);font-size:clamp(13px,2.4vh,18px)}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:clamp(20px,4.2vh,36px);
  font-style:italic;color:var(--yel);text-shadow:0 3px 0 rgba(0,0,0,.8);opacity:0;transition:opacity .15s;white-space:nowrap}
#pausebtn{position:absolute;top:2vh;left:2.4vw;width:40px;height:40px;pointer-events:auto;
  font:900 16px inherit;color:var(--ink);background:var(--panel);border:1.5px solid rgba(242,239,232,.35);border-radius:8px}
#touch{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
.tbtn{position:absolute;pointer-events:auto;width:16vmin;height:16vmin;min-width:60px;min-height:60px;
  border-radius:14%;background:var(--panel);border:2px solid rgba(242,239,232,.35);color:var(--ink);
  font:900 5vmin inherit;display:flex;align-items:center;justify-content:center}
.tbtn.small{font-size:2.6vmin}
.tbtn.active{border-color:var(--org);box-shadow:0 0 14px rgba(255,122,26,.5)}
#tleft{left:3vmin;bottom:4vmin}#tright{left:21vmin;bottom:4vmin}
#tgas{right:3vmin;bottom:4vmin}#tbrake{right:21vmin;bottom:4vmin}#thand{right:3vmin;bottom:23vmin}
#dev{position:fixed;top:4px;left:52px;color:#0f0;font:12px monospace;display:none;z-index:99;
  background:rgba(0,0,0,.55);padding:2px 6px;pointer-events:none;white-space:pre}
.rowlist{display:flex;flex-direction:column;gap:12px}
.results-grid{font-size:clamp(15px,2.8vh,22px);line-height:1.9;font-style:italic}
.medal{font-size:clamp(30px,6vh,54px)}
</style>

})();
</script>
</head>

<canvas id="gl"></canvas>
<div id="dev"></div>

<div id="hud">
  <div id="score"><div class="total">0</div><div class="cur"></div></div>
  <div id="timer">3:00</div>

</div>

</div>
<div class="screen hidden" id="s_title"></div>
<div class="screen hidden" id="s_time"></div>
<div class="screen hidden" id="s_pause"></div>
<div class="screen hidden" id="s_results"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============ strings ============ */
const STR={
es:{loading:"CARGANDO",play:"JUGAR",language:"IDIOMA: ESPAÑOL",sound_on:"SONIDO: SÍ",sound_off:"SONIDO: NO",
q_high:"CALIDAD: ALTA",q_low:"CALIDAD: BAJA",qnote:"Se aplica al entrar a pista",back:"VOLVER",
chooseCar:"ELIGE TU MÁQUINA",choose:"ELEGIR",chooseTime:"¿A QUÉ HORA RUEDAS?",dia:"DÍA",tarde:"ATARDECER",noche:"NOCHE",
power:"POTENCIA",grip:"AGARRE",turn:"GIRO",kick:"DERRAPE",best:"RÉCORD",noBest:"SIN RÉCORD",
paused:"PAUSA",resume:"SEGUIR",restart:"REINICIAR",exit:"SALIR",timeUp:"¡SE ACABÓ!",results:"RESULTADOS",
score:"PUNTOS",bestDrift:"MEJOR DERRAPE",newRecord:"¡NUEVO RÉCORD!",retry:"OTRA VEZ",garage:"GARAJE",menu:"MENÚ",
comboLost:"¡COMBO PERDIDO!",go:"¡DALE!",gas:"GAS",brake:"FRENO",
controlsKeys:"Flechas o WASD · ESPACIO freno de mano · P pausa",
controlsPad:"Mando: stick + RT gas · LT freno · A freno de mano",
controlsTouch:"Táctil: flechas + GAS / FRENO / ✋ freno de mano",
madeWith:"Assets generados con Higgsfield · Three.js",

desc_katana:"Equilibrado y elegante. El clásico.",desc_bandido:"Bruto. Potencia pura, cuesta domarlo.",
desc_hachi:"Ligero y juguetón. Baila solo.",desc_toro:"Ancho y estable. Derrapes largos."},
en:{loading:"LOADING",play:"PLAY",language:"LANGUAGE: ENGLISH",sound_on:"SOUND: ON",sound_off:"SOUND: OFF",
q_high:"QUALITY: HIGH",q_low:"QUALITY: LOW",qnote:"Applies when you enter the yard",back:"BACK",
chooseCar:"PICK YOUR MACHINE",choose:"SELECT",chooseTime:"WHEN DO YOU RIDE?",dia:"DAY",tarde:"SUNSET",noche:"NIGHT",
power:"POWER",grip:"GRIP",turn:"STEERING",kick:"SLIDE",best:"BEST",noBest:"NO RECORD",
paused:"PAUSED",resume:"RESUME",restart:"RESTART",exit:"QUIT",timeUp:"TIME'S UP!",results:"RESULTS",
score:"SCORE",bestDrift:"BEST DRIFT",newRecord:"NEW RECORD!",retry:"RETRY",garage:"GARAGE",menu:"MENU",
comboLost:"COMBO LOST!",go:"GO!",gas:"GAS",brake:"BRAKE",
controlsKeys:"Arrows or WASD · SPACE handbrake · P pause",
controlsPad:"Gamepad: stick + RT gas · LT brake · A handbrake",
controlsTouch:"Touch: arrows + GAS / BRAKE / ✋ handbrake",
madeWith:"Assets generated with Higgsfield · Three.js",
tagline:"You only score by drifting. Chain it, bank it, don't crash.",
medal3:"GOLD",medal2:"SILVER",medal1:"BRONZE",medal0:"NO MEDAL",
next:"Next medal",
tip:"Hold the slide to build combo; straighten up to bank the points. Crash and you lose what's unbanked.",
desc_katana:"Balanced and stylish. The classic.",desc_bandido:"A brute. Raw power, hard to tame.",
desc_hachi:"Light and playful. It dances.",desc_toro:"Wide and stable. Long, lazy slides."},
};

/* ============ save ============ */
const SAVE_KEY="driftyard.save.v1";
const defaults=()=>({lang:(navigator.language||"en").toLowerCase().startsWith("es")?"es":"en",
  sound:true,quality:(navigator.maxTouchPoints>0?"low":"high"),car:0,time:"tarde",best:{},bestDrift:{}});
let save=defaults();
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||"{}"));}catch{}
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch{}};
let L=STR[save.lang];

/* ============ config ============ */
const CFG={step:1/60,session:180,parkW:300,parkD:220,carR:1.35,
  medals:[8000,20000,45000],driftMinDeg:10,driftMinV:6,bankGap:1.2,
  fovBase:60,fovMax:72};
const CARS=[
 {id:"katana",name:"KATANA",file:"car_katana.glb",accel:26,top:46,grip:10.5,turn:2.55,kick:1.1,len:4.5},
 {id:"bandido",name:"BANDIDO",file:"car_bandido.glb",accel:31,top:51,grip:9.0,turn:2.25,kick:1.35,len:4.9},
 {id:"hachi",name:"HACHI",file:"car_hachi.glb",accel:22,top:40,grip:11.5,turn:2.95,kick:.95,len:4.1},
 {id:"toro",name:"TORO",file:"car_toro.glb",accel:27,top:48,grip:9.8,turn:2.45,kick:1.2,len:4.7},
];
const TIMES={
 dia:  {top:0x6fb0f5,bot:0xe8f2fb,sun:0xfff3de,sunI:2.6,sunPos:[140,240,80],hemiI:1.15,hemiSky:0xbcd8f5,hemiGnd:0x6a6a66,fog:0xc3d4e2,fogD:.0009,flood:false,sunSprite:true},
 tarde:{top:0x33507e,bot:0xffab5e,sun:0xffa860,sunI:2.0,sunPos:[-260,90,-40],hemiI:.85,hemiSky:0x8a7a9e,hemiGnd:0x4c4640,fog:0xcfa075,fogD:.0011,flood:false,sunSprite:true},
 noche:{top:0x0a1020,bot:0x27314e,sun:0x9fb2ff,sunI:.9,sunPos:[100,200,-140],hemiI:.6,hemiSky:0x39466e,hemiGnd:0x1c1f2a,fog:0x131a2e,fogD:.0013,flood:true,sunSprite:false},
};
const Q=new URLSearchParams(location.search);
const DEV=Q.has("dev");
if(DEV)document.getElementById("dev").style.display="block";

/* ============ asset base ============ */
const PRIMARY=window.__BASE+"assets/";
const ALT=(window.__BASE==="./"&&window.__CDN_OK)
  ?"https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@f1ac6b5bbf9c318f40fe7f0a2c76525e51cd7159/drift-yard/assets/"
  :"./assets/";
const url=p=>PRIMARY+p, altUrl=p=>ALT+p;

/* ============ loading ============ */
const loadBar=document.querySelector("#loadbar>div"),loadMsg=document.getElementById("loadmsg");
let loadTotal=0,loadDone=0,loadFailed=[];
function tick(name,ok){loadDone++;if(!ok)loadFailed.push(name);
  loadBar.style.width=(100*loadDone/Math.max(loadTotal,1))+"%";
  loadMsg.textContent=`${L.loading} ${loadDone}/${loadTotal}`;}
const texLoader=new THREE.TextureLoader(),gltfLoader=new GLTFLoader();
function loadTex(p,{srgb=false}={}){loadTotal++;
  return new Promise(res=>{const go=(u,retry)=>texLoader.load(u,t=>{
      if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;tick(p,true);res(t);
    },undefined,()=>retry?go(altUrl(p),false):(tick(p,false),res(null)));
    go(url(p),true);});}
function loadGLB(p){loadTotal++;
  return new Promise(res=>{const go=(u,retry)=>gltfLoader.load(u,g=>{tick(p,true);res(g);},
    undefined,()=>retry?go(altUrl(p),false):(tick(p,false),res(null)));
    go(url(p),true);});}
async function loadAudioBuf(p){loadTotal++;
  const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.arrayBuffer();};
  try{const b=await get(url(p)).catch(()=>get(altUrl(p)));tick(p,true);return b;}
  catch{tick(p,false);return null;}}

/* ============ audio ============ */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,master=null,musicSrc=null,engineSrc=null,engineGain=null,skidSrc=null,skidGain=null;
const MIX={music:.15,sfx:.35,engine:.2,skid:.3};
const SND={};
function audioInit(){if(actx||!AC)return;actx=new AC();master=actx.createGain();master.gain.value=.8;master.connect(actx.destination);}
async function decodeAll(){if(!actx)return;for(const k in SND){const s=SND[k];
  if(s&&s.raw&&!s.buf){try{s.buf=await actx.decodeAudioData(s.raw.slice(0));}catch{}}}}
function sfx(n,vol=1,rate=1){const s=SND[n];if(!save.sound||!actx||!s||!s.buf)return;
  const src=actx.createBufferSource();src.buffer=s.buf;src.playbackRate.value=rate;
  const g=actx.createGain();g.gain.value=MIX.sfx*vol;src.connect(g);g.connect(master);src.start();}
function music(n){stopMusic();const s=SND[n];if(!save.sound||!actx||!s||!s.buf)return;
  musicSrc=actx.createBufferSource();musicSrc.buffer=s.buf;musicSrc.loop=true;
  const g=actx.createGain();g.gain.value=MIX.music;musicSrc.connect(g);g.connect(master);musicSrc.start();}
function stopMusic(){if(musicSrc){try{musicSrc.stop();}catch{}musicSrc=null;}}
function loopStart(name,ref,gainRef){const s=SND[name];if(!save.sound||!actx||!s||!s.buf||ref.src)return;
  ref.src=actx.createBufferSource();ref.src.buffer=s.buf;ref.src.loop=true;
  ref.gain=actx.createGain();ref.gain.gain.value=0;ref.src.connect(ref.gain);ref.gain.connect(master);ref.src.start();}
const engineRef={src:null,gain:null},skidRef={src:null,gain:null};
function loopsStart(){loopStart("sfx_engine",engineRef);loopStart("sfx_skid_loop",skidRef);}
function loopsStop(){for(const r of[engineRef,skidRef]){if(r.src){try{r.src.stop();}catch{}r.src=null;}}}
function engineSet(r){if(engineRef.src){engineRef.gain.gain.value=MIX.engine*(.4+.6*r);
  engineRef.src.playbackRate.value=.5+1.4*r;}}
function skidSet(v){if(skidRef.src)skidRef.gain.gain.value=MIX.skid*v;}
function applySound(){if(!save.sound){stopMusic();loopsStop();}
  else{music(mode==="race"?"music_drift":"music_menu");if(mode==="race")loopsStart();}}

/* ============ input ============ */
const BIND={KeyW:"up",KeyS:"down",KeyA:"left",KeyD:"right",ArrowUp:"up",ArrowDown:"down",
  ArrowLeft:"left",ArrowRight:"right",Space:"hand",Enter:"ok",KeyP:"pause",Escape:"pause"};
const held=new Set();const pressed=[];
addEventListener("keydown",e=>{const c=BIND[e.code];if(c){if(!held.has(c))pressed.push(c);held.add(c);e.preventDefault();}});
addEventListener("keyup",e=>{const c=BIND[e.code];if(c)held.delete(c);});
const PADB={0:"okA",1:"back",9:"pause",12:"up",13:"down",14:"left",15:"right"};
let padPrev={},padSteer=0,padGas=0,padBrake=0;
function pollPads(){padSteer=0;padGas=0;padBrake=0;const cur={};
  for(const gp of(navigator.getGamepads?navigator.getGamepads():[])){if(!gp)continue;
    const ax=gp.axes[0]||0;if(Math.abs(ax)>.15)padSteer=ax;
    padGas=Math.max(padGas,gp.buttons[7]?gp.buttons[7].value:0);
    padBrake=Math.max(padBrake,gp.buttons[6]?gp.buttons[6].value:0);
    for(const i in PADB)cur[i]=cur[i]||(gp.buttons[i]&&gp.buttons[i].pressed);}
  for(const i in PADB){const nm=PADB[i];
    if(cur[i]&&!padPrev[i])pressed.push(nm==="okA"?"ok":nm);
    if(cur[i])held.add("pad_"+nm);else held.delete("pad_"+nm);padPrev[i]=cur[i];}}
let touchDevice=false;
const tstate={left:false,right:false,gas:false,brake:false,hand:false};
for(const id of["tleft","tright","tgas","tbrake","thand"]){
  const el=document.getElementById(id),key=id.slice(1);
  const on=e=>{e.preventDefault();touchDevice=true;interact();tstate[key]=true;el.classList.add("active");};
  const off=e=>{e.preventDefault();tstate[key]=false;el.classList.remove("active");};
  el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);on(e);});
  el.addEventListener("pointerup",off);el.addEventListener("pointercancel",off);}
addEventListener("pointerdown",()=>{interact();},{capture:true});
addEventListener("touchstart",()=>{touchDevice=true;refreshTouchUI();},{passive:true,capture:true});
function commands(){return{
  steer:(Math.abs(padSteer)>.15?padSteer:0)+((held.has("left")||held.has("pad_left")||tstate.left)?-1:0)
        +((held.has("right")||held.has("pad_right")||tstate.right)?1:0),
  up:held.has("up")||padGas>.08||tstate.gas,
  down:held.has("down")||held.has("pad_down")||padBrake>.08||tstate.brake,
  hand:held.has("hand")||held.has("pad_okA")||tstate.hand};}
function refreshTouchUI(){document.getElementById("touch").style.display=
  (touchDevice&&mode==="race")?"block":"none";}

/* ============ renderer / scenes ============ */
const canvas=document.getElementById("gl");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();
const garageScene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(CFG.fovBase,innerWidth/innerHeight,.4,3000);
function applyQuality(){const high=save.quality==="high";
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,high?1.75:1));
  renderer.shadowMap.enabled=high;renderer.shadowMap.type=THREE.PCFSoftShadowMap;}
function resize(){renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener("resize",resize);

const hemi=new THREE.HemisphereLight(0x8a7a9e,0x4c4640,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffa860,2.0);scene.add(sun);
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-170;sun.shadow.camera.right=170;
sun.shadow.camera.top=170;sun.shadow.camera.bottom=-170;
sun.shadow.camera.near=20;sun.shadow.camera.far=800;sun.shadow.bias=-.0004;
const floods=[];

function canvasTex(w,h,draw,{srgb=true}={}){const c=document.createElement("canvas");c.width=w;c.height=h;
  draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;}
function skyTexFor(tk){const T=TIMES[tk];
  return canvasTex(64,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);
    const c1="#"+T.top.toString(16).padStart(6,"0"),c2="#"+T.bot.toString(16).padStart(6,"0");
    gr.addColorStop(0,c1);gr.addColorStop(.62,c1);gr.addColorStop(1,c2);
    g.fillStyle=gr;g.fillRect(0,0,w,h);});}
const glowTex=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  r.addColorStop(0,"rgba(255,245,220,1)");r.addColorStop(.5,"rgba(255,220,160,.5)");r.addColorStop(1,"rgba(255,220,160,0)");
  g.fillStyle=r;g.fillRect(0,0,w,h);});
const smokeTex=canvasTex(64,64,(g,w,h)=>{const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  r.addColorStop(0,"rgba(230,228,224,.9)");r.addColorStop(.6,"rgba(220,218,214,.35)");r.addColorStop(1,"rgba(220,218,214,0)");
  g.fillStyle=r;g.fillRect(0,0,w,h);});
/* painted floor markings — seeded, per FORMULA (worn white/safety-yellow/orange) */
function markingsTex(){return canvasTex(2048,2048,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  const px=(x)=>(x/CFG.parkW+.5)*w, pz=(z)=>(z/CFG.parkD+.5)*h;
  g.globalAlpha=.5;g.lineWidth=10;
  const circle=(x,z,r,color)=>{g.strokeStyle=color;g.beginPath();
    g.arc(px(x),pz(z),r/CFG.parkW*w,0,7);g.stroke();};
  circle(-70,-52,18,"#e8e4da");circle(-70,-52,10,"#ff7a1a");
  circle(60,58,22,"#e8e4da");circle(60,58,13,"#ffd23c");
  circle(24,-62,14,"#e8e4da");circle(86,-76,11,"#e8e4da");
  circle(-16,-86,9,"#ffd23c");circle(-108,44,12,"#e8e4da");
  g.setLineDash([40,30]);g.strokeStyle="#e8e4da";g.lineWidth=8;
  g.beginPath();g.moveTo(px(-120),pz(60));g.bezierCurveTo(px(-40),pz(85),px(30),pz(20),px(110),pz(55));g.stroke();
  g.beginPath();g.moveTo(px(-110),pz(-70));g.bezierCurveTo(px(-30),pz(-95),px(40),pz(-30),px(120),pz(-60));g.stroke();
  g.setLineDash([]);
  g.globalAlpha=.35;g.fillStyle="#ffd23c";
  for(const[x,z]of[[-30,10],[85,-15],[-100,-15]]){g.save();g.translate(px(x),pz(z));
    g.rotate((x+z)%3);g.fillRect(-60,-8,120,16);g.restore();}
  // scattered old rubber
  g.globalAlpha=.16;g.strokeStyle="#111";
  let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let i=0;i<130;i++){g.lineWidth=6+rnd()*10;g.beginPath();
    const x=rnd()*w,y=rnd()*h,a=rnd()*6.3,l=60+rnd()*260,c=(rnd()-.5)*2;
    g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+c)*l*.5,y+Math.sin(a+c)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
});}

/* ============ RNG ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function normalizeModel(glb,{length=null,height=null,rotY=0}={}){
  if(!glb)return null;
  const root=glb.scene.clone(true);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;
    if(o.material&&o.material.transparent){o.material=o.material.clone();
      o.material.transparent=false;o.material.alphaTest=.5;o.material.depthWrite=true;}}});
  const g=new THREE.Group();g.add(root);
  root.rotation.y=rotY;
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3());
  let s=1;
  if(length)s=length/Math.max(size.z,1e-4);
  else if(height)s=height/Math.max(size.y,1e-4);
  root.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(root);
  const c=b2.getCenter(new THREE.Vector3());
  root.position.x-=c.x;root.position.z-=c.z;root.position.y-=b2.min.y;
  return g;}
function autoCar(glb,len){if(!glb)return null;
  const probe=new THREE.Box3().setFromObject(glb.scene);
  const sz=probe.getSize(new THREE.Vector3());
  return normalizeModel(glb,{length:len,rotY:sz.x>sz.z?Math.PI/2:0});}
/* merge a normalized model into ONE geometry+material so it can be instanced */
function mergedForInstancing(glb,opts){
  const g=normalizeModel(glb,opts);if(!g)return null;
  g.updateMatrixWorld(true);
  const geos=[];let mat=null;
  g.traverse(o=>{if(o.isMesh){const geo=o.geometry.clone();geo.applyMatrix4(o.matrixWorld);
    for(const n of Object.keys(geo.attributes))if(!["position","normal","uv"].includes(n))geo.deleteAttribute(n);
    geos.push(geo);if(!mat)mat=o.material;}});
  if(!geos.length)return null;
  let geo=geos[0];
  if(geos.length>1){let tot=geos[0];for(let i=1;i<geos.length;i++){/* keep first material; merge is fine for Meshy single-mat models */}
    geo=geos[0];}
  return{geo,mat};}

  if(factT){const f=factT.clone(true);f.position.set(-W-84,0,-30);f.rotation.y=Math.PI/2;group.add(f);
    chimneys.push({x:-W-84,y:23,z:-38},{x:-W-84,y:23,z:-22});}
  const siloT=normalizeModel(A.glb.silo,{height:16});
  if(siloT)for(const z of[30,52]){const s2=siloT.clone(true);
    s2.position.set(-W-64,0,z);group.add(s2);}
  // warehouses south + offices scattered
  if(wh)for(let i=0;i<5;i++){const c=wh.clone(true);
    c.position.set(-W+30+i*58,0,D+38);c.rotation.y=Math.PI;group.add(c);}
  if(of){const org2=mulberry32(31);
    for(let i=0;i<9;i++){const c=of.clone(true);
      const side=i%2?1:-1;const sc=.7+org2()*.7;
      c.scale.multiplyScalar(sc);
      c.position.set(side*(W+66+org2()*100),0,-D+40+org2()*(CFG.parkD+40));
      c.rotation.y=Math.floor(org2()*4)*Math.PI/2;group.add(c);}
    for(let i=0;i<4;i++){const c=of.clone(true);const sc=.8+org2()*.6;
      c.scale.multiplyScalar(sc);
      c.position.set(-W+40+i*80,0,D+96+org2()*40);group.add(c);}}

  /* sky: 360 equirect panorama if generated, gradient fallback */
  const skyMap=A.img["sky_"+timeKey]||skyTexFor(timeKey);
  const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,32,16),
    new THREE.MeshBasicMaterial({map:skyMap,side:THREE.BackSide,fog:false}));
  group.add(sky);
  if(T.sunSprite){const s2=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,
    color:timeKey==="dia"?0xfff6e0:0xffb060,transparent:true,depthWrite:false,fog:false}));
    s2.scale.setScalar(timeKey==="dia"?260:420);
    s2.position.set(T.sunPos[0]*8,T.sunPos[1]*(timeKey==="dia"?7:3),T.sunPos[2]*8);group.add(s2);}
  else{const m=new THREE.Mesh(new THREE.CircleGeometry(28,24),
    new THREE.MeshBasicMaterial({color:0xe8ecf5,fog:false}));
    m.position.set(600,700,-1200);m.lookAt(0,0,0);group.add(m);}

  /* lighting per time */
  hemi.color.set(T.hemiSky);hemi.groundColor.set(T.hemiGnd);hemi.intensity=T.hemiI;
  sun.color.set(T.sun);sun.intensity=T.sunI;
  sun.position.set(T.sunPos[0],T.sunPos[1],T.sunPos[2]);
  sun.target.position.set(0,0,0);scene.add(sun.target);
  sun.castShadow=save.quality==="high";
  scene.fog=new THREE.FogExp2(T.fog,T.fogD);

  return{group,colliders,timeKey,chimneys};
}

/* ============ drift physics ============ */
const V=new THREE.Vector3();
function update(dt){
  if(mode==="garage"&&garageCar){garageCar.rotation.y+=dt*.5;return;}
  if(mode!=="race"||!sess)return;
  const s=sess,cmd=commands(),st=s.stats;
  if(s.go>0){s.go-=dt;if(s.go<=0)document.getElementById("toast").style.opacity=0;}
  if(!s.over){s.t-=dt;if(s.t<=0){s.t=0;endSession();}}
  s.shake=Math.max(0,s.shake-dt*3*s.shake);

  const steer=Math.max(-1,Math.min(1,cmd.steer));
  s.steerVis+=(steer-s.steerVis)*Math.min(1,dt*9);
  const sinH=Math.sin(s.h),cosH=Math.cos(s.h);
  // decompose velocity into car frame
  let vF=s.vx*sinH+s.vz*cosH;
  let vL=s.vx*cosH-s.vz*sinH;
  const speed=Math.hypot(s.vx,s.vz);
  // longitudinal
  if(!s.over&&cmd.up)vF+=st.accel*dt;
  else if(!s.over&&cmd.down)vF-=(vF>1?46:14)*dt;
  else vF-=vF*.45*dt;
  if(s.over)vF-=vF*1.2*dt;
  vF=Math.max(-9,Math.min(vF,st.top));
  // lateral grip (handbrake or power-over drops it)
  let grip=st.grip;
  const hand=cmd.hand&&!s.over;
  if(hand)grip*=.22;
  else if(cmd.up&&Math.abs(steer)>.55&&vF>14)grip*=.5;
  vL-=vL*Math.min(1,grip*dt);
  if(hand&&Math.abs(steer)>.05)vL-=steer*st.kick*Math.max(vF,0)*.8*dt;
  // yaw
  const beta=Math.atan2(vL,Math.max(Math.abs(vF),.6));
  const driftFactor=Math.min(Math.abs(beta)*1.4,1);
  s.h+=steer*st.turn*dt*Math.max(-1,Math.min(vF/9,1))*(1+driftFactor*.7);
  s.h-=beta*.55*dt; // self-align
  // recompose in the OLD frame — the heading change shows up as slip next tick
  s.vx=sinH*vF+cosH*vL;s.vz=cosH*vF-sinH*vL;
  s.x+=s.vx*dt;s.z+=s.vz*dt;
  s.beta=beta;s.speed=speed;

  /* collisions */
  let hit=false;
  const W=CFG.parkW/2-CFG.carR,D=CFG.parkD/2-CFG.carR;
  if(s.x<-W){s.x=-W;s.vx=Math.abs(s.vx)*.35;hit=speed>7;}
  if(s.x>W){s.x=W;s.vx=-Math.abs(s.vx)*.35;hit=hit||speed>7;}
  if(s.z<-D){s.z=-D;s.vz=Math.abs(s.vz)*.35;hit=hit||speed>7;}
  if(s.z>D){s.z=D;s.vz=-Math.abs(s.vz)*.35;hit=hit||speed>7;}
  for(const c of world.colliders){
    if(c.type==="circle"){const dx=s.x-c.x,dz=s.z-c.z,d=Math.hypot(dx,dz),m=c.r+CFG.carR;
      if(d<m&&d>1e-4){s.x=c.x+dx/d*m;s.z=c.z+dz/d*m;
        const dot=(s.vx*dx+s.vz*dz)/d;
        if(dot<0){s.vx-=1.5*dot*dx/d;s.vz-=1.5*dot*dz/d;s.vx*=.88;s.vz*=.88;hit=hit||speed>7;}}}
    else if(c.type==="capsule"){
      const abx=c.bx-c.ax,abz=c.bz-c.az;
      const tt=Math.max(0,Math.min(1,((s.x-c.ax)*abx+(s.z-c.az)*abz)/(abx*abx+abz*abz)));
      const qx=c.ax+abx*tt,qz=c.az+abz*tt;
      const dx=s.x-qx,dz=s.z-qz,d=Math.hypot(dx,dz),m=c.r+CFG.carR;
      if(d<m&&d>1e-4){s.x=qx+dx/d*m;s.z=qz+dz/d*m;
        const dot=(s.vx*dx+s.vz*dz)/d;
        if(dot<0){s.vx-=1.5*dot*dx/d;s.vz-=1.5*dot*dz/d;s.vx*=.88;s.vz*=.88;hit=hit||speed>7;}}}
    else{ // obb
      const dx=s.x-c.x,dz=s.z-c.z;
      const lx=dx*c.cos-dz*c.sin,lz=dx*c.sin+dz*c.cos;
      const px2=Math.max(-c.hw,Math.min(lx,c.hw)),pz2=Math.max(-c.hd,Math.min(lz,c.hd));
      const ddx=lx-px2,ddz=lz-pz2,d=Math.hypot(ddx,ddz);
      if(d<CFG.carR){
        const push=(CFG.carR-d)||CFG.carR;
        let nx,nz;
        if(d>1e-4){nx=ddx/d;nz=ddz/d;}
        else{const ex=c.hw-Math.abs(lx),ez=c.hd-Math.abs(lz);
          if(ex<ez){nx=Math.sign(lx)||1;nz=0;}else{nx=0;nz=Math.sign(lz)||1;}}
        const wx=nx*c.cos+nz*c.sin, wz=-nx*c.sin+nz*c.cos;
        s.x+=wx*push;s.z+=wz*push;
        const dot=s.vx*wx+s.vz*wz;
        if(dot<0){s.vx-=1.6*dot*wx;s.vz-=1.6*dot*wz;s.vx*=.85;s.vz*=.85;hit=hit||speed>7;}}}}
  if(hit){sfx("sfx_crash",Math.min(1,speed/25),1);s.shake=1;
    if(s.cur>0){s.cur=0;s.combo=1;s.driftT=0;toast(L.comboLost,"var(--red)");}}

  /* drift scoring */
  const betaDeg=Math.abs(beta)*57.29578;
  const drifting=!s.over&&betaDeg>CFG.driftMinDeg&&speed>CFG.driftMinV;
  if(drifting){
    s.driftT+=dt;s.gapT=0;
    s.combo=Math.min(5,s.combo+dt*.22);
    s.cur+=speed*betaDeg*.085*dt*s.combo;
  }else if(s.cur>0){
    s.gapT+=dt;
    if(s.gapT>CFG.bankGap){ // bank!
      const pts=Math.round(s.cur);
      s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);
      s.cur=0;s.combo=1;s.driftT=0;
      sfx("sfx_chime",.7,1.2);toast("+"+fmtN(pts),"var(--yel)");}}

  /* audio */
  engineSet(Math.min(1,Math.abs(vF)/st.top));
  skidSet(drifting?Math.min(1,betaDeg/40)*(speed/st.top+.4):0);

  /* fx */
  if(drifting&&speed>8){spawnSmoke(s);writeMark(s);}
  s.chimT=(s.chimT||0)-dt;
  if(world.chimneys&&world.chimneys.length&&s.chimT<=0){s.chimT=.5;
    for(const c of world.chimneys)spawnPuffAt(c.x+(Math.random()-.5),c.y,c.z+(Math.random()-.5),2.2);}

  /* place car + camera */
  s.obj.position.set(s.x,0,s.z);
  s.obj.rotation.set(0,s.h,0);
  s.obj.rotateZ(-s.steerVis*.04*Math.min(1,speed/25));
  let dy=s.h-s.camYaw;while(dy>Math.PI)dy-=2*Math.PI;while(dy<-Math.PI)dy+=2*Math.PI;
  s.camYaw+=dy*Math.min(1,dt*4.4);
  const cx=s.x-Math.sin(s.camYaw)*7.8,cz=s.z-Math.cos(s.camYaw)*7.8;
  camera.position.lerp(V.set(cx,3.1,cz),1-Math.pow(.0001,dt));
  // never let the chase cam fall inside the car
  {const ddx=camera.position.x-s.x,ddz=camera.position.z-s.z;
   const d=Math.hypot(ddx,ddz);
   if(d<5.5){const k=5.5/Math.max(d,.001);
     camera.position.x=s.x+ddx*k;camera.position.z=s.z+ddz*k;}
   camera.position.y=Math.max(camera.position.y,2.6);}
  if(s.shake>.02){camera.position.x+=(Math.random()-.5)*.4*s.shake;
    camera.position.y+=(Math.random()-.5)*.25*s.shake;}
  camera.lookAt(s.x+Math.sin(s.h)*3,1.1,s.z+Math.cos(s.h)*3);
  const fovT=CFG.fovBase+(CFG.fovMax-CFG.fovBase)*Math.min(1,speed/st.top);
  camera.fov+=(fovT-camera.fov)*.06;camera.updateProjectionMatrix();
}

/* ============ skid marks (persistent ring buffer) ============ */
const MARKN=2200;
let markGeo=null,markMesh=null,markHead=0;
function initMarks(){
  markGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(MARKN*4*3);
  const idx=new Uint32Array(MARKN*6);
  for(let i=0;i<MARKN;i++){const a=i*4;idx.set([a,a+2,a+1,a+1,a+2,a+3],i*6);}
  markGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  markGeo.setIndex(new THREE.BufferAttribute(idx,1));
  markMesh=new THREE.Mesh(markGeo,new THREE.MeshBasicMaterial({color:0x131215,
    transparent:true,opacity:.5,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2}));
  markMesh.frustumCulled=false;scene.add(markMesh);}
let lastMark={x:0,z:0,h:0,has:false};
function writeMark(s){
  if(lastMark.has&&Math.hypot(s.x-lastMark.x,s.z-lastMark.z)<.6)return;
  const pos=markGeo.attributes.position.array;
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  // rear axle, two wheels
  for(const side of[-1,1]){
    const w=.78*side;
    const rx=s.x-sh*1.4+ch*w, rz=s.z-ch*1.4-sh*w;
    const lx=lastMark.has?lastMark.x-Math.sin(lastMark.h)*1.4+Math.cos(lastMark.h)*w:rx-sh*.6,
          lz=lastMark.has?lastMark.z-Math.cos(lastMark.h)*1.4-Math.sin(lastMark.h)*w:rz-ch*.6;
    const j=markHead=(markHead+1)%MARKN;
    const o=j*12;
    const px=ch*.14,pz=-sh*.14;
    pos[o]=lx-px;pos[o+1]=.03;pos[o+2]=lz-pz;
    pos[o+3]=lx+px;pos[o+4]=.03;pos[o+5]=lz+pz;
    pos[o+6]=rx-px;pos[o+7]=.03;pos[o+8]=rz-pz;
    pos[o+9]=rx+px;pos[o+10]=.03;pos[o+11]=rz+pz;}
  markGeo.attributes.position.needsUpdate=true;
  lastMark={x:s.x,z:s.z,h:s.h,has:true};}
function clearMarks(){if(!markGeo)return;
  markGeo.attributes.position.array.fill(0);
  markGeo.attributes.position.needsUpdate=true;lastMark.has=false;}

/* ============ smoke ============ */
const SMOKEN=320;
let smokeGeo=null,smokePts=null;
const smokeLife=new Float32Array(SMOKEN);
const smokeVel=new Float32Array(SMOKEN*3);
let smokeHead=0;
function initSmoke(){
  smokeGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(SMOKEN*3);pos.fill(-9999);
  smokeGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  smokePts=new THREE.Points(smokeGeo,new THREE.PointsMaterial({map:smokeTex,size:3.6,
    transparent:true,opacity:.3,depthWrite:false,color:0xd8d5d0}));
  smokePts.frustumCulled=false;scene.add(smokePts);}
function spawnPuffAt(x,y,z,vy=1.6){
  const j=smokeHead=(smokeHead+1)%SMOKEN,o=j*3;
  const pos=smokeGeo.attributes.position.array;
  pos[o]=x;pos[o+1]=y;pos[o+2]=z;
  smokeVel[o]=(Math.random()-.5)*.8;smokeVel[o+1]=vy+Math.random();smokeVel[o+2]=(Math.random()-.5)*.8;
  smokeLife[j]=2.4;}
function spawnSmoke(s){
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1])
    spawnPuffAt(s.x-sh*1.4+ch*.8*side,.3,s.z-ch*1.4-sh*.8*side,1.2+Math.random());}
function updateSmoke(dt){let any=false;
  const pos=smokeGeo.attributes.position.array;
  for(let j=0;j<SMOKEN;j++){if(smokeLife[j]<=0)continue;any=true;
    smokeLife[j]-=dt;const o=j*3;
    pos[o]+=smokeVel[o]*dt;pos[o+1]+=smokeVel[o+1]*dt;pos[o+2]+=smokeVel[o+2]*dt;
    if(smokeLife[j]<=0)pos[o+1]=-9999;}
  if(any)smokeGeo.attributes.position.needsUpdate=true;}
function clearSmoke(){if(!smokeGeo)return;
  smokeGeo.attributes.position.array.fill(-9999);smokeLife.fill(0);
  smokeGeo.attributes.position.needsUpdate=true;}

function toast(t,color){elToast.textContent=t;elToast.style.color=color||"var(--yel)";
  elToast.style.opacity=1;toastT=1.3;}
function fmtN(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function fmtT(s){const m=Math.floor(s/60);return`${m}:${String(Math.floor(s-m*60)).padStart(2,"0")}`;}
function drawHud(dt){if(!sess)return;
  if(toastT>0){toastT-=dt;if(toastT<=0&&sess.go<=0)elToast.style.opacity=0;}

/* ============ screens ============ */
S={loading:document.getElementById("s_loading"),title:document.getElementById("s_title"),
  time:document.getElementById("s_time"),pause:document.getElementById("s_pause"),
  results:document.getElementById("s_results")};
const hud=document.getElementById("hud"),garageUI=document.getElementById("garage_ui");
let focusIdx=0,focusList=[];
function show(name){for(const k in S)S[k].classList.toggle("hidden",k!==name);
  mode=name in S?name:name;
  hud.style.display=name==="race"?"block":"none";
  garageUI.style.display=name==="garage"?"block":"none";
  if(name==="race"||name==="garage")for(const k in S)S[k].classList.add("hidden");
  refreshTouchUI();focusIdx=0;refreshFocus();}
function refreshFocus(){focusList=[...document.querySelectorAll(".screen:not(.hidden) .btn:not(:disabled), #garage_ui .btn:not(:disabled)")]
  .filter(b=>b.offsetParent!==null);
  focusList.forEach((b,i)=>b.classList.toggle("focus",i===focusIdx));}
function menuNav(){while(pressed.length){const c=pressed.shift();
  if(mode==="race"){if(c==="pause")togglePause();continue;}
  if(mode==="garage"){
    if(c==="left"){cycleCar(-1);continue;}
    if(c==="right"){cycleCar(1);continue;}
    if(c==="ok"){buildTimeSel();continue;}
    if(c==="back"||c==="pause"){buildTitle();continue;}}
  if(!focusList.length){refreshFocus();if(!focusList.length)continue;}
  if(c==="up"||c==="left"){focusIdx=(focusIdx-1+focusList.length)%focusList.length;refreshFocus();}
  if(c==="down"||c==="right"){focusIdx=(focusIdx+1)%focusList.length;refreshFocus();}
  if(c==="ok"){const b=focusList[focusIdx];if(b)b.click();}
  if(c==="pause"||c==="back"){if(mode==="pause")togglePause();
    else if(mode==="time")buildGarageUI();}}}
function btn(label,cb,{sub=null,disabled=false}={}){const b=document.createElement("button");
  b.className="btn";b.disabled=disabled;b.innerHTML=label+(sub?`<small>${sub}</small>`:"");
  b.addEventListener("click",()=>{interact();cb();});return b;}
function bgOf(el){el.style.backgroundImage=`url('${url("images/menu_bg.jpg")}')`;}

function buildTitle(){const s=S.title;s.innerHTML="";bgOf(s);
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const logo=document.createElement("img");logo.id="logo";logo.src=url("images/logo.png");
  logo.onerror=()=>{logo.remove();const t=document.createElement("div");
    t.className="title-xl";t.innerHTML='DRIFT <span class="org">YARD</span>';s.prepend(t);};
  s.appendChild(logo);
  const tag=document.createElement("div");tag.className="tagline";tag.textContent=L.tagline;s.appendChild(tag);
  s.appendChild(btn(L.play,()=>buildGarageUI()));
  s.appendChild(btn(save.lang==="es"?STR.es.language:STR.en.language,()=>{
    save.lang=save.lang==="es"?"en":"es";L=STR[save.lang];persist();buildTitle();}));
  s.appendChild(btn(save.sound?L.sound_on:L.sound_off,()=>{save.sound=!save.sound;persist();applySound();buildTitle();}));
  s.appendChild(btn(save.quality==="high"?L.q_high:L.q_low,()=>{
    save.quality=save.quality==="high"?"low":"high";persist();applyQuality();buildTitle();},{sub:L.qnote}));
  const h=document.createElement("div");h.className="hint";
  h.innerHTML=(touchDevice?L.controlsTouch:L.controlsKeys+"<br>"+L.controlsPad)+"<br>"+L.madeWith;
  s.appendChild(h);show("title");}

function cycleCar(d){save.car=(save.car+d+CARS.length)%CARS.length;persist();buildGarage();fillGarageUI();}
function fillGarageUI(){
  const c=CARS[save.car];
  document.getElementById("carname").innerHTML=c.name.slice(0,-1)+`<span class="org">${c.name.slice(-1)}</span>`;
  document.getElementById("cardesc").textContent=L["desc_"+c.id];
  const st=document.getElementById("stats");st.innerHTML="";
  const mk=(lab,v)=>{const d2=document.createElement("div");d2.className="stat";
    d2.innerHTML=`<span style="width:34%">${lab}</span><div class="bar"><div style="width:${Math.round(v*100)}%"></div></div>`;
    st.appendChild(d2);};
  mk(L.power,(c.accel-20)/12);mk(L.grip,(c.grip-8.5)/3.5);mk(L.turn,(c.turn-2.1)/1);mk(L.kick,(c.kick-.8)/.7);
  const best=save.best[c.id];
  document.getElementById("gbest").textContent=`${L.best}: ${best?fmtN(best):L.noBest}`;
  const gb=document.getElementById("gbottom");gb.innerHTML="";
  const bb=btn(L.back,()=>buildTitle());bb.style.minWidth="30vw";gb.appendChild(bb);
  const cb=btn(L.choose+" ▸",()=>buildTimeSel());cb.style.minWidth="42vw";gb.appendChild(cb);
  refreshFocus();}
function buildGarageUI(){prepareCars();buildGarage();
  camera.position.set(0,2.4,8.4);camera.lookAt(0,.9,0);
  camera.fov=CFG.fovBase;camera.updateProjectionMatrix();
  fillGarageUI();show("garage");
  document.getElementById("gprev").onclick=()=>{interact();cycleCar(-1);};
  document.getElementById("gnext").onclick=()=>{interact();cycleCar(1);};}

function buildTimeSel(){const s=S.time;s.innerHTML="";bgOf(s);
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.chooseTime;s.appendChild(t);
  const list=document.createElement("div");list.className="rowlist";s.appendChild(list);
  const opts=[["dia","☀️ "+L.dia],["tarde","🌇 "+L.tarde],["noche","🌙 "+L.noche]];
  for(const[k,label]of opts)list.appendChild(btn(label,()=>{save.time=k;persist();startSession();}));
  s.appendChild(btn(L.back,()=>buildGarageUI()));
  show("time");
  focusIdx=["dia","tarde","noche"].indexOf(save.time);refreshFocus();}

function buildPause(){const s=S.pause;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl org";t.textContent=L.paused;s.appendChild(t);
  s.appendChild(btn(L.resume,()=>togglePause()));
  s.appendChild(btn(L.restart,()=>startSession()));
  s.appendChild(btn(save.sound?L.sound_on:L.sound_off,()=>{save.sound=!save.sound;persist();applySound();buildPause();}));
  s.appendChild(btn(L.exit,()=>{loopsStop();disposeWorld();sess=null;music("music_menu");buildGarageUI();}));
  show("pause");}

function endSession(){const s=sess;s.over=true;
  loopsStop();
  // bank whatever is pending
  if(s.cur>0){const pts=Math.round(s.cur);s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);s.cur=0;}
  const id=CARS[save.car].id;
  s.total=Math.round(s.total);
  if(!s.saved){s.saved=true;
    if(!save.best[id]||s.total>save.best[id]){save.best[id]=s.total;s.record=true;}
    if(!save.bestDrift[id]||s.bestDrift>save.bestDrift[id])save.bestDrift[id]=s.bestDrift;
    persist();}
  toast(L.timeUp,"var(--org)");
  setTimeout(()=>{if(mode==="race")showResults();},1800);}

function medalFor(score){let m=0;for(let i=0;i<3;i++)if(score>=CFG.medals[i])m=i+1;return m;}
function showResults(){const s=S.results;s.innerHTML="";bgOf(s);
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  music("music_menu");
  const r=sess,m=medalFor(r.total);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.results;s.appendChild(t);
  const md=document.createElement("div");md.className="medal";
  md.innerHTML=["<span style='color:#888'>—</span>","🥉","🥈","🥇"][m]+
    ` <span class="${m===3?'yel':''}" style="font-size:.55em">${L["medal"+m]}</span>`;
  s.appendChild(md);
  const g=document.createElement("div");g.className="results-grid";
  g.innerHTML=`${L.score}: <span class="org">${fmtN(r.total)}</span><br>
    ${L.bestDrift}: ${fmtN(r.bestDrift)}`
    +(r.record?`<br><span class="yel">${L.newRecord}</span>`:"")
    +(m<3?`<br><span class="hint">${L.next}: ${fmtN(CFG.medals[m])}</span>`:"");
  s.appendChild(g);
  s.appendChild(btn(L.retry,()=>startSession()));
  s.appendChild(btn(L.garage,()=>{disposeWorld();sess=null;buildGarageUI();}));
  s.appendChild(btn(L.menu,()=>{disposeWorld();sess=null;buildTitle();}));
  show("results");}

function startSession(){applyQuality();
  sess=newSession();show("race");
  music("music_drift");loopsStart();
  camera.position.set(sess.x-Math.sin(sess.h)*7.6,3.1,sess.z-Math.cos(sess.h)*7.6);
  camera.lookAt(sess.x,1,sess.z);
  toast(L.go,"var(--org)");}
function togglePause(){if(mode==="race"&&sess&&!sess.over){buildPause();loopsStop();}
  else if(mode==="pause"){show("race");loopsStart();}}
document.getElementById("pausebtn").addEventListener("click",()=>togglePause());
addEventListener("blur",()=>{if(mode==="race")togglePause();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="race")togglePause();});
let interacted=false;
function interact(){if(interacted)return;interacted=true;audioInit();
  decodeAll().then(()=>{if(mode!=="race")music("music_menu");});}

/* ============ main loop ============ */
let last=performance.now(),acc=0,frames=0,fpsAt=last,fps=0;
const devEl=document.getElementById("dev");
function frame(now){requestAnimationFrame(frame);
  acc+=now-last;last=now;if(acc>250)acc=250;
  pollPads();menuNav();
  const stepMs=CFG.step*1000;
  while(acc>=stepMs){update(CFG.step);updateSmoke(CFG.step);acc-=stepMs;}
  if(mode==="race"||mode==="pause"){drawHud(CFG.step);renderer.render(scene,camera);}
  else if(mode==="garage")renderer.render(garageScene,camera);
  if(DEV){frames++;if(now-fpsAt>=500){fps=Math.round(frames*1000/(now-fpsAt));frames=0;fpsAt=now;}
    devEl.textContent=`${fps} fps calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles/1000|0)}k`
      +(sess?`\nv ${sess.speed.toFixed(1)} beta ${(sess.beta*57.3).toFixed(0)} combo ${sess.combo.toFixed(1)}`:"");}
}

/* ============ dev hook ============ */
if(DEV)window.__dy={
  state:()=>({mode,total:sess&&Math.round(sess.total),cur:sess&&Math.round(sess.cur),
    combo:sess&&+sess.combo.toFixed(2),t:sess&&Math.round(sess.t),
    speed:sess&&+sess.speed.toFixed(1),beta:sess&&+(sess.beta*57.3).toFixed(1),
    x:sess&&+sess.x.toFixed(1),z:sess&&+sess.z.toFixed(1),
    calls:renderer.info.render.calls}),
  sess:()=>sess,world:()=>world,camera,scene,
  timeUp(){if(sess)sess.t=.5;},
  give(n){if(sess)sess.total+=n;}};

/* ============ boot ============ */
(async()=>{
  document.getElementById("logo").src=url("images/logo.png");
  S.loading.style.backgroundImage=`url('${url("images/loading.jpg")}')`;
  loadMsg.textContent=L.loading;
  await loadAll();
  applyQuality();resize();
  prepareCars();initMarks();initSmoke();
  loadMsg.textContent=L.tip;
  setTimeout(()=>{buildTitle();},400);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
