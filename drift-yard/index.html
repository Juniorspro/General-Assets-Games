<title>Drift Yard</title>
<style>
:root{--aw:100vw;--ah:100vh;--vm:100vmin;--ink:#f2efe8;--dim:#9a958c;--bg:#191a1e;--panel:rgba(24,25,30,.82);
  --org:#ff7a1a;--yel:#ffd23c;--red:#e84040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden}
body.rot #app{inset:auto;top:0;left:0;width:100vh;height:100vw; /* unidades de viewport REALES: el propio #app define --aw/--ah */
  transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background-size:cover;background-position:center;text-align:center}
.screen.hidden{display:none}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,15,.55),rgba(12,12,15,.15) 40%,rgba(12,12,15,.65))}
.screen>*{position:relative}
#logo{width:min(calc(var(--ah)*0.4),calc(var(--aw)*0.64));filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tagline{font-style:italic;font-weight:400;opacity:.9;font-size:clamp(13px,calc(var(--ah)*0.022),18px)}
.btn{min-width:min(calc(var(--aw)*0.72),380px);padding:.7em 1.3em;font:900 clamp(14px,calc(var(--ah)*0.025),21px) inherit;letter-spacing:.07em;
  color:var(--ink);background:var(--panel);border:2px solid rgba(242,239,232,.35);border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.focus,.btn:hover:not(:disabled){border-color:var(--org);background:rgba(255,122,26,.18);
  box-shadow:0 0 16px rgba(255,122,26,.35)}
.btn small{display:block;font-weight:400;font-size:.6em;color:var(--dim);margin-top:.22em}
.title-xl{font-size:clamp(22px,calc(var(--ah)*0.052),44px);font-style:italic;letter-spacing:.05em;
  text-shadow:0 3px 0 rgba(0,0,0,.7)}
.org{color:var(--org)}.yel{color:var(--yel)}
.hint{color:var(--dim);font-weight:400;font-size:clamp(11px,calc(var(--ah)*0.018),14px);line-height:1.5}
#loadbar{width:min(calc(var(--aw)*0.7),420px);height:12px;background:var(--panel);border-radius:4px;overflow:hidden;
  border:1px solid rgba(242,239,232,.3)}
#loadbar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--yel),var(--org))}
#loadmsg{font-weight:400;color:var(--dim);font-size:13px}
#buildtag{position:absolute;bottom:8px;right:12px;font-weight:400;color:var(--dim);font-size:11px;opacity:.8}
#garage_ui{position:absolute;inset:0;z-index:10;display:none;pointer-events:none}
#garage_ui .top{position:absolute;top:calc(var(--ah)*0.04);left:0;right:0;text-align:center}
#carname{font-size:clamp(26px,calc(var(--ah)*0.056),50px);font-style:italic;letter-spacing:.08em;text-shadow:0 3px 0 rgba(0,0,0,.7)}
#stats{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--ah)*0.19);width:min(calc(var(--aw)*0.78),420px);
  background:var(--panel);border:1.5px solid rgba(242,239,232,.25);border-radius:10px;padding:10px 16px;text-align:left}
.stat{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:12px;letter-spacing:.15em;color:var(--dim)}
.stat .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.stat .bar>div{height:100%;background:var(--org)}
.garrow{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto;width:calc(var(--vm)*0.14);height:calc(var(--vm)*0.14);
  min-width:54px;min-height:54px;font:900 calc(var(--vm)*0.06) inherit;color:var(--ink);background:var(--panel);
  border:2px solid rgba(242,239,232,.35);border-radius:12px}
#gprev{left:calc(var(--vm)*0.03)}#gnext{right:calc(var(--vm)*0.03)}
.custrow{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px;flex-wrap:wrap}
.cyc{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid rgba(242,239,232,.25);border-radius:8px;padding:3px 6px}
.cyclab{font-size:11px;letter-spacing:.12em;color:var(--dim);min-width:74px;text-align:center}
.cyclab b{display:block;color:var(--ink);font-size:15px}
.btn.mini{min-width:0!important;width:38px;padding:.35em .2em;font-size:16px}
#gbottom{position:absolute;bottom:calc(var(--ah)*0.03);left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:auto}
#gbest{position:absolute;bottom:calc(var(--ah)*0.12);left:0;right:0;text-align:center;color:var(--dim);font-weight:400;font-size:13px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;display:none}
#score{position:absolute;top:calc(var(--ah)*0.016);left:0;right:0;text-align:center;font-style:italic}
#score .total{font-size:clamp(24px,calc(var(--ah)*0.05),44px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#score .cur{font-size:clamp(15px,calc(var(--ah)*0.03),24px);color:var(--org);min-height:1.3em}
#score .cur .combo{color:var(--yel)}
#timer{position:absolute;top:calc(var(--ah)*0.02);right:calc(var(--aw)*0.024);font-size:clamp(17px,calc(var(--ah)*0.034),28px);font-style:italic;text-align:right}
#timer small{display:block;font-size:.55em;color:var(--dim);font-weight:400}
#hpbar{position:absolute;top:calc(var(--ah)*0.075);left:50%;transform:translateX(-50%);width:min(46vw,300px);height:9px;background:rgba(0,0,0,.5);border:1.5px solid rgba(242,239,232,.4);border-radius:5px;overflow:hidden}
#hpbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fd463,#ffd23c 60%,#e84040);transition:width .15s}
#speedo{position:absolute;right:calc(var(--aw)*0.024);bottom:calc(var(--ah)*0.02);text-align:right;font-style:italic}
#speedo .kmh{font-size:clamp(28px,calc(var(--ah)*0.056),48px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#speedo .unit{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.2em}
#speedo .ang{color:var(--org);font-size:clamp(12px,calc(var(--ah)*0.023),17px)}
#cparrow{position:absolute;left:50%;top:calc(var(--ah)*0.11);transform:translateX(-50%);font-size:clamp(22px,calc(var(--ah)*0.046),38px);
  color:var(--org);text-shadow:0 2px 0 rgba(0,0,0,.8);display:none}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:clamp(19px,calc(var(--ah)*0.04),34px);
  font-style:italic;color:var(--yel);text-shadow:0 3px 0 rgba(0,0,0,.8);opacity:0;transition:opacity .15s;white-space:nowrap}
#doorbtn{position:absolute;top:calc(var(--ah)*0.02);left:calc(var(--aw)*0.09);width:42px;height:40px;pointer-events:auto;
  font:16px inherit;background:var(--panel);border:1.5px solid rgba(242,239,232,.4);border-radius:8px}
#actbtn{position:absolute;top:calc(var(--ah)*0.14);left:50%;transform:translateX(-50%);pointer-events:auto;display:none;
  font:900 15px inherit;letter-spacing:.06em;color:var(--ink);background:rgba(190,32,32,.85);border:2px solid #ff5544;
  border-radius:10px;padding:.6em 1.1em;box-shadow:0 0 16px rgba(255,60,40,.5);z-index:7}
#foottouch{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
#foottouch .tbtn{position:absolute}
#camlook{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:calc(var(--vm)*.04);bottom:calc(var(--vm)*.05);width:calc(var(--vm)*.32);height:calc(var(--vm)*.32);
  min-width:128px;min-height:128px;border-radius:50%;background:rgba(20,22,28,.4);border:2px solid rgba(242,239,232,.25);
  pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
#joy.active{border-color:rgba(255,122,26,.6)}
#joyk{width:44%;height:44%;border-radius:50%;background:rgba(242,239,232,.85);border:2px solid rgba(255,122,26,.8);
  box-shadow:0 3px 14px rgba(0,0,0,.5);transform:translate(0,0);transition:transform .05s linear;will-change:transform}
#ftjump{right:calc(var(--vm)*.03);bottom:calc(var(--vm)*.06)}#ftpunch{right:calc(var(--vm)*.2);bottom:calc(var(--vm)*.06)}
#pausebtn{position:absolute;top:calc(var(--ah)*0.02);left:calc(var(--aw)*0.024);width:40px;height:40px;pointer-events:auto;
  font:900 16px inherit;color:var(--ink);background:var(--panel);border:1.5px solid rgba(242,239,232,.35);border-radius:8px}
#touch{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
.tbtn{position:absolute;pointer-events:auto;width:calc(var(--vm)*0.15);height:calc(var(--vm)*0.15);min-width:58px;min-height:58px;
  border-radius:14%;background:var(--panel);border:2px solid rgba(242,239,232,.35);color:var(--ink);
  font:900 calc(var(--vm)*0.048) inherit;display:flex;align-items:center;justify-content:center}
.tbtn.small{font-size:calc(var(--vm)*0.025)}
.tbtn.active{border-color:var(--org);box-shadow:0 0 14px rgba(255,122,26,.5)}
#thand{background:rgba(190,32,32,.85)!important;border-color:#ff5544!important}
#tleft{left:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.04)}#tright{left:calc(var(--vm)*0.2);bottom:calc(var(--vm)*0.04)}
#tgas{right:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.04)}#tbrake{right:calc(var(--vm)*0.2);bottom:calc(var(--vm)*0.04)}#thand{right:calc(var(--vm)*0.03);bottom:calc(var(--vm)*0.21)}
#dev{position:absolute;top:4px;left:52px;color:#0f0;font:12px monospace;display:none;z-index:99;
  background:rgba(0,0,0,.55);padding:2px 6px;pointer-events:none;white-space:pre}
.rowlist{display:flex;flex-direction:column;gap:10px;max-height:calc(var(--ah)*0.64);overflow-y:auto;padding:4px}
.results-grid{font-size:clamp(14px,calc(var(--ah)*0.027),21px);line-height:1.85;font-style:italic}
.medal{font-size:clamp(28px,calc(var(--ah)*0.056),50px)}

/* landscape compacto (celu rotado) */
.btnrow{display:flex;gap:8px;width:min(calc(var(--aw)*.72),380px)}
.btnrow .btn{min-width:0;flex:1;font-size:.72em;padding:.7em .4em}
body.compact .screen{gap:7px}
body.compact #logo{width:min(calc(var(--ah)*.3),240px)}
body.compact .btn{padding:.5em 1em}
body.compact .hint{font-size:10px;line-height:1.35}
body.compact .rowlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:calc(var(--ah)*.6)}
body.compact .rowlist .btn{min-width:0}
body.compact .tagline{font-size:11px}
body.compact .medal{font-size:calc(var(--ah)*.09)}
</style>

<script>
window.__dyBooted=false;
(function(){
  function show(m){var el=document.getElementById("loadmsg");if(el)el.textContent=m;}
  addEventListener("error",function(e){if(e&&e.message)show("ERROR: "+e.message.slice(0,140));},true);
  addEventListener("unhandledrejection",function(e){
    var r=e&&e.reason;show("ERROR: "+String(r&&r.message||r).slice(0,140));});
  setTimeout(function(){
    if(window.__dyBooted)return;
    if(typeof HTMLScriptElement!=="undefined"&&HTMLScriptElement.supports&&!HTMLScriptElement.supports("importmap")){
      show("Este navegador no soporta importmap — probá con Chrome actualizado");return;}

      show(r.ok?"Red OK pero el motor no arrancó — reintentá o mandá captura":"El CDN respondió "+r.status);

})();

/* Carga TODO por fetch (cachea en el navegador + jsDelivr), en paralelo con pool,
   y reintenta por rondas hasta que esté completo — el juego no arranca a medias. */
async function fetchBuf(p){
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),35000); // sin timeout un fetch colgado frena la carga entera
  try{const r=await fetch(url(p),{signal:ctl.signal});
    if(!r.ok)throw new Error("HTTP "+r.status+" "+p);
    return await r.arrayBuffer();}
  finally{clearTimeout(to);}}
const MIME={png:"image/png",webp:"image/webp",jpg:"image/jpeg",jpeg:"image/jpeg"};
function texFromBuf(buf,p,srgb){return new Promise((res,rej)=>{
  const bu=URL.createObjectURL(new Blob([buf],{type:MIME[p.split(".").pop()]||"image/jpeg"}));
  texLoader.load(bu,t=>{URL.revokeObjectURL(bu);
    if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;res(t);},
    undefined,e=>{URL.revokeObjectURL(bu);rej(e);});});}
function glbFromBuf(buf){return new Promise((res,rej)=>gltfLoader.parse(buf,"",res,rej));}
async function runTasks(tasks){
  loadTotal=tasks.length;loadDone=0;
  const paint=()=>{loadBar.style.width=(100*loadDone/Math.max(loadTotal,1))+"%";
    loadMsg.textContent=`${L.loading} ${loadDone}/${loadTotal}`;};
  paint();
  let pend=tasks.slice();
  for(let round=0;round<8&&pend.length;round++){
    if(round){loadMsg.textContent=`REINTENTANDO ${pend.length}…`;
      await new Promise(r=>setTimeout(r,900*round));}
    const failed=[];let idx=0;
    await Promise.all(Array.from({length:8},async()=>{
      while(idx<pend.length){const t=pend[idx++];
        try{const buf=await fetchBuf(t.p);
          if(t.kind==="tex")t.assign(await texFromBuf(buf,t.p,t.srgb));
          else if(t.kind==="glb")t.assign(await glbFromBuf(buf));
          else t.assign(buf);
          loadDone++;paint();
        }catch(e){failed.push(t);}}}));
    pend=failed;}
  loadFailed=pend.map(t=>t.p);
  return pend;}

/* ===== motor PROCEDURAL (Web Audio, sin samples): dos sawtooth detunados + sub
   cuadrado + ruido de admisión, todo a través de un lowpass; la frecuencia base
   la maneja el RPM. Suena a motor de verdad y pesa 0 KB. ===== */
const eng={on:false,nodes:null,gear:0};
function engineStart(){if(!actx||eng.on)return;
  const g=actx.createGain();g.gain.value=0;g.connect(master);
  const lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;lp.Q.value=6;lp.connect(g);
  const o1=actx.createOscillator();o1.type="sawtooth";
  const o2=actx.createOscillator();o2.type="sawtooth";o2.detune.value=14;
  const sub=actx.createOscillator();sub.type="square";
  const og=actx.createGain();og.gain.value=.5;o1.connect(og);o2.connect(og);og.connect(lp);
  const sg=actx.createGain();sg.gain.value=.35;sub.connect(sg);sg.connect(lp);
  // ruido de admisión suave
  const nb=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
  const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*.5;
  const nz=actx.createBufferSource();nz.buffer=nb;nz.loop=true;
  const ng=actx.createGain();ng.gain.value=.04;const nlp=actx.createBiquadFilter();
  nlp.type="bandpass";nlp.frequency.value=1200;nz.connect(nlp);nlp.connect(ng);ng.connect(g);
  o1.start();o2.start();sub.start();nz.start();
  eng.nodes={g,lp,o1,o2,sub,og};eng.on=true;eng.gear=0;}
function engineStop(){if(!eng.on)return;const n=eng.nodes;
  try{n.o1.stop();n.o2.stop();n.sub.stop();}catch{}
  eng.on=false;eng.nodes=null;}
function engineSet(r){ // r = velocidad/tope 0..1; RPM sube/baja por cambio simulado
  if(!eng.on)return;const n=eng.nodes,t=actx.currentTime;
  const GEARS=6, seg=1/GEARS;
  let gi=Math.min(GEARS-1,Math.floor(r/seg));
  const within=(r-gi*seg)/seg;          // 0..1 dentro del cambio actual
  const rpm=.28+within*.72;             // cae al cambiar, sube al acelerar
  const base=48+rpm*118;                // Hz de encendido
  n.o1.frequency.setTargetAtTime(base,t,.04);
  n.o2.frequency.setTargetAtTime(base,t,.04);
  n.sub.frequency.setTargetAtTime(base*.5,t,.05);
  n.lp.frequency.setTargetAtTime(500+r*2600+rpm*700,t,.05);
  n.g.gain.setTargetAtTime(MIX.engine*(.35+.65*Math.min(1,r*1.3)),t,.06);
  if(gi>eng.gear&&r>.12){sfx("sfx_pop",.5+Math.random()*.3,.9+Math.random()*.3);} // petardeo al subir
  eng.gear=gi;}
function loopStart(name,ref){const s=SND[name];if(!save.sound||!actx||!s||!s.buf||ref.src)return;
  ref.src=actx.createBufferSource();ref.src.buffer=s.buf;ref.src.loop=true;

let joyVec={x:0,z:0};
(function(){
  const base=document.getElementById("joy"),knob=document.getElementById("joyk");
  if(!base)return;
  let pid=null,cx=0,cy=0,rad=1;
  const setK=(lx,ly)=>{joyVec.x=lx;joyVec.z=ly;
    knob.style.transform=`translate(${(lx*rad*.62).toFixed(1)}px,${(ly*rad*.62).toFixed(1)}px)`;};
  const move=e=>{if(e.pointerId!==pid)return;
    const sx=e.clientX-cx,sy=e.clientY-cy;
    // el #app se rota 90° en móvil vertical: pasar de pantalla a coords del juego
    let lx=sx,ly=sy;
    if(document.body.classList.contains("rot")){lx=sy;ly=-sx;}
    const l=Math.hypot(lx,ly)||1,cl=Math.min(1,l/rad);
    setK(lx/l*cl,ly/l*cl);};
  const end=e=>{if(e.pointerId!==pid)return;pid=null;base.classList.remove("active");setK(0,0);};
  base.addEventListener("pointerdown",e=>{e.preventDefault();touchDevice=true;interact();
    pid=e.pointerId;base.setPointerCapture(pid);base.classList.add("active");
    const r=base.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;rad=r.width*.5;move(e);});
  base.addEventListener("pointermove",move);
  base.addEventListener("pointerup",end);
  base.addEventListener("pointercancel",end);
})();

(function(){

  let pid=null,lx=0,ly=0;
  el.addEventListener("pointerdown",e=>{if(pid!==null)return;e.preventDefault();
    pid=e.pointerId;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);touchDevice=true;});
  el.addEventListener("pointermove",e=>{if(e.pointerId!==pid)return;
    const rot=document.body.classList.contains("rot");

    lx=e.clientX;ly=e.clientY;});

function normalizeModel(glb,{length=null,height=null,rotY=0}={}){
  if(!glb)return null;
  const root=glb.scene.clone(true);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;
    if(o.material&&o.material.transparent){o.material=o.material.clone();
      o.material.transparent=false;o.material.alphaTest=.5;o.material.depthWrite=true;}}});
  const g=new THREE.Group();g.add(root);
  root.rotation.y=rotY;
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3());
  let s=1;
  if(length)s=length/Math.max(size.z,1e-4);
  else if(height)s=height/Math.max(size.y,1e-4);
  root.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(root);
  const c=b2.getCenter(new THREE.Vector3());
  root.position.x-=c.x;root.position.z-=c.z;root.position.y-=b2.min.y;
  return g;}

  const curve=new THREE.CatmullRomCurve3(pts,true,"centripetal",.5);

  const len=curve.getLength(),ds=4,n=Math.ceil(len/ds);

  for(let i=0;i<n;i++){P.push(curve.getPointAt(i/n));TN.push(curve.getTangentAt(i/n).normalize());}

    for(let i=0;i<=n;i++){const ii=i%n;

      const p2=P[ii].clone().addScaledVector(LF[ii],l2);
      pos.push(p1.x,y,p1.z,p2.x,y,p2.z);

    for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));

/* ===== grilla espacial de colisiones: miles de colliders sin costo O(n) por frame ===== */
const GRID_CELL=9;
function colAABB(c){
  if(c.type==="circle")return[c.x-c.r,c.z-c.r,c.x+c.r,c.z+c.r];
  if(c.type==="capsule")return[Math.min(c.ax,c.bx)-c.r,Math.min(c.az,c.bz)-c.r,Math.max(c.ax,c.bx)+c.r,Math.max(c.az,c.bz)+c.r];
  const r=Math.hypot(c.hw,c.hd)+.4;return[c.x-r,c.z-r,c.x+r,c.z+r];}
function buildColliderGrid(cols){
  const grid=new Map();
  for(let i=0;i<cols.length;i++){const[x0,z0,x1,z1]=colAABB(cols[i]);
    for(let cx=Math.floor(x0/GRID_CELL);cx<=Math.floor(x1/GRID_CELL);cx++)
      for(let cz=Math.floor(z0/GRID_CELL);cz<=Math.floor(z1/GRID_CELL);cz++){
        const k=cx*73856+cz;let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(i);}}
  return grid;}
const _qseen=new Set(),_qout=[];
function queryColliders(x,z,rad){
  const grid=world&&world.grid;if(!grid)return null;
  _qseen.clear();_qout.length=0;
  for(let cx=Math.floor((x-rad)/GRID_CELL);cx<=Math.floor((x+rad)/GRID_CELL);cx++)
    for(let cz=Math.floor((z-rad)/GRID_CELL);cz<=Math.floor((z+rad)/GRID_CELL);cz++){
      const a=grid.get(cx*73856+cz);if(a)for(const i of a)if(!_qseen.has(i)){_qseen.add(i);_qout.push(i);}}
  return _qout;}
function buildWorld(mapIdx,timeKey){
  disposeWorld();
  dyHazards=[];dyRamps=[];dyPit=null;
  const group=new THREE.Group();scene.add(group);

  world={group,timeKey,mapIdx,chimneys:[],sunOff:lastSunOff,sky:lastSky,skyY:lastSkyY,hazards:dyHazards,ramps:dyRamps,...data};
  world.pit=dyPit;
  world.grid=buildColliderGrid(world.colliders||[]);
  return world;}
function disposeWorld(){if(world){scene.remove(world.group);
  world.group.traverse(o=>{if(o.geometry)o.geometry.dispose?.();});

/* Las carrocerías vienen SIN ruedas: se montan 4 ruedas generadas (la elegida)
   en posiciones configuradas por coche (CARS[i].wheels), giran sobre su eje exacto
   y las delanteras doblan. Espejo por lado con corrección de signos. */
function mountWheels(tpl,c,rimKey){
  const proto=buildWheelProto(rimKey);
  const cfg=c.wheels||{f:.55,r:-.55,rad:.31,zf:.78,flip:false};
  if(cfg.flip){ // nariz al revés en el GLB: girar 180° y re-centrar
    const root=tpl.children[0];root.rotation.y+=Math.PI;
    tpl.updateMatrixWorld(true);
    const b=new THREE.Box3().setFromObject(root);
    const ctr=b.getCenter(V);
    root.position.x-=ctr.x;root.position.z-=ctr.z;root.position.y-=b.min.y;}
  tpl.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(tpl);
  const halfW=(box.max.x-box.min.x)/2,halfL=(box.max.z-box.min.z)/2;
  for(const[zf,name]of[[cfg.f,"dyw_f"],[cfg.r,"dyw_r"]])
    for(const side of[1,-1]){
      const grp=new THREE.Group();
      grp.position.set(side*halfW*cfg.zf,cfg.rad,zf*halfL);
      grp.name=name;grp.userData.ms=side; // lado espejado: invierte giro y dirección
      let m2;
      if(proto){m2=new THREE.Mesh(proto.geo,proto.mat);
        m2.scale.setScalar(2*cfg.rad/proto.diam);}
      else{const cg=new THREE.CylinderGeometry(1,1,.42,18);cg.rotateZ(Math.PI/2);
        m2=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:0x17181c,roughness:.85}));
        m2.scale.setScalar(cfg.rad);}
      if(side<0)grp.scale.x=-1;
      m2.castShadow=true;m2.name="dyw_spin";
      grp.add(m2);tpl.add(grp);}
  tpl.userData.wheelR=cfg.rad;}
const wheelProtos={};
function buildWheelProto(rimKey){
  rimKey=rimKey||"wheel";
  if(wheelProtos[rimKey])return wheelProtos[rimKey];
  const glb=A.glb[rimKey]||A.glb.wheel;if(!glb)return null;
  const root=glb.scene;root.updateMatrixWorld(true);
  let src=null;root.traverse(o=>{if(o.isMesh&&!src)src=o;});
  if(!src)return null;
  const g=src.geometry.clone();g.applyMatrix4(src.matrixWorld);
  g.computeBoundingBox();
  const bb=g.boundingBox,size=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3());
  g.translate(-c.x,-c.y,-c.z);
  const dims=[size.x,size.y,size.z],axMin=dims.indexOf(Math.min(...dims));
  if(axMin===2)g.rotateY(Math.PI/2);else if(axMin===1)g.rotateZ(Math.PI/2); // eje del cilindro -> X (lateral)
  g.computeBoundingBox();
  const b2=g.boundingBox;
  g.userData.own=true;
  return(wheelProtos[rimKey]={geo:g,mat:src.material,
    diam:Math.max(b2.max.y-b2.min.y,b2.max.z-b2.min.z)});}
function fallbackCar(){const g=new THREE.Group();

/* Deforma la carrocería: empuja los vértices cercanos al punto de impacto hacia
   adentro, en la dirección del golpe (en espacio local del coche). Acumulativo. */
const _dV=new THREE.Vector3(),_dN=new THREE.Vector3();
function deformCar(s,worldDir,strength){
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  // dirección de golpe -> local del coche (fwd=(sinH,cosH))
  const lx=worldDir.x*ch-worldDir.z*sh, lz=worldDir.x*sh+worldDir.z*ch;
  for(const m of s.body){
    const pos=m.geometry.attributes.position;const arr=pos.array;
    if(!m.geometry.boundingBox)m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox,sz=bb.max.z-bb.min.z||1,sx=bb.max.x-bb.min.x||1;
    // punto de impacto en el borde del bounding en la dirección del golpe
    const ix=(lx>0?bb.max.x:bb.min.x)*.9, iz=(lz>0?bb.max.z:bb.min.z)*.9;
    const iy=(bb.min.y+bb.max.y)*.5;
    const R=Math.max(sz,sx)*.45, R2=R*R, amp=strength*R*.5;
    for(let i=0;i<arr.length;i+=3){
      const dx=arr[i]-ix,dy=arr[i+1]-iy,dz=arr[i+2]-iz;
      const d2=dx*dx+dy*dy*.4+dz*dz;
      if(d2<R2){const f=(1-d2/R2)*amp;
        arr[i]-=lx*f;arr[i+2]-=lz*f;

      if(d<m&&d>1e-4){x=c.x+dx/d*m;z=c.z+dz/d*m;}}

      const tt=Math.max(0,Math.min(1,((x-c.ax)*abx+(z-c.az)*abz)/(abx*abx+abz*abz)));

    else{const dx=s.x-c.x,dz=s.z-c.z;
      const lx=dx*c.cos-dz*c.sin,lz=dx*c.sin+dz*c.cos;
      const px2=Math.max(-c.hw,Math.min(lx,c.hw)),pz2=Math.max(-c.hd,Math.min(lz,c.hd));
      const ddx=lx-px2,ddz=lz-pz2,d=Math.hypot(ddx,ddz);
      if(d<CFG.carR){
        const push=(CFG.carR-d)||CFG.carR;
        let nx,nz;
        if(d>1e-4){nx=ddx/d;nz=ddz/d;}
        else{const ex=c.hw-Math.abs(lx),ez=c.hd-Math.abs(lz);
          if(ex<ez){nx=Math.sign(lx)||1;nz=0;}else{nx=0;nz=Math.sign(lz)||1;}}
        const wx=nx*c.cos+nz*c.sin,wz=-nx*c.sin+nz*c.cos;
        s.x+=wx*push;s.z+=wz*push;
        const dot=s.vx*wx+s.vz*wz;
        if(dot<0){s.vx-=1.6*dot*wx;s.vz-=1.6*dot*wz;s.vx*=.85;s.vz*=.85;hit=hit||speed>7;}}}}
  if(hit){
    // fuerza del impacto = cuánta velocidad se perdió de golpe
    const dvx=s.vx-pvx,dvz=s.vz-pvz,dv=Math.hypot(dvx,dvz);
    const imp=Math.min(1,(speed-6)/26);
    sfx(imp>.45?"sfx_crash":"sfx_crash_soft",Math.max(.15,imp*imp*1.2),.9+Math.random()*.25);
    s.shake=Math.min(1,.3+imp);
    if(s.mapMode==="drift"&&s.cur>0){s.cur=0;s.combo=1;s.driftT=0;toast(L.comboLost,"var(--red)");}
    if(dv>2.5&&!s.dead){ // daño + deformación proporcional al golpe
      const dmg=Math.min(55,dv*2.4);
      s.hp=Math.max(0,s.hp-dmg);
      const dir=dv>1e-3?{x:dvx/dv,z:dvz/dv}:{x:0,z:1};
      deformCar(s,dir,Math.min(1,dv/22));
      for(let k=0;k<3;k++)spawnPuffAt(s.x,.6,s.z,1.4);
      if(s.hp<=0)killPlayer(s);}}
  if(world.hazards&&world.hazards.length)updateHazards(s,dt);

  /* trampa: engranajes giran, palanca activa la compuerta de cristal */
  if(dyPit){updateGearPit(dt,s.x,s.z);
    if(dyPit.near&&consumePress("activate")){dyPit.open=!dyPit.open;sfx("sfx_pop",.55,.65);
      toast(dyPit.open?"⚙ TRITURADORA ON":"⚙ CERRADO",dyPit.open?"var(--red)":"var(--yel)");}}

  /* rampas + física vertical (saltos con aterrizaje) + caída al pozo */
  {const rmps=world.ramps;let onR=false,surf=0,slope=0;
   const inPit=overOpenPit(s.x,s.z);
   if(rmps&&!inPit)for(const r of rmps){
     const dx=s.x-r.x,dz=s.z-r.z;
     const along=dx*r.sin+dz*r.cos, across=dx*r.cos-dz*r.sin;
     if(across>-r.hw&&across<r.hw&&along>-1.2&&along<r.len){
       const h=Math.max(0,Math.min(1,along/r.len))*r.rise;
       if(h>surf){surf=h;slope=r.rise/r.len;onR=true;}}}
   if(onR){s.y=Math.max(s.y,surf);
     // lanzamiento por FÍSICA real: vy = velocidad × pendiente (tan del ángulo) → altura ∝ velocidad²
     if(vF>3)s.vy=Math.max(s.vy,vF*slope);
     s.airborne=s.y>.15;}
   else if(inPit){s.airborne=true;s.vy-=GRAV*dt;s.y+=s.vy*dt; // caés a la trituradora
     if(s.y<-(world.pit.DEPTH-3.5)&&!s.dead){s.y=-(world.pit.DEPTH-3.5);
       sfx("sfx_crash",1,.55);s.hp=0;deformCar(s,{x:0,z:1},1);killPlayer(s);}}
   else if(s.y>0||s.vy>0){s.airborne=true;s.vy-=GRAV*dt;s.y+=s.vy*dt;
     if(s.y<=0){const land=-s.vy;s.y=0;s.vy=0;s.airborne=false;
       if(land>4){s.shake=Math.min(1,.3+land/22);for(let k=0;k<2;k++)spawnPuffAt(s.x+(Math.random()-.5)*1.5,.4,s.z+(Math.random()-.5)*1.5,1.2);
         sfx(land>9?"sfx_crash":"sfx_crash_soft",Math.min(1,land/16),.85+Math.random()*.2);}}}
   else{s.airborne=false;s.y=0;s.vy=0;}
   const pitchT=s.airborne?Math.max(-.5,Math.min(.5,-s.vy*.03)):0;
   s.airPitch+=(pitchT-s.airPitch)*Math.min(1,dt*7);}

  /* scoring */
  const betaDeg=Math.abs(beta)*57.29578;
  if(betaDeg<CFG.driftMinDeg){s.hbGap=(s.hbGap||0)+dt;
    if(s.hbGap>.5)s.hbDrift=false;
    if(s.hbGap>.45)s.autoDrift=false;}
  else s.hbGap=0;
  const drifting=!s.over&&s.hbDrift&&betaDeg>CFG.driftMinDeg&&s.speed>CFG.driftMinV;
  if(s.mapMode==="drift"){
    if(drifting){s.driftT+=dt;s.gapT=0;
      s.combo=Math.min(5,s.combo+dt*.22);
      s.cur+=s.speed*betaDeg*.10*dt*s.combo;}
    else if(s.cur>0){s.gapT+=dt;
      if(s.gapT>CFG.bankGap){const pts=Math.round(s.cur);
        s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);
        s.cur=0;s.combo=1;s.driftT=0;
        sfx("sfx_chime",.7,1.2);toast("+"+fmtN(pts),"var(--yel)");}}}
  else{ // race checkpoints
    const cps=world.checkpoints;
    const c=cps[s.cp];
    const dx=s.x-c.x,dz=s.z-c.z;
    if(dx*dx+dz*dz<c.r*c.r){
      s.cp++;sfx("sfx_chime",.5,1.4);
      if(s.cp>=cps.length){s.cp=0;s.lap++;
        const lt=s.t-s.lapStart;s.lapStart=s.t;
        if(s.lap>0){s.lapTimes.push(lt);
          if(s.bestLapT===null||lt<s.bestLapT)s.bestLapT=lt;}
        if(s.lap>=s.laps)endSession();
        else toast(s.lap===s.laps-1?L.finalLap:`${L.lap} ${s.lap+1}/${s.laps}`,"var(--yel)");}}}

  engineSet(Math.min(1,Math.abs(vF)/st.top));
  skidSet(drifting?Math.min(1,betaDeg/40)*(s.speed/st.top+.4):0);
  if(drifting&&s.speed>7){spawnSmoke(s);writeMark(s);}

  /* car placement + chase camera */
  s.obj.position.set(s.x,s.y||0,s.z);
  s.obj.rotation.set(0,s.h,0);
  if(s.airPitch)s.obj.rotateX(s.airPitch); // morro arriba/abajo en el aire
  s.obj.rotateZ(-s.steerVis*.04*Math.min(1,s.speed/22));
  /* ruedas: giro por velocidad + dirección en las delanteras (ms corrige el lado espejado) */
  s.wheelSpin-=vF/s.wheelR*dt;
  for(const w of s.wheels){
    const ms=w.userData.ms||1;
    if(w.name==="dyw_f")w.rotation.y=s.steerVis*.42*ms;
    w.children[0].rotation.x=s.wheelSpin*ms;}
  /* la sombra sigue al coche (mapas grandes > frustum fijo) */
  if(world.sunOff){sun.position.set(s.x+world.sunOff.x,world.sunOff.y,s.z+world.sunOff.z);
    sun.target.position.set(s.x,0,s.z);sun.target.updateMatrixWorld();}
  let dyaw=s.h-s.camYaw;while(dyaw>Math.PI)dyaw-=2*Math.PI;while(dyaw<-Math.PI)dyaw+=2*Math.PI;
  s.camYaw+=dyaw*Math.min(1,dt*4.4);
  const cx=s.x-Math.sin(s.camYaw)*7.8,cz=s.z-Math.cos(s.camYaw)*7.8;
  camera.position.lerp(V.set(cx,3.1+(s.y||0)*.8,cz),1-Math.pow(.0001,dt));
  {const ddx=camera.position.x-s.x,ddz=camera.position.z-s.z;
   const d=Math.hypot(ddx,ddz);
   if(d<5.5){const k=5.5/Math.max(d,.001);
     camera.position.x=s.x+ddx*k;camera.position.z=s.z+ddz*k;}
   camera.position.y=Math.max(camera.position.y,2.6+(s.y||0)*.7);}
  if(world.sky){world.sky.position.x=camera.position.x;world.sky.position.z=camera.position.z;}
  if(s.shake>.02){camera.position.x+=(Math.random()-.5)*.4*s.shake;
    camera.position.y+=(Math.random()-.5)*.25*s.shake;}
  camera.lookAt(s.x+Math.sin(s.h)*3,1.1+(s.y||0)*.8,s.z+Math.cos(s.h)*3);
  const fovT=CFG.fovBase+(CFG.fovMax-CFG.fovBase)*Math.min(1,s.speed/st.top);
  camera.fov+=(fovT-camera.fov)*.06;camera.updateProjectionMatrix();
}
let orbitA=0;
function menuOrbit(dt){orbitA+=dt*.055;
  const r=105,cx=Math.cos(orbitA)*r,cz=Math.sin(orbitA)*r;
  camera.position.lerp(V.set(cx,42,cz),Math.min(1,dt*2));
  camera.lookAt(0,0,0);
  if(world&&world.sky){world.sky.position.x=camera.position.x;world.sky.position.z=camera.position.z;}
  camera.fov+=(52-camera.fov)*.05;camera.updateProjectionMatrix();
  if(world&&world.chimneys)for(const c of world.chimneys){
    if(Math.random()<dt*2)spawnPuffAt(c.x,c.y,c.z,2.2);}}

/* ================= skid marks ================= */
const MARKN=2200;
let markGeo=null,markHead=0;
function initMarks(){
  markGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(MARKN*4*3);
  const idx=new Uint32Array(MARKN*6);
  for(let i=0;i<MARKN;i++){const a=i*4;idx.set([a,a+2,a+1,a+1,a+2,a+3],i*6);}
  markGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  markGeo.setIndex(new THREE.BufferAttribute(idx,1));
  const m=new THREE.Mesh(markGeo,new THREE.MeshBasicMaterial({color:0x131215,
    transparent:true,opacity:.5,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2}));
  m.frustumCulled=false;scene.add(m);}
let lastMark={x:0,z:0,h:0,has:false};
function writeMark(s){
  if(lastMark.has&&Math.hypot(s.x-lastMark.x,s.z-lastMark.z)<.6)return;
  const pos=markGeo.attributes.position.array;
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1]){
    const w=.78*side;
    const rx=s.x-sh*1.4+ch*w,rz=s.z-ch*1.4-sh*w;
    const lx=lastMark.has?lastMark.x-Math.sin(lastMark.h)*1.4+Math.cos(lastMark.h)*w:rx-sh*.6,
          lz=lastMark.has?lastMark.z-Math.cos(lastMark.h)*1.4-Math.sin(lastMark.h)*w:rz-ch*.6;
    const j=markHead=(markHead+1)%MARKN,o=j*12;
    const px=ch*.14,pz=-sh*.14;
    pos[o]=lx-px;pos[o+1]=.04;pos[o+2]=lz-pz;
    pos[o+3]=lx+px;pos[o+4]=.04;pos[o+5]=lz+pz;
    pos[o+6]=rx-px;pos[o+7]=.04;pos[o+8]=rz-pz;
    pos[o+9]=rx+px;pos[o+10]=.04;pos[o+11]=rz+pz;}
  markGeo.attributes.position.needsUpdate=true;
  lastMark={x:s.x,z:s.z,h:s.h,has:true};}
function clearMarks(){if(!markGeo)return;
  markGeo.attributes.position.array.fill(0);
  markGeo.attributes.position.needsUpdate=true;lastMark.has=false;}

/* ================= smoke ================= */
const SMOKEN=320;
let smokeGeo=null,smokeHead=0;
const smokeLife=new Float32Array(SMOKEN),smokeVel=new Float32Array(SMOKEN*3);
function initSmoke(){
  smokeGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(SMOKEN*3);pos.fill(-9999);
  smokeGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(smokeGeo,new THREE.PointsMaterial({map:smokeTex,size:3.6,
    transparent:true,opacity:.3,depthWrite:false,color:0xd8d5d0}));
  p.frustumCulled=false;scene.add(p);}
function spawnPuffAt(x,y,z,vy=1.6){
  const j=smokeHead=(smokeHead+1)%SMOKEN,o=j*3;
  const pos=smokeGeo.attributes.position.array;
  pos[o]=x;pos[o+1]=y;pos[o+2]=z;
  smokeVel[o]=(Math.random()-.5)*.8;smokeVel[o+1]=vy+Math.random();smokeVel[o+2]=(Math.random()-.5)*.8;
  smokeLife[j]=2.2;}
function spawnSmoke(s){
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1])
    spawnPuffAt(s.x-sh*1.4+ch*.8*side,.3,s.z-ch*1.4-sh*.8*side,1.1+Math.random());}
function updateSmoke(dt){let any=false;
  const pos=smokeGeo.attributes.position.array;
  for(let j=0;j<SMOKEN;j++){if(smokeLife[j]<=0)continue;any=true;
    smokeLife[j]-=dt;const o=j*3;
    pos[o]+=smokeVel[o]*dt;pos[o+1]+=smokeVel[o+1]*dt;pos[o+2]+=smokeVel[o+2]*dt;
    if(smokeLife[j]<=0)pos[o+1]=-9999;}
  if(any)smokeGeo.attributes.position.needsUpdate=true;}
function clearSmoke(){if(!smokeGeo)return;
  smokeGeo.attributes.position.array.fill(-9999);smokeLife.fill(0);
  smokeGeo.attributes.position.needsUpdate=true;}

const elTotal=document.querySelector("#score .total"),elCur=document.querySelector("#score .cur"),
  elTimer=document.getElementById("timer"),elKmh=document.querySelector("#speedo .kmh"),
  elAng=document.querySelector("#speedo .ang"),elToast=document.getElementById("toast"),
  elArrow=document.getElementById("cparrow"),elHp=document.querySelector("#hpbar>i"),
  elHpBar=document.getElementById("hpbar");
let toastT=0;
function toast(t,color){elToast.textContent=t;elToast.style.color=color||"var(--yel)";
  elToast.style.opacity=1;toastT=1.3;}
function fmtN(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function fmtT(s){if(s==null)return"--:--";const m=Math.floor(s/60);
  return`${m}:${(s-m*60).toFixed(1).padStart(4,"0")}`;}
function drawHud(dt){if(!sess)return;
  if(toastT>0){toastT-=dt;if(toastT<=0&&sess.go<=0)elToast.style.opacity=0;}
  if(sess.mapMode==="drift"){
    elTotal.textContent=fmtN(Math.round(sess.total));
    elCur.innerHTML=sess.cur>0?`+${fmtN(Math.round(sess.cur))} <span class="combo">×${sess.combo.toFixed(1)}</span>`:"";
    elTimer.firstChild.textContent=fmtT(sess.t);
    elTimer.querySelector("small").textContent="";
    elTimer.style.color=sess.t<20?"var(--red)":"var(--ink)";
    elArrow.style.display="none";}
  else{
    elTotal.textContent=`${L.lap} ${Math.min(sess.lap+1,sess.laps)}/${sess.laps}`;
    elCur.innerHTML=`CP ${sess.cp}/${world.checkpoints.length}`;
    elTimer.firstChild.textContent=fmtT(sess.t);
    elTimer.querySelector("small").textContent=sess.bestLapT?`${L.bestLapS} ${fmtT(sess.bestLapT)}`:"";
    elTimer.style.color="var(--ink)";
    // checkpoint arrow relative to camera yaw
    const c=world.checkpoints[sess.cp];
    const ang=Math.atan2(c.x-sess.x,c.z-sess.z)-sess.camYaw;
    elArrow.style.display="block";
    elArrow.style.transform=`translateX(-50%) rotate(${(-ang*57.3).toFixed(0)}deg)`;}
  elKmh.textContent=Math.round(sess.speed*3.6);
  // la vida solo aparece a pie (no manejando) y refleja la salud del piloto
  const onFoot=!!(sess.onFoot&&sess.onFoot.active);
  if(elHpBar)elHpBar.style.display=onFoot?"block":"none";
  if(elHp&&onFoot)elHp.style.width=Math.max(0,Math.min(100,sess.onFoot.hp))+'%';
  const bd=Math.abs(sess.beta)*57.3;
  elAng.textContent=bd>8?Math.round(bd)+"°":"";
}

const S={loading:document.getElementById("s_loading"),title:document.getElementById("s_title"),

  pause:document.getElementById("s_pause"),results:document.getElementById("s_results")};
const hud=document.getElementById("hud"),garageUI=document.getElementById("garage_ui");
let focusIdx=0,focusList=[];
function show(name){for(const k in S)S[k].classList.toggle("hidden",k!==name);
  mode=name;
  hud.style.display=name==="race"?"block":"none";
  garageUI.style.display=name==="garage"?"block":"none";
  if(name==="race"||name==="garage")for(const k in S)S[k].classList.add("hidden");
  refreshTouchUI();focusIdx=0;refreshFocus();}
function refreshFocus(){focusList=[...document.querySelectorAll(".screen:not(.hidden) .btn:not(:disabled), #garage_ui .btn:not(:disabled)")]
  .filter(b=>b.offsetParent!==null);
  focusList.forEach((b,i)=>b.classList.toggle("focus",i===focusIdx));}
function menuNav(){
  // en carrera, deja door/jump/punch para que los consuma update()
  if(mode==="race"){const keep=[];
    while(pressed.length){const c=pressed.shift();
      if(c==="pause")togglePause();
      else if(c==="door"||c==="jump"||c==="punch"||c==="activate")keep.push(c);}
    pressed.push(...keep);return;}
  while(pressed.length){const c=pressed.shift();
  if(mode==="garage"){
    if(c==="left"){cycleCar(-1);continue;}
    if(c==="right"){cycleCar(1);continue;}
    if(c==="ok"){buildTimeSel();continue;}
    if(c==="back"||c==="pause"){buildMaps();continue;}}
  if(!focusList.length){refreshFocus();if(!focusList.length)continue;}
  if(c==="up"||c==="left"){focusIdx=(focusIdx-1+focusList.length)%focusList.length;refreshFocus();}
  if(c==="down"||c==="right"){focusIdx=(focusIdx+1)%focusList.length;refreshFocus();}
  if(c==="ok"){const b=focusList[focusIdx];if(b)b.click();}
  if(c==="pause"||c==="back"){if(mode==="pause")togglePause();
    else if(mode==="maps")buildTitle(false);
    else if(mode==="time")buildGarageUI();}}}

    d2.innerHTML=`<span style="width:34%">${lab}</span><div class="bar"><div style="width:${Math.round(Math.max(.08,Math.min(v,1))*100)}%"></div></div>`;
    st.appendChild(d2);};
  mk(L.power,(c.accel-18)/13);mk(L.grip,(c.grip-7)/3.6);mk(L.turn,(c.turn-1.8)/.9);mk(L.kick,(c.kick-.8)/.6);
  const m=MAPS[save.map];
  const best=m.mode==="race"?save.bestTime[m.id]:save.best[m.id];
  document.getElementById("gbest").textContent=
    `${L["map_"+m.id]} · ${L.best}: ${best?(m.mode==="race"?fmtT(best):fmtN(best)):L.noBest}`;
  const gb=document.getElementById("gbottom");gb.innerHTML="";
  // fila de personalización: rueda + piloto
  const cust=document.createElement("div");cust.className="custrow";
  const mkCyc=(lab,val,fn)=>{const w=document.createElement("div");w.className="cyc";
    const l=btn("◀",()=>fn(-1));l.classList.add("mini");
    const r=btn("▶",()=>fn(1));r.classList.add("mini");
    const t=document.createElement("span");t.className="cyclab";t.innerHTML=`${lab}<b>${val}</b>`;
    w.appendChild(l);w.appendChild(t);w.appendChild(r);return w;};
  cust.appendChild(mkCyc(L.wheelL||"RUEDA",`${save.wheel+1}/${RIMS.length}`,cycleWheel));
  cust.appendChild(mkCyc(L.pilot||"PILOTO",`${save.char+1}/${PEDS.length}`,cyclePed));
  gb.appendChild(cust);
  const row=document.createElement("div");row.className="custrow";
  const bb=btn(L.back,()=>buildMaps());bb.style.minWidth="calc(var(--aw)*.28)";row.appendChild(bb);
  const cb=btn(L.choose+" ▸",()=>buildTimeSel());cb.style.minWidth="calc(var(--aw)*.4)";row.appendChild(cb);
  gb.appendChild(row);
  refreshFocus();}
function buildGarageUI(){prepareCars();buildGarage();
  camera.position.set(0,2.4,8.4);camera.lookAt(0,.9,0);
  camera.fov=CFG.fovBase;camera.updateProjectionMatrix();
  fillGarageUI();show("garage");
  document.getElementById("gprev").onclick=()=>{interact();cycleCar(-1);};
  document.getElementById("gnext").onclick=()=>{interact();cycleCar(1);};}
function buildTimeSel(){const s=S.time;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.chooseTime;s.appendChild(t);
  const list=document.createElement("div");list.className="rowlist";s.appendChild(list);
  for(const[k,label]of[["dia","☀️ "+L.dia],["tarde","🌇 "+L.tarde],["noche","🌙 "+L.noche]])
    list.appendChild(btn(label,()=>{save.time=k;persist();startSession();}));
  s.appendChild(btn(L.back,()=>buildGarageUI()));
  show("time");
  focusIdx=["dia","tarde","noche"].indexOf(save.time);refreshFocus();}
function buildPause(){const s=S.pause;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl org";t.textContent=L.paused;s.appendChild(t);
  s.appendChild(btn(L.resume,()=>togglePause()));
  s.appendChild(btn(L.restart,()=>startSession()));
  s.appendChild(btn(save.sound?L.sound_on:L.sound_off,()=>{save.sound=!save.sound;persist();applySound();buildPause();}));
  s.appendChild(btn(L.exit,()=>{loopsStop();sess=null;music("music_menu");buildMaps();}));
  show("pause");}
function medalFor(m,val){ // drift: higher better; race: lower better
  if(m.mode==="race"){let md=0;for(let i=0;i<3;i++)if(val<=m.targets[i])md=i+1;return md;}
  let md=0;for(let i=0;i<3;i++)if(val>=DRIFT_MEDALS[i])md=i+1;return md;}
function endSession(){const s=sess;if(s.over)return;s.over=true;
  loopsStop();
  const m=MAPS[save.map];
  if(s.mapMode==="drift"){
    if(s.cur>0){const pts=Math.round(s.cur);s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);s.cur=0;}
    s.total=Math.round(s.total);
    if(!s.saved){s.saved=true;
      if(!save.best[m.id]||s.total>save.best[m.id]){save.best[m.id]=s.total;s.record=true;}
      if(!save.bestDrift[m.id]||s.bestDrift>save.bestDrift[m.id])save.bestDrift[m.id]=s.bestDrift;
      persist();}}
  else{
    if(!s.saved){s.saved=true;
      if(!save.bestTime[m.id]||s.t<save.bestTime[m.id]){save.bestTime[m.id]=s.t;s.record=true;}
      persist();}}
  toast(s.mapMode==="race"?L.finished||"FINISH":L.timeUp,"var(--org)");
  sfx("sfx_finish",1,1);
  setTimeout(()=>{if(mode==="race")showResults();},1800);}
function showResults(){const s=S.results;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  music("music_menu");
  const r=sess,m=MAPS[save.map];
  const val=r.mapMode==="race"?r.t:r.total;
  const md=medalFor(m,val);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.results;s.appendChild(t);
  const mdEl=document.createElement("div");mdEl.className="medal";
  mdEl.innerHTML=["<span style='color:#888'>—</span>","🥉","🥈","🥇"][md]+
    ` <span class="${md===3?'yel':''}" style="font-size:.55em">${L["medal"+md]}</span>`;
  s.appendChild(mdEl);
  const g=document.createElement("div");g.className="results-grid";
  g.innerHTML=(r.mapMode==="race"
    ?`${L.totalTime}: <span class="org">${fmtT(r.t)}</span><br>${L.bestLapS}: ${fmtT(r.bestLapT)}`
    :`${L.score}: <span class="org">${fmtN(r.total)}</span><br>${L.bestDrift}: ${fmtN(r.bestDrift)}`)
    +(r.record?`<br><span class="yel">${L.newRecord}</span>`:"")
    +(md<3?`<br><span class="hint">${L.next}: ${r.mapMode==="race"?fmtT(m.targets[md]):fmtN(DRIFT_MEDALS[md])}</span>`:"");
  s.appendChild(g);
  s.appendChild(btn(L.retry,()=>startSession()));
  s.appendChild(btn(L.garage,()=>{sess=null;buildGarageUI();}));
  s.appendChild(btn(L.menu,()=>{sess=null;buildTitle();}));
  show("results");}
function startSession(){applyQuality();
  sess=newSession();show("race");
  music("music_drift");loopsStart();sfx("sfx_count",.8,1);
  camera.position.set(sess.x-Math.sin(sess.h)*7.8,3.1,sess.z-Math.cos(sess.h)*7.8);
  camera.lookAt(sess.x,1,sess.z);
  toast(L.go,"var(--org)");}
function togglePause(){if(mode==="race"&&sess&&!sess.over){buildPause();loopsStop();}
  else if(mode==="pause"){show("race");loopsStart();}}
document.getElementById("pausebtn").addEventListener("click",()=>togglePause());
addEventListener("blur",()=>{if(mode==="race")togglePause();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="race")togglePause();});
let interacted=false;
function interact(){if(interacted)return;interacted=true;audioInit();
  decodeAll().then(()=>{if(mode!=="race")music("music_menu");});}

/* ================= main loop ================= */
let last=performance.now(),acc=0,frames=0,fpsAt=last,fps=0,fc=0;
const devEl=document.getElementById("dev");
function frame(now){requestAnimationFrame(frame);
  acc+=now-last;last=now;if(acc>250)acc=250;
  pollPads();menuNav();
  fc++;if(fc%2===0)renderer.shadowMap.needsUpdate=true;
  const stepMs=CFG.step*1000;
  while(acc>=stepMs){update(CFG.step);updateSmoke(CFG.step);acc-=stepMs;}
  if(mode==="race"||mode==="pause"||((mode==="title"||mode==="maps"||mode==="time"||mode==="results")&&world)){
    if(mode==="race"||mode==="pause")drawHud(CFG.step);
    renderer.render(scene,camera);}
  else if(mode==="garage")renderer.render(garageScene,camera);
  if(DEV){frames++;if(now-fpsAt>=500){fps=Math.round(frames*1000/(now-fpsAt));frames=0;fpsAt=now;}
    devEl.textContent=`${fps} fps calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles/1000|0)}k`
      +(sess?`\nv ${sess.speed.toFixed(1)} beta ${(sess.beta*57.3).toFixed(0)} combo ${sess.combo.toFixed(1)} cp ${sess.cp}`:"");}
}

/* ================= dev hook ================= */
if(DEV)window.__dy={
  state:()=>({mode,total:sess&&Math.round(sess.total),cur:sess&&Math.round(sess.cur),
    combo:sess&&+sess.combo.toFixed(2),t:sess&&+sess.t.toFixed(1),
    speed:sess&&+sess.speed.toFixed(1),beta:sess&&+(sess.beta*57.3).toFixed(1),
    x:sess&&+sess.x.toFixed(1),z:sess&&+sess.z.toFixed(1),
    y:sess&&+(sess.y||0).toFixed(2),air:sess&&!!sess.airborne,
    lap:sess&&sess.lap,cp:sess&&sess.cp,map:save.map,
    calls:renderer.info.render.calls,tris:renderer.info.render.triangles}),
  sess:()=>sess,world:()=>world,camera,scene,gcar:()=>garageCar,
  setMap(i){save.map=i;persist();},
  warpCp(){if(sess&&world.checkpoints){const c=world.checkpoints[sess.cp];sess.x=c.x;sess.z=c.z;}},
  timeUp(){if(sess){if(sess.mapMode==="drift")sess.t=.5;else{sess.lap=sess.laps;endSession();}}},
  give(n){if(sess)sess.total+=n;},
  foot(){if(sess)return enterFoot(sess);},
  djump(){if(sess&&sess.onFoot&&sess.onFoot.active)doJump(sess);},
  dpunch(){if(sess&&sess.onFoot&&sess.onFoot.active)doPunch(sess);},
  camyaw:v=>{footCamYaw=v;},getcam:()=>({yaw:+footCamYaw.toFixed(2),pitch:+footCamPitch.toFixed(2),
    cx:+camera.position.x.toFixed(1),cz:+camera.position.z.toFixed(1)}),
  joy:()=>joyVec,footcmd:()=>footCmd(),
  pit(){const P=dyPit;return P?{open:P.open,slide:+P.slide.toFixed(2),near:P.near,gears:P.gears.length,depth:P.DEPTH,cx:P.cx,cz:P.cz,lx:P.lever.x,lz:P.lever.z}:null;},
  setpit(o){if(dyPit)dyPit.open=o;},
  press(n){pressed.push(n);},
  probe(x,z,r){return{n:(world.colliders||[]).length,ramps:(world.ramps||[]).length,
    cand:(queryColliders(x,z,r||3)||[]).length,foot:pushOutFoot(x,z,r||.5)};},
  clips(){const out={};for(const k in A_ped){const g=A_ped[k];if(g&&g.animations)
    out[k]=g.animations.map(a=>({n:a.name,d:+a.duration.toFixed(2),tr:a.tracks.length}));}return out;},
  footpos:()=>{const of=sess&&sess.onFoot;return of&&of.active?{x:+of.x.toFixed(2),z:+of.z.toFixed(2),speed:+of.speed.toFixed(2),hp:of.hp}:null;},
  footState(){const of=sess&&sess.onFoot;if(!of||!of.active)return null;
    const meas=p=>{const b=new THREE.Box3().setFromObject(p.holder);
      const sk=new THREE.Box3();let got=false;p.holder.updateMatrixWorld(true);
      p.holder.traverse(o=>{if(o.isSkinnedMesh){o.computeBoundingBox();
        if(o.boundingBox){sk.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));got=true;}}});
      const box=got?sk:b;
      return{h:+(b.max.y-b.min.y).toFixed(2),skH:got?+(sk.max.y-sk.min.y).toFixed(2):null,
        s:+p.obj.scale.x.toFixed(3),y:+p.holder.position.y.toFixed(2),
        cx:+((box.min.x+box.max.x)/2).toFixed(2),cz:+((box.min.z+box.max.z)/2).toFixed(2)};};
    return{player:meas(of.ped),npcs:(of.npcs||[]).map(n=>meas(n.ped)),hp:of.hp,
      foottouch:getComputedStyle(document.getElementById("foottouch")).display,
      hpbar:getComputedStyle(document.getElementById("hpbar")).display};}};

/* ================= boot ================= */
(async()=>{
  window.__dyBooted=true;
  document.getElementById("logo").src=url("images/logo.webp");
  S.loading.style.backgroundImage=`url('${url("images/loading.jpg")}')`;
  loadMsg.textContent=L.loading;
  resize();
  await loadAll();
  applyQuality();resize();
  prepareCars();initMarks();initSmoke();
  loadPeds(); // precargar pilotos/animaciones en segundo plano: bajarse del auto es instantáneo
  loadMsg.textContent=L.tip;
  setTimeout(()=>{buildTitle(true);},300);
  requestAnimationFrame(frame);
})();
</script>
</body>
