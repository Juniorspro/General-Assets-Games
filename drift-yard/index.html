<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drift Yard</title>
<style>
:root{--ink:#f2efe8;--dim:#9a958c;--bg:#191a1e;--panel:rgba(24,25,30,.82);
  --org:#ff7a1a;--yel:#ffd23c;--red:#e84040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden}
body.rot #app{inset:auto;top:0;left:0;width:100vh;height:100vw;
  transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background-size:cover;background-position:center;text-align:center}
.screen.hidden{display:none}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,15,.55),rgba(12,12,15,.15) 40%,rgba(12,12,15,.65))}
.screen>*{position:relative}
#logo{width:min(40vh,64vw);filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tagline{font-style:italic;font-weight:400;opacity:.9;font-size:clamp(13px,2.2vh,18px)}
.btn{min-width:min(72vw,380px);padding:.7em 1.3em;font:900 clamp(14px,2.5vh,21px) inherit;letter-spacing:.07em;
  color:var(--ink);background:var(--panel);border:2px solid rgba(242,239,232,.35);border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.focus,.btn:hover:not(:disabled){border-color:var(--org);background:rgba(255,122,26,.18);
  box-shadow:0 0 16px rgba(255,122,26,.35)}
.btn small{display:block;font-weight:400;font-size:.6em;color:var(--dim);margin-top:.22em}
.title-xl{font-size:clamp(22px,5.2vh,44px);font-style:italic;letter-spacing:.05em;
  text-shadow:0 3px 0 rgba(0,0,0,.7)}
.org{color:var(--org)}.yel{color:var(--yel)}
.hint{color:var(--dim);font-weight:400;font-size:clamp(11px,1.8vh,14px);line-height:1.5}
#loadbar{width:min(70vw,420px);height:12px;background:var(--panel);border-radius:4px;overflow:hidden;
  border:1px solid rgba(242,239,232,.3)}
#loadbar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--yel),var(--org))}
#loadmsg{font-weight:400;color:var(--dim);font-size:13px}
#garage_ui{position:absolute;inset:0;z-index:10;display:none;pointer-events:none}
#garage_ui .top{position:absolute;top:4vh;left:0;right:0;text-align:center}
#carname{font-size:clamp(26px,5.6vh,50px);font-style:italic;letter-spacing:.08em;text-shadow:0 3px 0 rgba(0,0,0,.7)}
#stats{position:absolute;left:50%;transform:translateX(-50%);bottom:19vh;width:min(78vw,420px);
  background:var(--panel);border:1.5px solid rgba(242,239,232,.25);border-radius:10px;padding:10px 16px;text-align:left}
.stat{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:12px;letter-spacing:.15em;color:var(--dim)}
.stat .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.stat .bar>div{height:100%;background:var(--org)}
.garrow{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto;width:14vmin;height:14vmin;
  min-width:54px;min-height:54px;font:900 6vmin inherit;color:var(--ink);background:var(--panel);
  border:2px solid rgba(242,239,232,.35);border-radius:12px}
#gprev{left:3vmin}#gnext{right:3vmin}
#gbottom{position:absolute;bottom:3vh;left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:auto}
#gbest{position:absolute;bottom:12vh;left:0;right:0;text-align:center;color:var(--dim);font-weight:400;font-size:13px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;display:none}
#score{position:absolute;top:1.6vh;left:0;right:0;text-align:center;font-style:italic}
#score .total{font-size:clamp(24px,5vh,44px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#score .cur{font-size:clamp(15px,3vh,24px);color:var(--org);min-height:1.3em}
#score .cur .combo{color:var(--yel)}
#timer{position:absolute;top:2vh;right:2.4vw;font-size:clamp(17px,3.4vh,28px);font-style:italic;text-align:right}
#timer small{display:block;font-size:.55em;color:var(--dim);font-weight:400}
#speedo{position:absolute;right:2.4vw;bottom:2vh;text-align:right;font-style:italic}
#speedo .kmh{font-size:clamp(28px,5.6vh,48px);text-shadow:0 3px 0 rgba(0,0,0,.7)}
#speedo .ang{color:var(--org);font-size:clamp(12px,2.3vh,17px)}
#cparrow{position:absolute;left:50%;top:11vh;transform:translateX(-50%);font-size:clamp(22px,4.6vh,38px);
  color:var(--org);text-shadow:0 2px 0 rgba(0,0,0,.8);display:none}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:clamp(19px,4vh,34px);
  font-style:italic;color:var(--yel);text-shadow:0 3px 0 rgba(0,0,0,.8);opacity:0;transition:opacity .15s;white-space:nowrap}
#pausebtn{position:absolute;top:2vh;left:2.4vw;width:40px;height:40px;pointer-events:auto;
  font:900 16px inherit;color:var(--ink);background:var(--panel);border:1.5px solid rgba(242,239,232,.35);border-radius:8px}
#touch{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
.tbtn{position:absolute;pointer-events:auto;width:15vmin;height:15vmin;min-width:58px;min-height:58px;
  border-radius:14%;background:var(--panel);border:2px solid rgba(242,239,232,.35);color:var(--ink);
  font:900 4.8vmin inherit;display:flex;align-items:center;justify-content:center}
.tbtn.small{font-size:2.5vmin}
.tbtn.active{border-color:var(--org);box-shadow:0 0 14px rgba(255,122,26,.5)}
#tleft{left:3vmin;bottom:4vmin}#tright{left:20vmin;bottom:4vmin}
#tgas{right:3vmin;bottom:4vmin}#tbrake{right:20vmin;bottom:4vmin}#thand{right:3vmin;bottom:21vmin}
#dev{position:absolute;top:4px;left:52px;color:#0f0;font:12px monospace;display:none;z-index:99;
  background:rgba(0,0,0,.55);padding:2px 6px;pointer-events:none;white-space:pre}
.rowlist{display:flex;flex-direction:column;gap:10px;max-height:64vh;overflow-y:auto;padding:4px}
.results-grid{font-size:clamp(14px,2.7vh,21px);line-height:1.85;font-style:italic}
.medal{font-size:clamp(28px,5.6vh,50px)}
</style>

<script>
window.__dyBooted=false;
(function(){
  function show(m){var el=document.getElementById("loadmsg");if(el)el.textContent=m;}
  addEventListener("error",function(e){if(e&&e.message)show("ERROR: "+e.message.slice(0,140));},true);
  addEventListener("unhandledrejection",function(e){
    var r=e&&e.reason;show("ERROR: "+String(r&&r.message||r).slice(0,140));});
  setTimeout(function(){
    if(window.__dyBooted)return;
    if(typeof HTMLScriptElement!=="undefined"&&HTMLScriptElement.supports&&!HTMLScriptElement.supports("importmap")){
      show("Este navegador no soporta importmap — probá con Chrome actualizado");return;}
    show("Diagnosticando red…");
    fetch(window.__BASE+"vendor/three.module.js",{method:"HEAD",cache:"no-store"}).then(function(r){
      show(r.ok?"Red OK pero el motor no arrancó — reintentá o mandá captura":"El CDN respondió "+r.status);
    }).catch(function(err){show("Sin acceso al CDN: "+String(err&&err.message||err).slice(0,100));});
  },8000);
})();
</script>

paused:"PAUSED",resume:"RESUME",restart:"RESTART",exit:"QUIT",timeUp:"TIME'S UP!",results:"RESULTS",
score:"SCORE",bestDrift:"BEST DRIFT",newRecord:"NEW RECORD!",retry:"RETRY",garage:"GARAGE",menu:"MENU",

modeDrift:"DRIFT · 3 MIN",modeRace:"RACE · 3 LAPS",

tip:"Hold the slide to build combo; straighten to bank. Ice has almost no grip.",
map_puerto:"THE PORT",map_bosque:"FOREST RALLY",map_aeropuerto:"AIRFIELD",map_azotea:"ROOFTOP",
map_nieve:"SNOWLINE",map_canyon:"CANYON",
desc_katana:"Balanced and stylish. The classic.",desc_bandido:"A brute. Raw power, hard to tame.",
desc_hachi:"Light and playful. It dances.",desc_toro:"Wide and stable. Long, lazy slides."},
};

/* ================= save ================= */
const SAVE_KEY="driftyard.save.v2";
const defaults=()=>({lang:(navigator.language||"en").toLowerCase().startsWith("es")?"es":"en",
  sound:true,quality:(navigator.maxTouchPoints>0?"low":"high"),car:0,time:"tarde",map:0,
  best:{},bestDrift:{},bestTime:{}});
let save=defaults();
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||"{}"));}catch{}
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch{}};
let L=STR[save.lang];

/* ================= config ================= */
const CFG={step:1/60,session:180,carR:1.35,
  driftMinDeg:10,driftMinV:5,bankGap:1.2,fovBase:60,fovMax:70};
const CARS=[
 {id:"katana",name:"KATANA",file:"car_katana.glb",accel:24,top:33,grip:9.2,turn:2.2,kick:1.05,len:4.5},
 {id:"bandido",name:"BANDIDO",file:"car_bandido.glb",accel:30,top:37,grip:7.8,turn:1.95,kick:1.3,len:4.9},
 {id:"hachi",name:"HACHI",file:"car_hachi.glb",accel:20,top:29,grip:10.2,turn:2.55,kick:.9,len:4.1},
 {id:"toro",name:"TORO",file:"car_toro.glb",accel:26,top:35,grip:8.5,turn:2.1,kick:1.15,len:4.7},
];
const TIMES={
 dia:  {sun:0xfff3de,sunI:2.4,sunPos:[140,240,80],hemiI:1.15,hemiSky:0xbcd8f5,hemiGnd:0x77746e,fog:0xc9d6e2,fogD:.0006,flood:false},
 tarde:{sun:0xffd2a0,sunI:2.1,sunPos:[-220,150,-40],hemiI:1.35,hemiSky:0xa8b6dd,hemiGnd:0x6e655e,fog:0xdcc3a6,fogD:.00042,flood:false},
 noche:{sun:0x9fb2ff,sunI:.9,sunPos:[100,200,-140],hemiI:.6,hemiSky:0x39466e,hemiGnd:0x1c1f2a,fog:0x131a2e,fogD:.001,flood:true},
};
const Q=new URLSearchParams(location.search);
const DEV=Q.has("dev");
if(DEV)document.getElementById("dev").style.display="block";

/* ================= asset base ================= */
const PRIMARY=window.__BASE+"assets/";
const ALT=(window.__BASE==="./"&&window.__CDN_OK)
  ?"https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@762405f4932cb2a37e39399716a1c6b97b0eb661/drift-yard/assets/"
  :"./assets/";
const url=p=>PRIMARY+p, altUrl=p=>ALT+p;

/* ================= loading ================= */
const loadBar=document.querySelector("#loadbar>div"),loadMsg=document.getElementById("loadmsg");
let loadTotal=0,loadDone=0,loadFailed=[];
function tick(name,ok){loadDone++;if(!ok)loadFailed.push(name);
  loadBar.style.width=(100*loadDone/Math.max(loadTotal,1))+"%";
  loadMsg.textContent=`${L.loading} ${loadDone}/${loadTotal}`;}
const texLoader=new THREE.TextureLoader(),gltfLoader=new GLTFLoader();
function loadTex(p,{srgb=false}={}){loadTotal++;
  return new Promise(res=>{const go=(u,retry)=>texLoader.load(u,t=>{
      if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;tick(p,true);res(t);
    },undefined,()=>retry?go(altUrl(p),false):(tick(p,false),res(null)));
    go(url(p),true);});}
function loadGLB(p){loadTotal++;
  return new Promise(res=>{const go=(u,retry)=>gltfLoader.load(u,g=>{tick(p,true);res(g);},
    undefined,()=>retry?go(altUrl(p),false):(tick(p,false),res(null)));
    go(url(p),true);});}
async function loadAudioBuf(p){loadTotal++;
  const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.arrayBuffer();};
  try{const b=await get(url(p)).catch(()=>get(altUrl(p)));tick(p,true);return b;}
  catch{tick(p,false);return null;}}

/* ================= audio ================= */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,master=null,musicSrc=null;
const MIX={music:.15,sfx:.35,engine:.2,skid:.3};
const SND={};
function audioInit(){if(actx||!AC)return;actx=new AC();master=actx.createGain();master.gain.value=.8;master.connect(actx.destination);}
async function decodeAll(){if(!actx)return;for(const k in SND){const s=SND[k];
  if(s&&s.raw&&!s.buf){try{s.buf=await actx.decodeAudioData(s.raw.slice(0));}catch{}}}}
function sfx(n,vol=1,rate=1){const s=SND[n];if(!save.sound||!actx||!s||!s.buf)return;
  const src=actx.createBufferSource();src.buffer=s.buf;src.playbackRate.value=rate;
  const g=actx.createGain();g.gain.value=MIX.sfx*vol;src.connect(g);g.connect(master);src.start();}
function music(n){stopMusic();const s=SND[n];if(!save.sound||!actx||!s||!s.buf)return;
  musicSrc=actx.createBufferSource();musicSrc.buffer=s.buf;musicSrc.loop=true;
  const g=actx.createGain();g.gain.value=MIX.music;musicSrc.connect(g);g.connect(master);musicSrc.start();}
function stopMusic(){if(musicSrc){try{musicSrc.stop();}catch{}musicSrc=null;}}
const engineRef={src:null,gain:null},skidRef={src:null,gain:null};
function loopStart(name,ref){const s=SND[name];if(!save.sound||!actx||!s||!s.buf||ref.src)return;
  ref.src=actx.createBufferSource();ref.src.buffer=s.buf;ref.src.loop=true;
  ref.gain=actx.createGain();ref.gain.gain.value=0;ref.src.connect(ref.gain);ref.gain.connect(master);ref.src.start();}
function loopsStart(){loopStart("sfx_engine",engineRef);loopStart("sfx_skid_loop",skidRef);}
function loopsStop(){for(const r of[engineRef,skidRef]){if(r.src){try{r.src.stop();}catch{}r.src=null;}}}
function engineSet(r){if(engineRef.src){engineRef.gain.gain.value=MIX.engine*(.4+.6*r);
  engineRef.src.playbackRate.value=.5+1.4*r;}}
function skidSet(v){if(skidRef.src)skidRef.gain.gain.value=MIX.skid*v;}
function applySound(){if(!save.sound){stopMusic();loopsStop();}
  else{music(mode==="race"?"music_drift":"music_menu");if(mode==="race")loopsStart();}}

/* ================= input ================= */
const BIND={KeyW:"up",KeyS:"down",KeyA:"left",KeyD:"right",ArrowUp:"up",ArrowDown:"down",
  ArrowLeft:"left",ArrowRight:"right",Space:"hand",Enter:"ok",KeyP:"pause",Escape:"pause"};
const held=new Set();const pressed=[];
addEventListener("keydown",e=>{const c=BIND[e.code];if(c){if(!held.has(c))pressed.push(c);held.add(c);e.preventDefault();}});
addEventListener("keyup",e=>{const c=BIND[e.code];if(c)held.delete(c);});
const PADB={0:"okA",1:"back",9:"pause",12:"up",13:"down",14:"left",15:"right"};
let padPrev={},padSteer=0,padGas=0,padBrake=0;
function pollPads(){padSteer=0;padGas=0;padBrake=0;const cur={};
  for(const gp of(navigator.getGamepads?navigator.getGamepads():[])){if(!gp)continue;
    const ax=gp.axes[0]||0;if(Math.abs(ax)>.15)padSteer=ax;
    padGas=Math.max(padGas,gp.buttons[7]?gp.buttons[7].value:0);
    padBrake=Math.max(padBrake,gp.buttons[6]?gp.buttons[6].value:0);
    for(const i in PADB)cur[i]=cur[i]||(gp.buttons[i]&&gp.buttons[i].pressed);}
  for(const i in PADB){const nm=PADB[i];
    if(cur[i]&&!padPrev[i])pressed.push(nm==="okA"?"ok":nm);
    if(cur[i])held.add("pad_"+nm);else held.delete("pad_"+nm);padPrev[i]=cur[i];}}
let touchDevice=navigator.maxTouchPoints>0;
const tstate={left:false,right:false,gas:false,brake:false,hand:false};
for(const id of["tleft","tright","tgas","tbrake","thand"]){
  const el=document.getElementById(id),key=id.slice(1);
  const on=e=>{e.preventDefault();touchDevice=true;interact();tstate[key]=true;el.classList.add("active");};

function normalizeModel(glb,{length=null,height=null,rotY=0}={}){
  if(!glb)return null;
  const root=glb.scene.clone(true);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;
    if(o.material&&o.material.transparent){o.material=o.material.clone();
      o.material.transparent=false;o.material.alphaTest=.5;o.material.depthWrite=true;}}});
  const g=new THREE.Group();g.add(root);
  root.rotation.y=rotY;
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3());
  let s=1;
  if(length)s=length/Math.max(size.z,1e-4);
  else if(height)s=height/Math.max(size.y,1e-4);
  root.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(root);
  const c=b2.getCenter(new THREE.Vector3());
  root.position.x-=c.x;root.position.z-=c.z;root.position.y-=b2.min.y;
  return g;}

  const probe=new THREE.Box3().setFromObject(glb.scene);

    for(const n of Object.keys(geo.attributes))if(!["position","normal","uv"].includes(n))geo.deleteAttribute(n);
    mat=o.material;}});
  return geo?{geo,mat}:null;}

function buildBosque(group,timeKey){
  const rng=mulberry32(4242);
  const{colliders,T}=baseEnv(group,timeKey,{fenceOn:false,apron:false,noGround:true,w:1,d:1,marks:null,skyBiome:"bosque"});
  // grass world
  const gm=stdMat("ground",{repeat:[200,200]});gm.color.set(0x6f8a55);
  const terr=new THREE.Mesh(new THREE.CircleGeometry(1600,48),gm);
  terr.rotation.x=-Math.PI/2;terr.position.y=-.02;terr.receiveShadow=true;group.add(terr);
  // road loop
  const pts=[[0,-260],[170,-240],[290,-140],[310,20],[220,120],[250,240],[80,300],
    [-120,260],[-90,120],[-230,80],[-320,-60],[-230,-220]].map(p=>new THREE.Vector3(p[0],0,p[1]));
  const curve=new THREE.CatmullRomCurve3(pts,true,"centripetal",.5);
  curve.arcLengthDivisions=2000;
  const len=curve.getLength(),ds=4,n=Math.ceil(len/ds);
  const P=[],TN=[],LF=[];
  for(let i=0;i<n;i++){P.push(curve.getPointAt(i/n));TN.push(curve.getTangentAt(i/n).normalize());}
  for(let i=0;i<n;i++)LF.push(new THREE.Vector3(TN[i].z,0,-TN[i].x).normalize());
  const halfW=5.5;
  function ribbon(l1,l2,y,mat,uAcross){
    const pos=[],uv=[],idx=[];
    for(let i=0;i<=n;i++){const ii=i%n;
      const p1=P[ii].clone().addScaledVector(LF[ii],l1);
      const p2=P[ii].clone().addScaledVector(LF[ii],l2);
      pos.push(p1.x,y,p1.z,p2.x,y,p2.z);
      const v=(i*ds)/7;uv.push(0,v,uAcross,v);}
    for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat);m.receiveShadow=true;group.add(m);}
  const roadMat=stdMat("road",{repeat:[1,1]});roadMat.color.set(0xdadae4);
  ribbon(-halfW,halfW,.01,roadMat,1.6);
  const lineMat=new THREE.MeshBasicMaterial({color:0xe8e4da,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-6});
  ribbon(-halfW+.1,-halfW+.4,.06,lineMat,1);
  ribbon(halfW-.4,halfW-.1,.06,lineMat,1);
  // trees (X billboards) — oaks & pines mixed, denser near road but never on it
  const oaks=[],pines2=[];
  for(let i=0;i<900;i++){
    const a=rng()*6.28,r=60+rng()*520;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    // distance to road: sample coarse
    let dmin=1e9;for(let j=0;j<n;j+=6){const dx=P[j].x-x,dz=P[j].z-z;
      const d2=dx*dx+dz*dz;if(d2<dmin)dmin=d2;}
    dmin=Math.sqrt(dmin);
    if(dmin<halfW+4)continue;
    const s=9+rng()*8;
    (rng()<.55?oaks:pines2).push([x,z,rng()*6.28,s]);
    if(dmin<halfW+13&&oaks.length+pines2.length<160)colliders.push({type:"circle",x,z,r:.6});}
  billboardTrees(group,"tree_oak",oaks);
  billboardTrees(group,"tree_pine",pines2);
  // houses near the road
  const houseT=normalizeModel(A.glb.house,{height:7});
  if(houseT)for(const t of[.12,.34,.55,.72,.9]){
    const i=Math.floor(t*n);const side=t<.5?1:-1;
    const p=P[i].clone().addScaledVector(LF[i],side*(halfW+12));
    const h=houseT.clone(true);h.position.copy(p);
    h.rotation.y=Math.atan2(TN[i].x,TN[i].z)+ (side>0?-Math.PI/2:Math.PI/2);
    group.add(h);colliders.push(obb(p.x,p.z,4.5,3.5,h.rotation.y));}
  // checkpoints
  const cps=[];
  const NCP=10;
  const postMat=new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.6});
  const bannerMat=new THREE.MeshBasicMaterial({color:0xff7a1a});
  for(let k=0;k<NCP;k++){
    const i=Math.floor(k/NCP*n);
    const p=P[i],lf=LF[i];
    cps.push({x:p.x,z:p.z,r:11});
    const gate=new THREE.Group();
    for(const s of[-1,1]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,4.6,8),postMat);
      post.position.copy(p).addScaledVector(lf,s*(halfW+.8));post.position.y=2.3;gate.add(post);}
    const ban=new THREE.Mesh(new THREE.BoxGeometry((halfW+.8)*2,.7,.12),k===0?new THREE.MeshBasicMaterial({color:0xffd23c}):bannerMat);
    ban.position.copy(p);ban.position.y=4.4;
    ban.rotation.y=Math.atan2(TN[i].x,TN[i].z)+Math.PI/2;
    gate.add(ban);group.add(gate);}
  const t0=TN[0];
  return{colliders,spawn:{x:P[2].x,z:P[2].z,h:Math.atan2(t0.x,t0.z)},
    bounds:{W:1500,D:1500},road:{P,TN,LF,n,ds,halfW},checkpoints:cps};}

  if(rustyT){rustyT.traverse(o=>{if(o.name==="Plane001")o.visible=false;});
    const c=rustyT.clone(true);c.position.set(40,0,-70);c.rotation.y=2.2;group.add(c);
    colliders.push(obb(40,-70,1.1,2.4,2.2));}
  conesAt(group,rng,[[-70,-40,9,24],[55,45,9,24]]);
  floodTowers(group,colliders,[[-W+8,-D+8],[W-8,D-8]],T);
  return{colliders,spawn:{x:-70,z:66,h:Math.PI},bounds:{W:W-CFG.carR,D:D-CFG.carR}};}

function buildWorld(mapIdx,timeKey){

/* ================= physics v2 ================= */
function update(dt){
  if(mode==="title"&&world){menuOrbit(dt);return;}
  if(mode==="garage"&&garageCar){garageCar.rotation.y+=dt*.5;return;}
  if(mode!=="race"||!sess)return;
  const s=sess,cmd=commands(),st=s.stats,M=MAPS[save.map];
  if(s.go>0){s.go-=dt;if(s.go<=0)document.getElementById("toast").style.opacity=0;}
  if(!s.over){if(s.mapMode==="drift"){s.t-=dt;if(s.t<=0){s.t=0;endSession();}}
    else s.t+=dt;}
  s.shake=Math.max(0,s.shake-dt*3*s.shake);
  for(const c of world.chimneys||[])if((s.chimT-=dt)<=0){s.chimT=.5;
    spawnPuffAt(c.x+(Math.random()-.5),c.y,c.z+(Math.random()-.5),2.2);break;}

  // smoothed steering feeds the physics (heavier, less twitchy)
  s.physSteer+=(cmd.steer-s.physSteer)*Math.min(1,dt*6.5);
  s.steerVis=s.physSteer;
  const steer=s.physSteer;
  const sinH=Math.sin(s.h),cosH=Math.cos(s.h);
  let vF=s.vx*sinH+s.vz*cosH;
  let vL=s.vx*cosH-s.vz*sinH;
  const speed=Math.hypot(s.vx,s.vz);

  // surface effects
  let surfGrip=1,surfAccel=1,offroad=false;
  if(world.ice)for(const z of world.ice){const dx=s.x-z.x,dz=s.z-z.z;
    if(dx*dx+dz*dz<z.r*z.r){surfGrip=.25;surfAccel=.55;break;}}
  if(world.road){ // forest race: off the asphalt = heavy drag
    const R=world.road;let best=1e9,bi=s.roadIdx;
    for(let k=-40;k<=40;k++){const j=((s.roadIdx+k)%R.n+R.n)%R.n;
      const dx=R.P[j].x-s.x,dz=R.P[j].z-s.z;const d2=dx*dx+dz*dz;
      if(d2<best){best=d2;bi=j;}}
    s.roadIdx=bi;
    offroad=Math.sqrt(best)>R.halfW+ .6;}

  // progressive acceleration toward each car's own top speed
  if(s.over)vF-=vF*1.2*dt;
  else if(cmd.up)vF+=st.accel*Math.max(0,1-Math.max(vF,0)/st.top)*1.75*surfAccel*dt;
  else if(cmd.down)vF-=(vF>1?42:12)*dt;
  else vF-=vF*.4*dt;
  if(offroad){vF-=vF*1.5*dt;s.shake=Math.min(.4,s.shake+dt);}
  vF=Math.max(-8,Math.min(vF,st.top));

  let grip=st.grip*surfGrip;
  const hand=cmd.hand&&!s.over;
  if(hand)grip*=.18;
  else if(cmd.up&&Math.abs(steer)>.5&&vF>12)grip*=.5;
  vL-=vL*Math.min(1,grip*dt);
  if(hand&&Math.abs(steer)>.05)vL-=steer*st.kick*Math.max(vF,0)*.6*dt;
  // slide scrubs a little forward speed — manage the angle to keep momentum
  vF-=Math.abs(vL)*.14*dt*Math.sign(Math.max(vF,0));

  const beta=Math.atan2(vL,Math.max(Math.abs(vF),.6));
  const driftFactor=Math.min(Math.abs(beta)*1.4,1);
  s.h+=steer*st.turn*dt*Math.max(-1,Math.min(vF/8,1))*(1+driftFactor*.65);
  s.h-=beta*.7*dt;
  s.vx=sinH*vF+cosH*vL;s.vz=cosH*vF-sinH*vL;
  s.x+=s.vx*dt;s.z+=s.vz*dt;
  s.beta=beta;s.speed=Math.hypot(s.vx,s.vz);

  /* collisions */
  let hit=false;
  const B=world.bounds;
  if(B){if(s.x<-B.W){s.x=-B.W;s.vx=Math.abs(s.vx)*.35;hit=speed>7;}
    if(s.x>B.W){s.x=B.W;s.vx=-Math.abs(s.vx)*.35;hit=hit||speed>7;}
    if(s.z<-B.D){s.z=-B.D;s.vz=Math.abs(s.vz)*.35;hit=hit||speed>7;}
    if(s.z>B.D){s.z=B.D;s.vz=-Math.abs(s.vz)*.35;hit=hit||speed>7;}}
  for(const c of world.colliders){
    if(c.type==="circle"){const dx=s.x-c.x,dz=s.z-c.z,d=Math.hypot(dx,dz),m=c.r+CFG.carR;
      if(d<m&&d>1e-4){s.x=c.x+dx/d*m;s.z=c.z+dz/d*m;
        const dot=(s.vx*dx+s.vz*dz)/d;
        if(dot<0){s.vx-=1.5*dot*dx/d;s.vz-=1.5*dot*dz/d;s.vx*=.88;s.vz*=.88;hit=hit||speed>7;}}}
    else if(c.type==="capsule"){
      const abx=c.bx-c.ax,abz=c.bz-c.az;
      const tt=Math.max(0,Math.min(1,((s.x-c.ax)*abx+(s.z-c.az)*abz)/(abx*abx+abz*abz)));
      const qx=c.ax+abx*tt,qz=c.az+abz*tt;
      const dx=s.x-qx,dz=s.z-qz,d=Math.hypot(dx,dz),m=c.r+CFG.carR;
      if(d<m&&d>1e-4){s.x=qx+dx/d*m;s.z=qz+dz/d*m;
        const dot=(s.vx*dx+s.vz*dz)/d;
        if(dot<0){s.vx-=1.5*dot*dx/d;s.vz-=1.5*dot*dz/d;s.vx*=.88;s.vz*=.88;hit=hit||speed>7;}}}
    else{const dx=s.x-c.x,dz=s.z-c.z;
      const lx=dx*c.cos-dz*c.sin,lz=dx*c.sin+dz*c.cos;
      const px2=Math.max(-c.hw,Math.min(lx,c.hw)),pz2=Math.max(-c.hd,Math.min(lz,c.hd));
      const ddx=lx-px2,ddz=lz-pz2,d=Math.hypot(ddx,ddz);
      if(d<CFG.carR){
        const push=(CFG.carR-d)||CFG.carR;
        let nx,nz;
        if(d>1e-4){nx=ddx/d;nz=ddz/d;}
        else{const ex=c.hw-Math.abs(lx),ez=c.hd-Math.abs(lz);
          if(ex<ez){nx=Math.sign(lx)||1;nz=0;}else{nx=0;nz=Math.sign(lz)||1;}}
        const wx=nx*c.cos+nz*c.sin,wz=-nx*c.sin+nz*c.cos;
        s.x+=wx*push;s.z+=wz*push;
        const dot=s.vx*wx+s.vz*wz;
        if(dot<0){s.vx-=1.6*dot*wx;s.vz-=1.6*dot*wz;s.vx*=.85;s.vz*=.85;hit=hit||speed>7;}}}}
  if(hit){sfx("sfx_crash",Math.min(1,speed/22),1);s.shake=1;
    if(s.mapMode==="drift"&&s.cur>0){s.cur=0;s.combo=1;s.driftT=0;toast(L.comboLost,"var(--red)");}}

  /* scoring */
  const betaDeg=Math.abs(beta)*57.29578;
  const drifting=!s.over&&betaDeg>CFG.driftMinDeg&&s.speed>CFG.driftMinV;
  if(s.mapMode==="drift"){
    if(drifting){s.driftT+=dt;s.gapT=0;
      s.combo=Math.min(5,s.combo+dt*.22);
      s.cur+=s.speed*betaDeg*.10*dt*s.combo;}
    else if(s.cur>0){s.gapT+=dt;
      if(s.gapT>CFG.bankGap){const pts=Math.round(s.cur);
        s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);
        s.cur=0;s.combo=1;s.driftT=0;
        sfx("sfx_chime",.7,1.2);toast("+"+fmtN(pts),"var(--yel)");}}}
  else{ // race checkpoints
    const cps=world.checkpoints;
    const c=cps[s.cp];
    const dx=s.x-c.x,dz=s.z-c.z;
    if(dx*dx+dz*dz<c.r*c.r){
      s.cp++;sfx("sfx_chime",.5,1.4);
      if(s.cp>=cps.length){s.cp=0;s.lap++;
        const lt=s.t-s.lapStart;s.lapStart=s.t;
        if(s.lap>0){s.lapTimes.push(lt);
          if(s.bestLapT===null||lt<s.bestLapT)s.bestLapT=lt;}
        if(s.lap>=s.laps)endSession();
        else toast(s.lap===s.laps-1?L.finalLap:`${L.lap} ${s.lap+1}/${s.laps}`,"var(--yel)");}}}

  engineSet(Math.min(1,Math.abs(vF)/st.top));
  skidSet(drifting?Math.min(1,betaDeg/40)*(s.speed/st.top+.4):0);
  if(drifting&&s.speed>7){spawnSmoke(s);writeMark(s);}

  /* car placement + chase camera */
  s.obj.position.set(s.x,0,s.z);
  s.obj.rotation.set(0,s.h,0);
  s.obj.rotateZ(-s.steerVis*.04*Math.min(1,s.speed/22));
  let dyaw=s.h-s.camYaw;while(dyaw>Math.PI)dyaw-=2*Math.PI;while(dyaw<-Math.PI)dyaw+=2*Math.PI;
  s.camYaw+=dyaw*Math.min(1,dt*4.4);
  const cx=s.x-Math.sin(s.camYaw)*7.8,cz=s.z-Math.cos(s.camYaw)*7.8;
  camera.position.lerp(V.set(cx,3.1,cz),1-Math.pow(.0001,dt));
  {const ddx=camera.position.x-s.x,ddz=camera.position.z-s.z;
   const d=Math.hypot(ddx,ddz);
   if(d<5.5){const k=5.5/Math.max(d,.001);
     camera.position.x=s.x+ddx*k;camera.position.z=s.z+ddz*k;}
   camera.position.y=Math.max(camera.position.y,2.6);}
  if(s.shake>.02){camera.position.x+=(Math.random()-.5)*.4*s.shake;
    camera.position.y+=(Math.random()-.5)*.25*s.shake;}
  camera.lookAt(s.x+Math.sin(s.h)*3,1.1,s.z+Math.cos(s.h)*3);
  const fovT=CFG.fovBase+(CFG.fovMax-CFG.fovBase)*Math.min(1,s.speed/st.top);
  camera.fov+=(fovT-camera.fov)*.06;camera.updateProjectionMatrix();
}
let orbitA=0;
function menuOrbit(dt){orbitA+=dt*.055;
  const r=105,cx=Math.cos(orbitA)*r,cz=Math.sin(orbitA)*r;
  camera.position.lerp(V.set(cx,42,cz),Math.min(1,dt*2));
  camera.lookAt(0,0,0);
  camera.fov+=(52-camera.fov)*.05;camera.updateProjectionMatrix();
  if(world&&world.chimneys)for(const c of world.chimneys){
    if(Math.random()<dt*2)spawnPuffAt(c.x,c.y,c.z,2.2);}}

/* ================= skid marks ================= */
const MARKN=2200;
let markGeo=null,markHead=0;
function initMarks(){
  markGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(MARKN*4*3);
  const idx=new Uint32Array(MARKN*6);
  for(let i=0;i<MARKN;i++){const a=i*4;idx.set([a,a+2,a+1,a+1,a+2,a+3],i*6);}
  markGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  markGeo.setIndex(new THREE.BufferAttribute(idx,1));
  const m=new THREE.Mesh(markGeo,new THREE.MeshBasicMaterial({color:0x131215,
    transparent:true,opacity:.5,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2}));
  m.frustumCulled=false;scene.add(m);}
let lastMark={x:0,z:0,h:0,has:false};
function writeMark(s){
  if(lastMark.has&&Math.hypot(s.x-lastMark.x,s.z-lastMark.z)<.6)return;
  const pos=markGeo.attributes.position.array;
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1]){
    const w=.78*side;
    const rx=s.x-sh*1.4+ch*w,rz=s.z-ch*1.4-sh*w;
    const lx=lastMark.has?lastMark.x-Math.sin(lastMark.h)*1.4+Math.cos(lastMark.h)*w:rx-sh*.6,
          lz=lastMark.has?lastMark.z-Math.cos(lastMark.h)*1.4-Math.sin(lastMark.h)*w:rz-ch*.6;
    const j=markHead=(markHead+1)%MARKN,o=j*12;
    const px=ch*.14,pz=-sh*.14;
    pos[o]=lx-px;pos[o+1]=.04;pos[o+2]=lz-pz;
    pos[o+3]=lx+px;pos[o+4]=.04;pos[o+5]=lz+pz;
    pos[o+6]=rx-px;pos[o+7]=.04;pos[o+8]=rz-pz;
    pos[o+9]=rx+px;pos[o+10]=.04;pos[o+11]=rz+pz;}
  markGeo.attributes.position.needsUpdate=true;
  lastMark={x:s.x,z:s.z,h:s.h,has:true};}
function clearMarks(){if(!markGeo)return;
  markGeo.attributes.position.array.fill(0);
  markGeo.attributes.position.needsUpdate=true;lastMark.has=false;}

/* ================= smoke ================= */
const SMOKEN=320;
let smokeGeo=null,smokeHead=0;
const smokeLife=new Float32Array(SMOKEN),smokeVel=new Float32Array(SMOKEN*3);
function initSmoke(){
  smokeGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(SMOKEN*3);pos.fill(-9999);
  smokeGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(smokeGeo,new THREE.PointsMaterial({map:smokeTex,size:3.6,
    transparent:true,opacity:.3,depthWrite:false,color:0xd8d5d0}));
  p.frustumCulled=false;scene.add(p);}
function spawnPuffAt(x,y,z,vy=1.6){
  const j=smokeHead=(smokeHead+1)%SMOKEN,o=j*3;
  const pos=smokeGeo.attributes.position.array;
  pos[o]=x;pos[o+1]=y;pos[o+2]=z;
  smokeVel[o]=(Math.random()-.5)*.8;smokeVel[o+1]=vy+Math.random();smokeVel[o+2]=(Math.random()-.5)*.8;
  smokeLife[j]=2.2;}
function spawnSmoke(s){
  const sh=Math.sin(s.h),ch=Math.cos(s.h);
  for(const side of[-1,1])
    spawnPuffAt(s.x-sh*1.4+ch*.8*side,.3,s.z-ch*1.4-sh*.8*side,1.1+Math.random());}
function updateSmoke(dt){let any=false;
  const pos=smokeGeo.attributes.position.array;
  for(let j=0;j<SMOKEN;j++){if(smokeLife[j]<=0)continue;any=true;
    smokeLife[j]-=dt;const o=j*3;
    pos[o]+=smokeVel[o]*dt;pos[o+1]+=smokeVel[o+1]*dt;pos[o+2]+=smokeVel[o+2]*dt;
    if(smokeLife[j]<=0)pos[o+1]=-9999;}
  if(any)smokeGeo.attributes.position.needsUpdate=true;}
function clearSmoke(){if(!smokeGeo)return;
  smokeGeo.attributes.position.array.fill(-9999);smokeLife.fill(0);
  smokeGeo.attributes.position.needsUpdate=true;}

/* ================= HUD ================= */
const elTotal=document.querySelector("#score .total"),elCur=document.querySelector("#score .cur"),
  elTimer=document.getElementById("timer"),elKmh=document.querySelector("#speedo .kmh"),
  elAng=document.querySelector("#speedo .ang"),elToast=document.getElementById("toast"),
  elArrow=document.getElementById("cparrow");
let toastT=0;
function toast(t,color){elToast.textContent=t;elToast.style.color=color||"var(--yel)";
  elToast.style.opacity=1;toastT=1.3;}
function fmtN(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function fmtT(s){if(s==null)return"--:--";const m=Math.floor(s/60);
  return`${m}:${(s-m*60).toFixed(1).padStart(4,"0")}`;}
function drawHud(dt){if(!sess)return;
  if(toastT>0){toastT-=dt;if(toastT<=0&&sess.go<=0)elToast.style.opacity=0;}
  if(sess.mapMode==="drift"){
    elTotal.textContent=fmtN(Math.round(sess.total));
    elCur.innerHTML=sess.cur>0?`+${fmtN(Math.round(sess.cur))} <span class="combo">×${sess.combo.toFixed(1)}</span>`:"";
    elTimer.firstChild.textContent=fmtT(sess.t);
    elTimer.querySelector("small").textContent="";
    elTimer.style.color=sess.t<20?"var(--red)":"var(--ink)";
    elArrow.style.display="none";}
  else{
    elTotal.textContent=`${L.lap} ${Math.min(sess.lap+1,sess.laps)}/${sess.laps}`;
    elCur.innerHTML=`CP ${sess.cp}/${world.checkpoints.length}`;
    elTimer.firstChild.textContent=fmtT(sess.t);
    elTimer.querySelector("small").textContent=sess.bestLapT?`${L.bestLapS} ${fmtT(sess.bestLapT)}`:"";
    elTimer.style.color="var(--ink)";
    // checkpoint arrow relative to camera yaw
    const c=world.checkpoints[sess.cp];
    const ang=Math.atan2(c.x-sess.x,c.z-sess.z)-sess.camYaw;
    elArrow.style.display="block";
    elArrow.style.transform=`translateX(-50%) rotate(${(-ang*57.3).toFixed(0)}deg)`;}
  elKmh.textContent=Math.round(sess.speed*3.6);
  const bd=Math.abs(sess.beta)*57.3;
  elAng.textContent=bd>8?Math.round(bd)+"°":"";
}

const S={loading:document.getElementById("s_loading"),title:document.getElementById("s_title"),
  maps:document.getElementById("s_maps"),time:document.getElementById("s_time"),
  pause:document.getElementById("s_pause"),results:document.getElementById("s_results")};
const hud=document.getElementById("hud"),garageUI=document.getElementById("garage_ui");
let focusIdx=0,focusList=[];
function show(name){for(const k in S)S[k].classList.toggle("hidden",k!==name);
  mode=name;
  hud.style.display=name==="race"?"block":"none";
  garageUI.style.display=name==="garage"?"block":"none";
  if(name==="race"||name==="garage")for(const k in S)S[k].classList.add("hidden");
  refreshTouchUI();focusIdx=0;refreshFocus();}

  .filter(b=>b.offsetParent!==null);
  focusList.forEach((b,i)=>b.classList.toggle("focus",i===focusIdx));}
function menuNav(){while(pressed.length){const c=pressed.shift();
  if(mode==="race"){if(c==="pause")togglePause();continue;}
  if(mode==="garage"){
    if(c==="left"){cycleCar(-1);continue;}
    if(c==="right"){cycleCar(1);continue;}
    if(c==="ok"){buildTimeSel();continue;}
    if(c==="back"||c==="pause"){buildMaps();continue;}}
  if(!focusList.length){refreshFocus();if(!focusList.length)continue;}
  if(c==="up"||c==="left"){focusIdx=(focusIdx-1+focusList.length)%focusList.length;refreshFocus();}
  if(c==="down"||c==="right"){focusIdx=(focusIdx+1)%focusList.length;refreshFocus();}
  if(c==="ok"){const b=focusList[focusIdx];if(b)b.click();}
  if(c==="pause"||c==="back"){if(mode==="pause")togglePause();
    else if(mode==="maps")buildTitle(false);
    else if(mode==="time")buildGarageUI();}}}
function btn(label,cb,{sub=null,disabled=false}={}){const b=document.createElement("button");
  b.className="btn";b.disabled=disabled;b.innerHTML=label+(sub?`<small>${sub}</small>`:"");
  b.addEventListener("click",()=>{interact();cb();});return b;}

function buildTitle(rebuildWorld=true){const s=S.title;s.innerHTML="";
  if(rebuildWorld||!world)buildWorld(save.map,save.time); // live orbit backdrop
  clearMarks();clearSmoke();
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const logo=document.createElement("img");logo.id="logo";logo.src=url("images/logo.png");
  logo.onerror=()=>{logo.remove();const t=document.createElement("div");
    t.className="title-xl";t.innerHTML='DRIFT <span class="org">YARD</span>';s.prepend(t);};
  s.appendChild(logo);
  const tag=document.createElement("div");tag.className="tagline";tag.textContent=L.tagline;s.appendChild(tag);
  s.appendChild(btn(L.play,()=>buildMaps()));
  s.appendChild(btn(save.lang==="es"?STR.es.language:STR.en.language,()=>{
    save.lang=save.lang==="es"?"en":"es";L=STR[save.lang];persist();buildTitle(false);}));
  s.appendChild(btn(save.sound?L.sound_on:L.sound_off,()=>{save.sound=!save.sound;persist();applySound();buildTitle(false);}));
  s.appendChild(btn(save.quality==="high"?L.q_high:L.q_low,()=>{
    save.quality=save.quality==="high"?"low":"high";persist();applyQuality();buildTitle(false);},{sub:L.qnote}));
  const h=document.createElement("div");h.className="hint";
  h.innerHTML=(touchDevice?L.controlsTouch:L.controlsKeys+"<br>"+L.controlsPad)+"<br>"+L.madeWith;
  s.appendChild(h);show("title");}
function buildMaps(){const s=S.maps;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.selectMap;s.appendChild(t);
  const list=document.createElement("div");list.className="rowlist";s.appendChild(list);
  MAPS.forEach((m,i)=>{
    const modeTxt=m.mode==="race"?L.modeRace:L.modeDrift;
    const best=m.mode==="race"?save.bestTime[m.id]:save.best[m.id];
    const bestTxt=best?(m.mode==="race"?fmtT(best):fmtN(best)):L.noBest;
    list.appendChild(btn(L["map_"+m.id],()=>{save.map=i;persist();
      buildWorld(i,save.time);clearMarks();clearSmoke();buildGarageUI();},
      {sub:`${modeTxt} · ${L.best}: ${bestTxt}`}));});
  s.appendChild(btn(L.back,()=>buildTitle(false)));
  show("maps");focusIdx=save.map;refreshFocus();}
function cycleCar(d){save.car=(save.car+d+CARS.length)%CARS.length;persist();buildGarage();fillGarageUI();}
function fillGarageUI(){
  const c=CARS[save.car];
  document.getElementById("carname").innerHTML=c.name.slice(0,-1)+`<span class="org">${c.name.slice(-1)}</span>`;
  document.getElementById("cardesc").textContent=L["desc_"+c.id];
  const st=document.getElementById("stats");st.innerHTML="";
  const mk=(lab,v)=>{const d2=document.createElement("div");d2.className="stat";
    d2.innerHTML=`<span style="width:34%">${lab}</span><div class="bar"><div style="width:${Math.round(Math.max(.08,Math.min(v,1))*100)}%"></div></div>`;
    st.appendChild(d2);};
  mk(L.power,(c.accel-18)/13);mk(L.grip,(c.grip-7)/3.6);mk(L.turn,(c.turn-1.8)/.9);mk(L.kick,(c.kick-.8)/.6);
  const m=MAPS[save.map];
  const best=m.mode==="race"?save.bestTime[m.id]:save.best[m.id];
  document.getElementById("gbest").textContent=
    `${L["map_"+m.id]} · ${L.best}: ${best?(m.mode==="race"?fmtT(best):fmtN(best)):L.noBest}`;
  const gb=document.getElementById("gbottom");gb.innerHTML="";
  const bb=btn(L.back,()=>buildMaps());bb.style.minWidth="30vw";gb.appendChild(bb);
  const cb=btn(L.choose+" ▸",()=>buildTimeSel());cb.style.minWidth="42vw";gb.appendChild(cb);
  refreshFocus();}
function buildGarageUI(){prepareCars();buildGarage();
  camera.position.set(0,2.4,8.4);camera.lookAt(0,.9,0);
  camera.fov=CFG.fovBase;camera.updateProjectionMatrix();
  fillGarageUI();show("garage");
  document.getElementById("gprev").onclick=()=>{interact();cycleCar(-1);};
  document.getElementById("gnext").onclick=()=>{interact();cycleCar(1);};}
function buildTimeSel(){const s=S.time;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.chooseTime;s.appendChild(t);
  const list=document.createElement("div");list.className="rowlist";s.appendChild(list);
  for(const[k,label]of[["dia","☀️ "+L.dia],["tarde","🌇 "+L.tarde],["noche","🌙 "+L.noche]])
    list.appendChild(btn(label,()=>{save.time=k;persist();startSession();}));
  s.appendChild(btn(L.back,()=>buildGarageUI()));
  show("time");
  focusIdx=["dia","tarde","noche"].indexOf(save.time);refreshFocus();}
function buildPause(){const s=S.pause;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  const t=document.createElement("div");t.className="title-xl org";t.textContent=L.paused;s.appendChild(t);
  s.appendChild(btn(L.resume,()=>togglePause()));
  s.appendChild(btn(L.restart,()=>startSession()));
  s.appendChild(btn(save.sound?L.sound_on:L.sound_off,()=>{save.sound=!save.sound;persist();applySound();buildPause();}));
  s.appendChild(btn(L.exit,()=>{loopsStop();sess=null;music("music_menu");buildMaps();}));
  show("pause");}
function medalFor(m,val){ // drift: higher better; race: lower better
  if(m.mode==="race"){let md=0;for(let i=0;i<3;i++)if(val<=m.targets[i])md=i+1;return md;}
  let md=0;for(let i=0;i<3;i++)if(val>=DRIFT_MEDALS[i])md=i+1;return md;}
function endSession(){const s=sess;if(s.over)return;s.over=true;
  loopsStop();
  const m=MAPS[save.map];
  if(s.mapMode==="drift"){
    if(s.cur>0){const pts=Math.round(s.cur);s.total+=pts;s.bestDrift=Math.max(s.bestDrift,pts);s.cur=0;}
    s.total=Math.round(s.total);
    if(!s.saved){s.saved=true;
      if(!save.best[m.id]||s.total>save.best[m.id]){save.best[m.id]=s.total;s.record=true;}
      if(!save.bestDrift[m.id]||s.bestDrift>save.bestDrift[m.id])save.bestDrift[m.id]=s.bestDrift;
      persist();}}
  else{
    if(!s.saved){s.saved=true;
      if(!save.bestTime[m.id]||s.t<save.bestTime[m.id]){save.bestTime[m.id]=s.t;s.record=true;}
      persist();}}
  toast(s.mapMode==="race"?L.finished||"FINISH":L.timeUp,"var(--org)");
  sfx("sfx_chime",1,.8);
  setTimeout(()=>{if(mode==="race")showResults();},1800);}
function showResults(){const s=S.results;s.innerHTML="";
  const sc=document.createElement("div");sc.className="scrim";s.appendChild(sc);
  music("music_menu");
  const r=sess,m=MAPS[save.map];
  const val=r.mapMode==="race"?r.t:r.total;
  const md=medalFor(m,val);
  const t=document.createElement("div");t.className="title-xl";t.textContent=L.results;s.appendChild(t);
  const mdEl=document.createElement("div");mdEl.className="medal";
  mdEl.innerHTML=["<span style='color:#888'>—</span>","🥉","🥈","🥇"][md]+
    ` <span class="${md===3?'yel':''}" style="font-size:.55em">${L["medal"+md]}</span>`;
  s.appendChild(mdEl);
  const g=document.createElement("div");g.className="results-grid";
  g.innerHTML=(r.mapMode==="race"
    ?`${L.totalTime}: <span class="org">${fmtT(r.t)}</span><br>${L.bestLapS}: ${fmtT(r.bestLapT)}`
    :`${L.score}: <span class="org">${fmtN(r.total)}</span><br>${L.bestDrift}: ${fmtN(r.bestDrift)}`)
    +(r.record?`<br><span class="yel">${L.newRecord}</span>`:"")
    +(md<3?`<br><span class="hint">${L.next}: ${r.mapMode==="race"?fmtT(m.targets[md]):fmtN(DRIFT_MEDALS[md])}</span>`:"");
  s.appendChild(g);
  s.appendChild(btn(L.retry,()=>startSession()));
  s.appendChild(btn(L.garage,()=>{sess=null;buildGarageUI();}));
  s.appendChild(btn(L.menu,()=>{sess=null;buildTitle();}));
  show("results");}
function startSession(){applyQuality();
  sess=newSession();show("race");
  music("music_drift");loopsStart();
  camera.position.set(sess.x-Math.sin(sess.h)*7.8,3.1,sess.z-Math.cos(sess.h)*7.8);
  camera.lookAt(sess.x,1,sess.z);
  toast(L.go,"var(--org)");}
function togglePause(){if(mode==="race"&&sess&&!sess.over){buildPause();loopsStop();}
  else if(mode==="pause"){show("race");loopsStart();}}
document.getElementById("pausebtn").addEventListener("click",()=>togglePause());
addEventListener("blur",()=>{if(mode==="race")togglePause();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="race")togglePause();});
let interacted=false;
function interact(){if(interacted)return;interacted=true;audioInit();
  decodeAll().then(()=>{if(mode!=="race")music("music_menu");});}

/* ================= main loop ================= */
let last=performance.now(),acc=0,frames=0,fpsAt=last,fps=0;
const devEl=document.getElementById("dev");
function frame(now){requestAnimationFrame(frame);
  acc+=now-last;last=now;if(acc>250)acc=250;
  pollPads();menuNav();
  const stepMs=CFG.step*1000;
  while(acc>=stepMs){update(CFG.step);updateSmoke(CFG.step);acc-=stepMs;}
  if(mode==="race"||mode==="pause"||((mode==="title"||mode==="maps"||mode==="time"||mode==="results")&&world)){
    if(mode==="race"||mode==="pause")drawHud(CFG.step);
    renderer.render(scene,camera);}
  else if(mode==="garage")renderer.render(garageScene,camera);
  if(DEV){frames++;if(now-fpsAt>=500){fps=Math.round(frames*1000/(now-fpsAt));frames=0;fpsAt=now;}
    devEl.textContent=`${fps} fps calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles/1000|0)}k`
      +(sess?`\nv ${sess.speed.toFixed(1)} beta ${(sess.beta*57.3).toFixed(0)} combo ${sess.combo.toFixed(1)} cp ${sess.cp}`:"");}
}

/* ================= dev hook ================= */
if(DEV)window.__dy={
  state:()=>({mode,total:sess&&Math.round(sess.total),cur:sess&&Math.round(sess.cur),
    combo:sess&&+sess.combo.toFixed(2),t:sess&&+sess.t.toFixed(1),
    speed:sess&&+sess.speed.toFixed(1),beta:sess&&+(sess.beta*57.3).toFixed(1),
    x:sess&&+sess.x.toFixed(1),z:sess&&+sess.z.toFixed(1),
    lap:sess&&sess.lap,cp:sess&&sess.cp,map:save.map,
    calls:renderer.info.render.calls}),
  sess:()=>sess,world:()=>world,camera,scene,
  setMap(i){save.map=i;persist();},
  warpCp(){if(sess&&world.checkpoints){const c=world.checkpoints[sess.cp];sess.x=c.x;sess.z=c.z;}},
  timeUp(){if(sess){if(sess.mapMode==="drift")sess.t=.5;else{sess.lap=sess.laps;endSession();}}},
  give(n){if(sess)sess.total+=n;}};

/* ================= boot ================= */
(async()=>{
  window.__dyBooted=true;
  document.getElementById("logo").src=url("images/logo.png");
  S.loading.style.backgroundImage=`url('${url("images/loading.jpg")}')`;
  loadMsg.textContent=L.loading;
  resize();
  await loadAll();
  applyQuality();resize();
  prepareCars();initMarks();initSmoke();
  loadMsg.textContent=L.tip;
  setTimeout(()=>{buildTitle(true);},300);
  requestAnimationFrame(frame);
})();
</script>
</body>
