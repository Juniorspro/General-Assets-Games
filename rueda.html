<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RUEDA NEON</title>
<style>
/* ================= ARCADE SHELL — CSS común de los 5 juegos =================
   REGLA DE ORO DEL CELULAR VERTICAL: el juego SIEMPRE se ve apaisado. Si el
   teléfono está vertical, #stage se rota 90° y se le fijan ancho/alto EN PX
   (los del viewport cruzados). Todo lo que mida la UI tiene que medirse en el
   espacio del #stage (clientWidth/clientHeight, offsetTop), NUNCA contra
   window.innerWidth/innerHeight ni con getBoundingClientRect: con el stage
   rotado esas dos cosas viven en ejes distintos. El puntero se convierte a mano
   (ver ARC.pt) porque la rotación cruza los ejes del compositor.            */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef2f6}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#0d1014;
  transform-origin:0 0;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
/* dos lienzos: #gl es la escena 3D (WebGL) y #cv la capa 2D de efectos y texto
   flotante que va ENCIMA. Así los juegos 3D siguen usando ARC.fx sin shaders. */
#gl{z-index:0}
#cv{z-index:1;pointer-events:auto;background:transparent}
/* ---- capas ---- */
.lay{position:absolute;inset:0;pointer-events:none}
/* z-index 5: MEDIDO CON TOQUES REALES — sin él, el canvas (#cv, z-index 1) queda
   por encima de estas pantallas y se come el toque: document.elementFromPoint en
   el centro de REINTENTAR devolvía "cv", así que reiniciar/seguir/menú/niveles/
   ajustes NO funcionaban en ningún juego. Las sondas no lo veían porque disparaban
   el evento directo al botón en vez de tocar la pantalla. */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:auto;background:rgba(6,9,13,.62);z-index:5;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scr.on{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#menu{background:#0d1014 center/cover no-repeat;backdrop-filter:none;-webkit-backdrop-filter:none}
/* el arte del menú ya trae el título: el degradado va de ABAJO para que los
   botones se lean sin tapar la ilustración, y el título de DOM sólo aparece si
   la imagen no llegó (#menu sin .hasart). */
#menu:before{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(5,7,10,.94) 0%,rgba(5,7,10,.55) 30%,rgba(5,7,10,.05) 62%)}
#menu.hasart .ttl{display:none}
/* ---- tipografía ---- */
.h1{font-size:clamp(22px,5.2vmin,44px);font-weight:900;letter-spacing:.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.75)}
.h2{font-size:clamp(14px,3vmin,22px);font-weight:800;opacity:.95}
.sm{font-size:clamp(10px,2.1vmin,15px);font-weight:600;opacity:.72;line-height:1.35}
/* ---- botones ---- */
.btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:.5em;
  padding:.62em 1.25em;border-radius:14px;font-weight:900;font-size:clamp(12px,2.6vmin,19px);
  background:linear-gradient(180deg,var(--acc) 0%,var(--acc2) 100%);color:#10141a;
  border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gh{background:rgba(255,255,255,.09);color:#eef2f6;border-color:rgba(255,255,255,.22);
  box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.sq{padding:0;width:clamp(34px,7.4vmin,52px);height:clamp(34px,7.4vmin,52px);border-radius:13px;
  font-size:clamp(15px,3.4vmin,23px)}
.row{display:flex;gap:clamp(6px,1.6vmin,14px);align-items:center}
.col{display:flex;flex-direction:column;gap:clamp(6px,1.6vmin,14px)}
/* ---- MENÚ (rehecho: animado y con el JUGAR grande al centro) ----
   El anterior era "arte arriba + botón chico abajo a la izquierda", que se leía
   como una ficha de Netflix. Ahora: fondo vivo (la escena 3D del propio juego si
   el juego expone attract(), o el arte con un zoom lento), insignias arriba,
   botón JUGAR grande al centro con latido y destello, y fila de botones redondos.
   Todo entra con animación escalonada. */
#menu{background-position:center;overflow:hidden}
#menu .wrap{position:relative;z-index:2;width:100%;height:100%;display:flex;
  flex-direction:column;justify-content:space-between;align-items:center;
  padding:2.6vmin 3.4vmin 3.4vmin;gap:1vmin}
#menu .mTop{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:1vmin}
#menu .mMid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:1.4vmin;text-align:center;width:100%}
#menu .ttl{font-size:clamp(28px,9vmin,74px);font-weight:900;line-height:.92;letter-spacing:-1px;
  text-shadow:0 4px 0 rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.7)}
#menu .ttl em{font-style:normal;color:var(--acc)}
#menu .sub{max-width:min(62vmin,520px);opacity:.86}
#menu .mBot{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
/* botón JUGAR grande, con destello que barre y latido suave */
#bPlay{position:relative;overflow:hidden;min-width:min(52vmin,340px);
  padding:.86em 2.2em;border-radius:18px;font-size:clamp(17px,4.6vmin,30px);letter-spacing:1px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.5);
  /* OJO: las DOS animaciones van juntas acá. Si se deja sólo "beat", este selector
     de ID pisa el "rise" de .anim y el botón se queda en opacity:0 (invisible: pasó
     de verdad, medido con getComputedStyle -> opacity 0, animationName "beat"). */
  animation:rise .5s cubic-bezier(.2,.9,.25,1) .2s forwards, beat 2.3s ease-in-out .8s infinite}
#bPlay:after{content:"";position:absolute;top:-60%;left:-30%;width:28%;height:220%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  transform:rotate(18deg);animation:shine 3.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes shine{0%{left:-40%}55%{left:130%}100%{left:130%}}
#menu .mRow{display:flex;gap:1.8vmin;align-items:center;justify-content:center}
.rnd{pointer-events:auto;width:clamp(42px,9.4vmin,64px);height:clamp(42px,9.4vmin,64px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:clamp(17px,4.2vmin,27px);background:rgba(16,20,27,.62);color:#eef2f6;
  border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);
  box-shadow:0 4px 0 rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.45);transition:transform .1s}
.rnd:active{transform:translateY(3px) scale(.96)}
.badge{display:flex;align-items:center;gap:.4em;padding:.42em .9em;border-radius:999px;
  background:rgba(16,20,27,.62);border:1px solid rgba(255,255,255,.18);
  font-weight:900;font-size:clamp(11px,2.5vmin,17px);backdrop-filter:blur(6px);white-space:nowrap}
.badge i{font-style:normal;color:var(--acc);font-size:1.1em}
#menu .bcol{display:flex;flex-direction:column;gap:.8vmin;align-items:flex-end}
/* entrada escalonada */
.anim{opacity:0;transform:translateY(14px);animation:rise .5s cubic-bezier(.2,.9,.25,1) forwards}
.anim.d1{animation-delay:.06s}.anim.d2{animation-delay:.14s}.anim.d3{animation-delay:.22s}
.anim.d4{animation-delay:.3s}
@keyframes rise{to{opacity:1;transform:none}}
/* el arte de fondo respira (si no hay escena 3D viva detrás) */
#menu.hasart:not(.live){background-size:cover;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{0%{background-size:104%}100%{background-size:118%}}
#menu.live{background-image:none!important;background-color:transparent}
#menu.live:before{background:linear-gradient(0deg,rgba(4,6,9,.9) 0%,rgba(4,6,9,.35) 34%,
  rgba(4,6,9,0) 62%,rgba(4,6,9,.55) 100%)}
/* ---- HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.pill{position:absolute;display:flex;align-items:center;gap:.45em;padding:.42em .8em;
  border-radius:999px;background:rgba(10,14,19,.66);border:1px solid rgba(255,255,255,.14);
  font-weight:900;font-size:clamp(11px,2.4vmin,17px);backdrop-filter:blur(4px)}
#pScore{left:3vmin;top:2.4vmin}
#pInfo{left:50%;top:2.4vmin;transform:translateX(-50%)}
#pPause{right:3vmin;top:2.4vmin;pointer-events:auto;padding:0;
  width:clamp(30px,6.6vmin,46px);height:clamp(30px,6.6vmin,46px);justify-content:center}
#tray{position:absolute;left:0;right:0;bottom:2.2vmin;display:flex;justify-content:center;
  gap:1.4vmin;pointer-events:auto;flex-wrap:wrap;padding:0 2vmin}
/* ---- juegos VERTICALES (body.vert): los controles van grandes y bien abajo,
   porque en vertical el pulgar llega a la franja de abajo y no a los costados ---- */
body.vert #tray{bottom:3.5%;gap:2.5vw}
body.vert #tray .btn{min-width:16vw;padding:.85em 1.1em;font-size:clamp(15px,4.4vw,26px)}
body.vert #tray .btn.sq{width:16vw;height:16vw}
body.vert .pill{font-size:clamp(12px,3.4vw,20px);padding:.5em .9em}
body.vert #pScore{left:4vw;top:2vh}
body.vert #pInfo{top:2vh}
body.vert #pPause{right:4vw;top:2vh;width:11vw;height:11vw}
body.vert #menu .wrap{padding:0 7vw 7vh;gap:2.4vh}
/* en vertical el arte 16:9 se recortaba tanto que el título quedaba cortado
   ("ZA CA" en la captura V3): se ajusta por ANCHO y se pega arriba, y el resto de
   la columna lo llena el color del juego. */
/* VERTICAL: el arte 16:9 va como banda de arriba (ajustado por ancho, así el título
   no se corta) y la mitad de abajo NO queda negra vacía: lleva un resplandor del
   color del juego que respira, más las insignias y el botón grande. */
body.vert #menu{background-size:100% auto;background-position:center 5%}
body.vert #menu:after{content:"";position:absolute;left:50%;top:62%;width:150vw;height:70vh;
  transform:translate(-50%,-50%);pointer-events:none;z-index:1;
  background:radial-gradient(closest-side,var(--acc) 0%,transparent 72%);
  opacity:.20;animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.13;transform:translate(-50%,-50%) scale(.92)}
  50%{opacity:.26;transform:translate(-50%,-50%) scale(1.06)}}
body.vert #menu .mMid{justify-content:flex-start;padding-top:37vh}
body.vert #menu .mBot{gap:2.4vh;padding-bottom:2vh}
body.vert #bPlay{min-width:70vw}
body.vert #menu:before{background:linear-gradient(0deg,rgba(5,7,10,.97) 0%,rgba(5,7,10,.82) 34%,rgba(5,7,10,.12) 62%,rgba(5,7,10,.35) 100%)}
body.vert #menu .sub{max-width:100%}
body.vert #best{right:5vw;bottom:7vh}
body.vert .card{max-width:88vw}
body.vert .h1{font-size:clamp(22px,7vw,44px)}
body.vert .h2{font-size:clamp(14px,4.4vw,24px)}
body.vert .sm{font-size:clamp(11px,3.2vw,16px)}
body.vert .btn{font-size:clamp(13px,3.8vw,20px)}
/* ---- tarjetas / paneles ---- */
.card{background:rgba(14,18,24,.92);border:1px solid rgba(255,255,255,.14);border-radius:18px;
  padding:clamp(12px,3vmin,26px);box-shadow:0 18px 50px rgba(0,0,0,.6);max-width:86vmin;
  display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.stars{display:flex;gap:.35em;font-size:clamp(20px,5.6vmin,42px);line-height:1}
.stars i{font-style:normal;opacity:.22}
.stars i.on{opacity:1;filter:drop-shadow(0 0 8px rgba(255,196,60,.7))}
.grid{display:grid;gap:1.2vmin}
.lvl{width:clamp(38px,8.4vmin,60px);height:clamp(38px,8.4vmin,60px);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:900;
  font-size:clamp(12px,2.7vmin,18px);pointer-events:auto}
.lvl.done{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#10141a}
.lvl.lock{opacity:.35}
.lvl b{font-size:.52em;letter-spacing:1px;opacity:.9}
/* ---- ajustes ---- */
.sw{width:clamp(42px,9vmin,62px);height:clamp(24px,5vmin,34px);border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);position:relative;
  pointer-events:auto;transition:background .15s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:calc(100% - 4px);height:calc(100% - 4px);
  aspect-ratio:1;border-radius:999px;background:#eef2f6;transition:transform .15s}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(calc(100% + 2px))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:2vmin;width:min(70vmin,100%)}
/* ---- avisos ---- */
#toast{position:absolute;left:50%;top:16%;z-index:8;transform:translateX(-50%) scale(.9);opacity:0;
  padding:.5em 1.1em;border-radius:12px;background:rgba(10,14,19,.9);font-weight:900;
  font-size:clamp(12px,2.8vmin,20px);transition:opacity .18s,transform .18s;z-index:5}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
#fps{position:absolute;left:50%;bottom:.6vmin;transform:translateX(-50%);font-size:10px;
  opacity:.35;z-index:5}
/* ---- pantalla de CARGA: fondo del propio juego, barra real y elección de idioma ---- */
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:2.2vmin;background:#05070a center/cover no-repeat;z-index:9;
  text-align:center;padding:4vmin}
#load:before{content:"";position:absolute;inset:0;backdrop-filter:blur(3px);
  background:linear-gradient(0deg,rgba(4,6,9,.95),rgba(4,6,9,.62))}
#load>*{position:relative;z-index:1}
#ldName{font-size:clamp(20px,6vmin,46px);font-weight:900;letter-spacing:.5px;
  text-shadow:0 3px 14px rgba(0,0,0,.8)}
#ldPct{font-weight:900;font-size:clamp(12px,2.6vmin,18px);opacity:.9}
#langs{display:flex;gap:1.4vmin;flex-wrap:wrap;justify-content:center;margin-top:1vmin}
#ldGo{display:none}
#ldGo.on{display:flex;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#load .bar{width:min(52vmin,340px);height:8px;border-radius:999px;background:rgba(255,255,255,.14);
  overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .25s}
.seg{display:flex;gap:.4vmin;background:rgba(255,255,255,.08);padding:.35em;border-radius:12px}
.seg b{font-weight:900;font-size:clamp(10px,2.2vmin,15px);padding:.45em .8em;border-radius:9px;
  opacity:.6;pointer-events:auto;white-space:nowrap}
.seg b.on{background:var(--acc);color:#10141a;opacity:1}
</style></head><body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="cv"></canvas>

<script type="module">
/* ---- assets ---- */
const BASE=(new URLSearchParams(location.search).has('local')?'/assets/arcade/':'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@532931d/assets/arcade/');
const A=f=>BASE+f;
/* ============================================================================
   ARCADE SHELL — el motor común de los 5 juegos
   ----------------------------------------------------------------------------
   Un solo archivo, cero dependencias, canvas 2D + overlays de DOM para los
   menús (el texto queda nítido y se estila con CSS en vez de dibujarse).
   Lo que resuelve por todos:
     · APAISADO SIEMPRE (rota #stage 90° si el teléfono está vertical) y puntero
       convertido a mano, porque la rotación del compositor cruza los ejes.
     · Bucle de paso FIJO a 60 Hz con interpolación al dibujar: la simulación no
       cambia con los FPS del celular y el movimiento no tiembla a 120 Hz.
     · Audio (WebAudio con limitador + música por <audio>), con SÍNTESIS de
       respaldo: si un mp3 no está o el navegador no lo decodifica, suena un
       blip generado y el juego no se queda muerto de sonido.
     · Guardado en localStorage, pantallas (menú/pausa/fin/niveles/ajustes),
       partículas, texto flotante, sacudida de cámara, toast, FPS y calidad
       adaptativa (si baja de 45 fps se recortan las partículas).
   Contrato del juego (window.GAME): ver el final del archivo.
   ========================================================================== */
'use strict';
const ARC={W:0,H:0,dpr:1,q:1,t:0,dt:1/60,frame:0,fps:60,paused:false,scr:'load',lvl:1,alive:false};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

/* ---------------------------------------------------------------- 1. ESCENARIO
   Si el viewport está vertical se rota el escenario 90° y se le fijan ancho y
   alto EN PX (cruzados). Todo lo demás vive en ese espacio: ARC.W/ARC.H son las
   medidas del juego, siempre apaisadas. */
let ROT=false,OFFX=0;
function fit(){
  const vw=Math.round(window.innerWidth),vh=Math.round(window.innerHeight);
  const st=$('stage');
  /* GAME.portrait = el juego se juega VERTICAL de verdad (tipo Crossy Road): no se
     rota nada. En una ventana apaisada (escritorio) se centra una columna 9:16 y
     el resto queda negro, para que el encuadre sea el mismo que en el teléfono. */
  if(GAME.portrait){
    ROT=false;
    const w=Math.min(vw,Math.round(vh*.58));
    OFFX=Math.round((vw-w)/2);
    st.style.width=w+'px';st.style.height=vh+'px';
    st.style.transform=OFFX?('translateX('+OFFX+'px)'):'none';
  }else{
    OFFX=0;
    ROT=vh>vw;
    if(ROT){
      st.style.width=vh+'px';st.style.height=vw+'px';
      st.style.transform='translateX('+vw+'px) rotate(90deg)';
    }else{
      st.style.width=vw+'px';st.style.height=vh+'px';st.style.transform='none';
    }
  }
  ARC.W=st.clientWidth;ARC.H=st.clientHeight;
  const cv=$('cv');
  ARC.dpr=clamp(window.devicePixelRatio||1,1,2.5);
  cv.style.width=ARC.W+'px';cv.style.height=ARC.H+'px';
  cv.width=Math.round(ARC.W*ARC.dpr);cv.height=Math.round(ARC.H*ARC.dpr);
  ARC.g=cv.getContext('2d');
  ARC.g.setTransform(ARC.dpr,0,0,ARC.dpr,0,0);
  /* la escena 3D usa su propio lienzo y su propio DPR (más barato en el celular:
     el 3D a 1.5x se ve igual y cuesta la mitad que a 3x) */
  const gl=$('gl');
  gl.style.width=ARC.W+'px';gl.style.height=ARC.H+'px';
  if(ARC.rnd){
    ARC.rnd.setPixelRatio(Math.min(ARC.dpr,1.75));
    ARC.rnd.setSize(ARC.W,ARC.H,false);
  }
  if(GAME.resize)GAME.resize();
}
window.addEventListener('resize',()=>{fit();},{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(fit,120),{passive:true});

/* ---- puntero: del evento del navegador al espacio del escenario ----
   Con el escenario rotado 90° y corrido vw en X, un punto (sx,sy) del escenario
   cae en pantalla en (vw−sy, sx). La inversa es la que hace falta acá. NO se usa
   getBoundingClientRect: devuelve la caja YA rotada y mezcla los ejes. */
ARC.pt=function(e){
  const x=e.clientX,y=e.clientY;
  if(ROT)return{x:y,y:Math.round(window.innerWidth)-x};
  return{x:x-OFFX,y:y};      /* OFFX = columna centrada de los juegos verticales */
};

/* ------------------------------------------------------------------ 2. GUARDADO */
const SAVE={};
function saveKey(){return 'arc.'+GAME.slug;}
function saveLoad(){
  try{Object.assign(SAVE,JSON.parse(localStorage.getItem(saveKey())||'{}'));}catch(e){}
  if(SAVE.mus===undefined)SAVE.mus=1;
  if(SAVE.sfx===undefined)SAVE.sfx=1;
  if(SAVE.vib===undefined)SAVE.vib=1;
  if(SAVE.fx===undefined)SAVE.fx=1;
  if(SAVE.fps===undefined)SAVE.fps=0;
  if(!SAVE.stars)SAVE.stars={};
  if(!SAVE.best)SAVE.best=0;
  if(!SAVE.coins)SAVE.coins=0;
  if(!SAVE.done)SAVE.done=0;      /* nivel más alto superado */
  if(!SAVE.lang)SAVE.lang=(navigator.language||'es').slice(0,2).toLowerCase();
  if(!STR[SAVE.lang])SAVE.lang='es';
  if(SAVE.gfx==null)SAVE.gfx=2;
}
function saveNow(){try{localStorage.setItem(saveKey(),JSON.stringify(SAVE));}catch(e){}}
ARC.save=saveNow;ARC.S=SAVE;


/* ------------------------------------------------------------------ 2b. IDIOMAS
   Todo texto visible sale de acá (data-i18n en el DOM + T() en el código). Cada
   juego puede sumar sus propias claves con GAME.i18n={es:{},en:{},pt:{}} y se
   mezclan sobre estas. El idioma se elige en la pantalla de carga la primera vez
   y después en Ajustes; queda guardado. Si falta una clave se cae al español. */
const LANGS=[['es','ES'],['en','EN'],['pt','PT']];
const STR={
  es:{loading:'CARGANDO',lang:'IDIOMA',tapPlay:'TOCÁ PARA JUGAR',play:'JUGAR',levels:'NIVELES',
    settings:'AJUSTES',pause:'PAUSA',resume:'SEGUIR',retry:'REINTENTAR',menu:'MENÚ',next:'SIGUIENTE',

    gfx0:'Bajo',gfx1:'Medio',gfx2:'Alto',gfx3:'Ultra',record:'RÉCORD',level:'NIVEL',
    win:'¡NIVEL SUPERADO!',lost:'PERDISTE',points:'PUNTOS',wiped:'Progreso borrado',

  en:{loading:'LOADING',lang:'LANGUAGE',tapPlay:'TAP TO PLAY',play:'PLAY',levels:'LEVELS',
    settings:'SETTINGS',pause:'PAUSED',resume:'RESUME',retry:'RETRY',menu:'MENU',next:'NEXT',
    again:'AGAIN',back:'BACK',done:'DONE',wipe:'WIPE PROGRESS',music:'Music',sfx:'Sound',
    vib:'Vibration',extraFx:'Extra effects',showFps:'Show FPS',graphics:'Graphics',
    gfx0:'Low',gfx1:'Medium',gfx2:'High',gfx3:'Ultra',record:'BEST',level:'LEVEL',
    win:'LEVEL COMPLETE!',lost:'GAME OVER',points:'SCORE',wiped:'Progress wiped',
    art:'art',sounds:'sounds',models:'models',engine:'3D engine',ready:'ready'},
  pt:{loading:'CARREGANDO',lang:'IDIOMA',tapPlay:'TOQUE PARA JOGAR',play:'JOGAR',levels:'NÍVEIS',
    settings:'AJUSTES',pause:'PAUSA',resume:'CONTINUAR',retry:'TENTAR DE NOVO',menu:'MENU',next:'SEGUINTE',
    again:'DE NOVO',back:'VOLTAR',done:'PRONTO',wipe:'APAGAR PROGRESSO',music:'Música',sfx:'Sons',
    vib:'Vibração',extraFx:'Efeitos extra',showFps:'Mostrar FPS',graphics:'Gráficos',
    gfx0:'Baixo',gfx1:'Médio',gfx2:'Alto',gfx3:'Ultra',record:'RECORDE',level:'NÍVEL',
    win:'NÍVEL COMPLETO!',lost:'VOCÊ PERDEU',points:'PONTOS',wiped:'Progresso apagado',
    art:'arte',sounds:'sons',models:'modelos',engine:'motor 3D',ready:'pronto'}
};
function lang(){return SAVE.lang||'es';}
ARC.T=function(k){
  const g=(GAME.i18n&&GAME.i18n[lang()])||{};
  if(g[k]!=null)return g[k];
  const d=STR[lang()]||STR.es;
  if(d[k]!=null)return d[k];
  const ge=(GAME.i18n&&GAME.i18n.es)||{};
  return ge[k]!=null?ge[k]:(STR.es[k]!=null?STR.es[k]:k);
};
const T=ARC.T;
ARC.i18nApply=function(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T(el.getAttribute('data-i18n'));});
  if(GAME.subKey)$('mSub').innerHTML=T(GAME.subKey);
  if(ARC.scr==='menu')refreshMenu();
  if(GAME.i18nDone)nsafe2(()=>GAME.i18nDone());
};
const nsafe2=f=>{try{return f();}catch(e){console.warn(e);}};
ARC.lang=function(l){
  if(l){SAVE.lang=l;saveNow();ARC.i18nApply();paintSegs();}
  return lang();
};

/* --------------------------------------------------------------- 2c. GRÁFICOS
   Un solo número (0-3) que decide DPR, sombras, partículas y niebla. Se aplica en
   caliente: no hace falta reiniciar el juego. */
/* DPR: el 3D a más de 1.6 no se nota en un celular y cuesta el doble de píxeles.
   Medido en este pack: con 2.5 el relleno de pantalla era el cuello de botella. */
const GFXP=[{dpr:.75,part:.4,sh:0,fog:.7},{dpr:1,part:.7,sh:0,fog:.85},
            {dpr:1.35,part:1,sh:1,fog:1},{dpr:1.6,part:1.3,sh:1,fog:1.15}];
ARC.gfx=function(v){
  if(v!==undefined){SAVE.gfx=clamp(v|0,0,3);saveNow();applyGfx();paintSegs();}
  return SAVE.gfx==null?2:SAVE.gfx;
};
function applyGfx(){
  const p=GFXP[ARC.gfx()];
  ARC.q=p.part;
  if(ARC.rnd){
    ARC.rnd.setPixelRatio(Math.min(window.devicePixelRatio||1,p.dpr));
    ARC.rnd.shadowMap.enabled=!!(GAME.shadows&&p.sh);
    ARC.rnd.setSize(ARC.W,ARC.H,false);
  }
  if(GAME.gfxApply)nsafe2(()=>GAME.gfxApply(p));
}
ARC.gfxP=()=>GFXP[ARC.gfx()];
function paintSegs(){
  const mk=(host,items,cur,fn)=>{
    const el=$(host);if(!el)return;
    el.innerHTML='';
    items.forEach(it=>{
      const b=document.createElement('b');
      b.textContent=it[1];b.className=(it[0]===cur?'on':'');
      b.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sfx('tap');ARC.vib(8);fn(it[0]);});
      el.appendChild(b);
    });
  };
  mk('langs',LANGS,lang(),l=>ARC.lang(l));
  mk('segLang',LANGS,lang(),l=>ARC.lang(l));
  mk('segGfx',[[0,T('gfx0')],[1,T('gfx1')],[2,T('gfx2')],[3,T('gfx3')]],ARC.gfx(),v=>ARC.gfx(v));
}
ARC.paintSegs=paintSegs;

/* -------------------------------------------------------------------- 3. AUDIO */
const SND={ctx:null,buf:{},gain:null,mus:null,ready:false};
function actx(){
  if(SND.ctx)return SND.ctx;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  SND.ctx=new C();
  const lim=SND.ctx.createDynamicsCompressor();
  lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.15;
  SND.gain=SND.ctx.createGain();SND.gain.gain.value=.85;
  SND.gain.connect(lim);lim.connect(SND.ctx.destination);
  return SND.ctx;
}
ARC.sndResume=function(){const c=actx();if(c&&c.state==='suspended')c.resume();};
/* carga de efectos: si algo no llega o no se puede decodificar, se deja sin
   buffer y sonará el blip sintetizado (nunca silencio total ni excepción) */
ARC.sndLoad=function(map,done){
  const ks=Object.keys(map);let n=0;
  if(!ks.length){done&&done();return;}
  ks.forEach(k=>{
    fetch(map[k]).then(r=>r.arrayBuffer()).then(b=>{
      const c=actx();if(!c)throw 0;
      return new Promise((res,rej)=>c.decodeAudioData(b,res,rej));
    }).then(buf=>{SND.buf[k]=buf;}).catch(()=>{}).then(()=>{
      if(++n===ks.length){SND.ready=true;done&&done();}
    });
  });
};
/* blips de respaldo por nombre: no pretenden imitar el mp3, pero dan feedback */
const BEEP={tap:[520,.05,'square',.25],pop:[720,.08,'sine',.3],chime:[1040,.16,'triangle',.28],
  coin:[1180,.1,'square',.25],win:[880,.4,'triangle',.3],lose:[180,.4,'sawtooth',.25],
  click:[1400,.04,'square',.22],wood:[240,.12,'sawtooth',.3],glass:[2200,.1,'triangle',.22],
  splat:[300,.14,'sine',.3],groan:[120,.35,'sawtooth',.22],launch:[420,.14,'sawtooth',.28],
  boom:[90,.35,'sawtooth',.35],power:[1320,.22,'triangle',.28],shoot:[640,.07,'square',.22]};
ARC.sfx=function(name,o){
  if(!SAVE.sfx)return;
  const c=actx();if(!c)return;
  o=o||{};
  const b=SND.buf[name];
  if(b){
    const s=c.createBufferSource();s.buffer=b;
    s.playbackRate.value=o.rate||1;
    const g=c.createGain();g.gain.value=(o.vol==null?1:o.vol);
    s.connect(g);g.connect(SND.gain);s.start(0);return;
  }
  const d=BEEP[name]||BEEP.tap;
  const os=c.createOscillator(),g=c.createGain();
  os.type=d[2];os.frequency.value=d[0]*(o.rate||1);
  const v=d[3]*(o.vol==null?1:o.vol);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(v,c.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d[1]);
  os.connect(g);g.connect(SND.gain);os.start();os.stop(c.currentTime+d[1]+.02);
};
ARC.music=function(url){
  if(!url)return;
  if(!SND.mus){
    SND.mus=new Audio();SND.mus.loop=true;SND.mus.volume=.42;
    SND.mus.addEventListener('error',()=>{},{passive:true});
  }
  if(SND.mus.src!==url){SND.mus.src=url;}
  if(SAVE.mus){const p=SND.mus.play();if(p&&p.catch)p.catch(()=>{});}
};
ARC.musicStop=function(){if(SND.mus)SND.mus.pause();};
ARC.vib=function(ms){if(SAVE.vib&&navigator.vibrate)try{navigator.vibrate(ms||12);}catch(e){}};

/* ---------------------------------------------------------------- 4. EFECTOS */
const PT=[],TX=[];
let shake=0,shakeT=0;
ARC.fx={
  burst(x,y,o){
    o=o||{};
    let n=Math.round((o.n||14)*ARC.q*(SAVE.fx?1:.45));
    const sp=o.speed||220,life=o.life||.55,g=o.g==null?900:o.g;
    for(let i=0;i<n;i++){
      const a=o.a==null?rnd(0,TAU):o.a+rnd(-.6,.6);
      const v=sp*rnd(.35,1);
      PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*rnd(.6,1.2),L:life,
        s:(o.size||5)*rnd(.6,1.4),c:o.color||'#ffd166',g,sq:!!o.sq,
        rot:rnd(0,TAU),spin:rnd(-8,8),fade:o.fade!==false});
    }
  },
  ring(x,y,o){o=o||{};PT.push({ring:1,x,y,r:o.r0||6,R:o.r||90,l:o.life||.35,L:o.life||.35,
    c:o.color||'#fff',w:o.w||4});},
  text(x,y,txt,o){o=o||{};TX.push({x,y,t:txt,l:o.life||.8,L:o.life||.8,c:o.color||'#fff',
    s:o.size||22,vy:o.vy==null?-46:o.vy});}
};
ARC.shake=function(m){shake=Math.max(shake,m||6);};
function fxStep(dt){
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];
    p.l-=dt;if(p.l<=0){PT.splice(i,1);continue;}
    if(p.ring){p.r=lerp(p.r,p.R,1-Math.pow(.001,dt));continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;
    if(p.bounce&&p.y>p.bounce){p.y=p.bounce;p.vy*=-.42;p.vx*=.7;}
  }
  for(let i=TX.length-1;i>=0;i--){const t=TX[i];t.l-=dt;if(t.l<=0){TX.splice(i,1);continue;}
    t.y+=t.vy*dt;}
  if(shake>0){shakeT+=dt*46;shake=Math.max(0,shake-dt*shake*7-dt*3);}
}
function fxDraw(g){
  for(const p of PT){
    const k=p.l/p.L;
    g.globalAlpha=p.fade===false?1:clamp(k*1.4,0,1);
    if(p.ring){g.strokeStyle=p.c;g.lineWidth=p.w*k;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();continue;}
    g.fillStyle=p.c;
    if(p.sq){g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      g.fillRect(-p.s/2,-p.s/2,p.s,p.s);g.restore();}
    else{g.beginPath();g.arc(p.x,p.y,p.s*(.4+.6*k),0,TAU);g.fill();}
  }
  g.globalAlpha=1;
  for(const t of TX){
    const k=t.l/t.L;
    g.globalAlpha=clamp(k*1.6,0,1);
    g.font='900 '+t.s+'px system-ui,sans-serif';g.textAlign='center';
    g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(t.t,t.x,t.y);
    g.fillStyle=t.c;g.fillText(t.t,t.x,t.y);
  }
  g.globalAlpha=1;g.textAlign='left';
}

/* foto de la escena 3D para las sondas: se lee el framebuffer DENTRO de un
   requestAnimationFrame, que corre después del render del bucle en el MISMO
   frame — ahí el buffer todavía está intacto (después del compositado ya no). */
ARC.snapGL=function(){
  return new Promise(res=>{
    requestAnimationFrame(()=>{
      const r=ARC.rnd;if(!r){res(null);return;}
      const gl=r.getContext();
      const W=gl.drawingBufferWidth,H=gl.drawingBufferHeight;
      const px=new Uint8Array(W*H*4);
      gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
      let sum=0,n=0;const uniq={};
      for(let i=0;i<px.length;i+=4*37){n++;
        sum+=px[i]*.3+px[i+1]*.6+px[i+2]*.1;
        uniq[(px[i]>>5)+','+(px[i+1]>>5)+','+(px[i+2]>>5)]=1;}
      res({luz:+(sum/Math.max(1,n)).toFixed(1),colores:Object.keys(uniq).length});
    });
  });
};

/* ---------------------------------------------------------------- 5. PANTALLAS */
const SCRS=['menu','pause','over','levels','opts'];
let optFrom='menu';
ARC.show=function(s){
  for(const k of SCRS)$(k).classList.toggle('on',k===s);
  if(s==='menu'&&GAME.attract)$('menu').classList.add('live');
  if(s!=='load')$('load').style.display='none';
  $('hud').style.display=(s==='game')?'block':'none';
  ARC.scr=s;
};
ARC.toast=function(t,ms){
  const el=$('toast');el.textContent=t;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),ms||1100);
};
ARC.hud=function(score,info){
  if(score!==undefined)$('pScore').textContent=score;
  if(info!==undefined)$('pInfo').innerHTML=info;
};
/* bandeja de botones del juego (impulsar, boosters, etc.) */
ARC.tray=function(list){
  const t=$('tray');t.innerHTML='';
  (list||[]).forEach(b=>{
    const el=document.createElement('div');
    el.className='btn '+(b.gh?'gh ':'')+(b.sq?'sq':'');
    el.id='tb_'+b.id;el.innerHTML=b.txt;
    el.addEventListener('pointerdown',ev=>{ev.preventDefault();ARC.sfx('tap');ARC.vib(10);b.fn&&b.fn(el);});
    t.appendChild(el);
  });
};
ARC.trayTxt=function(id,txt){const el=$('tb_'+id);if(el)el.innerHTML=txt;};

/* --------------------------------------------------------------- 6. PARTIDA */
ARC.play=function(lvl){
  ARC.lvl=lvl||1;
  ARC.alive=true;ARC.paused=false;
  PT.length=0;TX.length=0;shake=0;
  ARC.show('game');
  GAME.start(ARC.lvl);
  ARC.music(GAME.music);
};
ARC.over=function(o){
  o=o||{};ARC.alive=false;
  const st=Math.max(0,Math.min(3,o.stars==null?(o.win?3:0):o.stars));
  if(o.win){
    const key=String(ARC.lvl);
    if((SAVE.stars[key]||0)<st){SAVE.stars[key]=st;}
    if(ARC.lvl>SAVE.done)SAVE.done=ARC.lvl;
  }
  if(o.score!=null&&o.score>SAVE.best)SAVE.best=o.score;
  if(o.coins)SAVE.coins+=o.coins;
  saveNow();
  $('oTtl').textContent=o.title||(o.win?T('win'):T('lost'));
  $('oScore').textContent=o.score!=null?(T('points')+' '+o.score):'';
  $('oSub').innerHTML=o.sub||'';
  const S=$('oStars').children;
  $('oStars').style.display=o.noStars?'none':'flex';
  for(let i=0;i<3;i++)S[i].classList.toggle('on',i<st);
  $('bNext').style.display=(o.win&&GAME.levels&&ARC.lvl<GAME.levels)?'flex':'none';
  ARC.sfx(o.win?'win':'lose');
  ARC.vib(o.win?[10,40,10]:60);
  ARC.show('over');
};
ARC.pause=function(){
  if(!ARC.alive||ARC.paused)return;
  ARC.paused=true;ARC.show('pause');GAME.pause&&GAME.pause();
};
ARC.resume=function(){
  if(!ARC.alive)return;
  ARC.paused=false;ARC.show('game');GAME.resume&&GAME.resume();
};
ARC.menu=function(){
  ARC.alive=false;ARC.paused=false;ARC.show('menu');refreshMenu();
};

/* --------------------------------------------------------------- 7. EL BUCLE
   Paso FIJO de 1/60 con acumulador y alpha de interpolación al dibujar: la
   física no depende de los FPS (un celular a 30 y otro a 120 simulan igual) y
   el dibujo no tiembla. Se cortan los saltos grandes (pestaña en segundo plano)
   a 5 pasos por frame para no colgar el hilo. */
const STEP=1/60;
let acc=0,last=0,fpsA=60,slowT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  let d=(ts-last)/1000;last=ts;
  if(d>.25)d=.25;
  ARC.fps=fpsA=lerp(fpsA,1/Math.max(.001,d),.06);
  if(SAVE.fps)$('fps').textContent=Math.round(fpsA)+' fps';
  /* calidad adaptativa: dos segundos por debajo de 45 fps y se recortan
     partículas (ARC.q lo leen los juegos y ARC.fx.burst) */
  if(fpsA<45){slowT+=d;if(slowT>2&&ARC.q>.5){ARC.q=.5;slowT=0;}}
  else{slowT=Math.max(0,slowT-d);if(fpsA>56&&ARC.q<1)ARC.q=Math.min(1,ARC.q+d*.2);}
  const run=ARC.alive&&!ARC.paused;
  acc+=d;
  let n=0;
  while(acc>=STEP&&n<5){
    acc-=STEP;n++;ARC.t+=STEP;ARC.frame++;
    if(run)GAME.step(STEP);
    fxStep(STEP);
  }
  if(acc>STEP*5)acc=0;
  const g=ARC.g;if(!g)return;
  g.setTransform(ARC.dpr,0,0,ARC.dpr,0,0);
  g.clearRect(0,0,ARC.W,ARC.H);
  if(shake>.05){
    g.translate(Math.sin(shakeT*1.7)*shake,Math.cos(shakeT*2.3)*shake*.8);
  }
  /* en el menú no se dibuja el juego: el canvas queda limpio (el arte del menú es
     DOM) y el celular no gasta batería dibujando un tablero que nadie ve */
  if(ARC.scr==='game'||ARC.scr==='pause'||ARC.scr==='over'){
    GAME.draw(g,acc/STEP);
    fxDraw(g);
  }else if(ARC.scr==='menu'&&GAME.attract){
    /* MODO ATRACCIÓN: el juego dibuja su propia escena viva detrás del menú (eso es
       lo que hace que un menú se sienta moderno y no una tarjeta con una foto).
       El juego avisa que la tiene con GAME.attract; el shell le pone la clase
       .live al menú para que el arte fijo no compita con la escena. */
    nsafe2(()=>GAME.attract(STEP,g));
    fxDraw(g);
  }
}

/* ------------------------------------------------------------- 8. ENTRADA */
function bindInput(){
  const cv=$('cv');
  const down=e=>{
    e.preventDefault();ARC.sndResume();
    if(ARC.alive&&!ARC.paused&&GAME.down)GAME.down(ARC.pt(e),e);
  };
  const move=e=>{
    e.preventDefault();
    if(ARC.alive&&!ARC.paused&&GAME.move)GAME.move(ARC.pt(e),e);
  };
  const up=e=>{
    e.preventDefault();
    if(ARC.alive&&!ARC.paused&&GAME.up)GAME.up(ARC.pt(e),e);
  };
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  const B=(id,fn)=>{const el=$(id);if(!el)return;
    el.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sndResume();ARC.sfx('tap');ARC.vib(10);fn(el);});};
  B('bPlay',()=>ARC.play(GAME.levels?Math.min(GAME.levels,(SAVE.done||0)+1):1));
  B('bLevels',()=>{buildLevels();ARC.show('levels');});
  B('bLvBack',()=>ARC.menu());
  /* AJUSTES se puede abrir desde el MENÚ y desde la PAUSA, y LISTO vuelve a donde
     se abrió. Lo pidieron los tres verificadores: antes, cambiar idioma o gráficos
     obligaba a abandonar la partida (bOptBack llamaba siempre a ARC.menu()). */
  B('bOpts',()=>{optFrom='menu';ARC.show('opts');});
  /* botón libre del menú: cada juego lo usa para lo suyo (personajes, tienda...) */
  if(GAME.extra){const e=$('bExtra');e.style.display='flex';e.innerHTML=GAME.extra.icon||'★';
    B('bExtra',()=>nsafe2(()=>GAME.extra.fn()));}
  B('bOpts2',()=>{optFrom='pause';ARC.show('opts');});
  B('bOptBack',()=>{if(optFrom==='pause'&&ARC.alive){ARC.show('pause');}else ARC.menu();});
  B('pPause',()=>ARC.pause());
  B('bRes',()=>ARC.resume());
  B('bRetry',()=>ARC.play(ARC.lvl));
  B('bQuit',()=>ARC.menu());
  B('bAgain',()=>ARC.play(ARC.lvl));
  B('bMenu',()=>ARC.menu());
  B('bNext',()=>ARC.play(Math.min(GAME.levels||1,ARC.lvl+1)));
  B('bWipe',()=>{const m=SAVE.mus,s=SAVE.sfx,v=SAVE.vib,f=SAVE.fx;
    for(const k in SAVE)delete SAVE[k];
    SAVE.mus=m;SAVE.sfx=s;SAVE.vib=v;SAVE.fx=f;SAVE.stars={};SAVE.best=0;SAVE.done=0;SAVE.coins=0;
    saveNow();ARC.toast(T('wiped'));refreshMenu();});
  const SW=(id,key,fn)=>{const el=$(id);if(!el)return;
    el.classList.toggle('on',!!SAVE[key]);
    el.addEventListener('pointerdown',e=>{e.preventDefault();
      SAVE[key]=SAVE[key]?0:1;el.classList.toggle('on',!!SAVE[key]);saveNow();
      ARC.sfx('tap');ARC.vib(10);fn&&fn(SAVE[key]);});};
  SW('swMus','mus',v=>{if(v)ARC.music(GAME.music);else ARC.musicStop();});
  SW('swSfx','sfx');
  SW('swVib','vib');
  SW('swFx','fx');
  SW('swFps','fps',v=>{$('fps').style.display=v?'block':'none';});
  document.addEventListener('keydown',e=>{
    if(e.code==='Escape'){if(ARC.alive&&!ARC.paused)ARC.pause();else if(ARC.paused)ARC.resume();}
    if(GAME.key)GAME.key(e.code,true);
  });
  document.addEventListener('keyup',e=>{if(GAME.key)GAME.key(e.code,false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&ARC.alive)ARC.pause();});
}

/* -------------------------------------------------------- 9. MENÚ / NIVELES */
function refreshMenu(){
  $('mTtl').innerHTML=GAME.title;
  $('mSub').innerHTML=GAME.subKey?T(GAME.subKey):GAME.sub;
  $('mCoins').textContent=SAVE.coins||0;
  const bl=GAME.bestKey?T(GAME.bestKey):(GAME.bestLabel||T('record'));
  $('mBest').innerHTML=(GAME.bestLabel===null?'':('<i>★</i>'+bl+' '+(SAVE.best||0)));
  $('mBest').style.display=GAME.bestLabel===null?'none':'flex';
  const lv=$('mLvl');
  if(GAME.levels){
    lv.style.display='flex';
    const st=Object.values(SAVE.stars||{}).reduce((s2,v)=>s2+v,0);
    lv.innerHTML='<i>▸</i>'+T('level')+' '+Math.min(GAME.levels,(SAVE.done||0)+1)+'/'+GAME.levels+
      ' <i>★</i>'+st;
  }else lv.style.display='none';
  $('bLevels').style.display=GAME.levels?'flex':'none';
  /* la animación de entrada se re-dispara cada vez que se vuelve al menú */
  document.querySelectorAll('#menu .anim').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';});
  ARC.music(GAME.music);
}
function buildLevels(){
  const g=$('lvGrid');g.innerHTML='';
  const n=GAME.levels||1;
  const cols=Math.min(8,Math.ceil(Math.sqrt(n)+1));
  g.style.gridTemplateColumns='repeat('+cols+',auto)';
  for(let i=1;i<=n;i++){
    const st=SAVE.stars[String(i)]||0;
    const lock=i>(SAVE.done||0)+1;
    const el=document.createElement('div');
    el.className='lvl'+(st?' done':'')+(lock?' lock':'');
    el.innerHTML=i+(st?'<b>'+'★'.repeat(st)+'</b>':'');
    if(!lock)el.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sfx('tap');ARC.play(i);});
    g.appendChild(el);
  }
}

/* -------------------------------------------------------------- 10. ARRANQUE */
ARC.boot=async function(){
  document.documentElement.style.setProperty('--acc',GAME.acc||'#ffd166');
  document.documentElement.style.setProperty('--acc2',GAME.acc2||'#f0a02a');
  saveLoad();
  if(GAME.portrait)document.body.classList.add('vert');
  $('ldName').textContent=GAME.name||'';
  ARC.i18nApply();paintSegs();
  fit();bindInput();
  $('fps').style.display=SAVE.fps?'block':'none';

  /* ---------------- CARGA DE ASSETS con barra de verdad ----------------
     Se cuentan TODOS los pasos (motor 3D, arte, sonidos, modelos) y la barra
     avanza por paso terminado. El fondo de la pantalla de carga es el arte del
     propio juego, como en los otros juegos del repo. Al final NO se entra solo:
     aparece "TOCÁ PARA JUGAR", porque ese toque es lo que habilita el audio en
     el celular (sin gesto, el navegador no deja sonar nada). */
  const steps=[];
  if(GAME.three)steps.push('engine');
  if(GAME.art)steps.push('art');
  const sfxN=Object.keys(GAME.sfx||{}).length;
  if(sfxN)steps.push('sounds');
  const glbN=Object.keys(GAME.glb||{}).length;
  if(glbN)steps.push('models');
  let done=0;
  const total=Math.max(1,steps.length);
  const prog=(k)=>{
    done++;
    const pc=Math.round(done/total*100);
    $('ldBar').style.width=pc+'%';$('ldPct').textContent=pc+'%';
    $('ldTxt').textContent=T(k)||'';
  };
  $('ldTxt').textContent=T(steps[0]||'loading');

  /* 1. motor 3D (por importmap, sólo si el juego es 3D) */
  if(GAME.three){
    try{
      const THREE=await import('three');
      ARC.THREE=THREE;
      const gl=$('gl');
      ARC.rnd=new THREE.WebGLRenderer({canvas:gl,antialias:true,alpha:false,powerPreference:'high-performance'});
      ARC.rnd.setClearColor(new THREE.Color(GAME.sky||'#0d1014'),1);
      if(THREE.SRGBColorSpace)ARC.rnd.outputColorSpace=THREE.SRGBColorSpace;
      ARC.rnd.shadowMap.enabled=!!GAME.shadows;
      if(GAME.shadows)ARC.rnd.shadowMap.type=THREE.PCFSoftShadowMap;
      fit();
    }catch(e){console.warn('three',e);}
    prog('engine');
  }
  applyGfx();

  /* 2. arte del menú (y fondo de esta misma pantalla) */
  if(GAME.art){
    await new Promise(res=>{
      const im=new Image();
      im.onload=()=>{
        $('load').style.backgroundImage='url('+GAME.art+')';
        const el=$('menu');
        if(GAME.portrait){
          el.style.backgroundImage='url('+GAME.art+'), linear-gradient(180deg,'+
            (GAME.acc2||'#222')+'55 0%, #0a0d12 46%, #05070a 100%)';
          el.style.backgroundSize='100% auto, 100% 100%';
          el.style.backgroundRepeat='no-repeat, no-repeat';
          el.style.backgroundPosition='center 14%, center';
        }else{
          el.style.backgroundImage='url('+GAME.art+')';
        }
        el.classList.add('hasart');res();
      };
      im.onerror=()=>res();
      im.src=GAME.art;
    });
    prog('art');
  }
  /* 3. sonidos */
  if(sfxN){
    await new Promise(res=>ARC.sndLoad(GAME.sfx,res));
    prog('sounds');
  }
  /* 4. modelos 3D (opcional: los juegos que usan GLB los declaran en GAME.glb) */
  if(glbN&&ARC.THREE){
    try{
      const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
      const ld=new GLTFLoader();
      ARC.glb={};
      await Promise.all(Object.keys(GAME.glb).map(k=>new Promise(res=>{
        ld.load(GAME.glb[k],g=>{ARC.glb[k]=g;res();},undefined,()=>{ARC.glb[k]=null;res();});
      })));
    }catch(e){console.warn('glb',e);ARC.glb=ARC.glb||{};}
    prog('models');
  }
  /* 4b. LOS GLB GENERADOS VIENEN CON DEMASIADA MALLA. Medido en este pack: la
     sierra y el arco de Rueda traían 28.725 y 27.592 triángulos cada uno, y la
     escena llegaba a 99.793 triángulos a 11 fps. Se simplifican UNA vez al
     cargarlos, hasta GAME.glbTris (por defecto 1200 por modelo).
     DOS PASOS, y el primero es el que importa: SimplifyModifier NO puede colapsar
     nada si los vértices están duplicados por triángulo (así vienen los GLB de
     image_to_3d), así que primero se SUELDAN con mergeVertices y después se
     simplifica. Sin el soldado, modify() devolvía la malla igual (medido:
     28725 -> 28725). Si algo falla, se deja la malla como vino: nunca se rompe. */
  if(ARC.glb&&Object.keys(ARC.glb).length){
    const target=GAME.glbTris||1200;
    try{
      const [{SimplifyModifier},BGU]=await Promise.all([
        import('three/addons/modifiers/SimplifyModifier.js'),
        import('three/addons/utils/BufferGeometryUtils.js')]);
      const mod=new SimplifyModifier();
      ARC.glbTris={};
      for(const k in ARC.glb){
        const g=ARC.glb[k];if(!g||!g.scene)continue;
        let before=0,after=0;
        g.scene.traverse(o=>{
          if(!o.isMesh||!o.geometry||!o.geometry.attributes.position)return;
          const tri0=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;
          before+=tri0;
          if(tri0<=target){after+=tri0;return;}
          try{
            let geo=o.geometry;
            /* soldar: de 3 vértices por triángulo a vértices compartidos */
            if(BGU&&BGU.mergeVertices)geo=BGU.mergeVertices(geo,1e-4);
            const verts=geo.attributes.position.count;
            const tri=(geo.index?geo.index.count:verts)/3;
            const keep=clamp(target/tri,.03,1);
            const drop=Math.floor(verts*(1-keep));
            const sim=drop>0?mod.modify(geo,drop):geo;
            const tri2=(sim.index?sim.index.count:sim.attributes.position.count)/3;
            if(sim&&tri2>20&&tri2<tri){
              o.geometry.dispose();o.geometry=sim;o.geometry.computeVertexNormals();
              after+=tri2;
            }else after+=tri0;
          }catch(e){after+=tri0;}
        });
        ARC.glbTris[k]=[Math.round(before),Math.round(after)];
      }
    }catch(e){console.warn('simplify',e);}
  }
  /* 5. listo: el juego se prepara y se espera el toque */
  nsafe2(()=>GAME.init&&GAME.init());
  requestAnimationFrame(loop);
  $('ldBar').style.width='100%';$('ldPct').textContent='100%';
  $('ldTxt').textContent=T('ready');
  $('ldGo').classList.add('on');
  const enter=()=>{
    $('ldGo').removeEventListener('pointerdown',enter);
    ARC.sndResume();
    $('load').style.display='none';
    ARC.show('menu');refreshMenu();
    ARC.music(GAME.music);
  };
  $('ldGo').addEventListener('pointerdown',e=>{e.preventDefault();enter();});
  /* atajo para las sondas y para el teclado */
  ARC.enterMenu=enter;
  document.addEventListener('keydown',e=>{if(ARC.scr==='load'&&(e.code==='Space'||e.code==='Enter'))enter();});
};

/* ============================ CONTRATO DEL JUEGO ============================
   window.GAME = {
     slug, name, title (HTML), sub (HTML), acc, acc2,   // identidad y colores
     art, music, sfx:{nombre:url},                      // assets
     levels, bestLabel,                                 // progresión
     init(), start(lvl), step(dt), draw(g,alpha),       // ciclo
     down(p,e), move(p,e), up(p,e), key(code,down),     // entrada (p en px del stage)
     resize(), pause(), resume()                        // opcionales
   }
   El juego avisa el final con ARC.over({win,score,stars,sub,coins}).
   ========================================================================== */

/* ============================================================================
   RUEDA NEÓN — la pelota que corre por una pista de neón en el vacío
   ----------------------------------------------------------------------------
   La pelota avanza sola; el dedo la mueve de costado. La pista tiene AGUJEROS
   (te caés), MUROS (te frenan), SIERRAS que giran, COMPUERTAS que se abren y
   cierran con ritmo, RÁFAGAS de viento cruzado, RAMPAS DE IMPULSO y DIAMANTES
   para juntar. 8 niveles con pista fija (semilla por nivel: mismo nivel = misma
   pista, se aprende de memoria) y un ARCO DE CONTROL a la mitad que te devuelve
   una vez. Los diamantes se GASTAN en pelotas y cada nivel tiene tres MEDALLAS y
   su mejor tiempo.

   LO QUE HAY QUE SABER PARA TOCAR ESTE ARCHIVO
   --------------------------------------------
   · LA PISTA VA EN TROZOS FUSIONADOS (lo que la hizo rápida de verdad). Todo lo
     estático de un tramo de 48 m —baldosas, faldón, aristas de luz, travesaños,
     portales, rampas, muros, marcos de compuerta, chapas de aviso y las columnas
     del vacío— se hornea en UNA sola geometría con color por vértice. Cada trozo
     es UNA llamada de dibujo y sólo se dibujan los que están entre −14 m y
     +118 m de la pelota (la niebla se cierra en 132). MEDIDO con renderer.info en
     el nivel 8, 412×915: antes eran 3 mallas para los 390 m enteros y se
     dibujaban SIEMPRE completas → 24.530 triángulos, 45 llamadas, 44,5 fps
     mínimos y la resolución bajando sola a 0,9. Con trozos + instancias + cielo
     de CSS: 12.550 triángulos, 12 llamadas, 50,7 fps mínimos y la resolución al
     tope. Lo que se ahorró es lo que se gastó en el cielo y los arcos nuevos.
   · LEGIBILIDAD DE LA PISTA. Antes las baldosas eran Lambert oscuras con niebla
     negra: a 25 m la pista se fundía con el vacío y no se veía dónde estaba el
     borde ni el agujero (medido con snapGL: luz 34-39 con el 60% del cuadro en
     negro). Ahora cada celda emite ARISTAS de luz en cada lado que NO tiene
     vecina: eso contornea la pista Y el borde de cada agujero, que es lo que
     hace que el camino se lea de lejos.
     La niebla ya no es negra: es del color de la ZONA y arranca lejos, así la
     distancia se lee como BRUMA y no como pozo negro.
   · EL VACÍO YA NO ES UN POZO NEGRO, Y EL CIELO NO CUESTA NI UN CUADRO. El fondo
     es un DEGRADADO de la zona con bruma en la lejanía más 46 estrellas, y las
     dos cosas son CSS en el fondo del lienzo #gl (el renderer se rehace con
     alpha:true y limpia con alfa 0). Medido A/B con la misma partida y la
     resolución clavada (ab_rueda.js, nivel 5, 412×915): el mismo degradado como
     scene.background costaba 51,1 fps contra 60,0 sin él, y 240 estrellas en un
     THREE.Points otros 5 fps (en swiftshader llenar la pantalla de nuevo y
     dibujar gl.POINTS con mezcla es carísimo). En CSS lo compone el navegador una
     vez y sale gratis.
   · LO QUE SE MUEVE VA INSTANCIADO. Sierras, compuertas y diamantes son tres
     InstancedMesh; las visibles se empaquetan en los primeros índices y se baja
     `count`, así ni se dibujan ni cuentan triángulos las que están detrás de la
     bruma. En el nivel 8 eso pasó de ~42 llamadas de dibujo a 3.
   · RÁFAGAS (el peligro nuevo de las zonas altas, niveles 4 a 8): tramos de 15 m
     con el piso marcado donde el viento arrastra el DESTINO del dedo 1,05 m/s
     hacia un costado (empuja tx y NO bx: el viento nunca te mete de prepo en un
     agujero, sólo te desvía si te quedás quieto).
   · NADA DE GLB EN ESTE JUEGO. Los dos modelos generados (sierra y arco) pasan
     por el simplificador del motor y quedan en 383 y 304 triángulos: en pantalla
     son bollos de papel oscuros (capturas Z-saw5.png y Z-cparch.png del informe:
     el arco de control era un montón de esquirlas negras a los costados de la
     pista). Se cambiaron por geometría propia, teñida por zona, que además pesa
     2,5 MB menos de descarga y saca un paso de la pantalla de carga.
   · UNA ZONA POR NIVEL (TH8). Cada nivel trae su paleta completa (baldosas,
     aristas, niebla, cielo, columnas, color de peligro, color del arco y de los
     diamantes) y su nombre; el nivel 8 no se parece en nada al 1. La paleta se
     aplica ANTES de armar las mallas, porque los colores van horneados por
     vértice.
   · CINCO PELIGROS. muro (fijo), sierra (gira; algunas BARREN carriles),
     COMPUERTA (`puls`: una pared que sube y baja con ritmo propio; se cruza
     cuando está abajo — es el único peligro de TIEMPO, no de posición) y el
     vacío. Cada uno deja (a) chapa magenta con galón en las 2 baldosas
     anteriores, (b) sombra en su baldosa y (c) galón 2D pulsante proyectado en
     pantalla entre 3,5 y 27 m. A 11,3 m/s eso son 2,1 s de aviso. La ráfaga es
     el quinto y avisa distinto: alfombra oscura con flechas en el piso, aviso al
     entrar y rayas 2D cruzando la pantalla.
   · RAMPAS DE IMPULSO (boosts). Van SOBRE el camino garantizado, cada ~26 m y
     nunca a menos de 6 m de un peligro. Dan +45% de velocidad que decae en
     1,4 s (≈0,3 s de tiempo ganado cada una). Son lo que hace que el MEJOR
     TIEMPO por nivel se pueda mejorar: sin rampas el tiempo sería fijo
     (largo/velocidad) y la medalla de velocidad no significaría nada.
   · EL PUESTO DE CONTROL SE VE EN LA PISTA: es un ARCO de neón (dos pilonas con
     tira de luz y un dintel con tres barras) con una franja ancha cruzando la
     pista, y el arco y su franja NO tienen niebla, así se ven venir desde 150 m.
     Al pasarlo la franja cambia de ámbar a verde y el arco se enciende. La meta
     es otro arco, con cuadros de bandera a cuadros en el piso.
   · UNA SOLA VERDAD DE POSICIÓN. Antes `bx` era el destino Y el colisionador,
     mientras la pelota dibujada iba interpolada: se moría por una pared que en
     pantalla estaba a medio carril. Ahora `bx` es la posición REAL (se mueve a
     LSP m/s hacia `tx`, el destino que pide el dedo) y el choque se mide con
     `bx`. La pelota dibujada ES bx.
   · MARGEN DE REACCIÓN. Los primeros `clean` metros de cada nivel no tienen
     nada (34 en el 1, 22 en el 8) y la velocidad entra con rampa: 55% durante
     los primeros 2,6 s. Nunca se muere en el primer segundo.
   · CURVA DE DIFICULTAD EXPLÍCITA (tabla LV, no una fórmula): nivel 1 = 112 m a
     6 m/s sin sierras y sin pasillos angostos (19 s, lo pasa cualquiera);
     nivel 8 = 390 m a 11,3 m/s con sierras que barren y compuertas (35 s).
   · CAMINO GARANTIZADO. Se lleva un carril "camino" que se corre como máximo un
     carril cada `shift` metros y nunca se le hace un agujero ni se le pone un
     obstáculo; se protegen también los carriles del metro anterior y siguiente
     porque la pelota tarda 0,12 s en cruzar de carril y a 11 m/s eso es 1,4 m.
     Sin esto la pista aleatoria arma filas imposibles (medido: caída al vacío a
     los 41 m de 208 sin haber tocado nada evitable).
   · DIAMANTES = MONEDA. Se juntan de a tandas SOBRE el camino, cuentan para las
     estrellas (85% = 3, 55% = 2) y se GASTAN en pelotas (panel del botón ◆ del
     menú). Se guardan en ARC.S.coins (el motor ya muestra esa ficha en el menú;
     acá se le cambia el ícono a ◆) y el total de por vida en ARC.S.gems.
   · MEDALLAS por nivel, en ARC.S.med[nivel] como bits: 1 = llegaste sin usar el
     arco de control, 2 = todos los diamantes, 4 = por debajo del tiempo par.

function Q(A,a,b,c,d,col){
  const t=[a,b,c,a,c,d];
  for(const v of t){A.p.push(v[0],v[1],v[2]);A.c.push(col[0],col[1],col[2]);}

function TRI(A,a,b,c,col){
  for(const v of [a,b,c]){A.p.push(v[0],v[1],v[2]);A.c.push(col[0],col[1],col[2]);}
}

  Q(A,[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],ct);
  Q(A,[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],cs);
  Q(A,[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],cs);
  Q(A,[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],cs);
  Q(A,[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],cs);
}

  Q(A,[x-w/2,y,z+d/2],[x+w/2,y,z+d/2],[x+w/2,y,z-d/2],[x-w/2,y,z-d/2],col);

   chapas rectangulares y en pantalla se leían como cuadraditos sueltos, no como
   flechas (captura SC-rafaga2.png de esa vuelta). El orden de los vértices manda
   la cara: con dz y dx del mismo signo la normal sale hacia ARRIBA. */
function arrow(A,x,z,y,ln,wd,dir,col){
  const x0=x-dir*ln*.35,x1=x+dir*ln*.65;
  if(dir>0)TRI(A,[x0,y,z-wd],[x0,y,z+wd],[x1,y,z],col);
  else       TRI(A,[x0,y,z+wd],[x0,y,z-wd],[x1,y,z],col);

function meshOf(A,fog,op){
  const g=new T3.BufferGeometry();
  g.setAttribute('position',new T3.Float32BufferAttribute(A.p,3));
  g.setAttribute('color',new T3.Float32BufferAttribute(A.c,3));
  g.computeBoundingSphere();
  /* FrontSide a propósito: todas las caras se emiten con el giro correcto (probado
     cara por cara con el producto vectorial), así el rasterizador descarta la
     mitad. Con DoubleSide el celular pintaba dos veces cada columna del vacío. */
  const m=new T3.MeshBasicMaterial({vertexColors:true,side:T3.FrontSide,fog:fog!==false});
  if(op!=null){m.transparent=true;m.opacity=op;}
  const me=new T3.Mesh(g,m);me.userData.own=1;return me;
}

   horizonte no tiene costura con la bruma de la pista). */
/* Los topes del degradado, iguales para el CSS y para la textura de respaldo.
   OJO CON EL SENTIDO: 0% es ARRIBA de la pantalla. La primera versión tenía el
   resplandor al final y salió con la franja brillante ABAJO, o sea DEBAJO de la
   pista, en el vacío (captura A-rueda-mid-h.png de esa vuelta). El horizonte de
   este juego cae al 21% del alto (medido con el encuadre CAMY/AIM), así que el
   resplandor va ahí y para abajo se apaga. */
function skyStops(){
  return[[0,mixc(PAL.sky,'#000000',.45)],[.10,PAL.sky],
    [.14,mixc(PAL.fog,PAL.sky,.45)],
    [.225,mixc(PAL.fog,PAL.rail,.22)],          /* la bruma lejana, difusa */
    [.32,mixc(PAL.fog,PAL.sky,.25)],
    [.55,mixc(PAL.sky,'#000000',.5)],
    [1,mixc(PAL.sky,'#000000',.78)]];
}
/* EL CIELO SE PINTA CON CSS, NO CON WebGL. Medido A/B en el nivel 5 a 412×915 con
   la resolución clavada (ab_rueda.js): con el degradado como scene.background —o
   sea un rectángulo de pantalla completa con textura— 51,1 fps; sin él, 60,0. En
   swiftshader llenar la pantalla otra vez cuesta el 17% del cuadro.
   La solución: el renderer se rehace con alpha:true y limpia con alfa 0 (fastGL),
   el degradado va como background del lienzo #gl y lo compone el navegador una
   sola vez. Sale gratis y se ve igual. Si por lo que sea no se pudo rehacer el
   renderer, se cae a la textura (feo pero nunca negro). */
/* LAS ESTRELLAS TAMBIÉN SON CSS. Medido A/B con la misma partida y la resolución
   clavada (ab_rueda.js, nivel 5, 412×915): con 240 estrellas en un THREE.Points
   49,8 fps, sin ellas 54,8. Cinco cuadros por 240 puntitos no se pagan: en
   swiftshader gl.POINTS con mezcla cuesta carísimo. Puestas como radial-gradient
   en el mismo fondo del lienzo salen gratis (el navegador pinta esa capa UNA vez)
   y ni se nota que no tienen paralaje: están a 100 m. */
let starCss='';
function buildStarCss(){
  const R=rng(20260731);const a=[];
  for(let i=0;i<46;i++){
    const x=(R()*100).toFixed(1),y=(R()*R()*34).toFixed(1);   /* apiñadas arriba */
    const s=(R()<.25?1.8:1.1).toFixed(1),o=(.35+R()*.5).toFixed(2);
    a.push('radial-gradient('+s+'px '+s+'px at '+x+'% '+y+'%,rgba(255,255,255,'+o+') 0,rgba(255,255,255,0) 100%)');
  }
  starCss=a.join(',');
}
function setSky(){
  const st=skyStops();
  if(cssSky){
    const gl=document.getElementById('gl');
    if(!starCss)buildStarCss();
    if(gl)gl.style.background=starCss+',linear-gradient(180deg,'+
      st.map(s=>s[1]+' '+(s[0]*100).toFixed(1)+'%').join(',')+')';
    scene.background=null;
    if(stars)stars.visible=false;
  }else{
    const cv=document.createElement('canvas');cv.width=8;cv.height=256;
    const g=cv.getContext('2d');
    const gr=g.createLinearGradient(0,0,0,256);
    st.forEach(s=>gr.addColorStop(s[0],s[1]));
    g.fillStyle=gr;g.fillRect(0,0,8,256);
    const t=new T3.CanvasTexture(cv);
    if(T3.SRGBColorSpace)t.colorSpace=T3.SRGBColorSpace;
    if(skyTex)skyTex.dispose();
    skyTex=t;scene.background=t;
  }
  if(stars)stars.material.color.set(mixc(PAL.rail,'#ffffff',.5));
}
/* 240 estrellas en UN THREE.Points (una llamada, cero triángulos) metidas en un
   grupo que sigue a la cámara: es un cielo, no decorado de la pista. */
function buildStars(){
  const N=240,p=new Float32Array(N*3);
  const R=rng(77);
  for(let i=0;i<N;i++){
    const a=R()*TAU,r=40+R()*140,y=6+R()*70;
    p[i*3]=Math.cos(a)*r;p[i*3+1]=y;p[i*3+2]=-Math.abs(Math.sin(a))*r-20;
  }
  const g=new T3.BufferGeometry();
  g.setAttribute('position',new T3.Float32BufferAttribute(p,3));
  const m=new T3.PointsMaterial({color:new T3.Color('#cfe9ff'),size:1.7,
    sizeAttenuation:false,transparent:true,opacity:.85,fog:false});
  stars=new T3.Points(g,m);
  skyG=new T3.Group();skyG.add(stars);scene.add(skyG);
}
/* --------------------------------------------------- generador determinista */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const lx=i=>(i-(LANES-1)/2)*CW;
function clearG(g){while(g.children.length){const c=g.children[0];g.remove(c);
  if(c.geometry&&c.userData.own)c.geometry.dispose();}}
function buildTrack(n){
  const P=LV[clamp(n,1,8)-1];
  LEN=P.len;SPD=P.spd;CPZ=Math.round(LEN/2);PAR=parOf(n);
  setTheme(n);
  const R=rng(4177+n*977);
  cells=[];obs=[];obsZ=[];gems=[];boosts=[];pathL=[];sawG=[];winds=[];
  clearG(trackG);clearG(dynG);
  chunks=[];
  /* 1) camino garantizado */
  let lane=Math.floor(LANES/2),lastSh=-99;
  for(let z=0;z<=LEN+2;z++){
    if(z>P.clean&&z<LEN-8&&z-lastSh>=P.shift&&R()<.62){
      const nl=clamp(lane+(R()<.5?-1:1),0,LANES-1);
      if(nl!==lane){lane=nl;lastSh=z;}
    }
    pathL.push(lane);
  }
  /* 2) filas: agujeros y pasillos, nunca sobre el camino ni sus vecinos en z */
  for(let z=0;z<=LEN+2;z++){
    const row=new Array(LANES).fill(1);
    const keep={};keep[pathL[Math.max(0,z-1)]]=1;keep[pathL[z]]=1;keep[pathL[Math.min(LEN+2,z+1)]]=1;
    if(z>P.clean&&z<LEN-6){
      if(R()<P.hole){
        const k=1+Math.floor(R()*2);
        for(let i=0;i<k;i++){const c=Math.floor(R()*LANES);if(!keep[c])row[c]=0;}
      }
      if(R()<P.narrow){
        for(let i=0;i<LANES;i++)if(!keep[i]&&Math.abs(i-pathL[z])>1)row[i]=0;
      }
    }
    cells.push(row);
  }
  /* 3) obstáculos y diamantes */
  let gemRun=0,lastGem=-99;
  for(let z=0;z<=LEN;z++){
    if(z>P.clean&&z<LEN-6){
      const free=[];for(let i=0;i<LANES;i++)if(!keepAt(z,i)&&cells[z][i])free.push(i);
      /* JUSTICIA: no se tapa un carril en una fila que ya está casi cerrada. Sin
         esto el nivel 7 armaba la fila 184 = 10011 CON un muro en el 3: quedaban
         abiertos sólo el 0 y el 4, con el peligro justo en el medio, y había que
         comprometerse cuatro filas antes (ahí murió el piloto al 56%). Ahora todo
         obstáculo exige 3 carriles sólidos: siempre quedan dos salidas. */
      const openN=cells[z].reduce((s,v)=>s+v,0);
      if(openN<3)free.length=0;
      const r=R();
      if(free.length&&r<P.wall){
        const i=free[Math.floor(R()*free.length)];
        obs.push({t:'wall',i,z,x:lx(i),w:CW*.46,amp:0,ph:0,sp:0});
      }else if(free.length&&r<P.wall+P.saw){
        const i=free[Math.floor(R()*free.length)];
        obs.push({t:'saw',i,z,x:lx(i),w:.50,amp:0,ph:R()*TAU,sp:0});
      }else if(free.length&&r<P.wall+P.saw+P.puls){
        /* COMPUERTA: el único peligro de TIEMPO. Sube y baja con su propio ritmo
           (1,5-2,1 s) y está cerrada el 45% del tiempo; se cruza cuando está
           abajo. Nunca dos seguidas a menos de 3 m, para que la lectura del
           ritmo alcance. */
        const i=free[Math.floor(R()*free.length)];
        /* NUNCA una compuerta donde el camino se está corriendo. MEDIDO con el
           piloto en el nivel 7: la línea iba 4→3→2 en las filas 263 y 266 y había
           una compuerta en la 267; hay que cambiar dos carriles en 4 filas (a
           10,4 m/s un carril cuesta 2) y encima acertarle al ritmo de la
           compuerta: caída al vacío en la 266,5 en las dos corridas. Con el
           camino quieto ±2 filas alrededor, el peligro de TIEMPO no se junta con
           el de POSICIÓN. */
        if(noObsNear(z,3)&&pathStable(z,2))obs.push({t:'puls',i,z,x:lx(i),w:CW*.46,amp:0,ph:R()*3,sp:0,per:1.5+R()*.6});
      }else if(r<P.wall+P.saw+P.puls+P.mov&&rowSolid(z)&&noObsNear(z,3)&&pathStable(z,2)){
        /* SIERRA QUE BARRE: sólo en filas enteras (siempre hay escape a los
           costados) y a 2 carriles del camino, con amplitud 1,45·CW para que sí
           llegue a invadir el carril bueno: la esquivás moviéndote, no rezando */
        const cand=[];for(let i=0;i<LANES;i++)if(Math.abs(i-pathL[z])>=2)cand.push(i);
        if(cand.length){
          const i=cand[Math.floor(R()*cand.length)];
          obs.push({t:'saw',i,z,x:lx(i),w:.50,amp:CW*1.45,ph:R()*TAU,sp:1.5+R()*.5});
        }
      }
      /* DIAMANTES: tandas de 3 a 5 SOBRE el camino, una cada 13-16 m. Antes salían
         por probabilidad y el nivel 1 quedaba con 6 diamantes mientras el 2 tenía
         22 (medido con dbg.state): con tan pocos, el 85% para las 3 estrellas
         obligaba a juntar TODOS. Con reparto fijo la cuenta es proporcional al
         largo del nivel y las estrellas significan lo mismo en los 8 niveles. */
      if(gemRun>0){gemRun--;gems.push({z,i:pathL[z],x:lx(pathL[z]),got:0});}
      else if(z-lastGem>=13+Math.floor(R()*4)){gemRun=3+Math.floor(R()*3);lastGem=z;}
    }
  }
  gemT=gems.length;
  /* 3b) índice por z: el piloto y los choques miran 3 casilleros en vez de los
     95 obstáculos del nivel (ver el comentario de arriba sobre el piloto) */
  for(const o of obs)(obsZ[o.z]||(obsZ[o.z]=[])).push(o);
  /* 3c) RAMPAS DE IMPULSO: una cada 24 m SOBRE el camino garantizado. Se busca la
     primera fila del tramo que esté lejos de un peligro, y si el nivel viene tan
     cargado que no hay ninguna a 4 m se afloja a 3 y a 2 (medido: con "6 m de
     margen" fijo el nivel 8 se quedaba con UNA sola rampa en 390 m y la medalla
     de velocidad era imposible). */
  const nb=nbOf(n);
  for(let k=0;k<nb;k++){
    const zs=P.clean+8+k*24;
    let put=-1;
    for(const need of [4,3,2]){
      for(let z=zs;z<Math.min(LEN-8,zs+22);z++){
        if(!cells[z][pathL[z]]||!noObsNear(z,need))continue;
        if(boosts.length&&z-boosts[boosts.length-1].z<10)continue;
        put=z;break;
      }
      if(put>=0)break;
    }
    if(put>=0)boosts.push({z:put,i:pathL[put],x:lx(pathL[put])});
  }
  /* 3d) RAFAGAS: tramos de 15 m repartidos por el nivel, nunca en los primeros
     metros limpios ni pegados a la meta, y con el lado sorteado. */
  const ng=P.gust|0;
  for(let k=0;k<ng;k++){
    const z0=Math.round(P.clean+18+(LEN-P.clean-40)*(k+.5)/Math.max(1,ng));
    if(z0<8||z0+16>LEN-8)continue;
    if(Math.abs(z0+7-CPZ)<12)continue;      /* que no tape el arco de control */
    winds.push({z0,z1:z0+15,d:(R()<.5?-1:1)});
  }
  /* 4) mallas */
  buildMeshes(P);
  buildArches();
  setSky();
}
/* ¿el camino garantizado está QUIETO alrededor de esta fila? (lo piden los
   peligros de tiempo: ver el comentario de la compuerta) */
function pathStable(z,d){
  const a=pathL[clamp(z,0,pathL.length-1)];
  for(let k=-d;k<=d;k++)if(pathL[clamp(z+k,0,pathL.length-1)]!==a)return false;
  return true;
}
function keepAt(z,i){
  return pathL[Math.max(0,z-1)]===i||pathL[z]===i||pathL[Math.min(pathL.length-1,z+1)]===i;
}
function rowSolid(z){for(let i=0;i<LANES;i++)if(!cells[z][i])return false;
  return z>1&&rowFull(z-1)&&rowFull(z+1);}
function rowFull(z){const r=cells[z];if(!r)return false;
  for(let i=0;i<LANES;i++)if(!r[i])return false;return true;}
function noObsNear(z,d){for(const o of obs)if(Math.abs(o.z-z)<d)return false;return true;}
function solid(z,i){const r=cells[z];return!!(r&&r[i]);}
const obsAt=z=>obsZ[z]||NOOBS;
/* lado hacia el que sopla en este metro (0 = sin viento) */
function windAt(z){for(const w of winds)if(z>=w.z0&&z<=w.z1)return w.d;return 0;}

/* TODO LO ESTÁTICO EN TROZOS DE 48 m.
   Cada trozo se hornea en UNA geometría (baldosas + faldón + aristas + travesaños
   + portales + rampas + muros + marcos + avisos + columnas del vacío) y en cada
   cuadro sólo se dibujan los trozos entre −14 m y +118 m de la pelota. Antes eran
   3 mallas de los 390 m enteros, dibujadas SIEMPRE completas. */
function buildMeshes(P){
  const NC=Math.floor((LEN+6)/CH)+1;
  const acc=[];for(let k=0;k<NC;k++)acc.push(A0());
  chunks=new Array(NC);
  const AT=z=>acc[clamp(Math.floor(z/CH),0,NC-1)];
  const t0=C(PAL.t0),t1=C(PAL.t1),sk=C(PAL.skirt),rl=C(PAL.rail),br=C(PAL.bar);
  const dg=C(PAL.danger),sh=C(PAL.shadow),bo=C(PAL.boost);
  const E=.085;                               /* ancho de la arista brillante */
  for(let z=0;z<cells.length;z++){
    const A=AT(z);
    for(let i=0;i<LANES;i++){
      if(!cells[z][i])continue;
      const x=lx(i),zc=-z;
      const col=((z+i)&1)?t0:t1;
      /* tapa */
      Q(A,[x-CW/2,0,zc+.5],[x+CW/2,0,zc+.5],[x+CW/2,0,zc-.5],[x-CW/2,0,zc-.5],col);
      /* faldón sólo donde no hay vecina (así se ve el espesor en los bordes) */
      if(!solid(z,i-1))Q(A,[x-CW/2,-TH,zc-.5],[x-CW/2,-TH,zc+.5],[x-CW/2,0,zc+.5],[x-CW/2,0,zc-.5],sk);
      if(!solid(z,i+1))Q(A,[x+CW/2,-TH,zc+.5],[x+CW/2,-TH,zc-.5],[x+CW/2,0,zc-.5],[x+CW/2,0,zc+.5],sk);
      if(!solid(z-1,i))Q(A,[x-CW/2,-TH,zc+.5],[x+CW/2,-TH,zc+.5],[x+CW/2,0,zc+.5],[x-CW/2,0,zc+.5],sk);
      if(!solid(z+1,i))Q(A,[x+CW/2,-TH,zc-.5],[x-CW/2,-TH,zc-.5],[x-CW/2,0,zc-.5],[x+CW/2,0,zc-.5],sk);
      /* ARISTAS DE LUZ en cada lado sin vecina: contornea la pista y CADA
         agujero. Es lo que hace legible el camino a 60 m. */
      if(!solid(z,i-1)){plate(A,x-CW/2+E/2,zc,E,1,.012,rl);
        /* la ALETA vertical va sólo en el borde de la pista (i=0 / i=4): puesta
           también en los bordes de los agujeros parecían paredes y tapaban el
           camino de más adelante */
        if(i===0)bq(A,x-CW/2+.03,0,zc,.06,.19,1,rl,rl);}
      if(!solid(z,i+1)){plate(A,x+CW/2-E/2,zc,E,1,.012,rl);
        if(i===LANES-1)bq(A,x+CW/2-.03,0,zc,.06,.19,1,rl,rl);}
      if(!solid(z-1,i))plate(A,x,zc+.5-E/2,CW,E,.012,rl);
      if(!solid(z+1,i))plate(A,x,zc-.5+E/2,CW,E,.012,rl);
      /* travesaño cada 4 m: da ritmo y escala de distancia */
      if(z%4===0)plate(A,x,zc,CW*.98,.09,.008,br);
    }
  }
  /* PORTALES de la zona (niveles 3+) cada P.ring metros: dos pilonas altas con
     tira de luz y un dintel FINO Y ALTO. MEDIDO en captura (M-ANTES-lv5-h.png):
     con el dintel de 16 cm a 2,6 m de alto, al pasarlo tapaba la pantalla entera
     con una banda pastel de 35 px que se leía como un error de la interfaz. Con
     10 cm a 3,4 m pasa como un destello arriba del cuadro. */
  if(P.ring){
    /* APAGADOS a propósito (mezclados con la niebla) y más bajos que el arco de
       control: en la captura SC-cp.png del nivel 8 los portales eran igual de
       llamativos que el arco y no se distinguía cuál era el hito que importa. */
    const rg=C(mixc(PAL.ring,PAL.fog,.45)),rw=C(mixc(PAL.ring,'#ffffff',.3)),W=CW*LANES+.5;
    for(let z=P.ring;z<LEN-4;z+=P.ring){
      if(Math.abs(z-CPZ)<5)continue;
      const A=AT(z);
      for(const s of [-1,1]){
        bq(A,s*(W/2),0,-z,.15,2.9,.15,rg,C(mixc(PAL.ring,'#000000',.6)));
        bq(A,s*(W/2)-s*.09,.5,-z,.05,2.1,.18,rw,rw);  /* tira de luz de la pilona */
      }
      bq(A,0,2.9,-z,W,.09,.13,rw,rg);
    }
  }
  /* RAMPAS DE IMPULSO: tres galones verdes en la baldosa y dos marcas al costado */
  for(const b of boosts){
    const A=AT(b.z);
    plate(A,b.x,-b.z,CW*.9,.94,.013,C(mixc(PAL.boost,'#000000',.6)));
    for(let k=0;k<3;k++){
      plate(A,b.x,-b.z+.3-k*.3,CW*.66,.11,.019,bo);
      plate(A,b.x-CW*.24,-b.z+.36-k*.3,.1,.2,.019,bo);
      plate(A,b.x+CW*.24,-b.z+.36-k*.3,.1,.2,.019,bo);
    }
  }
  /* muros, compuertas y avisos */
  for(const o of obs){
    const A=AT(o.z);
    if(o.t==='wall'){
      bq(A,o.x,0,-o.z,CW*.92,.82,.34,C(PAL.wallTop),C(PAL.wall));
      plate(A,o.x,-o.z,CW*.9,.3,.83,C(PAL.wallTop));
    }
    if(o.t==='puls'){
      /* marco de la compuerta: dos postes que quedan SIEMPRE, así se ve que ahí
         hay una compuerta aunque en ese momento esté abierta */
      for(const s of [-1,1])bq(A,o.x+s*CW*.47,0,-o.z,.1,1.15,.24,C(PAL.rail),C(PAL.rail));
      bq(A,o.x,1.15,-o.z,CW*.94+.1,.1,.24,C(PAL.rail),C(PAL.rail));
    }
    /* sombra en el piso debajo del peligro */
    if(solid(o.z,o.i))plate(A,o.x,-o.z,CW*.86,.86,.016,sh);
    /* PISTA DE AVISO: dos baldosas antes del peligro, oscuras con galones magenta.
       Con una sola (2 m) a 11,3 m/s el aviso duraba 0,18 s: no es un aviso, es un
       adorno. Con dos son 0,35 s de alfombra roja además de ver el bicho de lejos. */
    for(const dz of [2,3]){
      const zw=o.z-dz;
      if(!solid(zw,o.i))continue;
      const B=AT(zw);
      plate(B,o.x,-zw,CW*.9,.94,.014,C(PAL.dangerD));
      plate(B,o.x,-zw+.24,CW*.62,.13,.018,dg);
      plate(B,o.x,-zw-.06,CW*.62,.13,.018,dg);
    }
  }
  /* RAFAGAS: el piso del tramo va rayado y con flechas hacia donde sopla, para que
     se vea ANTES de entrar (la primera version no marcaba nada y el jugador solo
     sentia que la pelota "se iba sola": eso es un bug, no un peligro). */
  for(const w of winds){
    /* MEDIDO EN CAPTURA (SC-rafaga.png): con las flechas del color de los
       travesaños sobre las baldosas doradas del nivel 8 no se veían. Ahora va una
       ALFOMBRA oscura por todo el tramo y las flechas en claro encima: se lee el
       corredor de viento desde lejos, igual que la alfombra de peligro. */
    /* la alfombra va OSCURA PERO CON EL COLOR DE LA ZONA, no casi negra: con
       mixc(fog,negro) el tramo parecía un agujero de 15 m (captura SC-rafaga.png
       de esa vuelta) y un agujero es justo lo que mata en este juego. */
    const dark=C(mixc(PAL.t1,'#000000',.45)),ar=C(mixc(PAL.rail,'#ffffff',.35));
    const wAll=CW*LANES;
    for(let z=w.z0;z<=w.z1;z++){
      const A=AT(z);
      plate(A,0,-z,wAll,1,.010,dark);                 /* alfombra del corredor */
      plate(A,0,-z,wAll,.07,.013,ar);                 /* raya que cruza la pista */
      if(z%3===0)for(let q=-1;q<=1;q++)arrow(A,q*CW*1.7,-z,.017,.85,.19,w.d,ar);
    }
  }
  addProps(AT);
  for(let k=0;k<NC;k++){
    const m=meshOf(acc[k],true);
    m.frustumCulled=false;                    /* la visibilidad la manda chunkVis */
    chunks[k]=m;trackG.add(m);
  }
  /* franja del arco de control y de la meta (sin niebla: se ven venir de lejos) */
  const cb=A0(),cbOn=A0();
  const wAll=CW*LANES;
  plate(cb,0,-CPZ,wAll,.55,.02,C(PAL.cp));
  plate(cbOn,0,-CPZ,wAll,.55,.022,C(PAL.cpOn));
  for(let k=0;k<10;k++){                       /* cuadros de la meta */
    plate(cb,-wAll/2+wAll*(k+.5)/10,-LEN,wAll/10,.7,.02,k&1?C('#ffffff'):C('#12222c'));
    plate(cbOn,-wAll/2+wAll*(k+.5)/10,-LEN,wAll/10,.702,.02,k&1?C('#ffffff'):C('#12222c'));
  }
  cpBand=meshOf(cb,false);trackG.add(cpBand);
  cpBandOn=meshOf(cbOn,false);cpBandOn.visible=false;trackG.add(cpBandOn);
}
/* COLUMNAS DEL VACÍO: paralaje y sensación de velocidad. Van en el mismo trozo que
   la pista que tienen al lado, así se cullean con ella. Arrancan a 4,5 del borde
   (a 2,2 parecían edificios encima de la pista y le robaban el ojo al camino) y
   una de cada tres lleva una TIRA DE NEÓN vertical: es lo que convierte el vacío
   negro en una ciudad de neón por 2 triángulos. */
function addProps(AT){
  const cp=C(PAL.prop),ct=C(PAL.propTop),ne=C(mixc(PAL.rail,PAL.fog,.45));
  const R=rng(9001+lvl*31);
  const step=Math.max(5,Math.round(10/Math.max(.3,decoK)));
  for(let z=-6;z<LEN+20;z+=step){
    for(const s of [-1,1]){
      if(R()<.3)continue;
      const x=s*(HALF+4.5+R()*14);
      const h=2+R()*15,w=1+R()*2.4,y=-1.6-R()*5;
      const zz=-z-R()*3;
      const A=AT(Math.max(0,z));
      bq(A,x,y,zz,w,h,w*(.7+R()*.8),ct,cp);
      /* tira de neón en la CARA INTERNA (la que mira a la pista). El orden de los
         vértices decide la cara que se ve: con FrontSide y la tira al revés no se
         dibujaba nada (probado con el producto vectorial, ver meshOf). */
      if(R()<.34&&h>5){
        const xf=x-s*(w/2+.03),y0=y+h*.16,y1=y+h*.86,zA=zz-.18,zB=zz+.18;
        if(s>0)Q(A,[xf,y0,zA],[xf,y0,zB],[xf,y1,zB],[xf,y1,zA],ne);
        else   Q(A,[xf,y0,zB],[xf,y0,zA],[xf,y1,zA],[xf,y1,zB],ne);
      }
    }
  }
}
/* ARCO DE NEÓN (control y meta) en UNA malla fusionada: dos pilonas con tira de
   luz, dintel de tres barras y una placa de luz al medio. Reemplaza al GLB
   simplificado, que en pantalla era un montón de esquirlas negras. */
function archMesh(fin){
  const W=CW*LANES+.9;
  const A=A0();
  const cc=C(fin?PAL.rail:PAL.cp),dk=C(PAL.fin),wt=C(mixc(fin?PAL.rail:PAL.cp,'#ffffff',.5));
  for(const s of [-1,1]){
    const x=s*(W/2-.2);
    bq(A,x,0,0,.44,2.6,.44,cc,dk);                 /* pilona */
    bq(A,x-s*.24,.25,0,.06,2.1,.5,wt,wt);          /* tira de luz de la cara interna */
    bq(A,x,2.6,0,.6,.18,.6,wt,cc);                 /* capitel */
  }
  bq(A,0,2.78,0,W,.34,.44,cc,dk);                  /* dintel */
  bq(A,0,2.62,0,W-.3,.1,.52,wt,wt);                /* barra de luz de abajo */
  bq(A,0,3.12,0,W*.34,.16,.3,wt,cc);              /* cartel del medio */
  const m=meshOf(A,false);                         /* sin niebla: se ve a 150 m */
  m.frustumCulled=false;
  return m;
}
function buildArches(){
  cpArch=archMesh(false);cpArch.position.z=-CPZ;trackG.add(cpArch);
  finArch=archMesh(true);finArch.position.z=-LEN;trackG.add(finArch);
}
/* visibilidad de los trozos: sólo lo que está entre −14 m y +118 m de la pelota */
function chunkVis(){
  let n=0;
  for(let k=0;k<chunks.length;k++){
    const z0=k*CH,z1=z0+CH;
    const v=(z0<=bz+VISZ)&&(z1>=bz-BEHZ);
    chunks[k].visible=v;if(v)n++;
  }
  chVis=n;
}
/* ------------------------------------------------------------------- física */
function cellAt(x,z){
  const zi=Math.round(z);
  if(zi<0||zi>=cells.length)return 0;
  const i=Math.round(x/CW+(LANES-1)/2);
  if(i<0||i>=LANES)return 0;
  return cells[zi][i];
}
function sawX(o,t){return o.amp?o.x+Math.sin(t*o.sp+o.ph)*o.amp:o.x;}
/* altura de la compuerta en el instante t: 1 = cerrada, 0 = abierta. Con D=.42 y
   la transición de 0,09 la compuerta MATA el 43% del ciclo y deja pasar el 57%:
   con medio y medio (D=.5) el hueco quedaba más corto que el peligro y se sentía
   una moneda al aire. La ventana abierta a 11,3 m/s son 1,0 s de paso. */
function pulsH(o,t){
  const p=((t+o.ph)%o.per)/o.per,e=.09,D=.42;
  if(p<D-e)return 1;
  if(p<D+e)return (D+e-p)/(2*e);
  if(p<1-e)return 0;
  return (p-(1-e))/e;
}
function die(kind){
  if(dead||won)return;
  dead=1;dieK=kind;fallV=0;
  lastDie=kind+'@'+bz.toFixed(1)+' x='+bx.toFixed(2);

  ARC.sfx(kind==='fall'?'lose':(kind==='gate'?'gate':'boom'));
  ARC.shake(kind==='fall'?7:13);
  ARC.fx.burst(ARC.W/2,ARC.H*.62,{n:22,color:PAL.danger,speed:260,size:5,life:.6});
  if(kind!=='fall')ARC.vib(70);
  setTimeout(()=>{
    if(!dead||DEMO)return;
    if(cpOn&&!cpUsed){
      cpUsed=1;bz=CPZ;bx=tx=lx(pathL[CPZ]);dead=0;warm=0;fallV=0;boostT=0;
      ball.position.set(bx,BR,-bz);
      ARC.toast(T('cpBack'));ARC.sfx('power');
      return;
    }
    finishLose(kind);
  },700);
}

/* ------------------------------------------------------------------ entrada */
const laneOf=x=>clamp(Math.round(x/CW+(LANES-1)/2),0,LANES-1);
function nudge(d){botOn=0;tx=clamp(lx(clamp(laneOf(tx)+d,0,LANES-1)),-HALF,HALF);}
G.down=function(p){drag={x:p.x,tx};botOn=0;};
G.move=function(p){
  if(!drag)return;

  tx=clamp(drag.tx+(p.x-drag.x)*(HALF*2/(ARC.W*.5)),-HALF,HALF);

G.key=function(c,d){
