<style>
/* ================= ARCADE SHELL — CSS común de los 5 juegos =================
   REGLA DE ORO DEL CELULAR VERTICAL: el juego SIEMPRE se ve apaisado. Si el
   teléfono está vertical, #stage se rota 90° y se le fijan ancho/alto EN PX
   (los del viewport cruzados). Todo lo que mida la UI tiene que medirse en el
   espacio del #stage (clientWidth/clientHeight, offsetTop), NUNCA contra
   window.innerWidth/innerHeight ni con getBoundingClientRect: con el stage
   rotado esas dos cosas viven en ejes distintos. El puntero se convierte a mano
   (ver ARC.pt) porque la rotación cruza los ejes del compositor.            */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef2f6}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#0d1014;
  transform-origin:0 0;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
/* dos lienzos: #gl es la escena 3D (WebGL) y #cv la capa 2D de efectos y texto
   flotante que va ENCIMA. Así los juegos 3D siguen usando ARC.fx sin shaders. */
#gl{z-index:0}
#cv{z-index:1;pointer-events:auto;background:transparent}
/* ---- capas ---- */
.lay{position:absolute;inset:0;pointer-events:none}
/* z-index 5: MEDIDO CON TOQUES REALES — sin él, el canvas (#cv, z-index 1) queda
   por encima de estas pantallas y se come el toque: document.elementFromPoint en
   el centro de REINTENTAR devolvía "cv", así que reiniciar/seguir/menú/niveles/
   ajustes NO funcionaban en ningún juego. Las sondas no lo veían porque disparaban
   el evento directo al botón en vez de tocar la pantalla. */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:auto;background:rgba(6,9,13,.62);z-index:5;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scr.on{display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#menu{background:#0d1014 center/cover no-repeat;backdrop-filter:none;-webkit-backdrop-filter:none}
/* el arte del menú ya trae el título: el degradado va de ABAJO para que los
   botones se lean sin tapar la ilustración, y el título de DOM sólo aparece si
   la imagen no llegó (#menu sin .hasart). */
#menu:before{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(5,7,10,.94) 0%,rgba(5,7,10,.55) 30%,rgba(5,7,10,.05) 62%)}
#menu.hasart .ttl{display:none}
/* ---- tipografía ---- */
.h1{font-size:clamp(22px,5.2vmin,44px);font-weight:900;letter-spacing:.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.75)}
.h2{font-size:clamp(14px,3vmin,22px);font-weight:800;opacity:.95}
.sm{font-size:clamp(10px,2.1vmin,15px);font-weight:600;opacity:.72;line-height:1.35}
/* ---- botones ---- */
.btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:.5em;
  padding:.62em 1.25em;border-radius:14px;font-weight:900;font-size:clamp(12px,2.6vmin,19px);
  background:linear-gradient(180deg,var(--acc) 0%,var(--acc2) 100%);color:#10141a;
  border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gh{background:rgba(255,255,255,.09);color:#eef2f6;border-color:rgba(255,255,255,.22);
  box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.sq{padding:0;width:clamp(34px,7.4vmin,52px);height:clamp(34px,7.4vmin,52px);border-radius:13px;
  font-size:clamp(15px,3.4vmin,23px)}
.row{display:flex;gap:clamp(6px,1.6vmin,14px);align-items:center}
.col{display:flex;flex-direction:column;gap:clamp(6px,1.6vmin,14px)}
/* ---- menú ---- */
#menu .wrap{position:relative;z-index:1;width:100%;height:100%;display:flex;
  flex-direction:column;justify-content:flex-end;padding:0 5.5vmin 4.5vmin;gap:1.8vmin}
#menu .ttl{font-size:clamp(26px,8.4vmin,68px);font-weight:900;line-height:.94;
  letter-spacing:-.5px;text-shadow:0 3px 0 rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.6)}
#menu .ttl em{font-style:normal;color:var(--acc)}
#menu .sub{max-width:52vmin}
#menu .mrow{margin-top:1.2vmin}
#best{position:absolute;right:3.4vmin;bottom:4.5vmin;text-align:right;z-index:1;line-height:1.5}
/* ---- HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.pill{position:absolute;display:flex;align-items:center;gap:.45em;padding:.42em .8em;
  border-radius:999px;background:rgba(10,14,19,.66);border:1px solid rgba(255,255,255,.14);
  font-weight:900;font-size:clamp(11px,2.4vmin,17px);backdrop-filter:blur(4px)}
#pScore{left:3vmin;top:2.4vmin}
#pInfo{left:50%;top:2.4vmin;transform:translateX(-50%)}
#pPause{right:3vmin;top:2.4vmin;pointer-events:auto;padding:0;
  width:clamp(30px,6.6vmin,46px);height:clamp(30px,6.6vmin,46px);justify-content:center}
#tray{position:absolute;left:0;right:0;bottom:2.2vmin;display:flex;justify-content:center;
  gap:1.4vmin;pointer-events:auto;flex-wrap:wrap;padding:0 2vmin}
/* ---- juegos VERTICALES (body.vert): los controles van grandes y bien abajo,
   porque en vertical el pulgar llega a la franja de abajo y no a los costados ---- */
body.vert #tray{bottom:3.5%;gap:2.5vw}
body.vert #tray .btn{min-width:16vw;padding:.85em 1.1em;font-size:clamp(15px,4.4vw,26px)}
body.vert #tray .btn.sq{width:16vw;height:16vw}
body.vert .pill{font-size:clamp(12px,3.4vw,20px);padding:.5em .9em}
body.vert #pScore{left:4vw;top:2vh}
body.vert #pInfo{top:2vh}
body.vert #pPause{right:4vw;top:2vh;width:11vw;height:11vw}
body.vert #menu .wrap{padding:0 7vw 7vh;gap:2.4vh}
/* en vertical el arte 16:9 se recortaba tanto que el título quedaba cortado
   ("ZA CA" en la captura V3): se ajusta por ANCHO y se pega arriba, y el resto de
   la columna lo llena el color del juego. */
body.vert #menu{background-size:100% auto;background-position:center 16%}
body.vert #menu:before{background:linear-gradient(0deg,rgba(5,7,10,.97) 0%,rgba(5,7,10,.82) 34%,rgba(5,7,10,.12) 62%,rgba(5,7,10,.35) 100%)}
body.vert #menu .sub{max-width:100%}
body.vert #best{right:5vw;bottom:7vh}
body.vert .card{max-width:88vw}
body.vert .h1{font-size:clamp(22px,7vw,44px)}
body.vert .h2{font-size:clamp(14px,4.4vw,24px)}
body.vert .sm{font-size:clamp(11px,3.2vw,16px)}
body.vert .btn{font-size:clamp(13px,3.8vw,20px)}
/* ---- tarjetas / paneles ---- */
.card{background:rgba(14,18,24,.92);border:1px solid rgba(255,255,255,.14);border-radius:18px;
  padding:clamp(12px,3vmin,26px);box-shadow:0 18px 50px rgba(0,0,0,.6);max-width:86vmin;
  display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.stars{display:flex;gap:.35em;font-size:clamp(20px,5.6vmin,42px);line-height:1}
.stars i{font-style:normal;opacity:.22}
.stars i.on{opacity:1;filter:drop-shadow(0 0 8px rgba(255,196,60,.7))}
.grid{display:grid;gap:1.2vmin}
.lvl{width:clamp(38px,8.4vmin,60px);height:clamp(38px,8.4vmin,60px);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:900;
  font-size:clamp(12px,2.7vmin,18px);pointer-events:auto}
.lvl.done{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#10141a}
.lvl.lock{opacity:.35}
.lvl b{font-size:.52em;letter-spacing:1px;opacity:.9}
/* ---- ajustes ---- */
.sw{width:clamp(42px,9vmin,62px);height:clamp(24px,5vmin,34px);border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);position:relative;
  pointer-events:auto;transition:background .15s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:calc(100% - 4px);height:calc(100% - 4px);
  aspect-ratio:1;border-radius:999px;background:#eef2f6;transition:transform .15s}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(calc(100% + 2px))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:2vmin;width:min(70vmin,100%)}
/* ---- avisos ---- */
#toast{position:absolute;left:50%;top:16%;z-index:8;transform:translateX(-50%) scale(.9);opacity:0;
  padding:.5em 1.1em;border-radius:12px;background:rgba(10,14,19,.9);font-weight:900;
  font-size:clamp(12px,2.8vmin,20px);transition:opacity .18s,transform .18s;z-index:5}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
#fps{position:absolute;left:50%;bottom:.6vmin;transform:translateX(-50%);font-size:10px;
  opacity:.35;z-index:5}
/* ---- pantalla de CARGA: fondo del propio juego, barra real y elección de idioma ---- */
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:2.2vmin;background:#05070a center/cover no-repeat;z-index:9;
  text-align:center;padding:4vmin}
#load:before{content:"";position:absolute;inset:0;backdrop-filter:blur(3px);
  background:linear-gradient(0deg,rgba(4,6,9,.95),rgba(4,6,9,.62))}
#load>*{position:relative;z-index:1}
#ldName{font-size:clamp(20px,6vmin,46px);font-weight:900;letter-spacing:.5px;
  text-shadow:0 3px 14px rgba(0,0,0,.8)}
#ldPct{font-weight:900;font-size:clamp(12px,2.6vmin,18px);opacity:.9}
#langs{display:flex;gap:1.4vmin;flex-wrap:wrap;justify-content:center;margin-top:1vmin}
#ldGo{display:none}
#ldGo.on{display:flex;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#load .bar{width:min(52vmin,340px);height:8px;border-radius:999px;background:rgba(255,255,255,.14);
  overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .25s}
.seg{display:flex;gap:.4vmin;background:rgba(255,255,255,.08);padding:.35em;border-radius:12px}
.seg b{font-weight:900;font-size:clamp(10px,2.2vmin,15px);padding:.45em .8em;border-radius:9px;
  opacity:.6;pointer-events:auto;white-space:nowrap}
.seg b.on{background:var(--acc);color:#10141a;opacity:1}
</style></head><body>

<script>
(function(){var Q=new URLSearchParams(location.search);var TV="0.170.0";
var t=Q.has("local")?"/_vthree/build/three.module.js":"https://cdn.jsdelivr.net/npm/three@"+TV+"/build/three.module.js";
var a=Q.has("local")?"/_vthree/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@"+TV+"/examples/jsm/";

<script type="module">
/* ---- assets ---- */
const BASE=(new URLSearchParams(location.search).has('local')?'/assets/arcade/':'https://cdn.jsdelivr.net/gh/Juniorspro/General-Assets-Games@3dff280/assets/arcade/');
const A=f=>BASE+f;
/* ============================================================================
   ARCADE SHELL — el motor común de los 5 juegos
   ----------------------------------------------------------------------------
   Un solo archivo, cero dependencias, canvas 2D + overlays de DOM para los
   menús (el texto queda nítido y se estila con CSS en vez de dibujarse).
   Lo que resuelve por todos:
     · APAISADO SIEMPRE (rota #stage 90° si el teléfono está vertical) y puntero
       convertido a mano, porque la rotación del compositor cruza los ejes.
     · Bucle de paso FIJO a 60 Hz con interpolación al dibujar: la simulación no
       cambia con los FPS del celular y el movimiento no tiembla a 120 Hz.
     · Audio (WebAudio con limitador + música por <audio>), con SÍNTESIS de
       respaldo: si un mp3 no está o el navegador no lo decodifica, suena un
       blip generado y el juego no se queda muerto de sonido.
     · Guardado en localStorage, pantallas (menú/pausa/fin/niveles/ajustes),
       partículas, texto flotante, sacudida de cámara, toast, FPS y calidad
       adaptativa (si baja de 45 fps se recortan las partículas).
   Contrato del juego (window.GAME): ver el final del archivo.
   ========================================================================== */
'use strict';
const ARC={W:0,H:0,dpr:1,q:1,t:0,dt:1/60,frame:0,fps:60,paused:false,scr:'load',lvl:1,alive:false};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

/* ---------------------------------------------------------------- 1. ESCENARIO
   Si el viewport está vertical se rota el escenario 90° y se le fijan ancho y
   alto EN PX (cruzados). Todo lo demás vive en ese espacio: ARC.W/ARC.H son las
   medidas del juego, siempre apaisadas. */
let ROT=false,OFFX=0;
function fit(){
  const vw=Math.round(window.innerWidth),vh=Math.round(window.innerHeight);
  const st=$('stage');
  /* GAME.portrait = el juego se juega VERTICAL de verdad (tipo Crossy Road): no se
     rota nada. En una ventana apaisada (escritorio) se centra una columna 9:16 y
     el resto queda negro, para que el encuadre sea el mismo que en el teléfono. */
  if(GAME.portrait){
    ROT=false;
    const w=Math.min(vw,Math.round(vh*.58));
    OFFX=Math.round((vw-w)/2);
    st.style.width=w+'px';st.style.height=vh+'px';
    st.style.transform=OFFX?('translateX('+OFFX+'px)'):'none';
  }else{
    OFFX=0;
    ROT=vh>vw;
    if(ROT){
      st.style.width=vh+'px';st.style.height=vw+'px';
      st.style.transform='translateX('+vw+'px) rotate(90deg)';
    }else{
      st.style.width=vw+'px';st.style.height=vh+'px';st.style.transform='none';
    }
  }
  ARC.W=st.clientWidth;ARC.H=st.clientHeight;
  const cv=$('cv');
  ARC.dpr=clamp(window.devicePixelRatio||1,1,2.5);
  cv.style.width=ARC.W+'px';cv.style.height=ARC.H+'px';
  cv.width=Math.round(ARC.W*ARC.dpr);cv.height=Math.round(ARC.H*ARC.dpr);
  ARC.g=cv.getContext('2d');
  ARC.g.setTransform(ARC.dpr,0,0,ARC.dpr,0,0);
  /* la escena 3D usa su propio lienzo y su propio DPR (más barato en el celular:
     el 3D a 1.5x se ve igual y cuesta la mitad que a 3x) */
  const gl=$('gl');
  gl.style.width=ARC.W+'px';gl.style.height=ARC.H+'px';
  if(ARC.rnd){
    ARC.rnd.setPixelRatio(Math.min(ARC.dpr,1.75));
    ARC.rnd.setSize(ARC.W,ARC.H,false);
  }
  if(GAME.resize)GAME.resize();
}
window.addEventListener('resize',()=>{fit();},{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(fit,120),{passive:true});

/* ---- puntero: del evento del navegador al espacio del escenario ----
   Con el escenario rotado 90° y corrido vw en X, un punto (sx,sy) del escenario
   cae en pantalla en (vw−sy, sx). La inversa es la que hace falta acá. NO se usa
   getBoundingClientRect: devuelve la caja YA rotada y mezcla los ejes. */
ARC.pt=function(e){
  const x=e.clientX,y=e.clientY;
  if(ROT)return{x:y,y:Math.round(window.innerWidth)-x};
  return{x:x-OFFX,y:y};      /* OFFX = columna centrada de los juegos verticales */
};

/* ------------------------------------------------------------------ 2. GUARDADO */
const SAVE={};
function saveKey(){return 'arc.'+GAME.slug;}
function saveLoad(){
  try{Object.assign(SAVE,JSON.parse(localStorage.getItem(saveKey())||'{}'));}catch(e){}
  if(SAVE.mus===undefined)SAVE.mus=1;
  if(SAVE.sfx===undefined)SAVE.sfx=1;
  if(SAVE.vib===undefined)SAVE.vib=1;
  if(SAVE.fx===undefined)SAVE.fx=1;
  if(SAVE.fps===undefined)SAVE.fps=0;
  if(!SAVE.stars)SAVE.stars={};
  if(!SAVE.best)SAVE.best=0;
  if(!SAVE.coins)SAVE.coins=0;
  if(!SAVE.done)SAVE.done=0;      /* nivel más alto superado */
  if(!SAVE.lang)SAVE.lang=(navigator.language||'es').slice(0,2).toLowerCase();
  if(!STR[SAVE.lang])SAVE.lang='es';
  if(SAVE.gfx==null)SAVE.gfx=2;
}
function saveNow(){try{localStorage.setItem(saveKey(),JSON.stringify(SAVE));}catch(e){}}
ARC.save=saveNow;ARC.S=SAVE;


/* ------------------------------------------------------------------ 2b. IDIOMAS

/* --------------------------------------------------------------- 2c. GRÁFICOS
   Un solo número (0-3) que decide DPR, sombras, partículas y niebla. Se aplica en
   caliente: no hace falta reiniciar el juego. */
const GFXP=[{dpr:1,part:.45,sh:0,fog:.7},{dpr:1.25,part:.75,sh:0,fog:.85},
            {dpr:1.75,part:1,sh:1,fog:1},{dpr:2.5,part:1.35,sh:1,fog:1.15}];
ARC.gfx=function(v){
  if(v!==undefined){SAVE.gfx=clamp(v|0,0,3);saveNow();applyGfx();paintSegs();}
  return SAVE.gfx==null?2:SAVE.gfx;
};
function applyGfx(){
  const p=GFXP[ARC.gfx()];
  ARC.q=p.part;
  if(ARC.rnd){
    ARC.rnd.setPixelRatio(Math.min(window.devicePixelRatio||1,p.dpr));
    ARC.rnd.shadowMap.enabled=!!(GAME.shadows&&p.sh);
    ARC.rnd.setSize(ARC.W,ARC.H,false);
  }
  if(GAME.gfxApply)nsafe2(()=>GAME.gfxApply(p));
}
ARC.gfxP=()=>GFXP[ARC.gfx()];
function paintSegs(){
  const mk=(host,items,cur,fn)=>{
    const el=$(host);if(!el)return;
    el.innerHTML='';
    items.forEach(it=>{
      const b=document.createElement('b');
      b.textContent=it[1];b.className=(it[0]===cur?'on':'');
      b.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sfx('tap');ARC.vib(8);fn(it[0]);});
      el.appendChild(b);
    });
  };
  mk('langs',LANGS,lang(),l=>ARC.lang(l));
  mk('segLang',LANGS,lang(),l=>ARC.lang(l));
  mk('segGfx',[[0,T('gfx0')],[1,T('gfx1')],[2,T('gfx2')],[3,T('gfx3')]],ARC.gfx(),v=>ARC.gfx(v));
}
ARC.paintSegs=paintSegs;

/* -------------------------------------------------------------------- 3. AUDIO */
const SND={ctx:null,buf:{},gain:null,mus:null,ready:false};
function actx(){
  if(SND.ctx)return SND.ctx;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  SND.ctx=new C();
  const lim=SND.ctx.createDynamicsCompressor();
  lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.15;
  SND.gain=SND.ctx.createGain();SND.gain.gain.value=.85;
  SND.gain.connect(lim);lim.connect(SND.ctx.destination);
  return SND.ctx;
}
ARC.sndResume=function(){const c=actx();if(c&&c.state==='suspended')c.resume();};
/* carga de efectos: si algo no llega o no se puede decodificar, se deja sin
   buffer y sonará el blip sintetizado (nunca silencio total ni excepción) */
ARC.sndLoad=function(map,done){
  const ks=Object.keys(map);let n=0;
  if(!ks.length){done&&done();return;}
  ks.forEach(k=>{
    fetch(map[k]).then(r=>r.arrayBuffer()).then(b=>{
      const c=actx();if(!c)throw 0;
      return new Promise((res,rej)=>c.decodeAudioData(b,res,rej));
    }).then(buf=>{SND.buf[k]=buf;}).catch(()=>{}).then(()=>{
      if(++n===ks.length){SND.ready=true;done&&done();}
    });
  });
};
/* blips de respaldo por nombre: no pretenden imitar el mp3, pero dan feedback */
const BEEP={tap:[520,.05,'square',.25],pop:[720,.08,'sine',.3],chime:[1040,.16,'triangle',.28],
  coin:[1180,.1,'square',.25],win:[880,.4,'triangle',.3],lose:[180,.4,'sawtooth',.25],
  click:[1400,.04,'square',.22],wood:[240,.12,'sawtooth',.3],glass:[2200,.1,'triangle',.22],
  splat:[300,.14,'sine',.3],groan:[120,.35,'sawtooth',.22],launch:[420,.14,'sawtooth',.28],
  boom:[90,.35,'sawtooth',.35],power:[1320,.22,'triangle',.28],shoot:[640,.07,'square',.22]};
ARC.sfx=function(name,o){
  if(!SAVE.sfx)return;
  const c=actx();if(!c)return;
  o=o||{};
  const b=SND.buf[name];
  if(b){
    const s=c.createBufferSource();s.buffer=b;
    s.playbackRate.value=o.rate||1;
    const g=c.createGain();g.gain.value=(o.vol==null?1:o.vol);
    s.connect(g);g.connect(SND.gain);s.start(0);return;
  }
  const d=BEEP[name]||BEEP.tap;
  const os=c.createOscillator(),g=c.createGain();
  os.type=d[2];os.frequency.value=d[0]*(o.rate||1);
  const v=d[3]*(o.vol==null?1:o.vol);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(v,c.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d[1]);
  os.connect(g);g.connect(SND.gain);os.start();os.stop(c.currentTime+d[1]+.02);
};
ARC.music=function(url){
  if(!url)return;
  if(!SND.mus){
    SND.mus=new Audio();SND.mus.loop=true;SND.mus.volume=.42;
    SND.mus.addEventListener('error',()=>{},{passive:true});
  }
  if(SND.mus.src!==url){SND.mus.src=url;}
  if(SAVE.mus){const p=SND.mus.play();if(p&&p.catch)p.catch(()=>{});}
};
ARC.musicStop=function(){if(SND.mus)SND.mus.pause();};
ARC.vib=function(ms){if(SAVE.vib&&navigator.vibrate)try{navigator.vibrate(ms||12);}catch(e){}};

/* ---------------------------------------------------------------- 4. EFECTOS */
const PT=[],TX=[];
let shake=0,shakeT=0;
ARC.fx={
  burst(x,y,o){
    o=o||{};
    let n=Math.round((o.n||14)*ARC.q*(SAVE.fx?1:.45));
    const sp=o.speed||220,life=o.life||.55,g=o.g==null?900:o.g;
    for(let i=0;i<n;i++){
      const a=o.a==null?rnd(0,TAU):o.a+rnd(-.6,.6);
      const v=sp*rnd(.35,1);
      PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*rnd(.6,1.2),L:life,
        s:(o.size||5)*rnd(.6,1.4),c:o.color||'#ffd166',g,sq:!!o.sq,
        rot:rnd(0,TAU),spin:rnd(-8,8),fade:o.fade!==false});
    }
  },
  ring(x,y,o){o=o||{};PT.push({ring:1,x,y,r:o.r0||6,R:o.r||90,l:o.life||.35,L:o.life||.35,
    c:o.color||'#fff',w:o.w||4});},
  text(x,y,txt,o){o=o||{};TX.push({x,y,t:txt,l:o.life||.8,L:o.life||.8,c:o.color||'#fff',
    s:o.size||22,vy:o.vy==null?-46:o.vy});}
};
ARC.shake=function(m){shake=Math.max(shake,m||6);};
function fxStep(dt){
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];
    p.l-=dt;if(p.l<=0){PT.splice(i,1);continue;}
    if(p.ring){p.r=lerp(p.r,p.R,1-Math.pow(.001,dt));continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;
    if(p.bounce&&p.y>p.bounce){p.y=p.bounce;p.vy*=-.42;p.vx*=.7;}
  }
  for(let i=TX.length-1;i>=0;i--){const t=TX[i];t.l-=dt;if(t.l<=0){TX.splice(i,1);continue;}
    t.y+=t.vy*dt;}
  if(shake>0){shakeT+=dt*46;shake=Math.max(0,shake-dt*shake*7-dt*3);}
}
function fxDraw(g){
  for(const p of PT){
    const k=p.l/p.L;
    g.globalAlpha=p.fade===false?1:clamp(k*1.4,0,1);
    if(p.ring){g.strokeStyle=p.c;g.lineWidth=p.w*k;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();continue;}
    g.fillStyle=p.c;
    if(p.sq){g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      g.fillRect(-p.s/2,-p.s/2,p.s,p.s);g.restore();}
    else{g.beginPath();g.arc(p.x,p.y,p.s*(.4+.6*k),0,TAU);g.fill();}
  }
  g.globalAlpha=1;
  for(const t of TX){
    const k=t.l/t.L;
    g.globalAlpha=clamp(k*1.6,0,1);
    g.font='900 '+t.s+'px system-ui,sans-serif';g.textAlign='center';
    g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(t.t,t.x,t.y);
    g.fillStyle=t.c;g.fillText(t.t,t.x,t.y);
  }
  g.globalAlpha=1;g.textAlign='left';
}

/* foto de la escena 3D para las sondas: se lee el framebuffer DENTRO de un
   requestAnimationFrame, que corre después del render del bucle en el MISMO
   frame — ahí el buffer todavía está intacto (después del compositado ya no). */
ARC.snapGL=function(){
  return new Promise(res=>{
    requestAnimationFrame(()=>{
      const r=ARC.rnd;if(!r){res(null);return;}
      const gl=r.getContext();
      const W=gl.drawingBufferWidth,H=gl.drawingBufferHeight;
      const px=new Uint8Array(W*H*4);
      gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
      let sum=0,n=0;const uniq={};
      for(let i=0;i<px.length;i+=4*37){n++;
        sum+=px[i]*.3+px[i+1]*.6+px[i+2]*.1;
        uniq[(px[i]>>5)+','+(px[i+1]>>5)+','+(px[i+2]>>5)]=1;}
      res({luz:+(sum/Math.max(1,n)).toFixed(1),colores:Object.keys(uniq).length});
    });
  });
};

/* --------------------------------------------------------------- 6. PARTIDA */
ARC.play=function(lvl){
  ARC.lvl=lvl||1;
  ARC.alive=true;ARC.paused=false;
  PT.length=0;TX.length=0;shake=0;
  ARC.show('game');
  GAME.start(ARC.lvl);
  ARC.music(GAME.music);
};
ARC.over=function(o){
  o=o||{};ARC.alive=false;
  const st=Math.max(0,Math.min(3,o.stars==null?(o.win?3:0):o.stars));
  if(o.win){
    const key=String(ARC.lvl);
    if((SAVE.stars[key]||0)<st){SAVE.stars[key]=st;}
    if(ARC.lvl>SAVE.done)SAVE.done=ARC.lvl;
  }
  if(o.score!=null&&o.score>SAVE.best)SAVE.best=o.score;
  if(o.coins)SAVE.coins+=o.coins;
  saveNow();
  $('oTtl').textContent=o.title||(o.win?T('win'):T('lost'));
  $('oScore').textContent=o.score!=null?(T('points')+' '+o.score):'';
  $('oSub').innerHTML=o.sub||'';
  const S=$('oStars').children;
  $('oStars').style.display=o.noStars?'none':'flex';
  for(let i=0;i<3;i++)S[i].classList.toggle('on',i<st);
  $('bNext').style.display=(o.win&&GAME.levels&&ARC.lvl<GAME.levels)?'flex':'none';
  ARC.sfx(o.win?'win':'lose');
  ARC.vib(o.win?[10,40,10]:60);
  ARC.show('over');
};
ARC.pause=function(){
  if(!ARC.alive||ARC.paused)return;
  ARC.paused=true;ARC.show('pause');GAME.pause&&GAME.pause();
};
ARC.resume=function(){
  if(!ARC.alive)return;
  ARC.paused=false;ARC.show('game');GAME.resume&&GAME.resume();
};
ARC.menu=function(){
  ARC.alive=false;ARC.paused=false;ARC.show('menu');refreshMenu();
};

/* --------------------------------------------------------------- 7. EL BUCLE
   Paso FIJO de 1/60 con acumulador y alpha de interpolación al dibujar: la
   física no depende de los FPS (un celular a 30 y otro a 120 simulan igual) y
   el dibujo no tiembla. Se cortan los saltos grandes (pestaña en segundo plano)
   a 5 pasos por frame para no colgar el hilo. */
const STEP=1/60;
let acc=0,last=0,fpsA=60,slowT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  let d=(ts-last)/1000;last=ts;
  if(d>.25)d=.25;
  ARC.fps=fpsA=lerp(fpsA,1/Math.max(.001,d),.06);
  if(SAVE.fps)$('fps').textContent=Math.round(fpsA)+' fps';
  /* calidad adaptativa: dos segundos por debajo de 45 fps y se recortan
     partículas (ARC.q lo leen los juegos y ARC.fx.burst) */
  if(fpsA<45){slowT+=d;if(slowT>2&&ARC.q>.5){ARC.q=.5;slowT=0;}}
  else{slowT=Math.max(0,slowT-d);if(fpsA>56&&ARC.q<1)ARC.q=Math.min(1,ARC.q+d*.2);}
  const run=ARC.alive&&!ARC.paused;
  acc+=d;
  let n=0;
  while(acc>=STEP&&n<5){
    acc-=STEP;n++;ARC.t+=STEP;ARC.frame++;
    if(run)GAME.step(STEP);
    fxStep(STEP);
  }
  if(acc>STEP*5)acc=0;
  const g=ARC.g;if(!g)return;
  g.setTransform(ARC.dpr,0,0,ARC.dpr,0,0);
  g.clearRect(0,0,ARC.W,ARC.H);
  if(shake>.05){
    g.translate(Math.sin(shakeT*1.7)*shake,Math.cos(shakeT*2.3)*shake*.8);
  }
  /* en el menú no se dibuja el juego: el canvas queda limpio (el arte del menú es
     DOM) y el celular no gasta batería dibujando un tablero que nadie ve */
  if(ARC.scr==='game'||ARC.scr==='pause'||ARC.scr==='over'){
    GAME.draw(g,acc/STEP);
    fxDraw(g);
  }else if(ARC.rnd&&ARC.clearGL){ARC.rnd.clear();}
}

/* ------------------------------------------------------------- 8. ENTRADA */
function bindInput(){
  const cv=$('cv');
  const down=e=>{
    e.preventDefault();ARC.sndResume();
    if(ARC.alive&&!ARC.paused&&GAME.down)GAME.down(ARC.pt(e),e);
  };
  const move=e=>{
    e.preventDefault();
    if(ARC.alive&&!ARC.paused&&GAME.move)GAME.move(ARC.pt(e),e);
  };
  const up=e=>{
    e.preventDefault();
    if(ARC.alive&&!ARC.paused&&GAME.up)GAME.up(ARC.pt(e),e);
  };
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  const B=(id,fn)=>{const el=$(id);if(!el)return;
    el.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sndResume();ARC.sfx('tap');ARC.vib(10);fn(el);});};
  B('bPlay',()=>ARC.play(GAME.levels?Math.min(GAME.levels,(SAVE.done||0)+1):1));
  B('bLevels',()=>{buildLevels();ARC.show('levels');});
  B('bLvBack',()=>ARC.menu());
  /* AJUSTES se puede abrir desde el MENÚ y desde la PAUSA, y LISTO vuelve a donde
     se abrió. Lo pidieron los tres verificadores: antes, cambiar idioma o gráficos
     obligaba a abandonar la partida (bOptBack llamaba siempre a ARC.menu()). */
  B('bOpts',()=>{optFrom='menu';ARC.show('opts');});
  B('bOpts2',()=>{optFrom='pause';ARC.show('opts');});
  B('bOptBack',()=>{if(optFrom==='pause'&&ARC.alive){ARC.show('pause');}else ARC.menu();});
  B('pPause',()=>ARC.pause());
  B('bRes',()=>ARC.resume());
  B('bRetry',()=>ARC.play(ARC.lvl));
  B('bQuit',()=>ARC.menu());
  B('bAgain',()=>ARC.play(ARC.lvl));
  B('bMenu',()=>ARC.menu());
  B('bNext',()=>ARC.play(Math.min(GAME.levels||1,ARC.lvl+1)));
  B('bWipe',()=>{const m=SAVE.mus,s=SAVE.sfx,v=SAVE.vib,f=SAVE.fx;
    for(const k in SAVE)delete SAVE[k];
    SAVE.mus=m;SAVE.sfx=s;SAVE.vib=v;SAVE.fx=f;SAVE.stars={};SAVE.best=0;SAVE.done=0;SAVE.coins=0;
    saveNow();ARC.toast(T('wiped'));refreshMenu();});
  const SW=(id,key,fn)=>{const el=$(id);if(!el)return;
    el.classList.toggle('on',!!SAVE[key]);
    el.addEventListener('pointerdown',e=>{e.preventDefault();
      SAVE[key]=SAVE[key]?0:1;el.classList.toggle('on',!!SAVE[key]);saveNow();
      ARC.sfx('tap');ARC.vib(10);fn&&fn(SAVE[key]);});};
  SW('swMus','mus',v=>{if(v)ARC.music(GAME.music);else ARC.musicStop();});
  SW('swSfx','sfx');
  SW('swVib','vib');
  SW('swFx','fx');
  SW('swFps','fps',v=>{$('fps').style.display=v?'block':'none';});
  document.addEventListener('keydown',e=>{
    if(e.code==='Escape'){if(ARC.alive&&!ARC.paused)ARC.pause();else if(ARC.paused)ARC.resume();}
    if(GAME.key)GAME.key(e.code,true);
  });
  document.addEventListener('keyup',e=>{if(GAME.key)GAME.key(e.code,false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&ARC.alive)ARC.pause();});
}

/* -------------------------------------------------------- 9. MENÚ / NIVELES */
function refreshMenu(){
  $('mTtl').innerHTML=GAME.title;
  $('mSub').innerHTML=GAME.subKey?T(GAME.subKey):GAME.sub;
  const b=[];
  if(GAME.bestLabel!==null)b.push('<b>'+(GAME.bestKey?T(GAME.bestKey):(GAME.bestLabel||T('record')))+'</b> '+(SAVE.best||0));
  if(GAME.levels)b.push(T('level')+' '+Math.min(GAME.levels,(SAVE.done||0)+1)+'/'+GAME.levels);
  b.push('★ '+Object.values(SAVE.stars||{}).reduce((s,v)=>s+v,0));
  $('best').innerHTML=b.join('<br>');
  $('bLevels').style.display=GAME.levels?'flex':'none';
  ARC.music(GAME.music);
}
function buildLevels(){
  const g=$('lvGrid');g.innerHTML='';
  const n=GAME.levels||1;
  const cols=Math.min(8,Math.ceil(Math.sqrt(n)+1));
  g.style.gridTemplateColumns='repeat('+cols+',auto)';
  for(let i=1;i<=n;i++){
    const st=SAVE.stars[String(i)]||0;
    const lock=i>(SAVE.done||0)+1;
    const el=document.createElement('div');
    el.className='lvl'+(st?' done':'')+(lock?' lock':'');
    el.innerHTML=i+(st?'<b>'+'★'.repeat(st)+'</b>':'');
    if(!lock)el.addEventListener('pointerdown',e=>{e.preventDefault();ARC.sfx('tap');ARC.play(i);});
    g.appendChild(el);
  }
}

ARC.boot=async function(){
  document.documentElement.style.setProperty('--acc',GAME.acc||'#ffd166');
  document.documentElement.style.setProperty('--acc2',GAME.acc2||'#f0a02a');
  saveLoad();
  if(GAME.portrait)document.body.classList.add('vert');
  $('ldName').textContent=GAME.name||'';
  ARC.i18nApply();paintSegs();
  fit();bindInput();
  $('fps').style.display=SAVE.fps?'block':'none';

  /* ---------------- CARGA DE ASSETS con barra de verdad ----------------
     Se cuentan TODOS los pasos (motor 3D, arte, sonidos, modelos) y la barra
     avanza por paso terminado. El fondo de la pantalla de carga es el arte del
     propio juego, como en los otros juegos del repo. Al final NO se entra solo:
     aparece "TOCÁ PARA JUGAR", porque ese toque es lo que habilita el audio en
     el celular (sin gesto, el navegador no deja sonar nada). */
  const steps=[];
  if(GAME.three)steps.push('engine');
  if(GAME.art)steps.push('art');
  const sfxN=Object.keys(GAME.sfx||{}).length;
  if(sfxN)steps.push('sounds');
  const glbN=Object.keys(GAME.glb||{}).length;
  if(glbN)steps.push('models');
  let done=0;
  const total=Math.max(1,steps.length);
  const prog=(k)=>{
    done++;
    const pc=Math.round(done/total*100);
    $('ldBar').style.width=pc+'%';$('ldPct').textContent=pc+'%';
    $('ldTxt').textContent=T(k)||'';
  };
  $('ldTxt').textContent=T(steps[0]||'loading');

  /* 1. motor 3D (por importmap, sólo si el juego es 3D) */
  if(GAME.three){
    try{
      const THREE=await import('three');
      ARC.THREE=THREE;
      const gl=$('gl');
      ARC.rnd=new THREE.WebGLRenderer({canvas:gl,antialias:true,alpha:false,powerPreference:'high-performance'});
      ARC.rnd.setClearColor(new THREE.Color(GAME.sky||'#0d1014'),1);
      if(THREE.SRGBColorSpace)ARC.rnd.outputColorSpace=THREE.SRGBColorSpace;
      ARC.rnd.shadowMap.enabled=!!GAME.shadows;
      if(GAME.shadows)ARC.rnd.shadowMap.type=THREE.PCFSoftShadowMap;
      fit();
    }catch(e){console.warn('three',e);}
    prog('engine');
  }
  applyGfx();

  /* 2. arte del menú (y fondo de esta misma pantalla) */
  if(GAME.art){
    await new Promise(res=>{
      const im=new Image();
      im.onload=()=>{
        $('load').style.backgroundImage='url('+GAME.art+')';
        const el=$('menu');
        if(GAME.portrait){
          el.style.backgroundImage='url('+GAME.art+'), linear-gradient(180deg,'+
            (GAME.acc2||'#222')+'55 0%, #0a0d12 46%, #05070a 100%)';
          el.style.backgroundSize='100% auto, 100% 100%';
          el.style.backgroundRepeat='no-repeat, no-repeat';
          el.style.backgroundPosition='center 14%, center';
        }else{
          el.style.backgroundImage='url('+GAME.art+')';
        }
        el.classList.add('hasart');res();
      };
      im.onerror=()=>res();
      im.src=GAME.art;
    });
    prog('art');
  }
  /* 3. sonidos */
  if(sfxN){
    await new Promise(res=>ARC.sndLoad(GAME.sfx,res));
    prog('sounds');
  }
  /* 4. modelos 3D (opcional: los juegos que usan GLB los declaran en GAME.glb) */
  if(glbN&&ARC.THREE){
    try{
      const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
      const ld=new GLTFLoader();
      ARC.glb={};
      await Promise.all(Object.keys(GAME.glb).map(k=>new Promise(res=>{
        ld.load(GAME.glb[k],g=>{ARC.glb[k]=g;res();},undefined,()=>{ARC.glb[k]=null;res();});
      })));
    }catch(e){console.warn('glb',e);ARC.glb=ARC.glb||{};}
    prog('models');
  }
  /* 5. listo: el juego se prepara y se espera el toque */
  nsafe2(()=>GAME.init&&GAME.init());
  requestAnimationFrame(loop);
  $('ldBar').style.width='100%';$('ldPct').textContent='100%';
  $('ldTxt').textContent=T('ready');
  $('ldGo').classList.add('on');
  const enter=()=>{
    $('ldGo').removeEventListener('pointerdown',enter);
    ARC.sndResume();
    $('load').style.display='none';
    ARC.show('menu');refreshMenu();
    ARC.music(GAME.music);
  };
  $('ldGo').addEventListener('pointerdown',e=>{e.preventDefault();enter();});
  /* atajo para las sondas y para el teclado */
  ARC.enterMenu=enter;
  document.addEventListener('keydown',e=>{if(ARC.scr==='load'&&(e.code==='Space'||e.code==='Enter'))enter();});
};

/* ------------------------------------------------------------------ 1. MUNDO
   El cielo NO es una imagen fija: es un lienzo ALTO (1024x2048) que contiene el
   mundo entero de abajo arriba —ciudad + brillo del horizonte, degradado violeta,
   nebulosas, luna y campo de estrellas— y del que se muestra una VENTANA de 1/2.9
   que sube con la altura de la torre. Así se ve mundo en todos los pisos (antes,
   medido con capturas, a partir del piso ~10 quedaba un lavanda plano y vacío) y
   además se siente que se trepa. La ciudad se mueve MUCHO menos que la ciudad de
   cajas 3D: es paralaje, está lejos. */
const SKYW=1024,SKYH=2048,SKYIMG=580,WIN=1/2.9;
let FOGB=null;
/* cuánto se ensancha la ventana del lienzo al cubrir el frustum */
function skyStretch(){
  const asp=ARC.W/Math.max(1,ARC.H);
  return asp/(SKYW/(SKYH*WIN));
}
function paintSky(){
  const c=skyCv,g=c.getContext('2d'),W=SKYW,H=SKYH;
  let s=7727;const R=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  const y0=H-SKYIMG;                 /* el cielo propio va de 0 a y0 */
  let topc='#241a4a';                /* con qué color empalma la franja de ciudad */
  /* se pinta TODO el lienzo de arranque: un solo píxel transparente en el cielo
     sale NEGRO en pantalla (el material no es transparente). Pasó de verdad: sin la
     imagen de ciudad quedaba una banda negra cruzando el cuadro. */
  g.fillStyle='#140e2c';g.fillRect(0,0,W,H);
  if(cityImg){
    /* la imagen tiene la misma proporción que la franja: entra sin deformarse */
    g.drawImage(cityImg,0,y0,W,SKYIMG);
    try{const d=g.getImageData(3,y0+3,1,1).data;topc='rgb('+d[0]+','+d[1]+','+d[2]+')';}catch(e){}
  }
  /* degradado: noche profunda arriba -> violeta -> el color con el que sigue la
     franja de ciudad. NUNCA negro puro: el negro se lee como "falta el fondo" */
  const gr=g.createLinearGradient(0,0,0,y0);
  gr.addColorStop(0,'#0b0d24');gr.addColorStop(.30,'#111033');
  gr.addColorStop(.62,'#1d1544');gr.addColorStop(1,topc);
  g.fillStyle=gr;g.fillRect(0,0,W,y0);
  /* nebulosas suaves: manchas de color para que la parte alta tenga algo que ver */
  for(let i=0;i<5;i++){
    const x=R()*W,y=R()*y0*.9,r=180+R()*260;
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    const col=i%2?'94,231,193':'150,120,235';
    rg.addColorStop(0,'rgba('+col+',.13)');rg.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);
  }
  if(!cityImg){
    /* respaldo dibujado: la MISMA franja que ocuparía la imagen, entera —degradado
       que empalma con el cielo, brillo de horizonte y skyline de cajas con ventanas
       ámbar— para que no quede ni un hueco si la imagen no llega */
    const gb=g.createLinearGradient(0,y0,0,H);
    gb.addColorStop(0,topc);gb.addColorStop(.5,'#3b2a5c');
    gb.addColorStop(.72,'#b9d6c4');gb.addColorStop(.82,'#332452');
    gb.addColorStop(1,'#140e2c');
    g.fillStyle=gb;g.fillRect(0,y0,W,SKYIMG);
    for(let lay=0;lay<3;lay++){
      const yb=H-SKYIMG*(.28-lay*.075);
      g.globalAlpha=[.5,.75,1][lay];g.fillStyle=['#2a1e4e','#1e1640','#140e2c'][lay];
      let x=-40;
      while(x<W+40){
        const w=30+R()*90,h=(30+R()*110)*(1-lay*.12);
        g.fillRect(x,yb-h,w,h+SKYIMG);
        if(lay>0&&R()<.7){
          g.fillStyle='#ffb445';
          for(let wy=yb-h+10;wy<yb-8;wy+=18)
            for(let wx=x+7;wx<x+w-9;wx+=16) if(R()<.35)g.fillRect(wx,wy,5,7);
          g.fillStyle=['#2a1e4e','#1e1640','#140e2c'][lay];
        }
        x+=w+4+R()*18;
      }
    }
    g.globalAlpha=1;
  }
  /* luna: entra en cuadro alrededor del piso 16 y acompaña hasta el ~100.
     La ventana del lienzo (1024 x 706) se estira para cubrir un frustum mucho más
     ancho, así que TODO sale ensanchado ~1.45x: la luna se dibuja aplastada a mano
     (SX) para que en pantalla salga redonda. Se repinta al cambiar de tamaño. */
  const SX=clamp(1/skyStretch(),.45,1);
  const mx=W*.74,my=y0*.75,mr=46;
  g.save();g.translate(mx,my);g.scale(SX,1);
  const hg=g.createRadialGradient(0,0,mr*.7,0,0,mr*4.2);
  hg.addColorStop(0,'rgba(226,236,255,.30)');hg.addColorStop(1,'rgba(226,236,255,0)');
  g.fillStyle=hg;g.beginPath();g.arc(0,0,mr*4.2,0,Math.PI*2);g.fill();
  g.fillStyle='#eef2ff';g.beginPath();g.arc(0,0,mr,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(180,196,232,.55)';
  g.beginPath();g.arc(-14,-10,9,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(12,14,13,0,Math.PI*2);g.fill();
  g.restore();
  /* estrellas: más densas y más grandes hacia arriba */
  for(let i=0;i<330;i++){
    const y=Math.pow(R(),1.7)*y0,x=R()*W;
    const r=(R()*1.5+.45)*(1.35-y/y0*.5);
    g.globalAlpha=(.22+R()*.66)*clamp(1.15-y/y0*.62,.4,1);
    g.fillStyle=R()<.18?'#ffe7bb':'#e8eeff';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  /* seis estrellas con destello en cruz: dan escala al campo */
  for(let i=0;i<6;i++){
    const x=R()*W,y=R()*y0*.7,r=2.6+R()*1.6;
    g.globalAlpha=.85;g.fillStyle='#ffffff';
    g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
    g.globalAlpha=.35;g.strokeStyle='#ffffff';g.lineWidth=1.4;
    g.beginPath();g.moveTo(x-r*4,y);g.lineTo(x+r*4,y);
    g.moveTo(x,y-r*4);g.lineTo(x,y+r*4);g.stroke();
  }
  g.globalAlpha=1;
  buildFogBands();
  if(skyTex)skyTex.needsUpdate=true;
}
/* tabla de 48 colores promedio (una por banda horizontal del lienzo) para que la
   niebla y el fondo del renderer sean SIEMPRE el color del cielo que se está
   viendo: así la ciudad de cajas se funde con el horizonte en vez de cortarse */
function buildFogBands(){
  try{
    const g=skyCv.getContext('2d');FOGB=[];
    for(let i=0;i<48;i++){
      const y=clamp(Math.round((i+.5)/48*SKYH),0,SKYH-1);
      const d=g.getImageData(0,y,SKYW,1).data;
      let r=0,gg=0,b=0,n=0;
      for(let k=0;k<d.length;k+=4*16){r+=d[k];gg+=d[k+1];b+=d[k+2];n++;}
      FOGB.push([r/n,gg/n,b/n]);
    }
  }catch(e){FOGB=null;}
}
function makeCloudTex(){
  const c=document.createElement('canvas');c.width=128;c.height=64;
  const g=c.getContext('2d');
  for(let i=0;i<7;i++){
    const x=16+Math.random()*96,y=24+Math.random()*18,r=10+Math.random()*22;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  const t=new T3.CanvasTexture(c);return t;
}
function disposeTree(o){
  o.traverse&&o.traverse(n=>{if(n.geometry)n.geometry.dispose();});
}
/* La cámara es ORTOGRÁFICA e isométrica y NO gira: la altura en pantalla de un
   punto es una función lineal fija de su profundidad y su Y. camCoef() la mide
   sobre la cámara real: alto_pantalla = a*profundidad + b*(y - centro). Con eso la
   ciudad de abajo se coloca por su POSICIÓN EN PANTALLA (banda su, en unidades del
   frustum, 5.4 = media pantalla) en vez de por su Y en el mundo.
   ANTES (medido en las capturas): las cajas se ponían todas en y=CY, y como en
   ortográfica cada unidad de profundidad SUBE 0.49 en pantalla, las más lejanas
   terminaban a media pantalla, del mismo tamaño que la torre y encimadas a ella:
   se leía como un montón de cubos flotando, no como una ciudad allá abajo. */
const CY=-8.4,CAMO=[16,12.8,16];
let COEF={a:.4924,b:.8704};
function camCoef(){
  const d=new T3.Vector3(-CAMO[0],-CAMO[1],-CAMO[2]).normalize();
  const u=new T3.Vector3(0,1,0);u.addScaledVector(d,-u.dot(d)).normalize();
  const K=Math.SQRT1_2;
  COEF={a:new T3.Vector3(-K,0,-K).dot(u),b:u.y};
}
function buildProps(){
  const p=ARC.gfxP();
  if(props){world.remove(props);disposeTree(props);props=null;}
  props=new T3.Group();
  const n=clamp(Math.round(34*p.part),10,52);
  const K=Math.SQRT1_2;
  let s=4111;const R=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<n;i++){
    const dep=4+R()*17;
    let lat=(R()*2-1)*15;
    if(Math.abs(lat)<3.4)lat=(lat<0?-1:1)*(3.4+R()*2);   /* no tapar la torre */
    /* perspectiva FALSA: en ortográfica nada se achica solo, así que lo lejano se
       construye más chico a mano. Sin esto la ciudad compite con la torre. */
    const k=1-dep/29;
    const w=(.75+R()*.95)*k,d=(.75+R()*.95)*k,h=(1.3+R()*3.6)*k;
    /* banda baja de la pantalla: lo más lejano un poco más arriba (eso es la
       profundidad), lo cercano casi al borde de abajo */
    const su=-6.2+(dep-4)/17*3.9;
    const y=(su-COEF.a*dep)/COEF.b+1.8;
    const x=(-dep+lat)*K,z=(-dep-lat)*K;
    const lit=R()<.3;
    const m=new T3.Mesh(new T3.BoxGeometry(w,h,d),mat(lit?'#463370':'#241a49'));
    m.position.set(x,y+h/2,z);props.add(m);
    if(lit){   /* azotea encendida: un chispazo ámbar que se ve de lejos */
      const g2=new T3.Mesh(new T3.BoxGeometry(w*.3,.09,d*.3),matB('#ffb445'));
      g2.position.set(x,y+h+.05,z);props.add(g2);
    }
  }
  world.add(props);
}
function buildClouds(){
  const p=ARC.gfxP();
  clouds.forEach(c=>{world.remove(c.m);c.m.geometry.dispose();});
  clouds=[];
  const n=clamp(Math.round(7*p.part),3,10);
  for(let i=0;i<n;i++){
    /* jirones finos y tenues: con nubes grandes y opacas (medido en capturas) el
       cielo alto se llenaba de manchones desenfocados que parecían suciedad */
    const m=new T3.Mesh(new T3.PlaneGeometry(1,1),new T3.MeshBasicMaterial({
      map:cloudTex,transparent:true,opacity:.16+Math.random()*.14,depthWrite:false,
      color:new T3.Color(i%3?'#a08ee6':'#e6a1a8'),fog:false}));
    m.scale.set(rnd(4,7),rnd(1.1,2),1);
    clouds.push({m,u:rnd(-16,16),y:-9+i*(14/n),v:rnd(.25,.8)*(Math.random()<.5?-1:1),
      dep:6+Math.random()*3});
    world.add(m);
  }
}
/* la torre está a ~26 de la cámara: la niebla arranca DESPUÉS de eso para que los
   bloques queden nítidos y se difumine sólo la ciudad de abajo, que así se funde
   con el horizonte de la imagen del cielo */
let fogCol='#432c66';
function setFog(){
  const p=ARC.gfxP();
  scene.fog=new T3.Fog(new T3.Color(fogCol),33+2*p.fog,34+20*p.fog);
}
/* la ventana del cielo sube con la torre y la niebla toma el color REAL de la
   franja que se está viendo (así la ciudad lejana se funde con el cielo en vez de
   cortarse contra él, y sigue funcionando a 100 pisos de altura) */
let fogI=-1;
function skyScroll(){
  if(!skyTex)return;
  const climb=1-Math.exp(-Math.max(0,camY)/50);
  const off=(1-WIN)*climb;
  skyTex.offset.y=off;
  const v=off+WIN*.30;                            /* tercio bajo de lo visible */
  const i=clamp(Math.round((1-v)*47),0,47);
  if(i!==fogI){
    fogI=i;
    const c=FOGB&&FOGB[i];
    if(c){
      /* mezclado con violeta oscuro: con el color del cielo puro la ciudad lejana
         queda gris pálida y se pierde el contraste del estilo */
      const mx=(a,b)=>Math.round(a*.62+b*.38);
      fogCol='rgb('+mx(c[0],38)+','+mx(c[1],26)+','+mx(c[2],66)+')';
      setFog();
      if(scene)scene.background=new T3.Color(fogCol);
    }
  }
}
/* AJUSTES > GRÁFICOS en caliente: cambia la niebla, cuántos edificios tiene la
   ciudad de abajo y cuántas nubes pasan (las partículas ya las escala ARC.q) */
G.gfxApply=function(){
  if(!scene)return;
  setFog();buildProps();buildClouds();
};

/* --------------------------------------------------------------- 2. BLOQUES */
function addBlock(w,d,x,z,y,col){
  const o=new T3.Mesh(new T3.BoxGeometry(w,BH,d),mat(col));
  o.position.set(x,y,z);o.userData.blk=1;tower.add(o);return o;
}
/* la torre puede pasar los 120 pisos: los bloques que quedaron muy por debajo del
   cuadro se tiran (nunca se vuelven a ver) para que la geometría no crezca sin
   fin en una partida larga */
function prune(){
  for(let i=tower.children.length-1;i>=0;i--){
    const o=tower.children[i];
    if(o.userData.blk&&o!==(cur&&cur.m)&&o.position.y<camY-13)rm(o);
  }
}
function rm(m){tower.remove(m);if(m.geometry)m.geometry.dispose();}
function newBlock(){
  const last=curSize;
  axis=score%2;
  const col=colFor(score+1),w=last.w,d=last.d,off=spanFor(score);
  const x=axis===0?last.x+(dirn>0?-off:off):last.x;
  const z=axis===1?last.z+(dirn>0?-off:off):last.z;
  cur={m:addBlock(w,d,x,z,baseY+BH,col),w,d,y:baseY+BH,col,
       lo:(axis===0?last.x:last.z)-off,hi:(axis===0?last.x:last.z)+off,
       v:spdFor(score)*(dirn>0?1:-1)};
  dirn*=-1;
}
function toScreen(x,y,z){
  cam.updateMatrixWorld();
  const v=V3().set(x,y,z).project(cam);
  return{x:(v.x*.5+.5)*ARC.W,y:(-v.y*.5+.5)*ARC.H};
}
function place(){
  if(!cur||dead||!ARC.alive)return;
  const last=curSize,isX=axis===0;
  const size=isX?last.w:last.d;
  const pos=isX?cur.m.position.x:cur.m.position.z;
  const ref=isX?last.x:last.z;
  const d0=pos-ref,ov=Math.abs(d0);
  const tol=clamp(size*.05,.09,.2);
  /* margen de gracia, que se va cerrando: nadie se cae en el arranque. Medido con
     12 toques seguidos a lo bruto en el primer segundo y medio (ver informe). */
  const grace=score<4?.5:(score<8?.26:(score<12?.12:0));
  let keepW=cur.w,keepD=cur.d,cx=isX?ref+d0/2:cur.m.position.x,cz=isX?cur.m.position.z:ref+d0/2;
  let per=false;
  if(ov<=tol){                                   /* ---- PERFECTO ---- */
    per=true;cx=last.x;cz=last.z;
    keepW=isX?Math.min(size+.14,MAXW):cur.w;
    keepD=isX?cur.d:Math.min(size+.14,MAXW);
  }else{
    const sgn=Math.sign(d0)||1;
    let keep=size-Math.max(.12,ov-grace);        /* la gracia perdona un poco */
    /* PISOS 1-6 IMPOSIBLES DE PERDER: si el toque fue tan malo que mataba, se
       rescata con un apoyo que sigue siendo jugable (nunca menos de 1.15 de ancho:
       con size*0.6 a secas, seis rescates seguidos dejaban un bloque de 0.15 y la
       partida quedaba invencible pero imposible) y un aviso. */
    if(ov>=size||keep<=.22){
      if(score<6){keep=Math.max(size*.62,1.15);ARC.toast(ARC.T('saved'));ARC.sfx('groan');}
      else{lose();return;}
    }
    if(isX){keepW=keep;cx=ref+sgn*(size-keep)/2;}
    else{keepD=keep;cz=ref+sgn*(size-keep)/2;}
    const fs=Math.max(.08,size-keep);            /* el trozo que sobra y cae */
    if(isX)dropPiece(fs,cur.d,cx+sgn*(keep/2+fs/2),cz,cur.y,cur.col,sgn,0);
    else dropPiece(cur.w,fs,cx,cz+sgn*(keep/2+fs/2),cur.y,cur.col,sgn,1);
    combo=0;
  }
  rm(cur.m);
  const b=addBlock(keepW,keepD,cx,cz,cur.y,cur.col);
  curSize={w:keepW,d:keepD,x:cx,z:cz};
  baseY=cur.y;score++;
  anims.push({m:b,t:.16,L:.16});
  cur=null;
  if(per)perfect(b,cx,cz,baseY,keepW,keepD);
  /* golpe del bloque al asentarse: sube de tono con la altura. Se usa 'pop' y NO
     'click'/'wood' porque medí los buffers decodificados: click está en silencio
     (pico RMS 0.000) y wood tiene el golpe a 225 ms, o sea llega tarde. 'pop' tiene
     el ataque en los primeros 25 ms, que es lo que hace que se sienta el toque. */
  else{coins++;ARC.sfx('pop',{rate:clamp(.86+score*.008,.86,1.5),vol:1.8});ARC.vib(10);}
  if(score%10===0){                              /* hito cada 10 pisos */
    coins+=5;
    const s=toScreen(cx,baseY+1.5,cz);
    ARC.fx.text(s.x,s.y-ARC.H*.16,score+' '+ARC.T('mile'),
      {color:'#ffd166',size:Math.max(16,ARC.H*.06),life:1.1,vy:-24});
    ARC.fx.ring(s.x,s.y,{r:Math.min(ARC.W,ARC.H)*.3,r0:10,color:'#ffd166',w:7,life:.45});
    ARC.sfx('power');ARC.shake(4);
  }
  hud();
  newBlock();
}
function perfect(b,cx,cz,y,w,d){
  combo++;if(combo>bestCombo)bestCombo=combo;
  const bonus=1+combo;coins+=bonus;
  const s=toScreen(cx,y+.4,cz);
  const big=Math.max(15,ARC.H*.052);
  /* el anillo crece con la racha pero con TECHO: con .36+combo*.025 a los 20
     perfectos ya era más grande que la pantalla y se veía como una línea recta */
  ARC.fx.ring(s.x,s.y,{r:Math.min(ARC.W,ARC.H)*Math.min(.62,.36+combo*.02),r0:8,
    color:'#5ee7c1',w:9,life:.5});
  ARC.fx.ring(s.x,s.y,{r:Math.min(ARC.W,ARC.H)*.22,r0:4,color:'#ffffff',w:3,life:.28});
  ARC.fx.burst(s.x,s.y,{n:14+combo*3,color:'#5ee7c1',speed:200,size:4,life:.5,g:180,sq:true});
  ARC.fx.text(s.x,s.y-big*.9,ARC.T('perfect')+(combo>1?' x'+combo:''),
    {color:'#5ee7c1',size:big,life:.85});
  ARC.fx.text(s.x,s.y+big*.3,'+'+bonus+' ●',{color:'#ffd166',size:big*.78,life:.8,vy:-30});
  /* brillo: caja mate que crece y se apaga + destello del bloque */
  const gm=new T3.Mesh(new T3.BoxGeometry(w+.06,BH+.06,d+.06),
    new T3.MeshBasicMaterial({color:new T3.Color('#5ee7c1'),transparent:true,opacity:.6,
      depthWrite:false}));
  gm.position.set(cx,y,cz);tower.add(gm);
  glows.push({m:gm,t:.42,L:.42});
  flash.push({m:b,mat:b.material,t:.14});b.material=matB('#d8fff3');
  ARC.sfx('perfect',{rate:clamp(1+combo*.07,1,2.1)});
  ARC.sfx('chime',{rate:clamp(1.05+combo*.09,1,2.3),vol:.5});
  ARC.vib([8,18,8]);ARC.shake(2.5+Math.min(6,combo));
}
function dropPiece(w,d,x,z,y,col,sgn,zAxis){
  /* el trozo cortado se desmorona: el sonido propio (piedra) va acá, corto y bajo,
     y en la caída de la torre entero y grave */
  ARC.sfx('drop',{rate:rnd(1.35,1.65),vol:.3});
  const o=addBlock(w,d,x,z,y,col);
  o.userData.blk=0;               /* los trozos que caen los maneja falls, no prune */
  falls.push({m:o,vy:1.2,vr:rnd(2,5)*(sgn||1),ax:zAxis?'x':'z',
    vx:(zAxis?0:sgn*1.5),vz:(zAxis?sgn*1.5:0),t:0});
}
/* la racha se muestra CONTADA (x3 = tres perfectos seguidos) y encendida en el
   color del juego; en 0 queda apagada. Antes decía "x1" con la racha en cero, que
   se leía como si siempre hubiera racha. */
function hud(){
  const st=combo>0
    ?'<b style="color:#5ee7c1">'+ARC.T('streak')+' x'+combo+'</b>'
    :'<span style="opacity:.6">'+ARC.T('streak')+' —</span>';
  ARC.hud(score,st+'  ·  ●'+coins+'  ·  '+
    ARC.T('record')+' '+Math.max(ARC.S.best||0,score));
}
function lose(){
  if(dead)return;
  dead=true;dieT=0;over0=false;
  if(cur){falls.push({m:cur.m,vy:0,vr:3.2,ax:'z',vx:rnd(-1.4,1.4),vz:rnd(-1.4,1.4),t:0});cur=null;}
  /* el derrumbe: sólo la piedra grave. El 'lose' lo toca ARC.over 0.9 s después,
     tocarlo también acá lo hacía sonar dos veces pisado */
  ARC.sfx('drop',{rate:.72,vol:.9});ARC.shake(10);ARC.vib(60);
  const s=toScreen(curSize.x,baseY,curSize.z);
  ARC.fx.burst(s.x,s.y,{n:20,color:'#ff5d73',speed:240,size:5,life:.6,g:520,sq:true});
}
function finish(){
  if(over0)return;
  over0=true;
  const rec=score>(ARC.S.best||0)&&score>0;
  if(bestCombo>(ARC.S.bcombo||0)){ARC.S.bcombo=bestCombo;ARC.save();}
  ARC.over({win:false,score,noStars:true,coins,
    title:rec?ARC.T('newRec'):ARC.T('fell'),
    sub:ARC.T('floors')+': <b>'+score+'</b><br>'+ARC.T('bStreak')+': <b>x'+bestCombo+'</b>'+
        '<br>'+ARC.T('coinsW')+': <b>+'+coins+'</b>  (●'+((ARC.S.coins||0)+coins)+')'});
}
/* ---- entrada ---- */
G.down=function(){place();};
G.key=function(c,d){if(d&&(c==='Space'||c==='ArrowUp'||c==='Enter'))place();};
G.i18nDone=function(){
  if(!ARC.alive)return;
  hud();ARC.tray([{id:'drop',txt:ARC.T('place'),fn:()=>place()}]);
};
/* ---- ciclo ---- */
G.init=function(){
  T3=ARC.THREE;if(!T3)return;
  scene=new T3.Scene();
  scene.background=new T3.Color('#1a1038');
  world=new T3.Group();scene.add(world);
  tower=new T3.Group();scene.add(tower);
  const asp=ARC.W/Math.max(1,ARC.H);
  vh=Math.max(VIEWH,MINW/asp);
  cam=new T3.OrthographicCamera(-vh*asp/2,vh*asp/2,vh/2,-vh/2,.1,200);
  scene.add(new T3.HemisphereLight(0xcfe0ff,0x2a1c48,1.05));
  const dl=new T3.DirectionalLight(0xffe6c0,.75);dl.position.set(9,17,11);scene.add(dl);
  const dl2=new T3.DirectionalLight(0x7f6ad0,.35);dl2.position.set(-10,4,-8);scene.add(dl2);
  camCoef();
  /* cielo: quad pegado a la cámara, siempre detrás de todo. El lienzo es ALTO y se
     muestra una ventana que sube con la altura (ver paintSky/skyScroll). */
  skyCv=document.createElement('canvas');skyCv.width=SKYW;skyCv.height=SKYH;
  skyTex=new T3.CanvasTexture(skyCv);
  if(T3.SRGBColorSpace)skyTex.colorSpace=T3.SRGBColorSpace;
  skyTex.wrapS=skyTex.wrapT=T3.ClampToEdgeWrapping;
  skyTex.repeat.set(1,WIN);skyTex.offset.set(0,0);
  paintSky();
  sky=new T3.Mesh(new T3.PlaneGeometry(1,1),new T3.MeshBasicMaterial({
    map:skyTex,depthWrite:false,depthTest:false,fog:false}));
  sky.renderOrder=-10;scene.add(sky);
  /* ciudad generada para el horizonte (si no llega, queda la dibujada) */
  const im=new Image();
  im.crossOrigin='anonymous';
  im.onload=()=>{cityImg=im;paintSky();fogI=-1;skyScroll();};
  im.onerror=()=>{};
  im.src=CITY;
  cloudTex=makeCloudTex();
  /* SIN plano de suelo: con cámara ortográfica isométrica un plano grande sube por
     la pantalla con la profundidad y termina tapando TODO el cielo (medido: el
     cielo sólo asomaba en las esquinas). El piso lo cuenta la imagen del
     horizonte y la ciudad de cajas que se hunde cuando la torre sube. */
  setFog();skyScroll();buildProps();buildClouds();
  /* NO se entra solo al menú, ni con ?local: las dos sondas ahora TOCAN de verdad
     "TOCÁ PARA JUGAR", y entrar solo tapaba justo eso (si el botón dejara de recibir
     el toque, la sonda no se enteraría). Verificado: 18/18 y 28/28 sin el atajo. */
};
let lastStr=0;
G.resize=function(){
  if(!cam)return;
  const asp=ARC.W/Math.max(1,ARC.H);
  vh=Math.max(VIEWH,MINW/asp);
  cam.left=-vh*asp/2;cam.right=vh*asp/2;cam.top=vh/2;cam.bottom=-vh/2;
  cam.updateProjectionMatrix();
  /* el estirado del cielo cambió: hay que repintar la luna con la nueva forma */
  const s=skyStretch();
  if(skyCv&&Math.abs(s-lastStr)>.04){lastStr=s;paintSky();fogI=-1;}
};
G.start=function(){
  if(!T3)return;
  while(tower.children.length)rm(tower.children[0]);
  falls.length=0;glows.length=0;anims.length=0;flash.length=0;
  dead=false;over0=false;dieT=0;score=0;combo=0;bestCombo=0;coins=0;dirn=1;tipT=0;
  addBlock(BW0,BW0,0,0,0,colFor(0));
  for(let i=1;i<17;i++)addBlock(BW0,BW0,0,0,-i*BH,colFor(-i));
  curSize={w:BW0,d:BW0,x:0,z:0};baseY=0;
  camY=0;camX=0;camZ=0;
  cur=null;newBlock();
  lastAM=0;prevOff=1e9;amT=0;
  hud();
  ARC.tray([{id:'drop',txt:ARC.T('place'),fn:()=>place()}]);
};
G.step=function(dt){
  if(!T3||!scene)return;
  tipT+=dt;
  if(cur){
    const p=cur.m.position,k=axis===0?'x':'z';
    p[k]+=cur.v*dt;
    if(p[k]>cur.hi){p[k]=cur.hi;cur.v=-Math.abs(cur.v);}
    if(p[k]<cur.lo){p[k]=cur.lo;cur.v=Math.abs(cur.v);}
  }
  for(let i=falls.length-1;i>=0;i--){
    const f=falls[i];
    f.vy-=17*dt;f.t+=dt;
    f.m.position.y+=f.vy*dt;f.m.position.x+=f.vx*dt;f.m.position.z+=f.vz*dt;
    f.m.rotation[f.ax]+=f.vr*dt;
    if(f.m.position.y<camY-16||f.t>4.5){rm(f.m);falls.splice(i,1);}
  }
  for(let i=glows.length-1;i>=0;i--){
    const gl=glows[i];gl.t-=dt;
    if(gl.t<=0){tower.remove(gl.m);gl.m.geometry.dispose();gl.m.material.dispose();glows.splice(i,1);continue;}
    const k=1-gl.t/gl.L;
    gl.m.scale.setScalar(1+k*.55);gl.m.material.opacity=.6*(1-k);
  }
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i];a.t-=dt;
    const k=clamp(a.t/a.L,0,1);
    a.m.scale.set(1+.09*k,1-.16*k,1+.09*k);
    if(a.t<=0){a.m.scale.set(1,1,1);anims.splice(i,1);}
  }
  for(let i=flash.length-1;i>=0;i--){
    const f=flash[i];f.t-=dt;
    if(f.t<=0){f.m.material=f.mat;flash.splice(i,1);}
  }
  /* nubes: derivan de costado y se reciclan hacia arriba mientras la torre sube */
  const K=Math.SQRT1_2;
  for(const c of clouds){
    c.u+=c.v*dt;
    if(c.u>18)c.u=-18;if(c.u<-18)c.u=18;
    if(c.y<camY-10)c.y+=14;
    c.m.position.set((-c.dep+c.u)*K,c.y,(-c.dep-c.u)*K);
  }
  /* cámara: sigue la altura Y EL CENTRO del bloque de arriba (encuadre) */
  const s=1-Math.pow(.004,dt),s2=1-Math.pow(.02,dt);
  camY=lerp(camY,baseY,s);
  camX=lerp(camX,curSize.x,s2);camZ=lerp(camZ,curSize.z,s2);
  pruneT+=dt;if(pruneT>1.5){pruneT=0;prune();}
  if(dead){dieT+=dt;if(dieT>.9)finish();}
};
G.draw=function(g){
  if(!ARC.rnd||!scene||!cam)return;
  const tgt=V3().set(camX,camY+1.8,camZ);
  cam.position.set(tgt.x+16,tgt.y+12.8,tgt.z+16);
  cam.lookAt(tgt);cam.updateMatrixWorld();
  /* el cielo se planta delante de la cámara y cubre EXACTAMENTE el frustum (con
     ortográfica el tamaño no depende de la distancia): la sensación de trepar la da
     la ventana de textura que sube, no el mover el plano — así no hay forma de que
     se abra un hueco por un borde */
  const fw=(cam.right-cam.left),fh=(cam.top-cam.bottom);
  const fwd=V3().set(0,0,-1).applyQuaternion(cam.quaternion);
  sky.position.copy(cam.position).addScaledVector(fwd,70);
  sky.quaternion.copy(cam.quaternion);
  sky.scale.set(fw*1.02,fh*1.02,1);
  skyScroll();
  for(const c of clouds)c.m.quaternion.copy(cam.quaternion);
  ARC.rnd.render(scene,cam);
  /* ---- capa 2D: medidor de precisión, aviso inicial ---- */
  if(cur&&!dead){
    const last=curSize;
    const size=axis===0?last.w:last.d;
    const ofs=Math.abs((axis===0?cur.m.position.x-last.x:cur.m.position.z-last.z));
    const k=clamp(1-ofs/Math.max(.4,size),0,1);
    const w=ARC.W*.32,x=(ARC.W-w)/2,y=ARC.H*.87,h=Math.max(6,ARC.H*.016);
    g.fillStyle='rgba(8,10,20,.55)';g.fillRect(x-2,y-2,w+4,h+4);
    g.fillStyle='rgba(255,255,255,.16)';g.fillRect(x,y,w,h);
    g.fillStyle=k>.93?'#5ee7c1':(k>.62?'#ffd166':'#ff5d73');
    g.fillRect(x,y,w*k,h);
    g.fillStyle='rgba(255,255,255,.8)';g.fillRect(x+w-2,y-3,2,h+6);
  }
  if(score===0&&!dead&&tipT<12){
    const a=clamp(1-(tipT-9)/3,0,1);
    g.globalAlpha=a*(.72+.28*Math.sin(ARC.t*4));
    g.fillStyle='#eef2f6';
    g.font='900 '+Math.max(13,ARC.H*.05)+'px system-ui,sans-serif';g.textAlign='center';
    g.fillText(ARC.T('tapPlace'),ARC.W/2,ARC.H*.19);
    g.textAlign='left';g.globalAlpha=1;
  }
};
/* ------------------------------------------------------------------- 5. SONDA
   autoMove juega de verdad: mide cada cuánto la llaman y apoya cuando el bloque
   está dentro del alcance de ese muestreo (a 60 Hz clava PERFECTO casi siempre);
   si la sonda es lenta, apoya en el punto más cercano al centro (vuelta atrás
   del error) para no morir por no llegar nunca. */
let lastAM=0,prevOff=1e9,amT=0;
G.dbg={
  /* encuadre medido en fracciones de pantalla (0..1): dónde cae la cima, dónde la
     base visible y hasta dónde llegan los extremos del recorrido del bloque. Con
     esto se verifica que la torre NUNCA se sale del cuadro (ver informe). */
  enc:()=>{
    if(!cam||!curSize)return null;
    const f=(x,y,z)=>{const s=toScreen(x,y,z);return[+(s.x/ARC.W).toFixed(3),+(s.y/ARC.H).toFixed(3)];};
    const isX=axis===0,lo=cur?cur.lo:0,hi=cur?cur.hi:0;
    const A1=isX?f(lo,baseY+BH,curSize.z):f(curSize.x,baseY+BH,lo);
    const B1=isX?f(hi,baseY+BH,curSize.z):f(curSize.x,baseY+BH,hi);
    return{cima:f(curSize.x,baseY,curSize.z),pie:f(curSize.x,baseY-9*BH,curSize.z),
      ext:[A1,B1],vh:+vh.toFixed(2)};
  },
  state:()=>({score,combo,best:bestCombo,coins,dead,falls:falls.length,
    size:curSize?+curSize.w.toFixed(2):0,spd:+spdFor(score).toFixed(2),
    mundo:'props '+(props?props.children.length:0)+' / nubes '+clouds.length+
      ' / bloques '+(tower?tower.children.length:0)}),
  autoMove:()=>{
    if(dead||!cur||!ARC.alive){lastAM=0;prevOff=1e9;amT=0;return false;}
    const now=(typeof performance!=='undefined'?performance.now():Date.now())/1000;
    const iv=lastAM?clamp(now-lastAM,1/120,.6):1/60;
    lastAM=now;amT+=iv;
    const last=curSize,isX=axis===0;
    const size=isX?last.w:last.d;
    const off=Math.abs(isX?cur.m.position.x-last.x:cur.m.position.z-last.z);
    const reach=Math.abs(cur.v)*iv;               /* cuánto avanza entre llamadas */
    const tol=clamp(reach*.6,.05,size*.42);
    /* pasada completa del bloque: si en dos idas y vueltas nunca entró en
       tolerancia (sonda muy lenta), se apoya en lo mejor disponible antes que
       dejar de jugar — pero nunca en un punto que lo mate */
    const lap=4*spanFor(score)/Math.max(.5,Math.abs(cur.v));
    let go=off<=tol;
    if(!go&&off>prevOff&&off<size*.45)go=true;    /* pasó el punto más cercano */
    if(!go&&amT>lap&&off<size*.7)go=true;
    prevOff=off;
    if(go){amT=0;prevOff=1e9;place();return true;}
    return false;
  }
};
window.GAME=G;

window.ARC=ARC;window.GAME=GAME;
ARC.boot();
</script>
