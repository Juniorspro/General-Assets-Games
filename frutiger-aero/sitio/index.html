<!-- ===========================================================
     Página vacía, a propósito. Nada más que el fondo.

     Dos imágenes en vez de una: la apaisada para pantalla ancha y la vertical
     para el celular. Con una sola, `cover` recorta tanto en un teléfono que se
     pierde el cielo y queda todo pasto.
     =========================================================== -->
<style>
html, body { height: 100%; }
body {
  margin: 0;
  background: #1d63b4 url("img/fondo.webp") center / cover no-repeat fixed;
  color-scheme: light;
}
/* En vertical `fixed` se rompe en varios navegadores móviles: se ancla al
   viewport visual y salta con la barra de direcciones. Por eso, scroll. */
@media (orientation: portrait) {
  body { background-image: url("img/fondo-alto.webp"); background-attachment: scroll; }
}
</style>
