<!-- ===========================================================
     Frutiger Aero · próximamente

     Una foto de fondo, la barra de vidrio arriba y la mascota en 3D. El modelo
     es una malla sola, sin huesos —eso devuelve una reconstrucción hecha a
     partir de una imagen—, así que todo lo que se mueve se calcula en cada
     cuadro: flote, respiración, bamboleo, y el cuerpo girando hacia el puntero.
     Está en `js/mascota.b786a449.js`.

     Si no hay WebGL o el modelo no baja, queda la imagen. Un cuadro vacío
     sería peor que una foto.

     El vidrio son tres capas y hacen falta las tres:
       · el cuerpo — desenfoque del fondo, más saturación, tinte oscuro;
       · ::before — el filo que dobla la luz, un degradado recortado a 1 px con
         `mask-composite`;
       · ::after — el brillo de arriba.
     Con sólo la primera queda un rectángulo borroso, que es lo que hace todo
     el mundo y no es esto.
     =========================================================== -->
<style>
:root{
  --claro:#ffffff;
  --tenue:rgba(255,255,255,.74);
  --tipo:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--tipo); color:var(--claro); letter-spacing:-.01em;
  background:#0a2a63 url("img/fondo.06222548.webp") center / cover no-repeat fixed;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
/* En vertical `fixed` se ancla al viewport visual en varios navegadores del
   celular y el fondo salta con la barra de direcciones. Por eso, scroll. */
@media (orientation:portrait){
  body{ background-image:url("img/fondo-alto.550e8e84.webp"); background-attachment:scroll }
}
img{max-width:100%; display:block}
/* `img{display:block}` es una regla de autor y le gana al `[hidden]` de la
   hoja del navegador: sin esto, esconder el respaldo no lo escondía y se
   veían la foto y el modelo, uno arriba del otro. */
[hidden]{display:none !important}

/* ---------- el material ---------- */
.vidrio{
  position:relative; isolation:isolate; border-radius:30px;
  background:rgba(8,26,60,.30);
  backdrop-filter:blur(30px) saturate(190%); -webkit-backdrop-filter:blur(30px) saturate(190%);
  box-shadow:
    inset 0 -10px 30px rgba(255,255,255,.05),
    0 30px 70px -26px rgba(2,10,30,.85),
    0 2px 10px -4px rgba(2,10,30,.5);
}
/* el filo. `mask-composite` deja sólo el borde de 1 px del degradado */
.vidrio::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; padding:1px;
  background:linear-gradient(150deg,
    rgba(255,255,255,.85), rgba(255,255,255,.10) 28%,
    rgba(255,255,255,0) 55%, rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}
.vidrio::after{
  content:""; position:absolute; inset:0 0 auto; height:46%; border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.13), rgba(255,255,255,0));
}

/* ---------- la barra ---------- */
.barra{
  position:sticky; top:14px; z-index:60; flex:none;
  margin:14px auto 0; width:min(1080px,100% - clamp(20px,5vw,56px));
  display:flex; align-items:center; gap:10px; padding:10px 18px; border-radius:999px;
}
.marca{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--claro);
  font:600 15px/1 var(--tipo); white-space:nowrap}
.gota{width:26px; height:26px; flex:none;
  filter:drop-shadow(0 2px 5px rgba(0,20,60,.65))}
.fecha{margin-left:auto; font:600 12px/1 var(--tipo); letter-spacing:.14em;
  text-transform:uppercase; color:var(--tenue); white-space:nowrap}
@media (max-width:420px){ .fecha{display:none} }

/* ---------- lo único que hay ---------- */
main{flex:1; display:grid; place-items:center; padding:clamp(28px,6vw,64px) clamp(20px,5vw,56px)}
.tarjeta{
  width:min(560px,100%); padding:clamp(30px,5vw,44px) clamp(24px,4vw,40px) clamp(26px,4vw,38px);
  text-align:center;
}
.mascota{
  width:min(300px,62vw); height:auto; margin:0 auto clamp(14px,3vw,22px);
  filter:drop-shadow(0 26px 34px rgba(2,12,34,.55));
  animation:flota 5.5s ease-in-out infinite;
}
@keyframes flota{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)} }
@media (prefers-reduced-motion:reduce){ .mascota{animation:none} }
/* El lienzo arranca oculto y lo destapa el guión cuando el modelo ya está:
   así nunca se ve el hueco negro mientras baja. */
#lienzo{
  width:min(300px,62vw); height:auto; aspect-ratio:1; display:block;
  margin:0 auto clamp(14px,3vw,22px); cursor:grab; touch-action:none;
  filter:drop-shadow(0 26px 34px rgba(2,12,34,.55));
  /* el lienzo dibuja a 128 px y acá se estira sin suavizar: la pixelación
     es del renderizador, no un filtro encima */
  image-rendering:pixelated;
}
#lienzo:active{cursor:grabbing}
.pista{margin:0; font:500 12.5px/1.5 var(--tipo); color:var(--tenue)}
h1{margin:0; font-size:clamp(30px,6.4vw,52px); font-weight:600; line-height:1.05;
  letter-spacing:-.035em}
h1 b{font-weight:700; color:#9ad9ff}
</style>
</head>
<body>

<header class="barra vidrio">
  <a class="marca" href="/">
    <img class="gota" src="img/icono.133cdca8.webp" alt="" width="256" height="256">Frutiger Aero</a>
  <span class="fecha">2004 — 2012</span>
</header>

<main>
  <section class="tarjeta vidrio">
    <img class="mascota" id="respaldo" src="img/mascota/m-saludando.463f6804.webp"
         alt="La mascota del sitio, un personajito de píxeles con visor y auriculares, saludando"
         width="760" height="760" fetchpriority="high">
    <canvas id="lienzo" width="600" height="600" hidden
            data-modelo="modelos/mascota-rig.3e1c97c9.glb"
            aria-label="La mascota del sitio en tres dimensiones. Arrastrá para girarla."></canvas>
    <h1>Próximamente <b>:)</b></h1>
    <p class="pista">Arrastrala para girarla · tocala para que salte</p>
  </section>
</main>

<script type="module" src="js/mascota.b786a449.js"></script>
</body>
</html>
