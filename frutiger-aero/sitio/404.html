<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acá no hay nada · Frutiger Aero</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Sin este archivo, Cloudflare Pages contesta la portada con un 200 a
     cualquier dirección inventada. Se ve bien y está mal: para un buscador,
     y para cualquiera que pruebe una dirección, la página existe. -->
<style>
body{margin:0; min-height:100dvh; display:grid; place-items:center; text-align:center;
  font-family:"Segoe UI","Frutiger","Helvetica Neue",system-ui,sans-serif; color:#0d3350;
  background:linear-gradient(#dff6ff,#63cdf6 45%,#1379c0)}
.caja{padding:38px 34px; border-radius:18px; max-width:min(460px,90vw);
  background:linear-gradient(rgba(255,255,255,.9),rgba(226,243,253,.8));
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 22px 50px -20px rgba(6,50,90,.6), inset 0 1px 0 #fff;
  backdrop-filter:blur(12px)}
.bolita{width:70px; height:70px; border-radius:50%; margin:0 auto 18px;
  background:radial-gradient(circle at 34% 28%,#fff,#7fdcfa 30%,#1b8fd4 62%,#0a4f86);
  box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 8px 20px rgba(10,80,140,.45)}
h1{margin:0; font:300 32px/1.1 inherit} h1 b{font-weight:700}
p{margin:12px 0 0; color:#2b5f83}
a{display:inline-flex; margin-top:20px; padding:11px 22px; border-radius:10px; text-decoration:none;
  font:700 13.5px/1 inherit; color:#0d3350; border:1px solid rgba(120,180,220,.95);
  background:linear-gradient(#fff 0%,#eef9ff 48%,#c3e6fb 50%,#dcf2ff 100%);
  box-shadow:inset 0 1px 0 #fff, 0 4px 12px -4px rgba(10,70,120,.45)}
</style>
</head>
<body>
  <div class="caja">
    <div class="bolita"></div>
    <h1>Esta burbuja <b>reventó</b></h1>
    <p>La dirección que pediste no existe. Puede que la hayas escrito mal, o que
      nunca haya estado ahí.</p>
    <a href="/">Volver a la portada</a>
  </div>
</body>
</html>
