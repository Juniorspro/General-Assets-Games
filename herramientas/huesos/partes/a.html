<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HUESOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#07090b;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8e4dc;
  overscroll-behavior:none;touch-action:none}
canvas{display:block}

/* ── EL MARCO ──────────────────────────────────────────────────────────────
   El juego se dibuja apaisado. En una pantalla vertical NO se encoge: se GIRA,
   igual que en Z Force y en DASH. Encogerlo deja el juego en una ranura del
   11% de la pantalla; girarlo lo deja entero. Y adentro del marco va TODO
   —lienzo, HUD y menús— así que hay UNA sola transformación y nada puede
   quedar desalineado.                                                       */
#marco{position:fixed;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden;background:#07090b}
#lienzo{position:absolute;inset:0;width:100%;height:100%}

/* ── HUD ──────────────────────────────────────────────────────────────── */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
body.jugando #hud{opacity:1}

.barra{position:absolute;height:14px;border:2px solid #0b0d10;border-radius:2px;
  background:#14181d;box-shadow:0 0 0 1px #3a4048 inset}
/* LA BARRA SE MUEVE CON `transform` Y NO CON `width`: la transición estaba
   declarada sobre transform y el JS escribía width, así que no corría nunca
   —una barra que salta de golpe no deja ver cuánto te sacó el hachazo— y
   encima cada escritura de width es un layout. `scaleX` lo resuelve el
   compositor y la transición sí se aplica. */
.barra i{display:block;height:100%;width:100%;transform-origin:0 50%;transition:transform .12s linear}
#bVida{left:14px;top:14px;width:176px}
#bVida i{background:linear-gradient(180deg,#c8443a,#7e2119)}
/* LA BARRA DE LA FURIA ES LA MISMA CAJA QUE ERA EL AGUANTE Y NO SE PARECE:
   el aguante iba en oro apagado y bajaba; ésta va en brasa y sube. Y llena se
   ENCIENDE —el pulso es el aviso de que el remate existe, así no hace falta
   un cartel que lo diga. */
#bFur{left:14px;top:34px;width:132px;height:9px}
#bFur i{background:linear-gradient(180deg,#ff9a3c,#c3341a);transition:transform .06s linear}
#bFur.full{box-shadow:0 0 0 1px rgba(255,190,90,.85),0 0 12px rgba(255,140,40,.75);
  animation:furia .82s ease-in-out infinite}
#bFur.full i{background:linear-gradient(180deg,#fff0c0,#ff7a1e)}
@keyframes furia{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55)}}
/* el botón del remate NO EXISTE hasta que la barra está llena: un tercer
   botón apagado la partida entera es un botón que nadie aprende, y apareciendo
   sólo cuando sirve, su aparición ES el aviso */
/* ── DÓNDE VA, Y SALE DE LA CUENTA ─────────────────────────────────────────
   El marco mide 892×412 y los otros dos botones están anclados al canto: el
   de atacar ocupa x 764..868 · y 280..384 y el de esquivar 684..758 · 300..374.
   Con `right:120` el nuevo caía en 690..772 · 204..286 y se PISABA con el de
   atacar por ocho píxeles de x y seis de y — o sea encima del botón que más
   se aprieta del juego. Medido, `cajas()` cantó `bAtaca×bRem`. Con 140 queda
   en 670..752 · 204..286: catorce píxeles de aire contra los dos.          */
#bRem{right:140px;bottom:126px;width:82px;height:82px;font-size:26px;
  color:#fff0cf;border-color:rgba(255,170,70,.85);background-color:rgba(120,38,10,.72);
  box-shadow:0 0 16px rgba(255,130,40,.6);display:none}
/* `.hay` Y NO `.on`: en `.bt` la clase `on` ya quiere decir APRETADO y trae su
   propio fondo y su borde. Y va `display:grid` y no `flex`, porque el centrado
   del glifo lo pone `place-items:center` de `.bt`: con flex el ✹ se iba al
   borde izquierdo del círculo, medido en la captura. */
#bRem.hay{display:grid;animation:remEnt .26s cubic-bezier(.2,1.5,.4,1)}
@keyframes remEnt{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#bXp{left:14px;top:49px;width:132px;height:5px}
#bXp i{background:linear-gradient(180deg,#79c2d8,#2c6a80)}

#nivel{position:absolute;left:14px;top:62px;font:700 12px/1 monospace;color:#9fd0e0;
  text-shadow:0 2px 0 #06080a}
#zona{position:absolute;left:50%;top:14px;transform:translateX(-50%);font:700 13px/1.2 monospace;
  letter-spacing:.16em;color:#cfc7b6;text-shadow:0 2px 0 #06080a;text-align:center}
#zonaSub{display:block;font:500 10px/1.4 monospace;letter-spacing:.08em;color:#8e8779;margin-top:3px}
#restan{position:absolute;right:14px;top:14px;font:600 10px/1.5 monospace;color:#8e8779;
  text-align:right;text-shadow:0 2px 0 #06080a;letter-spacing:.08em}
#restan b{display:block;font:700 13px/1.25 monospace;color:#e0b0a8;letter-spacing:.06em}

/* el cartel que cuenta la historia, con la misma caja del juego de referencia */
/* ── EL DIÁLOGO NO LLEGA HASTA LOS BOTONES ────────────────────────────────
   Con el 70% del ancho la caja se metía por debajo del de esquivar —medido,
   dos choques— y con `bottom:96` quedaba pisada por el cartel de oleada en un
   teléfono corto. Sube contra el ALTO DEL MARCO y no contra `vh`, que acá es
   el lado largo porque el cuadro va girado. */
#dialogo{position:absolute;left:50%;bottom:calc(var(--mh,412px)*.36);transform:translateX(-50%);max-width:56%;
  padding:9px 13px;background:rgba(10,13,16,.86);border:2px solid #39414b;
  font:500 12px/1.5 monospace;color:#ded7c8;opacity:0;transition:opacity .3s;text-align:center}
#dialogo.on{opacity:1}

#aviso{position:absolute;left:50%;top:36%;transform:translateX(-50%);padding:7px 14px;
  background:rgba(10,13,16,.9);border:2px solid #4a525c;font:700 12px/1 monospace;
  letter-spacing:.1em;color:#e8dfc8;opacity:0;transition:opacity .2s;white-space:nowrap}
#aviso.on{opacity:1}

/* el golpe en la cara: rojo cuando te pegan, y va DENTRO del marco */
#sangre{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 32%,rgba(150,20,14,.62) 100%)}

/* ── CONTROLES TÁCTILES ───────────────────────────────────────────────── */
#tac{position:absolute;inset:0;pointer-events:none;display:none}
body.movil.jugando #tac{display:block}
/* ── EL JOYSTICK NO RECIBE EL DEDO, Y ES UN DEFECTO QUE COSTABA UN GESTO ───
   El dedo lo lee el LIENZO —el joystick nace donde uno apoya— y este div es
   sólo el dibujo. Con `pointer-events:auto` se comía el toque: al soltar, el
   aro se queda donde estuvo el pulgar, así que volver a apoyar EN EL MISMO
   SITIO —o sea lo que uno hace— caía sobre el div y el lienzo no se enteraba.
   El joystick no arrancaba y desde afuera eso es que el juego se trabó.
   Y VA CENTRADO EN EL DEDO: el JS escribe `left`/`top`, o sea la ESQUINA, así
   que el aro salía abajo y a la derecha del pulgar. Con la traslación del 50%
   el centro cae donde está el dedo, que es lo que el jugador espera.
   Arranca invisible: con opacidad 1 hay un aro fantasma en el rincón hasta
   que alguien lo toca y lo suelta por primera vez.                        */
#joy{position:absolute;left:0;top:0;width:132px;height:132px;border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;transition:opacity .12s;pointer-events:none;
  border:2px solid rgba(210,200,180,.30);background:rgba(12,15,19,.34)}
#joyP{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
  border-radius:50%;background:rgba(215,205,185,.42);border:2px solid rgba(235,228,210,.6)}
.bt{position:absolute;border-radius:50%;border:2px solid rgba(210,200,180,.34);
  background:rgba(12,15,19,.40);pointer-events:auto;display:grid;place-items:center;
  font:700 11px/1 monospace;letter-spacing:.06em;color:#ded5c0;
  transition:background .08s,opacity .12s,border-color .12s}
/* ── VA `background-color` Y NO EL ATAJO ───────────────────────────────────
   `background: …` es el ATAJO, y un atajo REPONE A SU VALOR INICIAL todo lo
   que no nombra: con la chapa generada puesta en `background-image`, apretar
   el botón se la borraba y no volvía nunca. Es literalmente el defecto que en
   AERO dejó la flecha del botón de saltar embaldosada, y en BARRIO el color
   de la baldosa tapando la textura. */
.bt:active,.bt.on{background-color:rgba(150,120,70,.5);border-color:rgba(235,215,160,.7)}

/* ── LOS BOTONES GENERADOS ────────────────────────────────────────────────
   La CHAPA —el aro de hueso con sus cuatro remaches— es la misma en los
   cinco, así que va una vez y se estira; los ICONOS van uno por botón. Y el
   icono entra como MÁSCARA y no como imagen: pintado, el color quedaría
   clavado en el PNG y el remate —que es ámbar, no hueso— tendría que ser un
   segundo archivo. Con `background:currentColor` sobre la máscara, el color
   sigue saliendo del CSS y `.bt.no{opacity:.30}` sigue valiendo.
   NADA DE ESTO SE ENCIENDE HASTA QUE LAS IMÁGENES DECODIFICAN: `body.icos` la
   pone el JS cuando las cinco llegaron, así que un base64 roto cuesta el
   dibujo nuevo y no cinco botones vacíos —que es lo que pasaría con la
   máscara puesta y sin imagen: un cuadrado de color macizo.                */
.bt .ic{display:none;pointer-events:none}
body.icos .bt{background-image:var(--chapa);background-size:100% 100%;
  background-repeat:no-repeat;border-color:transparent}
body.icos .bt:not(#bPausa){font-size:0}
/* EL GLIFO VA POSICIONADO Y NO ES CAPRICHO: `.bt` es una reja y adentro
   quedan DOS cosas —el `<i>` y el carácter de respaldo, que aunque vaya en
   `font-size:0` sigue siendo un ítem anónimo y se lleva su propia fila—, así
   que un `height:46%` resolvía contra media reja. Medido: 46 px de ancho
   contra 23 de alto en un botón de 104, o sea el icono aplastado a la mitad.
   Sacándolo del flujo, el tamaño sale de la caja del botón y no de cuántos
   hijos tenga. `.bt` ya es `position:absolute`, así que le sirve de ancla. */
body.icos .bt .ic{display:block;position:absolute;inset:27%;background:currentColor;
  -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
body.icos #bAtaca{--ic:var(--icAtacar)}
body.icos #bEsq{--ic:var(--icEsquiva)}
body.icos #bRem{--ic:var(--icRemate)}
body.icos #bCam{--ic:var(--icCamara)}
body.icos #bRem{border-color:transparent}
/* ── UN BOTÓN QUE NO PUEDE HACER LO QUE DICE SE APAGA ──────────────────────
   Sin aguante, tocar ATACAR no hacía absolutamente nada y no había forma de
   saber si el botón no respondió o si al personaje no le daba: las dos cosas
   se ven igual, y la primera se lee a juego roto. Apagado se lee a la regla
   que es. `.esp` es el esquive en su espera; el aro de adentro cuenta.    */
.bt.no{opacity:.30}
#bEsq .esp{position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(230,200,130,.75);pointer-events:none;
  clip-path:inset(0 0 0 0);opacity:0}
#bEsq.espera .esp{opacity:1}
#bAtaca{right:24px;bottom:28px;width:104px;height:104px;font-size:15px}
#bEsq{right:134px;bottom:38px;width:74px;height:74px;font-size:16px}
#bCam{right:24px;top:88px;width:54px;height:54px;font-size:11px}
/* EL `display:none` ESTABA EN LÍNEA Y LE GANABA A SU PROPIA REGLA. Un estilo
   en línea gana contra cualquier selector, así que `body.jugando #bPausa` no
   podía encenderlo nunca y el botón de pausa no existía en el teléfono — el
   mismo defecto que en AERO tenía el atajo de `background`. Va en el CSS. */
#bPausa{display:none;left:16px;top:16px;width:46px;height:46px;font-size:17px;pointer-events:auto}
/* ── LAS BARRAS SE CORREN PORQUE AHÍ HAY UN BOTÓN ─────────────────────────
   El de pausa vive en la esquina de arriba a la izquierda, que es donde vive
   en cualquier juego, y las tres barras arrancaban en la misma esquina: la
   caja del botón les caía encima —medido con `cajas()`, tres choques—. Se
   corren SÓLO en teléfono, que es donde el botón existe. */
/* CON `.barra` NO ALCANZA: `#bVida` es un ID y le gana a dos clases, así que
   la regla no movía nada. Van por ID, que es la misma trampa de siempre. */
body.movil #bVida, body.movil #bFur, body.movil #bXp{left:72px}
body.movil #nivel{left:72px}
body.jugando.movil #bPausa{display:grid}
#teclas{position:absolute;right:14px;bottom:14px;font:500 10px/1.6 monospace;color:#8b8577;
  text-align:right;display:none}
body.pc.jugando #teclas{display:block}

/* ── PANELES ──────────────────────────────────────────────────────────── */
.panel{position:absolute;inset:0;display:none;place-items:center;
  background:linear-gradient(180deg,rgba(6,8,10,.95) 0%,rgba(6,8,10,.42) 40%,rgba(6,8,10,.42) 66%,rgba(6,8,10,.95) 100%)}
.panel.on{display:grid}
.caja{width:min(78%,430px);text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:calc(var(--mh,412px)*.027)}
h1{font:800 clamp(24px,calc(var(--mh,412px)*.098),42px)/1 monospace;letter-spacing:.30em;color:#ded3ba;
  text-shadow:0 3px 0 #1a1206,0 0 26px rgba(190,150,80,.28)}
/* ── EL CARTEL DEL NOMBRE ─────────────────────────────────────────────────
   Escrito con la tipografía del sistema, el nombre del juego sale en Roboto
   en Android, San Francisco en iPhone y Segoe en Windows: o sea que lo único
   que uno reconoce de lejos cambia de forma según el aparato. El cartel es
   una imagen y siempre es el mismo dibujo.
   Y LA PALABRA NO SE BORRA: se esconde detrás de `body.cartel`, que la pone
   el JS al decodificar. Sin cartel, el título es el de siempre.
   El ALTO sale de `--mh` como el cuerpo de la letra que reemplaza —el marco
   va girado, así que `vh` acá es el lado LARGO y un cartel medido en vh sale
   dos veces más alto en un teléfono.
   Y EL MENÚ SE QUEDÓ SIN AIRE AL PONERLO. La vuelta 149 midió 28 px de
   sobra en 412; con el cartel en `.155` —63,9 px contra los 40,4 que medía
   la palabra a `.098`— quedaban CUATRO y el título salía cortado por el
   borde de arriba. Los 23,5 px se devuelven entre las dos cosas que los
   gastaron: el cartel a `.140` (57,7) y el hueco de `.caja` de `.034` a
   `.027`, que son cinco huecos y por lo tanto pesa más que el cartel. */
.tit .cart{display:none}
body.cartel .tit .nm{display:none}
body.cartel .tit .cart{display:block;width:100%;
  height:clamp(28px,calc(var(--mh,412px)*.140),62px);
  background:var(--cartel) center/contain no-repeat;
  filter:drop-shadow(0 3px 0 #1a1206) drop-shadow(0 0 22px rgba(190,150,80,.30))}
/* EL TÍTULO DEL FINAL VA EN SU PROPIO NODO. Estaba como `<h1 id=fTit>` con
   el subtítulo de hijo, y `textContent` sobre el padre BORRA a los hijos: la
   línea siguiente escribía sobre un `#fSub` que ya no existía y tiraba, así
   que la pantalla de final nunca mostró ni el subtítulo ni las bajas — y la
   excepción se comía el resto del cuadro mientras el panel estaba puesto. */
h1 b{display:block;font-weight:800}
h1 span{display:block;font:600 clamp(8px,calc(var(--mh,412px)*.026),11px)/1.6 monospace;letter-spacing:.22em;
  color:#8d8574;margin-top:calc(var(--mh,412px)*.018);text-shadow:none}
.b{padding:11px 26px;min-width:190px;border:2px solid #6a5c3c;background:rgba(30,26,18,.82);
  font:700 13px/1 monospace;letter-spacing:.16em;color:#e6dcc2;cursor:pointer}
.b:active{background:rgba(96,78,42,.9)}
.b.off{opacity:.34;pointer-events:none}
.fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* las fichas heredan de `.b`, que tiene `min-width:190px`: sin anularlo, tres
   fichas de 190 no entran en una caja de 430 y la fila se parte en dos. */
.ch{padding:8px 0;min-width:0;flex:1 1 0;border:2px solid #4d4638;background:rgba(24,22,17,.8);
  font:600 10px/1 monospace;letter-spacing:.09em;color:#bdb49f;cursor:pointer}
.fila.tres{width:100%;flex-wrap:nowrap}
.ch.sel{border-color:#b79a56;color:#f0e6cc;background:rgba(74,60,30,.85)}
/* LOS DOS PIES VAN EN UN GRUPO Y NO SUELTOS EN `.caja`. Son dos bloques de
   texto seguidos, así que el hueco de la columna —que existe para separar
   secciones— entre ellos sobra; y en un marco de 360 de lado corto ese hueco
   es lo que dejaba el menú nueve píxeles fuera del cuadro. Medido. */
.pies{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.pie{font:500 10px/1.55 monospace;color:#857e6e;max-width:340px}
/* el récord y el total van en su propia línea y en el color del oro del
   título: es lo único del menú que cambia entre una partida y la siguiente */
.pie.rec{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  font:600 10px/1.5 monospace;letter-spacing:.09em;color:#a8975f}
.tit2{font:700 12px/1 monospace;letter-spacing:.18em;color:#9d947f}
.gr{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
</style></head><body>
<div id="marco">
  <canvas id="lienzo"></canvas>

  <div id="hud">
    <div class="barra" id="bVida"><i></i></div>
    <div class="barra" id="bFur"><i></i></div>
    <div class="barra" id="bXp"><i></i></div>
    <div id="nivel">1</div>
    <div id="zona"><span id="zonaTit"></span><span id="zonaSub"></span></div>
    <div id="restan"></div>
    <div id="dialogo"></div>
    <div id="aviso"></div>
    <div id="sangre"></div>
  </div>

  <div id="tac">
    <div id="joy"><div id="joyP"></div></div>
    <div class="bt" id="bAtaca">✦<i class="ic"></i></div>
    <div class="bt" id="bEsq">↷<i class="ic"></i><i class="esp"></i></div>
    <div class="bt" id="bRem">✹<i class="ic"></i></div>
    <div class="bt" id="bCam">◎<i class="ic"></i></div>
  </div>
  <div class="bt" id="bPausa">≡</div>
  <div id="teclas"></div>

  <div class="panel on" id="pIdioma"><div class="caja">
    <h1 class="tit"><i class="cart"></i><span class="nm">HUESOS</span><span id="iSub">elegí tu idioma</span></h1>
    <div class="fila" id="iBotones"></div>
  </div></div>

  <div class="panel" id="pMenu"><div class="caja">
    <h1 class="tit"><i class="cart"></i><span class="nm">HUESOS</span><span id="mSub"></span></h1>
    <button class="b" id="mJugar"></button>
    <button class="b" id="mSeguir" style="display:none"></button>
    <div class="gr"><div class="tit2" id="mTitCal"></div><div class="fila tres" id="mCal"></div></div>
    <div class="gr"><div class="tit2" id="mTitIdi"></div><div class="fila tres" id="mIdi"></div></div>
    <div class="pies"><div class="pie" id="mPie"></div>
    <div class="pie rec"><span id="mTot"></span><span id="mRec"></span></div></div>
  </div></div>

  <div class="panel" id="pPausa"><div class="caja">
    <h1 id="paTit"></h1>
    <button class="b" id="paSeguir"></button>
    <button class="b" id="paMenu"></button>
    <div class="pie" id="paPie"></div>
  </div></div>

  <div class="panel" id="pFin"><div class="caja">
    <h1><b id="fTit"></b><span id="fSub"></span></h1>
    <div class="pie" id="fDatos"></div>
    <button class="b" id="fOtra"></button>
    <button class="b" id="fMenu"></button>
  </div></div>
</div>

<script type="module">
import * as THREE from 'three';
