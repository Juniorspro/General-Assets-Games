<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0a3d6b">
<title>Aero</title>
<style>
/* ══════════════════════ AERO ══════════════════════
   Frutiger Aero + Liquid Glass. Dos estéticas de dos décadas distintas que
   comparten una sola idea: el vidrio muestra lo que hay detrás.

   ── LA JERARQUÍA DEL VIDRIO, Y ES UNA DECISIÓN DE COSTO ──
   `backdrop-filter` con un mapa de desplazamiento refracta de verdad, y cuesta:
   el navegador tiene que recortar lo de atrás, filtrarlo y desplazarlo por cada
   pieza. Con treinta iconos en pantalla eso hunde un teléfono.
   Así que hay dos vidrios: el REFRACTADO va en las piezas grandes y pocas —el
   reloj, la búsqueda, el dock, los paneles— donde la distorsión del borde se ve;
   y el LISO —desenfoque y saturación— va en los iconos, que son muchos y chicos
   y donde una refracción de dos píxeles no se percibe. */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#0a3d6b;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}

:root{
  --ins-t:24px; --ins-b:16px;
  /* ── EL TAMAÑO DEL ICONO Y CUÁNTAS COLUMNAS SON DATOS, NO CONSTANTES ──
     Estaban escritos en cuatro sitios del CSS y en un `const COLS = 4`. Desde
     que hay un asistente al que se le puede decir «agrandá las apps», tienen
     que poder cambiar en caliente y desde un solo lugar; y las filas por página
     ya se CALCULAN del alto libre, así que agrandar el icono mueve la cuenta
     sola en vez de cortar la última fila. */
  --ico:60px; --icoImg:46px; --cols:4;
  /* ── LA CALIBRACIÓN DEL VIDRIO VIVE EN UNA VARIABLE, Y HACÍA FALTA ──
     La vuelta pasada se recalibró la regla `.vid.refr` y **no llegó a ninguna
     de las cuatro piezas grandes**: `vidrioInit()` escribe el filtro como
     `style.backdropFilter`, o sea un estilo EN LÍNEA, que le gana a cualquier
     regla. Medido ahora sobre el escritorio, el widget, el dock, el menú y la
     hoja del asistente seguían en `saturate(2) brightness(1.14)` — justo el
     número que se había descartado por dejar el dock verde lima.
     Con la calibración en una variable la lee el CSS y la lee el JS, así que no
     puede haber dos. */
  /* dónde y cuánto mide la mascota. Las escribe `mascSitio()` según esté el
     escritorio o el cajón: acá van los valores del escritorio, que es lo que se
     ve en el primer cuadro. */
  --masc-w:214px; --masc-h:292px; --masc-b:132px;
  --v-fil:blur(24px) saturate(120%) brightness(.90);
  --v-filR:blur(19px) saturate(122%) brightness(.90);
  --acento:#7fe3ff;
  --verde:#a8e85c;
  /* ── UN VIDRIO NO TIÑE: DESENFOCA Y TIENE CANTO ──
     Es la diferencia entre esto y un panel pintado, y se mide. Con
     `saturate(200%)` la saturación debajo del widget daba **0,80** contra 0,22
     del fondo libre: el vidrio multiplicaba el color por 3,6 y lo que se veía
     era un slab azul, no la foto a través de algo. El dock, sobre el pasto,
     salía verde lima por lo mismo.
     Así que la saturación queda apenas por encima de 1 —el vidrio la conserva,
     no la inventa—, el brillo pone un techo para que el texto blanco se lea, y
     el trabajo de "esto es vidrio" lo hacen el DESENFOQUE, la REFRACCIÓN del
     canto y el ESPECULAR del borde, que es como se lee en iOS y en HyperOS. */
  --v-fondo:rgba(10,38,70,.15);
  --v-borde:rgba(255,255,255,.55);
  --v-borde-b:rgba(255,255,255,.12);
  --v-sombra:0 10px 30px rgba(3,22,46,.30),0 2px 6px rgba(3,22,46,.18);
}

/* ── EL FONDO ES UNA FOTO, CON UN DEGRADADO DEBAJO ──
   El degradado no es decoración: es lo que se ve mientras la foto decodifica y
   lo que queda si no decodifica nunca. Sin él, el primer cuadro del launcher es
   un rectángulo vacío.
   La deriva y el acercamiento son `transform` puro, o sea que los resuelve el
   compositor y no cuestan un cuadro de JavaScript. El `scale(1.06)` de base
   existe para que la deriva no descubra los bordes.

   ── LA DERIVA VA A ESCALONES, Y ES EL HALLAZGO DE LA VUELTA 130 ──
   Una animación continua del `transform` de la foto cambia la foto en CADA
   cuadro, para siempre. Y cada `backdrop-filter` del launcher toma la foto de
   abajo: o sea que el reloj, la búsqueda, el dock, cada baldosa y —abierto— el
   cajón entero se volvían a FILTRAR sesenta veces por segundo aunque nadie
   tocara nada, sólo porque el fondo se corría un centésimo de píxel. Ése es el
   lag «de fondo» que el banco no puede ver, porque acá dibuja por software y
   en el teléfono lo paga el compositor. Con `steps(48)` la foto se mueve 48
   veces en 24 s —un cuarto de píxel cada medio segundo, que no se ve como
   salto— y entre paso y paso NO CAMBIA: los filtros se rehacen dos veces por
   segundo y no sesenta.
   Y debajo de una hoja que la tapa la deriva se pausa del todo: con el cajón
   abierto, mover la foto era rehacer un desenfoque de 34 px a pantalla
   completa por cuadro para mostrar algo que no se ve. */
#fondo{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#1d7fd6 0%,#3aa8e6 34%,#2fc4d8 58%,#1f9d84 100%);
  background-size:cover;background-position:center;
  transform:scale(1.06);will-change:transform;
  transition:scale .42s cubic-bezier(.22,.9,.24,1)}
#fondo.ok{animation:deriva 24s steps(48) infinite alternate}
body.caj #fondo.ok,body.cc #fondo.ok,body.pers #fondo.ok,body.fg #fondo.ok,
body.bienv #fondo.ok{animation-play-state:paused}
/* ── EL ACERCAMIENTO VA POR `scale`, LA PROPIEDAD INDIVIDUAL ──
   Estaba escrito como `transform:scale(1.14)`, y una animación sobre
   `transform` PISA la declaración: el acercamiento no corría nunca. Y llevaba
   un `filter:saturate() brightness()` que es un filtro más a pantalla completa
   por cuadro mientras el cajón está abierto, para oscurecer algo que el propio
   vidrio del cajón ya oscurece con su `brightness(.84)`. `scale` se compone
   con el `transform` animado, así que sí se ve, y el filtro se va. */
#fondo.hondo{scale:1.075}
/* ── EL LIENZO DEL AGUA VA ENTRE LA FOTO Y LOS VELOS ──
   Encima del fondo, porque es una copia suya desplazada; debajo de `#oscuro` y
   de las dos bandas, para que oscurecer el fondo y los degradados de los
   textos sigan valiendo igual con el agua encendida. (Se probó ponerlo POR
   ENCIMA del vidrio para que los filtros no se rehicieran: no cambia nada,
   porque Chrome vuelve a aplicar un `backdrop-filter` cada vez que su
   rectángulo cae en el área dañada, y un lienzo a pantalla completa la daña
   entera esté donde esté — ver `r.js`.) Siempre en el documento y
   transparente: prender y apagar el `display` le pedía al compositor una capa
   nueva en cada toque. Y `pointer-events:none`, porque el toque que la
   enciende tiene que seguir llegando a lo que haya debajo — un lienzo que se
   come el gesto de subir mataría el cajón. */
#agua{position:fixed;inset:0;z-index:0;pointer-events:none}

/* el velo de oscurecer: una capa encima de la foto y debajo de todo lo demás.
   Un `filter:brightness()` sobre `#fondo` obligaría al compositor a repintar la
   foto entera en cada cuadro de la transición. */
#oscuro{position:fixed;inset:0;z-index:0;pointer-events:none;background:#02121f;
  opacity:0;transition:opacity .2s}
#veloT,#veloB{position:fixed;left:0;right:0;z-index:0;pointer-events:none}
/* El velo se achicó al bajar el tinte del vidrio: con 44% al 60% el cielo
   entero quedaba embarrado, y el cielo es lo único que este fondo tiene para
   mostrar. Ahora cubre exactamente lo que lleva texto —barra de estado, widget
   y búsqueda terminan en el 25% del alto— y suelta el medio. */
#veloT{top:0;height:30%;
  background:linear-gradient(180deg,rgba(3,26,54,.50) 0%,rgba(3,26,54,.30) 52%,rgba(3,26,54,0) 100%)}
#veloB{bottom:0;height:21%;
  background:linear-gradient(0deg,rgba(3,26,54,.46) 0%,rgba(3,26,54,.18) 60%,rgba(3,26,54,0) 100%)}
@keyframes deriva{
  from{transform:scale(1.06) translate3d(-.9%,-.5%,0)}
  to  {transform:scale(1.09) translate3d(.9%,.6%,0)}}
/* quien pidió menos movimiento no ve ninguno */
@media (prefers-reduced-motion:reduce){#fondo.ok{animation:none}}
#svgdefs{position:fixed;width:0;height:0;pointer-events:none}

#capa{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:var(--ins-t) 0 var(--ins-b)}

/* ══════════ EL VIDRIO ══════════ */
.vid{position:relative;background:var(--v-fondo);
  border:1px solid transparent;
  border-radius:26px;
  /* las cinco sombras internas son el ESPESOR: sin ellas el vidrio es un
     rectángulo translúcido y no una pieza con canto. De arriba abajo: el filo
     de arriba, el filo de abajo —que en un vidrio de verdad recoge la luz del
     fondo y por eso no es negro—, el contorno entero, la luz que se acumula
     por dentro del canto de arriba, y la sombra que le da fondo al de abajo. */
  box-shadow:var(--v-sombra),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 -1px 0 rgba(255,255,255,.20),
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 7px 18px -9px rgba(255,255,255,.38),
    inset 0 -9px 20px -11px rgba(2,22,48,.42);
  backdrop-filter:var(--v-fil);
  -webkit-backdrop-filter:var(--v-fil);
  overflow:hidden}
/* ── EL BORDE ES UN DEGRADADO Y NO UN COLOR ──
   Un borde parejo se lee a contorno dibujado; el canto de un vidrio de verdad
   brilla arriba a la izquierda y se apaga abajo a la derecha, porque es una
   superficie curva reflejando una luz. Va con `mask` de dos capas, que es la
   única forma de tener un degradado SOLO en el borde. */
.vid::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(140deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.42) 20%,
    rgba(255,255,255,.05) 48%,rgba(255,255,255,.14) 74%,rgba(255,255,255,.40) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none;z-index:2}
/* ── EL ESPECULAR ES UNA FRANJA FINA, NO UN LAVADO ──
   Un degradado blanco sobre la mitad de arriba de la pieza no se lee a reflejo:
   se lee a que el vidrio está sucio, y encima aclara justo donde va el texto.
   Un vidrio real concentra la luz en los primeros milímetros del canto. Por eso
   son dos franjas cortas —una arriba y una abajo, la de abajo mucho más floja,
   que es la que recoge el fondo— y el medio queda limpio. */
.vid::after{content:'';position:absolute;inset:0;
  border-radius:inherit;pointer-events:none;z-index:1;
  background:
    linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.10) 9%,
      rgba(255,255,255,0) 20%),
    linear-gradient(0deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 7%,
      rgba(255,255,255,0) 16%)}
.vid>*{position:relative;z-index:3}

/* ── EL REFRACTADO ──
   Además del desenfoque, el fondo se DESPLAZA cerca del canto: eso es lo que
   hace que el borde se lea a lente y no a recorte.
   OJO: `.vid.refr` son dos clases y le gana a `.vid`, así que su filtro no es
   un agregado sino un REEMPLAZO. Escrito con otro `saturate`/`brightness`, las
   cuatro piezas grandes —widget, búsqueda, dock y menú— quedaban con una
   calibración que la de `.vid` ya había descartado, y el dock salía verde.
   Lo único que puede diferir es el desenfoque, y por una razón: el
   desplazamiento ya revuelve el fondo, así que hace falta menos. */
.vid.refr{backdrop-filter:var(--v-mapa, url(#refr)) var(--v-filR);
  -webkit-backdrop-filter:var(--v-mapa, url(#refr)) var(--v-filR)}

/* ══════════ BARRA DE ARRIBA ══════════
   ── EN EL TELÉFONO NO SE DIBUJA, PORQUE YA ESTÁ DIBUJADA ──
   El launcher va de borde a borde, o sea que la barra de estado del SISTEMA
   —con su hora y su batería— queda encima de la página. Con ésta puesta
   debajo, el reporte fue exacto: «la batería, la hora y eso ya lo vemos». Se
   queda sólo en la vista previa del navegador, donde no hay barra de sistema y
   sin ella la maqueta no se parece a un teléfono. */
body.and #barra{display:none}
#barra{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:2px 20px 0;font-size:13px;font-weight:700;letter-spacing:.04em;
  color:#fff;text-shadow:0 1px 2px rgba(0,32,64,.9),0 0 8px rgba(0,40,80,.6)}
#bIzq{flex:1;opacity:.9}
#bat{display:flex;align-items:center;gap:5px}
#batCaja{width:26px;height:13px;border:1.6px solid rgba(255,255,255,.85);
  border-radius:4px;position:relative;padding:1.6px}
#batCaja::after{content:'';position:absolute;right:-4px;top:3px;width:2.4px;height:5px;
  background:rgba(255,255,255,.85);border-radius:0 2px 2px 0}
#batLlena{height:100%;border-radius:1.5px;background:#b8f078;
  box-shadow:0 0 6px rgba(184,240,120,.8);transition:width .4s}

/* ══════════ RELOJ ══════════ */
/* ── EL WIDGET ──
   Con el inicio sin apps, esto es lo único que hay arriba del dock, así que
   tiene que valer la pantalla que ocupa: hora grande, día y fecha, el aro de
   batería con su porcentaje y el saludo de la franja del día. Todo sale de
   datos que el launcher YA tiene — nada de red, nada de permisos nuevos. */
/* la franja: los widgets puestos, apilados, con el mismo margen del reloj */
#wid{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;margin:0 18px 10px}
.wCard{padding:13px 16px;border-radius:24px;display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden}
#reloj{margin:0;padding:13px 16px;border-radius:24px;
  display:flex;align-items:center;gap:14px}
#wIzq{flex:1;min-width:0}
#wDer{flex:0 0 auto;width:70px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#wAro{width:52px;height:52px;transform:rotate(-90deg)}
#wAro circle{fill:none;stroke-width:5;stroke-linecap:round}
#wAro .wPista{stroke:rgba(255,255,255,.28)}
/* 2πr con r=25 → 157,08: el trazo se recorta moviendo el offset */
#wAro .wCarga{stroke:#b8f078;stroke-dasharray:157.08;stroke-dashoffset:47;
  filter:drop-shadow(0 0 5px currentColor);transition:stroke-dashoffset .5s ease}
#wPct{position:absolute;top:17px;font:800 13px/1 system-ui,sans-serif;
  text-shadow:0 1px 2px rgba(0,32,64,.95),0 0 9px rgba(0,38,76,.8)}
#wSaludo{margin-top:3px;font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;opacity:.94;text-align:center;line-height:1.15;
  text-shadow:0 1px 2px rgba(0,32,64,.95),0 0 9px rgba(0,38,76,.85)}
/* ── LA SOMBRA SE CALIBRA CONTRA EL CIELO MÁS CLARO, NO CONTRA EL DE AHORA ──
   Todo el texto de este launcher es blanco y el fondo cambia solo a lo largo
   del día: a las 13 el cielo llega a rgb(218,237,239) y una nube encima de eso
   es casi blanco puro. Medido, con la sombra floja la fecha desaparecía sobre
   la nube que cae a la derecha del reloj. Van dos: una dura y pegada, que da el
   filo, y una ancha y difusa, que baja el fondo alrededor de la letra. */
#hora{font-size:50px;font-weight:200;line-height:.92;letter-spacing:-.03em;
  text-shadow:0 1px 2px rgba(0,38,74,.55),0 2px 20px rgba(0,44,84,.75)}
#fecha{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,34,68,.85),0 0 10px rgba(0,40,80,.65);
  opacity:.88;padding-bottom:9px;line-height:1.45}

/* ══════════ BÚSQUEDA ══════════ */
#buscaCaja{flex:0 0 auto;margin:12px 20px 0;padding:0 16px;height:46px;
  display:flex;align-items:center;gap:10px;border-radius:23px}
#buscaCaja svg{flex:0 0 auto;opacity:.85}
#busca{flex:1;background:transparent;border:0;outline:0;color:#fff;
  font-size:15px;font-weight:500;font-family:inherit;min-width:0;
  text-shadow:0 1px 2px rgba(0,32,64,.9),0 0 10px rgba(0,38,76,.7)}
#busca::placeholder{color:rgba(255,255,255,.74)}

/* ══════════ PÁGINAS DE ICONOS ══════════ */
/* ── EL INICIO NO TIENE APPS ──
   Se pidió así, y cambia lo que la hoja es: ya no es una reja que hay que
   llenar sino el aire entre el widget y el dock. Sigue existiendo porque es
   donde se registra el gesto de subir y donde vive el fondo que se ve. */
#hoja{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
#tira{display:flex;height:100%;will-change:transform}
.pag{flex:0 0 100%;height:100%;display:grid;
  grid-template-columns:repeat(var(--cols),1fr);align-content:start;
  gap:6px 0;padding:10px 8px}

.ap{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 2px 6px;border-radius:20px;cursor:pointer;position:relative}
.ap:active{transform:scale(.92)}
.ap{transition:transform .16s cubic-bezier(.2,.9,.3,1.4)}
/* ── EL ICONO VIVE EN UNA BALDOSA DE VIDRIO ──
   Frutiger Aero es skeuomórfico: cada icono es un objeto con volumen, brillo y
   sombra propia. La baldosa da eso sin tocar el icono de la app, que llega como
   viene del sistema. */
/* ── LA TEXTURA DEL ICONO ──
   El agua, el pasto o las nubes DETRÁS del icono de cada app. Va en el CSS y no
   en el nodo: así alcanza a todas las apps instaladas y no a una lista de
   cincuenta que envejece con cada app que se instala. Lo que se ve encima es el
   icono real del sistema, o sea el logo de verdad, con el fondo Aero. */
.baldosa{width:var(--ico);height:var(--ico);border-radius:calc(var(--ico)*.283);
  position:relative;
  background-color:rgba(255,255,255,.16);
  background-image:var(--bTex, none);
  background-size:cover;background-position:center;
  box-shadow:0 5px 14px rgba(4,26,52,.30),
    inset 0 1px 0 rgba(255,255,255,.60),
    inset 0 -6px 12px rgba(0,40,80,.10);
  backdrop-filter:blur(12px) saturate(120%) brightness(.92);
  -webkit-backdrop-filter:blur(12px) saturate(120%) brightness(.92);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
/* ── LA BALDOSA DEL PACK AERO ──
   Trae su propia foto de fondo, así que es OPACA: el `backdrop-filter` de
   `.baldosa` sería un desenfoque de lo que hay detrás de algo que tapa lo que
   hay detrás. Y no es un matiz de estilo: cada baldosa con filtro es una
   pasada más que el compositor tiene que rehacer cada vez que algo de abajo se
   mueve — o sea en cada cuadro del agua, treinta veces. */
.baldosa.aero{backdrop-filter:none;-webkit-backdrop-filter:none;
  background-color:transparent}
.glf{width:64%;height:64%;fill:#fff;
  filter:drop-shadow(0 2px 3px rgba(0,30,60,.42)) drop-shadow(0 0 1px rgba(0,30,60,.30))}
/* ── EL BRILLO YA VIENE EN LA BALDOSA ──
   Las cuatro de la vuelta 125 son vidrio Aero generado y traen su propia barrida
   especular. Con el 30 % que le pone `.baldosa` encima quedan DOS brillos, y el
   de arriba lava justo la mitad donde el generado tiene su gracia. Queda un
   resto, que es lo que sigue separando el canto de arriba del fondo. */
.baldosa.aero::after{height:36%;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0))}
/* ── LA BALDOSA GENERADA NO LLEVA NADA ENCIMA ──
   La celda recortada YA es la baldosa: trae su canto redondeado, su filo
   blanco, su barrida especular y sus gotas. El `box-shadow` interior de
   `.baldosa` y el `::after` de `.aero` serían un segundo canto y un segundo
   brillo dibujados encima del primero, corridos unos píxeles — que es lo que
   se lee como «icono pegado sobre otro icono». Queda sólo la sombra de
   contacto, que es lo único que la despega del fondo de pantalla. */
.baldosa.gen{box-shadow:0 5px 14px rgba(4,26,52,.30);background-color:transparent}
.baldosa.gen::after{display:none}
/* ══════════ LOS PACKS ══════════
   ── VIDRIO PURO ──
   Pedido textual: «el fondo puro líquid glass». O sea que la baldosa NO trae
   foto: deja su `backdrop-filter` puesto y lo que se ve detrás del glifo es el
   fondo de pantalla desenfocado y desaturado. Eso es lo que hace que el icono
   sea del fondo y no un cuadrado pegado encima — y es la única baldosa del
   launcher que cambia con el fondo de pantalla sin que nadie la toque.
   El canto es el que hace que se lea a vidrio y no a un agujero: filo blanco
   arriba, contorno, y la luz que se acumula por dentro del canto de arriba. */
/* ── EL VIDRIO ABSORBE LUZ, Y ESO NO ES DECORACIÓN ──
   Medido sobre la baldosa peor —la que cae encima de la nube más clara del
   fondo— el glifo blanco daba 2,61:1 de contraste, y el piso aceptado para un
   objeto gráfico es 3:1. La palanca correcta no es oscurecer la baldosa con un
   color encima —eso deja de ser vidrio— sino bajarle el `brightness` al filtro,
   que es literalmente lo que hace un vidrio: se come parte de la luz. */
.baldosa.vidrioPuro{
  backdrop-filter:blur(14px) saturate(125%) brightness(.72);
  -webkit-backdrop-filter:blur(14px) saturate(125%) brightness(.72);
  background-color:rgba(255,255,255,.10);
  box-shadow:0 6px 16px rgba(4,26,52,.34),
    inset 0 1.5px 0 rgba(255,255,255,.78),
    inset 0 0 0 1px rgba(255,255,255,.20),
    inset 0 10px 18px -10px rgba(255,255,255,.42),
    inset 0 -8px 14px rgba(0,40,80,.14)}
.baldosa.vidrioPuro::after{height:44%;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 70%,rgba(255,255,255,0))}
/* ── LAS TRES CARAS DIBUJADAS, PARA QUE SIETE PACKS SEAN SIETE ──
   Son el respaldo de `bliss`, `tinta` y `neon` mientras su foto no esté. Van
   con `aero`, o sea opacas y con el `backdrop-filter` apagado: la baldosa ya no
   deja pasar el fondo, así que no cuesta una pasada de filtro por icono.
   Y las tres tienen que separarse **de una ojeada y a 60 px**, que es todo lo
   que mide un icono en el cajón: no alcanza con cambiar el tono, hay que
   cambiar de familia. Bliss es la loma clara —verde abajo, cielo arriba—,
   tinta es una losa oscura mate, y neon es casi negro con el canto encendido
   del color de acento. */
.baldosa.pkBliss{
  background-image:linear-gradient(178deg,#7ec6f2 0%,#a8dcf6 38%,#79bf5a 62%,#4e9a3c 100%);
  box-shadow:0 6px 16px rgba(4,26,52,.34),
    inset 0 1.5px 0 rgba(255,255,255,.72),
    inset 0 0 0 1px rgba(255,255,255,.18)}
/* ── LA CARA DE RESPALDO DEL PACK DE CRISTAL ──
   Va SIN fondo opaco a propósito: la baldosa conserva su `backdrop-filter`, o
   sea que lo que se ve por dentro es el fondo de pantalla desenfocado, igual
   que en la celda generada. Lo único que se dibuja es lo que un vidrio agrega:
   el canto muy claro —el bisel de la celda mide (207,211,216) medido sobre la
   hoja— y la barrida especular de la esquina de arriba. */
.baldosa.pkCristal{
  background-image:linear-gradient(147deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.13) 26%,
    rgba(255,255,255,0) 27%,rgba(255,255,255,0) 100%);
  box-shadow:0 6px 16px rgba(0,6,14,.42),
    inset 0 2px 0 rgba(232,240,250,.86),
    inset 0 -2px 0 rgba(198,214,232,.46),
    inset 0 0 0 1.5px rgba(214,228,244,.52),
    inset 0 0 12px rgba(255,255,255,.16)}
.baldosa.pkTinta{
  background-image:linear-gradient(180deg,#2b3a4d 0%,#1b2635 62%,#141c27 100%);
  box-shadow:0 6px 16px rgba(0,10,22,.42),
    inset 0 1.5px 0 rgba(255,255,255,.28),
    inset 0 0 0 1px rgba(255,255,255,.10)}
/* el canto va FUERTE a propósito: al lado de la losa de tinta, un neón con el
   borde discreto se distingue a tamaño completo y **no a 60 px**, que es lo que
   mide un icono en el cajón. El contorno de dos píxeles y el halo hacia afuera
   son lo que lo separa de una ojeada. */
.baldosa.pkNeon{
  background-image:radial-gradient(120% 100% at 50% 0%,
    color-mix(in srgb, var(--acento) 20%, #0a0d12) 0%, #07090d 72%);
  box-shadow:0 6px 16px rgba(0,0,0,.5),
    inset 0 0 0 2px var(--acento),
    inset 0 2px 0 rgba(255,255,255,.5),
    inset 0 -12px 20px -8px color-mix(in srgb, var(--acento) 40%, transparent),
    0 0 14px -1px color-mix(in srgb, var(--acento) 55%, transparent)}
/* el brillo de arriba es la barrida especular del vidrio Aero; en la losa mate
   de tinta no va, porque una losa mate no tiene barrida */
.baldosa.pkBliss::after{height:46%;
  background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.06) 72%,rgba(255,255,255,0))}
.baldosa.pkTinta::after{display:none}
.baldosa.pkNeon::after{height:38%;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
/* la burbuja es la misma pieza redonda: es la forma de las capturas del centro
   de control, y a 60 px un círculo se lee más limpio que un cuadrado */
.baldosa.redon{border-radius:50%}
.baldosa.redon::after{border-radius:50%}
/* y con tinte oscuro el glifo blanco se lee sobre CUALQUIER fondo de pantalla,
   que es lo que un cuadrado translúcido claro no garantiza */
.baldosa.tOscuro{background-color:rgba(6,16,28,.46);
  backdrop-filter:blur(16px) saturate(112%) brightness(.62);
  -webkit-backdrop-filter:blur(16px) saturate(112%) brightness(.62)}
.baldosa.tOscuro::after{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0))}

/* ══════════ LA BIENVENIDA ══════════ */
#bienv{position:fixed;inset:0;z-index:9;display:flex;align-items:center;
  justify-content:center;padding:18px;opacity:0;pointer-events:none;
  background:rgba(2,14,30,.52);transition:opacity .34s ease}
#bienv.on{opacity:1;pointer-events:auto}
#bvCaja{width:100%;max-width:400px;max-height:92vh;overflow-y:auto;
  padding:20px 18px 16px;border-radius:28px;
  background:linear-gradient(180deg,rgba(9,44,84,.46),rgba(6,30,60,.60));
  backdrop-filter:blur(30px) saturate(120%) brightness(.88);
  -webkit-backdrop-filter:blur(30px) saturate(120%) brightness(.88);
  box-shadow:0 24px 60px rgba(2,18,40,.50),inset 0 1px 0 rgba(255,255,255,.30);
  transform:translateY(16px) scale(.97);transition:transform .34s cubic-bezier(.22,1,.3,1)}
#bienv.on #bvCaja{transform:none}
#bvPuntos{display:flex;gap:6px;justify-content:center;padding-bottom:14px}
#bvPuntos i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.34)}
#bvPuntos i.act{width:20px;border-radius:3px;background:var(--acento)}
#bvTit{font-weight:800;font-size:21px;line-height:1.2;text-align:center}
#bvSub{font-weight:500;font-size:12px;line-height:1.4;opacity:.78;text-align:center;padding:6px 6px 14px}
#bvOps{display:flex;flex-direction:column;gap:9px}
/* ── LA OPCIÓN ES SU PROPIA MUESTRA ──
   La fila no lleva un rótulo con un cuadradito de color al lado: lleva las
   cuatro baldosas que ese pack va a dibujar de verdad. */
.bvOp{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;
  background:rgba(255,255,255,.09);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  transition:background .16s ease,box-shadow .16s ease}
.bvOp.sel{background:rgba(255,255,255,.18);
  box-shadow:inset 0 0 0 2px var(--acento),0 0 16px -6px var(--acento)}
.bvOp span{font-weight:700;font-size:13px;line-height:1.2}
.bvM{display:flex;gap:6px;flex:0 0 auto}
.bvM .baldosa{--ico:34px;width:34px;height:34px;border-radius:11px}
/* ── Y LA REDONDA SIGUE SIENDO REDONDA ──
   `.bvM .baldosa` y `.baldosa.redon` valen lo mismo, así que gana la que está
   más abajo: sin esta línea, el pack Burbuja se muestra CUADRADO en la
   bienvenida y redondo en el cajón, o sea que la muestra miente. */
.bvM .baldosa.redon{border-radius:50%}
.bvM .baldosa .glf{width:64%;height:64%}
#bvPie{display:flex;gap:10px;padding-top:16px}
.bvBt{flex:1;height:46px;border:0;border-radius:16px;cursor:pointer;
  font-weight:800;font-size:14px;line-height:1;color:#06263f;background:var(--acento);
  box-shadow:0 8px 18px rgba(2,18,40,.34)}
.bvBt.sec{flex:0 0 34%;color:#fff;background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

/* ══════════ EL CENTRO DE CONTROL ══════════
   Baja desde arriba, ocupa lo que necesita y deja ver el fondo debajo: es una
   hoja de vidrio, no una pantalla. El velo de atrás es lo que hace que tocar
   afuera se lea a «cerrar». */
#cc{position:fixed;inset:0;z-index:7;pointer-events:none;
  background:rgba(2,14,30,0);transition:background .26s ease}
#cc.on{pointer-events:auto;background:rgba(2,14,30,.42)}
/* ── CERRADO NO CUESTA UNA PASADA DE FILTRO ──
   Es la regla de la vuelta 123: un `backdrop-filter` sobre una pieza escondida
   se compone igual, y en este launcher lo que cuesta es la PASADA y no el
   radio. La hoja mide 412 × 481 px, o sea la segunda pieza más grande después
   del cajón: dejarla filtrando todo el tiempo para no mostrar nada sería
   deshacer justo lo que esa vuelta midió. `visibility` además la saca del
   compositor, que `transform` fuera de pantalla no garantiza. */
#cc:not(.on){visibility:hidden}
#cc:not(.on) #ccHoja{backdrop-filter:none;-webkit-backdrop-filter:none}
#bienv:not(.on){visibility:hidden}
#bienv:not(.on) #bvCaja{backdrop-filter:none;-webkit-backdrop-filter:none}
/* ── Y TIENE QUE TAPAR ──
   La primera versión iba al 13 % de blanco y el widget del reloj y la barra de
   búsqueda se leían A TRAVÉS de la hoja: dos relojes y dos fechas en el mismo
   sitio, que no es vidrio, es una hoja que no llegó. El tinte es el mismo
   degradado del cajón —que ya está calibrado contra este fondo— más el
   desenfoque, que es lo que de verdad separa una capa de la otra. */
#ccHoja{position:absolute;left:0;right:0;top:0;
  padding:calc(var(--ins-t,24px) + 14px) 14px 10px;
  border-radius:0 0 30px 30px;
  background:linear-gradient(180deg,rgba(9,44,84,.40) 0%,rgba(8,38,74,.50) 45%,rgba(6,30,60,.60) 100%);
  backdrop-filter:blur(34px) saturate(118%) brightness(.84);
  -webkit-backdrop-filter:blur(34px) saturate(118%) brightness(.84);
  box-shadow:0 18px 42px rgba(2,18,40,.42),
    inset 0 -1.5px 0 rgba(255,255,255,.34),
    inset 0 1px 0 rgba(255,255,255,.30);
  transform:translateY(-102%);transition:transform .34s cubic-bezier(.22,1,.3,1)}
#cc.on #ccHoja{transform:translateY(0)}
#ccTop{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;
  gap:0 10px;padding:0 6px 12px}
#ccHora{font-weight:800;font-size:34px;line-height:1;letter-spacing:-.5px;
  text-shadow:0 1px 0 rgba(0,20,40,.34),0 2px 12px rgba(0,20,40,.30)}
#ccFecha{font-weight:600;font-size:12px;line-height:1.2;opacity:.86}
#ccBat{font-weight:700;font-size:13px;line-height:1;opacity:.92}
/* ── LOS DOS DESLIZADORES SON PASTILLAS Y NO RANURAS ──
   El dedo va sobre la pastilla entera: una ranura de cuatro píxeles con un
   pomo es imposible de agarrar de primera en un teléfono, y acá se agarra
   justo cuando la pantalla está a oscuras o el volumen molesta. */
#ccSlids{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 4px 12px}
.ccSl{position:relative;height:56px;border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 0 0 1px rgba(255,255,255,.16),
    inset 0 -8px 14px rgba(0,40,80,.14);
  display:flex;align-items:center;touch-action:none;cursor:pointer}
.ccSlF{position:absolute;left:0;top:0;bottom:0;width:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.24));
  transition:width .06s linear}
.ccSlI{position:relative;padding-left:14px;font-size:19px;
  text-shadow:0 1px 2px rgba(0,20,40,.44)}
#ccReja{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;padding:0 2px 8px}
.ccB{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.ccB .ccGl{width:26px;height:26px;fill:#fff;
  filter:drop-shadow(0 1px 2px rgba(0,30,60,.42))}
/* la pastilla redonda del interruptor: es la misma pieza de vidrio que la
   baldosa del pack `burbuja`, así que el centro se lee de la misma familia */
.ccB::before{content:'';position:absolute}
.ccB{position:relative;padding-top:52px}
.ccB .ccGl{position:absolute;top:13px}
.ccB::before{left:50%;top:0;width:48px;height:48px;margin-left:-24px;border-radius:50%;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.52),inset 0 0 0 1px rgba(255,255,255,.16),
    inset 0 -7px 12px rgba(0,40,80,.16);
  transition:background .18s ease,box-shadow .18s ease}
.ccB.on::before{background:var(--acento);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.66),0 0 16px -2px var(--acento)}
.ccB:active::before{transform:scale(.93)}
/* ── EL RÓTULO VA EN DOS LÍNEAS, Y NO ES UN GUSTO ──
   Con una sola línea y puntos suspensivos, en inglés tres de los doce salían
   ilegibles —«Mobile ...», «Bluetoo...», «Do not ...»— o sea que el rótulo
   dejaba de decir qué hace el botón, que es todo su trabajo. Acortar las
   cadenas arreglaría el inglés y volvería a romper con el próximo idioma; y
   medir el ancho por rótulo son doce medidas × tres idiomas para algo que el
   propio navegador sabe hacer. Dos líneas con **alto fijo** los dejan entrar a
   todos, y el alto fijo es la parte importante: sin él la fila de tres palabras
   mide más que la de una y la reja da un salto. */
/* El alto va en `em`: 2,4em con `line-height:1.2` son **dos cajas de línea
   justas** contadas contra el propio tamaño de letra, así que no hay ningún
   número que recalcular si mañana cambia el cuerpo. */
.ccT{font-weight:600;font-size:10px;line-height:1.2;text-align:center;opacity:.9;
  width:84px;height:2.4em;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
/* ── EL ATAJO LLEVA SU FLECHITA, Y ESO NO ES ADORNO ──
   Es lo único que separa «esto prende la linterna» de «esto te lleva a donde se
   prende el wifi». Sin la marca, los doce se leen como llaves y once mienten. */
.ccB.atajo::after{content:'↗';position:absolute;top:2px;left:calc(50% + 12px);
  font-weight:700;font-size:10px;line-height:1;opacity:.66;text-shadow:0 1px 2px rgba(0,20,40,.5)}
/* ── LOS DE ACCESIBILIDAD NO LLEVAN ↗, PORQUE NO ABREN NINGÚN PANEL ──
   Hacen la cosa: bajan la barra del sistema, muestran recientes o bloquean.
   Su marca es un punto, y sólo aparece cuando falta el permiso — o sea que la
   marca dice «esto todavía no funciona» y no «esto es un atajo». */
.ccB.acc.falta::after{content:'';position:absolute;top:6px;left:calc(50% + 13px);
  width:6px;height:6px;border-radius:50%;background:#ffd166;
  box-shadow:0 0 6px rgba(255,209,102,.8)}
.ccB.acc.falta{opacity:.62}
/* ── LA LISTA DE NOTIFICACIONES ──
   Cada fila es una tarjeta de vidrio: icono, título con el tiempo, texto, y la
   × sólo si esa notificación se puede descartar (las persistentes no). */
#ccNotis{display:flex;flex-direction:column;gap:7px;padding:4px 2px 10px;
  max-height:38vh;overflow-y:auto;overscroll-behavior:contain}
.ccNCab{display:flex;align-items:center;justify-content:space-between;
  padding:2px 6px 2px;font-weight:800;font-size:10px;line-height:1;letter-spacing:.10em;opacity:.72}
.ccNLimpia{border:0;background:none;color:#fff;cursor:pointer;
  font-weight:700;font-size:10px;line-height:1;opacity:.82;padding:4px 2px}
.ccN{position:relative;display:flex;align-items:center;gap:10px;
  padding:9px 30px 9px 10px;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.11);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 0 0 1px rgba(255,255,255,.10)}
.ccN:active{background:rgba(255,255,255,.20)}
.ccNIco{width:26px;height:26px;flex:0 0 auto;border-radius:8px;object-fit:contain}
.ccNTxt{min-width:0;flex:1}
.ccNT{font-weight:700;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccNX{font-weight:500;font-size:11px;line-height:1.3;opacity:.80;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccNX2{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:14px;line-height:1}
/* ── Y EL AVISO NO ES UNA LISTA VACÍA ──
   Sin el permiso del sistema la lista SIEMPRE está vacía, y vacía se lee a «no
   tenés notificaciones»: es falso y no dice qué hacer. */
.ccAviso{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:18px;
  background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ccAviso span{font-weight:600;font-size:11px;line-height:1.4;opacity:.88}
.ccAviso .ccBt{height:38px;border:0;border-radius:13px;cursor:pointer;
  font-weight:800;font-size:12px;line-height:1;color:#06263f;background:var(--acento)}
.ccVacio{font-weight:600;font-size:11px;line-height:1.3;opacity:.6;text-align:center;padding:10px 8px}
#ccPie{font-weight:600;font-size:10px;line-height:1.35;opacity:.62;text-align:center;padding:2px 10px 6px}
#ccManija{height:22px;display:flex;align-items:center;justify-content:center}
#ccManija i{width:44px;height:4px;border-radius:3px;background:rgba(255,255,255,.62)}

/* ── SÓLO PARA MEDIR ──
   Apaga el vidrio de todo lo que lo tiene, que es la única forma de saber qué
   parte del costo de un cuadro es del agua y qué parte es del compositor
   rehaciendo treinta desenfoques. No la usa el juego. */
/* ── SÓLO LAS BALDOSAS QUE SE VEN LLEVAN VIDRIO ──
   Medido con 150 apps y el cajón abierto: **159 pasadas de `backdrop-filter` y
   874.179 píxeles filtrados**, y 150 de esas pasadas son las baldosas. La regla
   de la vuelta 123 sigue valiendo — lo que cuesta es la PASADA, no el radio —
   así que el problema no es cuánto desenfoca cada una sino que haya ciento
   cincuenta.
   En el cajón entran unas quince a la vez. Un `IntersectionObserver` les pone
   `lejos` a las que están fuera de la ventana y ahí el vidrio no cuesta nada:
   filtrar lo que nadie ve es trabajo puro. El margen del observador es de
   cuatro filas, así que ninguna aparece sin vidrio al scrollear. */
#cajLista .ap.lejos .baldosa{backdrop-filter:none;-webkit-backdrop-filter:none}
body.sinVidrio *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.sinBald .baldosa{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.sinPanel .vid,body.sinPanel #cajon,body.sinPanel #menu,body.sinPanel .hoja{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.sinRefr .vid.refr{backdrop-filter:var(--v-filR)!important;
  -webkit-backdrop-filter:var(--v-filR)!important}
body.blurBajo{--v-fil:blur(4px) saturate(112%) brightness(.94);
  --v-filR:blur(4px) saturate(112%) brightness(.94)}

/* ══════════ LO CERRADO NO FILTRA NADA ══════════
   ── EL HALLAZGO MÁS GRANDE DE LA VUELTA, Y NO SE VE EN NINGUNA CAPTURA ──
   `#cajon`, `#menu`, `#pers`, `#carp`, `#ini`, `#asis` y `#velo` viven SIEMPRE
   en el documento: cerrados se corren fuera de pantalla con un `transform` o se
   apagan con `opacity`. Pero un `backdrop-filter` no se apaga porque el
   elemento esté corrido: el compositor lo sigue calculando. O sea que el
   launcher estaba haciendo, en cada cuadro y para siempre, un desenfoque de 34
   píxeles a pantalla completa (el cajón), cinco refractados con
   `feDisplacementMap` (las cinco hojas) y un desenfoque más (el velo) para
   dibujar cosas que NO SE VEN.
   Un id más una clase le gana a dos clases, así que esto le gana a `.vid.refr`
   sin un solo `!important`. */
#cajon:not(.on),#velo:not(.on),#menu:not(.on),#pers:not(.on),#carp:not(.on),
#ini:not(.on),#asis:not(.on),#fondos:not(.on),#aviso:not(.on),
#cajon:not(.on) .vid,#cajon:not(.on) .baldosa,
#asis:not(.on) .vid,#pers:not(.on) .vid,#fondos:not(.on) .vid{
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* ══════════ EL VIDRIO MIENTRAS EL AGUA CORRE: SE QUEDA ══════════
   Acá vivía una escalera de tres escalones (`body.aguaN1..3`) que apagaba el
   vidrio mientras duraba la ráfaga, porque un lienzo que repinta la pantalla
   obliga a rehacer cada filtro en cada cuadro (medido: 47,6 ms contra 20,8).
   Desde la vuelta 130 el vidrio se queda: una clase en el `body` recalculaba el
   estilo del documento entero dos veces por toque y repintaba cada pieza, y
   además el ajuste que elegía el escalón estaba roto y caía siempre al último.
   Lo que queda de escalera es sacar la refracción de tres piezas, en línea y
   sin tocar el desenfoque (ver `aguaRefr` en `r.js`).

   ── LAS BALDOSAS DEL CAJÓN, MIENTRAS EL CAJÓN SE DESLIZA ──
   Un `backdrop-filter` anidado dentro de otro que se está MOVIENDO es una
   pasada que se rehace en cada cuadro de la transición, y en el cajón entran
   unas cuarenta a la vez encima de un desenfoque de 34 px a pantalla completa
   que también se mueve. Durante los 420 ms de la apertura las baldosas van sin
   filtro —su fondo de color ya las separa— y lo recuperan al asentarse. */
#cajon.on.abre .baldosa,#cajon.on.abre #cajBusca{
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* ── Y EL ESCRITORIO TAMPOCO FILTRA MIENTRAS LA HOJA VIAJA ──
   Medido con `cajCarga` durante el deslizamiento: **tres pasadas y 96.401 px**,
   y las tres son `.vid.refr`, o sea que además del desenfoque llevan el
   `feDisplacementMap` de `url(#refr)` — un filtro de SVG, que es lo que la
   vuelta 130 anotó que en un WebView puede caerse al procesador.

       #reloj    43.193 px      #dock  36.096 px      #buscaCaja  17.112 px

   Se rehacen en CADA cuadro de los 340 ms, y no por culpa de ellas: el fondo
   se está acercando (`#fondo.hondo`), o sea que su respaldo cambia. Con el
   vidrio de la hoja horneado, esto es lo único que quedaba filtrando.

   Y no hace falta que exista: **el dock lo tapa la hoja en los primeros
   cuadros** y las otras dos a los doscientos y pico de milisegundos. Las tres
   conservan su tinte, su borde y sus cinco sombras internas —o sea que siguen
   leyéndose a pieza de vidrio— y lo único que se van son 340 ms de desenfoque
   detrás de algo que está por taparse.

   Va por clase del `body` y no por `#cajon.on.abre` porque el CIERRE también
   desliza, y ahí `.on` ya no está. */
/* y las baldosas del DOCK con ellas: son `.baldosa` y no `.vid`, así que la
   regla de arriba no las alcanza —medido con el pack `cristal`, cuatro pasadas
   y 14.400 px seguían vivas durante los 340 ms— y el dock es justamente lo
   primero que la hoja tapa. */
body.cajMueve #capa .vid,body.cajMueve #capa .baldosa{
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* ── Y CON EL VIDRIO HORNEADO, LAS BALDOSAS TAMPOCO FILTRAN NADA ──
   Lo que una baldosa del cajón desenfoca es la hoja, y la hoja ya es un mapa de
   bits desenfocado a 34 px: **desenfocar 12 px lo que ya está desenfocado 34 no
   cambia la imagen**. Medido apagándolas sobre la misma captura del cajón
   asentado: **0,40 % de los píxeles cambian, con una media de 0,06 sobre 255**.

   Lo que sí cambia es lo que cuesta, y en dos sitios: las quince a cuarenta
   pasadas del cajón asentado, y —peor— el ESCALÓN del final del deslizamiento,
   donde `.abre` se sacaba y las quince se encendían todas en el mismo cuadro,
   justo cuando la hoja aterriza.

   La regla de `.abre` se queda igual: si no hay foto no hay horneado, y ahí el
   filtro de la hoja sigue vivo y las baldosas lo siguen anidando. */
#cajon.hor .baldosa,#cajon.hor #cajBusca{
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* ── Y LA HOJA SE QUEDA PROMOVIDA MIENTRAS SE MUEVE Y MIENTRAS ESTÁ PUESTA ──
   Sin el `backdrop-filter` la hoja dejó de necesitar una superficie de render
   propia, así que promoverla pasa a depender de que el navegador reconozca la
   transición de `transform`. La pista lo dice sin ambigüedad, y de paso le
   avisa al gestor de baldosas que este contenido va a entrar: lo que la vuelta
   130 vio en el video del teléfono —«la hoja a mitad de subida con SÓLO DOS
   baldosas pintadas»— es la firma de un rasterizado que llega tarde.
   No va permanente: son 412×892 a densidad 3, o sea trece megas de textura, y
   con el cajón cerrado y asentado no hay nada que sostener. */
#cajon.on,#cajon.abre{will-change:transform}
.baldosa::after{content:'';position:absolute;left:6%;right:6%;top:0;height:46%;
  border-radius:0 0 60% 60%/0 0 34% 34%;
  background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(255,255,255,0));
  pointer-events:none}
.baldosa img{width:var(--icoImg);height:var(--icoImg);display:block;
  filter:drop-shadow(0 2px 3px rgba(0,30,60,.35))}
/* ── SOBRE TEXTURA, EL ICONO NECESITA MÁS SOMBRA ──
   El agua y el pasto tienen contraste propio: con la sombra floja, un logo claro
   —que son la mitad— se pierde adentro de las cáusticas. Y un velo oscuro debajo
   del icono, que es lo que separa la marca del fondo sin taparlo. */
body.icoTex .baldosa img{filter:drop-shadow(0 2px 5px rgba(0,26,54,.62))
  drop-shadow(0 0 12px rgba(0,30,62,.45))}
/* el velo va DENTRO de `--bTex` y no en un `::before`: un pseudo posicionado
   crea contexto de apilado y le queda ENCIMA a la inicial de la baldosa, que es
   texto del propio elemento. Medido en la vista previa: las letras salían
   apagadas justo con la textura puesta. */
body.icoTex .baldosa{text-shadow:0 1px 3px rgba(0,26,54,.75),0 0 10px rgba(0,30,62,.6)}
.ap .nom{font-size:11px;font-weight:600;letter-spacing:.01em;max-width:74px;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,30,62,.95),0 1px 6px rgba(0,36,72,.85),0 0 14px rgba(0,40,80,.6)}

/* ══════════ PUNTOS DE PÁGINA ══════════ */

.pt{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.32);
  transition:all .25s}
.pt.on{background:#fff;width:18px;border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.8)}

/* ══════════ DOCK ══════════ */
#dock{flex:0 0 auto;margin:0 14px;padding:10px 6px 8px;border-radius:30px;
  display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:0}
#dock.vacio{visibility:hidden}

/* ══════════ CAJÓN ══════════ */
/* ── LA HOJA ESMERILADA DEJA VER EL FONDO, Y ESO NO ES ADORNO ──
   Con el tinte al 90% el cajón tapaba el cielo entero y la mitad de arriba del
   teléfono se volvía un rectángulo azul plano: se perdía justo lo único que
   este launcher tiene para mostrar. El desenfoque hace el trabajo de separar
   los iconos del fondo; el tinte sólo tiene que garantizar que el texto blanco
   se lea sobre lo más claro que el cielo pueda ponerse al mediodía. */
#cajon{position:fixed;inset:0;z-index:3;transform:translateY(100%);
  transition:transform .34s cubic-bezier(.22,.9,.24,1);
  /* ── EL CAJÓN NECESITA MÁS QUE EL INSET ──
     El inset es donde TERMINA la barra de estado; pegar la búsqueda ahí deja el
     borde del vidrio rozando los iconos del sistema, que es lo que se vio en el
     teléfono. Ocho píxeles de aire lo separan sin comerse pantalla. */
  display:flex;flex-direction:column;padding:calc(var(--ins-t) + 8px) 0 var(--ins-b);
  background:linear-gradient(180deg,rgba(9,44,84,.34) 0%,rgba(8,38,74,.44) 40%,rgba(6,30,60,.56) 100%);
  backdrop-filter:blur(34px) saturate(118%) brightness(.84);
  -webkit-backdrop-filter:blur(34px) saturate(118%) brightness(.84)}
/* ── CON EL VIDRIO HORNEADO, LA HOJA NO FILTRA NADA ──
   El degradado del tinte se queda en el CSS y el mapa de bits entra como
   segunda capa: así el tinte sigue siendo un valor vivo y lo único que pone el
   JavaScript es la foto. `100% 100%` y no `cover` porque el horneado ya se hizo
   en espacio de pantalla, o sea que su proporción ES la de la hoja.
   Ver `cajFrostHornea` en `c.js`. */
#cajon.hor{
  background-image:linear-gradient(180deg,rgba(9,44,84,.34) 0%,rgba(8,38,74,.44) 40%,rgba(6,30,60,.56) 100%),var(--cajFrost);
  background-size:auto,100% 100%;background-repeat:no-repeat;
  backdrop-filter:none;-webkit-backdrop-filter:none}
/* ── Y CON LA HOJA OPACA, EL ESCRITORIO DE ATRÁS NO SE VE ──
   El horneado es un JPEG: cubre la hoja entera y la hoja cubre la pantalla
   entera, así que con el cajón asentado no queda un solo píxel del escritorio a
   la vista. Pero sus cuatro piezas de vidrio se seguían filtrando —el reloj, la
   búsqueda, el dock y las baldosas— y filtrar lo que nadie ve es trabajo puro,
   que es la misma lección de la vuelta 129 con las baldosas de afuera de la
   ventana. Se apaga recién cuando la hoja LLEGÓ: durante los 340 ms del
   deslizamiento el escritorio asoma por encima del canto y apagarlo ahí sería
   un parpadeo. Y sólo con `.hor`: sin horneado la hoja es translúcida y esto se
   vería. */
body.cajQ #capa{visibility:hidden}
/* ── EL ARRASTRE VA POR VARIABLE Y NO POR `style.transform` ──
   Escribiendo el transform inline, `verCajon(false)` saca `.on` pero el inline
   le gana por especificidad y el cajón queda clavado donde estaba el dedo.
   Con una variable que sólo lee la regla `.on`, cerrar vuelve a valer siempre:
   sin `.on` no hay quien la mire. */
#cajon{--caj-y:0px}
#cajon.on{transform:translateY(var(--caj-y))}
#cajon.tira{transition:none}
#cajTit{flex:0 0 auto;padding:0 20px 4px;font-size:10px;font-weight:700;
  letter-spacing:.16em;opacity:.72;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,20,45,.6)}
/* ── LA BÚSQUEDA VIVE ADENTRO DEL CAJÓN ──
   Estaba en el escritorio, o sea DEBAJO del cajón: enfocarla abría el cajón y
   el cajón la tapaba, así que se escribía a ciegas — medido, tecleando «mer»
   la lista filtraba y el cuadro de texto no se veía por ningún lado. Hay un
   solo campo que recibe letras y está donde se está mirando; el del escritorio
   pasa a ser el botón que lo abre. */
#cajBusca{flex:0 0 auto;margin:0 12px 6px;padding:0 13px;height:40px;
  display:flex;align-items:center;gap:9px;border-radius:20px}
#cajBusca input{flex:1;background:none;border:0;outline:none;color:#fff;
  font:600 14px/1 system-ui,sans-serif;min-width:0}
#cajBusca input::placeholder{color:rgba(255,255,255,.82);font-weight:500}
#cajBusca input::-webkit-search-cancel-button{-webkit-appearance:none}
/* ── LA MANIJA: SE VE Y SE AGARRA ──
   `touch-action:none` es todo el arreglo de «no baja»: acá el gesto vertical es
   nuestro y el navegador no lo cancela a mitad de camino. */
#cajManija{flex:0 0 auto;height:20px;display:flex;align-items:center;
  justify-content:center;touch-action:none;cursor:grab}
#cajManija i{width:40px;height:4px;border-radius:3px;background:rgba(255,255,255,.62);
  box-shadow:0 0 10px rgba(255,255,255,.4)}
#cajon.tira #cajManija{cursor:grabbing}

#cajCuerpo{flex:1 1 auto;min-height:0;display:flex;position:relative}
#cajLista{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-y;display:grid;grid-template-columns:repeat(var(--cols),1fr);
  align-content:start;gap:2px 0;padding:4px 26px 26px 10px}
/* la fila de buscar en la web y el «sin resultados» cruzan la reja entera */
#cajLista .vacio{grid-column:1/-1;text-align:center;opacity:.72;padding:22px 12px 6px;
  font-size:14px;text-shadow:0 1px 3px rgba(0,20,45,.7)}
#cajLista .web{grid-column:1/-1;margin:10px 6px 0;padding:12px 14px;border-radius:18px;
  display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;
  text-shadow:0 1px 3px rgba(0,20,45,.7)}
#cajLista .web:active{background:rgba(255,255,255,.26)}
#cajLista .web .lupa{flex:0 0 auto;opacity:.9}
#cajLista .web span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* el encabezado de letra cruza la reja entera */
/* ── EL RESALTADO DEL RIEL EN EL CAJÓN «TODO JUNTO» ──
   Un aro del color de acento y la baldosa levantada: es lo único que puede
   decir «éstas son de esa letra» en una lista que no tiene encabezados. */
#cajLista.junto .ap{transition:transform .18s ease,opacity .18s ease}
#cajLista.junto .ap.res{transform:scale(1.06)}
#cajLista.junto .ap.res .baldosa{box-shadow:0 6px 16px rgba(4,26,52,.34),
  0 0 0 2.5px var(--acento),0 0 14px -2px var(--acento)}
#cajLista.junto.hayRes .ap:not(.res){opacity:.45}
#cajLista .let{grid-column:1/-1;padding:7px 6px 1px;font:800 10px/1 system-ui,sans-serif;
  letter-spacing:.18em;opacity:.9;color:var(--acento);
  text-shadow:0 1px 3px rgba(0,20,45,.7)}

/* ── EL RIEL DE LETRAS ──
   Sólo lleva las letras que TIENEN apps: un riel con las 26 fijas manda a la
   nada en la mitad de los toques, y eso se siente a que el riel está roto. */
/* ── EL ÍNDICE ES UNA BARRA, NO UNA COLUMNA DE LETRAS ──
   Pedido textual: «el buscador por letra lo quería así por la barra nomás».
   Y es mejor: una columna con las 26 letras a 10 px es un blanco de diez
   píxeles por letra, se lee a lista de tipos y ocupa ancho permanente. Una
   barra fina —la de Xiaomi, la de iOS— no ocupa nada, se agarra donde uno la
   ve, y la letra sale en una burbuja mientras el dedo va. El ancho de la zona
   sensible NO es el de la barra: la barra mide 4 px y la zona 30, porque hay
   que poder agarrarla sin apuntar. Y los 30 arrancan a 12 px del canto, que es
   lo que deja afuera al gesto de «atrás» de Android. */
#riel{position:absolute;top:0;bottom:0;right:0;width:30px;touch-action:none;
  display:flex;align-items:center;justify-content:center;z-index:2;
  user-select:none;-webkit-user-select:none}
#rielPista{position:absolute;top:10px;bottom:10px;right:13px;width:4px;
  border-radius:2px;background:rgba(255,255,255,.16)}
#rielPomo{position:absolute;right:12px;width:6px;border-radius:3px;
  background:rgba(255,255,255,.62);box-shadow:0 0 8px rgba(255,255,255,.5);
  transition:width .14s,background .14s,box-shadow .14s}
#riel.on #rielPomo{width:8px;right:11px;background:var(--acento);
  box-shadow:0 0 14px color-mix(in srgb,var(--acento) 80%,transparent)}

/* la burbuja con la letra grande, sólo mientras el dedo va por el riel */
#burbuja{position:absolute;right:44px;top:50%;transform:translateY(-50%) scale(.7);
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font:800 30px/1 system-ui,sans-serif;color:#062a44;
  background:radial-gradient(circle at 34% 28%,#eafcff,#8fe0f7 62%,#4fc0e8);
  box-shadow:0 8px 22px rgba(0,40,80,.45),inset 0 2px 0 rgba(255,255,255,.9);
  opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:3}
#burbuja.on{opacity:1;transform:translateY(-50%) scale(1)}

/* ── LA MASCOTA ES EL MODELO 3D DEL USUARIO, RIGGEADO ──
   Ya no son láminas: es la malla generada a partir de su propio render, con 23
   huesos, y las cinco animaciones se escriben sobre esos huesos (ver `g.js`).
   Eso es lo que permite que duerma SENTADA —una pose que ninguna biblioteca de
   clips del proveedor tiene y que pedida como lámina volvió de pie— y que el
   cabeceo se mezcle encima sin pelearse con la animación. */
/* El recorte va en `#mVent` y no en `#mascota` porque las zetas del sueño salen
   POR ENCIMA de la cabeza: recortando arriba de todo, la mitad del gesto se
   pierde. */
/* ── DOS SITIOS Y UN SOLO ELEMENTO ──
   Reparentar el lienzo movería el contexto de WebGL de un lado al otro en cada
   apertura del cajón; con `position:fixed` y dos reglas, lo único que cambia es
   dónde y cuánto mide. En el escritorio es GRANDE —es lo único que hay en esa
   franja, que está vacía a propósito— y en el cajón es chica, porque ahí lo que
   importa es la lista. */
#mascota{position:fixed;left:50%;z-index:3;
  bottom:var(--masc-b);width:var(--masc-w);height:var(--masc-h);
  margin-left:calc(var(--masc-w)/-2);
  opacity:0;transform:translateY(14px) scale(.86);pointer-events:none;
  transition:opacity .22s ease,transform .28s cubic-bezier(.22,1.4,.36,1),
             width .26s ease,height .26s ease,bottom .26s ease;
  filter:drop-shadow(0 8px 18px rgba(0,40,80,.55))}
#mascota.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;cursor:pointer}
#mascota:active{filter:drop-shadow(0 4px 10px rgba(0,40,80,.6)) brightness(1.12)}
/* ── EL LIENZO SE DIBUJA CHICO Y CSS LO ESTIRA ──
   Y ahí el pixelado que se pidió y la optimización son LA MISMA COSA: se
   rellenan 64×83 píxeles en vez de 139×180, o sea cinco veces menos, y el
   escalón que deja `pixelated` pega con un muñeco que ya es de vóxeles. Un
   filtro de pixelado encima habría costado los 139×180 igual. */
#mVent{width:100%;height:100%;overflow:hidden}
#mLien{width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
/* el cabeceo va encima del esqueleto: es de la CÁMARA, no del muñeco, así que
   no hay que gastarle huesos */
#mascota.on{animation:chill 1.32s ease-in-out infinite alternate}
@keyframes chill{from{transform:translateY(2px) rotate(-3deg)}
                 to  {transform:translateY(-4px) rotate(3deg)}}
/* ── LAS ZETAS VAN DIBUJADAS POR CÓDIGO ──
   Pedidas con todas las letras: «durmiendo con z saliendo de su cabeza». No van
   en la hoja generada por dos razones: pesan cero, y sobre todo se MUEVEN — una
   zeta quieta pintada en el cuadro se lee a calcomanía. Salen de un costado de
   la cabeza, suben y se apagan, las tres desfasadas: con las tres en fase se
   leen a un solo gesto repetido. */
/* el 18% del alto de la celda es donde arranca la cabeza en los cuadros del
   sueño (medido: 28 px de 151), así que la zeta sale de la sien y no del aire */
#mZ{position:absolute;left:60%;top:18%;width:0;height:0}
#mZ span{position:absolute;font:800 13px/1 system-ui,sans-serif;color:#eafcff;
  text-shadow:0 1px 3px rgba(0,36,72,.95),0 0 8px rgba(0,44,86,.7);opacity:0}
#mZ span:nth-child(2){font-size:11px}
#mZ span:nth-child(3){font-size:9px}
#mascota.zzz #mZ span{animation:zeta 2.7s ease-out infinite}
#mascota.zzz #mZ span:nth-child(2){animation-delay:.9s}
#mascota.zzz #mZ span:nth-child(3){animation-delay:1.8s}
@keyframes zeta{
  0%  {opacity:0;transform:translate(0,6px) scale(.55) rotate(-10deg)}
  16% {opacity:1}
  100%{opacity:0;transform:translate(22px,-26px) scale(1.2) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){
  #mascota.on{animation:none}
  #mascota.zzz #mZ span{animation:none;opacity:.85}}
/* ── EL TIRADOR SE VE Y NO SE TOCA ──
   Medido: la barra caía en y 848-874 y el dock termina en 876, así que se le
   montaba encima 26 px justo sobre dos de los cuatro iconos —
   `elementFromPoint(206, 870)` devolvía `tirador`, o sea que el dedo que iba a
   una app abría el cajón. El gesto de subir vive en el escritorio, en la fila
   de puntos y en el dock (ver `enganchaSubir`); esto es sólo la marca que dice
   que ese gesto existe. */
#tirador{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--ins-b) + 2px);width:120px;height:26px;z-index:2;
  pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
#tirador i{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.55);
  box-shadow:0 0 10px rgba(255,255,255,.45)}

/* ══════════ MENÚ DE UNA APP ══════════ */
#velo{position:fixed;inset:0;z-index:4;background:rgba(4,24,48,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
/* ══════════ EL ASISTENTE ══════════
   ── ES UNA HOJA Y NO UNA PANTALLA APARTE ──
   Lo que se le pide cambia el launcher que está DETRÁS —el tamaño de los
   iconos, las columnas, la mascota—, así que taparlo entero con un panel opaco
   sería esconder justo lo que uno acaba de mandar a cambiar. Sube desde abajo,
   ocupa el 72% del alto y el resto queda a la vista a través del velo. */
#asis{position:fixed;z-index:6;left:0;right:0;bottom:0;height:72%;
  border-radius:28px 28px 0 0;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:10px 12px calc(var(--ins-b) + 10px)}
#asis.on{transform:translateY(0)}
#asCab{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;flex:0 0 auto}
#asTit,#persTit{flex:1 1 auto;font-size:16px;font-weight:800;letter-spacing:.01em}
.asBtn{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:16px;cursor:pointer;
  background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.asBtn:active{background:rgba(255,255,255,.26)}
#asLista{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px}
.asMsg{max-width:86%;padding:9px 13px;border-radius:16px;font-size:14px;
  line-height:1.35;white-space:pre-wrap;word-break:break-word;
  text-shadow:0 1px 2px rgba(0,25,52,.6)}
.as-yo{align-self:flex-end;background:color-mix(in srgb,var(--acento) 26%,transparent);

  border:0;outline:0;color:#fff;font-weight:600;font-size:14px;line-height:1;padding:12px 14px;

/* la llave se pide en un cajoncito que está cerrado por omisión: es lo que uno
   toca una vez y no vuelve a mirar, y ocupa el sitio del teclado */
#asLlaveCaja{flex:0 0 auto;display:none;flex-direction:column;gap:8px;
  padding:10px;border-radius:18px;background:rgba(0,22,48,.30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);margin-bottom:8px}
#asLlaveCaja.on{display:flex}

  font-weight:700;font-size:12px;line-height:1;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

/* ══════════ PERSONALIZACIÓN ══════════
   Misma familia que la hoja del asistente: sube desde abajo y deja ver el
   launcher detrás, porque TODO lo que se toca acá cambia lo que está atrás. */
/* ── LA HOJA MIDE MENOS QUE LA DEL ASISTENTE, Y ES POR EL PREVIO ──
   Con 86 % la hoja llegaba a 632 px de 892 y arriba quedaban 104 px libres
   entre el widget y su borde: ahí no entra una mascota de 202, así que los
   cinco botones de pose no mostraban nada. Con 64 % quedan 320 px de franja
   —lo único que este panel tiene para enseñar— y el cuerpo, que ya scrollea,
   no pierde un solo control. */
#pers{position:fixed;z-index:6;left:0;right:0;bottom:0;max-height:64%;
  border-radius:28px 28px 0 0;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:10px 12px calc(var(--ins-b) + 12px)}
#pers.on{transform:translateY(0)}
/* ── Y LA FRANJA SE DESPEJA ──
   El reloj y la barra de búsqueda no los cambia ningún control del panel, y
   son justo lo que se interpone entre el ojo y la mascota. Lo que sí queda
   es la reja, que es lo que mueven el tamaño de icono y las columnas. */
body.pers #reloj,body.pers #buscaCaja{opacity:0;pointer-events:none;
  transition:opacity .22s ease}
/* ── Y LA MASCOTA SUBE POR ENCIMA DEL VELO ──
   El velo desenfoca 3 px todo lo que queda debajo, y lo que este panel tiene
   que dejar ver nítido es justamente el muñeco. Entre el velo (4) y la hoja (6)
   hay un escalón libre; el menú de app, que también vive en 5, lo cierra
   `persAbre` antes de abrir. */
body.pers #mascota{z-index:5}
#persCuerpo{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:2px 2px 6px;display:flex;flex-direction:column;gap:14px}


/* ══════════════════════ LAS ANIMACIONES ══════════════════════
   Pedido: «necesito animaciones, muchas».
   ── LA REGLA QUE LAS HACE POSIBLES A TODAS ──
   Sólo se animan `transform` y `opacity`. Son las dos únicas propiedades que el
   compositor resuelve sin volver a maquetar ni a repintar, y por eso son las
   únicas que pueden ir a 120 cuadros por segundo con treinta iconos en
   pantalla. Animar `width`, `top`, `box-shadow` o `filter` sobre una lista es
   pedirle al navegador que rehaga la página en cada cuadro. */

/* ── LOS ICONOS ENTRAN ESCALONADOS ──
   Todos a la vez es un bloque que aparece; escalonados de a 18 ms se lee a que
   la reja se llena. `--i` lo escribe quien pinta, y es el índice del icono. */
@keyframes apEntra{
  from{opacity:0;transform:translateY(14px) scale(.82)}
  to{opacity:1;transform:none}}
.ap.entra{animation:apEntra .34s cubic-bezier(.2,1.1,.3,1) backwards;
  animation-delay:calc(var(--i,0)*18ms)}
/* el cajón trae muchos más, así que el escalón es más corto o la última fila
   entraría medio segundo tarde */
#cajLista .ap.entra{animation-duration:.28s;animation-delay:calc(var(--i,0)*11ms)}
#carpRejilla .ap.entra{animation-delay:calc(var(--i,0)*28ms)}

/* ── APRETAR UN ICONO SE SIENTE ──
   Sin esto no hay forma de saber si el toque entró hasta que la app abre, que
   en un teléfono lento es medio segundo de nada. */
.ap{transition:transform .13s cubic-bezier(.3,1.4,.4,1)}
.ap:active{transform:scale(.9)}
body.arrastrando .ap{transition:none}

/* ── LA CUADRÍCULA DEL ARRASTRE ──
   Vive dentro de `#hoja` y no encima de todo: tiene que quedar DEBAJO del
   fantasma que sigue al dedo —si no, la casilla encendida taparía justo el
   icono que se está llevando— y por encima de la reja de apps, que es lo que
   la hace legible sobre iconos claros.
   Punteada la vacía y llena la que está bajo el dedo: con las veinte iguales,
   la cuadrícula dice dónde están las celdas pero no en cuál va a caer. */
#reja{position:absolute;inset:0;pointer-events:none;z-index:3;
  opacity:0;transition:opacity .16s ease}
#reja.on{opacity:1}
#reja i{position:absolute;border-radius:16px;
  border:1.5px dashed rgba(255,255,255,.30);
  background:rgba(255,255,255,.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13);
  transition:background .12s ease,border-color .12s ease,box-shadow .12s ease}
#reja i.aqui{border-style:solid;border-color:rgba(255,255,255,.82);
  background:rgba(190,232,255,.20);
  box-shadow:0 0 16px rgba(140,214,255,.5),inset 0 1px 0 rgba(255,255,255,.42)}

/* ── ABRIR UNA APP: EL ICONO SE COME LA PANTALLA ──
   El launcher entero se va hacia el icono que se tocó —de ahí `--zx`/`--zy`— y
   el icono crece y se apaga. Es la animación que dice «esto se convirtió en
   aquello» en vez de «la pantalla parpadeó». */
body.abriendo #capa,body.abriendo #dock,body.abriendo #cajon{
  transform-origin:var(--zx,50%) var(--zy,50%);
  transition:transform .17s ease-in,opacity .17s ease-in;
  transform:scale(1.14);opacity:0}
.ap.saliendo{animation:apSale .17s ease-in forwards}
@keyframes apSale{to{transform:scale(2.2);opacity:0}}

/* ── LA HOJA DE UNA CARPETA CRECE DESDE SU BALDOSA ──
   El punto de origen lo escribe `carpOrigen` midiendo dónde está el icono. */
#carp{will-change:transform,opacity}

/* ── EL WIDGET ENTRA ──
   Una tarjeta que aparece de golpe empuja la reja de un cuadro al otro. */
@keyframes wEntra{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.wCard.entra{animation:wEntra .3s cubic-bezier(.2,1.1,.3,1) backwards;
  animation-delay:calc(var(--i,0)*45ms)}

/* ── Y NADA DE ESTO CORRE SI EL SISTEMA PIDE QUIETO ──
   No es una cortesía: hay gente a la que el movimiento le da náuseas, y el
   sistema ya tiene la respuesta. */
@media (prefers-reduced-motion:reduce){
  .ap.entra,.wCard.entra,.ap.saliendo,.ap.late .baldosa,.ap.destino .baldosa{animation:none}
  .ap,.ap.fantasma>*,#aviso,#carp{transition-duration:.01s}
  body.abriendo #capa,body.abriendo #dock,body.abriendo #cajon{transition-duration:.01s}
}

/* ══════════ ARRASTRAR, CARPETAS Y SALPICADURA ══════════ */
/* el que se está llevando se queda como hueco: sin eso parecen dos */
.ap.llevada{opacity:.18;pointer-events:none}
/* ── EL FANTASMA VA EN EL BODY Y NO EN LA REJA ──
   Adentro de `#tira` lo recortaría el `overflow` de la página y no podría cruzar
   al dock ni salir del cajón. */
.ap.fantasma{position:fixed;z-index:9;pointer-events:none;margin:0;
  left:0;top:0;will-change:transform;
  filter:drop-shadow(0 10px 22px rgba(0,30,60,.55))}
/* ── LA ESCALA VA EN EL HIJO ──
   El `transform` del fantasma lo escribe el dedo cuadro a cuadro; metiendo la
   escala ahí habría que reescribirla en cada movimiento y no habría transición
   de la que agarrarse. */
.ap.fantasma>*{transform:scale(1.04);
  transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.ap.fantasma.vivo>*{transform:scale(1.2)}
body.arrastrando{cursor:grabbing}
/* el que recibiría la carpeta: un aro, no un color, porque el icono tiene que
   seguir viéndose para saber con cuál se va a juntar */
.ap.destino .baldosa{box-shadow:0 0 0 3px var(--acento),0 6px 18px rgba(0,30,60,.45);
  animation:recibe .9s ease-in-out infinite}
@keyframes recibe{0%,100%{transform:scale(.88)}50%{transform:scale(.96)}}
/* la carpeta recién hecha late una vez: dos iconos que se funden en uno se lee
   a que uno de los dos se perdió si nada lo marca */
.ap.late .baldosa{animation:late .6s cubic-bezier(.2,1.4,.35,1)}
@keyframes late{0%{transform:scale(.72)}55%{transform:scale(1.12)}100%{transform:scale(1)}}

.cBald{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:calc(var(--ico)*.06);padding:calc(var(--ico)*.12);
  /* .baldosa es flex con align-items:center, y en una reja eso deja a cada hijo
     con la altura de su contenido — o sea CERO, porque son divs vacíos. Medido:
     columnas de 21 px y filas de 21, con los hijos en 0. Hay que reponerlo. */
  place-items:stretch;place-content:stretch;
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.14)}
.cMini{border-radius:26%;overflow:hidden;background:rgba(255,255,255,.2)}
.cMini img{width:100%;height:100%;display:block;object-fit:cover}
