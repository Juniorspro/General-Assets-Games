/* ── LA GALERÍA TIENE DOS SOLAPAS ──
   Un solo gesto —mantener el dedo en un hueco— y las dos cosas que se ponen en
   el escritorio. Con dos gestos distintos habría que enseñarle uno más a alguien
   que acaba de instalar el launcher. */
.fgTabs{display:flex;gap:6px}
.fgTab{padding:6px 12px;border-radius:13px;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;opacity:.6;cursor:pointer}
.fgTab.on{opacity:1;background:rgba(255,255,255,.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#fgWid{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
/* ── LA SOLAPA DE WIDGETS VA MÁS CERRADA QUE LA DE FONDOS ──
   La galería es translúcida para poder VER el fondo que se está eligiendo; en
   la de widgets no hay nada que mirar detrás —lo que se pone aparece ARRIBA de
   la hoja— y con el mismo velo los veinte renglones quedaban ilegibles sobre el
   agua. Medido mirando la captura: las apps del escritorio se leían a través de
   la lista. */
#fondos.wid{background:linear-gradient(180deg,rgba(4,26,52,0),rgba(4,26,52,.62) 10%,rgba(4,26,52,.80))}
.fgW{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:16px;
  background:rgba(6,28,54,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 0 0 1px rgba(255,255,255,.09);
  cursor:pointer}
.fgW.sel{background:rgba(12,52,96,.62);box-shadow:inset 0 0 0 2px var(--acento)}
.fgWN{flex:1;font-size:13px;font-weight:700}
.fgWT{font-size:11px;font-weight:800;opacity:.7}

/* ══════════ LA GALERÍA DE FONDOS ══════════
   Ocupa el 62 % de abajo y NO la pantalla entera: lo que se está eligiendo vive
   arriba —el reloj, el widget, el vidrio— y taparlo mientras se elige es elegir
   a ciegas. */
#fondos{position:fixed;left:0;right:0;bottom:0;height:62%;z-index:6;
  display:none;flex-direction:column;gap:10px;
  padding:12px 12px calc(var(--ins-b) + 12px);
  background:linear-gradient(180deg,rgba(4,26,52,0),rgba(4,26,52,.42) 14%,rgba(4,26,52,.62));
  transform:translateY(12px);opacity:0;transition:opacity .22s,transform .22s}
#fondos.on{display:flex;transform:none;opacity:1}
#fgCab{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;
  border-radius:18px}
#fgTit{flex:1;font-size:14px;font-weight:700;letter-spacing:.02em}
#fondos.wid #fgRejilla,#fondos.wid #fgMia{display:none}
#fondos:not(.wid) #fgWid{display:none}
#fondos.wid #fgGen,#fondos.wid #fgIdeas{display:none}
#fgGen{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px 0}
#fgGenT{flex:1;min-width:0;height:40px;padding:0 13px;border:0;border-radius:14px;
  outline:none;color:#fff;font-weight:600;font-size:12px;line-height:1;
  background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
#fgGenT::placeholder{color:rgba(255,255,255,.72);font-weight:500}
#fgGenB{flex:0 0 auto;height:40px;padding:0 15px;border:0;border-radius:14px;
  cursor:pointer;font-weight:800;font-size:12px;line-height:1;color:#06263f;background:var(--acento)}
#fgGenB:disabled{opacity:.6;cursor:default}
/* ── CANCELAR EXISTE PORQUE LA ESPERA MIDE HASTA 45 SEGUNDOS ──
   Medido contra el generador de verdad. Sin salida, el dueño que se
   arrepiente sólo puede mirar; y como el botón de generar queda apagado
   mientras tanto, la fila entera parecía muerta. */
#fgGenX{display:none;flex:0 0 auto;height:40px;padding:0 13px;border:0;border-radius:14px;
  background:rgba(255,255,255,.16);color:#fff;font:700 13px system-ui,sans-serif}
#fgGenX.on{display:block}
/* ── LAS IDEAS SON SEIS Y NO UNA LISTA LARGA ──
   Un campo de texto vacío no dice qué se puede pedir. Seis fichas cortas lo
   dicen y de paso son el camino de un toque para el que no quiere escribir. */
#fgIdeas{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:8px 12px 2px}
#fgIdeas .fgId{flex:0 0 auto;padding:7px 11px;border-radius:12px;cursor:pointer;
  font-weight:600;font-size:11px;line-height:1;background:rgba(255,255,255,.11);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#fgIdeas .fgId:active{background:rgba(255,255,255,.22)}
#fgRejilla{flex:1;overflow-y:auto;display:grid;gap:10px;
  grid-template-columns:repeat(3,1fr);align-content:start;padding:2px}
.fgIt{display:flex;flex-direction:column;gap:5px;cursor:pointer}
.fgMini{aspect-ratio:9/16;border-radius:14px;background-size:cover;
  background-position:center;
  box-shadow:0 4px 12px rgba(4,26,52,.34),inset 0 0 0 1px rgba(255,255,255,.22)}
/* el elegido lleva un aro y no un tilde: un tilde tapa la miniatura justo en el
   que uno quiere mirar */
.fgIt.sel .fgMini{box-shadow:0 4px 12px rgba(4,26,52,.34),
  0 0 0 3px var(--acento),inset 0 0 0 1px rgba(255,255,255,.5)}
.fgNom{font-size:10px;font-weight:600;text-align:center;opacity:.9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,30,62,.9)}
#fgArch{display:none}

/* ── LA SALPICADURA ES DOM Y NO EL LIENZO DEL AGUA ──
   Es otro efecto y de otra cosa: el del fondo es el agua de la pantalla, éste es
   la app cayendo en su sitio. Y así funciona aunque el lienzo de WebGL no exista
   —un aparato viejo, el fondo que no cargó— porque son doce spans. */
.salpi{position:fixed;z-index:8;pointer-events:none;width:0;height:0}
.salpi i{position:absolute;display:block;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95),rgba(150,225,255,.75) 55%,rgba(90,190,240,0) 100%)}
.sGota{animation:gota .52s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--gd)}
@keyframes gota{
  from{transform:translate(0,0) scale(.5);opacity:.95}
  to  {transform:translate(var(--gx),var(--gy)) scale(1);opacity:0}}
.sAro{width:12px;height:12px;margin:-6px 0 0 -6px;background:none;
  border:2.5px solid rgba(210,245,255,.9);animation:aro .5s ease-out forwards}
@keyframes aro{
  from{transform:scale(.3);opacity:.9}
  to  {transform:scale(5.4);opacity:0;border-width:.5px}}
@media (prefers-reduced-motion:reduce){.sGota,.sAro{animation:none;opacity:0}}

/* ══════════════════ LA CÁMARA AERO ══════════════════
   El visor es una TARJETA sobre el fondo Frutiger, no una imagen a sangre: eso
   es literalmente el pedido —«de fondo una foto frutiger que solamente se verán
   en las partes que no se vean la cámara»— y con el visor a pantalla completa
   no queda una sola parte donde el fondo se vea. */
#cam{position:fixed;inset:0;z-index:12;display:none;
  flex-direction:column;align-items:center;
  padding:calc(var(--ins-t,24px) + 6px) 0 calc(var(--ins-b,16px) + 6px)}
#cam.on{display:flex}
/* el fondo: la misma foto de la familia agua del pack, o sea la referencia que
   mandó el usuario. Va con su propio degradado encima para que el vidrio de
   arriba tenga contra qué contrastar. */
#camFondo{position:absolute;inset:0;z-index:0;
  background:linear-gradient(#0a3b6e,#0e6f9c 42%,#0b8fa8 70%,#0a5f86);
  background-size:cover;background-position:center}
#camFondo::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.30),transparent 62%),
             linear-gradient(180deg,rgba(4,26,48,.42),transparent 26%,transparent 72%,rgba(4,26,48,.52))}

/* ── EL VISOR ──
   `--asp` la pone `camPinta` desde la relación elegida; con `lleno` la tarjeta
   se estira y el marco se reduce a los cantos redondeados. */
#camVisorC{position:relative;z-index:2;width:calc(100% - 26px);flex:1;
  display:flex;align-items:center;justify-content:center;min-height:0}
#camVisor{position:relative;border-radius:26px;overflow:hidden;
  width:100%;aspect-ratio:var(--asp,0.75);max-height:100%;
  background:#04121f;
  box-shadow:0 18px 44px rgba(2,20,40,.55),
             inset 0 1px 0 rgba(255,255,255,.55),
             inset 0 0 0 1px rgba(255,255,255,.22)}
#camVisorC.lleno #camVisor{aspect-ratio:auto;height:100%}
#camVid{width:100%;height:100%;object-fit:cover;display:block;
  transform-origin:center;transition:transform .22s ease}
#camVid.espejo{scale:-1 1}
/* el brillo de vidrio del canto: es lo que hace que la tarjeta se lea a pieza
   Frutiger y no a un `<video>` con border-radius */
#camVisor::after{content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.30),transparent 16%,transparent 88%,rgba(255,255,255,.10));
  box-shadow:inset 0 2px 8px rgba(255,255,255,.28)}

#camReja{position:absolute;inset:0;pointer-events:none}
#camReja.r33,#camReja.r44{background-image:
  linear-gradient(90deg,rgba(255,255,255,.34) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.34) 1px,transparent 1px)}
#camReja.r33{background-size:33.33% 33.33%}
#camReja.r44{background-size:25% 25%}

#camHdr{position:absolute;right:6px;top:12px;color:#fff;font-weight:800;font-size:12px;line-height:1;
  letter-spacing:.06em;writing-mode:vertical-rl;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#camEstado{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:none;max-width:78%;text-align:center;color:#fff;font-weight:700;font-size:13px;line-height:1.45;
  background:rgba(6,28,50,.62);padding:12px 16px;border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
#camEstado.on{display:block}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#camFlash.on{animation:camFlash .28s ease-out}
@keyframes camFlash{from{opacity:.92}to{opacity:0}}
#camRec{position:absolute;left:12px;top:12px;display:none;align-items:center;gap:7px;
  background:rgba(8,20,34,.55);border-radius:20px;padding:5px 11px;
  color:#fff;font-weight:800;font-size:12px;line-height:1}
#camRec.on{display:flex}
#camRec .pt{width:9px;height:9px;border-radius:50%;background:#ff4141;
  animation:camPt 1s ease-in-out infinite}
@keyframes camPt{0%,100%{opacity:1}50%{opacity:.25}}

/* ── LA FRANJA DE ARRIBA ── */
#camTop{position:relative;z-index:3;width:calc(100% - 26px);
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
  padding:7px 12px;border-radius:20px;color:#fff;font-weight:800;font-size:13px;line-height:1}
#camTop .ctB{background:0;border:0;color:rgba(255,255,255,.8);font-size:16px;padding:4px 6px}
#camTop .ctB.act{color:#ffd36b}
#camTop .ctPil{margin-left:auto;margin-right:auto;background:rgba(255,255,255,.18);
  border:0;color:#fff;border-radius:14px;padding:3px 16px;font-size:15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#camTop .ctT{opacity:.95;letter-spacing:.04em;font-size:13px}

/* ── EL PANEL DEL CHEVRON ── */
#camRapido{position:absolute;left:13px;right:13px;top:calc(var(--ins-t,24px) + 58px);
  z-index:6;display:none;grid-template-columns:repeat(4,1fr);gap:2px;
  border-radius:20px;padding:12px 6px;overflow:hidden}
#camRapido.on{display:grid}
#camRapido button{background:0;border:0;color:#fff;display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:9px 2px;font-weight:600;font-size:10.5px;line-height:1.2;opacity:.92}
#camRapido button b{font-weight:800;font-size:15px;line-height:1;opacity:.95}
#camRapido button.act{color:#bfe9ff}
#camRapido .crCfg{grid-column:1}

/* ── LOS FILTROS DE DOCUMENTOS: COLUMNA A LA DERECHA ──
   Es donde los pone la cámara de verdad, y ahí no tapan el visor. */
#camFiltros{position:absolute;right:18px;top:46%;z-index:5;display:none;
  flex-direction:column;gap:4px;padding:6px;border-radius:22px}
#camFiltros.on{display:flex}
#camFiltros button{background:0;border:0;color:#fff;border-radius:16px;
  padding:8px 12px;font-weight:700;font-size:12px;line-height:1}
#camFiltros button.act{background:#fff;color:#0b3a5c}

/* ── EL ZOOM VA SOBRE EL VISOR ──
   Es donde lo pone la cámara de verdad, y ahí no le come alto a la repisa. */
#camZoom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  z-index:4;display:flex;gap:2px;padding:4px;border-radius:22px}
#camZoom button{background:0;border:0;color:#fff;border-radius:18px;
  width:40px;height:32px;font-weight:800;font-size:12px;line-height:1;opacity:.85}
#camZoom button.act{background:rgba(255,255,255,.22);color:#ffd36b;opacity:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* ── LA REPISA DE VIDRIO ──
   Una sola pieza que sostiene los modos y el obturador. Sin ella, nueve
   rótulos y tres botones quedan sueltos sobre un acuario. */
#camPie{position:relative;z-index:3;width:calc(100% - 26px);margin-top:10px;
  border-radius:26px;padding:8px 0 10px;overflow:hidden}
/* ── EL BRILLO FRUTIGER ──
   El vidrio del launcher es sobrio a propósito —un escritorio no puede tener
   una pieza que grite— y una cámara Frutiger sí: lo que la separa de un panel
   translúcido cualquiera es el filo encendido de arriba y el reflejo que baja
   en la primera mitad. Va como `::after` sobre las piezas de la cámara y no
   tocando `.vid`, que lo usa el launcher entero. */
#camPie::after,#camTop::after,#camZoom::after,#camRapido::after,
#camFiltros::after,#camElige::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 46%,transparent 60%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.62),
             inset 0 -1px 0 rgba(255,255,255,.14),
             inset 0 0 0 1px rgba(255,255,255,.18)}
#camPie>*,#camTop>*,#camZoom>*,#camRapido>*,#camFiltros>*,#camElige>*{position:relative;z-index:1}

/* ── EL CARRUSEL DE MODOS ── */
#camModos{position:relative;z-index:3;width:100%;display:flex;gap:22px;
  overflow-x:auto;scrollbar-width:none;padding:4px 50%;
  scroll-behavior:smooth}
#camModos::-webkit-scrollbar{display:none}
#camModos button{background:0;border:0;color:rgba(255,255,255,.82);
  font-weight:700;font-size:14px;line-height:1;white-space:nowrap;padding:6px 2px}
#camModos button.act{color:#ffd36b;font-weight:800}

/* ── LA BARRA DEL OBTURADOR ── */
#camBarra{position:relative;z-index:3;width:100%;display:flex;align-items:center;
  justify-content:space-around;padding:6px 22px 0}
#camThumb{width:48px;height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.85);
  background-size:cover;background-position:center;background-color:rgba(255,255,255,.14)}
#camThumb.vacia{opacity:.45}
#camFlip{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:20px;
  background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#camDisp{width:74px;height:74px;border-radius:50%;border:0;padding:0;
  background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(2,20,40,.4)}
#camDisp span{display:block;border-radius:50%;transition:all .18s cubic-bezier(.2,1.3,.3,1)}
#camDisp.foto span{width:60px;height:60px;background:#fff;
  box-shadow:0 0 0 3px rgba(11,58,92,.35) inset}
#camDisp.grabar span,#camDisp.lapso span{width:56px;height:56px;background:#e83a30}
#camDisp.lapso{border:3px dashed rgba(255,255,255,.85)}
#camDisp.grabando span{width:30px;height:30px;border-radius:8px}

/* ── EL SELECTOR ──
   Es lo primero que aparece: «al abrirla te deje elegir entre la frutiger o la
   normal con un botón». */
#cam #camTop,#cam #camVisorC,#cam #camPie{
  transition:opacity .22s,transform .22s}
#cam.eligiendo #camTop,#cam.eligiendo #camPie{
  opacity:0;pointer-events:none}
#cam.eligiendo #camVisorC{opacity:.35;transform:scale(.94)}
#camElige{position:absolute;left:22px;right:22px;top:50%;z-index:8;
  transform:translateY(-50%) scale(.9);opacity:0;pointer-events:none;
  border-radius:26px;padding:22px 18px 18px;color:#fff;text-align:center;
  transition:opacity .24s,transform .3s cubic-bezier(.2,1.15,.3,1)}
#cam.eligiendo #camElige{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
#camElige .ceTit{font-weight:800;font-size:20px;line-height:1.25;margin-bottom:6px}
#camElige .ceSub{font-weight:600;font-size:12.5px;line-height:1.5;opacity:.8;margin-bottom:16px}
#camElige .ceBt{display:block;width:100%;margin:0 0 9px;border:0;border-radius:17px;
  padding:14px;font-weight:800;font-size:15px;line-height:1;color:#0b3a5c;
  background:linear-gradient(180deg,#eafaff,#a9e2f7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 14px rgba(2,26,50,.35)}
#camElige .ceBt.sec{color:#fff;background:rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
#camElige .ceX{position:absolute;right:12px;top:10px;background:0;border:0;
  color:#fff;opacity:.7;font-size:16px}

/* ── LOS AJUSTES ── */
/* ── LOS AJUSTES TAPAN DE VERDAD ──
   Con la hoja translúcida a secas, el visor —que es lo más saturado de la
   pantalla— se veía a través de las once filas y no se leía ninguna. Y encima
   el `<video>` seguía componiéndose para no verse: se esconde, que es la misma
   regla que apaga el agua debajo de una hoja. */
#camAj{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;
  color:#fff;padding:calc(var(--ins-t,24px) + 6px) 12px calc(var(--ins-b,16px) + 8px);
  background:linear-gradient(180deg,rgba(6,32,58,.94),rgba(5,44,68,.96) 45%,rgba(4,30,54,.97))}
#cam.conAjustes #camVisorC,#cam.conAjustes #camPie,#cam.conAjustes #camTop,
#cam.conAjustes #camFiltros{visibility:hidden}
#cam.conAjustes #camAj{display:flex}
#camAj .cajTop{display:flex;align-items:center;gap:10px;padding:4px 4px 12px}
#camAj .cajTop button{background:0;border:0;color:#fff;font-weight:700;font-size:18px;line-height:1;width:32px}
#camAj .cajTit{flex:1;text-align:center;font-weight:800;font-size:19px;line-height:1}
#camAj #cajI{border:1.5px solid rgba(255,255,255,.6);border-radius:50%;
  width:24px;height:24px;font-weight:700;font-size:12px;line-height:1}
#camAj .cajTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 2px 12px}
#camAj .cajTabs button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.66);border-radius:16px;padding:11px 4px;font-weight:700;font-size:14px;line-height:1}
#camAj .cajTabs button.act{background:rgba(255,255,255,.2);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#camAj .cajCuerpo{flex:1;overflow-y:auto;min-height:0}
#camAj .cajG{background:rgba(255,255,255,.08);border-radius:22px;padding:4px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
#camAj .cajF{display:flex;align-items:center;gap:12px;padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.09)}
#camAj .cajF:last-child{border-bottom:0}
#camAj .cajL{flex:1;min-width:0}
#camAj .cajN{font-weight:600;font-size:15.5px;line-height:1.25}
#camAj .cajS{font-weight:500;font-size:12px;line-height:1.4;opacity:.6;margin-top:4px}
#camAj .cajV{background:0;border:0;color:rgba(255,255,255,.62);font-weight:600;font-size:13.5px;line-height:1;
  white-space:nowrap}
#camAj .cajSw{width:46px;height:27px;border:0;border-radius:14px;flex:0 0 auto;
  background:rgba(255,255,255,.22);position:relative;transition:background .2s}
#camAj .cajSw::after{content:'';position:absolute;left:3px;top:3px;width:21px;height:21px;
  border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.2,1.3,.3,1)}
#camAj .cajSw.on{background:#3d7dff}
#camAj .cajSw.on::after{transform:translateX(19px)}

/* la foto que se acaba de sacar */
#camVer{position:fixed;inset:0;z-index:14;background:rgba(3,16,30,.9);
  display:flex;align-items:center;justify-content:center}
#camVer img{max-width:94%;max-height:82%;border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.6)}
#camVer button{position:absolute;right:16px;top:calc(var(--ins-t,24px) + 8px);
  background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:50%;
  width:38px;height:38px;font-size:16px}

@media (prefers-reduced-motion:reduce){
  #camElige,#camVid,#camDisp span{transition-duration:.01s}
  #camFlash.on{animation:none}
}

/* ══════════ LA CARPETA ABIERTA ══════════ */
#carp{position:fixed;z-index:6;left:12px;right:12px;top:50%;transform:translateY(-50%) scale(.30);
  border-radius:26px;padding:14px 14px 18px;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .34s cubic-bezier(.18,1.12,.28,1);
  max-height:70%;display:flex;flex-direction:column;gap:10px}
#carp.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
#carpCab{display:flex;align-items:center;gap:10px}
/* el nombre es un campo y no un rótulo: renombrar tiene que ser tocar el nombre */
#carpNom{flex:1;background:rgba(255,255,255,.14);border:0;outline:0;color:#fff;
  border-radius:12px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
#carpRejilla{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  overflow-y:auto;min-height:0;padding:2px}
#carpPie{font-weight:600;font-size:11.5px;line-height:1.4;opacity:.72;text-align:center}

/* ══════════ PANTALLA DE INICIO ══════════
   Hoja corta: dos botones y tres renglones de explicación. `max-height` y no
   `height`, porque lo que mide es lo que dice — y lo que dice cambia según sea
   o no el inicio. */
#ini{position:fixed;z-index:6;left:0;right:0;bottom:0;max-height:70%;
  border-radius:28px 28px 0 0;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:10px 12px calc(var(--ins-b) + 14px)}
#ini.on{transform:translateY(0)}
#iniCuerpo{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:2px 4px 6px;display:flex;flex-direction:column;gap:12px}
#iniCuerpo .iEst{font-weight:800;font-size:15px;line-height:1.35;text-shadow:0 1px 2px rgba(0,25,52,.6)}
#iniCuerpo .iNota{font-weight:600;font-size:12.5px;line-height:1.45;opacity:.78}
/* el botón grande ocupa el ancho: es la acción de la pantalla, no una opción
   entre varias */
#iniCuerpo .iBtn{padding:14px 16px;border-radius:16px;font-weight:800;font-size:14px;line-height:1;
  cursor:pointer;text-align:center;background:rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34);text-shadow:0 1px 2px rgba(0,25,52,.6)}
#iniCuerpo .iBtn.pri{background:color-mix(in srgb,var(--acento) 34%,rgba(255,255,255,.12));
  box-shadow:inset 0 0 0 1.4px color-mix(in srgb,var(--acento) 62%,transparent),
             inset 0 1px 0 rgba(255,255,255,.4)}
#iniCuerpo .iBtn.no{opacity:.42;pointer-events:none}
.pGrupo{display:flex;flex-direction:column;gap:8px}
.pTit{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  opacity:.7;padding-left:4px}
.pFila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pOp{flex:0 0 auto;padding:9px 14px;border-radius:14px;font-weight:700;font-size:13px;line-height:1;
  cursor:pointer;background:rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32);text-shadow:0 1px 2px rgba(0,25,52,.6)}
.pOp:active{background:rgba(255,255,255,.26)}
.pOp.sel{background:color-mix(in srgb,var(--acento) 34%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px color-mix(in srgb,var(--acento) 60%,transparent)}
.pCol{width:34px;height:34px;border-radius:12px;flex:0 0 auto;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,25,52,.35)}
.pCol.sel{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 3px #fff,0 3px 10px rgba(0,25,52,.4)}
.pRango{flex:1 1 120px;min-width:110px;-webkit-appearance:none;appearance:none;
  height:6px;border-radius:3px;background:rgba(255,255,255,.22);outline:0}
.pRango::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--acento);box-shadow:0 2px 6px rgba(0,25,52,.5)}
.pVal{flex:0 0 auto;min-width:44px;text-align:right;font-weight:800;font-size:13px;line-height:1;opacity:.9}

#menu{position:fixed;z-index:5;left:50%;transform:translate(-50%,10px) scale(.94);
  width:min(300px,82vw);border-radius:24px;padding:8px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s cubic-bezier(.2,.9,.3,1.3)}
#menu.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
#menuTit{padding:12px 16px 10px;font-size:15px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mop{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;
  font-size:15px;font-weight:600;cursor:pointer}
.mop:active{background:rgba(255,255,255,.18)}
.mop.peli{color:#ffb3b8}
.mop .ic{width:20px;text-align:center;opacity:.85}

/* ══════════ AVISO ══════════ */
#aviso{position:fixed;left:50%;transform:translateX(-50%);z-index:6;
  bottom:calc(var(--ins-b) + 84px);padding:11px 20px;border-radius:22px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  /* ── ENTRA DESDE ABAJO ──
     Apareciendo y desapareciendo en el sitio se lee a error del navegador y no
     a un aviso. Y va con el `translateX(-50%)` adentro del mismo `transform`,
     porque son la misma propiedad: escrito aparte, uno pisa al otro. */
  transform:translate(-50%,14px) scale(.94);
  transition:opacity .2s,transform .26s cubic-bezier(.2,1.3,.35,1);
  white-space:nowrap}
#aviso.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* ══════════ CARGANDO ══════════ */
#carga{position:fixed;inset:0;z-index:7;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,#1a6fb8,#4fb3e8 55%,#a8e2f7);
  transition:opacity .5s}
#carga.off{opacity:0;pointer-events:none}
#cargaT{font-size:34px;font-weight:200;letter-spacing:.3em;
  text-shadow:0 2px 20px rgba(0,60,110,.5)}
#cargaB{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
#cargaB i{display:block;height:100%;width:34%;border-radius:2px;background:#fff;
  box-shadow:0 0 12px #fff;animation:vaiven 1.1s ease-in-out infinite}
@keyframes vaiven{0%{margin-left:-34%}100%{margin-left:100%}}
</style>
</head>
<body>
<div id="fondo"></div>
<!-- ── LOS VELOS SON LO QUE HACE LEGIBLE EL TEXTO BLANCO ──
     Medido sobre la foto: debajo de la barra de búsqueda la luminancia daba 200
     sobre 255 y el vidrio recalibrado la dejó en 159 — texto blanco sobre 159
     es 1,6:1 de contraste, o sea que no se lee. Bajar más el vidrio lo
     convierte en un panel opaco y se pierde el vidrio.
     La salida es la de cualquier sistema: un degradado detrás de las franjas
     que llevan texto, y nada en el medio, que es donde la foto tiene que
     verse. Cuesta dos elementos sin repintado y no toca el vidrio. -->
<div id="veloT"></div>
<div id="veloB"></div>
<svg id="svgdefs" aria-hidden="true"><defs>
  <!-- el mapa de desplazamiento lo dibuja d.js y lo mete acá: es una imagen
       cuyo canal rojo dice cuánto correr en x y el verde cuánto en y -->
  <filter id="refr" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="refrMapa" result="mapa" preserveAspectRatio="none"/>
    <feDisplacementMap id="refrDesp" in="SourceGraphic" in2="mapa"
      scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div id="capa">
  <div id="barra">
    <div id="bIzq">—</div>
    <div id="bat"><span id="batN">—</span><div id="batCaja"><div id="batLlena" style="width:70%"></div></div></div>
  </div>

  <!-- ── LA FRANJA DE LOS WIDGETS ──
       El reloj de siempre pasa a ser UNO del catálogo y lo arma `w.js` con los
       mismos ids, así que `pintaReloj` y `ponBateria` no cambian una línea.
       `#hoja` es lo elástico de esta columna: agregar un widget le come filas a
       la reja de apps sin una sola cuenta. -->
  <div id="wid"></div>

  <div class="vid refr" id="buscaCaja">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
      stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.6 15.6L21 21"/></svg>
    <input id="busca" type="search" autocomplete="off" autocorrect="off" readonly
      autocapitalize="none" spellcheck="false" placeholder="—">
  </div>

  <div id="hoja"><div id="tira"></div></div>
  <div class="vid refr" id="dock"></div>
</div>

<div id="tirador"><i></i></div>

<div id="cajon">
  <!-- ── LA MANIJA ES LA ÚNICA FORMA GARANTIZADA DE CERRAR ──
       Arrastrar sobre la lista no alcanza: `#cajLista` tiene `touch-action:pan-y`,
       así que el navegador se queda con el gesto vertical y dispara
       `pointercancel` antes de que el arrastre llegue al umbral. Esta franja
       lleva `touch-action:none`, o sea que el gesto es nuestro siempre. -->
  <div id="cajManija"><i></i></div>
  <div class="vid" id="cajBusca">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
      stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.6 15.6L21 21"/></svg>
    <input id="busca2" type="search" autocomplete="off" autocorrect="off"
      autocapitalize="none" spellcheck="false" placeholder="—">
  </div>
  <div id="cajTit">—</div>
  <div id="cajCuerpo">
    <div id="cajLista"></div>
    <!-- la barra del índice: pista fija y pomo que sigue el scroll -->
    <div id="riel"><div id="rielPista"></div><div id="rielPomo"></div></div>
  </div>
  <div id="burbuja">A</div>
</div>

<!-- ── LA MASCOTA VIVE EN EL ESCRITORIO, NO ADENTRO DEL CAJÓN ──
     Estaba dentro de `#cajon` y sólo aparecía **escribiendo en la búsqueda**:
     o sea que había que abrir el cajón y teclear para verla. El reporte fue
     literal —«no sé dónde se encuentra»— y tenía razón: un modelo 3D que hay
     que descubrir no existe. Ahora es hermana del cajón y la coloca el CSS
     según dónde esté uno: en el medio del escritorio, grande, desde el primer
     cuadro; y chica al pie del cajón cuando el cajón está abierto. -->
<div id="mascota">
  <div id="mVent"><canvas id="mLien"></canvas></div>
  <div id="mZ"><span>Z</span><span>Z</span><span>Z</span></div>
</div>

<div id="oscuro"></div>
<div id="velo"></div>
<div class="vid refr" id="menu">
  <div id="menuTit">—</div>
  <div class="mop" id="mFijar"><span class="ic">☆</span><span>—</span></div>
  <div class="mop" id="mInfo"><span class="ic">ⓘ</span><span>—</span></div>
  <div class="mop peli" id="mBorrar"><span class="ic">✕</span><span>—</span></div>
</div>

  </div>

  <div id="carpPie">—</div>
</div>

<!-- ── LA GALERÍA DE FONDOS ──
     Va de borde a borde y con la lista corrida hacia abajo a propósito: el
     fondo se aplica al tocar, así que la mitad de arriba de la pantalla tiene
     que seguir mostrando el fondo de verdad con el reloj y el widget encima.
     Con una hoja centrada, lo que se elige queda tapado por lo que lo elige. -->
<div id="fondos">
  <div id="fgCab" class="vid refr">
    <div class="fgTabs">
      <div class="fgTab on" data-t="fondos">—</div>
      <div class="fgTab" data-t="widgets">—</div>
    </div>
    <div style="flex:1"></div>
    <div class="asBtn" id="fgMia">＋</div>
    <div class="asBtn" id="fgX">✕</div>
  </div>
  <!-- ── GENERAR UNO ──
       Va ARRIBA de la rejilla y no en una pestaña aparte: lo generado se guarda
       en el mismo sitio que «la tuya», así que aparece como una ficha más de
       esta misma lista y se ve aplicado detrás de la hoja al instante. -->
  <div id="fgGen">
    <input id="fgGenT" type="text" />
    <button id="fgGenB"></button>
    <button id="fgGenX"></button>
  </div>
  <div id="fgIdeas"></div>
  <div id="fgRejilla"></div>
  <div id="fgWid"></div>
  <input type="file" id="fgArch" accept="image/*" />
</div>
