/* ══════════ RELOJ Y BATERÍA ══════════ */
function dosD(n){ return n < 10 ? '0' + n : String(n); }
function pintaReloj(){
  const d = new Date();
  $('#hora').textContent = dosD(d.getHours()) + ':' + dosD(d.getMinutes());
  const t = TXT[LANG] || TXT.es;
  $('#fecha').innerHTML = t.dias[d.getDay()] + '<br>' + d.getDate() + ' ' + t.meses[d.getMonth()];
  $('#bIzq').textContent = dosD(d.getHours()) + ':' + dosD(d.getMinutes());
  /* ── EL SALUDO SALE DE LA HORA, NO DE UNA CONSTANTE ──
     Es lo único del widget que cambia de tono a lo largo del día, y es lo que
     hace que el escritorio se sienta puesto para este momento y no un reloj. */
  const h = d.getHours();
  const fr = h < 6 ? 'madrugada' : h < 13 ? 'manana' : h < 20 ? 'tarde' : 'noche';
  $('#wSaludo').textContent = T('s_' + fr);
}
function pintaBateria(){
  if (!HAY_AND || !AND.bateria) return;
  try { ponBateria(JSON.parse(AND.bateria())); } catch (e) {}
}

/* ── EL ARO DE BATERÍA ──
   El trazo de un círculo se recorta con `stroke-dashoffset`: la circunferencia
   de r=25 es 2πr = 157,08, así que el offset es lo que FALTA. Va aparte de
   `pintaBateria` para que la vista previa del navegador —que no tiene puente y
   por lo tanto no tiene batería— pueda llenarlo igual y se pueda mirar. */
const ARO_C = 2*Math.PI*25;
function ponBateria(b){
  const n = (b.n === undefined || b.n < 0) ? 100 : b.n;
  $('#batN').textContent = (b.c ? '\u26a1' : '') + n + '%';
  $('#wPct').textContent = n + '%';
  const f = $('#batLlena');
  f.style.width = n + '%';
  /* el color es información: rojo por debajo de 15 dice de una ojeada algo que
     el número solo no dice */
  const col = b.c ? '#8fe3ff' : n <= 15 ? '#ff8b93' : n <= 30 ? '#ffd36e' : '#b8f078';
  f.style.background = col;
  f.style.boxShadow = '0 0 6px ' + col;
  const arco = $('#wArco');
  arco.style.stroke = col;
  arco.style.strokeDashoffset = String(ARO_C*(1 - n/100));
}

/* ══════════ CARGA ══════════ */
function cargaApps(){
  let bruto = '[]';
  if (HAY_AND){ try { bruto = AND.apps(); } catch (e){ bruto = '[]'; } }
  else bruto = JSON.stringify(APPS_DEMO);
  try { APPS = JSON.parse(bruto) || []; } catch (e){ APPS = []; }
  /* ── EL ORDEN SE ORDENA ACÁ, AUNQUE EL PUENTE YA LO HAGA ──
     `Puente.apps()` ordena alfabético sin acentos, y el índice de letras DEPENDE
     de que la lista venga ordenada: si no, aparecen encabezados repetidos y
     `ANCLA[letra]` se queda con el último, así que tocar una letra salta a otro
     lado. Medido con la lista de la vista previa sin ordenar, el riel salió
     `T M C W S I T Y G M P M S N D X T A C R L R U A D` — veinticinco secciones
     para veintiocho apps. Un contrato repartido entre dos lenguajes se rompe el
     día que alguien toca uno de los dos; ordenar de este lado cuesta una línea
     y lo vuelve imposible. */
  /* ── EL ASISTENTE ES UNA APP MÁS ──
     No está instalado en el teléfono, así que el puente no lo devuelve nunca:
     se inyecta acá, ANTES de ordenar, y con eso queda en el cajón por su letra,
     se puede buscar y se puede fijar como cualquier otra. Ponerlo como un botón
     aparte obligaría a inventarle un sitio en una pantalla que ya está llena. */
  APPS.push({ p: ASIS_PKG, n: T('aNombre') });
  APPS.push({ p: PERS_PKG, n: T('aNombreP') });
  APPS.sort((a, b) => norm(a.n) < norm(b.n) ? -1 : norm(a.n) > norm(b.n) ? 1 : 0);
  POR_PKG = {};
  for (const a of APPS) POR_PKG[a.p] = a;

  INICIO = (lee('inicio', null) || []).filter(p => POR_PKG[p]);
  DOCK = (lee('dock', null) || []).filter(p => POR_PKG[p]);

  /* ── LA PRIMERA VEZ SE SIEMBRA SÓLO EL DOCK ──
     El inicio va vacío a propósito: arriba está el widget, abajo el dock, y en
     el medio se ve el fondo. Todo lo demás vive en el cajón, que se abre con un
     gesto. Lo que sí se siembra son los cuatro del dock, porque un dock vacío
     la primera vez sí se lee a que el launcher no funcionó — y se eligen por lo
     que el sistema declara: teléfono, mensajes, cámara, navegador. */
  if (!DOCK.length && APPS.length){
    const busca = pats => APPS.find(a => pats.some(q => a.p.indexOf(q) >= 0));
    DOCK = [
      busca(['dialer', '.phone', 'contacts']),
      busca(['.mms', 'messaging', 'messages', 'whatsapp']),
      busca(['camera', 'gallery', 'photos']),
      busca(['chrome', 'browser', 'firefox'])
    ].filter(Boolean).map(a => a.p).slice(0, 4);
    if (DOCK.length < 4) DOCK = DOCK.concat(
      APPS.filter(a => DOCK.indexOf(a.p) < 0).slice(0, 4 - DOCK.length).map(a => a.p));
    guarda('dock', DOCK);
  }
}

/* ══════════ ENTRADA ══════════ */
function pkgDe(ev){
  const n = ev.target.closest ? ev.target.closest('.ap') : null;
  return n ? n.dataset.p : null;
}
function enganchaLista(el){
  let t0 = 0, largo = null, px = 0, py = 0, movio = false;
  el.addEventListener('pointerdown', e => {
    const p = pkgDe(e); if (!p) return;
    px = e.clientX; py = e.clientY; movio = false; t0 = performance.now();
    /* ── MANTENER ES UN TEMPORIZADOR, NO UN «pointerup» LARGO ──
       Esperando al soltar, el menú aparece recién cuando el dedo se levanta y se
       siente que no respondió. A los 460 ms sale con el dedo todavía puesto, que
       es lo que hace cualquier escritorio. */
    largo = setTimeout(() => { largo = null; movio = true; abreMenu(p, e.clientY); }, 460);
  });
  el.addEventListener('pointermove', e => {
    if (!largo) return;
    if (Math.hypot(e.clientX - px, e.clientY - py) > 12){ clearTimeout(largo); largo = null; movio = true; }
  });
  el.addEventListener('pointerup', e => {
    if (largo){ clearTimeout(largo); largo = null;
      const p = pkgDe(e);
      if (p && !movio && performance.now() - t0 < 460) abre(p);
    }
  });
  el.addEventListener('pointercancel', () => { if (largo){ clearTimeout(largo); largo = null; } });
}

/* páginas: arrastre horizontal con umbral, y el vertical no lo roba */
function enganchaPaginas(){
  const h = $('#hoja'), t = $('#tira');
  let x0 = 0, y0 = 0, act = false, eje = 0, w = 0;
  h.addEventListener('pointerdown', e => {
    x0 = e.clientX; y0 = e.clientY; act = true; eje = 0;
    w = h.getBoundingClientRect().width;
    t.style.transition = 'none';
  });
  h.addEventListener('pointermove', e => {
    if (!act) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!eje){
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) eje = 1;
      else if (Math.abs(dy) > 10) eje = 2;
      else return;
    }
    if (eje !== 1) return;
    const base = -PAG*(100/NPAG);
    /* resistencia en los extremos: sin ella la primera página se arrastra libre
       y parece que hay una más que no llega nunca */
    let d = dx;
    if ((PAG === 0 && dx > 0) || (PAG === NPAG - 1 && dx < 0)) d = dx*.32;
    t.style.transform = 'translateX(calc(' + base + '% + ' + d + 'px))';
  });
  const fin = e => {
    if (!act) return; act = false;
    t.style.transition = '';
    /* el gesto de subir lo maneja `enganchaSubir`, que también está sobre
       `#hoja`: acá sólo hay que devolver la página a su sitio */
    if (eje !== 1){ ponPagina(PAG); return; }
    const dx = e.clientX - x0;
    if (dx < -w*.22) ponPagina(PAG + 1);
    else if (dx > w*.22) ponPagina(PAG - 1);
    else ponPagina(PAG);
  };
  h.addEventListener('pointerup', fin);
  h.addEventListener('pointercancel', fin);
}

/* ── SUBIR ABRE EL CAJÓN, DESDE LOS TRES SITIOS DE ABAJO ──
   Un solo tirador de 120 px es un blanco chico y encima se pisaba con el dock.
   El gesto se registra en el escritorio y en el dock; el
   umbral de 55 px es lo que lo separa de un toque tembloroso, y el de 18 px en
   horizontal es lo que impide que un arrastre entre páginas lo dispare. */
function enganchaSubir(el){
  let y0 = 0, x0 = 0, act = false;
  el.addEventListener('pointerdown', e => { y0 = e.clientY; x0 = e.clientX; act = true; });
  el.addEventListener('pointermove', e => {
    if (!act || CAJON) return;
    if (Math.abs(e.clientX - x0) > 18){ act = false; return; }
    if (y0 - e.clientY > 55){ act = false; verCajon(true); vibra(10); }
  });
  const f = () => { act = false; };
  el.addEventListener('pointerup', f);
  el.addEventListener('pointercancel', f);
}

/* el cajón: se sube arrastrando desde abajo y se baja desde la manija */
function enganchaCajon(){
  const caj = $('#cajon');
  enganchaSubir($('#dock'));
  enganchaSubir($('#hoja'));

  /* ══════════ BAJAR ══════════
     ── POR QUÉ NO BAJABA, Y SON TRES COSAS ──
     1. El arrastre estaba sobre `#cajon`, pero el dedo cae sobre `#cajLista`,
        que tiene `touch-action:pan-y`: el navegador se queda con el gesto
        vertical y dispara `pointercancel` antes del umbral, así que el cierre
        no llegaba a correr NUNCA en un teléfono.
     2. Sólo arrastraba con la lista arriba de todo. Con veintiocho apps la
        lista scrollea, así que la mayor parte del tiempo no se podía cerrar.
     3. Y el arrastre escribía `style.transform` inline. `verCajon(false)` saca
        la clase `.on`, cuya regla dice `translateY(100%)` — pero el inline le
        gana por especificidad, así que el cajón se quedaba clavado donde estaba
        el dedo.
     El arreglo: el arrastre vive en la MANIJA, que lleva `touch-action:none`, y
     la posición va por una variable de CSS que la regla base ignora cuando el
     cajón está cerrado. */
  const man = $('#cajManija');
  let y0 = 0, tira = false;
  const pone = d => caj.style.setProperty('--caj-y', Math.max(0, d) + 'px');
  const suelta = () => { caj.classList.remove('tira'); caj.style.removeProperty('--caj-y'); };

  man.addEventListener('pointerdown', e => {
    y0 = e.clientY; tira = true;
    caj.classList.add('tira');
    try { man.setPointerCapture(e.pointerId); } catch (x) {}
  });
  man.addEventListener('pointermove', e => { if (tira) pone(e.clientY - y0); });
  const fin = e => {
    if (!tira) return;
    tira = false;
    const d = e.clientY - y0;
    suelta();
    /* 78 px o un tirón rápido: cerrar tiene que costar poco, porque el que
       arrastró para abajo ya dijo lo que quería */
    if (d > 78) verCajon(false);
  };
  man.addEventListener('pointerup', fin);
  man.addEventListener('pointercancel', fin);

  /* ── Y TAMBIÉN DESDE LA LISTA, CUANDO ESTÁ ARRIBA DE TODO ──
     Acá hace falta `touchmove` con `passive:false` y `preventDefault()`: con
     eventos de puntero el navegador ya reclamó el gesto y lo cancela. */
  const l = $('#cajLista');
  let ly = 0, larr = false;
  l.addEventListener('touchstart', e => {
    larr = l.scrollTop <= 0 && e.touches.length === 1;
    ly = larr ? e.touches[0].clientY : 0;
  }, { passive: true });
  l.addEventListener('touchmove', e => {
    if (!larr) return;
    const d = e.touches[0].clientY - ly;
    if (d <= 0){ larr = false; return; }
    e.preventDefault();
    caj.classList.add('tira'); pone(d);
  }, { passive: false });
  const lfin = e => {
    if (!larr) return;
    larr = false;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const d = t ? t.clientY - ly : 0;
    suelta();
    if (d > 78) verCajon(false);
  };
  l.addEventListener('touchend', lfin);
  l.addEventListener('touchcancel', lfin);

  /* la letra que se está mirando, mientras se baja por la lista */
  let pend = false;
  l.addEventListener('scroll', () => {
    if (pend || !LETRAS.length) return;
    pend = true;
    /* una vez por cuadro y no una por evento: `scroll` dispara docenas de veces
       por segundo y medir posiciones obliga al navegador a recalcular el layout */
    requestAnimationFrame(() => {
      pend = false;
      /* despegándose del fondo, la letra pedida deja de mandar */
      if (!alFondo()) PEDIDA = null;
      marcaRiel(letraVisible());
    });
  }, { passive: true });

  /* ══════════ LA BARRA DEL ÍNDICE ══════════
     ── LA POSICIÓN DEL DEDO ES UNA FRACCIÓN, NO UNA LETRA ──
     Con una columna de letras el dedo caía sobre una y se saltaba ahí. Con una
     barra lo que hay es una fracción del recorrido, así que se scrollea a esa
     fracción y la letra que aparece en la burbuja es la que quedó arriba —
     medida, no supuesta. Eso hace que arrastrar se sienta continuo en vez de
     saltar entre secciones, que es como se comporta la barra de Xiaomi. */
  const r = $('#riel'), bur = $('#burbuja');
  let rAct = false;
  const rVa = y => {
    const c = r.getBoundingClientRect();
    const k = cl((y - c.top - 10) / Math.max(1, c.height - 20), 0, 1);
    const l = $('#cajLista');
    l.scrollTop = k*Math.max(0, l.scrollHeight - l.clientHeight);
    PEDIDA = null;
    const L = letraVisible();
    if (bur.textContent !== L) vibra(6);
    bur.textContent = L;
    bur.style.top = Math.max(46, Math.min(innerHeight - 46, y)) + 'px';
    ponPomo();
  };
  r.addEventListener('pointerdown', e => {
    if (!LETRAS.length) return;
    rAct = true; r.classList.add('on'); bur.classList.add('on'); rVa(e.clientY);
    try { r.setPointerCapture(e.pointerId); } catch (x) {}
  });
  r.addEventListener('pointermove', e => { if (rAct) rVa(e.clientY); });
  const rFin = () => { rAct = false; r.classList.remove('on'); bur.classList.remove('on'); };
  r.addEventListener('pointerup', rFin);
  r.addEventListener('pointercancel', rFin);
}

/* ══════════ LA MASCOTA ══════════
   Baila mientras se escribe, se aburre y se duerme. Todas las animaciones salen
   de UNA tira y de la tabla `MASC_ANIM` que escribe el horneado. */

/* los aburridos, con `quieto` repetido porque tiene que salir más seguido: una
   lista con pesos es más corta y más clara que una tabla de probabilidades */
const MASC_OCIO = ['quieto', 'mando', 'quieto', 'saluda', 'quieto'];

let MASC_T = 0, MASC_CICLO = 0, MASC_HOY = '', MASC_ULT = 0, MASC_BUSCA = false;

/* ── CAMBIAR DE ANIMACIÓN ES CAMBIAR UN NOMBRE ──
   Las cinco son funciones del tiempo sobre los mismos 23 huesos, así que no hay
   que cargar nada, ni cruzar clips, ni esperar. Lo único que hay que reponer es
   el reloj: entrando a una pose a mitad de su ciclo, el primer cuadro salta. */
function mascPone(n){
  if (MASC_HOY === n || !L3_ANIM[n]) return;
  MASC_HOY = n;
  L3.anim = n;
  L3.t = 0;
  $('#mascota').classList.toggle('zzz', n === 'duerme');
}

/* ── SE ABURRE Y SE DUERME ──
   No es un adorno: la mascota está para acompañar la búsqueda, y algo que hace
   siempre lo mismo deja de acompañar a los diez segundos. Baila mientras se
   teclea, a los 2,2 s de silencio pasa a un ocio sorteado, y a los 7 se duerme
   con las zetas. */
function mascOcio(){
  clearTimeout(MASC_CICLO);
  if (Date.now() - MASC_ULT > 7000){
    mascPone('duerme');
    MASC_CICLO = setTimeout(mascOcio, 5000);
    return;
  }
  mascPone(MASC_OCIO[(Math.random()*MASC_OCIO.length)|0]);
  MASC_CICLO = setTimeout(mascOcio, 3400 + Math.random()*3000);
}

/* ── Y NO SE MUESTRA SI NO HAY LUGAR ──
   Vive pegada abajo del cajón; con una búsqueda que devuelve muchas apps la
   lista llega hasta ahí y la mascota queda ENCIMA de los resultados, que es lo
   único que en ese momento hay que poder leer. El hueco se mide, no se supone. */
/* ── DÓNDE VA Y CUÁNTO MIDE ──
   Dos sitios, y los dos en variables: el CSS los lee y la sonda también, así
   que no hay dos números que puedan discrepar. En el escritorio es grande y va
   por encima del dock; en el cajón es chica y se apoya en el borde de abajo. */
const MASC_CAJ = { w: 132, b: 16 };
function mascSitio(){
  /* el alto sale de la proporción del lienzo (132×180): escrito a mano al lado
     del ancho, cambiar uno deja al muñeco estirado y nada avisa */
  const w = CAJON ? MASC_CAJ.w : (PERS_MASC[lee('mascTam', 'media')] || PERS_MASC.media);
  const r = document.documentElement.style;
  r.setProperty('--masc-w', w + 'px');
  r.setProperty('--masc-h', Math.round(w*MASC_H/MASC_W) + 'px');
  r.setProperty('--masc-b', (CAJON ? MASC_CAJ.b : 132) + 'px');
  mascMira();
}

/* ── ¿HAY LUGAR? ──
   Vale para los dos sitios y mide lo mismo: dónde termina lo último que se
   dibujó contra dónde empieza la mascota. `scrollHeight` no sirve —los dos
   contenedores son `flex:1 1 auto`, así que SIEMPRE llenan su caja y nunca
   bajan de `clientHeight`—, y con eso la comparación daba falso con dos
   resultados en pantalla. */
function mascCabe(){
  const alto = parseFloat(getComputedStyle(document.documentElement)
                 .getPropertyValue('--masc-h')) || MASC_H;
  const l = CAJON ? $('#cajLista') : $('#tira').children[PAG];
  if (!l) return !CAJON;
  const n = l.children.length;
  if (!n) return true;
  const u = l.children[n - 1].getBoundingClientRect();
  const c = (CAJON ? l : $('#hoja')).getBoundingClientRect();
  return u.bottom <= c.bottom - alto - (CAJON ? 30 : 8);
}

/* ── EN EL ESCRITORIO SE VE SIEMPRE ──
   Ése era el reporte: «no sé dónde se encuentra». Vivía adentro del cajón y
   sólo aparecía TECLEANDO, o sea que había que abrir el cajón y escribir para
   ver el modelo. En el escritorio se ve desde el primer cuadro y sin hacer
   nada; en el cajón sigue apareciendo mientras se busca, que es donde tiene
   algo que acompañar. */
function mascMira(){
  const m = $('#mascota');
  const ver = lee('mascOn', 1) && mascCabe() &&
              (CAJON ? MASC_BUSCA : true) && !document.hidden;
  clearTimeout(MASC_T);
  if (ver){
    m.classList.add('on');
    l3Corre(true);
    if (!MASC_HOY) mascPone('quieto');
    return;
  }
  /* se despide en vez de desaparecer: un corte seco se lee a error, y el bucle
     de render se apaga recién cuando terminó de irse */
  MASC_T = setTimeout(() => { m.classList.remove('on'); l3Corre(false); }, 2400);
}

function mascotaBaila(v){
  MASC_BUSCA = !!v;
  clearTimeout(MASC_CICLO);
  if (v){
    MASC_ULT = Date.now();
    mascPone('baila');
    MASC_CICLO = setTimeout(mascOcio, 2200);
  } else if (!CAJON){
    /* en el escritorio no se va: pasa al ocio */
    MASC_CICLO = setTimeout(mascOcio, 600);
  }
  mascMira();
}

/* ── SE LA PUEDE TOCAR, Y ESO ES LA MITAD DE QUE SEA UNA MASCOTA ──
   Un muñeco que no contesta es un adorno. Un toque le saca una pose distinta de
   la que tenía —sorteada entre las que no está haciendo, porque repetir la
   misma se lee a que el toque no hizo nada— y reinicia el reloj del ocio. */
const MASC_TOQUE = ['saluda', 'baila', 'mando', 'quieto'];
function mascToque(){
  vibra(12);
  const otras = MASC_TOQUE.filter(n => n !== MASC_HOY);
  clearTimeout(MASC_CICLO);
  MASC_ULT = Date.now();
  mascPone(otras[(Math.random()*otras.length)|0]);
  MASC_CICLO = setTimeout(mascOcio, 2600);
}

/* ══════════ GANCHOS DEL SISTEMA ══════════
   Los llama la Activity. Sin ellos, volver al escritorio deja abierto lo que
   estuviera abierto tres apps atrás, que no es «conservar el estado». */
window.__alInicio = function(){ cierraMenu(); verCajon(false); $('#busca2').value = ''; ponPagina(0); };
window.__alVolver = function(){ pintaReloj(); pintaBateria(); CORRE = true; };
window.__atras = function(){
  if ($('#asis').classList.contains('on')){ asisCierra(); return true; }
  if (MENU_PKG) cierraMenu();
  else if (CAJON) verCajon(false);
  else if (PAG > 0) ponPagina(0);
};
/* ── LOS INSETS HAY QUE PEDIRLOS, NO SÓLO ESPERARLOS ──
   `setOnApplyWindowInsetsListener` dispara cuando la vista se adjunta, que es
   ANTES de que `ui.html` termine de cargar: en ese momento `window.__insets` no
   existe todavía, el `evaluateJavascript` no encuentra nada y el valor de
   fábrica —24 px— se queda para siempre. Se vio en el teléfono del usuario: la
   barra de búsqueda del cajón terminaba pisada por los iconos de la barra de
   estado. El puente tiene el dato guardado desde el primer cuadro; lo único que
   faltaba era pedirlo al arrancar. */
function pideInsets(){
  if (!HAY_AND || !AND.insets) return;
  try {
    const p = String(AND.insets()).split(',');
    const t = parseInt(p[0], 10), b = parseInt(p[1], 10);
    if (isFinite(t) && isFinite(b)) window.__insets(t, b);
  } catch (e) {}
}

window.__insets = function(t, b){
  document.documentElement.style.setProperty('--ins-t', Math.max(t, 8) + 'px');
  document.documentElement.style.setProperty('--ins-b', Math.max(b, 8) + 'px');
  calculaFilas(); pintaInicio();
};

/* ══════════ ARRANQUE ══════════ */
function arranca(){
  $('#busca').placeholder = T('busca');
  $('#busca2').placeholder = T('busca');
  $('#cajTit').textContent = T('todas');

  fondoInit();
  vidrioInit();
  /* la reja se restituye antes de pintar nada: puesta después, el primer cuadro
     sale con los iconos de fábrica y salta de tamaño a la vista */
  ponReja(lee('ico', 60), lee('cols', 4));

  /* ── EL LIENZO SE DIMENSIONA UNA VEZ Y NO POR CUADRO ──
     El alto sale de la proporción de la caja, así que cambiar `MASC_W` no deja
     al muñeco estirado. */
  const cv = $('#mLien');
  cv.width = L3_ANCHO;
  cv.height = Math.round(L3_ANCHO*MASC_H/MASC_W);
  try { if (l3Init()) l3Cam(); } catch (e) { window.__errs && window.__errs.push(String(e)); }
  mascPone('quieto');
  mascSitio();
  /* ── UN TOQUE LA HACE CONTESTAR, UNO LARGO ABRE LA PERSONALIZACIÓN ──
     Es el gesto de cualquier launcher —mantener sobre algo abre sus opciones—
     y hace que el panel sea descubrible sin un botón más en la pantalla. */
  const M = $('#mascota');
  let mfl = null, mlarga = false;
  M.addEventListener('pointerdown', () => {
    mlarga = false;
    mfl = setTimeout(() => { mlarga = true; vibra(20); persAbre(); }, 560);
  });
  const mfin = () => { if (mfl){ clearTimeout(mfl); mfl = null; } };
  M.addEventListener('pointerup', mfin);
  M.addEventListener('pointermove', mfin);
  M.addEventListener('pointercancel', mfin);
  M.addEventListener('click', () => { if (!mlarga) mascToque(); });
  /* ── NO ARRANCA DORMIDA ──
     `mascOcio` compara contra `MASC_ULT`, que valía 0: la resta daba cuarenta
     y seis años y el primer cuadro del launcher salía con la mascota sentada
     durmiendo. Lo primero que uno ve del muñeco tiene que ser el muñeco de pie. */
  MASC_ULT = Date.now();
  mascOcio();

  pideInsets();
  cargaApps();
  pintaInicio(); pintaDock();
  pintaReloj(); pintaBateria();
  setInterval(pintaReloj, 1000);
  setInterval(pintaBateria, 30000);

  asisInit();
  persInit();

  enganchaLista($('#tira'));
  enganchaLista($('#dock'));
  enganchaLista($('#cajLista'));
  enganchaPaginas();
  enganchaCajon();

  /* ── EL CAMPO DEL ESCRITORIO ES UN BOTÓN ──
     Es `readonly`, así que en un teléfono no levanta el teclado sobre un cuadro
     que el cajón va a tapar: abre el cajón y le pasa el foco al de adentro, que
     es el único que recibe letras. Los 90 ms son lo que tarda la hoja en
     empezar a subir: enfocando en el mismo cuadro, Android abre el teclado
     contra un elemento que todavía está fuera de la pantalla y no lo enfoca. */
  /* el velo lo comparten el menú de app y la hoja del asistente */
  $('#velo').addEventListener('pointerdown', () => { asisCierra(); });

  const abreBusca = () => { verCajon(true); setTimeout(() => $('#busca2').focus(), 90); };
  $('#buscaCaja').addEventListener('pointerdown', abreBusca);
  $('#busca').addEventListener('focus', abreBusca);

  $('#busca2').addEventListener('input', e => {
    if (!CAJON) verCajon(true);
    pintaCajon(e.target.value);
    mascotaBaila(e.target.value.length > 0);
  });
  $('#busca2').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim(); if (!q) return;
    const v = APPS.filter(a => norm(a.n).indexOf(norm(q)) >= 0);
    /* Enter abre la primera coincidencia; sólo si no hay ninguna sale a la web,
       porque buscar «what» y terminar en Google en vez de en WhatsApp es lo
       contrario de lo que uno quiso. Para ir a la web a propósito está la fila. */
    if (v.length) abre(v[0].p);
    else aLaWeb(q);
  });

  $('#velo').addEventListener('pointerdown', cierraMenu);
  $('#mFijar').addEventListener('click', () => { if (MENU_PKG) alterna(MENU_PKG); cierraMenu(); });
  $('#mInfo').addEventListener('click', () => { if (MENU_PKG && HAY_AND) AND.info(MENU_PKG); cierraMenu(); });
  $('#mBorrar').addEventListener('click', () => { if (MENU_PKG && HAY_AND) AND.borrar(MENU_PKG); cierraMenu(); });

  /* ── MANTENER EL FONDO ABRE LOS AJUSTES DEL ESCRITORIO ──
     Es el gesto de siempre y la única forma de volver a cambiar de launcher sin
     ir a buscar el ajuste a mano. Va sobre `#hoja` —el hueco entre el widget y
     el dock— y no sobre el fondo: el fondo está en `z-index 0`, debajo de la
     capa, así que nunca recibiría un dedo. */
  let fl = null;
  $('#hoja').addEventListener('pointerdown', () => {
    fl = setTimeout(() => { vibra(20); if (HAY_AND) AND.elegirInicio(); else avisa(T('inicio')); }, 620);
  });
  const fc = () => { if (fl){ clearTimeout(fl); fl = null; } };
  $('#hoja').addEventListener('pointerup', fc);
  $('#hoja').addEventListener('pointermove', fc);

  document.addEventListener('visibilitychange', () => { CORRE = !document.hidden; mascMira(); });
  addEventListener('resize', () => { calculaFilas(); pintaInicio(); mascMira(); });
  addEventListener('contextmenu', e => e.preventDefault());

  setTimeout(() => $('#carga').classList.add('off'), 260);
  setTimeout(() => { const c = $('#carga'); if (c && c.parentNode) c.parentNode.removeChild(c); }, 900);
}
/* ══════════════════════ EL ASISTENTE ══════════════════════

   ── LA LLAVE ES DEL DUEÑO DEL TELÉFONO Y NO SALE DE AHÍ ──
   Es la decisión de fondo y de ella cuelga todo lo demás, igual que en CUBOS.
   Esto es una interfaz que corre adentro de un WebView: no hay servidor donde
   esconder una llave, y meter una en el HTML sería repartirla a cualquiera que
   descomprima el APK. Así que la pone el dueño, se guarda **sólo** en el
   `localStorage` de su aparato, y lo único que sale de ahí es lo que él
   escribió más la lista de sus apps.

   De eso se siguen tres cosas, y las tres son obligatorias:

   · **SIN LLAVE EL ASISTENTE FUNCIONA IGUAL.** Un asistente que no arranca sin
     una llave de API no es una app: es una pantalla de error. Lo que contesta
     entonces es el intérprete de acá abajo, que entiende un puñado de frases en
     los tres idiomas. Es menos, y es honesto.
   · **LA PANTALLA DICE SIEMPRE QUIÉN CONTESTÓ.** Una respuesta sin autor no
     significa nada: no es lo mismo «no entendí» de un modelo que de veinte
     expresiones regulares.
   · **Y SI LA LLAMADA FALLA, SE CAE AL INTÉRPRETE Y SE DICE POR QUÉ.** Sin red,
     con la llave mal, o si el modelo se niega: en los tres casos el asistente
     sigue contestando y el motivo queda a la vista.

   ── SE LLAMA CON `fetch` A MANO Y NO CON EL SDK ──
   El SDK oficial es un paquete de npm: acá no hay bundler, y bajarlo de un CDN
   convertiría «una interfaz que anda» en «una interfaz que anda si el CDN
   contesta» — que es justo lo que este launcher no puede permitirse, porque es
   la pantalla de inicio del teléfono. Lo único que el SDK agrega sobre esta
   llamada es un encabezado, `anthropic-dangerous-direct-browser-access`, que
   está copiado de su propio código y sin el cual la API no le contesta a un
   navegador. */

const ASIS_PKG = 'ai.rezona.aero.asistente';
const ASIS_MOD = 'claude-opus-5';

/* ══════════ LO QUE EL ASISTENTE PUEDE HACER ══════════
   ── UNA SOLA TABLA, Y LA LEEN LOS TRES ──
   El esquema que se le manda al modelo, el intérprete de sin-llave y el
   ejecutor salen de acá. Con tres listas, el día que se agregue una acción hay
   que acordarse en tres sitios y el modelo va a pedir cosas que nadie sabe
   hacer — que es el defecto más difícil de ver, porque no falla: contesta bien
   y no pasa nada. */
const ASIS_ACC = {
  iconos:   { num: [40, 92],  hace: v => { ponReja(v, null); rejaRepinta(); },
              dice: v => T('aIconos', v) },
  columnas: { num: [3, 6],    hace: v => { ponReja(null, v); rejaRepinta(); },
              dice: v => T('aColumnas', v) },
  abrir:    { app: true,      hace: p => abre(p),        dice: p => T('aAbrir', asisNom(p)) },
  fijar:    { app: true,      hace: p => { if (!fijado(p)) alterna(p); },
              dice: p => T('aFijar', asisNom(p)) },
  soltar:   { app: true,      hace: p => { if (fijado(p)) alterna(p); },
              dice: p => T('aSoltar', asisNom(p)) },
  buscar:   { txt: true,      hace: q => aLaWeb(q),      dice: q => T('aBuscar', q) },
  idioma:   { uno: ['es', 'en', 'pt'],
              hace: v => { LANG = v; guarda('lang', v); repintaIdioma(); },
              dice: v => T('aIdioma', v) },
  mascota:  { uno: ['quieto', 'baila', 'saluda', 'mando', 'duerme'],
              hace: v => { asisMascota(v); }, dice: v => T('aMascota', v) },
  cajon:    { uno: ['abrir', 'cerrar'],
              hace: v => verCajon(v === 'abrir'), dice: v => T('aCajon', v) }
};

/* el nombre de una app a partir de su paquete, para poder decir «abro Spotify»
   y no «abro com.spotify.music» */
function asisNom(p){ const a = POR_PKG[p]; return a ? a.n : p; }

/* ── REPINTAR ES DE ACÁ Y NO DE `ponReja` ──
   `ponReja` es aritmética y estado; que además repinte la ataría al DOM y no se
   la podría llamar desde el arranque, antes de que haya apps. */
function rejaRepinta(){ calculaFilas(); pintaInicio(); pintaDock(); pintaCajon($('#busca2').value); }

/* la mascota se fuerza por el mismo camino que usa el ocio, y se le corre el
   reloj para que el ocio no la pise al cuadro siguiente */
function asisMascota(n){
  const m = $('#mascota');
  clearTimeout(MASC_T); clearTimeout(MASC_CICLO);
  m.classList.add('on'); l3Corre(true);
  MASC_ULT = Date.now(); mascPone(n);
  MASC_CICLO = setTimeout(mascOcio, 6000);
}

/* ══════════ QUIÉN CONTESTA ══════════

   ── TRES PROVEEDORES, Y DOS SON GRATIS ──
   Pedirle al dueño una tarjeta de crédito para que su launcher entienda «agrandá
   las apps» no tiene sentido, así que el que viene puesto es **Gemini**, que da
   una llave sin tarjeta en aistudio.google.com. Anthropic queda para el que ya
   tiene llave y Groq para el que quiera velocidad.

   ── Y LOS TRES TIENEN QUE PODER LLAMARSE DESDE UN NAVEGADOR ──
   Ésta es la condición dura y no se cumple sola: la interfaz se carga desde
   `file:///android_asset/`, así que el `fetch` sale con `Origin: null` y el
   servidor tiene que contestar con CORS permisivo o el navegador no deja LEER
   la respuesta. Medido contra los tres endpoints con ese origen exacto:
   Anthropic devuelve `Access-Control-Allow-Origin: *` —pero sólo si el
   encabezado `anthropic-dangerous-direct-browser-access` va en el preflight—,
   Groq devuelve `*`, y Google **repite el origen que le mandes**, `null`
   incluido, que según la especificación es justo lo que hace falta.
   **Cerebras quedó afuera**: pasa el preflight y después contesta los errores
   SIN un solo encabezado de CORS, o sea que un 401 sería ilegible.

   Cada proveedor sabe tres cosas y nada más: cómo se autentica, qué cuerpo
   arma y cómo se lee lo que vuelve. Todo lo demás —la tabla de acciones, la
   validación, el intérprete de respaldo, los tres modos de falla— es el mismo
   para los tres. */
const ASIS_PROV = {
  gemini: {
    nombre: 'Google Gemini', gratis: true, ph: 'AIza…',
    donde: 'aistudio.google.com',
    url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',
    cab: k => ({ 'content-type': 'application/json', 'x-goog-api-key': k }),
    cuerpo: (sis, txt) => ({
      systemInstruction: { parts: [{ text: sis }] },
      contents: [{ role: 'user', parts: [{ text: txt }] }],
      generationConfig: {
        temperature: 0, maxOutputTokens: 700,
        responseMimeType: 'application/json',
        /* el esquema de Google lleva los tipos en MAYÚSCULA y no acepta
           `additionalProperties`: es otro dialecto, no el mismo con otro nombre */
        responseSchema: {
          type: 'OBJECT',
          properties: {
            respuesta: { type: 'STRING' },
            acciones: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
              hacer: { type: 'STRING', enum: Object.keys(ASIS_ACC) },
              valor: { type: 'STRING' } }, required: ['hacer', 'valor'] } }
          },
          required: ['respuesta', 'acciones']
        }
      }
    }),
    lee: j => {
      const c = (j.candidates || [])[0];
      if (!c) return null;
      /* `SAFETY` y `MAX_TOKENS` cortan el JSON a la mitad: sin esta guarda el
         `JSON.parse` tira y se lee como si la API hubiera fallado */
      if (c.finishReason && c.finishReason !== 'STOP') return { corte: c.finishReason };
      const t = (c.content && c.content.parts || []).map(x => x.text).join('');
      return t ? { txt: t } : null;
    }
  },
  groq: {
    nombre: 'Groq', gratis: true, ph: 'gsk_…', donde: 'console.groq.com',
    url: 'https://api.groq.com/openai/v1/chat/completions',
    cab: k => ({ 'content-type': 'application/json', 'authorization': 'Bearer ' + k }),
    cuerpo: (sis, txt) => ({
      model: 'llama-3.3-70b-versatile', temperature: 0, max_tokens: 700,
      response_format: { type: 'json_object' },
      messages: [{ role: 'system', content: sis }, { role: 'user', content: txt }]
    }),
    lee: j => {
      const c = (j.choices || [])[0];
      if (!c) return null;
      return c.message && c.message.content ? { txt: c.message.content } : null;
    }
  },
  anthropic: {
    nombre: 'Anthropic', gratis: false, ph: 'sk-ant-…', donde: 'console.anthropic.com',
    url: 'https://api.anthropic.com/v1/messages',
    cab: k => ({ 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 /* sin este encabezado la API no le contesta a un navegador, y
                    encima es lo que hace que el preflight devuelva CORS */
                 'anthropic-dangerous-direct-browser-access': 'true' }),
    cuerpo: (sis, txt) => ({
      model: 'claude-opus-5', max_tokens: 700, system: sis,
      messages: [{ role: 'user', content: txt }],
      output_config: { format: { type: 'json_schema', schema: {
        type: 'object',
        properties: {
          respuesta: { type: 'string' },
          acciones: { type: 'array', items: { type: 'object', properties: {
            hacer: { type: 'string', enum: Object.keys(ASIS_ACC) },
            valor: { type: 'string' } },
            required: ['hacer', 'valor'], additionalProperties: false } }
        },
        required: ['respuesta', 'acciones'], additionalProperties: false } } }
    }),
    lee: j => {
      /* la negativa llega con HTTP 200 y no como error */
      if (j.stop_reason === 'refusal') return { corte: 'refusal' };
      const b = (j.content || []).find(c => c.type === 'text');
      return b ? { txt: b.text } : null;
    }
  }
};

function asisProv(){ const p = lee('prov', 'gemini'); return ASIS_PROV[p] ? p : 'gemini'; }
function asisLlave(p){ return lee('llave_' + (p || asisProv()), ''); }

function asisSistema(){
  const L = APPS.filter(a => a.p !== ASIS_PKG)
                .map(a => a.n + ' = ' + a.p).join('\n');
  return 'Sos el asistente de Aero, un launcher de Android. El usuario te pide cosas ' +
    'sobre su pantalla de inicio y vos devolvés JSON con las acciones que el launcher sabe hacer.\n\n' +
    'ACCIONES:\n' +
    '· iconos <40..92>      el lado del icono en píxeles (agrandar/achicar las apps)\n' +
    '· columnas <3..6>      cuántas apps por fila\n' +
    '· abrir <paquete>      abre una app\n' +
    '· fijar <paquete>      la pone en el escritorio\n' +
    '· soltar <paquete>     la saca del escritorio\n' +
    '· buscar <texto>       busca eso en la web\n' +
    '· idioma <es|en|pt>\n' +
    '· mascota <quieto|baila|saluda|mando|duerme>\n' +
    '· cajon <abrir|cerrar> el cajón de todas las apps\n\n' +
    'El estado ahora: iconos ' + ICO + ', columnas ' + COLS + ', idioma ' + LANG + '.\n\n' +
    'APPS INSTALADAS (nombre = paquete; usá el paquete):\n' + L + '\n\n' +
    'Contestá SÓLO con JSON: {"respuesta": "una frase corta en el idioma del usuario", ' +
    '"acciones": [{"hacer": "...", "valor": "..."}]}. ' +
    'Si te piden algo que no está en la lista, devolvé acciones vacías y decilo en la respuesta.';
}

/* ══════════ LA LLAMADA ══════════
   Una sola, para los tres: lo que cambia es el proveedor, no el camino. */
async function asisIA(txt){
  const id = asisProv(), P = ASIS_PROV[id], k = asisLlave(id);
  if (!k) return { modo: 'local' };
  let r;
  try {
    r = await fetch(P.url, { method: 'POST', headers: P.cab(k),
                             body: JSON.stringify(P.cuerpo(asisSistema(), txt)) });
  } catch (e){ return { modo: 'local', porque: T('aSinRed') }; }
  if (r.status === 401 || r.status === 403) return { modo: 'local', porque: T('aLlaveMal', r.status) };
  /* Google contesta 400 con API_KEY_INVALID en vez de 401: un 400 en la primera
     llamada es casi siempre la llave, y decir «la API falló (400)» manda al
     dueño a buscar el problema donde no está */
  if (r.status === 400 && id === 'gemini') return { modo: 'local', porque: T('aLlaveMal', 400) };
  if (!r.ok) return { modo: 'local', porque: T('aFalla', r.status) };
  let j;
  try { j = await r.json(); } catch (e){ return { modo: 'local', porque: T('aFalla', '?') }; }
  const o = P.lee(j);
  if (!o) return { modo: 'local', porque: T('aFalla', '0') };
  if (o.corte) return { modo: 'local', porque: T('aNiega') };
  try {
    const d = JSON.parse(o.txt);
    return { modo: 'ia', prov: P.nombre, respuesta: String(d.respuesta || ''),
             acciones: Array.isArray(d.acciones) ? d.acciones : [] };
  } catch (e){ return { modo: 'local', porque: T('aFalla', '·') }; }
}

/* ══════════ EL INTÉRPRETE DE SIN-LLAVE ══════════
   No compite con el modelo y no lo intenta: entiende las frases que la gente
   escribe de verdad en un launcher, en los tres idiomas, y para lo demás dice
   que no entendió. Lo que lo hace útil es que las mismas acciones de la tabla
   son las que ejecuta, así que lo que aprende uno usándolo sin llave sigue
   valiendo con llave. */
const ASIS_MAS = /\b(grande|grandes|agranda|agrandar|agrandá|m[aá]s grande|bigger|larger|enlarge|maior|aumenta)\b/i;
const ASIS_MEN = /\b(chico|chicos|peque|peque[nñ]|achic|m[aá]s chico|smaller|menor|reduz|reduc)\b/i;

function asisLocal(txt){
  const t = norm(txt), acc = [];
  const num = (t.match(/\b(\d{1,2})\b/) || [])[1];

  if (/\b(icono|iconos|app|apps|aplicacion|aplicaciones|icon|icons)\b/.test(t) &&
      (ASIS_MAS.test(t) || ASIS_MEN.test(t) || num))
    acc.push({ hacer: 'iconos', valor: num && +num >= 40 ? num : (ASIS_MAS.test(t) ? ICO + 12 : ICO - 12) });

  if (/\b(columna|columnas|column|columns|coluna|colunas|fila|filas)\b/.test(t) && num)
    acc.push({ hacer: 'columnas', valor: num });

  if (/\b(abri|abrir|abre|open|abra)\b/.test(t)){
    const a = asisBuscaApp(txt);
    if (a) acc.push({ hacer: 'abrir', valor: a.p });
  }
  if (/\b(fija|fijar|anclar|pin|fixar)\b/.test(t)){
    const a = asisBuscaApp(txt);
    if (a) acc.push({ hacer: 'fijar', valor: a.p });
  }
  if (/\b(solta|soltar|saca|sacar|quita|quitar|unpin|remove|remover)\b/.test(t)){
    const a = asisBuscaApp(txt);
    if (a) acc.push({ hacer: 'soltar', valor: a.p });
  }
  if (/\b(baila|bailar|dance|dan[cç]a)\b/.test(t)) acc.push({ hacer: 'mascota', valor: 'baila' });
  else if (/\b(duerme|dormir|sleep|dorme)\b/.test(t)) acc.push({ hacer: 'mascota', valor: 'duerme' });
  else if (/\b(saluda|saludar|wave|acena)\b/.test(t)) acc.push({ hacer: 'mascota', valor: 'saluda' });

  if (/\b(ingles|english|ingl[eê]s)\b/.test(t)) acc.push({ hacer: 'idioma', valor: 'en' });
  else if (/\b(castellano|espanol|spanish|espanhol)\b/.test(t)) acc.push({ hacer: 'idioma', valor: 'es' });
  else if (/\b(portugues|portuguese)\b/.test(t)) acc.push({ hacer: 'idioma', valor: 'pt' });

  const b = txt.match(/\b(?:busc\w*|search|pesquis\w*)\s+(?:de\s+)?["“]?([^"”]+)["”]?$/i);
  if (b && !acc.length) acc.push({ hacer: 'buscar', valor: b[1].trim() });

  return { modo: 'local', acciones: acc,
           respuesta: acc.length ? '' : T('aNoEntiendo') };
}

/* la app que nombra la frase: se mira el nombre y se toma el más largo que
   aparezca, así «play store» no se resuelve a «Play» */
function asisBuscaApp(txt){
  const t = norm(txt);
  let mej = null;
  for (const a of APPS){
    if (a.p === ASIS_PKG) continue;
    const n = norm(a.n);
    if (n.length > 2 && t.indexOf(n) >= 0 && (!mej || n.length > norm(mej.n).length)) mej = a;
  }
  return mej;
}

/* ══════════ EJECUTAR ══════════
   Todo lo que llega —del modelo o del intérprete— pasa por acá, y acá se
   COMPRUEBA: un número fuera de rango se recorta, un paquete que no existe se
   descarta y una acción que no está en la tabla se ignora. El modelo puede
   inventar; el launcher no puede obedecerle a ciegas. */
function asisHace(acciones){
  const hechas = [];
  for (const a of (acciones || [])){
    const d = ASIS_ACC[a && a.hacer];
    if (!d) continue;
    let v = a.valor;
    if (d.num){
      v = parseInt(String(v).replace(/[^\d-]/g, ''), 10);
      if (!isFinite(v)) continue;
      v = cl(v, d.num[0], d.num[1]);
    } else if (d.uno){
      v = String(v || '').toLowerCase();
      if (d.uno.indexOf(v) < 0) continue;
    } else if (d.app){
      if (!POR_PKG[v]){
        const b = asisBuscaApp(String(v || ''));
        if (!b) continue;
        v = b.p;
      }
    } else if (d.txt){
      v = String(v || '').trim();
      if (!v) continue;
    }
    try { d.hace(v); hechas.push(d.dice(v)); } catch (e){ }
  }
  return hechas;
}

async function asisManda(){
  if (ASIS_PENSANDO) return;
  const e = $('#asTxt'), txt = e.value.trim();
  if (!txt) return;
  e.value = '';
  asisDi('yo', txt);
  ASIS_PENSANDO = true;
  const p = asisDi('bot', '···');
  let r = await asisIA(txt);
  if (r.modo === 'local'){
    const l = asisLocal(txt);
    l.porque = r.porque;
    r = l;
  }
  p.remove();
  const hechas = asisHace(r.acciones);
  const cuerpo = [];
  if (r.respuesta) cuerpo.push(r.respuesta);
  if (hechas.length) cuerpo.push('✓ ' + hechas.join('\n✓ '));
  if (!cuerpo.length) cuerpo.push(T('aNoEntiendo'));
  const d = asisDi('bot', cuerpo.join('\n'));
  /* ── QUIÉN CONTESTÓ VA SIEMPRE, Y NO ES UN DETALLE ──
     Sin esto, «no entendí» del intérprete y «no entendí» del modelo se leen
     igual, y el dueño no tiene forma de saber si le falta poner la llave. */
  const f = document.createElement('div');
  f.className = 'asFirma';
  f.textContent = (r.modo === 'ia' ? T('aPorIA') + ' · ' + r.prov : T('aPorLocal')) +
                  (r.porque ? ' · ' + r.porque : '');

  ASIS_PENSANDO = false;
}

   mandaría la llave de Google a Groq y el dueño vería un 401 sin entender por
   qué, después de haber pegado una llave que funciona. */

/* ══════════════════════ PERSONALIZACIÓN ══════════════════════

   ── LO QUE SE TOCA ACÁ CAMBIA LO QUE ESTÁ DETRÁS, ASÍ QUE SE VE ──
   Es una hoja translúcida y no una pantalla aparte: mover el tamaño del icono
   contra un panel opaco es mover un número a ciegas. Todo se aplica en el acto
   y se guarda; no hay botón de aceptar, porque no hay nada que confirmar.

   ── Y SE ARMA DE UNA TABLA ──
   Cada control declara cómo se lee su valor, qué hace al cambiarlo y qué
   opciones tiene. Escrito control por control, el día que se agregue uno hay
   que acordarse del pintado, del guardado y del repintado; así es una entrada
   más en `PERS`. */

const PERS_PKG = 'ai.rezona.aero.personalizar';

const PERS_ACENTOS = ['#7fe3ff', '#a8e85c', '#ffd166', '#ff8fab',

/* ── LO QUE SE GUARDA SE APLICA AL ARRANCAR, Y DESDE UN SOLO SITIO ──
   Repartido por el arranque, el día que se agregue un ajuste queda uno que se

/* ── OSCURECER ES UN VELO, NO UN `brightness` SOBRE EL FONDO ──
   Un filtro sobre `#fondo` obliga al compositor a repintar la foto entera; un
   velo con `background` es una capa más que ya está ahí. */

function persPinta(){
  $('#persTit').textContent = T('pTit');
  const c = $('#persCuerpo'); c.innerHTML = '';
  for (const g of PERS){
    if (g.ver && !g.ver()) continue;
    const caja = document.createElement('div'); caja.className = 'pGrupo';
    const t = document.createElement('div'); t.className = 'pTit'; t.textContent = T(g.tit);
    caja.appendChild(t);
    const f = document.createElement('div'); f.className = 'pFila';
    if (g.tipo === 'ops'){
      const val = String(g.lee());
      for (const [v, txt] of g.ops()){
        const b = document.createElement('div');
        b.className = 'pOp' + (v === val ? ' sel' : '');
        b.textContent = txt;
        b.addEventListener('click', () => { g.pon(v); vibra(10); persPinta(); });
        f.appendChild(b);
      }
    } else if (g.tipo === 'colores'){
      const val = g.lee();
      for (const col of PERS_ACENTOS){
        const b = document.createElement('div');
        b.className = 'pCol' + (col === val ? ' sel' : '');
        b.style.background = col;
        b.addEventListener('click', () => { g.pon(col); vibra(10); persPinta(); });
        f.appendChild(b);
      }
    } else {
      const r = document.createElement('input');
      r.type = 'range'; r.className = 'pRango';
      r.min = g.min; r.max = g.max; r.step = g.paso; r.value = g.lee();
      const n = document.createElement('div'); n.className = 'pVal';
      n.textContent = r.value + g.sufijo;
      /* ── SE APLICA MIENTRAS SE ARRASTRA ──
         Con `change` el cambio se ve recién al soltar, o sea que el dedo mueve
         un número y la pantalla no contesta hasta el final. El repintado de la
         reja es un `innerHTML` de la página visible, que es barato. */
      r.addEventListener('input', () => { n.textContent = r.value + g.sufijo; g.pon(+r.value); });
      f.appendChild(r); f.appendChild(n);
    }
    caja.appendChild(f); c.appendChild(caja);
  }
}

   2. `window.__A` — las sondas. Como en todos los juegos de este repo: nada de
      «se ve bien», números. `cajas()` mide solapamientos de verdad, `refr()`

];

window.__errs = [];
addEventListener('error', e => { window.__errs.push(String(e.message)); });
addEventListener('unhandledrejection', e => { window.__errs.push('rej:' + String(e.reason)); });

window.__A = {
  /* qué hay puesto ahora mismo */
  estado(){
    return { apps: APPS.length, inicio: INICIO.length, dock: DOCK.length,
             pag: PAG, npag: NPAG, filas: FILAS, cols: COLS,
             cajon: CAJON, menu: MENU_PKG, lang: LANG, puente: HAY_AND,
             hora: $('#hora') ? $('#hora').textContent : null,
             fecha: $('#fecha').textContent };
  },
  /* ── LOS FILTROS DE REFRACCIÓN SE CUENTAN ──
     `backdrop-filter:url(#…)` que apunta a un filtro que no se armó no falla:
     se ignora en silencio y el vidrio queda liso. La única forma de saber que
     el líquido está puesto es contar los <filter> y sus <feImage> con datos. */
  refr(){
    const el = $$('.refr');
    const f = Array.prototype.slice.call(document.querySelectorAll('#svgdefs filter'));
    return { elems: el.length, filtros: f.length,
             ids: f.map(x => x.id),
             mapas: f.map(x => { const i = x.querySelector('feImage');
                                 return i ? (i.getAttribute('href') || '').slice(0, 22) : null; }),
             soporta: CSS.supports('backdrop-filter', 'url(#x)') ||
                      CSS.supports('-webkit-backdrop-filter', 'url(#x)') };
  },
  /* solapamientos entre lo que está visible, medido con las cajas de verdad */
  cajas(){
    const sel = ['#reloj', '#buscaCaja', '#hoja', '#puntos', '#dock', '#bat'];
    const r = [];
    for (const s of sel){
      const e = $(s); if (!e) continue;
      const b = e.getBoundingClientRect();
      const cs = getComputedStyle(e);
      if (b.width < 2 || b.height < 2 || cs.display === 'none' || +cs.opacity < 0.05) continue;
      r.push({ s, x: Math.round(b.left), y: Math.round(b.top),
               w: Math.round(b.width), h: Math.round(b.height) });
    }
    const choques = [];
    for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++){
      const a = r[i], b = r[j];
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h)
        choques.push(a.s + ' × ' + b.s);
    }
    return { n: r.length, cajas: r, choques,
             fuera: r.filter(z => z.y + z.h > innerHeight + 1 || z.y < -1).map(z => z.s) };
  },
  /* ── EL FONDO YA NO CUESTA UN CUADRO, Y ESO SE MIDE ──
     Con el lienzo procedural había un `costo(n)` que promediaba milisegundos de
     dibujo. Ahora no hay nada que dibujar: lo que se puede comprobar es que la
     foto decodificó, que está puesta y que no quedó ni un lienzo vivo. */
  fondo(){
    const f = $('#fondo');
    const bg = getComputedStyle(f).backgroundImage;
    return { ok: FONDO_OK, puesta: f.classList.contains('ok'),
             hondo: f.classList.contains('hondo'),
             tieneFoto: bg.indexOf('data:image') >= 0,
             lienzos: document.querySelectorAll('canvas').length,
             bytes: IMG_FONDO.length, w: FONDO_W, h: FONDO_H };
  },
  /* el widget entero, que es lo único que hay arriba */
  widget(){
    return { hora: $('#hora').textContent, fecha: $('#fecha').textContent,
             pct: $('#wPct').textContent, saludo: $('#wSaludo').textContent,
             arco: +getComputedStyle($('#wArco')).strokeDashoffset.replace('px', '').trim(),
             color: getComputedStyle($('#wArco')).stroke };
  },
  bateria(n, c){ ponBateria({ n: n, c: !!c }); return this.widget(); },
  /* el riel de letras */
  riel(){
    const p = $('#rielPomo');
    return { letras: LETRAS,
             visto: $('#riel').style.display !== 'none',
             pomo: [p.style.top, p.style.height],
             burbuja: $('#burbuja').textContent,
             mirando: LETRAS.length ? letraVisible() : null,
             encabezados: $$('#cajLista .let').map(e => e.textContent) };
  },
  /* arrastrar la barra por el camino del dedo, no llamando a vaALetra */
  arrastraRiel(frac){
    const r = $('#riel'), c = r.getBoundingClientRect();
    const y = c.top + 10 + frac*(c.height - 20);
    const o = { bubbles: true, pointerId: 31, isPrimary: true, clientX: c.left + 15, clientY: y };
    r.dispatchEvent(new PointerEvent('pointerdown', o));
    r.dispatchEvent(new PointerEvent('pointermove', o));
    const q = this.riel();
    r.dispatchEvent(new PointerEvent('pointerup', o));
    return q;
  },
  letra(L){ vaALetra(L); return { marcada: L, top: $('#cajLista').scrollTop,
                                  mirando: letraVisible() }; },
  /* ── LA MASCOTA ──
     Lo que prueba que una animación ANIMA no es su nombre: es cuánto se movió
     un hueso. `mascHueso` devuelve la posición de mundo de uno, así que una
     pose que no mueve nada se ve en el número y no en la pantalla. */
  masc(){
    const m = $('#mascota'), cv = $('#mLien');
    return { on: m.classList.contains('on'), zzz: m.classList.contains('zzz'),
             hoy: MASC_HOY, anim: L3.anim, corre: L3.on, listo: L3.listo,
             huesos: L3.nH, tri: LEMI.nt, vert: LEMI.nv,
             lienzo: cv ? [cv.width, cv.height] : null,
             celda: [MASC_W, MASC_H],
             pixelado: cv ? getComputedStyle(cv).imageRendering : null,
             cabe: mascCabe(), zetas: $$('#mZ span').length };
  },
  mascVer(n){ mascPone(n); return this.masc(); },
  /* ── PARA DÓNDE MUEVE UN EJE ──
     Los ejes de un hueso no se adivinan: se gira uno y se mira dónde quedó la
     punta. Devuelve el desplazamiento de `mira` al girar `nom` un radián sobre
     cada eje de MUNDO, en centímetros del muñeco. */
  mascEje(nom, mira){
    const E = { adelante: EJE_AD, arriba: EJE_AR, derecha: EJE_DE };
    const i = L3.hueso[mira];
    const base = (() => { l3Reposo(); l3Componer();
      return [L3.mundo[i*16+12], L3.mundo[i*16+13], L3.mundo[i*16+14]]; })();
    const out = { reposo: base.map(v => +v.toFixed(3)) };
    for (const k in E){
      for (const sg of [1, -1]){
        l3Reposo(); l3Gira(nom, E[k], sg); l3Componer();
        out[k + (sg > 0 ? '+' : '-')] = [
          +(L3.mundo[i*16+12]-base[0]).toFixed(3),
          +(L3.mundo[i*16+13]-base[1]).toFixed(3),
          +(L3.mundo[i*16+14]-base[2]).toFixed(3)];
      }
    }
    l3Reposo(); l3Componer();
    return out;
  },
  /* la posición de mundo de un hueso en el instante `t` de una animación */
  mascHueso(nom, an, t){
    const i = L3.hueso[nom];
    if (i === undefined) return { error: 'no existe ' + nom, hay: Object.keys(L3.hueso) };
    L3.anim = an || L3.anim; L3.t = t === undefined ? L3.t : t;
    l3Reposo(); (L3_ANIM[L3.anim] || L3_ANIM.quieto)(L3.t); l3Componer();
    const M = L3.mundo, b = L3_BAJA[L3.anim] || 0;
    return { x:+M[i*16+12].toFixed(4), y:+(M[i*16+13]+b).toFixed(4), z:+M[i*16+14].toFixed(4) };
  },
  /* cuánto recorre un hueso a lo largo de una animación: si da cero, esa
     animación no anima, por más que tenga nombre */
  mascRecorre(nom, an, n){
    n = n || 40;
    let mn = [1e9,1e9,1e9], mx = [-1e9,-1e9,-1e9];
    for (let k = 0; k < n; k++){
      const p = this.mascHueso(nom, an, k*(an === 'duerme' ? 6 : 1.4)/n);
      const v = [p.x, p.y, p.z];
      for (let a = 0; a < 3; a++){ mn[a] = Math.min(mn[a], v[a]); mx[a] = Math.max(mx[a], v[a]); }
    }
    return { rango: mx.map((v, a) => +(v - mn[a]).toFixed(4)),
             total: +Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]).toFixed(4) };
  },
  /* el cuadro del muñeco, leído del búfer: un lienzo WebGL sin
     `preserveDrawingBuffer` sale en cero con `toDataURL`, así que se lee con
     `readPixels` y se cuenta cuántos píxeles tienen algo */
  mascPixeles(){
    const gl = L3.gl; if (!gl) return null;
    const w = gl.canvas.width, h = gl.canvas.height;
    const px = new Uint8Array(w*h*4);
    l3Pinta(0);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let n = 0, x0 = w, x1 = -1, y0 = h, y1 = -1, sr = 0, sg = 0, sb = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const i = (y*w + x)*4;
      if (px[i+3] > 8){ n++; sr += px[i]; sg += px[i+1]; sb += px[i+2];
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return { lienzo: [w, h], pintados: n, pct: +(100*n/(w*h)).toFixed(1),
             caja: n ? [x0, y0, x1, y1] : null,
             alto: n ? +((y1-y0+1)/h).toFixed(3) : 0,
             ancho: n ? +((x1-x0+1)/w).toFixed(3) : 0,
             medio: n ? [Math.round(sr/n), Math.round(sg/n), Math.round(sb/n)] : null };
  },
  /* ── LA HOJA DE CONTACTO ──
     Cinco poses una al lado de la otra, en una sola imagen. La mascota se
     dibuja en 64 px de ancho y en la pantalla mide 132: mirarla en la captura
     del launcher no alcanza para juzgar si un brazo sube o baja. Se lee el
     búfer con `readPixels` —un lienzo WebGL sin `preserveDrawingBuffer` sale en
     cero con `toDataURL`—, se da vuelta en vertical (GL devuelve las filas de
     abajo hacia arriba) y se estira con NEAREST, que es como se ve de verdad. */
  mascHoja(esc){
    const gl = L3.gl; if (!gl) return null;
    esc = esc || 4;
    const P = ['quieto','baila','saluda','mando','duerme'];
    const w = gl.canvas.width, h = gl.canvas.height;
    const cv = document.createElement('canvas');
    cv.width = w*esc*P.length; cv.height = h*esc;
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = false;
    cx.fillStyle = '#20304a'; cx.fillRect(0, 0, cv.width, cv.height);
    const uno = document.createElement('canvas');
    uno.width = w; uno.height = h;
    const ux = uno.getContext('2d');
    const px = new Uint8Array(w*h*4);
    const guardo = [L3.anim, L3.t];
    P.forEach((n, k) => {
      L3.anim = n; L3.t = n === 'duerme' ? 3.0 : 0.9;
      l3Pinta(0);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const im = ux.createImageData(w, h);
      for (let y = 0; y < h; y++)
        im.data.set(px.subarray((h-1-y)*w*4, (h-y)*w*4), y*w*4);
      ux.putImageData(im, 0, 0);
      cx.drawImage(uno, k*w*esc, 0, w*esc, h*esc);
      cx.fillStyle = '#fff'; cx.font = '16px system-ui';
      cx.fillText(n, k*w*esc + 8, 20);
    });
    L3.anim = guardo[0]; L3.t = guardo[1];
    return cv.toDataURL('image/png');
  },
  /* ── LO QUE CUESTA LA MASCOTA ──
     Con el fondo procedural había un `costo(n)` que promediaba milisegundos de
     lienzo por cuadro; el fondo pasó a foto y esa sonda se fue con él. Ahora lo
     único que dibuja por cuadro es el muñeco, así que la pregunta vuelve: un
     bucle de render en la pantalla de inicio de un teléfono es batería. */
  mascCosto(n){
    n = n || 60;
    if (!L3.gl) return null;
    l3Pinta(0.016); L3.gl.finish();
    const t0 = performance.now();
    for (let k = 0; k < n; k++) l3Pinta(0.016);
    L3.gl.finish();
    return { ms: +((performance.now()-t0)/n).toFixed(3), cuadros: n,
             tri: LEMI.nt, px: L3.gl.canvas.width*L3.gl.canvas.height,
             corre: L3.on };
  },
  /* el ocio: se le corre el reloj hacia atrás para no esperar siete segundos */
  mascDormir(){ MASC_ULT = Date.now() - 9000; mascOcio(); return this.masc(); },
  mascAburrir(){ MASC_ULT = Date.now(); mascOcio(); return this.masc(); },
  /* abrir el cajón / una página / el menú por el mismo camino que el dedo */
  cajon(v){ verCajon(v !== false); return CAJON; },
  pagina(i){ ponPagina(i); return { pag: PAG, npag: NPAG }; },
  menu(p){ abreMenu(p, innerHeight*0.5); return MENU_PKG; },
  cierra(){ cierraMenu(); return MENU_PKG; },
  /* ── LA SONDA ESCRIBE POR EL CAMINO DEL DEDO ──
     Llamando a `pintaCajon` directo se saltea el escucha de `input`, que es
     quien hace bailar a la mascota: medido, `masc().on` daba false después de
     buscar y parecía que la mascota no andaba. Se despacha un `input` de
     verdad, que es lo que dispara el teclado. */
  buscar(q){
    verCajon(true);
    const i = $('#busca2');
    i.value = q;
    i.dispatchEvent(new Event('input', { bubbles: true }));
    return { n: $$('#cajLista .ap').length,
             nombres: $$('#cajLista .nom').map(e => e.textContent),
             web: $$('#cajLista .web').length,
             textoWeb: ($('#cajLista .web span:last-child') || {}).textContent || null };
  },
  insets(t, b){ window.__insets(t, b); return { filas: FILAS }; },

  /* ══════════ LA REJA ══════════ */
  reja(){
    const c = getComputedStyle(document.documentElement);
    const b = $('#dock .baldosa') || $('#tira .baldosa') || $('#cajLista .baldosa');
    return { ico: ICO, cols: COLS, alto: ALTO_AP, filas: FILAS,
             cssIco: c.getPropertyValue('--ico').trim(),
             cssCols: c.getPropertyValue('--cols').trim(),
             baldosaPx: b ? Math.round(b.getBoundingClientRect().width) : null,
             colsCajon: getComputedStyle($('#cajLista')).gridTemplateColumns.split(' ').length };
  },

  /* ══════════ PERSONALIZACIÓN ══════════ */
  pers(){
    const c = getComputedStyle(document.documentElement);
    return { abierto: $('#pers').classList.contains('on'),
             grupos: $$('#persCuerpo .pTit').map(t => t.textContent),
             acento: c.getPropertyValue('--acento').trim(),
             oscuro: +getComputedStyle($('#oscuro')).opacity,
             mascOn: !!lee('mascOn', 1), mascTam: lee('mascTam', 'media'),
             mascW: c.getPropertyValue('--masc-w').trim(),
             mascH: c.getPropertyValue('--masc-h').trim(),
             visible: $('#mascota').classList.contains('on'), pose: MASC_HOY };
  },
  persAbrir(){ persAbre(); return this.pers(); },
  persCerrar(){ persCierra(); return this.pers(); },
  /* se toca la opción por su texto, que es lo que hace el dedo */
  persToca(grupo, txt){
    const g = $$('#persCuerpo .pGrupo').find(x => x.querySelector('.pTit').textContent === T(grupo));
    if (!g) return { error: 'no está ' + grupo, hay: $$('#persCuerpo .pTit').map(t => t.textContent) };
    const b = $$('.pOp,.pCol', ) .filter(e => g.contains(e))
                .find(e => e.textContent === txt || e.style.background === txt);
    if (!b) return { error: 'no está la opción ' + txt,
                     hay: Array.prototype.slice.call(g.querySelectorAll('.pOp')).map(e => e.textContent) };
    b.click();
    return this.pers();
  },
  /* el rango se mueve por el mismo `input` que dispara el dedo */
  persRango(grupo, v){
    const g = $$('#persCuerpo .pGrupo').find(x => x.querySelector('.pTit').textContent === T(grupo));
    if (!g) return { error: 'no está ' + grupo };
    const r = g.querySelector('.pRango');
    r.value = v; r.dispatchEvent(new Event('input', { bubbles: true }));
    return Object.assign(this.pers(), { reja: this.reja() });
  },

  /* ══════════ EL ASISTENTE ══════════ */
  asis(){
    const e = $('#asis');
    return { abierto: e.classList.contains('on'),
             prov: asisProv(), provs: Object.keys(ASIS_PROV),
             conLlave: !!asisLlave(),
             pkg: ASIS_PKG, enLista: !!POR_PKG[ASIS_PKG],
             acciones: Object.keys(ASIS_ACC),
             msgs: $$('#asLista .asMsg').map(m => m.textContent.slice(0, 120)),
             firmas: $$('#asLista .asFirma').map(m => m.textContent) };
  },
  asisAbrir(){ asisAbre(); return this.asis(); },
  asisCerrar(){ asisCierra(); return this.asis(); },
  asisLlave(v){ guarda('llave_' + asisProv(), v || ''); asisIdioma(); return this.asis(); },
  asisProv(p){ guarda('prov', p); asisIdioma(); return this.asis(); },
  /* el camino ENTERO, por donde entra el dedo: se escribe en el campo y se toca
     el botón, así que si el enganche está roto la sonda no contesta */
  async asisDecir(t){
    $('#asTxt').value = t;
    $('#asMandar').click();
    for (let k = 0; k < 60 && ASIS_PENSANDO; k++)
      await new Promise(r => setTimeout(r, 50));
    return this.asis();
  },
  /* ── PROBAR LA IA SIN GASTAR UNA LLAVE ──
     No tengo ninguna y no se puede embarcar una, así que se intercepta `fetch`,
     se guarda LO QUE EL ASISTENTE IBA A MANDAR y se contesta con una respuesta
     armada a mano. Con eso queda medido lo único que puede estar mal de este
     lado: la dirección, los encabezados, el modelo, el esquema, y que la
     respuesta se lea. Lo que NO queda probado es una llamada de verdad. */
  asisFinge(caso, acciones){
    const org = window.fetch;
    window.__pedido = null;
    window.fetch = async (u, o) => {
      window.__pedido = { url: String(u), metodo: o.metodo || o.method,
                          cab: o.headers, cuerpo: JSON.parse(o.body) };
      if (caso === 'red') throw new TypeError('Failed to fetch');
      if (caso === '401') return { ok: false, status: 401 };
      if (caso === 'niega'){
        const id = asisProv();
        if (id === 'gemini') return { ok: true, status: 200,
          json: async () => ({ candidates: [{ finishReason: 'SAFETY', content: { parts: [] } }] }) };
        if (id === 'groq') return { ok: true, status: 200, json: async () => ({ choices: [] }) };
        return { ok: true, status: 200, json: async () => ({ stop_reason: 'refusal', content: [] }) };
      }
      const t = JSON.stringify({ respuesta: 'listo', acciones: acciones || [] });
      const id = asisProv();
      if (id === 'gemini') return { ok: true, status: 200, json: async () => ({
        candidates: [{ finishReason: 'STOP', content: { parts: [{ text: t }] } }] }) };
      if (id === 'groq') return { ok: true, status: 200, json: async () => ({
        choices: [{ message: { role: 'assistant', content: t } }] }) };
      return { ok: true, status: 200, json: async () => ({
        stop_reason: 'end_turn', content: [{ type: 'text', text: t }] }) };
    };
    return () => { window.fetch = org; };
  },
  /* qué salió por el cable en la última llamada fingida */
  asisPedido(){
    const p = window.__pedido; if (!p) return null;
    const c = p.cuerpo;
    /* el sistema y el enum viven en sitios distintos según el proveedor: lo que
       la sonda tiene que decir es que los TRES los mandan, no cómo se llaman */
    const sis = c.system || (c.systemInstruction && c.systemInstruction.parts[0].text) ||
                (c.messages && (c.messages.find(m => m.role === 'system') || {}).content) || '';
    const esq = (c.output_config && c.output_config.format.schema) ||
                (c.generationConfig && c.generationConfig.responseSchema) || null;
    return { url: p.url, cab: Object.keys(p.cab),
             llaveVa: !!(p.cab['x-api-key'] || p.cab['x-goog-api-key'] || p.cab['authorization']),
             navegador: p.cab['anthropic-dangerous-direct-browser-access'] || null,
             modelo: c.model || 'gemini-2.5-flash',
             tope: c.max_tokens || (c.generationConfig && c.generationConfig.maxOutputTokens),
             formato: (c.output_config && c.output_config.format.type) ||
                      (c.generationConfig && c.generationConfig.responseMimeType) ||
                      (c.response_format && c.response_format.type),
             campos: esq ? Object.keys(esq.properties) : null,
             enum: esq ? esq.properties.acciones.items.properties.hacer.enum : null,
             sistemaTiene: { apps: sis.indexOf('APPS INSTALADAS') >= 0,
                             estado: sis.indexOf('iconos ' + ICO) >= 0 },
             mensaje: (c.messages ? c.messages[c.messages.length-1].content
                                  : c.contents[0].parts[0].text) };
  }
};

/* ── EL PUENTE DE MENTIRA NO PONE BATERÍA, ASÍ QUE LA PONE LA VISTA PREVIA ──
   `pintaBateria()` se rinde sin `AND` a propósito: inventar un porcentaje en el
   teléfono sería mentir. En el navegador, en cambio, dejar el pastillero en «—»
   esconde justamente el elemento que hay que mirar. */
if (!HAY_AND){
  addEventListener('DOMContentLoaded', () => {
    ponBateria({ n: 76, c: false });
    setTimeout(() => avisa(T('sinPuente')), 900);
  });
}

arranca();

</script>
