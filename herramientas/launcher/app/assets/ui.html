<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0a3d6b">
<title>Aero</title>
<style>
/* ══════════════════════ AERO ══════════════════════
   Frutiger Aero + Liquid Glass. Dos estéticas de dos décadas distintas que
   comparten una sola idea: el vidrio muestra lo que hay detrás.

   ── LA JERARQUÍA DEL VIDRIO, Y ES UNA DECISIÓN DE COSTO ──
   `backdrop-filter` con un mapa de desplazamiento refracta de verdad, y cuesta:
   el navegador tiene que recortar lo de atrás, filtrarlo y desplazarlo por cada
   pieza. Con treinta iconos en pantalla eso hunde un teléfono.
   Así que hay dos vidrios: el REFRACTADO va en las piezas grandes y pocas —el
   reloj, la búsqueda, el dock, los paneles— donde la distorsión del borde se ve;
   y el LISO —desenfoque y saturación— va en los iconos, que son muchos y chicos
   y donde una refracción de dos píxeles no se percibe. */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#0a3d6b;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}

:root{
  --ins-t:24px; --ins-b:16px;
  --acento:#7fe3ff;
  --verde:#a8e85c;
  /* ── UN VIDRIO NO TIÑE: DESENFOCA Y TIENE CANTO ──
     Es la diferencia entre esto y un panel pintado, y se mide. Con
     `saturate(200%)` la saturación debajo del widget daba **0,80** contra 0,22
     del fondo libre: el vidrio multiplicaba el color por 3,6 y lo que se veía
     era un slab azul, no la foto a través de algo. El dock, sobre el pasto,
     salía verde lima por lo mismo.
     Así que la saturación queda apenas por encima de 1 —el vidrio la conserva,
     no la inventa—, el brillo pone un techo para que el texto blanco se lea, y
     el trabajo de "esto es vidrio" lo hacen el DESENFOQUE, la REFRACCIÓN del
     canto y el ESPECULAR del borde, que es como se lee en iOS y en HyperOS. */
  --v-fondo:rgba(10,38,70,.15);
  --v-borde:rgba(255,255,255,.55);
  --v-borde-b:rgba(255,255,255,.12);
  --v-sombra:0 10px 30px rgba(3,22,46,.30),0 2px 6px rgba(3,22,46,.18);
}

/* ── EL FONDO ES UNA FOTO, CON UN DEGRADADO DEBAJO ──
   El degradado no es decoración: es lo que se ve mientras la foto decodifica y
   lo que queda si no decodifica nunca. Sin él, el primer cuadro del launcher es
   un rectángulo vacío.
   La deriva y el acercamiento son `transform` puro, o sea que los resuelve el
   compositor y no cuestan un cuadro de JavaScript. El `scale(1.06)` de base
   existe para que la deriva no descubra los bordes. */
#fondo{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#1d7fd6 0%,#3aa8e6 34%,#2fc4d8 58%,#1f9d84 100%);
  background-size:cover;background-position:center;
  transform:scale(1.06);will-change:transform;
  transition:transform .42s cubic-bezier(.22,.9,.24,1),filter .42s ease}
#fondo.ok{animation:deriva 24s ease-in-out infinite alternate}
#fondo.hondo{transform:scale(1.14);filter:saturate(1.12) brightness(.92)}
#veloT,#veloB{position:fixed;left:0;right:0;z-index:0;pointer-events:none}
/* El velo se achicó al bajar el tinte del vidrio: con 44% al 60% el cielo
   entero quedaba embarrado, y el cielo es lo único que este fondo tiene para
   mostrar. Ahora cubre exactamente lo que lleva texto —barra de estado, widget
   y búsqueda terminan en el 25% del alto— y suelta el medio. */
#veloT{top:0;height:30%;
  background:linear-gradient(180deg,rgba(3,26,54,.50) 0%,rgba(3,26,54,.30) 52%,rgba(3,26,54,0) 100%)}
#veloB{bottom:0;height:21%;
  background:linear-gradient(0deg,rgba(3,26,54,.46) 0%,rgba(3,26,54,.18) 60%,rgba(3,26,54,0) 100%)}
@keyframes deriva{
  from{transform:scale(1.06) translate3d(-.9%,-.5%,0)}
  to  {transform:scale(1.09) translate3d(.9%,.6%,0)}}
/* quien pidió menos movimiento no ve ninguno */
@media (prefers-reduced-motion:reduce){#fondo.ok{animation:none}}
#svgdefs{position:fixed;width:0;height:0;pointer-events:none}

#capa{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:var(--ins-t) 0 var(--ins-b)}

/* ══════════ EL VIDRIO ══════════ */
.vid{position:relative;background:var(--v-fondo);
  border:1px solid transparent;
  border-radius:26px;
  /* las cinco sombras internas son el ESPESOR: sin ellas el vidrio es un
     rectángulo translúcido y no una pieza con canto. De arriba abajo: el filo
     de arriba, el filo de abajo —que en un vidrio de verdad recoge la luz del
     fondo y por eso no es negro—, el contorno entero, la luz que se acumula
     por dentro del canto de arriba, y la sombra que le da fondo al de abajo. */
  box-shadow:var(--v-sombra),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 -1px 0 rgba(255,255,255,.20),
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 7px 18px -9px rgba(255,255,255,.38),
    inset 0 -9px 20px -11px rgba(2,22,48,.42);
  backdrop-filter:blur(24px) saturate(120%) brightness(.90);
  -webkit-backdrop-filter:blur(24px) saturate(120%) brightness(.90);
  overflow:hidden}
/* ── EL BORDE ES UN DEGRADADO Y NO UN COLOR ──
   Un borde parejo se lee a contorno dibujado; el canto de un vidrio de verdad
   brilla arriba a la izquierda y se apaga abajo a la derecha, porque es una
   superficie curva reflejando una luz. Va con `mask` de dos capas, que es la
   única forma de tener un degradado SOLO en el borde. */
.vid::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(140deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.42) 20%,
    rgba(255,255,255,.05) 48%,rgba(255,255,255,.14) 74%,rgba(255,255,255,.40) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none;z-index:2}
/* ── EL ESPECULAR ES UNA FRANJA FINA, NO UN LAVADO ──
   Un degradado blanco sobre la mitad de arriba de la pieza no se lee a reflejo:
   se lee a que el vidrio está sucio, y encima aclara justo donde va el texto.
   Un vidrio real concentra la luz en los primeros milímetros del canto. Por eso
   son dos franjas cortas —una arriba y una abajo, la de abajo mucho más floja,
   que es la que recoge el fondo— y el medio queda limpio. */
.vid::after{content:'';position:absolute;inset:0;
  border-radius:inherit;pointer-events:none;z-index:1;
  background:
    linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.10) 9%,
      rgba(255,255,255,0) 20%),
    linear-gradient(0deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 7%,
      rgba(255,255,255,0) 16%)}
.vid>*{position:relative;z-index:3}

/* ── EL REFRACTADO ──
   Además del desenfoque, el fondo se DESPLAZA cerca del canto: eso es lo que
   hace que el borde se lea a lente y no a recorte.
   OJO: `.vid.refr` son dos clases y le gana a `.vid`, así que su filtro no es
   un agregado sino un REEMPLAZO. Escrito con otro `saturate`/`brightness`, las
   cuatro piezas grandes —widget, búsqueda, dock y menú— quedaban con una
   calibración que la de `.vid` ya había descartado, y el dock salía verde.
   Lo único que puede diferir es el desenfoque, y por una razón: el
   desplazamiento ya revuelve el fondo, así que hace falta menos. */
.vid.refr{backdrop-filter:url(#refr) blur(19px) saturate(122%) brightness(.90);
  -webkit-backdrop-filter:url(#refr) blur(19px) saturate(122%) brightness(.90)}

/* ══════════ BARRA DE ARRIBA ══════════ */
#barra{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:2px 20px 0;font-size:13px;font-weight:700;letter-spacing:.04em;
  color:#fff;text-shadow:0 1px 2px rgba(0,32,64,.9),0 0 8px rgba(0,40,80,.6)}
#bIzq{flex:1;opacity:.9}
#bat{display:flex;align-items:center;gap:5px}
#batCaja{width:26px;height:13px;border:1.6px solid rgba(255,255,255,.85);
  border-radius:4px;position:relative;padding:1.6px}
#batCaja::after{content:'';position:absolute;right:-4px;top:3px;width:2.4px;height:5px;
  background:rgba(255,255,255,.85);border-radius:0 2px 2px 0}
#batLlena{height:100%;border-radius:1.5px;background:#b8f078;
  box-shadow:0 0 6px rgba(184,240,120,.8);transition:width .4s}

/* ══════════ RELOJ ══════════ */
/* ── EL WIDGET ──
   Con el inicio sin apps, esto es lo único que hay arriba del dock, así que
   tiene que valer la pantalla que ocupa: hora grande, día y fecha, el aro de
   batería con su porcentaje y el saludo de la franja del día. Todo sale de
   datos que el launcher YA tiene — nada de red, nada de permisos nuevos. */
#reloj{margin:0 18px 10px;padding:13px 16px;border-radius:24px;
  display:flex;align-items:center;gap:14px}
#wIzq{flex:1;min-width:0}
#wDer{flex:0 0 auto;width:70px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#wAro{width:52px;height:52px;transform:rotate(-90deg)}
#wAro circle{fill:none;stroke-width:5;stroke-linecap:round}
#wAro .wPista{stroke:rgba(255,255,255,.28)}
/* 2πr con r=25 → 157,08: el trazo se recorta moviendo el offset */
#wAro .wCarga{stroke:#b8f078;stroke-dasharray:157.08;stroke-dashoffset:47;
  filter:drop-shadow(0 0 5px currentColor);transition:stroke-dashoffset .5s ease}
#wPct{position:absolute;top:17px;font:800 13px/1 system-ui,sans-serif;
  text-shadow:0 1px 2px rgba(0,32,64,.95),0 0 9px rgba(0,38,76,.8)}
#wSaludo{margin-top:3px;font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;opacity:.94;text-align:center;line-height:1.15;
  text-shadow:0 1px 2px rgba(0,32,64,.95),0 0 9px rgba(0,38,76,.85)}
/* ── LA SOMBRA SE CALIBRA CONTRA EL CIELO MÁS CLARO, NO CONTRA EL DE AHORA ──
   Todo el texto de este launcher es blanco y el fondo cambia solo a lo largo
   del día: a las 13 el cielo llega a rgb(218,237,239) y una nube encima de eso
   es casi blanco puro. Medido, con la sombra floja la fecha desaparecía sobre
   la nube que cae a la derecha del reloj. Van dos: una dura y pegada, que da el
   filo, y una ancha y difusa, que baja el fondo alrededor de la letra. */
#hora{font-size:50px;font-weight:200;line-height:.92;letter-spacing:-.03em;
  text-shadow:0 1px 2px rgba(0,38,74,.55),0 2px 20px rgba(0,44,84,.75)}
#fecha{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,34,68,.85),0 0 10px rgba(0,40,80,.65);
  opacity:.88;padding-bottom:9px;line-height:1.45}

/* ══════════ BÚSQUEDA ══════════ */
#buscaCaja{flex:0 0 auto;margin:12px 20px 0;padding:0 16px;height:46px;
  display:flex;align-items:center;gap:10px;border-radius:23px}
#buscaCaja svg{flex:0 0 auto;opacity:.85}
#busca{flex:1;background:transparent;border:0;outline:0;color:#fff;
  font-size:15px;font-weight:500;font-family:inherit;min-width:0;
  text-shadow:0 1px 2px rgba(0,32,64,.9),0 0 10px rgba(0,38,76,.7)}
#busca::placeholder{color:rgba(255,255,255,.74)}

/* ══════════ PÁGINAS DE ICONOS ══════════ */
/* ── EL INICIO NO TIENE APPS ──
   Se pidió así, y cambia lo que la hoja es: ya no es una reja que hay que
   llenar sino el aire entre el widget y el dock. Sigue existiendo porque es
   donde se registra el gesto de subir y donde vive el fondo que se ve. */
#hoja{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
#tira{display:flex;height:100%;will-change:transform}
.pag{flex:0 0 100%;height:100%;display:grid;
  grid-template-columns:repeat(4,1fr);align-content:start;
  gap:6px 0;padding:10px 8px}

.ap{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 2px 6px;border-radius:20px;cursor:pointer;position:relative}
.ap:active{transform:scale(.92)}
.ap{transition:transform .16s cubic-bezier(.2,.9,.3,1.4)}
/* ── EL ICONO VIVE EN UNA BALDOSA DE VIDRIO ──
   Frutiger Aero es skeuomórfico: cada icono es un objeto con volumen, brillo y
   sombra propia. La baldosa da eso sin tocar el icono de la app, que llega como
   viene del sistema. */
.baldosa{width:60px;height:60px;border-radius:17px;position:relative;
  background:rgba(255,255,255,.16);
  box-shadow:0 5px 14px rgba(4,26,52,.30),
    inset 0 1px 0 rgba(255,255,255,.60),
    inset 0 -6px 12px rgba(0,40,80,.10);
  backdrop-filter:blur(12px) saturate(120%) brightness(.92);
  -webkit-backdrop-filter:blur(12px) saturate(120%) brightness(.92);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.baldosa::after{content:'';position:absolute;left:6%;right:6%;top:0;height:46%;
  border-radius:0 0 60% 60%/0 0 34% 34%;
  background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(255,255,255,0));
  pointer-events:none}
.baldosa img{width:46px;height:46px;display:block;
  filter:drop-shadow(0 2px 3px rgba(0,30,60,.35))}
.ap .nom{font-size:11px;font-weight:600;letter-spacing:.01em;max-width:74px;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,30,62,.95),0 1px 6px rgba(0,36,72,.85),0 0 14px rgba(0,40,80,.6)}

/* ══════════ PUNTOS DE PÁGINA ══════════ */

.pt{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.32);
  transition:all .25s}
.pt.on{background:#fff;width:18px;border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.8)}

/* ══════════ DOCK ══════════ */
#dock{flex:0 0 auto;margin:0 14px;padding:10px 6px 8px;border-radius:30px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:0}

/* ══════════ CAJÓN ══════════ */
/* ── LA HOJA ESMERILADA DEJA VER EL FONDO, Y ESO NO ES ADORNO ──
   Con el tinte al 90% el cajón tapaba el cielo entero y la mitad de arriba del
   teléfono se volvía un rectángulo azul plano: se perdía justo lo único que
   este launcher tiene para mostrar. El desenfoque hace el trabajo de separar
   los iconos del fondo; el tinte sólo tiene que garantizar que el texto blanco
   se lea sobre lo más claro que el cielo pueda ponerse al mediodía. */
#cajon{position:fixed;inset:0;z-index:3;transform:translateY(100%);
  transition:transform .34s cubic-bezier(.22,.9,.24,1);
  /* ── EL CAJÓN NECESITA MÁS QUE EL INSET ──
     El inset es donde TERMINA la barra de estado; pegar la búsqueda ahí deja el
     borde del vidrio rozando los iconos del sistema, que es lo que se vio en el
     teléfono. Ocho píxeles de aire lo separan sin comerse pantalla. */
  display:flex;flex-direction:column;padding:calc(var(--ins-t) + 8px) 0 var(--ins-b);
  background:linear-gradient(180deg,rgba(9,44,84,.34) 0%,rgba(8,38,74,.44) 40%,rgba(6,30,60,.56) 100%);
  backdrop-filter:blur(34px) saturate(118%) brightness(.84);
  -webkit-backdrop-filter:blur(34px) saturate(118%) brightness(.84)}
/* ── EL ARRASTRE VA POR VARIABLE Y NO POR `style.transform` ──
   Escribiendo el transform inline, `verCajon(false)` saca `.on` pero el inline
   le gana por especificidad y el cajón queda clavado donde estaba el dedo.
   Con una variable que sólo lee la regla `.on`, cerrar vuelve a valer siempre:
   sin `.on` no hay quien la mire. */
#cajon{--caj-y:0px}
#cajon.on{transform:translateY(var(--caj-y))}
#cajon.tira{transition:none}
#cajTit{flex:0 0 auto;padding:0 20px 4px;font-size:10px;font-weight:700;
  letter-spacing:.16em;opacity:.72;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,20,45,.6)}
/* ── LA BÚSQUEDA VIVE ADENTRO DEL CAJÓN ──
   Estaba en el escritorio, o sea DEBAJO del cajón: enfocarla abría el cajón y
   el cajón la tapaba, así que se escribía a ciegas — medido, tecleando «mer»
   la lista filtraba y el cuadro de texto no se veía por ningún lado. Hay un
   solo campo que recibe letras y está donde se está mirando; el del escritorio
   pasa a ser el botón que lo abre. */
#cajBusca{flex:0 0 auto;margin:0 12px 6px;padding:0 13px;height:40px;
  display:flex;align-items:center;gap:9px;border-radius:20px}
#cajBusca input{flex:1;background:none;border:0;outline:none;color:#fff;
  font:600 14px/1 system-ui,sans-serif;min-width:0}
#cajBusca input::placeholder{color:rgba(255,255,255,.82);font-weight:500}
#cajBusca input::-webkit-search-cancel-button{-webkit-appearance:none}
/* ── LA MANIJA: SE VE Y SE AGARRA ──
   `touch-action:none` es todo el arreglo de «no baja»: acá el gesto vertical es
   nuestro y el navegador no lo cancela a mitad de camino. */
#cajManija{flex:0 0 auto;height:20px;display:flex;align-items:center;
  justify-content:center;touch-action:none;cursor:grab}
#cajManija i{width:40px;height:4px;border-radius:3px;background:rgba(255,255,255,.62);
  box-shadow:0 0 10px rgba(255,255,255,.4)}
#cajon.tira #cajManija{cursor:grabbing}

#cajCuerpo{flex:1 1 auto;min-height:0;display:flex;position:relative}
#cajLista{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-y;display:grid;grid-template-columns:repeat(4,1fr);
  align-content:start;gap:2px 0;padding:4px 26px 26px 10px}
/* la fila de buscar en la web y el «sin resultados» cruzan la reja entera */
#cajLista .vacio{grid-column:1/-1;text-align:center;opacity:.72;padding:22px 12px 6px;
  font-size:14px;text-shadow:0 1px 3px rgba(0,20,45,.7)}
#cajLista .web{grid-column:1/-1;margin:10px 6px 0;padding:12px 14px;border-radius:18px;
  display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;
  text-shadow:0 1px 3px rgba(0,20,45,.7)}
#cajLista .web:active{background:rgba(255,255,255,.26)}
#cajLista .web .lupa{flex:0 0 auto;opacity:.9}
#cajLista .web span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* el encabezado de letra cruza la reja entera */
#cajLista .let{grid-column:1/-1;padding:7px 6px 1px;font:800 10px/1 system-ui,sans-serif;
  letter-spacing:.18em;opacity:.72;text-shadow:0 1px 3px rgba(0,20,45,.7)}

/* ── EL RIEL DE LETRAS ──
   Sólo lleva las letras que TIENEN apps: un riel con las 26 fijas manda a la
   nada en la mitad de los toques, y eso se siente a que el riel está roto. */
/* ── EL ÍNDICE ES UNA BARRA, NO UNA COLUMNA DE LETRAS ──
   Pedido textual: «el buscador por letra lo quería así por la barra nomás».
   Y es mejor: una columna con las 26 letras a 10 px es un blanco de diez
   píxeles por letra, se lee a lista de tipos y ocupa ancho permanente. Una
   barra fina —la de Xiaomi, la de iOS— no ocupa nada, se agarra donde uno la
   ve, y la letra sale en una burbuja mientras el dedo va. El ancho de la zona
   sensible NO es el de la barra: la barra mide 4 px y la zona 30, porque hay
   que poder agarrarla sin apuntar. Y los 30 arrancan a 12 px del canto, que es
   lo que deja afuera al gesto de «atrás» de Android. */
#riel{position:absolute;top:0;bottom:0;right:0;width:30px;touch-action:none;
  display:flex;align-items:center;justify-content:center;z-index:2;
  user-select:none;-webkit-user-select:none}
#rielPista{position:absolute;top:10px;bottom:10px;right:13px;width:4px;
  border-radius:2px;background:rgba(255,255,255,.16)}
#rielPomo{position:absolute;right:12px;width:6px;border-radius:3px;
  background:rgba(255,255,255,.62);box-shadow:0 0 8px rgba(255,255,255,.5);
  transition:width .14s,background .14s,box-shadow .14s}
#riel.on #rielPomo{width:8px;right:11px;background:#eafcff;
  box-shadow:0 0 14px rgba(180,240,255,.9)}

/* la burbuja con la letra grande, sólo mientras el dedo va por el riel */
#burbuja{position:absolute;right:44px;top:50%;transform:translateY(-50%) scale(.7);
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font:800 30px/1 system-ui,sans-serif;color:#062a44;
  background:radial-gradient(circle at 34% 28%,#eafcff,#8fe0f7 62%,#4fc0e8);
  box-shadow:0 8px 22px rgba(0,40,80,.45),inset 0 2px 0 rgba(255,255,255,.9);
  opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:3}
#burbuja.on{opacity:1;transform:translateY(-50%) scale(1)}

/* ── LA MASCOTA: OCHO CUADROS Y CINCO ANIMACIONES ──
   Una sola tira con la MISMA celda para las ocho poses, así que animar es
   correr la x por pasos. Qué celdas usa cada animación lo dice `MASC_ANIM`, que
   sale del horneado, y los `@keyframes` los arma el JS a partir de esa tabla:
   escritos a mano acá, agregar un cuadro obligaría a recalcular cinco
   porcentajes y el que se olvide deja una animación mostrando medias mascotas.
   Baila mientras se escribe —que es lo que se pidió—, se aburre a los dos
   segundos y se duerme a los siete. */
/* ── LA VENTANA RECORTA LA TIRA, Y SIN ESO SE VEN LAS OCHO ──
   La tira mide `MASC_N` veces la ventana y la animación corre la x. Sin
   `overflow:hidden` el contenedor no recorta nada: medido en la captura, salían
   las mascotas seguidas y casi todas fuera de la pantalla. La ventana es de UNA
   celda; la tira se mueve detrás.
   El recorte va en `#mVent` y no en `#mascota` porque las zetas del sueño salen
   POR ENCIMA de la cabeza, o sea fuera de la celda: recortando arriba de todo,
   la mitad del gesto se pierde. */
#mascota{position:absolute;left:50%;bottom:16px;width:var(--mw-masc);
  height:var(--mh-masc);margin-left:calc(var(--mw-masc)/-2);
  opacity:0;transform:translateY(14px) scale(.86);pointer-events:none;
  transition:opacity .22s ease,transform .28s cubic-bezier(.22,1.4,.36,1);z-index:2;
  filter:drop-shadow(0 6px 14px rgba(0,40,80,.5))}
#mascota.on{opacity:1;transform:translateY(0) scale(1)}
#mVent{width:100%;height:100%;overflow:hidden}
#mTira{width:calc(var(--masc-n)*100%);height:100%;
  background-image:var(--masc);background-size:100% 100%}
/* ── EL DESTINO DE CADA ANIMACIÓN LO CALCULA EL JS ──
   `translateX` en porcentaje es del propio elemento, y la tira mide N celdas, y
   `steps(n)` NUNCA llega al valor final: se detiene en n escalones antes. Para
   que la animación que empieza en la celda `i` y dura `c` cuadros caiga justo en
   i, i+1 … i+c-1, el recorrido tiene que ir de -i/N a -(i+c)/N. Eso es una
   cuenta, no un número: la hace `mascCSS()` a partir de `MASC_ANIM`. */
/* y el cabeceo va aparte: encima de los pasos, para que no sea un flipbook seco */
#mascota.on{animation:chill 1.32s ease-in-out infinite alternate}
@keyframes chill{from{transform:translateY(2px) rotate(-3deg)}
                 to  {transform:translateY(-4px) rotate(3deg)}}
/* ── LAS ZETAS VAN DIBUJADAS POR CÓDIGO ──
   Pedidas con todas las letras: «durmiendo con z saliendo de su cabeza». No van
   en la hoja generada por dos razones: pesan cero, y sobre todo se MUEVEN — una
   zeta quieta pintada en el cuadro se lee a calcomanía. Salen de un costado de
   la cabeza, suben y se apagan, las tres desfasadas: con las tres en fase se
   leen a un solo gesto repetido. */
/* el 18% del alto de la celda es donde arranca la cabeza en los cuadros del
   sueño (medido: 28 px de 151), así que la zeta sale de la sien y no del aire */
#mZ{position:absolute;left:60%;top:18%;width:0;height:0}
#mZ span{position:absolute;font:800 13px/1 system-ui,sans-serif;color:#eafcff;
  text-shadow:0 1px 3px rgba(0,36,72,.95),0 0 8px rgba(0,44,86,.7);opacity:0}
#mZ span:nth-child(2){font-size:11px}
#mZ span:nth-child(3){font-size:9px}
#mascota.zzz #mZ span{animation:zeta 2.7s ease-out infinite}
#mascota.zzz #mZ span:nth-child(2){animation-delay:.9s}
#mascota.zzz #mZ span:nth-child(3){animation-delay:1.8s}
@keyframes zeta{
  0%  {opacity:0;transform:translate(0,6px) scale(.55) rotate(-10deg)}
  16% {opacity:1}
  100%{opacity:0;transform:translate(22px,-26px) scale(1.2) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){
  #mTira{animation:none!important}#mascota.on{animation:none}
  #mascota.zzz #mZ span{animation:none;opacity:.85}}
/* ── EL TIRADOR SE VE Y NO SE TOCA ──
   Medido: la barra caía en y 848-874 y el dock termina en 876, así que se le
   montaba encima 26 px justo sobre dos de los cuatro iconos —
   `elementFromPoint(206, 870)` devolvía `tirador`, o sea que el dedo que iba a
   una app abría el cajón. El gesto de subir vive en el escritorio, en la fila
   de puntos y en el dock (ver `enganchaSubir`); esto es sólo la marca que dice
   que ese gesto existe. */
#tirador{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--ins-b) + 2px);width:120px;height:26px;z-index:2;
  pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
#tirador i{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.55);
  box-shadow:0 0 10px rgba(255,255,255,.45)}

/* ══════════ MENÚ DE UNA APP ══════════ */
#velo{position:fixed;inset:0;z-index:4;background:rgba(4,24,48,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
#menu{position:fixed;z-index:5;left:50%;transform:translate(-50%,10px) scale(.94);
  width:min(300px,82vw);border-radius:24px;padding:8px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s cubic-bezier(.2,.9,.3,1.3)}
#menu.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
#menuTit{padding:12px 16px 10px;font-size:15px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mop{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;
  font-size:15px;font-weight:600;cursor:pointer}
.mop:active{background:rgba(255,255,255,.18)}
.mop.peli{color:#ffb3b8}
.mop .ic{width:20px;text-align:center;opacity:.85}

/* ══════════ AVISO ══════════ */
#aviso{position:fixed;left:50%;transform:translateX(-50%);z-index:6;
  bottom:calc(var(--ins-b) + 84px);padding:11px 20px;border-radius:22px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;
  white-space:nowrap}
#aviso.on{opacity:1}

/* ══════════ CARGANDO ══════════ */
#carga{position:fixed;inset:0;z-index:7;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,#1a6fb8,#4fb3e8 55%,#a8e2f7);
  transition:opacity .5s}
#carga.off{opacity:0;pointer-events:none}
#cargaT{font-size:34px;font-weight:200;letter-spacing:.3em;
  text-shadow:0 2px 20px rgba(0,60,110,.5)}
#cargaB{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
#cargaB i{display:block;height:100%;width:34%;border-radius:2px;background:#fff;
  box-shadow:0 0 12px #fff;animation:vaiven 1.1s ease-in-out infinite}
@keyframes vaiven{0%{margin-left:-34%}100%{margin-left:100%}}
</style>
</head>

/* ══════════════════════ EL FONDO ══════════════════════

   ── ES UNA FOTO, Y ESO ES LA OPTIMIZACIÓN ──
   Antes esto era un lienzo procedural: ocho cielos interpolados por hora, nubes,
   agua, rayos de sol, burbujas y hojas, redibujado treinta veces por segundo
   sobre toda la pantalla. Medido, 0,205 ms de JavaScript por cuadro **más** el
   relleno de 412×892 píxeles, y encima cada `backdrop-filter` del vidrio vuelve
   a leer esos píxeles. Una foto no cuesta un solo cuadro: el compositor la sube
   a la GPU una vez y no la vuelve a tocar nunca.

   Lo único que se mueve es una deriva de veinticuatro segundos hecha con
   `transform`, que el compositor resuelve solo — no pasa por JavaScript ni por
   el hilo principal, así que sigue costando cero.

   Lo que quedó de la versión anterior es la idea de que el fondo tiene que
   RESPONDER: al abrir el cajón se acerca un poco. Eso es lo que hace que la
   hoja esmerilada se lea a hoja sobre algo y no a pantalla nueva. */

let FONDO_EL = null, FONDO_OK = false;

function fondoInit(){
  FONDO_EL = $('#fondo');

  /* ── LA FOTO ENTRA CUANDO LLEGA, NO ANTES ──
     Es un data URI de 113 KB: decodificarlo es asincrónico. Poniéndola como
     `background-image` de una, el primer cuadro es un rectángulo vacío. Se
     precarga en un `Image` y recién cuando decodificó se enciende, con el
     degradado de respaldo debajo mientras tanto. */
  const im = new Image();
  im.onload = () => {
    FONDO_EL.style.backgroundImage = 'url(' + IMG_FONDO + ')';
    FONDO_EL.classList.add('ok');
    FONDO_OK = true;
  };
  im.onerror = () => { FONDO_OK = false; };   /* queda el degradado, que ya se ve */
  im.src = IMG_FONDO;
}

/* ── EL FONDO SE ACERCA CUANDO SE ABRE EL CAJÓN ──
   Una clase y nada más: la transición la hace el compositor. */
function fondoProfundo(v){
  if (FONDO_EL) FONDO_EL.classList.toggle('hondo', !!v);
}
/* ══════════════════════ EL VIDRIO ══════════════════════
   ── QUÉ SEPARA «VIDRIO ESMERILADO» DE «LIQUID GLASS» ──
   Un `backdrop-filter: blur()` da vidrio esmerilado: lo de atrás se ve borroso y
   nada más. Lo que hace que se lea a vidrio GRUESO es que el canto REFRACTA — lo
   que hay detrás se corre y se comprime cerca del borde, porque ahí la
   superficie está curvada y el rayo se dobla.

   Eso en la web se hace con un `feDisplacementMap`: una imagen cuyo canal rojo
   dice cuánto correr cada píxel en x y el verde cuánto en y. El mapa se calcula
   de la geometría de la propia pieza —la distancia con signo a un rectángulo
   redondeado— así que la banda de refracción sigue la esquina redondeada exacta
   en vez de ser un marco recto.

   ── Y SE GENERA UNO POR PIEZA, NO UNO SOLO ──
   `feImage` estira el mapa al tamaño del elemento. Con un mapa compartido, el
   dock —ancho y bajo— tendría el canto de arriba con una banda tres veces más
   gruesa que la de los lados. Cada pieza tiene el suyo, a su tamaño y con su
   radio, y se rehace cuando cambia de tamaño. */

const REFR_SOP = (function(){
  try { return CSS.supports('backdrop-filter', 'url(#x)')
             || CSS.supports('-webkit-backdrop-filter', 'url(#x)'); }
  catch (e){ return false; }
})();

/* cuánto entra la refracción desde el canto, y cuánto se desvía */
const REFR_BANDA = 17, REFR_ESC = 46, REFR_MAXLADO = 640;

function mapaRefraccion(w, h, radio, banda){
  /* el mapa se calcula a media resolución: es un campo suave sin un solo borde
     nítido, y a la mitad de lado cuesta la cuarta parte */
  const e = Math.min(1, REFR_MAXLADO/Math.max(w, h), .5);
  const W = Math.max(8, Math.round(w*e)), H = Math.max(8, Math.round(h*e));
  const r = radio*e, b = Math.max(2, banda*e);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const im = x.createImageData(W, H), D = im.data;
  const bx = W/2, by = H/2;
  for (let j = 0; j < H; j++){
    for (let i = 0; i < W; i++){
      /* distancia con signo a un rectángulo redondeado, y su gradiente, que es
         la normal de la superficie en ese punto */
      const px = i + .5 - bx, py = j + .5 - by;
      const qx = Math.abs(px) - (bx - r), qy = Math.abs(py) - (by - r);
      const mx = Math.max(qx, 0), my = Math.max(qy, 0);
      const L = Math.hypot(mx, my);
      const d = L + Math.min(Math.max(qx, qy), 0) - r;   /* < 0 adentro */
      let nx = 0, ny = 0;
      if (L > 1e-6){ nx = mx/L*Math.sign(px); ny = my/L*Math.sign(py); }
      else if (qx > qy){ nx = Math.sign(px); }
      else { ny = Math.sign(py); }
      /* ── EL PERFIL SE CONCENTRA EN EL CANTO ──
         Con una rampa lineal el vidrio se ve como si TODO estuviera curvado y la
         imagen de atrás queda deformada de punta a punta. Elevado a 2,6, el
         centro queda plano —que es como se ve un vidrio de verdad— y la
         distorsión aparece sólo en el último milímetro. */
      const t = cl(1 + d/b, 0, 1);
      const k = Math.pow(t, 2.6);
      const R = Math.round(cl(.5 + nx*k*.5, 0, 1)*255);
      const G = Math.round(cl(.5 + ny*k*.5, 0, 1)*255);
      const o = (j*W + i)*4;
      D[o] = R; D[o+1] = G; D[o+2] = 128; D[o+3] = 255;
    }
  }
  x.putImageData(im, 0, 0);
  return c.toDataURL('image/png');
}

let REFR_N = 0;
const REFR_OBS = typeof ResizeObserver !== 'undefined'
  ? new ResizeObserver(es => { for (const q of es) refrActualiza(q.target); }) : null;

function refrActualiza(el){
  const r = el.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if (w < 8 || h < 8) return;
  if (el.__rw === w && el.__rh === h) return;
  el.__rw = w; el.__rh = h;
  const radio = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20;
  const src = mapaRefraccion(w, h, Math.min(radio, Math.min(w, h)/2 - 1), REFR_BANDA);
  const img = document.getElementById(el.__rid + 'i');
  const dsp = document.getElementById(el.__rid + 'd');
  if (img) img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', src);
  if (img) img.setAttribute('href', src);
  /* el desvío se acota a lo que la pieza mide: en el dock, 23 px de
     desplazamiento sobre 56 de alto darían un espejo y no un canto */
  if (dsp) dsp.setAttribute('scale', String(Math.min(REFR_ESC, Math.min(w, h)*0.42)));
}

function vidrioInit(){
  const defs = document.querySelector('#svgdefs defs');
  const piezas = $$('.refr');
  if (!REFR_SOP || !defs){
    /* degradación honesta: sin refracción quedan el desenfoque, la saturación,
       el borde en degradado y el especular, que ya es el 80 % del efecto */
    for (const el of piezas) el.classList.remove('refr');
    return false;
  }
  for (const el of piezas){
    const id = 'rf' + (++REFR_N);
    el.__rid = id;
    const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    f.setAttribute('id', id);
    f.setAttribute('x', '0%'); f.setAttribute('y', '0%');
    f.setAttribute('width', '100%'); f.setAttribute('height', '100%');
    f.setAttribute('color-interpolation-filters', 'sRGB');
    const im = document.createElementNS('http://www.w3.org/2000/svg', 'feImage');
    im.setAttribute('id', id + 'i');
    im.setAttribute('result', 'm');
    im.setAttribute('preserveAspectRatio', 'none');
    const dm = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
    dm.setAttribute('id', id + 'd');
    dm.setAttribute('in', 'SourceGraphic'); dm.setAttribute('in2', 'm');
    dm.setAttribute('scale', String(REFR_ESC));
    dm.setAttribute('xChannelSelector', 'R'); dm.setAttribute('yChannelSelector', 'G');
    f.appendChild(im); f.appendChild(dm); defs.appendChild(f);
    const b = 'url(#' + id + ') blur(11px) saturate(200%) brightness(1.14)';
    el.style.backdropFilter = b; el.style.webkitBackdropFilter = b;
    refrActualiza(el);
    if (REFR_OBS) REFR_OBS.observe(el);
  }
  /* el filtro de plantilla del HTML ya no lo usa nadie */
  const viejo = document.getElementById('refr');
  if (viejo && viejo.parentNode) viejo.parentNode.removeChild(viejo);
  return true;
}
/* ══════════════════════ EL ESCRITORIO ══════════════════════ */

let APPS = [], POR_PKG = {};
let INICIO = [], DOCK = [];
let PAG = 0, NPAG = 1, FILAS = 4;
let CAJON = false, MENU_PKG = null;

/* ══════════ ICONOS ══════════
   El PNG lo sirve el cliente del WebView desde `https://icono.aero/<paquete>`.
   En un navegador sin puente esa dirección no existe: ahí se dibuja una baldosa
   con la inicial, que es lo que hace cualquier launcher con una app sin icono. */
function iconoUrl(p){ return 'https://icono.aero/' + encodeURIComponent(p) + '?l=144'; }
function letraDe(n){
  const c = norm(n).replace(/[^a-z0-9áéíóúñ]/g, '');
  return (c[0] || '?').toUpperCase();
}
function colorDe(p){
  let h = 0;
  for (let i = 0; i < p.length; i++) h = (h*31 + p.charCodeAt(i)) >>> 0;
  return 'hsl(' + (h % 360) + ',72%,58%)';
}
function nodoApp(a, conNombre){
  const d = document.createElement('div');
  d.className = 'ap'; d.dataset.p = a.p;
  const b = document.createElement('div');
  b.className = 'baldosa';
  if (HAY_AND){
    const im = document.createElement('img');
    im.src = iconoUrl(a.p); im.alt = ''; im.draggable = false;
    im.onerror = () => { b.innerHTML = ''; b.style.background = colorDe(a.p); b.textContent = letraDe(a.n);
                         b.style.font = '700 26px system-ui'; };
    b.appendChild(im);
  } else {
    b.style.background = colorDe(a.p);
    b.style.font = '700 26px system-ui';
    b.textContent = letraDe(a.n);
  }
  d.appendChild(b);
  if (conNombre !== false){
    const n = document.createElement('div');
    n.className = 'nom'; n.textContent = a.n;
    d.appendChild(n);
  }
  return d;
}

/* ══════════ CUÁNTAS FILAS ENTRAN ══════════
   Medido y no escrito: en un teléfono corto una fila de más queda cortada por el
   dock, y en uno largo sobra medio escritorio vacío. */
function calculaFilas(){
  const h = $('#hoja').getBoundingClientRect().height;
  FILAS = cl(Math.floor((h - 12)/ALTO_AP), 2, 6);
  return FILAS;
}

function pintaInicio(){
  calculaFilas();
  const porPag = COLS*FILAS;
  const lista = INICIO.map(p => POR_PKG[p]).filter(Boolean);
  NPAG = Math.max(1, Math.ceil(lista.length/porPag));
  PAG = cl(PAG, 0, NPAG - 1);

  const tira = $('#tira');
  tira.innerHTML = '';
  for (let q = 0; q < NPAG; q++){
    const pg = document.createElement('div');
    pg.className = 'pag';
    for (const a of lista.slice(q*porPag, (q + 1)*porPag)) pg.appendChild(nodoApp(a));
    tira.appendChild(pg);
  }
  tira.style.width = (NPAG*100) + '%';
  $$('.pag').forEach(p => { p.style.flexBasis = (100/NPAG) + '%'; });
  ponPagina(PAG, false);

}
function ponPagina(n, suave){
  PAG = cl(n, 0, NPAG - 1);
  const t = $('#tira');
  t.style.transition = suave === false ? 'none' : 'transform .30s cubic-bezier(.22,.9,.24,1)';
  t.style.transform = 'translateX(' + (-PAG*(100/NPAG)) + '%)';
}

function pintaDock(){
  const d = $('#dock'); d.innerHTML = '';
  for (const p of DOCK.slice(0, 4)){
    const a = POR_PKG[p]; if (!a) continue;
    d.appendChild(nodoApp(a, false));
  }
  d.style.visibility = DOCK.length ? 'visible' : 'hidden';
}

/* ── LA LETRA DE UNA APP ──
   Sale del nombre YA sin acentos, así que Ángela cae en la A y no en una
   sección aparte; lo que no empieza con letra va a «#», que es donde lo pone
   cualquier lista alfabética. */
function letraIni(a){
  const c = norm(a.n).charAt(0);
  return (c >= 'a' && c <= 'z') ? c.toUpperCase() : '#';
}

let LETRAS = [];          /* las letras que de verdad tienen apps */
let ANCLA = {};           /* letra → el nodo de su encabezado, para poder saltar */

function pintaCajon(filtro){
  const l = $('#cajLista');
  const q = norm(filtro || '');
  /* ── EL NOMBRE MANDA Y EL PAQUETE ES LA RED ──
     Buscando por los dos a la vez, «mer» devolvía Cámara: `com.android.ca-MER-a2`
     lo contiene. El paquete sólo entra cuando el nombre no encontró nada, que
     es cuando de verdad sirve (buscar «whatsapp» sin acordarse del icono). */
  let v = APPS;
  if (q){
    v = APPS.filter(a => norm(a.n).indexOf(q) >= 0);
    if (!v.length) v = APPS.filter(a => norm(a.p).indexOf(q) >= 0);
  }

  l.innerHTML = '';
  LETRAS = []; ANCLA = {}; PEDIDA = null;

  /* ── LOS ENCABEZADOS SÓLO EXISTEN SIN FILTRO ──
     Con dos resultados, partirlos en dos secciones de uno es ruido; y el riel
     no tiene a dónde saltar, así que también se esconde. */
  const porLetra = !q;
  let ult = '';
  for (const a of v){
    if (porLetra){
      const L = letraIni(a);
      if (L !== ult){
        ult = L;
        const h = document.createElement('div');
        h.className = 'let'; h.textContent = L; h.dataset.l = L;
        l.appendChild(h);
        LETRAS.push(L); ANCLA[L] = h;
      }
    }
    l.appendChild(nodoApp(a));
  }
  if (!v.length && q){
    const e = document.createElement('div');
    e.className = 'vacio';
    e.textContent = T('nada');
    l.appendChild(e);
  }

  /* ── BUSCAR EN LA WEB ES UNA FILA, NO UN ATAJO DE TECLADO ──
     Estaba sólo en el Enter y sólo cuando no había ninguna app: o sea que en un
     teléfono, donde no hay Enter a la vista, no existía. Va como una fila al
     final de los resultados, visible desde la primera letra: así el cajón es
     además un buscador, que es lo que se pidió. */
  if (q){
    const w = document.createElement('div');
    w.className = 'web';
    /* la misma lupa que el buscador: dos dibujos distintos para lo mismo se
       leen a dos cosas distintas */
    w.innerHTML = '<svg class="lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" '
                + 'stroke="#fff" stroke-width="2.4" stroke-linecap="round">'
                + '<circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.6 15.6L21 21"/></svg>';
    const t = document.createElement('span');
    t.textContent = T('web', filtro);
    w.appendChild(t);
    w.addEventListener('click', () => aLaWeb(filtro));
    l.appendChild(w);
  }
  $('#cajTit').textContent = q ? (v.length + ' \u00b7 ' + T('todas')) : T('todas');
  pintaRiel();
}

/* ══════════ LA BARRA DEL ÍNDICE ══════════ */
function pintaRiel(){
  /* con una sección sola no hay a dónde saltar */
  $('#riel').style.display = LETRAS.length > 1 ? 'flex' : 'none';
  ponPomo();
}

/* ── EL POMO MIDE LO QUE SE VE, NO UN ALTO FIJO ──
   Un pomo de tamaño constante miente sobre cuánto falta. El alto es la fracción
   de la lista que entra en la ventana, y su posición la fracción ya recorrida:
   así la barra dice de una ojeada dónde está uno, que es todo lo que una barra
   tiene que hacer. */
function ponPomo(){
  const l = $('#cajLista'), p = $('#rielPomo'), r = $('#riel');
  if (!p || r.style.display === 'none') return;
  const alto = r.clientHeight - 20;
  const vis = l.clientHeight / Math.max(1, l.scrollHeight);
  const h = Math.max(34, alto*vis);
  const max = Math.max(1, l.scrollHeight - l.clientHeight);
  const k = Math.min(1, l.scrollTop / max);
  p.style.height = h + 'px';
  p.style.top = (10 + k*(alto - h)) + 'px';
}

/* ── LA LETRA QUE SE ESTÁ MIRANDO SE MIDE, NO SE CUENTA ──
   «Al ir bajando detecta las apps de esas letras»: la letra actual es la del
   último encabezado que ya pasó por arriba del borde de la lista. Comparando
   posiciones de verdad, funciona igual con dos apps que con trescientas y no
   depende de cuántas filas entren. */
/* ── ABAJO DE TODO, LA LETRA ES LA QUE SE PIDIÓ ──
   Las últimas secciones no pueden subir al borde: `scrollTop` llega al tope
   antes. Medido, tocar «S» dejaba «R» arriba y el riel marcando otra cosa que
   la que se estaba mirando, y las tres últimas letras nunca coincidían.
   Rellenar la lista con medio alto de pantalla las haría llegar —es lo que
   hace iOS— pero deja un vacío enorme que hay que scrollear.
   Con la lista en el tope, todas las secciones que faltan están a la vista, así
   que la respuesta honesta a «qué letra estoy mirando» es la que se pidió. */
let PEDIDA = null;
function alFondo(){
  const l = $('#cajLista');
  return l.scrollTop + l.clientHeight >= l.scrollHeight - 4;
}
function letraVisible(){
  const l = $('#cajLista');
  if (PEDIDA && alFondo() && LETRAS.indexOf(PEDIDA) >= 0) return PEDIDA;
  const y = l.getBoundingClientRect().top + 8;
  let act = LETRAS[0] || '';
  for (const L of LETRAS){
    if (ANCLA[L].getBoundingClientRect().top <= y) act = L; else break;
  }
  return act;
}
function marcaRiel(L){
  /* la letra ya no vive en una columna: se muestra en la burbuja mientras se
     arrastra, y lo único permanente es dónde quedó el pomo */
  $('#burbuja').textContent = L || '';
  ponPomo();
}
function vaALetra(L){
  const h = ANCLA[L];
  if (!h) return;
  const l = $('#cajLista');
  PEDIDA = L;
  l.scrollTop += h.getBoundingClientRect().top - l.getBoundingClientRect().top - 4;
  marcaRiel(L);
}

function aLaWeb(q){
  q = String(q || '').trim();
  if (!q) return;
  vibra(10);
  if (HAY_AND && AND.buscarWeb) AND.buscarWeb(q);
  else avisa(T('web', q));
}

/* ══════════ ABRIR, FIJAR, MENÚ ══════════ */
function abre(pkg){
  vibra(10);
  if (!HAY_AND){ avisa(T('sinPuente')); return; }
  if (!AND.abrir(pkg)) avisa('✕');
}
function fijado(p){ return INICIO.indexOf(p) >= 0 || DOCK.indexOf(p) >= 0; }
function alterna(p){
  const i = INICIO.indexOf(p);
  if (i >= 0){ INICIO.splice(i, 1); avisa(T('soltado')); }
  else { INICIO.push(p); avisa(T('fijado')); }
  guarda('inicio', INICIO); pintaInicio();
}
function abreMenu(pkg, y){
  MENU_PKG = pkg; vibra(18);
  const a = POR_PKG[pkg];
  $('#menuTit').textContent = a ? a.n : pkg;
  $('#mFijar').lastElementChild.textContent = fijado(pkg) ? T('soltar') : T('fijar');
  $('#mInfo').lastElementChild.textContent = T('info');
  $('#mBorrar').lastElementChild.textContent = T('borrar');
  const m = $('#menu');
  m.style.top = cl(y - 40, 60, innerHeight - 260) + 'px';
  m.classList.add('on'); $('#velo').classList.add('on');
}
function cierraMenu(){
  MENU_PKG = null;
  $('#menu').classList.remove('on'); $('#velo').classList.remove('on');
}

/* ══════════ EL CAJÓN ══════════ */
function verCajon(v){
  CAJON = !!v;
  $('#cajon').classList.toggle('on', CAJON);
  /* el fondo se acerca: es lo que hace que la hoja esmerilada se lea a hoja
     sobre algo y no a otra pantalla */
  fondoProfundo(CAJON);
  if (CAJON){
    $('#busca2').value = '';
    pintaCajon('');
    $('#cajLista').scrollTop = 0;
    marcaRiel(LETRAS[0] || '');
  } else {
    $('#busca2').blur(); $('#busca').blur();
    $('#cajLista').scrollTop = 0;
    mascotaBaila(false);
    $('#burbuja').classList.remove('on');
  }
}

/* ══════════ RELOJ Y BATERÍA ══════════ */
function dosD(n){ return n < 10 ? '0' + n : String(n); }
function pintaReloj(){
  const d = new Date();
  $('#hora').textContent = dosD(d.getHours()) + ':' + dosD(d.getMinutes());
  const t = TXT[LANG] || TXT.es;
  $('#fecha').innerHTML = t.dias[d.getDay()] + '<br>' + d.getDate() + ' ' + t.meses[d.getMonth()];
  $('#bIzq').textContent = dosD(d.getHours()) + ':' + dosD(d.getMinutes());
  /* ── EL SALUDO SALE DE LA HORA, NO DE UNA CONSTANTE ──
     Es lo único del widget que cambia de tono a lo largo del día, y es lo que
     hace que el escritorio se sienta puesto para este momento y no un reloj. */
  const h = d.getHours();
  const fr = h < 6 ? 'madrugada' : h < 13 ? 'manana' : h < 20 ? 'tarde' : 'noche';
  $('#wSaludo').textContent = T('s_' + fr);
}
function pintaBateria(){
  if (!HAY_AND || !AND.bateria) return;
  try { ponBateria(JSON.parse(AND.bateria())); } catch (e) {}
}

/* ── EL ARO DE BATERÍA ──
   El trazo de un círculo se recorta con `stroke-dashoffset`: la circunferencia
   de r=25 es 2πr = 157,08, así que el offset es lo que FALTA. Va aparte de
   `pintaBateria` para que la vista previa del navegador —que no tiene puente y
   por lo tanto no tiene batería— pueda llenarlo igual y se pueda mirar. */
const ARO_C = 2*Math.PI*25;
function ponBateria(b){
  const n = (b.n === undefined || b.n < 0) ? 100 : b.n;
  $('#batN').textContent = (b.c ? '\u26a1' : '') + n + '%';
  $('#wPct').textContent = n + '%';
  const f = $('#batLlena');
  f.style.width = n + '%';
  /* el color es información: rojo por debajo de 15 dice de una ojeada algo que
     el número solo no dice */
  const col = b.c ? '#8fe3ff' : n <= 15 ? '#ff8b93' : n <= 30 ? '#ffd36e' : '#b8f078';
  f.style.background = col;
  f.style.boxShadow = '0 0 6px ' + col;
  const arco = $('#wArco');
  arco.style.stroke = col;
  arco.style.strokeDashoffset = String(ARO_C*(1 - n/100));
}

/* ══════════ CARGA ══════════ */
function cargaApps(){
  let bruto = '[]';
  if (HAY_AND){ try { bruto = AND.apps(); } catch (e){ bruto = '[]'; } }
  else bruto = JSON.stringify(APPS_DEMO);
  try { APPS = JSON.parse(bruto) || []; } catch (e){ APPS = []; }
  /* ── EL ORDEN SE ORDENA ACÁ, AUNQUE EL PUENTE YA LO HAGA ──
     `Puente.apps()` ordena alfabético sin acentos, y el índice de letras DEPENDE
     de que la lista venga ordenada: si no, aparecen encabezados repetidos y
     `ANCLA[letra]` se queda con el último, así que tocar una letra salta a otro
     lado. Medido con la lista de la vista previa sin ordenar, el riel salió
     `T M C W S I T Y G M P M S N D X T A C R L R U A D` — veinticinco secciones
     para veintiocho apps. Un contrato repartido entre dos lenguajes se rompe el
     día que alguien toca uno de los dos; ordenar de este lado cuesta una línea
     y lo vuelve imposible. */
  APPS.sort((a, b) => norm(a.n) < norm(b.n) ? -1 : norm(a.n) > norm(b.n) ? 1 : 0);
  POR_PKG = {};
  for (const a of APPS) POR_PKG[a.p] = a;

  INICIO = (lee('inicio', null) || []).filter(p => POR_PKG[p]);
  DOCK = (lee('dock', null) || []).filter(p => POR_PKG[p]);

  /* ── LA PRIMERA VEZ SE SIEMBRA SÓLO EL DOCK ──
     El inicio va vacío a propósito: arriba está el widget, abajo el dock, y en
     el medio se ve el fondo. Todo lo demás vive en el cajón, que se abre con un
     gesto. Lo que sí se siembra son los cuatro del dock, porque un dock vacío
     la primera vez sí se lee a que el launcher no funcionó — y se eligen por lo
     que el sistema declara: teléfono, mensajes, cámara, navegador. */
  if (!DOCK.length && APPS.length){
    const busca = pats => APPS.find(a => pats.some(q => a.p.indexOf(q) >= 0));
    DOCK = [
      busca(['dialer', '.phone', 'contacts']),
      busca(['.mms', 'messaging', 'messages', 'whatsapp']),
      busca(['camera', 'gallery', 'photos']),
      busca(['chrome', 'browser', 'firefox'])
    ].filter(Boolean).map(a => a.p).slice(0, 4);
    if (DOCK.length < 4) DOCK = DOCK.concat(
      APPS.filter(a => DOCK.indexOf(a.p) < 0).slice(0, 4 - DOCK.length).map(a => a.p));
    guarda('dock', DOCK);
  }
}

/* ══════════ ENTRADA ══════════ */
function pkgDe(ev){
  const n = ev.target.closest ? ev.target.closest('.ap') : null;
  return n ? n.dataset.p : null;
}
function enganchaLista(el){
  let t0 = 0, largo = null, px = 0, py = 0, movio = false;
  el.addEventListener('pointerdown', e => {
    const p = pkgDe(e); if (!p) return;
    px = e.clientX; py = e.clientY; movio = false; t0 = performance.now();
    /* ── MANTENER ES UN TEMPORIZADOR, NO UN «pointerup» LARGO ──
       Esperando al soltar, el menú aparece recién cuando el dedo se levanta y se
       siente que no respondió. A los 460 ms sale con el dedo todavía puesto, que
       es lo que hace cualquier escritorio. */
    largo = setTimeout(() => { largo = null; movio = true; abreMenu(p, e.clientY); }, 460);
  });
  el.addEventListener('pointermove', e => {
    if (!largo) return;
    if (Math.hypot(e.clientX - px, e.clientY - py) > 12){ clearTimeout(largo); largo = null; movio = true; }
  });
  el.addEventListener('pointerup', e => {
    if (largo){ clearTimeout(largo); largo = null;
      const p = pkgDe(e);
      if (p && !movio && performance.now() - t0 < 460) abre(p);
    }
  });
  el.addEventListener('pointercancel', () => { if (largo){ clearTimeout(largo); largo = null; } });
}

/* páginas: arrastre horizontal con umbral, y el vertical no lo roba */
function enganchaPaginas(){
  const h = $('#hoja'), t = $('#tira');
  let x0 = 0, y0 = 0, act = false, eje = 0, w = 0;
  h.addEventListener('pointerdown', e => {
    x0 = e.clientX; y0 = e.clientY; act = true; eje = 0;
    w = h.getBoundingClientRect().width;
    t.style.transition = 'none';
  });
  h.addEventListener('pointermove', e => {
    if (!act) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!eje){
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) eje = 1;
      else if (Math.abs(dy) > 10) eje = 2;
      else return;
    }
    if (eje !== 1) return;
    const base = -PAG*(100/NPAG);
    /* resistencia en los extremos: sin ella la primera página se arrastra libre
       y parece que hay una más que no llega nunca */
    let d = dx;
    if ((PAG === 0 && dx > 0) || (PAG === NPAG - 1 && dx < 0)) d = dx*.32;
    t.style.transform = 'translateX(calc(' + base + '% + ' + d + 'px))';
  });
  const fin = e => {
    if (!act) return; act = false;
    t.style.transition = '';
    /* el gesto de subir lo maneja `enganchaSubir`, que también está sobre
       `#hoja`: acá sólo hay que devolver la página a su sitio */
    if (eje !== 1){ ponPagina(PAG); return; }
    const dx = e.clientX - x0;
    if (dx < -w*.22) ponPagina(PAG + 1);
    else if (dx > w*.22) ponPagina(PAG - 1);
    else ponPagina(PAG);
  };
  h.addEventListener('pointerup', fin);
  h.addEventListener('pointercancel', fin);
}

/* ── SUBIR ABRE EL CAJÓN, DESDE LOS TRES SITIOS DE ABAJO ──
   Un solo tirador de 120 px es un blanco chico y encima se pisaba con el dock.
   El gesto se registra en el escritorio y en el dock; el
   umbral de 55 px es lo que lo separa de un toque tembloroso, y el de 18 px en
   horizontal es lo que impide que un arrastre entre páginas lo dispare. */
function enganchaSubir(el){
  let y0 = 0, x0 = 0, act = false;
  el.addEventListener('pointerdown', e => { y0 = e.clientY; x0 = e.clientX; act = true; });
  el.addEventListener('pointermove', e => {
    if (!act || CAJON) return;
    if (Math.abs(e.clientX - x0) > 18){ act = false; return; }
    if (y0 - e.clientY > 55){ act = false; verCajon(true); vibra(10); }
  });
  const f = () => { act = false; };
  el.addEventListener('pointerup', f);
  el.addEventListener('pointercancel', f);
}

/* el cajón: se sube arrastrando desde abajo y se baja desde la manija */
function enganchaCajon(){
  const caj = $('#cajon');
  enganchaSubir($('#dock'));
  enganchaSubir($('#hoja'));

  /* ══════════ BAJAR ══════════
     ── POR QUÉ NO BAJABA, Y SON TRES COSAS ──
     1. El arrastre estaba sobre `#cajon`, pero el dedo cae sobre `#cajLista`,
        que tiene `touch-action:pan-y`: el navegador se queda con el gesto
        vertical y dispara `pointercancel` antes del umbral, así que el cierre
        no llegaba a correr NUNCA en un teléfono.
     2. Sólo arrastraba con la lista arriba de todo. Con veintiocho apps la
        lista scrollea, así que la mayor parte del tiempo no se podía cerrar.
     3. Y el arrastre escribía `style.transform` inline. `verCajon(false)` saca
        la clase `.on`, cuya regla dice `translateY(100%)` — pero el inline le
        gana por especificidad, así que el cajón se quedaba clavado donde estaba
        el dedo.
     El arreglo: el arrastre vive en la MANIJA, que lleva `touch-action:none`, y
     la posición va por una variable de CSS que la regla base ignora cuando el
     cajón está cerrado. */
  const man = $('#cajManija');
  let y0 = 0, tira = false;
  const pone = d => caj.style.setProperty('--caj-y', Math.max(0, d) + 'px');
  const suelta = () => { caj.classList.remove('tira'); caj.style.removeProperty('--caj-y'); };

  man.addEventListener('pointerdown', e => {
    y0 = e.clientY; tira = true;
    caj.classList.add('tira');
    try { man.setPointerCapture(e.pointerId); } catch (x) {}
  });
  man.addEventListener('pointermove', e => { if (tira) pone(e.clientY - y0); });
  const fin = e => {
    if (!tira) return;
    tira = false;
    const d = e.clientY - y0;
    suelta();
    /* 78 px o un tirón rápido: cerrar tiene que costar poco, porque el que
       arrastró para abajo ya dijo lo que quería */
    if (d > 78) verCajon(false);
  };
  man.addEventListener('pointerup', fin);
  man.addEventListener('pointercancel', fin);

  /* ── Y TAMBIÉN DESDE LA LISTA, CUANDO ESTÁ ARRIBA DE TODO ──
     Acá hace falta `touchmove` con `passive:false` y `preventDefault()`: con
     eventos de puntero el navegador ya reclamó el gesto y lo cancela. */
  const l = $('#cajLista');
  let ly = 0, larr = false;
  l.addEventListener('touchstart', e => {
    larr = l.scrollTop <= 0 && e.touches.length === 1;
    ly = larr ? e.touches[0].clientY : 0;
  }, { passive: true });
  l.addEventListener('touchmove', e => {
    if (!larr) return;
    const d = e.touches[0].clientY - ly;
    if (d <= 0){ larr = false; return; }
    e.preventDefault();
    caj.classList.add('tira'); pone(d);
  }, { passive: false });
  const lfin = e => {
    if (!larr) return;
    larr = false;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const d = t ? t.clientY - ly : 0;
    suelta();
    if (d > 78) verCajon(false);
  };
  l.addEventListener('touchend', lfin);
  l.addEventListener('touchcancel', lfin);

  /* la letra que se está mirando, mientras se baja por la lista */
  let pend = false;
  l.addEventListener('scroll', () => {
    if (pend || !LETRAS.length) return;
    pend = true;
    /* una vez por cuadro y no una por evento: `scroll` dispara docenas de veces
       por segundo y medir posiciones obliga al navegador a recalcular el layout */
    requestAnimationFrame(() => {
      pend = false;
      /* despegándose del fondo, la letra pedida deja de mandar */
      if (!alFondo()) PEDIDA = null;
      marcaRiel(letraVisible());
    });
  }, { passive: true });

  /* ══════════ LA BARRA DEL ÍNDICE ══════════
     ── LA POSICIÓN DEL DEDO ES UNA FRACCIÓN, NO UNA LETRA ──
     Con una columna de letras el dedo caía sobre una y se saltaba ahí. Con una
     barra lo que hay es una fracción del recorrido, así que se scrollea a esa
     fracción y la letra que aparece en la burbuja es la que quedó arriba —
     medida, no supuesta. Eso hace que arrastrar se sienta continuo en vez de
     saltar entre secciones, que es como se comporta la barra de Xiaomi. */
  const r = $('#riel'), bur = $('#burbuja');
  let rAct = false;
  const rVa = y => {
    const c = r.getBoundingClientRect();
    const k = cl((y - c.top - 10) / Math.max(1, c.height - 20), 0, 1);
    const l = $('#cajLista');
    l.scrollTop = k*Math.max(0, l.scrollHeight - l.clientHeight);
    PEDIDA = null;
    const L = letraVisible();
    if (bur.textContent !== L) vibra(6);
    bur.textContent = L;
    bur.style.top = Math.max(46, Math.min(innerHeight - 46, y)) + 'px';
    ponPomo();
  };
  r.addEventListener('pointerdown', e => {
    if (!LETRAS.length) return;
    rAct = true; r.classList.add('on'); bur.classList.add('on'); rVa(e.clientY);
    try { r.setPointerCapture(e.pointerId); } catch (x) {}
  });
  r.addEventListener('pointermove', e => { if (rAct) rVa(e.clientY); });
  const rFin = () => { rAct = false; r.classList.remove('on'); bur.classList.remove('on'); };
  r.addEventListener('pointerup', rFin);
  r.addEventListener('pointercancel', rFin);
}

/* ══════════ LA MASCOTA ══════════
   Baila mientras se escribe, se aburre y se duerme. Todas las animaciones salen
   de UNA tira y de la tabla `MASC_ANIM` que escribe el horneado. */

/* cuánto dura una vuelta de cada animación. Las de un solo cuadro no son una
   animación sino una pose: se colocan con un transform y no gastan nada. */
const MASC_SEG = { baila:.66, saluda:.78, duerme:2.8 };
/* los aburridos, con `quieto` repetido porque tiene que salir más seguido: una
   lista con pesos es más corta y más clara que una tabla de probabilidades */
const MASC_OCIO = ['quieto', 'mando', 'quieto', 'saluda', 'quieto'];

/* ── LOS `@keyframes` SE ARMAN, NO SE ESCRIBEN ──
   Cada animación recorre celdas de la tira, y `steps(c)` nunca llega al valor
   final: para que caiga en i, i+1 … i+c-1 el recorrido va de -i/N a -(i+c)/N del
   ANCHO DE LA TIRA. Escritos a mano, agregar un cuadro obliga a recalcular cinco
   porcentajes y el que se olvide muestra media mascota. */
function mascCSS(){
  const e = document.createElement('style');
  document.head.appendChild(e);
  const h = e.sheet;
  for (const n in MASC_ANIM){
    const a = MASC_ANIM[n];
    if (a[1] < 2) continue;
    h.insertRule('@keyframes m_' + n + '{from{transform:translateX(' +
      (-a[0]*100/MASC_N).toFixed(4) + '%)}to{transform:translateX(' +
      (-(a[0] + a[1])*100/MASC_N).toFixed(4) + '%)}}', h.cssRules.length);
  }
}

let MASC_T = 0, MASC_CICLO = 0, MASC_HOY = '', MASC_ULT = 0;

function mascPone(n){
  if (MASC_HOY === n || !MASC_ANIM[n]) return;
  MASC_HOY = n;
  const t = $('#mTira'), a = MASC_ANIM[n];
  if (a[1] > 1){
    t.style.transform = '';
    t.style.animation = 'm_' + n + ' ' + MASC_SEG[n] + 's steps(' + a[1] + ') infinite';
  } else {
    t.style.animation = 'none';
    t.style.transform = 'translateX(' + (-a[0]*100/MASC_N).toFixed(4) + '%)';
  }
  $('#mascota').classList.toggle('zzz', n === 'duerme');
}

/* ── SE ABURRE Y SE DUERME ──
   No es un adorno: la mascota está para acompañar la búsqueda, y algo que hace
   siempre lo mismo deja de acompañar a los diez segundos. Baila mientras se
   teclea, a los 2,2 s de silencio pasa a un ocio sorteado, y a los 7 se duerme
   con las zetas. */
function mascOcio(){
  clearTimeout(MASC_CICLO);
  if (Date.now() - MASC_ULT > 7000){
    mascPone('duerme');
    MASC_CICLO = setTimeout(mascOcio, 5000);
    return;
  }
  mascPone(MASC_OCIO[(Math.random()*MASC_OCIO.length)|0]);
  MASC_CICLO = setTimeout(mascOcio, 3400 + Math.random()*3000);
}

/* ── Y NO SE MUESTRA SI NO HAY LUGAR ──
   Vive pegada abajo del cajón; con una búsqueda que devuelve muchas apps la
   lista llega hasta ahí y la mascota queda ENCIMA de los resultados, que es lo
   único que en ese momento hay que poder leer. El hueco se mide, no se supone. */
function mascCabe(){
  const l = $('#cajLista');
  if (!l) return false;
  const n = l.children.length;
  if (!n) return true;
  /* ── SE MIDE EL ÚLTIMO HIJO, NO `scrollHeight` ──
     `#cajLista` es `flex:1 1 auto` dentro de un cuerpo que también lo es, así
     que SIEMPRE llena su caja: `scrollHeight` nunca baja de `clientHeight` y la
     comparación daba falso con dos resultados en pantalla. Lo que dice cuánto
     ocupa el contenido es dónde termina el último. */
  const u = l.children[n - 1].getBoundingClientRect();
  const c = l.getBoundingClientRect();
  return u.bottom <= c.bottom - MASC_H - 30;
}

function mascotaBaila(v){
  const m = $('#mascota');
  clearTimeout(MASC_T); clearTimeout(MASC_CICLO);
  if (v && mascCabe()){
    m.classList.add('on');
    MASC_ULT = Date.now();
    mascPone('baila');
    MASC_CICLO = setTimeout(mascOcio, 2200);
  } else {
    /* se despide en vez de desaparecer: un corte seco se lee a error */
    MASC_T = setTimeout(() => { m.classList.remove('on'); }, v ? 0 : 2400);
  }
}

/* ══════════ GANCHOS DEL SISTEMA ══════════
   Los llama la Activity. Sin ellos, volver al escritorio deja abierto lo que
   estuviera abierto tres apps atrás, que no es «conservar el estado». */
window.__alInicio = function(){ cierraMenu(); verCajon(false); $('#busca2').value = ''; ponPagina(0); };
window.__alVolver = function(){ pintaReloj(); pintaBateria(); CORRE = true; };
window.__atras = function(){
  if (MENU_PKG) cierraMenu();
  else if (CAJON) verCajon(false);
  else if (PAG > 0) ponPagina(0);
};
/* ── LOS INSETS HAY QUE PEDIRLOS, NO SÓLO ESPERARLOS ──
   `setOnApplyWindowInsetsListener` dispara cuando la vista se adjunta, que es
   ANTES de que `ui.html` termine de cargar: en ese momento `window.__insets` no
   existe todavía, el `evaluateJavascript` no encuentra nada y el valor de
   fábrica —24 px— se queda para siempre. Se vio en el teléfono del usuario: la
   barra de búsqueda del cajón terminaba pisada por los iconos de la barra de
   estado. El puente tiene el dato guardado desde el primer cuadro; lo único que
   faltaba era pedirlo al arrancar. */
function pideInsets(){
  if (!HAY_AND || !AND.insets) return;
  try {
    const p = String(AND.insets()).split(',');
    const t = parseInt(p[0], 10), b = parseInt(p[1], 10);
    if (isFinite(t) && isFinite(b)) window.__insets(t, b);
  } catch (e) {}
}

window.__insets = function(t, b){
  document.documentElement.style.setProperty('--ins-t', Math.max(t, 8) + 'px');
  document.documentElement.style.setProperty('--ins-b', Math.max(b, 8) + 'px');
  calculaFilas(); pintaInicio();
};

/* ══════════ ARRANQUE ══════════ */
function arranca(){
  $('#busca').placeholder = T('busca');
  $('#busca2').placeholder = T('busca');
  $('#cajTit').textContent = T('todas');

  fondoInit();
  vidrioInit();

  /* la tira de la mascota y su celda salen del horneado: escritas a mano acá,
     regenerar la hoja con otro tamaño la deja estirada sin que nada avise */
  const rz = document.documentElement.style;
  rz.setProperty('--masc', 'url(' + IMG_MASCOTA + ')');
  rz.setProperty('--mw-masc', MASC_W + 'px');
  rz.setProperty('--mh-masc', MASC_H + 'px');
  rz.setProperty('--masc-n', MASC_N);
  mascCSS();
  mascPone('quieto');

  pideInsets();
  cargaApps();
  pintaInicio(); pintaDock();
  pintaReloj(); pintaBateria();
  setInterval(pintaReloj, 1000);
  setInterval(pintaBateria, 30000);

  enganchaLista($('#tira'));
  enganchaLista($('#dock'));
  enganchaLista($('#cajLista'));
  enganchaPaginas();
  enganchaCajon();

  /* ── EL CAMPO DEL ESCRITORIO ES UN BOTÓN ──
     Es `readonly`, así que en un teléfono no levanta el teclado sobre un cuadro
     que el cajón va a tapar: abre el cajón y le pasa el foco al de adentro, que
     es el único que recibe letras. Los 90 ms son lo que tarda la hoja en
     empezar a subir: enfocando en el mismo cuadro, Android abre el teclado
     contra un elemento que todavía está fuera de la pantalla y no lo enfoca. */
  const abreBusca = () => { verCajon(true); setTimeout(() => $('#busca2').focus(), 90); };
  $('#buscaCaja').addEventListener('pointerdown', abreBusca);
  $('#busca').addEventListener('focus', abreBusca);

  $('#busca2').addEventListener('input', e => {
    if (!CAJON) verCajon(true);
    pintaCajon(e.target.value);
    mascotaBaila(e.target.value.length > 0);
  });
  $('#busca2').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim(); if (!q) return;
    const v = APPS.filter(a => norm(a.n).indexOf(norm(q)) >= 0);
    /* Enter abre la primera coincidencia; sólo si no hay ninguna sale a la web,
       porque buscar «what» y terminar en Google en vez de en WhatsApp es lo
       contrario de lo que uno quiso. Para ir a la web a propósito está la fila. */
    if (v.length) abre(v[0].p);
    else aLaWeb(q);
  });

  $('#velo').addEventListener('pointerdown', cierraMenu);
  $('#mFijar').addEventListener('click', () => { if (MENU_PKG) alterna(MENU_PKG); cierraMenu(); });
  $('#mInfo').addEventListener('click', () => { if (MENU_PKG && HAY_AND) AND.info(MENU_PKG); cierraMenu(); });
  $('#mBorrar').addEventListener('click', () => { if (MENU_PKG && HAY_AND) AND.borrar(MENU_PKG); cierraMenu(); });

  /* ── MANTENER EL FONDO ABRE LOS AJUSTES DEL ESCRITORIO ──
     Es el gesto de siempre y la única forma de volver a cambiar de launcher sin
     ir a buscar el ajuste a mano. Va sobre `#hoja` —el hueco entre el widget y
     el dock— y no sobre el fondo: el fondo está en `z-index 0`, debajo de la
     capa, así que nunca recibiría un dedo. */
  let fl = null;
  $('#hoja').addEventListener('pointerdown', () => {
    fl = setTimeout(() => { vibra(20); if (HAY_AND) AND.elegirInicio(); else avisa(T('inicio')); }, 620);
  });
  const fc = () => { if (fl){ clearTimeout(fl); fl = null; } };
  $('#hoja').addEventListener('pointerup', fc);
  $('#hoja').addEventListener('pointermove', fc);

  document.addEventListener('visibilitychange', () => { CORRE = !document.hidden; });
  addEventListener('resize', () => { calculaFilas(); pintaInicio(); });
  addEventListener('contextmenu', e => e.preventDefault());

  setTimeout(() => $('#carga').classList.add('off'), 260);
  setTimeout(() => { const c = $('#carga'); if (c && c.parentNode) c.parentNode.removeChild(c); }, 900);
}

/* ══════════════════════ EL PUENTE DE MENTIRA Y LAS SONDAS ══════════════════════
   Esto es lo último del módulo. Dos cosas:

   1. `APPS_DEMO` — la lista que usa `cargaApps()` cuando no hay `AND`, o sea en
      un navegador. Sin ella el escritorio abriría vacío y no habría forma de
      mirar la reja, el cajón ni el vidrio sin compilar el APK y tener el
      teléfono en la mano. Los nombres de paquete son los de verdad a propósito:
      la siembra de la primera vez busca «dialer», «camera», «chrome», así que
      con nombres inventados ese camino —que es el que ve alguien que acaba de
      instalar— nunca se probaría.

   2. `window.__A` — las sondas. Como en todos los juegos de este repo: nada de
      «se ve bien», números. `cajas()` mide solapamientos de verdad, `refr()`
      dice cuántos filtros de refracción se armaron y `estado()` devuelve el
      escritorio entero para poder afirmar qué se está mirando. */

const APPS_DEMO = [
  { p: 'com.android.dialer',        n: 'Teléfono',    s: 1 },
  { p: 'com.android.messaging',     n: 'Mensajes',    s: 1 },
  { p: 'com.android.camera2',       n: 'Cámara',      s: 1 },
  { p: 'com.android.chrome',        n: 'Chrome',      s: 0 },
  { p: 'com.whatsapp',              n: 'WhatsApp',    s: 0 },
  { p: 'com.spotify.music',         n: 'Spotify',     s: 0 },
  { p: 'com.instagram.android',     n: 'Instagram',   s: 0 },
  { p: 'com.zhiliaoapp.musically',  n: 'TikTok',      s: 0 },
  { p: 'com.google.android.youtube',n: 'YouTube',     s: 0 },
  { p: 'com.google.android.gm',     n: 'Gmail',       s: 0 },
  { p: 'com.google.android.apps.maps', n: 'Maps',     s: 0 },
  { p: 'com.android.vending',       n: 'Play Store',  s: 1 },
  { p: 'com.mercadolibre',          n: 'Mercado Libre', s: 0 },
  { p: 'com.mercadopago.wallet',    n: 'Mercado Pago',s: 0 },
  { p: 'ar.com.santander.rio.mbanking', n: 'Santander', s: 0 },
  { p: 'com.netflix.mediaclient',   n: 'Netflix',     s: 0 },
  { p: 'com.discord',               n: 'Discord',     s: 0 },
  { p: 'com.twitter.android',       n: 'X',           s: 0 },
  { p: 'org.telegram.messenger',    n: 'Telegram',    s: 0 },
  { p: 'com.android.settings',      n: 'Ajustes',     s: 1 },
  { p: 'com.android.calculator2',   n: 'Calculadora', s: 1 },
  { p: 'com.google.android.calendar', n: 'Calendario',s: 0 },
  { p: 'com.google.android.deskclock', n: 'Reloj',    s: 1 },
  { p: 'com.adobe.lrmobile',        n: 'Lightroom',   s: 0 },
  { p: 'com.rappi.customer',        n: 'Rappi',       s: 0 },
  { p: 'com.ubercab',               n: 'Uber',        s: 0 },
  { p: 'ai.rezona.aero',            n: 'Aero',        s: 0 },
  { p: 'com.duolingo',              n: 'Duolingo',    s: 0 }
];

window.__errs = [];
addEventListener('error', e => { window.__errs.push(String(e.message)); });
addEventListener('unhandledrejection', e => { window.__errs.push('rej:' + String(e.reason)); });

window.__A = {
  /* qué hay puesto ahora mismo */
  estado(){
    return { apps: APPS.length, inicio: INICIO.length, dock: DOCK.length,
             pag: PAG, npag: NPAG, filas: FILAS, cols: COLS,
             cajon: CAJON, menu: MENU_PKG, lang: LANG, puente: HAY_AND,
             hora: $('#hora') ? $('#hora').textContent : null,
             fecha: $('#fecha').textContent };
  },
  /* ── LOS FILTROS DE REFRACCIÓN SE CUENTAN ──
     `backdrop-filter:url(#…)` que apunta a un filtro que no se armó no falla:
     se ignora en silencio y el vidrio queda liso. La única forma de saber que
     el líquido está puesto es contar los <filter> y sus <feImage> con datos. */
  refr(){
    const el = $$('.refr');
    const f = Array.prototype.slice.call(document.querySelectorAll('#svgdefs filter'));
    return { elems: el.length, filtros: f.length,
             ids: f.map(x => x.id),
             mapas: f.map(x => { const i = x.querySelector('feImage');
                                 return i ? (i.getAttribute('href') || '').slice(0, 22) : null; }),
             soporta: CSS.supports('backdrop-filter', 'url(#x)') ||
                      CSS.supports('-webkit-backdrop-filter', 'url(#x)') };
  },
  /* solapamientos entre lo que está visible, medido con las cajas de verdad */
  cajas(){
    const sel = ['#reloj', '#buscaCaja', '#hoja', '#puntos', '#dock', '#bat'];
    const r = [];
    for (const s of sel){
      const e = $(s); if (!e) continue;
      const b = e.getBoundingClientRect();
      const cs = getComputedStyle(e);
      if (b.width < 2 || b.height < 2 || cs.display === 'none' || +cs.opacity < 0.05) continue;
      r.push({ s, x: Math.round(b.left), y: Math.round(b.top),
               w: Math.round(b.width), h: Math.round(b.height) });
    }
    const choques = [];
    for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++){
      const a = r[i], b = r[j];
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h)
        choques.push(a.s + ' × ' + b.s);
    }
    return { n: r.length, cajas: r, choques,
             fuera: r.filter(z => z.y + z.h > innerHeight + 1 || z.y < -1).map(z => z.s) };
  },
  /* ── EL FONDO YA NO CUESTA UN CUADRO, Y ESO SE MIDE ──
     Con el lienzo procedural había un `costo(n)` que promediaba milisegundos de
     dibujo. Ahora no hay nada que dibujar: lo que se puede comprobar es que la
     foto decodificó, que está puesta y que no quedó ni un lienzo vivo. */
  fondo(){
    const f = $('#fondo');
    const bg = getComputedStyle(f).backgroundImage;
    return { ok: FONDO_OK, puesta: f.classList.contains('ok'),
             hondo: f.classList.contains('hondo'),
             tieneFoto: bg.indexOf('data:image') >= 0,
             lienzos: document.querySelectorAll('canvas').length,
             bytes: IMG_FONDO.length, w: FONDO_W, h: FONDO_H };
  },
  /* el widget entero, que es lo único que hay arriba */
  widget(){
    return { hora: $('#hora').textContent, fecha: $('#fecha').textContent,
             pct: $('#wPct').textContent, saludo: $('#wSaludo').textContent,
             arco: +getComputedStyle($('#wArco')).strokeDashoffset.replace('px', '').trim(),
             color: getComputedStyle($('#wArco')).stroke };
  },
  bateria(n, c){ ponBateria({ n: n, c: !!c }); return this.widget(); },
  /* el riel de letras */
  riel(){
    const p = $('#rielPomo');
    return { letras: LETRAS,
             visto: $('#riel').style.display !== 'none',
             pomo: [p.style.top, p.style.height],
             burbuja: $('#burbuja').textContent,
             mirando: LETRAS.length ? letraVisible() : null,
             encabezados: $$('#cajLista .let').map(e => e.textContent) };
  },
  /* arrastrar la barra por el camino del dedo, no llamando a vaALetra */
  arrastraRiel(frac){
    const r = $('#riel'), c = r.getBoundingClientRect();
    const y = c.top + 10 + frac*(c.height - 20);
    const o = { bubbles: true, pointerId: 31, isPrimary: true, clientX: c.left + 15, clientY: y };
    r.dispatchEvent(new PointerEvent('pointerdown', o));
    r.dispatchEvent(new PointerEvent('pointermove', o));
    const q = this.riel();
    r.dispatchEvent(new PointerEvent('pointerup', o));
    return q;
  },
  letra(L){ vaALetra(L); return { marcada: L, top: $('#cajLista').scrollTop,
                                  mirando: letraVisible() }; },
  /* ── LA MASCOTA ──
     `x` es dónde quedó la tira: es el ÚNICO número que dice qué cuadro se está
     viendo. `anim` sola no alcanza — una pose de un cuadro no tiene animación y
     se colocaría con un transform que nadie estaría midiendo. */
  masc(){
    const m = $('#mascota'), t = $('#mTira');
    const cs = getComputedStyle(t);
    const mt = new DOMMatrixReadOnly(cs.transform);
    /* ── LA CELDA SE MIDE EN LAYOUT, NO EN PANTALLA ──
       Apagada, la mascota lleva `scale(.86)`, y `getBoundingClientRect` la
       aplica: la celda salía de 101 px en vez de 118 y la celda actual daba
       3,49 donde el transform de verdad decía 3,00. `offsetWidth` no pasa por
       ninguna transformación. */
    const cel = t.offsetWidth/MASC_N;
    return { on: m.classList.contains('on'), zzz: m.classList.contains('zzz'),
             hoy: MASC_HOY, cuadros: MASC_N, celda: [MASC_W, MASC_H],
             tira: cs.backgroundImage.indexOf('data:image') >= 0,
             anim: cs.animationName, dur: cs.animationDuration,
             pasos: cs.animationTimingFunction,
             celdaActual: cel ? +( -mt.m41/cel ).toFixed(2) : null,
             cabe: mascCabe(),
             zetas: $$('#mZ span').length };
  },
  /* fuerza una animación y devuelve dónde quedó la tira */
  mascVer(n){ mascPone(n); return this.masc(); },
  /* el ocio: se le corre el reloj hacia atrás para no esperar siete segundos */
  mascDormir(){ MASC_ULT = Date.now() - 9000; mascOcio(); return this.masc(); },
  mascAburrir(){ MASC_ULT = Date.now(); mascOcio(); return this.masc(); },
  /* abrir el cajón / una página / el menú por el mismo camino que el dedo */
  cajon(v){ verCajon(v !== false); return CAJON; },
  pagina(i){ ponPagina(i); return { pag: PAG, npag: NPAG }; },
  menu(p){ abreMenu(p, innerHeight*0.5); return MENU_PKG; },
  cierra(){ cierraMenu(); return MENU_PKG; },
  /* ── LA SONDA ESCRIBE POR EL CAMINO DEL DEDO ──
     Llamando a `pintaCajon` directo se saltea el escucha de `input`, que es
     quien hace bailar a la mascota: medido, `masc().on` daba false después de
     buscar y parecía que la mascota no andaba. Se despacha un `input` de
     verdad, que es lo que dispara el teclado. */
  buscar(q){
    verCajon(true);
    const i = $('#busca2');
    i.value = q;
    i.dispatchEvent(new Event('input', { bubbles: true }));
    return { n: $$('#cajLista .ap').length,
             nombres: $$('#cajLista .nom').map(e => e.textContent),
             web: $$('#cajLista .web').length,
             textoWeb: ($('#cajLista .web span:last-child') || {}).textContent || null };
  },
  insets(t, b){ window.__insets(t, b); return { filas: FILAS }; }
};

/* ── EL PUENTE DE MENTIRA NO PONE BATERÍA, ASÍ QUE LA PONE LA VISTA PREVIA ──
   `pintaBateria()` se rinde sin `AND` a propósito: inventar un porcentaje en el
   teléfono sería mentir. En el navegador, en cambio, dejar el pastillero en «—»
   esconde justamente el elemento que hay que mirar. */
if (!HAY_AND){
  addEventListener('DOMContentLoaded', () => {
    ponBateria({ n: 76, c: false });
    setTimeout(() => avisa(T('sinPuente')), 900);
  });
}

arranca();

</script>
