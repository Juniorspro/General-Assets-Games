<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#57b6ef">
<title>LEMI · la isla del camello</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1420;touch-action:none;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#eaf4ff;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{display:block}

/* ── EL ESCENARIO ──
   Todo el juego vive acá adentro. Con el teléfono en vertical se gira 90° y se
   le intercambian el ancho y el alto, así se juega apaisado sin pedirle a nadie
   que dé vuelta el aparato. La pantalla de carga queda AFUERA a propósito: se
   muestra antes de girar nada y hay que poder leerla como venga el teléfono. */
#escenario{position:fixed;left:0;top:0;width:100%;height:100%;
  transform-origin:top left;overflow:hidden}
body.girado #escenario{transform:rotate(90deg) translateY(-100%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── CARGA ── */
#carga{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 15%,#1d4a72 0%,#0d2338 55%,#081420 100%);
  transition:opacity .6s ease}
#carga.ido{opacity:0;pointer-events:none}
#carga .caja{text-align:center;width:min(360px,84vw)}
#carga h1{font-size:clamp(26px,7vw,40px);font-weight:200;letter-spacing:-.02em;
  background:linear-gradient(160deg,#fff 30%,#8fe3a0);-webkit-background-clip:text;
  background-clip:text;color:transparent}
#carga p{margin-top:8px;font-size:12.5px;color:rgba(234,244,255,.55);min-height:1.4em}
#carga .barra{margin-top:18px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#carga .barra i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#7ee3a0,#57b6ef);transition:width .25s}
#carga .pista{margin-top:12px;font-size:11.5px;color:rgba(234,244,255,.42);line-height:1.5}

/* ── IDIOMA ──
   VA ANTES DEL MENU Y NO ADENTRO. Elegir idioma dentro de un menu ya escrito en
   un idioma que no entendes no sirve: para cuando lo encontras ya leiste todo
   lo demas sin entenderlo. Los tres botones dicen el idioma EN SU PROPIO
   IDIOMA, que es lo unico que se lee igual sin saber cual esta puesto. */
/* VA AFUERA DE `#escenario` Y SIN GIRAR, igual que la pantalla de carga que
   viene justo antes. Probé meterla adentro para que girara con el menú y no se
   ve: `#escenario` lleva un `transform`, y un `transform` crea contexto de
   apilado, así que el z-index 95 de adentro NO le gana al 90 de `#carga`, que
   está afuera — la pantalla de idioma quedaba tapada por la barra de carga. Y
   de paso queda coherente: las dos pantallas previas se leen con el teléfono
   como uno lo agarra, y recién el menú pide darlo vuelta. */
#idioma{position:fixed;inset:0;z-index:95;display:none;place-items:center;
  background:radial-gradient(120% 90% at 50% 15%,#1d4a72 0%,#0d2338 55%,#081420 100%)}
#idioma.on{display:grid}
#idioma .caja{text-align:center;width:min(320px,80vw)}
#idioma h1{font-size:clamp(24px,6.5vw,36px);font-weight:200;letter-spacing:-.02em;
  background:linear-gradient(160deg,#fff 30%,#8fe3a0);-webkit-background-clip:text;
  background-clip:text;color:transparent;margin-bottom:4px}
#idioma .sub{font:600 10.5px/1.7 ui-monospace,monospace;letter-spacing:.22em;
  color:rgba(234,244,255,.42);text-transform:uppercase;margin-bottom:22px}
#idioma button{display:block;width:100%;margin-top:10px;padding:14px 18px;
  border-radius:99px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#eaf4ff;font:600 15px/1 system-ui,sans-serif;
  cursor:pointer;transition:transform .12s ease,background .2s ease}
#idioma button:active{transform:scale(.97)}
#idioma button.sel{background:linear-gradient(135deg,#7ee3a0,#57b6ef);color:#04121a;border:none}

/* ── LA VIÑETA ROJA ──
   Se pinta con `box-shadow` hacia adentro y no con un degradado radial de
   fondo: un `radial-gradient` a pantalla completa es una capa más que el
   navegador compone en cada cuadro, y esto es una sombra que ya sabe dibujar.
   Y VA PIXELADA: el juego entero se dibuja a un tercio de resolución, así que
   una viñeta suave sería lo ÚNICO nítido del cuadro y se leería como que está
   pegada encima. Los escalones salen de repetir la sombra en anillos. */
/* la viñeta roja de estar roto vive en el shader del post (uniforme `rojo`), no
   acá: hecha con box-shadow salía suave y continua encima de una imagen
   escalonada, o sea pegada arriba del juego. Se pidió PIXELADA. */

/* ── HUD ── */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#fps{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top,0px));
  font:600 10.5px/1.6 ui-monospace,Menlo,monospace;color:rgba(234,244,255,.5);
  text-shadow:0 1px 4px rgba(0,0,0,.8);letter-spacing:.04em}
#teclas{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding:10px 13px;border-radius:12px;background:rgba(8,18,28,.5);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font:600 11px/1.85 ui-monospace,Menlo,monospace;color:rgba(234,244,255,.62);display:none}
body.pc #teclas{display:block}
#teclas b{color:#eaf4ff}
/* ── arriba a la derecha, sólo lo que NO se usa jugando ── */
#botones{position:absolute;right:max(10px,2.5vw);top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;gap:7px;pointer-events:auto}
.bt{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(8,18,28,.42);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);font:800 15px/1 system-ui,sans-serif;opacity:.8}
.bt:active{transform:translateY(1px);filter:brightness(1.3)}

/* ── ACCIONES, abajo a la derecha y debajo del pulgar ──
   El botón de correr estaba arriba, del lado opuesto a la mano que juega: para
   apretarlo había que soltar la palanca. Todo lo que se usa en movimiento baja
   acá, en racimo, con el salto grande porque es el que más se aprieta. */
#acciones{position:absolute;right:max(16px,4vw);bottom:max(18px,5vh);
  display:grid;grid-template-columns:auto auto;gap:11px;align-items:end;
  justify-items:center;pointer-events:auto}
/* ── LOS BOTONES SON IMAGENES DE PIXEL ART ──
   Eran circulos de CSS con un caracter adentro («»», «⌄», «⌃», «✋»): un borde
   perfectamente redondo y un glifo del sistema —que ademas cambia de forma en
   cada telefono— encima de un juego dibujado a un tercio de resolucion. La
   chapa generada entra como `background-image` y `image-rendering: pixelated`
   la agranda sin suavizarla, asi que sus pixeles miden lo mismo que los del
   mundo. El rotulo de texto se queda: hay que poder traducirlo. */
.ac{border-radius:50%;display:grid;place-items:end center;color:#eaf4ff;
  background:rgba(10,20,30,.42) center/contain no-repeat;
  image-rendering:pixelated;
  border:1.6px solid rgba(255,255,255,.22);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font:800 9.5px/1 system-ui,sans-serif;letter-spacing:.06em;padding-bottom:5px;
  text-shadow:0 1px 4px rgba(0,0,0,.9);transition:transform .12s,filter .2s}
/* con la chapa puesta, el circulo y el vidrio de atras sobran */
.ac[style*="background-image"]{background-color:transparent;border-color:transparent;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.ac:active{transform:scale(.9);filter:brightness(1.35)}
.ac.on{filter:brightness(1.5) saturate(1.4)}
.ac.on:not([style*="background-image"]){background-color:rgba(126,227,160,.3);
  border-color:rgba(126,227,160,.75);color:#eafff2}
.ac .ico{font-size:20px;line-height:1;margin-bottom:1px}
/* con la imagen puesta, el glifo de texto sale sobrando */
.ac[style*="background-image"] .ico{display:none}
#acSalta{width:min(88px,19vw);aspect-ratio:1;grid-column:2;grid-row:1/3;
  background:rgba(126,227,160,.20);border-color:rgba(126,227,160,.5)}
#acSalta .ico{font-size:27px}
#acCorre{width:min(58px,13vw);aspect-ratio:1;grid-column:1;grid-row:1}
#acAgacha{width:min(58px,13vw);aspect-ratio:1;grid-column:1;grid-row:2}
body.pc #acciones{display:none}

/* ── MENÚ DE INICIO ──
   El fondo NO es una imagen: es la isla de verdad, filmada con un campo de
   visión de treinta grados. Con el teleobjetivo se aplasta la perspectiva, las
   copas se apilan unas sobre otras y el movimiento lento de la cámara se lee
   como una grúa de cine en vez de como un paseo. */
#menu{position:absolute;inset:0;z-index:44;display:none;place-items:center;
  background:linear-gradient(180deg,rgba(4,10,16,.30) 0%,rgba(4,10,16,.06) 38%,rgba(4,10,16,.72) 100%)}
#menu.on{display:grid}
#menu .mCaja{text-align:center;width:min(360px,84%)}
#menu .mEmb{position:relative;display:grid;place-items:center;margin-bottom:6px}
/* EL LOGO ES EL TÍTULO, no un emblema detrás de un título. Antes había una
   imagen al 78 % de opacidad y encima, superpuesta, la palabra escrita con la
   tipografía del sistema; eso significaba que el nombre del juego cambiaba de
   forma según el aparato —Roboto en Android, San Francisco en iPhone, Segoe en
   Windows— y que las dos cosas competían por el mismo espacio. Ahora el logo
   viene con la palabra adentro, va OPACO y ocupa el ancho que le corresponde a
   un título. Va en PNG con alfa: en JPG el fondo se ve como un cuadrado más
   claro flotando sobre el bosque por más que se lo mezcle.
   Y VA MEDIDO EN ALTO ADEMÁS DE EN ANCHO (`max-height` en vh): el menú tiene
   siete cosas apiladas y en un teléfono corto el título se come el aire de
   todas las demás. */
#menu .mEmb img{width:min(230px,58%);max-height:calc(var(--eh,100vh) * 0.155);object-fit:contain;
  filter:saturate(1.15) drop-shadow(0 6px 26px rgba(0,0,0,.6))}
/* EL NOMBRE VA DEBAJO DEL EMBLEMA Y NO ENCIMA. Antes iba superpuesto en
   absoluto sobre la imagen, y ahí las dos cosas se pelean el mismo espacio: la
   palabra le cae encima al dibujo y el dibujo le ensucia la palabra. Apilados,
   el solapamiento es imposible por construcción. */
#menu .mTit{font-weight:800;letter-spacing:.22em;text-indent:.22em;
  font-size:clamp(30px, calc(var(--eh,100vh) * 0.105), 54px);line-height:1;
  background:linear-gradient(168deg,#f4fff6 18%,#8fe3a0 52%,#f0c869);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,.75))}
#menu .mSub{font:600 10.5px/1.7 ui-monospace,monospace;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(234,244,255,.5);
  margin-bottom:min(24px, calc(var(--eh,100vh) * 0.028))}
#menu .mBtn{display:block;width:100%;border-radius:99px;
  padding:min(15px, calc(var(--eh,100vh) * 0.020)) 15px;
  margin-top:min(10px, calc(var(--eh,100vh) * 0.013));
  font-size:15px;font-weight:700;border:1px solid rgba(255,255,255,.17);
  color:rgba(234,244,255,.9);background:rgba(255,255,255,.06);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .16s}
#menu .mBtn:active{transform:scale(.97)}
#menu .mBtn.pri{background:linear-gradient(135deg,#7ee3a0,#57b6ef);color:#04121a;border:none;
  box-shadow:0 10px 30px rgba(87,182,239,.26)}
/* LAS MEDIDAS DEL MENÚ VAN TOPADAS EN vh ADEMÁS DE EN PÍXELES, y eso salió de
   una captura: con el escenario girado, un teléfono en vertical deja un marco
   de 412 píxeles de ALTO, y con las medidas fijas los siete elementos sumaban
   450 — el texto de la historia y el pie quedaban cortados por el borde de
   abajo. Con los topes, lo que se achica primero es el aire y no el texto. */
#menu .mHist{margin-top:min(18px, calc(var(--eh,100vh) * 0.022));
  font-size:clamp(10.5px, calc(var(--eh,100vh) * 0.029), 12.5px);
  line-height:1.5;color:rgba(234,244,255,.60);text-wrap:balance}
#menu .mPie{margin-top:min(10px, calc(var(--eh,100vh) * 0.013));font-size:10.5px;
  color:rgba(234,244,255,.34);line-height:1.4}

/* ── MENÚ DE PAUSA ── */
#pausa{position:absolute;inset:0;z-index:45;display:none;place-items:center;
  background:rgba(6,12,20,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#pausa.on{display:grid}
#pausa .caja{width:min(300px,80%);text-align:center}
#pausa h2{font-size:23px;font-weight:200;letter-spacing:.02em;margin-bottom:4px}
#pausa .sub{font:600 9.5px/1.6 ui-monospace,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(234,244,255,.34);margin-bottom:20px}
#pausa button{display:block;width:100%;padding:14px;border-radius:14px;margin-top:9px;
  font-size:14.5px;font-weight:600;border:1px solid rgba(255,255,255,.15);
  color:rgba(234,244,255,.9);background:rgba(255,255,255,.05)}
#pausa button:active{transform:scale(.98)}
#pausa button.pri{background:linear-gradient(135deg,#7ee3a0,#57b6ef);color:#04121a;border:none}
/* ── LAS MISIONES DEL DÍA ──
   El panel va ARRIBA A LA IZQUIERDA y no en el medio: es un renglón que hay que
   poder mirar de reojo mientras se camina, no un cartel que se lee y se cierra.
   Y el borde de color a la izquierda es lo que hace que se distinga del reloj y
   de los fps, que viven en la misma esquina. */
/* EL PANEL ES UNA HOJA DE PAPEL, y eso cambia el color del texto entero. Era
   una pildora de vidrio oscuro con letras claras, o sea la ficha de estado de
   cualquier aplicacion; ahora es un papel viejo con los bordes rotos —generado
   y horneado a 160 px, estirado con `image-rendering: pixelated`— y encima va
   tinta OSCURA, que es lo unico que se lee sobre papel. El borde de color se
   fue con el vidrio: sobre una hoja rota no hace falta un borde para
   distinguirla del reloj. */
#obj{position:absolute;left:10px;top:calc(28px + env(safe-area-inset-top,0px));
  max-width:min(290px,64%);min-width:180px;
  padding:16px 22px 24px 19px;
  background:var(--hoja) center/100% 100% no-repeat, rgba(228,214,182,.94);
  image-rendering:pixelated;
  color:#241d13;
  opacity:0;transition:opacity .4s;pointer-events:none;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.55))}
#obj.on{opacity:1}
#obj .n{font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.20em;
  color:rgba(60,42,20,.72);text-transform:uppercase}
#obj .t{font-size:13.5px;font-weight:700;line-height:1.32;margin-top:1px;color:#1d160d}
#obj .s{font-size:11px;line-height:1.4;color:rgba(52,38,20,.78);margin-top:2px}
#obj.hecho .n{color:#7a5a12}
#obj.hecho .t{text-decoration:line-through;opacity:.72}

/* la pista de acción: aparece sola cuando hay algo cerca */
#pista{position:absolute;left:50%;bottom:calc(18% + 10px);transform:translateX(-50%);
  padding:8px 15px;border-radius:99px;background:rgba(8,18,28,.66);
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);font:600 12.5px system-ui,sans-serif;
  letter-spacing:.03em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#pista.on{opacity:1}
#pista b{color:#7ee3a0}
/* el botón de usar entra en el racimo de acciones, arriba del salto */
#acUsar{width:min(58px,13vw);aspect-ratio:1;grid-column:1;grid-row:3;
  background:rgba(240,200,105,.18);border-color:rgba(240,200,105,.55)}
#acUsar.apagado{opacity:.28;pointer-events:none}

/* ── EL MINIJUEGO DEL INFLADOR ──
   Una barra, una línea que la recorre y un bloque verde. Va en DOM y no en el
   lienzo 3D a propósito: es una interfaz, tiene que verse nítida a cualquier
   densidad de pantalla y no le sirve de nada estar dentro del mundo. */
#mini{position:absolute;inset:0;z-index:47;display:none;place-items:center;
  background:rgba(6,12,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#mini.on{display:grid}
#mini .caja{width:min(430px,86%);text-align:center;pointer-events:auto}
#mini .tit{font-size:15px;font-weight:700;letter-spacing:.02em}
#mini .cnt{font:700 11px/1.6 ui-monospace,monospace;letter-spacing:.18em;
  color:rgba(126,227,160,.9);margin-top:3px}
#mini .barra{position:relative;height:52px;margin:16px 0 6px;border-radius:10px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);overflow:hidden}
#mini .cubo{position:absolute;top:6px;bottom:6px;border-radius:5px;
  background:linear-gradient(180deg,#8ff0a8,#4cc472);box-shadow:0 0 14px rgba(126,227,160,.5)}
#mini .linea{position:absolute;top:-1px;bottom:-1px;width:4px;border-radius:2px;
  background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9)}
#mini .aviso{height:1.5em;font-size:12.5px;font-weight:600;
  color:rgba(234,244,255,.75);margin-top:4px}
#mini .btn{display:block;width:100%;margin-top:12px;padding:16px;border-radius:99px;
  font-size:15px;font-weight:700;border:none;color:#04121a;
  background:linear-gradient(135deg,#7ee3a0,#57b6ef)}
#mini .btn:active{transform:scale(.97)}
#mini .pie{margin-top:9px;font-size:11px;color:rgba(234,244,255,.42)}

/* ── LA CINEMÁTICA DE APERTURA ──
   Dos barras negras, un renglón de texto abajo y un botón de saltear. Las
   barras no son un adorno: son lo que le dice al jugador «esto no se juega, se
   mira», y sin ellas los primeros segundos se leen como que el juego se trabó.
   Y CRECEN desde cero en medio segundo, porque apareciendo de golpe se leen a
   error de dibujo. */
#cine{position:absolute;inset:0;z-index:46;display:none;pointer-events:none}
#cine.on{display:block}
#cine .barra{position:absolute;left:0;right:0;height:0;background:#05080c;
  transition:height .5s ease}
#cine.abre .barra{height:11%}
#cine .barra.ar{top:0} #cine .barra.ab{bottom:0}
/* EL TEXTO VIVE DENTRO DE LA BARRA DE ABAJO y no encima de la imagen: sobre el
   pasto saturado de este juego un renglón blanco se pierde, y ponerle una caja
   propia sería una tercera franja. Adentro de la barra ya hay negro. */
#cine .txt{position:absolute;left:6%;right:6%;bottom:0;height:11%;
  display:grid;place-items:center;text-align:center;
  font-size:clamp(13px,2.6vw,19px);line-height:1.45;font-weight:500;
  color:#eaf4ff;text-shadow:0 2px 10px rgba(0,0,0,.9);
  opacity:0;transition:opacity .45s}
#cine .txt.ver{opacity:1}
#cine .saltar{position:absolute;right:max(12px,3vw);
  bottom:calc(11% + 12px);pointer-events:auto;
  padding:9px 16px;border-radius:99px;font:600 12px/1 system-ui,sans-serif;
  letter-spacing:.12em;color:rgba(234,244,255,.72);
  background:rgba(8,18,28,.55);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cine .saltar:active{transform:scale(.95)}
/* el fundido a negro entre escena y escena, y el de entrada al juego */
#cine .velo{position:absolute;inset:0;background:#05080c;opacity:0;
  transition:opacity .55s}
#cine .velo.ver{opacity:1}

#joy{position:absolute;left:max(14px,3.5vw);bottom:max(16px,5vh);width:min(148px,32vw);
  aspect-ratio:1;pointer-events:auto;opacity:.9;display:none}
body:not(.pc) #joy{display:block}
#joy canvas{width:100%;height:100%;display:block}

</style>
</head>
<body>

<div id="carga"><div class="caja">
  <h1>LEMI</h1>
  <p id="cTxt" data-i18n="cargando">Seeding the island…</p>
  <div class="barra"><i id="cBar"></i></div>
  <div class="pista" id="cPista"></div>
</div></div>

<div id="idioma"><div class="caja">
  <h1>LEMI</h1>
  <div class="sub">language · idioma · idioma</div>
  <button data-lang="en">English</button>
  <button data-lang="es">Español</button>
  <button data-lang="pt">Português</button>
</div></div>

<div id="escenario">
<div id="hud">
  <div id="fps"></div>
  <div id="botones">
    <button class="bt" id="bFull" title="Pantalla completa">⛶</button>
    <button class="bt" id="bPanel" title="Pausa">☰</button>
